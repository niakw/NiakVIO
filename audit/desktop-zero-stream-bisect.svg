    <text x="155" y="190" fill="#f9fafb" font-weight="700">Official repository</text>
    <text x="155" y="220" fill="#fca5a5">count = 0</text>

    <rect x="315" y="155" width="200" height="95" rx="16" fill="#1f2937" stroke="#6b7280"/>
