    <rect x="575" y="155" width="220" height="95" rx="16" fill="#1f2937" stroke="#f59e0b"/>
    <text x="685" y="190" fill="#f9fafb" font-weight="700">Desktop fetch binding</text>
    <text x="685" y="220" fill="#fde68a">instrument now: var fetch</text>

    <rect x="855" y="155" width="285" height="95" rx="16" fill="#1f2937" stroke="#60a5fa"/>
