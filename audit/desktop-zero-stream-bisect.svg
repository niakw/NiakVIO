    <path d="M255 202 H315" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M515 202 H575" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M795 202 H855" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
