name: Validate strict media identity upgrade

on:
  push:
    branches:
      - fix/strict-media-identity-20260813
    paths:
      - .github/triggers/strict-media-identity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair migration fixture quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/strict_identity_hls_upgrade_20260813.py')
          t=p.read_text(encoding='utf-8')
          start=t.index("insert = r'''# A syntactically valid HLS header")
          end=t.index("\nif needle not in text:", start)
          block=t[start:end]
          block=block.replace("insert = r'''", 'insert = r"""', 1)
          last=block.rfind("'''")
          if last < 0: raise SystemExit('HLS fixture closing quote not found')
          block=block[:last]+'"""'+block[last+3:]
          t=t[:start]+block+t[end:]

          start=t.index("identity_test.write_text(r'''#!/usr/bin/env python3")
          closing="\n''', encoding=\"utf-8\")"
          end=t.index(closing, start)
          block=t[start:end]
          block=block.replace("identity_test.write_text(r'''", 'identity_test.write_text(r"""', 1)
          t=t[:start]+block+'\n""", encoding="utf-8")'+t[end+len(closing):]
          p.write_text(t, encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/strict_identity_hls_upgrade_20260813.py
      - name: Apply generic HLS and identity upgrade
        run: python3 .github/scripts/strict_identity_hls_upgrade_20260813.py
      - name: Update sanitizer revision regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/stream_output_sanitizer_direct_normalization_test.py')
          t=p.read_text(encoding='utf-8')
          old='\"implementationVersion\":6'
          new='\"implementationVersion\":7'
          if t.count(old) != 1:
              raise SystemExit(f'expected one sanitizer revision fixture, found {t.count(old)}')
          p.write_text(t.replace(old,new,1), encoding='utf-8')
          PY
      - name: Remove one-shot migration files
        run: |
          rm -f .github/scripts/strict_identity_hls_upgrade_20260813.py
          rm -f .github/workflows/tmp-strict-media-identity.yml
          rm -f .github/triggers/strict-media-identity
      - name: Reapply published wrappers once
        run: python3 scripts/reapply_published_overrides.py
      - name: Require one-pass convergence before tests
        run: python3 scripts/reapply_published_overrides.py --check
      - name: Run complete regression suite
        run: npm test
      - name: Require post-test wrapper convergence
        run: python3 scripts/reapply_published_overrides.py --check
      - name: Refresh final release hashes
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
      - name: Commit exact candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)providers/**'
          git commit -m "fix: enforce strict HLS and media identity"
      - name: Re-test committed candidate
        run: |
          candidate=$(git rev-parse HEAD)
          git worktree add --detach ../candidate "$candidate"
          cd ../candidate
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/validate_release_integrity.py
          git diff --exit-code
      - name: Push validated branch
        run: git push origin HEAD:fix/strict-media-identity-20260813
