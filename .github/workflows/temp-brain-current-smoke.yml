name: TEMP Brain Current Smoke

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-brain-current-smoke.yml"]

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - name: Checkout current .44 with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', package-manager-cache: false }
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply current branch migrations needed by scheduled Brain discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_discovery_upstream_registry_v2.py
          python3 scripts/upgrade_weekly_upstream_report_registry_v2.py
      - name: Diagnose and rematerialize canonical ProviderBase store
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path.cwd(); sys.path.insert(0,str(root/'scripts'))
          import provider_base_store as bs
          manifest=json.loads((root/'manifest.json').read_text())
          provenance=json.loads((root/'PROVENANCE.json').read_text())
          expected=bs.build_clean_provider_seed('ignored')
          mismatches=[]
          for row in manifest.get('scrapers') or []:
              if not isinstance(row,dict): continue
              pid=bs.canonical_id(str(row.get('id') or ''))
              prow=(provenance.get('providers') or {}).get(pid) or {}
              rel=str(prow.get('base_filename') or '')
              path=root/rel
              if not path.is_file():
                  mismatches.append({'provider':pid,'state':'missing','path':rel})
                  continue
              raw=path.read_bytes()
              if raw!=expected:
                  first=next((i for i,(a,b) in enumerate(zip(raw,expected)) if a!=b),min(len(raw),len(expected)))
                  mismatches.append({'provider':pid,'state':'byte-drift','path':rel,'bytes':len(raw),'expectedBytes':len(expected),'firstDiff':first,'sha':hashlib.sha256(raw).hexdigest()[:16],'expectedSha':hashlib.sha256(expected).hexdigest()[:16]})
          print('FIELD_BRAIN_BASE_DRIFT '+json.dumps({'count':len(mismatches),'rows':mismatches[:20]},separators=(',',':'),sort_keys=True))
          PY
          python3 scripts/materialize_provider_base_v3_store.py
          python3 tests/provider_clean_reconstruction_contract_test.py
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(provider-bases/|PROVENANCE\.json$|scripts/provider_base_store\.py$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected files changed by ProviderBase rematerialization:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          echo "FIELD_BRAIN_BASE_REPAIR changed_files=$(git status --porcelain provider-bases PROVENANCE.json scripts/provider_base_store.py | wc -l) clean_contract=true"
      - name: Re-run the exact historical Brain preflight blocker set
        shell: bash
        run: |
          set -euo pipefail
          python tests/brain_cron_full_coverage_test.py
          python tests/daily_learning_coverage_test.py
          python tests/brain_self_architecture_test.py
          python tests/native_reader_provider_retention_policy_test.py
          python tests/native_reader_ownership_policy_test.py
          python tests/provider_clean_reconstruction_contract_test.py
          python -m py_compile \
            scripts/run_brain_learning_sandbox.py \
            scripts/run_brain_learning_queue.py \
            scripts/build_brain_repair_proposal.py \
            scripts/materialize_clean_provider_reconstruction.py \
            scripts/build_brain_architecture_proposal.py \
            scripts/build_native_reader_brain_repair.py \
            scripts/build_native_reader_learning_summary.py \
            scripts/merge_native_reader_learning_failures.py \
            scripts/classify_native_reader_ownership.py \
            scripts/report_new_upstream_providers.py \
            scripts/validate_daily_learning_coverage.py
          echo 'FIELD_BRAIN_CURRENT_PREFLIGHT clean_reconstruction=true provider_count=96 historical_anime_sama_blocker=cleared'
      - name: Exercise scheduled Brain isolated discovery stage read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          python scripts/normalize_provider_activation_overrides.py
          python scripts/discover_candidates.py --require-all-upstreams
          node engine_v2/scripts/validate-stage-against-catalog.mjs --catalog provider_catalog.json --stage staging/candidates.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/build_provider_runtime_profiles.py --stage staging --apply-stage
          python scripts/normalize_terminal_quarantine_stage.py --stage staging
          python scripts/validate_override_pipeline.py --stage staging
          git diff --exit-code -- provider_catalog.json manifest.json providers/ provider-overrides.json
          echo 'FIELD_BRAIN_CURRENT_STAGE discovery=true stage_valid=true canonical_mutation=false'
      - name: Commit generated clean ProviderBase source/store repair if green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider_base_store.py provider-bases/ PROVENANCE.json
          if git diff --cached --quiet; then
            echo 'FIELD_BRAIN_BASE_COMMIT changed=0'
            exit 0
          fi
          git commit -m 'fix(brain): restore canonical clean ProviderBase store'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin fix/labs-5.21.44-20260912
            git rebase origin/fix/labs-5.21.44-20260912
            if git push origin HEAD:fix/labs-5.21.44-20260912; then
              echo "FIELD_BRAIN_BASE_COMMIT changed=1 attempt=$attempt sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Upload branch-only smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-current-smoke-${{ github.run_id }}
          path: |
            staging/candidates.json
            staging/manifests/
          retention-days: 7
          if-no-files-found: warn
