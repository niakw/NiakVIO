name: TEMP - current trio full32 parity

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-current-trio-full32-parity.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_PARITY_WORKERS: '6'
  NIAKVIO_PARITY_TIMEOUT: '25'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Current unmodified branch parity across full reserve
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 \
            --workers 6 \
            --timeout 25 \
            --seed 20260913-current-trio \
            --out automation/current-trio-full32-parity.json \
            --provider animevostfr --provider kurage --provider voiranime
          python3 - <<'PY'
          import json
          d=json.load(open('automation/current-trio-full32-parity.json'))
          print('CURRENT_TRIO_COUNTS',d.get('statusCounts'))
          print('CURRENT_TRIO_REGRESSIONS',d.get('certainRegressions'))
          for row in d.get('providers') or []:
              print('CURRENT_TRIO_PROVIDER',row.get('providerId'),row.get('status'),[(x.get('lane'),x.get('status'),x.get('sampleCount')) for x in row.get('lanes') or []])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-trio-full32-parity-${{ github.run_id }}
          path: automation/current-trio-full32-parity.json
          retention-days: 14
          if-no-files-found: warn
