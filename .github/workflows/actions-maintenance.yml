name: NiakVIO Actions maintenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-maintenance.yml'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: niakvio-actions-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Announce maintenance run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Actions maintenance started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. It will stop obsolete active runs and prune the recent obsolete queue before the authoritative final hand-off."

      - name: Cancel obsolete active runs and prune recent obsolete history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          self="$GITHUB_RUN_ID"
          main_sha="$(gh api "repos/${repo}/branches/main" --jq '.commit.sha')"
          cancelled=0
          deleted=0
          kept_success=0

          mapfile -t active < <(
            gh api "repos/${repo}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | [.id,.name,.head_sha,.status] | @tsv'
          )
          for row in "${active[@]}"; do
            IFS=$'\t' read -r id name head status <<<"$row"
            [[ "$id" == "$self" ]] && continue
            if [[ "$name" == "NiakVIO Actions maintenance" ]]; then
              echo "FIELD_ACTIONS_MAINTENANCE keep-maintenance id=$id status=$status head=$head"
              continue
            fi
            echo "FIELD_ACTIONS_MAINTENANCE cancel id=$id status=$status head=$head name=$name"
            gh api --method POST "repos/${repo}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            cancelled=$((cancelled + 1))
          done

          sleep 5

          declare -A latest_success_seen=()
          mapfile -t completed < <(
            gh api "repos/${repo}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[] | [.id,.name,.head_sha,(.conclusion // ""),.created_at] | @tsv'
          )
          for row in "${completed[@]}"; do
            IFS=$'\t' read -r id name head conclusion created <<<"$row"
            [[ "$id" == "$self" ]] && continue

            if [[ "$conclusion" == "success" && "$head" == "$main_sha" ]]; then
              kept_success=$((kept_success + 1))
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              key="${name//[^A-Za-z0-9_]/_}"
              if [[ -z "${latest_success_seen[$key]+x}" ]]; then
                latest_success_seen[$key]=1
                kept_success=$((kept_success + 1))
                continue
              fi
            fi

            echo "FIELD_ACTIONS_MAINTENANCE delete id=$id conclusion=$conclusion head=$head name=$name"
            gh api --method DELETE "repos/${repo}/actions/runs/${id}" >/dev/null 2>&1 || true
            deleted=$((deleted + 1))
          done

          echo "FIELD_ACTIONS_MAINTENANCE_RESULT cancelled=$cancelled deleted=$deleted kept_success=$kept_success main=$main_sha self=$self"
          gh issue comment 69 --repo "$repo" --body "Actions maintenance completed in https://github.com/${repo}/actions/runs/${self}: cancelled=${cancelled}, deleted=${deleted}, retained_success_proofs=${kept_success}, main=${main_sha}. Recent obsolete runs are pruned and the queue is ready for final validation."

      - name: Dispatch authoritative final validation after clean queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Only the workflow generation that is still present on main may hand off.
          # A stale queued maintenance run must finish silently rather than launching
          # an authoritative proof before a newer cleanup generation executes.
          run_file_sha="$(gh api "repos/${repo}/contents/.github/workflows/actions-maintenance.yml?ref=${GITHUB_SHA}" --jq .sha)"
          main_file_sha="$(gh api "repos/${repo}/contents/.github/workflows/actions-maintenance.yml?ref=main" --jq .sha)"
          if [[ "$run_file_sha" != "$main_file_sha" ]]; then
            echo "FIELD_ACTIONS_MAINTENANCE_HANDOFF skipped=stale_generation run_file=$run_file_sha main_file=$main_file_sha"
            exit 0
          fi

          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run final-validation-orchestrator.yml --repo "$repo" --ref main
          final_id=""
          for _ in $(seq 1 60); do
            final_id="$(gh run list --repo "$repo" --workflow final-validation-orchestrator.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
            [[ -n "$final_id" ]] && break
            sleep 2
          done
          [[ -n "$final_id" ]] || { echo 'final validation dispatch was not captured' >&2; exit 1; }
          gh issue comment 69 --repo "$repo" --body "Clean Actions queue handed off to authoritative final validation: https://github.com/${repo}/actions/runs/${final_id}."
          echo "FIELD_ACTIONS_MAINTENANCE_HANDOFF final_run=$final_id"
