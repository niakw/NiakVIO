name: TEMP - PR188 Anime-Sama Fixed Point

on:
  push:
    branches:
      - fix/provider-census-state-machine-20260919
    paths:
      - '.github/workflows/temp-pr188-anime-sama-fixed-point.yml'
      - 'scripts/reconcile_targeted_provider_publication.py'

permissions:
  contents: write

concurrency:
  group: temp-pr188-anime-sama-fixed-point
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-census-state-machine-20260919
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Canonicalize Anime-Sama publication only
        run: |
          set -euo pipefail
          python scripts/reconcile_targeted_provider_publication.py --provider anime-sama
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_js_lego_ownership_test.py
          python tests/provider_animesamaco_domain_data_contract_test.py
          python tests/global_media_type_pre_network_gate_test.py
      - name: Enforce generated scope
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(["git","status","--short"],text=True).splitlines()
          touched=[row[3:] for row in rows if len(row)>=4]
          allowed_exact={
              "manifest.json",
              "provider-v3-materialization.json",
              "PROVENANCE.json",
              "vf/manifest.json",
              "no-anime/manifest.json",
              "vf-no-anime/manifest.json",
          }
          bad=[
              path for path in touched
              if path not in allowed_exact
              and not path.startswith("providers/anime-sama--")
          ]
          if bad:
              raise SystemExit(f"unexpected generated paths: {bad}")
          if not any(path.startswith("providers/anime-sama--") for path in touched):
              raise SystemExit("Anime-Sama fixed-point publication produced no provider-byte change")
          PY
      - name: Commit exact fixed-point bytes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix(anime-sama): canonicalize published fixed-point bytes"
          git push origin HEAD:fix/provider-census-state-machine-20260919
