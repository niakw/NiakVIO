name: Temporary migrate global aliases V2

on:
  push:
    branches:
      - agent/tv-regression-5.20.38

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply global TMDB IMDb V2 policy
        run: |
          python scripts/tmp_migrate_global_alias_v2.py
          python scripts/reapply_published_overrides.py
          python scripts/validate_published_overrides.py
      - name: Focused ID-first runtime proof
        run: |
          python tests/global_catalogue_alias_recovery_test.py
          python tests/global_provider_policy_test.py
      - name: Full repository regression suite
        run: npm test
      - name: Commit proven V2 policy
        run: |
          rm -f scripts/provider_patches/global_catalogue_alias_recovery_v1.py
          rm -f scripts/tmp_migrate_global_alias_v2.py
          rm -f .github/workflows/tmp-migrate-global-alias-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make catalogue fallback TMDB and IMDb first'
          git push origin HEAD:agent/tv-regression-5.20.38
