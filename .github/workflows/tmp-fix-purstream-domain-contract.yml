name: TMP Fix Purstream Domain Contract

on:
  push:
    branches:
      - hotfix/purstream-core-policy-final-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/purstream-core-policy-final-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Align Purstream official-site test with current domain authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/overrides_test.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert urlsplit(site).hostname == "purstream.ad", site\n'
          new = '    assert urlsplit(site).hostname == "purstream.mx", site\n'
          if text.count(old) != 1:
              raise SystemExit('Purstream official-site assertion anchor drifted')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tests/overrides_test.py
          python3 tests/core_media_policy_test.py
          python3 scripts/normalize_core_media_policy.py --check
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          git diff --check
          ! grep -q 'tmp-fix-purstream-domain-contract.yml' FILE-HASHES.json
          ! grep -q 'tmp-fix-purstream-domain-contract.yml' PATCH-SHA256SUMS.txt

      - name: Commit domain contract and clean hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add tests/overrides_test.py FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          git commit -m 'test(overrides): track current Purstream official site'
          git push origin HEAD:hotfix/purstream-core-policy-final-20260917
