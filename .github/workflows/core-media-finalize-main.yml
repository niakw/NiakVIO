name: CORE - Provider v3 Fixed-Point Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'provider_catalog.json'
      - 'provider-type-policy.json'
      - 'scripts/provider_patches/**'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/audit_provider_v3_static.py'
      - 'scripts/provider_base_store.py'
      - 'scripts/provider_patch_blocks.py'
      - 'scripts/provider_byte_stability.py'
      - 'tests/**'
      - 'automation/provider-v3-architecture.json'
      - '.github/workflows/core-media-finalize-main.yml'
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'scripts/provider_patches/**'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/audit_provider_v3_static.py'
      - '.github/workflows/core-media-finalize-main.yml'

permissions:
  contents: read

concurrency:
  group: provider-v3-fixed-point-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify architecture and raw-byte fixed point
        run: |
          set -euo pipefail
          python tests/provider_v3_workflow_ownership_test.py
          python scripts/provider_base_store.py validate
          python scripts/normalize_runtime_repository_dependencies.py --check
          python scripts/normalize_provider_rebuild_safety.py --check
          python scripts/normalize_core_fixed_point_contract.py --check
          python scripts/normalize_provider_branding_pipeline.py --check
          python scripts/normalize_core_media_policy.py --check
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_base_layering_contract_test.py
          python tests/provider_wrapper_isolation_test.py
          python tests/provider_byte_stability_contract_test.py
          python tests/provider_brick_portfolio_audit_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_identity_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python scripts/audit_provider_v3_static.py
      - name: Prove gate is read-only
        run: git diff --exit-code
