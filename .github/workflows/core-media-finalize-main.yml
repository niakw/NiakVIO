name: NiakVIO Core media finalizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-media-finalize-main.yml'
      - 'provider-overrides.json'
      - 'package.json'
      - 'package-lock.json'
      - 'automation/nuvio-client-upstreams.json'
      - 'scripts/normalize_core_media_policy.py'
      - 'scripts/apply_runtime_capability_upgrade_v4.py'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/build_provider_runtime_profiles.py'
      - 'scripts/reapply_published_overrides.py'
      - 'scripts/generate_language_manifests.py'
      - 'scripts/prune_unreferenced_providers.py'
      - 'scripts/sync_release_versions.py'
      - 'scripts/generate_release_hashes.py'
      - 'scripts/validate_release_integrity.py'
      - 'scripts/enforce_main_only_repository_policy.py'
      - 'scripts/provider_patches/native_sync_fetch_target_order_v1.py'
      - 'scripts/provider_patches/runtime_capability_media_safety_v4.py'
      - 'scripts/provider_patches/hls_runtime_integrity_v1.py'
      - 'scripts/provider_patches/hls_master_audio_preserver_v1.py'
      - 'scripts/provider_patches/hls_master_audio_preserver_impl_v1.py'
      - 'scripts/provider_patches/global_stream_presentation_v1.py'
      - 'scripts/provider_patches/global_stream_facts_v1.py'
      - 'scripts/provider_patches/global_media_enrichment_v1.py'
      - 'scripts/provider_patches/global_provider_security_hardening_v1.py'
      - 'scripts/provider_security_hardening.py'
      - 'scripts/provider_purification.py'
      - 'tests/core_media_policy_test.py'
      - 'tests/global_core_presentation_pipeline_test.py'
      - 'tests/native_sync_fetch_target_order_test.py'
      - 'tests/runtime_capability_media_safety_v4_test.py'
      - 'tests/global_playback_integrity_policy_test.py'
      - 'tests/global_stream_presentation_test.py'
      - 'tests/global_stream_presentation_pipeline_test.py'
      - 'tests/provider_specific_adapters_test.py'
      - 'tests/tv_provider_hardening_test.py'
      - 'tests/provider_security_hardening_test.py'
      - 'tests/provider_purification_contract_test.py'
      - 'tests/nuvio_client_upstream_drift_guard_test.py'
      - 'tests/badge_asset_contract_test.py'
      - 'tests/repository_hygiene_contract_test.py'

permissions:
  contents: write

concurrency:
  group: niakvio-core-media-finalize-main
  cancel-in-progress: true

jobs:
  finalize-main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Capture publication baseline
        shell: bash
        run: git show HEAD:manifest.json > "$RUNNER_TEMP/manifest-before.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked runtime dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Canonicalize generated Core security boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/apply_provider_overrides.py')
          text = source.read_text(encoding='utf-8')
          tuple_old = '''GENERATED_CORE_TAIL_MARKERS = (\n    "NUVIO_GLOBAL_STREAM_FACTS_V1",'''
          tuple_new = '''GENERATED_CORE_TAIL_MARKERS = (\n    "NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1",\n    "NUVIO_GLOBAL_STREAM_FACTS_V1",'''
          if '"NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1",\n    "NUVIO_GLOBAL_STREAM_FACTS_V1"' not in text:
              if tuple_old not in text:
                  raise SystemExit('unable to locate generated Core tail marker tuple')
              text = text.replace(tuple_old, tuple_new, 1)

          scan_old = '''    starts = [\n        index\n        for marker in GENERATED_CORE_TAIL_MARKERS\n        if (index := text.find(f"/* {marker}:")) >= 0\n    ]'''
          scan_new = '''    starts = []\n    for marker in GENERATED_CORE_TAIL_MARKERS:\n        needle = (\n            f"/* {marker} */"\n            if marker == "NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1"\n            else f"/* {marker}:"\n        )\n        index = text.find(needle)\n        if index >= 0:\n            starts.append(index)'''
          if scan_new not in text:
              if scan_old not in text:
                  raise SystemExit('unable to locate generated Core tail scanner')
              text = text.replace(scan_old, scan_new, 1)

          doc_old = '''    Facts, identity and presentation are generated artifacts owned by the Core\n    scheduler.'''
          doc_new = '''    Security, facts, identity and presentation are generated artifacts owned by the Core\n    scheduler.'''
          if doc_old in text:
              text = text.replace(doc_old, doc_new, 1)
          source.write_text(text, encoding='utf-8')

          test = Path('tests/global_playback_integrity_policy_test.py')
          test_text = test.read_text(encoding='utf-8')
          marker = '# Security is itself a generated Core boundary and must be rebuilt, not retained as provider source.'
          if marker not in test_text:
              anchor = '# The complete discovery transform must be byte-idempotent. Stable output bytes\n'
              if anchor not in test_text:
                  raise SystemExit('unable to locate playback fixed-point test anchor')
              block = '''# Security is itself a generated Core boundary and must be rebuilt, not retained as provider source.\nboundary_input = "provider-source\\n/* NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1 */\\n/* NUVIO_GLOBAL_STREAM_FACTS_V1:old */\\nstale-tail"\nboundary_prefix, boundary_removed = module._strip_generated_core_tail(boundary_input)\nassert boundary_removed is True\nassert boundary_prefix == "provider-source"\n\n'''
              test_text = test_text.replace(anchor, block + anchor, 1)
              test.write_text(test_text, encoding='utf-8')
          PY

      - name: Normalize Core media architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_core_media_policy.py --apply
          python scripts/apply_runtime_capability_upgrade_v4.py
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/manifest-before.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs \
            --general manifest.json \
            --vf vf/manifest.json \
            --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general manifest.json \
            --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/manifest-before.json"
          python scripts/prune_unreferenced_providers.py

      - name: Verify Core and native media contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_core_media_policy.py --check
          python scripts/enforce_main_only_repository_policy.py --check
          python tests/core_media_policy_test.py
          python tests/global_core_presentation_pipeline_test.py
          python tests/native_sync_fetch_target_order_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/provider_specific_adapters_test.py
          python tests/tv_provider_hardening_test.py
          python tests/provider_security_hardening_test.py
          python tests/provider_purification_contract_test.py
          python tests/nuvio_client_upstream_drift_guard_test.py
          python tests/badge_asset_contract_test.py
          python tests/repository_hygiene_contract_test.py
          if ! python scripts/reapply_published_overrides.py --check; then
            cp manifest.json "$RUNNER_TEMP/manifest-before-reapply-check.json"
            cp vf/manifest.json "$RUNNER_TEMP/vf-before-reapply-check.json"
            cp PROVENANCE.json "$RUNNER_TEMP/provenance-before-reapply-check.json"
            python scripts/reapply_published_overrides.py
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          before = load(root / 'manifest-before-reapply-check.json')
          after = load('manifest.json')
          b = {str(row.get('id','')).casefold(): row for row in before.get('scrapers',[]) if isinstance(row,dict)}
          a = {str(row.get('id','')).casefold(): row for row in after.get('scrapers',[]) if isinstance(row,dict)}
          print('FIELD_REAPPLY_DIAGNOSTIC_MANIFEST')
          for provider_id in sorted(set(b) | set(a)):
              if b.get(provider_id) != a.get(provider_id):
                  old = b.get(provider_id) or {}
                  new = a.get(provider_id) or {}
                  keys = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
                  print(provider_id, 'keys=' + ','.join(keys), 'old_file=' + str(old.get('filename')), 'new_file=' + str(new.get('filename')), 'old_version=' + str(old.get('version')), 'new_version=' + str(new.get('version')))
          pb = load(root / 'provenance-before-reapply-check.json').get('providers', {})
          pa = load('PROVENANCE.json').get('providers', {})
          print('FIELD_REAPPLY_DIAGNOSTIC_PROVENANCE')
          for provider_id in sorted(set(pb) | set(pa)):
              if pb.get(provider_id) != pa.get(provider_id):
                  old = pb.get(provider_id) or {}
                  new = pa.get(provider_id) or {}
                  keys = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
                  print(provider_id, 'keys=' + ','.join(keys), 'old_file=' + str(old.get('published_filename')), 'new_file=' + str(new.get('published_filename')))
          PY
            echo 'FIELD_REAPPLY_DIAGNOSTIC_STATUS'
            git status --short | sed -n '1,300p'
            exit 1
          fi
          node engine_v2/tests/provider-catalog.test.mjs

      - name: Validate complete repository suite
        shell: bash
        run: npm test

      - name: Rebuild release integrity inventories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Publish exact finalized tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Core media policy already fully materialized on main.'
          else
            git commit -m 'chore: materialize global Core media policy'
            git fetch origin main
            git rebase origin/main
            python scripts/generate_release_hashes.py
            python scripts/validate_release_integrity.py
            git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push origin HEAD:main
          fi

      - name: Verify exact resulting main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/normalize_core_media_policy.py --check
          python scripts/enforce_main_only_repository_policy.py --check
          python tests/core_media_policy_test.py
          python tests/global_core_presentation_pipeline_test.py
          python tests/native_sync_fetch_target_order_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/provider_security_hardening_test.py
          python tests/provider_purification_contract_test.py
          python tests/repository_hygiene_contract_test.py
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_release_integrity.py
          node engine_v2/tests/provider-catalog.test.mjs
          git diff --exit-code
