name: NiakVIO Core media finalizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-media-finalize-main.yml'
      - 'provider-overrides.json'
      - 'package.json'
      - 'package-lock.json'
      - 'automation/nuvio-client-upstreams.json'
      - 'assets/providers/emojis.json'
      - 'engine_v2/src/provider-branding.mjs'
      - 'engine_v2/scripts/bootstrap-provider-catalog.mjs'
      - 'engine_v2/tests/provider-catalog.test.mjs'
      - 'scripts/normalize_core_fixed_point_contract.py'
      - 'scripts/normalize_provider_rebuild_safety.py'
      - 'scripts/normalize_provider_branding_pipeline.py'
      - 'scripts/core_rebuild_safety.py'
      - 'scripts/normalize_core_media_policy.py'
      - 'scripts/apply_runtime_capability_upgrade_v4.py'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/provider_engine_normalizer.py'
      - 'scripts/build_provider_runtime_profiles.py'
      - 'scripts/reapply_published_overrides.py'
      - 'scripts/generate_language_manifests.py'
      - 'scripts/prune_unreferenced_providers.py'
      - 'scripts/sync_release_versions.py'
      - 'scripts/generate_release_hashes.py'
      - 'scripts/validate_release_integrity.py'
      - 'scripts/enforce_main_only_repository_policy.py'
      - 'scripts/provider_patches/native_sync_fetch_target_order_v1.py'
      - 'scripts/provider_patches/runtime_capability_media_safety_v4.py'
      - 'scripts/provider_patches/hls_runtime_integrity_v1.py'
      - 'scripts/provider_patches/hls_master_audio_preserver_v1.py'
      - 'scripts/provider_patches/hls_master_audio_preserver_impl_v1.py'
      - 'scripts/provider_patches/stream_output_sanitizer_v5.py'
      - 'scripts/provider_patches/stream_output_sanitizer_v6.py'
      - 'scripts/provider_patches/global_stream_presentation_v1.py'
      - 'scripts/provider_patches/global_stream_facts_v1.py'
      - 'scripts/provider_patches/global_media_enrichment_v1.py'
      - 'scripts/provider_patches/global_provider_security_hardening_v1.py'
      - 'scripts/provider_patches/global_provider_branding_v1.py'
      - 'scripts/provider_security_hardening.py'
      - 'scripts/provider_purification.py'
      - 'tests/core_media_policy_test.py'
      - 'tests/provider_branding_contract_test.py'
      - 'tests/global_core_presentation_pipeline_test.py'
      - 'tests/native_sync_fetch_target_order_test.py'
      - 'tests/runtime_capability_media_safety_v4_test.py'
      - 'tests/global_playback_integrity_policy_test.py'
      - 'tests/global_stream_presentation_test.py'
      - 'tests/global_stream_presentation_pipeline_test.py'
      - 'tests/provider_specific_adapters_test.py'
      - 'tests/provider_wrapper_isolation_test.py'
      - 'tests/stream_output_sanitizer_fail_closed_test.py'
      - 'tests/tv_provider_hardening_test.py'
      - 'tests/provider_security_hardening_test.py'
      - 'tests/provider_purification_contract_test.py'
      - 'tests/nuvio_client_upstream_drift_guard_test.py'
      - 'tests/badge_asset_contract_test.py'
      - 'tests/repository_hygiene_contract_test.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-core-media-finalize-main
  cancel-in-progress: true

jobs:
  finalize-main:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Announce exact Core run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Core finalizer started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Durable fixed-point normalization + final Terser + complete repository suite."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Capture publication baseline
        shell: bash
        run: git show HEAD:manifest.json > "$RUNNER_TEMP/manifest-before.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Normalize durable Core fixed-point contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_provider_rebuild_safety.py --apply
          python scripts/normalize_core_fixed_point_contract.py --apply
          python -m py_compile \
            scripts/normalize_provider_rebuild_safety.py \
            scripts/normalize_provider_branding_pipeline.py \
            scripts/core_rebuild_safety.py \
            scripts/normalize_core_fixed_point_contract.py \
            scripts/normalize_core_media_policy.py \
            scripts/apply_provider_overrides.py \
            scripts/provider_engine_normalizer.py \
            scripts/reapply_published_overrides.py \
            scripts/provider_patches/global_provider_branding_v1.py \
            scripts/provider_patches/stream_output_sanitizer_v6.py
          python tests/provider_wrapper_isolation_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/provider_purification_contract_test.py
          python scripts/normalize_provider_rebuild_safety.py --check
          python scripts/normalize_core_fixed_point_contract.py --check
          python scripts/normalize_provider_branding_pipeline.py --check

      - name: Normalize Core media architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_core_media_policy.py --apply
          python scripts/apply_runtime_capability_upgrade_v4.py
          python scripts/build_provider_runtime_profiles.py
          # Published artifacts may arrive from several historical Core revisions.
          # Rebuild until the generic pipeline reaches a true byte/reference fixed
          # point instead of assuming an arbitrary number of passes.
          converged=0
          for pass in 1 2 3 4 5 6; do
            echo "FIELD_PROVIDER_REBUILD_CONVERGENCE pass=${pass}"
            python scripts/reapply_published_overrides.py
            if python scripts/reapply_published_overrides.py --check; then
              converged=1
              echo "FIELD_PROVIDER_REBUILD_CONVERGENCE converged_at=${pass}"
              break
            fi
          done
          if [[ "$converged" -ne 1 ]]; then
            echo 'provider publication failed to converge within 6 passes' >&2
            exit 1
          fi
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          python scripts/prune_unreferenced_providers.py

      - name: Verify Core and native media contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_provider_rebuild_safety.py --check
          python scripts/normalize_core_fixed_point_contract.py --check
          python scripts/normalize_provider_branding_pipeline.py --check
          python scripts/normalize_core_media_policy.py --check
          python scripts/enforce_main_only_repository_policy.py --check
          python tests/core_media_policy_test.py
          python tests/provider_branding_contract_test.py
          python tests/global_core_presentation_pipeline_test.py
          python tests/native_sync_fetch_target_order_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/provider_specific_adapters_test.py
          python tests/provider_wrapper_isolation_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/tv_provider_hardening_test.py
          python tests/provider_security_hardening_test.py
          python tests/provider_purification_contract_test.py
          python tests/nuvio_client_upstream_drift_guard_test.py
          python tests/badge_asset_contract_test.py
          python tests/repository_hygiene_contract_test.py
          python scripts/reapply_published_overrides.py --check
          node engine_v2/tests/provider-catalog.test.mjs

      - name: Prove every published provider is final Terser fixed-point
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.provider_purification import TERSER_VERSION, purify_bytes

          root = Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          checked = 0
          for row in manifest.get('scrapers') or []:
              if not isinstance(row, dict):
                  continue
              relative = str(row.get('filename') or '')
              if not relative.startswith('providers/'):
                  continue
              path = root / relative
              data = path.read_bytes()
              chosen, report = purify_bytes(data)
              if chosen != data:
                  raise SystemExit(
                      f"published provider is not final Terser fixed-point: "
                      f"{row.get('id')} {relative} bytes_saved={report.get('bytesSaved')}"
                  )
              checked += 1
          if checked < 1:
              raise SystemExit('no published provider was checked')
          print(
              f'FIELD_FINAL_TERSER_FIXED_POINT providers={checked} '
              f'tool=terser version={TERSER_VERSION} mangle=false'
          )
          PY

      - name: Validate complete repository suite
        run: npm test

      - name: Rebuild release integrity inventories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Publish exact finalized tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Core media policy already fully materialized on main.'
          else
            git commit -m 'chore: materialize global Core media policy'
            git fetch origin main
            git rebase origin/main
            python scripts/generate_release_hashes.py
            python scripts/validate_release_integrity.py
            git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push origin HEAD:main
          fi

      - name: Verify exact resulting main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/normalize_provider_rebuild_safety.py --check
          python scripts/normalize_core_fixed_point_contract.py --check
          python scripts/normalize_provider_branding_pipeline.py --check
          python scripts/normalize_core_media_policy.py --check
          python scripts/enforce_main_only_repository_policy.py --check
          python tests/core_media_policy_test.py
          python tests/provider_branding_contract_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/provider_wrapper_isolation_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/provider_security_hardening_test.py
          python tests/provider_purification_contract_test.py
          python tests/nuvio_client_upstream_drift_guard_test.py
          python tests/badge_asset_contract_test.py
          python tests/repository_hygiene_contract_test.py
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_release_integrity.py
          node engine_v2/tests/provider-catalog.test.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.provider_purification import TERSER_VERSION, purify_bytes
          root = Path('.')
          rows = json.loads((root / 'manifest.json').read_text(encoding='utf-8')).get('scrapers') or []
          checked = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              relative = str(row.get('filename') or '')
              if not relative.startswith('providers/'):
                  continue
              data = (root / relative).read_bytes()
              chosen, report = purify_bytes(data)
              if chosen != data:
                  raise SystemExit(f'post-publish provider not Terser fixed-point: {row.get("id")}')
              checked += 1
          print(f'FIELD_POST_PUBLISH_TERSER_FIXED_POINT providers={checked} version={TERSER_VERSION}')
          PY
          git diff --exit-code

      - name: Report Core success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Core finalizer succeeded: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Final main ${SHA}; fixed-point + Terser 5.50.0 + repository suite passed."

      - name: Report Core failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Core finalizer FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. #69 remains open."
