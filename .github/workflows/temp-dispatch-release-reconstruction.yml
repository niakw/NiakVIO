name: TEMP - Dispatch Release Reconstruction
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-dispatch-release-reconstruction.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/stable-46-20260912
          fetch-depth: 1
      - name: Validate workflow ownership contract
        run: python tests/provider_v3_workflow_ownership_test.py
      - name: Validate finalizer upgrader is idempotent on current owner
        run: python scripts/upgrade_provider_v3_finalization_v1.py
      - name: Dispatch exact official reconstruction workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run provider-v3-reconstruct-all.yml \
            --ref release/stable-46-20260912 \
            -f commit_reconstruction=true
          echo 'RELEASE_RECONSTRUCTION_DISPATCHED=true'
# rerun after durable disabled-provider audit separation ce33d6d3
