name: SHORT - Non-Display Suspect Current Parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero10-current-parity-short.yml'
      - 'tests/provider_upstream_parity_v3_test.py'
      - 'scripts/run_provider_upstream_parity_v3.py'
      - 'scripts/current_provider_scope.py'
      - 'automation/evidence/hub-lab-matrix-46.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-nondisplay-suspect-current-parity
  cancel-in-progress: true

jobs:
  suspect-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_PARITY_SAMPLES_PER_LANE: '3'
      NIAKVIO_PARITY_WORKERS: '6'
      NIAKVIO_PARITY_TIMEOUT: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install declared provider parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove current worker can resolve parser packages
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('cheerio/slim'); require('crypto-js'); console.log('SUSPECT_SWEEP_MODULE_RESOLUTION_OK')"
          node tests/provider_worker_security.test.cjs
      - name: Build current non-display suspect scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={
            '4khdhub','allanime','allwish','animesalt','flemmix','moviebox','moviesmod','showbox',
            'vidfast','vidlove','wookafr','coflix','neko-sama','sekai','voiranime','voiranime-rip',
            'animesama-co','animevostfr'
          }
          src=json.loads(Path('automation/evidence/hub-lab-matrix-46.json').read_text(encoding='utf-8'))
          rows=[r for r in src.get('rows',[]) if str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') in wanted]
          got={str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') for r in rows}
          missing=sorted(wanted-got)
          if missing: raise SystemExit('suspect scope missing: '+','.join(missing))
          out={'schemaVersion':src.get('schemaVersion',1),'hubCount':len(rows),'providerCount':len(rows),'rows':rows}
          Path('/tmp/non-display-suspect-scope.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print('NON_DISPLAY_SUSPECT_SCOPE '+','.join(sorted(got)))
          PY
      - name: Run current deep parity for non-display suspects
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 -m py_compile scripts/run_provider_upstream_parity_v2.py scripts/run_provider_upstream_parity_v3.py
          python3 tests/provider_upstream_parity_v3_test.py
          python3 scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix /tmp/non-display-suspect-scope.json \
            --out automation/non-display-suspect-current-parity.json
      - name: Print nominative suspect verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/non-display-suspect-current-parity.json')
          if not p.is_file():
            print('NON_DISPLAY_SUSPECT_REPORT_MISSING')
            raise SystemExit(0)
          d=json.loads(p.read_text(encoding='utf-8'))
          print('NON_DISPLAY_SUSPECT_STATUS_COUNTS '+json.dumps(d.get('statusCounts') or {},sort_keys=True))
          for row in sorted(d.get('providers') or [],key=lambda x:x.get('providerId','')):
            lanes=[]
            for lane in row.get('lanes') or []:
              samples=[]
              for s in lane.get('samples') or []:
                samples.append({
                  'fixture':s.get('fixture') or s.get('slug') or s.get('tmdbId'),
                  'classification':s.get('confirmationClassification') or s.get('classification'),
                  'niakvioStreams':((s.get('niakvio') or {}).get('stream_count')),
                  'upstreamStreams':((s.get('upstream') or {}).get('stream_count')),
                })
              lanes.append({'lane':lane.get('lane'),'status':lane.get('status'),'samples':samples})
            print('NON_DISPLAY_SUSPECT_PROVIDER '+json.dumps({'providerId':row.get('providerId'),'status':row.get('status'),'lanes':lanes},sort_keys=True))
          PY
      - name: Upload non-display suspect evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: non-display-suspect-current-parity-${{ github.run_id }}
          path: automation/non-display-suspect-current-parity.json
          if-no-files-found: warn
          retention-days: 14
