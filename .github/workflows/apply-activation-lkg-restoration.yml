name: Apply activation LKG inconclusive restoration once

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/apply-activation-lkg-restoration"

permissions:
  contents: write

concurrency:
  group: activation-lkg-restoration-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply deterministic promoter migration
        run: python scripts/repair_activation_lkg_inconclusive.py

      - name: Validate focused preservation contracts
        run: |
          python -m py_compile scripts/promote_candidates.py
          python tests/ci_preservation_policy_test.py
          python tests/published_overrides_test.py

      - name: Run complete repository regression suite
        run: npm test

      - name: Commit only validated durable changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_candidates.py tests/ci_preservation_policy_test.py
          git rm scripts/repair_activation_lkg_inconclusive.py \
            .github/workflows/apply-activation-lkg-restoration.yml \
            .github/triggers/apply-activation-lkg-restoration
          git commit -m "fix: restore activation LKG on inconclusive CI"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
