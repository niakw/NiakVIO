name: TEMP - Fix Semantic Fixture Fallbacks
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-fix-semantic-fixture-fallbacks.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/stable-46-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Add semantic fallback fixture pools
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate_provider_v3_routes_sequential.py')
          text = validator.read_text(encoding='utf-8')
          marker = '# PROVIDER_V3_SEMANTIC_FIXTURE_FALLBACKS_V1'
          if marker not in text:
              anchor = 'DEFAULT_MIN_COVERAGE = 0.75  # diagnostic compatibility only; type gate is always 100%.\n'
              addition = '''DEFAULT_MIN_COVERAGE = 0.75  # diagnostic compatibility only; type gate is always 100%.\n# PROVIDER_V3_SEMANTIC_FIXTURE_FALLBACKS_V1\n# A declared lane is a provider capability, not a promise that one particular\n# title is in catalogue today. Targeted fixtures stay first; these independent\n# fallbacks are attempted only while the semantic type is still unproved.\nSEMANTIC_FIXTURE_FALLBACKS = {\n    "movie": ("interstellar", "sinners-2025", "mon-ninja-et-moi-3", "colony-2021"),\n    "tv": ("breaking-bad-s01e01", "revenant-s01e01"),\n    "anime": (\n        "jujutsu-kaisen-s01e01",\n        "mushoku-tensei-s01e01",\n        "failure-frame-s01e01",\n        "hell-teacher-nube-2025-s01e01",\n    ),\n}\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('fallback constant anchor mismatch')
              text = text.replace(anchor, addition, 1)

              old = '''        for media_type in supported:\n            # A provider-targeted fixture is stronger than the generic fallback.\n            # In particular, anime-specialized providers use an anime feature film\n            # for canonical movie proof instead of being forced through Interstellar.\n            if any(existing["semantic_type"] == media_type for existing in selected):\n                continue\n            slug = REPRESENTATIVE[media_type]\n            row = by_slug.get(slug)\n            if row is not None and all(existing["slug"] != slug for existing in selected):\n                selected.append(row)\n\n        for row in fixtures:\n'''
              new = '''        for media_type in supported:\n            # Provider-targeted fixtures stay first. If none exists, keep the\n            # canonical representative first for backward-compatible ordering.\n            if not any(existing["semantic_type"] == media_type for existing in selected):\n                slug = REPRESENTATIVE[media_type]\n                row = by_slug.get(slug)\n                if row is not None and all(existing["slug"] != slug for existing in selected):\n                    selected.append(row)\n\n            # Then append independent catalogue fallbacks. The runner skips them\n            # once this semantic type has current-run proof, so healthy providers\n            # do not pay extra traffic. A missing title therefore cannot alone\n            # classify an entire declared lane as broken.\n            for slug in SEMANTIC_FIXTURE_FALLBACKS.get(media_type, ()):\n                row = by_slug.get(slug)\n                if row is not None and all(existing["slug"] != slug for existing in selected):\n                    selected.append(row)\n\n        for row in fixtures:\n'''
              if text.count(old) != 1:
                  raise SystemExit(f'build queue fallback anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8')

          recon = Path('scripts/reconstruct_provider_v3_sequential_live.py')
          text = recon.read_text(encoding='utf-8')
          if 'FIELD_PROVIDER_FIXTURE_SKIPPED_TYPE_ALREADY_PROVED' not in text:
              old = '''    for task_index, task in enumerate(provider["tasks"], start=1):\n        if is_qualified(evaluation):\n            break\n        used_tasks.append(copy.deepcopy(task))\n        semantic_type = str(task.get("semantic_type") or "").strip().casefold()\n        for attempt in range(1, LIVE_PROBE_ATTEMPTS + 1):\n'''
              new = '''    for task_index, task in enumerate(provider["tasks"], start=1):\n        if is_qualified(evaluation):\n            break\n        semantic_type = str(task.get("semantic_type") or "").strip().casefold()\n        already_validated = {\n            str(value or "").strip().casefold() for value in evaluation.get("validatedTypes") or []\n        }\n        if semantic_type in already_validated:\n            print(\n                "FIELD_PROVIDER_FIXTURE_SKIPPED_TYPE_ALREADY_PROVED "\n                f"provider={provider['provider_id']} fixture={task.get('fixture_slug')} "\n                f"semantic_type={semantic_type}",\n                flush=True,\n            )\n            continue\n        used_tasks.append(copy.deepcopy(task))\n        for attempt in range(1, LIVE_PROBE_ATTEMPTS + 1):\n'''
              if text.count(old) != 1:
                  raise SystemExit(f'runner semantic skip anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          recon.write_text(text, encoding='utf-8')

          test = Path('tests/provider_v3_sequential_reconstruction_contract_test.py')
          source = test.read_text(encoding='utf-8')
          if 'SEMANTIC_FIXTURE_FALLBACKS' not in source:
              anchor = 'assert "runtime_recovered_types" in source\n'
              addition = '''assert "runtime_recovered_types" in source\nassert "FIELD_PROVIDER_FIXTURE_SKIPPED_TYPE_ALREADY_PROVED" in source\nfrom validate_provider_v3_routes_sequential import build_provider_queue, SEMANTIC_FIXTURE_FALLBACKS\nassert len(SEMANTIC_FIXTURE_FALLBACKS["movie"]) >= 4\nqueue_rows, queue_count = build_provider_queue()\nassert queue_count == 96\ndesiflix = next(row for row in queue_rows if row["provider_id"] == "desiflix")\ndesiflix_movies = [task["fixture_slug"] for task in desiflix["tasks"] if task["semantic_type"] == "movie"]\nassert "interstellar" in desiflix_movies\nassert len(desiflix_movies) >= 4, desiflix_movies\n'''
              if source.count(anchor) != 1:
                  raise SystemExit('fallback contract test anchor mismatch')
              source = source.replace(anchor, addition, 1)
          test.write_text(source, encoding='utf-8')
          PY
      - name: Validate fixture fallback contract
        run: |
          python -m py_compile scripts/validate_provider_v3_routes_sequential.py scripts/reconstruct_provider_v3_sequential_live.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/active_provider_live_coverage_test.py
          git diff --check
      - name: Commit fixture fallback architecture
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_provider_v3_routes_sequential.py scripts/reconstruct_provider_v3_sequential_live.py tests/provider_v3_sequential_reconstruction_contract_test.py
          git diff --cached --quiet && { echo 'No durable changes'; exit 1; }
          git commit -m 'fix(reconstruct): diversify semantic live proof fixtures'
          git push origin HEAD:release/stable-46-20260912
