name: Diagnose targeted VF provider routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/targeted-provider-route-diagnostics.yml"
      - ".github/triggers/targeted-provider-route-diagnostics"

permissions:
  contents: write

concurrency:
  group: targeted-vf-provider-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Inspect exact provider routes and call contexts
        run: |
          python scripts/targeted_provider_route_diagnostics.py
          python scripts/extract_targeted_route_contexts.py

      - name: Publish diagnostic reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/targeted-provider-routes.json automation/targeted-provider-contexts.json
          git commit -m "diag: record targeted VF provider call contexts" || exit 0
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
