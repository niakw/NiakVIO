name: TMP - PR122 Route Restore Batch

on:
  pull_request:
    branches:
      - tmp/pr122-route-restore-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        provider:
          - allanime
          - allwish
          - flemmix
          - moviebox
          - vidfast
          - vidlove
          - wookafr
          - yflix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Route-survival + syntax preflight
        run: |
          set -euo pipefail
          python3 tests/pr122_route_authority_survival_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 -m py_compile scripts/materialize_provider_v3_one.py scripts/certify_provider_playable_lanes.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Materialize one provider from current authority
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 scripts/materialize_provider_v3_one.py "$PROVIDER" | tee "health-output/${PROVIDER}-materialize.log"

      - name: Certify restored provider
        id: certify
        continue-on-error: true
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -o pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider "$PROVIDER" \
            --candidate-limit 6 \
            --timeout 25 \
            --workers 1 \
            --seed "pr122-route-restore-${GITHUB_RUN_ID}-${PROVIDER}" \
            --output "health-output/${PROVIDER}-cert.json" \
            2>&1 | tee "health-output/${PROVIDER}-cert.log"

      - name: Summarize provider
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          provider=os.environ["PROVIDER"]
          p=Path("health-output")/f"{provider}-cert.json"
          if not p.exists():
              print("FIELD_PR122_RESTORE_RESULT",provider,"missing_cert=true")
              raise SystemExit(0)
          data=json.loads(p.read_text())
          rows=data.get("providers") or []
          row=rows[0] if rows else {}
          lanes=row.get("lanes") or {}
          green=[k for k,v in lanes.items() if (v or {}).get("state")=="certified"]
          stages=sorted({
              str(a.get("debugStage") or "")
              for v in lanes.values()
              for a in (v or {}).get("attempts") or []
              if a.get("debugStage")
          })
          hosts=sorted({
              str(n.get("host") or "")
              for v in lanes.values()
              for a in (v or {}).get("attempts") or []
              for n in a.get("networkTrace") or []
              if n.get("host")
          })
          print("FIELD_PR122_RESTORE_RESULT",provider,
                "green="+(",".join(green) or "-"),
                "full="+str(bool(row.get("certified"))).lower(),
                "stages="+("|".join(stages) or "-"),
                "hosts="+("|".join(hosts) or "-"))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr122-route-restore-${{ matrix.provider }}-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
