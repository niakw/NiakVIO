name: MAIN - TV Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-tv-runtime-repair.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-main-tv-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply shared runtime and prune migrations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_tv_runtime_regressions_v1.py
          python scripts/upgrade_provider_prune_batch_history_v1.py
          python -m py_compile \
            scripts/provider_patches/global_media_type_resolution_v1.py \
            scripts/provider_patches/global_stream_facts_v1.py \
            scripts/provider_patches/stream_output_sanitizer_v5.py \
            scripts/prune_unreferenced_providers.py
      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_latest_request_cancellation_test.py
          python tests/stream_quality_recovery_tv_test.py
          python tests/provider_prune_batch_history_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/stream_output_sanitizer_direct_normalization_test.py
      - name: Commit proven Core repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f \
            .github/workflows/main-tv-runtime-repair.yml \
            scripts/upgrade_tv_runtime_regressions_v1.py \
            scripts/upgrade_provider_prune_batch_history_v1.py
          git add \
            scripts/provider_patches/global_media_type_resolution_v1.py \
            scripts/provider_patches/global_stream_facts_v1.py \
            scripts/provider_patches/stream_output_sanitizer_v5.py \
            scripts/prune_unreferenced_providers.py \
            tests/provider_latest_request_cancellation_test.py \
            tests/stream_quality_recovery_tv_test.py \
            tests/provider_prune_batch_history_test.py
          git commit -m 'fix(core): cancel stale provider work and recover stream quality'
          git push origin HEAD:main
