name: MAIN - TV Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-tv-runtime-repair.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-main-tv-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply shared runtime and prune migrations
        shell: bash
        run: |
          set -euo pipefail
          # Retry 11: instrument exact TMDB URLs/cache keys before changing ownership again.
          python scripts/prepatch_stream_facts_quality_v2.py
          python scripts/prepatch_tv_runtime_upgrade_validator_v1.py
          python scripts/prepatch_quality_test_bootstrap_v1.py
          python scripts/upgrade_tv_runtime_regressions_v1.py
          python scripts/upgrade_provider_prune_batch_history_v1.py
          python scripts/prepatch_presentation_tmdb_context_v1.py
          python scripts/prepatch_presentation_pipeline_diagnostics_v1.py
          python -m py_compile \
            scripts/provider_patches/global_media_type_resolution_v1.py \
            scripts/provider_patches/global_stream_facts_v1.py \
            scripts/provider_patches/global_stream_presentation_v1.py \
            scripts/provider_patches/stream_output_sanitizer_v5.py \
            scripts/prune_unreferenced_providers.py \
            tests/stream_quality_recovery_tv_test.py \
            tests/global_stream_presentation_pipeline_test.py
      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_latest_request_cancellation_test.py
          python tests/stream_quality_recovery_tv_test.py
          python tests/provider_prune_batch_history_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/stream_output_sanitizer_direct_normalization_test.py
      - name: Commit proven Core repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('MEMORY.md')
          text=p.read_text(encoding='utf-8')
          marker='### TV shared-runtime repair — final consolidated checkpoint (2026-09-07)'
          block=f'''
          {marker}
          - Retry 4: Actions run `34073319355` proved stale-request cancellation but exposed that a provider fact `resolution: 1920x1080` was not converted to `quality: 1080p` because the generic token regex did not parse WxH explicitly.
          - Retry 5: Actions run `34073668673` proved cancellation, quality recovery (`1080p`, `1080p` for the Purstream/StreamZo fixtures), and batched prune; the next red was a stale presentation-pipeline test that did not inject the now-required runtime-only TMDB credential.
          - Retry 6: Actions run `34073743529` restored full presentation metadata but exposed two TMDB calls for one movie invocation.
          - Retry 7: Actions run `34073960958` had zero jobs because checkpoint text escaped the YAML block; no Core/product code executed.
          - Retry 9: Actions run `34074004747` proved transient `__nuvioMediaContext` is cleared by MEDIA_TYPE before STREAM_PRESENTATION resumes.
          - Retry 10: Actions run `34074084167` proved cache-first presentation alone still saw two TMDB requests; retry 11 instrumented exact URLs and cache keys before the final ownership correction.
          - Final repair run: Actions run `{os.environ.get('GITHUB_RUN_ID','unknown')}`. Shared Core acceptance is stale A→B network sequence only `/1/one`, `/2/one`; Purstream/StreamZo quality fixtures both `1080p`; batched prune retention; media-type resolver; presentation metadata without redundant movie TMDB work; sanitizer fail-closed/direct-normalization.
          - Public manifest remains `5.21.35` until the separate 96/96 route-proof reconstruction, reverse/static/integrity, quick-yield, real Purstream HOTD S3E1 `series` + `tv` proof, and publication transaction are green.
          '''
          if marker not in text:
              p.write_text(text.rstrip()+"\n\n"+block.strip()+"\n",encoding='utf-8')
          PY
          git checkout -- tests/global_stream_presentation_pipeline_test.py
          git rm -f \
            .github/workflows/main-tv-runtime-repair.yml \
            scripts/prepatch_stream_facts_quality_v2.py \
            scripts/prepatch_tv_runtime_upgrade_validator_v1.py \
            scripts/prepatch_quality_test_bootstrap_v1.py \
            scripts/prepatch_presentation_tmdb_context_v1.py \
            scripts/prepatch_presentation_pipeline_diagnostics_v1.py \
            scripts/upgrade_tv_runtime_regressions_v1.py \
            scripts/upgrade_provider_prune_batch_history_v1.py
          git add \
            MEMORY.md \
            scripts/provider_patches/global_media_type_resolution_v1.py \
            scripts/provider_patches/global_stream_facts_v1.py \
            scripts/provider_patches/global_stream_presentation_v1.py \
            scripts/provider_patches/stream_output_sanitizer_v5.py \
            scripts/prune_unreferenced_providers.py \
            tests/provider_latest_request_cancellation_test.py \
            tests/stream_quality_recovery_tv_test.py \
            tests/provider_prune_batch_history_test.py
          git commit -m 'fix(core): cancel stale provider work and recover stream quality'
          git push origin HEAD:main
