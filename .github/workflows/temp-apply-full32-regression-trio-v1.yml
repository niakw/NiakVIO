name: TEMP - apply full32 regression trio v1

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-apply-full32-regression-trio-v1.yml

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_PARITY_WORKERS: '6'
  NIAKVIO_PARITY_TIMEOUT: '25'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate new Lego source and apply DATA migration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/provider_patches/animevostfr_runtime_v1.py \
            scripts/provider_patches/kurage_runtime_v1.py \
            scripts/upgrade_full32_regression_trio_runtime_v1.py
          python3 scripts/upgrade_full32_regression_trio_runtime_v1.py
          python3 scripts/materialize_provider_v3_one.py animevostfr
          python3 scripts/materialize_provider_v3_one.py kurage
          python3 scripts/materialize_provider_v3_one.py voiranime
          python3 scripts/generate_language_manifests.py
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/global_stream_output_guard_test.py

      - name: Exact full32 cases plus Kurage positive control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          catalog=p.local_catalog()
          cases=[
            ('animevostfr',{'slug':'superman-2025','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025},True),
            ('animevostfr',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014},True),
            ('kurage',{'slug':'high-school-of-the-dead-2010-s01e01','tmdbId':'56998','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'High School of the Dead','year':2010},False),
            ('kurage',{'slug':'jujutsu-kaisen-2020-s01e01','tmdbId':'95479','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Jujutsu Kaisen','year':2020},False),
            ('voiranime',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014},True),
          ]
          results=[]
          for pid,f,required in cases:
            r=p.run_worker(catalog[pid]['path'],f,40)
            row={'provider':pid,'fixture':f['slug'],'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'error':r.get('error_class'),'hosts':r.get('provider_server_hosts'),'statuses':r.get('provider_server_http_statuses') or r.get('http_statuses')}
            results.append(row); print('TRIO_EXACT '+json.dumps(row,ensure_ascii=False))
            if required and row['streams']<=0: raise SystemExit(f"required exact proof failed: {pid}:{f['slug']}")
          kurage=max(r['streams'] for r in results if r['provider']=='kurage')
          if kurage<=0: raise SystemExit('Kurage runtime produced no positive proof on HOTD or JJK')
          Path('automation/full32-regression-trio-exact-v1.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Adaptive parity must remove all three certain regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 \
            --workers 6 \
            --timeout 25 \
            --seed 20260913-trio-v1 \
            --out automation/provider-upstream-parity-trio-v1.json \
            --provider animevostfr --provider kurage --provider voiranime
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-upstream-parity-trio-v1.json').read_text())
          print('TRIO_PARITY_COUNTS',d.get('statusCounts'))
          print('TRIO_PARITY_REGRESSIONS',d.get('certainRegressions'))
          if d.get('certainRegressions'): raise SystemExit('remaining certain regression: '+','.join(d['certainRegressions']))
          PY

      - name: Structural non-minifier guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/provider_v3_strategy_plan_contract_test.py
          python3 tests/provider_v3_static_knowledge_contract_test.py
          python3 tests/recent_global_lab_corpus_policy_test.py
          python3 tests/native_adaptive_catalog_contract_test.py
          python3 tests/native_hub46_transport_manifest_test.py

      - name: Persist MEMORY checkpoint and commit proven trio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          parity=json.loads(Path('automation/provider-upstream-parity-trio-v1.json').read_text())
          exact=json.loads(Path('automation/full32-regression-trio-exact-v1.json').read_text())
          p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8')
          marker='## 2026-09-13 — full32 regression trio clean-room repair v1'
          if marker not in t:
              t += f'''\n{marker}\n\n- Authoritative full32 scan `34766524150` reduced current certain regressions to exactly `animevostfr`, `kurage`, `voiranime`; the other 15 deep-ZERO providers remained upstream-zero/technical-unresolved and were not blindly mutated.\n- `animevostfr` now uses NiakVIO-owned `animevostfr_runtime_v1.py`: Core metadata → v2.animevostfr.org search → /animes/ → /episode/ → trembed → external player. Upstream JS is not embedded/executed.\n- `kurage` now uses NiakVIO-owned `kurage_runtime_v1.py`: Core metadata → AniList GraphQL → Kurage tRPC batch (`catalog.anilistInfo + sub + dub`) → source rows. Network trace proved the current contract; upstream JS is not embedded/executed.\n- `voiranime` persists the A/B-proven current authority: `voir-anime.to/anime/{{slug}}/`; stale `arm.haglund.dev` api_recipe and obsolete `voiranime_homes_runtime_v1.py` execution authority are removed.\n- Exact post-fix evidence: `{json.dumps(exact,ensure_ascii=False)}`.\n- Adaptive trio parity counts: `{parity.get('statusCounts')}`; certain regressions: `{parity.get('certainRegressions')}`.\n- Core timer/403/identity ownership remains global. No minimizer was run; minimization remains final-stage only.\n'''
              p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/temp-apply-full32-regression-trio-v1.yml
          git reset .github/workflows/temp-kurage-upstream-trace.yml
          git reset .github/workflows/temp-full32-regression-trio-diagnosis.yml || true
          git reset .github/workflows/temp-current-authority-ab.yml || true
          if git diff --cached --quiet; then echo 'No durable trio changes'; exit 0; fi
          git commit -m 'fix(providers): repair final full32 regression trio'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912

      - name: Upload trio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full32-regression-trio-v1-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/full32-regression-trio-exact-v1.json
            automation/provider-upstream-parity-trio-v1.json
