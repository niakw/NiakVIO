name: Publish binary-strict NuvioTV compatibility v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nuvio-tv-compat-v2.yml"
      - ".github/triggers/publish-nuvio-tv-compat-v2"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate v2 tooling
        run: |
          python -m py_compile scripts/provider_patches/nuvio_tv_direct_media_v2.py
          python -m py_compile scripts/publish_nuvio_tv_compat_v2.py
          node --check scripts/nuvio_tv_probe_v2.cjs

      - name: Probe and stage independently proven providers
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/publish_nuvio_tv_compat_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('automation/nuvio-tv-compat-v2-report.json').read_text(encoding='utf-8'))
          published = {row['id'] for row in report.get('published', [])}
          assert published, report
          for provider_id in published:
              result = report['providers'][provider_id]['result']
              assert result['playable_stream_count'] > 0, (provider_id, result)
              for item in result['streams']:
                  media = item['media']
                  if media['playable']:
                      assert media['error'] is None, (provider_id, media)
                      assert media['starts_extm3u'] or media['binary_signature'] or media['kind'] == 'dash', (provider_id, media)
          print('binary-proven providers:', ', '.join(sorted(published)))
          print('preserved unresolved:', ', '.join(report.get('preserved_unresolved', [])) or 'none')
          PY

      - name: Bump and synchronize release
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regression suite
        run: npm test

      - name: Regenerate and validate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py
          python scripts/validate_activation_preservation.py

      - name: Publish binary-proven bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/*--nuvio-tv-v2--*.js \
            scripts/provider_patches/nuvio_tv_direct_media_v2.py \
            scripts/nuvio_tv_probe_v2.cjs scripts/publish_nuvio_tv_compat_v2.py \
            automation/nuvio-tv-compat-v2-report.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish binary-proven NuvioTV providers v2"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
