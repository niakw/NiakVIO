name: TEMP - verify Hub46 transport contract

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-hub46-transport-contract.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/native_hub46_transport_manifest_test.py
      - run: python3 tests/native_provider_loading_compat_test.py
      - run: python3 tests/native_reader_bootstrap_test.py
