name: One-shot provider preservation fixed-point repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-provider-preservation-fixed-point-once.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-provider-preservation-fixed-point
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Patch preservation/finalization contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          path = root / 'scripts' / 'activation_preservation_core_rehash.py'
          text = path.read_text(encoding='utf-8')

          if 'import sys\n' not in text:
              text = text.replace('import subprocess\n', 'import subprocess\nimport sys\n', 1)

          anchor = '''def _git_bytes(path: str) -> bytes:\n    result = subprocess.run(\n        ["git", "show", f"HEAD:{path}"],\n        cwd=legacy.ROOT,\n        check=True,\n        capture_output=True,\n    )\n    return result.stdout\n\n\n'''
          helper = '''def _baseline_matches_checked_out_head(baseline_path: Path) -> bool:\n    """A preservation baseline is valid only for the HEAD it was captured from."""\n    try:\n        current_head_manifest = _git_bytes("manifest.json")\n    except subprocess.CalledProcessError:\n        return False\n    return baseline_path.read_bytes() == current_head_manifest\n\n\ndef _rematerialize_current_core_after_restore() -> None:\n    """Rebuild only deterministic publication state after provider-state restore.\n\n    Learning is intentionally absent here. Restoring a previous proven provider\n    state changes ProviderBase/provenance inputs, so the public bundle must be\n    derived again with the current Core before the transaction can be published.\n    """\n    commands = (\n        [sys.executable, "scripts/build_provider_runtime_profiles.py"],\n        [sys.executable, "scripts/reapply_published_overrides.py"],\n        [sys.executable, "scripts/generate_language_manifests.py"],\n        [sys.executable, "scripts/prune_unreferenced_providers.py"],\n        [sys.executable, "scripts/reapply_published_overrides.py", "--check"],\n    )\n    for command in commands:\n        subprocess.run(command, cwd=legacy.ROOT, check=True)\n\n\n'''
          if '_baseline_matches_checked_out_head' not in text:
              if anchor not in text:
                  raise SystemExit('activation adapter _git_bytes anchor drifted')
              text = text.replace(anchor, anchor + helper, 1)

          old = '''    if not baseline_path.is_file():\n        raise RuntimeError(f"{_BASELINE_ENV} does not point to a file: {baseline_path}")\n\n    baseline_main = _load_json(baseline_path)\n'''
          new = '''    if not baseline_path.is_file():\n        raise RuntimeError(f"{_BASELINE_ENV} does not point to a file: {baseline_path}")\n    if not _baseline_matches_checked_out_head(baseline_path):\n        print(\n            "FIELD_ACTIVATION_PRESERVATION_BASELINE_STALE "\n            "action=validate_current_head_without_restore"\n        )\n        return []\n\n    baseline_main = _load_json(baseline_path)\n'''
          if 'FIELD_ACTIVATION_PRESERVATION_BASELINE_STALE' not in text:
              if old not in text:
                  raise SystemExit('activation baseline guard anchor drifted')
              text = text.replace(old, new, 1)

          old = '''        _write_json(legacy.OVERRIDES, current_overrides)\n        _write_json(legacy.PROVENANCE, current_provenance)\n        print("FIELD_ACTIVATION_INCONCLUSIVE_STATE_RESTORED count=" + str(len(restored)) + " values=" + ",".join(restored))\n    return restored\n'''
          new = '''        _write_json(legacy.OVERRIDES, current_overrides)\n        _write_json(legacy.PROVENANCE, current_provenance)\n        print("FIELD_ACTIVATION_INCONCLUSIVE_STATE_RESTORED count=" + str(len(restored)) + " values=" + ",".join(restored))\n        _rematerialize_current_core_after_restore()\n    return restored\n'''
          if '_rematerialize_current_core_after_restore()\n    return restored' not in text:
              if old not in text:
                  raise SystemExit('activation rematerialization anchor drifted')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = root / 'tests' / 'sync_atomic_publication_test.py'
          test = test_path.read_text(encoding='utf-8')
          if 'activation_adapter =' not in test:
              test = test.replace(
                  'workflow = (ROOT / ".github" / "workflows" / "sync.yml").read_text(encoding="utf-8")\n',
                  'workflow = (ROOT / ".github" / "workflows" / "sync.yml").read_text(encoding="utf-8")\nactivation_adapter = (ROOT / "scripts" / "activation_preservation_core_rehash.py").read_text(encoding="utf-8")\n',
                  1,
              )
              test = test.replace(
                  'print("atomic ARCHI2 publication workflow test passed")',
                  '''assert "_baseline_matches_checked_out_head" in activation_adapter\nassert "FIELD_ACTIVATION_PRESERVATION_BASELINE_STALE" in activation_adapter\nassert "_rematerialize_current_core_after_restore()" in activation_adapter\nassert '[sys.executable, "scripts/reapply_published_overrides.py", "--check"]' in activation_adapter\n\nprint("atomic ARCHI2 publication workflow test passed")''',
                  1,
              )
              test_path.write_text(test, encoding='utf-8')
          PY

      - name: Materialize current fixed point and test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/activation_preservation_core_rehash.py
          python tests/sync_atomic_publication_test.py
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/reapply_published_overrides.py --check
          python scripts/activation_preservation_core_rehash.py
          python scripts/reapply_published_overrides.py --check
          npm test

      - name: Publish repaired main and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-provider-preservation-fixed-point-once.yml
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair delta; one-shot already absorbed.'
            exit 0
          fi
          git commit -m 'fix(core): seal inconclusive preservation fixed point'
          git fetch origin main
          git rebase origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
