name: TEMP - Residual Terminal Chains V67

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths: [.github/workflows/temp-residual-terminal-chain-v67.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Trace UHDMovies opaque cloud handoffs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,json
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          def get(url,referer=''):
              headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'}
              if referer: headers['Referer']=referer
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      b=r.read(700000);return r.status,r.geturl(),r.headers.get('content-type',''),b.decode('utf-8','replace')
              except Exception as e:
                  body=''
                  try:body=e.read(300000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',body
          pages={
            'movie':'https://uhdmovies.my/download-interstellar-2014-dual-audio-hindi-english-2160p-4k-1080p-x264-10bit-remux-hdr-dovi-hevc-bluray-esubs/',
            'tv':'https://uhdmovies.my/download-breaking-bad-season-01-05-2008-2013-english-audio-1080p-2160p-hevc-bluray-esubs/'
          }
          for lane,page in pages.items():
              st,final,ct,body=get(page);print('V67_UHD_PAGE',lane,st,final,len(body))
              anchors=[]
              for m in re.finditer(r'<a\b([^>]*?)href=["\']([^"\']*cloud\.unblockedgames\.world/\?sid=[^"\']+)["\']([^>]*)>([\s\S]*?)</a>',html.unescape(body),re.I):
                  tag=(m.group(1)+' '+m.group(3)); label=re.sub(r'<[^>]+>',' ',m.group(4));label=re.sub(r'\s+',' ',label).strip();url=html.unescape(m.group(2));anchors.append((label,url,tag[:400]))
              print('V67_UHD_ANCHOR_COUNT',lane,len(anchors))
              picks=[]
              if lane=='movie': picks=anchors[:4]
              else:
                  picks=[x for x in anchors if re.search(r'\bEpisode\s*1\b',x[0],re.I)][:6]
              for idx,(label,url,tag) in enumerate(picks):
                  st2,fin2,ct2,b2=get(url,page);print('V67_UHD_HANDOFF',lane,idx,label,st2,fin2,ct2,'bytes',len(b2))
                  norm=html.unescape(b2.replace('\\/','/'))
                  found=[]
                  for pat in [r'(?:href|src|action|data-(?:src|url|link|href|file|stream|player))\s*=\s*["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
                      for mm in re.finditer(pat,norm,re.I):
                          raw=mm.group(1) if mm.lastindex else mm.group(0)
                          try:u=urllib.parse.urljoin(fin2,raw)
                          except Exception:continue
                          if u.startswith('http') and u not in found:found.append(u)
                  for u in found[:80]:
                      if any(t in u.lower() for t in ['drive','cloud','hub','vcloud','stream','download','file','pixeldrain','gofile','workers','api','video','m3u8','mp4']):print('V67_UHD_CHILD',lane,idx,u[:600])
                  for form in re.findall(r'<form\b[^>]{0,1500}>',norm,re.I)[:20]: print('V67_UHD_FORM',lane,idx,re.sub(r'\s+',' ',form)[:1400])
          PY

      - name: Trace AnimeSalt current series and episode contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          def get(url,referer=''):
              h={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'}
              if referer:h['Referer']=referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=18) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(800000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(300000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          page='https://animesalt.cx/series/jujutsu-kaisen/'
          st,final,ct,body=get(page);print('V67_SALT_DETAIL',st,final,ct,'bytes',len(body))
          norm=html.unescape(body.replace('\\/','/'))
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',norm,re.I):
              u=urllib.parse.urljoin(final,m.group(1));label=re.sub(r'<[^>]+>',' ',m.group(2));label=re.sub(r'\s+',' ',label).strip()
              if any(x in (u+' '+label).lower() for x in ['episode','jujutsu-kaisen','watch','play']):print('V67_SALT_LINK',label[:180],u[:500])
          for token in ['ajax','player','episode','data-id','postid','nonce','server']:
              for m in list(re.finditer(token,norm,re.I))[:20]: print('V67_SALT_CTX',token,re.sub(r'\s+',' ',norm[max(0,m.start()-500):m.start()+1200])[:1700])
          episode_urls=[]
          for mm in re.finditer(r'(https?://[^\s"\'<>]+|/[A-Za-z0-9_/?=&.%-]*(?:episode|watch)[A-Za-z0-9_/?=&.%-]*)',norm,re.I):
              try:u=urllib.parse.urljoin(final,mm.group(0))
              except Exception:continue
              if 'animesalt.cx' in u and u not in episode_urls:episode_urls.append(u)
          for ep in episode_urls[:6]:
              st2,f2,ct2,b2=get(ep,final);print('V67_SALT_EP',st2,f2,ct2,'bytes',len(b2))
              n2=html.unescape(b2.replace('\\/','/'))
              for pat in [r'<iframe\b[^>]*src=["\']([^"\']+)',r'(?:file|src|url|source)\s*[:=]\s*["\']([^"\']+)']:
                  for m in re.finditer(pat,n2,re.I):
                      u=urllib.parse.urljoin(f2,m.group(1));
                      if u.startswith('http'):print('V67_SALT_PLAYER',u[:600])
          PY

      - name: Trace AllWish current API and ZenCloud handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,json
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          def get(url,referer=''):
              h={'User-Agent':UA,'Accept':'*/*','X-Requested-With':'XMLHttpRequest'}
              if referer:h['Referer']=referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=18) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(900000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(400000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          ep='https://all-wish.me/watch/jujutsu-kaisen-tv-8ssye/ep-1'
          st,final,ct,body=get(ep);print('V67_WISH_EP',st,final,ct,'bytes',len(body));norm=html.unescape(body.replace('\\/','/'))
          for token in ['getinfo','zencloud','server','episode','data-id','1103','source','ajax']:
              for m in list(re.finditer(token,norm,re.I))[:25]:print('V67_WISH_CTX',token,re.sub(r'\s+',' ',norm[max(0,m.start()-600):m.start()+1500])[:2100])
          urls=[]
          for m in re.finditer(r'https?://[^\s"\'<>]+|/[A-Za-z0-9_/?=&.%-]+',norm):
              raw=m.group(0)
              if any(t in raw.lower() for t in ['getinfo','ajax','server','source','player','episode','stream']):
                  try:u=urllib.parse.urljoin(final,raw)
                  except Exception:continue
                  if u not in urls:urls.append(u)
          for u in urls[:80]: print('V67_WISH_ENDPOINT',u[:600])
          for u in ['https://all-wish.me/anime/getinfo/1103','https://all-wish.me/js/zencloud-player.js']:
              st2,f2,ct2,b2=get(u,final);print('V67_WISH_FETCH',st2,f2,ct2,'bytes',len(b2));print('V67_WISH_BODY',re.sub(r'\s+',' ',b2)[:12000])
          PY
