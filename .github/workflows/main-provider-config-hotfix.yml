name: MAIN - Provider CONFIG Publication Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-provider-config-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: niakvio-main-provider-config-hotfix
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cancel superseded main CodeQL and gate runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/cancel-runs.txt"
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          rows=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?per_page=100'],text=True)).get('workflow_runs') or []
          active={'queued','in_progress','waiting','pending','requested'}
          for row in rows:
              rid=int(row.get('id') or 0)
              if not rid or rid == current or row.get('status') not in active or row.get('head_branch') != 'main':
                  continue
              name=str(row.get('name') or '')
              if 'codeql' in name.casefold() or name in {'SEC - Final Gate','CORE - Workflow Gate','MAIN - Provider CONFIG Publication Hotfix'}:
                  print(f"{rid}\t{name}")
          PY
          while IFS=$'\t' read -r run_id run_name; do
            [ -n "${run_id:-}" ] || continue
            echo "CANCEL_SUPERSEDED run=$run_id name=$run_name"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done < "$RUNNER_TEMP/cancel-runs.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply durable Provider CONFIG publication fix
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/apply_provider_config_publication_hotfix.py
          python -m py_compile scripts/reapply_published_overrides.py scripts/validate_published_provider_config.py tests/final_published_provider_config_test.py
          python tests/native_dual_id_identity_test.py
          python tests/global_media_type_resolution_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py

      - name: Finalize published 96 from Base plus structured CONFIG plus Lego
        env:
          NUVIO_PROVIDER_V3_CONTEXT: main
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py
          python scripts/validate_published_provider_config.py --expected 96

      - name: Derive filtered manifests and synchronize versions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/sync_release_versions.py --previous "$RUNNER_TEMP/manifest.before.json"
          python scripts/apply_provider_config_publication_hotfix.py --memory-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.load(open(Path(__import__('os').environ['RUNNER_TEMP'])/'manifest.before.json'))
          after=json.load(open('manifest.json'))
          if before.get('version') != '5.21.34':
              raise SystemExit(f"unexpected publication baseline {before.get('version')!r}")
          if after.get('version') != '5.21.35':
              raise SystemExit(f"expected manifest 5.21.35, got {after.get('version')!r}")
          old={str(r.get('id','')).casefold():r for r in before.get('scrapers',[]) if isinstance(r,dict)}
          changed=[]
          for row in after.get('scrapers',[]):
              if not isinstance(row,dict): continue
              cid=str(row.get('id','')).casefold(); prev=old.get(cid)
              if not prev: continue
              a={k:v for k,v in row.items() if k!='version'}
              b={k:v for k,v in prev.items() if k!='version'}
              if a!=b:
                  ov=tuple(map(int,str(prev.get('version','0.0.0')).split('.')))
                  nv=tuple(map(int,str(row.get('version','0.0.0')).split('.')))
                  if nv <= ov:
                      raise SystemExit(f"provider version not bumped: {cid} {prev.get('version')} -> {row.get('version')}")
                  changed.append(cid)
          if not changed:
              raise SystemExit('publication changed no provider rows')
          print(f"PUBLICATION_VERSION_OK manifest=5.21.35 providers_bumped={len(changed)}")
          PY

      - name: Validate final published bytes and release integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_published_provider_config.py --expected 96
          python tests/final_published_provider_config_test.py
          python tests/native_dual_id_identity_test.py
          python tests/global_media_type_resolution_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python scripts/audit_provider_v3_static.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python scripts/reapply_published_overrides.py --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.load(open('manifest.json'))
          assert manifest['version']=='5.21.35', manifest['version']
          rows=[r for r in manifest.get('scrapers',[]) if isinstance(r,dict)]
          assert len(rows)==96, len(rows)
          for row in rows:
              p=Path(row['filename'])
              text=p.read_text(encoding='utf-8')
              if 'NIAKVIO_PROVIDER_BASE_OWNED_V3' in text:
                  assert text.count('const NIAKVIO_PROVIDER_MODEL = Object.freeze(')==1, row['id']
          print('FINAL_MAIN_5_21_35_CONFIG_OK providers=96')
          PY

      - name: Publish repaired generation to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f scripts/apply_provider_config_publication_hotfix.py .github/workflows/main-provider-config-hotfix.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "MAIN_ADVANCED base=$BASE_SHA current=$CURRENT_SHA"
            exit 75
          fi
          git commit -m "fix: restore Provider CONFIG in final publication 5.21.35"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
