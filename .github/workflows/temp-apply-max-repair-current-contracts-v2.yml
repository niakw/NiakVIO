name: TEMP - Apply Max Repair Current Contracts V2
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-apply-max-repair-current-contracts-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Apply canonical provider contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_max_repair_current_contracts_v1.py
          python3 scripts/upgrade_max_repair_current_contracts_v2.py
          python3 scripts/upgrade_wookafr_lecteurvideo_priority_v1.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py
          python3 -m py_compile \
            scripts/provider_patches/wookafr_showvideo_base64_v1.py \
            scripts/provider_patches/allwish_current_runtime_v1.py \
            scripts/provider_patches/flemmix_current_runtime_v1.py \
            scripts/upgrade_max_repair_current_contracts_v1.py \
            scripts/upgrade_max_repair_current_contracts_v2.py
      - name: Verify materialized provider markers
        shell: bash
        run: |
          set -euo pipefail
          grep -R -l 'NIAKVIO_WOOKAFR_SHOWVIDEO_BASE64_V1' providers | head -1
          grep -R -l 'NIAKVIO_ALLWISH_CURRENT_RUNTIME_V1' providers | head -1
          grep -R -l 'NIAKVIO_FLEMMIX_CURRENT_RUNTIME_V1' providers | head -1
      - name: Run real current-contract provider probes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-current-v2.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const specs={
            wookafr:{id:'157336',type:'movie',title:'Interstellar',year:'2014'},
            allwish:{id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
            flemmixMovie:{pid:'flemmix',id:'1356963',type:'movie',title:'Little Lorraine',year:'2026'},
            flemmixTv:{pid:'flemmix',id:'94997',type:'tv',title:'House of the Dragon',year:'2022',season:1,episode:1}
          };
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
          function providerFile(pid){
            const rows=Array.isArray(manifest.scrapers)?manifest.scrapers:[];
            const wanted=norm(pid);
            const matches=rows.filter(row=>norm(row&&row.id)===wanted || norm(row&&row.filename&&path.basename(row.filename).split('--')[0])===wanted || norm(row&&row.filename&&path.basename(row.filename).split('-')[0])===wanted);
            if(matches.length!==1)throw new Error(`manifest_provider_count:${pid}:${matches.length}`);
            const filename=String(matches[0].filename||'');
            if(!filename)throw new Error('manifest_filename_missing:'+pid);
            const file=path.resolve(filename);
            if(!fs.existsSync(file))throw new Error('manifest_provider_missing:'+pid+':'+filename);
            console.log('MANIFEST_PROVIDER',pid,filename,'enabled='+matches[0].enabled,'types='+JSON.stringify(matches[0].supportedTypes||[]));
            return file;
          }
          function metadata(spec){
            if(spec.type==='movie')return {title:spec.title,original_title:spec.title,release_date:`${spec.year}-01-01`,alternative_titles:{titles:[]}};
            return {name:spec.title,original_name:spec.title,first_air_date:`${spec.year}-01-01`,alternative_titles:{results:[]}};
          }
          async function run(name,spec){
            const pid=spec.pid||name,file=providerFile(pid),ns=spec.type==='movie'?'movie':'tv',meta=metadata(spec);
            globalThis.__nuvioMediaContext={tmdbId:String(spec.id),tmdbNamespace:ns,tmdbMetadata:meta};
            globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${spec.id}`]:meta};
            globalThis.__nuvioProviderDeadlineMs=Date.now()+28000;
            delete require.cache[file]; const mod=require(file);
            if(!mod||typeof mod.getStreams!=='function')throw new Error('getStreams_missing:'+pid);
            const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider_timeout:'+name)),29000));
            const rows=await Promise.race([Promise.resolve(mod.getStreams(String(spec.id),spec.type,spec.season,spec.episode)),timer]);
            const out=Array.isArray(rows)?rows:[];
            console.log('PROBE',name,'file='+path.basename(file),'count='+out.length,out.slice(0,8).map(r=>({url:r&&r.url,title:r&&r.title,headers:r&&r.headers})));
            return out;
          }
          async function pageOk(label,row){
            if(!row||!/^https?:\/\//i.test(String(row.url||'')))throw new Error(label+':bad_url');
            const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
            try{
              const r=await fetch(row.url,{headers:row.headers||{},redirect:'follow',signal:controller.signal});
              const ct=r.headers.get('content-type')||''; const text=await r.text();
              console.log('PAGE',label,r.status,ct,'bytes='+text.length,'final='+r.url);
              if(!r.ok||text.length<100)throw new Error(label+':player_not_accessible');
            }finally{clearTimeout(timer)}
          }
          (async()=>{
            const wk=await run('wookafr',specs.wookafr); if(!wk.length)throw new Error('wookafr_zero_after_embed_fallback'); await pageOk('wookafr',wk[0]);
            const aw=await run('allwish',specs.allwish); if(!aw.length)throw new Error('allwish_zero_after_current_runtime'); if(!/megaplay\.buzz\/stream\//i.test(String(aw[0].url||'')))throw new Error('allwish_unexpected_player'); await pageOk('allwish',aw[0]);
            const fm=await run('flemmixMovie',specs.flemmixMovie); if(!fm.length)throw new Error('flemmix_movie_zero_after_current_runtime'); if(!/flemmix\.me\/embed\/video\//i.test(String(fm[0].url||'')))throw new Error('flemmix_movie_unexpected_embed'); await pageOk('flemmixMovie',fm[0]);
            try{
              const ft=await run('flemmixTv',specs.flemmixTv);
              if(ft.length){await pageOk('flemmixTv',ft[0]);console.log('FLEMMIX_TV_POSITIVE',ft.length)}
              else console.log('FLEMMIX_TV_RESIDUAL_ZERO');
            }catch(e){console.log('FLEMMIX_TV_RESIDUAL_ERROR',String(e&&e.message||e))}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/probe-current-v2.cjs
      - name: Commit materialized current-provider repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- provider-overrides.json providers provider-bases sources.json manifest.json scripts
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit'
          else
            git commit -m 'fix: materialize Wooka AllWish Flemmix current contracts'
            git push origin HEAD:fix/non-display-recovery-20260916
          fi