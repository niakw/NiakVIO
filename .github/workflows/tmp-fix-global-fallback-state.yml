name: Temporary fix global fallback state

on:
  push:
    branches:
      - agent/tv-regression-5.20.38

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply fallback state fix
        run: python scripts/tmp_fix_global_fallback_state.py
      - name: Focused regression
        run: |
          python tests/global_provider_policy_test.py
          node --check scripts/health_check.mjs
      - name: Full repository regression suite
        run: npm test
      - name: Commit proven fallback state fix
        run: |
          rm -f scripts/tmp_fix_global_fallback_state.py
          rm -f .github/workflows/tmp-fix-global-fallback-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: track adaptive fallback execution explicitly'
          git push origin HEAD:agent/tv-regression-5.20.38
