name: REPORT - reports resume once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-report-resume-from-reports.yml'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Report target workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'tmp-resume-publish-from-reports.yml' --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url --jq '.[0] | "REPORTS_RESUME_RUN run=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "") head=\(.headSha) created=\(.createdAt) url=\(.url)"')"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "$row"
      - name: Self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-report-resume-from-reports.yml
          git commit -m 'chore: remove reports-resume reporter [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
