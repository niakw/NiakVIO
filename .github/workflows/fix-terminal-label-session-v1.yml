name: FIX - Terminal Label and Session Isolation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-terminal-label-session-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-terminal-label-session-v1
  cancel-in-progress: true

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Patch terminal presentation and abort-ignorant native fetch cancellation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Engine V2: providerDisplayName previously accepted `Kehflix - Inconnue`
          # as a provider name after quality had correctly normalized to null.
          replace_once(
              "engine_v2/src/stream-presentation.mjs",
              '''  return {\n    ...stream,\n    title: `${providerName}${facts.quality ? ` - ${qualityLabel(facts.quality)}` : ""}`,\n    name: providerName,\n''',
              '''  const streamTitle = `${providerName}${facts.quality ? ` - ${qualityLabel(facts.quality)}` : ""}`;\n  return {\n    ...stream,\n    title: streamTitle,\n    name: streamTitle,\n''',
              "engine title/name mirror",
          )
          replace_once(
              "engine_v2/src/stream-presentation.mjs",
              '''function providerDisplayName(stream, provider) {\n  const raw = clean(stream.name);\n''',
              '''function cleanProviderDisplayName(value) {\n  const raw = clean(value);\n  if (!raw) return null;\n  return clean(raw.replace(\n    /\\s*(?:[-|•:])\\s*(?:unknown|inconnu(?:e)?|n\\/?a|na|none|null|undefined|unknown\\s+(?:quality|language)|qualit(?:e|é)\\s+inconnue|langue\\s+inconnue)\\s*$/i,\n    "",\n  ));\n}\n\nfunction providerDisplayName(stream, provider) {\n  const raw = cleanProviderDisplayName(stream.name ?? stream.title);\n''',
              "engine terminal provider placeholder cleanup",
          )

          # Add direct engine regression for all placeholder spellings and both
          # meaningful quality projections.
          engine_test_anchor = '''assert.equal(normalizeSourceType("some provider label"), null);\n\n'''
          engine_test_insert = '''assert.equal(normalizeSourceType("some provider label"), null);\n\nconst kehflixProvider = { id: "kehflix", name: "Kehflix", languages: ["fr"] };\nfor (const placeholder of ["Inconnue", "Unknown", "N/A"]) {\n  const row = presentStreamCandidate({\n    name: `Kehflix - ${placeholder}`,\n    title: `Kehflix - ${placeholder}`,\n    url: "https://media.example/master.m3u8",\n    quality: placeholder,\n  }, { title: "Interstellar", year: 2014, mediaType: "movie" }, kehflixProvider);\n  assert.equal(row.title, "Kehflix", row.title);\n  assert.equal(row.name, "Kehflix", row.name);\n  assert.equal(row.quality, null, JSON.stringify(row));\n}\nconst kehflix1080 = presentStreamCandidate({ name: "Kehflix", url: "https://media.example/a.mp4", quality: "1080p" }, { mediaType: "movie" }, kehflixProvider);\nassert.equal(kehflix1080.title, "Kehflix - 1080p");\nassert.equal(kehflix1080.name, "Kehflix - 1080p");\nconst kehflix4k = presentStreamCandidate({ name: "Kehflix", url: "https://media.example/a.mp4", quality: "2160p" }, { mediaType: "movie" }, kehflixProvider);\nassert.equal(kehflix4k.title, "Kehflix - 4K");\nassert.equal(kehflix4k.name, "Kehflix - 4K");\n\n'''
          replace_once(
              "engine_v2/tests/stream-presentation.test.mjs",
              engine_test_anchor,
              engine_test_insert,
              "engine presentation regression",
          )

          # Also lock the exact generated Core presentation contract: a provider
          # may itself return a placeholder suffix even when URL contains no
          # recoverable resolution hint.
          py_test_anchor = '''assert numeric_height["title"].endswith(" - 4K"), numeric_height\n\n'''
          py_test_insert = '''assert numeric_height["title"].endswith(" - 4K"), numeric_height\n\nunknown_quality_label = run(\n    "module.exports={getStreams:async()=>[{name:'Kehflix - Inconnue',title:'Kehflix - Inconnue',url:'https://cdn.example/master.m3u8',quality:'Inconnue'}]};\\n",\n    "kehflix",\n    "p.getStreams({mediaType:'movie',title:'Interstellar',year:2014}).then(v=>console.log(JSON.stringify(v[0])))",\n)\nassert unknown_quality_label["title"] == "Kehflix", unknown_quality_label\nassert unknown_quality_label["name"] == "Kehflix", unknown_quality_label\nassert "quality" not in unknown_quality_label, unknown_quality_label\n\n'''
          replace_once(
              "tests/global_stream_presentation_test.py",
              py_test_anchor,
              py_test_insert,
              "core unknown-quality label regression",
          )

          media = Path("scripts/provider_patches/global_media_type_resolution_v1.py")
          text = media.read_text(encoding="utf-8")
          old_rev = '"revision": "tmdb-data-contract-launch-gate-v28-dual-id-input",'
          new_rev = '"revision": "tmdb-data-contract-launch-gate-v29-native-abort-race",'
          if text.count(old_rev) != 1:
              raise SystemExit(f"media revision anchor count={text.count(old_rev)}")
          text = text.replace(old_rev, new_rev, 1)

          old_abort = '''function abortController(controller){try{if(controller&&typeof controller.abort==="function")controller.abort()}catch(_){}}\nasync function settlePrior'''
          new_abort = '''function abortController(controller){try{if(controller&&typeof controller.abort==="function")controller.abort()}catch(_){}}\nfunction requestAbortPromise(controller,requestToken){\n  return new Promise(function(_resolve,reject){\n    try{\n      var signal=controller&&controller.signal;\n      if(!signal)return;\n      var fail=function(){reject(tokenOwns(requestToken)?providerTimeoutError():providerStaleError())};\n      if(signal.aborted){fail();return}\n      if(typeof signal.addEventListener==="function")signal.addEventListener("abort",fail,{once:true});\n    }catch(_){}\n  });\n}\nasync function settlePrior'''
          if text.count(old_abort) != 1:
              raise SystemExit(f"abort helper anchor count={text.count(old_abort)}")
          text = text.replace(old_abort, new_abort, 1)

          old_race = '''    var value;\n    try{\n      value=(typeof setTimeout==="function"&&remaining>0)\n        ? await Promise.race([base.apply(this,args),timeoutPromise])\n        : await base.apply(this,args);\n    }finally{'''
          new_race = '''    var value,abortPromise=requestAbortPromise(requestController,requestToken);\n    try{\n      value=(typeof setTimeout==="function"&&remaining>0)\n        ? await Promise.race([base.apply(this,args),timeoutPromise,abortPromise])\n        : await Promise.race([base.apply(this,args),abortPromise]);\n    }finally{'''
          if text.count(old_race) != 1:
              raise SystemExit(f"native abort race anchor count={text.count(old_race)}")
          text = text.replace(old_race, new_race, 1)
          media.write_text(text, encoding="utf-8")

          native_test = Path("tests/provider_native_abort_ignorant_cancellation_test.py")
          native_test.write_text(r'''#!/usr/bin/env python3
from __future__ import annotations

import importlib.util
import subprocess
import tempfile
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
PATCH = ROOT / "scripts/provider_patches/global_media_type_resolution_v1.py"
spec = importlib.util.spec_from_file_location("media_type_abort_ignorant", PATCH)
assert spec is not None and spec.loader is not None
mod = importlib.util.module_from_spec(spec)
spec.loader.exec_module(mod)

base = r'''
"use strict";
async function getStreams(tmdbId, mediaType) {
  try {
    await fetch("https://provider.example/" + tmdbId + "/one");
  } catch (_) {
    try { await fetch("https://provider.example/" + tmdbId + "/two"); } catch (_) {}
  }
  return [];
}
module.exports = { getStreams };
'''
patched = mod.apply(base, options={"semantic_types": ["movie"], "provider_timeout_ms": 10_000, "tv_provider_timeout_ms": 10_000, "supersede_settle_ms": 1_000})

runner = r'''
const calls=[];
global.navigator={userAgent:"Nuvio Desktop macOS"};
global.fetch=(url,_init={})=>{
  const value=String(url);calls.push(value);
  if(value.includes("/1/one")) return new Promise(()=>{}); // native bridge ignores AbortSignal forever
  return Promise.resolve({ok:true,status:200,url:value,headers:{get:()=>"text/plain"},text:async()=>"ok",json:async()=>({})});
};
const provider=require(process.argv[2]);
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
(async()=>{
  const first=provider.getStreams("1","movie");
  await Promise.resolve();
  const started=Date.now();
  const second=provider.getStreams("2","movie");
  await Promise.race([
    Promise.all([first,second]),
    sleep(1500).then(()=>{throw new Error("superseded abort-ignorant native fetch did not settle")}),
  ]);
  const elapsed=Date.now()-started;
  if(elapsed>=1200)throw new Error("supersede settlement too slow: "+elapsed+"ms");
  if(calls.some(v=>v.includes("/1/two")))throw new Error("superseded request launched fallback fetch: "+JSON.stringify(calls));
  if(!calls.some(v=>v.includes("/1/one")))throw new Error("first request never started");
  if(!calls.some(v=>v.includes("/2/one")))throw new Error("new request did not run");
  if(global.__nuvioProviderRequestToken!=null)throw new Error("request token leaked after final invocation");
  console.log("abort-ignorant native fetch cancellation passed",elapsed,JSON.stringify(calls));
})().catch(e=>{console.error(e);process.exit(1)});
'''

with tempfile.TemporaryDirectory() as tmp:
    root = Path(tmp)
    provider = root / "provider.js"
    test = root / "test.js"
    provider.write_text(patched, encoding="utf-8")
    test.write_text(runner, encoding="utf-8")
    subprocess.run(["node", str(test), str(provider)], check=True, timeout=5)

source = PATCH.read_text(encoding="utf-8")
for needle in (
    "tmdb-data-contract-launch-gate-v29-native-abort-race",
    "function requestAbortPromise(controller,requestToken)",
    "Promise.race([base.apply(this,args),timeoutPromise,abortPromise])",
    "Promise.race([base.apply(this,args),abortPromise])",
):
    assert needle in source, needle
print("provider native abort-ignorant cancellation contract passed")
''', encoding="utf-8")

          package = Path("package.json")
          ptext = package.read_text(encoding="utf-8")
          old = "python3 tests/repair_identity_gate_test.py && python3 tests/quick_repair_probe_profile_test.py"
          new = "python3 tests/repair_identity_gate_test.py && python3 tests/provider_latest_request_cancellation_test.py && python3 tests/provider_native_abort_ignorant_cancellation_test.py && python3 tests/quick_repair_probe_profile_test.py"
          if ptext.count(old) != 1:
              raise SystemExit(f"package regression anchor count={ptext.count(old)}")
          package.write_text(ptext.replace(old, new, 1), encoding="utf-8")
          print("source patches applied")
          PY

      - name: Run targeted regressions before materialization
        run: |
          set -euo pipefail
          node engine_v2/tests/stream-presentation.test.mjs
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/provider_latest_request_cancellation_test.py
          python3 tests/provider_native_abort_ignorant_cancellation_test.py
          python3 tests/global_media_type_resolution_test.py
          python3 tests/native_media_type_capability_test.py
          python3 tests/native_runtime_settlement_contract_test.py

      - name: Rematerialize all public providers and finalize release
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json /tmp/manifest.previous.json
          python3 scripts/reapply_published_overrides.py
          python3 scripts/generate_language_manifests.py
          python3 scripts/prune_unreferenced_providers.py
          python3 scripts/sync_release_versions.py --previous /tmp/manifest.previous.json
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check

      - name: Verify terminal labels across published catalogue
        shell: bash
        run: |
          set -euo pipefail
          node engine_v2/tests/stream-presentation.test.mjs
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/provider_latest_request_cancellation_test.py
          python3 tests/provider_native_abort_ignorant_cancellation_test.py
          python3 tests/global_stream_output_guard_test.py
          python3 tests/provider_base_store_test.py
          python3 tests/provider_coverage_preservation_test.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'manifest.json').read_text())
          rows=manifest.get('scrapers') or []
          assert len(rows)==96, len(rows)
          for row in rows:
              path=root/str(row['filename'])
              text=path.read_text(encoding='utf-8')
              assert 'all-providers-client-projection-name-mirror-v20' in text, row['id']
              assert 'post-presentation-name-title-quality-v7' in text or 'CORE.PROVIDER_BRANDING.V1' not in text, row['id']
              assert 'tmdb-data-contract-launch-gate-v29-native-abort-race' in text, row['id']
              assert 'function requestAbortPromise(controller,requestToken)' in text, row['id']
          print('published terminal/session contract 96/96 passed')
          PY

      - name: Live Interstellar provider matrix
        run: python3 scripts/interstellar_nuvio_matrix.py --workers 12 --timeout 35 --output automation/interstellar-nuvio-matrix.json

      - name: Live Hell Mode desktop anime matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          ROOT=Path('.')
          manifest=json.loads((ROOT/'manifest.json').read_text(encoding='utf-8'))
          fixture={
            'tmdbId':'tt38646634',
            'mediaType':'series',
            'season':1,
            'episode':12,
            'title':'Hell Mode: The Hardcore Gamer Dominates in Another World with Garbage Balancing',
            'label':'Hell Mode S01E12',
            'category':'anime',
          }
          context={
            'locale':'fr-FR','language':'fr','languages':['fr-FR','fr','en'],
            'platform':'desktop','settings':{},'storage':{},'injectAcceptLanguage':True,
            'networkLimits':{'maxFetches':30,'maxResponseBytes':5242880,'maxTotalResponseBytes':20971520,'maxDistinctHosts':20,'maxRedirects':5},
            'maxSettingsProfiles':1,
          }
          rows=[]
          for row in manifest.get('scrapers') or []:
            if row.get('enabled') is not True: continue
            semantic={str(x).casefold() for x in (row.get('canonicalSupportedTypes') or row.get('supportedTypes') or [])}
            transport={str(x).casefold() for x in (row.get('supportedTypes') or [])}
            if 'anime' not in semantic and not ({'tv','series'} & transport): continue
            rows.append(row)
          def probe(row):
            cmd=['node','--max-old-space-size=1024','scripts/provider_worker.cjs',str(row['filename']),json.dumps(fixture,ensure_ascii=False),json.dumps(context,ensure_ascii=False)]
            try:
              cp=subprocess.run(cmd,cwd=ROOT,text=True,capture_output=True,timeout=35,check=False,env=os.environ.copy())
            except subprocess.TimeoutExpired:
              return {'id':str(row['id']).casefold(),'count':0,'ok':False,'error':'timeout'}
            payload=None
            for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                try: payload=json.loads(line.split('=',1)[1])
                except Exception: pass
            if not payload:
              return {'id':str(row['id']).casefold(),'count':0,'ok':False,'error':'missing_worker_payload'}
            return {
              'id':str(row['id']).casefold(),
              'count':int(payload.get('stream_count') or 0),
              'ok':bool(payload.get('ok')),
              'error':payload.get('error') or (payload.get('error_details') or {}).get('message'),
              'hosts':payload.get('provider_server_hosts') or [],
              'statuses':payload.get('provider_server_http_statuses') or [],
            }
          results=[]
          with ThreadPoolExecutor(max_workers=min(10,max(1,len(rows)))) as ex:
            futs={ex.submit(probe,row):row for row in rows}
            for i,f in enumerate(as_completed(futs),1):
              r=f.result();results.append(r);print(f"[{i}/{len(rows)}] {r['id']} streams={r['count']} error={r['error']}",flush=True)
          results.sort(key=lambda x:x['id'])
          positive=[r['id'] for r in results if r['count']>0]
          report={'generated_at':datetime.now(timezone.utc).isoformat(),'manifest_version':manifest.get('version'),'fixture':fixture,'providers_tested':len(results),'positive_count':len(positive),'positive_ids':positive,'providers':results}
          Path('automation/hellmode-desktop-matrix.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'tested':len(results),'positive_count':len(positive),'positive':positive},ensure_ascii=False,indent=2))
          PY

      - name: Refresh release hashes after live reports
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit verified fix and live matrices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(core): close stale sessions and terminal placeholder labels'
          git pull --rebase origin main
          git push origin HEAD:main
