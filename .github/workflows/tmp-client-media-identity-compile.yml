name: TMP - Client Media Identity Compile

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/tmp-client-media-identity-compile.yml'
      - 'scripts/augment_nuvio_client_media_identity_bridge.py'
      - 'tests/nuvio_client_media_identity_bridge_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: niakvio
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with: {cache-disabled: true}
      - name: Clone and patch official Desktop
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch Dev https://github.com/NuvioMedia/NuvioDesktop.git desktop
          touch desktop/local.properties
          python3 niakvio/scripts/augment_nuvio_client_media_identity_bridge.py \
            --repository-source desktop/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/PluginRepository.kt \
            --runtime-source desktop/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/PluginRuntime.kt
          echo "FIELD_CLIENT_IDENTITY_COMPILE_HEAD client=desktop sha=$(git -C desktop rev-parse HEAD)"
      - name: Compile patched Desktop common runtime on JVM target
        shell: bash
        run: |
          set -euo pipefail
          ./desktop/gradlew -p desktop :composeApp:compileKotlinDesktop --no-build-cache --no-configuration-cache --console=plain
          echo 'FIELD_CLIENT_IDENTITY_COMPILE client=desktop success=true provider_abi_changed=false'

  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: niakvio
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with: {cache-disabled: true}
      - name: Clone and patch official Mobile
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git mobile
          touch mobile/local.properties
          python3 niakvio/scripts/augment_nuvio_client_media_identity_bridge.py \
            --repository-source mobile/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/PluginRepository.kt \
            --runtime-source mobile/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/PluginRuntime.kt
          echo "FIELD_CLIENT_IDENTITY_COMPILE_HEAD client=mobile sha=$(git -C mobile rev-parse HEAD)"
      - name: Compile patched Mobile full Android runtime
        shell: bash
        run: |
          set -euo pipefail
          ./mobile/gradlew -p mobile :composeApp:compileAndroidMain -Pnuvio.android.distribution=full --no-build-cache --no-configuration-cache --console=plain
          echo 'FIELD_CLIENT_IDENTITY_COMPILE client=mobile-android success=true provider_abi_changed=false'
