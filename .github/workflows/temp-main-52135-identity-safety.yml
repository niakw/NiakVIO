name: TEMP - Main 5.21.35 Identity Safety

on:
  push:
    branches:
      - hotfix/main-52135-identity-safety
    paths:
      - 'scripts/oneoff_catalogue_identity_failclosed_v30.py'
      - 'tests/catalogue_identity_failclosed_v30_test.py'
      - '.github/workflows/temp-main-52135-identity-safety.yml'

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Freeze production manifest
        run: cp manifest.json /tmp/manifest-before.json
      - name: Apply fail-closed identity patch
        run: python scripts/oneoff_catalogue_identity_failclosed_v30.py
      - name: Run identity regression
        run: python tests/catalogue_identity_failclosed_v30_test.py
      - name: Materialize only Anime-Sama
        run: python scripts/materialize_provider_v3_one.py anime-sama
      - name: Prove 95 providers untouched
        run: |
          python - <<'PY'
          import json
          before=json.load(open('/tmp/manifest-before.json'))
          after=json.load(open('manifest.json'))
          assert before.get('version')=='5.21.35', before.get('version')
          assert after.get('version')=='5.21.35', after.get('version')
          b={str(x.get('id','')).lower():x for x in before['scrapers']}
          a={str(x.get('id','')).lower():x for x in after['scrapers']}
          assert set(a)==set(b) and len(a)==96
          changed=[]
          for pid in sorted(a):
              if a[pid]!=b[pid]: changed.append(pid)
          assert changed==['anime-sama'], changed
          assert a['anime-sama']['filename']!=b['anime-sama']['filename']
          for pid in a:
              if pid!='anime-sama': assert a[pid].get('filename')==b[pid].get('filename'), pid
          print('PRODUCTION_ISOLATION_OK providers=96 changed=anime-sama untouched=95')
          PY
      - name: Children of Men must stop before wrong player
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        shell: bash
        run: |
          BUNDLE=$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(x for x in m['scrapers'] if str(x.get('id','')).lower()=='anime-sama')['filename'])
          PY
          )
          FIXTURE='{"tmdbId":"9693","imdbId":"tt0206634","mediaType":"movie","type":"movie","title":"Children of Men","year":2006,"expectedDurationMinutes":109}'
          set +e
          node scripts/nuvio_tv_probe_tmdb_ci.cjs "$BUNDLE" "$FIXTURE" '{}' > /tmp/children-main-hotfix.log 2>&1
          set -e
          cat /tmp/children-main-hotfix.log
          python - <<'PY'
          import json
          result=None
          for raw in reversed(open('/tmp/children-main-hotfix.log',encoding='utf-8').read().splitlines()):
              if raw.strip().startswith('{'):
                  try:v=json.loads(raw)
                  except:continue
                  if isinstance(v,dict) and 'raw_stream_count' in v: result=v; break
          assert result is not None
          assert int(result.get('raw_stream_count') or 0)==0, result
          assert int(result.get('playable_stream_count') or 0)==0, result
          urls=[str(x.get('url') or '') for x in ((result.get('debug') or {}).get('fetches') or []) if isinstance(x,dict)]
          forbidden=('catalogue/lag/','catalogue/les-mikails/','ansembed.net','vmcld.space')
          bad=[u for u in urls if any(t in u for t in forbidden)]
          assert not bad, bad
          print('CHILDREN_OF_MEN_PRODUCTION_GUARD_OK raw=0 playable=0 wrong_player_fetches=0')
          PY
      - name: Commit isolated candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_patches/global_stream_identity_v1.py scripts/provider_patches/anime_sama_runtime_v1.py manifest.json providers/
          git commit -m 'fix(production): block unverified Anime-Sama catalogue matches'
          git push origin HEAD:hotfix/main-52135-identity-safety
