name: Build final ARCHI2 sync trigger patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-final-sync-trigger-fix.yml'

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Make canonical sync cover every Brain change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/sync.yml')
          text = path.read_text(encoding='utf-8')
          old = "      - 'engine_v2/src/**'\n      - 'engine_v2/scripts/**'\n"
          new = "      - 'engine_v2/**'\n"
          if old not in text and new not in text:
              raise SystemExit('engine_v2 push trigger anchor not found')
          if old in text:
              text = text.replace(old, new, 1)

          language_path = "      - 'scripts/generate_language_manifests.py'\n"
          if language_path not in text:
              anchor = "      - 'scripts/sync_release_versions.py'\n"
              if anchor not in text:
                  raise SystemExit('language trigger anchor not found')
              text = text.replace(anchor, anchor + language_path, 1)

          package_paths = "      - 'package.json'\n      - 'package-lock.json'\n"
          if "      - 'package.json'\n" not in text:
              anchor = "      - 'provider_catalog.json'\n"
              if anchor not in text:
                  raise SystemExit('package trigger anchor not found')
              text = text.replace(anchor, anchor + package_paths, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload patched canonical workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patched-sync-yml-${{ github.run_id }}
          path: .github/workflows/sync.yml
          retention-days: 1
          if-no-files-found: error
