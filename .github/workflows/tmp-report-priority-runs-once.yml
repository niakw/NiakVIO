name: Temporary priority run reporter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-report-priority-runs-once.yml'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Remove reporter
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-report-priority-runs-once.yml
          git commit -m 'chore: remove priority reporter [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Report current priority runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUICK=$(gh run list --workflow sync.yml --branch main --limit 6 --json databaseId,headSha,status,conclusion,event,createdAt)
          LEARNING=$(gh run list --workflow brain-learning-lab.yml --branch main --limit 6 --json databaseId,headSha,status,conclusion,event,createdAt)
          gh issue comment 69 --body "PRIORITY_RUN_REPORT quick=$QUICK learning=$LEARNING"
