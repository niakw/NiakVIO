name: Record Nuvio sync run id

on:
  workflow_run:
    workflows:
      - "Check all manifests and publish Nuvio providers"
    types:
      - requested
      - in_progress
      - completed

permissions:
  contents: write

jobs:
  record:
    name: Persist Nuvio sync run id
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated status branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci-status
          fetch-depth: 1

      - name: Write run outcome without touching main
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ.get("RUN_ATTEMPT") or 1),
              "url": os.environ.get("RUN_URL"),
              "name": os.environ.get("RUN_NAME"),
              "event": os.environ.get("RUN_EVENT"),
              "status": os.environ.get("RUN_STATUS"),
              "conclusion": os.environ.get("RUN_CONCLUSION"),
              "head_sha": os.environ.get("RUN_HEAD_SHA"),
              "head_branch": os.environ.get("RUN_HEAD_BRANCH"),
              "created_at": os.environ.get("RUN_CREATED_AT"),
              "updated_at": os.environ.get("RUN_UPDATED_AT"),
          }
          target = Path(".github/last-sync-run.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-sync-run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Nuvio sync run state"
          git push origin HEAD:ci-status

  cleanup:
    name: Remove temporary run instrumentation after successful deep push
    needs: record
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final main state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Remove recorder and refresh final release hashes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-outcome.yml
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add -A .github/workflows/sync-outcome.yml FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "chore: remove temporary sync run instrumentation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
