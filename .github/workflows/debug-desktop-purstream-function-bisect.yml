name: Debug Desktop Purstream function bisect

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-function-bisect.yml"

permissions:
  contents: read

jobs:
  function-bisect:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage focused Purstream function variants
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          row=next(r for r in manifest["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=(root/row["filename"]).read_text(encoding="utf-8")
          desktop=text.find("/* NUVIO_DESKTOP_RUNTIME_COMPAT_V1:")
          tv=text.find("/* NUVIO_PURSTREAM_TV_IDENTITY_V3:")
          if desktop<0 or tv<0 or desktop>=tv:
              raise SystemExit("Purstream floor markers missing")
          # Keep security-hardened provider + Desktop compat, but exclude every later Core wrapper.
          floor=text[:tv].rstrip()+"\n"

          def variant(name, body):
              probe=floor+"\n"+body+"\n"
              Path(name).write_text(probe,encoding="utf-8")

          common='''applyPurstreamDomain({api:"https://api.purstream.mx/api/v1",referer:"https://purstream.mx/"});'''
          literal='''[{url:"https://free.finepulfe.xyz/movies/157336-unr8i/master.m3u8",name:"pulse | 1080p | MULTI"}]'''
          meta='''{enName:"Interstellar",year:"2014",duration:"169 min"}'''

          variant("purstream-fn-10-normalize-only.js", f'''
          module.exports.getStreams=function(){{
            {common}
            return Promise.resolve(normalizeMovieSources({literal},{meta}));
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')

          variant("purstream-fn-20-sheet-raw.js", f'''
          module.exports.getStreams=function(){{
            {common}
            return fetchMovieSources(2466).then(function(rows){{
              return (rows||[]).map(function(row){{
                return {{url:row&&row.url||"",name:"RAW:"+(row&&row.name||""),title:"RAW:"+(row&&row.name||"")}};
              }});
            }});
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')

          variant("purstream-fn-30-sheet-normalized.js", f'''
          module.exports.getStreams=function(){{
            {common}
            return fetchMovieSources(2466).then(function(rows){{
              return normalizeMovieSources(rows||[],{meta});
            }});
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')

          Path("purstream-fn-99-full.js").write_text(text,encoding="utf-8")
          print("FIELD_PURSTREAM_FUNCTION_STAGE path="+row["filename"]+" floor_chars="+str(len(floor)))
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused function-bisect test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamFunctionBisectTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamFunctionBisectTest {
              @Test
              fun interstellarStages() = runBlocking {
                  val workspace=File(System.getenv("GITHUB_WORKSPACE"))
                  val variants=listOf(
                      "normalize_only" to "purstream-fn-10-normalize-only.js",
                      "sheet_raw" to "purstream-fn-20-sheet-raw.js",
                      "sheet_normalized" to "purstream-fn-30-sheet-normalized.js",
                      "full" to "purstream-fn-99-full.js",
                  )
                  val report=File(workspace,"purstream-function-bisect.txt")
                  report.writeText("")
                  for((label,file) in variants){
                      val started=System.currentTimeMillis()
                      val rows=PluginRuntime.executePlugin(
                          code=File(workspace,file).readText(),
                          tmdbId="157336",
                          mediaType="movie",
                          season=null,
                          episode=null,
                          scraperId="PURSTREAM",
                      )
                      val first=rows.firstOrNull()
                      val line="FIELD_PURSTREAM_FUNCTION_BISECT label="+label+
                          " count="+rows.size+
                          " duration_ms="+(System.currentTimeMillis()-started)+
                          " firstUrl="+(first?.url?:"")+
                          " firstName="+(first?.name?:"")
                      println(line)
                      report.appendText(line+"\n")
                  }
              }
          }
          KOTLIN

      - name: Execute function bisect
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamFunctionBisectTest'             --no-build-cache --no-configuration-cache --console=plain
          cat "$GITHUB_WORKSPACE/purstream-function-bisect.txt"
