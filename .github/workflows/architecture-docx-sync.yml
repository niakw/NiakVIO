name: DOCS - Sync Architecture DOCX

on:
  push:
    branches: [main]
    paths:
      - ARCHITECTURE.md
      - scripts/build_architecture_docx.py
      - .github/workflows/architecture-docx-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Regenerate architecture document
        run: python scripts/build_architecture_docx.py

      - name: Commit synchronized DOCX
        shell: bash
        run: |
          if git diff --quiet -- ARCHITECTURE.docx; then
            echo "ARCHITECTURE.docx already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.docx
          git commit -m "docs: regenerate architecture document"
          git push origin HEAD:main
