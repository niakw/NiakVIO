name: TEMP - AnimeSamaCo Keyword Proof

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-animesamaco-keyword-proof.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize AnimeSamaCo only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_non_display_recovery_html_security_v1.py
          python3 scripts/upgrade_non_display_recovery_html_security_v1.py
          python3 scripts/register_non_display_recovery_v1.py
          python3 tests/animesamaco_non_display_player_discovery_v2_test.py
          python3 tests/provider_html_filter_security_test.py
          python3 scripts/materialize_provider_v3_one.py animesama-co
          node --check "$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json'))
          print(next(r['filename'] for r in d['scrapers'] if str(r.get('id','')).lower()=='animesama-co'))
          PY
          )"
      - name: Prove DxD parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          fx={'slug':'high-school-dxd-2012-s01e01','tmdbId':'45950','mediaType':'anime','category':'anime','title':'High School DxD','year':2012,'season':1,'episode':1}
          local=p.local_catalog()['animesama-co']; ups,_=v2.upstream_catalog(); up=ups['animesama-co']
          with tempfile.TemporaryDirectory() as td:
            path=pathlib.Path(td)/'up.js';path.write_bytes(p.get_bytes(up['url']))
            lo=v3._run_verified(local['path'],v3.fixture_payload(fx,'anime',upstream=False),30)
            ur=v3._run_verified(path,v3.fixture_payload(fx,'anime',upstream=True),30)
            status,semantic=v3.classify_pair_with_semantic_guard('animesama-co',fx,path,ur,lo,30)
          out={'classification':status,'localStreams':lo.get('stream_count'),'localTerminal':lo.get('terminal_verified'),'localHttp':lo.get('http_statuses'),'localReasons':lo.get('terminal_reasons'),'upstreamStreams':ur.get('stream_count'),'upstreamTerminal':ur.get('terminal_verified'),'upstreamHttp':ur.get('http_statuses'),'semantic':semantic}
          print('ANIMESAMACO_DXD_KEYWORD_PROOF '+json.dumps(out,sort_keys=True))
          if status=='upstream_ok_niakvio_ko': raise SystemExit('AnimeSamaCo DxD regression remains')
          if not lo.get('terminal_verified'):
            raise SystemExit('AnimeSamaCo DxD is not locally terminal-positive')
          PY
