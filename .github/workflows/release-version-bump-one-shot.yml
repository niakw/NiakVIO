name: ONE-SHOT - Finalize Repair Release Version

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-version-bump.json'

permissions:
  contents: write

concurrency:
  group: one-shot-release-version-bump
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRE_PROMOTION_SHA: 0505c057eefb778a9fe4aea11383d90e243e6315
      NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Finalize client-visible release versions
        shell: bash
        run: |
          set -euo pipefail
          git show "${PRE_PROMOTION_SHA}:manifest.json" > /tmp/previous-manifest.json
          python scripts/sync_release_versions.py --previous /tmp/previous-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('manifest.json'),Path('vf/manifest.json'),Path('no-anime/manifest.json'),Path('vf-no-anime/manifest.json')]
          versions=[]
          for path in paths:
              data=json.loads(path.read_text(encoding='utf-8'))
              versions.append(data.get('version'))
          assert versions == ['5.21.42'] * 4, versions
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows=manifest.get('scrapers') or []
          assert len(rows)==96, len(rows)
          assert sum(row.get('enabled') is not False for row in rows)==96
          disposition=json.loads(Path('automation/provider-repair-disposition.json').read_text(encoding='utf-8'))
          assert disposition.get('enabledProviderCount')==96
          assert disposition.get('disabledProviderCount')==0
          assert disposition.get('stateCounts')=={'on':6,'repair':74,'off':16}
          print('RELEASE_VERSION_FINALIZED version=5.21.42 providers=96 enabled=96')
          PY
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit atomically and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "VERSION_BUMP_ABORTED main_advanced trigger=$GITHUB_SHA current=$current" >&2
            exit 1
          fi
          rm -f .github/workflows/release-version-bump-one-shot.yml .github/triggers/release-version-bump.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(release): finalize 5.21.42 client-visible version'
          git push origin HEAD:main
