name: BRAIN - Catalogue Source Memory Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-catalogue-adapter-integration.yml'
      - 'scripts/assert_brain_catalogue_integration.py'
      - 'automation/brain-pinned-source.json'
      - 'automation/brain-catalogue-source-probe-history.json'
      - 'brain-llm'

permissions:
  contents: read

concurrency:
  group: brain-catalogue-adapter-integrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Select pinned external Brain SHA from this exact NiakVIO commit
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha="$(python -c 'import json; print(json.load(open("automation/brain-pinned-source.json"))["sha"])')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO-Brain-LLM
          ref: ${{ steps.pinned.outputs.sha }}
          path: brain-replay
          fetch-depth: 1
          persist-credentials: false
      - name: Prove source memory reaches the real Brain request with no authority
        run: |
          set -euo pipefail
          python -m py_compile scripts/assert_brain_catalogue_integration.py
          python scripts/assert_brain_catalogue_integration.py
