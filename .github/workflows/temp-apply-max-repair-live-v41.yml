name: TEMP - Apply Max Repair Live V41
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-apply-max-repair-live-v41.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-prove-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Apply and materialize V41 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_max_repair_live_contracts_v6.py
          python3 -m py_compile \
            scripts/provider_patches/anikototv_runtime_v3.py \
            scripts/provider_patches/sekai_inline_media_runtime_v1.py \
            scripts/provider_patches/yflix_current_runtime_v2.py \
            scripts/upgrade_max_repair_live_contracts_v6.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
      - name: Probe materialized providers in isolated Node processes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v41-probe.cjs <<'NODE'
          const fs=require('fs'),path=require('path'),{spawn}=require('child_process');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          function providerFile(pid){const rows=(manifest.scrapers||[]).filter(x=>String(x&&x.id||'').toLowerCase()===String(pid).toLowerCase());if(rows.length!==1)throw new Error(`manifest:${pid}:${rows.length}`);const f=path.resolve(String(rows[0].filename||''));if(!fs.existsSync(f))throw new Error(`missing:${pid}:${f}`);return f}
          const specs={
            sekai:{pid:'sekai',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
            streamzo:{pid:'streamzo',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:3},
            anikoto:{pid:'anikototv',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
            yflix_movie:{pid:'yflix',id:'157336',type:'movie',title:'Interstellar',year:'2014',season:1,episode:1},
            yflix_tv:{pid:'yflix',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
          };
          function metadata(s){return s.type==='movie'?{id:Number(s.id),title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{id:Number(s.id),name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function verify(row){const u=String(row&&row.url||'');if(!/^https?:\/\//i.test(u))return{ok:false,status:0,kind:'non-http'};const correlated=!!(row&&row.__nuvioCorrelatedPlayerFallbackV1);const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const headers=Object.assign({},row&&row.headers||{});if(correlated){const r=await fetch(u,{headers,redirect:'follow',signal:c.signal});const ct=r.headers.get('content-type')||'',body=await r.text();return{ok:r.ok&&/html/i.test(ct)&&body.length>200,status:r.status,kind:'embed',ctype:ct,bytes:body.length,final:r.url,correlated:true}}
            if(/\.m3u8(?:[?#]|$)/i.test(u)){const r=await fetch(u,{headers,redirect:'follow',signal:c.signal});const ct=r.headers.get('content-type')||'',body=await r.text();return{ok:r.ok&&body.includes('#EXTM3U'),status:r.status,kind:'hls',ctype:ct,bytes:body.length,final:r.url,correlated:false}}
            headers.Range='bytes=0-1023';const r=await fetch(u,{headers,redirect:'follow',signal:c.signal});const ct=r.headers.get('content-type')||'',buf=Buffer.from(await r.arrayBuffer());return{ok:(r.status===200||r.status===206)&&buf.length>0&&(/video|octet-stream|matroska/i.test(ct)||/\.(?:mp4|mkv|webm)(?:[?#]|$)/i.test(u)),status:r.status,kind:'binary',ctype:ct,bytes:buf.length,final:r.url,correlated:false}
          }catch(e){return{ok:false,status:0,kind:correlated?'embed':'media',correlated,error:String(e&&e.message||e)}}finally{clearTimeout(t)}}
          async function child(label){const s=specs[label],file=providerFile(s.pid),m=metadata(s),ns=s.type==='movie'?'movie':'tv';globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m,canonicalMediaType:s.type,season:s.season,episode:s.episode};globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};globalThis.__nuvioProviderDeadlineMs=Date.now()+26000;let rows=[],error='';try{const mod=require(file);rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider_timeout')),27000))])}catch(e){error=String(e&&e.message||e)}rows=Array.isArray(rows)?rows:[];const proofs=[];for(const r of rows.slice(0,4))proofs.push(await verify(r));const out={label,pid:s.pid,count:rows.length,urls:rows.slice(0,5).map(r=>String(r&&r.url||'')),titles:rows.slice(0,5).map(r=>String(r&&r.title||r&&r.name||'')),privateProof:rows.some(r=>!!(r&&r.__nuvioCorrelatedPlayerFallbackV1)),terminalOk:proofs.some(p=>p.ok&&!p.correlated),embedOk:proofs.some(p=>p.ok&&p.correlated),proofs,error};console.log('CHILD_RESULT\t'+JSON.stringify(out))}
          function run(label){return new Promise(resolve=>{const cp=spawn(process.execPath,[__filename,'--child',label],{cwd:process.cwd(),stdio:['ignore','pipe','pipe']});let out='',err='';cp.stdout.on('data',d=>out+=d);cp.stderr.on('data',d=>err+=d);const timer=setTimeout(()=>cp.kill('SIGKILL'),35000);cp.on('close',(code,signal)=>{clearTimeout(timer);const line=out.split(/\r?\n/).find(x=>x.startsWith('CHILD_RESULT\t'));let row=null;try{row=line?JSON.parse(line.slice(13)):null}catch{}if(!row)row={label,pid:specs[label].pid,count:0,terminalOk:false,embedOk:false,urls:[],proofs:[],error:`child_failed code=${code} signal=${signal} stderr=${err.slice(-1200)}`};console.log('V41_PROBE',JSON.stringify(row));resolve(row)})})}
          async function identity(type,id,title){try{const r=await fetch(`https://enc-dec.app/db/flix/find?tmdb_id=${id}&type=${type}`,{headers:{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145.0.0.0 Safari/537.36','Accept':'application/json'}}),j=await r.json(),row=Array.isArray(j)?j[0]:j,info=row&&row.info||{};return{type,id,status:r.status,ok:r.ok&&String(info.tmdb_id)===String(id)&&String(info.type).toLowerCase()===type&&String(info.title_en||'').toLowerCase()===title.toLowerCase(),title:info.title_en,upstreamType:info.type}}catch(e){return{type,id,status:0,ok:false,error:String(e&&e.message||e)}}}
          async function parent(){const result={};for(const label of Object.keys(specs))result[label]=await run(label);result.yflixIdentityMovie=await identity('movie','157336','Interstellar');result.yflixIdentityTv=await identity('tv','1396','Breaking Bad');console.log('YFLIX_IDENTITY',JSON.stringify(result.yflixIdentityMovie));console.log('YFLIX_IDENTITY',JSON.stringify(result.yflixIdentityTv));fs.writeFileSync('/tmp/v41.json',JSON.stringify(result,null,2));console.log('V41_SUMMARY',JSON.stringify(result,null,2))}
          if(process.argv[2]==='--child')child(process.argv[3]).then(()=>process.exit(0));else parent().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/v41-probe.cjs
      - name: Reconcile only V41 live proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          try: result=json.load(open('/tmp/v41.json'))
          except Exception: result={}
          p=Path('provider-overrides.json'); data=json.loads(p.read_text(encoding='utf-8')); rows=data.get('provider_patches') or {}
          def reason(d, code):
              codes=[str(x) for x in d.get('reasonCodes') or [] if str(x)]
              if code not in codes: codes.append(code)
              d['reasonCodes']=codes
          def terminal_proven(pid,key,lane):
              proof=result.get(key) or {}
              if not (int(proof.get('count') or 0)>0 and proof.get('terminalOk') is True): return False
              row=rows.get(pid) or {}; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {'schemaVersion':1,'authority':'provider-repair-disposition-v1'}
              req=[str(x) for x in d.get('requiredLanes') or []]; proven=set(str(x) for x in d.get('provenLanes') or []); proven.add(lane)
              ordered=[x for x in req if x in proven]
              if lane not in ordered: ordered.append(lane)
              d['provenLanes']=ordered; d['currentVerifiedLanes']=list(ordered); d['missingLanes']=[x for x in req if x not in proven]; d['completeCapabilityProof']=not d['missingLanes']; d['recoveryStatus']='proven' if not d['missingLanes'] else 'repair'; d['quarantined']=False; d['terminalState']=None
              ls=d.get('laneStatuses') if isinstance(d.get('laneStatuses'),dict) else {}; vals=[str(x) for x in ls.get(lane) or []]
              if 'playable_verified' not in vals: vals.append('playable_verified')
              ls[lane]=vals; d['laneStatuses']=ls; reason(d,'v41_current_terminal_playback_proven'); row['repair_disposition']=d; return True
          terminal_proven('sekai','sekai','anime')
          terminal_proven('streamzo','streamzo','anime')
          a=result.get('anikoto') or {}; row=rows.get('anikototv') or {}; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else None
          if d is not None and int(a.get('count') or 0)>0 and a.get('embedOk') is True:
              ls=d.get('laneStatuses') if isinstance(d.get('laneStatuses'),dict) else {}; vals=[str(x) for x in ls.get('anime') or []]
              if 'correlated_player_verified' not in vals: vals.append('correlated_player_verified')
              ls['anime']=vals; d['laneStatuses']=ls; reason(d,'v41_current_correlated_embed_verified'); d['recoveryStatus']='repair'; d['terminalState']=None; d['quarantined']=False; row['repair_disposition']=d
          y_ok=bool((result.get('yflixIdentityMovie') or {}).get('ok')) and bool((result.get('yflixIdentityTv') or {}).get('ok'))
          if y_ok:
              row=rows.get('yflix') or {}; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else None
              if d is not None: reason(d,'v41_movie_tv_namespace_identity_proven'); row['repair_disposition']=d
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V41_RECONCILED',{'sekai':result.get('sekai'),'streamzo':result.get('streamzo'),'anikoto':result.get('anikoto'),'yflixIdentity':y_ok})
          PY
          python3 scripts/validate_published_overrides.py
      - name: Persist V41 materialization and proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- provider-overrides.json providers provider-bases sources.json manifest.json scripts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: materialize standalone residual provider repairs'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
      - name: V41 proof gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/v41.json'))
          bad=[]
          for key in ('sekai','streamzo'):
              x=r.get(key) or {}
              if int(x.get('count') or 0)<1 or x.get('terminalOk') is not True: bad.append((key,x))
          a=r.get('anikoto') or {}
          if int(a.get('count') or 0)<1 or not (a.get('terminalOk') or a.get('embedOk')): bad.append(('anikoto',a))
          for key in ('yflixIdentityMovie','yflixIdentityTv'):
              if not (r.get(key) or {}).get('ok'): bad.append((key,r.get(key)))
          if bad: raise SystemExit('V41 proof failures: '+repr(bad))
          print('V41_PROOF_GATE_OK')
          PY
