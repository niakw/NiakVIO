name: TEMP - Kehflix Anime Gateway V62B

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-kehflix-anime-v62b.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Inspect Kehflix runtime patch points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          m=json.load(open('manifest.json'))
          row=next(x for x in m['scrapers'] if str(x.get('id','')).casefold()=='kehflix')
          p=Path(row['filename']); lines=p.read_text(encoding='utf-8').splitlines()
          print('V62B_FILE',p,'LINES',len(lines))
          needles=['getStreams','async get','return streams','NUVIO_GLOBAL_CORE_START_BOUNDARY_V1','__nuvioProviderBase']
          for n in needles:
              hits=[i for i,s in enumerate(lines,1) if n in s]
              print('V62B_HITS',n,hits[:30])
              for i in hits[:4]:
                  a=max(1,i-4); b=min(len(lines),i+8)
                  print(f'V62B_SNIP {n} {a}-{b}')
                  for j in range(a,b+1): print(f'{j}: {lines[j-1][:500]}')
          PY

      - name: Extract live signed key and test anime gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,html
          base='https://kehflix.wiki'
          title=base+'/title/tv/95479-jujutsu-kaisen'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,text/plain,*/*','Referer':base+'/'}
          def req(url,referer=None,timeout=18):
              h=dict(headers)
              if referer: h['Referer']=referer
              r=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      return x.status,x.read(),dict(x.headers),x.geturl()
              except Exception as e:
                  status=getattr(e,'code',0) or 0
                  try: body=e.read()
                  except Exception: body=repr(e).encode()
                  return status,body,dict(getattr(e,'headers',{}) or {}),url
          st,raw,_,_=req(title)
          text=raw.decode('utf-8','replace')
          print('V62B_TITLE',st,'LEN',len(text))
          candidates=[]
          patterns=[
            r'[?&]k=([^&"\'<>\\\s]+)',
            r'\bk\s*[:=]\s*["\']([^"\']{20,})["\']',
            r'data-k=["\']([^"\']+)["\']',
            r'([A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})',
          ]
          for pat in patterns:
              for v in re.findall(pat,text):
                  v=html.unescape(urllib.parse.unquote(str(v))).strip()
                  if v and v not in candidates: candidates.append(v)
          print('V62B_K_CANDIDATES',len(candidates),[x[:80] for x in candidates[:12]])
          good=None; payload=None
          for k in candidates[:30]:
              qs=urllib.parse.urlencode({'id':'95479','season':'1','episode':'1','k':k})
              url=base+'/api/streams/episode?'+qs
              s,b,h,_=req(url,title)
              body=b.decode('utf-8','replace')
              print('V62B_EP_TRY',s,k[:70],body[:180].replace('\n',' '))
              if s==200:
                  try:
                      d=json.loads(body)
                      if isinstance(d,(dict,list)):
                          good=k; payload=d; break
                  except Exception: pass
          if good is None:
              raise SystemExit('V62B no valid signed episode key found')
          print('V62B_VALID_K',good[:100])
          urls=[]
          stack=[payload]
          while stack:
              v=stack.pop()
              if isinstance(v,dict): stack.extend(v.values())
              elif isinstance(v,list): stack.extend(v)
              elif isinstance(v,str) and v.strip().startswith('http'):
                  u=v.strip()
                  if u not in urls: urls.append(u)
          print('V62B_EP_URLS',urls)
          if not urls: raise SystemExit('V62B episode API produced no URLs')
          successes=[]
          for u in urls:
              direct_status,_,direct_headers,_=req(u,title,12)
              gw=base+'/api/stream-gw?'+urllib.parse.urlencode({'t':u})
              gs,gb,gh,gfinal=req(gw,title,18)
              ct=str(gh.get('Content-Type') or gh.get('content-type') or '')
              loc=str(gh.get('Location') or gh.get('location') or '')
              print('V62B_GATEWAY',json.dumps({'source':u,'directStatus':direct_status,'gateway':gw,'gatewayStatus':gs,'contentType':ct,'location':loc,'final':gfinal,'prefix':gb[:80].decode('utf-8','replace')},sort_keys=True))
              if gs in (200,206) and (ct.startswith('video/') or 'mpegurl' in ct.lower() or gb[:7]==b'#EXTM3U'):
                  successes.append(gw)
          print('V62B_GATEWAY_SUCCESS',len(successes),successes)
          if not successes:
              raise SystemExit('V62B gateway did not yield verified media for anime')
          PY
