name: TEMP - Telegram Discovery-Only Rebuild 96

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-raw-tmdb-route-identity.yml'

permissions:
  contents: write

jobs:
  rebuild-96:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply and prove Telegram discovery-only runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_base_runtime_v11.py
          python tests/provider_raw_tmdb_route_identity_test.py
          python tests/provider_runtime_origin_hub_separation_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python scripts/provider_base_store.py validate
          grep -Fq 'NIAKVIO_PROVIDER_RAW_TMDB_ROUTE_IDENTITY_V19' scripts/provider_base_store.py
          grep -Fq 'NIAKVIO_PROVIDER_RUNTIME_SEARCH_HUB_SEPARATION_V21_1' scripts/provider_base_store.py
          grep -Fq 'NIAKVIO_PROVIDER_TELEGRAM_DISCOVERY_ONLY_DATA_V21_2' scripts/provider_base_store.py
          grep -Fq 'NIAKVIO_PROVIDER_TELEGRAM_DISCOVERY_ONLY_RUNTIME_V21_2' scripts/provider_base_store.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from resolve_provider_hubs import _default_source_type
          assert _default_source_type('https://t.me/s/allwishme', 'latest_telegram_domain') == 'telegram_public'
          assert _default_source_type('https://telegram.me/allwishme', 'telegram_description') == 'telegram_public'
          print('DOMAIN_REFRESH_TELEGRAM_HUB_OK source=telegram_public')
          PY

      - name: Materialize and validate all 96
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_provider_v3_all.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_published_provider_config.py --expected 96
          python tests/native_five_lab_coverage_test.py
          python tests/provider_js_lego_ownership_test.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/native_dual_id_identity_test.py

      - name: Allwish cross-fixture Telegram runtime gate on rebuilt artifact
        shell: bash
        run: |
          set -euo pipefail
          ALLWISH_FILE="$(python - <<'PY'
          import json
          m=json.load(open('manifest.json',encoding='utf-8'))
          rows=[r for r in m.get('scrapers',[]) if str(r.get('id','')).strip().lower()=='allwish']
          assert len(rows)==1,rows
          print(rows[0]['filename'])
          PY
          )"
          export ALLWISH_FILE
          node <<'JS'
          const p=require(require('path').resolve(process.env.ALLWISH_FILE));
          const calls=[];
          function response(status,url,body,contentType='text/plain'){
            const text=typeof body==='string'?body:JSON.stringify(body??{});
            return {ok:status>=200&&status<300,status,url,headers:{get:n=>String(n).toLowerCase()==='content-type'?contentType:''},text:async()=>text,json:async()=>typeof body==='string'?JSON.parse(body||'{}'):(body??{}),arrayBuffer:async()=>Buffer.from(text)};
          }
          const telegram=/https?:\/\/(?:[^/]+\.)?(?:t\.me|telegram\.me|telegram\.dog)(?:[:/]|$)|telesco\.pe/i;
          globalThis.TMDB_API_KEY='ci-test-key';
          globalThis.fetch=async function(input,options){
            const url=String(input&&input.url||input);calls.push(url);
            if(telegram.test(url)) throw new Error('TELEGRAM_RUNTIME_FETCH_ATTEMPT '+url);
            if(/api\.themoviedb\.org/i.test(url)){
              if(/\/tv\/1396(?:[/?]|$)/.test(url))return response(200,url,{id:1396,name:'Breaking Bad',original_name:'Breaking Bad',first_air_date:'2008-01-20',external_ids:{imdb_id:'tt0903747'}},'application/json');
              return response(200,url,{id:157336,title:'Interstellar',original_title:'Interstellar',release_date:'2014-11-05',external_ids:{imdb_id:'tt0816692'}},'application/json');
            }
            return response(404,url,'not found');
          };
          (async()=>{
            const model=p.__niakvioProviderBase||{};
            if(!String(model.officialHub||'').includes('t.me/'))throw new Error('Allwish Telegram hub metadata lost');
            const executableFields=[model.origins,model.observedUrls,model.proofSearchBases,model.proofDetailBases,model.searchRequestPlan,model.providerValuePlan,model.externalIdentityPlan];
            if(executableFields.some(v=>telegram.test(JSON.stringify(v||[]))))throw new Error('Telegram leaked into executable Provider DATA');
            const movie=await p.getStreams('157336','movie');
            const tv=await p.getStreams('1396','tv',1,1);
            const telegramCalls=calls.filter(u=>telegram.test(u));
            if(telegramCalls.length)throw new Error('Telegram runtime leak '+JSON.stringify(telegramCalls));
            if(!Array.isArray(movie)||movie.length!==0)throw new Error('Interstellar false positive '+JSON.stringify(movie));
            if(!Array.isArray(tv)||tv.length!==0)throw new Error('Breaking Bad false positive '+JSON.stringify(tv));
            console.log('ALLWISH_TELEGRAM_DISCOVERY_ONLY_OK hub_preserved=1 movie=0 tv=0 telegram_requests=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Verify manifest and provider files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('manifest.json',encoding='utf-8'))
          rows=m.get('scrapers') or []
          assert len(rows)==96,len(rows)
          assert all(bool(r.get('enabled')) for r in rows),sum(bool(r.get('enabled')) for r in rows)
          missing=[str(r.get('filename')) for r in rows if not Path(str(r.get('filename') or '')).is_file()]
          assert not missing,missing
          ids=[str(r.get('id') or '').lower() for r in rows]
          assert len(ids)==len(set(ids))==96
          print(f'REBUILT_MANIFEST_OK providers=96 enabled=96 missing=0 version={m.get("version")}')
          PY

      - name: Commit canonical source and reconstructed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/provider_base_store.py \
            manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            provider-v3-materialization.json providers/
          if git diff --cached --quiet; then
            echo 'No canonical/reconstructed changes.'
            exit 0
          fi
          git commit -m 'fix(runtime): enforce Telegram discovery-only and rebuild 96'
          git push origin HEAD:workbench/hub-matrix-46-20260911
