name: TEMP - Allwish Hub Leak Closure

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-raw-tmdb-route-identity.yml'

permissions:
  contents: write

jobs:
  allwish-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply canonical runtime migrations and build only Allwish
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_base_runtime_v11.py
          python tests/provider_raw_tmdb_route_identity_test.py
          python tests/provider_runtime_origin_hub_separation_test.py
          grep -Fq 'NIAKVIO_PROVIDER_RUNTIME_SEARCH_HUB_SEPARATION_V21_1' scripts/provider_base_store.py
          python - <<'PY'
          import json,sys
          from pathlib import Path
          ROOT=Path('.').resolve();sys.path.insert(0,str(ROOT/'scripts'))
          from materialize_provider_v3_all import provider_model
          from provider_base_store import build_clean_provider_seed,build_base_from_seed,build_provider_data_model,compose_provider_bundle
          from apply_provider_overrides import apply_overrides
          manifest=json.load(open('manifest.json',encoding='utf-8'))
          overrides=json.load(open('provider-overrides.json',encoding='utf-8'))
          knowledge=json.load(open('automation/provider-v3-static-knowledge.json',encoding='utf-8'))
          entry=next(r for r in manifest['scrapers'] if str(r.get('id','')).lower()=='allwish')
          patch=overrides['provider_patches']['allwish'];cap=overrides['provider_capabilities']['allwish'];static=knowledge['providers']['allwish']
          model=provider_model('allwish',patch,cap,static)
          seed=build_clean_provider_seed('allwish',entry,known_site=model.get('knownSite'),provider_model=model)
          base,_=build_base_from_seed('allwish',seed,overrides_path=ROOT/'provider-overrides.json')
          data=build_provider_data_model('allwish',entry,known_site=model.get('knownSite'),provider_model=model)
          bundle=compose_provider_bundle('allwish',base,data)
          bundle,_=apply_overrides('allwish',bundle,phase='discovery',include_global_core=True,config_path=ROOT/'provider-overrides.json')
          Path('/tmp/allwish.js').write_bytes(bundle)
          print('ALLWISH_MODEL',json.dumps(model,sort_keys=True))
          PY
      - name: Prove no Telegram execution for unrelated Allwish fixtures
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const p=require('/tmp/allwish.js');
          const calls=[];
          function response(status,url,body,contentType='text/plain'){
            const text=typeof body==='string'?body:JSON.stringify(body??{});
            return {ok:status>=200&&status<300,status,url,headers:{get:n=>String(n).toLowerCase()==='content-type'?contentType:''},text:async()=>text,json:async()=>typeof body==='string'?JSON.parse(body||'{}'):(body??{}),arrayBuffer:async()=>Buffer.from(text)};
          }
          globalThis.TMDB_API_KEY='ci-test-key';
          globalThis.fetch=async function(input,options){
            const url=String(input&&input.url||input);
            calls.push({url,method:String(options&&options.method||'GET'),referer:String(options&&options.headers&&options.headers.Referer||'')});
            if(/api\.themoviedb\.org/i.test(url)){
              if(/\/tv\/1396(?:[/?]|$)/.test(url))return response(200,url,{id:1396,name:'Breaking Bad',original_name:'Breaking Bad',first_air_date:'2008-01-20',external_ids:{imdb_id:'tt0903747'}},'application/json');
              return response(200,url,{id:157336,title:'Interstellar',original_title:'Interstellar',release_date:'2014-11-05',external_ids:{imdb_id:'tt0816692'}},'application/json');
            }
            return response(404,url,'not found');
          };
          (async()=>{
            const movie=await p.getStreams('157336','movie');
            const split=calls.length;
            const tv=await p.getStreams('1396','tv',1,1);
            const movieCalls=calls.slice(0,split),tvCalls=calls.slice(split);
            const telegram=calls.filter(x=>/https?:\/\/(?:www\.)?t\.me(?:[:/]|$)|telesco\.pe/i.test(x.url));
            console.log('ALLWISH_MOVIE_CALLS '+JSON.stringify(movieCalls));
            console.log('ALLWISH_TV_CALLS '+JSON.stringify(tvCalls));
            console.log('ALLWISH_TELEGRAM_CALLS '+JSON.stringify(telegram));
            if(telegram.length)throw new Error('Telegram runtime leak remains '+JSON.stringify(telegram));
            if(!Array.isArray(movie)||movie.length!==0)throw new Error('Interstellar must fail closed '+JSON.stringify(movie));
            if(!Array.isArray(tv)||tv.length!==0)throw new Error('Breaking Bad must fail closed '+JSON.stringify(tv));
            console.log('ALLWISH_HUB_EXECUTION_LEAK_CLOSED movie=0 tv=0 telegram_requests=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit canonical runtime source after proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider_base_store.py
          if git diff --cached --quiet; then
            echo 'Canonical runtime source already current.'
            exit 0
          fi
          git commit -m 'fix(runtime): exclude official hubs from search bases'
          git push origin HEAD:workbench/hub-matrix-46-20260911
