name: One-shot reconcile latest main into Provider v3 workbench

on:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - .github/workflows/zz-reconcile-main-provider-v3.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Provider v3 workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench/provider-v3-performance-playback
          fetch-depth: 0

      - name: Merge latest main and reconcile domain state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            case "$path" in
              provider-overrides.json|provider-domain-history.json) ;;
              *) echo "Unexpected merge conflict: $path" >&2; exit 42 ;;
            esac
          done

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          PROVIDERS = ("purstream", "flemmix", "frenchstream")
          ROUTING_KEYS = (
              "official_site", "official_api", "fixed_endpoint", "api_recipe",
              "domain_substitutions", "replacements", "runtime_domain_replacements",
              "manifest_overrides",
          )

          def stage_json(stage: int, path: str):
              raw = subprocess.check_output(["git", "show", f":{stage}:{path}"], text=True)
              return json.loads(raw)

          def conflicted(path: str) -> bool:
              proc = subprocess.run(["git", "ls-files", "-u", "--", path], capture_output=True, text=True)
              return bool(proc.stdout.strip())

          p = "provider-overrides.json"
          if conflicted(p):
              ours = stage_json(2, p)
              theirs = stage_json(3, p)
              op = ours.setdefault("provider_patches", {})
              tp = theirs.get("provider_patches", {})
              for provider in PROVIDERS:
                  if provider not in tp:
                      continue
                  dst = op.setdefault(provider, {})
                  src = tp[provider]
                  for key in ROUTING_KEYS:
                      if key in src:
                          dst[key] = src[key]
              Path(p).write_text(json.dumps(ours, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = "provider-domain-history.json"
          if conflicted(p):
              ours = stage_json(2, p)
              theirs = stage_json(3, p)
              ours_map = ours.get("providers") if isinstance(ours.get("providers"), dict) else ours
              theirs_map = theirs.get("providers") if isinstance(theirs.get("providers"), dict) else theirs
              for provider in PROVIDERS:
                  if provider in theirs_map:
                      ours_map[provider] = theirs_map[provider]
              if "updated_at" in theirs:
                  ours["updated_at"] = theirs["updated_at"]
              Path(p).write_text(json.dumps(ours, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git add provider-overrides.json provider-domain-history.json
          if [ "$merge_status" -ne 0 ] && git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 43
          fi

          git diff --cached --check
          git commit -m "merge: reconcile latest validated provider domains from main"
          git push origin HEAD:workbench/provider-v3-performance-playback

# touch: execute after workflow registration
