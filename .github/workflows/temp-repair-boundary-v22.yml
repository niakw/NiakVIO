name: TEMP - Repair current boundary V22

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-repair-boundary-v22.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate current Repair boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_provider_repair_boundary_v22.py
          python3 scripts/upgrade_provider_runtime_reconstruction_v21_12.py
          python3 tests/provider_repair_current_boundary_v22_test.py
          python3 tests/provider_composite_request_template_v21_8_test.py
          python3 tests/provider_player_fallback_v21_7_test.py
          python3 tests/stream_output_correlated_player_fallback_v7_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 -m py_compile scripts/run_provider_repair_fast_targeted_v20.py scripts/run_provider_repair_pipeline_v6.py
      - name: Commit orchestration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_provider_repair_fast_targeted_v20.py scripts/run_provider_repair_pipeline_v6.py
          if git diff --cached --quiet; then
            echo 'FIELD_REPAIR_BOUNDARY_V22_COMMIT changed=0'
            exit 0
          fi
          git commit -m 'fix(repair): use current V21.12 live boundary'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
