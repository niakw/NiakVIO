name: Temporary DVDPlay worker diagnostic

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/dvdplay-worker-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply HEAD guard in checkout only
        run: python scripts/tmp_fix_head_content_length_guard.py
      - name: Dump sanitized worker evidence
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.').resolve()
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in manifest.get('scrapers',[]) if str(x.get('id','')).casefold()=='dvdplay')
          fixture={'tmdbId':'157336','mediaType':'movie','title':'Interstellar','year':2014,'category':'movie'}
          context={'locale':'fr-FR','language':'fr','languages':['fr-FR','fr','en-US','en'],'platform':'android','settings':{},'storage':{},'fixtureMetadata':fixture,'networkLimits':{'maxFetches':50,'maxRedirects':5,'maxResponseBytes':5242880,'maxTotalResponseBytes':31457280,'maxDistinctHosts':30},'maxSettingsProfiles':1}
          proc=subprocess.run(['node','scripts/provider_worker.cjs',str(root/row['filename']),json.dumps(fixture),json.dumps(context)],cwd=root,capture_output=True,text=True,timeout=80)
          markers=[line for line in proc.stdout.splitlines() if line.startswith('NUVIO_HEALTH_RESULT=')]
          if not markers: raise SystemExit('missing worker result')
          result=json.loads(markers[-1].split('=',1)[1])
          safe={
            'ok':result.get('ok'),
            'stream_count':result.get('stream_count'),
            'error':result.get('error'),
            'error_details':result.get('error_details'),
            'settings_diagnostics':result.get('settings_diagnostics'),
            'invocation_diagnostics':result.get('invocation_diagnostics'),
            'network_observations':result.get('network_observations'),
            'provider_server_hosts':result.get('provider_server_hosts'),
            'provider_server_http_statuses':result.get('provider_server_http_statuses'),
          }
          print(json.dumps(safe,indent=2,ensure_ascii=False))
          PY
