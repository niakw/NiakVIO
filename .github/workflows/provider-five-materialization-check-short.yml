name: DIAG - Five Regression Materialization Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-five-materialization-check-short.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Inspect durable override authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          data=json.loads((root/'provider-overrides.json').read_text(encoding='utf-8'))
          p=data.get('provider_patches') or {}
          for pid in ('animekai','french-manga','neko-sama','voiranime','voiranime-homes'):
            row=p.get(pid) or {}
            summary={
              'providerId':pid,
              'official_site':row.get('official_site'),
              'official_hub':row.get('official_hub'),
              'search_request_plan':row.get('search_request_plan'),
              'provider_value_plan':row.get('provider_value_plan'),
              'provider_lego_scripts':row.get('provider_lego_scripts'),
              'patch_scripts':row.get('patch_scripts'),
              'domain_substitutions':row.get('domain_substitutions'),
            }
            print('OVERRIDE_AUTHORITY '+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - name: Check published override fixed point
        shell: bash
        run: |
          set +e
          python3 scripts/reapply_published_overrides.py --check --primary manifest.json
          rc=$?
          echo "REAPPLY_CHECK_RC=$rc"
          exit 0
