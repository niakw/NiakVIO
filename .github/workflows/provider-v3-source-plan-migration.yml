name: Provider v3 source-plan migration

on:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - '.github/workflows/provider-v3-source-plan-migration.yml'
      - 'scripts/migrate_provider_v3_source_plans.py'
      - 'scripts/provider_patches/anime_sama_runtime_v1.py'
      - 'tests/anime_sama_runtime_v1_test.py'

permissions:
  contents: write

concurrency:
  group: provider-v3-source-plan-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Apply source-plan migration
        run: |
          set -euo pipefail
          python scripts/migrate_provider_v3_source_plans.py
          python -m py_compile scripts/discover_candidates.py scripts/materialize_provider_v3_all.py scripts/provider_base_store.py scripts/provider_patches/anime_sama_runtime_v1.py scripts/audit_provider_v3_source_plans.py
      - name: Validate migration contracts
        run: |
          set -euo pipefail
          python tests/anime_sama_runtime_v1_test.py
          python tests/provider_patch_sibling_import_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_521_capability_regression_test.py
          python scripts/audit_provider_v3_source_plans.py
      - name: Commit migration and trigger full 96/96 refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add sources.json provider-overrides.json scripts/discover_candidates.py scripts/materialize_provider_v3_all.py scripts/provider_base_store.py automation/provider-v3-source-plan-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(provider-v3): preserve provider-local source plans'
          fi
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('.github/triggers/provider-v3-reconstruct-all.json')
          value={
            'reason':'source-plan-migration-provider-local-upstream',
            'refresh_static_knowledge':True,
            'requested_at':datetime.now(timezone.utc).isoformat(),
          }
          path.write_text(json.dumps(value, indent=2)+'\n', encoding='utf-8')
          PY
          git add .github/triggers/provider-v3-reconstruct-all.json
          git commit -m 'test(provider-v3): refresh 96 source knowledge'
          git push origin "HEAD:${GITHUB_REF_NAME}"
