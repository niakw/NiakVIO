name: VF Generation A-B Live Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vf-generation-ab-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-52136:
    name: Historical 5.21.36 live replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security and guard sanitizer contracts
        run: |
          python tests/workflow_security_policy_test.py
          python tests/published_provider_guard_test.py
      - name: Extract accepted 5.21.36 VF generations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/vf-ab
          git show b4d5bff4c2e3b8e9944c1eaaf8ae9690cb00d5cf:providers/kehflix--nuvio--064f32ab58f1fbf2.js > automation/vf-ab/kehflix-52136.js
          git show b4d5bff4c2e3b8e9944c1eaaf8ae9690cb00d5cf:providers/streamzo--nuvio--3ab1767966d7a1bc.js > automation/vf-ab/streamzo-52136.js
          node --check automation/vf-ab/kehflix-52136.js
          node --check automation/vf-ab/streamzo-52136.js
      - name: Replay historical bytes with current probe
        id: replay
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          root=Path.cwd()
          audit_spec=importlib.util.spec_from_file_location('audit', root/'scripts/audit_provider_quick_yield.py')
          audit=importlib.util.module_from_spec(audit_spec); audit_spec.loader.exec_module(audit)
          guard_spec=importlib.util.spec_from_file_location('guard', root/'scripts/audit_published_provider_guard.py')
          guard=importlib.util.module_from_spec(guard_spec); guard_spec.loader.exec_module(guard)

          tasks,_=audit.build_tasks()
          historical={
            'kehflix':'automation/vf-ab/kehflix-52136.js',
            'streamzo':'automation/vf-ab/streamzo-52136.js',
          }
          selected=[]
          for task in tasks:
            pid=guard.cid(task.get('provider_id'))
            if pid not in historical:
              continue
            row=dict(task)
            row['filename']=historical[pid]
            selected.append(row)
          rows=[audit.run(task) for task in selected]
          summary=guard.build_summary(['kehflix','streamzo'], rows)
          summary['generation']='5.21.36'
          summary['sourceCommit']='b4d5bff4c2e3b8e9944c1eaaf8ae9690cb00d5cf'
          out=root/'automation/vf-generation-ab-52136.json'
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          for provider,value in summary['providers'].items():
            lanes=','.join(f"{r['mediaType']}:{r['status']}:{r['playable']}/{r['verified']}/{r['contradictions']}" for r in value['lanes'])
            print(f"FIELD_VF_AB_52136 provider={provider} status={value['status']} lanes={lanes}")
          print('FIELD_VF_AB_52136_RESULT ok='+str(summary['allRequestedLanesVerified']).lower())
          raise SystemExit(0 if summary['allRequestedLanesVerified'] else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vf-generation-ab-52136-${{ github.run_id }}
          path: automation/vf-generation-ab-52136.json
          retention-days: 14
          if-no-files-found: error
      - name: Report replay outcome
        if: always()
        run: echo "historical_52136_outcome=${{ steps.replay.outcome }}"
