name: Native Desktop reader acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/nuvio-client-lab.json"
      - "manifest.json"
      - "vf/manifest.json"
      - "provider_catalog.json"
      - "provider-overrides.json"
      - "providers/**"
      - "sources.json"
      - "automation/nuvio-client-upstreams.json"
      - "automation/platform-runtime-contracts.json"
      - "automation/PLATFORM-RUNTIME-CONTRACTS.md"
      - "scripts/render_platform_runtime_contracts.py"
      - "scripts/apply_runtime_capability_upgrade_v4.py"
      - "scripts/core_rebuild_safety.py"
      - "scripts/normalize_repository_docs.py"
      - "scripts/normalize_runtime_repository_dependencies.py"
      - "scripts/normalize_provider_rebuild_safety.py"
      - "scripts/normalize_core_fixed_point_contract.py"
      - "scripts/normalize_provider_branding_pipeline.py"
      - "scripts/normalize_core_media_policy.py"
      - "scripts/normalize_stream_presentation_v12.py"
      - "scripts/provider_purification.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/provider_patches/global_stream_presentation_v1.py"
      - "engine_v2/scripts/terser-clean.mjs"
      - "engine_v2/src/runtime-adapters.mjs"
      - "engine_v2/src/stream-presentation.mjs"
      - "engine_v2/tests/runtime-adapters.test.mjs"
      - "engine_v2/tests/stream-presentation.test.mjs"
      - "tests/global_stream_presentation_test.py"
      - "tests/nuvio_client_upstream_drift_guard_test.py"
      - "scripts/gate_native_stream_extraction.cjs"
      - "tests/native_stream_extraction_gate_test.py"
      - "tests/native_desktop_runtime_diagnostics_order_test.py"
      - "scripts/check_nuvio_client_upstreams.py"
      - "scripts/resolve_nuvio_lab_heads.py"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/augment_native_corpus_request_contract.py"
      - "scripts/augment_native_provider_loading.py"
      - "scripts/augment_native_provider_loading_compat.py"
      - "scripts/resolve_native_repository.sh"
      - "scripts/prepare_native_candidate_repository.py"
      - "scripts/augment_native_desktop_runtime_diagnostics.py"
      - "scripts/augment_native_desktop_player.py"
      - "scripts/complete_native_desktop_frontend_phases.py"
      - "scripts/instrument_native_client_evidence.py"
      - "scripts/instrument_native_repository_http_evidence.py"
      - "scripts/instrument_native_desktop_evidence.py"
      - "scripts/nuvio_desktop_test_jvm.init.gradle"
      - "scripts/run_native_corpus_desktop_suite.sh"
      - "scripts/analyze_native_corpus_collection.cjs"
      - "scripts/analyze_native_corpus_results.cjs"
      - "scripts/native_fixture_identity_guard.cjs"
      - "scripts/gate_native_reader_coverage.cjs"
      - "scripts/gate_native_reader_result.cjs"
      - "scripts/gate_native_player_reached.cjs"
      - "scripts/native_evidence_completeness.cjs"
      - "engine_v2/scripts/diagnose-native-reader.mjs"
      - ".github/workflows/native-desktop-reader-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

# Main revisions are latest-wins. Explicit workflow_dispatch runs stay isolated
# because the final orchestrator may watch one exact dispatch as authoritative proof.
concurrency:
  group: native-desktop-reader-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'main-push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      desktop_sha: ${{ steps.refs.outputs.desktop_sha }}
      runtime_fingerprint: ${{ steps.refs.outputs.runtime_fingerprint }}
      desktop_drift_status: ${{ steps.refs.outputs.desktop_drift_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate consolidated Desktop contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_platform_runtime_contracts.py --check
          python3 tests/native_stream_extraction_gate_test.py
          python3 tests/native_desktop_runtime_diagnostics_order_test.py
          python3 tests/nuvio_client_upstream_drift_guard_test.py
      - name: Inspect current official Nuvio client drift
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_nuvio_client_upstreams.py \
            --no-fail \
            --output health-output/nuvio-client-upstream-status.json
      - id: refs
        name: Resolve latest official Desktop client HEAD
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/resolve_nuvio_lab_heads.py \
            --report health-output/nuvio-client-upstream-status.json \
            --clients nuvio-desktop \
            --github-output "$GITHUB_OUTPUT" \
            --output health-output/nuvio-desktop-lab-head.json
      - name: Publish Nuvio Desktop runtime audit context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuvio-desktop-lab-head-${{ github.run_id }}
          path: |
            health-output/nuvio-client-upstream-status.json
            health-output/nuvio-desktop-lab-head.json
          retention-days: 1
          if-no-files-found: error

  desktop-reader:
    needs: resolve
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os_name: macos
          - runner: windows-2022
            os_name: windows
    runs-on: ${{ matrix.runner }}
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      NIAKVIO_TARGET_PROVIDER: declared-type
      NIAKVIO_TARGET_MANIFEST: manifest.json
      NIAKVIO_PRIMARY_STREAM_SCOPE: all
      NIAKVIO_REGRESSION_STREAM_SCOPE: all
      # Reader/player outcomes are evidence for Brain/Deep. A failed playback or
      # failed repair never freezes this Lab; only real setup/infra/contract errors do.
      NIAKVIO_REQUIRE_READER_SUCCESS: "0"
    steps:
      - name: Checkout NiakVIO candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

        with:

          cache-disabled: true

      - name: Checkout latest official NuvioDesktop HEAD and stage initial route
        shell: bash
        env:
          NUVIO_DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          git -C nuvio-desktop lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/**,composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          touch nuvio-desktop/local.properties
          python3 niakvio/scripts/prepare_native_corpus_client.py desktop --fixture interstellar --workspace "$GITHUB_WORKSPACE" --manifest manifest.json --provider declared-type

      - name: Install official Windows WebView2 build dependency
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2Loader.dll.lib missing from $root"
          }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build official macOS native player bridge once
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop \
            :composeApp:buildMacosPlayerBridge \
            :composeApp:prepareMacosPlayerRuntime \
            --no-configuration-cache --console=plain

      - name: Build official Windows native player bridge once
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          & .\nuvio-desktop\gradlew.bat -p nuvio-desktop `
            :composeApp:buildWindowsPlayerBridge `
            :composeApp:prepareWindowsPlayerRuntime `
            :composeApp:generateWindowsPlayerRuntimeIndex `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute representative routes and accumulate player evidence
        shell: bash
        run: |
          set -u
          FIXTURES=(interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01)
          printf '%s\n' "${FIXTURES[@]}" > "$GITHUB_WORKSPACE/desktop-fixtures-${{ matrix.os_name }}.txt"
          for fixture in "${FIXTURES[@]}"; do
            echo "===== DESKTOP ROUTE: $fixture (${{ matrix.os_name }}) ====="
            NIAKVIO_TARGET_FIXTURE="$fixture" \
            NIAKVIO_PRIMARY_FIXTURE="$fixture" \
              bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_desktop_suite.sh" || true
          done
          LOGS=()
          for fixture in "${FIXTURES[@]}"; do
            LOG="$GITHUB_WORKSPACE/desktop-native-corpus-${{ matrix.os_name }}-${fixture}.log"
            [[ -f "$LOG" ]] && LOGS+=("$LOG")
          done
          # Missing/corrupt Lab logs remain infra-fatal. A valid log with no player
          # reach is emitted as owner=brain/blocking=false and returns success.
          node "$GITHUB_WORKSPACE/niakvio/scripts/gate_native_player_reached.cjs" "${LOGS[@]}"

      - name: Build Desktop Brain diagnoses from captured evidence
        if: always()
        shell: bash
        env:
          NIAKVIO_BRAIN_NONBLOCKING: "1"
        run: |
          set -u
          FIXTURE_FILE="$GITHUB_WORKSPACE/desktop-fixtures-${{ matrix.os_name }}.txt"
          if [[ ! -s "$FIXTURE_FILE" ]]; then
            printf '%s\n' interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01 > "$FIXTURE_FILE"
          fi
          while IFS= read -r fixture; do
            [[ -n "$fixture" ]] || continue
            LOG="$GITHUB_WORKSPACE/desktop-native-corpus-${{ matrix.os_name }}-${fixture}.log"
            if [ ! -s "$LOG" ]; then
              echo "Missing Desktop reader evidence: $LOG" >&2
              continue
            fi
            node niakvio/engine_v2/scripts/diagnose-native-reader.mjs \
              --output "$GITHUB_WORKSPACE/desktop-reader-${{ matrix.os_name }}-${fixture}-brain.json" \
              "$LOG" || echo "FIELD_NATIVE_BRAIN_DIAGNOSIS status=unresolved blocking=false owner=brain fixture=$fixture os=${{ matrix.os_name }}"
          done < "$FIXTURE_FILE"

      - name: Materialize final Core fixed-point for Desktop canary
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/niakvio"
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/normalize_repository_docs.py --apply
          python3 scripts/normalize_runtime_repository_dependencies.py --apply
          python3 scripts/normalize_provider_rebuild_safety.py --apply
          python3 scripts/normalize_core_fixed_point_contract.py --apply
          python3 scripts/normalize_provider_branding_pipeline.py --apply
          python3 scripts/normalize_core_media_policy.py --apply
          python3 scripts/apply_runtime_capability_upgrade_v4.py
          python3 scripts/build_provider_runtime_profiles.py
          converged=0
          for pass in 1 2 3 4 5 6; do
            echo "FIELD_DESKTOP_CANARY_REBUILD_CONVERGENCE pass=$pass"
            python3 scripts/reapply_published_overrides.py
            if python3 scripts/reapply_published_overrides.py --check; then
              converged=1
              echo "FIELD_DESKTOP_CANARY_REBUILD_CONVERGENCE converged_at=$pass"
              break
            fi
          done
          test "$converged" -eq 1
          python3 scripts/normalize_runtime_repository_dependencies.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 tests/global_stream_presentation_test.py
          node engine_v2/tests/runtime-adapters.test.mjs
          node engine_v2/tests/stream-presentation.test.mjs
          hits="$(grep -l 'NUVIO_GLOBAL_RUNTIME_COMPAT_V1' providers/*.js | wc -l | tr -d ' ')"
          test "$hits" -ge 3
          echo "FIELD_DESKTOP_CANARY_CORE_MATERIALIZED runtime_compat_providers=$hits"

      - name: Upload Desktop reader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-desktop-reader-${{ matrix.os_name }}-routes-${{ github.run_id }}
          path: |
            desktop-native-corpus-${{ matrix.os_name }}-*.log
            desktop-native-gradle-${{ matrix.os_name }}-*.log
            desktop-reader-${{ matrix.os_name }}-*-brain.json
            desktop-fixtures-${{ matrix.os_name }}.txt
            native-evidence/desktop/**
          retention-days: 1
          if-no-files-found: warn
