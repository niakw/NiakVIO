name: Native Desktop reader acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-desktop-reader-acceptance.yml"
      - ".github/triggers/nuvio-client-lab.json"
      - "manifest.json"
      - "vf/manifest.json"
      - "provider_catalog.json"
      - "provider-overrides.json"
      - "providers/**"
      - "sources.json"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/augment_native_corpus_request_contract.py"
      - "scripts/augment_native_provider_loading.py"
      - "scripts/resolve_native_repository.sh"
      - "scripts/prepare_native_candidate_repository.py"
      - "scripts/augment_native_desktop_player.py"
      - "scripts/complete_native_desktop_frontend_phases.py"
      - "scripts/instrument_native_client_evidence.py"
      - "scripts/instrument_native_repository_http_evidence.py"
      - "scripts/instrument_native_desktop_evidence.py"
      - "scripts/run_native_corpus_desktop_suite.sh"
      - "scripts/analyze_native_corpus_collection.cjs"
      - "scripts/analyze_native_corpus_results.cjs"
      - "scripts/gate_native_reader_coverage.cjs"
      - "scripts/gate_native_reader_result.cjs"
      - "scripts/native_evidence_completeness.cjs"
      - "engine_v2/scripts/diagnose-native-reader.mjs"
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "vf/manifest.json"
      - "provider_catalog.json"
      - "provider-overrides.json"
      - "providers/**"
      - "sources.json"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/augment_native_corpus_request_contract.py"
      - "scripts/augment_native_provider_loading.py"
      - "scripts/resolve_native_repository.sh"
      - "scripts/prepare_native_candidate_repository.py"
      - "scripts/augment_native_desktop_player.py"
      - "scripts/complete_native_desktop_frontend_phases.py"
      - "scripts/instrument_native_client_evidence.py"
      - "scripts/instrument_native_repository_http_evidence.py"
      - "scripts/instrument_native_desktop_evidence.py"
      - "scripts/run_native_corpus_desktop_suite.sh"
      - "scripts/analyze_native_corpus_collection.cjs"
      - "scripts/analyze_native_corpus_results.cjs"
      - "scripts/gate_native_reader_coverage.cjs"
      - "scripts/gate_native_reader_result.cjs"
      - "scripts/native_evidence_completeness.cjs"
      - "engine_v2/scripts/diagnose-native-reader.mjs"
      - ".github/workflows/native-desktop-reader-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop_sha: ${{ steps.refs.outputs.desktop_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data=json.loads(Path('sources.json').read_text())
          ref=str((((data.get('nuvio_client_compatibility') or {}).get('clients') or {}).get('nuvio-desktop') or {}).get('accepted_ref') or '')
          if len(ref) != 40: raise SystemExit(f'missing accepted NuvioDesktop ref: {ref!r}')
          print(f'desktop_sha={ref}')
          PY

  desktop-reader:
    needs: resolve
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os_name: macos
            fixture: sinners-2025
          - runner: macos-15
            os_name: macos
            fixture: breaking-bad-s01e01
          - runner: macos-15
            os_name: macos
            fixture: jujutsu-kaisen-s01e01
          - runner: windows-2022
            os_name: windows
            fixture: sinners-2025
          - runner: windows-2022
            os_name: windows
            fixture: breaking-bad-s01e01
          - runner: windows-2022
            os_name: windows
            fixture: jujutsu-kaisen-s01e01
    runs-on: ${{ matrix.runner }}
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      NIAKVIO_TARGET_FIXTURE: ${{ matrix.fixture }}
      NIAKVIO_TARGET_PROVIDER: all
      NIAKVIO_TARGET_MANIFEST: manifest.json
      NIAKVIO_PRIMARY_FIXTURE: ${{ matrix.fixture }}
      NIAKVIO_PRIMARY_STREAM_SCOPE: all
      NIAKVIO_REGRESSION_STREAM_SCOPE: all
      NIAKVIO_REQUIRE_READER_SUCCESS: "1"
    steps:
      - name: Checkout NiakVIO candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Checkout accepted official NuvioDesktop and stage all providers
        shell: bash
        env:
          NUVIO_DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          git -C nuvio-desktop lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/**,composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          touch nuvio-desktop/local.properties
          python3 niakvio/scripts/prepare_native_corpus_client.py desktop --fixture "${NIAKVIO_TARGET_FIXTURE}" --workspace "$GITHUB_WORKSPACE" --manifest manifest.json

      - name: Install official Windows WebView2 build dependency
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2Loader.dll.lib missing from $root"
          }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build official macOS native player bridge
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop \
            :composeApp:buildMacosPlayerBridge \
            :composeApp:prepareMacosPlayerRuntime \
            --no-configuration-cache --console=plain
          echo "JAVA_TOOL_OPTIONS=--add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/sun.lwawt=ALL-UNNAMED --add-opens=java.desktop/sun.lwawt.macosx=ALL-UNNAMED" >> "$GITHUB_ENV"

      - name: Build official Windows native player bridge
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          & .\nuvio-desktop\gradlew.bat -p nuvio-desktop `
            :composeApp:buildWindowsPlayerBridge `
            :composeApp:prepareWindowsPlayerRuntime `
            :composeApp:generateWindowsPlayerRuntimeIndex `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JAVA_TOOL_OPTIONS=--add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt.windows=ALL-UNNAMED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute every returned stream in official Desktop reader
        shell: bash
        run: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_desktop_suite.sh"

      - name: Build Desktop Brain diagnosis only from complete evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$GITHUB_WORKSPACE"/desktop-native-corpus-${{ matrix.os_name }}-*.log)
          if [ "${#logs[@]}" -eq 0 ]; then echo "No Desktop reader evidence." >&2; exit 2; fi
          node niakvio/engine_v2/scripts/diagnose-native-reader.mjs \
            --output "$GITHUB_WORKSPACE/desktop-reader-${{ matrix.os_name }}-${{ matrix.fixture }}-brain.json" \
            "${logs[@]}"

      - name: Upload Desktop reader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-desktop-reader-${{ matrix.os_name }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: |
            desktop-native-corpus-${{ matrix.os_name }}-*.log
            desktop-native-gradle-${{ matrix.os_name }}-*.log
            desktop-reader-${{ matrix.os_name }}-${{ matrix.fixture }}-brain.json
            native-evidence/desktop/**
          retention-days: 7
          if-no-files-found: warn
