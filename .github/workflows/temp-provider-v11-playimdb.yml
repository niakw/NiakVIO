name: TEMP - Provider V11 PlayIMDb

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/provider-v11-playimdb.json'

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  playimdb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply absolute recipe runtime V11
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_base_runtime_v11.py
          python -m py_compile scripts/upgrade_provider_base_runtime_v11.py scripts/run_provider_repair_pipeline_v6.py
      - name: Run PlayIMDb through canonical repair pipeline
        run: |
          set -euo pipefail
          python scripts/run_provider_repair_pipeline_v6.py --mode repair --provider playimdb
      - name: Upload targeted proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v11-playimdb-${{ github.run_id }}
          path: |
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-repair-yield-v6.json
            automation/provider-repair-v6-summary.json
            manifest.json
            providers/
          retention-days: 7
