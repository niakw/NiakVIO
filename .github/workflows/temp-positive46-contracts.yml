name: TEMP - Positive46 Contracts
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-positive46-contracts.yml]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/stable-46-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          python tests/provider_non_regression_contract_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/activation_preservation_core_rehash_test.py
          git diff --check
