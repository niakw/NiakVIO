name: Provider base migration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-base-migration-once.yml'
      - 'scripts/provider_base_store.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-base-migration-once
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'niakw/NiakVIO'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize durable ProviderBase store
        run: |
          set -euo pipefail
          python scripts/provider_base_store.py migrate-existing
          python scripts/provider_base_store.py validate
          test "$(find provider-bases -type f -name '*.js' | wc -l | tr -d ' ')" -eq "$(python - <<'PY'
          import json
          print(len(json.load(open('manifest.json', encoding='utf-8'))['scrapers']))
          PY
          )"

      - name: Commit bases and retire migration workflow
        run: |
          set -euo pipefail
          git config user.name "NiakVIO ProviderBase migration"
          git config user.email "actions@users.noreply.github.com"
          git add provider-bases PROVENANCE.json scripts/provider_base_store.py
          git rm .github/workflows/provider-base-migration-once.yml
          if git diff --cached --quiet; then
            echo "ProviderBase migration already complete"
            exit 0
          fi
          git commit -m "chore(providers): materialize durable ProviderBase store"
          git push origin HEAD:main
