name: NiakVIO provider fixed-point diagnostic

# one-shot diagnostic trigger: 2026-08-24T00:27+02:00
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-fixed-point-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Announce diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider fixed-point diagnostic started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}."
      - name: Diagnose exact plateau
        id: diagnose
        shell: bash
        run: |
          set +e
          python scripts/audit_provider_fixed_point.py 2>&1 | tee "$RUNNER_TEMP/provider-fixed-point.log"
          status=${PIPESTATUS[0]}
          {
            echo '### Provider fixed-point root diagnostic'
            echo
            echo '```text'
            grep -E 'FIELD_PROVIDER_FIXED_POINT_(AUDIT|PASS|ROOT|BASE_DIFF|RESULT)' "$RUNNER_TEMP/provider-fixed-point.log" | tail -n 120 || true
            echo '```'
          } > "$RUNNER_TEMP/provider-fixed-point-summary.md"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish diagnostic evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s "$RUNNER_TEMP/provider-fixed-point-summary.md" ]]; then
            gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-fixed-point-summary.md"
          else
            gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider fixed-point diagnostic produced no summary; inspect run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
      - name: Report diagnostic completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider fixed-point diagnostic ended with **${{ job.status }}** (exit=${{ steps.diagnose.outputs.exit_code || 'unknown' }}): https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
