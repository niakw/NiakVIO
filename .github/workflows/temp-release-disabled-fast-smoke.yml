name: TEMP - Release Disabled Fast Advance Smoke

on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-release-disabled-fast-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Apply source plan
        run: python scripts/upgrade_provider_v3_source_plan_v5.py
      - name: Run fast advance, adaptive retry, and active-gate contracts
        run: |
          python tests/provider_v3_disabled_fast_advance_test.py
          python tests/provider_v3_adaptive_live_retry_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
