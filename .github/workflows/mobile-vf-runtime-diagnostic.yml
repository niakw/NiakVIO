name: Diagnose Android VF runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/mobile-vf-runtime-diagnostic"

permissions:
  contents: write

concurrency:
  group: nuvio-mobile-vf-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Android-compatible runtime wrapper
        run: |
          python -m py_compile scripts/provider_patches/desktop_runtime_compat_v1.py
          python tests/desktop_runtime_compat_test.py
          node --check scripts/mobile_vf_runtime_probe.mjs

      - name: Stage prospective rev-4 runtime bundles locally
        run: python scripts/publish_desktop_runtime_compat.py

      - name: Probe VF movie providers with Nuvio Mobile contract
        id: probe
        continue-on-error: true
        env:
          NUVIO_MOBILE_REPORT: automation/mobile-vf-runtime.json
        run: node scripts/mobile_vf_runtime_probe.mjs

      - name: Preserve diagnostic report only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f automation/mobile-vf-runtime.json ]; then
            cp automation/mobile-vf-runtime.json "$RUNNER_TEMP/mobile-vf-runtime.json"
          else
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "release": None,
              "runtime_contract": "Nuvio Mobile diagnostic",
              "diagnostic_error": "probe step failed before report generation",
              "probe_outcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              "providers": [],
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "mobile-vf-runtime.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          fi
          git reset --hard HEAD
          git clean -fd
          mkdir -p automation
          cp "$RUNNER_TEMP/mobile-vf-runtime.json" automation/mobile-vf-runtime.json
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}

      - name: Publish finite diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/mobile-vf-runtime.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Android VF runtime diagnostic"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
