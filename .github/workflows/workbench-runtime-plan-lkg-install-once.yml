name: WORKBENCH - Runtime Plan LKG Install Once

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-runtime-plan-lkg-install-once.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-workbench-runtime-plan-lkg-install-once
  cancel-in-progress: false

jobs:
  install-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact install request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime-plan LKG into canonical Repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lkg = Path('scripts/provider_runtime_plan_lkg_v1.py')
          text = lkg.read_text(encoding='utf-8')
          old = '''        apply(
                      snapshot_path=snapshot,
                      knowledge_path=resolve(args.knowledge),
                      overrides_path=resolve(args.overrides),
                  )
              return 0
          '''
          new = '''        apply(
                      snapshot_path=snapshot,
                      knowledge_path=resolve(args.knowledge),
                      overrides_path=resolve(args.overrides),
                  )
                  # The LKG snapshot is a run-local bridge, never release DATA.
                  snapshot.unlink(missing_ok=True)
              return 0
          '''
          if 'snapshot.unlink(missing_ok=True)' not in text:
              if old not in text:
                  raise SystemExit('runtime-plan LKG cleanup anchor missing')
              text = text.replace(old, new, 1)
              lkg.write_text(text, encoding='utf-8')

          pipeline = Path('scripts/run_provider_repair_pipeline_v6.py')
          text = pipeline.read_text(encoding='utf-8')

          baseline_anchor = '    baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)\n'
          capture = '''    baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)
              run(
                  sys.executable,
                  "scripts/provider_runtime_plan_lkg_v1.py",
                  "capture",
                  "--baseline", str(PORTFOLIO_BASELINE.relative_to(ROOT)),
              )
          '''
          capture = '\n'.join(line[4:] if line.startswith('    ') else line for line in capture.splitlines()) + '\n'
          if '"scripts/provider_runtime_plan_lkg_v1.py",\n        "capture"' not in text:
              if text.count(baseline_anchor) != 1:
                  raise SystemExit('baseline capture anchor missing or duplicated')
              text = text.replace(baseline_anchor, capture, 1)

          apply_anchor = '    run(sys.executable, "scripts/apply_provider_route_recovery_report.py", str(MERGED_REPORT.relative_to(ROOT)))\n'
          apply_block = apply_anchor + '''    run(
                  sys.executable,
                  "scripts/provider_runtime_plan_lkg_v1.py",
                  "apply",
              )
          '''
          apply_block = '\n'.join(line[4:] if line.startswith('    ') else line for line in apply_block.splitlines()) + '\n'
          if '"scripts/provider_runtime_plan_lkg_v1.py",\n        "apply"' not in text:
              if text.count(apply_anchor) != 1:
                  raise SystemExit('route recovery apply anchor missing or duplicated')
              text = text.replace(apply_anchor, apply_block, 1)

          test_anchor = '        "tests/provider_quick_yield_fixture_selection_test.py",\n'
          test_line = test_anchor + '        "tests/provider_runtime_plan_lkg_v1_test.py",\n'
          if '"tests/provider_runtime_plan_lkg_v1_test.py"' not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('repair test-list anchor missing or duplicated')
              text = text.replace(test_anchor, test_line, 1)

          pipeline.write_text(text, encoding='utf-8')
          PY

      - name: Prove LKG safety and canonical ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/provider_runtime_plan_lkg_v1.py scripts/run_provider_repair_pipeline_v6.py
          python3 tests/provider_runtime_plan_lkg_v1_test.py
          python3 tests/provider_repair_pipeline_v6_contract_test.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/run_provider_repair_pipeline_v6.py').read_text(encoding='utf-8')
          baseline=text.index('baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)')
          capture=text.index('"scripts/provider_runtime_plan_lkg_v1.py",\n        "capture"')
          migrations=text.index('    migrations = [')
          recovery=text.index('"scripts/apply_provider_route_recovery_report.py"')
          restore=text.index('"scripts/provider_runtime_plan_lkg_v1.py",\n        "apply"')
          materialize=text.index('"scripts/materialize_provider_base_v3_store.py"')
          assert baseline < capture < migrations < recovery < restore < materialize, (baseline,capture,migrations,recovery,restore,materialize)
          lkg=Path('scripts/provider_runtime_plan_lkg_v1.py').read_text(encoding='utf-8')
          for forbidden in ('validationState', 'executedEvidence', 'httpUsed'):
              # These terms may appear in the docstring, but never as assignment targets.
              assert f'[{forbidden!r}] =' not in lkg and f'["{forbidden}"] =' not in lkg
          assert 'proofPromotion": False' in lkg
          assert 'activationAuthority": False' in lkg
          assert 'snapshot.unlink(missing_ok=True)' in lkg
          print('RUNTIME_PLAN_LKG_PIPELINE_ORDER_OK proof_promotion=0 activation_authority=0 transient_snapshot=1')
          PY

      - name: Commit verified LKG integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_runtime_plan_lkg_v1.py scripts/run_provider_repair_pipeline_v6.py
          if git diff --cached --quiet; then
            echo 'No LKG integration changes to publish'
            exit 0
          fi
          git commit -m 'fix(repair): preserve baseline-verified runtime plans'
          git fetch origin workbench/systemic-recovery-20260909
          git rebase origin/workbench/systemic-recovery-20260909
          git push origin HEAD:workbench/systemic-recovery-20260909
