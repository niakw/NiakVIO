name: TMP - V30 AniKoto Terminal
# PR trigger V30b

on:
  pull_request:
    branches:
      - tmp/v30-anikoto-terminal-base
      - tmp/v30b-anikoto-terminal-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight
        run: |
          set -euo pipefail
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 tests/materializer_authority_monotonic_v25_test.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Materialize AniKoto only
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 scripts/materialize_provider_v3_one.py anikototv
          cp manifest.json health-output/manifest-v30.json

      - name: Certify AniKoto
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider anikototv \
            --candidate-limit 3 \
            --timeout 30 \
            --workers 1 \
            --seed "v30-anikoto-${GITHUB_RUN_ID}" \
            --output health-output/v30-certification.json

      - name: Print AniKoto proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v30-certification.json').read_text())
          row=(p.get('providers') or [])[0]
          print('FIELD_V30_ANIKOTO',
                'certified='+str(bool(row.get('certified'))).lower(),
                'certifiedTypes='+','.join(row.get('certifiedTypes') or []),
                'missingTypes='+','.join(row.get('missingTypes') or []))
          for lane,lr in (row.get('lanes') or {}).items():
              for a in (lr or {}).get('attempts') or []:
                  print('FIELD_V30_ATTEMPT',lane,
                        'fixture='+str(a.get('fixtureSlug')),
                        'status='+str(a.get('status')),
                        'stage='+str(a.get('debugStage')),
                        'trace='+json.dumps(a.get('providerTrace') or [],separators=(',',':')),
                        'network='+json.dumps(a.get('networkTrace') or [],separators=(',',':')))
          PY

      - name: Upload V30 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v30-anikoto-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
