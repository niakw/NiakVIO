name: Cancel obsolete Core runs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-core-runs-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded Core runs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 32709966303 32713335848 32713623405 32714287509; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            echo "FIELD_OBSOLETE_CORE_CANCEL run=${run_id}"
          done
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Obsolete Core runs cancelled without launching another Core: 32709966303, 32713335848, 32713623405, 32714287509. Targeted validation continues on current main. Cleanup run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
