name: Apply runtime gate safety fix on main once v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-runtime-main-fix-once-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Apply gate fix
        run: python3 .github/apply-runtime-gate-fix-once.py
      - name: Verify gate fix
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/gate_native_cross_client_runtime.cjs
          node --check engine_v2/scripts/diagnose-native-reader.mjs
          python3 -m py_compile scripts/restage_native_corpus_client.py scripts/scope_native_reader_learning_runtime.py tests/native_reader_brain_repair_test.py tests/native_runtime_brain_boundary_test.py
          python3 tests/native_cross_client_runtime_gate_test.py
          python3 tests/native_reader_brain_repair_test.py
          python3 tests/native_runtime_brain_boundary_test.py
          python3 tests/native_corpus_device_lab_test.py
          python3 tests/native_reader_runtime_bootstrap_test.py
          python3 tests/repository_hygiene_contract_test.py
      - name: Publish non-workflow changes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine_v2/scripts/diagnose-native-reader.mjs scripts/scope_native_reader_learning_runtime.py tests/native_reader_brain_repair_test.py tests/native_runtime_brain_boundary_test.py
          git rm .github/apply-runtime-gate-fix-once.py
          git diff --cached --check
          git commit -m "fix(labs): block runtime divergence before Brain repair"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
