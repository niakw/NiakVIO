name: TMP - V28 Current Template Targeted

on:
  pull_request:
    branches:
      - tmp/v28-current-template-base
      - tmp/v28b-current-template-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight current-template contracts
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/materializer_authority_monotonic_v25_test.py
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_base_absolute_route_domain_substitution_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 -m py_compile scripts/materialize_provider_v3_all.py scripts/provider_base_store.py scripts/certify_provider_playable_lanes.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          python3 scripts/check_provider_repair_survival.py

      - name: Materialize from current ProviderBase template
        run: |
          set -euo pipefail
          cp manifest.json health-output/manifest-before-v28.json
          python3 scripts/materialize_provider_v3_all.py \
            --source-manifest manifest.json \
            --output-dir providers \
            --report health-output/v28-materialization.json
          cp manifest.json health-output/manifest-after-v28.json

      - name: Assert current template reached bundles
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          ids={'4khdhub','anikototv','castle','animevost-fr','showbox','anime-sama'}
          m=json.loads(Path('manifest.json').read_text())
          for row in m.get('scrapers') or []:
              pid=str(row.get('id') or '').lower()
              if pid not in ids: continue
              p=Path(str(row.get('filename') or '').replace('../',''))
              text=p.read_text()
              mm=re.search(r'(?:const|let|var)\s+NIAKVIO_PROVIDER_MODEL\s*=\s*Object\.freeze\((\{.*?\})\);',text,re.S)
              model=json.loads(mm.group(1)) if mm else {}
              print('FIELD_V28_MODEL',pid,
                    'v35='+str('NIAKVIO_PROVIDER_ABSOLUTE_ROUTE_DOMAIN_SUBSTITUTION_V35' in text).lower(),
                    'anikotoSelector='+str('/stream\\/s-' in text or 'stream\\/s-' in text).lower(),
                    'routes='+json.dumps(model.get('routes') or [],separators=(',',':')),
                    'domains='+json.dumps(model.get('domainSubstitutions') or {},separators=(',',':')),
                    'file='+str(p))
          PY

      - name: Targeted current-template certification
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider 4khdhub \
            --provider anikototv \
            --provider castle \
            --provider animevost-fr \
            --provider showbox \
            --provider anime-sama \
            --candidate-limit 12 \
            --timeout 30 \
            --workers 2 \
            --seed "v28-current-template-${GITHUB_RUN_ID}" \
            --output health-output/v28-targeted-certification.json

      - name: Summarize current-template proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v28-targeted-certification.json').read_text())
          green=[]
          for row in p.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              if gl: green.append(row.get('providerId'))
              stages=sorted({
                  str(a.get('debugStage') or '')
                  for v in lanes.values()
                  for a in (v or {}).get('attempts') or []
                  if a.get('debugStage')
              })
              hosts=sorted({
                  str(n.get('host') or '')
                  for v in lanes.values()
                  for a in (v or {}).get('attempts') or []
                  for n in a.get('networkTrace') or []
                  if n.get('host')
              })
              shapes=[]
              for v in lanes.values():
                  for a in (v or {}).get('attempts') or []:
                      for n in a.get('networkTrace') or []:
                          if n.get('jsonShape'):
                              shapes.append({'host':n.get('host'),'path':n.get('path'),'shape':n.get('jsonShape')})
              print('FIELD_V28_RESULT',row.get('providerId'),
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower(),
                    'stages='+('|'.join(stages) or '-'),
                    'hosts='+('|'.join(hosts) or '-'))
              if shapes:
                  print('FIELD_V28_SHAPES',row.get('providerId'),json.dumps(shapes[:12],separators=(',',':')))
          print('FIELD_V28_GREEN',str(len(green))+'/6',','.join(sorted(green)))
          PY

      - name: Upload V28 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v28-current-template-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
