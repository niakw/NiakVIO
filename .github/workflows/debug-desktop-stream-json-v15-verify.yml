name: Debug Desktop stream JSON V15 verify

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - "scripts/provider_patches/global_stream_presentation_v1.py"
      - "scripts/normalize_stream_presentation_v12.py"
      - "tests/global_stream_presentation_test.py"
      - ".github/workflows/debug-desktop-stream-json-v15-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Materialize current Core fixed point
        shell: bash
        run: |
          set -euxo pipefail
          cd niakvio
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/normalize_repository_docs.py --apply
          python3 scripts/normalize_runtime_repository_dependencies.py --apply
          python3 scripts/normalize_provider_rebuild_safety.py --apply
          python3 scripts/normalize_core_fixed_point_contract.py --apply
          python3 scripts/normalize_provider_branding_pipeline.py --apply
          python3 scripts/normalize_core_media_policy.py --apply
          python3 scripts/apply_runtime_capability_upgrade_v4.py
          python3 scripts/build_provider_runtime_profiles.py
          converged=0
          for pass in 1 2 3 4 5 6; do
            echo "FIELD_STREAM_JSON_V15_REBUILD pass=$pass"
            python3 scripts/reapply_published_overrides.py
            if python3 scripts/reapply_published_overrides.py --check; then
              converged=1
              echo "FIELD_STREAM_JSON_V15_REBUILD converged_at=$pass"
              break
            fi
          done
          test "$converged" -eq 1
          python3 scripts/normalize_stream_presentation_v12.py --check
          python3 tests/global_stream_presentation_test.py
          git diff --check

      - name: Stage rematerialized Interstellar providers
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          data=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          wanted={"purstream","cineby","videasy"}
          found=set()
          for row in data["scrapers"]:
              pid=str(row.get("id","")).lower()
              if pid not in wanted:
                  continue
              src=root/row["filename"]
              text=src.read_text(encoding="utf-8")
              if "all-providers-title-quality-ordered-description-native-tmdb-fail-open-v15-jvm-json-utf8" not in text:
                  raise SystemExit(f"V15 missing from {pid}: {src}")
              if "installJvmSafeStreamStringify" not in text:
                  raise SystemExit(f"JVM-safe stringify missing from {pid}: {src}")
              dst=Path(f"provider-{pid}.js")
              dst.write_text(text,encoding="utf-8")
              print(f"FIELD_STREAM_JSON_V15_STAGE id={pid} path={row['filename']} chars={len(text)}")
              found.add(pid)
          missing=wanted-found
          if missing:
              raise SystemExit("missing providers: "+",".join(sorted(missing)))
          PY

      - name: Checkout official NuvioDesktop reproducer runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused V15 runtime test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioStreamJsonV15Test.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withTimeoutOrNull
          import kotlin.test.Test
          import kotlin.test.assertTrue

          class NiakvioStreamJsonV15Test {
              @Test
              fun interstellar() = runBlocking {
                  val workspace=File(System.getenv("GITHUB_WORKSPACE"))
                  val providers=listOf(
                      "purstream" to "provider-purstream.js",
                      "cineby" to "provider-cineby.js",
                      "videasy" to "provider-videasy.js",
                  )
                  var purstreamCount=-1
                  for((id,file) in providers){
                      val started=System.currentTimeMillis()
                      val rows=withTimeoutOrNull(70_000L) {
                          PluginRuntime.executePlugin(
                              code=File(workspace,file).readText(),
                              tmdbId="157336",
                              mediaType="movie",
                              season=null,
                              episode=null,
                              scraperId=id.uppercase(),
                          )
                      }
                      val count=rows?.size ?: -1
                      val first=rows?.firstOrNull()
                      println(
                          "FIELD_STREAM_JSON_V15_DESKTOP id="+id+
                          " status="+(if(rows==null)"timeout" else "completed")+
                          " count="+count+
                          " duration_ms="+(System.currentTimeMillis()-started)+
                          " firstUrl="+(first?.url?:"")+
                          " firstTitle="+(first?.title?:"")
                      )
                      if(id=="purstream") purstreamCount=count
                  }
                  assertTrue(purstreamCount > 0, "Purstream Interstellar must return >0 streams on Desktop after V15 JSON transport fix")
              }
          }
          KOTLIN

      - name: Execute official Desktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioStreamJsonV15Test'             --no-build-cache --no-configuration-cache --console=plain
