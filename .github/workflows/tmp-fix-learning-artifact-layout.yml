name: FIX - Brain learning artifact layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-learning-artifact-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    name: FIX - Normalize Learning artifact consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Learning workflow by semantic lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/brain-learning-lab.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def replace_once(old, new):
              hits = [i for i, line in enumerate(lines) if line == old]
              if len(hits) != 1:
                  raise SystemExit(f'expected one line {old!r}, got {len(hits)}')
              lines[hits[0]] = new

          replace_once('name: NiakVIO Brain learning lab', 'name: LEARNING - Brain repair sandbox')
          replace_once('    name: Read-only provider repair sandbox', '    name: LEARNING - Repair sandbox')
          replace_once('    name: Publish sanitized Brain memory branch', '    name: LEARNING - Publish sanitized memory')

          path_hits = [i for i, line in enumerate(lines) if line == '          path: brain-learning-output']
          if len(path_hits) != 1:
              raise SystemExit(f'expected one artifact download path, got {len(path_hits)}')
          i = path_hits[0]
          lines[i:i+1] = [
              '          # Artifact entries already retain brain-learning-output/* and brain-learning-input/*.',
              '          # Restore at workspace root to avoid nesting those roots twice.',
              '          path: .',
          ]

          step_hits = [i for i, line in enumerate(lines) if line.strip() == '- name: Validate artifact cannot publish production']
          if len(step_hits) != 1:
              raise SystemExit(f'expected one artifact validation step, got {len(step_hits)}')
          start = step_hits[0]
          set_hits = [i for i in range(start + 1, min(start + 8, len(lines))) if lines[i].strip() == 'set -euo pipefail']
          if len(set_hits) != 1:
              raise SystemExit(f'expected one set -euo pipefail in validation step, got {len(set_hits)}')
          insert_at = set_hits[0] + 1
          tests = [
              '          test -s brain-learning-output/latest.json',
              '          test -s brain-learning-output/latest.md',
              '          test -s brain-learning-output/repair-proposal.json',
          ]
          lines[insert_at:insert_at] = tests

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -F 'name: LEARNING - Brain repair sandbox' .github/workflows/brain-learning-lab.yml
          grep -F 'name: LEARNING - Repair sandbox' .github/workflows/brain-learning-lab.yml
          grep -F 'name: LEARNING - Publish sanitized memory' .github/workflows/brain-learning-lab.yml
          grep -F 'path: .' .github/workflows/brain-learning-lab.yml
          grep -F 'test -s brain-learning-output/latest.json' .github/workflows/brain-learning-lab.yml

      - name: Commit fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-learning-artifact-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/brain-learning-lab.yml .github/workflows/tmp-fix-learning-artifact-layout.yml
          git commit -m 'fix: restore Brain learning artifact at workspace root'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
