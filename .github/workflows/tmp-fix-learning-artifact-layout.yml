name: FIX - Brain learning artifact layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-learning-artifact-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    name: FIX - Normalize Learning artifact consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Learning workflow structurally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/brain-learning-lab.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'name: NiakVIO Brain learning lab': 'name: LEARNING - Brain repair sandbox',
              '    name: Read-only provider repair sandbox': '    name: LEARNING - Repair sandbox',
              '    name: Publish sanitized Brain memory branch': '    name: LEARNING - Publish sanitized memory',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Learning workflow anchor not found: {old}')
              text = text.replace(old, new, 1)

          old_path = '          path: brain-learning-output\n'
          if text.count(old_path) != 1:
              raise SystemExit(f'expected exactly one artifact download path, got {text.count(old_path)}')
          text = text.replace(
              old_path,
              '          # Artifact paths already contain brain-learning-output/* and brain-learning-input/*.\n'
              '          # Restore at workspace root to avoid brain-learning-output/brain-learning-output/*.\n'
              '          path: .\n',
              1,
          )

          marker = '''      - name: Validate artifact cannot publish production
                shell: bash
                run: |
                  set -euo pipefail
          '''
          if marker not in text:
              raise SystemExit('Learning validation step anchor not found')
          text = text.replace(
              marker,
              marker
              + '          test -s brain-learning-output/latest.json\n'
              + '          test -s brain-learning-output/latest.md\n'
              + '          test -s brain-learning-output/repair-proposal.json\n',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'name: LEARNING - Brain repair sandbox' .github/workflows/brain-learning-lab.yml
          grep -F 'name: LEARNING - Repair sandbox' .github/workflows/brain-learning-lab.yml
          grep -F 'name: LEARNING - Publish sanitized memory' .github/workflows/brain-learning-lab.yml
          grep -F 'path: .' .github/workflows/brain-learning-lab.yml
          grep -F 'test -s brain-learning-output/latest.json' .github/workflows/brain-learning-lab.yml

      - name: Commit fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-learning-artifact-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/brain-learning-lab.yml .github/workflows/tmp-fix-learning-artifact-layout.yml
          git commit -m 'fix: restore Brain learning artifact at workspace root'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
