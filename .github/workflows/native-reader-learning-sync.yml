name: Native reader learning sync

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact completed native reader run ID to import manually
        required: true
        type: string

permissions: {}

concurrency:
  group: niakvio-brain-learning-memory-writer
  cancel-in-progress: false

jobs:
  sync-reader-learning:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Restore current sanitized Brain state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reader-learning-input/diagnostics reader-learning-output
          git fetch origin brain-learning/proposals:refs/remotes/origin/brain-learning/proposals || true
          if git cat-file -e refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json 2>/dev/null; then
            git show refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json > reader-learning-input/latest.json
          else
            printf '{"publicationAllowed":false,"productionWritesAllowed":false,"proposals":[]}\n' > reader-learning-input/latest.json
          fi
          if git cat-file -e refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.md 2>/dev/null; then
            git show refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.md > reader-learning-input/latest.md
          else
            printf '# NiakVIO Brain Learning\n' > reader-learning-input/latest.md
          fi
          cp reader-learning-input/latest.json reader-learning-output/latest.json
          cp reader-learning-input/latest.md reader-learning-output/latest.md

      - name: Validate exact manually selected reader run
        id: source
        env:
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid reader run id: $RUN_ID" >&2; exit 2; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact native reader diagnosis artifacts
        id: diagnoses
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reader-learning-input/diagnostics
          for pattern in             "native-tv-full-$RUN_ID"             "native-mobile-android-full-$RUN_ID"             "native-mobile-ios-full-$RUN_ID"             "native-desktop-full-*-$RUN_ID"; do
            gh run download "$RUN_ID" --pattern "$pattern" --dir reader-learning-input/diagnostics || true
          done
          if find reader-learning-input/diagnostics -type f -name '*brain.json' -print -quit | grep -q .; then
            echo "has_diagnostics=true" >> "$GITHUB_OUTPUT"
            find reader-learning-input/diagnostics -type f -name '*brain.json' -print | sort
          else
            echo "has_diagnostics=false" >> "$GITHUB_OUTPUT"
            echo "No importable diagnosis artifact for native run $RUN_ID." >&2
            exit 1
          fi

      - name: Merge automatic complete-evidence reader bug backlog
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_native_reader_backlog.py             --state reader-learning-output/latest.json             --previous-state reader-learning-input/latest.json             --diagnostics-root reader-learning-input/diagnostics             --run-id "$RUN_ID"             --output reader-learning-output/latest.json             --markdown-input reader-learning-output/latest.md             --markdown-output reader-learning-output/latest.md

      - name: Merge failed reader evidence into learning-only memory
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_native_reader_learning_failures.py             --state reader-learning-output/latest.json             --diagnostics-root reader-learning-input/diagnostics             --run-id "$RUN_ID"             --output reader-learning-output/latest.json

      - name: Enforce sanitized fail-closed mutation state
        shell: bash
        run: |
          set -euo pipefail
          node -e "const x=require('./reader-learning-output/latest.json');if(x.productionWritesAllowed===true||x.publicationAllowed===true)process.exit(1)"
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]|secret[=:]' reader-learning-output/latest.json; then
            echo "refusing unsafe native reader learning state" >&2
            exit 1
          fi

      - name: Update the single Brain memory branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="brain-learning/proposals"
          git switch -C "$BRANCH" main
          mkdir -p engine_v2/learning
          cp reader-learning-output/latest.json engine_v2/learning/latest.json
          cp reader-learning-output/latest.md engine_v2/learning/latest.md
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git add engine_v2/learning/latest.json engine_v2/learning/latest.md
          if git diff --cached --quiet; then
            echo "No native reader learning/backlog change."
          else
            git commit -m "brain: manually import native reader evidence"
            git push --force-with-lease origin HEAD:"$BRANCH"
          fi
