name: Publish existing validated Nuvio stage

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/publish-existing-stage"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  verify-and-cleanup:
    name: Verify final release tree and remove temporary phase-two runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current published main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the exact final tree without temporary phase-two files
        shell: bash
        run: |
          rm .github/workflows/publish-existing-stage.yml
          rm .github/triggers/publish-existing-stage
          python scripts/generate_release_hashes.py

      - name: Verify exact final release tree
        shell: bash
        run: |
          npm test
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding="utf-8"))

          package = load("package.json")
          lock = load("package-lock.json")
          manifest = load("manifest.json")
          vf = load("vf/manifest.json")
          versions = {
              "package.json": package.get("version"),
              "package-lock.json": lock.get("version"),
              "package-lock.json packages['']": (lock.get("packages") or {}).get("", {}).get("version"),
              "manifest.json": manifest.get("version"),
              "vf/manifest.json": vf.get("version"),
          }
          if len({str(value) for value in versions.values()}) != 1:
              raise SystemExit(f"final published release version mismatch: {versions}")
          if str(package.get("version")) != "5.20.26":
              raise SystemExit(f"unexpected final release version: {versions}")

          allowed = {
              ".github/workflows/publish-existing-stage.yml",
              ".github/triggers/publish-existing-stage",
              "FILE-HASHES.json",
              "PATCH-SHA256SUMS.txt",
              "SHA256SUMS.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
          )
          paths = {line[3:] for line in changed if len(line) >= 4}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f"unexpected final verification diff: {unexpected}")
          print(f"final published release verification passed: {versions}")
          PY

      - name: Commit final cleanup and refreshed hashes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/publish-existing-stage.yml .github/triggers/publish-existing-stage FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "chore: remove temporary phase-two runner"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
