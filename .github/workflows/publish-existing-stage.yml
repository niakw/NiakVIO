name: Publish existing validated Nuvio stage

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/publish-existing-stage"

permissions:
  contents: write
  actions: read

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "31197714038"

jobs:
  publish-existing-stage:
    name: Apply strict validation and Nuvio runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current corrected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for final provider validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned provider validation dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Download already validated deep staging area
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-validation-stage-${{ env.SOURCE_RUN_ID }}
          path: checked-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Restore validated domain state and reapply published overrides
        run: |
          test -f checked-artifact/provider-overrides.json
          test -f checked-artifact/provider-domain-history.json
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/reapply_published_overrides.py

      - name: Apply strict gates, finite grace and exact runtime evidence
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_candidates.py

      - name: Finalize last-known-good snapshots
        run: |
          test -f checked-artifact/staging/upstream-lkg-pending.json
          python scripts/finalize_upstream_lkg.py \
            --pending checked-artifact/staging/upstream-lkg-pending.json \
            --keep-generations 2

      - name: Remove stale content-hashed provider bundles
        run: python scripts/prune_unreferenced_providers.py

      - name: Verify overrides reached final published provider files
        run: python scripts/validate_published_overrides.py

      - name: Publish provider files and reports before the manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          if [ -f checked-artifact/health-output/repair-report.json ]; then
            cp checked-artifact/health-output/repair-report.json repair-report.json
          fi
          git add health-report.json health-history.json PROVENANCE.json dns-preflight-report.json provider-hub-report.json diagnostics-report.json diagnostics-report.html route-regressions.json provider-overrides.json provider-domain-history.json upstream-lkg.json upstream-lkg/
          if [ -f repair-report.json ]; then
            git add repair-report.json
          fi
          if [ -d providers ]; then
            git add -A providers
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: stage validated provider versions"
            test -f manifest.next.json
            cp manifest.next.json "$RUNNER_TEMP/manifest.next.json"
            git reset --hard HEAD
            git clean -fdx
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json
          else
            echo "No provider file or validation report change."
          fi

      - name: Publish the validated manifest in a second phase
        shell: bash
        run: |
          test -f manifest.next.json
          PREVIOUS_MANIFEST="$(mktemp)"
          git show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add manifest.json vf/manifest.json package.json package-lock.json sources.json nuvio-client-id-state.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if [ -d providers ]; then
            git add -A providers
          fi

          if git diff --cached --quiet; then
            echo "Manifest is unchanged."
            exit 0
          fi

          git commit -m "chore: publish Nuvio provider manifest"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify exact published main after push
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi
          npm test
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding="utf-8"))

          package = load("package.json")
          lock = load("package-lock.json")
          manifest = load("manifest.json")
          vf = load("vf/manifest.json")
          versions = {
              "package.json": package.get("version"),
              "package-lock.json": lock.get("version"),
              "package-lock.json packages['']": (lock.get("packages") or {}).get("", {}).get("version"),
              "manifest.json": manifest.get("version"),
              "vf/manifest.json": vf.get("version"),
          }
          unique = {str(value) for value in versions.values()}
          if len(unique) != 1:
              raise SystemExit(f"final published release version mismatch: {versions}")
          print(f"final published release version synchronization passed: {unique.pop()}")
          PY
          git diff --exit-code
