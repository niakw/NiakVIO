name: TEMP - Max Repair Runtime Trace V27

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - '.github/workflows/temp-max-repair-runtime-trace-v27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Trace manifest-authoritative provider calls
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/trace-v27.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
          function file(pid){const rows=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(rows.length!==1)throw new Error('manifest_count:'+pid+':'+rows.length);return path.resolve(rows[0].filename)}
          const nativeFetch=globalThis.fetch;
          function installFetchTrace(label){
            globalThis.fetch=async function(input,init){
              const url=typeof input==='string'?input:(input&&input.url)||String(input||'');
              const method=String((init&&init.method)||'GET').toUpperCase();
              const started=Date.now();
              try{
                const r=await nativeFetch(input,init);
                console.log('FETCH',label,method,r.status,'ms='+(Date.now()-started),'req='+url,'final='+r.url,'ctype='+(r.headers.get('content-type')||''));
                return r;
              }catch(e){
                console.log('FETCH_ERR',label,method,'ms='+(Date.now()-started),'req='+url,String(e&&e.message||e));
                throw e;
              }
            }
          }
          function context(spec){
            const ns=spec.type==='movie'?'movie':'tv';
            const m=spec.type==='movie'
              ?{title:spec.title,original_title:spec.title,release_date:`${spec.year}-01-01`,alternative_titles:{titles:[]}}
              :{name:spec.title,original_name:spec.title,first_air_date:`${spec.year}-01-01`,alternative_titles:{results:[]}};
            globalThis.__nuvioMediaContext={tmdbId:String(spec.id),tmdbNamespace:ns,tmdbMetadata:m,canonicalMediaType:spec.type};
            globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${spec.id}`]:m};
            globalThis.__nuvioProviderDeadlineMs=Date.now()+30000;
          }
          async function run(label,spec){
            console.log('\n===',label,'===');
            context(spec); installFetchTrace(label);
            const f=file(spec.pid); delete require.cache[f]; const mod=require(f);
            try{console.log('MODEL',label,JSON.stringify(mod.__niakvioProviderBase||null))}catch(e){console.log('MODEL_ERR',label,String(e&&e.message||e))}
            try{
              const rows=await Promise.race([
                Promise.resolve(mod.getStreams(String(spec.id),spec.type,spec.season,spec.episode)),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('trace_timeout')),31000))
              ]);
              console.log('ROWS',label,JSON.stringify(Array.isArray(rows)?rows:rows||null));
            }catch(e){console.log('STREAM_ERR',label,String(e&&e.stack||e))}
            globalThis.fetch=nativeFetch;
          }
          (async()=>{
            await run('wookafr',{pid:'wookafr',id:'157336',type:'movie',title:'Interstellar',year:'2014'});
            await run('allanime',{pid:'allanime',id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/trace-v27.cjs
