name: DIAG - Kehflix signed dataflow

on:
  push:
    paths:
      - '.github/workflows/kehflix-signed-diag.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Discover terminal host and signed player chain
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.error, urllib.parse, urllib.request

          UA = 'Mozilla/5.0 NiakVIO/3'
          FIXTURE = {'tmdbId':'94997','slug':'house-of-the-dragon','season':'3','episode':'1'}
          INITIAL = ['https://kehflix.lol', 'https://kehflix.com', 'https://kehflix.wiki']

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(url, *, follow=True, referer=''):
              headers = {'User-Agent': UA, 'Accept':'application/json,text/html,text/plain,*/*'}
              if referer: headers['Referer'] = referer
              opener = urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect())
              req = urllib.request.Request(url, headers=headers)
              try:
                  with opener.open(req, timeout=18) as r:
                      return int(r.status), r.geturl(), dict(r.headers.items()), r.read(2_000_000)
              except urllib.error.HTTPError as e:
                  return int(e.code), e.geturl(), dict(e.headers.items()), e.read(2_000_000)
              except Exception as e:
                  return 0, url, {}, str(type(e).__name__).encode()

          def safe_url(raw):
              try:
                  p=urllib.parse.urlsplit(raw)
                  query=[]
                  for k,v in urllib.parse.parse_qsl(p.query, keep_blank_values=True):
                      query.append(f'{k}=<len:{len(v)}>')
                  return urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,'&'.join(query),''))
              except Exception:
                  return '<invalid>'

          def links(body, base):
              text=body.decode('utf-8','ignore').replace('\\/','/').replace('&amp;','&')
              out=[]
              pats=[
                  r'''(?:href|src|url|pathname|action|location)\s*[:=]\s*["']([^"'<>]+)["']''',
                  r'''["'](https?://[^"'<>\s]+)["']''',
                  r'''["'](/(?:title|player|api/)[^"'<>\s]*)["']''',
              ]
              for pat in pats:
                  for m in re.finditer(pat,text,re.I):
                      raw=m.group(1) or ''
                      try: u=urllib.parse.urljoin(base,raw)
                      except Exception: continue
                      if u.startswith(('http://','https://')) and u not in out: out.append(u)
                      if len(out)>=120: return out
              return out

          hosts=[]
          discovered=[]
          for base in INITIAL:
              s0,f0,h0,b0=request(base+'/',follow=False)
              loc=h0.get('Location') or h0.get('location') or ''
              s1,f1,h1,b1=request(base+'/',follow=True)
              rows=links(b1,f1)
              link_hosts=[]
              for u in rows:
                  try: host=urllib.parse.urlsplit(u).hostname or ''
                  except Exception: continue
                  if 'kehflix' in host.lower() and host not in link_hosts: link_hosts.append(host)
                  if 'kehflix' in host.lower() and u not in discovered: discovered.append(u)
              print('KEHFLIX_DOMAIN_ROOT', 'base='+base, 'nofollow='+str(s0), 'location='+safe_url(urllib.parse.urljoin(base+'/',loc)) if loc else 'location=none', 'follow='+str(s1), 'final='+safe_url(f1), 'kehflix_link_hosts='+','.join(link_hosts[:12]))
              for host in [urllib.parse.urlsplit(f1).hostname,*link_hosts]:
                  if host and 'kehflix' in host.lower() and host not in hosts: hosts.append(host)

          for host in hosts:
              base='https://'+host
              for path_kind,path in [
                  ('detail',f"/title/tv/{FIXTURE['tmdbId']}-{FIXTURE['slug']}"),
                  ('detail_year',f"/title/tv/{FIXTURE['tmdbId']}-{FIXTURE['slug']}-2022"),
                  ('player',f"/player?m=tv&id={FIXTURE['tmdbId']}"),
              ]:
                  s0,f0,h0,b0=request(base+path,follow=False)
                  loc=h0.get('Location') or h0.get('location') or ''
                  s1,f1,h1,b1=request(base+path,follow=True)
                  nested=links(b1,f1)
                  same=[]
                  signed=[]
                  for u in [f1,*nested]:
                      try:
                          p=urllib.parse.urlsplit(u)
                          if p.hostname==host and u not in same: same.append(u)
                          q=dict(urllib.parse.parse_qsl(p.query,keep_blank_values=True))
                          if '/player' in p.path and q.get('id') and q.get('k'): signed.append(u)
                      except Exception: pass
                  print('KEHFLIX_DOMAIN_PATH', 'host='+host, 'kind='+path_kind, 'nofollow='+str(s0), 'location='+safe_url(urllib.parse.urljoin(base+path,loc)) if loc else 'location=none', 'follow='+str(s1), 'final='+safe_url(f1), 'same_links='+str(len(same)), 'signed_players='+str(len(signed)))
                  for player in signed[:2]:
                      p=urllib.parse.urlsplit(player); q=dict(urllib.parse.parse_qsl(p.query,keep_blank_values=True))
                      endpoint=(f"https://{host}/api/streams/episode?id={urllib.parse.quote(q['id'])}"
                                f"&season={FIXTURE['season']}&episode={FIXTURE['episode']}"
                                f"&k={urllib.parse.quote(q['k'])}")
                      se,fe,he,be=request(endpoint,referer=player)
                      ctype=(he.get('Content-Type') or he.get('content-type') or '').split(';')[0].lower()
                      media=0
                      try:
                          obj=json.loads(be)
                          def count(v):
                              if isinstance(v,dict): return sum(count(x) for x in v.values())
                              if isinstance(v,list): return sum(count(x) for x in v)
                              return int(isinstance(v,str) and ('.m3u8' in v or '.mp4' in v or '/stream-gw' in v))
                          media=count(obj)
                      except Exception: pass
                      print('KEHFLIX_DOMAIN_EPISODE_API','host='+host,'status='+str(se),'final='+safe_url(fe),'ctype='+ctype,'media_like='+str(media))

          print('KEHFLIX_DOMAIN_DISCOVERY','hosts='+','.join(hosts),'discovered_links='+str(len(discovered)))
          PY
