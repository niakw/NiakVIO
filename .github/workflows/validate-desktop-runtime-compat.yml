name: Validate Desktop runtime compatibility

on:
  pull_request:
    paths:
      - "manifest.json"
      - "vf/manifest.json"
      - "provider-overrides.json"
      - "scripts/provider_patches/desktop_runtime_compat_v1.py"
      - "scripts/publish_desktop_runtime_compat.py"
      - "tests/desktop_runtime_compat_test.py"
      - "tests/deep_repair_rollback_test.py"
      - ".github/workflows/validate-desktop-runtime-compat.yml"

permissions:
  contents: read

concurrency:
  group: desktop-runtime-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate compatibility tooling
        run: |
          python -m py_compile scripts/provider_patches/desktop_runtime_compat_v1.py
          python -m py_compile scripts/publish_desktop_runtime_compat.py
          python -m py_compile tests/desktop_runtime_compat_test.py
          python tests/desktop_runtime_compat_test.py

      - name: Stage runtime-compatible bundles from canonical sources
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp vf/manifest.json "$RUNNER_TEMP/vf-manifest.before.json"
          cp PROVENANCE.json "$RUNNER_TEMP/provenance.before.json"
          python scripts/publish_desktop_runtime_compat.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              'coflix', 'frenchstream', 'movix', 'streamzo',
              'flemmix', 'wookafr', 'hindmoviez', 'purstream',
          }
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          report = json.loads(Path('automation/desktop-runtime-compat-v1.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          before = json.loads((runner_temp / 'manifest.before.json').read_text(encoding='utf-8'))
          vf_manifest = json.loads(Path('vf/manifest.json').read_text(encoding='utf-8'))
          vf_before = json.loads((runner_temp / 'vf-manifest.before.json').read_text(encoding='utf-8'))
          provenance = json.loads(Path('PROVENANCE.json').read_text(encoding='utf-8'))
          provenance_before = json.loads((runner_temp / 'provenance.before.json').read_text(encoding='utf-8'))

          rows = {str(row.get('id', '')).casefold(): row for row in manifest.get('scrapers', [])}
          before_rows = {str(row.get('id', '')).casefold(): row for row in before.get('scrapers', [])}
          vf_rows = {str(row.get('id', '')).casefold(): row for row in vf_manifest.get('scrapers', [])}
          vf_before_rows = {str(row.get('id', '')).casefold(): row for row in vf_before.get('scrapers', [])}
          enabled_targets = {pid for pid in expected if before_rows[pid].get('enabled') is True}
          disabled_targets = expected - enabled_targets

          assert enabled_targets == set(report.get('published', [])), report
          assert disabled_targets == set(report.get('validated_disabled', [])), report
          assert not report.get('preserved'), report

          for provider_id in enabled_targets:
              row = rows[provider_id]
              assert '--desktop-runtime-v1--' in row['filename'], row
              bundle = Path(row['filename'])
              assert bundle.is_file(), bundle
              text = bundle.read_text(encoding='utf-8', errors='replace')
              assert 'NUVIO_DESKTOP_RUNTIME_COMPAT_V1' in text, provider_id
              if provider_id in vf_rows:
                  assert vf_rows[provider_id]['filename'] == '../' + row['filename'], (provider_id, vf_rows[provider_id])

          # Disabled providers may be bound to an exact content-addressed safety
          # finding. Compatibility is validated in memory only; staging must not
          # alter their publication/quarantine identity anywhere.
          before_providers = {str(k).casefold(): v for k, v in (provenance_before.get('providers') or {}).items()}
          after_providers = {str(k).casefold(): v for k, v in (provenance.get('providers') or {}).items()}
          for provider_id in disabled_targets:
              assert rows[provider_id] == before_rows[provider_id], (provider_id, rows[provider_id], before_rows[provider_id])
              if provider_id in vf_before_rows:
                  assert vf_rows.get(provider_id) == vf_before_rows[provider_id], (provider_id, vf_rows.get(provider_id), vf_before_rows[provider_id])
              assert after_providers.get(provider_id) == before_providers.get(provider_id), provider_id
              detail = report['providers'][provider_id]
              assert detail.get('ok') is True and detail.get('canonical_unchanged') is True, detail
              assert len(str(detail.get('validation_sha256') or '')) == 64, detail

          purstream = Path(rows['purstream']['filename']).read_text(encoding='utf-8', errors='replace')
          assert '"hostPrefixes":["api.purstream","purstream"]' in purstream
          assert '"suffixes":["club","mx","ch","ac","cx","art","co","me","to","store"]' in purstream
          assert '"api.purstream.club":"api.purstream.art"' not in purstream

          hindmoviez = Path(rows['hindmoviez']['filename']).read_text(encoding='utf-8', errors='replace')
          assert '"maxSeriesStreams":24' in hindmoviez
          assert '"filterEpisodeLabels":true' in hindmoviez

          if rows.get('4khdhubnew', {}).get('enabled'):
              assert rows.get('4khdhub', {}).get('enabled') is False, rows.get('4khdhub')
          if 'nakios' in rows:
              assert rows['nakios']['enabled'] is True, rows['nakios']
          print('desktop runtime publication staging validated')
          PY

      - name: Validate release after staged publication
        run: |
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest.before.json"
          python scripts/validate_vf_projection.py
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_activation_preservation.py
