name: Validate Desktop runtime compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/triggers/run-desktop-publication-v2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-runtime-publication
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.title == 'Run Desktop runtime publication v2'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Mark publication started
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Desktop runtime publication started."

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate compatibility tooling
        run: |
          python -m py_compile scripts/provider_patches/desktop_runtime_compat_v1.py
          python -m py_compile scripts/publish_desktop_runtime_compat.py
          python tests/desktop_runtime_compat_test.py

      - name: Publish runtime-compatible bundles
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/publish_desktop_runtime_compat.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regressions
        run: npm test

      - name: Regenerate and validate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py

      - name: Commit runtime-compatible release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/*--desktop-runtime-v1--*.js \
            automation/desktop-runtime-compat-v1.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish Nuvio Desktop runtime-compatible providers"
          git push origin HEAD:main

      - name: Mark publication completed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Desktop runtime publication completed successfully."

      - name: Mark publication failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Desktop runtime publication failed. Check the workflow logs."
