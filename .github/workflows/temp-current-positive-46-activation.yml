name: TEMP - Activate Current Live-Positive 46
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-current-positive-46-activation.yml]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/stable-46-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild exact activation matrix from current live-positive census
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path

          TARGETS = [
              'anime-sama','purstream','flemmix','uhdmovies','movieshunt','hindmoviez','4khdhub','persianstremio',
              'desiflix','kehflix','anikototv','animekai','animesalt','animesama-co','animesultra','animetsu','animevostfr',
              'castle','coflix','french-manga','kurage','moviesmod','mugiwarastream','neko-sama','papadustream','playimdb',
              'sekai','streamzo','videasy','vidfast','vidrock','voiranime','voiranime-homes','voiranime-rip','vostfree','wookafr',
              'yflix','allanime','allwish','anime-ultime','animevost-fr','fullanime','mallumv','moviebox','showbox','vidlove',
          ]
          assert len(TARGETS) == 46 and len(set(TARGETS)) == 46

          root = Path('.')
          matrix_path = root / 'automation/evidence/hub-lab-matrix-46.json'
          manifest_path = root / 'manifest.json'
          hubs_path = root / 'provider-hubs.json'
          overrides_path = root / 'provider-overrides.json'

          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          hubs = json.loads(hubs_path.read_text(encoding='utf-8'))
          overrides = json.loads(overrides_path.read_text(encoding='utf-8'))

          def cid(value):
              return str(value or '').strip().casefold().replace('_','-')

          rows = [r for r in manifest.get('scrapers', []) if isinstance(r, dict)]
          assert len(rows) == 96, len(rows)
          manifest_by = {cid(r.get('id')): r for r in rows}
          assert len(manifest_by) == 96
          missing = [p for p in TARGETS if p not in manifest_by]
          assert not missing, missing

          old_rows = {}
          for row in matrix.get('rows', []):
              if not isinstance(row, dict):
                  continue
              for key in (cid(row.get('manifestId')), cid(row.get('registryId'))):
                  if key:
                      old_rows.setdefault(key, row)

          hub_rows = hubs.get('providers') if isinstance(hubs.get('providers'), dict) else {}
          patches = overrides.get('provider_patches') if isinstance(overrides.get('provider_patches'), dict) else {}
          new_rows = []
          for pid in TARGETS:
              m = manifest_by[pid]
              existing = old_rows.get(pid)
              row = copy.deepcopy(existing) if existing else {}
              registry = hub_rows.get(pid) if isinstance(hub_rows.get(pid), dict) else {}
              patch = patches.get(pid) if isinstance(patches.get(pid), dict) else {}
              reg_hub = registry.get('hub') or None
              official = patch.get('official_hub') or None
              if reg_hub and official:
                  relation = 'match' if str(reg_hub).rstrip('/') == str(official).rstrip('/') else 'different'
              elif reg_hub:
                  relation = 'registry-only'
              elif official:
                  relation = 'official-only'
              else:
                  relation = 'no-hub-metadata'
              caps = []
              for raw in m.get('canonicalSupportedTypes') or m.get('supportedTypes') or []:
                  lane = 'tv' if str(raw).casefold() in {'tv','series','serie'} else str(raw).casefold()
                  if lane in {'movie','tv','anime'} and lane not in caps:
                      caps.append(lane)
              row.update({
                  'registryId': pid,
                  'manifestId': m.get('id'),
                  'hub': reg_hub,
                  'officialHub': official,
                  'hubRelation': relation,
                  'capabilities': caps,
                  'currentLiveAudit': {
                      'date': '2026-09-12',
                      'result': 'declared-types-qualified',
                      'validatedTypes': caps,
                      'missingTypes': [],
                      'evidenceRuns': [34698141582, 34696902428, 34698638738],
                  },
                  'overall': '🟢 toutes les lanes déclarées qualifiées par le census live courant',
                  'cause': 'preuve live courante 100% des types sémantiques déclarés',
                  'repair': 'aucun remplacement requis pour cette release; revalider aux Labs après publication',
              })
              new_rows.append(row)

          matrix['schemaVersion'] = max(int(matrix.get('schemaVersion') or 1), 1)
          matrix['hubCount'] = 46
          matrix['selectionAuthority'] = 'current-live-positive-audit-20260912'
          matrix['selectionPolicy'] = 'enabled iff all declared semantic types are current-run qualified'
          matrix['selectionEvidenceRuns'] = [34698141582, 34696902428, 34698638738]
          matrix['rows'] = new_rows
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Durable human-readable activation snapshot. Historical native Lab evidence
          # remains in git history; this document describes the release authority now.
          md = [
              '# Matrice d’activation NiakVIO — 46 positifs live',
              '',
              '> Autorité release : un provider est ON uniquement si toutes ses lanes sémantiques déclarées ont été qualifiées dans le census live courant.',
              '',
              '- Catalogue : **96 providers**.',
              '- Activation : **46 ON / 50 OFF**.',
              '- Census : runs **34698141582**, **34696902428**, complété par le fan-out **34698638738**.',
              '- Politique : aucun historique vert ne remplace une preuve live courante.',
              '',
              '| Provider | Manifest ID | Types qualifiés | Hub |',
              '|---|---|---|---|',
          ]
          for row in new_rows:
              md.append(f"| {row['registryId']} | {row['manifestId']} | {', '.join(row['capabilities'])} | {row.get('officialHub') or row.get('hub') or '—'} |")
          md.append('')
          (root / 'automation/HUB-LAB-MATRIX-46.md').write_text('\n'.join(md), encoding='utf-8')
          print('FIELD_CURRENT_POSITIVE_46_MATRIX ids=46 catalogue=96')
          PY

      - name: Recompute activation derivatives
        run: |
          python scripts/finalize_provider_repair_disposition_v1.py

      - name: Assert exact 46/50 authority and run contracts
        run: |
          python - <<'PY'
          import json
          matrix=json.load(open('automation/evidence/hub-lab-matrix-46.json',encoding='utf-8'))
          manifest=json.load(open('manifest.json',encoding='utf-8'))
          disposition=json.load(open('automation/provider-repair-disposition.json',encoding='utf-8'))
          def cid(v): return str(v or '').strip().casefold().replace('_','-')
          targets={cid(r.get('manifestId')) for r in matrix.get('rows',[]) if isinstance(r,dict)}
          enabled={cid(r.get('id')) for r in manifest.get('scrapers',[]) if isinstance(r,dict) and r.get('enabled') is True}
          disabled={cid(r.get('id')) for r in manifest.get('scrapers',[]) if isinstance(r,dict) and r.get('enabled') is not True}
          assert len(targets)==46, len(targets)
          assert enabled==targets, (len(enabled), sorted(enabled-targets), sorted(targets-enabled))
          assert len(enabled)==46 and len(disabled)==50
          assert disposition.get('enabledProviderCount')==46
          assert disposition.get('disabledProviderCount')==50
          print('FIELD_CURRENT_POSITIVE_46_ACTIVATION_OK enabled=46 disabled=50 catalogue=96')
          PY
          python tests/provider_non_regression_contract_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/activation_preservation_core_rehash_test.py
          git diff --check

      - name: Commit exact current positive activation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/evidence/hub-lab-matrix-46.json automation/HUB-LAB-MATRIX-46.md manifest.json provider-overrides.json automation/provider-v3-static-knowledge.json automation/provider-repair-disposition.json
          if git diff --cached --quiet; then
            echo 'FIELD_CURRENT_POSITIVE_46_COMMIT changed=false'
            exit 0
          fi
          git commit -m 'fix(release): activate exact current live-positive 46'
          git push origin HEAD:release/stable-46-20260912
          echo 'FIELD_CURRENT_POSITIVE_46_COMMIT changed=true'
