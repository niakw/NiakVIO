name: Restore TMDB type resolver (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-tmdb-resolver-once.yml'

permissions:
  contents: write

concurrency:
  group: restore-tmdb-resolver-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: \${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require TMDB runtime key secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${TMDB_API_KEY:-}" || { echo "TMDB_API_KEY secret is empty" >&2; exit 1; }

      - name: Materialize obfuscated runtime-only TMDB key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          import json, os, secrets
          from pathlib import Path

          raw=os.environ["TMDB_API_KEY"].encode("utf-8")
          salt=secrets.token_hex(16)
          material=salt+"|NiakVIO/TMDB/v1"
          seed=2166136261
          for ch in material:
              seed ^= ord(ch)
              seed=(seed*16777619)&0xffffffff
          cipher=[]
          for value in raw:
              seed ^= (seed << 13) & 0xffffffff
              seed &= 0xffffffff
              seed ^= (seed >> 17)
              seed &= 0xffffffff
              seed ^= (seed << 5) & 0xffffffff
              seed &= 0xffffffff
              cipher.append(value ^ (seed & 255))
          payload={"version":1,"salt":salt,"cipher":cipher}
          text=json.dumps(payload,separators=(",",":"))+"\n"
          if os.environ["TMDB_API_KEY"] in text:
              raise SystemExit("plaintext TMDB key leaked into runtime config")
          Path("runtime/tmdb-runtime-key.json").write_text(text,encoding="utf-8")
          print(f"FIELD_TMDB_RUNTIME_KEY bytes={len(raw)} cipher={len(cipher)} plaintext=false")
          PY

      - name: Patch resolver and regression tests
        run: python scripts/_restore_tmdb_resolver_once.py

      - name: Run resolver contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/global_media_type_resolution_test.py
          python tests/provider_tmdb_runtime_key_contract_test.py

      - name: Rebuild derived provider bundles
        run: python scripts/reapply_published_overrides.py

      - name: Validate fixed point and type contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py --check
          python tests/global_media_type_resolution_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/reapply_manifest_type_projection_test.py
          python tests/provider_base_layering_contract_test.py
          python tests/publication_contract_fingerprint_test.py
          python tests/provider_tmdb_runtime_key_contract_test.py

      - name: Live smoke three reported titles
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const path=require("path");
          const manifest=JSON.parse(fs.readFileSync("manifest.json","utf8"));
          const pick=(id)=>{
            const row=manifest.scrapers.find(x=>String(x.id).toLowerCase()===id.toLowerCase());
            if(!row)throw new Error("missing "+id);
            return row;
          };
          const cases=[
            {label:"Interstellar",id:"HINDMOVIEZ",tmdb:"157336",type:"movie",season:null,episode:null},
            {label:"Hell Mode S01E11",id:"HIANIME",tmdb:"280049",type:"series",season:1,episode:11},
            {label:"Dark Matter S02E01",id:"PAPADUSTREAM",tmdb:"62425",type:"series",season:2,episode:1},
          ];
          async function run(c){
            const row=pick(c.id);
            const file=path.resolve(row.filename);
            delete require.cache[file];
            const mod=require(file);
            const fn=typeof mod.getStreams==="function"?mod.getStreams:(typeof global.getStreams==="function"?global.getStreams:null);
            if(!fn)return {label:c.label,provider:c.id,error:"no getStreams export"};
            const started=Date.now();
            try{
              const value=await Promise.race([
                Promise.resolve(fn(c.tmdb,c.type,c.season,c.episode)),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error("smoke timeout")),28000)),
              ]);
              const rows=Array.isArray(value)?value:[];
              return {
                label:c.label,provider:c.id,rows:rows.length,ms:Date.now()-started,
                sample:rows[0]?{
                  title:rows[0].title||rows[0].name||null,
                  quality:rows[0].quality||null,
                  language:rows[0].language||null,
                  size:rows[0].size||null,
                  url:String(rows[0].url||"").slice(0,80)
                }:null
              };
            }catch(e){
              return {label:c.label,provider:c.id,error:String(e&&e.message||e),ms:Date.now()-started};
            }
          }
          (async()=>{
            const results=await Promise.all(cases.map(run));
            for(const row of results)console.log("FIELD_REPORTED_SMOKE "+JSON.stringify(row));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish validated resolver transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_restore_tmdb_resolver_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore TMDB-authoritative provider type resolution"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
