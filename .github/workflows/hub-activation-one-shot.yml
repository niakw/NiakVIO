name: ONE-SHOT - Publish Declared Hub Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hub-activation-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-hub-activation-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact policy trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Snapshot public manifest
        run: cp manifest.json "$RUNNER_TEMP/manifest-before-hub-policy.json"
      - name: Apply declared-hub activation
        run: |
          set -euo pipefail
          python scripts/finalize_provider_repair_disposition_v1.py
          python scripts/hub_activation_publication.py --write-scope
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_non_regression_contract_test.py
      - name: Reproject and version
        env:
          NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
        run: |
          set -euo pipefail
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before-hub-policy.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          python scripts/validate_language_projection.py
          node engine_v2/tests/provider-catalog.test.mjs
          python scripts/hub_activation_publication.py --write-scope --verify-catalog --append-memory
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --exit-code -- providers provider-bases scripts/provider_patches
      - name: Publish atomically and remove one-shot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hub-activation-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'nothing to publish'; exit 1; }
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          test "$CURRENT" = "$GITHUB_SHA" || { echo "FIELD_HUB_POLICY_PUBLICATION_SKIPPED validated=$GITHUB_SHA current=$CURRENT"; exit 1; }
          git commit -m 'fix(release): publish declared-hub provider activation'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
