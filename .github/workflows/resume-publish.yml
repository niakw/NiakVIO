name: Resume a validated Nuvio publication

on:
  workflow_dispatch:
    inputs:
      source_run_number:
        description: "Run number of the failed sync whose validation job succeeded (for example 52)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  publish-existing-stage:
    name: Publish an existing validated stage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current corrected repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve and verify source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_NUMBER" in
            ''|*[!0-9]*) echo "source_run_number must be numeric" >&2; exit 1 ;;
          esac

          RUN_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sync.yml/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.run_number == ${SOURCE_RUN_NUMBER}) | .id" \
              | head -n 1
          )"
          test -n "$RUN_ID" || { echo "Unable to find sync run #${SOURCE_RUN_NUMBER}" >&2; exit 1; }

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r '.head_branch' <<<"$RUN_JSON")" = "main" || {
            echo "Source run is not from main" >&2; exit 1;
          }
          test "$(jq -r '.status' <<<"$RUN_JSON")" = "completed" || {
            echo "Source run is not completed" >&2; exit 1;
          }

          STAGE_CONCLUSION="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Discover and validate all upstream providers") | .conclusion' \
              | head -n 1
          )"
          test "$STAGE_CONCLUSION" = "success" || {
            echo "The validation job of source run #${SOURCE_RUN_NUMBER} was not successful" >&2; exit 1;
          }

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Reusing validated artifact from sync run #${SOURCE_RUN_NUMBER} (run id ${RUN_ID})."

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for final provider validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned provider validation dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Download the already validated staging artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-validation-stage-${{ steps.source.outputs.run_id }}
          path: checked-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Restore validated domain state and reapply published overrides
        run: |
          test -f checked-artifact/provider-overrides.json
          test -f checked-artifact/provider-domain-history.json
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/reapply_published_overrides.py

      - name: Apply strict gates, finite grace and exact runtime evidence
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_candidates.py

      - name: Finalize last-known-good upstream snapshots
        run: |
          test -f checked-artifact/staging/upstream-lkg-pending.json
          python scripts/finalize_upstream_lkg.py \
            --pending checked-artifact/staging/upstream-lkg-pending.json \
            --keep-generations 2

      - name: Remove stale content-hashed provider bundles
        run: python scripts/prune_unreferenced_providers.py

      - name: Verify final published provider overrides
        run: python scripts/validate_published_overrides.py

      - name: Publish provider files and reports before the manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          if [ -f checked-artifact/health-output/repair-report.json ]; then
            cp checked-artifact/health-output/repair-report.json repair-report.json
          fi

          git add health-report.json health-history.json PROVENANCE.json \
            dns-preflight-report.json provider-hub-report.json diagnostics-report.json \
            diagnostics-report.html route-regressions.json provider-overrides.json \
            provider-domain-history.json upstream-lkg.json upstream-lkg/
          if [ -f repair-report.json ]; then git add repair-report.json; fi
          if [ -d providers ]; then git add -A providers; fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: stage validated provider versions"
            git push origin HEAD:main
          else
            echo "No provider file or validation report change."
          fi

      - name: Publish the validated manifest in a second phase
        shell: bash
        run: |
          test -f manifest.next.json
          PREVIOUS_MANIFEST="$(mktemp)"
          git show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add manifest.json vf/manifest.json package.json sources.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json

          if git diff --cached --quiet; then
            echo "Manifest is unchanged."
            exit 0
          fi

          git commit -m "chore: publish Nuvio provider manifest"
          git push origin HEAD:main
