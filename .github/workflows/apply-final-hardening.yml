name: Apply final hardening

on:
  push:
    branches:
      - fix/final-hardening-20260812
    paths:
      - .github/triggers/apply-final-hardening

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Rebase hardening changes onto current published main
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('package.json', encoding='utf-8'))['version'])
          PY
          )"
          export CURRENT_VERSION
          git fetch origin fix/adaptive-refresh-hardening
          git checkout origin/fix/adaptive-refresh-hardening -- \
            health-config.json \
            package.json \
            scripts/adaptive_runtime/runtime_repair.py \
            scripts/health_check.mjs \
            scripts/provider_patches/adaptive_runtime_recovery_v4.py \
            scripts/provider_patches/stream_output_sanitizer.py \
            scripts/provider_semantics.cjs \
            scripts/validate_provider_semantics.cjs \
            tests/adaptive_runtime_repair_test.py \
            tests/stream_output_sanitizer_direct_normalization_test.py

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['version']=os.environ['CURRENT_VERSION']
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Fix authoritative published types and deterministic manifest repair
        run: |
          python - <<'PY'
          from pathlib import Path

          promote = Path('scripts/promote_candidates.py')
          text = promote.read_text(encoding='utf-8')
          old = '''            if enabled and activation_mode == "strict_current" and activation_supported_types:\n                promoted_entry["supportedTypes"] = activation_supported_types\n'''
          new = '''            override_policy = load_overrides()\n            provider_policy = (override_policy.get("provider_patches") or {}).get(cid, {})\n            authoritative_published_types = [\n                str(value) for value in (provider_policy.get("published_types") or [])\n                if str(value) in {"movie", "tv", "anime"}\n            ] if isinstance(provider_policy, dict) else []\n            if (\n                enabled\n                and activation_mode == "strict_current"\n                and activation_supported_types\n                and not authoritative_published_types\n            ):\n                promoted_entry["supportedTypes"] = activation_supported_types\n'''
          if old not in text:
              raise SystemExit('promote type-scope anchor missing')
          promote.write_text(text.replace(old, new, 1), encoding='utf-8')

          reapply = Path('scripts/reapply_published_overrides.py')
          text = reapply.read_text(encoding='utf-8')
          text = text.replace(
              'from apply_provider_overrides import apply_overrides\n',
              'from apply_provider_overrides import apply_overrides, load_overrides\n',
              1,
          )
          anchor = '''def bump_provider_version(value: str) -> str:\n    match = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)", str(value or "").strip())\n    if not match:\n        return "1.0.1"\n    major, minor, patch = (int(part) for part in match.groups())\n    return f"{major}.{minor}.{patch + 1}"\n\n\n'''
          helper = '''def bump_provider_version(value: str) -> str:\n    match = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)", str(value or "").strip())\n    if not match:\n        return "1.0.1"\n    major, minor, patch = (int(part) for part in match.groups())\n    return f"{major}.{minor}.{patch + 1}"\n\n\ndef configured_published_types(config: dict[str, Any], provider_id: str) -> list[str]:\n    patches = config.get("provider_patches") if isinstance(config, dict) else {}\n    row = (patches or {}).get(str(provider_id or "").strip().casefold(), {})\n    if not isinstance(row, dict):\n        return []\n    return [\n        str(value)\n        for value in (row.get("published_types") or [])\n        if str(value) in {"movie", "tv", "anime"}\n    ]\n\n\n'''
          if anchor not in text:
              raise SystemExit('reapply version helper anchor missing')
          text = text.replace(anchor, helper, 1)

          old = '''    applied_count = 0\n\n    for entry in primary["scrapers"]:\n'''
          new = '''    applied_count = 0\n    override_config = load_overrides()\n\n    for entry in primary["scrapers"]:\n'''
          if old not in text:
              raise SystemExit('reapply override config anchor missing')
          text = text.replace(old, new, 1)

          old = '''        original = path.read_bytes()\n        migrated, adaptive_language_repairs = strip_unproven_adaptive_language(original)\n'''
          new = '''        authoritative_types = configured_published_types(override_config, provider_id)\n        types_changed = bool(authoritative_types and entry.get("supportedTypes") != authoritative_types)\n        if types_changed:\n            entry["supportedTypes"] = authoritative_types\n\n        original = path.read_bytes()\n        migrated, adaptive_language_repairs = strip_unproven_adaptive_language(original)\n'''
          if old not in text:
              raise SystemExit('reapply published type anchor missing')
          text = text.replace(old, new, 1)

          old = '''        if relative != new_relative:\n            entry["version"] = bump_provider_version(str(entry.get("version") or "1.0.0"))\n'''
          new = '''        if relative != new_relative or types_changed:\n            entry["version"] = bump_provider_version(str(entry.get("version") or "1.0.0"))\n'''
          if old not in text:
              raise SystemExit('reapply version bump anchor missing')
          text = text.replace(old, new, 1)

          old = '''            if isinstance(primary_entry, dict) and primary_entry.get("version"):\n                entry["version"] = primary_entry["version"]\n'''
          new = '''            if isinstance(primary_entry, dict) and primary_entry.get("version"):\n                entry["version"] = primary_entry["version"]\n                if isinstance(primary_entry.get("supportedTypes"), list):\n                    entry["supportedTypes"] = list(primary_entry["supportedTypes"])\n'''
          if old not in text:
              raise SystemExit('reapply secondary manifest anchor missing')
          text = text.replace(old, new, 1)
          reapply.write_text(text, encoding='utf-8')

          type_test = Path('tests/type_scoped_activation_test.py')
          text = type_test.read_text(encoding='utf-8')
          old = '''assert 'if enabled and activation_mode == "strict_current" and activation_supported_types:' in source\nassert 'promoted_entry["supportedTypes"] = activation_supported_types' in source\n'''
          new = '''assert 'authoritative_published_types = [' in source\nassert 'and not authoritative_published_types' in source\nassert 'promoted_entry["supportedTypes"] = activation_supported_types' in source\n'''
          if old not in text:
              raise SystemExit('type scoped test anchor missing')
          type_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          version_test = Path('tests/reapply_provider_versioning_test.py')
          text = version_test.read_text(encoding='utf-8')
          insert = '''assert mod.bump_provider_version('bad')=='1.0.1'\n'''
          replacement = '''assert mod.bump_provider_version('bad')=='1.0.1'\nassert mod.configured_published_types({\n    'provider_patches': {\n        'demo': {'published_types': ['movie', 'tv', 'bogus', 'anime']}\n    }\n}, 'DEMO') == ['movie', 'tv', 'anime']\n'''
          if insert not in text:
              raise SystemExit('reapply version test anchor missing')
          version_test.write_text(text.replace(insert, replacement, 1), encoding='utf-8')
          PY

      - name: Commit source hardening before generated pretest changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            health-config.json package.json \
            scripts/adaptive_runtime/runtime_repair.py \
            scripts/health_check.mjs \
            scripts/provider_patches/adaptive_runtime_recovery_v4.py \
            scripts/provider_patches/stream_output_sanitizer.py \
            scripts/provider_semantics.cjs \
            scripts/validate_provider_semantics.cjs \
            scripts/promote_candidates.py \
            scripts/reapply_published_overrides.py \
            tests/adaptive_runtime_repair_test.py \
            tests/stream_output_sanitizer_direct_normalization_test.py \
            tests/type_scoped_activation_test.py \
            tests/reapply_provider_versioning_test.py
          git diff --cached --check
          git commit -m "fix: harden player recovery and preserve authoritative catalogue types"
          git push origin HEAD:fix/final-hardening-20260812

      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Run complete regression suite on committed hardening
        run: npm test
