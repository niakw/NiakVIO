name: Purge GitHub Actions logs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE ACTION LOGS to confirm"
        required: true
        type: string
      mode:
        description: "logs = keep run history/artifacts; runs = delete completed runs and artifacts too"
        required: true
        default: logs
        type: choice
        options:
          - logs
          - runs
      batch_size:
        description: "Completed runs processed per pass (max 800 with GITHUB_TOKEN)"
        required: true
        default: "800"
        type: string
      before:
        description: "Internal continuation cursor; leave empty"
        required: false
        default: ""
        type: string
      final_pass:
        description: "Internal final cleanup of this purge workflow; leave disabled"
        required: false
        default: false
        type: boolean
      auto_continue:
        description: "Automatically continue until the full history is traversed"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-github-actions-logs
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ inputs.confirm == 'PURGE ACTION LOGS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PURGE_MODE: ${{ inputs.mode }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      BEFORE_CURSOR: ${{ inputs.before }}
      FINAL_PASS: ${{ inputs.final_pass }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
    steps:
      - name: Purge completed workflow logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          mode = os.environ.get("PURGE_MODE", "logs").strip()
          before = os.environ.get("BEFORE_CURSOR", "").strip()
          final_pass = os.environ.get("FINAL_PASS", "false").lower() == "true"
          auto_continue = os.environ.get("AUTO_CONTINUE", "true").lower() == "true"

          try:
              batch_size = int(os.environ.get("BATCH_SIZE", "800"))
          except ValueError:
              raise SystemExit("batch_size must be an integer")
          if batch_size < 1 or batch_size > 800:
              raise SystemExit("batch_size must be between 1 and 800")
          if mode not in {"logs", "runs"}:
              raise SystemExit(f"unsupported purge mode: {mode}")

          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "NiakVIO-actions-log-purge",
          }

          def request(path, method="GET", payload=None, retry=True):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      body = response.read()
                      parsed = json.loads(body) if body else {}
                      return response.status, parsed, dict(response.headers)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  remaining = int(exc.headers.get("x-ratelimit-remaining", "1") or "1")
                  retry_after = exc.headers.get("retry-after")
                  if retry and (remaining == 0 or retry_after):
                      if retry_after:
                          wait = int(retry_after) + 2
                      else:
                          reset = int(exc.headers.get("x-ratelimit-reset", "0") or "0")
                          wait = max(2, reset - int(time.time()) + 3)
                      print(f"Rate limit reached; sleeping {wait}s before retry.", flush=True)
                      time.sleep(wait)
                      return request(path, method=method, payload=payload, retry=False)
                  if exc.code == 404:
                      return 404, {"message": body}, dict(exc.headers)
                  print(f"GitHub API error {exc.code} {method} {path}: {body}", file=sys.stderr)
                  raise

          def rate_limit_guard(required):
              _, data, _ = request("/rate_limit")
              core = data.get("resources", {}).get("core", {})
              remaining = int(core.get("remaining") or 0)
              reset = int(core.get("reset") or 0)
              if remaining >= required:
                  return
              wait = max(2, reset - int(time.time()) + 3)
              print(
                  f"Only {remaining} API requests remain; need about {required}. "
                  f"Sleeping {wait}s until reset.",
                  flush=True,
              )
              time.sleep(wait)

          def list_completed(limit, cursor=""):
              rows = []
              page = 1
              while len(rows) < limit:
                  params = {
                      "status": "completed",
                      "per_page": "100",
                      "page": str(page),
                  }
                  if cursor:
                      params["created"] = f"<{cursor}"
                  query = urllib.parse.urlencode(params)
                  _, payload, _ = request(f"/repos/{repo}/actions/runs?{query}")
                  batch = payload.get("workflow_runs") or []
                  if not batch:
                      break
                  for run in batch:
                      if int(run.get("id") or 0) == current_run:
                          continue
                      rows.append(run)
                      if len(rows) >= limit:
                          break
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          def list_purge_workflow_runs():
              rows = []
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {"status": "completed", "per_page": "100", "page": str(page)}
                  )
                  _, payload, _ = request(
                      f"/repos/{repo}/actions/workflows/purge-actions-history.yml/runs?{query}"
                  )
                  batch = payload.get("workflow_runs") or []
                  if not batch:
                      break
                  rows.extend(run for run in batch if int(run.get("id") or 0) != current_run)
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          if final_pass:
              rows = list_purge_workflow_runs()
          else:
              rows = list_completed(batch_size, before)

          if not rows:
              print("No completed workflow runs remain in this traversal.")
              sys.exit(0)

          # Leave margin below the 1,000 requests/hour GITHUB_TOKEN repository limit.
          rate_limit_guard(min(950, len(rows) + 30))

          deleted = 0
          already_absent = 0
          failed = 0
          for index, run in enumerate(rows, start=1):
              run_id = int(run["id"])
              endpoint = (
                  f"/repos/{repo}/actions/runs/{run_id}"
                  if mode == "runs"
                  else f"/repos/{repo}/actions/runs/{run_id}/logs"
              )
              status, _, _ = request(endpoint, method="DELETE")
              if status == 204:
                  deleted += 1
              elif status == 404:
                  already_absent += 1
              else:
                  failed += 1
              if index % 50 == 0:
                  print(
                      f"Processed {index}/{len(rows)}: deleted={deleted} "
                      f"already_absent={already_absent} failed={failed}",
                      flush=True,
                  )
              time.sleep(0.08)

          print(
              f"PURGE_RESULT mode={mode} processed={len(rows)} deleted={deleted} "
              f"already_absent={already_absent} failed={failed}"
          )
          if failed:
              raise SystemExit(f"{failed} workflow run log deletion(s) failed")

          if final_pass:
              print(
                  "Final purge pass complete. GitHub cannot delete the log of the "
                  "currently running purge job itself; that single log remains until "
                  "the next purge execution."
              )
              sys.exit(0)

          oldest = min(str(run.get("created_at") or "") for run in rows if run.get("created_at"))
          if not oldest:
              raise SystemExit("unable to derive continuation cursor")

          if len(rows) >= batch_size and auto_continue:
              stamp = dt.datetime.fromisoformat(oldest.replace("Z", "+00:00"))
              # One-second overlap avoids skipping runs created in the same second.
              next_cursor = (stamp + dt.timedelta(seconds=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
              payload = {
                  "ref": "main",
                  "inputs": {
                      "confirm": "PURGE ACTION LOGS",
                      "mode": mode,
                      "batch_size": str(batch_size),
                      "before": next_cursor,
                      "final_pass": "false",
                      "auto_continue": "true",
                  },
              }
              request(
                  f"/repos/{repo}/actions/workflows/purge-actions-history.yml/dispatches",
                  method="POST",
                  payload=payload,
              )
              print(f"Continuation dispatched before {next_cursor}.")
          elif auto_continue:
              # Remove logs from all previous continuation runs as the last step.
              payload = {
                  "ref": "main",
                  "inputs": {
                      "confirm": "PURGE ACTION LOGS",
                      "mode": "logs",
                      "batch_size": "800",
                      "before": "",
                      "final_pass": "true",
                      "auto_continue": "false",
                  },
              }
              request(
                  f"/repos/{repo}/actions/workflows/purge-actions-history.yml/dispatches",
                  method="POST",
                  payload=payload,
              )
              print("Final self-history cleanup pass dispatched.")
          PY
