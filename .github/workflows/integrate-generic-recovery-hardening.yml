name: Integrate generic recovery hardening

on:
  push:
    branches:
      - fix/generic-recovery-hardening
    paths:
      - .github/triggers/integrate-generic-recovery-hardening

permissions:
  contents: write

jobs:
  validate-and-publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply generic recovery migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_generic_recovery_hardening.py')
          text=p.read_text()
          text=text.split('# Permanent provider-agnostic regression test.',1)[0]
          text += '\nprint("generic recovery hardening migration applied")\n'
          p.write_text(text)
          PY
          python .github/scripts/apply_generic_recovery_hardening.py
          sed -i 's/box\.globalThis=box; //g' tests/generic_recovery_hardening_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          script=data['scripts']['test']
          anchor='python3 tests/adaptive_domain_recovery_test.py'
          addition=anchor+' && python3 tests/generic_recovery_hardening_test.py'
          if 'generic_recovery_hardening_test.py' not in script:
              if anchor not in script:
                  raise SystemExit('adaptive domain test anchor missing')
              data['scripts']['test']=script.replace(anchor,addition,1)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Remove one-shot integration files before validation
        run: |
          rm -f .github/scripts/apply_generic_recovery_hardening.py
          rm -f .github/workflows/integrate-generic-recovery-hardening.yml
          rm -f .github/triggers/integrate-generic-recovery-hardening
      - name: Run generic recovery regression first
        run: python3 tests/generic_recovery_hardening_test.py
      - name: Run full repository regression and deterministic generators
        run: npm test
      - name: Commit candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: generalize provider recovery fallbacks"
      - name: Re-test exact clean candidate
        run: |
          candidate=$(git rev-parse HEAD)
          git worktree add --detach ../candidate "$candidate"
          cd ../candidate
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git diff --exit-code
      - name: Push validated branch only
        run: git push origin HEAD:fix/generic-recovery-hardening
