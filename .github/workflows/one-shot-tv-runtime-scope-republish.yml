name: One-shot real TV runtime scope republish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-tv-runtime-scope-republish.yml"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Prove Desktop Mobile and TV runtime discrimination before publication
        run: python tests/tv_provider_hardening_test.py

      - name: Snapshot activation state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          state = {
              str(row.get('id') or '').casefold(): bool(row.get('enabled'))
              for row in manifest.get('scrapers', [])
              if isinstance(row, dict)
          }
          Path('/tmp/activation-before.json').write_text(json.dumps(state, sort_keys=True))
          PY

      - name: Reapply corrected runtime wrapper to published bundles
        run: |
          python scripts/reapply_published_overrides.py
          python scripts/reapply_published_overrides.py --check

      - name: Assert activation and quarantine invariants
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.')
          before = json.loads(Path('/tmp/activation-before.json').read_text())
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {
              str(row.get('id') or '').casefold(): row
              for row in manifest.get('scrapers', [])
              if isinstance(row, dict)
          }
          after = {provider_id: bool(row.get('enabled')) for provider_id, row in rows.items()}
          if before != after:
              changed = sorted(
                  provider_id for provider_id in set(before) | set(after)
                  if before.get(provider_id) != after.get(provider_id)
              )
              raise SystemExit('runtime-scope republish changed activation: ' + ', '.join(changed))

          spec = importlib.util.spec_from_file_location(
              'playable_first_assert', root / 'scripts/provider_patches/nuvio_tv_playable_first_v1.py'
          )
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          streamzo = rows['streamzo']
          assert streamzo.get('enabled') is True
          streamzo_source = (root / streamzo['filename']).read_text(encoding='utf-8')
          assert 'NUVIO_TV_PLAYABLE_FIRST_V1' in streamzo_source
          assert module.LEGACY_TV_PREDICATE not in streamzo_source
          assert module.TV_PREDICATE in streamzo_source
          print(f"FIELD_STREAMZO_RUNTIME_SCOPE enabled=true file={streamzo['filename']}")

          for provider_id, reason in {
              'moviebox': 'non_playable_html_output',
              'netmirror': 'cross_title_search_identity_mismatch',
          }.items():
              row = rows[provider_id]
              assert row.get('enabled') is False
              payload = (root / row['filename']).read_text(encoding='utf-8')
              assert 'NUVIO_PROVIDER_QUARANTINE_V1' in payload
              assert reason in payload
              print(f"FIELD_QUARANTINE_PRESERVED provider={provider_id} file={row['filename']}")
          PY

      - name: Run focused regressions
        run: |
          python tests/tv_provider_hardening_test.py
          python tests/provider_quarantine_test.py
          python tests/runtime_media_safety_guard_test.py
          python tests/ci_preservation_policy_test.py
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_policy.py

      - name: Regenerate and validate release hashes
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Enforce republish scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'manifest.json', 'vf/manifest.json', 'vostfr/manifest.json',
              'PROVENANCE.json', 'provider-overrides.json',
              'FILE-HASHES.json', 'PATCH-SHA256SUMS.txt', 'SHA256SUMS.json',
          }
          changed = []
          for raw in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = raw[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(
              path for path in changed
              if path not in allowed and not path.startswith('providers/')
          )
          if unexpected:
              raise SystemExit('unexpected runtime-scope republish changes: ' + ', '.join(unexpected))
          print('runtime-scope republish scope passed: ' + ', '.join(sorted(changed)))
          PY

      - name: Commit exact tested bundles
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo 'runtime-scope bundles already current'
            exit 0
          fi
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: publish real TV-only runtime probing scope'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
