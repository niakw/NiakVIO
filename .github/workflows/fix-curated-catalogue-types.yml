name: Fix curated catalogue types

on:
  push:
    branches:
      - fix/final-hardening-20260812
    paths:
      - .github/triggers/fix-curated-catalogue-types

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Preserve all explicitly curated catalogue types
        run: |
          python - <<'PY'
          from pathlib import Path

          promote = Path('scripts/promote_candidates.py')
          text = promote.read_text(encoding='utf-8')
          old = '''            override_policy = load_overrides()\n            provider_policy = (override_policy.get("provider_patches") or {}).get(cid, {})\n            authoritative_published_types = [\n                str(value) for value in (provider_policy.get("published_types") or [])\n                if str(value) in {"movie", "tv", "anime"}\n            ] if isinstance(provider_policy, dict) else []\n            if (\n                enabled\n                and activation_mode == "strict_current"\n                and activation_supported_types\n                and not authoritative_published_types\n            ):\n                promoted_entry["supportedTypes"] = activation_supported_types\n'''
          new = '''            override_policy = load_overrides()\n            provider_policy = (override_policy.get("provider_patches") or {}).get(cid, {})\n            capability_policy = (override_policy.get("provider_capabilities") or {}).get(cid, {})\n            authoritative_published_types = [\n                str(value) for value in (provider_policy.get("published_types") or [])\n                if str(value) in {"movie", "tv", "anime"}\n            ] if isinstance(provider_policy, dict) else []\n            curated_capability_types = [\n                str(value) for value in (capability_policy.get("catalogue_types") or [])\n                if str(value) in {"movie", "tv", "anime"}\n            ] if isinstance(capability_policy, dict) else []\n            authoritative_catalogue_types = authoritative_published_types or curated_capability_types\n            if (\n                enabled\n                and activation_mode == "strict_current"\n                and activation_supported_types\n                and not authoritative_catalogue_types\n            ):\n                promoted_entry["supportedTypes"] = activation_supported_types\n'''
          if old not in text:
              raise SystemExit('promote authoritative type block missing')
          promote.write_text(text.replace(old, new, 1), encoding='utf-8')

          reapply = Path('scripts/reapply_published_overrides.py')
          text = reapply.read_text(encoding='utf-8')
          old = '''def configured_published_types(config: dict[str, Any], provider_id: str) -> list[str]:\n    patches = config.get("provider_patches") if isinstance(config, dict) else {}\n    row = (patches or {}).get(str(provider_id or "").strip().casefold(), {})\n    if not isinstance(row, dict):\n        return []\n    return [\n        str(value)\n        for value in (row.get("published_types") or [])\n        if str(value) in {"movie", "tv", "anime"}\n    ]\n'''
          new = '''def configured_authoritative_types(config: dict[str, Any], provider_id: str) -> list[str]:\n    provider_key = str(provider_id or "").strip().casefold()\n    patches = config.get("provider_patches") if isinstance(config, dict) else {}\n    patch_row = (patches or {}).get(provider_key, {})\n    published = [\n        str(value)\n        for value in ((patch_row.get("published_types") or []) if isinstance(patch_row, dict) else [])\n        if str(value) in {"movie", "tv", "anime"}\n    ]\n    if published:\n        return published\n    capabilities = config.get("provider_capabilities") if isinstance(config, dict) else {}\n    capability_row = (capabilities or {}).get(provider_key, {})\n    return [\n        str(value)\n        for value in ((capability_row.get("catalogue_types") or []) if isinstance(capability_row, dict) else [])\n        if str(value) in {"movie", "tv", "anime"}\n    ]\n'''
          if old not in text:
              raise SystemExit('reapply configured type helper missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'authoritative_types = configured_published_types(override_config, provider_id)',
              'authoritative_types = configured_authoritative_types(override_config, provider_id)',
              1,
          )
          reapply.write_text(text, encoding='utf-8')

          type_test = Path('tests/type_scoped_activation_test.py')
          text = type_test.read_text(encoding='utf-8')
          text = text.replace(
              "assert 'authoritative_published_types = [' in source\nassert 'and not authoritative_published_types' in source\n",
              "assert 'authoritative_published_types = [' in source\nassert 'curated_capability_types = [' in source\nassert 'authoritative_catalogue_types = authoritative_published_types or curated_capability_types' in source\nassert 'and not authoritative_catalogue_types' in source\n",
              1,
          )
          type_test.write_text(text, encoding='utf-8')

          version_test = Path('tests/reapply_provider_versioning_test.py')
          text = version_test.read_text(encoding='utf-8')
          old = '''assert mod.configured_published_types({\n    'provider_patches': {\n        'demo': {'published_types': ['movie', 'tv', 'bogus', 'anime']}\n    }\n}, 'DEMO') == ['movie', 'tv', 'anime']\n'''
          new = '''assert mod.configured_authoritative_types({\n    'provider_patches': {\n        'demo': {'published_types': ['movie', 'tv', 'bogus', 'anime']}\n    },\n    'provider_capabilities': {\n        'demo': {'catalogue_types': ['anime']}\n    }\n}, 'DEMO') == ['movie', 'tv', 'anime']\nassert mod.configured_authoritative_types({\n    'provider_capabilities': {\n        'anime-demo': {'catalogue_types': ['movie', 'anime', 'bogus']}\n    }\n}, 'ANIME-DEMO') == ['movie', 'anime']\n'''
          if old not in text:
              raise SystemExit('reapply authoritative type test anchor missing')
          version_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit curated catalogue type fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_candidates.py scripts/reapply_published_overrides.py tests/type_scoped_activation_test.py tests/reapply_provider_versioning_test.py
          git diff --cached --check
          git commit -m "fix: preserve explicit catalogue capabilities during type scoping"
          git push origin HEAD:fix/final-hardening-20260812

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete regression suite
        run: npm test
