name: TEMP - Max Repair Parser Shapes V37
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-parser-shapes-v37.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Reconcile V35/V36 proven lanes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json'); data=json.loads(p.read_text(encoding='utf-8')); rows=data.get('provider_patches') or {}
          proven={'hindmoviez':{'movie','tv'},'kurage':{'anime'},'vidfast':{'movie','tv'}}
          changed=[]
          for pid,lanes in proven.items():
              row=rows.get(pid)
              if not isinstance(row,dict):
                  print('MISSING_ROW',pid); continue
              d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {'schemaVersion':1,'authority':'provider-repair-disposition-v1'}
              req=[str(x) for x in d.get('requiredLanes') or []]
              old=set(str(x) for x in d.get('provenLanes') or [])
              now=set(old); now.update(lanes)
              ordered=[x for x in req if x in now]
              # Preserve any historical proof outside requiredLanes rather than dropping it.
              for x in d.get('provenLanes') or []:
                  x=str(x)
                  if x not in ordered and x in now: ordered.append(x)
              d['provenLanes']=ordered
              d['currentVerifiedLanes']=list(ordered)
              d['missingLanes']=[x for x in req if x not in now]
              d['completeCapabilityProof']=not d['missingLanes']
              d['recoveryStatus']='proven' if not d['missingLanes'] else 'repair'
              d['quarantined']=False
              d['terminalState']=None
              codes=[str(x) for x in d.get('reasonCodes') or [] if str(x)]
              code='v36_live_output_and_playback_proven'
              if code not in codes: codes.append(code)
              d['reasonCodes']=codes
              row['repair_disposition']=d
              if now!=old: changed.append(pid+':'+','.join(sorted(lanes)))
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V37_RECONCILED',changed)
          PY
          python3 scripts/validate_published_overrides.py
      - name: Diagnose current parser response shapes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v37.cjs <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36';
          async function req(label,url,opts={}){
            const c=new AbortController(),t=setTimeout(()=>c.abort(),opts.ms||12000);
            try{
              const r=await fetch(url,{redirect:'follow',signal:c.signal,headers:Object.assign({'User-Agent':UA,'Accept':'text/html,application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9'},opts.headers||{})});
              const body=await r.text();
              let json=null;try{json=JSON.parse(body)}catch{}
              const shape={label,url,status:r.status,final:r.url,ctype:r.headers.get('content-type')||'',bytes:body.length};
              if(json!==null){shape.jsonType=Array.isArray(json)?'array':typeof json;shape.keys=json&&typeof json==='object'?Object.keys(json).slice(0,30):[];shape.summary=summarize(json)}
              else shape.markers=htmlMarkers(body);
              console.log('SHAPE',JSON.stringify(shape)); return {r,body,json};
            }catch(e){console.log('SHAPE',JSON.stringify({label,url,status:0,error:String(e&&e.message||e)}));return {body:'',json:null}}
            finally{clearTimeout(t)}
          }
          function summarize(v,depth=0){
            if(depth>2)return typeof v;
            if(Array.isArray(v))return {len:v.length,first:v.length?summarize(v[0],depth+1):null};
            if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v).slice(0,20)){const x=v[k];if(typeof x==='string')o[k]=x.length>180?x.slice(0,180)+'…':x;else if(typeof x==='number'||typeof x==='boolean'||x==null)o[k]=x;else o[k]=summarize(x,depth+1)}return o}
            return v;
          }
          function htmlMarkers(body){
            const urls=[...String(body).matchAll(/https?:\/\/[^"'<>\\\s]+/g)].map(m=>m[0]).slice(0,30);
            const attrs=[...String(body).matchAll(/(?:data-id|data-file|data-src|src|href)=["']([^"']+)["']/gi)].map(m=>m[1]).filter(x=>/player|embed|stream|video|api|ajax|\.m3u8|\.mp4|\.mkv/i.test(x)).slice(0,30);
            const scripts=[...String(body).matchAll(/<script[^>]*src=["']([^"']+)["']/gi)].map(m=>m[1]).slice(-15);
            return {title:(/<title[^>]*>([^<]{0,200})/i.exec(body)||[])[1]||'',dataIds:[...String(body).matchAll(/data-id=["']([^"']+)["']/gi)].map(m=>m[1]).slice(0,15),urls,attrs,scripts};
          }
          (async()=>{
            await req('anikoto_megaplay_sources','https://megaplay.buzz/stream/getSources?id=116363',{headers:{Referer:'https://megaplay.buzz/stream/s-2/10789/sub','X-Requested-With':'XMLHttpRequest',Origin:'https://megaplay.buzz'}});
            await req('anikoto_megaplay_page','https://megaplay.buzz/stream/s-2/10789/sub',{headers:{Referer:'https://anikototv.to/'}});
            await req('persian_movie','https://persianstremio.vercel.app/stream/movie/157336.json');
            await req('persian_tv','https://persianstremio.vercel.app/stream/series/1396:1:1.json');
            await req('yflix_movie','https://enc-dec.app/db/flix/find?tmdb_id=157336&type=movie');
            await req('yflix_tv_moviebug','https://enc-dec.app/db/flix/find?tmdb_id=1396&type=movie');
            await req('yflix_tv','https://enc-dec.app/db/flix/find?tmdb_id=1396&type=tv');
            await req('yflix_series','https://enc-dec.app/db/flix/find?tmdb_id=1396&type=series');
            await req('mallumv_interstellar','https://mallumv.space/movie/1755/Interstellar_2014_English.xhtml');
            await req('streamzo_jjk','https://streamzo.fr/series/jujutsu-kaisen');
            await req('sekai_jjk','https://sekai.one/jujutsu-kaisen?v=13');
            await req('sekai_onepiece','https://sekai.one/piece?v=22');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/v37.cjs
      - name: Persist proof reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: reconcile V36 live provider proof'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
