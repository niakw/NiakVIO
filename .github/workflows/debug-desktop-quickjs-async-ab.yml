name: Debug Desktop QuickJS async fetch A/B

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-quickjs-async-ab.yml"

permissions:
  contents: read

jobs:
  quickjs-async-ab:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Checkout current NuvioDesktop
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install deterministic local-fetch PluginRuntime test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/http-root"
          cat > "$GITHUB_WORKSPACE/http-root/probe.json" <<'JSON'
          {"url":"https://media.invalid/interstellar-test.mp4"}
          JSON
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioQuickJsAsyncFetchAbTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioQuickJsAsyncFetchAbTest {
              @Test
              fun localFetch() = runBlocking {
                  val label = System.getenv("NIAKVIO_AB_LABEL") ?: "unknown"
                  val code = """
                      module.exports.getStreams = async function() {
                          var response = await fetch("http://127.0.0.1:18769/probe.json");
                          if (!response || !response.ok) return [];
                          var data = await response.json();
                          return [{
                              title: "QuickJS async fetch " + "${label}",
                              url: data.url,
                              quality: "1080p",
                              provider: "NiakVIO Debug"
                          }];
                      };
                  """.trimIndent()
                  val started = System.currentTimeMillis()
                  val rows = PluginRuntime.executePlugin(
                      code = code,
                      tmdbId = "157336",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "quickjs-async-ab",
                  )
                  val elapsed = System.currentTimeMillis() - started
                  File(System.getenv("GITHUB_WORKSPACE"), "quickjs-ab-" + label + ".txt")
                      .writeText(rows.size.toString())
                  println("FIELD_DESKTOP_QUICKJS_ASYNC_AB label=" + label + " count=" + rows.size + " duration_ms=" + elapsed)
              }
          }
          KOTLIN

      - name: Start local HTTP server
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 18769 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/http-root" > "$GITHUB_WORKSPACE/http-server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/http-server.pid"
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18769/probe.json", timeout=1) as r:
                      assert r.status == 200
                      print("FIELD_LOCAL_HTTP_READY status=200")
                      break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit("local HTTP server not ready")
          PY

      - name: Run current quickjs-kt 1.0.5
        shell: bash
        env:
          NIAKVIO_AB_LABEL: v105
        run: |
          set +e
          timeout 180 ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioQuickJsAsyncFetchAbTest'             --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
          status=$?
          set -e
          count="-1"
          [[ -s "$GITHUB_WORKSPACE/quickjs-ab-v105.txt" ]] && count="$(cat "$GITHUB_WORKSPACE/quickjs-ab-v105.txt")"
          echo "FIELD_DESKTOP_QUICKJS_ASYNC_AB_RESULT version=1.0.5 status=$status count=$count" | tee "$GITHUB_WORKSPACE/quickjs-v105-result.txt"

      - name: Upgrade only quickjs-kt to 1.0.6
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("nuvio-desktop/gradle/libs.versions.toml")
          s=p.read_text()
          old='quickjsKt = "1.0.5"'
          new='quickjsKt = "1.0.6"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          grep -n 'quickjsKt' nuvio-desktop/gradle/libs.versions.toml

      - name: Run quickjs-kt 1.0.6 with same async bridge
        shell: bash
        env:
          NIAKVIO_AB_LABEL: v106
        run: |
          set +e
          timeout 180 ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioQuickJsAsyncFetchAbTest'             --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
          status=$?
          set -e
          count="-1"
          [[ -s "$GITHUB_WORKSPACE/quickjs-ab-v106.txt" ]] && count="$(cat "$GITHUB_WORKSPACE/quickjs-ab-v106.txt")"
          echo "FIELD_DESKTOP_QUICKJS_ASYNC_AB_RESULT version=1.0.6 status=$status count=$count" | tee "$GITHUB_WORKSPACE/quickjs-v106-result.txt"

      - name: Classify QuickJS async binding compatibility
        shell: bash
        run: |
          set -euxo pipefail
          cat "$GITHUB_WORKSPACE/quickjs-v105-result.txt"
          cat "$GITHUB_WORKSPACE/quickjs-v106-result.txt"
          v105="$(awk -F'count=' '{print $2}' "$GITHUB_WORKSPACE/quickjs-v105-result.txt" | tr -d '\r\n')"
          v106="$(awk -F'count=' '{print $2}' "$GITHUB_WORKSPACE/quickjs-v106-result.txt" | tr -d '\r\n')"
          echo "FIELD_DESKTOP_QUICKJS_ASYNC_AB_SUMMARY v105=$v105 v106=$v106"
          if [[ "$v105" -le 0 && "$v106" -gt 0 ]]; then
            echo "FIELD_DESKTOP_QUICKJS_ASYNC_AB_CAUSE cause=quickjs_1_0_5_async_binding_incompatibility"
            exit 0
          fi
          echo "FIELD_DESKTOP_QUICKJS_ASYNC_AB_CAUSE cause=not_proven"
          exit 1

      - name: Stop local HTTP server
        if: always()
        shell: bash
        run: |
          if [[ -s "$GITHUB_WORKSPACE/http-server.pid" ]]; then
            kill "$(cat "$GITHUB_WORKSPACE/http-server.pid")" 2>/dev/null || true
          fi
          cat "$GITHUB_WORKSPACE/http-server.log" || true
