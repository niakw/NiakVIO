name: TEMP - Kehflix Anime SID Gateway V62C

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-kehflix-anime-v62c.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prove SID gateway for anime episode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,html
          base='https://kehflix.wiki'; title=base+'/title/tv/95479-jujutsu-kaisen'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,text/plain,*/*','Referer':base+'/'}
          def req(url,referer=None,timeout=18,range_header=None):
              h=dict(headers)
              if referer: h['Referer']=referer
              if range_header: h['Range']=range_header
              r=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      return x.status,x.read(262144),dict(x.headers),x.geturl()
              except Exception as e:
                  status=getattr(e,'code',0) or 0
                  try: body=e.read(262144)
                  except Exception: body=repr(e).encode()
                  return status,body,dict(getattr(e,'headers',{}) or {}),url
          st,raw,_,_=req(title)
          text=raw.decode('utf-8','replace')
          pats=[r'[?&]k=([^&"\'<>\\\s]+)',r'\bk\s*[:=]\s*["\']([^"\']{20,})["\']',r'([A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})']
          keys=[]
          for pat in pats:
              for v in re.findall(pat,text):
                  v=html.unescape(urllib.parse.unquote(str(v))).strip()
                  if v not in keys: keys.append(v)
          payload=None
          for k in keys[:20]:
              q=urllib.parse.urlencode({'id':'95479','season':'1','episode':'1','k':k})
              s,b,_,_=req(base+'/api/streams/episode?'+q,title)
              if s==200:
                  try:
                      d=json.loads(b.decode('utf-8','replace'))
                      if isinstance(d,dict) and d.get('ok'):
                          payload=d; break
                  except Exception: pass
          if payload is None: raise SystemExit('V62C no valid episode payload')
          sources=payload.get('sources') if isinstance(payload.get('sources'),list) else []
          print('V62C_SOURCES',json.dumps([{k:v for k,v in s.items() if k in {'sid','url','src','name','label','server','quality','lang','language'}} for s in sources if isinstance(s,dict)],ensure_ascii=False))
          success=[]
          for i,s in enumerate(sources):
              if not isinstance(s,dict): continue
              sid=str(s.get('sid') or '').strip()
              if not sid: continue
              gw=base+'/api/stream-gw?'+urllib.parse.urlencode({'t':sid})
              gs,gb,gh,gfinal=req(gw,title,18,'bytes=0-65535')
              ct=str(gh.get('Content-Type') or gh.get('content-type') or '')
              loc=str(gh.get('Location') or gh.get('location') or '')
              print('V62C_SID_GATEWAY',json.dumps({'index':i,'sidPrefix':sid[:40],'status':gs,'contentType':ct,'location':loc,'final':gfinal,'prefix':gb[:100].decode('utf-8','replace')},sort_keys=True))
              if gs in (200,206) and (ct.startswith('video/') or 'mpegurl' in ct.lower() or gb[:7]==b'#EXTM3U'):
                  success.append({'sid':sid,'gateway':gw,'status':gs,'contentType':ct})
          print('V62C_SID_SUCCESS',json.dumps(success,sort_keys=True))
          if not success: raise SystemExit('V62C no SID-backed verified media')
          PY
