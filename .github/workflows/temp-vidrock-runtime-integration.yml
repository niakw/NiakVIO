name: TEMP - VidRock Runtime Integration

on:
  push:
    branches:
      - workbench/vidrock-runtime-temp
    paths:
      - '.github/workflows/temp-vidrock-runtime-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench/vidrock-runtime-temp
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Wire VidRock DATA and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/provider_patches/vidrock_runtime_v1.py scripts/install_vidrock_runtime_v1.py tests/vidrock_runtime_crypto_test.py
          python scripts/install_vidrock_runtime_v1.py
          python tests/vidrock_runtime_crypto_test.py
          python scripts/materialize_provider_v3_one.py vidrock
          python tests/vidrock_runtime_crypto_test.py
          python scripts/provider_base_store.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in manifest['scrapers'] if x.get('id')=='vidrock')
          path=Path(row['filename'])
          text=path.read_text(encoding='utf-8')
          assert 'NIAKVIO_VIDROCK_RUNTIME_V1' in text, path
          assert 'PROVIDER.VIDROCK.RUNTIME.V1' in text, path
          assert row.get('enabled') is True, row
          print(f"VIDROCK_BUNDLE_OK file={path} enabled={row.get('enabled')} marker=1")
          PY
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json manifest.json providers scripts/provider_patches/vidrock_runtime_v1.py scripts/install_vidrock_runtime_v1.py tests/vidrock_runtime_crypto_test.py
          if git diff --cached --quiet; then
            echo 'VIDROCK_INTEGRATION_NO_DIFF'
          else
            git commit -m 'feat(provider): integrate live VidRock AES-GCM runtime'
            git push origin HEAD:workbench/vidrock-runtime-temp
          fi
