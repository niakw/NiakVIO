name: Nuvio TV targeted VF recovery proof

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-targeted-deep-quality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Record targeted proof run id
        run: |
          mkdir -p .github/status
          printf '%s\n' "$GITHUB_RUN_ID" > .github/status/tv-targeted-vf-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/tv-targeted-vf-run
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record targeted TV VF run'
            git push origin HEAD:agent/tv-regression-5.20.38
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Discover current candidates
        run: python scripts/discover_candidates.py --require-all-upstreams
      - name: Keep only TV VF recovery candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('staging/candidates.json')
          d=json.loads(p.read_text())
          wanted={'frenchstream','streamzo','1shows','vidsrc','toflix','allanime','purstream'}
          def keep(row):
              if not isinstance(row,dict): return False
              return str(row.get('canonical_id') or row.get('id') or row.get('upstream_id') or '').casefold() in wanted
          if isinstance(d,list):
              out=[r for r in d if keep(r)]; rows=out
          elif isinstance(d,dict):
              key=next((k for k in ('candidates','providers','items') if isinstance(d.get(k),list)),None)
              if key is None: raise SystemExit(f'unsupported candidates schema keys={list(d)}')
              out=dict(d); out[key]=[r for r in d[key] if keep(r)]; rows=out[key]
          else:
              raise SystemExit('unsupported candidates schema')
          print('filtered candidates',[(r.get('source'),r.get('canonical_id'),r.get('key')) for r in rows])
          if not rows: raise SystemExit('target filter selected zero candidates')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: DNS and exact overrides
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs --stage staging --output health-output/dns-preflight-report.json
          python scripts/apply_dns_migration_overrides.py --stage staging --report health-output/dns-preflight-report.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/build_provider_runtime_profiles.py --stage staging --apply-stage
          python scripts/validate_override_pipeline.py --stage staging
      - name: Run exact deep health checker
        env:
          NUVIO_STAGE: staging
          NUVIO_CANDIDATES_PATH: staging/candidates.json
          NUVIO_HEALTH_OUTPUT: health-output
          NUVIO_DNS_PREFLIGHT_RESULTS: health-output/dns-preflight-report.json
          NUVIO_WORKER_MEMORY_MB: '1024'
        run: node scripts/health_check.mjs --deep
      - name: Assert exact Breaking Bad VF and activation gates
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          d=json.load(open('health-output/health-results.json'))
          rows=d.get('results') or d.get('providers') or []
          cfg=json.load(open('health-config.json'))
          spec=importlib.util.spec_from_file_location('promote_candidates',Path('scripts/promote_candidates.py'))
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          wanted=('purstream','1shows','vidsrc')
          exact={}
          for k in wanted:
              variants=[r for r in rows if str(r.get('canonical_id') or r.get('id') or '').casefold()==k]
              variants.sort(key=lambda r:(r.get('status')=='healthy',int(r.get('score') or 0),int((r.get('evidence') or {}).get('effective_max_height') or 0)),reverse=True)
              if not variants: raise SystemExit(f'missing {k}')
              r=variants[0]
              bb=next((t for t in r.get('tests',[]) if (t.get('fixture') or {}).get('label')=='Breaking Bad S01E01'),None)
              if not bb: raise SystemExit(f'no Breaking Bad fixture for {k}')
              fr='fr' in {str(x).casefold() for x in bb.get('accepted_audio_languages',[])} or 'fr' in {str(x).casefold() for x in bb.get('accepted_subtitle_languages',[])}
              ok=bb.get('status')=='healthy' and int(bb.get('streams_playable') or 0)>=1 and int(bb.get('effective_max_height') or 0)>=720 and fr
              gates,proof=mod.evaluate_pre_stability_gates({'health':r},cfg['activation'])
              failed=[name for name,g in gates.items() if not g.get('passed')]
              exact[k]={
                'key':r.get('key'),'status':r.get('status'),'score':r.get('score'),
                'breaking_bad':{'status':bb.get('status'),'playable':bb.get('streams_playable'),'height':bb.get('effective_max_height'),'audio':bb.get('accepted_audio_languages'),'subs':bb.get('accepted_subtitle_languages'),'ok_vf_hd':ok},
                'failed_pre_stability_gates':failed,
                'activation_supported_types':proof.get('activation_supported_types'),
              }
          print(json.dumps(exact,ensure_ascii=False,indent=2))
          if not all(exact[k]['breaking_bad']['ok_vf_hd'] for k in wanted):
              raise SystemExit('Breaking Bad does not have all 3 expected VF HD providers')
          if any(exact[k]['failed_pre_stability_gates'] for k in wanted):
              raise SystemExit('one of the 3 VF HD providers still fails publication pre-stability gates')
          print('EXACT_BREAKING_BAD_VF_HD=purstream,1shows,vidsrc')
          print('exact Breaking Bad VF activation proof passed')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tv-targeted-vf-${{ github.run_id }}
          path: health-output/
          retention-days: 2
