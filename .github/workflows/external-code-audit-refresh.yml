name: Refresh External Code Audit

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh every Sunday at 04:17 UTC.
    - cron: '17 4 * * 0'

permissions:
  actions: write

concurrency:
  group: external-code-audit-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Sonar / DeepSource / CodeScene exports
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch external collectors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Refreshing external audit: SonarQube Cloud + DeepSource + CodeScene"
          gh workflow run external-code-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
