name: Refresh External Code Audit

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: external-code-audit-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Manually refresh Sonar / DeepSource / CodeScene exports
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch external collectors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Manual refresh requested: SonarQube Cloud + DeepSource + CodeScene"
          gh workflow run external-code-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
