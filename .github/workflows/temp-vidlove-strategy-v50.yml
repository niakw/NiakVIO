name: TEMP - VidLove Strategy Reconcile V50

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-vidlove-strategy-v50.yml']

permissions:
  contents: write

env:
  NUVIO_PROVIDER_V3_CONTEXT: publication

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}

      - name: Audit and normalize VidLove strategy
        shell: bash
        run: |
          set -euo pipefail
          echo 'V50_DIRECT_API_HLS_OCCURRENCES'
          grep -R -n --exclude-dir=.git --exclude='*.js' 'direct_api_hls' provider-overrides.json automation scripts tests .github || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          patches=d.get('provider_patches') or {}
          caps=d.get('provider_capabilities') or {}
          v=patches.get('vidlove') or {}
          c=caps.get('vidlove') or {}
          print('V50_VIDLOVE_BEFORE', json.dumps({
              'capability':v.get('capability'),
              'cap_strategy':c.get('strategy'),
              'has_api_recipe':isinstance(v.get('api_recipe'),dict) and bool(v.get('api_recipe')),
              'directRoute':(v.get('api_recipe') or {}).get('directRoute') if isinstance(v.get('api_recipe'),dict) else None,
              'published_types':v.get('published_types'),
              'repair_disposition':v.get('repair_disposition'),
          }, sort_keys=True))
          recipe=v.get('api_recipe') if isinstance(v.get('api_recipe'),dict) else {}
          assert recipe.get('directRoute'), 'vidlove direct API recipe missing; refusing strategy rewrite'
          assert recipe.get('base'), 'vidlove API base missing; refusing strategy rewrite'
          old=str(v.get('capability') or '').strip().lower()
          assert old in {'direct_api_hls','api_stream_resolver'}, old
          v['capability']='api_stream_resolver'
          if isinstance(c,dict):
              c['strategy']='api_stream_resolver'
              caps['vidlove']=c
          patches['vidlove']=v
          d['provider_patches']=patches
          d['provider_capabilities']=caps
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V50_VIDLOVE_NORMALIZED api_stream_resolver')
          PY

      - name: Rebuild only VidLove CONFIG and provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import domain_refresh_transaction_v2 as t
          updates=t.rebuild_provider_configs(['vidlove'])
          change={'schema_version':2,'changed':['vidlove'],'registry_changed':[],'bundle_updates':updates,'allowed_patch_fields':[],'core_mutation':False}
          Path('health-output').mkdir(exist_ok=True)
          Path('health-output/v50-changes.json').write_text(json.dumps(change,indent=2)+'\n',encoding='utf-8')
          print('V50_BUNDLE_UPDATES',json.dumps(updates,sort_keys=True))
          PY
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v50-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check

      - name: Validate strategy and global non-regression
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_v3_strategy_plan_contract_test.py
          python scripts/validate_published_overrides.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python tests/global_core_runtime_ownership_test.py
          python tests/core_runtime_nonregression_contract_test.py
          python scripts/audit_provider_v3_static.py
          python scripts/reapply_published_overrides.py --check
          git diff --check

      - name: Emit current residual lane ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('provider-overrides.json',encoding='utf-8'))
          rows=[]
          for pid,p in sorted((d.get('provider_patches') or {}).items()):
              if not isinstance(p,dict): continue
              r=p.get('repair_disposition') if isinstance(p.get('repair_disposition'),dict) else {}
              miss=[str(x) for x in r.get('missingLanes') or [] if str(x)]
              if miss:
                  rows.append({'provider':pid,'missingLanes':miss,'requiredLanes':r.get('requiredLanes') or [],'provenLanes':r.get('provenLanes') or [],'routeDataState':r.get('routeDataState'),'reasonCodes':r.get('reasonCodes') or [],'terminalState':r.get('terminalState'),'quarantined':r.get('quarantined')})
          print('V50_RESIDUAL_COUNT',len(rows),'LANES',sum(len(x['missingLanes']) for x in rows))
          for row in rows: print('V50_RESIDUAL',json.dumps(row,sort_keys=True))
          PY

      - name: Persist V50
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json manifest.json provider-v3-materialization.json PROVENANCE.json providers/
          if ! git diff --cached --quiet; then
            git commit -m 'fix(providers): normalize VidLove API strategy'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
