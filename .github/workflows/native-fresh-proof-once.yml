name: NiakVIO issue 69 exact-SHA closure proof
# One-shot finalizer for issue #69 only. It removes itself before proving the
# cleaned main SHA, then explicitly dispatches CodeQL/security and native readers
# because pushes made with GITHUB_TOKEN do not recursively trigger workflows.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-fresh-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: niakvio-native-fresh-proof-once
  cancel-in-progress: true

jobs:
  close-issue-69:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Remove this one-shot and reseal exact main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/native-fresh-proof-once.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py
          git add -A
          git commit -m 'chore: remove final issue 69 proof one-shot'

          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/normalize_published_security_finalization.py --check
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --exit-code
          git push origin HEAD:main

          clean_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/${repo}/commits/main" --jq .sha)"
          test "$clean_sha" = "$remote_sha"
          echo "CLEAN_SHA=$clean_sha" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 final cleaned main sealed at ${clean_sha}: both Core and native one-shots are removed, release hashes are synchronized. Exact-SHA CodeQL/security will run before any native reader is launched."

      - name: Dispatch exact-SHA CodeQL and security gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          dispatch_and_capture() {
            local workflow="$1" started run_id actual_sha
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$repo" --ref main >/dev/null
            run_id=""
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --event workflow_dispatch --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                actual_sha="$(gh run view "$run_id" --repo "$repo" --json headSha --jq .headSha)"
                if [ "$actual_sha" = "$CLEAN_SHA" ]; then
                  printf '%s' "$run_id"
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }

          codeql="$(dispatch_and_capture codeql.yml)"
          security="$(dispatch_and_capture security-final-gate.yml)"
          echo "CODEQL_RUN=$codeql" >> "$GITHUB_ENV"
          echo "SECURITY_RUN=$security" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 exact cleaned SHA security proof launched: SHA=${CLEAN_SHA} ; CODEQL_RUN=${codeql} https://github.com/${repo}/actions/runs/${codeql} ; SECURITY_RUN=${security} https://github.com/${repo}/actions/runs/${security}. Native Labs remain gated behind these checks."

      - name: Require CodeQL and 92-provider security green before native Labs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh run watch "$CODEQL_RUN" --repo "$repo" --exit-status --interval 20
          gh run watch "$SECURITY_RUN" --repo "$repo" --exit-status --interval 20
          test "$(gh run view "$CODEQL_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh run view "$SECURITY_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh api "repos/${repo}/commits/main" --jq .sha)" = "$CLEAN_SHA"
          gh issue comment 69 --repo "$repo" --body "#69 security acceptance is green on exact cleaned main ${CLEAN_SHA}: CodeQL + global sanitizer contract + exact 92-provider scan + repository-wide High/Critical gate passed. Launching native official-client Labs now."

      - name: Launch exact-SHA Android Mobile/TV and Desktop macOS/Windows readers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          dispatch_and_capture() {
            local workflow="$1" started run_id actual_sha
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$repo" --ref main >/dev/null
            run_id=""
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --event workflow_dispatch --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                actual_sha="$(gh run view "$run_id" --repo "$repo" --json headSha --jq .headSha)"
                if [ "$actual_sha" = "$CLEAN_SHA" ]; then
                  printf '%s' "$run_id"
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }

          android="$(dispatch_and_capture native-android-route-reader.yml)"
          desktop="$(dispatch_and_capture native-desktop-reader-acceptance.yml)"
          echo "ANDROID_RUN=$android" >> "$GITHUB_ENV"
          echo "DESKTOP_RUN=$desktop" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 fresh official-client Labs launched on exact cleaned main ${CLEAN_SHA}: ANDROID_RUN=${android} https://github.com/${repo}/actions/runs/${android} (Mobile + TV) ; DESKTOP_RUN=${desktop} https://github.com/${repo}/actions/runs/${desktop} (macOS + Windows)."

      - name: Wait for both native readers without losing diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          set +e
          gh run watch "$ANDROID_RUN" --repo "$repo" --exit-status --interval 20
          android_rc=$?
          gh run watch "$DESKTOP_RUN" --repo "$repo" --exit-status --interval 20
          desktop_rc=$?
          set -e
          android_conclusion="$(gh run view "$ANDROID_RUN" --repo "$repo" --json conclusion --jq .conclusion)"
          desktop_conclusion="$(gh run view "$DESKTOP_RUN" --repo "$repo" --json conclusion --jq .conclusion)"
          echo "ANDROID_RC=$android_rc" >> "$GITHUB_ENV"
          echo "DESKTOP_RC=$desktop_rc" >> "$GITHUB_ENV"
          echo "ANDROID_CONCLUSION=$android_conclusion" >> "$GITHUB_ENV"
          echo "DESKTOP_CONCLUSION=$desktop_conclusion" >> "$GITHUB_ENV"

      - name: Classify native diagnostics by owning layer
        if: always() && env.ANDROID_RUN != '' && env.DESKTOP_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rm -rf .issue69-native
          mkdir -p .issue69-native/android .issue69-native/desktop

          for pattern in \
            "native-tv-route-*-${ANDROID_RUN}" \
            "native-mobile-route-*-${ANDROID_RUN}"; do
            gh run download "$ANDROID_RUN" --repo "$repo" --pattern "$pattern" --dir .issue69-native/android || true
          done
          gh run download "$DESKTOP_RUN" --repo "$repo" --pattern "native-desktop-reader-*-${DESKTOP_RUN}" --dir .issue69-native/desktop || true

          python3 scripts/classify_native_reader_ownership.py \
            --diagnostics-root .issue69-native/android \
            --output .issue69-native/android-ownership.json
          python3 scripts/classify_native_reader_ownership.py \
            --diagnostics-root .issue69-native/desktop \
            --output .issue69-native/desktop-ownership.json

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          android=json.loads(Path('.issue69-native/android-ownership.json').read_text())
          desktop=json.loads(Path('.issue69-native/desktop-ownership.json').read_text())
          values={
              'ANDROID_DIAGNOSTIC_FILES': int(android.get('diagnosticFiles') or 0),
              'ANDROID_LAB_FAILURES': int(android.get('labEmulationFailures') or 0),
              'ANDROID_VENDOR_WAIT': int(android.get('nuvioVendorWaitFailures') or 0),
              'ANDROID_PROVIDER_LEARNING': int(android.get('providerLearningFailures') or 0),
              'ANDROID_REPOSITORY_REVIEW': int(android.get('repositoryOrManifestReview') or 0),
              'DESKTOP_DIAGNOSTIC_FILES': int(desktop.get('diagnosticFiles') or 0),
              'DESKTOP_LAB_FAILURES': int(desktop.get('labEmulationFailures') or 0),
              'DESKTOP_VENDOR_WAIT': int(desktop.get('nuvioVendorWaitFailures') or 0),
              'DESKTOP_PROVIDER_LEARNING': int(desktop.get('providerLearningFailures') or 0),
              'DESKTOP_REPOSITORY_REVIEW': int(desktop.get('repositoryOrManifestReview') or 0),
          }
          for key,value in values.items():
              print(f'{key}={value}')
          PY

      - name: Close issue 69 only on complete acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$ANDROID_CONCLUSION" = "success"
          test "$DESKTOP_CONCLUSION" = "success"
          test "${ANDROID_DIAGNOSTIC_FILES:-0}" -gt 0
          test "${DESKTOP_DIAGNOSTIC_FILES:-0}" -gt 0
          test "${ANDROID_LAB_FAILURES:-0}" -eq 0
          test "${DESKTOP_LAB_FAILURES:-0}" -eq 0
          test "$(gh run view "$ANDROID_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh run view "$DESKTOP_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh api "repos/${repo}/commits/main" --jq .sha)" = "$CLEAN_SHA"
          python3 scripts/validate_release_integrity.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py

          summary="Android diagnostics=${ANDROID_DIAGNOSTIC_FILES}, vendor-wait=${ANDROID_VENDOR_WAIT:-0}, provider-learning=${ANDROID_PROVIDER_LEARNING:-0}, repository-review=${ANDROID_REPOSITORY_REVIEW:-0}; Desktop diagnostics=${DESKTOP_DIAGNOSTIC_FILES}, vendor-wait=${DESKTOP_VENDOR_WAIT:-0}, provider-learning=${DESKTOP_PROVIDER_LEARNING:-0}, repository-review=${DESKTOP_REPOSITORY_REVIEW:-0}."
          gh issue close 69 --repo "$repo" --reason completed --comment "Issue #69 acceptance completed on exact cleaned main ${CLEAN_SHA}. Global hardening is durable and provider-agnostic; exact 92/92 published bundle security scan and CodeQL High/Critical gate are green; fresh Mobile/TV + macOS/Windows official-client Labs are green with zero Lab/emulator infrastructure failures. ${summary} Security run: https://github.com/${repo}/actions/runs/${SECURITY_RUN} ; CodeQL: https://github.com/${repo}/actions/runs/${CODEQL_RUN} ; Android: https://github.com/${repo}/actions/runs/${ANDROID_RUN} ; Desktop: https://github.com/${repo}/actions/runs/${DESKTOP_RUN}."

      - name: Report incomplete issue 69 acceptance
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 remains open. Clean SHA=${CLEAN_SHA:-unknown}; CodeQL=${CODEQL_RUN:-unknown}; security=${SECURITY_RUN:-unknown}; Android=${ANDROID_RUN:-unknown} conclusion=${ANDROID_CONCLUSION:-unknown} lab=${ANDROID_LAB_FAILURES:-unknown} vendor-wait=${ANDROID_VENDOR_WAIT:-unknown} provider-learning=${ANDROID_PROVIDER_LEARNING:-unknown}; Desktop=${DESKTOP_RUN:-unknown} conclusion=${DESKTOP_CONCLUSION:-unknown} lab=${DESKTOP_LAB_FAILURES:-unknown} vendor-wait=${DESKTOP_VENDOR_WAIT:-unknown} provider-learning=${DESKTOP_PROVIDER_LEARNING:-unknown}. The failing owning layer must be corrected before #69 can close; no Quick/Deep/Brain current campaign was launched by this one-shot."