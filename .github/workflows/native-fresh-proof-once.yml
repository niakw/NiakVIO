name: NiakVIO issue 69 exact-SHA closure proof
# Final one-shot for issue #69. It removes itself first, reseals the repository,
# then proves that exact cleaned SHA with both CodeQL layers and native clients.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-fresh-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: niakvio-native-fresh-proof-once
  cancel-in-progress: true

jobs:
  close-issue-69:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Remove one-shot and reseal exact main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/native-fresh-proof-once.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py
          git add -A
          git commit -m 'chore: seal issue 69 exact-SHA proof cleanup'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git diff --exit-code
          git push origin HEAD:main
          clean_sha="$(git rev-parse HEAD)"
          test "$clean_sha" = "$(gh api "repos/${repo}/commits/main" --jq .sha)"
          echo "CLEAN_SHA=$clean_sha" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 final proof cleanup sealed main ${clean_sha}. One-shots removed and release hashes synchronized. Starting independent security-extended CodeQL plus Default Setup/92-provider gate before native Labs."

      - name: Dispatch exact-SHA CodeQL and security
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          dispatch_and_capture() {
            local workflow="$1" started run_id actual_sha
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$repo" --ref main >/dev/null
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --event workflow_dispatch --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                actual_sha="$(gh run view "$run_id" --repo "$repo" --json headSha --jq .headSha)"
                if [ "$actual_sha" = "$CLEAN_SHA" ]; then printf '%s' "$run_id"; return 0; fi
              fi
              sleep 2
            done
            return 1
          }
          codeql="$(dispatch_and_capture codeql.yml)"
          security="$(dispatch_and_capture security-final-gate.yml)"
          echo "CODEQL_RUN=$codeql" >> "$GITHUB_ENV"
          echo "SECURITY_RUN=$security" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 security proof on ${CLEAN_SHA}: CodeQL=${codeql} (local security-extended, no upload conflict), security=${security} (Default Setup exact-SHA + 92/92 + High/Critical gate). Native Labs remain blocked until both are green."

      - name: Require both CodeQL layers green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh run watch "$CODEQL_RUN" --repo "$repo" --exit-status --interval 20
          gh run watch "$SECURITY_RUN" --repo "$repo" --exit-status --interval 20
          test "$(gh run view "$CODEQL_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh run view "$SECURITY_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh api "repos/${repo}/commits/main" --jq .sha)" = "$CLEAN_SHA"
          gh issue comment 69 --repo "$repo" --body "#69 security is fully green on exact cleaned main ${CLEAN_SHA}: local CodeQL security-extended + Default Setup exact analysis + 92/92 published-provider sanitizer + repository High/Critical gate. Launching native official clients."

      - name: Launch exact-SHA native official-client readers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          dispatch_and_capture() {
            local workflow="$1" started run_id actual_sha
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$repo" --ref main >/dev/null
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --event workflow_dispatch --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                actual_sha="$(gh run view "$run_id" --repo "$repo" --json headSha --jq .headSha)"
                if [ "$actual_sha" = "$CLEAN_SHA" ]; then printf '%s' "$run_id"; return 0; fi
              fi
              sleep 2
            done
            return 1
          }
          android="$(dispatch_and_capture native-android-route-reader.yml)"
          desktop="$(dispatch_and_capture native-desktop-reader-acceptance.yml)"
          echo "ANDROID_RUN=$android" >> "$GITHUB_ENV"
          echo "DESKTOP_RUN=$desktop" >> "$GITHUB_ENV"
          gh issue comment 69 --repo "$repo" --body "#69 fresh native Labs on ${CLEAN_SHA}: Android=${android} (Mobile + TV), Desktop=${desktop} (macOS + Windows)."

      - name: Wait both native runs and retain diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          set +e
          gh run watch "$ANDROID_RUN" --repo "$repo" --exit-status --interval 20; android_rc=$?
          gh run watch "$DESKTOP_RUN" --repo "$repo" --exit-status --interval 20; desktop_rc=$?
          set -e
          echo "ANDROID_RC=$android_rc" >> "$GITHUB_ENV"
          echo "DESKTOP_RC=$desktop_rc" >> "$GITHUB_ENV"
          echo "ANDROID_CONCLUSION=$(gh run view "$ANDROID_RUN" --repo "$repo" --json conclusion --jq .conclusion)" >> "$GITHUB_ENV"
          echo "DESKTOP_CONCLUSION=$(gh run view "$DESKTOP_RUN" --repo "$repo" --json conclusion --jq .conclusion)" >> "$GITHUB_ENV"

      - name: Classify native diagnostics
        if: always() && env.ANDROID_RUN != '' && env.DESKTOP_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rm -rf .issue69-native
          mkdir -p .issue69-native/android .issue69-native/desktop
          for pattern in "native-tv-route-*-${ANDROID_RUN}" "native-mobile-route-*-${ANDROID_RUN}"; do
            gh run download "$ANDROID_RUN" --repo "$repo" --pattern "$pattern" --dir .issue69-native/android || true
          done
          gh run download "$DESKTOP_RUN" --repo "$repo" --pattern "native-desktop-reader-*-${DESKTOP_RUN}" --dir .issue69-native/desktop || true
          python3 scripts/classify_native_reader_ownership.py --diagnostics-root .issue69-native/android --output .issue69-native/android-ownership.json
          python3 scripts/classify_native_reader_ownership.py --diagnostics-root .issue69-native/desktop --output .issue69-native/desktop-ownership.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          a=json.loads(Path('.issue69-native/android-ownership.json').read_text())
          d=json.loads(Path('.issue69-native/desktop-ownership.json').read_text())
          vals={
            'ANDROID_DIAGNOSTIC_FILES':int(a.get('diagnosticFiles') or 0),
            'ANDROID_LAB_FAILURES':int(a.get('labEmulationFailures') or 0),
            'ANDROID_VENDOR_WAIT':int(a.get('nuvioVendorWaitFailures') or 0),
            'ANDROID_PROVIDER_LEARNING':int(a.get('providerLearningFailures') or 0),
            'ANDROID_REPOSITORY_REVIEW':int(a.get('repositoryOrManifestReview') or 0),
            'DESKTOP_DIAGNOSTIC_FILES':int(d.get('diagnosticFiles') or 0),
            'DESKTOP_LAB_FAILURES':int(d.get('labEmulationFailures') or 0),
            'DESKTOP_VENDOR_WAIT':int(d.get('nuvioVendorWaitFailures') or 0),
            'DESKTOP_PROVIDER_LEARNING':int(d.get('providerLearningFailures') or 0),
            'DESKTOP_REPOSITORY_REVIEW':int(d.get('repositoryOrManifestReview') or 0),
          }
          for k,v in vals.items(): print(f'{k}={v}')
          PY

      - name: Close issue 69 on complete acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$ANDROID_CONCLUSION" = success
          test "$DESKTOP_CONCLUSION" = success
          test "${ANDROID_DIAGNOSTIC_FILES:-0}" -gt 0
          test "${DESKTOP_DIAGNOSTIC_FILES:-0}" -gt 0
          test "${ANDROID_LAB_FAILURES:-0}" -eq 0
          test "${DESKTOP_LAB_FAILURES:-0}" -eq 0
          test "$(gh run view "$ANDROID_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh run view "$DESKTOP_RUN" --repo "$repo" --json headSha --jq .headSha)" = "$CLEAN_SHA"
          test "$(gh api "repos/${repo}/commits/main" --jq .sha)" = "$CLEAN_SHA"
          python3 scripts/validate_release_integrity.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py
          summary="Android diagnostics=${ANDROID_DIAGNOSTIC_FILES}, vendor-wait=${ANDROID_VENDOR_WAIT:-0}, provider-learning=${ANDROID_PROVIDER_LEARNING:-0}, repository-review=${ANDROID_REPOSITORY_REVIEW:-0}; Desktop diagnostics=${DESKTOP_DIAGNOSTIC_FILES}, vendor-wait=${DESKTOP_VENDOR_WAIT:-0}, provider-learning=${DESKTOP_PROVIDER_LEARNING:-0}, repository-review=${DESKTOP_REPOSITORY_REVIEW:-0}."
          gh issue close 69 --repo "$repo" --reason completed --comment "Issue #69 acceptance completed on exact cleaned main ${CLEAN_SHA}. 92/92 sanitizer and both CodeQL layers are green; fresh Mobile/TV + macOS/Windows official-client Labs are green with zero Lab/emulator infrastructure failures. ${summary} CodeQL=https://github.com/${repo}/actions/runs/${CODEQL_RUN} security=https://github.com/${repo}/actions/runs/${SECURITY_RUN} Android=https://github.com/${repo}/actions/runs/${ANDROID_RUN} Desktop=https://github.com/${repo}/actions/runs/${DESKTOP_RUN}."

      - name: Report incomplete acceptance
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 remains open. SHA=${CLEAN_SHA:-unknown}; CodeQL=${CODEQL_RUN:-unknown}; security=${SECURITY_RUN:-unknown}; Android=${ANDROID_RUN:-unknown} conclusion=${ANDROID_CONCLUSION:-unknown} lab=${ANDROID_LAB_FAILURES:-unknown} vendor=${ANDROID_VENDOR_WAIT:-unknown} provider-learning=${ANDROID_PROVIDER_LEARNING:-unknown}; Desktop=${DESKTOP_RUN:-unknown} conclusion=${DESKTOP_CONCLUSION:-unknown} lab=${DESKTOP_LAB_FAILURES:-unknown} vendor=${DESKTOP_VENDOR_WAIT:-unknown} provider-learning=${DESKTOP_PROVIDER_LEARNING:-unknown}. No Quick/Deep/current-Brain campaign was launched."