name: TEMP - Max Repair Provider Prune V44P

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-prune-v44p.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate prune contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/provider_prune_batch_history_test.py
          python3 tests/prune_unreferenced_providers_test.py
          python3 scripts/prune_unreferenced_providers.py --dry-run | tee /tmp/v44p-dry-run.txt
          echo '--- dry-run summary ---'
          cat /tmp/v44p-dry-run.txt

      - name: Apply authoritative rolling-generation prune
        shell: bash
        run: |
          set -euo pipefail
          before=$(find providers -maxdepth 1 -type f -name '*.js' | wc -l)
          python3 scripts/prune_unreferenced_providers.py | tee /tmp/v44p-prune.txt
          after=$(find providers -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "V44P_PROVIDER_JS before=$before after=$after delta=$((after-before))"
          python3 scripts/validate_published_overrides.py
          python3 scripts/finalize_provider_v3_minimizer.py --check
          python3 tests/provider_v3_minimizer_publication_pipeline_test.py
          python3 tests/provider_v3_minimizer_published_test.py
          python3 tests/provider_prune_batch_history_test.py
          python3 tests/prune_unreferenced_providers_test.py
          git diff --check

      - name: Persist prune only if validated
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A providers provider-bases provider-security-revocations.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(providers): prune superseded generations after V44'
          fi
          git fetch origin fix/non-display-recovery-20260916
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "V44P_PERSISTED sha=$(git rev-parse HEAD)"
