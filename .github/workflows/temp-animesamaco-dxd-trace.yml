name: TEMP - AnimeSamaCo DxD Trace

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-animesamaco-dxd-trace.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize current recovery source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_non_display_recovery_html_security_v1.py
          python3 scripts/register_non_display_recovery_v1.py
          python3 scripts/reapply_published_overrides.py
          python3 tests/animesamaco_non_display_player_discovery_v2_test.py
      - name: Trace local versus upstream and current search HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,pathlib,re,subprocess,sys,tempfile,urllib.parse,urllib.request
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          fx={'slug':'high-school-dxd-2012-s01e01','tmdbId':'45950','mediaType':'anime','category':'anime','title':'High School DxD','year':2012,'season':1,'episode':1}
          local=p.local_catalog()['animesama-co']; ups,_=v2.upstream_catalog(); up=ups['animesama-co']
          def run(label,path,payload):
            ctx=p.context_for(payload)
            cp=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(payload,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=45,check=False)
            result=None
            for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                try: result=json.loads(line.split('=',1)[1])
                except Exception: pass
            if not isinstance(result,dict):
              print('TRACE',label,'NO_RESULT exit',cp.returncode);return
            err=result.get('error_details') if isinstance(result.get('error_details'),dict) else {}
            print('TRACE',label,'streams',result.get('stream_count'),'raw',result.get('raw_stream_count'),'error',err.get('code') or err.get('name'))
            for obs in result.get('network_observations') or []:
              if not isinstance(obs,dict) or obs.get('infrastructure'): continue
              safe={k:obs.get(k) for k in ('stage','host','method','path_pattern','status','ok','error_code','proof_url','proof_body_kind','proof_body_fields','proof_body_values') if obs.get(k) not in (None,{},[],'')}
              print('ROUTE',label,json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with tempfile.TemporaryDirectory() as td:
            up_path=pathlib.Path(td)/'up.js';up_path.write_bytes(p.get_bytes(up['url']))
            run('upstream',up_path,v3.fixture_payload(fx,'anime',upstream=True))
            run('niak',local['path'],v3.fixture_payload(fx,'anime',upstream=False))
          base='https://animesama.co'
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36','Accept':'text/html, */*','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.7','Referer':base+'/','X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'}
          for query in ['High School DxD','Highschool DxD','HighSchool DxD','High School D×D','DxD','Highschool']:
            req=urllib.request.Request(base+'/template-php/defaut/fetch.php',data=('query='+urllib.parse.quote(query)).encode(),headers=headers,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=15) as r: text=r.read(1000000).decode('utf-8','replace'); status=r.status
            except Exception as e:
              print('SEARCH',query,'ERROR',type(e).__name__,str(e)[:120]);continue
            anchors=[]
            for m in re.finditer(r'<a[^>]+href=["\']([^"\']*/anime/[^"\'#?]+\.html)["\'][^>]*>([\s\S]*?)</a>',text,re.I):
              label=re.sub(r'<[^>]+>',' ',m.group(2));label=html.unescape(re.sub(r'\s+',' ',label)).strip()
              anchors.append((m.group(1),label))
            print('SEARCH',query,'status',status,'bytes',len(text),'asn',text.count('asn-search-result'),'anchors',json.dumps(anchors[:12],ensure_ascii=False))
          PY
