name: Publish Desktop runtime compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/publish-desktop-runtime-compat"
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'run: desktop runtime publication'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Synchronize queued checkout with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate compatibility tooling
        run: |
          python -m py_compile scripts/provider_patches/desktop_runtime_compat_v1.py
          python -m py_compile scripts/publish_desktop_runtime_compat.py
          python tests/desktop_runtime_compat_test.py

      - name: Publish runtime-compatible provider bundles
        id: publication
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/publish_desktop_runtime_compat.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              'coflix', 'frenchstream', 'movix', 'streamzo',
              'flemmix', 'wookafr', 'hindmoviez', 'purstream',
          }
          report = json.loads(Path('automation/desktop-runtime-compat-v1.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id', '')).casefold(): row for row in manifest.get('scrapers', [])}
          completed = set(report.get('published', [])) | set(report.get('preserved', []))
          assert expected <= completed, (expected - completed, report)
          for provider_id in expected:
              row = rows[provider_id]
              assert '--desktop-runtime-v1--' in row['filename'], row
              text = Path(row['filename']).read_text(encoding='utf-8', errors='replace')
              assert 'NUVIO_DESKTOP_RUNTIME_COMPAT_V1' in text, provider_id
          assert rows['4khdhub']['enabled'] is False
          assert rows['4khdhubnew']['enabled'] is True
          if 'nakios' in rows:
              assert rows['nakios']['enabled'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"changed={'true' if report.get('changed') else 'false'}\n")
          print('published:', ', '.join(report.get('published', [])) or 'none; already compatible')
          print('disabled:', ', '.join(report.get('disabled', [])) or 'none; already disabled')
          PY

      - name: Bump and synchronize release
        if: steps.publication.outputs.changed == 'true'
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regressions
        if: steps.publication.outputs.changed == 'true'
        run: npm test

      - name: Regenerate and validate release integrity
        if: steps.publication.outputs.changed == 'true'
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py

      - name: Commit runtime-compatible release
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/*--desktop-runtime-v1--*.js \
            automation/desktop-runtime-compat-v1.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish Nuvio Desktop runtime-compatible providers"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
