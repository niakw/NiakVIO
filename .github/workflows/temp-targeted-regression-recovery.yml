name: TEMP - Targeted Regression Recovery Probes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-targeted-regression-recovery.yml'
      - 'scripts/provider_patches/**'
      - 'tests/provider_*runtime*_test.py'
      - 'tests/provider_*transport*_test.py'
      - 'tests/user_provider_manual_evidence_crosscheck_test.py'
      - 'tests/allanime_site_runtime_contract_test.py'
      - 'tests/allanime_current_runtime_behavior_test.py'
      - 'tests/provider_yflix_runtime_contract_test.py'
      - 'tests/provider_quick_yield_fixture_priority_test.py'
      - 'tests/provider_census_scope_history_test.py'
      - 'tests/provider_repair_batch_*_test.py'
      - 'scripts/build_provider_repair_batch_plan.py'
      - 'scripts/run_provider_repair_batch.py'
      - 'scripts/refine_provider_repair_batches.py'
      - 'tests/provider_targeted_recovery_sharding_test.py'
      - '.github/workflows/provider-targeted-recovery-sharded.yml'
      - 'scripts/merge_provider_targeted_recovery_shards.py'
      - 'scripts/run_provider_targeted_recovery.py'
      - 'automation/provider-repair-batch-plan-latest.json'
      - 'provider-overrides.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-targeted-regression-recovery.yml'
      - 'scripts/provider_patches/**'
      - 'tests/provider_*runtime*_test.py'
      - 'tests/provider_*transport*_test.py'
      - 'tests/user_provider_manual_evidence_crosscheck_test.py'
      - 'tests/allanime_site_runtime_contract_test.py'
      - 'tests/allanime_current_runtime_behavior_test.py'
      - 'tests/provider_yflix_runtime_contract_test.py'
      - 'tests/provider_quick_yield_fixture_priority_test.py'
      - 'tests/provider_census_scope_history_test.py'
      - 'tests/provider_repair_batch_*_test.py'
      - 'scripts/build_provider_repair_batch_plan.py'
      - 'scripts/run_provider_repair_batch.py'
      - 'scripts/refine_provider_repair_batches.py'
      - 'provider-overrides.json'

permissions:
  contents: read

concurrency:
  group: niakvio-targeted-regression-recovery
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.route.outputs.source_sha }}
      provider_count: ${{ steps.route.outputs.provider_count }}
      should_run: ${{ steps.route.outputs.should_run }}
      target_providers: ${{ steps.route.outputs.target_providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: route
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python scripts/select_provider_materialization_scope.py --base "$base" --head HEAD --output /tmp/provider-materialization-scope.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,subprocess
          d=json.load(open("manifest.json",encoding="utf-8"))
          scope=json.load(open("/tmp/provider-materialization-scope.json",encoding="utf-8"))
          count=len([x for x in d.get("scrapers") or [] if isinstance(x,dict)])
          message=subprocess.check_output(["git","log","-1","--pretty=%s"],text=True).strip()
          bulk_push=(
              os.environ.get("GITHUB_EVENT_NAME")=="push"
              and (
                  message.startswith("provider: bulk stage ")
                  or message.startswith("provider: bulk activate ")
              )
          )
          targets=list(scope.get("providers") or []) if scope.get("mode")=="providers" else []
          changed=set(scope.get("changedPaths") or [])
          trigger_path=".github/triggers/provider-recognition-repair-v6.json"
          if not targets and scope.get("mode")=="none" and trigger_path in changed:
              try:
                  trigger=json.load(open(trigger_path,encoding="utf-8"))
              except Exception:
                  trigger={}
              targets=[
                  str(value or "").strip().casefold().replace("_","-")
                  for value in trigger.get("targetProviders") or []
                  if str(value or "").strip()
              ]
          print(f"source_sha={subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}")
          print(f"provider_count={count}")
          print("target_providers="+",".join(sorted(set(targets))))
          print(f"should_run={'true' if count<=120 and not bulk_push else 'false'}")
          PY

  probe:
    needs: size
    # Small catalogues use this single job. Large catalogues are routed to
    # provider-targeted-recovery-sharded.yml after the sharded census publishes
    # a current repair batch plan.
    if: ${{ needs.size.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ github.event_name == 'push' && 'write' || 'read' }}
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: '60'
      NIAKVIO_QUICK_YIELD_MAX_SAMPLES: '8'
      TARGET_PROVIDERS: ${{ needs.size.outputs.target_providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.size.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate repair contracts
        run: |
          set -euo pipefail
          python tests/provider_domain_metadata_reconcile_test.py
          python tests/user_provider_manual_evidence_crosscheck_test.py
          python tests/animesalt_runtime_contract_test.py
          python tests/allanime_site_runtime_contract_test.py
          python tests/allanime_current_runtime_behavior_test.py
          python tests/provider_yflix_runtime_contract_test.py
          python tests/provider_moviebox_vidsrcme_runtime_contract_test.py
          python tests/provider_moviebox_current_runtime_behavior_test.py
          python tests/provider_mallumv_current_runtime_behavior_test.py
          python tests/provider_wookafr_current_runtime_behavior_test.py
          python tests/provider_vidfast_multibase_runtime_test.py
          python tests/provider_allwish_runtime_contract_test.py
          python tests/vostfree_transport_contract_test.py
          python tests/provider_animesamaco_domain_data_contract_test.py
          python tests/presentation_revision_parser_test.py
          python tests/provider_terminal_chain_repairs_test.py
          python tests/voiranime_rip_runtime_contract_test.py
          python tests/voiranime_episode_selection_contract_test.py
          python tests/dynamic_provider_scope_contract_test.py
          python tests/provider_flemmix_anime_ultime_runtime_contract_test.py
          python tests/provider_coflix_animesultra_runtime_contract_test.py
          python tests/provider_sekai_runtime_contract_test.py
          python tests/provider_moviesmod_runtime_contract_test.py
          python tests/provider_movieshunt_runtime_contract_test.py
          python tests/provider_quick_yield_fixture_priority_test.py
          python tests/provider_census_scope_history_test.py
          python tests/provider_helper_recipe_execution_boundary_test.py
          python tests/provider_published_capability_projection_test.py
          node tests/provider_hindmoviez_identity_contract_test.cjs
          python tests/uhdmovies_runtime_contract_test.py
          python tests/uhdmovies_terminal_multiserver_behavior_test.py
          python tests/provider_4khdhub_runtime_behavior_test.py
          python tests/provider_incomplete_player_url_rejection_test.py
          python tests/provider_runtime_dispatch_diagnostics_test.py
          python tests/provider_census_identity_diagnostics_test.py
          python tests/provider_materialization_byte_validation_contract_test.py
          python tests/provider_shared_player_fanout_contract_test.py
          python tests/provider_repair_batch_plan_test.py
          python tests/provider_repair_batch_runner_test.py
          python tests/provider_repair_batch_refinement_test.py
          python tests/provider_targeted_recovery_sharding_test.py
          python tests/provider_targeted_recovery_sharded_workflow_test.py

      - name: Persist structured Provider CONFIG drifts on repair branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tmp/provider-max-repair-proof-20260919' }}
        shell: bash
        run: |
          set -euo pipefail
          branch="tmp/provider-max-repair-proof-20260919"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python - <<'PY'
          import json,sys
          from pathlib import Path
          ROOT=Path.cwd()
          sys.path.insert(0,str(ROOT/"scripts"))
          from provider_patch_blocks import decode_managed_data, validate_managed_fixes
          from materialize_provider_v3_all import provider_model, normalize_anime_transport_compatibility
          from provider_base_store import build_provider_data_model, canonical_id
          from current_provider_scope import active_provider_ids
          from domain_refresh_transaction_v2 import rebuild_provider_configs
          from sync_manifest_projection_rows import sync

          def load(path):
              return json.loads((ROOT/path).read_text(encoding="utf-8"))

          manifest=load("manifest.json")
          overrides=load("provider-overrides.json")
          static=load("automation/provider-v3-static-knowledge.json")
          patches=overrides["provider_patches"]
          capabilities=overrides["provider_capabilities"]
          static_rows=static["providers"]
          active=active_provider_ids()
          drift=[]
          details={}
          for row in manifest.get("scrapers") or []:
              pid=canonical_id(row.get("id"))
              if pid not in active:
                  continue
              patch=patches.get(pid)
              capability=capabilities.get(pid)
              static_row=static_rows.get(pid)
              if not all(isinstance(v,dict) for v in (patch,capability,static_row)):
                  raise SystemExit(f"{pid}: incomplete structured DATA")
              path=ROOT/str(row.get("filename") or "")
              if not path.is_file():
                  raise SystemExit(f"{pid}: published file missing {path}")
              text=path.read_text(encoding="utf-8")
              ids=validate_managed_fixes(text)
              config_id=f"PROVIDER.{pid.upper()}.CONFIG.V1"
              if config_id not in ids:
                  raise SystemExit(f"{pid}: CONFIG Lego missing")
              published=decode_managed_data(text,config_id)
              entry=json.loads(json.dumps(row))
              normalize_anime_transport_compatibility(entry)
              model=provider_model(pid,patch,capability,static_row)
              expected=build_provider_data_model(pid,entry,known_site=model.get("knownSite"),provider_model=model)
              if published!=expected:
                  drift.append(pid)
                  details[pid]=[
                      key for key in sorted(set(published)|set(expected))
                      if published.get(key)!=expected.get(key)
                  ]
          print("FIELD_PROVIDER_CONFIG_DRIFT",json.dumps({"providers":drift,"keys":details},sort_keys=True))
          if not drift:
              raise SystemExit(0)
          updates=rebuild_provider_configs(drift)
          if sorted(row.get("provider") for row in updates)!=sorted(drift):
              raise SystemExit(f"unexpected rebuild scope drift={drift!r} updates={updates!r}")
          sync(check=False)

          # Recompute every changed provider against the post-rebuild manifest.
          manifest=load("manifest.json")
          rows={canonical_id(row.get("id")):row for row in manifest.get("scrapers") or []}
          for pid in drift:
              row=rows[pid]
              entry=json.loads(json.dumps(row))
              normalize_anime_transport_compatibility(entry)
              model=provider_model(pid,patches[pid],capabilities[pid],static_rows[pid])
              expected=build_provider_data_model(pid,entry,known_site=model.get("knownSite"),provider_model=model)
              text=(ROOT/row["filename"]).read_text(encoding="utf-8")
              published=decode_managed_data(text,f"PROVIDER.{pid.upper()}.CONFIG.V1")
              assert published==expected,(pid,{
                  key:{"published":published.get(key),"expected":expected.get(key)}
                  for key in sorted(set(published)|set(expected))
                  if published.get(key)!=expected.get(key)
              })
          print("FIELD_PROVIDER_CONFIG_REMATERIALIZED",json.dumps(sorted(drift)))
          PY
          if git diff --quiet && git diff --cached --quiet; then
            echo "Published Provider CONFIG DATA already current; no branch mutation"
            exit 0
          fi
          git status --short
          git diff --stat
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(["git","status","--short"],text=True).splitlines()
          touched=[row[3:] for row in rows if len(row)>=4]
          allowed_exact={
              "manifest.json",
              "provider-v3-materialization.json",
              "vf/manifest.json",
              "no-anime/manifest.json",
              "vf-no-anime/manifest.json",
              "native-hub46/manifest.json",
              "manifest-hub46.json",
              "provider_catalog.json",
          }
          bad=[
              p for p in touched
              if p not in allowed_exact and not (
                  p.startswith("providers/") and p.endswith(".js")
              )
          ]
          if bad:
              raise SystemExit(f"unexpected generated paths: {bad}")
          PY
          python scripts/audit_provider_v3_static.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_stream_output_guard_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 0; }
          git commit -m "fix(data): rematerialize current provider CONFIG drifts"
          git push origin HEAD:"$branch"

      - name: Materialize current provider bytes
        run: |
          set -euo pipefail
          python tests/provider_domain_metadata_reconcile_test.py
          if [ -n "${TARGET_PROVIDERS:-}" ]; then
            IFS=',' read -r -a providers <<< "$TARGET_PROVIDERS"
            reconcile=(python scripts/reconcile_targeted_provider_publication.py)
            for provider in "${providers[@]}"; do
              provider="$(printf '%s' "$provider" | xargs)"
              [ -z "$provider" ] && continue
              python scripts/reconcile_provider_domain_metadata.py --rebuild --provider "$provider"
              python scripts/materialize_provider_v3_one.py "$provider"
              reconcile+=(--provider "$provider")
            done
            "${reconcile[@]}"
            echo "FIELD_TARGETED_RECOVERY_MATERIALIZATION mode=providers providers=${#providers[@]} ids=$TARGET_PROVIDERS"
          else
            python scripts/reconcile_provider_domain_metadata.py --rebuild
            python scripts/materialize_provider_base_v3_store.py
            python scripts/materialize_provider_v3_all.py
            echo "FIELD_TARGETED_RECOVERY_MATERIALIZATION mode=all providers=dynamic"
          fi
          python scripts/validate_published_provider_config.py
          python tests/provider_js_lego_ownership_test.py

      - name: Probe recovered regressions adaptively
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          args=(python scripts/run_provider_targeted_recovery.py
            --status automation/provider-census-status.json
            --plan automation/provider-repair-batch-plan-latest.json
            --history automation/provider-census-proof-history.json
            --output automation/provider-targeted-regression-recovery-latest.json
            --shard-count 1
            --shard-index 0
            --max-workers 20
            --run-id "$GITHUB_RUN_ID"
            --sha "${{ needs.size.outputs.source_sha }}")
          if [ -n "${TARGET_PROVIDERS:-}" ]; then
            IFS=',' read -r -a providers <<< "$TARGET_PROVIDERS"
            for provider in "${providers[@]}"; do
              provider="$(printf '%s' "$provider" | xargs)"
              [ -z "$provider" ] || args+=(--provider "$provider")
            done
          fi
          "${args[@]}"
          python scripts/refine_provider_repair_batches.py \
            --plan automation/provider-repair-batch-plan-latest.json \
            --verdict automation/provider-targeted-regression-recovery-latest.json \
            --output automation/provider-repair-batch-refined-latest.json

      - name: Persist targeted verdict
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/provider-targeted-regression-recovery-latest.json || exit 0
          verdict_tmp="/tmp/provider-targeted-regression-recovery-${GITHUB_RUN_ID}.json"
          refined_tmp="/tmp/provider-repair-batch-refined-${GITHUB_RUN_ID}.json"
          cp automation/provider-targeted-regression-recovery-latest.json "$verdict_tmp"
          cp automation/provider-repair-batch-refined-latest.json "$refined_tmp"
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          source_sha="$(python -c 'import json; d=json.load(open("'"$verdict_tmp"'")); print(str(d.get("triggerSha") or ""))')"
          if [ -z "$source_sha" ] || [ "$source_sha" != "$remote_main" ]; then
            echo "FIELD_TARGETED_RECOVERY_STALE_NOT_PERSISTED source=${source_sha:-missing} remote=$remote_main"
            exit 0
          fi
          git reset --hard origin/main
          mkdir -p automation
          cp "$verdict_tmp" automation/provider-targeted-regression-recovery-latest.json
          cp "$refined_tmp" automation/provider-repair-batch-refined-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/provider-targeted-regression-recovery-latest.json automation/provider-repair-batch-refined-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci(repair): persist targeted regression verdict"
          git push origin HEAD:main

# POST_RELEASE_REVALIDATION_20260919
