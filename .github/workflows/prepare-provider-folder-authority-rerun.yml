name: SHORT - Prepare provider-folder authority rerun
on:
  push:
    branches: [fix/active44-durability-20260915]
    paths: ['.github/workflows/prepare-provider-folder-authority-rerun.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          persist-credentials: true
      - name: Remove current numeric provider policy from architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          architecture=Path('automation/provider-v3-architecture.json')
          data=json.loads(architecture.read_text(encoding='utf-8'))

          route=data['route_recognition']
          route.pop('provider_object_count',None)
          route['provider_scope_authority']='scripts/current_provider_scope.py:visible_provider_ids'

          manual=data['manual_reconstruction']
          manual.pop('expected_provider_count',None)
          manual['full_catalogue']=False
          manual['provider_scope_authority']='scripts/current_provider_scope.py:active_provider_ids'

          lab=data['native_lab_contract']
          lab.pop('provider_count',None)
          lab['provider_scope_authority']='scripts/current_provider_scope.py:active_provider_ids'

          plan=data['provider_plan_contract']
          plan.pop('catalogue_provider_count',None)
          plan['provider_scope_authority']='scripts/current_provider_scope.py:visible_provider_ids'

          architecture.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          docs=Path('tests/provider_v3_documentation_contract_test.py')
          t=docs.read_text(encoding='utf-8')
          t=t.replace('from current_provider_scope import active_provider_count',
                      'from current_provider_scope import active_provider_count, visible_provider_count')
          t=t.replace('EXPECTED = active_provider_count()','ACTIVE_EXPECTED = active_provider_count()\nVISIBLE_EXPECTED = visible_provider_count()')
          t=t.replace('assert machine["manual_reconstruction"]["expected_provider_count"] == EXPECTED',
                      'assert "expected_provider_count" not in machine["manual_reconstruction"]\nassert machine["manual_reconstruction"]["provider_scope_authority"] == "scripts/current_provider_scope.py:active_provider_ids"')
          t=t.replace('assert plan["catalogue_provider_count"] == EXPECTED',
                      'assert "catalogue_provider_count" not in plan\nassert plan["provider_scope_authority"] == "scripts/current_provider_scope.py:visible_provider_ids"')
          t=t.replace('assert lab["provider_count"] == EXPECTED',
                      'assert "provider_count" not in lab\nassert lab["provider_scope_authority"] == "scripts/current_provider_scope.py:active_provider_ids"')
          t=t.replace('assert len(rows) == EXPECTED',
                      'assert len(rows) == VISIBLE_EXPECTED\nassert sum(1 for row in rows if row.get("enabled") is not False) == ACTIVE_EXPECTED')
          t=t.replace('== EXPECTED','== ACTIVE_EXPECTED')
          # The broad replacement above is harmless for active-only assertions but must not restore a numeric machine key.
          t=t.replace('assert machine["manual_reconstruction"]["expected_provider_count"] == ACTIVE_EXPECTED',
                      'assert "expected_provider_count" not in machine["manual_reconstruction"]\nassert machine["manual_reconstruction"]["provider_scope_authority"] == "scripts/current_provider_scope.py:active_provider_ids"')
          docs.write_text(t,encoding='utf-8')
          PY
          python -m py_compile tests/provider_v3_documentation_contract_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('automation/provider-v3-architecture.json').read_text())
          assert 'provider_object_count' not in data['route_recognition']
          assert 'expected_provider_count' not in data['manual_reconstruction']
          assert 'provider_count' not in data['native_lab_contract']
          assert 'catalogue_provider_count' not in data['provider_plan_contract']
          assert data['route_recognition']['provider_scope_authority'].endswith(':visible_provider_ids')
          assert data['manual_reconstruction']['provider_scope_authority'].endswith(':active_provider_ids')
          assert data['native_lab_contract']['provider_scope_authority'].endswith(':active_provider_ids')
          assert data['provider_plan_contract']['provider_scope_authority'].endswith(':visible_provider_ids')
          print('ARCHITECTURE_DYNAMIC_SCOPE_OK')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/provider-v3-architecture.json tests/provider_v3_documentation_contract_test.py
          git commit -m 'fix: make provider architecture scope identity-driven'
          git push origin HEAD:fix/active44-durability-20260915
