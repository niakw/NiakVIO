name: WORKBENCH - V18.4 Forward Compatibility V4

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-semantic-transport-repair-v2.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-workbench-v18-4-forward-compat-v4
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Make V18.4 validation forward-compatible without weakening trace security
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/upgrade_provider_correlated_value_json_text_v18_4.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def validate(text: str | None = None) -> None:\n')
          end = text.index('\n\ndef main() -> int:\n', start)
          replacement = '''def validate(text: str | None = None) -> None:\n    value = text if text is not None else BASE.read_text(encoding="utf-8")\n    if value.count(MARKER) != 1:\n        raise AssertionError(f"V18.4 marker count={value.count(MARKER)}")\n    if value.count(TRACE_MARKER) != 1:\n        raise AssertionError(f"V18.4 trace marker count={value.count(TRACE_MARKER)}")\n\n    # Invariants owned by V18.4 itself and still required after later V20.x\n    # response-value migrations. Later owners may replace local variable names,\n    # id/slug representation and replay depth, but not this bounded trace API.\n    for needle in (\n        "function _spv184Trace(stage, mediaType, providerId, stepIndex, route)",\n        "globalThis.__nuvioProviderValueTraceV18",\n        'stage: _text(stage).slice(0, 64)',\n        'providerId: _text(providerId).slice(0, 160)',\n        'route: _text(route).slice(0, 240)',\n        '\"lane_skip\"',\n        '\"plan_selected\"',\n        "const rawSearchValue = _text(searchPayload.value).trim();",\n        "rawSearchValue.length <= 4 * 1024 * 1024",\n        '\"step_shape_rejected\"',\n        '\"step_url_empty\"',\n        '\"step_fetch\"',\n        '\"step_response\"',\n    ):\n        if needle not in value:\n            raise AssertionError(f"V18.4 missing {needle}")\n\n    legacy_identity_bridge = all(needle in value for needle in (\n        "_spv18ProviderIdFromJson(JSON.parse(rawSearchValue), meta)",\n        "if (!providerId) providerId = _spv18ProviderIdFromHtml(rawSearchValue, meta);",\n        "providerId = _spv18ProviderIdFromJson(searchPayload.value, meta);",\n    ))\n    response_value_bridge = all(needle in value for needle in (\n        "_spv20ProviderValuesFromJson(JSON.parse(rawSearchValue), meta)",\n        "providerValues = _spv20ProviderValuesFromHtml(rawSearchValue, meta);",\n        "providerValues = _spv20ProviderValuesFromJson(searchPayload.value, meta);",\n    ))\n    strict_v205_bridge = all(needle in value for needle in (\n        "NIAKVIO_PROVIDER_RESPONSE_VALUE_DEPENDENCY_V20_5",\n        "providerValues = _spv205StrictProviderValues(",\n        "const providerTraceId = providerValues.id || providerValues.slug || \\\"\\\";",\n    ))\n    if not legacy_identity_bridge and not response_value_bridge and not strict_v205_bridge:\n        raise AssertionError(\n            "V18.4 JSON-text identity bridge missing legacy V18.4 or current V20.x owner"\n        )\n\n    legacy_trace = (\n        '_spv184Trace(providerId ? "identity_hit" : "identity_miss", '\n        'mediaType, providerId, -1, searchRoute);'\n    )\n    dependency_trace = (\n        '_spv184Trace(providerTraceId ? "identity_hit" : "identity_miss", '\n        'mediaType, providerTraceId, -1, searchRoute);'\n    )\n    if legacy_trace not in value and dependency_trace not in value:\n        raise AssertionError(\n            "V18.4 identity trace missing legacy providerId or V20.5 providerTraceId owner"\n        )\n\n    legacy_depth = "const valueSteps = (plan.steps || []).slice(0, 4);"\n    current_depth = "const valueSteps = (plan.steps || []).slice(0, 8);"\n    if legacy_depth not in value and current_depth not in value:\n        raise AssertionError(\n            "V18.4 provider-value depth missing legacy 4 or current V20.5 depth 8"\n        )\n\n    # Security check must inspect the V18.4 trace helper itself, not every helper\n    # later migrations inserted before another resolver. V20.5 legitimately\n    # contains words such as `authorization` in its *rejection* filters; that is\n    # not trace output. Keep the forbidden-field policy unchanged and narrow only\n    # the ownership window.\n    trace_start = value.index("/* NIAKVIO_PROVIDER_VALUE_TRACE_V18_4 */")\n    trace_function = value.index("function _spv184Trace(", trace_start)\n    trace_end = value.find("\\n}\\n", trace_function)\n    if trace_end < 0:\n        raise AssertionError("V18.4 trace helper end missing")\n    trace_window = value[trace_start : trace_end + 3].lower()\n    if "globalthis.__nuvioprovidervaluetracev18" not in trace_window:\n        raise AssertionError("V18.4 trace helper does not own the bounded trace object")\n    for forbidden in ("authorization", "cookie", "set-cookie", "requestheaders", "responsebody"):\n        if forbidden in trace_window:\n            raise AssertionError(f"V18.4 trace leaks forbidden field {forbidden}")\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          memory = Path('MEMORY.md')
          current = memory.read_text(encoding='utf-8')
          heading = '## 2026-09-10 — Repair migration forward-compatibility gate'
          if heading not in current:
              current = current.rstrip() + '''\n\n## 2026-09-10 — Repair migration forward-compatibility gate\n\n- Corrected semantic/transport Repair uses the authoritative 188-task matrix; anime-only no longer gains an artificial movie lane and TV/anime episodic transport keeps `tv + series`.\n- Fresh Repair runs then exposed stale *migration validators*, not provider/runtime failures: Source Plan V10 expected its pre-V14 materializer call shape; V18.4 expected its pre-V20 response-value scalar/depth/trace surroundings.\n- V10 validation is now forward-compatible with V14 while still requiring `runtime_domain_replacements` as the only executable domain-replacement authority.\n- V18.4 validation must preserve its bounded JSON-text bridge and sanitized trace but accept the current V20.x id/slug owner and depth-8 dependency replay. Its secret-leak audit is scoped to the actual `_spv184Trace` helper; later security-filter code containing words such as `authorization` is not trace output.\n- These fixes change validators only. They do not alter provider DATA, routes, runtime algorithms or accepted stream evidence. A fresh full authoritative Repair + four-version gate remains mandatory before cleanup/merge.\n'''
              memory.write_text(current, encoding='utf-8')

          print('V18_4_FORWARD_COMPAT_V4_PATCH_OK')
          PY
          git diff --check

      - name: Validate exact failing chain and current V20.5 ownership
        run: |
          set -euo pipefail
          # This is the exact migration family that failed inside canonical Repair.
          python scripts/upgrade_provider_search_detail_bridge_v17.py
          python tests/provider_response_value_correlation_v20_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python - <<'PY'
          from pathlib import Path
          base = Path('scripts/provider_base_store.py').read_text(encoding='utf-8')
          assert 'NIAKVIO_PROVIDER_CORRELATED_VALUE_JSON_TEXT_V18_4' in base
          assert 'NIAKVIO_PROVIDER_RESPONSE_VALUE_DEPENDENCY_V20_5' in base
          assert 'const providerTraceId = providerValues.id || providerValues.slug || "";' in base
          assert '_spv184Trace(providerTraceId ? "identity_hit" : "identity_miss"' in base
          assert 'const valueSteps = (plan.steps || []).slice(0, 8);' in base

          # Prove the trace helper itself still exposes only the bounded fields.
          start = base.index('/* NIAKVIO_PROVIDER_VALUE_TRACE_V18_4 */')
          fn = base.index('function _spv184Trace(', start)
          end = base.find('\n}\n', fn)
          assert end >= 0
          trace = base[start:end+3].lower()
          for forbidden in ('authorization','cookie','set-cookie','requestheaders','responsebody'):
              assert forbidden not in trace, forbidden
          print('V18_4_V20_5_FORWARD_COMPAT_OK trace_security=bounded')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          allowed = {
              'scripts/upgrade_provider_correlated_value_json_text_v18_4.py',
              'MEMORY.md',
          }
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit('forward-compat validation mutated runtime/control files: ' + ','.join(extra))
          print('V18_4_FORWARD_COMPAT_DIFF_OK files=' + ','.join(sorted(changed)))
          PY

      - name: Commit validator and durable checkpoint only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/upgrade_provider_correlated_value_json_text_v18_4.py MEMORY.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'scripts/upgrade_provider_correlated_value_json_text_v18_4.py','MEMORY.md'}
          assert changed == expected, (changed, expected)
          PY
          git commit -m 'fix(repair): keep V18.4 validator compatible with current value owner'
          git fetch origin workbench/systemic-recovery-20260909
          test "$(git rev-parse ${{ github.sha }})" = "$(git rev-parse origin/workbench/systemic-recovery-20260909)"
          git push origin HEAD:workbench/systemic-recovery-20260909
          echo "V18_4_FORWARD_COMPAT_COMMIT sha=$(git rev-parse HEAD)"
