name: WORKBENCH - Source Plan V10 Forward Compatibility

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-semantic-transport-repair-v2.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-workbench-v10-forward-compat
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Make V10 validator accept the current V14 materializer shape
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/upgrade_provider_source_plan_v10_impl.py')
          text=path.read_text(encoding='utf-8')
          old='''        '"proofSearchBases"',\n        '"domainSubstitutions": _runtime_domain_substitutions(patch)',\n    ):\n        if needle not in value:\n            raise AssertionError(f"V10 materializer missing: {needle}")\n'''
          new='''        '"proofSearchBases"',\n    ):\n        if needle not in value:\n            raise AssertionError(f"V10 materializer missing: {needle}")\n    # V10 itself introduced the one-argument projector. Later V14 adds\n    # static_model only as proof-protected-host input; both are valid V10+\n    # shapes, while runtime-domain authority is still enforced separately.\n    domain_projection_v10 = '"domainSubstitutions": _runtime_domain_substitutions(patch)'\n    domain_projection_v14 = '"domainSubstitutions": _runtime_domain_substitutions(patch, static_model)'\n    if domain_projection_v10 not in value and domain_projection_v14 not in value:\n        raise AssertionError("V10 materializer missing runtime domainSubstitutions projection")\n'''
          if new not in text:
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'V10 validator anchor count={count}, expected=1')
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          print('V10_FORWARD_COMPAT_PATCH_OK')
          PY
          git diff --check

      - name: Validate V10 plus current V14 authority
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_source_plan_v10.py
          python scripts/upgrade_provider_search_request_plan_v14.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_v3_documentation_contract_test.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/materialize_provider_v3_all.py').read_text(encoding='utf-8')
          assert '"domainSubstitutions": _runtime_domain_substitutions(patch, static_model)' in text
          assert 'for key in ("runtime_domain_replacements",):' in text
          assert 'NIAKVIO_PROVIDER_RUNTIME_DOMAIN_AUTHORITY_V10_1' in text
          print('V10_V14_RUNTIME_DOMAIN_AUTHORITY_OK')
          PY

      - name: Commit validator compatibility only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/upgrade_provider_source_plan_v10_impl.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'scripts/upgrade_provider_source_plan_v10_impl.py'
          git commit -m 'fix(repair): keep Source Plan V10 forward-compatible with V14'
          git fetch origin workbench/systemic-recovery-20260909
          test "$(git rev-parse ${{ github.sha }})" = "$(git rev-parse origin/workbench/systemic-recovery-20260909)"
          git push origin HEAD:workbench/systemic-recovery-20260909
          echo "V10_FORWARD_COMPAT_COMMIT sha=$(git rev-parse HEAD)"
