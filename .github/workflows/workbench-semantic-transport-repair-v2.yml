name: WORKBENCH - V18.4 Forward Compatibility V3

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-semantic-transport-repair-v2.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-workbench-v18-4-forward-compat-v3
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Make V18.4 validator recognize later value owners and depth
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/upgrade_provider_correlated_value_json_text_v18_4.py')
          text=path.read_text(encoding='utf-8')
          old='''        "const rawSearchValue = _text(searchPayload.value).trim();",\n        "rawSearchValue.length <= 4 * 1024 * 1024",\n        "_spv18ProviderIdFromJson(JSON.parse(rawSearchValue), meta)",\n        "if (!providerId) providerId = _spv18ProviderIdFromHtml(rawSearchValue, meta);",\n        "providerId = _spv18ProviderIdFromJson(searchPayload.value, meta);",\n        'providerId ? "identity_hit" : "identity_miss"',\n        "const valueSteps = (plan.steps || []).slice(0, 4);",\n'''
          new='''        "const rawSearchValue = _text(searchPayload.value).trim();",\n        "rawSearchValue.length <= 4 * 1024 * 1024",\n'''
          if old not in text:
              raise SystemExit('V18.4 strict validator anchor missing')
          text=text.replace(old,new,1)
          anchor='''    trace_window = value.split("/* NIAKVIO_PROVIDER_VALUE_TRACE_V18_4 */", 1)[1].split(\n'''
          compatibility='''    legacy_identity_bridge = all(needle in value for needle in (\n        "_spv18ProviderIdFromJson(JSON.parse(rawSearchValue), meta)",\n        "if (!providerId) providerId = _spv18ProviderIdFromHtml(rawSearchValue, meta);",\n        "providerId = _spv18ProviderIdFromJson(searchPayload.value, meta);",\n    ))\n    response_value_bridge = all(needle in value for needle in (\n        "_spv20ProviderValuesFromJson(JSON.parse(rawSearchValue), meta)",\n        "providerValues = _spv20ProviderValuesFromHtml(rawSearchValue, meta);",\n        "providerValues = _spv20ProviderValuesFromJson(searchPayload.value, meta);",\n    ))\n    if not legacy_identity_bridge and not response_value_bridge:\n        raise AssertionError("V18.4 JSON-text identity bridge missing legacy or V20+ response-value owner")\n\n    legacy_trace = '_spv184Trace(providerId ? "identity_hit" : "identity_miss", mediaType, providerId, -1, searchRoute);'\n    dependency_trace = '_spv184Trace(providerTraceId ? "identity_hit" : "identity_miss", mediaType, providerTraceId, -1, searchRoute);'\n    if legacy_trace not in value and dependency_trace not in value:\n        raise AssertionError("V18.4 identity trace missing legacy providerId or V20.5 providerTraceId owner")\n\n    legacy_depth = "const valueSteps = (plan.steps || []).slice(0, 4);"\n    current_depth = "const valueSteps = (plan.steps || []).slice(0, 8);"\n    if legacy_depth not in value and current_depth not in value:\n        raise AssertionError("V18.4 provider-value step depth missing legacy 4 or current V20.5 depth 8")\n\n'''
          if anchor not in text:
              raise SystemExit('V18.4 trace-window anchor missing')
          text=text.replace(anchor,compatibility+anchor,1)
          path.write_text(text,encoding='utf-8')
          print('V18_4_FORWARD_COMPAT_V3_PATCH_OK')
          PY
          git diff --check

      - name: Validate V18.4 through V20.5 current ownership
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_correlated_value_json_text_v18_4.py
          python scripts/upgrade_provider_response_value_correlation_v20_2.py
          python scripts/upgrade_provider_response_value_correlation_v20_5.py
          python tests/provider_response_value_correlation_v20_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python - <<'PY'
          from pathlib import Path
          base=Path('scripts/provider_base_store.py').read_text(encoding='utf-8')
          assert 'NIAKVIO_PROVIDER_CORRELATED_VALUE_JSON_TEXT_V18_4' in base
          assert 'NIAKVIO_PROVIDER_RESPONSE_VALUE_CORRELATION_V20_2' in base
          assert 'NIAKVIO_PROVIDER_RESPONSE_VALUE_DEPENDENCY_V20_5' in base
          assert '_spv20ProviderValuesFromJson(JSON.parse(rawSearchValue), meta)' in base
          assert 'const providerTraceId = providerValues.id || providerValues.slug || "";' in base
          assert '_spv184Trace(providerTraceId ? "identity_hit" : "identity_miss"' in base
          assert 'const valueSteps = (plan.steps || []).slice(0, 8);' in base
          print('V18_4_V20_5_OWNER_OK')
          PY
          git diff --check

      - name: Commit validator compatibility only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/upgrade_provider_correlated_value_json_text_v18_4.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'scripts/upgrade_provider_correlated_value_json_text_v18_4.py'
          git commit -m 'fix(repair): keep V18.4 compatible with current value owner'
          git fetch origin workbench/systemic-recovery-20260909
          test "$(git rev-parse ${{ github.sha }})" = "$(git rev-parse origin/workbench/systemic-recovery-20260909)"
          git push origin HEAD:workbench/systemic-recovery-20260909
          echo "V18_4_FORWARD_COMPAT_COMMIT sha=$(git rev-parse HEAD)"
