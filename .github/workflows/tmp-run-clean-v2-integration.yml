name: Temporary run clean V2 integration

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/run-clean-v2-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/global-provider-v2-integration
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch research reference only
        run: git fetch --depth=1 origin agent/tv-regression-5.20.38
      - name: Prepare global-only integration
        run: |
          sed -i "/provider-type-policy.json/d" scripts/tmp_import_global_provider_v2.py
          sed -i "/tv_provider_hardening_test.py/d" scripts/tmp_import_global_provider_v2.py
          sed -i "/tv_catalogue_fixture_coverage_test.py/d" scripts/tmp_import_global_provider_v2.py
          python scripts/tmp_import_global_provider_v2.py
          python scripts/reapply_published_overrides.py
          python -m py_compile scripts/apply_provider_overrides.py scripts/audit_catalogue_identity_media.py scripts/promote_candidates.py scripts/validate_policy.py
          node --check scripts/provider_worker.cjs
          node --check scripts/health_check.mjs
          python tests/global_provider_policy_test.py
          python tests/global_catalogue_alias_recovery_test.py
          python tests/catalogue_audit_transient_hls_test.py
          node tests/provider_worker_security.test.cjs
      - name: Full repository regression suite
        run: npm test
      - name: Commit durable sources to clean branch
        run: |
          rm -f scripts/tmp_import_global_provider_v2.py
          rm -f .github/workflows/tmp-import-global-provider-v2.yml
          rm -f .github/workflows/tmp-import-global-provider-v2-final.yml
          rm -f .github/triggers/import-global-provider-v2
          rm -f .github/triggers/import-global-provider-v2-final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health-config.json provider-overrides.json package.json \
            scripts/apply_provider_overrides.py \
            scripts/audit_catalogue_identity_media.py \
            scripts/check_nuvio_client_upstreams.py \
            scripts/direct_media_probe.cjs \
            scripts/health_check.mjs \
            scripts/promote_candidates.py \
            scripts/provider_worker.cjs \
            scripts/validate_policy.py \
            scripts/provider_patches/global_catalogue_alias_recovery_v2.py \
            scripts/provider_patches/global_media_enrichment_v1.py \
            tests/catalogue_audit_coverage_test.py \
            tests/catalogue_audit_transient_hls_test.py \
            tests/ci_preservation_policy_test.py \
            tests/deep_stream_sampling_test.py \
            tests/direct_media_dimensions_test.py \
            tests/direct_media_probe.test.cjs \
            tests/global_catalogue_alias_recovery_test.py \
            tests/global_provider_policy_test.py \
            tests/matroska_metadata_test.py \
            tests/media_duration_identity_test.py \
            tests/nuvio_client_upstream_drift_guard_test.py \
            tests/provider_worker_security.test.cjs \
            tests/type_scoped_activation_test.py
          git add -u .github scripts/tmp_import_global_provider_v2.py
          git commit -m 'fix: integrate global ID-first provider recovery V2'
          git reset --hard HEAD
          git clean -fdx
          git push origin HEAD:agent/global-provider-v2-integration
