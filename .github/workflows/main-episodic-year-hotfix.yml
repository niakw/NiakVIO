name: MAIN - Episodic Year Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-episodic-year-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Apply canonical episodic year identity fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          identity = Path('scripts/provider_patches/global_stream_identity_v1.py')
          text = identity.read_text(encoding='utf-8')
          old_rev = 'cross-client-shared-tmdb-cache-lazy-episode-v7'
          new_rev = 'cross-client-shared-tv-year-soft-v8'
          if old_rev in text:
              text = text.replace(old_rev, new_rev, 1)
          elif new_rev not in text:
              raise SystemExit('identity revision anchor missing')
          old_req = 'q.title=s(q.title||q.name||q.label);q.year=Number(q.year||0)||0;q.season=Number(q.season||a[2]||0)||0;q.episode=Number(q.episode||a[3]||0)||0;return q}'
          new_req = 'q.title=s(q.title||q.name||q.label);q.year=Number(q.year||0)||0;q.seriesYear=Number(q.seriesYear||q.series_year||q.year||0)||0;q.seasonYear=Number(q.seasonYear||q.season_year||0)||0;q.season=Number(q.season||a[2]||0)||0;q.episode=Number(q.episode||a[3]||0)||0;return q}'
          if old_req in text:
              text = text.replace(old_req, new_req, 1)
          elif new_req not in text:
              raise SystemExit('identity request anchor missing')
          old_year = 'if(m.year&&years.length&&!years.some(function(y){return Math.abs(Number(y)-Number(m.year))<=1}))return true;'
          new_year = 'if(!episodic(q)&&m.year&&years.length&&!years.some(function(y){return Math.abs(Number(y)-Number(m.year))<=1}))return true;'
          if old_year in text:
              text = text.replace(old_year, new_year, 1)
          elif new_year not in text:
              raise SystemExit('identity year anchor missing')
          identity.write_text(text, encoding='utf-8')

          existing = Path('tests/global_stream_identity_test.py')
          existing.write_text(existing.read_text(encoding='utf-8').replace(old_rev, new_rev), encoding='utf-8')

          hardener = Path('scripts/provider_security_hardening.py')
          hard = hardener.read_text(encoding='utf-8')
          hard = hard.replace('import importlib.util\n', '')
          hard = hard.replace('from pathlib import Path\n', '')
          hard = hard.replace('ROOT = Path(__file__).resolve().parents[1]\n', '')
          hard = hard.replace('SAFE_PARSE_PATH = ROOT / "scripts" / "provider_patches" / "safe_structured_parse_v1.py"\n', '')
          retired_loader = '''\ndef _load_safe_parse():\n    spec = importlib.util.spec_from_file_location("nuvio_safe_structured_parse", SAFE_PARSE_PATH)\n    if spec is None or spec.loader is None:\n        raise RuntimeError(f"cannot load {SAFE_PARSE_PATH}")\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n'''
          hard = hard.replace(retired_loader, '\n')
          retired_apply = '''    had_marker = MARKER in source\n    structured = _load_safe_parse().apply(source)\n    structured_changed = structured != source\n    source = structured\n'''
          hard = hard.replace(retired_apply, '    had_marker = MARKER in source\n')
          hard = hard.replace('    changed = structured_changed or bool(\n', '    changed = bool(\n')
          hard = hard.replace('        "structuredParseChanges": 1 if structured_changed else 0,\n', '        "structuredParseChanges": 0,\n')
          retired_scan = '''    try:\n        if _load_safe_parse().apply(source) != source:\n            findings.append("destructive_structured_unescape")\n    except Exception:\n        findings.append("structured_parse_scan_failed")\n'''
          hard = hard.replace(retired_scan, '')
          forbidden = ('SAFE_PARSE_PATH', '_load_safe_parse', 'structured_changed', 'importlib.util')
          leftovers = [token for token in forbidden if token in hard]
          if leftovers:
              raise SystemExit('retired durable safe-parse dependency still present: ' + ','.join(leftovers))
          hardener.write_text(hard, encoding='utf-8')

          reapply = Path('scripts/reapply_published_overrides.py')
          replay = reapply.read_text(encoding='utf-8')
          old_domain = '''        migrated, adaptive_language_repairs = strip_unproven_adaptive_language(isolated)\n        migrated, domain_revision_records = reapply_adaptive_domain_revision(migrated)\n        clean_v2_base = runtime_base_is_clean_v2(\n            provider_id,\n            provider_provenance,\n            provider_base_path,\n        )\n'''
          new_domain = '''        migrated, adaptive_language_repairs = strip_unproven_adaptive_language(isolated)\n        clean_v2_base = runtime_base_is_clean_v2(\n            provider_id,\n            provider_provenance,\n            provider_base_path,\n        )\n        if clean_v2_base:\n            # Clean ProviderBase v3 deliberately excludes historical adaptive source\n            # patches. Never replay intentionally absent legacy migrators here.\n            domain_revision_records = []\n        else:\n            migrated, domain_revision_records = reapply_adaptive_domain_revision(migrated)\n'''
          if old_domain in replay:
              replay = replay.replace(old_domain, new_domain, 1)
          elif new_domain not in replay:
              raise SystemExit('clean-base adaptive-domain replay anchor missing')
          old_runtime = '''        patched, runtime_revision_records = reapply_adaptive_runtime_revision(patched, provider_provenance)\n        if runtime_revision_records:\n            records = list(records) + runtime_revision_records\n'''
          new_runtime = '''        if clean_v2_base:\n            runtime_revision_records = []\n        else:\n            patched, runtime_revision_records = reapply_adaptive_runtime_revision(patched, provider_provenance)\n        if runtime_revision_records:\n            records = list(records) + runtime_revision_records\n'''
          if old_runtime in replay:
              replay = replay.replace(old_runtime, new_runtime, 1)
          elif new_runtime not in replay:
              raise SystemExit('clean-base adaptive-runtime replay anchor missing')
          reapply.write_text(replay, encoding='utf-8')
          PY

          cat > tests/episodic_year_identity_regression_test.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import importlib.util
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / 'scripts'))
          PATCH = ROOT / 'scripts/provider_patches/global_stream_identity_v1.py'
          spec = importlib.util.spec_from_file_location('global_stream_identity_year_regression', PATCH)
          assert spec and spec.loader
          identity = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(identity)

          source = "module.exports={getStreams:async()=>[{name:'Server 1',title:'Shared Show 2020',url:'https://cdn.example/shared-show-2020.m3u8'}]};"
          patched = identity.apply(source, context={'provider_id': 'example'})
          assert 'cross-client-shared-tv-year-soft-v8' in patched
          assert 'if(!episodic(q)&&m.year&&years.length' in patched

          runner = """
          const assert=require('assert');
          PATCHED
          (async()=>{
            for(const mediaType of ['tv','series','anime']){
              const rows=await module.exports.getStreams({tmdbId:'',mediaType,title:'Shared Show',year:2024,season:1,episode:1});
              assert.equal(rows.length,1,mediaType+': '+JSON.stringify(rows));
            }
            const movieRows=await module.exports.getStreams({tmdbId:'',mediaType:'movie',title:'Shared Show',year:2024});
            assert.equal(movieRows.length,0,'movie year mismatch must remain authoritative: '+JSON.stringify(movieRows));
          })().catch(e=>{console.error(e);process.exit(3)});
          """.replace('PATCHED', patched)

          with tempfile.NamedTemporaryFile('w', suffix='.cjs', encoding='utf-8', delete=False) as handle:
              handle.write(runner)
              path = Path(handle.name)
          try:
              proc = subprocess.run(['node', str(path)], cwd=ROOT, text=True, capture_output=True, timeout=20)
              assert proc.returncode == 0, proc.stdout + proc.stderr
          finally:
              path.unlink(missing_ok=True)
          print('episodic year identity regression tests passed')
          PY

      - name: Run focused regressions before publication
        shell: bash
        run: |
          set -euo pipefail
          python tests/episodic_year_identity_regression_test.py
          python tests/global_stream_identity_test.py
          python -m py_compile scripts/provider_security_hardening.py scripts/reapply_published_overrides.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import provider_base_store as bases
          import provider_security_hardening as hardening
          assert 'scripts/provider_patches/adaptive_runtime_recovery_v4.py' in bases.LEGACY_SOURCE_PATCH_PATHS
          assert 'scripts/provider_patches/adaptive_runtime_recovery_v5.py' in bases.LEGACY_SOURCE_PATCH_PATHS
          output, report = hardening.harden_text("var value='ok';")
          assert output == "var value='ok';"
          assert report['structuredParseChanges'] == 0
          findings = hardening.known_unsafe_findings("var value='ok';")
          assert 'structured_parse_scan_failed' not in findings
          print('focused clean-base/hardener regression tests passed')
          PY

      - name: Materialize fix into published provider bundles
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py
          python scripts/reapply_published_overrides.py --check

      - name: Run publication integrity regressions
        run: |
          set -euo pipefail
          python tests/provider_versioning_test.py
          python tests/reapply_provider_versioning_test.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit hotfix and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/main-episodic-year-hotfix.yml
          git add -A
          git commit -m 'fix: make episodic stream identity independent of year'
          git pull --rebase origin main
          git push origin HEAD:main
