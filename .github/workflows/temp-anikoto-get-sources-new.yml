name: TEMP - AniKoto MegaPlay getSourcesNew

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-anikoto-get-sources-new.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current MegaPlay plain source API
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def get(url,headers=None):
            h={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'};h.update(headers or {})
            q=urllib.request.Request(url,headers=h)
            try:
              with urllib.request.urlopen(q,timeout=18) as r:return r.status,r.headers,r.read(2*1024*1024),r.url
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read(65536),url
          url='https://megaplay.buzz/stream/getSourcesNew?id=39807'
          st,hd,raw,final=get(url,{'Referer':'https://megaplay.buzz/','X-Requested-With':'XMLHttpRequest'})
          out={'status':st,'contentType':hd.get('content-type',''),'bytes':len(raw)}
          try:
            data=json.loads(raw.decode('utf-8','replace'))
            out['keys']=sorted(data.keys())
            src=data.get('sources')
            if isinstance(src,dict): file=str(src.get('file') or src.get('url') or src.get('src') or '')
            elif isinstance(src,list):
              file=''
              for x in src:
                if isinstance(x,dict): file=str(x.get('file') or x.get('url') or x.get('src') or '')
                elif isinstance(x,str): file=x
                if file: break
            else: file=str(data.get('file') or '')
            u=urllib.parse.urlsplit(file)
            out.update({'sourceType':type(src).__name__,'mediaHost':u.netloc,'mediaPath':u.path,'isHls':'.m3u8' in u.path.lower(),'trackCount':len(data.get('tracks') or []) if isinstance(data.get('tracks'),list) else 0})
            if file:
              st2,h2,b2,f2=get(file,{'Referer':'https://megaplay.buzz/'})
              txt=b2.decode('utf-8','replace')
              out['media']={'status':st2,'contentType':h2.get('content-type',''),'bytes':len(b2),'extm3u':txt.lstrip().startswith('#EXTM3U')}
          except Exception as e:
            out['parseError']=type(e).__name__+': '+str(e)[:160]
            out['prefix']=raw.decode('utf-8','replace')[:180].replace('\n',' ')
          print('ANIKOTO_GETSOURCESNEW '+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          if st != 200 or not out.get('isHls'):
            raise SystemExit('getSourcesNew not a direct HLS authority')
          PY
