name: Apply verified manifest language fallback once

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/apply-verified-manifest-language-fallback"

permissions:
  contents: write
  actions: read

concurrency:
  group: verified-manifest-language-fallback-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download exact successful deep evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-validation-stage-31483763930
          path: checked-artifact
          github-token: ${{ github.token }}
          repository: niakw/Niakvio
          run-id: 31483763930

      - name: Apply deterministic language-gate migration
        run: python scripts/repair_verified_manifest_language_fallback.py

      - name: Validate focused language gate regressions
        run: |
          python -m py_compile scripts/promote_candidates.py
          python tests/ci_preservation_policy_test.py

      - name: Replay exact deep artifact against corrected promoter
        shell: bash
        run: |
          rm -rf /tmp/niakvio-language-replay
          mkdir -p /tmp/niakvio-language-replay
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/niakvio-language-replay/
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/niakvio-language-replay/node_modules
          cd /tmp/niakvio-language-replay
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/reapply_published_overrides.py
          NUVIO_STAGE="$PWD/checked-artifact/staging" \
          NUVIO_HEALTH_RESULTS="$PWD/checked-artifact/health-output/health-results.json" \
            python scripts/promote_candidates.py
          python - <<'PY'
          import json
          from pathlib import Path
          pending = json.loads(Path('manifest.next.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id') or '').casefold(): row for row in pending.get('scrapers', [])}
          persian = rows['persianstremio']
          frenchstream = rows['frenchstream']
          assert persian.get('enabled') is True, persian
          assert frenchstream.get('enabled') is False, frenchstream
          print('exact replay: PersianStremio enabled; Frenchstream remains quality-disabled')
          PY
          python scripts/prune_unreferenced_providers.py
          python scripts/validate_published_overrides.py
          PREVIOUS_MANIFEST="$(mktemp)"
          git --git-dir="$GITHUB_WORKSPACE/.git" show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          echo "exact deep replay activation transaction passed"

      - name: Remove one-shot harness before release inventory
        shell: bash
        run: |
          git rm scripts/repair_verified_manifest_language_fallback.py \
            .github/workflows/apply-verified-manifest-language-fallback.yml \
            .github/triggers/apply-verified-manifest-language-fallback

      - name: Run complete repository regression suite
        run: npm test

      - name: Commit validated durable language-gate change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_candidates.py tests/ci_preservation_policy_test.py \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: accept manifest audio only for verified untagged media"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify exact published main after push
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python scripts/validate_release_integrity.py
          git diff --exit-code
          echo "published language-gate code verification passed"
