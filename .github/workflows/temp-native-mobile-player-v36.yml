name: TEMP native mobile player V36
on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-native-mobile-player-v36.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - name: Apply and test V36
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_native_mobile_player_launch_v36.py
          python3 tests/native_mobile_player_launch_v36_test.py
          python3 tests/native_player_diagnostics_codegen_test.py
          python3 tests/native_lab_reader_observation_contract_test.py
          python3 tests/native_evidence_codegen_pipeline_test.py
          # A second application must be a no-op at the transformer level. The
          # working-tree diff is intentionally kept for the following commit step.
          second_pass="$(python3 scripts/upgrade_native_mobile_player_launch_v36.py)"
          printf '%s\n' "$second_pass"
          grep -q 'NATIVE_MOBILE_PLAYER_LAUNCH_V36 already-applied' <<<"$second_pass"
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/native_player_diagnostics_codegen.py"
      - name: Commit V36
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/native_player_diagnostics_codegen.py
          if git diff --cached --quiet; then echo 'FIELD_V36_COMMIT changed=0'; exit 0; fi
          git commit -m 'fix(labs): resolve Mobile player package dynamically'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin fix/labs-5.21.44-20260912
            git rebase origin/fix/labs-5.21.44-20260912
            if git push origin HEAD:fix/labs-5.21.44-20260912; then echo "FIELD_V36_COMMIT changed=1 sha=$(git rev-parse HEAD)"; exit 0; fi
            sleep 1
          done
          exit 1
