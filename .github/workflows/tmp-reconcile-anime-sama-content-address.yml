name: TMP - Reconcile Anime-Sama content address

on:
  push:
    branches: [fix/domain-refresh-authority-20260910]
    paths:
      - '.github/workflows/tmp-reconcile-anime-sama-content-address.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/domain-refresh-authority-20260910
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Reconcile existing bytes only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          def load(path): return json.loads((root/path).read_text(encoding='utf-8'))
          def write(path,value): (root/path).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest=load('manifest.json')
          material=load('provider-v3-materialization.json')
          rows=[x for x in manifest.get('scrapers',[]) if isinstance(x,dict)]
          row=next(x for x in rows if str(x.get('id','')).casefold()=='anime-sama')
          old_rel=str(row['filename'])
          old=root/old_rel
          raw=old.read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          new_rel=f'providers/anime-sama-{digest[:16]}.js'
          new=root/new_rel
          if new_rel != old_rel:
              new.write_bytes(raw)
              old.unlink()
              row['filename']=new_rel
          mrow=next(x for x in material.get('providers',[]) if str(x.get('provider','')).casefold()=='anime-sama')
          mrow['file']=new_rel
          mrow['sha256']=digest
          aggregate=hashlib.sha256()
          for item in material.get('providers',[]):
              pid=str(item.get('provider','')).casefold().strip(); sha=str(item.get('sha256',''))
              if not pid or len(sha)!=64: raise SystemExit(f'invalid materialization row: {pid}')
              aggregate.update(pid.encode()); aggregate.update(bytes.fromhex(sha))
          material['generation']=aggregate.hexdigest()
          write('manifest.json',manifest); write('provider-v3-materialization.json',material)
          for rel in ['vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json']:
              p=root/rel
              if not p.exists(): continue
              data=load(rel); changed=False
              for item in data.get('scrapers',[]):
                  if str(item.get('id','')).casefold()!='anime-sama': continue
                  prefix='../' if rel=='vf/manifest.json' else ('../' if rel.startswith('vf-') else '')
                  item['filename']=prefix+new_rel; changed=True
              if changed: write(rel,data)
          print(f'ANIME_SAMA_CONTENT_ADDRESS old={old_rel} new={new_rel} sha256={digest}')
          PY
          python3 scripts/audit_provider_v3_static.py
          git diff --check
      - name: Commit bookkeeping-only repair and remove one-shot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-reconcile-anime-sama-content-address.yml
          git add manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json provider-v3-materialization.json providers/
          git diff --cached --quiet && exit 0
          git commit -m 'fix(integrity): reconcile Anime-Sama content address'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:fix/domain-refresh-authority-20260910
