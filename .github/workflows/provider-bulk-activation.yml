name: PROVIDER - Bulk Activation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Provider Census - Sharded
      - CORE - Finalize Accepted Release
    types:
      - completed
  push:
    branches: [main]
    paths:
      - 'automation/provider-onboarding-pending-status-latest.json'

permissions:
  contents: write

concurrency:
  group: niakvio-provider-bulk-activation-main
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - id: activation
        name: Select and activate current FULL OK bulk providers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/activate_bulk_proven_providers.py             --status automation/provider-onboarding-pending-status-latest.json             --output automation/provider-bulk-activation-latest.json
          count="$(python - <<'PY'
          import json
          d=json.load(open("automation/provider-bulk-activation-latest.json", encoding="utf-8"))
          print(int(d.get("activationCount") or 0))
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Rebuild publication once for all newly activated providers
        if: ${{ steps.activation.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          # Activation must preserve the exact provider JS bytes that earned pending FULL proof.
          # Never rebuild/reapply provider code here.
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          python scripts/provider_base_store.py repair-legacy
          python scripts/validate_published_provider_config.py
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_bulk_activation_test.py
          python tests/production_active_provider_freshness_test.py
          python tests/provider_js_lego_ownership_test.py

      - name: Publish one proof-driven activation transaction
        if: ${{ steps.activation.outputs.count != '0' }}
        shell: bash
        env:
          ACTIVATION_COUNT: ${{ steps.activation.outputs.count }}
        run: |
          set -euo pipefail
          git add             manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json             provider_catalog.json PROVENANCE.json provider-overrides.json provider-hubs.json             provider-bases providers provider-disabled automation/provider-bulk-activation-latest.json
          git diff --cached --quiet && exit 0
          git config user.name "niakvio-provider-bulk-activation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "provider: bulk activate $ACTIVATION_COUNT full-ok"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
