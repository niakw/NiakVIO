name: TEMP - Cancel Stale Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/cancel-stale-repair'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel stale Repair run only if still active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE_RUN_ID: "35657748177"
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GH_REPO/actions/runs/$STALE_RUN_ID" --jq .status)"
          echo "STALE_REPAIR_STATUS=$status"
          if [[ "$status" == "in_progress" || "$status" == "queued" || "$status" == "pending" || "$status" == "waiting" ]]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$STALE_RUN_ID/cancel"
            echo "STALE_REPAIR_CANCEL_REQUESTED run=$STALE_RUN_ID"
          else
            echo "STALE_REPAIR_ALREADY_TERMINAL run=$STALE_RUN_ID status=$status"
          fi
