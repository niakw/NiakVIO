      - 'tests/native_player_diagnostics_codegen_test.py'
      - 'tests/native_evidence_codegen_pipeline_test.py'
      - 'tests/native_ios_multi_audio_gate_test.py'
      - 'tests/native_multi_audio_coverage_gate_test.cjs'
      - 'tests/native_provider_provenance_gate_test.cjs'
      - '.github/workflows/native-mobile-android-reader.yml'
      - '.github/workflows/native-mobile-ios-reader.yml'
      - '.github/workflows/native-desktop-reader-acceptance.yml'
      - '.github/workflows/release-candidate-validation.yml'
      - 'scripts/check_nuvio_client_upstreams.py'
      - 'scripts/runtime_contract_gate.py'
      - 'scripts/nuvio_runtime_compatibility.py'
      - 'scripts/validate_platform_runtime_policy.py'
      - 'scripts/validate_nuvio_tv_runtime_policy.py'
      - 'scripts/render_platform_runtime_contracts.py'
      - 'tests/platform_runtime_projection_authority_test.py'
      - 'tests/nuvio_portable_stream_result_contract_test.py'
      - 'tests/language_manifest_metadata_consistency_test.py'

permissions:
  contents: write
  actions: write

concurrency:
  # Latest-wins only inside the release lane. Domain/Projection have their own
  # queues; publication remains protected by exact-head/drift gates and atomic
  # fast-forward push, so one lane cannot silently erase another pending lane.
  group: niakvio-release-finalizer-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout accepted main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pin accepted executable bytes even if evidence-only commits reach
          # main before this queued mutation job starts.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce exact accepted SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$ACTUAL" = "${{ inputs.expected_sha }}" || {
              echo "accepted SHA mismatch expected=${{ inputs.expected_sha }} actual=$ACTUAL" >&2
              exit 1
            }
          else
            test "$ACTUAL" = "${{ github.sha }}" || {
              echo "accepted trigger SHA mismatch expected=${{ github.sha }} actual=$ACTUAL" >&2
              exit 1
            }
          fi
          echo "$ACTUAL" > "$RUNNER_TEMP/accepted-main-sha"

      - name: Export current release-generation baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_version_baseline.py \
            --manifest manifest.json \
            --output "$RUNNER_TEMP/published-manifest-baseline.json"
          python3 scripts/release_version_baseline.py \
            --manifest vf/manifest.json \
            --output "$RUNNER_TEMP/published-vf-manifest-baseline.json"

      - name: Reject executable main drift before expensive finalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(cat "$RUNNER_TEMP/accepted-main-sha")"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" = "$BASE_SHA" ]; then
            echo "FIELD_RELEASE_PREFLIGHT_DRIFT state=exact base=$BASE_SHA"
            exit 0
          fi
          git merge-base --is-ancestor "$BASE_SHA" "$CURRENT_SHA" || {
            echo "FIELD_RELEASE_PREFLIGHT_BLOCKED reason=non_descendant_main base=$BASE_SHA current=$CURRENT_SHA" >&2
            exit 1
          }
          git diff --name-status "$BASE_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/release-preflight-drift.txt"
          python3 scripts/domain_refresh_publication_drift_gate.py --drift-file "$RUNNER_TEMP/release-preflight-drift.txt" || {
            echo "FIELD_RELEASE_PREFLIGHT_BLOCKED reason=executable_main_drift base=$BASE_SHA current=$CURRENT_SHA" >&2
            gh workflow run release-finalize.yml --repo "$GITHUB_REPOSITORY" --ref main               -f expected_sha="$CURRENT_SHA" -F post_census=true || true
            echo "FIELD_RELEASE_REQUEUED current=$CURRENT_SHA reason=preflight_executable_drift" >&2
            exit 1
          }
          echo "FIELD_RELEASE_PREFLIGHT_DRIFT state=evidence_only base=$BASE_SHA current=$CURRENT_SHA"

      - name: Validate current Nuvio métier ABI and projection authority
        shell: bash
        run: |
          set -euo pipefail
          # The finalizer's own ordering/watch contract is release authority.
          python3 tests/release_finalizer_projection_transaction_test.py
          # A release may only certify the stored ABI after proving that the
          # official client branches are still reachable and have no unreviewed
          # contract/semantic drift from the accepted refs.
          python3 scripts/check_nuvio_client_upstreams.py --output "$RUNNER_TEMP/nuvio-client-upstream-status.json"
          python3 scripts/render_platform_runtime_contracts.py
          python3 scripts/render_platform_runtime_contracts.py --check
          python3 scripts/runtime_contract_gate.py
          python3 scripts/nuvio_runtime_compatibility.py
          python3 scripts/validate_platform_runtime_policy.py
          python3 scripts/validate_nuvio_tv_runtime_policy.py
          python3 tests/platform_runtime_projection_authority_test.py
          python3 tests/nuvio_portable_stream_result_contract_test.py
          python3 tests/provider_clean_reconstruction_contract_test.py
          python3 tests/provider_v3_documentation_contract_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py
          python3 tests/final_published_provider_config_test.py
          python3 tests/provider_cardinality_source_of_truth_test.py
          python3 tests/provider_anime_semantic_transport_contract_test.py
          python3 tests/global_media_type_resolution_test.py
          python3 tests/provider_stream_multiplicity_contract_test.py
          python3 tests/special_season_zero_identity_test.py
          python3 tests/native_five_lab_coverage_test.py
          python3 tests/native_hub46_scope_contract_test.py
          python3 tests/native_hub46_transport_manifest_test.py
          python3 tests/native_corpus_device_lab_test.py
          python3 tests/native_evidence_contract_test.py
          node tests/native_evidence_completeness_test.cjs
          python3 tests/native_player_diagnostics_codegen_test.py
          python3 tests/native_evidence_codegen_pipeline_test.py
          python3 tests/native_ios_multi_audio_gate_test.py
          node tests/native_multi_audio_coverage_gate_test.cjs
          node tests/native_provider_provenance_gate_test.cjs
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_metadata_preservation_contract_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/stream_score_contract_test.py
          python3 tests/hls_master_facts_short_test.py
          python3 tests/hls_playback_integrity_test.py
          python3 tests/hls_presentation_badge_integration_test.py
          python3 tests/stream_output_sanitizer_multi_variant_test.py
          python3 tests/global_telemetry_contract_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_branding_contract_test.py
          python3 tests/core_media_policy_test.py
          python3 tests/language_manifest_metadata_consistency_test.py

      - name: Reapply durable provider patches, minimize and rebuild current projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          # Reapply can rotate content-addressed Global filenames. VF/no-anime
          # are derived projections, so synchronize them before any union audit.
          # ProviderBase remains derived from structured authority; this only
          # restores the same object/file identity across projections.
          python3 scripts/sync_manifest_projection_rows.py
          python3 scripts/sync_manifest_projection_rows.py --check
          # Exact managed CONFIG bytes may exist before durable static knowledge
          # catches up after activation. Reconcile that authority first so the
          # canonical materializer cannot operate on a stale provider ledger.
          python3 scripts/reconcile_provider_static_authority.py --apply
          # Rebuild the complete Provider-v3 authority ledger from the exact
          # active production scope before static audit. Targeted workflows may
          # legitimately leave a partial materialization report on main.
          python3 scripts/materialize_provider_v3_all.py
          # Canonical Global materialization rotates content-addressed filenames
          # again. Restore every derived projection before the second union audit.
          python3 scripts/sync_manifest_projection_rows.py
          python3 scripts/sync_manifest_projection_rows.py --check
          # materialize_provider_v3_all.py owns the canonical Global rebuild.
          # Rebind its ledger to the already-published France-only active bytes
          # before validating executable authority.
          python3 scripts/reconcile_provider_static_authority.py --apply
          python3 tests/provider_materialization_authority_test.py
          python3 scripts/validate_provider_materialization_authority.py
          python3 scripts/finalize_provider_v3_minimizer.py
          python3 scripts/finalize_provider_v3_minimizer.py --check
          python3 tests/provider_france_only_minimizer_test.py
          python3 scripts/finalize_france_only_provider_v3_minimizer.py
          python3 scripts/finalize_france_only_provider_v3_minimizer.py --check
          python3 scripts/resign_active_offline_provider_proofs.py \
            --previous-manifest "$RUNNER_TEMP/published-manifest-baseline.json" \
            --previous-vf-manifest "$RUNNER_TEMP/published-vf-manifest-baseline.json" \
            --scope global \
            --apply
          python3 scripts/reconcile_release_manifest_types.py
          python3 tests/release_manifest_type_reconcile_test.py
          # Static-authority/materialization/type reconciliation above can
          # legitimately change the publication contract after the first
          # reapply pass. Reapply once against that final durable authority,
          # then require the check pass to prove a true fixed point.
          python3 scripts/reapply_published_overrides.py
          # Reapply reconstructs canonical readable provider bytes. Restore the
          # publication minimizer fixed point before asserting the override
          # fixed point, exactly as the recovery finalizer already does.
          python3 scripts/finalize_provider_v3_minimizer.py
          python3 scripts/finalize_provider_v3_minimizer.py --check
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/published_s00_identity_rollout_test.py
          python3 tests/provider_v3_minimizer_contract_test.py
          python3 tests/provider_v3_minimizer_preview_test.py
          python3 tests/provider_v3_minimizer_publication_pipeline_test.py
          python3 tests/provider_v3_minimizer_published_test.py
          # The second reapply/minimizer rotates Global content-addressed
          # filenames one last time. Re-establish derived VF/no-anime parity
          # before the final Global+France publication reconciler audits the
          # active projection union.
          python3 scripts/sync_manifest_projection_rows.py
          python3 scripts/sync_manifest_projection_rows.py --check
          # Final minimization changes content-addressed filenames after the
          # canonical materialization ledger was built. Rebind manifest,
          # materialization and provenance to the exact final bytes before
          # cache/version finalization.
          python3 scripts/reconcile_active_provider_publication.py
          python3 tests/reconcile_active_provider_publication_test.py
          # The final publication reconciler can change content-addressed filenames
          # after the earlier offline-proof rebind. Re-sign exact offline proofs
          # only after those final bytes/filenames exist, otherwise production
          # freshness observes stale hashes (Chillflix regression).
          python3 scripts/resign_active_offline_provider_proofs.py \
            --previous-manifest "$RUNNER_TEMP/published-manifest-baseline.json" \
            --previous-vf-manifest "$RUNNER_TEMP/published-vf-manifest-baseline.json" \
            --scope global \
            --apply
          python3 scripts/validate_provider_materialization_authority.py
          python3 scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          # Rebuild the current active Global+France projection transport before
          # pruning superseded bundles. Historical Hub-46 evidence is not scope authority.
          python3 scripts/generate_hub46_manifest.py \
            --source manifest.json \
            --vf-source vf/manifest.json \
            --output manifest-hub46.json
          python3 scripts/prune_unreferenced_providers.py
          python3 tests/provider_html_filter_security_test.py --published
          python3 scripts/audit_provider_v3_static.py
          # The exact Global+France active projection union must be reconstructible
          # from ProviderBase + structured DATA + owned Blocs without using current
          # provider JS as a seed. Historical provider-old snapshots are provenance
          # only and may share an identity with a reactivated provider.
          python3 scripts/verify_provider_v3_reverse_rebuild.py

      - name: Finalize synchronized release and provider cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/published-manifest-baseline.json" \
            --previous-vf "$RUNNER_TEMP/published-vf-manifest-baseline.json"
          python3 tests/release_auto_bump_test.py
          python3 tests/provider_versioning_test.py
          python3 tests/reapply_provider_versioning_test.py
          python3 scripts/validate_provider_materialization_authority.py
          python3 scripts/generate_hub46_manifest.py \
            --source manifest.json \
            --vf-source vf/manifest.json \
            --output manifest-hub46.json

      - name: Stage provider generation locally
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee "$RUNNER_TEMP/release-generation-files.txt"
          if grep -Ev '^(PROVENANCE\.json|provider-overrides\.json|provider-v3-materialization\.json|providers/.*|manifest\.json|manifest-hub46\.json|vf/manifest\.json|no-anime/manifest\.json|vf-no-anime/manifest\.json|package\.json|package-lock\.json|sources\.json|provider_catalog\.json|provider-version-floors\.json|nuvio-client-id-state\.json|automation/provider-v3-static-knowledge\.json|automation/PLATFORM-RUNTIME-CONTRACTS\.md)$' "$RUNNER_TEMP/release-generation-files.txt"; then
            echo 'Unexpected path changed by provider-generation finalization' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            PROVENANCE.json provider-overrides.json provider-v3-materialization.json providers/ \
            automation/provider-v3-static-knowledge.json \
            manifest.json manifest-hub46.json \
            vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            package.json package-lock.json sources.json provider_catalog.json provider-version-floors.json nuvio-client-id-state.json \
            automation/PLATFORM-RUNTIME-CONTRACTS.md
          if git diff --cached --quiet; then
            echo 'FIELD_RELEASE_PROVIDER_GENERATION_CHANGED false'
            echo false > "$RUNNER_TEMP/release-provider-generation-changed"
            echo "$(git rev-parse HEAD)" > "$RUNNER_TEMP/release-provider-sha"
            exit 0
          fi
          echo true > "$RUNNER_TEMP/release-provider-generation-changed"
          git commit -m 'chore: stage accepted Provider v3 release generation'
          git rev-parse HEAD > "$RUNNER_TEMP/release-provider-sha"
          echo "FIELD_RELEASE_PROVIDER_GENERATION_CHANGED true sha=$(cat "$RUNNER_TEMP/release-provider-sha")"

      - name: Rebuild exact pinned Hub46 transport and release integrity
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_SHA="$(cat "$RUNNER_TEMP/release-provider-sha")"
          python3 scripts/build_hub46_native_manifest.py \
            --provider-sha "$PROVIDER_SHA" \
            --source manifest-hub46.json \
            --output native-hub46/manifest.json
          python3 tests/native_hub46_manifest_test.py
          python3 tests/native_hub46_transport_manifest_test.py
          python3 tests/release_projection_scope_test.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py

      - name: Commit final pinned release locally
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee "$RUNNER_TEMP/release-finalization-files.txt"
          if grep -Ev '^(native-hub46/manifest\.json|FILE-HASHES\.json|PATCH-SHA256SUMS\.txt|SHA256SUMS\.json)$' "$RUNNER_TEMP/release-finalization-files.txt"; then
            echo 'Unexpected path changed by pinned release finalization' >&2
            exit 1
          fi
          git add native-hub46/manifest.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if git diff --cached --quiet; then
            echo 'FIELD_RELEASE_PINNED_FINAL_CHANGED false'
          else
            git commit -m 'chore: finalize accepted Provider v3 release'
            echo 'FIELD_RELEASE_PINNED_FINAL_CHANGED true'
          fi
          echo "FIELD_RELEASE_LOCAL_FINAL_SHA $(git rev-parse HEAD) provider_sha=$(cat "$RUNNER_TEMP/release-provider-sha")"

      - name: Publish accepted release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(cat "$RUNNER_TEMP/accepted-main-sha")"
          FINAL_SHA="$(git rev-parse HEAD)"
          if [ "$FINAL_SHA" = "$BASE_SHA" ]; then
            echo 'Accepted release finalization is already a no-op.'
            exit 0
          fi
          # The on-push job can queue while unrelated census/learning evidence
          # advances. Such evidence must not discard an expensive validated
          # executable publication. However, a changed provider/Core/authority
          # input MUST fail closed and be regenerated from the new HEAD.
          for attempt in 1 2 3; do
            git fetch origin main
            CURRENT_SHA="$(git rev-parse origin/main)"
            if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
              git merge-base --is-ancestor "$BASE_SHA" "$CURRENT_SHA" || {
                echo "FIELD_RELEASE_PUBLISH_BLOCKED reason=non_descendant_main base=$BASE_SHA current=$CURRENT_SHA" >&2
                exit 1
              }
              git diff --name-status "$BASE_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/release-main-drift.txt"
              python3 scripts/domain_refresh_publication_drift_gate.py --drift-file "$RUNNER_TEMP/release-main-drift.txt" || {
                echo "FIELD_RELEASE_PUBLISH_BLOCKED reason=executable_main_drift base=$BASE_SHA current=$CURRENT_SHA" >&2
                gh workflow run release-finalize.yml --repo "$GITHUB_REPOSITORY" --ref main                   -f expected_sha="$CURRENT_SHA" -F post_census=true || true
                echo "FIELD_RELEASE_REQUEUED current=$CURRENT_SHA reason=publish_executable_drift" >&2
                exit 1
              }
              git merge --no-ff --no-edit origin/main
              # Release hash inventories include MEMORY.md and some canonical
              # evidence. An allowlisted merge must be resealed, not validated
              # against pre-merge hashes, and must NEVER authorize provider edits.
              python3 scripts/generate_release_hashes.py
              git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
              if ! git diff --cached --quiet; then
                git commit -m 'chore(release): reseal accepted evidence-only merge'
              fi
              python3 scripts/validate_release_integrity.py
              echo "FIELD_RELEASE_EVIDENCE_ONLY_MAIN_MERGE base=$BASE_SHA current=$CURRENT_SHA resealed=true"
            fi
            if git push origin HEAD:main; then
              FINAL_SHA="$(git rev-parse HEAD)"
              echo "FIELD_RELEASE_PUBLICATION_OK base=$BASE_SHA provider=$(cat "$RUNNER_TEMP/release-provider-sha") final=$FINAL_SHA"
              exit 0
            fi
            echo "FIELD_RELEASE_PUBLISH_RETRY attempt=$attempt reason=remote_moved"
          done
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          gh workflow run release-finalize.yml --repo "$GITHUB_REPOSITORY" --ref main             -f expected_sha="$CURRENT_SHA" -F post_census=true || true
          echo "FIELD_RELEASE_REQUEUED current=$CURRENT_SHA reason=remote_did_not_converge" >&2
          echo 'FIELD_RELEASE_PUBLISH_BLOCKED reason=remote_did_not_converge' >&2
          exit 1

      - name: Dispatch five-platform certification for exact finalized SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$FINAL_SHA" = "$REMOTE_SHA" || {
            echo "FIELD_RELEASE_NATIVE_CERTIFICATION_NOT_DISPATCHED reason=main_moved final=$FINAL_SHA remote=$REMOTE_SHA" >&2
            exit 1
          }
          gh workflow run release-candidate-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$FINAL_SHA"
          echo "FIELD_RELEASE_NATIVE_CERTIFICATION_DISPATCHED final=$FINAL_SHA workflow=release-candidate-validation.yml"

      - name: Re-census lifecycle-finalized bytes before Brain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.post_census == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run provider-census-sharded.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f scope=all \
            -f persist=true
          echo "FIELD_RELEASE_POST_CENSUS_DISPATCH source_run=${GITHUB_RUN_ID} scope=all dispatched=true"
