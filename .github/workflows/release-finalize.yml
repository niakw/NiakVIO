name: CORE - Finalize Accepted Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact accepted main SHA to finalize
        required: true
        type: string
      post_census:
        description: Re-census exact finalized bytes before Brain Autopilot
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-finalize.yml'
      - '.github/triggers/release-finalize.json'
      - 'tests/release_finalizer_projection_transaction_test.py'
      - 'scripts/domain_refresh_publication_drift_gate.py'
      - 'tests/domain_refresh_publication_drift_gate_test.py'
      # Core/ProviderBase edits must reach published bundles, not stop at source tests.
      - 'scripts/provider_patches/**'
      - 'scripts/provider_base_store.py'
