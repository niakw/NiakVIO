name: Validate VF provider health

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/vf-provider-repair"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Validate Python modules
        run: |
          python -m py_compile scripts/adaptive_runtime/runtime_repair.py
          python -m py_compile scripts/provider_patches/adaptive_runtime_recovery.py
          python -m py_compile scripts/provider_patches/stream_output_sanitizer.py
          python -m py_compile scripts/run_adaptive_deep_repair.py
          python -m py_compile scripts/local/test_adaptive_global_provider_repair.py

      - name: Run provider health validation
        env:
          NUVIO_WORKER_MEMORY_MB: "1024"
        run: python scripts/local/test_adaptive_global_provider_repair.py --scope vf

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: general-vf-provider-repair
          path: local-output/global-provider-repair
          if-no-files-found: error
          retention-days: 7
