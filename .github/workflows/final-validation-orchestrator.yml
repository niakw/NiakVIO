name: NiakVIO final validation orchestrator
# Authoritative end-to-end gate for the exact main generation.
# Final generation: provider branding + native evidence + security sealed v5.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-validation-orchestrator.yml'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: niakvio-final-validation-orchestrator
  cancel-in-progress: true

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STATE_FILE: /tmp/niakvio-final-validation.env
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository-clean source contract before expensive gates
        shell: bash
        run: |
          set -euo pipefail
          python tests/repository_hygiene_contract_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows=manifest.get('scrapers') or []
          if len(rows) < 92:
              raise SystemExit(f'provider catalogue unexpectedly shrank below audited baseline: {len(rows)}')
          missing=[]
          for row in rows:
              if not isinstance(row,dict):
                  continue
              rel=str(row.get('filename') or '')
              if rel and not Path(rel).is_file():
                  missing.append(rel)
          if missing:
              raise SystemExit(f'missing provider bundles: {missing[:20]}')
          print(f'FIELD_FINAL_PROVIDER_CATALOG rows={len(rows)} missing=0')
          PY

      - name: Announce authoritative validation run
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 69 --repo "$REPO" --body "Final main validation started on ${GITHUB_SHA}: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}. One-shot logo migration (only if still present) → Core → Deep → Brain/native clients/badges/security/upstreams → exact native README import → hygiene/main-only. Issue remains open until every gate succeeds."

      - name: Run authoritative final gates
        shell: bash
        run: |
          set -euo pipefail
          : > "$STATE_FILE"

          dispatch_and_capture() {
            local workflow="$1"; shift
            local started run_id
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$REPO" --ref main "$@" >/dev/null
            run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo "$REPO" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done
            if [ -z "$run_id" ]; then
              echo "Unable to capture workflow_dispatch run for $workflow" >&2
              return 1
            fi
            echo "$run_id"
          }

          watch_gate() {
            local label="$1" run_id="$2"
            echo "FIELD_FINAL_GATE_START label=$label run=$run_id"
            gh run watch "$run_id" --repo "$REPO" --exit-status --interval 20
            echo "FIELD_FINAL_GATE_OK label=$label run=$run_id"
          }

          # The favicon/site-icon network pass is a migration, never a recurring
          # maintenance job. If its launcher still exists, run it exactly once.
          if gh api "repos/$REPO/contents/.github/workflows/provider-logo-refinement-finalize-once.yml?ref=main" >/dev/null 2>&1; then
            LOGO_RUN="$(dispatch_and_capture provider-logo-refinement-finalize-once.yml)"
            echo "LOGO_RUN=$LOGO_RUN" >> "$STATE_FILE"
            watch_gate logo-once "$LOGO_RUN"
          else
            LOGO_RUN=""
            echo "LOGO_RUN=" >> "$STATE_FILE"
          fi

          # Reload main after the self-deleting migration and prove no network
          # logo-generation machinery survives into the final repository.
          git fetch origin main
          git reset --hard origin/main
          for retired in \
            scripts/refine_provider_logos_from_favicons_once.py \
            .github/workflows/provider-favicon-refinement-once.yml \
            .github/workflows/provider-logo-refinement-finalize-once.yml \
            scripts/diagnose_core_rebuild_once.py \
            .github/workflows/core-rebuild-diagnostic-once.yml; do
            if [ -e "$retired" ]; then
              echo "One-shot/diagnostic machinery remains after migration: $retired" >&2
              exit 1
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path('assets/providers/index.json').read_text(encoding='utf-8'))
          providers=index.get('providers') or {}
          assert len(providers)==92, len(providers)
          assert index.get('futurePolicy')=='committed-assets-only-no-network-regeneration'
          refinement=index.get('faviconRefinement') or {}
          assert refinement.get('mode')=='one-shot-site-icon-preference', refinement
          print(f"FIELD_FINAL_LOGO_MIGRATION providers={len(providers)} refined={refinement.get('refinedProviders',0)} policy=committed-only")
          PY

          CORE_RUN="$(dispatch_and_capture core-media-finalize-main.yml)"
          echo "CORE_RUN=$CORE_RUN" >> "$STATE_FILE"
          watch_gate core "$CORE_RUN"

          DEEP_RUN="$(dispatch_and_capture sync.yml -f mode=deep)"
          echo "DEEP_RUN=$DEEP_RUN" >> "$STATE_FILE"
          watch_gate deep "$DEEP_RUN"

          TEST_SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "TEST_SHA=$TEST_SHA" >> "$STATE_FILE"
          echo "FIELD_FINAL_TEST_SHA sha=$TEST_SHA"

          declare -A workflows=(
            [brain]='brain-learning-lab.yml'
            [android]='native-android-route-reader.yml'
            [desktop]='native-desktop-reader-acceptance.yml'
            [badge]='badge-light-contrast.yml'
            [security]='security-final-gate.yml'
            [upstreams]='weekly-upstream-provider-discovery.yml'
          )
          declare -A runs=()
          for label in brain android desktop badge security upstreams; do
            runs[$label]="$(dispatch_and_capture "${workflows[$label]}")"
            echo "${label^^}_RUN=${runs[$label]}" >> "$STATE_FILE"
          done

          for label in badge upstreams security brain desktop android; do
            watch_gate "$label" "${runs[$label]}"
          done

          # workflow_run intentionally ignores workflow_dispatch native runs.
          # Import the two exact final native runs explicitly and serially.
          ANDROID_SYNC_RUN="$(dispatch_and_capture provider-results-readme-sync.yml -f run_id="${runs[android]}")"
          echo "ANDROID_SYNC_RUN=$ANDROID_SYNC_RUN" >> "$STATE_FILE"
          watch_gate android-readme-sync "$ANDROID_SYNC_RUN"

          DESKTOP_SYNC_RUN="$(dispatch_and_capture provider-results-readme-sync.yml -f run_id="${runs[desktop]}")"
          echo "DESKTOP_SYNC_RUN=$DESKTOP_SYNC_RUN" >> "$STATE_FILE"
          watch_gate desktop-readme-sync "$DESKTOP_SYNC_RUN"

          RESULT_SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "RESULT_SHA=$RESULT_SHA" >> "$STATE_FILE"
          echo "FIELD_FINAL_RESULT_SHA sha=$RESULT_SHA"

          if [ "$RESULT_SHA" != "$TEST_SHA" ]; then
            gh api "repos/$REPO/compare/${TEST_SHA}...${RESULT_SHA}" > "$RUNNER_TEMP/final-docs-compare.json"
            mapfile -t CHANGED < <(jq -r '.files[]?.filename' "$RUNNER_TEMP/final-docs-compare.json" | sort -u)
            printf 'FIELD_FINAL_POST_TEST_CHANGE=%s\n' "${CHANGED[@]}"
            if [ "${#CHANGED[@]}" -eq 0 ]; then
              echo "main SHA changed but compare contains no files: tested=$TEST_SHA result=$RESULT_SHA" >&2
              exit 1
            fi
            for path in "${CHANGED[@]}"; do
              case "$path" in
                README.md|automation/provider-device-results.json) ;;
                *) echo "Non-documentation main change after tested SHA: $path" >&2; exit 1 ;;
              esac
            done
          fi

          HYGIENE_RUN="$(dispatch_and_capture repository-hygiene.yml)"
          echo "HYGIENE_RUN=$HYGIENE_RUN" >> "$STATE_FILE"
          watch_gate hygiene "$HYGIENE_RUN"

          MAINONLY_RUN="$(dispatch_and_capture main-only-policy.yml)"
          echo "MAINONLY_RUN=$MAINONLY_RUN" >> "$STATE_FILE"
          watch_gate mainonly "$MAINONLY_RUN"

          FINAL_SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$STATE_FILE"
          if [ "$FINAL_SHA" != "$RESULT_SHA" ]; then
            echo "main changed after final hygiene/main-only seal: result=$RESULT_SHA final=$FINAL_SHA" >&2
            exit 1
          fi

          mapfile -t BRANCHES < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort -u)
          printf 'FIELD_FINAL_BRANCH=%s\n' "${BRANCHES[@]}"
          for branch in "${BRANCHES[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) ;;
              *) echo "Unexpected branch remains: $branch" >&2; exit 1 ;;
            esac
          done

          OPEN_PRS="$(gh pr list --repo "$REPO" --state open --json number --jq 'length')"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "Open PRs remain: $OPEN_PRS" >&2
            gh pr list --repo "$REPO" --state open
            exit 1
          fi

          cat "$STATE_FILE"

      - name: Close security completion issue on full success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source "$STATE_FILE"
          LOGO_LINE='- Provider logo one-shot: already completed before this run'
          if [ -n "${LOGO_RUN:-}" ]; then
            LOGO_LINE="- Provider logo one-shot: https://github.com/${REPO}/actions/runs/${LOGO_RUN}"
          fi
          BODY=$(cat <<EOF
          Final NiakVIO validation succeeded.

          - Tested provider/runtime SHA after Core + Deep: ${TEST_SHA}
          - Final documentation/native evidence SHA: ${FINAL_SHA}
          ${LOGO_LINE}
          - Core finalizer: https://github.com/${REPO}/actions/runs/${CORE_RUN}
          - Deep provider audit: https://github.com/${REPO}/actions/runs/${DEEP_RUN}
          - Brain sandbox: https://github.com/${REPO}/actions/runs/${BRAIN_RUN}
          - Android TV/Mobile native readers: https://github.com/${REPO}/actions/runs/${ANDROID_RUN}
          - Desktop native readers: https://github.com/${REPO}/actions/runs/${DESKTOP_RUN}
          - Android native evidence → README: https://github.com/${REPO}/actions/runs/${ANDROID_SYNC_RUN}
          - Desktop native evidence → README: https://github.com/${REPO}/actions/runs/${DESKTOP_SYNC_RUN}
          - Light badge QA: https://github.com/${REPO}/actions/runs/${BADGE_RUN}
          - Provider security/CodeQL gate: https://github.com/${REPO}/actions/runs/${SECURITY_RUN}
          - Three-upstream discovery review: https://github.com/${REPO}/actions/runs/${UPSTREAMS_RUN}
          - Repository hygiene: https://github.com/${REPO}/actions/runs/${HYGIENE_RUN}
          - Main-only policy: https://github.com/${REPO}/actions/runs/${MAINONLY_RUN}

          Final repository state was rechecked after all gates: only README.md and automation/provider-device-results.json were allowed to change after the tested provider/runtime SHA; main then remained sealed, no open PR remained, and only main plus brain-learning/proposals remained as allowed branches.
          EOF
          )
          gh issue close 69 --repo "$REPO" --comment "$BODY"

      - name: Preserve failure evidence without closing issue
        if: failure()
        shell: bash
        run: |
          set +e
          DETAILS=''
          if [ -f "$STATE_FILE" ]; then DETAILS="$(cat "$STATE_FILE")"; fi
          gh issue comment 69 --repo "$REPO" --body "Final validation run failed and #69 remains open: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}. Captured gate state:\n\n${DETAILS}"
          if [ -f "$STATE_FILE" ]; then cat "$STATE_FILE"; fi
