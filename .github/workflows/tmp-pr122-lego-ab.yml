name: TMP - PR122 Lego AB
# trigger

on:
  pull_request:
    branches:
      - tmp/pr122-lego-ab-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: allwish
            script: scripts/provider_patches/allwish_current_runtime_v1.py
          - provider: vidlove
            script: scripts/provider_patches/vidlove_current_api_v1.py
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Switch provider to PR122 Lego in disposable workspace
        env:
          PROVIDER: ${{ matrix.provider }}
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('provider-overrides.json')
          data=json.loads(p.read_text())
          row=data['provider_patches'][os.environ['PROVIDER']]
          row['provider_lego_scripts']=[os.environ['SCRIPT']]
          opts=row.get('provider_lego_options') if isinstance(row.get('provider_lego_options'),dict) else {}
          row['provider_lego_options']={os.environ['SCRIPT']: opts.get(os.environ['SCRIPT'],{})}
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 scripts/materialize_provider_v3_one.py "$PROVIDER"
          mkdir -p health-output

      - name: Certify PR122 Lego
        continue-on-error: true
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -o pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider "$PROVIDER" \
            --candidate-limit 6 \
            --timeout 25 \
            --workers 1 \
            --seed "pr122-lego-ab-${GITHUB_RUN_ID}-${PROVIDER}" \
            --output "health-output/${PROVIDER}-v1-cert.json" \
            2>&1 | tee "health-output/${PROVIDER}-v1.log"

      - name: Summarize PR122 Lego
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          provider=os.environ['PROVIDER']
          p=Path('health-output')/f'{provider}-v1-cert.json'
          if not p.exists():
              print('FIELD_PR122_LEGO_AB',provider,'missing=true')
              raise SystemExit
          data=json.loads(p.read_text())
          row=(data.get('providers') or [{}])[0]
          lanes=row.get('lanes') or {}
          green=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
          stages=sorted({str(a.get('debugStage') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
          hosts=sorted({str(n.get('host') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
          print('FIELD_PR122_LEGO_AB',provider,'green='+(','.join(green) or '-'),'full='+str(bool(row.get('certified'))).lower(),'stages='+('|'.join(stages) or '-'),'hosts='+('|'.join(hosts) or '-'))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr122-lego-ab-${{ matrix.provider }}-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
