name: TEMP - Semantic drift diagnostic
on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-semantic-drift-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/labs-5.21.44-20260912}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compare semantic authority layers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          cat=json.loads((root/'provider_catalog.json').read_text())
          ov=json.loads((root/'provider-overrides.json').read_text()).get('provider_patches') or {}
          disp=json.loads((root/'automation/provider-repair-disposition.json').read_text())
          disp_rows={str(x.get('provider') or x.get('id') or '').casefold():x for x in (disp.get('providers') or disp.get('rows') or []) if isinstance(x,dict)}
          sem={}
          for p in cat.get('providers') or []:
              s=p.get('scraper') or {}; pid=str(s.get('id') or p.get('canonicalId') or '').strip().casefold()
              sem[pid]=[str(x).strip().casefold() for x in (s.get('canonicalSupportedTypes') or s.get('supportedTypes') or [])]
          targets=['anime-sama','mugiwarastream','neko-sama','animevost-fr','fullanime']
          for pid in targets:
              o=ov.get(pid) or {}; rd=o.get('repair_disposition') or disp_rows.get(pid) or {}
              print('AUTH',pid,'catalog=',sem.get(pid),'published=',o.get('published_types'),'required=',rd.get('requiredLanes'),'proven=',rd.get('provenLanes'),'status=',rd.get('recoveryStatus'))
          for rel in ('manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              p=root/rel
              if not p.exists(): continue
              m=json.loads(p.read_text())
              for row in m.get('scrapers') or []:
                  pid=str(row.get('id') or '').strip().casefold(); explicit=[str(x).strip().casefold() for x in (row.get('canonicalSupportedTypes') or [])]
                  canonical=sem.get(pid)
                  if explicit and explicit!=canonical:
                      print('SEMANTIC_MISMATCH',rel,pid,'catalog=',canonical,'projection=',explicit)
                  transport=[str(x).strip().casefold() for x in (row.get('supportedTypes') or [])]
                  wanted=list(canonical or [])
                  if 'anime' in wanted and 'tv' not in wanted: wanted.append('tv')
                  if 'tv' in wanted and 'series' not in wanted: wanted.append('series')
                  if canonical is not None and transport!=wanted:
                      print('TRANSPORT_MISMATCH',rel,pid,'canonical=',canonical,'transport=',transport,'wanted=',wanted)
          PY
