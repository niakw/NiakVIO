name: TEMP - Fix current Kurage tRPC

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-kurage-current.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Bind Kurage clean runtime and rematerialize Hub46
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json');d=json.loads(p.read_text());row=d.setdefault('provider_patches',{}).setdefault('kurage',{})
          script='scripts/provider_patches/kurage_runtime_v1.py'; lego=row.get('provider_lego_scripts')
          if not isinstance(lego,list):lego=[]
          if script not in lego:lego.append(script)
          row['provider_lego_scripts']=lego
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/materialize_provider_v3_all.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text());row=next(x for x in m['scrapers'] if str(x['id']).lower()=='kurage')
          path=Path(row['filename']);print('KURAGE_FILE',path)
          assert path.exists(),path
          assert 'NIAKVIO_KURAGE_RUNTIME_V1' in path.read_text(encoding='utf-8'),path
          d=json.loads(Path('provider-v3-materialization.json').read_text());assert len(d.get('providers') or [])==46
          print('KURAGE_RUNTIME_BOUND=yes HUB46=46')
          PY

      - name: Exact Mushoku terminal proof
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts');import run_provider_upstream_parity_v3 as v3
          m=json.loads(Path('manifest.json').read_text());row=next(x for x in m['scrapers'] if str(x['id']).lower()=='kurage')
          f={'tmdbId':'94664','mediaType':'anime','category':'anime','title':'Mushoku Tensei: Jobless Reincarnation','year':2021,'season':1,'episode':1}
          r=v3._run_verified(Path(row['filename']),f,40)
          print('KURAGE_EXACT',json.dumps(r,sort_keys=True))
          assert int(r.get('stream_count') or 0)>=1,r
          assert r.get('terminal_verified') is True,r
          PY

      - name: Full32 Kurage regression recheck
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 1 --timeout 25 \
            --seed 20260914-kurage-fixed \
            --out /tmp/kurage-v3.json --provider kurage
          python - <<'PY'
          import json
          d=json.load(open('/tmp/kurage-v3.json'))
          print('KURAGE_FULL32',json.dumps({'counts':d.get('statusCounts'),'regressions':d.get('certainRegressions')},sort_keys=True))
          assert 'kurage' not in (d.get('certainRegressions') or []),d
          PY

      - name: Commit verified Kurage repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json providers/ manifest.json provider-v3-materialization.json scripts/provider_patches/kurage_runtime_v1.py
          if git diff --cached --quiet; then echo 'No Kurage diff'; exit 1; fi
          git commit -m 'fix: restore Kurage tRPC proxy runtime'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
