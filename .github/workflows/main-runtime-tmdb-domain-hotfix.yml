      - name: Verify published TV transport aliases remain global
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for rel in ('manifest.json', 'no-anime/manifest.json', 'vf/manifest.json', 'vf-no-anime/manifest.json'):
              data=json.loads(Path(rel).read_text(encoding='utf-8'))
              for row in data.get('scrapers', []):
                  canonical=[str(x).lower() for x in row.get('canonicalSupportedTypes', row.get('supportedTypes', []))]
                  supported=[str(x).lower() for x in row.get('supportedTypes', [])]
                  if 'tv' in canonical and 'series' not in supported:
                      raise SystemExit(f'{rel}:{row.get("id")}: tv missing series transport alias')
                  if 'series' in canonical:
                      raise SystemExit(f'{rel}:{row.get("id")}: series leaked into canonical types')
          print('GLOBAL_SERIES_TRANSPORT_ALIAS_OK')
          PY

      - name: Commit verified hotfix to main and remove executor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/main-runtime-tmdb-domain-hotfix.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No hotfix changes to publish.'
            exit 0
          fi
          git commit -m 'fix: restore native TV series identity and domain projection'
          git push origin HEAD:main
