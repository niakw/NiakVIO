name: MAIN - Dual ID Runtime Hotfix
# retry: canonical-routes-transport-metadata-v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-runtime-tmdb-domain-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: main-dual-id-runtime-hotfix
  cancel-in-progress: true

env:
  TARGET_VERSION: 5.21.34

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Snapshot current publication
        run: cp manifest.json "$RUNNER_TEMP/manifest-before.json"

      - name: Repair and apply global Core/native-contract fixes
        run: |
          set -euo pipefail
          python3 scripts/apply_main_dual_id_hotfix_bootstrap.py
          python3 scripts/patch_native_request_contract_series.py

      - name: Validate source contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/provider_patches/global_media_type_resolution_v1.py scripts/augment_native_provider_loading.py scripts/augment_native_provider_loading_compat.py scripts/augment_native_corpus_request_contract.py scripts/gate_native_app_provider_selection.py scripts/refresh_authoritative_hub_domains.py
          python3 tests/global_media_type_resolution_test.py
          python3 tests/native_dual_id_identity_test.py
          python3 tests/native_app_provider_selection_gate_test.py
          python3 tests/native_provider_loading_compat_test.py
          python3 tests/native_evidence_codegen_pipeline_test.py
          python3 tests/domain_refresh_workflow_test.py

      - name: Rematerialize all provider bundles
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/global_media_type_resolution_test.py
          python3 tests/native_dual_id_identity_test.py

      - name: Regenerate derived manifest views
        run: |
          set -euo pipefail
          python3 scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python3 tests/reapply_manifest_type_projection_test.py
          python3 tests/language_projection_test.py
          python3 tests/language_manifest_metadata_consistency_test.py

      - name: Bump manifest and changed provider versions
        run: |
          set -euo pipefail
          python3 scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json" --version "$TARGET_VERSION" | tee "$RUNNER_TEMP/version-sync.log"
          python3 scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          before=json.loads((Path(os.environ['RUNNER_TEMP'])/'manifest-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert after.get('version')=='5.21.34', after.get('version')
          old={str(r.get('id','')).casefold():r for r in before.get('scrapers',[]) if isinstance(r,dict)}
          changed=[]
          for row in after.get('scrapers',[]):
              if not isinstance(row,dict):
                  continue
              prev=old.get(str(row.get('id','')).casefold())
              if prev and (prev.get('filename')!=row.get('filename') or prev.get('supportedTypes')!=row.get('supportedTypes')):
                  changed.append(str(row.get('id')))
                  ov=[int(x) for x in str(prev.get('version','0.0.0')).split('.')]
                  nv=[int(x) for x in str(row.get('version','0.0.0')).split('.')]
                  assert nv>ov, f"provider version not bumped: {row.get('id')} {prev.get('version')} -> {row.get('version')}"
          assert len(changed)>=90, f"global Core change touched too few provider rows: {len(changed)}"
          print(f"GLOBAL_PROVIDER_VERSION_BUMP_OK changed={len(changed)}")
          PY

      - name: Verify release and global transport contracts
        run: |
          set -euo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/provider_versioning_test.py
          python3 tests/reapply_provider_versioning_test.py
          python3 tests/release_version_sync_test.py
          python3 tests/platform_filter_semantics_test.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for rel in ('manifest.json','no-anime/manifest.json','vf/manifest.json','vf-no-anime/manifest.json'):
              data=json.loads(Path(rel).read_text(encoding='utf-8'))
              assert data.get('version')=='5.21.34', (rel,data.get('version'))
              for row in data.get('scrapers',[]):
                  canonical=[str(x).lower() for x in row.get('canonicalSupportedTypes',[])]
                  supported=[str(x).lower() for x in row.get('supportedTypes',[])]
                  assert 'series' not in canonical, f"{rel}:{row.get('id')}: series leaked canonical"
                  if 'tv' in supported:
                      assert 'series' in supported, f"{rel}:{row.get('id')}: missing series transport alias"
          cfg=json.loads(Path('provider-overrides.json').read_text(encoding='utf-8'))['provider_patches']['flemmix']
          assert cfg['official_site']=='https://flemmix.kim'
          assert cfg.get('domain_substitutions',{}).get('flemmix.men')=='flemmix.kim'
          assert all(str(v)!='flemmix.men' for v in cfg.get('domain_substitutions',{}).values())
          print('GLOBAL_RELEASE_CONTRACT_OK')
          PY

      - name: Commit verified 5.21.34 and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/main-runtime-tmdb-domain-hotfix.yml scripts/apply_main_dual_id_hotfix.py scripts/apply_main_dual_id_hotfix_bootstrap.py scripts/patch_native_request_contract_series.py
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore dual IMDb/TMDB provider identity contract'
          git pull --rebase origin main
          git push origin HEAD:main
