print("authoritative hub domain refresh skips terminal validation and accepts current hub destination")
'''
              )
          t.write_text(ts, encoding='utf-8')

          # Update workflow contract language and its static regression test.
          wf = Path('.github/workflows/domain-refresh.yml')
          w = wf.read_text(encoding='utf-8')
          w = w.replace('Resolve authoritative hub primary domains', 'Resolve authoritative hub terminal domains')
          w = w.replace('Enforce authoritative domain-only immutability', 'Enforce authoritative terminal-domain projection')
          w = w.replace('Publish authoritative primary-domain update', 'Publish authoritative terminal-domain update')
          w = w.replace("git commit -m 'chore(domains): update authoritative Provider v3 primary domains'", "git commit -m 'chore(domains): update authoritative Provider v3 terminal domain projection'")
          w = w.replace("echo 'No authoritative hub primary-domain change.'", "echo 'No authoritative hub terminal-domain projection change.'")
          wf.write_text(w, encoding='utf-8')

          t = Path('tests/domain_refresh_workflow_test.py')
          ts = t.read_text(encoding='utf-8')
          ts = ts.replace('assert "Provider v3 primary domains" in commit_line', 'assert "Provider v3 terminal domain projection" in commit_line')
          old_contract = '''assert '\"kind\": \"official_site\"' in authority

assert 'out.pop(\"official_site\",None)' in scope
for forbidden in (\"official_api\",\"api_recipe\",\"runtime_domain_replacements\",\"replacements\",\"patch_script_options\"):
    assert forbidden not in scope, f\"domain refresh scope must not allow {forbidden}\"
'''
          new_contract = '''assert 'DOMAIN_DESTINATION_MAP_FIELDS' in authority
assert '_synchronize_terminal_references' in authority
assert '\"terminal_domain_projection\"' in scope
assert '_synchronize_terminal_references' in scope
'''
          ts = replace_once(ts, old_contract, new_contract, 'domain refresh workflow test contract')
          ts = ts.replace('print("CORE domain refresh authoritative-hub official_site-only contract passed")', 'print("CORE domain refresh authoritative terminal-domain projection contract passed")')
          t.write_text(ts, encoding='utf-8')

          # Reconcile the already-known Flemmix current terminal immediately.
          import json, sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import refresh_authoritative_hub_domains as refresh
          cfg_path = Path('provider-overrides.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          flemmix = cfg.get('provider_patches', {}).get('flemmix')
          if not isinstance(flemmix, dict):
              raise SystemExit('missing flemmix provider patch')
          current = str(flemmix.get('official_site') or '').rstrip('/')
          changes = refresh._synchronize_terminal_references(flemmix, current, current)
          if not changes:
              raise SystemExit('expected Flemmix stale domain projection to be reconciled')
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'FLEMMIX_DOMAIN_RECONCILED changes={len(changes)} terminal={current}')
          PY

