"""Fail closed unless Domain Refresh matches the deterministic terminal-domain projection."""
from __future__ import annotations
import argparse, copy, json
from pathlib import Path
from typing import Any
import refresh_authoritative_hub_domains as refresh


def load(path: Path) -> dict[str, Any]:
    value = json.loads(path.read_text(encoding="utf-8"))
    if not isinstance(value, dict):
        raise SystemExit(f"{path}: object required")
    return value


def main() -> int:
    p = argparse.ArgumentParser()
    p.add_argument("--before", type=Path, required=True)
    p.add_argument("--after", type=Path, required=True)
    p.add_argument("--output", type=Path, required=True)
    args = p.parse_args()
    before = load(args.before)
    after = load(args.after)
    for key in sorted(set(before) | set(after)):
        if key == "provider_patches":
            continue
        if before.get(key) != after.get(key):
            raise SystemExit(f"domain refresh changed forbidden top-level key: {key}")
    bp = before.get("provider_patches") or {}
    ap = after.get("provider_patches") or {}
    if set(bp) != set(ap):
        raise SystemExit("domain refresh may not add/remove provider patches")
    changed: list[str] = []
    for pid in sorted(bp):
        b = bp[pid]
        a = ap[pid]
        if b == a:
            continue
        if not isinstance(b, dict) or not isinstance(a, dict):
            raise SystemExit(f"{pid}: provider patch object shape changed")
        after_site = str(a.get("official_site") or "").rstrip("/")
        if not after_site:
            raise SystemExit(f"{pid}: domain refresh may not clear official_site")
        expected = copy.deepcopy(b)
        refresh._synchronize_terminal_references(
            expected,
            str(b.get("official_site") or "").rstrip("/"),
            after_site,
        )
        if expected != a:
            raise SystemExit(f"{pid}: domain refresh changed DATA outside deterministic terminal projection")
        changed.append(pid)
    args.output.parent.mkdir(parents=True, exist_ok=True)
    args.output.write_text(
        json.dumps({"changed": changed, "field": "terminal_domain_projection"}, indent=2, ensure_ascii=False) + "\\n",
        encoding="utf-8",
    )
    print(f"FIELD_DOMAIN_REFRESH_SCOPE providers={len(changed)} field=terminal_domain_projection fix_mutation=false")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding='utf-8')

