name: MAIN - Dual ID Runtime + Domain Projection Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-runtime-tmdb-domain-hotfix.yml'

permissions:
  contents: write

env:
  TARGET_VERSION: 5.21.34

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Import reviewed global Domain Refresh correction from PR 92
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/92/head:refs/remotes/origin/pr92
          # PR92 changes only the Flemmix terminal projection in provider-overrides
          # and adds the generic derivative reconciler + regression test.
          git checkout refs/remotes/origin/pr92 -- \
            scripts/refresh_authoritative_hub_domains.py \
            tests/priority_tv_year_domain_refresh_test.py \
            provider-overrides.json

      - name: Patch Core media identity to dual IMDb/TMDB contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/provider_patches/global_media_type_resolution_v1.py')
          s = p.read_text(encoding='utf-8')

          def one(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              s = s.replace(old, new, 1)

          one(
              'metadata capability backed by request context/cache, a credential explicitly\n'
              'supplied by the host runtime/CI, or the trusted native fetch bridge. Provider\n'
              'bundles never embed, receive, recover or decrypt a TMDB credential.\n',
              'metadata capability backed by request context/cache or a credential explicitly\n'
              'supplied by the host runtime/CI. The native fetch bridge is transport only and is\n'
              'never treated as TMDB authentication. Provider bundles never embed, receive,\n'
              'recover or decrypt a TMDB credential.\n',
              'credential contract doc',
          )
          one(
              'response) degrades to a fail-open transport/semantic fallback so one metadata\n'
              'outage cannot suppress the entire provider catalogue. No public HTML scraping is\n'
              'used as a classification substitute.\n',
              'response) degrades to a fail-open transport/semantic fallback so one metadata\n'
              'outage cannot suppress the entire provider catalogue. Credentialless Mobile and\n'
              'Desktop may use TMDB public redirect/page identity only to bridge IMDb/TMDB and\n'
              'title/year; that degraded path is never an authoritative semantic classifier.\n',
              'fallback contract doc',
          )
          one(
              '"revision": "tmdb-data-contract-launch-gate-v27-anime-semantic-transport",',
              '"revision": "tmdb-data-contract-launch-gate-v29-dual-id-native-identity",',
              'revision',
          )
          one(
              'function nativeFetchBridge(){try{return !!(g&&typeof g.__native_fetch==="function")}catch(_){return false}}\n',
              '',
              'native bridge auth helper',
          )
          one(
              'async function apiJson(url){\n'
              '  var key=coreCredentialKey,token=coreCredentialToken,nativeBridge=nativeFetchBridge();\n'
              '  if(!g||typeof g.fetch!=="function"||(!key&&!token&&!nativeBridge))return{state:"unavailable",value:null};\n',
              'async function apiJson(url){\n'
              '  var key=coreCredentialKey,token=coreCredentialToken;\n'
              '  if(!g||typeof g.fetch!=="function"||(!key&&!token))return{state:"unavailable",value:null};\n',
              'api auth gate',
          )

          helpers = r'''
function metadataImdb(m){
  if(!m||typeof m!=="object")return"";
  var x=s(m.imdb_id||m.imdbId||(m.external_ids&&m.external_ids.imdb_id)||"").toLowerCase();
  return /^tt\d+$/.test(x)?x:"";
}
function htmlDecode(v){return String(v==null?"":v).replace(/&amp;/gi,"&").replace(/&quot;/gi,'"').replace(/&#39;|&#x27;/gi,"'").replace(/&lt;/gi,"<").replace(/&gt;/gi,">").replace(/&nbsp;/gi," ")}
function htmlText(v){return htmlDecode(String(v==null?"":v).replace(/<[^>]*>/g," ")).replace(/\s+/g," ").trim()}
function publicMetadata(html,namespace,id,imdbHint){
  var source=String(html||""),titleTag=/<title[^>]*>([\s\S]*?)<\/title>/i.exec(source),og=null;
  og=/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i.exec(source)||/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i.exec(source);
  var raw=htmlText(titleTag&&titleTag[1]||"");
  raw=raw.replace(/\s+[—-]\s+The Movie Database(?:\s*\(TMDB\))?.*$/i,"").trim();
  var title=htmlText(og&&og[1]||"")||raw;
  title=title.replace(/\s+[—-]\s+The Movie Database(?:\s*\(TMDB\))?.*$/i,"").trim();
  var ym=/\((?:TV Series\s+)?((?:19|20)\d{2})[^)]*\)\s*$/i.exec(raw)||/\((?:TV Series\s+)?((?:19|20)\d{2})[^)]*\)\s*$/i.exec(title);
  var year=ym?ym[1]:"";
  title=title.replace(/\s*\((?:TV Series\s+)?(?:19|20)\d{2}[^)]*\)\s*$/i,"").trim();
  var im=s(imdbHint).toLowerCase(),imMatch=/imdb\.com\/title\/(tt\d+)/i.exec(source)||/["']imdb_id["']\s*:\s*["'](tt\d+)["']/i.exec(source);
  if(imMatch)im=imMatch[1].toLowerCase();
  if(!title)return null;
  var row={id:Number(id)||0,__nuvioTmdbId:String(id||""),__nuvioTmdbNamespace:namespace,__nuvioPublicIdentityOnly:true};
  if(im){row.imdb_id=im;row.external_ids={imdb_id:im}}
  if(namespace==="movie"){row.title=title;row.original_title=title;if(year)row.release_date=year+"-01-01"}
  else{row.name=title;row.original_name=title;if(year)row.first_air_date=year+"-01-01"}
  return row;
}
function publicTarget(response){
  var u=s(response&&response.url),m=/\/((?:movie|tv))\/(\d+)(?:[-/?#]|$)/i.exec(u);
  return m?{namespace:m[1].toLowerCase()==="movie"?"movie":"tv",tmdbId:m[2]}:null;
}
async function publicFindTmdb(imdbId,candidates){
  var imdb=s(imdbId).replace(/^imdb:/i,"").toLowerCase();
  if(!/^tt\d+$/.test(imdb)||!g||typeof g.fetch!=="function")return{state:"unavailable",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:true};
  try{
    var url="https://www.themoviedb.org/redirect?external_source=imdb_id&external_id="+encodeURIComponent(imdb);
    var response=await g.fetch(url,{headers:{Accept:"text/html,application/xhtml+xml;q=0.9,*/*;q=0.1"},redirect:"follow",signal:timeout()});
    if(!response||!response.ok)return{state:"unavailable",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:true};
    var target=publicTarget(response);if(!target)return{state:"unavailable",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:true};
    if(candidates&&candidates.length&&candidates.indexOf(target.namespace)<0)return{state:"not_found",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:true};
    var html=typeof response.text==="function"?await response.text():"";
    var meta=publicMetadata(html,target.namespace,target.tmdbId,imdb);
    return{state:"ok",tmdbId:target.tmdbId,namespace:target.namespace,metadata:meta,imdbId:imdb,degraded:true};
  }catch(_){return{state:"unavailable",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:true}}
}
async function publicTmdb(namespaceValue,tmdbId,imdbHint){
  var namespace=namespaceValue==="movie"?"movie":"tv",id=s(tmdbId);
  if(!/^\d+$/.test(id)||!g||typeof g.fetch!=="function")return{state:"unavailable",metadata:null,degraded:true};
  try{
    var url="https://www.themoviedb.org/"+namespace+"/"+encodeURIComponent(id)+"?language=en-US";
    var response=await g.fetch(url,{headers:{Accept:"text/html,application/xhtml+xml;q=0.9,*/*;q=0.1"},redirect:"follow",signal:timeout()});
    if(!response)return{state:"unavailable",metadata:null,degraded:true};
    if(response.status===404)return{state:"not_found",metadata:null,degraded:true};
    if(!response.ok||typeof response.text!=="function")return{state:"unavailable",metadata:null,degraded:true};
    var row=publicMetadata(await response.text(),namespace,id,imdbHint);
    return row?{state:"ok",metadata:row,degraded:true}:{state:"unavailable",metadata:null,degraded:true};
  }catch(_){return{state:"unavailable",metadata:null,degraded:true}}
}
'''
          one('async function findTmdb(imdbId,candidates){\n', helpers + 'async function findTmdb(imdbId,candidates){\n', 'dual id helpers')

          old_find = r'''  var pending=(async function(){
    var probe=await apiJson("https://api.themoviedb.org/3/find/"+encodeURIComponent(imdb)+"?external_source=imdb_id");
    if(!probe||probe.state!=="ok")return{state:probe&&probe.state||"unavailable",tmdbId:"",namespace:"",metadata:null,imdbId:imdb};
    for(var i=0;i<candidates.length;i++){
      var namespace=candidates[i]==="movie"?"movie":"tv";
      var list=namespace==="movie"?rows(probe.value.movie_results):rows(probe.value.tv_results);
      for(var j=0;j<list.length;j++){
        var row=list[j],id=s(row&&row.id);
        if(/^\d+$/.test(id))return{state:"ok",tmdbId:id,namespace:namespace,metadata:row,imdbId:imdb};
      }
    }
    return{state:"not_found",tmdbId:"",namespace:"",metadata:null,imdbId:imdb};
  })();'''
          new_find = r'''  var pending=(async function(){
    var probe=await apiJson("https://api.themoviedb.org/3/find/"+encodeURIComponent(imdb)+"?external_source=imdb_id");
    if(probe&&probe.state==="ok"){
      for(var i=0;i<candidates.length;i++){
        var namespace=candidates[i]==="movie"?"movie":"tv";
        var list=namespace==="movie"?rows(probe.value.movie_results):rows(probe.value.tv_results);
        for(var j=0;j<list.length;j++){
          var row=list[j],id=s(row&&row.id);
          if(/^\d+$/.test(id))return{state:"ok",tmdbId:id,namespace:namespace,metadata:row,imdbId:imdb,degraded:false};
        }
      }
      return{state:"not_found",tmdbId:"",namespace:"",metadata:null,imdbId:imdb,degraded:false};
    }
    return await publicFindTmdb(imdb,candidates);
  })();'''
          one(old_find, new_find, 'find imdb implementation')

          old_tmdb = r'''    var probe=await apiJson("https://api.themoviedb.org/3/"+namespace+"/"+encodeURIComponent(id)+"?append_to_response="+encodeURIComponent(append)+"&language=fr-FR");
    if(!probe||probe.state!=="ok")return{state:probe&&probe.state||"unavailable",metadata:null};
    var value=probe.value;
    if(Number(value.id||0)<=0)return{state:"unavailable",metadata:null};
    value.__nuvioTmdbNamespace=namespace;
    value.__nuvioTmdbId=id;
    return{state:"ok",metadata:value};'''
          new_tmdb = r'''    var probe=await apiJson("https://api.themoviedb.org/3/"+namespace+"/"+encodeURIComponent(id)+"?append_to_response="+encodeURIComponent(append)+"&language=fr-FR");
    if(probe&&probe.state==="ok"){
      var value=probe.value;
      if(Number(value.id||0)<=0)return{state:"unavailable",metadata:null,degraded:false};
      value.__nuvioTmdbNamespace=namespace;
      value.__nuvioTmdbId=id;
      return{state:"ok",metadata:value,degraded:false};
    }
    if(probe&&probe.state==="not_found")return{state:"not_found",metadata:null,degraded:false};
    return await publicTmdb(namespace,id,"");'''
          one(old_tmdb, new_tmdb, 'numeric tmdb implementation')

          # Replace coreGetTmdbData wholesale: it now accepts either identifier and returns both.
          start = s.index('async function coreGetTmdbData(request){')
          end = s.index('\ntry{if(g)g.__nuvioCoreGetTmdbDataV1=coreGetTmdbData}catch(_){}', start)
          new_core = r'''async function coreGetTmdbData(request){
  var q=request&&typeof request==="object"&&!Array.isArray(request)?request:{};
  var raw=s(q.tmdbId||q.tmdb_id||q.imdbId||q.imdb_id||q.id),imdbId="",id="",explicit=s(q.tmdbNamespace||q.namespace).toLowerCase();
  var candidates=explicit==="movie"||explicit==="tv"?[explicit]:namespaceCandidates(q.mediaType||q.type,q.season,q.episode);
  var imdbMatch=/^(?:imdb:)?(tt\d+)$/i.exec(raw);
  var seed=null,degraded=false;
  if(imdbMatch){
    imdbId=imdbMatch[1].toLowerCase();
    var found=await findTmdb(imdbId,candidates);
    if(!found||found.state!=="ok"||!/^\d+$/.test(s(found.tmdbId)))return{state:found&&found.state||"unavailable",tmdbId:"",imdbId:imdbId,tmdbNamespace:"",metadata:null,episodeMetadata:null,degraded:true};
    id=s(found.tmdbId);candidates=[found.namespace];seed=found.metadata||null;degraded=found.degraded===true;
  }else{
    id=raw.replace(/^tmdb:/i,"");
    if(!/^\d+$/.test(id))return{state:"not_found",tmdbId:"",imdbId:"",tmdbNamespace:"",metadata:null,episodeMetadata:null,degraded:false};
  }
  var unavailable=false;
  for(var i=0;i<candidates.length;i++){
    var namespace=candidates[i]==="movie"?"movie":"tv",probe=null;
    if(seed&&s(seed.__nuvioTmdbNamespace||namespace)===namespace){probe={state:"ok",metadata:seed,degraded:degraded};seed=null}
    else probe=await tmdb(namespace,id);
    if(!probe||probe.state==="unavailable"){unavailable=true;continue}
    if(probe.state!=="ok"||!probe.metadata)continue;
    var meta=probe.metadata;imdbId=imdbId||metadataImdb(meta);degraded=degraded||probe.degraded===true;
    var episodeMetadata=null;
    var season=Number(q.season||0)||0,episode=Number(q.episode||0)||0;
    if(namespace==="tv"&&season>0&&episode>0&&coreCredentialKey){
      var episodeKey="episode:tv:"+id+":"+season+":"+episode+":fr-FR";
      if(Object.prototype.hasOwnProperty.call(mediaCache,episodeKey)){
        var cachedEpisode=await mediaCache[episodeKey];
        episodeMetadata=cachedEpisode&&cachedEpisode.metadata?cachedEpisode.metadata:cachedEpisode&&cachedEpisode.value?cachedEpisode.value:cachedEpisode||null;
      }else{
        var pendingEpisode=(async function(){
          var row=await apiJson("https://api.themoviedb.org/3/tv/"+encodeURIComponent(id)+"/season/"+encodeURIComponent(season)+"/episode/"+encodeURIComponent(episode)+"?language=fr-FR");
          if(!row||row.state!=="ok")return{state:row&&row.state||"unavailable",metadata:null};
          return{state:"ok",metadata:row.value};
        })();
        mediaCache[episodeKey]=pendingEpisode;
        var episodeResult=await pendingEpisode;
        if(episodeResult&&episodeResult.state==="unavailable")delete mediaCache[episodeKey];else mediaCache[episodeKey]=episodeResult;
        episodeMetadata=episodeResult&&episodeResult.metadata||null;
      }
    }
    return{state:"ok",tmdbId:id,imdbId:imdbId,tmdbNamespace:namespace,metadata:meta,episodeMetadata:episodeMetadata,degraded:degraded};
  }
  return{state:unavailable?"unavailable":"not_found",tmdbId:id,imdbId:imdbId,tmdbNamespace:"",metadata:null,episodeMetadata:null,degraded:true};
}'''
          s = s[:start] + new_core + s[end:]

          # IMDb resolution: public mapping is identity-only/degraded; do not classify anime from it.
          one(
              '      seedMetadata=found.metadata||null;\n'
              '    }else if(found&&found.state==="unavailable"){',
              '      seedMetadata=found.metadata||null;\n'
              '      if(found.degraded===true){var publicType=fallbackType(input,semantic);return{type:publicType,namespace:found.namespace,tmdbId:tmdbId,imdbId:imdbId,metadata:seedMetadata,authoritative:false,degraded:true};}\n'
              '    }else if(found&&found.state==="unavailable"){',
              'degraded imdb identity',
          )
          one(
              '    var type=animeMeta(metadata)?"anime":namespace;\n'
              '    return{type:type,namespace:namespace,tmdbId:/^\\d+$/.test(tmdbId)?tmdbId:"",imdbId:imdbId,metadata:metadata,authoritative:true,degraded:false};',
              '    imdbId=imdbId||metadataImdb(metadata);\n'
              '    var type=animeMeta(metadata)?"anime":namespace;\n'
              '    return{type:type,namespace:namespace,tmdbId:/^\\d+$/.test(tmdbId)?tmdbId:"",imdbId:imdbId,metadata:metadata,authoritative:true,degraded:false};',
              'metadata imdb enrichment',
          )
          one(
              '    var m=probe.metadata,type=animeMeta(m)?"anime":namespace;\n'
              '    return{type:type,namespace:namespace,tmdbId:tmdbId,imdbId:imdbId,metadata:m,authoritative:true,degraded:false};',
              '    var m=probe.metadata,isDegraded=probe.degraded===true;imdbId=imdbId||metadataImdb(m);\n'
              '    var type=isDegraded?fallbackType(input,semantic):(animeMeta(m)?"anime":namespace);\n'
              '    return{type:type,namespace:namespace,tmdbId:tmdbId,imdbId:imdbId,metadata:m,authoritative:!isDegraded,degraded:isDegraded};',
              'numeric public identity classification',
          )

          # Preserve both IDs on diagnostics and object-shaped provider requests.
          one(
              '      if(Object.prototype.hasOwnProperty.call(row,"tmdbId")&&context.tmdbId)row.tmdbId=context.tmdbId;\n'
              '      if(Object.prototype.hasOwnProperty.call(row,"degraded"))row.degraded=context.tmdbResolutionDegraded===true;',
              '      if(Object.prototype.hasOwnProperty.call(row,"tmdbId")&&context.tmdbId)row.tmdbId=context.tmdbId;\n'
              '      if(Object.prototype.hasOwnProperty.call(row,"imdbId")&&context.imdbId)row.imdbId=context.imdbId;\n'
              '      if(Object.prototype.hasOwnProperty.call(row,"degraded"))row.degraded=context.tmdbResolutionDegraded===true;',
              'output imdb stamp',
          )

          # Any IMDb positional input must be canonicalized before numeric-TMDB providers run.
          anchor = 'function providerNeedsTmdbBeforeStreams(container){\n'
          idx = s.index(anchor)
          external_helper = r'''function requestHasExternalIdentity(a){
  try{
    var first=a&&a[0],raw=objectRequest(first)?s(first.tmdbId||first.tmdb_id||first.imdbId||first.imdb_id||first.id):s(first);
    return /^(?:imdb:)?tt\d+$/i.test(raw);
  }catch(_){return false}
}
'''
          s = s[:idx] + external_helper + s[idx:]
          one(
              '      var verified=null;\n'
              '      var tmdbBeforeStreams=providerNeedsTmdbBeforeStreams(o);\n'
              '      if(tmdbBeforeStreams){\n'
              '        verified=await resolve(originalArgs);\n'
              '        if(!verified||deadlineExpired(requestDeadline))return [];\n'
              '        if(g&&requestToken&&g.__nuvioProviderRequestToken!==requestToken)return [];\n'
              '        if(!hasResolvedTmdbMetadata(verified))return [];\n'
              '        if(verified.__nuvioContext)verified.__nuvioContext.requestToken=requestToken;\n'
              '        if(g)g.__nuvioMediaContext=verified.__nuvioContext||null;\n'
              '        a=verified;\n'
              '      }\n',
              '      var verified=null;\n'
              '      var needsPlanMetadata=providerNeedsTmdbBeforeStreams(o);\n'
              '      var needsIdNormalization=requestHasExternalIdentity(originalArgs);\n'
              '      if(needsPlanMetadata||needsIdNormalization){\n'
              '        verified=await resolve(originalArgs);\n'
              '        if(!verified||deadlineExpired(requestDeadline)){if(needsPlanMetadata)return [];verified=null}\n'
              '        if(g&&requestToken&&g.__nuvioProviderRequestToken!==requestToken)return [];\n'
              '        if(verified){\n'
              '          if(needsPlanMetadata&&!hasResolvedTmdbMetadata(verified))return [];\n'
              '          if(verified.__nuvioContext)verified.__nuvioContext.requestToken=requestToken;\n'
              '          if(g)g.__nuvioMediaContext=verified.__nuvioContext||null;\n'
              '          a=verified;\n'
              '        }\n'
              '      }\n',
              'pre-provider identity normalization',
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add exact dual-ID native regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/native_dual_id_identity_test.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import importlib.util, subprocess, tempfile
          from pathlib import Path

          ROOT=Path(__file__).resolve().parents[1]
          spec=importlib.util.spec_from_file_location('resolver', ROOT/'scripts/provider_patches/global_media_type_resolution_v1.py')
          mod=importlib.util.module_from_spec(spec); assert spec.loader; spec.loader.exec_module(mod)

          source=mod.apply(r'''
          "use strict";
          async function getStreams(id,type,season,episode){
            const c=globalThis.__nuvioMediaContext||{};
            const m=c.tmdbMetadata||{};
            return [{url:"https://media.example/ok.m3u8", receivedId:String(id), receivedType:String(type), season, episode,
              tmdbId:c.tmdbId||"", imdbId:c.imdbId||"", title:String(m.name||m.title||""), degraded:c.tmdbResolutionDegraded===true}];
          }
          module.exports={getStreams,__niakvioProviderBase:{identityInput:{mode:"catalog_search",requiresTmdbBeforeRun:true}}};
          ''', options={'semantic_types':['movie','tv']})

          def run(js: str) -> None:
            with tempfile.TemporaryDirectory() as td:
              p=Path(td); (p/'provider.cjs').write_text(source,encoding='utf-8'); (p/'test.cjs').write_text(js,encoding='utf-8')
              r=subprocess.run(['node',str(p/'test.cjs'),str(p/'provider.cjs')],text=True,capture_output=True)
              assert r.returncode==0, r.stdout+r.stderr

          # Desktop/Mobile exact shape: IMDb episode id reaches pluginContentId as tt..., no TMDB key.
          run(r'''
          let api=0,redirect=0;
          global.fetch=async (url)=>{
            url=String(url);
            if(url.includes('api.themoviedb.org/3/')){api++;throw new Error('credentialless API call '+url)}
            if(url.includes('/redirect?external_source=imdb_id&external_id=tt11198330')){redirect++;return {ok:true,status:200,url:'https://www.themoviedb.org/tv/94997-house-of-the-dragon',text:async()=>'<title>House of the Dragon (TV Series 2022- ) — The Movie Database (TMDB)</title><a href="https://www.imdb.com/title/tt11198330/">IMDb</a>'}}
            throw new Error('unexpected '+url)
          };
          const p=require(process.argv[2]);(async()=>{const v=await p.getStreams('tt11198330','series',3,1);const x=v[0];
            if(x.receivedId!=='94997'||x.receivedType!=='tv'||x.tmdbId!=='94997'||x.imdbId!=='tt11198330'||x.title!=='House of the Dragon'||x.season!==3||x.episode!==1||x.degraded!==true)throw new Error(JSON.stringify(x));
            if(api!==0||redirect!==1)throw new Error('api='+api+' redirect='+redirect);
          })().catch(e=>{console.error(e);process.exit(1)});
          ''')

          # Numeric TMDB on credentialless native clients: enrich reverse IMDb + title from public identity page.
          run(r'''
          let api=0,page=0;
          global.fetch=async (url)=>{url=String(url);if(url.includes('api.themoviedb.org/3/')){api++;throw new Error('credentialless API '+url)}
            if(url.includes('/tv/94997')){page++;return {ok:true,status:200,url:'https://www.themoviedb.org/tv/94997-house-of-the-dragon',text:async()=>'<title>House of the Dragon (TV Series 2022- ) — The Movie Database (TMDB)</title><a href="https://www.imdb.com/title/tt11198330/">IMDb</a>'}}
            throw new Error('unexpected '+url)};
          const p=require(process.argv[2]);(async()=>{const v=await p.getStreams('94997','series',3,1);const x=v[0];
            if(x.receivedId!=='94997'||x.receivedType!=='tv'||x.tmdbId!=='94997'||x.imdbId!=='tt11198330'||x.title!=='House of the Dragon'||x.degraded!==true)throw new Error(JSON.stringify(x));
            if(api!==0||page!==1)throw new Error('api='+api+' page='+page);
          })().catch(e=>{console.error(e);process.exit(1)});
          ''')

          # TV contract: TMDB_API_KEY exists, so authenticated /find + details remain authoritative and public fallback is unused.
          run(r'''
          global.TMDB_API_KEY='0123456789abcdef0123456789abcdef';let api=0,pub=0;
          global.fetch=async (url)=>{url=String(url);if(url.includes('www.themoviedb.org')){pub++;throw new Error('public fallback on TV')}
            if(url.includes('/find/tt11198330')){api++;return {ok:true,status:200,url,json:async()=>({movie_results:[],tv_results:[{id:94997,name:'House of the Dragon',first_air_date:'2022-08-21'}]})}}
            if(url.includes('/tv/94997?')){api++;return {ok:true,status:200,url,json:async()=>({id:94997,name:'House of the Dragon',first_air_date:'2022-08-21',genres:[{id:18,name:'Drama'}],original_language:'en',external_ids:{imdb_id:'tt11198330'}})}}
            if(url.includes('/season/3/episode/1'))return {ok:true,status:200,url,json:async()=>({id:1,name:'Episode 1'})};
            throw new Error('unexpected '+url)};
          const p=require(process.argv[2]);(async()=>{const v=await p.getStreams('tt11198330','series',3,1);const x=v[0];
            if(x.receivedId!=='94997'||x.receivedType!=='tv'||x.tmdbId!=='94997'||x.imdbId!=='tt11198330'||x.degraded!==false)throw new Error(JSON.stringify(x));
            if(api<2||pub!==0)throw new Error('api='+api+' pub='+pub);
          })().catch(e=>{console.error(e);process.exit(1)});
          ''')

          print('native dual IMDb/TMDB identity tests passed')
          PY

