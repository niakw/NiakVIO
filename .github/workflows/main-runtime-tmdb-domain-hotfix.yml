              '    return{type:type,namespace:namespace,tmdbId:tmdbId,imdbId:imdbId,metadata:m,authoritative:true,degraded:false};\n',
              '    var m=probe.metadata,isDegraded=probe.degraded===true,type=isDegraded?fallbackType(input,semantic):(animeMeta(m)?"anime":namespace);\n'
              '    return{type:type,namespace:namespace,tmdbId:tmdbId,imdbId:imdbId,metadata:m,authoritative:!isDegraded,degraded:isDegraded};\n',
              'canonical degraded identity',
          )
          p.write_text(s, encoding='utf-8')

          # Regression coverage: native fetch exists but no TMDB credential is
          # exposed. Core must not issue an unauthenticated API request and must
          # still provide title/year to a catalogue-search provider.
          t = Path('tests/global_media_type_resolution_test.py')
          ts = t.read_text(encoding='utf-8')
          ts = replace_once(ts, 'assert "www.themoviedb.org/" not in mixed\n', 'assert "www.themoviedb.org/" in mixed\n', 'public TMDB fallback assertion')
          marker = "credentialless native runtime public TMDB identity fallback passed"
          if marker not in ts:
              ts += r'''

# Native NuvioTV/NuvioMobile expose a fetch bridge but do not expose their TMDB
# credential to provider QuickJS. A catalogue-search provider must therefore get
# title/year from the bounded public TMDB identity fallback, never from an
# unauthenticated /3 API request.
def run_case_without_key(source: str, runner: str) -> None:
    with tempfile.TemporaryDirectory() as tmp:
        tmp_path = Path(tmp)
        provider = tmp_path / "provider.cjs"
        test = tmp_path / "test.cjs"
        provider.write_text(source, encoding="utf-8")
        test.write_text(runner, encoding="utf-8")
        result = subprocess.run(["node", str(test), str(provider)], capture_output=True, text=True)
        assert result.returncode == 0, result.stdout + result.stderr

