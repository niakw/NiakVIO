name: MAIN - Runtime TMDB + Domain Projection Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-runtime-tmdb-domain-hotfix.yml'

permissions:
  contents: write

env:
  TARGET_VERSION: 5.21.34

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Patch global TMDB identity fallback and Domain Refresh projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor: {label} count={text.count(old)}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # CORE.MEDIA_TYPE_RESOLUTION.V1: authenticated API first, bounded
          # public TMDB identity fallback (title/year only) when native hosts do
          # not expose credentials to QuickJS. Public HTML is never authoritative
          # for anime/movie/tv semantic classification.
          # ------------------------------------------------------------------
          p = Path('scripts/provider_patches/global_media_type_resolution_v1.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'metadata capability backed by request context/cache, a credential explicitly\n'
              'supplied by the host runtime/CI, or the trusted native fetch bridge. Provider\n'
              'bundles never embed, receive, recover or decrypt a TMDB credential.\n',
              'metadata capability backed by request context/cache or a credential explicitly\n'
              'supplied by the host runtime/CI. A native fetch bridge is transport only and is\n'
              'never mistaken for TMDB authentication. Provider bundles never embed, receive,\n'
              'recover or decrypt a TMDB credential.\n',
              'resolver doc credential contract',
          )
          s = replace_once(
              s,
              'response) degrades to a fail-open transport/semantic fallback so one metadata\n'
              'outage cannot suppress the entire provider catalogue. No public HTML scraping is\n'
              'used as a classification substitute.\n',
              'response) degrades to a fail-open transport/semantic fallback so one metadata\n'
              'outage cannot suppress the entire provider catalogue. A bounded public TMDB page\n'
              'fallback may supply title/year identity when a native host withholds credentials;\n'
              'that fallback is never an authoritative semantic classifier.\n',
              'resolver doc public identity fallback',
          )
          s = replace_once(
              s,
              '"revision": "tmdb-data-contract-launch-gate-v27-anime-semantic-transport",',
              '"revision": "tmdb-data-contract-launch-gate-v28-native-identity-fallback",',
              'resolver revision',
          )
          s = replace_once(
              s,
              'function nativeFetchBridge(){try{return !!(g&&typeof g.__native_fetch==="function")}catch(_){return false}}\n',
              '',
              'remove native bridge auth inference',
          )
          s = replace_once(
              s,
              'async function apiJson(url){\n'
              '  var key=coreCredentialKey,token=coreCredentialToken,nativeBridge=nativeFetchBridge();\n'
              '  if(!g||typeof g.fetch!=="function"||(!key&&!token&&!nativeBridge))return{state:"unavailable",value:null};\n',
              'async function apiJson(url){\n'
              '  var key=coreCredentialKey,token=coreCredentialToken;\n'
              '  if(!g||typeof g.fetch!=="function"||(!key&&!token))return{state:"unavailable",value:null};\n',
              'apiJson credential gate',
          )

          public_helpers = r'''
function decodeHtmlIdentity(v){
  return String(v==null?"":v)
    .replace(/&amp;/gi,"&").replace(/&quot;/gi,'"').replace(/&#39;|&#x27;/gi,"'")
    .replace(/&lt;/gi,"<").replace(/&gt;/gi,">").replace(/&nbsp;/gi," ");
}
function stripHtmlIdentity(v){return decodeHtmlIdentity(String(v==null?"":v).replace(/<[^>]*>/g," ")).replace(/\s+/g," ").trim()}
function publicIdentityFromHtml(html,namespace,id){
  var source=String(html||""),titleTag=/<title[^>]*>([\s\S]*?)<\/title>/i.exec(source),og=null;
  og=/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i.exec(source)
    || /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i.exec(source);
  var rawTitle=stripHtmlIdentity(titleTag&&titleTag[1]||"");
  rawTitle=rawTitle.replace(/\s+[—-]\s+The Movie Database(?:\s*\(TMDB\))?.*$/i,"").trim();
  var display=stripHtmlIdentity(og&&og[1]||"")||rawTitle;
  display=display.replace(/\s+[—-]\s+The Movie Database(?:\s*\(TMDB\))?.*$/i,"").trim();
  var yearMatch=/\((?:TV Series\s+)?((?:19|20)\d{2})[^)]*\)\s*$/i.exec(rawTitle)
    || /\((?:TV Series\s+)?((?:19|20)\d{2})[^)]*\)\s*$/i.exec(display);
  var year=yearMatch?yearMatch[1]:"";
  display=display.replace(/\s*\((?:TV Series\s+)?(?:19|20)\d{2}[^)]*\)\s*$/i,"").trim();
  if(!display)return null;
  var row={id:Number(id)||0,__nuvioTmdbId:String(id||""),__nuvioTmdbNamespace:namespace,__nuvioPublicIdentityOnly:true};
  if(namespace==="movie"){
    row.title=display;row.original_title=display;if(year)row.release_date=year+"-01-01";
  }else{
    row.name=display;row.original_name=display;if(year)row.first_air_date=year+"-01-01";
  }
  return row;
}
async function publicTmdbIdentity(namespaceValue,tmdbId){
  var namespace=namespaceValue==="movie"?"movie":"tv",id=s(tmdbId);
  if(!/^\d+$/.test(id)||!g||typeof g.fetch!=="function")return{state:"unavailable",metadata:null};
  try{
    var url="https://www.themoviedb.org/"+namespace+"/"+encodeURIComponent(id)+"?language=en-US";
    var response=await g.fetch(url,{headers:{Accept:"text/html,application/xhtml+xml;q=0.9,*/*;q=0.1"},redirect:"follow",signal:timeout()});
    if(!response)return{state:"unavailable",metadata:null};
    if(response.status===404)return{state:"not_found",metadata:null};
    if(!response.ok||typeof response.text!=="function")return{state:"unavailable",metadata:null};
    var row=publicIdentityFromHtml(await response.text(),namespace,id);
    return row?{state:"ok",metadata:row}:{state:"unavailable",metadata:null};
  }catch(_){return{state:"unavailable",metadata:null}}
}
'''
