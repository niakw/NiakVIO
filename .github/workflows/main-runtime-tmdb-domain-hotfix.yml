      - name: Verify global transport aliases and Flemmix terminal projection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for rel in ('manifest.json','no-anime/manifest.json','vf/manifest.json','vf-no-anime/manifest.json'):
              data=json.loads(Path(rel).read_text(encoding='utf-8'))
              for row in data.get('scrapers',[]):
                  canonical=[str(x).lower() for x in row.get('canonicalSupportedTypes',row.get('supportedTypes',[]))]
                  supported=[str(x).lower() for x in row.get('supportedTypes',[])]
                  if 'tv' in canonical and 'series' not in supported: raise SystemExit(f'{rel}:{row.get("id")}: missing series transport alias')
                  if 'series' in canonical: raise SystemExit(f'{rel}:{row.get("id")}: series leaked into canonical types')
          cfg=json.loads(Path('provider-overrides.json').read_text(encoding='utf-8'))['provider_patches']['flemmix']
          assert cfg['official_site']=='https://flemmix.kim'
          assert all(v!='flemmix.men' for v in cfg.get('domain_substitutions',{}).values())
          assert cfg['domain_substitutions'].get('flemmix.men')=='flemmix.kim'
          print('GLOBAL_RELEASE_CONTRACT_OK')
          PY

