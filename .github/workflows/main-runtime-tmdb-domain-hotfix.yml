              '- provider-domain-history.json records authoritative terminal changes.\n',
              'domain refresh doc scope',
          )
          s = replace_once(
              s,
              'from pathlib import Path\nfrom typing import Any\n',
              'from pathlib import Path\nfrom typing import Any\nfrom urllib.parse import urlsplit, urlunsplit\n',
              'domain refresh url imports',
          )
          helper = r'''

DOMAIN_DESTINATION_MAP_FIELDS = (
    "domain_substitutions",
    "replacements",
    "runtime_domain_replacements",
)


def _replace_url_hostname(value: str, known_hosts: set[str], new_site_host: str, new_api_host: str) -> str:
    raw = str(value or "")
    if not raw.startswith(("http://", "https://")):
        return raw
    try:
        parsed = urlsplit(raw)
    except ValueError:
        return raw
    host = str(parsed.hostname or "").casefold().strip(".")
    if not host:
        return raw
    matched = host in known_hosts or any(host.endswith("." + old) for old in known_hosts if old)
    if not matched:
        return raw
    api_like = host.startswith("api.")
    target = new_api_host if api_like and new_api_host else new_site_host
    if not target:
        return raw
    port = f":{parsed.port}" if parsed.port else ""
    return urlunsplit((parsed.scheme, target + port, parsed.path, parsed.query, parsed.fragment))


def _synchronize_terminal_references(
    patch: dict[str, Any],
    before_site: str,
    next_site: str,
) -> list[dict[str, str]]:
    """Converge durable terminal destinations on the authoritative hub result.

    Mapping keys remain intact because they are historical aliases that must
    continue to rewrite. Mapping values, current terminal URLs and active-domain
    notes are updated. The official hub itself is never rewritten.
    """
    next_site = str(next_site or "").strip().rstrip("/")
    new_site_host = hubresolver.host(next_site)
    if not next_site or not new_site_host:
        return []

    old_site_host = hubresolver.host(str(before_site or ""))
    known_hosts: set[str] = {old_site_host} if old_site_host else set()
    for field in DOMAIN_DESTINATION_MAP_FIELDS:
        mapping = patch.get(field)
        if isinstance(mapping, dict):
            for value in mapping.values():
                raw = str(value or "").strip()
                host = hubresolver.host(raw) or raw.casefold().strip(".")
                if host:
                    known_hosts.add(host)

    old_api_url = str(patch.get("official_api") or "").strip()
    old_api_host = hubresolver.host(old_api_url)
    if old_api_host:
        known_hosts.add(old_api_host)
    if old_api_host and old_site_host and old_api_host.endswith("." + old_site_host):
        prefix = old_api_host[: -(len(old_site_host) + 1)]
        new_api_host = f"{prefix}.{new_site_host}" if prefix else new_site_host
    elif old_api_host == old_site_host:
        new_api_host = new_site_host
    else:
        new_api_host = old_api_host or new_site_host

    changes: list[dict[str, str]] = []

    def record(path: str, before: Any, after: Any) -> Any:
        if before != after:
            changes.append({"kind": "terminal_domain_projection", "path": path, "from": str(before), "to": str(after)})
        return after

    before_official = str(patch.get("official_site") or "").rstrip("/")
    patch["official_site"] = record("official_site", before_official, next_site)

    # Destination maps: preserve historical alias keys, converge every target.
    for field in DOMAIN_DESTINATION_MAP_FIELDS:
        mapping = patch.get(field)
        if not isinstance(mapping, dict):
            continue
        for alias_key in list(mapping):
            before = str(mapping.get(alias_key) or "").strip()
            target = new_api_host if str(alias_key).casefold().startswith("api.") else new_site_host
            mapping[alias_key] = record(f"{field}.{alias_key}", before, target)

    def rewrite(value: Any, path: str = "") -> Any:
        if isinstance(value, dict):
            out = value
            for key in list(out):
                if key in DOMAIN_DESTINATION_MAP_FIELDS or key == "official_site" or key == "official_hub":
                    continue
                out[key] = rewrite(out[key], f"{path}.{key}" if path else key)
            return out
        if isinstance(value, list):
            for index, child in enumerate(list(value)):
                value[index] = rewrite(child, f"{path}[{index}]")
            return value
        if isinstance(value, str):
            before = value
            after = _replace_url_hostname(before, known_hosts, new_site_host, new_api_host)
            if path.startswith("notes["):
                for stale in sorted(known_hosts, key=len, reverse=True):
                    if stale and stale != new_site_host:
                        after = after.replace(stale, new_site_host)
            return record(path, before, after)
        return value

    rewrite(patch)
    return changes
'''
