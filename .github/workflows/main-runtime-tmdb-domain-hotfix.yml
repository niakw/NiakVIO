'''
          t.write_text(ts, encoding='utf-8')

          # ------------------------------------------------------------------
          # Domain Refresh: official_site is the authority, but all persistent
          # terminal-domain destinations must converge to that terminal. Alias
          # keys remain historical inputs; only their destination values move.
