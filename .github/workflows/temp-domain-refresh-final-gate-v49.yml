name: TEMP - Domain Refresh Final Gate V49

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-domain-refresh-final-gate-v49.yml']

permissions:
  contents: read

env:
  NUVIO_PROVIDER_V3_CONTEXT: publication

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Permanent Domain Refresh gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/reconcile_provider_domain_metadata.py scripts/reconcile_domain_refresh_provenance.py scripts/validate_domain_refresh_non_destructive.py
          python tests/domain_refresh_workflow_test.py
          python tests/domain_refresh_non_destructive_workflow_test.py
          python tests/domain_refresh_transaction_guard_test.py
          python tests/domain_refresh_priority_wrapper_test.py
          python tests/domain_refresh_guard_wrapper_test.py
          python tests/provider_domain_metadata_reconcile_test.py
          python tests/provider_domain_graph_cycle_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/finalize_provider_v3_minimizer.py --check
          echo V49_DOMAIN_REFRESH_FINAL_GATE_OK
