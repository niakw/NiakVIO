name: Native corpus device lab

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Niakvio provider pipeline
    types:
      - completed
    branches:
      - main
  push:
    branches: [main]
    paths:
      - ".github/triggers/native-corpus-device-lab"
      - ".github/workflows/native-corpus-device-lab.yml"
      - "sources.json"

permissions:
  contents: read

concurrency:
  group: native-corpus-device-lab
  cancel-in-progress: true

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      desktop_sha: ${{ steps.resolve.outputs.desktop_sha }}
      mobile_sha: ${{ steps.resolve.outputs.mobile_sha }}
      tv_sha: ${{ steps.resolve.outputs.tv_sha }}
    steps:
      - name: Checkout current Niakvio main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve exact published generation and accepted official clients
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          SHOULD_RUN=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHOULD_RUN=false
            PARENT_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
            MESSAGE="$(git log -1 --format=%s)"
            if [ "$UPSTREAM_CONCLUSION" = "success" ] \
              && [ "$PARENT_SHA" = "$UPSTREAM_HEAD" ] \
              && [ "$MESSAGE" = "chore: publish validated ARCHI2 provider transaction" ]; then
              SHOULD_RUN=true
            fi
          fi
          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('sources.json').read_text(encoding='utf-8'))
          clients = data.get('nuvio_client_compatibility', {}).get('clients', {})
          required = {
              'desktop_sha': 'nuvio-desktop',
              'mobile_sha': 'nuvio-mobile',
              'tv_sha': 'nuvio-tv',
          }
          for output, key in required.items():
              ref = str((clients.get(key) or {}).get('accepted_ref') or '').strip()
              if len(ref) != 40:
                  raise SystemExit(f'missing accepted_ref for {key}')
              print(f'{output}={ref}')
          PY

  desktop-native-corpus:
    needs: publication-gate
    if: needs.publication-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout exact published Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publication-gate.outputs.target_sha }}
          path: niakvio

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install official Desktop player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout accepted official NuvioDesktop and stage all manifest providers once
        shell: bash
        env:
          NUVIO_DESKTOP_SHA: ${{ needs.publication-gate.outputs.desktop_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          touch nuvio-desktop/local.properties
          python3 niakvio/scripts/prepare_native_corpus_validation.py desktop \
            --fixture interstellar \
            --workspace "$GITHUB_WORKSPACE"

      - name: Execute six works across every provider in one official Desktop runtime
        shell: bash
        run: |
          set -u
          FIXTURES=(
            interstellar
            mon-ninja-et-moi-3
            breaking-bad-s01e01
            revenant-s01e01
            jujutsu-kaisen-s01e01
            mushoku-tensei-s01e01
          )
          STATUS=0
          for fixture in "${FIXTURES[@]}"; do
            echo "===== DESKTOP CORPUS FIXTURE: $fixture ====="
            python3 niakvio/scripts/restage_native_corpus_fixture.py desktop \
              --fixture "$fixture" --workspace "$GITHUB_WORKSPACE" || { STATUS=1; continue; }
            LOG="$GITHUB_WORKSPACE/desktop-native-corpus-${fixture}.log"
            rm -f "$LOG"
            RUNTIME_STATUS=0
            ./nuvio-desktop/gradlew -p nuvio-desktop :composeApp:desktopTest \
              --tests 'com.nuvio.app.features.plugins.NiakvioNativeCorpusDesktopTest' \
              --no-daemon --console=plain || RUNTIME_STATUS=$?
            cat "$LOG" || true
            ANALYSIS_STATUS=0
            node niakvio/scripts/analyze_native_corpus_results.cjs "$fixture" "$LOG" || ANALYSIS_STATUS=$?
            echo "FIELD_NATIVE_CORPUS_DESKTOP_STATUS fixture=$fixture runtime=$RUNTIME_STATUS analysis=$ANALYSIS_STATUS"
            if [ "$RUNTIME_STATUS" -ne 0 ] || [ "$ANALYSIS_STATUS" -ne 0 ]; then STATUS=1; fi
          done
          echo "FIELD_NATIVE_CORPUS_DESKTOP_SUITE_STATUS status=$STATUS fixtures=${#FIXTURES[@]} clients=1"
          exit "$STATUS"

      - name: Upload sanitized Desktop native corpus logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-corpus-desktop-${{ github.run_id }}
          path: desktop-native-corpus-*.log
          retention-days: 7
          if-no-files-found: warn

  android-mobile-tv-native-corpus:
    needs: publication-gate
    if: needs.publication-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact published Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publication-gate.outputs.target_sha }}
          path: niakvio

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Checkout accepted official Mobile and TV runtimes and stage all manifest providers once
        shell: bash
        env:
          NUVIO_MOBILE_SHA: ${{ needs.publication-gate.outputs.mobile_sha }}
          NUVIO_TV_SHA: ${{ needs.publication-gate.outputs.tv_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          python3 niakvio/scripts/prepare_native_corpus_validation.py android \
            --fixture interstellar \
            --workspace "$GITHUB_WORKSPACE"
          python3 niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"

      - name: Enable Linux KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm || true
          fi

      - name: Execute six works across every provider in one official Mobile and TV emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_android_suite.sh"

      - name: Upload sanitized Mobile and TV native corpus logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-corpus-android-${{ github.run_id }}
          path: |
            mobile-native-corpus-*.log
            tv-native-corpus-*.log
          retention-days: 7
          if-no-files-found: warn

  native-corpus-engine-summary:
    if: ${{ always() && needs.publication-gate.outputs.run == 'true' }}
    needs:
      - publication-gate
      - desktop-native-corpus
      - android-mobile-tv-native-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact published Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publication-gate.outputs.target_sha }}
          path: niakvio

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download Desktop corpus logs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-corpus-desktop-${{ github.run_id }}
          path: corpus-logs/desktop

      - name: Download Mobile and TV corpus logs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-corpus-android-${{ github.run_id }}
          path: corpus-logs/android

      - name: Build cross-device engine feedback and provider portfolio
        shell: bash
        run: |
          set -euo pipefail
          node niakvio/scripts/summarize_native_corpus_suite.cjs \
            --dir corpus-logs \
            --output native-corpus-summary.json
          node niakvio/scripts/rank_provider_portfolio.cjs \
            --dir corpus-logs \
            --output provider-portfolio.json
          node niakvio/scripts/protect_provider_coverage.cjs \
            --dir corpus-logs \
            --portfolio provider-portfolio.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('native-corpus-summary.json').read_text(encoding='utf-8'))
          portfolio = json.loads(Path('provider-portfolio.json').read_text(encoding='utf-8'))
          print('## Native corpus engine feedback')
          print()
          print(f"- Providers observed: **{data.get('providersObserved', 0)}**")
          print(f"- Executions: **{data.get('executions', 0)}**")
          print(f"- Identity contradictions: **{data.get('contradictions', 0)}**")
          print(f"- Transport failures: **{data.get('transportFailures', 0)}**")
          print(f"- Runtime errors: **{data.get('runtimeErrors', 0)}**")
          signals = data.get('engineSignals') or {}
          print(f"- Repeated platform gaps: **{len(signals.get('repeatedPlatformGaps') or [])}**")
          print(f"- Systemically empty enabled providers: **{len(signals.get('systemicEmpty') or [])}**")
          print()
          print('## Quality + catalogue coverage portfolio')
          print()
          print(f"- Recommended active providers: **{portfolio.get('recommendedActive', 0)}**")
          print(f"- Recommended VF providers: **{portfolio.get('recommendedVf', 0)}**")
          print(f"- Coverage-guard providers: **{len(portfolio.get('protectedCoverageProviders') or [])}**")
          print(f"- Rare providers needing cross-device repair: **{len(portfolio.get('repairPriorityProviders') or [])}**")
          protected = portfolio.get('protectedCoverageProviders') or []
          repair = portfolio.get('repairPriorityProviders') or []
          if protected:
              print(f"- Protected for rare coverage: `{', '.join(protected)}`")
          if repair:
              print(f"- Repair priority: `{', '.join(repair)}`")
          PY

      - name: Upload cross-device engine feedback and provider portfolio
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-corpus-engine-summary-${{ github.run_id }}
          path: |
            native-corpus-summary.json
            provider-portfolio.json
          retention-days: 14
          if-no-files-found: warn
