tionally embedded public client credential already shipped in the provider bundle, not a user secret or server-side credential; logging cannot disclose information that is not already present in the distributed artifact."},{"number":10,"expected_path":"providers/animekai--published-baseline--05f8a46be0e9cc89.js","expected_rule":"js/clear-text-logging","reason":"won't fix","comment":"Third-party/generated provider artifact is disabled or not referenced by the current manifest. It is retained for recovery/provenance and must be re-triaged before any future activation; it is not part of the active provider surface."}]
          JSON

          jq -c '.[]' /tmp/dismissals.json | while read -r row; do
            number="$(jq -r '.number' <<<"$row")"
            expected_path="$(jq -r '.expected_path' <<<"$row")"
            expected_rule="$(jq -r '.expected_rule' <<<"$row")"
            current="$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${number}")"
            state="$(jq -r '.state' <<<"$current")"
            [ "$state" = "open" ] || continue
            path="$(jq -r '.most_recent_instance.location.path' <<<"$current")"
            rule="$(jq -r '.rule.id' <<<"$current")"
            if [ "$path" != "$expected_path" ] || [ "$rule" != "$expected_rule" ]; then
              echo "Refusing stale CodeQL dismissal #$number: expected $expected_path/$expected_rule got $path/$rule" >&2
              exit 1
            fi
            reason="$(jq -r '.reason' <<<"$row")"
            comment="$(jq -r '.comment' <<<"$row")"
            payload="$(jq -cn --arg state dismissed --arg reason "$reason" --arg comment "$comment" '{state:$state,dismissed_reason:$reason,dismissed_comment:$comment}')"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${number}" \
              --input - <<<"$payload" >/dev/null
            echo "dismissed #$number ($reason)"
          done

          remaining="$(gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" --jq '.[] | .number' | wc -l | tr -d ' ')"
          echo "remaining_open=$remaining"
          test "$remaining" = "0"
