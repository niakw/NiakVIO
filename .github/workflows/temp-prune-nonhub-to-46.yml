name: TEMP - Prune non-hub catalogue to 46

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - scripts/prune_to_hub46_catalog.py
      - .github/workflows/temp-prune-nonhub-to-46.yml

permissions:
  contents: write

jobs:
  prune:
    if: ${{ !contains(github.event.head_commit.message, '[hub46-prune]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove non-hub providers from executable catalogue
        run: python scripts/prune_to_hub46_catalog.py

      - name: Verify exact Provider v3 bytes for retained 46
        run: python scripts/audit_provider_v3_static.py

      - name: Verify no non-hub OFF rows remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          matrix=json.loads((root/'automation/evidence/hub-lab-matrix-46.json').read_text())
          want={str(r['manifestId']).strip().lower().replace('_','-') for r in matrix['rows']}
          reg={str(r['registryId']).strip().lower().replace('_','-') for r in matrix['rows']}
          manifest=json.loads((root/'manifest.json').read_text())
          rows=manifest['scrapers']
          got={str(r['id']).strip().lower().replace('_','-') for r in rows}
          assert len(rows)==46 and got==want
          assert all(r.get('enabled') is True for r in rows)
          disp=json.loads((root/'automation/provider-repair-disposition.json').read_text())
          assert disp['catalogueProviderCount']==46
          assert disp['enabledProviderCount']==46
          assert disp['disabledProviderCount']==0
          assert disp['disabledProviders']==[]
          d={str(r['provider']).strip().lower().replace('_','-') for r in disp['providers']}
          assert d==reg and len(d)==46
          catalog=json.loads((root/'provider_catalog.json').read_text())
          c={str(r['canonicalId']).strip().lower().replace('_','-') for r in catalog['providers']}
          assert c==reg and len(c)==46
          print('HUB46_NO_NONHUB_OFF_ROWS_OK manifest=46 catalog=46 disposition=46 disabled=0')
          PY

      - name: Confirm excluded ProviderBase history is still present
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          matrix=json.loads((root/'automation/evidence/hub-lab-matrix-46.json').read_text())
          keep={str(r['registryId']).strip().lower().replace('_','-') for r in matrix['rows']}
          bases={re.sub(r'--base--[0-9a-f]+\.js$','',p.name.lower()) for p in (root/'provider-bases').glob('*--base--*.js')}
          archived=bases-keep
          assert len(archived)>=50, len(archived)
          for slug in archived:
              assert not any((root/'providers').glob(slug+'-*.js')), slug
          print('NONHUB_PROVIDERBASE_HISTORY_ONLY_OK archived_nonhub='+str(len(archived)))
          PY

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m '[hub46-prune] remove non-hub providers from executable catalogue'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
