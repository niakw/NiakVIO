name: TEMP - Fix Proof Invalidation V48

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-fix-proof-invalidation-v48.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}

      - name: Make contradiction invalidation remove the same semantic floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check_provider_non_regression_v1.py')
          s=p.read_text(encoding='utf-8')
          old='''        lost_types = sorted({canon(x) for x in contract.get("lostSemanticTypes") or [] if canon(x)})\n        hls_lost = bool(contract.get("hlsM3u8Lost"))\n'''
          new='''        lost_types_raw = {canon(x) for x in contract.get("lostSemanticTypes") or [] if canon(x)}\n        # An evidence-backed contradiction invalidates the historical lane as proof.\n        # The same invalidated lane therefore cannot survive indirectly as a semantic\n        # capability floor; unrelated semantic/HLS losses remain hard failures.\n        lost_types = sorted(lost_types_raw - invalidated_lanes)\n        hls_lost = bool(contract.get("hlsM3u8Lost"))\n'''
          if old not in s: raise SystemExit('candidate lost-types anchor missing')
          s=s.replace(old,new,1)
          old2='''            "lostSemanticTypes": lost_types,\n            "hlsM3u8Lost": hls_lost,\n'''
          new2='''            "lostSemanticTypesRaw": sorted(lost_types_raw),\n            "lostSemanticTypes": lost_types,\n            "hlsM3u8Lost": hls_lost,\n'''
          if old2 not in s: raise SystemExit('obligation lost-types anchor missing')
          s=s.replace(old2,new2,1)
          old3='''        "proofInvalidationPolicy": "only active, evidence-backed contradiction records may remove invalidated historical/rolling lanes from the candidate floor; all other floors remain unchanged",\n'''
          new3='''        "proofInvalidationPolicy": "only active, evidence-backed contradiction records may remove the same invalidated historical/rolling lanes and semantic floor from the candidate obligation; all unrelated floors remain unchanged",\n'''
          if old3 not in s: raise SystemExit('policy anchor missing')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Extend proof invalidation contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/provider_proof_invalidation_contract_test.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    print("PROVIDER_PROOF_INVALIDATION_CONTRACT_OK allwish_lanes=movie,tv provider_positive=invalidated malformed=fail_closed")\n'''
          insert='''    # A contradiction that invalidates movie/tv proof must also remove those exact\n    # lanes from the semantic floor. Otherwise the gate would reject the same\n    # invalidation it has just accepted. Unrelated losses must still fail closed.\n    module.changed_scope = lambda matrix, base_ref, force_all: (["allwish"], [], False)\n    module.git_json = lambda ref, path: {}\n    module.current_activation_debt = lambda: {}\n    matrix = {"providers": [{\n        "provider": "allwish",\n        "snapshotStates": {"5.21.36": {"icon": module.GREEN}},\n        "historicalVerifiedLanes": ["movie", "tv"],\n        "contractDrift": {\n            "currentSemanticTypes": ["anime"],\n            "lostSemanticTypes": ["movie", "tv"],\n            "hlsM3u8Lost": False,\n        },\n        "nonRegressionStatus": "CONTRACT_REGRESSION",\n    }]}\n    candidate = {"rows": [{"provider": "allwish", "semantic_type": "anime", "status": "no_streams"}]}\n    module.load_proof_invalidations = lambda: {"allwish": row}\n    result = module.candidate_gate(matrix, candidate, "HEAD^", True)\n    obligation = result["obligations"]["allwish"]\n    assert result["passed"] is True, result\n    assert obligation["lostSemanticTypesRaw"] == ["movie", "tv"], obligation\n    assert obligation["lostSemanticTypes"] == [], obligation\n\n    module.load_proof_invalidations = lambda: {}\n    result = module.candidate_gate(matrix, candidate, "HEAD^", True)\n    assert result["passed"] is False, result\n    assert result["obligations"]["allwish"]["lostSemanticTypes"] == ["movie", "tv"], result\n    assert "semantic_capability_regression" in result["obligations"]["allwish"]["failures"], result\n\n    print("PROVIDER_PROOF_INVALIDATION_CONTRACT_OK allwish_lanes=movie,tv semantic_floor=same-lanes-invalidated unrelated=fail_closed malformed=fail_closed")\n'''
          if anchor not in s: raise SystemExit('test anchor missing')
          p.write_text(s.replace(anchor,insert,1),encoding='utf-8')
          PY

      - name: Validate non-regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/provider_proof_invalidation_contract_test.py
          python3 scripts/check_provider_non_regression_v1.py --matrix automation/provider-history-matrix.json --output /tmp/ledger.json
          python3 -m py_compile scripts/check_provider_non_regression_v1.py tests/provider_proof_invalidation_contract_test.py
          git diff --check

      - name: Persist proof-invalidation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check_provider_non_regression_v1.py tests/provider_proof_invalidation_contract_test.py
          git commit -m 'fix(ci): honor proof invalidation semantic floor' || true
          git fetch origin fix/non-display-recovery-20260916
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "V48_PERSISTED sha=$(git rev-parse HEAD)"
