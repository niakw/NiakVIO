name: Temporary cache version bump

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/tmp-cache-version-bump"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Bump release and provider cache versions
        env:
          NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: "1"
        run: |
          python3 scripts/sync_release_versions.py --version 5.20.52
          python3 - <<'PY'
          import json
          from pathlib import Path

          targets = {
              'moviebox': '1.0.14',
              'netmirror': '1.0.14',
              'streamzo': '1.0.39',
          }
          for relative in ('manifest.json', 'vf/manifest.json'):
              path = Path(relative)
              data = json.loads(path.read_text(encoding='utf-8'))
              changed = []
              for row in data.get('scrapers', []):
                  pid = str(row.get('id', '')).strip().casefold()
                  if pid in targets:
                      row['version'] = targets[pid]
                      changed.append(pid)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(relative, 'bumped:', ','.join(changed) or '-')
          PY
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/validate_language_projection.py
          python3 tests/release_version_sync_test.py
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/tmp-cache-version-bump.yml
          rm -f .github/triggers/tmp-cache-version-bump
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
      - name: Commit exact version bump
        run: |
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bump provider versions to invalidate Nuvio cache'
          git push origin HEAD:main
