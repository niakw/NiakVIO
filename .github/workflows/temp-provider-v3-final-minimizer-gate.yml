name: TEMP - Provider v3 final-stage minimizer gate

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - scripts/upgrade_provider_v3_final_stage_minimizer_v1.py
      - tests/provider_v3_final_stage_minimizer_gate_test.py
      - .github/workflows/temp-provider-v3-final-minimizer-gate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final-stage-only minimizer gate
        run: |
          set -euo pipefail
          python3 scripts/upgrade_provider_v3_final_stage_minimizer_v1.py
          python3 -m py_compile scripts/materialize_provider_v3_all.py scripts/materialize_provider_v3_one.py scripts/upgrade_provider_v3_final_stage_minimizer_v1.py tests/provider_v3_final_stage_minimizer_gate_test.py
          python3 tests/provider_v3_final_stage_minimizer_gate_test.py
      - name: Guard Core/Lego ownership
        run: |
          set -euo pipefail
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize_provider_v3_all.py scripts/materialize_provider_v3_one.py scripts/upgrade_provider_v3_final_stage_minimizer_v1.py tests/provider_v3_final_stage_minimizer_gate_test.py
          if git diff --cached --quiet; then
            echo 'No minimizer gate changes to commit'
            exit 0
          fi
          git commit -m 'fix(provider-v3): defer minimizer to explicit final stage'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
