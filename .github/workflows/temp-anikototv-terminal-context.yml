name: Temp AniKoto terminal context

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-anikototv-terminal-context.yml
      - scripts/upgrade_anikototv_megaplay_aes_v3.py

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted-anikoto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize current AniKoto candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_anikototv_megaplay_runtime_v2.py
          python3 scripts/upgrade_anikototv_megaplay_aes_v3.py
          python3 scripts/materialize_provider_v3_one.py anikototv
          python3 -m py_compile scripts/provider_patches/anikototv_runtime_v2.py scripts/upgrade_anikototv_megaplay_aes_v3.py

      - name: Inspect MegaPlay payload shape without media URLs
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36';
          const embed='https://megaplay.buzz/stream/s-2/1464/sub';
          const page=await fetch(embed,{headers:{'User-Agent':ua,'Accept':'text/html,application/json,text/plain,*/*','Referer':'https://megaplay.buzz/'}});
          const html=await page.text();
          const ids=[...html.matchAll(/\bdata-id=["'](\d+)["']/ig)].map(m=>m[1]);
          const fid=ids[0]||((html.match(/<title[^>]*>\s*File\s+(\d+)\s*-\s*MegaPlay/i)||[])[1]);
          if(!fid) throw new Error('no source id');
          const r=await fetch('https://megaplay.buzz/stream/getSources?id='+encodeURIComponent(fid),{headers:{'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':embed,'Origin':'https://megaplay.buzz','X-Requested-With':'XMLHttpRequest'}});
          const data=await r.json();
          const urls=[];
          function walk(v,path='root'){
            if(typeof v==='string' && /^https?:\/\//i.test(v)){
              try{const u=new URL(v); urls.push({path,host:u.hostname,pathname:u.pathname.replace(/[A-Fa-f0-9]{16,}/g,'{token}')});}catch{}
              return;
            }
            if(Array.isArray(v)){v.slice(0,40).forEach((x,i)=>walk(x,path+'['+i+']'));return;}
            if(v&&typeof v==='object'){Object.entries(v).slice(0,80).forEach(([k,x])=>walk(x,path+'.'+k));}
          }
          walk(data);
          console.log('ANIKOTO_PAYLOAD_SHAPE '+JSON.stringify({status:r.status,sourceId:fid,dataIds:ids.slice(0,8),keys:Object.keys(data||{}),hasEnc:typeof data?.enc==='string',encLength:typeof data?.enc==='string'?data.enc.length:0,urlFields:urls}));
          JS

      - name: Trace exact Death Note terminal request only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str((root/'scripts').resolve()))
          import run_provider_upstream_parity as p
          fixture={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          context=p.context_for(fixture)
          context['routeProofTrace']=True
          path=p.local_catalog()['anikototv']['path']
          cp=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(context,separators=(',',':'))],cwd=root,capture_output=True,text=True,timeout=65,check=False)
          result=None
          for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                  result=json.loads(line.split('=',1)[1])
          if not isinstance(result,dict):
              print(cp.stdout); print(cp.stderr); raise SystemExit('worker_no_result')
          observations=result.get('network_observations') or []
          useful=[]
          for row in observations:
              host=str(row.get('host') or '').lower()
              if host == 'megaplay.buzz' or (host and host not in {'anikototv.to','api.themoviedb.org'} and not row.get('infrastructure')):
                  useful.append(row)
          print('ANIKOTO_V5_TRACE_SUMMARY '+json.dumps({'raw':result.get('raw_stream_count'),'streams':result.get('stream_count'),'statuses':result.get('provider_server_http_statuses'),'hosts':result.get('provider_server_hosts')},ensure_ascii=False,separators=(',',':')))
          print('ANIKOTO_V5_TRACE '+json.dumps(useful,ensure_ascii=False,separators=(',',':')))
          assert any(str(row.get('host') or '').lower()=='megaplay.buzz' and '/stream/getSources' in str(row.get('proof_url') or '') for row in useful), useful
          PY
