name: Temp AniKoto terminal context

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-anikototv-terminal-context.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted-anikoto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize current AniKoto candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_anikototv_megaplay_runtime_v2.py
          python3 scripts/upgrade_anikototv_megaplay_aes_v3.py
          python3 scripts/materialize_provider_v3_one.py anikototv
          python3 -m py_compile scripts/provider_patches/anikototv_runtime_v2.py scripts/upgrade_anikototv_megaplay_aes_v3.py

      - name: Trace exact Death Note terminal request only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str((root/'scripts').resolve()))
          import run_provider_upstream_parity as p
          fixture={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          context=p.context_for(fixture)
          context['routeProofTrace']=True
          path=p.local_catalog()['anikototv']['path']
          print('ANIKOTO_MATERIALIZED_PATH',path)
          cp=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(context,separators=(',',':'))],cwd=root,capture_output=True,text=True,timeout=65,check=False)
          print('ANIKOTO_WORKER_RC',cp.returncode)
          result=None
          for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                  result=json.loads(line.split('=',1)[1])
          if not isinstance(result,dict):
              print(cp.stdout)
              print(cp.stderr)
              raise SystemExit('worker_no_result')
          observations=result.get('network_observations') or []
          useful=[]
          for row in observations:
              host=str(row.get('host') or '').lower()
              if host in {'megaplay.buzz','fetch.nexabloom.top','cdn.imgnex.top','ncdn.imgnex.top'} or 'nexa' in host or 'imgnex' in host:
                  useful.append(row)
          print('ANIKOTO_TRACE_SUMMARY '+json.dumps({'raw':result.get('raw_stream_count'),'streams':result.get('stream_count'),'statuses':result.get('provider_server_http_statuses'),'hosts':result.get('provider_server_hosts')},ensure_ascii=False,separators=(',',':')))
          print('ANIKOTO_TERMINAL_TRACE '+json.dumps(useful,ensure_ascii=False,separators=(',',':')))
          if cp.stderr.strip(): print('ANIKOTO_WORKER_STDERR '+cp.stderr.strip())
          assert any(str(row.get('host') or '').lower()=='fetch.nexabloom.top' for row in useful), useful
          PY
