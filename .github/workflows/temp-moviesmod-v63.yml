name: TEMP - MoviesMod Terminal Diagnosis V63B

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-moviesmod-v63.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Reproduce MoviesMod movie terminal and inspect player with curl
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=36
          tasks,_=q.build_tasks()
          task=next(t for t in tasks if str(t.get('provider_id') or '').casefold()=='moviesmod' and str(t.get('semantic_type') or '').casefold()=='movie')
          result=q.run(task)
          fetches=result.get('debug_fetches') or []
          print('V63B_RESULT',json.dumps({k:result.get(k) for k in ['status','debug_stage','raw','playable','verified','duration_ms']},sort_keys=True))
          print('V63B_FETCHES',json.dumps(fetches,default=str))
          target=''; referer=''
          for row in fetches:
              url=str(row.get('url') or '')
              if 'modpro.blog/' in url and int(row.get('status') or 0)==200:
                  referer=str(row.get('response_url') or url)
              if 'pubonrace' in url:
                  target=url
                  break
          if not target:
              raise SystemExit('V63B_NO_TERMINAL_PLAYER')
          print('V63B_TARGET',target)
          print('V63B_REFERER',referer)
          with tempfile.TemporaryDirectory() as td:
              body=Path(td)/'body'; headers=Path(td)/'headers'
              cmd=['curl','-k','--http1.1','-sS','-L','--max-time','20','-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','-H','Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','-H','Accept-Language: en-US,en;q=0.9','-D',str(headers),'-o',str(body),'-w','%{http_code}\n%{url_effective}\n%{content_type}\n']
              if referer: cmd += ['-e',referer]
              cmd += [target]
              cp=subprocess.run(cmd,text=True,capture_output=True)
              print('V63B_CURL_RC',cp.returncode)
              print('V63B_CURL_META',cp.stdout.replace('\n',' | '))
              print('V63B_CURL_ERR',cp.stderr[:1000])
              data=body.read_bytes() if body.exists() else b''
              text=data.decode('utf-8','replace')
              print('V63B_BODY_LEN',len(data))
              print('V63B_HEADERS',headers.read_text(errors='replace')[-6000:] if headers.exists() else '')
              vals=[]
              pats=[r'''https?://[^"'<>\\\s]+''',r'''["']([^"']+\.(?:m3u8|mp4)(?:\?[^"']*)?)["']''',r'''(?:src|file|url)\s*[:=]\s*["']([^"']+)["']''']
              for pat in pats:
                  for m in re.findall(pat,text,re.I):
                      v=m if isinstance(m,str) else m[0]
                      v=v.replace('\\/','/')
                      if v not in vals: vals.append(v)
              print('V63B_PATTERNS',json.dumps(vals[:120]))
              low=text.lower()
              for needle in ('m3u8','mp4','atob','base64','eval(','source','player','iframe','cloudflare','just a moment'):
                  p=low.find(needle)
                  if p>=0:
                      print('V63B_SNIP',needle,text[max(0,p-500):p+1800].replace('\n',' ')[:2600])
          PY
