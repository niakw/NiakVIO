name: Temporary strict Quick Deep Learning sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-priority-qdl-final-once.yml'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: tmp-priority-qdl-final-once
  cancel-in-progress: false

jobs:
  sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot and reseal exact main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-priority-qdl-final-once.yml
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add -A FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json .github/workflows/tmp-priority-qdl-final-once.yml
          git commit -m 'chore: reseal before strict priority validation [skip ci]'
          git fetch origin main
          git rebase origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Quick only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run sync.yml --ref main -f mode=quick
          sleep 6
          RUN_ID=$(gh run list --workflow sync.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\")] | sort_by(.createdAt) | last | .databaseId")
          test -n "$RUN_ID" && test "$RUN_ID" != null
          gh issue comment 69 --body "PRIORITY_QUICK_RUN id=$RUN_ID clean=$CLEAN_SHA"
          gh run watch "$RUN_ID" --exit-status
          gh issue comment 69 --body "PRIORITY_QUICK_SUCCESS id=$RUN_ID"

      - name: Deep only after Quick green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run sync.yml --ref main -f mode=deep
          sleep 6
          RUN_ID=$(gh run list --workflow sync.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\")] | sort_by(.createdAt) | last | .databaseId")
          test -n "$RUN_ID" && test "$RUN_ID" != null
          gh issue comment 69 --body "PRIORITY_DEEP_RUN id=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          gh issue comment 69 --body "PRIORITY_DEEP_SUCCESS id=$RUN_ID"

      - name: Brain learning only after Deep green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run brain-learning-lab.yml --ref main
          sleep 6
          RUN_ID=$(gh run list --workflow brain-learning-lab.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\")] | sort_by(.createdAt) | last | .databaseId")
          test -n "$RUN_ID" && test "$RUN_ID" != null
          gh issue comment 69 --body "PRIORITY_LEARNING_RUN id=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          gh issue comment 69 --body "PRIORITY_LEARNING_SUCCESS id=$RUN_ID"
