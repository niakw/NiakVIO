name: TEMP - Targeted Provider Acceptance

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/targeted-provider-acceptance.json'

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        provider: [netmirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run canonical targeted repair acceptance
        run: |
          set -euo pipefail
          python scripts/run_provider_repair_pipeline_v6.py \
            --mode repair --provider "${{ matrix.provider }}" --attempts 3
      - name: Upload targeted proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: targeted-provider-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-route-recovery-v6.json
            automation/provider-repair-yield-v6.json
            automation/provider-repair-v6-summary.json
            manifest.json
            provider-v3-materialization.json
          retention-days: 7
          if-no-files-found: warn
