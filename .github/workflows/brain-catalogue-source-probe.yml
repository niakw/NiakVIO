name: BRAIN - Catalogue Source Contract Probe

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Exact official Android TV parent run; empty means latest exact-current eligible parent
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-catalogue-source-probe.yml'
      - '.github/triggers/brain-catalogue-source-probe.json'
      - 'scripts/brain_oracles/catalogue_inline_episode_source.py'
      - 'scripts/brain_oracles/probe_catalogue_inline_live.py'
      - 'scripts/persist_brain_catalogue_source_probe.py'
      - 'tests/brain_oracles/catalogue_inline_live_test.py'
      - 'tests/brain_catalogue_source_probe_persistence_test.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: niakvio-catalogue-source-shape-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-source-shape:
    name: Independent source shape (not official Android TV)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate exact workflow SHA and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/brain_oracles/catalogue_inline_episode_source.py scripts/brain_oracles/probe_catalogue_inline_live.py scripts/build_brain_catalogue_source_probe_request.py scripts/persist_brain_catalogue_source_probe.py
      - name: Prove source-shape and mutation-denial contracts offline
        run: |
          python tests/brain_oracles/catalogue_inline_live_test.py
          python tests/brain_catalogue_source_probe_request_test.py
          python tests/brain_catalogue_source_probe_persistence_test.py
      - name: Build exact current source-probe request
        id: request
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ inputs.native_run_id || '' }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/catalogue-source-request.json"
          python scripts/build_brain_catalogue_source_probe_request.py \
            --template .github/triggers/brain-catalogue-source-probe.json \
            --native-ledger automation/brain-android-tv-emulator-history.json \
            --native-run-id "$NATIVE_RUN_ID" \
            --output "$request"
          if [ -s "$request" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe only curated catalogue paths, without media or raw HTML persistence
        if: ${{ steps.request.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/brain_oracles/probe_catalogue_inline_live.py \
            --request "$RUNNER_TEMP/catalogue-source-request.json" \
            --source-root . \
            --output "$RUNNER_TEMP/catalogue-source-shape.json"
          python - "$RUNNER_TEMP/catalogue-source-shape.json" <<'PY'
          import json, sys
          result=json.load(open(sys.argv[1]))
          assert result["independentNetworkNotOfficialClient"] is True
          assert result["publicationAuthority"] is False
          assert result["providerMutationAuthority"] is False
          assert result["sourceContractVerifiedOnOfficialTv"] is False
          assert result["probeRequestCount"] <= 18
          assert 0 <= result["tokenResolverJsonUrlCount"] <= result["tokenResolverProbeCount"] <= 3
          assert 0 <= result["resolvedTargetDirectMediaCount"] <= result["resolvedTargetProbeCount"] <= 3
          assert 0 <= result["resolvedTargetPlayerPageCount"] <= result["resolvedTargetProbeCount"] <= 3
          assert len(result["observations"]) == result["probeRequestCount"]
          print("FIELD_BRAIN_SOURCE_CONTRACT_GATE independent_only=true playback=false publication=false")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: catalogue-source-shape-${{ github.run_id }}
          path: ${{ runner.temp }}/catalogue-source-shape.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Persist sanitized exact-parent source evidence on main
        if: ${{ steps.request.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/persist_brain_catalogue_source_probe.py \
            --result "$RUNNER_TEMP/catalogue-source-shape.json" \
            --history automation/brain-catalogue-source-probe-history.json \
            --probe-run-id "$GITHUB_RUN_ID" \
            --probe-source-sha "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/brain-catalogue-source-probe-history.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(brain): retain exact-parent catalogue source diagnostic"
            git fetch --quiet origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Dispatch FORCE only for an observed inline source family
        if: ${{ steps.request.outputs.ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r provider inline resolver <<< "$(python - "$RUNNER_TEMP/catalogue-source-shape.json" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1],encoding="utf-8"))
          print(
              str(row.get("providerId") or ""),
              int(row.get("inlineTokenResponseCount") or 0),
              int(row.get("tokenResolverJsonUrlCount") or 0),
          )
          PY
          )"
          if [ "$inline" -le 0 ]; then
            echo "FIELD_BRAIN_SOURCE_FORCE_DISPATCH status=skipped_no_inline provider=$provider"
            exit 0
          fi
          [[ "$provider" =~ ^[a-z0-9][a-z0-9-]{0,95}$ ]]
          parser_installed="$(python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          from brain_source_family_state import source_family_parser_installed
          print("true" if source_family_parser_installed(Path(".")) else "false")
          PY
          )"
          if [ "$parser_installed" = "true" ]; then
            gh workflow run brain-learning-lab.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f publish_proposal=false -f architecture_force=false \
              -f slot_remaining_minutes=120 -f slot_phase=1 \
              -f target_provider="$provider"
            echo "FIELD_BRAIN_SOURCE_FORCE_DISPATCH status=parser_installed_learning_replay provider=$provider inline=$inline resolver=$resolver publication=false"
          else
            gh workflow run brain-learning-lab.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f publish_proposal=false -f architecture_force=true \
              -f slot_remaining_minutes=360 -f slot_phase=1 \
              -f target_provider="$provider"
            echo "FIELD_BRAIN_SOURCE_FORCE_DISPATCH status=dispatched_v1 provider=$provider inline=$inline resolver=$resolver publication=false"
          fi
