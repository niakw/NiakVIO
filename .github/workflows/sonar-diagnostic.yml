name: Temporary Sonar vulnerability diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/sonar-diagnostic.yml'

permissions:
  contents: read

jobs:
  sonar-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
    steps:
      - name: Read Sonar vulnerability metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SONAR_KEY:-}" || { echo 'SONAR_KEY is unavailable'; exit 1; }
          URL='https://sonarcloud.io/api/issues/search'
          if ! curl --fail --silent --show-error \
            --user "${SONAR_KEY}:" \
            --get "$URL" \
            --data-urlencode 'componentKeys=niakw_NiakVIO' \
            --data-urlencode 'pullRequest=76' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'types=VULNERABILITY' \
            --data-urlencode 'ps=500' \
            --output /tmp/issues.json; then
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${SONAR_KEY}" \
              --get "$URL" \
              --data-urlencode 'componentKeys=niakw_NiakVIO' \
              --data-urlencode 'pullRequest=76' \
              --data-urlencode 'resolved=false' \
              --data-urlencode 'types=VULNERABILITY' \
              --data-urlencode 'ps=500' \
              --output /tmp/issues.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/issues.json').read_text(encoding='utf-8'))
          issues=data.get('issues') or []
          print(f'SONAR_VULNERABILITIES count={len(issues)} total={data.get("total")}')
          for issue in issues:
              component=str(issue.get('component') or '')
              path=component.split(':',1)[-1] if ':' in component else component
              print(json.dumps({
                  'key': issue.get('key'),
                  'rule': issue.get('rule'),
                  'severity': issue.get('severity'),
                  'type': issue.get('type'),
                  'path': path,
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'status': issue.get('status'),
              }, ensure_ascii=True, sort_keys=True))
          PY
