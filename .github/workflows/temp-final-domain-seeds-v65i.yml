name: TEMP - Final Address Authorities V65I

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths: [.github/workflows/temp-final-domain-seeds-v65i.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}

      - name: Apply durable V65 source transforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,subprocess,sys,textwrap
          from pathlib import Path
          src=Path('.github/workflows/temp-final-domain-seeds-v65g.yml').read_text(encoding='utf-8')
          section=src.split('      - name: Apply V65F source transform and make no-op domain sync byte-stable',1)[1].split('      - name: Install exact current address entries',1)[0]
          m=re.search(r"python - <<'PY'\n([\s\S]*?)\n\s{10}PY\n",section)
          if not m: raise SystemExit('V65I_TRANSFORM_EXTRACTION_FAILED')
          subprocess.run([sys.executable,'-c',textwrap.dedent(m.group(1))],check=True)
          section=src.split('      - name: Install exact current address entries',1)[1].split('      - name: Execute and reconcile four-provider transaction',1)[0]
          m=re.search(r"python - <<'PY'\n([\s\S]*?)\n\s{10}PY\n",section)
          if not m: raise SystemExit('V65I_INSTALL_EXTRACTION_FAILED')
          subprocess.run([sys.executable,'-c',textwrap.dedent(m.group(1))],check=True)
          print('V65I_SOURCE_AND_ADDRESS_INSTALL_OK')
          PY
          python tests/domain_refresh_transaction_guard_test.py
          python tests/domain_refresh_static_authority_test.py
          python tests/provider_hub_registry_test.py

      - name: Execute authority transaction and fixed-point guards
        shell: bash
        run: |
          set -euo pipefail
          cp provider-overrides.json "$RUNNER_TEMP/overrides.before.json"
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp provider-v3-materialization.json "$RUNNER_TEMP/material.before.json"
          cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static.before.json"
          cp PROVENANCE.json "$RUNNER_TEMP/provenance.before.json"
          mkdir -p health-output automation/evidence
          python scripts/domain_refresh_transaction_v2.py --provider desiflix --provider uhdmovies --provider animesalt --provider allwish --include-disabled --mode quick --timeout 18 --workers 4 --apply --output health-output/v65i-report.json --changes-output health-output/v65i-changes.json
          python - <<'PY'
          import json
          r=json.load(open('health-output/v65i-report.json')); c=json.load(open('health-output/v65i-changes.json'))
          expected={'desiflix':'https://desiflix.codes','uhdmovies':'https://uhdmovies.my','animesalt':'https://animesalt.cx','allwish':'https://all-wish.me'}
          for pid,url in expected.items():
              row=r['providers'].get(pid)
              assert row and row.get('status')=='site_authoritative',(pid,row)
              assert str(row.get('official_site') or '').rstrip('/')==url,(pid,row)
          assert set(c.get('changed') or [])=={'desiflix','uhdmovies'},c
          print('V65I_AUTHORITY_OK',json.dumps(c,sort_keys=True))
          PY
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v65i-changes.json --check
          python scripts/reconcile_provider_domain_metadata.py --rebuild --provider desiflix --provider uhdmovies
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v65i-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/audit_provider_v3_static.py
          python scripts/validate_domain_refresh_non_destructive.py --before-overrides "$RUNNER_TEMP/overrides.before.json" --before-manifest "$RUNNER_TEMP/manifest.before.json" --before-materialization "$RUNNER_TEMP/material.before.json" --before-provenance "$RUNNER_TEMP/provenance.before.json" --changes health-output/v65i-changes.json
          python scripts/validate_domain_refresh_static_non_destructive.py --before-static "$RUNNER_TEMP/static.before.json" --changes health-output/v65i-changes.json

      - name: Probe routing without flaky availability assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve())); import audit_provider_quick_yield as q
          q.TIMEOUT=60; wanted={'desiflix','uhdmovies','animesalt','allwish'}; tasks,_=q.build_tasks(); rows=[]
          for t in tasks:
              if str(t.get('provider_id') or '').casefold() not in wanted: continue
              x=q.run(t); rows.append(x)
              print('V65I_RUNTIME',json.dumps({k:x.get(k) for k in ['provider_id','semantic_type','status','debug_stage','raw','playable','verified','contradictions','duration_ms','debug_fetches']},default=str,sort_keys=True))
          by={p:[] for p in wanted}
          for x in rows: by[str(x.get('provider_id') or '').casefold()].append(x)
          for pid in wanted: assert by[pid],f'missing task {pid}'
          site_hosts={'uhdmovies':'uhdmovies.my','animesalt':'animesalt.cx','allwish':'all-wish.me'}
          for pid,host in site_hosts.items():
              urls=[str(f.get('url') or '') for x in by[pid] for f in (x.get('debug_fetches') or [])]
              assert any(host in u for u in urls),(pid,urls[:24])
          desi=by['desiflix']; desi_urls=[str(f.get('url') or '') for x in desi for f in (x.get('debug_fetches') or [])]
          assert all(int(x.get('contradictions') or 0)==0 for x in desi),desi
          assert any('desiflix.stremioaddon.workers.dev' in u or 'manifest.desitvhub.eu.org' in u for u in desi_urls),desi_urls[:24]
          assert not any('desiflix.onl' in u for u in desi_urls),desi_urls[:24]
          Path('automation/evidence/final-address-authorities-v65.json').write_text(json.dumps({'schema_version':9,'rows':rows},ensure_ascii=False,indent=2,default=str)+'\n')
          for pid in sorted(wanted): print('V65I_PROVIDER_SUMMARY',pid,[(x.get('semantic_type'),x.get('status'),x.get('verified'),x.get('debug_stage')) for x in by[pid]])
          print('V65I_RUNTIME_ROUTING_OK')
          PY

      - name: Persist V65I
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_provenance.py scripts/validate_domain_refresh_non_destructive.py scripts/resolve_provider_hubs.py scripts/refresh_authoritative_hub_domains.py provider-hubs.json provider-overrides.json provider-domain-history.json manifest.json provider-v3-materialization.json automation/provider-v3-static-knowledge.json PROVENANCE.json automation/evidence/final-address-authorities-v65.json providers provider-disabled
          if git diff --cached --quiet; then echo V65I_PERSIST_NOOP; exit 0; fi
          git commit -m 'fix(domains): separate curated entries from terminals'
          git push origin HEAD:fix/non-display-recovery-20260916
