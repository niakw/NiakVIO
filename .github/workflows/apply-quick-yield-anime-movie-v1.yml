name: Apply Quick Yield Anime Movie V1

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/apply-quick-yield-anime-movie-v1.yml'
      - 'scripts/migrate_quick_yield_anime_movie_fixture_v1.py'
      - 'tests/provider_quick_yield_fixture_selection_test.py'

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workbench/systemic-recovery-20260909
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic fixture-selection migration
        run: |
          set -euo pipefail
          python scripts/migrate_quick_yield_anime_movie_fixture_v1.py
          python -m py_compile \
            scripts/audit_provider_quick_yield.py \
            scripts/run_provider_repair_pipeline_v6.py \
            tests/provider_quick_yield_fixture_selection_test.py \
            tests/provider_repair_pipeline_v6_contract_test.py
      - name: Validate fixture selection and ownership
        run: |
          set -euo pipefail
          python tests/provider_quick_yield_fixture_selection_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
      - name: Commit permanent quick-yield owners
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/audit_provider_quick_yield.py \
            scripts/run_provider_repair_pipeline_v6.py \
            tests/provider_repair_pipeline_v6_contract_test.py
          if git diff --cached --quiet; then
            echo 'QUICK_YIELD_ANIME_MOVIE_COMMIT changed=false'
            exit 0
          fi
          git commit -m 'fix(repair): use anime-film fixture for anime movie lanes'
          git push origin HEAD:workbench/systemic-recovery-20260909
