name: TEMP Positive Output 96 Audit

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-positive-output-96-audit.yml"]

permissions:
  contents: write

concurrency:
  group: temp-positive-output-96-${{ github.ref }}
  cancel-in-progress: true

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 1, count: 12 }
          - { start: 13, count: 12 }
          - { start: 25, count: 12 }
          - { start: 37, count: 12 }
          - { start: 49, count: 12 }
          - { start: 61, count: 12 }
          - { start: 73, count: 12 }
          - { start: 85, count: 12 }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout .44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', package-manager-cache: false }
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply and test positive-output V4
        run: |
          set -euo pipefail
          python3 scripts/upgrade_provider_v3_positive_output_qualification_v4.py
          python3 tests/provider_v3_positive_output_qualification_v4_test.py
          python3 -m py_compile scripts/reconstruct_provider_v3_sequential_live.py
      - name: Sweep current Provider v3 slice
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/reconstruct_provider_v3_batch_diagnostic.py \
            --start-index ${{ matrix.start }} \
            --count ${{ matrix.count }} \
            --timeout 45 \
            --origin-timeout 8 \
            --repair-attempts 1 \
            --report positive-v4-${{ matrix.start }}.json || rc=$?
          echo "FIELD_POSITIVE_V4_SLICE start=${{ matrix.start }} rc=$rc report=$(test -s positive-v4-${{ matrix.start }}.json && echo yes || echo no)"
          test -s positive-v4-${{ matrix.start }}.json
      - name: Upload slice evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: positive-v4-${{ matrix.start }}
          path: positive-v4-${{ matrix.start }}.json
          retention-days: 5

  aggregate:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout .44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/download-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce
        with:
          pattern: positive-v4-*
          path: audit-artifacts
          merge-multiple: true
      - name: Aggregate strict positive evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          def cid(v): return str(v or '').strip().lower().replace('_','-')
          manifest=json.load(open('manifest.json',encoding='utf-8'))
          rows=[r for r in manifest.get('scrapers',[]) if isinstance(r,dict)]
          by={cid(r.get('id')):r for r in rows}
          active={pid for pid,row in by.items() if row.get('enabled') is not False}
          overrides=json.load(open('provider-overrides.json',encoding='utf-8')).get('provider_patches',{})
          results={}
          for path in glob.glob('audit-artifacts/**/*.json',recursive=True):
              try: d=json.load(open(path,encoding='utf-8'))
              except Exception: continue
              for r in d.get('providers',[]) if isinstance(d,dict) else []:
                  if isinstance(r,dict) and cid(r.get('providerId')):
                      results[cid(r.get('providerId'))]=r
          missing=sorted(set(by)-set(results))
          if missing:
              raise SystemExit('missing provider reports: '+','.join(missing))
          def types(pid):
              vals=by[pid].get('canonicalSupportedTypes') or by[pid].get('supportedTypes') or []
              return sorted({('tv' if str(x).lower() in {'series','serie'} else str(x).lower()) for x in vals if str(x).lower() in {'movie','tv','series','serie','anime'}})
          def hub(pid):
              p=overrides.get(pid) if isinstance(overrides.get(pid),dict) else {}
              return str(p.get('official_hub') or '').strip()
          def positive(pid):
              r=results[pid]
              return bool(r.get('finalBundleVerified')) and str(r.get('result') or '')=='ok' and str(r.get('completionState') or '') in {'declared-types-qualified','direct-output-verified'}
          ok={p for p in results if positive(p)}
          active_ok=sorted(active & ok)
          active_bad=sorted(active-ok)
          disabled_ok=sorted((set(by)-active) & ok)
          disabled_ok_hub=[p for p in disabled_ok if hub(p)]
          ranked=sorted(disabled_ok_hub,key=lambda p:(-len(types(p)),p))
          proposed=set(active_ok)
          for p in ranked:
              if len(proposed)>=len(active): break
              proposed.add(p)
          print(f'FIELD_POSITIVE_V4_COUNTS total={len(by)} active={len(active)} active_ok={len(active_ok)} active_bad={len(active_bad)} all_positive={len(ok)} disabled_positive={len(disabled_ok)} replacements_with_hub={len(disabled_ok_hub)} proposed={len(proposed)}')
          print('FIELD_POSITIVE_V4_ACTIVE_BAD '+(','.join(active_bad) or 'none'))
          print('FIELD_POSITIVE_V4_DISABLED_OK '+(','.join(disabled_ok) or 'none'))
          for p in active_bad:
              r=results[p]
              proof=r.get('finalBundleProof') if isinstance(r.get('finalBundleProof'),dict) else {}
              print('FIELD_POSITIVE_V4_BAD_DETAIL '+json.dumps({'provider':p,'result':r.get('result'),'state':r.get('completionState'),'finalVerified':r.get('finalBundleVerified'),'reason':proof.get('reason'),'missingTypes':proof.get('missingTypes'),'playableTypes':proof.get('playableTypes'),'types':types(p),'hub':hub(p) or None},separators=(',',':')))
          for p in ranked[:30]:
              print('FIELD_POSITIVE_V4_REPLACEMENT '+json.dumps({'provider':p,'types':types(p),'hub':hub(p),'finalVerified':results[p].get('finalBundleVerified')},separators=(',',':')))
          out={'schemaVersion':1,'qualification':'every-declared-lane-playable-verified-v4','total':len(by),'currentActive':sorted(active),'positive':sorted(ok),'activePositive':active_ok,'activeBad':active_bad,'disabledPositive':disabled_ok,'disabledPositiveWithHub':disabled_ok_hub,'proposedStrictSet':sorted(proposed),'shortage':max(0,len(active)-len(proposed)),'results':results}
          os.makedirs('audit-output',exist_ok=True)
          json.dump(out,open('audit-output/positive-output-v4-audit.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: positive-output-v4-audit-${{ github.run_id }}
          path: audit-output/positive-output-v4-audit.json
          retention-days: 7
      - name: Commit V4 gate if aggregate completed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_provider_v3_positive_output_qualification_v4.py
          python3 tests/provider_v3_positive_output_qualification_v4_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/reconstruct_provider_v3_sequential_live.py
          if git diff --cached --quiet; then
            echo 'FIELD_POSITIVE_V4_COMMIT changed=0'
            exit 0
          fi
          git commit -m 'fix(gate): require verified output for every lane'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin fix/labs-5.21.44-20260912
            git rebase origin/fix/labs-5.21.44-20260912
            if git push origin HEAD:fix/labs-5.21.44-20260912; then
              echo "FIELD_POSITIVE_V4_COMMIT changed=1 attempt=$attempt sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 1
          done
          exit 1
