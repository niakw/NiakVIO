name: Temporary native corpus restage check

on:
  push:
    branches:
      - work/native-corpus-restage-assertion-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Compile Python scripts
        run: |
          python3 -m py_compile \
            scripts/prepare_native_corpus_validation.py \
            scripts/prepare_native_corpus_client.py \
            scripts/restage_native_corpus_client.py \
            tests/native_corpus_collector_assertion_test.py \
            tests/native_corpus_device_lab_test.py
      - name: Verify isolated Device Lab architecture
        run: python3 tests/native_corpus_device_lab_test.py
      - name: Verify prepare and restage assertion contracts
        run: python3 tests/native_corpus_collector_assertion_test.py
      - name: Verify generated Desktop test after restage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workspace/nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins"
          python3 scripts/restage_native_corpus_client.py desktop --fixture interstellar --workspace "$RUNNER_TEMP/workspace"
          FILE="$RUNNER_TEMP/workspace/nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioNativeCorpusDesktopTest.kt"
          grep -F 'assertTrue(providers.isNotEmpty(), "native corpus provider list must not be empty")' "$FILE"
          if grep -F 'assertTrue("native corpus provider list must not be empty", providers.isNotEmpty())' "$FILE"; then
            echo 'Android assertion ordering leaked into Desktop test' >&2
            exit 1
          fi
          if grep -F 'native provider runtime errors:' "$FILE"; then
            echo 'Provider errors still gate Desktop collection' >&2
            exit 1
          fi
