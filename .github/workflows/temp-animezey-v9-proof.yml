name: TEMP - AnimeZey V9 Proof

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/animezey-v9-proof.json'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply shared recognition migrations through V9
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_worker_route_proof_v1.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_base_route_requests_v1.py
          python scripts/upgrade_provider_route_authority_v5.py
          python scripts/upgrade_route_recovery_request_specs_v1.py
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_repair_v6.py
          python scripts/upgrade_provider_repair_v7.py
          python scripts/upgrade_provider_repair_v8.py
          python scripts/upgrade_provider_text_body_request_v9.py
          python scripts/upgrade_provider_route_retry_v1.py
          python scripts/upgrade_provider_base_runtime_v11.py
          node --check scripts/provider_worker.cjs
          python tests/provider_repair_v8_partial_typed_resolver_test.py
          python tests/provider_text_body_request_v9_test.py
      - name: Probe AnimeZey original provider only
        run: |
          set -euo pipefail
          python scripts/recover_provider_routes_from_upstreams.py \
            --workers 1 --timeout 55 --attempts 3 \
            --provider animezey \
            --out automation/animezey-v9-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/animezey-v9-proof.json')
          d=json.loads(p.read_text())
          row=d['providers'][0]
          route_data=row.get('routeData') or []
          specs=[r.get('requestSpec') for r in route_data if r.get('requestSpecReusable')]
          print('ANIMEZEY_V9_PROOF', 'routes=',len(row.get('routes') or []), 'reusable=',len(specs), 'recipe=',bool(row.get('apiRecipe')))
          for spec in specs:
            text=json.dumps(spec, ensure_ascii=False, sort_keys=True)
            if 'Interstellar' in text or 'Breaking Bad' in text or '157336' in text or '1396' in text:
              raise SystemExit('raw fixture identity leaked into executable request spec')
            print('ANIMEZEY_V9_SPEC', text)
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animezey-v9-proof-${{ github.run_id }}
          path: automation/animezey-v9-proof.json
          retention-days: 7
          if-no-files-found: warn
