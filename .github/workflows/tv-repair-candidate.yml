name: Nuvio TV repair candidate comparison

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-repair-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated candidate bundles
        run: python scripts/tv_build_candidate_bundles.py
      - name: Compare Purstream baseline and exact-TV candidate
        shell: bash
        run: |
          set -u
          BASE=$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(r['filename'] for r in m['scrapers'] if str(r['id']).lower()=='purstream'))
          PY
          )
          for fixture in \
            '{"tmdbId":"210702","mediaType":"tv","season":1,"episode":1,"title":"Revenant","year":2023}' \
            '{"tmdbId":"1396","mediaType":"tv","season":1,"episode":1,"title":"Breaking Bad","year":2008}' \
            '{"tmdbId":"94664","mediaType":"tv","season":1,"episode":1,"title":"Mushoku Tensei: Jobless Reincarnation","year":2021}'
          do
            id=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["tmdbId"])' "$fixture")
            (node scripts/nuvio_tv_probe_v2.cjs "$BASE" "$fixture" '{}' || true) | tail -n 1 > "/tmp/purstream-baseline-$id.json"
            (node scripts/nuvio_tv_probe_v2.cjs automation/tv-candidates/purstream.js "$fixture" '{}' || true) | tail -n 1 > "/tmp/purstream-candidate-$id.json"
            echo "=== Purstream baseline $id ==="; cat "/tmp/purstream-baseline-$id.json"
            echo "=== Purstream candidate $id ==="; cat "/tmp/purstream-candidate-$id.json"
            echo "=== Purstream baseline duration identity $id ==="; python scripts/tv_hls_duration_identity.py "/tmp/purstream-baseline-$id.json" || true
            echo "=== Purstream candidate duration identity $id ==="; python scripts/tv_hls_duration_identity.py "/tmp/purstream-candidate-$id.json" || true
          done
      - name: Prove PapaDuStream anime request path
        shell: bash
        run: |
          set -u
          BASE=$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(r['filename'] for r in m['scrapers'] if str(r['id']).lower()=='papadustream'))
          PY
          )
          FIX='{"tmdbId":"94664","mediaType":"anime","season":1,"episode":1,"title":"Mushoku Tensei: Jobless Reincarnation","year":2021}'
          echo '=== PapaDuStream baseline mediaType=anime ==='
          (node scripts/nuvio_tv_probe_v2.cjs "$BASE" "$FIX" '{}' || true) | tail -n 1
          echo '=== PapaDuStream candidate mediaType=anime -> tv ==='
          (node scripts/nuvio_tv_probe_v2.cjs automation/tv-candidates/papadustream.js "$FIX" '{}' || true) | tail -n 1
      - name: Compare dead-link filtering candidates
        shell: bash
        run: |
          set -u
          python - <<'PY' > /tmp/provider-map.tsv
          import json
          m=json.load(open('manifest.json'))
          wanted={'4khdhubnew','animezey','vegamovies','frenchstream','streamzo'}
          for r in m['scrapers']:
              k=str(r.get('id') or '').lower()
              if k in wanted: print(k+'\t'+r['filename'])
          PY
          for fixture in \
            '{"tmdbId":"157336","mediaType":"movie","title":"Interstellar","year":2014}' \
            '{"tmdbId":"1396","mediaType":"tv","season":1,"episode":1,"title":"Breaking Bad","year":2008}' \
            '{"tmdbId":"210702","mediaType":"tv","season":1,"episode":1,"title":"Revenant","year":2023}'
          do
            echo "===== fixture $fixture ====="
            while IFS=$'\t' read -r id base; do
              echo "--- $id baseline ---"
              (node scripts/nuvio_tv_probe_v2.cjs "$base" "$fixture" '{}' || true) | tail -n 1
              echo "--- $id candidate ---"
              (node scripts/nuvio_tv_probe_v2.cjs "automation/tv-candidates/$id.js" "$fixture" '{}' || true) | tail -n 1
            done < /tmp/provider-map.tsv
          done
      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tv-repair-candidate-${{ github.run_id }}
          path: |
            automation/tv-candidates/
          retention-days: 2
