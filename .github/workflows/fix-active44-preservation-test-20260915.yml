name: SHORT - Fix Active44 Preservation Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-active44-preservation-test-20260915.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: niakvio-active44-preservation-test
  cancel-in-progress: false

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Patch stale fixed-count assertions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ci_preservation_policy_test.py')
          t=p.read_text(encoding='utf-8')
          old1="assert 'canonical catalogue must contain 96 providers' in result.stderr"
          new1="assert 'canonical catalogue must contain 46 providers' in result.stderr"
          old2="assert '46-hub target missing from canonical catalogue' in result.stderr"
          new2="assert 'active-hub target missing from canonical catalogue' in result.stderr"
          if old1 not in t or old2 not in t:
              raise SystemExit('stale preservation assertions not found exactly')
          t=t.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(t,encoding='utf-8')
          print('ACTIVE44_PRESERVATION_TEST_PATCHED')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ci_preservation_policy_test.py
          git commit -m 'test: align activation preservation with 46 census and dynamic scope'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
          git push origin HEAD:main
          echo "ACTIVE44_PRESERVATION_TEST_PUBLISHED $(git rev-parse HEAD)"
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/apply-manual-evidence-active44-20260915-v2.yml/dispatches \
            -f ref=main
          echo ACTIVE44_V2_REDISPATCHED
