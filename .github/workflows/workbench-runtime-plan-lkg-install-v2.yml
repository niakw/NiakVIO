name: WORKBENCH - Runtime Plan LKG Install V2

on:
  push:
    branches: [workbench/systemic-recovery-20260909]
    paths: ['.github/workflows/workbench-runtime-plan-lkg-install-v2.yml']

permissions:
  contents: write

concurrency:
  group: niakvio-workbench-runtime-plan-lkg-install-v2
  cancel-in-progress: false

jobs:
  install-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}

      - name: Patch canonical Repair ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lkg=Path('scripts/provider_runtime_plan_lkg_v1.py')
          text=lkg.read_text(encoding='utf-8')
          if 'snapshot.unlink(missing_ok=True)' not in text:
              old='''        apply(
                      snapshot_path=snapshot,
                      knowledge_path=resolve(args.knowledge),
                      overrides_path=resolve(args.overrides),
                  )
              return 0
          '''
              old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
              new='''        apply(
                      snapshot_path=snapshot,
                      knowledge_path=resolve(args.knowledge),
                      overrides_path=resolve(args.overrides),
                  )
                  # The LKG snapshot is a run-local bridge, never release DATA.
                  snapshot.unlink(missing_ok=True)
              return 0
          '''
              new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
              if text.count(old) != 1:
                  raise SystemExit('LKG cleanup anchor mismatch')
              lkg.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/run_provider_repair_pipeline_v6.py')
          text=p.read_text(encoding='utf-8')
          baseline='    baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)\n'
          capture='''    baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)
              run(
                  sys.executable,
                  "scripts/provider_runtime_plan_lkg_v1.py",
                  "capture",
                  "--baseline", str(PORTFOLIO_BASELINE.relative_to(ROOT)),
              )
          '''
          capture='\n'.join(line[10:] if line.startswith('          ') else line for line in capture.splitlines())+'\n'
          if '"scripts/provider_runtime_plan_lkg_v1.py",\n        "capture"' not in text:
              if text.count(baseline) != 1: raise SystemExit('baseline anchor mismatch')
              text=text.replace(baseline,capture,1)

          recovery='    run(sys.executable, "scripts/apply_provider_route_recovery_report.py", str(MERGED_REPORT.relative_to(ROOT)))\n'
          restore='''    run(
                  sys.executable,
                  "scripts/provider_runtime_plan_lkg_v1.py",
                  "apply",
              )
          '''
          restore='\n'.join(line[10:] if line.startswith('          ') else line for line in restore.splitlines())+'\n'
          if '"scripts/provider_runtime_plan_lkg_v1.py",\n        "apply"' not in text:
              if text.count(recovery) != 1: raise SystemExit('recovery anchor mismatch')
              text=text.replace(recovery,recovery+restore,1)

          fixture='        "tests/provider_quick_yield_fixture_selection_test.py",\n'
          if '"tests/provider_runtime_plan_lkg_v1_test.py"' not in text:
              if text.count(fixture) != 1: raise SystemExit('test anchor mismatch')
              text=text.replace(fixture,fixture+'        "tests/provider_runtime_plan_lkg_v1_test.py",\n',1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Compile and prove exact order
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/provider_runtime_plan_lkg_v1.py scripts/run_provider_repair_pipeline_v6.py
          python3 tests/provider_runtime_plan_lkg_v1_test.py
          python3 tests/provider_repair_pipeline_v6_contract_test.py
          python3 - <<'PY'
          from pathlib import Path
          t=Path('scripts/run_provider_repair_pipeline_v6.py').read_text(encoding='utf-8')
          points=[
            t.index('baseline_portfolio = capture_portfolio_yield(PORTFOLIO_BASELINE)'),
            t.index('"scripts/provider_runtime_plan_lkg_v1.py",\n        "capture"'),
            t.index('    migrations = ['),
            t.index('"scripts/apply_provider_route_recovery_report.py"'),
            t.index('"scripts/provider_runtime_plan_lkg_v1.py",\n        "apply"'),
            t.index('"scripts/materialize_provider_base_v3_store.py"'),
          ]
          assert points == sorted(points), points
          l=Path('scripts/provider_runtime_plan_lkg_v1.py').read_text(encoding='utf-8')
          assert 'proofPromotion": False' in l and 'activationAuthority": False' in l
          assert 'snapshot.unlink(missing_ok=True)' in l
          print('RUNTIME_PLAN_LKG_PIPELINE_ORDER_OK points='+','.join(map(str,points)))
          PY

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_runtime_plan_lkg_v1.py scripts/run_provider_repair_pipeline_v6.py
          git commit -m 'fix(repair): preserve baseline-verified runtime plans'
          git fetch origin workbench/systemic-recovery-20260909
          git rebase origin/workbench/systemic-recovery-20260909
          git push origin HEAD:workbench/systemic-recovery-20260909
