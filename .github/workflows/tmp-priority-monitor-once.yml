name: Temporary priority sequence monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-priority-monitor-once.yml"

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: tmp-priority-monitor-once
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Remove monitor before observing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-priority-monitor-once.yml
          git commit -m 'chore: remove priority monitor one-shot [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Observe Quick Deep Learning sequence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Priority monitor started.'
          LAST=''
          for _ in $(seq 1 420); do
            SYNC_JSON="$(gh run list --workflow sync.yml --branch main --event workflow_dispatch --limit 8 --json databaseId,status,conclusion,createdAt,headSha)"
            BRAIN_JSON="$(gh run list --workflow brain-learning-lab.yml --branch main --event workflow_dispatch --limit 5 --json databaseId,status,conclusion,createdAt,headSha)"
            SNAPSHOT="$(SYNC_JSON="$SYNC_JSON" BRAIN_JSON="$BRAIN_JSON" python3 - <<'PY'
import json, os
sync=sorted(json.loads(os.environ['SYNC_JSON']), key=lambda r:r['createdAt'])
brain=sorted(json.loads(os.environ['BRAIN_JSON']), key=lambda r:r['createdAt'])
# The priority orchestrator was created at 2026-08-24T14:45:05Z. Ignore older dispatches.
cut='2026-08-24T14:45:05Z'
sync=[r for r in sync if r['createdAt'] >= cut]
brain=[r for r in brain if r['createdAt'] >= cut]
q=sync[0] if len(sync)>0 else None
d=sync[1] if len(sync)>1 else None
b=brain[0] if len(brain)>0 else None
print(json.dumps({'quick':q,'deep':d,'learning':b}, separators=(',',':')))
PY
)"
            if [ "$SNAPSHOT" != "$LAST" ]; then
              gh issue comment 69 --body "PRIORITY_SEQUENCE_STATUS \`$SNAPSHOT\`"
              LAST="$SNAPSHOT"
            fi
            DONE="$(SNAPSHOT="$SNAPSHOT" python3 - <<'PY'
import json, os
s=json.loads(os.environ['SNAPSHOT'])
q,d,b=s['quick'],s['deep'],s['learning']
if q and q['status']=='completed' and q.get('conclusion')!='success': print('quick-failed')
elif d and d['status']=='completed' and d.get('conclusion')!='success': print('deep-failed')
elif b and b['status']=='completed': print('all-done' if b.get('conclusion')=='success' else 'learning-failed')
else: print('wait')
PY
)"
            case "$DONE" in
              all-done) exit 0 ;;
              quick-failed|deep-failed|learning-failed) exit 1 ;;
            esac
            sleep 30
          done
          echo 'Priority sequence monitor timed out.' >&2
          exit 1
