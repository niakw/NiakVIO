name: Dependency gate

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install lockfile and run repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify upgraded runtime imports
        run: node -e "require('axios'); require('cheerio'); console.log('dependency imports ok')"

      - name: Run repository test suite
        run: npm test
