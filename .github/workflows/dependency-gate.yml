name: Dependency gate

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install lockfile and run repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify upgraded runtime imports
        run: node -e "require('axios'); require('cheerio'); console.log('dependency imports ok')"

      - name: Run deterministic repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm run pretest
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          commands = [part.strip() for part in package['scripts']['test'].split('&&') if part.strip()]
          live_client_policy = {
              'python3 scripts/validate_platform_runtime_policy.py',
              'python3 scripts/validate_mobile_runtime_policy.py',
              'python3 scripts/validate_nuvio_tv_runtime_policy.py',
          }
          deterministic = [command for command in commands if command not in live_client_policy]
          skipped = [command for command in commands if command in live_client_policy]
          assert len(skipped) == 3, skipped
          for command in deterministic:
              print(f'FIELD_DEPENDENCY_GATE_TEST command={command}', flush=True)
              subprocess.run(command, shell=True, check=True)
          PY
          npm run posttest
