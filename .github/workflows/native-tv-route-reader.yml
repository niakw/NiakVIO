name: Native TV reader acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "5 18 * * 6"

permissions:
  contents: read

concurrency:
  group: native-tv-reader-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NIAKVIO_REPRESENTATIVE_FIXTURES: "interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01"
  NIAKVIO_SKIP_ANDROID_PREBUILD: "1"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      tv_sha: ${{ steps.refs.outputs.tv_sha }}
      tv_drift_status: ${{ steps.refs.outputs.tv_drift_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Inspect official NuvioTV drift
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_nuvio_client_upstreams.py --no-fail             --clients nuvio-tv             --output health-output/nuvio-client-upstream-status.json
      - id: refs
        name: Resolve exact official NuvioTV HEAD
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/resolve_nuvio_lab_heads.py             --report health-output/nuvio-client-upstream-status.json             --clients nuvio-tv             --github-output "$GITHUB_OUTPUT"             --output health-output/nuvio-tv-lab-head.json
      - name: Publish TV runtime context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuvio-tv-lab-head-${{ github.run_id }}
          path: |
            health-output/nuvio-client-upstream-status.json
            health-output/nuvio-tv-lab-head.json
          retention-days: 1
          if-no-files-found: error

  tv-route-reader:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout NiakVIO candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true
      - name: Restore TV AVD snapshot and matching debug signing key
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-v5-${{ runner.os }}-tv-api31-android-tv-x86-tv_1080p
      - name: Checkout latest official NuvioTV HEAD and stage first route
        shell: bash
        env:
          NUVIO_TV_SHA: ${{ needs.resolve.outputs.tv_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          python3 niakvio/scripts/prepare_native_reader_acceptance.py tv             --fixture interstellar --workspace "$GITHUB_WORKSPACE"             --manifest manifest.json --provider declared-type --streams all --initial
      - name: Prebuild TV reader once before QEMU
        shell: bash
        env:
          NIAKVIO_TARGET_MANIFEST: manifest.json
          NIAKVIO_TARGET_PROVIDER: declared-type
          NIAKVIO_PRIMARY_FIXTURE: interstellar
          NIAKVIO_PRIMARY_STREAM_SCOPE: all
        run: bash niakvio/scripts/prebuild_native_android_reader_suite.sh tv
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
      - name: Prime Android adb server
        run: bash niakvio/scripts/prime_android_lab_adb.sh
      - name: Execute movie TV anime in one TV boot
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          NIAKVIO_TARGET_FIXTURES: "interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01"
          NIAKVIO_TARGET_PROVIDER: declared-type
          NIAKVIO_TARGET_MANIFEST: manifest.json
          NIAKVIO_READER_ACCEPTANCE: "1"
          NIAKVIO_TV_PRIORITY_APPEND: "0"
          NIAKVIO_TV_ROUTE_TIMEOUT_MINUTES: "45"
          NIAKVIO_TV_CHECKPOINT_DIR: ${{ github.workspace }}/native-evidence/tv/checkpoints
          NIAKVIO_TV_RESUME_CHECKPOINT_DIR: ${{ github.workspace }}/native-evidence/tv/checkpoints
          NIAKVIO_PRIMARY_FIXTURE: interstellar
          NIAKVIO_PRIMARY_STREAM_SCOPE: all
          NIAKVIO_REGRESSION_STREAM_SCOPE: all
          NIAKVIO_REQUIRE_READER_SUCCESS: "1"
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: ${{ steps.avd-cache.outputs.cache-hit == 'true' && '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim' || '-no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim' }}
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_tv_suite.sh"
      - name: Diagnose complete TV evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for fixture in $NIAKVIO_REPRESENTATIVE_FIXTURES; do
            LOG="$GITHUB_WORKSPACE/tv-native-corpus-${fixture}.log"
            test -s "$LOG"
            node niakvio/engine_v2/scripts/diagnose-native-reader.mjs               --output "$GITHUB_WORKSPACE/tv-route-${fixture}-brain.json" "$LOG"
          done
      - name: Upload TV route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tv-route-representative-${{ github.run_id }}
          path: |
            tv-native-corpus-*.log
            tv-native-frontend-*.log
            tv-route-*-brain.json
            native-evidence/tv/**
          retention-days: 1
          if-no-files-found: warn
