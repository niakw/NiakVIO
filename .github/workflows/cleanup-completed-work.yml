name: Clean completed branch and workflow residue

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-completed-work.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete reviewed branches without open pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "agent/desktop-manual-test-v1"
            "agent/desktop-runtime-provider-fixes"
            "agent/final-cleanup-atomic"
            "agent/final-provider-repair-v1"
            "agent/global-hls-proof-and-reactivation"
            "agent/global-provider-v2-integration"
            "agent/niakvio-core-v6"
            "agent/playback-integrity-v2"
            "agent/provider-recovery-and-refresh-v3"
            "agent/repair-vf-providers"
            "agent/run-desktop-publication-v2"
            "agent/runtime-truth-5.20.41"
            "agent/tv-hardening-integration-5.20.39"
            "agent/tv-regression-5.20.38"
            "agent/tv-vf-global-integration-5.20.39"
            "agent/vf-movie-validation"
            "agent/workflow-trigger-files"
            "chore/reproducible-installs"
            "ci-status"
            "diag/targeted-four-20260813"
            "diag/voiranime-sibnet-current-20260813"
            "docs/readme-generic-engine"
            "docs/readme-generic-engine-v2"
            "fix/adaptive-domain-revision-v2"
            "fix/adaptive-refresh-hardening"
            "fix/animezey-stream-host-v1"
            "fix/final-hardening-20260812"
            "fix/french-manga-target-media-v4"
            "fix/generic-recovery-hardening"
            "fix/hls-recovery-first"
            "fix/local-python3-validation"
            "fix/serialized-provider-publishing"
            "fix/strict-active-set"
            "fix/strict-media-identity-20260813"
            "fix/v4-bounded-binary-probe"
            "lab/nuvio-client-matrix"
            "lab/nuvio-client-playback"
            "test/strict-media-smoke-20260813"
          )

          deleted=0
          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            deleted=$((deleted + 1))
          done
          echo "Deleted ${deleted} reviewed stale branches." >> "$GITHUB_STEP_SUMMARY"

      - name: Disable workflows no longer present on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          disabled=0
          self_id=""

          while IFS=$'\t' read -r workflow_id workflow_path workflow_state; do
            case "$workflow_path" in
              ".github/workflows/availability.yml"|\
              ".github/workflows/domain-refresh.yml"|\
              ".github/workflows/nuvio-client-lab.yml"|\
              ".github/workflows/sync.yml"|\
              ".github/workflows/validate-desktop-runtime-compat.yml"|\
              "dynamic/dependabot/dependabot-updates")
                continue
                ;;
              ".github/workflows/cleanup-completed-work.yml")
                self_id="$workflow_id"
                continue
                ;;
            esac

            if [[ "$workflow_state" == "active" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
              disabled=$((disabled + 1))
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | [.id, .path, .state] | @tsv'
          )

          echo "Disabled ${disabled} obsolete workflows." >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$self_id" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${self_id}/disable"
          fi
