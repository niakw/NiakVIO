name: Finalize post-publish cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/finalize-postpublish-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Remove one-shot workflows and triggers
        run: |
          rm -f .github/workflows/resume-106-publish.yml
          rm -f .github/triggers/resume-106-publish
          rm -f .github/workflows/verify-main-postpublish.yml
          rm -f .github/triggers/verify-main-postpublish
          rm -f .github/workflows/finalize-postpublish-cleanup.yml
          rm -f .github/triggers/finalize-postpublish-cleanup

      - name: Regenerate hashes for final published tree
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(name): return json.loads(Path(name).read_text(encoding='utf-8'))
          package=load('package.json'); lock=load('package-lock.json'); manifest=load('manifest.json'); vf=load('vf/manifest.json')
          versions={
            'package.json':package.get('version'),
            'package-lock.json':lock.get('version'),
            "package-lock.json packages['']":(lock.get('packages') or {}).get('',{}).get('version'),
            'manifest.json':manifest.get('version'),
            'vf/manifest.json':vf.get('version'),
          }
          if len({str(v) for v in versions.values()}) != 1:
              raise SystemExit(f'version mismatch: {versions}')
          print(f"release versions synchronized: {manifest.get('version')}")
          PY

      - name: Commit final clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize 5.20.42 post-publish verification"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify exact final main in isolated worktree
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git worktree add --detach /tmp/niakvio-final origin/main
          cd /tmp/niakvio-final
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/validate_release_integrity.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          npm test
