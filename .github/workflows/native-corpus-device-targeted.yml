name: NATIVE - Device Corpus Tests

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device corpus to execute
        required: true
        default: tv
        type: choice
        options:
          - tv
          - mobile
          - desktop
          - all
      target_providers:
        description: Optional comma-separated exact provider ids
        required: false
        default: ""
        type: string
      residential_exit:
        description: Route the real native client through the configured private Tailscale exit
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/triggers/native-residential-transport-targeted.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-corpus-device-targeted-${{ github.ref }}-${{ inputs.device || 'tv' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      desktop_sha: ${{ steps.resolve.outputs.desktop_sha }}
      mobile_sha: ${{ steps.resolve.outputs.mobile_sha }}
      tv_sha: ${{ steps.resolve.outputs.tv_sha }}
    steps:
      - name: Checkout selected Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve selected devices and accepted clients
        id: resolve
        shell: bash
        env:
          INPUT_DEVICE: ${{ inputs.device || '' }}
          INPUT_TARGET_PROVIDERS: ${{ inputs.target_providers || '' }}
          INPUT_RESIDENTIAL_EXIT: ${{ inputs.residential_exit || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          device = (os.environ.get("INPUT_DEVICE") or "tv").strip().lower()
          providers = [
              value.strip().lower()
              for value in (os.environ.get("INPUT_TARGET_PROVIDERS") or "").split(",")
              if value.strip()
          ]
          residential = str(os.environ.get("INPUT_RESIDENTIAL_EXIT") or "").strip().lower() == "true"

          if event == "push":
              trigger = Path(".github/triggers/native-residential-transport-targeted.json")
              payload = json.loads(trigger.read_text(encoding="utf-8"))
              device = str(payload.get("device") or "tv").strip().lower()
              providers = sorted({
                  str(value or "").strip().lower()
                  for value in payload.get("targetProviders") or []
                  if str(value or "").strip()
              })
              residential = payload.get("residentialExit") is True

          if device in {"desktop", "mobile", "tv"}:
              devices = [device]
          elif device == "all":
              devices = ["desktop", "mobile", "tv"]
          else:
              raise SystemExit(f"unsupported device: {device}")

          if len(providers) > 8:
              raise SystemExit("targeted native provider cohort is capped at 8")
          if residential and not providers:
              raise SystemExit("residential native transport proof requires explicit target provider(s)")

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          available = {
              str(row.get("id") or "").strip().lower(): row
              for row in manifest.get("scrapers") or []
              if isinstance(row, dict) and str(row.get("id") or "").strip()
          }
          missing = sorted(set(providers) - set(available))
          if missing:
              raise SystemExit("unknown target provider(s): " + ",".join(missing))
          disabled = sorted(
              provider for provider in providers
              if available[provider].get("enabled") is not True
          )
          if disabled:
              raise SystemExit("disabled target provider(s): " + ",".join(disabled))

          target_providers = providers or ["declared-type"]
          targets = [
              {
                  "device": selected_device,
                  "fixture": "all",
                  "provider": provider,
                  "residential": residential,
              }
              for selected_device in devices
              for provider in target_providers
          ]
          print("targets=" + json.dumps({"include": targets}, separators=(",", ":")))

          data = json.loads(Path("sources.json").read_text(encoding="utf-8"))
          clients = data.get("nuvio_client_compatibility", {}).get("clients", {})
          for output, key in {
              "desktop_sha": "nuvio-desktop",
              "mobile_sha": "nuvio-mobile",
              "tv_sha": "nuvio-tv",
          }.items():
              ref = str((clients.get(key) or {}).get("accepted_ref") or "").strip()
              if len(ref) != 40:
                  raise SystemExit(f"missing accepted_ref for {key}")
              print(f"{output}={ref}")
          PY

  native-corpus:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
      NIAKVIO_TARGET_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout exact Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: niakvio
          persist-credentials: false

      - name: Validate targeted residential native contract
        run: python3 niakvio/tests/native_residential_transport_targeted_workflow_test.py

      - name: Build exact targeted provider scope
        if: ${{ matrix.provider != 'declared-type' }}
        shell: bash
        env:
          TARGET_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "niakvio"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          wanted = os.environ["TARGET_PROVIDER"].strip().lower()
          row = next(
              (
                  row for row in manifest.get("scrapers") or []
                  if isinstance(row, dict)
                  and str(row.get("id") or "").strip().lower() == wanted
                  and row.get("enabled") is True
              ),
              None,
          )
          if row is None:
              raise SystemExit(f"target provider unavailable: {wanted}")
          actual = str(row["id"]).strip()
          scope = {
              "schemaVersion": 1,
              "providerCount": 1,
              "hubCount": 1,
              "rows": [{"provider": actual, "manifestId": actual}],
          }
          path = root / "automation/native-target-provider-scope.json"
          path.write_text(json.dumps(scope, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"NIAKVIO_PROVIDER_SCOPE_MATRIX={path}\n")
              handle.write(f"NIAKVIO_TARGET_PROVIDER={actual}\n")
          print(f"FIELD_NATIVE_TARGET_SCOPE provider={actual} providers=1")
          PY

      - name: Require configured residential exit
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TS_OAUTH_CLIENT_ID:-}"
          test -n "${TS_AUDIENCE:-}"
          test -n "${TS_EXIT_NODE:-}"

      - name: Normalize native Tailscale tag
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"

      - name: Connect native client host to Tailscale
        if: ${{ matrix.residential == true }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Select residential exit before native emulator boot
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for attempt in 1 2 3 4 5; do
            if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
              selected=1
              break
            fi
            sleep "$((attempt * 2))"
          done
          test "$selected" -eq 1
          echo "NIAKVIO_NATIVE_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"
          echo "FIELD_NATIVE_RESIDENTIAL_EXIT active=true provider=${{ matrix.provider }} device=${{ matrix.device }}"

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install official Desktop runtime dependencies
        if: matrix.device == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout accepted official client and stage corpus once
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          NUVIO_DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
          NUVIO_MOBILE_SHA: ${{ needs.resolve.outputs.mobile_sha }}
          NUVIO_TV_SHA: ${{ needs.resolve.outputs.tv_sha }}
        run: |
          set -euxo pipefail
          case "$DEVICE" in
            desktop)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
              git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
              touch nuvio-desktop/local.properties
              python3 niakvio/scripts/prepare_native_corpus_client.py desktop --fixture interstellar --workspace "$GITHUB_WORKSPACE"
              ;;
            mobile)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
              git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
              touch nuvio-mobile/local.properties
              python3 niakvio/scripts/prepare_native_corpus_client.py mobile --fixture interstellar --workspace "$GITHUB_WORKSPACE"
              python3 niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"
              ;;
            tv)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
              git -C nuvio-tv checkout "$NUVIO_TV_SHA"
              touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
              python3 niakvio/scripts/prepare_native_corpus_client.py tv --fixture interstellar --workspace "$GITHUB_WORKSPACE"
              ;;
          esac

      - name: Set up Gradle runtime
        if: matrix.device != 'desktop'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true

      - name: Enable Linux KVM when available
        if: matrix.device != 'desktop'
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm || true
          fi

      - name: Restore Mobile AVD snapshot
        if: matrix.device == 'mobile'
        id: avd-cache-mobile
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ runner.os }}-mobile-api35-google_apis-x86_64-pixel_2-${{ needs.resolve.outputs.mobile_sha }}-${{ github.sha }}

      - name: Create Mobile AVD snapshot on cache miss
        if: matrix.device == 'mobile' && steps.avd-cache-mobile.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated clean Mobile AVD snapshot."

      - name: Restore TV AVD snapshot
        if: matrix.device == 'tv'
        id: avd-cache-tv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ runner.os }}-tv-api31-android-tv-x86-tv_1080p-${{ needs.resolve.outputs.tv_sha }}-${{ github.sha }}

      - name: Create TV AVD snapshot on cache miss
        if: matrix.device == 'tv' && steps.avd-cache-tv.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated clean TV AVD snapshot."

      - name: Execute six works across every provider in official Desktop runtime
        if: matrix.device == 'desktop'
        shell: bash
        run: |
          set -u
          FIXTURES=(interstellar mon-ninja-et-moi-3 breaking-bad-s01e01 revenant-s01e01 jujutsu-kaisen-s01e01 mushoku-tensei-s01e01)
          STATUS=0
          for fixture in "${FIXTURES[@]}"; do
            echo "===== DESKTOP CORPUS FIXTURE: $fixture ====="
            python3 niakvio/scripts/restage_native_corpus_client.py desktop --fixture "$fixture" --workspace "$GITHUB_WORKSPACE" || { STATUS=1; continue; }
            LOG="$GITHUB_WORKSPACE/desktop-native-corpus-${fixture}.log"
            rm -f "$LOG"
            RUNTIME_STATUS=0
            ./nuvio-desktop/gradlew -p nuvio-desktop :composeApp:desktopTest --tests 'com.nuvio.app.features.plugins.NiakvioNativeCorpusDesktopTest' --no-daemon --console=plain || RUNTIME_STATUS=$?
            cat "$LOG" || true
            COLLECTION_STATUS=0
            node niakvio/scripts/analyze_native_corpus_collection.cjs "$fixture" "$LOG" || COLLECTION_STATUS=$?
            echo "FIELD_NATIVE_CORPUS_DESKTOP_STATUS fixture=$fixture runtime=$RUNTIME_STATUS collection=$COLLECTION_STATUS"
            if [ "$RUNTIME_STATUS" -ne 0 ] || [ "$COLLECTION_STATUS" -ne 0 ]; then STATUS=1; fi
          done
          echo "FIELD_NATIVE_CORPUS_DESKTOP_SUITE_STATUS status=$STATUS fixtures=${#FIXTURES[@]} clients=1"
          exit "$STATUS"

      - name: Execute six works across every provider in isolated Mobile emulator
        if: matrix.device == 'mobile'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_mobile_suite.sh"

      - name: Execute six works across every provider in isolated Android TV emulator
        if: matrix.device == 'tv'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_tv_suite.sh"

      - name: Clear native residential exit
        if: ${{ always() && matrix.residential == true }}
        shell: bash
        run: sudo tailscale set --exit-node= || true

      - name: Upload sanitized native corpus logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-corpus-${{ matrix.device }}-${{ matrix.provider }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: ${{ matrix.device }}-native-corpus-*.log
          retention-days: 1
          if-no-files-found: warn

  cross-runtime-gate:
    if: ${{ always() && inputs.device == 'all' && inputs.target_providers == '' }}
    needs: [native-corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact NiakVIO generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: niakvio
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download Desktop extraction-runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-corpus-desktop-declared-type-all-${{ github.run_id }}
          path: cross-runtime/desktop

      - name: Download Mobile extraction-runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-corpus-mobile-declared-type-all-${{ github.run_id }}
          path: cross-runtime/mobile

      - name: Download TV extraction-runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-corpus-tv-declared-type-all-${{ github.run_id }}
          path: cross-runtime/tv

      - name: Gate Desktop Mobile TV runtime divergence
        shell: bash
        run: |
          set -euo pipefail
          node niakvio/scripts/gate_native_cross_client_runtime.cjs \
            --dir "$GITHUB_WORKSPACE/cross-runtime" \
            --require-clients desktop,mobile,tv \
            --min-comparisons 6
