name: NATIVE - Device Corpus Tests

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device corpus to execute
        required: true
        default: tv
        type: choice
        options:
          - tv
          - mobile
          - desktop
          - all
      target_providers:
        description: Optional comma-separated exact provider ids
        required: false
        default: ""
        type: string
      target_fixture:
        description: Optional exact corpus fixture slug for focused native transport/player proof
        required: false
        default: ""
        type: string
      residential_exit:
        description: Route the real native client through the configured private Tailscale exit
        required: false
        default: false
        type: boolean
      candidate_rematerialize:
        description: Ephemeral Core/ProviderBase candidate for one TV fixture; never production
        required: false
        default: false
        type: boolean
      candidate_required_marker:
        description: Optional source-owned Core marker required in exact candidate JS
        required: false
        default: ""
        type: string
      source_sha:
        description: Optional exact NiakVIO SHA for a source-pinned Brain candidate replay
        required: false
        default: ""
        type: string
      brain_candidate_experiment_json:
        description: Optional bounded Brain candidate experiment JSON; candidate-only
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/native-residential-transport-targeted.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-corpus-device-targeted-${{ github.ref }}-${{ inputs.device || 'tv' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      desktop_sha: ${{ steps.heads.outputs.desktop_sha }}
      mobile_sha: ${{ steps.heads.outputs.mobile_sha }}
      tv_sha: ${{ steps.heads.outputs.tv_sha }}
    steps:
      - name: Checkout selected Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve latest official client HEADs (audit contract drift first)
        id: heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 scripts/check_nuvio_client_upstreams.py \
            --clients nuvio-tv nuvio-mobile nuvio-desktop \
            --paths-only --no-fail \
            --output health-output/native-target-current-client-drift.json
          python3 scripts/resolve_nuvio_lab_heads.py \
            --report health-output/native-target-current-client-drift.json \
            --clients nuvio-tv nuvio-mobile nuvio-desktop \
            --github-output "$GITHUB_OUTPUT" \
            --output health-output/native-target-current-client-heads.json
          echo "FIELD_NATIVE_TARGET_CLIENT_POLICY latest_official_head=true accepted_ref_only_for_audit=true require_exact_sha=true"

      - name: Resolve selected devices and manifests
        id: resolve
        shell: bash
        env:
          INPUT_DEVICE: ${{ inputs.device || '' }}
          INPUT_TARGET_PROVIDERS: ${{ inputs.target_providers || '' }}
          INPUT_TARGET_FIXTURE: ${{ inputs.target_fixture || '' }}
          INPUT_RESIDENTIAL_EXIT: ${{ inputs.residential_exit || false }}
          INPUT_CANDIDATE_REMATERIALIZE: ${{ inputs.candidate_rematerialize || false }}
          INPUT_CANDIDATE_REQUIRED_MARKER: ${{ inputs.candidate_required_marker || '' }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          INPUT_BRAIN_CANDIDATE_EXPERIMENT_JSON: ${{ inputs.brain_candidate_experiment_json || '' }}
          WORKFLOW_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          device = (os.environ.get("INPUT_DEVICE") or "tv").strip().lower()
          providers = [
              value.strip().lower()
              for value in (os.environ.get("INPUT_TARGET_PROVIDERS") or "").split(",")
              if value.strip()
          ]
          target_fixture = (os.environ.get("INPUT_TARGET_FIXTURE") or "").strip()
          residential = str(os.environ.get("INPUT_RESIDENTIAL_EXIT") or "").strip().lower() == "true"
          candidate_rematerialize = str(os.environ.get("INPUT_CANDIDATE_REMATERIALIZE") or "").strip().lower() == "true"
          candidate_marker = str(os.environ.get("INPUT_CANDIDATE_REQUIRED_MARKER") or "").strip()
          source_sha = str(os.environ.get("INPUT_SOURCE_SHA") or os.environ.get("WORKFLOW_SHA") or "").strip().lower()
          brain_candidate_experiment = str(os.environ.get("INPUT_BRAIN_CANDIDATE_EXPERIMENT_JSON") or "").strip()

          if event == "push":
              trigger = Path(".github/triggers/native-residential-transport-targeted.json")
              payload = json.loads(trigger.read_text(encoding="utf-8"))
              device = str(payload.get("device") or "tv").strip().lower()
              providers = sorted({
                  str(value or "").strip().lower()
                  for value in payload.get("targetProviders") or []
                  if str(value or "").strip()
              })
              target_fixture = str(payload.get("targetFixture") or "").strip()
              residential = payload.get("residentialExit") is True
              candidate_rematerialize = payload.get("candidateRematerialize") is True
              candidate_marker = str(payload.get("candidateRequiredMarker") or "").strip()
              source_sha = str(os.environ.get("WORKFLOW_SHA") or "").strip().lower()
              brain_candidate_experiment = ""

          if device in {"desktop", "mobile", "tv"}:
              devices = [device]
          elif device == "all":
              devices = ["desktop", "mobile", "tv"]
          else:
              raise SystemExit(f"unsupported device: {device}")

          if len(providers) > 8:
              raise SystemExit("targeted native provider cohort is capped at 8")
          if residential and not providers:
              raise SystemExit("residential native transport proof requires explicit target provider(s)")
          if candidate_rematerialize and (device != "tv" or len(providers) != 1 or not target_fixture):
              raise SystemExit("candidate native replay requires TV, one active provider and an exact fixture")
          if candidate_marker not in {"", "NIAKVIO_HLS_TS_WRAPPED_AAC_RENDITION_V20",
                                     "NIAKVIO_PROVIDER_NATIVE_FETCH_CAPABILITY_GATE_V28",
                                     "NIAKVIO_PROVIDER_NATIVE_BLOCKING_ORIGIN_PRIORITY_EXPERIMENT_V29",
                                     "NIAKVIO_PROVIDER_NATIVE_HLS_ROOT_RECEIPT_V30",
                                     "NIAKVIO_PROVIDER_NATIVE_HLS_RECEIPT_DEDUPE_V31"}:
              raise SystemExit("invalid native candidate source-owned Core marker")
          if candidate_marker and not candidate_rematerialize:
              raise SystemExit("candidate marker without isolated candidate materialization")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("native source_sha must be an exact 40-hex NiakVIO commit")
          if len(brain_candidate_experiment) > 4096:
              raise SystemExit("Brain candidate experiment exceeds bounded input")
          if brain_candidate_experiment:
              try:
                  brain_payload = json.loads(brain_candidate_experiment)
              except json.JSONDecodeError as exc:
                  raise SystemExit("Brain candidate experiment is invalid JSON") from exc
              if not isinstance(brain_payload, dict):
                  raise SystemExit("Brain candidate experiment must be an object")
              if not candidate_rematerialize or candidate_marker not in {
                  "NIAKVIO_PROVIDER_NATIVE_BLOCKING_ORIGIN_PRIORITY_EXPERIMENT_V29",
                  "NIAKVIO_PROVIDER_NATIVE_HLS_ROOT_RECEIPT_V30",
                  "NIAKVIO_PROVIDER_NATIVE_HLS_RECEIPT_DEDUPE_V31",
              }:
                  raise SystemExit("Brain candidate experiment requires isolated V29, V30 or V31 materialization")
          if target_fixture:
              lab = json.loads(Path(".github/triggers/nuvio-client-lab.json").read_text(encoding="utf-8"))
              fixture_slugs = set()
              stack = [lab]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      slug = value.get("slug")
                      if isinstance(slug, str) and slug.strip():
                          fixture_slugs.add(slug.strip())
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)
              if target_fixture not in fixture_slugs:
                  raise SystemExit(f"unknown native target fixture: {target_fixture}")

          sys.path.insert(0, str((Path.cwd() / "scripts").resolve()))
          from native_manifest_projection import active_provider_manifest
          target_specs = []
          if providers:
              for provider in providers:
                  try:
                      manifest = active_provider_manifest(provider)
                  except ValueError as exc:
                      raise SystemExit(str(exc)) from exc
                  target_specs.append({
                      "provider": provider,
                      "manifest": manifest,
                      "projection": "global" if manifest == "manifest.json" else "vf",
                  })
          else:
              target_specs = [
                  {"provider": "declared-type", "manifest": "manifest.json", "projection": "global"},
                  {"provider": "declared-type", "manifest": "vf/manifest.json", "projection": "vf"},
              ]

          targets = [
              {
                  "device": selected_device,
                  "fixture": target_fixture or "all",
                  "provider": spec["provider"],
                  "manifest": spec["manifest"],
                  "projection": spec["projection"],
                  "residential": residential,
                  "candidateRematerialize": candidate_rematerialize,
                  "candidateRequiredMarker": candidate_marker,
                  "sourceSha": source_sha,
                  "brainCandidateExperiment": brain_candidate_experiment,
              }
              for selected_device in devices
              for spec in target_specs
          ]
          print("targets=" + json.dumps({"include": targets}, separators=(",", ":")))

          PY

  native-corpus:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ${{ matrix.device == 'desktop' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 220
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
      NIAKVIO_TARGET_PROVIDER: ${{ matrix.provider }}
      NIAKVIO_TARGET_MANIFEST: ${{ matrix.manifest }}
      NIAKVIO_TARGET_FIXTURE: ${{ matrix.fixture }}
      NIAKVIO_SOURCE_SHA: ${{ matrix.sourceSha }}
    steps:
      - name: Checkout exact Niakvio generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sourceSha }}
          path: niakvio
          persist-credentials: false

      - name: Validate targeted residential native contract
        run: |
          python3 niakvio/tests/native_residential_transport_targeted_workflow_test.py
          python3 niakvio/tests/waf_exit_route_attestation_test.py
          python3 niakvio/tests/runner_dns_preservation_test.py
          python3 niakvio/tests/native_tv_tmdb_build_capability_test.py

      - name: Build exact targeted provider scope
        if: ${{ matrix.provider != 'declared-type' }}
        shell: bash
        env:
          TARGET_PROVIDER: ${{ matrix.provider }}
          TARGET_MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "niakvio"
          manifest_path = os.environ["TARGET_MANIFEST"].strip()
          manifest = json.loads((root / manifest_path).read_text(encoding="utf-8"))
          wanted = os.environ["TARGET_PROVIDER"].strip().lower()
          row = next(
              (
                  row for row in manifest.get("scrapers") or []
                  if isinstance(row, dict)
                  and str(row.get("id") or "").strip().lower() == wanted
                  and row.get("enabled") is True
              ),
              None,
          )
          if row is None:
              raise SystemExit(f"target provider unavailable: {wanted}")
          actual = str(row["id"]).strip()
          scope = {
              "schemaVersion": 1,
              "providerCount": 1,
              "hubCount": 1,
              "rows": [{"provider": actual, "manifestId": actual}],
          }
          path = root / "automation/native-target-provider-scope.json"
          path.write_text(json.dumps(scope, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"NIAKVIO_PROVIDER_SCOPE_MATRIX={path}\n")
              handle.write(f"NIAKVIO_TARGET_PROVIDER={actual}\n")
              handle.write("NIAKVIO_NATIVE_PLAYER_GATE_BLOCKING=1\n")
          print(f"FIELD_NATIVE_TARGET_SCOPE provider={actual} providers=1")
          print("FIELD_NATIVE_PLAYER_GATE_MODE blocking=true requirement=production_playback_verified")
          PY

      - name: Enable targeted Mobile same-source engine differential
        if: ${{ matrix.device == 'mobile' && matrix.provider != 'declared-type' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NIAKVIO_NATIVE_COMPARE_ENGINES=1" >> "$GITHUB_ENV"
          echo "FIELD_NATIVE_ENGINE_COMPARE_MODE enabled=true client=mobile provider=${{ matrix.provider }} authority=diagnostic-post-auto"

      - name: Require configured residential exit
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TS_OAUTH_CLIENT_ID:-}"
          test -n "${TS_AUDIENCE:-}"
          test -n "${TS_EXIT_NODE:-}"

      - name: Normalize native Tailscale tag
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python for native candidate rematerialization
        if: ${{ matrix.candidateRematerialize == true }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Rematerialize isolated ProviderBase candidate for official TV test
        if: ${{ matrix.candidateRematerialize == true }}
        shell: bash
        env:
          NUVIO_PROVIDER_V3_CONTEXT: workspace
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          NIAKVIO_CANDIDATE_REQUIRED_MARKER: ${{ matrix.candidateRequiredMarker }}
          NIAKVIO_BRAIN_CANDIDATE_EXPERIMENT_JSON: ${{ matrix.brainCandidateExperiment }}
        run: |
          set -euo pipefail
          cd niakvio
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/prepare_native_candidate_remat.py \
            --provider "$NIAKVIO_TARGET_PROVIDER" \
            --manifest "$NIAKVIO_TARGET_MANIFEST" \
            --required-marker "$NIAKVIO_CANDIDATE_REQUIRED_MARKER" \
            --brain-experiment-json "$NIAKVIO_BRAIN_CANDIDATE_EXPERIMENT_JSON" \
            --source-sha "$NIAKVIO_SOURCE_SHA"
          # App repository selection remains a real SHA-pinned HTTPS manifest.
          # Only the diagnostic instrumentation executes the checked local candidate.
          echo "NIAKVIO_MANIFEST_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NIAKVIO_SOURCE_SHA}/${NIAKVIO_TARGET_MANIFEST}" >> "$GITHUB_ENV"
          echo "NIAKVIO_ALLOW_LOCAL_MANIFEST=0" >> "$GITHUB_ENV"
          echo "FIELD_NATIVE_CANDIDATE_REPOSITORY published_manifest_https=true pinned_sha=$NIAKVIO_SOURCE_SHA candidate_asset_local=true playback_authority=false"

      - name: Checkout accepted official client and stage corpus once
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          NUVIO_DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
          NUVIO_MOBILE_SHA: ${{ needs.resolve.outputs.mobile_sha }}
          NUVIO_TV_SHA: ${{ needs.resolve.outputs.tv_sha }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euxo pipefail
          case "$DEVICE" in
            desktop)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
              git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
              git -C nuvio-desktop lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/**" --exclude=""
              touch nuvio-desktop/local.properties
              python3 niakvio/scripts/native_desktop_upstream_test_compat.py nuvio-desktop
              INITIAL_FIXTURE="${NIAKVIO_TARGET_FIXTURE:-interstellar}"
              if [ -z "$INITIAL_FIXTURE" ] || [ "$INITIAL_FIXTURE" = "all" ]; then INITIAL_FIXTURE=interstellar; fi
              python3 niakvio/scripts/prepare_native_corpus_client.py desktop --fixture "$INITIAL_FIXTURE" --workspace "$GITHUB_WORKSPACE" --provider "$NIAKVIO_TARGET_PROVIDER" --manifest "$NIAKVIO_TARGET_MANIFEST"
              ;;
            mobile)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
              git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
              touch nuvio-mobile/local.properties
              INITIAL_FIXTURE="${NIAKVIO_TARGET_FIXTURE:-interstellar}"
              if [ -z "$INITIAL_FIXTURE" ] || [ "$INITIAL_FIXTURE" = "all" ]; then INITIAL_FIXTURE=interstellar; fi
              python3 niakvio/scripts/prepare_native_corpus_client.py mobile --fixture "$INITIAL_FIXTURE" --workspace "$GITHUB_WORKSPACE" --provider "$NIAKVIO_TARGET_PROVIDER" --manifest "$NIAKVIO_TARGET_MANIFEST"
              ;;
            tv)
              git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
              git -C nuvio-tv checkout "$NUVIO_TV_SHA"
              touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
              python3 niakvio/scripts/prepare_native_tv_tmdb_contract.py --repo-root niakvio --client-root nuvio-tv --manifest "$NIAKVIO_TARGET_MANIFEST" --provider "$NIAKVIO_TARGET_PROVIDER"
              INITIAL_FIXTURE="${NIAKVIO_TARGET_FIXTURE:-interstellar}"
              if [ -z "$INITIAL_FIXTURE" ] || [ "$INITIAL_FIXTURE" = "all" ]; then INITIAL_FIXTURE=interstellar; fi
              python3 niakvio/scripts/prepare_native_corpus_client.py tv --fixture "$INITIAL_FIXTURE" --workspace "$GITHUB_WORKSPACE" --provider "$NIAKVIO_TARGET_PROVIDER" --manifest "$NIAKVIO_TARGET_MANIFEST"
              ;;
          esac

      - name: Verify candidate bytes in official TV instrumentation assets
        if: ${{ matrix.candidateRematerialize == true }}
        shell: bash
        env:
          NIAKVIO_CANDIDATE_REQUIRED_MARKER: ${{ matrix.candidateRequiredMarker }}
        run: |
          set -euo pipefail
          python3 niakvio/scripts/prepare_native_candidate_remat.py --verify-staging \
            --provider "$NIAKVIO_TARGET_PROVIDER" \
            --manifest "$NIAKVIO_TARGET_MANIFEST" \
            --required-marker "$NIAKVIO_CANDIDATE_REQUIRED_MARKER" \
            --client-root nuvio-tv
          CANDIDATE_SHA="$(python3 -c 'import json; from pathlib import Path; proof=json.loads(Path("niakvio/automation/native-candidate-remat-proof.json").read_text()); assert proof["officialTvTestAssetByteMatched"] is True; print(proof["candidateJsSha256"])')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "NIAKVIO_NATIVE_CANDIDATE_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "FIELD_NATIVE_CANDIDATE_ORACLE_SELECTED sha256=$CANDIDATE_SHA client=tv oracle=official_plugin_manager_staged_bytes production_playback_authority=false"

      - name: Set up Gradle runtime
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-disabled: true

      - name: Build official macOS native player bridge once
        if: matrix.device == 'desktop'
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop \
            :composeApp:buildMacosPlayerBridge \
            :composeApp:prepareMacosPlayerRuntime \
            --no-configuration-cache --console=plain

      - name: Enable Linux KVM when available
        if: matrix.device != 'desktop'
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm || true
          fi

      - name: Prime Android adb server
        if: matrix.device != 'desktop'
        run: bash niakvio/scripts/prime_android_lab_adb.sh

      - name: Restore Mobile AVD snapshot and matching debug signing key
        if: matrix.device == 'mobile'
        id: avd-cache-mobile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-v6-${{ runner.os }}-mobile-api35-google_apis-x86_64-pixel_2

      - name: Create Mobile AVD snapshot on cache miss
        if: matrix.device == 'mobile' && steps.avd-cache-mobile.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated clean Mobile AVD snapshot."

      - name: Restore TV AVD snapshot and matching debug signing key
        if: matrix.device == 'tv'
        id: avd-cache-tv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-v6-${{ runner.os }}-tv-api31-android-tv-x86-tv_1080p

      - name: Create TV AVD snapshot on cache miss
        if: matrix.device == 'tv' && steps.avd-cache-tv.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated clean TV AVD snapshot."

      - name: Snapshot pre-Tailscale DNS policy and baseline egress
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          dns_state="$RUNNER_TEMP/niakvio-native-dns-state.json"
          egress_state="$RUNNER_TEMP/niakvio-native-exit-proof"
          python3 niakvio/scripts/preserve_runner_dns.py snapshot --state "$dns_state"
          python3 niakvio/scripts/verify_waf_exit_route.py baseline --state "$egress_state"
          echo "NIAKVIO_NATIVE_DNS_STATE=$dns_state" >> "$GITHUB_ENV"
          echo "NIAKVIO_NATIVE_EGRESS_STATE=$egress_state" >> "$GITHUB_ENV"

      # Keep repository checkout, dependency/cache setup and AVD snapshot creation on
      # the normal GitHub runner network. On macOS the Tailscale action configures
      # system DNS after connection even when the daemon receives --accept-dns=false,
      # so connecting earlier can break unrelated dependency resolution. Establish
      # the tailnet only at the native-runtime boundary, then independently attest
      # the requested residential exit before the official client executes.
      - name: Connect native client host to Tailscale
        if: ${{ matrix.residential == true }}
        timeout-minutes: 4
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Restore pre-Tailscale DNS policy before native runtime
        if: ${{ matrix.residential == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$NIAKVIO_NATIVE_DNS_STATE"
          python3 niakvio/scripts/preserve_runner_dns.py restore --state "$NIAKVIO_NATIVE_DNS_STATE"

      - name: Select and attest residential exit immediately before native runtime
        if: ${{ matrix.residential == true }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test -s "$NIAKVIO_NATIVE_EGRESS_STATE"
          route_verified=0
          trap 'if [ "$route_verified" != "1" ]; then python3 niakvio/scripts/verify_waf_exit_route.py clear >/dev/null 2>&1 || true; fi' EXIT
          python3 niakvio/scripts/verify_waf_exit_route.py select --exit-node "$TS_EXIT_NODE" --attempts 3
          python3 niakvio/scripts/verify_waf_exit_route.py verify --state "$NIAKVIO_NATIVE_EGRESS_STATE"
          route_verified=1
          echo "NIAKVIO_NATIVE_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"
          echo "FIELD_NATIVE_RESIDENTIAL_EXIT active=true egress_attested=true provider=${{ matrix.provider }} device=${{ matrix.device }}"
          echo "FIELD_NATIVE_RESIDENTIAL_DNS tailscale_accept_dns=false action_override_restored=true resolver_equivalence=runner_pre_tailnet"

      - name: Execute focused provider in official macOS Desktop runtime
        if: matrix.device == 'desktop'
        shell: bash
        env:
          LC_NUMERIC: C
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          NIAKVIO_PRIMARY_FIXTURE="$NIAKVIO_TARGET_FIXTURE" \
            bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_desktop_suite.sh"

      - name: Execute six works across every provider in isolated Mobile emulator
        if: matrix.device == 'mobile'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_mobile_suite.sh"

      - name: Execute six works across every provider in isolated Android TV emulator
        if: matrix.device == 'tv'
        # Only a source-pinned, single-provider test may exceed the normal
        # 25s corpus budget. This captures the already observed sequential
        # embed fallback (522 after ~20s, HLS success after 26s) rather than
        # declaring provider failure at an arbitrary harness deadline.
        env:
          NIAKVIO_ANDROID_PROVIDER_TIMEOUT_MS: ${{ matrix.provider != 'declared-type' && '60000' || '' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_tv_suite.sh"

      - name: Clear native residential exit and transient network state
        if: ${{ always() && matrix.residential == true }}
        shell: bash
        run: |
          if [ "${NIAKVIO_NATIVE_RESIDENTIAL_EXIT_ACTIVE:-0}" = "1" ]; then python3 niakvio/scripts/verify_waf_exit_route.py clear || true; fi
          rm -f "${NIAKVIO_NATIVE_DNS_STATE:-}" "${NIAKVIO_NATIVE_EGRESS_STATE:-}"

      - name: Diagnose sanitized targeted native evidence for Brain
        if: always()
        shell: bash
        env:
          OFFICIAL_CLIENT_SHA: ${{ matrix.device == 'tv' && needs.resolve.outputs.tv_sha || matrix.device == 'mobile' && needs.resolve.outputs.mobile_sha || needs.resolve.outputs.desktop_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$GITHUB_WORKSPACE/${{ matrix.device }}-native-corpus-"*.log)
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "FIELD_NATIVE_TARGETED_BRAIN_DIAGNOSIS client=${{ matrix.device }} provider=${{ matrix.provider }} files=0 status=no_logs"
            exit 0
          fi
          diagnosed=0
          for log in "${logs[@]}"; do
            base="$(basename "$log" .log)"
            out="$GITHUB_WORKSPACE/${base}-brain.json"
            node niakvio/engine_v2/scripts/diagnose-native-reader.mjs --output "$out" --official-client-sha "$OFFICIAL_CLIENT_SHA" "$log"
            diagnosed=$((diagnosed + 1))
          done
          echo "FIELD_NATIVE_TARGETED_BRAIN_DIAGNOSIS client=${{ matrix.device }} provider=${{ matrix.provider }} files=$diagnosed status=written"

      - name: Upload sanitized native corpus logs
        if: ${{ always() && matrix.candidateRematerialize != true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-corpus-${{ matrix.device }}-${{ matrix.provider }}-${{ matrix.projection }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: |
            ${{ matrix.device }}-native-corpus-*.log
            ${{ matrix.device }}-native-corpus-*-brain.json
            ${{ matrix.device }}-native-frontend-*.log
            native-evidence/${{ matrix.device }}/**
          retention-days: 8
          if-no-files-found: warn

      - name: Upload isolated candidate evidence (never production proof)
        if: ${{ always() && matrix.candidateRematerialize == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-candidate-${{ matrix.device }}-${{ matrix.provider }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: |
            ${{ matrix.device }}-native-corpus-*.log
            ${{ matrix.device }}-native-corpus-*-brain.json
            ${{ matrix.device }}-native-frontend-*.log
            native-evidence/${{ matrix.device }}/**
            niakvio/automation/native-candidate-remat-proof.json
          retention-days: 8
          if-no-files-found: warn

  brain-candidate-feedback:
    # Separate privileged coordinator: native app builds retain read-only tokens.
    # workflow_run chains can terminate before the negative V29 result is learned.
    needs: [resolve, native-corpus]
    if: ${{ always() && needs.resolve.result == 'success' && needs.native-corpus.result != 'cancelled' && inputs.candidate_rematerialize == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch exact completed TV candidate verdict without workflow_run chaining
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TARGETS_JSON: ${{ needs.resolve.outputs.targets }}
        run: |
          set -euo pipefail
          source_sha="$(jq -er '
            .include |
            if length == 1 and .[0].candidateRematerialize == true and .[0].device == "tv"
            then .[0].sourceSha else error("candidate must have exactly one TV scope") end
          ' <<< "$CANDIDATE_TARGETS_JSON")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("native-candidate-tv-"))] | length')"
          if [ "$count" != "1" ]; then
            echo "FIELD_BRAIN_NATIVE_VERDICT_DISPATCH status=blocked_artifacts count=$count" >&2
            exit 1
          fi
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          if [ "$run_sha" != "$source_sha" ]; then
            echo "FIELD_BRAIN_NATIVE_VERDICT_DISPATCH status=blocked_sha_mismatch" >&2
            exit 1
          fi
          gh workflow run brain-android-tv-emulator-feedback.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f candidate_run_id="$GITHUB_RUN_ID" -f candidate_source_sha="$source_sha"
          echo "FIELD_BRAIN_NATIVE_VERDICT_DISPATCH status=dispatched run=$GITHUB_RUN_ID sha=$source_sha publication=false"

  cross-runtime-gate:
    if: ${{ always() && inputs.device == 'all' && inputs.target_providers == '' && inputs.target_fixture == '' }}
    needs: [native-corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact NiakVIO generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: niakvio
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download Desktop extraction-runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-corpus-desktop-declared-type-*-all-${{ github.run_id }}
          merge-multiple: true
          path: cross-runtime/desktop

      - name: Download Mobile extraction-runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-corpus-mobile-declared-type-*-all-${{ github.run_id }}
          merge-multiple: true
          path: cross-runtime/mobile

      - name: Download TV extraction-runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-corpus-tv-declared-type-*-all-${{ github.run_id }}
          merge-multiple: true
          path: cross-runtime/tv

      - name: Gate Desktop Mobile TV runtime divergence
        shell: bash
        run: |
          set -euo pipefail
          node niakvio/scripts/gate_native_cross_client_runtime.cjs \
            --dir "$GITHUB_WORKSPACE/cross-runtime" \
            --require-clients desktop,mobile,tv \
            --min-comparisons 6
