name: TEMP - Final Address Authorities V65C

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-final-domain-seeds-v65c.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Upgrade curated-entry authority and disabled publication support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'V65C_PATCH_MISSING {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          tx='scripts/domain_refresh_transaction_v2.py'
          rep(tx,'from current_provider_scope import active_provider_ids, visible_provider_count',
                 'from current_provider_scope import active_provider_ids, visible_provider_ids, visible_provider_count')
          rep(tx,'    current_provider_ids = active_provider_ids()\n    if not current_provider_ids:',
                 '    current_provider_ids = visible_provider_ids() if args.include_disabled else active_provider_ids()\n    if not current_provider_ids:')
          rep(tx,
              '        old_rel = str(entry.get("filename") or "")\n        old_path = ROOT / old_rel\n        if not old_rel.startswith("providers/") or not old_path.is_file():\n            raise RuntimeError(f"{provider_id}: published provider missing: {old_rel}")',
              '        old_rel = str(entry.get("filename") or "")\n        old_path = ROOT / old_rel\n        if old_rel.startswith("providers/"):\n            publication_dir = "providers"\n        elif old_rel.startswith("provider-disabled/"):\n            publication_dir = "provider-disabled"\n        else:\n            raise RuntimeError(f"{provider_id}: current provider outside managed publication folders: {old_rel}")\n        if not old_path.is_file():\n            raise RuntimeError(f"{provider_id}: published provider missing: {old_rel}")')
          rep(tx,'        new_rel = f"providers/{source_qualified_provider_name(provider_id, old_path, digest)}"',
                 '        new_rel = f"{publication_dir}/{source_qualified_provider_name(provider_id, old_path, digest)}"')
          rep(tx,'    row["direct"] = normalized\n    row["direct_candidates"] = _unique_urls([normalized, old_direct, *old_candidates])',
                 '    row["direct"] = normalized\n    if row.get("curated_entry"):\n        row["declared_terminal"] = normalized\n    row["direct_candidates"] = _unique_urls([normalized, old_direct, *old_candidates])')

          prov='scripts/reconcile_domain_refresh_provenance.py'
          rep(prov,
              '    providers = (ROOT / "providers").resolve()\n    try:\n        path.relative_to(providers)\n    except ValueError as exc:\n        raise SystemExit(f"unsafe provider publication path: {filename}") from exc',
              '    safe_roots = ((ROOT / "providers").resolve(), (ROOT / "provider-disabled").resolve())\n    if not any(_relative_to(path, root) for root in safe_roots):\n        raise SystemExit(f"unsafe provider publication path: {filename}")')
          rep(prov,'def sha256(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n',
                 'def sha256(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\n\ndef _relative_to(path: Path, root: Path) -> bool:\n    try:\n        path.relative_to(root)\n        return True\n    except ValueError:\n        return False\n')
          rep(prov,'        if not filename.startswith("providers/") or len(digest) != 64:',
                 '        if not filename.startswith(("providers/", "provider-disabled/")) or len(digest) != 64:')

          guard='scripts/validate_domain_refresh_non_destructive.py'
          rep(guard,
              '                if path.startswith("providers/"):\n                    allowed_paths.add(path)',
              '                if path.startswith(("providers/", "provider-disabled/")):\n                    allowed_paths.add(path)')
          rep(guard,
              '["git", "diff", "--name-only", "--", "providers/"],',
              '["git", "diff", "--name-only", "--", "providers/", "provider-disabled/"],')

          resolver='scripts/resolve_provider_hubs.py'
          rep(resolver,
              '    for url in cfg.get("direct_candidates") or []:\n        values.append(host(str(url)))',
              '    entry_hosts = curated_entry_hosts(cfg)\n    for url in cfg.get("direct_candidates") or []:\n        if host(str(url)) not in entry_hosts:\n            values.append(host(str(url)))')
          rep(resolver,
              'def exact_allowed_hosts(cfg: dict[str, Any]) -> set[str]:',
              'def curated_entry_hosts(cfg: dict[str, Any]) -> set[str]:\n    values=[]\n    if is_http_url(cfg.get("curated_entry")):\n        values.append(host(str(cfg.get("curated_entry"))))\n    for value in cfg.get("curated_entries") or []:\n        if is_http_url(value): values.append(host(str(value)))\n    return {value for value in values if value}\n\n\ndef exact_allowed_hosts(cfg: dict[str, Any]) -> set[str]:')
          rep(resolver,
              '        target.setdefault("terminal_markers", row.get("terminal_markers") or [])\n        target.setdefault("search_confirmation_runs", int(row.get("search_confirmation_runs") or 2))',
              '        target.setdefault("terminal_markers", row.get("terminal_markers") or [])\n        if is_http_url(row.get("curated_entry")):\n            target["curated_entry"] = str(row.get("curated_entry")).strip()\n        if is_http_url(row.get("declared_terminal")):\n            target["declared_terminal"] = str(row.get("declared_terminal")).strip()\n        target.setdefault("search_confirmation_runs", int(row.get("search_confirmation_runs") or 2))')
          rep(resolver,
              '        direct_values: list[str] = []\n        direct = row.get("direct")',
              '        direct_values: list[str] = []\n        terminal_direct_values: list[str] = []\n        curated_entry = row.get("curated_entry")\n        if is_http_url(curated_entry):\n            direct_values.append(str(curated_entry).strip())\n        declared_terminal = row.get("declared_terminal")\n        if is_http_url(declared_terminal):\n            terminal_direct_values.append(str(declared_terminal).strip())\n            direct_values.append(str(declared_terminal).strip())\n        direct = row.get("direct")')
          rep(resolver,
              '        if is_http_url(direct):\n            direct_values.append(str(direct).strip())',
              '        if is_http_url(direct):\n            terminal_direct_values.append(str(direct).strip())\n            direct_values.append(str(direct).strip())')
          rep(resolver,
              '        allowed.update(host(url) for url in direct_values if host(url))',
              '        allowed.update(host(url) for url in terminal_direct_values if host(url))',1)
          rep(resolver,
              '        allowed.update(host(url) for url in target["direct_candidates"] if host(url))',
              '        entry_hosts = curated_entry_hosts(target)\n        allowed.update(host(url) for url in target["direct_candidates"] if host(url) and host(url) not in entry_hosts)')
          rep(resolver,
              'def discovery_source_hosts(cfg: dict[str, Any]) -> set[str]:\n    """Hosts used only to discover a provider address; never valid terminals."""\n    return {\n        host(str(source.get("url")))\n        for source in cfg.get("sources") or []\n        if source.get("url")\n        and str(source.get("type") or "").strip().casefold() in {"hub", "telegram_public"}\n        and host(str(source.get("url")))\n    }',
              'def discovery_source_hosts(cfg: dict[str, Any]) -> set[str]:\n    """Hosts used only to discover/enter a provider address; never valid terminals."""\n    values = {\n        host(str(source.get("url")))\n        for source in cfg.get("sources") or []\n        if source.get("url")\n        and str(source.get("type") or "").strip().casefold() in {"hub", "telegram_public"}\n        and host(str(source.get("url")))\n    }\n    values.update(curated_entry_hosts(cfg))\n    return values')

          refresh='scripts/refresh_authoritative_hub_domains.py'
          old='''        if not validation.get("ok"):\n            continue\n        terminal = str(validation.get("final_url") or candidate).strip().rstrip("/")'''
          new='''        if not validation.get("ok"):\n            declared = str(cfg.get("declared_terminal") or "").strip().rstrip("/")\n            entry = str(cfg.get("curated_entry") or "").strip().rstrip("/")\n            if declared and entry and candidate.rstrip("/") == declared:\n                hostname = hubresolver.host(declared)\n                blocked = {str(x).casefold().strip(".") for x in cfg.get("blocked_hosts") or []}\n                structurally_safe = (\n                    hubresolver.is_provider_terminal_site_url(declared)\n                    and bool(hostname)\n                    and hostname not in hubresolver.discovery_source_hosts(cfg)\n                    and hostname not in blocked\n                    and not hostname.endswith(hubresolver.SOCIAL_HOST_SUFFIXES + hubresolver.SEARCH_HOST_SUFFIXES + hubresolver.INFRASTRUCTURE_HOST_SUFFIXES)\n                    and hubresolver.same_brand(provider_id, declared, cfg)\n                )\n                if structurally_safe:\n                    item.update({\n                        "status": "site_authoritative",\n                        "reason": "curated_declared_terminal_after_entry_blocked",\n                        "official_site": declared,\n                        "site_final_url": declared,\n                        "selected_source_type": "curated_declared_terminal",\n                        "selected_source": entry,\n                        "candidate_score": row.get("score"),\n                        "terminal_probe_skipped": True,\n                        "site_validations": validations,\n                        "sources": [],\n                        "api_candidates": [],\n                        "api_probes": [],\n                        "validated_api": None,\n                    })\n                    return item\n            continue\n        terminal = str(validation.get("final_url") or candidate).strip().rstrip("/")'''
          rep(refresh,old,new)
          print('V65C_SOURCE_UPGRADE_OK')
          PY

          cat > tests/domain_refresh_curated_entry_declared_fallback_v65_test.py <<'PY'
          import importlib.util,sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          sys.path.insert(0,str(ROOT/'scripts'))
          import refresh_authoritative_hub_domains as refresh
          import resolve_provider_hubs as resolver
          cfg={
            'curated_entry':'https://entry.example/',
            'declared_terminal':'https://provider.example/',
            'direct_candidates':['https://entry.example/','https://provider.example/'],
            'direct_fallback':'https://entry.example/',
            'allowed_terminal_hosts':['provider.example'],
            'aliases':['provider'],
            'sources':[],
          }
          original=resolver.validate_terminal
          try:
            resolver.validate_terminal=lambda pid,cfg,url,timeout: {'url':url,'final_url':url,'status':403,'ok':False,'content_type':'text/html'}
            row=refresh.resolve_authoritative_curated_entry_domain('provider',cfg,{},'quick',1)
          finally:
            resolver.validate_terminal=original
          assert row['status']=='site_authoritative',row
          assert row['official_site']=='https://provider.example',row
          assert row['reason']=='curated_declared_terminal_after_entry_blocked',row
          assert row['terminal_probe_skipped'] is True,row
          assert 'entry.example' in resolver.discovery_source_hosts(cfg)
          assert 'entry.example' not in resolver.exact_allowed_hosts(cfg)
          print('DOMAIN_REFRESH_CURATED_DECLARED_FALLBACK_V65_OK')
          PY

          cat > tests/domain_refresh_include_disabled_publication_v65_test.py <<'PY'
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          tx=(ROOT/'scripts/domain_refresh_transaction_v2.py').read_text(encoding='utf-8')
          prov=(ROOT/'scripts/reconcile_domain_refresh_provenance.py').read_text(encoding='utf-8')
          guard=(ROOT/'scripts/validate_domain_refresh_non_destructive.py').read_text(encoding='utf-8')
          assert 'visible_provider_ids() if args.include_disabled else active_provider_ids()' in tx
          assert 'old_rel.startswith("provider-disabled/")' in tx
          assert 'new_rel = f"{publication_dir}/' in tx
          assert 'provider-disabled' in prov
          assert 'provider-disabled/' in guard
          print('DOMAIN_REFRESH_INCLUDE_DISABLED_PUBLICATION_V65_OK')
          PY
          python tests/domain_refresh_curated_entry_declared_fallback_v65_test.py
          python tests/domain_refresh_include_disabled_publication_v65_test.py
          python tests/domain_refresh_transaction_guard_test.py
          python tests/domain_refresh_static_authority_test.py

      - name: Install user-curated address entry contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          path=Path('provider-hubs.json'); doc=json.loads(path.read_text(encoding='utf-8')); rows=doc['providers']
          def uniq(vals):
              out=[]
              for v in vals:
                  v=str(v or '').strip()
                  if v and v not in out: out.append(v)
              return out
          def host(v): return (urlparse(str(v)).hostname or '').lower()
          def search_sources(row): return [dict(x) for x in row.get('sources') or [] if isinstance(x,dict) and str(x.get('type') or '').lower()=='search']
          def entry(pid,source,terminal):
              row=rows[pid]; old=row.get('direct'); oldc=list(row.get('direct_candidates') or [])
              row['hub']=None; row['resolver']='curated_entry'; row['curated_entry']=source; row['declared_terminal']=terminal; row['direct']=terminal
              row['direct_candidates']=uniq([terminal,old,*oldc])
              row['allowed_terminal_hosts']=uniq([host(terminal),*(row.get('allowed_terminal_hosts') or []),*[host(x) for x in row['direct_candidates'] if host(x)!=host(source)]])
              row['sources']=search_sources(row); row['source']='curated_user_registry'
              row['schema_notes']='Curated entry is probed first; if the runner is blocked before redirect, the curator-declared terminal remains address-authoritative without being treated as playback proof.'
          entry('desiflix','https://desiflix.onl/','https://desiflix.codes/')
          entry('uhdmovies','https://mmodlist.org/?type=uhdmovies','https://uhdmovies.my/')
          entry('animesalt','https://animesalt.ac/','https://animesalt.cx/')
          row=rows['allwish']; old=row.get('direct'); oldc=list(row.get('direct_candidates') or [])
          row['hub']='https://t.me/s/allwishme'; row['resolver']='telegram_description'; row['direct']='https://all-wish.me/'
          row['direct_candidates']=uniq(['https://all-wish.me/',old,*oldc]); row['allowed_terminal_hosts']=uniq(['all-wish.me',*(row.get('allowed_terminal_hosts') or [])])
          row['sources']=[{'type':'telegram_public','url':'https://t.me/s/allwishme','priority':120,'purpose':'Official public Telegram description containing current domain'},*search_sources(row)]
          row['source']='curated_user_registry'
          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > tests/provider_address_authority_v65_test.py <<'PY'
          import json,sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]; sys.path.insert(0,str(ROOT/'scripts'))
          import resolve_provider_hubs as resolver
          rows=json.loads((ROOT/'provider-hubs.json').read_text(encoding='utf-8'))['providers']
          expected={'desiflix':('https://desiflix.onl/','https://desiflix.codes/'),'uhdmovies':('https://mmodlist.org/?type=uhdmovies','https://uhdmovies.my/'),'animesalt':('https://animesalt.ac/','https://animesalt.cx/')}
          merged=resolver.merge_hub_registry(json.loads((ROOT/'provider-overrides.json').read_text(encoding='utf-8')))
          for pid,(entry,terminal) in expected.items():
              row=rows[pid]; assert row['curated_entry']==entry; assert row['declared_terminal'].rstrip('/')==terminal.rstrip('/')
              assert merged[pid]['direct_candidates'][0].rstrip('/')==entry.rstrip('/'), (pid,merged[pid]['direct_candidates'][:3])
              assert resolver.host(entry) not in resolver.exact_allowed_hosts(merged[pid]), pid
              assert resolver.host(terminal) in resolver.exact_allowed_hosts(merged[pid]), pid
          row=rows['allwish']; assert row['resolver']=='telegram_description'; assert str(row['hub']).rstrip('/')=='https://t.me/s/allwishme'; assert str(row['direct']).rstrip('/')=='https://all-wish.me'
          print('PROVIDER_ADDRESS_AUTHORITY_V65_OK')
          PY
          python tests/provider_address_authority_v65_test.py
          python tests/provider_hub_registry_test.py

      - name: Refresh all four including disabled DESIFLIX
        shell: bash
        run: |
          set -euo pipefail
          cp provider-overrides.json "$RUNNER_TEMP/overrides.before.json"
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp provider-v3-materialization.json "$RUNNER_TEMP/material.before.json"
          cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static.before.json"
          cp PROVENANCE.json "$RUNNER_TEMP/provenance.before.json"
          mkdir -p health-output automation/evidence
          python scripts/domain_refresh_transaction_v2.py \
            --provider desiflix --provider uhdmovies --provider animesalt --provider allwish \
            --include-disabled --mode quick --timeout 18 --workers 4 --apply \
            --output health-output/v65c-address-report.json \
            --changes-output health-output/v65c-address-changes.json
          python - <<'PY'
          import json
          r=json.load(open('health-output/v65c-address-report.json',encoding='utf-8')); c=json.load(open('health-output/v65c-address-changes.json',encoding='utf-8'))
          expected={'desiflix':'https://desiflix.codes','uhdmovies':'https://uhdmovies.my','animesalt':'https://animesalt.cx','allwish':'https://all-wish.me'}
          for pid,url in expected.items():
              row=r['providers'].get(pid); print('V65C_DOMAIN',pid,json.dumps(row,sort_keys=True))
              assert row and row.get('status')=='site_authoritative',(pid,row)
              assert str(row.get('official_site') or '').rstrip('/')==url,(pid,row.get('official_site'))
          print('V65C_CHANGES',json.dumps(c,sort_keys=True))
          PY

      - name: Reconcile publication, provenance and non-destructive guards
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v65c-address-changes.json --check
          mapfile -t CHANGED < <(python - <<'PY'
          import json
          d=json.load(open('health-output/v65c-address-changes.json',encoding='utf-8'))
          for p in sorted(set(d.get('changed') or [])): print(p)
          PY
          )
          if [ "${#CHANGED[@]}" -gt 0 ]; then
            ARGS=(); for p in "${CHANGED[@]}"; do ARGS+=(--provider "$p"); done
            python scripts/reconcile_provider_domain_metadata.py --rebuild "${ARGS[@]}"
          fi
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v65c-address-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/audit_provider_v3_static.py
          python scripts/validate_domain_refresh_non_destructive.py --before-overrides "$RUNNER_TEMP/overrides.before.json" --before-manifest "$RUNNER_TEMP/manifest.before.json" --before-materialization "$RUNNER_TEMP/material.before.json" --before-provenance "$RUNNER_TEMP/provenance.before.json" --changes health-output/v65c-address-changes.json
          python scripts/validate_domain_refresh_static_non_destructive.py --before-static "$RUNNER_TEMP/static.before.json" --changes health-output/v65c-address-changes.json

      - name: Probe four providers after domain publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=60; wanted={'desiflix','uhdmovies','animesalt','allwish'}; tasks,_=q.build_tasks(); rows=[]
          for t in tasks:
              if str(t.get('provider_id') or '').casefold() not in wanted: continue
              r=q.run(t); rows.append(r)
              print('V65C_RUNTIME',json.dumps({k:r.get(k) for k in ['provider_id','semantic_type','status','debug_stage','raw','playable','verified','contradictions','duration_ms','debug_fetches']},default=str,sort_keys=True))
          Path('automation/evidence/final-address-authorities-v65.json').write_text(json.dumps({'schema_version':3,'rows':rows},ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          by={p:[] for p in wanted}
          for r in rows: by[str(r.get('provider_id') or '').casefold()].append(r)
          for pid in sorted(wanted):
              assert by[pid], f'missing task {pid}'
              print('V65C_PROVIDER_SUMMARY',pid,[(r.get('semantic_type'),r.get('status'),r.get('verified')) for r in by[pid]])
          expected={'desiflix':'desiflix.codes','uhdmovies':'uhdmovies.my','animesalt':'animesalt.cx','allwish':'all-wish.me'}
          for pid,h in expected.items():
              urls=[str(f.get('url') or '') for r in by[pid] for f in (r.get('debug_fetches') or [])]
              assert any(h in u for u in urls),(pid,h,urls[:20])
          print('V65C_RUNTIME_DOMAIN_ROUTING_OK')
          PY

      - name: Persist V65C verified transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'; git config user.email 'actions@users.noreply.github.com'
          git add scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_provenance.py scripts/validate_domain_refresh_non_destructive.py scripts/resolve_provider_hubs.py scripts/refresh_authoritative_hub_domains.py \
            tests/domain_refresh_curated_entry_declared_fallback_v65_test.py tests/domain_refresh_include_disabled_publication_v65_test.py tests/provider_address_authority_v65_test.py \
            provider-hubs.json provider-overrides.json provider-domain-history.json manifest.json provider-v3-materialization.json automation/provider-v3-static-knowledge.json PROVENANCE.json automation/evidence/final-address-authorities-v65.json \
            'providers/desiflix'*.js 'providers/uhdmovies'*.js 'providers/animesalt'*.js 'providers/allwish'*.js 'provider-disabled/desiflix'*.js 'provider-disabled/uhdmovies'*.js 'provider-disabled/animesalt'*.js 'provider-disabled/allwish'*.js
          if git diff --cached --quiet; then echo 'V65C_PERSIST no material changes'; exit 0; fi
          git commit -m 'fix(domains): support curated entries and disabled rotations'
          git push origin HEAD:fix/non-display-recovery-20260916
