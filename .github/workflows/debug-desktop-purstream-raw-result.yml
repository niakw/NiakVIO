name: Debug Desktop Purstream raw JS result

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-raw-result.yml"

permissions:
  contents: read

jobs:
  raw-result:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage current Purstream
        shell: bash
        run: |
          set -euxo pipefail
          provider_path="$(python3 - <<'PY'
          import json
          data=json.load(open("niakvio/manifest.json",encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          print(row["filename"])
          PY
          )"
          cp "niakvio/$provider_path" "$GITHUB_WORKSPACE/purstream-current.js"
          echo "FIELD_DESKTOP_RAW_PROVIDER path=$provider_path"

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Capture raw JS result in disposable checkout
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("nuvio-desktop/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/host/HostFunctions.kt")
          s=p.read_text()
          pattern=r'''runtime\.function\("__capture_result"\) \{ args ->\s*onResult\(args\.getOrNull\(0\)\?\.toString\(\) \?: "\[\]"\)\s*null\s*\}'''
          replacement='''runtime.function("__capture_result") { args ->
              val raw = args.getOrNull(0)?.toString() ?: "[]"
              System.getenv("NIAKVIO_RAW_RESULT_FILE")?.takeIf { it.isNotBlank() }?.let {
                  java.io.File(it).writeText(raw)
              }
              onResult(raw)
              null
          }'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit("capture patch count="+str(n))
          p.write_text(s2)
          PY
          git -C nuvio-desktop diff --check

      - name: Install focused raw-result test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamRawResultTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamRawResultTest {
              @Test
              fun interstellarRawResult() = runBlocking {
                  PluginRuntime.executePlugin(
                      code = File(System.getenv("GITHUB_WORKSPACE"), "purstream-current.js").readText(),
                      tmdbId = "157336",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "PURSTREAM",
                  )
              }
          }
          KOTLIN

      - name: Execute raw-result probe
        shell: bash
        env:
          NIAKVIO_RAW_RESULT_FILE: ${{ github.workspace }}/purstream-raw-result.txt
        run: |
          set -euxo pipefail
          : > "$NIAKVIO_RAW_RESULT_FILE"
          ./nuvio-desktop/gradlew -p nuvio-desktop :composeApp:desktopTest --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamRawResultTest' --no-build-cache --no-configuration-cache --console=plain
          echo "===== FIELD_DESKTOP_RAW_RESULT_JSON ====="
          cat "$NIAKVIO_RAW_RESULT_FILE"
