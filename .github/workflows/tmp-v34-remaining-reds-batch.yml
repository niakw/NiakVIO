name: TMP - V34 Remaining Reds Batch
# trigger V34

on:
  pull_request:
    branches:
      - tmp/v34-reds-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  remaining-reds:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 -m py_compile scripts/materialize_provider_v3_one.py scripts/certify_provider_playable_lanes.py scripts/provider_base_store.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          python3 tests/provider_patch_quickjs_compat_test.py

      - name: Materialize remaining red targets
        run: |
          set -euo pipefail
          python3 scripts/materialize_provider_v3_one.py allwish
          python3 scripts/materialize_provider_v3_one.py anime-ultime
          python3 scripts/materialize_provider_v3_one.py animesalt
          python3 scripts/materialize_provider_v3_one.py animesultra
          python3 scripts/materialize_provider_v3_one.py flemmix
          python3 scripts/materialize_provider_v3_one.py kehflix
          python3 scripts/materialize_provider_v3_one.py moviebox
          python3 scripts/materialize_provider_v3_one.py movieshunt
          python3 scripts/materialize_provider_v3_one.py moviesmod
          python3 scripts/materialize_provider_v3_one.py persianstremio
          python3 scripts/materialize_provider_v3_one.py uhdmovies
          python3 scripts/materialize_provider_v3_one.py vidlove
          python3 scripts/materialize_provider_v3_one.py voiranime
          python3 scripts/materialize_provider_v3_one.py wookafr
          python3 scripts/materialize_provider_v3_one.py yflix

      - name: Certify remaining red targets in parallel
        run: |
          set -euo pipefail
          set +e
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider allwish \
            --provider anime-ultime \
            --provider animesalt \
            --provider animesultra \
            --provider flemmix \
            --provider kehflix \
            --provider moviebox \
            --provider movieshunt \
            --provider moviesmod \
            --provider persianstremio \
            --provider uhdmovies \
            --provider vidlove \
            --provider voiranime \
            --provider wookafr \
            --provider yflix \
            --candidate-limit 8 \
            --timeout 30 \
            --workers 12 \
            --seed "v34-reds-${GITHUB_RUN_ID}" \
            --output health-output/v34-reds.json
          rc=$?
          set -e
          echo "FIELD_V34_CERT_RC rc=$rc"

      - name: Summarize V34
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('health-output/v34-reds.json').read_text())
          green=[]
          for row in j.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              if gl: green.append(row.get('providerId'))
              stages=sorted({str(a.get('debugStage') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
              hosts=sorted({str(n.get('host') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
              print('FIELD_V34_RESULT',
                    'provider='+str(row.get('providerId')),
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower(),
                    'stages='+('|'.join(stages) or '-'),
                    'hosts='+('|'.join(hosts) or '-'))
          print('FIELD_V34_GREEN count=%d/%d providers=%s'%(len(green),len(j.get('providers') or []),','.join(sorted(green)) or 'none'))
          PY

      - name: Upload V34 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v34-reds-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
