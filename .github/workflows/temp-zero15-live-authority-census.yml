name: TEMP - ZERO15 live authority census

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-zero15-live-authority-census.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current declared authorities for all ZERO15 providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, socket, ssl, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          providers=['4khdhub','allanime','allwish','anikototv','anime-ultime','animesalt','animetsu','flemmix','fullanime','moviebox','moviesmod','showbox','vidfast','vidlove','vostfree']
          overrides=json.loads(Path('provider-overrides.json').read_text())
          knowledge=json.loads(Path('automation/provider-v3-static-knowledge.json').read_text())
          patches=overrides.get('provider_patches',{})
          caps=overrides.get('provider_capabilities',{})
          kproviders=knowledge.get('providers',{})
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'

          def root(url):
              try:
                  p=urllib.parse.urlparse(str(url))
                  if p.scheme in ('http','https') and p.netloc:
                      return f'{p.scheme}://{p.netloc}'
              except Exception: pass
              return ''

          def authorities(pid):
              row=patches.get(pid,{}) if isinstance(patches.get(pid),dict) else {}
              cap=caps.get(pid,{}) if isinstance(caps.get(pid),dict) else {}
              k=kproviders.get(pid,{}) if isinstance(kproviders.get(pid),dict) else {}
              model=k.get('model',{}) if isinstance(k.get('model'),dict) else {}
              vals=[]
              for v in [row.get('official_site'),model.get('officialSite'),model.get('knownSite')]:
                  if v: vals.append(v)
              for key in ('proof_search_bases','learned_routes','candidate_learned_routes'):
                  val=row.get(key)
                  if isinstance(val,list): vals.extend(val)
              for key in ('observed_origins','origins'):
                  val=cap.get(key) if key=='observed_origins' else model.get(key)
                  if isinstance(val,list): vals.extend(val)
              out=[]
              for v in vals:
                  r=root(v)
                  if r and r not in out: out.append(r)
              return out[:10]

          def probe(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/json;q=0.9,*/*;q=0.8'})
              try:
                  with urllib.request.urlopen(req,timeout=12,context=ssl.create_default_context()) as r:
                      body=r.read(2048)
                      return {'url':url,'status':int(r.status),'final':r.geturl(),'type':r.headers.get('content-type'),'bytes':len(body),'error':None}
              except urllib.error.HTTPError as e:
                  return {'url':url,'status':int(e.code),'final':e.geturl(),'type':e.headers.get('content-type') if e.headers else None,'bytes':0,'error':'http'}
              except Exception as e:
                  return {'url':url,'status':0,'final':url,'type':None,'bytes':0,'error':type(e).__name__+':'+str(e)[:180]}

          jobs=[]
          for pid in providers:
              auth=authorities(pid)
              if not auth: jobs.append((pid,''))
              else:
                  for url in auth: jobs.append((pid,url))
          results={pid:[] for pid in providers}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              futs={ex.submit(probe,url):(pid,url) for pid,url in jobs if url}
              for fut in concurrent.futures.as_completed(futs):
                  pid,_=futs[fut]
                  results[pid].append(fut.result())
          summary=[]
          for pid in providers:
              rows=results[pid]
              reachable=[r for r in rows if r['status'] in range(200,400) or r['status'] in (401,403,429)]
              good=[r for r in rows if 200 <= r['status'] < 400]
              blocked=[r for r in rows if r['status'] in (401,403,429)]
              if good: cls='reachable'
              elif blocked: cls='anti_bot_or_auth'
              elif rows: cls='network_or_dead'
              else: cls='no_declared_authority'
              item={'provider':pid,'class':cls,'authorities':rows}
              summary.append(item)
              print('ZERO15_AUTH '+json.dumps(item,ensure_ascii=False))
          Path('automation/zero15-live-authority-census.json').write_text(json.dumps({'providers':summary},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero15-live-authority-census-${{ github.run_id }}
          path: automation/zero15-live-authority-census.json
          retention-days: 14
          if-no-files-found: error
