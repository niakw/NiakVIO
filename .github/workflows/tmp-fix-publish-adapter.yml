name: FIX - Publish activation adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-publish-adapter.yml'

permissions:
  contents: write

jobs:
  fix:
    name: FIX - Publish activation adapter only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Patch stale validator calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sync.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'python scripts/validate_activation_preservation.py'
          new = 'python scripts/activation_preservation_core_rehash.py'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 legacy activation validator calls, got {count}')
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/sync_atomic_publication_test.py')
          text = test.read_text(encoding='utf-8')
          old = 'python scripts/validate_activation_preservation.py'
          new = 'python scripts/activation_preservation_core_rehash.py'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 legacy activation validator anchors in atomic test, got {count}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate only affected contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/activation_preservation_core_rehash_test.py
          python tests/sync_atomic_publication_test.py
          python -m py_compile scripts/activation_preservation_core_rehash.py

      - name: Self-clean and reseal release hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-publish-adapter.yml
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit targeted fix without restarting provider pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sync.yml tests/sync_atomic_publication_test.py \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json \
            .github/workflows/tmp-fix-publish-adapter.yml
          git commit -m 'fix: use Core-rehash-aware activation preservation [skip ci]'
          git fetch origin main
          git rebase origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
