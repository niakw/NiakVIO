name: TEMP - AniKoto search shape

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-anikoto-search-shape.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect sanitized search result anchors
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          url='https://anikototv.to/ajax/anime/search?keyword=death+note'
          req=urllib.request.Request(url,headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36',
            'Accept':'application/json,text/plain,*/*','X-Requested-With':'XMLHttpRequest','Referer':'https://anikototv.to/'})
          with urllib.request.urlopen(req,timeout=18) as r:data=json.loads(r.read().decode('utf-8','replace'))
          result=data.get('result') or {}
          html=result.get('html') if isinstance(result,dict) else str(result)
          print('ANIKOTO_SEARCH_META '+json.dumps({'resultType':type(result).__name__,'htmlBytes':len((html or '').encode()),'topKeys':sorted(data.keys()),'resultKeys':sorted(result.keys()) if isinstance(result,dict) else []},separators=(',',':')))
          rows=[]
          for m in re.finditer(r'<a\b([^>]*)>([\s\S]*?)</a>',html or '',re.I):
            attrs=m.group(1); inner=m.group(2)
            hm=re.search(r'href=["\']([^"\']+)',attrs,re.I)
            if not hm: continue
            href=hm.group(1)
            txt=' '.join(re.sub(r'<[^>]+>',' ',inner).split())
            title=''
            for key in ['title','data-title','aria-label']:
              tm=re.search(key+r'=["\']([^"\']+)',attrs,re.I)
              if tm: title=tm.group(1); break
            im=re.search(r'<img\b([^>]*)>',inner,re.I)
            imgAlt=''
            if im:
              am=re.search(r'alt=["\']([^"\']+)',im.group(1),re.I)
              if am: imgAlt=am.group(1)
            rows.append({'href':href,'text':txt[:120],'title':title[:120],'imgAlt':imgAlt[:120],'attrs':sorted(set(re.findall(r'\b(data-[a-z0-9_-]+|title|aria-label|class)=',attrs,re.I)))})
          print('ANIKOTO_SEARCH_ROWS '+json.dumps(rows[:30],ensure_ascii=False,separators=(',',':')))
          # Also surface short outer blocks containing exact Death Note href, sanitized.
          idx=(html or '').lower().find('death-note-fc8mq')
          block=(html or '')[max(0,idx-500):idx+900] if idx>=0 else ''
          block=re.sub(r'https?://[^"\'<> ]+','<url>',block)
          print('ANIKOTO_SEARCH_EXACT_BLOCK '+json.dumps(' '.join(block.split())[:1200],ensure_ascii=False))
          PY
