name: Finalize README refresh on current main

on:
  push:
    branches:
      - docs/readme-generic-engine-v2
    paths:
      - .github/triggers/readme-refresh-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/tmp-readme-refresh-v2.yml
          rm -f .github/triggers/readme-refresh-v2
      - name: Refresh release hashes on current main state
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
      - name: Run repository regression suite
        run: npm test
      - name: Commit exact candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: refresh README runtime documentation"
      - name: Re-test committed candidate
        run: |
          candidate=$(git rev-parse HEAD)
          git worktree add --detach ../candidate "$candidate"
          cd ../candidate
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git diff --exit-code
      - name: Push validated branch
        run: git push origin HEAD:docs/readme-generic-engine-v2
