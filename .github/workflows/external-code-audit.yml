name: External Code Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-code-audit
  cancel-in-progress: true

jobs:
  collect:
    name: Export AI-readable audit logs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPO_SLUG: niakw/NiakVIO
      OUT: audit/ai-external
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
      DEEPSOURCE_PASS: ${{ secrets.DEEPSOURCE_PASS }}
      DEEPSOURCE_REPORT_URL: https://app.deepsource.com/report/7497cac1-bd35-47f8-ac92-3503e0a34c65
      CODESCENE_TOKEN: ${{ secrets.CODESCENE_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare export directory
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDITED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$OUT"/{sonar,deepsource,codescene}
          find "$OUT/sonar" "$OUT/deepsource" "$OUT/codescene" -type f -delete

      - name: Export SonarQube Cloud public project data
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          out = pathlib.Path(os.environ['OUT']) / 'sonar'
          org = os.environ.get('SONAR_KEY', '').strip()
          base = 'https://sonarcloud.io'
          status = {'source':'SonarQube Cloud','ok':False,'errors':[],'access_mode':'public organization key'}

          def save(name, value):
              (out/name).write_text(json.dumps(value, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          def get(path, params=None):
              url = base + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              try:
                  req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'NiakVIO-external-audit/1.0'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  return None, f'HTTP {e.code}'
              except Exception as e:
                  return None, type(e).__name__

          if not org:
              status['errors'].append('SONAR_KEY repository secret is missing/unavailable')
              save('status.json', status)
              raise SystemExit(0)

          # Public Sonar organization/project discovery. SONAR_KEY is never used
          # as an Authorization header or bearer token.
          projects, err = get('/api/components/search_projects', {'organization':org,'ps':500,'p':1})
          if err or not isinstance(projects, dict):
              projects, err = get('/api/components/search', {'organization':org,'qualifiers':'TRK','ps':500,'p':1})
          if err or not isinstance(projects, dict):
              status['errors'].append('public project discovery failed: '+str(err))
              save('status.json', status)
              raise SystemExit(0)

          save('projects.json', projects)
          components = projects.get('components', [])
          matches = [p for p in components if 'niakvio' in str(p.get('name','')).lower() or 'niakvio' in str(p.get('key','')).lower()]
          project = matches[0] if matches else (components[0] if len(components) == 1 else None)
          if not project:
              status['errors'].append('NiakVIO project not found in public organization project list')
              status['project_count'] = len(components)
              save('status.json', status)
              raise SystemExit(0)

          project_key = project.get('key')
          status['project'] = project.get('name') or project_key
          status['project_key'] = project_key

          issues = []
          for page in range(1, 201):
              payload, ierr = get('/api/issues/search', {
                  'componentKeys':project_key,'resolved':'false','ps':500,'p':page
              })
              if ierr or not isinstance(payload, dict):
                  status['errors'].append('public issues export unavailable: '+str(ierr))
                  break
              batch = payload.get('issues', [])
              issues.extend(batch)
              total = (payload.get('paging') or {}).get('total', payload.get('total', len(issues)))
              if not batch or len(issues) >= int(total or 0):
                  break
          save('issues.json', issues)

          hotspots, herr = get('/api/hotspots/search', {'projectKey':project_key,'ps':500})
          save('hotspots.json', hotspots if hotspots is not None else {'hotspots':[],'unavailable':True,'error':herr})

          measures, merr = get('/api/measures/component', {
              'component':project_key,
              'metricKeys':'bugs,vulnerabilities,security_hotspots,code_smells,duplicated_lines_density,cognitive_complexity,complexity,sqale_index,reliability_rating,security_rating,sqale_rating,ncloc,coverage'
          })
          save('measures.json', measures if measures is not None else {'unavailable':True,'error':merr})

          analyses, aerr = get('/api/project_analyses/search', {'project':project_key,'ps':100})
          save('analyses.json', analyses if analyses is not None else {'unavailable':True,'error':aerr})

          sev = Counter(str(i.get('severity','UNKNOWN')) for i in issues)
          typ = Counter(str(i.get('type','UNKNOWN')) for i in issues)
          lines = [
              '# SonarQube Cloud audit','',
              '- Access: public Sonar organization/project; no Sonar login or API token used.',
              f'- Project: `{status["project"]}`',
              f'- Project key: `{project_key}`',
              f'- Open findings exported: **{len(issues)}**',
              '- Severity: '+(', '.join(f'`{k}` {v}' for k,v in sev.most_common()) or 'none'),
              '- Type: '+(', '.join(f'`{k}` {v}' for k,v in typ.most_common()) or 'none'),
              '', '## Findings',''
          ]
          for i in issues:
              comp = str(i.get('component','?'))
              line = i.get('line') or (i.get('textRange') or {}).get('startLine')
              loc = f'{comp}:{line}' if line else comp
              msg = ' '.join(str(i.get('message','')).split())
              lines.append(f'- `{loc}` **{i.get("severity","?")} / {i.get("type","?")}** `{i.get("rule","?")}` — {msg}')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')

          # Project discovery itself is enough to prove that SONAR_KEY is the
          # right public organization reference. Individual public endpoints may
          # expose more or less data depending on Sonar Cloud policy.
          status['ok'] = True
          status['finding_count'] = len(issues)
          status['public_measures_available'] = measures is not None
          status['public_hotspots_available'] = hotspots is not None
          save('status.json', status)
          PY

      - name: Install browser for DeepSource shared report
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DS_BROWSER="$RUNNER_TEMP/deepsource-browser"
          mkdir -p "$DS_BROWSER"
          cd "$DS_BROWSER"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
          echo "DS_BROWSER=$DS_BROWSER" >> "$GITHUB_ENV"

      - name: Export DeepSource shared report
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "${DEEPSOURCE_PASS:-}" ]; then
            printf '{"source":"DeepSource","ok":false,"access_mode":"shared report + password","errors":["DEEPSOURCE_PASS repository secret is missing/unavailable"]}\n' > "$OUT/deepsource/status.json"
            exit 0
          fi
          if [ -z "${DS_BROWSER:-}" ] || [ ! -d "$DS_BROWSER/node_modules/playwright" ]; then
            printf '{"source":"DeepSource","ok":false,"access_mode":"shared report + password","errors":["Playwright browser unavailable"]}\n' > "$OUT/deepsource/status.json"
            exit 0
          fi

          cd "$DS_BROWSER"
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const reportUrl = process.env.DEEPSOURCE_REPORT_URL;
          const password = process.env.DEEPSOURCE_PASS || '';
          const out = path.join(process.env.GITHUB_WORKSPACE, process.env.OUT, 'deepsource');
          fs.mkdirSync(out, { recursive: true });
          const status = {source:'DeepSource', ok:false, access_mode:'shared report + password', errors:[]};
          const captured = [];

          function safeUrl(raw) {
            try {
              const u = new URL(raw);
              for (const key of [...u.searchParams.keys()]) {
                if (/pass|password|token|secret|key|auth/i.test(key)) u.searchParams.set(key, '[REDACTED]');
              }
              return u.toString();
            } catch { return raw; }
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({userAgent:'NiakVIO-external-audit/1.0'});
            const page = await context.newPage();

            page.on('response', async (res) => {
              try {
                const ct = (res.headers()['content-type'] || '').toLowerCase();
                if (!ct.includes('json') || !res.url().includes('deepsource')) return;
                const data = await res.json();
                captured.push({url:safeUrl(res.url()), status:res.status(), data});
              } catch {}
            });

            try {
              await page.goto(reportUrl, {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForTimeout(1500);

              const pwd = page.locator('input[type="password"], input[name*="password" i]').first();
              if (await pwd.count()) {
                await pwd.fill(password);
                const form = pwd.locator('xpath=ancestor::form[1]');
                const submit = form.locator('button[type="submit"], input[type="submit"]').first();
                if (await submit.count()) await submit.click();
                else await pwd.press('Enter');
                await page.waitForTimeout(2500);
                await page.waitForLoadState('networkidle', {timeout:20000}).catch(()=>{});
              }

              const stillLocked = await page.locator('input[type="password"], input[name*="password" i]').count();
              const text = await page.locator('body').innerText().catch(()=> '');
              fs.writeFileSync(path.join(out,'report.txt'), text + '\n', 'utf8');
              fs.writeFileSync(path.join(out,'network-json.json'), JSON.stringify(captured, null, 2) + '\n', 'utf8');

              if (stillLocked) {
                status.errors.push('shared report remained password-locked after submitting DEEPSOURCE_PASS');
              } else if (text.trim().length < 80) {
                status.errors.push('shared report opened but returned too little readable content');
              } else {
                status.ok = true;
              }
              status.report_url = reportUrl;
              status.readable_characters = text.length;
              status.json_responses = captured.length;

              const md = [
                '# DeepSource shared report','',
                '- Access: password-protected shared report; no DeepSource account login or API token used.',
                `- Report: \`${reportUrl}\``,
                `- Readable characters: **${text.length}**`,
                `- Captured JSON responses: **${captured.length}**`,
                '', '## Report text','', text
              ].join('\n');
              fs.writeFileSync(path.join(out,'summary.md'), md + '\n', 'utf8');
            } catch (e) {
              status.errors.push(`${e.name || 'Error'}: ${e.message || String(e)}`);
            } finally {
              fs.writeFileSync(path.join(out,'status.json'), JSON.stringify(status, null, 2) + '\n', 'utf8');
              await browser.close();
            }
          })().catch((e) => {
            status.errors.push(`${e.name || 'Error'}: ${e.message || String(e)}`);
            fs.writeFileSync(path.join(out,'status.json'), JSON.stringify(status, null, 2) + '\n', 'utf8');
            process.exitCode = 0;
          });
          JS

      - name: Export CodeScene REST API data
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          out = pathlib.Path(os.environ['OUT'])/'codescene'
          token = os.environ.get('CODESCENE_TOKEN','').strip()
          base = 'https://api.codescene.io/v2'
          status = {'source':'CodeScene','ok':False,'errors':[],'access_mode':'REST API bearer token'}

          def save(name, value):
              (out/name).write_text(json.dumps(value, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          def get(path, params=None):
              url = base + path
              if params: url += '?' + urllib.parse.urlencode(params)
              try:
                  req = urllib.request.Request(url, headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                  with urllib.request.urlopen(req, timeout=45) as r: return json.load(r), None
              except urllib.error.HTTPError as e: return None, f'HTTP {e.code}'
              except Exception as e: return None, type(e).__name__

          if not token:
              status['errors'].append('CODESCENE_TOKEN repository secret is missing/unavailable')
              save('status.json', status)
              raise SystemExit(0)

          projects, err = get('/projects')
          if projects is None:
              status['errors'].append('project discovery failed: '+str(err))
              save('status.json', status)
              raise SystemExit(0)
          save('projects.json', projects)

          if isinstance(projects,list): plist=projects
          elif isinstance(projects,dict): plist=projects.get('projects') or projects.get('items') or projects.get('data') or []
          else: plist=[]
          if isinstance(plist,dict): plist=list(plist.values())
          matches=[p for p in plist if isinstance(p,dict) and 'niakvio' in json.dumps(p).lower()]
          project=matches[0] if matches else (plist[0] if plist and isinstance(plist[0],dict) else None)
          if not project:
              status['errors'].append('NiakVIO project not found')
              save('status.json', status)
              raise SystemExit(0)
          pid=project.get('id') or project.get('project_id')
          if pid is None:
              status['errors'].append('project id not returned by API')
              save('status.json', status)
              raise SystemExit(0)
          status['project']=project.get('name') or str(pid)

          latest, err=get(f'/projects/{pid}/analyses/latest')
          save('analysis-latest.json', latest if latest is not None else {'unavailable':True,'error':err})

          files=[]
          for page in range(1,201):
              payload, ferr=get(f'/projects/{pid}/analyses/latest/files', {'page':page,'page_size':100,'order_by':'code_health'})
              if payload is None:
                  status['errors'].append('files export: '+str(ferr)); break
              batch=payload.get('files',[]) if isinstance(payload,dict) else (payload if isinstance(payload,list) else [])
              files.extend(batch)
              if len(batch)<100: break
          save('files.json', files)

          hotspots, err=get(f'/projects/{pid}/analyses/latest/hotspots')
          save('hotspots.json', hotspots if hotspots is not None else {'hotspots':[],'unavailable':True,'error':err})

          arch=None
          for endpoint in ('architecture/hotspots','architectural-hotspots','architecture-hotspots'):
              arch, aerr=get(f'/projects/{pid}/analyses/latest/{endpoint}')
              if arch is not None: break
          save('architecture-hotspots.json', arch if arch is not None else {'unavailable':True})

          latest_summary = latest.get('summary',{}) if isinstance(latest,dict) else {}
          high = latest.get('high_level_metrics',{}) if isinstance(latest,dict) else {}
          lines=['# CodeScene audit','',f'- Project: `{status["project"]}`',f'- File metrics exported: **{len(files)}**']
          if high:
              lines += [f'- Code Health weighted average: `{high.get("code_health_weighted_average_current")}`',
                        f'- Hotspot score: `{high.get("current_score")}`']
          if latest_summary:
              lines += [f'- Files with Code Health: `{latest_summary.get("files_with_code_health")}`']
          lines += ['', '## Files','']
          for f in files:
              if not isinstance(f,dict): continue
              name=f.get('name') or f.get('path') or '?'
              lines.append(f'- `{name}` — changes `{f.get("change_frequency","?")}`; defects `{f.get("number_of_defects","?")}`; LOC `{f.get("lines_of_code","?")}`; Code Health `{f.get("code_health","?")}`')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          status['ok']=True
          status['file_count']=len(files)
          save('status.json',status)
          PY

      - name: Build AI index
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib, datetime
          root=pathlib.Path(os.environ['OUT'])
          statuses=[]
          for name in ('sonar','deepsource','codescene'):
              try: statuses.append(json.loads((root/name/'status.json').read_text(encoding='utf-8')))
              except Exception: statuses.append({'source':name,'ok':False,'errors':['status unavailable']})
          lines=['# External code-audit status','',f'Generated from `{os.environ["REPO_SLUG"]}` at commit `{os.environ.get("AUDITED_SHA","")}`.','',
                 '| Source | Status | Findings/files | Access | Notes |','|---|---:|---:|---|---|']
          for s in statuses:
              count=s.get('finding_count',s.get('file_count',s.get('json_responses','—')))
              notes='; '.join(s.get('errors') or []) or 'OK'
              lines.append(f'| {s.get("source","?")} | {"OK" if s.get("ok") else "PARTIAL/ERROR"} | {count} | {s.get("access_mode","?")} | {notes} |')
          lines += ['', '## AI reading order','',
                    '1. Read `STATUS.md`.','2. Read each source `summary.md` when available.','3. Open raw JSON/text for exact fields/context.','',
                    '> Evidence only: no external autofix is applied automatically.']
          (root/'STATUS.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          meta={'repository':os.environ['REPO_SLUG'],'sha':os.environ.get('AUDITED_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit refreshed audit exports safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/ai-external-export"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp -a "$OUT"/. "$SNAPSHOT"/

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$OUT"
            find "$OUT" -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
            cp -a "$SNAPSHOT"/. "$OUT"/
            git add "$OUT"

            if git diff --cached --quiet; then
              echo 'No audit export changes.'
              exit 0
            fi

            git commit -m 'chore(audit): refresh external AI audit logs [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; retrying ($attempt/3)."
          done

          echo 'Unable to publish refreshed audit exports after 3 attempts.' >&2
          exit 1
