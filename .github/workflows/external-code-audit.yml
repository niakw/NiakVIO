name: External Code Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Manual refresh marker only: normal repository pushes do not trigger this workflow.
      - audit/ai-external/.refresh-request
  schedule:
    # Weekly refresh every Sunday at 04:17 UTC.
    - cron: '17 4 * * 0'

permissions:
  contents: write

concurrency:
  group: external-code-audit
  cancel-in-progress: true

jobs:
  collect:
    name: Refresh services and export AI-readable audit logs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPO_SLUG: niakw/NiakVIO
      OUT: audit/ai-external
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
      DEEPSOURCE_API: ${{ secrets.DEEPSOURCE_API }}
      CODESCENE_TOKEN: ${{ secrets.CODESCENE_TOKEN }}
      EXTERNAL_REFRESH_WAIT_SECONDS: '900'
      EXTERNAL_REFRESH_POLL_SECONDS: '15'

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare export directory
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDITED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$OUT"/{sonar,deepsource,codescene}
          find "$OUT/sonar" "$OUT/deepsource" "$OUT/codescene" -type f -delete

      - name: Request fresh Sonar / DeepSource / CodeScene analyses
        continue-on-error: true
        run: python3 scripts/external_audit/request_refresh.py

      - name: Export SonarQube Cloud public project data
        continue-on-error: true
        run: python3 scripts/external_audit/sonar.py

      - name: Export DeepSource GraphQL API data
        continue-on-error: true
        run: python3 scripts/external_audit/deepsource.py

      - name: Export CodeScene REST API data
        continue-on-error: true
        run: python3 scripts/external_audit/codescene.py

      - name: Build AI index
        if: always()
        run: python3 scripts/external_audit/build_index.py

      - name: Commit refreshed audit exports safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/ai-external-export"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp -a "$OUT"/. "$SNAPSHOT"/

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$OUT"
            find "$OUT" -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
            cp -a "$SNAPSHOT"/. "$OUT"/
            git add "$OUT"

            if git diff --cached --quiet; then
              echo 'No audit export changes.'
              exit 0
            fi

            git commit -m 'chore(audit): refresh external AI audit logs [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; retrying ($attempt/3)."
          done

          echo 'Unable to publish refreshed audit exports after 3 attempts.' >&2
          exit 1
