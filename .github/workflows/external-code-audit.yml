name: SEC - External Code Audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repository ref to snapshot alongside external audit exports
        required: false
        default: main
        type: string
      publish:
        description: Publish refreshed exports back to main (main ref only)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - audit/ai-external/.refresh-request
      - .github/workflows/external-code-audit.yml
      - scripts/external_audit/**
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read

concurrency:
  group: external-code-audit
  cancel-in-progress: true

jobs:
  collect:
    name: Refresh services and export AI-readable audit logs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      REPO_SLUG: niakw/NiakVIO
      OUT: audit/ai-external
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
      DEEPSOURCE_API: ${{ secrets.DEEPSOURCE_API }}
      CODESCENE_TOKEN: ${{ secrets.CODESCENE_TOKEN }}
      EXTERNAL_REFRESH_WAIT_SECONDS: '900'
      EXTERNAL_REFRESH_POLL_SECONDS: '15'
      AUDIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
    steps:
      - name: Checkout requested audit snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.AUDIT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare export directory
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDITED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$OUT"/{sonar,deepsource,codescene}
          find "$OUT/sonar" "$OUT/deepsource" "$OUT/codescene" -type f -delete

      - name: Request fresh Sonar / DeepSource / CodeScene analyses
        continue-on-error: true
        run: python3 scripts/external_audit/request_refresh.py

      - name: Export SonarQube Cloud public project data
        continue-on-error: true
        run: python3 scripts/external_audit/sonar.py

      - name: Export DeepSource GraphQL API data
        continue-on-error: true
        run: python3 scripts/external_audit/deepsource.py

      - name: Export CodeScene REST API data
        continue-on-error: true
        run: python3 scripts/external_audit/codescene.py

      - name: Build AI index
        if: always()
        run: python3 scripts/external_audit/build_index.py

      - name: Classify maintained-source findings
        if: always()
        run: python3 scripts/external_audit/classify_findings.py --root "$OUT" --strict

      - name: Require complete exact-SHA external snapshot
        if: always()
        run: python3 scripts/external_audit/validate_snapshot.py

      - name: Upload candidate audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-code-audit-${{ github.run_id }}
          path: audit/ai-external
          retention-days: 21
          if-no-files-found: error

  publish:
    name: Publish explicitly requested audit evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main for explicit publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: external-code-audit-${{ github.run_id }}
          path: checked-audit

      - name: Commit explicitly requested audit exports
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/ai-external-export"
          mkdir -p "$SNAPSHOT"
          cp -a checked-audit/. "$SNAPSHOT"/

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit/ai-external
            find audit/ai-external -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
            cp -a "$SNAPSHOT"/. audit/ai-external/
            git add audit/ai-external

            if git diff --cached --quiet; then
              echo 'No audit export changes.'
              exit 0
            fi

            git commit -m 'chore(audit): refresh external AI audit logs [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; retrying ($attempt/3)."
          done

          echo 'Unable to publish refreshed audit exports after 3 attempts.' >&2
          exit 1
