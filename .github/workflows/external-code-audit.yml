name: External Code Audit

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/external-code-audit.yml

permissions:
  contents: write

concurrency:
  group: external-code-audit
  cancel-in-progress: false

jobs:
  collect:
    name: Export AI-readable audit logs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_SLUG: niakw/NiakVIO
      OUT: audit/ai-external
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
      DEEPSOURCE_PASS: ${{ secrets.DEEPSOURCE_PASS }}
      CODESCENE_TOKEN: ${{ secrets.CODESCENE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare export directory
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{sonar,deepsource,codescene}
          find "$OUT/sonar" "$OUT/deepsource" "$OUT/codescene" -type f -delete

      - name: Export SonarQube Cloud
        continue-on-error: true
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          out = pathlib.Path(os.environ['OUT']) / 'sonar'
          key = os.environ.get('SONAR_KEY', '').strip()
          base = 'https://sonarcloud.io'
          status = {'source':'SonarQube Cloud','ok':False,'errors':[]}

          def save(name, value):
              (out/name).write_text(json.dumps(value, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          def get(path, params=None, token=None):
              url = base + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              headers = {'Accept':'application/json'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  return None, f'HTTP {e.code}'
              except Exception as e:
                  return None, type(e).__name__

          if not key:
              status['errors'].append('SONAR_KEY repository secret is missing/unavailable')
              save('status.json', status)
              raise SystemExit(0)

          projects, err = get('/api/projects/search', {'organization':key,'ps':500})
          auth_token = None
          if err or not isinstance(projects, dict) or 'components' not in projects:
              projects, err = get('/api/projects/search', {'q':'NiakVIO','ps':500}, token=key)
              auth_token = key
          if err or not projects:
              status['errors'].append('project discovery failed: '+str(err))
              save('status.json', status)
              raise SystemExit(0)

          save('projects.json', projects)
          components = projects.get('components', [])
          matches = [p for p in components if 'niakvio' in str(p.get('name','')).lower() or 'niakvio' in str(p.get('key','')).lower()]
          project = matches[0] if matches else (components[0] if components else None)
          if not project:
              status['errors'].append('NiakVIO project not found')
              save('status.json', status)
              raise SystemExit(0)

          project_key = project.get('key')
          status['project'] = project.get('name') or project_key
          issues = []
          page = 1
          while page <= 200:
              payload, err = get('/api/issues/search', {
                  'componentKeys':project_key,'resolved':'false','ps':500,'p':page
              }, token=auth_token)
              if err or not payload:
                  status['errors'].append('issues export: '+str(err))
                  break
              batch = payload.get('issues', [])
              issues.extend(batch)
              total = (payload.get('paging') or {}).get('total', payload.get('total', len(issues)))
              if not batch or len(issues) >= int(total or 0):
                  break
              page += 1
          save('issues.json', issues)

          hotspots, err = get('/api/hotspots/search', {'projectKey':project_key,'ps':500}, token=auth_token)
          save('hotspots.json', hotspots if hotspots is not None else {'hotspots':[],'unavailable':True,'error':err})

          measures, err = get('/api/measures/component', {
              'component':project_key,
              'metricKeys':'bugs,vulnerabilities,security_hotspots,code_smells,duplicated_lines_density,cognitive_complexity,complexity,sqale_index,reliability_rating,security_rating,sqale_rating,ncloc,coverage'
          }, token=auth_token)
          save('measures.json', measures if measures is not None else {'unavailable':True,'error':err})

          sev = Counter(str(i.get('severity','UNKNOWN')) for i in issues)
          typ = Counter(str(i.get('type','UNKNOWN')) for i in issues)
          lines = [
              '# SonarQube Cloud audit','',
              f'- Project: `{status["project"]}`',
              f'- Open findings: **{len(issues)}**',
              '- Severity: '+(', '.join(f'`{k}` {v}' for k,v in sev.most_common()) or 'none'),
              '- Type: '+(', '.join(f'`{k}` {v}' for k,v in typ.most_common()) or 'none'),
              '', '## Findings',''
          ]
          for i in issues:
              comp = str(i.get('component','?'))
              line = i.get('line') or (i.get('textRange') or {}).get('startLine')
              loc = f'{comp}:{line}' if line else comp
              msg = ' '.join(str(i.get('message','')).split())
              lines.append(f'- `{loc}` **{i.get("severity","?")} / {i.get("type","?")}** `{i.get("rule","?")}` — {msg}')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          status['finding_count'] = len(issues)
          status['ok'] = True
          save('status.json', status)
          PY

      - name: Install DeepSource CLI
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/deepsource-bin"
          if curl -fsSL https://cli.deepsource.com/install | BINDIR="$RUNNER_TEMP/deepsource-bin" sh; then
            echo "DEEPSOURCE_BIN=$RUNNER_TEMP/deepsource-bin/deepsource" >> "$GITHUB_ENV"
          else
            printf '{"source":"DeepSource","ok":false,"errors":["CLI installation failed"]}\n' > "$OUT/deepsource/status.json"
          fi

      - name: Export DeepSource
        continue-on-error: true
        run: |
          set +e
          if [ -z "${DEEPSOURCE_PASS:-}" ]; then
            printf '{"source":"DeepSource","ok":false,"errors":["DEEPSOURCE_PASS repository secret is missing/unavailable"]}\n' > "$OUT/deepsource/status.json"
            exit 0
          fi
          if [ -z "${DEEPSOURCE_BIN:-}" ] || [ ! -x "$DEEPSOURCE_BIN" ]; then
            printf '{"source":"DeepSource","ok":false,"errors":["DeepSource CLI unavailable"]}\n' > "$OUT/deepsource/status.json"
            exit 0
          fi
          if ! "$DEEPSOURCE_BIN" auth login --with-token "$DEEPSOURCE_PASS" >/dev/null 2>&1; then
            printf '{"source":"DeepSource","ok":false,"errors":["authentication failed"]}\n' > "$OUT/deepsource/status.json"
            exit 0
          fi

          export_ds() {
            file="$1"; shift
            "$DEEPSOURCE_BIN" "$@" --repo "gh/$REPO_SLUG" --output json > "$OUT/deepsource/$file.json" 2> "$OUT/deepsource/$file.err"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '{"error":"DeepSource command failed","exit_code":%s}\n' "$rc" > "$OUT/deepsource/$file.json"
            fi
            return 0
          }

          export_ds repository repo status
          export_ds issues issues --default-branch --verbose
          export_ds vulnerabilities vulnerabilities --default-branch --verbose
          export_ds metrics metrics --default-branch --verbose
          export_ds runs runs --limit 100
          export_ds report-card report-card

          python3 - <<'PY'
          import json, os, pathlib
          from collections import Counter
          out = pathlib.Path(os.environ['OUT'])/'deepsource'
          try:
              raw = json.loads((out/'issues.json').read_text(encoding='utf-8'))
          except Exception:
              raw = {}
          issues = raw.get('issues', []) if isinstance(raw, dict) else (raw if isinstance(raw, list) else [])
          if not isinstance(issues, list): issues=[]
          sev = Counter(str(i.get('severity','UNKNOWN')) for i in issues if isinstance(i,dict))
          cat = Counter(str(i.get('category','UNKNOWN')) for i in issues if isinstance(i,dict))
          lines = ['# DeepSource audit','',f'- Findings: **{len(issues)}**',
                   '- Severity: '+(', '.join(f'`{k}` {v}' for k,v in sev.most_common()) or 'none'),
                   '- Category: '+(', '.join(f'`{k}` {v}' for k,v in cat.most_common()) or 'none'),
                   '', '## Findings','']
          for i in issues:
              if not isinstance(i,dict): continue
              location = i.get('location') if isinstance(i.get('location'),dict) else {}
              path = i.get('path') or i.get('file_path') or location.get('path') or '?'
              line = i.get('line') or i.get('line_number') or location.get('line')
              loc = f'{path}:{line}' if line else str(path)
              code = i.get('shortcode') or i.get('issue_code') or i.get('code') or '?'
              title = ' '.join(str(i.get('title') or i.get('message') or i.get('description') or '').split())
              lines.append(f'- `{loc}` **{i.get("severity","?")} / {i.get("category","?")}** `{code}` — {title}')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          (out/'status.json').write_text(json.dumps({'source':'DeepSource','ok':True,'finding_count':len(issues),'errors':[]}, indent=2)+'\n', encoding='utf-8')
          PY
          find "$OUT/deepsource" -name '*.err' -size 0 -delete
          exit 0

      - name: Export CodeScene
        continue-on-error: true
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          out = pathlib.Path(os.environ['OUT'])/'codescene'
          token = os.environ.get('CODESCENE_TOKEN','').strip()
          base = 'https://api.codescene.io/v2'
          status = {'source':'CodeScene','ok':False,'errors':[]}

          def save(name, value):
              (out/name).write_text(json.dumps(value, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          def get(path, params=None):
              url = base + path
              if params: url += '?' + urllib.parse.urlencode(params)
              try:
                  req = urllib.request.Request(url, headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                  with urllib.request.urlopen(req, timeout=45) as r: return json.load(r), None
              except urllib.error.HTTPError as e: return None, f'HTTP {e.code}'
              except Exception as e: return None, type(e).__name__

          if not token:
              status['errors'].append('CODESCENE_TOKEN repository secret is missing/unavailable')
              save('status.json', status)
              raise SystemExit(0)

          projects, err = get('/projects')
          if projects is None:
              status['errors'].append('project discovery failed: '+str(err))
              save('status.json', status)
              raise SystemExit(0)
          save('projects.json', projects)

          if isinstance(projects,list): plist=projects
          elif isinstance(projects,dict): plist=projects.get('projects') or projects.get('items') or projects.get('data') or []
          else: plist=[]
          if isinstance(plist,dict): plist=list(plist.values())
          matches=[p for p in plist if isinstance(p,dict) and 'niakvio' in json.dumps(p).lower()]
          project=matches[0] if matches else (plist[0] if plist and isinstance(plist[0],dict) else None)
          if not project:
              status['errors'].append('NiakVIO project not found')
              save('status.json', status)
              raise SystemExit(0)
          pid=project.get('id') or project.get('project_id')
          if pid is None:
              status['errors'].append('project id not returned by API')
              save('status.json', status)
              raise SystemExit(0)
          status['project']=project.get('name') or str(pid)

          latest, err=get(f'/projects/{pid}/analyses/latest')
          save('analysis-latest.json', latest if latest is not None else {'unavailable':True,'error':err})

          files=[]
          for page in range(1,201):
              payload, ferr=get(f'/projects/{pid}/analyses/latest/files', {'page':page,'page_size':100,'order_by':'code_health'})
              if payload is None:
                  status['errors'].append('files export: '+str(ferr)); break
              batch=payload.get('files',[]) if isinstance(payload,dict) else (payload if isinstance(payload,list) else [])
              files.extend(batch)
              if len(batch)<100: break
          save('files.json', files)

          hotspots, err=get(f'/projects/{pid}/analyses/latest/hotspots')
          save('hotspots.json', hotspots if hotspots is not None else {'hotspots':[],'unavailable':True,'error':err})

          arch=None
          for endpoint in ('architecture/hotspots','architectural-hotspots','architecture-hotspots'):
              arch, aerr=get(f'/projects/{pid}/analyses/latest/{endpoint}')
              if arch is not None: break
          save('architecture-hotspots.json', arch if arch is not None else {'unavailable':True})

          def health(f):
              h=f.get('code_health')
              if isinstance(h,dict): return h.get('health_now') or h.get('score') or h.get('value')
              return h
          lines=['# CodeScene audit','',f'- Project: `{status["project"]}`',f'- File metrics exported: **{len(files)}**','','## Files / Code Health','']
          sortable=sorted([f for f in files if isinstance(f,dict)], key=lambda f:(health(f) is None, health(f) if isinstance(health(f),(int,float)) else 999))
          for f in sortable:
              name=f.get('name') or f.get('path') or '?'
              lines.append(f'- `{name}` — Code Health `{health(f)}`; changes `{f.get("change_frequency","?")}`; defects `{f.get("number_of_defects","?")}`; LOC `{f.get("lines_of_code","?")}`')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          status['ok']=True
          status['file_count']=len(files)
          save('status.json',status)
          PY

      - name: Build AI index
        if: always()
        run: |
          python3 <<'PY'
          import json, os, pathlib, datetime
          root=pathlib.Path(os.environ['OUT'])
          statuses=[]
          for name in ('sonar','deepsource','codescene'):
              try: statuses.append(json.loads((root/name/'status.json').read_text(encoding='utf-8')))
              except Exception: statuses.append({'source':name,'ok':False,'errors':['status unavailable']})
          lines=['# External code-audit status','',f'Generated from `{os.environ["REPO_SLUG"]}` at commit `{os.environ.get("GITHUB_SHA","")}`.','',
                 '| Source | Status | Findings/files | Notes |','|---|---:|---:|---|']
          for s in statuses:
              count=s.get('finding_count',s.get('file_count','—'))
              notes='; '.join(s.get('errors') or []) or 'OK'
              lines.append(f'| {s.get("source","?")} | {"OK" if s.get("ok") else "PARTIAL/ERROR"} | {count} | {notes} |')
          lines += ['', '## AI reading order','',
                    '1. Read `STATUS.md`.','2. Read each source `summary.md` when available.','3. Open raw JSON for exact fields/context.','',
                    '> Evidence only: no external autofix is applied automatically.']
          (root/'STATUS.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          meta={'repository':os.environ['REPO_SLUG'],'sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit refreshed audit exports
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then
            echo 'No audit export changes.'
            exit 0
          fi
          git commit -m 'chore(audit): refresh external AI audit logs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
