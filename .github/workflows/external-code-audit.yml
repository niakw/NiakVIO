name: External Code Audit

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/external-code-audit.yml

permissions:
  contents: write

concurrency:
  group: external-code-audit
  cancel-in-progress: false

jobs:
  collect:
    name: Export AI-readable audit logs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_SLUG: niakw/NiakVIO
      SONAR_KEY: ${{ secrets.SONAR_KEY }}
      DEEPSOURCE_PASS: ${{ secrets.DEEPSOURCE_PASS }}
      CODESCENE_TOKEN: ${{ secrets.CODESCENE_TOKEN }}
      OUT: audit/ai-external

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare export directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{sonar,deepsource,codescene}
          find "$OUT/sonar" "$OUT/deepsource" "$OUT/codescene" -type f -delete

      - name: Export SonarQube Cloud
        shell: bash
        run: |
          set +e
          python3 <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          out = pathlib.Path(os.environ['OUT']) / 'sonar'
          out.mkdir(parents=True, exist_ok=True)
          key = os.environ.get('SONAR_KEY', '').strip()
          base = 'https://sonarcloud.io'
          status = {'source': 'SonarQube Cloud', 'ok': False, 'errors': []}

          def save(name, data):
              (out / name).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def get(path, params=None, bearer=None):
              url = base + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              headers = {'Accept': 'application/json'}
              if bearer:
                  headers['Authorization'] = 'Bearer ' + bearer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  return None, f'HTTP {e.code}'
              except Exception as e:
                  return None, type(e).__name__

          if not key:
              status['errors'].append('SONAR_KEY is missing')
              save('status.json', status)
              raise SystemExit(0)

          projects, err = get('/api/projects/search', {'organization': key, 'ps': 500})
          auth_mode = 'organization-key'
          if err or not isinstance(projects, dict) or 'components' not in projects:
              projects, err = get('/api/projects/search', {'q': 'NiakVIO', 'ps': 500}, bearer=key)
              auth_mode = 'bearer-token'
          if err or not projects:
              status['errors'].append('project discovery failed: ' + str(err))
              save('status.json', status)
              raise SystemExit(0)

          save('projects.json', projects)
          components = projects.get('components', []) if isinstance(projects, dict) else []
          matches = [p for p in components if 'niakvio' in str(p.get('name','')).lower() or 'niakvio' in str(p.get('key','')).lower()]
          project = matches[0] if matches else (components[0] if components else None)
          if not project:
              status['errors'].append('NiakVIO project not found')
              save('status.json', status)
              raise SystemExit(0)

          project_key = project.get('key')
          bearer = key if auth_mode == 'bearer-token' else None
          status['project'] = project.get('name') or project_key
          status['auth_mode'] = auth_mode

          issues = []
          page = 1
          total = None
          while page <= 200:
              payload, err = get('/api/issues/search', {
                  'componentKeys': project_key,
                  'resolved': 'false',
                  'ps': 500,
                  'p': page,
              }, bearer=bearer)
              if err or not payload:
                  status['errors'].append('issues export failed: ' + str(err))
                  break
              batch = payload.get('issues', [])
              issues.extend(batch)
              paging = payload.get('paging') or {}
              total = paging.get('total', payload.get('total', len(issues)))
              if not batch or len(issues) >= int(total or 0):
                  break
              page += 1
          save('issues.json', issues)

          hotspots, err = get('/api/hotspots/search', {'projectKey': project_key, 'ps': 500}, bearer=bearer)
          if hotspots is not None:
              save('hotspots.json', hotspots)
          else:
              status['errors'].append('hotspots export unavailable: ' + str(err))
              save('hotspots.json', {'hotspots': [], 'unavailable': True})

          measures, err = get('/api/measures/component', {
              'component': project_key,
              'metricKeys': 'bugs,vulnerabilities,security_hotspots,code_smells,duplicated_lines_density,cognitive_complexity,complexity,sqale_index,reliability_rating,security_rating,sqale_rating,ncloc,coverage'
          }, bearer=bearer)
          if measures is not None:
              save('measures.json', measures)
          else:
              status['errors'].append('measures export unavailable: ' + str(err))

          sev = Counter(str(i.get('severity', 'UNKNOWN')) for i in issues)
          typ = Counter(str(i.get('type', 'UNKNOWN')) for i in issues)
          lines = [
              '# SonarQube Cloud audit', '',
              f'- Project: `{status.get("project", "unknown")}`',
              f'- Open findings: **{len(issues)}**',
              '- Severity: ' + (', '.join(f'`{k}` {v}' for k,v in sev.most_common()) or 'none'),
              '- Type: ' + (', '.join(f'`{k}` {v}' for k,v in typ.most_common()) or 'none'),
              '', '## Findings', ''
          ]
          for i in issues:
              comp = str(i.get('component', '?'))
              line = i.get('line') or i.get('textRange', {}).get('startLine')
              loc = f'{comp}:{line}' if line else comp
              msg = ' '.join(str(i.get('message','')).split())
              lines.append(f'- `{loc}` **{i.get("severity","?")} / {i.get("type","?")}** `{i.get("rule","?")}` — {msg}')
          (out / 'summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          status['ok'] = len(status['errors']) == 0 or bool(issues) or measures is not None
          status['finding_count'] = len(issues)
          save('status.json', status)
          PY

      - name: Install DeepSource CLI
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/deepsource-bin"
          curl -fsSL https://cli.deepsource.com/install | BINDIR="$RUNNER_TEMP/deepsource-bin" sh
          if [ -x "$RUNNER_TEMP/deepsource-bin/deepsource" ]; then
            echo "DEEPSOURCE_BIN=$RUNNER_TEMP/deepsource-bin/deepsource" >> "$GITHUB_ENV"
          else
            printf '{"source":"DeepSource","ok":false,"errors":["CLI installation failed"]}\n' > "$OUT/deepsource/status.json"
          fi

      - name: Export DeepSource
        shell: bash
        run: |
          set +e
          if [ -z "${DEEPSOURCE_PASS:-}" ] || [ -z "${DEEPSOURCE_BIN:-}" ]; then
            [ -f "$OUT/deepsource/status.json" ] || printf '{"source":"DeepSource","ok":false,"errors":["DEEPSOURCE_PASS is missing"]}\n' > "$OUT/deepsource/status.json"
          else
            "$DEEPSOURCE_BIN" auth login --with-token "$DEEPSOURCE_PASS" >/dev/null 2>&1
            AUTH_RC=$?
            if [ "$AUTH_RC" -ne 0 ]; then
              printf '{"source":"DeepSource","ok":false,"errors":["authentication failed"]}\n' > "$OUT/deepsource/status.json"
            else
              run_ds() {
                name="$1"; shift
                "$DEEPSOURCE_BIN" "$@" --repo "gh/$REPO_SLUG" --output json > "$OUT/deepsource/$name.json" 2> "$OUT/deepsource/$name.err"
                rc=$?
                if [ "$rc" -ne 0 ]; then
                  printf '{"error":"DeepSource command failed","exit_code":%s}\n' "$rc" > "$OUT/deepsource/$name.json"
                fi
              }
              run_ds repository repo status
              run_ds issues issues --default-branch --verbose
              run_ds vulnerabilities vulnerabilities --default-branch --verbose
              run_ds metrics metrics --default-branch --verbose
              run_ds runs runs --limit 100
              run_ds report-card report-card

              python3 <<'PY'
              import json, os, pathlib
              from collections import Counter
              out = pathlib.Path(os.environ['OUT']) / 'deepsource'
              def load(name):
                  try: return json.loads((out/name).read_text(encoding='utf-8'))
                  except Exception: return {}
              raw = load('issues.json')
              issues = raw.get('issues', raw if isinstance(raw, list) else [])
              if not isinstance(issues, list): issues = []
              sev = Counter(str(i.get('severity','UNKNOWN')) for i in issues if isinstance(i,dict))
              cat = Counter(str(i.get('category','UNKNOWN')) for i in issues if isinstance(i,dict))
              lines = [
                  '# DeepSource audit', '',
                  f'- Findings: **{len(issues)}**',
                  '- Severity: ' + (', '.join(f'`{k}` {v}' for k,v in sev.most_common()) or 'none'),
                  '- Category: ' + (', '.join(f'`{k}` {v}' for k,v in cat.most_common()) or 'none'),
                  '', '## Findings', ''
              ]
              for i in issues:
                  if not isinstance(i,dict): continue
                  path = i.get('path') or i.get('file_path') or i.get('location',{}).get('path') or '?'
                  line = i.get('line') or i.get('line_number') or i.get('location',{}).get('line')
                  loc = f'{path}:{line}' if line else str(path)
                  code = i.get('shortcode') or i.get('issue_code') or i.get('code') or '?'
                  title = i.get('title') or i.get('message') or i.get('description') or ''
                  title = ' '.join(str(title).split())
                  lines.append(f'- `{loc}` **{i.get("severity","?")} / {i.get("category","?")}** `{code}` — {title}')
              (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
              status = {'source':'DeepSource','ok':True,'finding_count':len(issues),'errors':[]}
              (out/'status.json').write_text(json.dumps(status, indent=2)+'\n', encoding='utf-8')
              PY
            fi
          fi
          find "$OUT/deepsource" -name '*.err' -size 0 -delete

      - name: Export CodeScene
        shell: bash
        run: |
          set +e
          python3 <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, urllib.parse
          from collections import Counter

          out = pathlib.Path(os.environ['OUT']) / 'codescene'
          out.mkdir(parents=True, exist_ok=True)
          token = os.environ.get('CODESCENE_TOKEN','').strip()
          base = 'https://api.codescene.io/v2'
          status = {'source':'CodeScene','ok':False,'errors':[]}

          def save(name, data):
              (out/name).write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          def get(path, params=None):
              if not token: return None, 'token missing'
              url = base + path
              if params: url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r: return json.load(r), None
              except urllib.error.HTTPError as e: return None, f'HTTP {e.code}'
              except Exception as e: return None, type(e).__name__

          if not token:
              status['errors'].append('CODESCENE_TOKEN is missing')
              save('status.json', status)
              raise SystemExit(0)

          projects, err = get('/projects')
          if projects is None:
              status['errors'].append('project discovery failed: '+str(err))
              save('status.json', status)
              raise SystemExit(0)
          save('projects.json', projects)

          if isinstance(projects, list): plist = projects
          elif isinstance(projects, dict): plist = projects.get('projects') or projects.get('items') or projects.get('data') or []
          else: plist = []
          if isinstance(plist, dict): plist = list(plist.values())
          candidates = [p for p in plist if isinstance(p,dict) and ('niakvio' in str(p.get('name','')).lower() or 'niakvio' in json.dumps(p).lower())]
          project = candidates[0] if candidates else (plist[0] if plist and isinstance(plist[0],dict) else None)
          if not project:
              status['errors'].append('NiakVIO project not found')
              save('status.json', status)
              raise SystemExit(0)
          pid = project.get('id') or project.get('project_id')
          if pid is None:
              status['errors'].append('project id missing in API response')
              save('status.json', status)
              raise SystemExit(0)
          status['project'] = project.get('name') or str(pid)

          latest, err = get(f'/projects/{pid}/analyses/latest')
          if latest is not None: save('analysis-latest.json', latest)
          else: status['errors'].append('latest analysis unavailable: '+str(err))

          files = []
          page = 1
          while page <= 200:
              payload, ferr = get(f'/projects/{pid}/analyses/latest/files', {'page':page,'page_size':100,'order_by':'code_health'})
              if payload is None:
                  status['errors'].append('file metrics unavailable: '+str(ferr))
                  break
              batch = payload.get('files', []) if isinstance(payload,dict) else (payload if isinstance(payload,list) else [])
              files.extend(batch)
              if len(batch) < 100: break
              page += 1
          save('files.json', files)

          hotspots, herr = get(f'/projects/{pid}/analyses/latest/hotspots')
          if hotspots is not None: save('hotspots.json', hotspots)
          else:
              status['errors'].append('hotspots unavailable: '+str(herr))
              save('hotspots.json', {'hotspots':[], 'unavailable':True})

          architecture = None
          for endpoint in ('architectural-hotspots','architecture-hotspots'):
              architecture, aerr = get(f'/projects/{pid}/analyses/latest/{endpoint}')
              if architecture is not None: break
          if architecture is not None: save('architecture-hotspots.json', architecture)

          lines = ['# CodeScene audit','',f'- Project: `{status.get("project","unknown")}`',f'- File metrics exported: **{len(files)}**','','## Files / Code Health','']
          def health(f):
              ch = f.get('code_health')
              if isinstance(ch,dict): return ch.get('health_now') or ch.get('score') or ch.get('value')
              return ch
          sortable = sorted([f for f in files if isinstance(f,dict)], key=lambda f: (health(f) is None, health(f) if isinstance(health(f),(int,float)) else 999))
          for f in sortable:
              name = f.get('name') or f.get('path') or '?'
              lines.append(f'- `{name}` — Code Health `{health(f)}`; changes `{f.get("change_frequency","?")}`; defects `{f.get("number_of_defects","?")}`; LOC `{f.get("lines_of_code","?")}`')
          (out/'summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')

          status['ok'] = bool(files) or latest is not None or hotspots is not None
          status['file_count'] = len(files)
          save('status.json', status)
          PY

      - name: Build AI index
        shell: bash
        run: |
          set +e
          python3 <<'PY'
          import json, os, pathlib, datetime
          root = pathlib.Path(os.environ['OUT'])
          rows = []
          for source in ('sonar','deepsource','codescene'):
              p = root/source/'status.json'
              try: s = json.loads(p.read_text(encoding='utf-8'))
              except Exception: s = {'source':source,'ok':False,'errors':['status unavailable']}
              rows.append(s)
          lines = [
              '# External code-audit status', '',
              f'Generated from `{os.environ.get("REPO_SLUG")}` at commit `{os.environ.get("GITHUB_SHA","")}`.', '',
              '| Source | Status | Exported findings/files | Notes |',
              '|---|---:|---:|---|'
          ]
          for s in rows:
              count = s.get('finding_count', s.get('file_count','—'))
              notes = '; '.join(s.get('errors') or []) or 'OK'
              lines.append(f'| {s.get("source","?")} | {"OK" if s.get("ok") else "PARTIAL/ERROR"} | {count} | {notes} |')
          lines += ['', '## AI reading order', '', '1. Read this `STATUS.md`.', '2. Read each provider `summary.md`.', '3. Open the corresponding JSON only when exact fields/context are needed.', '', '> These exports are evidence only. No external autofix is applied automatically.']
          (root/'STATUS.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          meta = {'repository':os.environ.get('REPO_SLUG'),'sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit refreshed audit exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then
            echo 'No audit export changes to commit.'
            exit 0
          fi
          git commit -m 'chore(audit): refresh external AI audit logs [skip ci]'
          git push origin HEAD:main
