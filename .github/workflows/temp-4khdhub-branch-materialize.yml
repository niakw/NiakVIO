name: TEMP - 4KHDHub branch materialize

on:
  push:
    branches:
      - fix/4khdhub-published-runtime
    paths:
      - '.github/workflows/temp-4khdhub-branch-materialize.yml'

permissions:
  contents: write

concurrency:
  group: temp-4khdhub-branch-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUVIO_PROVIDER_V3_CONTEXT: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source repair
        run: |
          set -euo pipefail
          python -m py_compile scripts/provider_patches/4khdhub_runtime_v1.py
          python tests/provider_4khdhub_runtime_behavior_test.py
      - name: Materialize exact current 4KHDHub bytes
        run: |
          set -euo pipefail
          python scripts/materialize_provider_v3_one.py 4khdhub
          python scripts/validate_published_provider_config.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/provider_4khdhub_runtime_behavior_test.py
          python scripts/reapply_published_overrides.py --check --primary manifest.json
          git diff --check
          git status --short
      - name: Commit generated publication deltas to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo FIELD_4KHDHUB_MATERIALIZE changed=false; exit 0; }
          git commit -m 'fix(4khdhub): materialize published runtime bytes'
          git fetch origin fix/4khdhub-published-runtime
          test "$(git rev-parse origin/fix/4khdhub-published-runtime)" = "${GITHUB_SHA}" || {
            echo "branch moved during 4KHDHub materialization" >&2
            exit 1
          }
          git push origin HEAD:fix/4khdhub-published-runtime
          echo "FIELD_4KHDHUB_MATERIALIZE changed=true sha=$(git rev-parse HEAD)"
