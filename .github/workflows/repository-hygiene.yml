name: NiakVIO repository hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene.yml'
  schedule:
    - cron: '23 6 * * 1'

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: niakvio-repository-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stale main workflow generations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current_run="$GITHUB_RUN_ID"
          cancelled=0
          already_finished=0
          stable=0

          cancel_stale_for_head() {
            local current_head="$1"
            local status run_id head_sha workflow_name live_status
            for status in queued in_progress; do
              while IFS=$'\t' read -r run_id head_sha workflow_name; do
                [ -n "$run_id" ] || continue
                if [ "$run_id" = "$current_run" ] || [ "$head_sha" = "$current_head" ]; then
                  continue
                fi
                echo "FIELD_STALE_MAIN_RUN_CANCEL_REQUEST run=$run_id status=$status head=${head_sha:0:12} workflow=$workflow_name current=${current_head:0:12}"
                if gh api -X POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
                  cancelled=$((cancelled+1))
                else
                  live_status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || printf 'unknown')"
                  if [ "$live_status" = "completed" ]; then
                    already_finished=$((already_finished+1))
                  else
                    echo "Unable to cancel stale main run $run_id (status=$live_status)" >&2
                    return 1
                  fi
                fi
              done < <(
                gh api --paginate "repos/$repo/actions/runs?branch=main&status=$status&per_page=100" \
                  --jq '.workflow_runs[] | [.id, .head_sha, .name] | @tsv'
              )
            done
          }

          for sweep in 1 2 3 4; do
            before="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
            echo "FIELD_STALE_MAIN_RUN_SWEEP sweep=$sweep head=$before"
            cancel_stale_for_head "$before"
            sleep 3
            after="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
            if [ "$before" = "$after" ]; then
              stable=1
              current_head="$after"
              break
            fi
            echo "main moved during stale-run cleanup: ${before:0:12} -> ${after:0:12}; repeating sweep"
          done

          if [ "$stable" -ne 1 ]; then
            echo "main did not stabilize during stale-run cleanup" >&2
            exit 1
          fi

          remaining=0
          for status in queued in_progress; do
            while IFS=$'\t' read -r run_id head_sha workflow_name; do
              [ -n "$run_id" ] || continue
              if [ "$run_id" = "$current_run" ] || [ "$head_sha" = "$current_head" ]; then
                continue
              fi
              echo "Stale main run remains active after cleanup: run=$run_id status=$status head=$head_sha workflow=$workflow_name" >&2
              remaining=$((remaining+1))
            done < <(
              gh api --paginate "repos/$repo/actions/runs?branch=main&status=$status&per_page=100" \
                --jq '.workflow_runs[] | [.id, .head_sha, .name] | @tsv'
            )
          done
          if [ "$remaining" -ne 0 ]; then
            exit 1
          fi

          echo "FIELD_STALE_MAIN_RUN_CLEANUP current=$current_head cancelled=$cancelled already_finished=$already_finished remaining=0"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Delete retired temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          keep_regex='^(main|brain-learning/proposals)$'
          retired=(
            'audit/repository-final-cleanup-2026-08-25'
            'work/final-runtime-bundle-20260825'
            'agent/native-player-diagnostics-brain-v4'
            'agent/native-player-lab'
            'agent/profile-reuse-pr68-v2'
            'agent/profile-reuse-pr68'
            'brain-repair/proposals'
            'chore/codeql-triage'
            'chore/codeql-triage-trigger'
            'chore/codeql-verify-trigger'
            'ci/avd-cache-targeted'
            'ci/native-reader-budget-fix'
            'cleanup/actions-queue'
            'final/native-reader-brain-v4'
            'fix/codeql-wrapper-sources'
            'lab/desktop-mobile-real'
            'lab/tv-real'
            'postmerge/global-provider-security-v1'
            'scratch/native-lab-core-fixes-20260821'
            'tmp/native-profile-contract-fixes'
            'trigger/codeql-final-count'
            'trigger/codeql-provider-dismiss'
            'trigger/codeql-wrapper-source-hardening'
            'work/native-reader-backlog'
          )
          deleted=0
          for branch in "${retired[@]}"; do
            if [[ "$branch" =~ $keep_regex ]]; then
              echo "Refusing to delete protected persistent branch: $branch" >&2
              exit 1
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              deleted=$((deleted+1))
            fi
          done
          echo "FIELD_REPOSITORY_HYGIENE deleted=$deleted keep=main,brain-learning/proposals"

      - name: Prove only intentional or active-PR branches remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          mapfile -t open_pr_branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref" \
              | sort -u
          )
          printf '%s\n' "${branches[@]}"
          unexpected=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) continue ;;
            esac
            if printf '%s\n' "${open_pr_branches[@]}" | grep -Fqx -- "$branch"; then
              echo "Active pull-request branch allowed temporarily: $branch"
              continue
            fi
            echo "Unexpected branch remains: $branch" >&2
            unexpected=1
          done
          exit "$unexpected"
