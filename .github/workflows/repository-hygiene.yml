name: NiakVIO repository hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene.yml'
  schedule:
    - cron: '23 6 * * 1'

permissions:
  actions: write
  contents: read

concurrency:
  group: niakvio-repository-hygiene
  cancel-in-progress: true

jobs:
  purge-active-actions:
    # Emergency/control-plane job: use the lightweight pool so it can drain
    # normal hosted runners even when Core/native jobs saturate them.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel every other active main workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "NiakVIO-actions-purger",
          }

          def request(path: str, method: str = "GET"):
              req = urllib.request.Request(
                  api + path,
                  data=b"" if method == "POST" else None,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def active_runs(status: str):
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {"branch": "main", "status": status, "per_page": 100, "page": page}
                  )
                  payload = request(f"/repos/{repo}/actions/runs?{query}")
                  rows = payload.get("workflow_runs") or []
                  yield from rows
                  if len(rows) < 100:
                      return
                  page += 1

          def live_status(run_id: int) -> str:
              try:
                  return str(request(f"/repos/{repo}/actions/runs/{run_id}").get("status") or "unknown")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return "deleted"
                  return "unknown"

          def cancel_run(run_id: int) -> str:
              try:
                  request(f"/repos/{repo}/actions/runs/{run_id}/cancel", "POST")
                  return "cancel"
              except urllib.error.HTTPError as normal_error:
                  if live_status(run_id) in {"completed", "deleted"}:
                      return "already_finished"
                  print(f"FIELD_CANCEL_FALLBACK run={run_id} normal_http={normal_error.code} force=true")
                  try:
                      request(f"/repos/{repo}/actions/runs/{run_id}/force-cancel", "POST")
                      return "force-cancel"
                  except urllib.error.HTTPError as force_error:
                      if live_status(run_id) in {"completed", "deleted"}:
                          return "already_finished"
                      print(
                          f"FIELD_DELETE_FALLBACK run={run_id} normal_http={normal_error.code} "
                          f"force_http={force_error.code} delete=true"
                      )
                      try:
                          request(f"/repos/{repo}/actions/runs/{run_id}", "DELETE")
                          return "delete"
                      except urllib.error.HTTPError as delete_error:
                          status = live_status(run_id)
                          if status in {"completed", "deleted"}:
                              return "already_finished"
                          return (
                              f"failed:{normal_error.code}/{force_error.code}/"
                              f"{delete_error.code}:{status}"
                          )

          requested = set()
          failures = {}
          for sweep in range(1, 9):
              candidates = []
              for status in ("queued", "in_progress"):
                  for row in active_runs(status):
                      run_id = int(row.get("id") or 0)
                      if not run_id or run_id == current_run:
                          continue
                      candidates.append(
                          (run_id, status, str(row.get("head_sha") or ""), str(row.get("name") or "unknown"))
                      )

              print(f"FIELD_ACTION_PURGE_SWEEP sweep={sweep} candidates={len(candidates)}")
              if not candidates:
                  print(f"FIELD_ACTION_PURGE_DONE requested={len(requested)} remaining=0")
                  raise SystemExit(0)

              for run_id, status, run_head, name in candidates:
                  outcome = cancel_run(run_id)
                  requested.add(run_id)
                  print(
                      f"FIELD_ACTION_PURGE_REQUEST run={run_id} status={status} "
                      f"head={run_head[:12]} workflow={name} outcome={outcome}"
                  )
                  if outcome.startswith("failed:"):
                      failures[run_id] = outcome
                  else:
                      failures.pop(run_id, None)
              time.sleep(2)

          remaining = []
          for status in ("queued", "in_progress"):
              for row in active_runs(status):
                  run_id = int(row.get("id") or 0)
                  if run_id and run_id != current_run:
                      remaining.append((run_id, status, str(row.get("head_sha") or ""), str(row.get("name") or "unknown")))

          print(
              f"FIELD_ACTION_PURGE_DONE requested={len(requested)} "
              f"remaining={len(remaining)} failures={len(failures)}"
          )
          for run_id, status, run_head, name in remaining[:100]:
              print(
                  f"ACTION_REMAINS run={run_id} status={status} "
                  f"head={run_head[:12]} workflow={name} error={failures.get(run_id, 'pending-cancel')}"
              )
          if remaining:
              raise SystemExit(f"active main workflow runs remain: {len(remaining)}")
          PY
