name: NiakVIO repository hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene.yml'
  schedule:
    - cron: '23 6 * * 1'

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: niakvio-repository-hygiene
  cancel-in-progress: true

jobs:
  purge-stale-actions:
    # Keep queue hygiene on the lightweight pool. Only generations older than the
    # current main HEAD are touched; current validation runs are never cancelled.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale main workflow generations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "NiakVIO-stale-run-hygiene",
          }

          def request(path: str, method: str = "GET"):
              req = urllib.request.Request(
                  api + path,
                  data=b"" if method == "POST" else None,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def main_head() -> str:
              return str(request(f"/repos/{repo}/branches/main")["commit"]["sha"])

          def active_runs(status: str):
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {"branch": "main", "status": status, "per_page": 100, "page": page}
                  )
                  payload = request(f"/repos/{repo}/actions/runs?{query}")
                  rows = payload.get("workflow_runs") or []
                  yield from rows
                  if len(rows) < 100:
                      return
                  page += 1

          def live_status(run_id: int) -> str:
              try:
                  return str(request(f"/repos/{repo}/actions/runs/{run_id}").get("status") or "unknown")
              except Exception:
                  return "unknown"

          def cancel_stale(run_id: int) -> str:
              try:
                  request(f"/repos/{repo}/actions/runs/{run_id}/cancel", "POST")
                  return "cancel"
              except urllib.error.HTTPError as normal_error:
                  if live_status(run_id) == "completed":
                      return "already_completed"
                  try:
                      request(f"/repos/{repo}/actions/runs/{run_id}/force-cancel", "POST")
                      return "force-cancel"
                  except urllib.error.HTTPError as force_error:
                      status = live_status(run_id)
                      if status == "completed":
                          return "already_completed"
                      if normal_error.code == 409 and force_error.code == 409 and status == "queued":
                          return "github-orphan-queued"
                      return f"failed:{normal_error.code}/{force_error.code}:{status}"

          requested = set()
          platform_orphans = set()
          failures = {}
          for sweep in range(1, 7):
              head = main_head()
              candidates = []
              for status in ("queued", "in_progress"):
                  for row in active_runs(status):
                      run_id = int(row.get("id") or 0)
                      run_head = str(row.get("head_sha") or "")
                      if not run_id or run_id == current_run or run_head == head:
                          continue
                      candidates.append(
                          (run_id, status, run_head, str(row.get("name") or "unknown"))
                      )

              actionable = [row for row in candidates if row[0] not in platform_orphans]
              print(
                  f"FIELD_STALE_MAIN_SWEEP sweep={sweep} current={head} "
                  f"candidates={len(candidates)} actionable={len(actionable)} "
                  f"platform_orphans={len(platform_orphans)}"
              )
              if not actionable:
                  break

              for run_id, status, run_head, name in actionable:
                  outcome = cancel_stale(run_id)
                  requested.add(run_id)
                  print(
                      f"FIELD_STALE_MAIN_CANCEL run={run_id} status={status} "
                      f"head={run_head[:12]} workflow={name} outcome={outcome}"
                  )
                  if outcome == "github-orphan-queued":
                      platform_orphans.add(run_id)
                      failures.pop(run_id, None)
                  elif outcome.startswith("failed:"):
                      failures[run_id] = outcome
                  else:
                      failures.pop(run_id, None)
              time.sleep(2)

          final_head = main_head()
          remaining_actionable = []
          remaining_orphans = []
          for status in ("queued", "in_progress"):
              for row in active_runs(status):
                  run_id = int(row.get("id") or 0)
                  run_head = str(row.get("head_sha") or "")
                  if not run_id or run_id == current_run or run_head == final_head:
                      continue
                  item = (run_id, status, run_head, str(row.get("name") or "unknown"))
                  if run_id in platform_orphans and status == "queued":
                      remaining_orphans.append(item)
                  else:
                      remaining_actionable.append(item)

          print(
              f"FIELD_STALE_MAIN_DONE current={final_head} requested={len(requested)} "
              f"remaining_actionable={len(remaining_actionable)} "
              f"github_orphans={len(remaining_orphans)} failures={len(failures)}"
          )
          for run_id, status, run_head, name in remaining_orphans:
              print(
                  f"::warning title=GitHub Actions orphaned queued run::run={run_id} "
                  f"head={run_head[:12]} workflow={name}; cancel and force-cancel both return 409"
              )
          if remaining_actionable:
              for run_id, status, run_head, name in remaining_actionable[:50]:
                  print(
                      f"STALE_ACTIONABLE_REMAINS run={run_id} status={status} "
                      f"head={run_head[:12]} workflow={name} error={failures.get(run_id, 'pending')}"
                  )
              raise SystemExit(f"actionable stale main workflow runs remain: {len(remaining_actionable)}")
          PY

  cleanup:
    needs: purge-stale-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact workflow trigger paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          failures = []
          workflows = sorted((root / ".github" / "workflows").glob("*.y*ml"))
          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              i = 0
              while i < len(lines):
                  match = re.match(r"^(\s*)paths:\s*$", lines[i])
                  if not match:
                      i += 1
                      continue
                  indent = len(match.group(1))
                  i += 1
                  while i < len(lines):
                      line = lines[i]
                      if not line.strip():
                          i += 1
                          continue
                      current_indent = len(line) - len(line.lstrip())
                      if current_indent <= indent:
                          break
                      item = re.match(r"""^\s*-\s*['"]?([^'"]+)['"]?\s*(?:#.*)?$""", line)
                      if item:
                          path = item.group(1).strip()
                          if (
                              path
                              and ("$" + "{{") not in path
                              and not any(ch in path for ch in "*?[]!")
                              and not (root / path).exists()
                          ):
                              failures.append(f"{workflow}: {path}")
                      i += 1

          if failures:
              for failure in failures:
                  print(f"DEAD_WORKFLOW_TRIGGER_PATH {failure}")
              raise SystemExit(f"dead exact workflow trigger paths remain: {len(failures)}")
          print(f"FIELD_WORKFLOW_TRIGGER_PATHS status=ok workflows={len(workflows)}")
          PY

      - name: Delete every unexpected non-PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t open_pr_branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref" \
              | sort -u
          )
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' | sort -u
          )

          deleted=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) continue ;;
            esac
            if printf '%s\n' "${open_pr_branches[@]}" | grep -Fqx -- "$branch"; then
              echo "Active pull-request branch allowed temporarily: $branch"
              continue
            fi
            echo "Deleting unexpected non-PR branch: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted+1))
          done
          echo "FIELD_REPOSITORY_HYGIENE deleted=$deleted keep=main,brain-learning/proposals active_pr_branches=${#open_pr_branches[@]}"


      - name: Prove only intentional or active-PR branches remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          mapfile -t open_pr_branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref" \
              | sort -u
          )
          printf '%s\n' "${branches[@]}"
          unexpected=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) continue ;;
            esac
            if printf '%s\n' "${open_pr_branches[@]}" | grep -Fqx -- "$branch"; then
              continue
            fi
            echo "Unexpected branch remains: $branch" >&2
            unexpected=1
          done
          exit "$unexpected"

      - name: Regenerate and validate release hash fixed point
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Publish refreshed release hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          if git diff --cached --quiet; then
            echo "FIELD_REPOSITORY_HASH_REFRESH changed=0"
            exit 0
          fi
          git commit -m "chore(hygiene): refresh release hashes [skip ci]"
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
          echo "FIELD_REPOSITORY_HASH_REFRESH changed=1"
