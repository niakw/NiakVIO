name: NiakVIO repository hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-hygiene.yml'
  schedule:
    - cron: '23 6 * * 1'

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: niakvio-repository-hygiene
  cancel-in-progress: true

jobs:
  purge-stale-actions:
    # Dedicated lightweight pool: this job must be able to start even while stale
    # native/Core generations saturate the normal hosted runner queues.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel stale main workflow generations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "NiakVIO-stale-run-purger",
          }

          def request(path: str, method: str = "GET"):
              req = urllib.request.Request(
                  api + path,
                  data=b"" if method == "POST" else None,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def main_head() -> str:
              return str(request(f"/repos/{repo}/branches/main")["commit"]["sha"])

          def active_runs(status: str):
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {"branch": "main", "status": status, "per_page": 100, "page": page}
                  )
                  payload = request(f"/repos/{repo}/actions/runs?{query}")
                  rows = payload.get("workflow_runs") or []
                  yield from rows
                  if len(rows) < 100:
                      break
                  page += 1

          cancelled: set[int] = set()
          final_head = main_head()
          for sweep in range(1, 7):
              before = main_head()
              candidates = []
              for status in ("queued", "in_progress"):
                  for row in active_runs(status):
                      run_id = int(row.get("id") or 0)
                      run_head = str(row.get("head_sha") or "")
                      if not run_id or run_id == current_run or run_head == before:
                          continue
                      candidates.append(
                          (run_id, status, run_head, str(row.get("name") or "unknown"))
                      )

              print(
                  f"FIELD_STALE_MAIN_RUN_SWEEP sweep={sweep} head={before} "
                  f"candidates={len(candidates)}"
              )
              for run_id, status, run_head, name in candidates:
                  if run_id in cancelled:
                      continue
                  print(
                      f"FIELD_STALE_MAIN_RUN_CANCEL_REQUEST run={run_id} status={status} "
                      f"head={run_head[:12]} workflow={name} current={before[:12]}"
                  )
                  try:
                      request(f"/repos/{repo}/actions/runs/{run_id}/cancel", "POST")
                      cancelled.add(run_id)
                  except urllib.error.HTTPError as error:
                      live = request(f"/repos/{repo}/actions/runs/{run_id}")
                      if live.get("status") != "completed":
                          raise RuntimeError(
                              f"cancel failed for stale run {run_id}: HTTP {error.code}, "
                              f"status={live.get('status')}"
                          ) from error

              time.sleep(2)
              after = main_head()
              final_head = after
              if before == after:
                  break
              print(
                  f"FIELD_STALE_MAIN_HEAD_MOVED before={before[:12]} after={after[:12]} retry=true"
              )

          remaining = []
          for status in ("queued", "in_progress"):
              for row in active_runs(status):
                  run_id = int(row.get("id") or 0)
                  run_head = str(row.get("head_sha") or "")
                  if run_id == current_run or run_head == final_head:
                      continue
                  remaining.append(
                      (run_id, status, run_head, str(row.get("name") or "unknown"))
                  )

          print(
              f"FIELD_STALE_MAIN_RUN_CLEANUP current={final_head} "
              f"cancelled={len(cancelled)} remaining={len(remaining)}"
          )
          if remaining:
              for run_id, status, run_head, name in remaining[:50]:
                  print(
                      f"STALE_REMAINS run={run_id} status={status} "
                      f"head={run_head[:12]} workflow={name}"
                  )
              raise SystemExit(f"stale main Actions remain active: {len(remaining)}")
          PY

  cleanup:
    needs: purge-stale-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Delete retired temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          keep_regex='^(main|brain-learning/proposals)$'
          retired=(
            'audit/repository-final-cleanup-2026-08-25'
            'work/final-runtime-bundle-20260825'
            'agent/native-player-diagnostics-brain-v4'
            'agent/native-player-lab'
            'agent/profile-reuse-pr68-v2'
            'agent/profile-reuse-pr68'
            'brain-repair/proposals'
            'chore/codeql-triage'
            'chore/codeql-triage-trigger'
            'chore/codeql-verify-trigger'
            'ci/avd-cache-targeted'
            'ci/native-reader-budget-fix'
            'cleanup/actions-queue'
            'final/native-reader-brain-v4'
            'fix/codeql-wrapper-sources'
            'lab/desktop-mobile-real'
            'lab/tv-real'
            'postmerge/global-provider-security-v1'
            'scratch/native-lab-core-fixes-20260821'
            'tmp/native-profile-contract-fixes'
            'trigger/codeql-final-count'
            'trigger/codeql-provider-dismiss'
            'trigger/codeql-wrapper-source-hardening'
            'work/native-reader-backlog'
          )
          deleted=0
          for branch in "${retired[@]}"; do
            if [[ "$branch" =~ $keep_regex ]]; then
              echo "Refusing to delete protected persistent branch: $branch" >&2
              exit 1
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              deleted=$((deleted+1))
            fi
          done
          echo "FIELD_REPOSITORY_HYGIENE deleted=$deleted keep=main,brain-learning/proposals"

      - name: Prove only intentional or active-PR branches remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          mapfile -t open_pr_branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref" \
              | sort -u
          )
          printf '%s\n' "${branches[@]}"
          unexpected=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) continue ;;
            esac
            if printf '%s\n' "${open_pr_branches[@]}" | grep -Fqx -- "$branch"; then
              echo "Active pull-request branch allowed temporarily: $branch"
              continue
            fi
            echo "Unexpected branch remains: $branch" >&2
            unexpected=1
          done
          exit "$unexpected"
