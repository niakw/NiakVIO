name: TEMP - Player contracts MegaPlay + CloudOrchestra

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-player-contract-megaplay-cloudorchestra.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live player contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request,urllib.error

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          def get(url,headers=None,limit=2*1024*1024):
              h={'User-Agent':UA,'Accept':'text/html,application/json,text/javascript,*/*'};h.update(headers or {})
              q=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(q,timeout=18) as r:
                  return r.status,r.headers,r.read(limit).decode('utf-8','replace'),r.url
          def uinfo(url):
              try:
                  u=urllib.parse.urlsplit(html.unescape(url));return {'host':u.netloc,'path':u.path,'queryKeys':sorted(urllib.parse.parse_qs(u.query).keys())}
              except Exception:return {'raw':str(url)[:160]}
          def inspect_html(label,url,headers=None):
              try:
                  st,hd,body,final=get(url,headers)
              except Exception as e:
                  print(label+'_ERROR '+json.dumps({'error':type(e).__name__+': '+str(e)[:180]},separators=(',',':')));return None
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I)
              scripts=[urllib.parse.urljoin(final,s) for s in scripts]
              urls=re.findall(r'https?://[^"\'<>\\\s]+',body)
              media=[x for x in urls if re.search(r'\.m3u8(?:[?#]|$)|\.mpd(?:[?#]|$)|\.mp4(?:[?#]|$)',x,re.I)]
              api=[x for x in urls if re.search(r'/api/|/ajax/|/source|/sources|/stream|/player|/embed|/get',x,re.I)]
              literals=[]
              for pat in [r'["\']([^"\']*(?:/api/|/ajax/|/source|/sources|/stream|/player|/embed|/get)[^"\']*)["\']',r'(?:fetch|axios\.get|axios\.post)\s*\(\s*["\']([^"\']+)']:
                  pass
              # Keep only public contract shapes, never tokens.
              endpoint_literals=[]
              for m in re.finditer(r'["\']([^"\']{1,240})["\']',body):
                  v=html.unescape(m.group(1))
                  if re.search(r'/(?:api|ajax|source|sources|stream|player|embed|get)(?:/|\?|$)',v,re.I):
                      if v not in endpoint_literals:endpoint_literals.append(v)
              out={'status':st,'contentType':hd.get('content-type',''),'final':uinfo(final),'bytes':len(body.encode()),'scripts':[uinfo(x) for x in scripts[:20]],'mediaRefs':[uinfo(x) for x in media[:12]],'apiRefs':[uinfo(x) for x in api[:12]],'endpointLiterals':[uinfo(urllib.parse.urljoin(final,x)) for x in endpoint_literals[:30]],'markers':{k:bool(re.search(k,body,re.I)) for k in ['hls','m3u8','jwplayer','videojs','plyr','CryptoJS','WebAssembly','wasm','atob','source','fetch\\(','axios']}}
              print(label+' '+json.dumps(out,ensure_ascii=False,separators=(',',':')))
              for i,s in enumerate(scripts[:8]):
                  try:
                      ss,sh,sbody,sfinal=get(s,{'Referer':final},1024*1024)
                      eps=[]
                      for m in re.finditer(r'["\']([^"\']{1,220})["\']',sbody):
                          v=html.unescape(m.group(1))
                          if re.search(r'/(?:api|ajax|source|sources|stream|player|embed|get)(?:/|\?|$)|\.m3u8|\.mpd',v,re.I) and v not in eps:eps.append(v)
                      print(label+'_SCRIPT_'+str(i)+' '+json.dumps({'status':ss,'src':uinfo(sfinal),'bytes':len(sbody.encode()),'endpoints':[uinfo(urllib.parse.urljoin(sfinal,x)) for x in eps[:30]],'markers':{k:bool(re.search(k,sbody,re.I)) for k in ['m3u8','CryptoJS','WebAssembly','wasm','atob','fetch\\(','axios','source']}},separators=(',',':')))
                  except Exception as e:
                      print(label+'_SCRIPT_'+str(i)+' '+json.dumps({'src':uinfo(s),'error':type(e).__name__+': '+str(e)[:120]},separators=(',',':')))
              return body

          # MovieBox current player.
          st,hd,raw,_=get('https://vidsrcme.ru/vs_src.php?type=tv&id=94997&season=1&episode=1',{'Referer':'https://vidsrcme.ru/'})
          src=str(json.loads(raw).get('src') or '')
          inspect_html('CLOUDORCHESTRA',src,{'Referer':'https://vidsrcme.ru/','Origin':'https://vidsrcme.ru'})

          # Anikoto current chain to first server player.
          ah={'X-Requested-With':'XMLHttpRequest','Referer':'https://anikototv.to/'}
          st,hd,raw,_=get('https://anikototv.to/ajax/anime/search?keyword=death+note',ah)
          sh=((json.loads(raw).get('result') or {}).get('html') or '')
          hrefs=re.findall(r'href=["\']([^"\']+)',sh,re.I)
          exact=next((x for x in hrefs if 'death-note-fc8mq' in x),None)
          if not exact: raise SystemExit('Anikoto exact search candidate missing')
          ep=urllib.parse.urljoin(exact.rstrip('/')+'/', 'ep-1') if '/ep-' not in exact else exact
          # exact search href is series base; construct ep-1.
          ep=exact.rstrip('/')+'/ep-1'
          st,hd,body,_=get(ep,{'Referer':'https://anikototv.to/'})
          aid=(re.findall(r'data-id=["\']([^"\']+)',body,re.I) or [''])[0]
          st,hd,elist,_=get('https://anikototv.to/ajax/episode/list/'+aid,ah)
          eraw=json.loads(elist).get('result') or ''
          # Capture data attributes without printing opaque token values.
          tags=[]
          for m in re.finditer(r'<a\b([^>]*)>([\s\S]*?)</a>',eraw,re.I):
              attrs=m.group(1);txt=re.sub(r'<[^>]+>',' ',m.group(2));
              row={'text':' '.join(txt.split())[:100]}
              for key in ['data-id','data-ep-id','data-ids','data-num','data-slug','data-link-id']:
                  mm=re.search(key+r'=["\']([^"\']+)',attrs,re.I)
                  if mm:row[key]='<opaque>' if key not in {'data-num','data-slug'} else mm.group(1)[:100]
              if len(row)>1:tags.append(row)
          print('ANIKOTO_EP_ATTRIBUTES '+json.dumps(tags[:12],ensure_ascii=False,separators=(',',':')))
          # Reproduce Niak current extraction to first server link, while only surfacing player host/path.
          def vals(raw,pat):return re.findall(pat,raw,re.I)
          ids=vals(eraw,r'data-(?:ep-id|id)=["\']([^"\']+)') or vals(eraw,r'data-ids=["\']([^"\']+)')
          wanted=ids[0] if ids else ''
          # Better parse episode 1 block if data-num exists.
          blocks=re.findall(r'<a\b[^>]*>[\s\S]*?</a>',eraw,re.I)
          for block in blocks:
              if re.search(r'data-num=["\']?1["\']?',block,re.I):
                  mm=re.search(r'data-(?:ep-id|id|ids)=["\']([^"\']+)',block,re.I)
                  if mm:wanted=mm.group(1);break
          if not wanted:raise SystemExit('Anikoto episode token missing')
          st,hd,slist,_=get('https://anikototv.to/ajax/server/list?servers='+urllib.parse.quote(wanted,safe=''),ah)
          shtml=json.loads(slist).get('result') or slist
          links=re.findall(r'data-link-id=["\']([^"\']+)',shtml,re.I)
          if not links:
              links=re.findall(r'data-id=["\']([^"\']+)',shtml,re.I)
          print('ANIKOTO_SERVER_LIST '+json.dumps({'status':st,'count':len(links),'htmlBytes':len(shtml.encode())},separators=(',',':')))
          if links:
              st,hd,srv,_=get('https://anikototv.to/ajax/server?get='+urllib.parse.quote(links[0],safe=''),ah)
              data=json.loads(srv); r=data.get('result') if isinstance(data,dict) else None
              if isinstance(r,str):
                  try:r=json.loads(r)
                  except Exception:pass
              player=''
              if isinstance(r,dict):player=str(r.get('url') or r.get('file') or r.get('src') or '')
              if not player and isinstance(r,str):
                  mm=re.search(r'https?://[^"\'<> ]+',r);player=mm.group(0) if mm else ''
              print('ANIKOTO_PLAYER '+json.dumps({'status':st,'player':uinfo(player)},separators=(',',':')))
              if player:inspect_html('MEGAPLAY',player,{'Referer':ep})
          PY
