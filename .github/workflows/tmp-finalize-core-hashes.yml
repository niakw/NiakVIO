name: TMP Finalize Core Hashes

on:
  push:
    branches:
      - hotfix/purstream-core-policy-final-20260917

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/purstream-core-policy-final-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate excluded-temp-safe release hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/core_media_policy_test.py
          python3 tests/hls_playback_integrity_test.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 scripts/audit_provider_v3_static.py
          ! grep -q 'temp-finalize-purstream-core-policy.yml' FILE-HASHES.json
          ! grep -q 'temp-finalize-purstream-core-policy.yml' PATCH-SHA256SUMS.txt
          ! grep -q 'tmp-finalize-core-hashes.yml' FILE-HASHES.json
          ! grep -q 'tmp-finalize-core-hashes.yml' PATCH-SHA256SUMS.txt
          git diff --check

      - name: Commit clean release inventories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          if git diff --cached --quiet; then
            echo 'release inventories already clean'
          else
            git commit -m 'chore(release): refresh hashes after temp cleanup'
            git push origin HEAD:hotfix/purstream-core-policy-final-20260917
          fi
