name: Publish targeted VF catalogue adapters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-targeted-vf-adapters.yml"
      - ".github/triggers/publish-targeted-vf-adapters"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate exact catalogue adapters
        run: |
          python -m py_compile scripts/provider_patches/streamzo_public_catalogue.py
          python -m py_compile scripts/provider_patches/frenchstream_dle_catalogue.py
          python -m py_compile scripts/publish_targeted_vf_adapters.py
          python tests/targeted_vf_catalogue_adapters_test.py

      - name: Stage only live-proven providers
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/publish_targeted_vf_adapters.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Require exact Interstellar proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('automation/targeted-vf-publication.json').read_text(encoding='utf-8'))
          published = {row['id']: row for row in report.get('published', [])}
          for provider_id, row in published.items():
              assert row.get('stream_count', 0) > 0, (provider_id, row)
          assert published, report
          print('published targeted providers:', ', '.join(sorted(published)))
          PY

      - name: Run complete regression suite
        run: npm test

      - name: Regenerate and validate release
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py
          python scripts/validate_activation_preservation.py

      - name: Publish proven adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/streamzo--targeted-repair--*.js providers/frenchstream--targeted-repair--*.js \
            scripts/provider_patches/streamzo_public_catalogue.py \
            scripts/provider_patches/frenchstream_dle_catalogue.py \
            scripts/publish_targeted_vf_adapters.py \
            tests/targeted_vf_catalogue_adapters_test.py \
            automation/targeted-vf-publication.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish proven StreamZo and Frenchstream adapters"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
