name: TEMP - Reconcile Media Types V47

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-reconcile-media-types-v47.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  NUVIO_PROVIDER_V3_CONTEXT: publication

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}

      - name: Reconcile catalog and projections from executable manifest contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_provider_catalog_media_types.py --apply
          python3 scripts/reconcile_provider_catalog_media_types.py

      - name: Validate semantic/transport contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/canonical_media_types_test.py
          python3 tests/provider_anime_semantic_transport_contract_test.py
          python3 tests/global_media_type_pre_network_gate_test.py
          python3 tests/global_media_type_resolution_test.py
          python3 scripts/reapply_published_overrides.py --check
          git diff --check

      - name: Persist reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider_catalog.json manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json
          if ! git diff --cached --quiet; then git commit -m 'fix(types): reconcile catalog with current semantic contract'; fi
          git fetch origin fix/non-display-recovery-20260916
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "V47_PERSISTED sha=$(git rev-parse HEAD)"
