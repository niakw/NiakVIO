name: Apply TV hardening 5.20.39 candidate

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/apply-tv-hardening-5-20-39
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wire TV hardening profiles
        run: |
          cp manifest.json /tmp/manifest-before-tv-hardening.json
          python scripts/migrate_tv_hardening_5_20_39.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous /tmp/manifest-before-tv-hardening.json --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
      - name: Run TV hardening contract
        run: python tests/tv_provider_hardening_test.py
      - name: Run complete regression suite
        run: npm test
      - name: Regenerate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit tested TV candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No candidate changes to commit.'
            exit 0
          fi
          git commit -m "fix: harden Nuvio TV provider playback"
          git push origin HEAD:agent/tv-regression-5.20.38
