name: TEMP - AniKoto v2 network trace

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-anikoto-v2-network-trace.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage V2 and print sanitized worker network observations
        run: |
          set -euo pipefail
          python3 scripts/upgrade_anikototv_megaplay_runtime_v2.py
          python3 scripts/materialize_provider_v3_one.py anikototv
          python3 - <<'PY'
          import json,subprocess,urllib.parse
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          f={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          cat=p.local_catalog()
          cmd=['node','scripts/provider_worker.cjs',str(cat['anikototv']['path']),json.dumps(f,separators=(',',':')),json.dumps(p.context_for(f),separators=(',',':'))]
          cp=subprocess.run(cmd,capture_output=True,text=True,timeout=75)
          payload={}
          for line in cp.stdout.splitlines():
            if line.startswith('NUVIO_HEALTH_RESULT='):
              payload=json.loads(line.split('=',1)[1])
          def clean_url(v):
            try:
              u=urllib.parse.urlsplit(str(v or '')); return {'host':u.netloc,'path':u.path,'queryKeys':sorted(urllib.parse.parse_qs(u.query).keys())}
            except Exception:return {'raw':str(v)[:120]}
          obs=[]
          for row in payload.get('network_observations') or []:
            if not isinstance(row,dict):continue
            x={}
            for k,v in row.items():
              if k.lower() in {'url','requesturl','finalurl','location'}:x[k]=clean_url(v)
              elif k in {'status','method','ok','contentType','responseType','bodyBytes','bytes','error','phase'}:x[k]=v
            obs.append(x)
          out={
            'stream_count':payload.get('stream_count'),
            'raw_stream_count':payload.get('raw_stream_count'),
            'statuses':payload.get('provider_server_http_statuses'),
            'serverAccessible':payload.get('provider_server_accessible'),
            'serverSuccess':payload.get('provider_server_successful_response'),
            'error':payload.get('error_details'),
            'observations':obs,
          }
          print('ANIKOTO_V2_TRACE '+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Reproduce current MegaPlay final hop directly
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def get(url,headers=None):
            h={'User-Agent':UA,'Accept':'application/json,text/html,*/*'};h.update(headers or {})
            q=urllib.request.Request(url,headers=h)
            with urllib.request.urlopen(q,timeout=18) as r:return r.status,r.headers,r.read(2*1024*1024).decode('utf-8','replace'),r.url
          ah={'X-Requested-With':'XMLHttpRequest','Referer':'https://anikototv.to/'}
          _,_,raw,_=get('https://anikototv.to/ajax/anime/search?keyword=death+note',ah)
          sh=((json.loads(raw).get('result') or {}).get('html') or '')
          m=re.search(r'href=["\'](https://anikototv\.to/watch/death-note-fc8mq)["\']',sh,re.I)
          base=m.group(1) if m else 'https://anikototv.to/watch/death-note-fc8mq'
          _,_,body,watch=get(base,{'Referer':'https://anikototv.to/'})
          aid=(re.findall(r'id=["\']watch-main["\'][^>]*data-id=["\']([^"\']+)',body,re.I) or re.findall(r'data-id=["\']([^"\']+)["\'][^>]*id=["\']watch-main["\']',body,re.I))[0]
          _,_,elist,_=get('https://anikototv.to/ajax/episode/list/'+aid,ah)
          ehtml=(json.loads(elist).get('result') or '')
          # first row = episode 1 for Death Note; extract provider ids contractually.
          blocks=re.findall(r'<a\b[^>]*>[\s\S]*?</a>',ehtml,re.I)
          block=next((b for b in blocks if re.search(r'data-num=["\']1["\']',b,re.I)),blocks[0] if blocks else '')
          ids=(re.findall(r'data-ids=["\']([^"\']+)',block,re.I) or re.findall(r'data-(?:ep-id|id)=["\']([^"\']+)',block,re.I))[0]
          _,_,slist,_=get('https://anikototv.to/ajax/server/list?servers='+urllib.parse.quote(ids,safe=''),ah)
          shtml=json.loads(slist).get('result') or ''
          link=(re.findall(r'data-link-id=["\']([^"\']+)',shtml,re.I) or re.findall(r'data-id=["\']([^"\']+)',shtml,re.I))[0]
          _,_,srv,_=get('https://anikototv.to/ajax/server?get='+urllib.parse.quote(link,safe=''),ah)
          r=json.loads(srv).get('result')
          if isinstance(r,str):
            try:r=json.loads(r)
            except Exception:pass
          player=str((r or {}).get('url') or (r or {}).get('file') or (r or {}).get('src') or '') if isinstance(r,dict) else ''
          pu=urllib.parse.urlsplit(player)
          print('ANIKOTO_LIVE_PLAYER '+json.dumps({'host':pu.netloc,'path':pu.path},separators=(',',':')))
          st,hd,page,final=get(player,{'Referer':watch})
          title=(re.findall(r'<title[^>]*>(.*?)</title>',page,re.I|re.S) or [''])[0].strip()
          fm=re.search(r'File\s+(\d+)\s*-\s*MegaPlay',title,re.I)
          print('ANIKOTO_MEGAPLAY_EMBED '+json.dumps({'status':st,'titlePattern':bool(fm),'title':title[:100]},ensure_ascii=False,separators=(',',':')))
          if not fm: raise SystemExit('MegaPlay file id absent')
          fid=fm.group(1)
          st,hd,sources,final=get('https://megaplay.buzz/stream/getSources?id='+fid,{'Referer':player,'X-Requested-With':'XMLHttpRequest'})
          data=json.loads(sources); src=data.get('sources')
          file=''
          if isinstance(src,dict):file=str(src.get('file') or src.get('url') or '')
          u=urllib.parse.urlsplit(file)
          print('ANIKOTO_MEGAPLAY_SOURCES '+json.dumps({'status':st,'keys':sorted(data.keys()),'sourceType':type(src).__name__,'mediaHost':u.netloc,'mediaPath':u.path,'isHls':'.m3u8' in u.path.lower(),'trackCount':len(data.get('tracks') or []) if isinstance(data.get('tracks'),list) else 0},separators=(',',':')))
          if file:
            try:
              st2,hd2,txt,_=get(file,{'Referer':'https://megaplay.buzz/'})
              print('ANIKOTO_MEGAPLAY_MEDIA '+json.dumps({'status':st2,'contentType':hd2.get('content-type',''),'extm3u':txt.lstrip().startswith('#EXTM3U'),'bytes':len(txt.encode())},separators=(',',':')))
            except urllib.error.HTTPError as e:
              print('ANIKOTO_MEGAPLAY_MEDIA '+json.dumps({'status':e.code,'contentType':e.headers.get('content-type','')},separators=(',',':')))
          PY
