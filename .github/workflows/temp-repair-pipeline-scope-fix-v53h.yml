name: TEMP - Repair Pipeline Scope Fix V53H

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - '.github/workflows/temp-repair-pipeline-scope-fix-v53h.yml'

permissions:
  contents: write

jobs:
  fix-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Make MOVIX diagnostic scope-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/enforce_route_proof_manifest_policy_v1.py')
          s=p.read_text(encoding='utf-8')
          old='''    movix_proof = recovered.get("movix")\n    if not isinstance(movix_proof, dict):\n        raise SystemExit("MOVIX route proof missing")\n    movix_patch_present = isinstance(patches.get("movix"), dict)\n'''
          new='''    movix_proof = recovered.get("movix")\n    if not isinstance(movix_proof, dict):\n        # Targeted repair reports are allowed to omit MOVIX entirely. This owner\n        # diagnoses MOVIX only when MOVIX evidence is in scope; it must not turn\n        # an unrelated targeted run into a global dependency or invent state.\n        print(\n            "ROUTE_PROOF_MANIFEST_POLICY_V1_OK "\n            "movix_scope=absent state=not-in-report activation_mutated=false"\n        )\n        return 0\n    movix_patch_present = isinstance(patches.get("movix"), dict)\n'''
          if old not in s:
              raise SystemExit('MOVIX scope anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          t=Path('tests/route_proof_manifest_policy_test.py')
          s=t.read_text(encoding='utf-8')
          marker='''print("route-proof diagnostic-only activation policy tests passed: manifest+override activation bytes preserved")\n'''
          block='''with tempfile.TemporaryDirectory(prefix="niakvio-route-policy-targeted-") as raw:\n    tmp = Path(raw)\n    report = tmp / "report.json"\n    manifest = tmp / "manifest.json"\n    overrides = tmp / "overrides.json"\n    health = tmp / "health.json"\n    report_value = {"schemaVersion": 5, "providers": [{"providerId": "animesama-co", "status": "proven", "routes": ["/search"]}]}\n    manifest_value = {"scrapers": [{"id": "MOVIX", "enabled": True}, {"id": "ANIMESAMA-CO", "enabled": True}]}\n    overrides_value = {"provider_patches": {"animesama-co": {"learned_routes": ["/search"]}}}\n    health_value = {"providers": [{"id": "movix", "enabled": True, "action": "unchanged"}]}\n    dump(report, report_value)\n    dump(manifest, manifest_value)\n    dump(overrides, overrides_value)\n    dump(health, health_value)\n    before = {\n        "manifest": manifest.read_bytes(),\n        "overrides": overrides.read_bytes(),\n        "health": health.read_bytes(),\n    }\n    done = subprocess.run(\n        [\n            sys.executable, str(SCRIPT),\n            "--report", str(report),\n            "--manifest", str(manifest),\n            "--overrides", str(overrides),\n            "--health-report", str(health),\n        ],\n        cwd=ROOT, capture_output=True, text=True, check=False,\n    )\n    assert done.returncode == 0, done.stdout + done.stderr\n    assert "movix_scope=absent" in done.stdout, done.stdout\n    assert manifest.read_bytes() == before["manifest"], "targeted non-MOVIX report mutated manifest"\n    assert overrides.read_bytes() == before["overrides"], "targeted non-MOVIX report mutated overrides"\n    assert health.read_bytes() == before["health"], "targeted non-MOVIX report mutated health"\n\n'''
          if marker not in s:
              raise SystemExit('route policy test marker not found')
          t.write_text(s.replace(marker,block+marker,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/enforce_route_proof_manifest_policy_v1.py tests/route_proof_manifest_policy_test.py
          python3 tests/route_proof_manifest_policy_test.py
          git diff --check
      - name: Persist permanent scope fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/enforce_route_proof_manifest_policy_v1.py tests/route_proof_manifest_policy_test.py
          git commit -m 'fix(repair): scope MOVIX route diagnostics to report evidence'
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
      - name: Continue targeted repair after scope fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_provider_repair_fast_targeted_v1.py \
            --provider animesama-co --workers 2 --timeout 35 --attempts 2 --defer-global-guard
          python3 - <<'PY'
          import json
          print('V53H_SUMMARY',json.dumps(json.load(open('automation/provider-repair-fast-summary.json')),sort_keys=True))
          PY
          git diff --check
          git status --short
