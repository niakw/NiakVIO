name: Validate public Nuvio install URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "manifest.json"
      - "vf/manifest.json"
      - "nuvio-client-id-state.json"
      - ".github/workflows/validate-nuvio-install-url.yml"
      - ".github/triggers/validate-nuvio-install-url"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate permanent manifest URL and published bundles
        env:
          INSTALL_URL: https://raw.githubusercontent.com/niakw/Niakvio/refs/heads/main/manifest.json
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$INSTALL_URL" -o /tmp/public-manifest.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          install_url = os.environ['INSTALL_URL']
          assert '?' not in install_url, install_url
          public_bytes = Path('/tmp/public-manifest.json').read_bytes()
          repository_bytes = Path('manifest.json').read_bytes()
          assert hashlib.sha256(public_bytes).digest() == hashlib.sha256(repository_bytes).digest(), 'public manifest differs from main'

          manifest = json.loads(public_bytes)
          state = json.loads(Path('nuvio-client-id-state.json').read_text(encoding='utf-8'))
          rows = manifest.get('scrapers') or []
          enabled = [row for row in rows if row.get('enabled') is True]
          assert len(rows) == 89, len(rows)
          assert len(enabled) == state.get('active_count') == 62, (len(enabled), state.get('active_count'))
          assert all(str(row.get('id') or '').isupper() for row in enabled)

          canonical_rows = {str(row.get('id') or '').casefold(): row for row in rows}
          for provider_id, recorded in (state.get('providers') or {}).items():
              row = canonical_rows[provider_id]
              assert row.get('id') == recorded.get('client_id'), provider_id
              assert bool(row.get('enabled')) == bool(recorded.get('enabled')), provider_id

          base = install_url.removesuffix('/manifest.json')
          failures = []
          for row in enabled:
              filename = str(row.get('filename') or '').lstrip('/')
              code_url = filename if filename.startswith(('http://', 'https://')) else f'{base}/{filename}'
              try:
                  request = urllib.request.Request(code_url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = response.read(256)
                      if response.status != 200 or not payload:
                          failures.append((row.get('id'), response.status, code_url))
              except Exception as error:
                  failures.append((row.get('id'), str(error), code_url))
          assert not failures, failures[:10]
          print(f'permanent Nuvio URL validated: version={manifest["version"]}, total={len(rows)}, enabled={len(enabled)}, bundles={len(enabled)}')
          PY

      - name: Validate VF projection
        run: python scripts/validate_vf_projection.py
