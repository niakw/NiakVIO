name: TEMP - Recover provider Lego wiring

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-mugiwara-dead-host-budget.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Restore owned provider Lego wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('scripts/provider_patches/mugiwarastream_packed_runtime_v1.py')
          s=p.read_text(encoding='utf-8')
          marker='NIAKVIO_MUGIWARA_NATIVE_DEAD_HOST_BYPASS_V2'
          if marker not in s:
              old='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
              new='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);/* NIAKVIO_MUGIWARA_NATIVE_DEAD_HOST_BYPASS_V2 */if(/^https?:\\/\\/(?:www\\.)?sendvid\\.com\\//i.test(u)||/^https?:\\/\\/(?:www\\.)?oneupload\\.to\\//i.test(u))throw new Error("NIAKVIO_DEAD_PLAYER_BYPASS");if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
              if old not in s:
                  raise SystemExit('target Mugiwara fetch wrapper not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          path=Path('provider-overrides.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          patches=data.setdefault('provider_patches',{})
          wanted={
              'animevostfr':'scripts/provider_patches/animevostfr_runtime_v1.py',
              'animesama-co':'scripts/provider_patches/animesamaco_site_runtime_v1.py',
              'kurage':'scripts/provider_patches/kurage_runtime_v1.py',
          }
          for pid,script in wanted.items():
              row=patches.setdefault(pid,{})
              lego=row.get('provider_lego_scripts')
              if not isinstance(lego,list): lego=[]
              if script not in lego: lego.append(script)
              row['provider_lego_scripts']=lego
              print('RESTORED_LEGO',pid,script)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python -m py_compile \
            scripts/provider_patches/mugiwarastream_packed_runtime_v1.py \
            scripts/provider_patches/animevostfr_runtime_v1.py \
            scripts/provider_patches/animesamaco_site_runtime_v1.py \
            scripts/provider_patches/kurage_runtime_v1.py

      - name: Re-materialize Hub46 providers
        run: |
          python scripts/materialize_provider_v3_all.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('provider-v3-materialization.json').read_text())
          rows=d.get('providers') or []
          assert len(rows)==46, len(rows)
          print('HUB46_MATERIALIZATION_OK providers=46')
          PY

      - name: Verify exact terminal regressions
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity_v3 as v3

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows={str(x.get('id') or '').lower():x for x in manifest.get('scrapers') or []}
          cases={
            'mugiwarastream':{'tmdbId':'63926','mediaType':'anime','category':'anime','title':'One Punch Man','year':2015,'season':1,'episode':1},
            'animevostfr':{'tmdbId':'95479','mediaType':'anime','category':'anime','title':'Jujutsu Kaisen','year':2020,'season':1,'episode':1},
            'animesama-co':{'tmdbId':'45782','mediaType':'anime','category':'anime','title':'Sword Art Online','year':2012,'season':1,'episode':1},
            'kurage':{'tmdbId':'94664','mediaType':'anime','category':'anime','title':'Mushoku Tensei: Jobless Reincarnation','year':2021,'season':1,'episode':1},
            'streamzo':{'tmdbId':'240411','mediaType':'anime','category':'anime','title':'Dan Da Dan','year':2024,'season':1,'episode':1},
          }
          failures=[]
          for pid,fixture in cases.items():
              path=Path(rows[pid]['filename'])
              r=v3._run_verified(path,fixture,35)
              summary={k:r.get(k) for k in ('stream_count','candidate_stream_count','raw_stream_count','terminal_verified','terminal_kinds','terminal_statuses','terminal_reasons','http_statuses','error_class')}
              print('EXACT_TERMINAL',pid,json.dumps(summary,sort_keys=True))
              if int(r.get('stream_count') or 0)<1:
                  failures.append(pid)
          if failures:
              raise SystemExit('terminal regressions remain: '+','.join(failures))
          PY

      - name: Recheck previous full32 reds
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 5 --timeout 25 \
            --seed 20260914-recovered-lego \
            --out /tmp/recovered-v3.json \
            --provider mugiwarastream --provider animevostfr --provider animesama-co --provider kurage --provider streamzo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/recovered-v3.json'))
          print('RECOVERED_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('RECOVERED_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          for p in d.get('providers') or []:
              print('RECOVERED_PROVIDER',p.get('providerId'),p.get('status'),json.dumps([(x.get('lane'),x.get('status')) for x in p.get('lanes') or []]))
          PY

      - name: Commit verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            provider-overrides.json \
            scripts/provider_patches/mugiwarastream_packed_runtime_v1.py \
            providers/ manifest.json provider-v3-materialization.json
          if git diff --cached --quiet; then
            echo 'No repair diff to commit'; exit 1
          fi
          git commit -m 'fix: restore provider Lego wiring and Mugiwara fallback budget'
          git push origin HEAD:fix/labs-5.21.44-20260912
