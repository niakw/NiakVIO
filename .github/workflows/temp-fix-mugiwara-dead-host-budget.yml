name: TEMP - Fix Mugiwara dead-host budget

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-mugiwara-dead-host-budget.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Patch owned Mugiwara Lego
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/provider_patches/mugiwarastream_packed_runtime_v1.py')
          s=p.read_text(encoding='utf-8')
          old='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
          new='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);/* NIAKVIO_MUGIWARA_NATIVE_DEAD_HOST_BYPASS_V2 */if(/^https?:\\/\\/(?:www\\.)?sendvid\\.com\\//i.test(u)||/^https?:\\/\\/(?:www\\.)?oneupload\\.to\\//i.test(u))throw new Error("NIAKVIO_DEAD_PLAYER_BYPASS");if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
          if old not in s:
              raise SystemExit('target Mugiwara fetch wrapper not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/provider_patches/mugiwarastream_packed_runtime_v1.py
      - name: Re-materialize clean providers
        run: |
          python scripts/materialize_provider_v3_all.py
          python tests/published_provider_lego_contract_test.py
          python tests/provider_anime_semantic_transport_contract_test.py
      - name: Verify One Punch Man terminal recovery
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          m=json.loads(Path('manifest.json').read_text());row=next(x for x in m['scrapers'] if str(x['id']).lower()=='mugiwarastream')
          f={'tmdbId':'63926','mediaType':'anime','category':'anime','title':'One Punch Man','year':2015,'season':1,'episode':1}
          cp=subprocess.run(['node','scripts/provider_worker.cjs',row['filename'],json.dumps(f,separators=(',',':')),json.dumps(p.context_for(f),separators=(',',':'))],capture_output=True,text=True,timeout=70)
          r={}
          for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='): r=json.loads(line.split('=',1)[1])
          print('MUGI_FIX_RESULT',json.dumps({'count':r.get('stream_count'),'raw':r.get('raw_stream_count'),'statuses':r.get('provider_server_http_statuses'),'hosts':r.get('provider_server_hosts')},sort_keys=True))
          assert int(r.get('stream_count') or 0)>=1,r
          PY
          python scripts/run_provider_upstream_parity_v3.py --scope-matrix automation/evidence/hub-lab-matrix-46.json --samples-per-lane 32 --workers 1 --timeout 25 --seed 20260914-hub46-reg-a --out /tmp/mugi-v3.json --provider mugiwarastream
          python - <<'PY'
          import json
          d=json.load(open('/tmp/mugi-v3.json'))
          print('MUGI_FIX_PARITY',json.dumps({'counts':d.get('statusCounts'),'regressions':d.get('certainRegressions')},sort_keys=True))
          assert 'mugiwarastream' not in (d.get('certainRegressions') or []),d
          PY
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider_patches/mugiwarastream_packed_runtime_v1.py providers/ manifest.json provider-v3-materialization.json
          if git diff --cached --quiet; then
            echo 'No repair diff to commit'; exit 1
          fi
          git commit -m 'fix: bypass dead Mugiwara hosts before specialized fallback'
          git push origin HEAD:fix/labs-5.21.44-20260912
