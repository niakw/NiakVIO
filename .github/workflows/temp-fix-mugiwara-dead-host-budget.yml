name: TEMP - Persist verified provider repairs

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-mugiwara-dead-host-budget.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Apply only already-proven repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('scripts/provider_patches/mugiwarastream_packed_runtime_v1.py')
          s=p.read_text(encoding='utf-8')
          marker='NIAKVIO_MUGIWARA_NATIVE_DEAD_HOST_BYPASS_V2'
          if marker not in s:
              old='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
              new='var nativeFetch=g.fetch,pageUrl="";g.fetch=async function(url,opt){var u=s(url);/* NIAKVIO_MUGIWARA_NATIVE_DEAD_HOST_BYPASS_V2 */if(/^https?:\\/\\/(?:www\\.)?sendvid\\.com\\//i.test(u)||/^https?:\\/\\/(?:www\\.)?oneupload\\.to\\//i.test(u))throw new Error("NIAKVIO_DEAD_PLAYER_BYPASS");if(isMugi(u)&&/\\/catalogue\\/[^/?#]+\\/(?:episodes\\/saison\\d+|films)(?:[/?#]|$)/i.test(u))pageUrl=u;'
              if old not in s:
                  raise SystemExit('target Mugiwara fetch wrapper not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          path=Path('provider-overrides.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          patches=data.setdefault('provider_patches',{})
          pid='animesama-co'; script='scripts/provider_patches/animesamaco_site_runtime_v1.py'
          row=patches.setdefault(pid,{})
          lego=row.get('provider_lego_scripts')
          if not isinstance(lego,list): lego=[]
          if script not in lego: lego.append(script)
          row['provider_lego_scripts']=lego
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python -m py_compile scripts/provider_patches/mugiwarastream_packed_runtime_v1.py scripts/provider_patches/animesamaco_site_runtime_v1.py

      - name: Re-materialize Hub46
        run: |
          python scripts/materialize_provider_v3_all.py
          python - <<'PY'
          import json
          d=json.load(open('provider-v3-materialization.json'))
          assert len(d.get('providers') or [])==46
          print('HUB46_MATERIALIZATION_OK providers=46')
          PY

      - name: Exact terminal proof
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity_v3 as v3
          m=json.loads(Path('manifest.json').read_text()); rows={str(x['id']).lower():x for x in m['scrapers']}
          cases={
            'mugiwarastream':{'tmdbId':'63926','mediaType':'anime','category':'anime','title':'One Punch Man','year':2015,'season':1,'episode':1},
            'animesama-co':{'tmdbId':'45782','mediaType':'anime','category':'anime','title':'Sword Art Online','year':2012,'season':1,'episode':1},
            'streamzo':{'tmdbId':'240411','mediaType':'anime','category':'anime','title':'Dan Da Dan','year':2024,'season':1,'episode':1},
          }
          for pid,f in cases.items():
              r=v3._run_verified(Path(rows[pid]['filename']),f,35)
              print('EXACT_VERIFIED',pid,json.dumps(r,sort_keys=True))
              assert int(r.get('stream_count') or 0)>=1,(pid,r)
          PY

      - name: Commit proven repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json scripts/provider_patches/mugiwarastream_packed_runtime_v1.py providers/ manifest.json provider-v3-materialization.json
          git diff --cached --quiet && { echo 'No repair diff'; exit 1; }
          git commit -m 'fix: persist Mugiwara fallback and AnimeSamaCo runtime'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
