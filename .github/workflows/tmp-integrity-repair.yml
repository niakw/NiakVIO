name: Temporary clean client validation dispatcher

on:
  push:
    paths:
      - '.github/workflows/tmp-integrity-repair.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch media transport lab on clean main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/nuvio-client-lab.yml/dispatches" \
            -d '{"ref":"main","inputs":{"provider_ids":"PURSTREAM,GOATED,MOVIX","tmdb_id":"157336","media_type":"movie","title":"Interstellar","year":"2014"}}'

      - name: Dispatch final native client validation on clean main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/final-native-client-validation-v2.yml/dispatches" \
            -d '{"ref":"main"}'
