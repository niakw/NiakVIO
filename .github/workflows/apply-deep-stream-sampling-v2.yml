name: Apply deep stream sampling v2

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/apply-deep-stream-sampling-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply representative deep stream sampling
        run: python scripts/migrate_deep_stream_sampling_v2.py
      - name: Validate targeted sampling contract
        run: python tests/deep_stream_sampling_test.py
      - name: Run complete regression suite
        run: npm test
      - name: Regenerate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit validated deep sampling fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: sample representative mirrors in deep validation"
          git push origin HEAD:agent/tv-regression-5.20.38
