name: DIAG - Six Current Non-Display Regression Route Deltas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-six-regression-route-diff-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-six-current-regression-route-deltas
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install declared provider parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Trace normalized local versus upstream routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import concurrent.futures,json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3

          cases=[
            ('animesama-co','anime','45950'),
            ('animevostfr','anime','95479'),
            ('coflix','movie','10195'),
            ('coflix','tv','94997'),
            ('neko-sama','anime','65930'),
            ('sekai','anime','65930'),
            ('voiranime-rip','anime','120089'),
          ]
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text(encoding='utf-8'))
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); upstreams,_=v2.upstream_catalog()

          def compact(result):
            routes=[]
            for o in result.get('network_observations') or []:
              if not isinstance(o,dict) or o.get('infrastructure'): continue
              routes.append({k:o.get(k) for k in ('stage','method','host','path_pattern','status','ok','error_code') if o.get(k) is not None})
            return {
              'stream_count':int(result.get('stream_count') or 0),
              'raw_stream_count':int(result.get('raw_stream_count') or 0),
              'error_class':result.get('error_class'),
              'timeout':bool(result.get('timeout')),
              'routes':routes,
            }

          def one(case):
            pid,lane,tmdb=case; fx=fixtures[(lane,tmdb)]
            with tempfile.TemporaryDirectory() as td:
              up=pathlib.Path(td)/(pid+'-up.js');up.write_bytes(p.get_bytes(upstreams[pid]['url']))
              lr=v3._worker_raw(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
              ur=v3._worker_raw(up,v3.fixture_payload(fx,lane,upstream=True),25)
            return {'providerId':pid,'lane':lane,'fixture':fx['slug'],'tmdbId':tmdb,'niak':compact(lr),'upstream':compact(ur)}

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
            fs={ex.submit(one,case):case for case in cases}
            for f in concurrent.futures.as_completed(fs):
              case=fs[f]
              try: rows.append(f.result())
              except Exception as e: rows.append({'providerId':case[0],'lane':case[1],'tmdbId':case[2],'error':type(e).__name__+': '+str(e)})
          rows.sort(key=lambda x:(x.get('providerId',''),x.get('lane',''),x.get('tmdbId','')))
          pathlib.Path('automation/six-current-regression-route-deltas.json').write_text(json.dumps({'rows':rows},indent=2)+'\n',encoding='utf-8')
          for row in rows: print('ROUTE_DELTA '+json.dumps(row,sort_keys=True))
          if any('error' in r for r in rows): raise SystemExit('route delta incomplete')
          PY
      - name: Upload route-delta evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-current-regression-route-deltas-${{ github.run_id }}
          path: automation/six-current-regression-route-deltas.json
          if-no-files-found: warn
          retention-days: 14
