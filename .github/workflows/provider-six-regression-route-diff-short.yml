name: DIAG - Six Regression Route Deltas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-six-regression-route-diff-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-six-regression-route-deltas
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Trace normalized routes for six exact fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import concurrent.futures,json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          wanted={
            'animekai':('anime','62715'),
            'french-manga':('anime','46298'),
            'neko-sama':('anime','95479'),
            'playimdb':('tv','71446'),
            'voiranime':('anime','65648'),
            'voiranime-homes':('anime','240411'),
          }
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text(encoding='utf-8'))
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); upstreams,_=v2.upstream_catalog()
          def compact(result):
            routes=[]
            for o in result.get('network_observations') or []:
              if not isinstance(o,dict) or o.get('infrastructure'): continue
              routes.append({k:o.get(k) for k in ('stage','method','host','path_pattern','status','ok','error_code') if o.get(k) is not None})
            return {'stream_count':int(result.get('stream_count') or 0),'raw_stream_count':int(result.get('raw_stream_count') or 0),'routes':routes}
          def one(pid):
            lane,tmdb=wanted[pid]; fx=fixtures[(lane,tmdb)]
            with tempfile.TemporaryDirectory() as td:
              up=pathlib.Path(td)/(pid+'-up.js');up.write_bytes(p.get_bytes(upstreams[pid]['url']))
              lr=v3._worker_raw(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
              ur=v3._worker_raw(up,v3.fixture_payload(fx,lane,upstream=True),25)
            return {'providerId':pid,'fixture':fx['slug'],'niak':compact(lr),'upstream':compact(ur)}
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            fs={ex.submit(one,pid):pid for pid in wanted}
            for f in concurrent.futures.as_completed(fs):
              pid=fs[f]
              try: rows.append(f.result())
              except Exception as e: rows.append({'providerId':pid,'error':type(e).__name__})
          for row in sorted(rows,key=lambda x:x['providerId']): print('ROUTE_DELTA '+json.dumps(row,sort_keys=True))
          if any('error' in r for r in rows): raise SystemExit('route delta incomplete')
          PY
