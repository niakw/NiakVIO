name: TEMP - AllWish stale stream-proof invalidation

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths:
      - scripts/invalidate_allwish_stale_stream_proof_v1.py
      - .github/workflows/temp-allwish-stale-proof-invalidation.yml

permissions:
  contents: write

jobs:
  invalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Invalidate stale proof and materialize fail-closed state
        run: |
          set -euo pipefail
          python3 scripts/invalidate_allwish_stale_stream_proof_v1.py
          python3 scripts/materialize_provider_v3_one.py allwish
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/provider_v3_final_stage_minimizer_gate_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py
      - name: Assert live proof is no longer claimed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('provider-overrides.json').read_text()); r=d['provider_patches']['allwish']; x=r['repair_disposition']
          assert r['route_data_state']=='repair'
          assert x.get('completeCapabilityProof') is False
          assert x.get('currentVerifiedLanes')==[]
          assert x.get('provenLanes')==[]
          assert sorted(x.get('missingLanes') or [])==['movie','tv']
          assert r.get('current_stream_proof',{}).get('streamPositive') is False
          print('ALLWISH_LIVE_PROOF_TRUTH_OK enabled_scope_preserved=true stream_proven=false fail_closed=true')
          PY
      - name: Record memory and commit truth correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8')
          marker='## 2026-09-13 — AllWish stale playable proof invalidated'
          if marker not in t:
            t += f'''\n{marker}\n\n- AllWish remains catalogued/enabled by scope policy, but fresh ZERO15 adaptive proof exhausted the current global movie/TV corpus with zero streams. Historical manual evidence also showed fixture-invariant very short wrong-content media across unrelated works.\n- Therefore old `playable_verified`/complete-capability claims are invalidated: `route_data_state=repair`, no current verified/proven lanes, movie+TV missing. Historical route knowledge is retained only as diagnostic evidence.\n- Runtime remains fail-closed until a fresh identity-safe terminal media proof exists. Workspace materialization did not run the final-stage minimizer.\n'''
            p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json manifest.json providers/ vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json scripts/invalidate_allwish_stale_stream_proof_v1.py MEMORY.md
          git commit -m 'fix(allwish): invalidate stale playable proof'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
