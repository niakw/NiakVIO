name: Verify published provider transaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-published-main-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-published-main-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact published main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove validated provider transaction is already published
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 51c25116cab9ce7c923ee3f1ba35694644269c4a -- \
            manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json provider_catalog.json providers/ \
            PROVENANCE.json provider-overrides.json provider-domain-history.json \
            upstream-lkg.json upstream-lkg/ health-report.json health-history.json \
            dns-preflight-report.json provider-hub-report.json diagnostics-report.json \
            diagnostics-report.html route-regressions.json repair-report.json

      - name: Verify published runtime fixed point
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node engine_v2/tests/provider-catalog.test.mjs
          python scripts/activation_preservation_core_rehash.py
          python scripts/validate_language_projection.py

          # Verification must not rewrite provider/catalog/provenance state.
          if ! git diff --quiet -- \
            manifest.json vf/manifest.json provider_catalog.json providers/ \
            PROVENANCE.json provider-overrides.json provider-domain-history.json \
            upstream-lkg.json upstream-lkg/ health-report.json health-history.json \
            dns-preflight-report.json provider-hub-report.json diagnostics-report.json \
            diagnostics-report.html route-regressions.json repair-report.json; then
            echo "::error::Published provider state is not a fixed point."
            git diff --stat
            exit 1
          fi

      # no-anime-projection-verification-v1
      - name: Refresh release hashes for current main
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit hash-only refresh when required
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only inventories may change during this verification job.
          UNEXPECTED="$(git status --porcelain | grep -Ev ' (FILE-HASHES\.json|PATCH-SHA256SUMS\.txt|SHA256SUMS\.json)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected tracked changes after exact-main verification:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if git diff --cached --quiet; then
            echo 'Release hashes already current.'
            exit 0
          fi
          git commit -m "chore: refresh release hashes after published verification [skip ci]"
          git push origin HEAD:main

      - name: Final integrity check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release_integrity.py
          git diff --exit-code
