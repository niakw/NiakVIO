name: MEMORY checkpoint

on:
  push:
    branches: [main]
    paths:
      - automation/memory-checkpoint-pending-v2.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-checkpoint-main
  cancel-in-progress: false

jobs:
  append-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append pending checkpoint idempotently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pending_path = Path('automation/memory-checkpoint-pending-v2.md')
          memory_path = Path('MEMORY.md')
          sentinel = '<!-- NIAKVIO_MEMORY_PENDING_EMPTY -->'

          if not pending_path.exists():
              raise SystemExit('missing pending checkpoint file')
          pending = pending_path.read_text(encoding='utf-8').strip()
          if not pending or pending == sentinel:
              print('MEMORY_PENDING_EMPTY')
              raise SystemExit(0)

          memory = memory_path.read_text(encoding='utf-8')
          marker = None
          for line in pending.splitlines():
              if line.startswith('<!-- NIAKVIO_MEMORY_CHECKPOINT:'):
                  marker = line.strip()
                  break
          if not marker:
              raise SystemExit('missing checkpoint id marker')

          if marker not in memory:
              if not memory.endswith('\n'):
                  memory += '\n'
              memory += '\n' + pending + '\n'
              memory_path.write_text(memory, encoding='utf-8')
              print('MEMORY_APPENDED')
          else:
              print('MEMORY_ALREADY_CONTAINS_CHECKPOINT')

          pending_path.write_text(sentinel + '\n', encoding='utf-8')
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          if git diff --quiet -- MEMORY.md automation/memory-checkpoint-pending-v2.md; then
            echo MEMORY_NO_CHANGES
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEMORY.md automation/memory-checkpoint-pending-v2.md
          git commit -m "docs(memory): append durable recovery checkpoint"
          git pull --rebase origin main
          git push origin HEAD:main
