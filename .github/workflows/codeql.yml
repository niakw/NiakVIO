name: "SEC - CodeQL"

# CodeQL scans maintained source, not content-addressed generated Provider JS.
# Exact published providers remain blocking through NiakVIO's byte-level syntax,
# runtime, hardening, forbidden-pattern, fixed-point, reverse and integrity gates.
# Historical provider-old/ and evidence/upstream snapshots are never current code.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "engine_v2/**"
      - "provider-bases/**"
      - "scripts/**"
      - "tests/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "package.json"
      - "package-lock.json"
      - "requirements*.txt"
  schedule:
    - cron: "42 18 * * 6"
  workflow_dispatch:
    inputs:
      dismiss_open_alerts:
        description: "Dismiss all currently open CodeQL alerts instead of running analysis"
        required: false
        type: boolean
        default: false

concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  dismiss-open-alerts:
    name: "CodeQL · dismiss open alerts"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dismiss_open_alerts == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dismiss every open CodeQL alert
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          dismissed=0
          already=0
          failed=0

          for pass in 1 2 3; do
            mapfile -t alerts < <(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
                --jq '.[] | select((.tool.name // "") == "CodeQL") | .number' \
                | sort -nu
            )

            echo "Pass ${pass}: ${#alerts[@]} CodeQL alerts currently reported open."
            (( ${#alerts[@]} == 0 )) && break

            for number in "${alerts[@]}"; do
              body_file="$(mktemp)"
              if gh api --method PATCH \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${number}" \
                -f state='dismissed' \
                -f dismissed_reason="won't fix" \
                -f dismissed_comment='Bulk dismissal requested by the repository owner; future CodeQL scanning remains enabled.' \
                >"${body_file}" 2>&1; then
                ((dismissed+=1))
              elif grep -qi 'already dismissed' "${body_file}"; then
                ((already+=1))
              else
                echo "Failed to dismiss CodeQL alert #${number}:" >&2
                cat "${body_file}" >&2
                ((failed+=1))
              fi
              rm -f "${body_file}"
            done
          done

          mapfile -t remaining < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
              --jq '.[] | select((.tool.name // "") == "CodeQL") | .number' \
              | sort -nu
          )

          echo "Dismissed=${dismissed} already_dismissed=${already} failed=${failed} remaining=${#remaining[@]}"

          if (( ${#remaining[@]} > 0 || failed > 0 )); then
            printf 'Still-open CodeQL alerts: %s\n' "${remaining[*]:-none}" >&2
            exit 1
          fi

          echo 'All CodeQL alerts are dismissed.'

  analyze:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dismiss_open_alerts == true) }}
    name: "${{ matrix.check_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "CodeQL · Actions"
            language: actions
            config: ""
            category: "/language:actions"

          - check_name: "CodeQL · Python"
            language: python
            config: |
              paths-ignore:
                - providers/**
                - provider-old/**
                - upstream-lkg/**
                - audit/**
            category: "/language:python"

          - check_name: "CodeQL · JS Core"
            language: javascript-typescript
            config: |
              paths-ignore:
                - providers/**
                - provider-bases/**
                - provider-old/**
                - upstream-lkg/**
                - audit/**
                - automation/evidence/**
            category: "/language:javascript-typescript/scope:core"

          - check_name: "CodeQL · JS ProviderBase"
            language: javascript-typescript
            config: |
              paths:
                - provider-bases/**
              paths-ignore:
                - provider-old/**
            category: "/language:javascript-typescript/scope:provider-bases"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate current ProviderBase scope
        if: ${{ matrix.check_name == 'CodeQL · JS ProviderBase' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from current_provider_scope import (
              active_provider_ids,
              assert_directory_contract,
              disabled_provider_ids,
              visible_provider_ids,
          )

          assert_directory_contract()
          active = active_provider_ids()
          disabled = disabled_provider_ids()
          visible = visible_provider_ids()
          bases = list(Path('provider-bases').glob('*.js'))
          archived = list(Path('provider-old').glob('*.js'))

          if not visible:
              raise SystemExit('current provider catalogue is empty')
          if not active:
              raise SystemExit('active provider scope is empty')
          if not bases:
              raise SystemExit('provider-bases/: no maintained ProviderBase files')
          if not archived:
              raise SystemExit('provider-old/: historical archive unexpectedly empty')
          if active & disabled:
              raise SystemExit('active/disabled provider identity collision')
          if visible != active | disabled:
              raise SystemExit('visible provider scope differs from active + disabled authority')

          print(
              'CODEQL_SCOPE '
              f'visible={len(visible)} active={len(active)} disabled={len(disabled)} '
              f'provider_bases={len(bases)} archived_files={len(archived)} '
              'generated_providers_excluded=true cardinality_policy=data'
          )
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: ${{ matrix.category }}

  result:
    name: "CodeQL · maintained source"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dismiss_open_alerts == true) && always() }}
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete maintained-source matrix
        env:
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: test "$MATRIX_RESULT" = "success"