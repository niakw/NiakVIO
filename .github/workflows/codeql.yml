name: "SEC - CodeQL"

# Advanced CodeQL configuration for NiakVIO.
#
# Deliberately no "push" trigger: rapid commits on main must not spawn CodeQL
# runs that compete with runtime/publication workflows. Pull requests are scanned,
# a full audit is kept weekly, and maintainers can launch a scan manually.
#
# IMPORTANT: GitHub CodeQL Default Setup must be disabled in repository settings.
# Default Setup overrides Advanced Setup and blocks uploads from this workflow.

on:
  pull_request:
    branches:
      - main
    paths:
      # GitHub Actions / security configuration
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"

      # JavaScript / TypeScript
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"

      # Python
      - "**/*.py"

      # Dependency manifests / lockfiles
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "requirements*.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "Pipfile"
      - "Pipfile.lock"

  schedule:
    # Weekly security audit, Saturday 18:42 UTC.
    - cron: "42 18 * * 6"

  workflow_dispatch:

# One CodeQL workflow run at a time for the entire repository. A newer PR/manual/
# scheduled run supersedes an older one instead of building a queue.
concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL · ${{ matrix.language }}"
    runs-on: ubuntu-latest
    # The generated 96-provider JS corpus legitimately exceeds the former 45-minute
    # analysis ceiling. Keep the full security-extended query suite and allow it to finish.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
