name: SEC - CodeQL
# Default Setup owns GitHub code-scanning uploads. This security-extended workflow
# remains an independent exact-SHA proof and exports local SARIF as an Actions
# artifact so every current finding can be remediated without conflicting uploads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: read

concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  dependency-audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate local SARIF evidence parser contract
        run: python3 tests/codeql_local_sarif_test.py
      - name: Fail on High/Critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL security-extended
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          trap-caching: false
          dependency-caching: false

      - name: Analyze locally without conflicting with Default Setup
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: never
          upload-database: false

      - name: Summarize complete local SARIF evidence
        run: python3 scripts/codeql_local_sarif.py codeql-results

      - name: Export complete local SARIF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-security-extended-${{ matrix.language }}-${{ github.run_id }}
          path: codeql-results/*.sarif
          retention-days: 8
          if-no-files-found: error

      - name: Gate local security-extended High/Critical findings
        run: python3 scripts/codeql_local_sarif.py codeql-results --fail-high
