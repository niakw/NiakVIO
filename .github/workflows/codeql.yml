name: "SEC - CodeQL"

# CodeQL scans maintained source, not content-addressed generated Provider JS.
# Exact published providers remain blocking through NiakVIO's byte-level syntax,
# runtime, hardening, forbidden-pattern, fixed-point, reverse and integrity gates.
# Historical provider-old/ and evidence/upstream snapshots are never current code.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "engine_v2/**"
      - "provider-bases/**"
      - "scripts/**"
      - "tests/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "package.json"
      - "package-lock.json"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/codeql/**"
      - "engine_v2/**"
      - "provider-bases/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "42 18 * * 6"
  workflow_dispatch:

concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: "${{ matrix.check_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "CodeQL · Actions"
            language: actions
            config: ""
            category: "/language:actions"

          - check_name: "CodeQL · Python"
            language: python
            config: |
              paths-ignore:
                - providers/**
                - provider-old/**
                - upstream-lkg/**
                - audit/**
            category: "/language:python"

          - check_name: "CodeQL · JS Core"
            language: javascript-typescript
            config: |
              paths-ignore:
                - providers/**
                - provider-bases/**
                - provider-old/**
                - upstream-lkg/**
                - audit/**
                - automation/evidence/**
            category: "/language:javascript-typescript/scope:core"

          - check_name: "CodeQL · JS ProviderBase"
            language: javascript-typescript
            config: |
              paths:
                - provider-bases/**
              paths-ignore:
                - provider-old/**
            category: "/language:javascript-typescript/scope:provider-bases"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Hub46 ProviderBase scope
        if: ${{ matrix.check_name == 'CodeQL · JS ProviderBase' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          current={str(row.get('id') or '').strip().casefold() for row in manifest.get('scrapers') or []}
          current.discard('')
          bases=list(Path('provider-bases').glob('*.js'))
          archived=list(Path('provider-old').glob('*.js'))
          if len(current) != 46:
              raise SystemExit(f'expected 46 current providers, got {len(current)}')
          if not bases:
              raise SystemExit('provider-bases/: no maintained ProviderBase files')
          if not archived:
              raise SystemExit('provider-old/: historical archive unexpectedly empty')
          print(f'CODEQL_SCOPE current={len(current)} provider_bases={len(bases)} archived_files={len(archived)} generated_providers_excluded=true')
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: ${{ matrix.category }}

  result:
    name: "CodeQL · maintained source"
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete maintained-source matrix
        env:
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: test "$MATRIX_RESULT" = "success"
