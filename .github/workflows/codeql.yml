name: "SEC - CodeQL"

# Advanced CodeQL configuration for NiakVIO.
#
# Deliberately no "push" trigger: rapid commits on main must not spawn CodeQL
# runs that compete with runtime/publication workflows. Pull requests are scanned,
# a full audit is kept weekly, and maintainers can launch a scan manually.
#
# IMPORTANT: GitHub CodeQL Default Setup must be disabled in repository settings.
# Default Setup overrides Advanced Setup and blocks uploads from this workflow.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "requirements*.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "Pipfile"
      - "Pipfile.lock"

  schedule:
    - cron: "42 18 * * 6"

  workflow_dispatch:

concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    # Keep one immutable init/analyze action pair while splitting the two generated
    # flat JS trees into bounded databases. Range shards cover 0-9/a-y; the final
    # shard deliberately includes z* plus any atypical or nested files, so it is
    # both non-empty today and a future-proof exhaustive fallback.
    name: "${{ matrix.check_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "CodeQL · actions"
            language: actions
            build_mode: none
            config: ""
            category: "/language:actions"
          - check_name: "CodeQL · python"
            language: python
            build_mode: none
            config: ""
            category: "/language:python"
          - check_name: "CodeQL · javascript-typescript · source"
            language: javascript-typescript
            build_mode: none
            config: |
              paths-ignore:
                - providers/**
                - provider-bases/**
            category: "/language:javascript-typescript/shard:source"

          - check_name: "CodeQL · javascript-typescript · providers-0-f"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/0*.js"
                - "providers/1*.js"
                - "providers/2*.js"
                - "providers/3*.js"
                - "providers/4*.js"
                - "providers/5*.js"
                - "providers/6*.js"
                - "providers/7*.js"
                - "providers/8*.js"
                - "providers/9*.js"
                - "providers/a*.js"
                - "providers/b*.js"
                - "providers/c*.js"
                - "providers/d*.js"
                - "providers/e*.js"
                - "providers/f*.js"
            category: "/language:javascript-typescript/shard:providers-0-f"
          - check_name: "CodeQL · javascript-typescript · providers-g-l"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/g*.js"
                - "providers/h*.js"
                - "providers/i*.js"
                - "providers/j*.js"
                - "providers/k*.js"
                - "providers/l*.js"
            category: "/language:javascript-typescript/shard:providers-g-l"
          - check_name: "CodeQL · javascript-typescript · providers-m-r"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/m*.js"
                - "providers/n*.js"
                - "providers/o*.js"
                - "providers/p*.js"
                - "providers/q*.js"
                - "providers/r*.js"
            category: "/language:javascript-typescript/shard:providers-m-r"
          - check_name: "CodeQL · javascript-typescript · providers-s-y"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/s*.js"
                - "providers/t*.js"
                - "providers/u*.js"
                - "providers/v*.js"
                - "providers/w*.js"
                - "providers/x*.js"
                - "providers/y*.js"
            category: "/language:javascript-typescript/shard:providers-s-y"
          - check_name: "CodeQL · javascript-typescript · providers-z-fallback"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - providers/**
              paths-ignore:
                - "providers/0*.js"
                - "providers/1*.js"
                - "providers/2*.js"
                - "providers/3*.js"
                - "providers/4*.js"
                - "providers/5*.js"
                - "providers/6*.js"
                - "providers/7*.js"
                - "providers/8*.js"
                - "providers/9*.js"
                - "providers/a*.js"
                - "providers/b*.js"
                - "providers/c*.js"
                - "providers/d*.js"
                - "providers/e*.js"
                - "providers/f*.js"
                - "providers/g*.js"
                - "providers/h*.js"
                - "providers/i*.js"
                - "providers/j*.js"
                - "providers/k*.js"
                - "providers/l*.js"
                - "providers/m*.js"
                - "providers/n*.js"
                - "providers/o*.js"
                - "providers/p*.js"
                - "providers/q*.js"
                - "providers/r*.js"
                - "providers/s*.js"
                - "providers/t*.js"
                - "providers/u*.js"
                - "providers/v*.js"
                - "providers/w*.js"
                - "providers/x*.js"
                - "providers/y*.js"
            category: "/language:javascript-typescript/shard:providers-z-fallback"

          - check_name: "CodeQL · javascript-typescript · provider-bases-0-f"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/0*.js"
                - "provider-bases/1*.js"
                - "provider-bases/2*.js"
                - "provider-bases/3*.js"
                - "provider-bases/4*.js"
                - "provider-bases/5*.js"
                - "provider-bases/6*.js"
                - "provider-bases/7*.js"
                - "provider-bases/8*.js"
                - "provider-bases/9*.js"
                - "provider-bases/a*.js"
                - "provider-bases/b*.js"
                - "provider-bases/c*.js"
                - "provider-bases/d*.js"
                - "provider-bases/e*.js"
                - "provider-bases/f*.js"
            category: "/language:javascript-typescript/shard:provider-bases-0-f"
          - check_name: "CodeQL · javascript-typescript · provider-bases-g-l"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/g*.js"
                - "provider-bases/h*.js"
                - "provider-bases/i*.js"
                - "provider-bases/j*.js"
                - "provider-bases/k*.js"
                - "provider-bases/l*.js"
            category: "/language:javascript-typescript/shard:provider-bases-g-l"
          - check_name: "CodeQL · javascript-typescript · provider-bases-m-r"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/m*.js"
                - "provider-bases/n*.js"
                - "provider-bases/o*.js"
                - "provider-bases/p*.js"
                - "provider-bases/q*.js"
                - "provider-bases/r*.js"
            category: "/language:javascript-typescript/shard:provider-bases-m-r"
          - check_name: "CodeQL · javascript-typescript · provider-bases-s-y"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/s*.js"
                - "provider-bases/t*.js"
                - "provider-bases/u*.js"
                - "provider-bases/v*.js"
                - "provider-bases/w*.js"
                - "provider-bases/x*.js"
                - "provider-bases/y*.js"
            category: "/language:javascript-typescript/shard:provider-bases-s-y"
          - check_name: "CodeQL · javascript-typescript · provider-bases-z-fallback"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - provider-bases/**
              paths-ignore:
                - "provider-bases/0*.js"
                - "provider-bases/1*.js"
                - "provider-bases/2*.js"
                - "provider-bases/3*.js"
                - "provider-bases/4*.js"
                - "provider-bases/5*.js"
                - "provider-bases/6*.js"
                - "provider-bases/7*.js"
                - "provider-bases/8*.js"
                - "provider-bases/9*.js"
                - "provider-bases/a*.js"
                - "provider-bases/b*.js"
                - "provider-bases/c*.js"
                - "provider-bases/d*.js"
                - "provider-bases/e*.js"
                - "provider-bases/f*.js"
                - "provider-bases/g*.js"
                - "provider-bases/h*.js"
                - "provider-bases/i*.js"
                - "provider-bases/j*.js"
                - "provider-bases/k*.js"
                - "provider-bases/l*.js"
                - "provider-bases/m*.js"
                - "provider-bases/n*.js"
                - "provider-bases/o*.js"
                - "provider-bases/p*.js"
                - "provider-bases/q*.js"
                - "provider-bases/r*.js"
                - "provider-bases/s*.js"
                - "provider-bases/t*.js"
                - "provider-bases/u*.js"
                - "provider-bases/v*.js"
                - "provider-bases/w*.js"
                - "provider-bases/x*.js"
                - "provider-bases/y*.js"
            category: "/language:javascript-typescript/shard:provider-bases-z-fallback"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: ${{ matrix.category }}

  javascript-result:
    name: "CodeQL · javascript-typescript"
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete CodeQL matrix
        env:
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: test "$MATRIX_RESULT" = "success"
