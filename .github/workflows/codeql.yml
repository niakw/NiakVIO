name: "SEC - CodeQL"

# Advanced CodeQL configuration for NiakVIO.
#
# Current release scope is 46 executable providers. Historical provider snapshots
# under provider-old/ are retained as evidence only and are intentionally excluded
# from current runtime code scanning. The live provider and ProviderBase trees are
# split into four non-empty lexical shards each; s-z includes future z* entries so
# no empty fallback database is created.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "package.json"
      - "package-lock.json"
      - "requirements*.txt"

  schedule:
    - cron: "42 18 * * 6"

  workflow_dispatch:

concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  scope-contract:
    name: "CodeQL · Hub46 scope contract"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate current JS shard coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for directory in (Path('providers'), Path('provider-bases')):
              rows=sorted(directory.glob('*.js'))
              if not rows:
                  raise SystemExit(f'{directory}: no current JS providers')
              bad=[]
              buckets={'0-f':0,'g-l':0,'m-r':0,'s-z':0}
              for path in rows:
                  first=path.name[0].lower()
                  if first.isdigit() or 'a' <= first <= 'f':
                      buckets['0-f'] += 1
                  elif 'g' <= first <= 'l':
                      buckets['g-l'] += 1
                  elif 'm' <= first <= 'r':
                      buckets['m-r'] += 1
                  elif 's' <= first <= 'z':
                      buckets['s-z'] += 1
                  else:
                      bad.append(path.name)
              if bad:
                  raise SystemExit(f'{directory}: files outside CodeQL shard alphabet: {bad}')
              empty=[name for name,count in buckets.items() if count == 0]
              if empty:
                  raise SystemExit(f'{directory}: empty CodeQL shards: {empty}; counts={buckets}')
              print(f'CODEQL_SCOPE directory={directory} files={len(rows)} buckets={buckets}')
          PY

  analyze:
    needs: scope-contract
    name: "${{ matrix.check_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "CodeQL · actions"
            language: actions
            build_mode: none
            config: ""
            category: "/language:actions"
          - check_name: "CodeQL · python"
            language: python
            build_mode: none
            config: ""
            category: "/language:python"
          - check_name: "CodeQL · javascript-typescript · source"
            language: javascript-typescript
            build_mode: none
            config: |
              paths-ignore:
                - providers/**
                - provider-bases/**
                - provider-old/**
            category: "/language:javascript-typescript/shard:source"

          - check_name: "CodeQL · javascript-typescript · providers-0-f"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/0*.js"
                - "providers/1*.js"
                - "providers/2*.js"
                - "providers/3*.js"
                - "providers/4*.js"
                - "providers/5*.js"
                - "providers/6*.js"
                - "providers/7*.js"
                - "providers/8*.js"
                - "providers/9*.js"
                - "providers/a*.js"
                - "providers/b*.js"
                - "providers/c*.js"
                - "providers/d*.js"
                - "providers/e*.js"
                - "providers/f*.js"
            category: "/language:javascript-typescript/shard:providers-0-f"
          - check_name: "CodeQL · javascript-typescript · providers-g-l"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/g*.js"
                - "providers/h*.js"
                - "providers/i*.js"
                - "providers/j*.js"
                - "providers/k*.js"
                - "providers/l*.js"
            category: "/language:javascript-typescript/shard:providers-g-l"
          - check_name: "CodeQL · javascript-typescript · providers-m-r"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/m*.js"
                - "providers/n*.js"
                - "providers/o*.js"
                - "providers/p*.js"
                - "providers/q*.js"
                - "providers/r*.js"
            category: "/language:javascript-typescript/shard:providers-m-r"
          - check_name: "CodeQL · javascript-typescript · providers-s-z"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "providers/s*.js"
                - "providers/t*.js"
                - "providers/u*.js"
                - "providers/v*.js"
                - "providers/w*.js"
                - "providers/x*.js"
                - "providers/y*.js"
                - "providers/z*.js"
            category: "/language:javascript-typescript/shard:providers-s-z"

          - check_name: "CodeQL · javascript-typescript · provider-bases-0-f"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/0*.js"
                - "provider-bases/1*.js"
                - "provider-bases/2*.js"
                - "provider-bases/3*.js"
                - "provider-bases/4*.js"
                - "provider-bases/5*.js"
                - "provider-bases/6*.js"
                - "provider-bases/7*.js"
                - "provider-bases/8*.js"
                - "provider-bases/9*.js"
                - "provider-bases/a*.js"
                - "provider-bases/b*.js"
                - "provider-bases/c*.js"
                - "provider-bases/d*.js"
                - "provider-bases/e*.js"
                - "provider-bases/f*.js"
            category: "/language:javascript-typescript/shard:provider-bases-0-f"
          - check_name: "CodeQL · javascript-typescript · provider-bases-g-l"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/g*.js"
                - "provider-bases/h*.js"
                - "provider-bases/i*.js"
                - "provider-bases/j*.js"
                - "provider-bases/k*.js"
                - "provider-bases/l*.js"
            category: "/language:javascript-typescript/shard:provider-bases-g-l"
          - check_name: "CodeQL · javascript-typescript · provider-bases-m-r"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/m*.js"
                - "provider-bases/n*.js"
                - "provider-bases/o*.js"
                - "provider-bases/p*.js"
                - "provider-bases/q*.js"
                - "provider-bases/r*.js"
            category: "/language:javascript-typescript/shard:provider-bases-m-r"
          - check_name: "CodeQL · javascript-typescript · provider-bases-s-z"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - "provider-bases/s*.js"
                - "provider-bases/t*.js"
                - "provider-bases/u*.js"
                - "provider-bases/v*.js"
                - "provider-bases/w*.js"
                - "provider-bases/x*.js"
                - "provider-bases/y*.js"
                - "provider-bases/z*.js"
            category: "/language:javascript-typescript/shard:provider-bases-s-z"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: ${{ matrix.category }}

  javascript-result:
    name: "CodeQL · javascript-typescript"
    if: always()
    needs: [scope-contract, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete CodeQL matrix
        env:
          SCOPE_RESULT: ${{ needs.scope-contract.result }}
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: |
          test "$SCOPE_RESULT" = "success"
          test "$MATRIX_RESULT" = "success"
