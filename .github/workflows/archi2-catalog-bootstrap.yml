name: ARCHI2 catalog bootstrap

on:
  push:
    branches:
      - refactor/archi2-main-cutover
    paths:
      - 'engine_v2/src/provider-catalog.mjs'
      - 'engine_v2/scripts/bootstrap-provider-catalog.mjs'
      - 'engine_v2/scripts/render-manifests-from-catalog.mjs'
      - 'engine_v2/tests/provider-catalog.test.mjs'
      - '.github/workflows/archi2-catalog-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: archi2-catalog-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cutover branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify lossless catalog migration
        run: node engine_v2/tests/provider-catalog.test.mjs

      - name: Bootstrap catalog from current published state
        run: node engine_v2/scripts/bootstrap-provider-catalog.mjs --output provider_catalog.json

      - name: Re-render manifests and prove exact semantic parity
        shell: bash
        run: |
          mkdir -p /tmp/archi2-render/vf
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general /tmp/archi2-render/manifest.json \
            --vf /tmp/archi2-render/vf/manifest.json
          node - <<'NODE'
          const fs = require('node:fs');
          for (const pair of [
            ['manifest.json', '/tmp/archi2-render/manifest.json'],
            ['vf/manifest.json', '/tmp/archi2-render/vf/manifest.json'],
          ]) {
            const a = JSON.parse(fs.readFileSync(pair[0], 'utf8'));
            const b = JSON.parse(fs.readFileSync(pair[1], 'utf8'));
            if (JSON.stringify(a) !== JSON.stringify(b)) {
              throw new Error(`catalog round-trip differs for ${pair[0]}`);
            }
          }
          console.log('catalog round-trip parity passed');
          NODE

      - name: Commit canonical catalog
        shell: bash
        run: |
          if git diff --quiet -- provider_catalog.json && git ls-files --error-unmatch provider_catalog.json >/dev/null 2>&1; then
            echo 'provider_catalog.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider_catalog.json
          git commit -m 'archi2: establish provider catalog source of truth'
          git push origin HEAD:refactor/archi2-main-cutover
