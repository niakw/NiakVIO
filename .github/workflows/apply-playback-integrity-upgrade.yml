name: Apply finite playback integrity upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/playback-integrity-upgrade"

permissions:
  contents: write

concurrency:
  group: nuvio-playback-integrity-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply systemic playback fixes
        shell: bash
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/apply_playback_integrity_upgrade.py
          python scripts/reapply_published_overrides.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/generate_release_hashes.py
      - name: Validate upgraded repository
        run: |
          python scripts/validate_published_overrides.py
          python scripts/validate_language_projection.py
          python tests/hls_playback_integrity_test.py
          python tests/vf_catalogue_identity_hardening_test.py
          python tests/language_manifest_metadata_consistency_test.py
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit exact validated upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No playback-integrity changes to publish."
            exit 0
          fi
          git commit -m "fix: harden HLS audio playback and VF identity matching"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
