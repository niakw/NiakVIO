name: TMP - V31 AllAnime Castle Proof
# PR trigger V31

on:
  pull_request:
    branches:
      - tmp/v31-proof-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Contract tests
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/materializer_domain_refresh_authority_v29_test.py
          python3 tests/allanime_domain_refresh_authority_test.py
          python3 tests/castle_adaptive_key_derivation_test.py
          python3 tests/castle_language_roles_short_test.py
          python3 tests/provider_patch_quickjs_compat_test.py

      - name: Materialize and prove AllAnime + Castle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          cases=[
            ("allanime",{"tmdbId":"207332","mediaType":"anime","title":"SAKAMOTO DAYS","year":2025,"season":1,"episode":1,"category":"anime","expectedDurationMinutes":24}),
            ("castle",{"tmdbId":"157336","mediaType":"movie","title":"Interstellar","year":2014,"category":"movie","expectedDurationMinutes":169}),
          ]
          env=os.environ.copy()
          for provider,fixture in cases:
              mat=subprocess.run(["python3","scripts/materialize_provider_v3_one.py",provider],text=True,capture_output=True,env=env)
              print("FIELD_V31_MATERIALIZE",provider,"rc="+str(mat.returncode))
              print(mat.stdout[-3500:])
              if mat.stderr: print(mat.stderr[-1800:])
              if mat.returncode: continue
              m=json.loads(Path("manifest.json").read_text())
              row=next(r for r in m["scrapers"] if str(r.get("id","")).lower()==provider)
              bundle=str(row["filename"]).replace("../","")
              text=Path(bundle).read_text()
              if provider=="allanime":
                  import re
                  mm=re.search(r'(?:const|let|var)\s+NIAKVIO_PROVIDER_MODEL\s*=\s*Object\.freeze\((\{.*?\})\);',text,re.S)
                  model=json.loads(mm.group(1))
                  print("FIELD_V31_ALLANIME_MODEL",model.get("officialSite"),model.get("domainSubstitutions"))
              cp=subprocess.run(["node","scripts/nuvio_tv_probe_tmdb_ci.cjs",bundle,json.dumps(fixture,separators=(",",":")),"{}"],text=True,capture_output=True,env=env)
              Path(f"health-output/v31-{provider}.log").write_text(cp.stdout+"\nSTDERR\n"+cp.stderr)
              payload=None
              for line in reversed(cp.stdout.splitlines()):
                  if not line.lstrip().startswith("{"): continue
                  try:x=json.loads(line)
                  except Exception:continue
                  if "playable_stream_count" in x: payload=x;break
              if not payload:
                  print("FIELD_V31_RESULT",provider,"payload=missing","rc="+str(cp.returncode));continue
              d=payload.get("debug") or {}
              print("FIELD_V31_RESULT",provider,
                    "stage="+str(d.get("stage") or ""),
                    "raw="+str(payload.get("raw_stream_count") or 0),
                    "playable="+str(payload.get("playable_stream_count") or 0),
                    "verified="+str(payload.get("content_verified_count") or payload.get("identity_verified_count") or 0),
                    "rc="+str(cp.returncode))
              for tr in (d.get("provider_value_trace_history_v21") or [])[-24:]:
                  detail=str(tr.get("route") or "")[:180]
                  low=detail.lower()
                  if "://" in detail or any(k in low for k in ["cookie=","token=","authorization=","secret=","api_key=","bearer=","enc="]): detail=""
                  print("FIELD_V31_TRACE",provider,str(tr.get("stage") or ""),detail)
              for fetch in (d.get("fetches") or [])[-16:]:
                  from urllib.parse import urlsplit
                  rq=urlsplit(str(fetch.get("url") or ""));rs=urlsplit(str(fetch.get("response_url") or fetch.get("url") or ""))
                  if rq.hostname=="api.themoviedb.org":continue
                  print("FIELD_V31_FETCH",provider,str(rq.hostname or ""),str(rq.path or "/"),"->",str(rs.hostname or ""),str(rs.path or "/"),"status="+str(fetch.get("status") or 0))
          PY

      - name: Upload V31 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v31-allanime-castle-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
