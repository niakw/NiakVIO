name: Trigger Actions purge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-actions-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full purge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/purge-actions-history.yml/dispatches"             -d '{"ref":"main","inputs":{"confirm":"PURGE ACTION LOGS","mode":"runs","batch_size":"800","before":"","final_pass":"false","auto_continue":"true"}}')"
          test "$code" = "204" || { cat /tmp/dispatch.out; echo "Dispatch failed: HTTP $code"; exit 1; }
          echo "Purge workflow dispatched."
