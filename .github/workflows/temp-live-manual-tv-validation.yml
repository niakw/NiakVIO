# V34 candidate live rerun: evidence only; MEMORY persistence is handled separately after result inspection.
name: TEMP Live manual TV validation

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-live-manual-tv-validation.yml"]

permissions:
  contents: read

concurrency:
  group: temp-live-manual-tv-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact .44 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute exact manual-TV live matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "FIELD_MANUAL_TV_CANDIDATE sha=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          matrix = json.loads((root / 'automation/manual-tv-live-matrix-20260912.json').read_text(encoding='utf-8'))
          cases = matrix['cases']
          outdir = root / 'automation/manual-tv-live-results-20260912'
          outdir.mkdir(parents=True, exist_ok=True)

          def execute(row):
              output = outdir / f"{row['case']}--{row['provider']}.json"
              cmd = [
                  sys.executable, 'scripts/manual_tv_live_case_probe.py',
                  '--case', row['case'], '--provider', row['provider'],
                  '--tmdb', str(row['tmdb']), '--media-type', row['mediaType'],
                  '--title', row['title'], '--year', str(row['year']),
                  '--duration', str(row['duration']),
                  '--aliases', json.dumps(row.get('aliases') or [], ensure_ascii=False),
                  '--output', str(output),
              ]
              if row.get('season') is not None:
                  cmd += ['--season', str(row['season'])]
              if row.get('episode') is not None:
                  cmd += ['--episode', str(row['episode'])]
              proc = subprocess.run(cmd, cwd=root, capture_output=True, text=True, timeout=115, check=False)
              marker = next((line for line in reversed(proc.stdout.splitlines()) if line.startswith('FIELD_MANUAL_TV_LIVE ')), '')
              return row, proc.returncode, marker, proc.stderr[-1000:]

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(execute, row) for row in cases]
              for future in concurrent.futures.as_completed(futures):
                  row, code, marker, stderr = future.result()
                  if marker:
                      print(marker)
                  if code != 0:
                      failures.append({'case': row['case'], 'provider': row['provider'], 'code': code, 'stderr': stderr})

          results = []
          for path in sorted(outdir.glob('*.json')):
              results.append(json.loads(path.read_text(encoding='utf-8')))
          aggregate = {
              'schemaVersion': 2,
              'mode': 'exact-manual-tv-live-evidence-v34',
              'caseCount': len(cases),
              'resultCount': len(results),
              'infraFailures': [{'case': r['case'], 'provider': r['provider'], 'code': r['code']} for r in failures],
              'playableRows': sum(int(r.get('playable') or 0) for r in results),
              'verifiedRows': sum(int(r.get('verified') or 0) for r in results),
              'contradictions': sum(int(r.get('contradictions') or 0) for r in results),
              'returned403Rows': sum(int(r.get('returned403Rows') or 0) for r in results),
              'results': results,
          }
          (root / 'automation/manual-tv-live-results-20260912.json').write_text(json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('FIELD_MANUAL_TV_LIVE_AGGREGATE ' + json.dumps({k: aggregate[k] for k in ['caseCount','resultCount','playableRows','verifiedRows','contradictions','returned403Rows']}, separators=(',', ':')))
          if failures or len(results) != len(cases):
              for failure in failures:
                  print('INFRA_FAILURE', failure, file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload sanitized live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-tv-live-v34-evidence-${{ github.run_id }}
          path: |
            automation/manual-tv-live-results-20260912.json
            automation/manual-tv-live-results-20260912/*.json
          retention-days: 14
          if-no-files-found: warn
