name: Validate HLS recovery-first candidate

on:
  push:
    branches:
      - fix/hls-recovery-first
    paths:
      - .github/triggers/hls-recovery-first

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Finalize recovery-first implementation
        run: python3 .github/scripts/finalize_hls_recovery_first.py
      - name: Run focused recovery and identity regressions
        run: |
          python3 tests/hls_playback_integrity_test.py
          python3 tests/strict_native_identity_guard_test.py
      - name: Remove one-shot CI files
        run: |
          rm -f .github/scripts/finalize_hls_recovery_first.py
          rm -f .github/workflows/tmp-hls-recovery-first.yml
          rm -f .github/triggers/hls-recovery-first
      - name: Migrate published wrappers once
        run: |
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
      - name: Refresh release hashes
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
      - name: Run full repository regression suite
        run: npm test
      - name: Commit exact candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- ':!providers/**'
          git commit -m "fix: recover playable media before rejecting malformed HLS"
      - name: Re-test committed candidate from clean worktree
        run: |
          candidate=$(git rev-parse HEAD)
          git worktree add --detach ../candidate "$candidate"
          cd ../candidate
          npm ci --ignore-scripts --no-audit --no-fund
          python3 tests/hls_playback_integrity_test.py
          python3 tests/strict_native_identity_guard_test.py
          npm test
          git diff --exit-code
      - name: Push validated branch
        run: git push origin HEAD:fix/hls-recovery-first
