name: Temporary finalize scoped repair release

on:
  push:
    branches: [fix/scoped-playback-context-regression]
    paths:
      - ".github/workflows/tmp-finalize-scoped-repair.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/scoped-playback-context-regression
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Make scoped regression part of the permanent suite
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('package.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          needle='python3 tests/scoped_playback_context_regression_test.py'
          test=data['scripts']['test']
          if needle not in test:
              anchor='python3 tests/global_playback_integrity_policy_test.py'
              if anchor not in test:
                  raise SystemExit('global playback integrity test anchor missing')
              test=test.replace(anchor, anchor+' && '+needle, 1)
              data['scripts']['test']=test
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Synchronize release 5.20.54
        run: python3 scripts/sync_release_versions.py --version 5.20.54
      - name: Run complete regression suite
        run: npm test
      - name: Validate immutable release
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/scoped_playback_context_regression_test.py
          python3 tests/streamzo_native_platform_contract_test.py
      - name: Commit final release and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-finalize-scoped-repair.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: finalize scoped playback repair 5.20.54"
          git push origin HEAD:fix/scoped-playback-context-regression
