name: Index recent workflow runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/action-run-index"

permissions:
  actions: read
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p automation
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" > /tmp/runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/runs.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          keys = (
              'id', 'name', 'display_title', 'event', 'status', 'conclusion',
              'head_sha', 'head_branch', 'run_number', 'run_attempt',
              'created_at', 'updated_at', 'html_url', 'jobs_url', 'artifacts_url'
          )
          runs = [{key: row.get(key) for key in keys} for row in payload.get('workflow_runs', [])]
          result = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'repository': '${{ github.repository }}',
              'runs': runs,
          }
          with open('automation/action-runs.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY

      - name: Publish run index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/action-runs.json
          if git diff --cached --quiet; then
            echo "Run index unchanged."
            exit 0
          fi
          git commit -m "ci: update workflow run index"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
