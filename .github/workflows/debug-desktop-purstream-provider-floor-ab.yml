name: Debug Desktop Purstream provider floor A/B

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-provider-floor-ab.yml"

permissions:
  contents: read

jobs:
  floor-ab:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage raw and generated Purstream floors
        shell: bash
        run: |
          set -euxo pipefail
          cp niakvio/providers/purstream.js "$GITHUB_WORKSPACE/purstream-00-raw.js"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          row=next(r for r in manifest["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=(root/row["filename"]).read_text(encoding="utf-8")
          desktop=text.find("/* NUVIO_DESKTOP_RUNTIME_COMPAT_V1:")
          tv=text.find("/* NUVIO_PURSTREAM_TV_IDENTITY_V3:")
          if desktop<0 or tv<0 or not desktop<tv:
              raise SystemExit("Purstream floor markers missing")
          Path("purstream-10-generated-floor.js").write_text(text[:desktop].rstrip()+"\n",encoding="utf-8")
          Path("purstream-20-desktop-compat.js").write_text(text[:tv].rstrip()+"\n",encoding="utf-8")
          print("FIELD_PURSTREAM_FLOOR_STAGE published="+row["filename"]+" desktop="+str(desktop)+" tv="+str(tv))
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Instrument Desktop HTTP in disposable checkout
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("nuvio-desktop/composeApp/src/desktopMain/kotlin/com/nuvio/app/features/addons/AddonPlatform.desktop.kt")
          s=p.read_text()
          nl="\n"
          if "import java.io.File" not in s:
              s=s.replace("import java.io.ByteArrayOutputStream"+nl,"import java.io.ByteArrayOutputStream"+nl+"import java.io.File"+nl,1)
          old=nl.join(['    .followSslRedirects(true)','    .build()'])
          new=nl.join([
              '    .followSslRedirects(true)',
              '    .addInterceptor { chain ->',
              '        val request = chain.request()',
              '        val trace = System.getenv("NIAKVIO_NATIVE_FETCH_TRACE_FILE")?.takeIf { it.isNotBlank() }?.let(::File)',
              '        runCatching { trace?.appendText("START\\t" + request.method + "\\t" + request.url + "\\n") }',
              '        try {',
              '            val response = chain.proceed(request)',
              '            runCatching { trace?.appendText("RESULT\\t" + request.method + "\\t" + response.code + "\\t" + request.url + "\\t" + response.request.url + "\\n") }',
              '            response',
              '        } catch (t: Throwable) {',
              '            runCatching { trace?.appendText("ERROR\\t" + request.method + "\\t" + request.url + "\\t" + (t.message ?: "") + "\\n") }',
              '            throw t',
              '        }',
              '    }',
              '    .build()',
          ])
          if s.count(old)!=1:
              raise SystemExit("desktop HTTP builder anchor count="+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git -C nuvio-desktop diff --check

      - name: Install provider-floor A/B test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamProviderFloorAbTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamProviderFloorAbTest {
              @Test
              fun interstellarFloors() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  val trace = File(System.getenv("NIAKVIO_NATIVE_FETCH_TRACE_FILE"))
                  val variants = listOf(
                      "raw" to "purstream-00-raw.js",
                      "generated_floor" to "purstream-10-generated-floor.js",
                      "desktop_compat" to "purstream-20-desktop-compat.js",
                  )
                  for ((label, file) in variants) {
                      trace.appendText("LABEL\t" + label + "\n")
                      val started = System.currentTimeMillis()
                      val rows = PluginRuntime.executePlugin(
                          code = File(workspace, file).readText(),
                          tmdbId = "157336",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = "PURSTREAM",
                      )
                      println("FIELD_DESKTOP_PURSTREAM_FLOOR_AB label=" + label + " count=" + rows.size + " duration_ms=" + (System.currentTimeMillis()-started) + " firstUrl=" + (rows.firstOrNull()?.url ?: ""))
                  }
              }
          }
          KOTLIN

      - name: Execute provider-floor A/B
        shell: bash
        env:
          NIAKVIO_NATIVE_FETCH_TRACE_FILE: ${{ github.workspace }}/purstream-floor-http.txt
        run: |
          set -euxo pipefail
          : > "$NIAKVIO_NATIVE_FETCH_TRACE_FILE"
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamProviderFloorAbTest'             --no-build-cache --no-configuration-cache --console=plain
          echo "===== FIELD_DESKTOP_PURSTREAM_FLOOR_HTTP ====="
          cat "$NIAKVIO_NATIVE_FETCH_TRACE_FILE"
