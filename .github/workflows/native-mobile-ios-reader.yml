name: Native Mobile iOS reader acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full acceptance or targeted ONLY provider Learning probe
        required: false
        default: full
        type: choice
        options:
          - full
          - only
      provider:
        description: Exact provider id for ONLY mode
        required: false
        default: ""
        type: string
  schedule:
    - cron: "15 18 * * 6"
  push:
    branches:
      - main
    paths:
      - ".github/triggers/full-native-lab-validation.json"

permissions:
  contents: read

concurrency:
  group: native-mobile-ios-reader-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NIAKVIO_REPRESENTATIVE_FIXTURES: "interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      mobile_sha: ${{ steps.refs.outputs.mobile_sha }}
      mobile_drift_status: ${{ steps.refs.outputs.mobile_drift_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Inspect official NuvioMobile drift
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_nuvio_client_upstreams.py --no-fail             --clients nuvio-mobile             --output health-output/nuvio-client-upstream-status.json
      - id: refs
        name: Resolve exact official NuvioMobile HEAD
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/resolve_nuvio_lab_heads.py             --report health-output/nuvio-client-upstream-status.json             --clients nuvio-mobile             --github-output "$GITHUB_OUTPUT"             --output health-output/nuvio-mobile-ios-lab-head.json
      - name: Publish Mobile iOS runtime context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuvio-mobile-ios-lab-head-${{ inputs.mode == 'only' && 'only' || 'full' }}-${{ github.run_id }}
          path: |
            health-output/nuvio-client-upstream-status.json
            health-output/nuvio-mobile-ios-lab-head.json
          retention-days: 8
          if-no-files-found: error

  mobile-ios-reader:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 240
    env:
      NIAKVIO_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/manifest.json
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
    steps:
      - name: Checkout NiakVIO candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true
      - name: Checkout exact official NuvioMobile HEAD
        shell: bash
        env:
          NUVIO_MOBILE_SHA: ${{ needs.resolve.outputs.mobile_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
      - name: Verify official iOS 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$DEVELOPER_DIR" = "/Applications/Xcode_26.6.app/Contents/Developer"
      - name: Build official unsigned device IPA before Lab instrumentation
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'only' }}
        shell: bash
        env:
          IOS_CONFIGURATION: Debug
          IOS_IPA_OUTPUT_DIR: ${{ github.workspace }}/nuvio-mobile/build/ios-ipa
        run: |
          set -euo pipefail
          cd nuvio-mobile
          ./scripts/prepare-ios-dependencies.sh
          ./scripts/build-ios-ipa.sh
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*-full-debug.ipa' -print -quit)"
          test -n "$ipa_path"
          unzip -tq "$ipa_path"
          echo "FIELD_NATIVE_IOS_IPA path=$(basename "$ipa_path") sha256=$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
      - name: Upload official unsigned device IPA
        if: ${{ inputs.mode != 'only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mobile-ios-device-ipa-full-${{ github.run_id }}
          path: nuvio-mobile/build/ios-ipa/*.ipa
          retention-days: 8
          if-no-files-found: error
      - name: Inject CI-only iOS provider and player harness
        shell: bash
        run: |
          set -euo pipefail
          python3 niakvio/scripts/prepare_native_ios_reader_acceptance.py
          SWIFT_APP='nuvio-mobile/iosApp/iosApp/iOSApp.swift'
          MARKER='NiakvioIosLabKt.startNiakvioIosLabIfRequested()'
          if ! grep -Fq "$MARKER" "$SWIFT_APP"; then
            perl -0pi -e 's/            ContentView\(\)\n                \.preferredColorScheme\(\.dark\)\n/            ContentView()\n                .preferredColorScheme(.dark)\n                .onAppear {\n                    NuvioPlayerRegistration.register()\n                    NiakvioIosLabKt.startNiakvioIosLabIfRequested()\n                }\n/' "$SWIFT_APP"
          fi
          grep -Fq "$MARKER" "$SWIFT_APP" || {
            echo 'NuvioMobile iOSApp.swift instrumentation anchor drifted' >&2
            exit 42
          }
      - name: Execute iOS native Lab session
        shell: bash
        env:
          NIAKVIO_IOS_LAB_MODE: ${{ inputs.mode == 'only' && 'learning' || 'full' }}
          NIAKVIO_IOS_TARGET_PROVIDER: ${{ inputs.provider || '' }}
          NIAKVIO_IOS_PROVIDER_TIMEOUT_MS: ${{ inputs.mode == 'only' && '8000' || '25000' }}
          NIAKVIO_IOS_PLAYER_TIMEOUT_MS: ${{ inputs.mode == 'only' && '6000' || '22000' }}
          NIAKVIO_IOS_SESSION_STATE: ${{ github.workspace }}/ios-learning-session.env
        run: |
          set -euo pipefail
          if [ "$NIAKVIO_IOS_LAB_MODE" = "learning" ] && [ -z "$NIAKVIO_IOS_TARGET_PROVIDER" ]; then
            echo "ONLY mode requires an exact provider id" >&2
            exit 2
          fi
          bash niakvio/scripts/run_native_corpus_ios_suite.sh
      - name: Build sanitized iOS reader diagnoses
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode != 'only') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/mobile-ios-native-corpus.log"
          python3 niakvio/scripts/analyze_native_ios_results.py             --log "$GITHUB_WORKSPACE/mobile-ios-native-corpus.log"             --output-dir "$GITHUB_WORKSPACE/mobile-ios-diagnostics"
      - name: Upload Mobile iOS route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mobile-ios-${{ inputs.mode == 'only' && 'only' || 'full' }}-${{ github.run_id }}
          path: |
            mobile-ios-native-corpus*.log
            mobile-ios-diagnostics/mobile-ios-route-*-brain.json
          retention-days: 8
          if-no-files-found: warn
