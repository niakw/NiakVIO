name: LAB - Provider v3 Secondary Core Fixes

on:
  push:
    branches:
      - workbench/provider-v3-recognition-routes-data
    paths:
      - '.github/triggers/provider-v3-secondary-core-fixes.json'

permissions:
  contents: write

concurrency:
  group: provider-v3-secondary-core-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secondary-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize current Provider v3 source plan
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python scripts/materialize_provider_base_v3_store.py
      - name: Validate stream presentation and Stremio fallback
        run: |
          set -euo pipefail
          python tests/global_stream_unknown_quality_projection_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/stremio_json_runtime_fallback_contract_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
      - name: Rematerialize all 96 bundles from current DATA and Lego
        run: |
          set -euo pipefail
          python scripts/materialize_provider_v3_all.py
          python scripts/prune_unreferenced_providers.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python tests/provider_brick_portfolio_audit_test.py --published --require-all
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/published_provider_lego_contract_test.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          echo "FIELD_SECONDARY_CORE_REMATERIALIZE providers=96 idempotent=true liveEvidencePromoted=false"
      - name: Commit synchronized Provider v3 bytes
        shell: bash
        run: |
          set -euo pipefail
          git add provider-bases/ providers/ manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            provider-v3-materialization.json automation/provider-v3-static-knowledge.json provider-overrides.json \
            scripts/provider_patches/global_stream_presentation_v1.py
          if git diff --cached --quiet; then
            echo "FIELD_SECONDARY_CORE_COMMIT changed=false"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize Provider v3 bundles with current Lego"
          git push origin HEAD:workbench/provider-v3-recognition-routes-data
          echo "FIELD_SECONDARY_CORE_COMMIT changed=true"
