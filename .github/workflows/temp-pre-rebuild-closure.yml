name: TEMP - Pre Rebuild Closure

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-pre-rebuild-closure.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moviebox-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Prove strict mobile API identity and media
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/moviebox-mobile.js
          node /tmp/moviebox-mobile.js
