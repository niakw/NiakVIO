name: TEMP - Pre Rebuild Closure

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-pre-rebuild-closure.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Diagnose MovieBox identity search and player payload
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const API='https://h5-api.aoneroom.com/wefeed-h5api-bff';
          const origin='https://moviebox.ph';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/148 Safari/537.36';
          let token='';
          const H={'User-Agent':UA,'Referer':origin+'/','Origin':origin,'X-Client-Info':'{"timezone":"Europe/Paris"}','X-Request-Lang':'en','Accept':'application/json','Content-Type':'application/json'};
          async function req(url,opt={}){const headers={...H,...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(url,{...opt,headers,redirect:'follow',signal:AbortSignal.timeout(8000)});const xu=r.headers.get('x-user');if(xu)try{token=JSON.parse(xu).token||token}catch{};const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};return {r,j,t}}
          function n(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
          async function tmdb(type,id){const u='https://www.themoviedb.org/'+type+'/'+id+'?language=en-US';const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'en-US,en;q=0.9'},signal:AbortSignal.timeout(8000)});const h=await r.text();const m=/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i.exec(h)||/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i.exec(h);const tag=/<title[^>]*>([^<]+)<\/title>/i.exec(h);const raw=(m?.[1]||'').replace(/&amp;/gi,'&').replace(/&#0*39;|&apos;/gi,"'").replace(/&quot;/gi,'"');const full=(tag?.[1]||'').replace(/&amp;/gi,'&');const ym=/\(((?:19|20)\d{2})\)/.exec(raw+' '+full);const title=String(raw||full).trim().replace(/\s*[—|-]\s*The Movie Database.*$/i,'').replace(/\s*\((?:19|20)\d{2}\)\s*$/,'').trim();console.log('FIELD_MB_IDENTITY type='+type+' raw64='+Buffer.from(raw).toString('base64')+' full64='+Buffer.from(full).toString('base64')+' title64='+Buffer.from(title).toString('base64')+' year='+(ym?.[1]||''));return {title,year:Number(ym?.[1]||0)}}
          function rows(j){const d=j?.data||{};return Array.isArray(d.items)?d.items:Array.isArray(d.list)?d.list:[]}
          function score(x,id){const got=n(x?.title),want=n(id.title);let s=got===want?120:(got&&want&&(got.includes(want)||want.includes(got))?80:-1);const y=Number(String(x?.releaseDate||x?.release_date||'').slice(0,4))||0;if(s<0)return s;if(id.year&&y)s+=id.year===y?25:-40;if(x?.hasResource===true)s+=5;return s}
          function meta(x){if(!x||typeof x!=='object')return x;const out={};for(const [k,v] of Object.entries(x)){if(/url|path|file|token|key|sign/i.test(k))continue;if(typeof v==='string'&&v.length>180)out[k]=v.slice(0,180);else if(Array.isArray(v))out[k]='[array:'+v.length+']';else if(v&&typeof v==='object')out[k]='[object]';else out[k]=v}return out}
          async function prove(type,tmdbId,se,ep){const id=await tmdb(type==='movie'?'movie':'tv',tmdbId);const s=await req(API+'/subject/search',{method:'POST',body:JSON.stringify({keyword:id.title,page:1,perPage:20})});const a=rows(s.j);console.log('FIELD_MB_SEARCH type='+type+' title64='+Buffer.from(id.title).toString('base64')+' status='+s.r.status+' rows='+a.length+' candidates64='+Buffer.from(JSON.stringify(a.slice(0,8).map(x=>({title:x?.title,releaseDate:x?.releaseDate||x?.release_date,subjectId:x?.subjectId,detailPath:x?.detailPath,hasResource:x?.hasResource,score:score(x,id)})))).toString('base64'));
            const exact=a.map(x=>({x,s:score(x,id)})).sort((p,q)=>q.s-p.s)[0];if(!exact||exact.s<80)throw Error('no picked subject '+type);const x=exact.x;const dom=await req(API+'/media-player/get-domain');const domain=String(dom.j?.data||'').replace(/\/$/,'');const ref=domain+'/spa/videoPlayPage/movies/'+x.detailPath+'?id='+encodeURIComponent(x.subjectId)+'&type=/movie/detail&detailSe='+se+'&detailEp='+ep+'&lang=en';const p=await req(domain+'/wefeed-h5api-bff/subject/play?subjectId='+encodeURIComponent(x.subjectId)+'&se='+se+'&ep='+ep+'&detailPath='+encodeURIComponent(x.detailPath),{headers:{Referer:ref,Origin:domain,'X-Source':''}});const d=p.j?.data||{};const sets={streams:Array.isArray(d.streams)?d.streams:[],hls:Array.isArray(d.hls)?d.hls:[],dash:Array.isArray(d.dash)?d.dash:[]};console.log('FIELD_MB_PLAY type='+type+' status='+p.r.status+' hasResource='+Boolean(d.hasResource)+' dataKeys='+Object.keys(d).sort().join(',')+' counts='+Object.entries(sets).map(([k,v])=>k+':'+v.length).join(',')+' first64='+Buffer.from(JSON.stringify(Object.fromEntries(Object.entries(sets).map(([k,v])=>[k,v[0]?meta(v[0]):null])))).toString('base64'));
          }
          (async()=>{const b=await req(API+'/home?host=moviebox.ph');console.log('FIELD_MB_BOOT status='+b.r.status+' token='+Boolean(token));await prove('movie','157336',0,0);await prove('tv','1396',1,1)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
