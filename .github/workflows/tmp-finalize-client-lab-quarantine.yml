name: Temporary finalize client-lab safety quarantine

on:
  push:
    branches: [fix/quarantine-aware-client-lab]
    paths:
      - ".github/workflows/tmp-finalize-client-lab-quarantine.yml"

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/quarantine-aware-client-lab
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact client-lab evidence and build quarantine audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/client-lab-evidence
          fetch_artifact() {
            local id="$1" expected="$2" name="$3"
            curl --fail-with-body -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/${name}.zip"
            test "$(sha256sum "/tmp/${name}.zip" | awk '{print $1}')" = "$expected"
            mkdir -p "/tmp/client-lab-evidence/${name}"
            unzip -q "/tmp/${name}.zip" -d "/tmp/client-lab-evidence/${name}"
          }
          fetch_artifact 9251387206 6835cd95baa59d297e61bc6ad355eb8ba8a91a1cf968c1788011dcbf0e82bc31 interstellar
          fetch_artifact 9251392710 2262426f4f1fba376f9ddeb5d646eb1e04ea4532188a8904c053c7b2557bdbbc breaking-bad-s01e01
          fetch_artifact 9251415910 94336e3d5f517526efd59bc0deac0ac79d0b8c4abaf04f5967ce48fea53b54a5 jujutsu-kaisen-s01e01
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/client-lab-evidence')
          rows=[]
          for case in ('interstellar','breaking-bad-s01e01','jujutsu-kaisen-s01e01'):
              report_path=next((root/case).rglob('report.json'))
              report=json.loads(report_path.read_text())
              fixture=report.get('fixture') or {}
              fixture_name=case
              for provider in report.get('providers') or []:
                  clients=provider.get('clients') or {}
                  contradictions=[int((row or {}).get('identity_contradiction_count') or 0) for row in clients.values()]
                  maximum=max(contradictions or [0])
                  if maximum <= 0:
                      continue
                  streams=max([int((row or {}).get('runtime_stream_count') or 0) for row in clients.values()] or [0])
                  rows.append({
                      'provider_id': str(provider.get('id') or '').casefold(),
                      'fixture': fixture_name,
                      'identity_contradiction_count': maximum,
                      'playable_stream_count': streams,
                      'playable_identity_false_positive': True,
                      'hls_variant_failures': 0,
                      'hls_audio_failures': 0,
                  })
          offenders={row['provider_id'] for row in rows}
          assert offenders == {'sekai','videasy'}, (offenders, rows)
          assert sum(1 for row in rows if row['provider_id']=='sekai') == 2, rows
          assert sum(1 for row in rows if row['provider_id']=='videasy') == 1, rows
          audit={'schema_version':1,'source':'nuvio_client_lab','workflow_run_id':31901981309,'tested_commit_sha':'489d9c6a91794d6f2528c0282320b1584eb58a55','rows':rows}
          Path('/tmp/client-lab-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          print('FIELD_CLIENT_LAB_QUARANTINE_ROWS='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY
      - name: Quarantine only the proven offenders
        run: |
          set -euo pipefail
          python3 scripts/quarantine_catalogue_audit_failures.py \
            --audit /tmp/client-lab-audit.json \
            --workflow-run-id 31901981309 \
            --tested-commit-sha 489d9c6a91794d6f2528c0282320b1584eb58a55
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('manifest.json').read_text())
          rows={str(r.get('id','')).casefold():r for r in d.get('scrapers',[])}
          for pid in ('sekai','videasy'):
              row=rows[pid]
              assert row.get('enabled') is False, row
              fn=str(row.get('filename') or '')
              assert '--nuvio-audit-quarantine--' in fn, fn
              text=Path(fn).read_text()
              assert 'NUVIO_PROVIDER_QUARANTINE_V1' in text
              assert 'catalogue_audit_playable_identity_contradiction' in text
              print(pid, fn)
          PY
      - name: Materialize final 5.20.55 release and run complete regression suite
        run: |
          set -euo pipefail
          python3 scripts/sync_release_versions.py --version 5.20.55
          python3 scripts/reapply_published_overrides.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/validate_activation_preservation.py
          npm test
      - name: Self-clean finalizer and commit tested release
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-finalize-client-lab-quarantine.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: quarantine remaining client-lab identity contradictions"
          git push origin HEAD:fix/quarantine-aware-client-lab
