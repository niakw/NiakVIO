name: TEMP - Provider v3 Fast Yield

on:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - ".github/triggers/provider-v3-fast-yield.json"

permissions:
  contents: read

concurrency:
  group: provider-v3-fast-yield
  cancel-in-progress: true

jobs:
  fast-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert TMDB runtime context
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TMDB_API_KEY:-}" ] && [ -z "${TMDB_ACCESS_TOKEN:-}" ]; then
            echo "TMDB credential missing from fast-yield runner" >&2
            exit 78
          fi
          echo "FIELD_TMDB_FAST_YIELD state=ready credential_present=true value_redacted=true"

      - name: Verify fresh reconstructed 96/96 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          trigger = json.loads(Path('.github/triggers/provider-v3-fast-yield.json').read_text(encoding='utf-8'))
          source_sha = str(trigger.get('source_sha') or '').strip()
          if len(source_sha) != 40:
              raise SystemExit('fast-yield trigger missing full source_sha')

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = [row for row in (manifest.get('scrapers') or []) if isinstance(row, dict)]
          ids = [str(row.get('id') or '').strip() for row in rows]
          if len(rows) != 96 or len(set(ids)) != 96 or any(not item for item in ids):
              raise SystemExit(f'manifest provider census mismatch rows={len(rows)} unique={len(set(ids))}')
          missing = [str(row.get('filename') or '') for row in rows if not Path(str(row.get('filename') or '')).is_file()]
          if missing:
              raise SystemExit('manifest references missing provider bundles: ' + ','.join(missing[:10]))

          material = json.loads(Path('provider-v3-materialization.json').read_text(encoding='utf-8'))
          if int(material.get('providerCount') or 0) != 96 or int(material.get('expectedProviderCount') or 0) != 96:
              raise SystemExit('materialization provider count is not 96/96')

          subprocess.run(['git', 'cat-file', '-e', source_sha + '^{commit}'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', source_sha, 'HEAD'], check=True)
          changed = subprocess.run(
              ['git', 'diff', '--name-only', source_sha + '..HEAD', '--', 'manifest.json', 'provider-v3-materialization.json', 'providers'],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          if changed:
              raise SystemExit('provider candidate drifted after verified reconstruction: ' + changed.replace('\n', ','))

          print(
              'FIELD_PROVIDER_FAST_YIELD_CANDIDATE '
              f'source_sha={source_sha} providers=96 materialized=96 bundles_present=true drift=false'
          )
          PY

      - name: Run fast real-stream yield census
        shell: bash
        env:
          NIAKVIO_QUICK_YIELD_WORKERS: "12"
          NIAKVIO_QUICK_YIELD_TIMEOUT: "45"
        run: |
          set -euo pipefail
          python scripts/audit_provider_quick_yield.py

      - name: Publish fast yield summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path=Path('provider-v3-quick-yield.json')
          print('## Provider v3 fast yield')
          if not path.is_file():
              print('- report missing')
              raise SystemExit(0)
          data=json.loads(path.read_text(encoding='utf-8'))
          print(f"- Providers: **{data.get('provider_count', 0)}**")
          print(f"- Semantic executions: **{data.get('task_count', 0)}**")
          print(f"- Returned raw streams: **{data.get('raw_provider_count', 0)} providers**")
          print(f"- Playable media: **{data.get('playable_provider_count', 0)} providers**")
          print(f"- Identity-verified playable media: **{data.get('verified_provider_count', 0)} providers**")
          print('- Playable: `' + ', '.join(data.get('playable_providers') or []) + '`')
          for kind, row in (data.get('type_summary') or {}).items():
              print(f"- {kind}: tasks={row.get('tasks',0)} raw={row.get('raw',0)} playable={row.get('playable',0)} verified={row.get('verified',0)}")
          PY

      - name: Upload sanitized fast yield evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v3-fast-yield-${{ github.run_id }}
          path: provider-v3-quick-yield.json
          retention-days: 5
          if-no-files-found: warn
