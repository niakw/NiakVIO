name: TV VF global hardening apply

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-vf-global-hardening
      - .github/triggers/tv-vf-global-hardening-v2
      - .github/triggers/tv-vf-global-hardening-v3
      - .github/triggers/tv-vf-global-hardening-v4
      - .github/triggers/tv-vf-global-hardening-v5

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - name: Record global hardening run id
        run: |
          mkdir -p .github/status
          printf '%s\n' "$GITHUB_RUN_ID" > .github/status/tv-vf-global-hardening-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/tv-vf-global-hardening-run
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record global TV hardening run'
            git push origin HEAD:agent/tv-regression-5.20.38
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply and materialize global TV coverage migrations
        run: |
          python scripts/migrate_tv_hardening_5_20_39.py
          python scripts/migrate_deep_stream_sampling_v2.py
          python scripts/migrate_direct_media_dimensions_v1.py
          python scripts/migrate_matroska_metadata_v1.py
          python scripts/migrate_media_duration_identity_v1.py
          python scripts/migrate_type_scoped_activation_v1.py
          python scripts/migrate_tv_catalogue_fixtures_v1.py
          python scripts/reapply_published_overrides.py
          python scripts/validate_published_overrides.py
      - name: Repository regression suite
        run: npm test
      - name: Validate policy and provider semantics
        run: |
          python scripts/validate_policy.py
          node scripts/validate_provider_semantics.cjs
      - name: Commit proven migration output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration output to commit.'
            exit 0
          fi
          git commit -m 'fix: harden global TV media identity and VF coverage'
          git push origin HEAD:agent/tv-regression-5.20.38
