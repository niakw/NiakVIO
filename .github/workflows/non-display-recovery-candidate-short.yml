name: CANDIDATE - Six Non-Display Recovery

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths:
      - '.github/workflows/non-display-recovery-candidate-short.yml'
      - 'scripts/provider_patches/non_display_recovery_runtime_v1.py'
      - 'scripts/provider_patches/non_display_recovery_followup_v2.py'
      - 'scripts/provider_patches/*nondisplay_recovery_v1.py'
      - 'scripts/provider_patches/*nondisplay_recovery_v2.py'
      - 'scripts/register_non_display_recovery_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-six-nondisplay-recovery-candidate
  cancel-in-progress: true

jobs:
  prove-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_PARITY_SAMPLES_PER_LANE: '3'
      NIAKVIO_PARITY_WORKERS: '6'
      NIAKVIO_PARITY_TIMEOUT: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install provider worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source and registrar without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/provider_patches/non_display_recovery_runtime_v1.py \
            scripts/provider_patches/non_display_recovery_followup_v2.py \
            scripts/provider_patches/animesamaco_nondisplay_recovery_v1.py \
            scripts/provider_patches/animesamaco_nondisplay_recovery_v2.py \
            scripts/provider_patches/animevostfr_nondisplay_recovery_v1.py \
            scripts/provider_patches/coflix_nondisplay_recovery_v1.py \
            scripts/provider_patches/neko_sama_nondisplay_recovery_v1.py \
            scripts/provider_patches/neko_sama_nondisplay_recovery_v2.py \
            scripts/provider_patches/sekai_nondisplay_recovery_v1.py \
            scripts/provider_patches/sekai_nondisplay_recovery_v2.py \
            scripts/provider_patches/voiranime_rip_nondisplay_recovery_v1.py \
            scripts/provider_patches/voiranime_rip_nondisplay_recovery_v2.py \
            scripts/register_non_display_recovery_v1.py \
            scripts/materialize_provider_v3_one.py \
            scripts/run_provider_upstream_parity_v3.py
          python3 - <<'PY'
          import importlib.util,json,pathlib
          root=pathlib.Path('.').resolve()
          spec=importlib.util.spec_from_file_location('reg',root/'scripts/register_non_display_recovery_v1.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          doc=json.loads((root/'provider-overrides.json').read_text(encoding='utf-8'))
          changed=mod.apply_document(doc);mod.validate_document(doc)
          assert set(changed).issubset(set(mod.PROVIDERS))
          print('NON_DISPLAY_REGISTRAR_DRY_OK changed='+','.join(sorted(changed)))
          PY
      - name: Register recovery Lego and rematerialize six only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_non_display_recovery_v1.py
          for provider in animesama-co animevostfr coflix neko-sama sekai voiranime-rip; do
            echo "NON_DISPLAY_MATERIALIZE $provider"
            python3 scripts/materialize_provider_v3_one.py "$provider"
          done
          git diff --check
      - name: Prove seven exact lost routes against same-time upstream
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          cases=[
            ('animesama-co','anime','45950'),
            ('animevostfr','anime','95479'),
            ('coflix','movie','10195'),
            ('coflix','tv','94997'),
            ('neko-sama','anime','65930'),
            ('sekai','anime','65930'),
            ('voiranime-rip','anime','120089'),
          ]
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text(encoding='utf-8'))
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); upstreams,_=v2.upstream_catalog(); rows=[]
          with tempfile.TemporaryDirectory() as td:
            td=pathlib.Path(td)
            up_paths={}
            for pid,_,_ in cases:
              if pid in up_paths: continue
              row=upstreams.get(pid)
              if not row or not row.get('url'): raise SystemExit('missing upstream: '+pid)
              path=td/(pid+'-up.js');path.write_bytes(p.get_bytes(row['url']));up_paths[pid]=path
            for pid,lane,tmdb in cases:
              fx=fixtures[(lane,tmdb)]
              lo=v3._run_verified(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
              up=v3._run_verified(up_paths[pid],v3.fixture_payload(fx,lane,upstream=True),25)
              status=v3.classify_pair(up,lo)
              item={
                'providerId':pid,'lane':lane,'fixture':fx['slug'],'classification':status,
                'localStreams':int(lo.get('stream_count') or 0),'localTerminal':bool(lo.get('terminal_verified')),
                'upstreamStreams':int(up.get('stream_count') or 0),'upstreamTerminal':bool(up.get('terminal_verified')),
                'localReasons':lo.get('terminal_reasons') or [],'upstreamReasons':up.get('terminal_reasons') or [],
                'localError':lo.get('error_class'),'upstreamError':up.get('error_class'),
              }
              print('NON_DISPLAY_EXACT_PARITY '+json.dumps(item,sort_keys=True));rows.append(item)
          pathlib.Path('automation/non-display-recovery-exact-proof.json').write_text(json.dumps({'rows':rows},indent=2)+'\n',encoding='utf-8')
          bad=[r for r in rows if r['classification']=='upstream_ok_niakvio_ko']
          if bad: raise SystemExit('exact proven regressions remain: '+','.join(r['providerId']+':'+r['lane'] for r in bad))
          PY
      - name: Build 18-provider suspect scope and rerun deep parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'4khdhub','allanime','allwish','animesalt','flemmix','moviebox','moviesmod','showbox','vidfast','vidlove','wookafr','coflix','neko-sama','sekai','voiranime','voiranime-rip','animesama-co','animevostfr'}
          src=json.loads(Path('automation/evidence/hub-lab-matrix-46.json').read_text(encoding='utf-8'))
          rows=[r for r in src.get('rows',[]) if str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') in wanted]
          got={str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') for r in rows}
          if got!=wanted: raise SystemExit('scope mismatch missing='+','.join(sorted(wanted-got)))
          Path('/tmp/non-display-suspect-scope.json').write_text(json.dumps({'schemaVersion':src.get('schemaVersion',1),'hubCount':len(rows),'providerCount':len(rows),'rows':rows},indent=2)+'\n')
          PY
          python3 tests/provider_upstream_parity_v3_test.py
          python3 scripts/run_provider_upstream_parity_v3.py --scope-matrix /tmp/non-display-suspect-scope.json --out automation/non-display-recovery-parity.json
      - name: Enforce zero proven regressions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('automation/non-display-recovery-parity.json',encoding='utf-8'))
          counts=d.get('statusCounts') or {}
          regress=[r.get('providerId') for r in d.get('providers') or [] if r.get('status')=='REGRESSION']
          print('NON_DISPLAY_RECOVERY_COUNTS '+json.dumps(counts,sort_keys=True))
          print('NON_DISPLAY_RECOVERY_REGRESSIONS '+','.join(x for x in regress if x))
          if regress or int(counts.get('REGRESSION') or 0): raise SystemExit('proven regressions remain: '+','.join(x for x in regress if x))
          PY
      - name: Persist candidate bytes on repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json manifest.json providers/ provider-v3-materialization.json automation/non-display-recovery-exact-proof.json automation/non-display-recovery-parity.json
          git diff --cached --quiet && { echo NON_DISPLAY_CANDIDATE_ALREADY_CURRENT; exit 0; }
          git commit -m 'fix: recover six non-display provider routes'
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "NON_DISPLAY_CANDIDATE_PERSISTED $(git rev-parse HEAD)"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: non-display-recovery-candidate-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/non-display-recovery-exact-proof.json
            automation/non-display-recovery-parity.json
