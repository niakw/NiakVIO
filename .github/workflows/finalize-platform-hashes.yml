name: Finalize 5.20.28 platform release hashes

on:
  push:
    paths:
      - .github/triggers/finalize-platform-hashes

permissions:
  contents: write

concurrency:
  group: nuvio-finalize-platform-hashes
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Validate published platform state
        run: |
          python tests/release_hash_scope_test.py
          python tests/platform_filter_semantics_test.py
          python scripts/validate_platform_runtime_policy.py
          python scripts/validate_mobile_runtime_policy.py
          python scripts/validate_language_projection.py
          python scripts/validate_activation_preservation.py

      - name: Remove finite finalizer and regenerate exact hashes
        run: |
          rm -f .github/workflows/finalize-platform-hashes.yml
          rm -f .github/triggers/finalize-platform-hashes
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --check

      - name: Commit exact 5.20.28 hashes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(python -c 'import json; print(json.load(open("package.json"))["version"])')" = "5.20.28"
          git add -A
          git commit -m "chore: finalize 5.20.28 platform release hashes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify exact published main is deterministic
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python tests/release_hash_scope_test.py
          python tests/platform_filter_semantics_test.py
          python scripts/validate_platform_runtime_policy.py
          python scripts/validate_mobile_runtime_policy.py
          python scripts/validate_language_projection.py
          python scripts/validate_activation_preservation.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --exit-code
