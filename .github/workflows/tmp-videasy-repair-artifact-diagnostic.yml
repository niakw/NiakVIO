name: TEMP - VidEasy Identity-Safe Endpoint Fix

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/tmp-videasy-repair-artifact-diagnostic.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Remove contradicted VidEasy Nitrogen execution endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          patch=Path('scripts/provider_patches/videasy_runtime_v1.py')
          src=patch.read_text(encoding='utf-8')
          needle=' {"label":"Nitrogen","path":"m4uhd/sources-with-title"},\n'
          if needle in src:
              src=src.replace(needle,'',1)
          if 'm4uhd/sources-with-title' in src:
              raise SystemExit('VidEasy executable patch still contains Nitrogen/m4uhd endpoint')
          patch.write_text(src,encoding='utf-8')

          p=Path('provider-overrides.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          row=data['provider_patches']['videasy']
          notes=list(row.get('notes') or [])
          notes=[n for n in notes if not str(n).startswith('Ten statically recovered source endpoints')]
          notes.append('Nine content-safe Wings source endpoints are executable. Nitrogen/m4uhd remains recognition evidence only after live movie+TV probes proved a media identity contradiction; it must not be emitted by the VidEasy runtime.')
          row['notes']=notes
          # Candidate routes are evidence, not execution authority. Keep m4uhd here so Repair can remember
          # the observed upstream route without silently re-promoting it into the runtime endpoint set.
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          t=Path('tests/videasy_identity_safe_endpoint_policy_test.py')
          t.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport json, sys\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT/"scripts"))\nfrom provider_patches.videasy_runtime_v1 import DEFAULT_ENDPOINTS\npaths=[str(x.get("path") or "") for x in DEFAULT_ENDPOINTS]\nlabels=[str(x.get("label") or "") for x in DEFAULT_ENDPOINTS]\nassert len(DEFAULT_ENDPOINTS)==9, len(DEFAULT_ENDPOINTS)\nassert "cdn/sources-with-title" in paths\nassert "Hydrogen" in labels\nassert "m4uhd/sources-with-title" not in paths\nassert "Nitrogen" not in labels\noverrides=json.loads((ROOT/"provider-overrides.json").read_text(encoding="utf-8"))\nrow=overrides["provider_patches"]["videasy"]\nassert "/m4uhd/sources-with-title" in (row.get("candidate_learned_routes") or [])\nassert any("identity contradiction" in str(n) for n in (row.get("notes") or []))\nprint("VIDEASY_IDENTITY_SAFE_ENDPOINT_POLICY_OK executable=9 nitrogen=false evidence_retained=true")\n''',encoding='utf-8')
          PY

      - name: Validate durable VidEasy endpoint policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/provider_patches/videasy_runtime_v1.py
          python tests/videasy_identity_safe_endpoint_policy_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          git diff --check

      - name: Commit bounded durable fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_patches/videasy_runtime_v1.py provider-overrides.json tests/videasy_identity_safe_endpoint_policy_test.py
          git diff --cached --check
          git commit -m 'fix(videasy): drop identity-unsafe Nitrogen source'
          git push origin HEAD:workbench/systemic-recovery-20260909
