name: TEMP - VidEasy Repair Artifact Diagnostic

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/tmp-videasy-repair-artifact-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact failed-floor Repair artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair"
          gh run download 34445456632 -n provider-recognition-repair-v6-34445456632 -D "$RUNNER_TEMP/repair"
          test -s "$RUNNER_TEMP/repair/manifest.json"

      - name: Probe VidEasy movie and TV and summarize contradictions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/videasy-fixtures.json"
          import json
          from pathlib import Path
          corpus=json.loads(Path('.github/triggers/nuvio-client-lab.json').read_text(encoding='utf-8'))
          wanted={'interstellar','breaking-bad-s01e01'}
          out={row['slug']:row['fixture'] for row in corpus['fixtures'] if row.get('slug') in wanted}
          print(json.dumps(out,separators=(',',':')))
          PY
          python - <<'PY' > "$RUNNER_TEMP/videasy-path.txt"
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'repair'
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in m['scrapers'] if str(x.get('id','')).lower()=='videasy')
          print(root/row['filename'])
          PY
          PROVIDER="$(cat "$RUNNER_TEMP/videasy-path.txt")"
          for SLUG in interstellar breaking-bad-s01e01; do
            FIXTURE="$(python - "$SLUG" <<'PY'
          import json,sys,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/videasy-fixtures.json'))
          print(json.dumps(data[sys.argv[1]],separators=(',',':')))
          PY
          )"
            OUT="$RUNNER_TEMP/$SLUG.out"
            set +e
            node scripts/nuvio_tv_probe_tmdb_ci.cjs "$PROVIDER" "$FIXTURE" '{}' > "$OUT"
            RC=$?
            set -e
            python - "$SLUG" "$RC" "$OUT" <<'PY'
          import json,sys
          slug,rc,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          rows=[]
          for raw in open(path,encoding='utf-8'):
              raw=raw.strip()
              if raw.startswith('{'):
                  try: rows.append(json.loads(raw))
                  except Exception: pass
          if not rows: raise SystemExit(f'VIDEASY_DIAG slug={slug} no_json rc={rc}')
          d=rows[-1]
          bad=[]
          for item in d.get('streams') or []:
              ident=item.get('identity') or {}
              dur=item.get('duration_identity') or {}
              if ident.get('status')=='contradiction' or dur.get('status')=='contradiction':
                  row=item.get('row') or {}; media=item.get('media') or {}
                  bad.append({
                    'sourceName':row.get('sourceName'),
                    'quality':row.get('quality'),
                    'urlHost':(media.get('url') or row.get('url') or '').split('/')[2] if '://' in (media.get('url') or row.get('url') or '') else '',
                    'mediaDurationSeconds':media.get('media_duration_seconds'),
                    'identity':ident,
                    'durationIdentity':dur,
                  })
          print('VIDEASY_DIAG '+json.dumps({'slug':slug,'rc':rc,'raw':d.get('raw_stream_count'),'playable':d.get('playable_stream_count'),'verified':d.get('content_verified_count'),'contradictions':d.get('identity_contradiction_count'),'bad':bad},separators=(',',':')))
          PY
          done
