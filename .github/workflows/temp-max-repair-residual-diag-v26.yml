name: TEMP - Max Repair Residual Diagnostics V26
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-residual-diag-v26.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Inspect current residual routes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/residual-v26.cjs <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36';
          async function get(url,referer){
            const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
            try{const r=await fetch(url,{redirect:'follow',headers:{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.8',...(referer?{Referer:referer}:{})},signal:c.signal});const text=await r.text();return {status:r.status,url:r.url,ctype:r.headers.get('content-type')||'',text};}
            catch(e){return {status:0,url,error:String(e&&e.message||e),ctype:'',text:''};} finally{clearTimeout(t)}
          }
          function abs(raw,base){try{return new URL(raw,base).toString()}catch{return''}}
          function anchors(html,base){const out=[];let m,re=/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;while((m=re.exec(html||''))&&out.length<1000){out.push({url:abs(m[1],base),text:String(m[2]||'').replace(/<[^>]+>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim()})}return out}
          function forms(html,base){const out=[];let m,re=/<form\b([^>]*)>([\s\S]*?)<\/form>/gi;while((m=re.exec(html||''))&&out.length<30){const tag=m[1]||'',body=m[2]||'',am=tag.match(/action=["']([^"']*)["']/i),mm=tag.match(/method=["']([^"']*)["']/i);const inputs=[...body.matchAll(/<input\b[^>]*name=["']([^"']+)["'][^>]*>/gi)].map(x=>x[1]);out.push({action:abs(am?am[1]:'',base),method:(mm?mm[1]:'GET').toUpperCase(),inputs})}return out}
          function pick(rows,needle){needle=needle.toLowerCase();return rows.filter(x=>(x.text+' '+x.url).toLowerCase().includes(needle)).slice(0,20)}
          async function wooka(){
            const base='https://wookafr.boston/'; const root=await get(base);
            console.log('WOOKA_ROOT',root.status,root.url,root.ctype,'bytes='+root.text.length,'forms=',JSON.stringify(forms(root.text,root.url)));
            console.log('WOOKA_ROOT_INTERSTELLAR',JSON.stringify(pick(anchors(root.text,root.url),'interstellar')));
            const qs=[
              ['wp','https://wookafr.boston/?s=Interstellar'],
              ['searchq','https://wookafr.boston/search?q=Interstellar'],
              ['recherche','https://wookafr.boston/recherche?q=Interstellar'],
              ['searchslash','https://wookafr.boston/search/Interstellar'],
              ['dle','https://wookafr.boston/index.php?do=search&subaction=search&story=Interstellar']
            ];
            for(const [name,url] of qs){const r=await get(url,base);const rows=pick(anchors(r.text,r.url),'interstellar');console.log('WOOKA_SEARCH',name,r.status,r.url,r.ctype,'bytes='+r.text.length,'matches='+JSON.stringify(rows));if(rows[0]){const d=await get(rows[0].url,r.url);const links=anchors(d.text,d.url).filter(x=>/lecteurvideo\.com|player|embed/i.test(x.url+' '+x.text)).slice(0,30);const raw=[...d.text.matchAll(/https?:\/\/[^"'<>\s]+/gi)].map(x=>x[0]).filter(x=>/lecteurvideo\.com/i.test(x)).slice(0,20);console.log('WOOKA_DETAIL',name,d.status,d.url,'bytes='+d.text.length,'links='+JSON.stringify(links),'rawLecteur='+JSON.stringify(raw));for(const l of [...links.map(x=>x.url),...raw].filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,4)){const p=await get(l,d.url);console.log('WOOKA_LECTEUR',p.status,p.url,'bytes='+p.text.length,'showVideo='+((p.text.match(/showVideo\s*\(/gi)||[]).length),'sample='+JSON.stringify(p.text.match(/showVideo\s*\([^\n]{0,300}/i)?.[0]||''));}}}
          }
          async function allanime(){
            const base='https://ww2.aniwatch.fit/'; const s=await get(base+'?s='+encodeURIComponent('One Piece'),base); const as=anchors(s.text,s.url); const cand=pick(as,'one piece');
            console.log('AA_SEARCH',s.status,s.url,'bytes='+s.text.length,'matches='+JSON.stringify(cand.slice(0,30)));
            const detail=cand.find(x=>/\/one-piece\/?(?:$|[?#])/i.test(x.url))||cand[0]; if(!detail)return;
            const d=await get(detail.url,s.url),aa=anchors(d.text,d.url);
            const epl=[...d.text.matchAll(/class=["'][^"']*epl-num[^"']*["'][^>]*>\s*([^<]+)</gi)].map(x=>x[1].trim());
            const epLinks=aa.filter(x=>/episode/i.test(x.url)||/^\s*\d+(?:\.\d+)?\s*$/.test(x.text)).slice(-40);
            console.log('AA_DETAIL',d.status,d.url,'bytes='+d.text.length,'eplCount='+epl.length,'eplHead='+JSON.stringify(epl.slice(0,10)),'eplTail='+JSON.stringify(epl.slice(-10)),'epLinksTail='+JSON.stringify(epLinks));
            const wanted=aa.find(x=>/(?:episode[-_]?0*1178)(?:$|[/?#-])/i.test(x.url))||aa.find(x=>/^1178$/.test(x.text));
            console.log('AA_WANTED',JSON.stringify(wanted||null)); if(!wanted)return;
            const ep=await get(wanted.url,d.url); const ifr=[...ep.text.matchAll(/<iframe[^>]+(?:src|data-src)=["']([^"']+)["']/gi)].map(x=>abs(x[1],ep.url));
            console.log('AA_EP',ep.status,ep.url,'bytes='+ep.text.length,'iframes='+JSON.stringify(ifr));
          }
          async function coflix(){
            const base='https://coflix.esq/'; const root=await get(base);console.log('COFLIX_ROOT',root.status,root.url,root.ctype,'bytes='+root.text.length,'forms='+JSON.stringify(forms(root.text,root.url)));
            for(const [label,title] of [['movie','Interstellar'],['tv','Breaking Bad']]){
              for(const url of [base+'?s='+encodeURIComponent(title),base+'search?q='+encodeURIComponent(title),base+'recherche?q='+encodeURIComponent(title)]){
                const r=await get(url,base),m=pick(anchors(r.text,r.url),title.toLowerCase());console.log('COFLIX_SEARCH',label,r.status,r.url,'bytes='+r.text.length,'matches='+JSON.stringify(m));
              }
            }
          }
          (async()=>{await wooka();await allanime();await coflix()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/residual-v26.cjs
