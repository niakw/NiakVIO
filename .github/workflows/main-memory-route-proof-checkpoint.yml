name: MAIN - Route Proof Memory Checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-memory-route-proof-checkpoint.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Append durable route-proof checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('MEMORY.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 2026-09-07 — Route reconstruction authority bug / proof-first redesign'
          block = base64.b64decode('').decode('utf-8')
          if marker not in text:
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/main-memory-route-proof-checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MEMORY.md
          git commit -m "docs: checkpoint proof-first route reconstruction"
          git push origin HEAD:main
