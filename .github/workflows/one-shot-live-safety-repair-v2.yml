name: One-shot live safety repair v2
# rerun-after-integrity-fix: 2026-08-14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-live-safety-repair-v2.yml"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Prepare fail-closed repair
        run: |
          python scripts/apply_live_safety_repair.py prepare
          python -m py_compile \
            scripts/promote_candidates.py \
            scripts/validate_activation_preservation.py \
            tests/manual_negative_safety_evidence_test.py

      - name: Materialize exact inert bundles
        run: |
          python scripts/reapply_published_overrides.py
          python scripts/reapply_published_overrides.py --check

      - name: Bind exact live evidence
        run: python scripts/apply_live_safety_repair.py record-evidence

      - name: Focused safety validation
        run: |
          python tests/ci_preservation_policy_test.py
          python tests/provider_quarantine_test.py
          python tests/manual_negative_safety_evidence_test.py
          python tests/runtime_media_safety_guard_test.py
          python scripts/validate_policy.py
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Regenerate and validate release hashes
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Assert exact published result
        run: python scripts/apply_live_safety_repair.py assert

      - name: Enforce repair scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'scripts/promote_candidates.py',
              'scripts/validate_activation_preservation.py',
              'provider-overrides.json',
              'tests/provider_quarantine_test.py',
              'tests/manual_negative_safety_evidence_test.py',
              'automation/nuvio-client-safety-findings.json',
              'manifest.json', 'vf/manifest.json', 'vostfr/manifest.json',
              'PROVENANCE.json', 'FILE-HASHES.json', 'PATCH-SHA256SUMS.txt',
              'SHA256SUMS.json',
          }
          changed = []
          for raw in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = raw[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(
              path for path in changed
              if path not in allowed and not path.startswith('providers/')
          )
          if unexpected:
              raise SystemExit('unexpected repair changes: ' + ', '.join(unexpected))
          print('repair scope passed: ' + ', '.join(sorted(changed)))
          PY

      - name: Commit tested repair
        run: |
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: fail closed on conclusive provider safety failures'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
