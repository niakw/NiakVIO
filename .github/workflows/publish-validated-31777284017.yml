name: Publish validated deep artifact 31777284017

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-validated-31777284017.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Download exact validated stage from run 31777284017
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuvio-validation-stage-31777284017
          path: checked-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: niakw/Niakvio
          run-id: 31777284017

      - name: Verify validated stage identity
        shell: bash
        run: |
          test -f checked-artifact/provider-overrides.json
          test -f checked-artifact/provider-domain-history.json
          test -f checked-artifact/health-output/health-results.json
          test -f checked-artifact/health-output/repair-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('checked-artifact/health-output/health-results.json').read_text(encoding='utf-8'))
          repair = json.loads(Path('checked-artifact/health-output/repair-report.json').read_text(encoding='utf-8'))
          if health.get('mode') != 'deep':
              raise SystemExit(f"validated artifact is not deep: {health.get('mode')!r}")
          if int(repair.get('accepted_repairs') or 0) != 0:
              raise SystemExit('unexpected accepted repair count changed in immutable artifact')
          print(f"validated stage confirmed: results={len(health.get('results') or [])} accepted_repairs=0")
          PY

      - name: Restore validated domain state and overrides
        run: |
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py

      - name: Apply strict gates and exact runtime evidence
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_candidates.py

      - name: Finalize last-known-good snapshots
        run: |
          test -f checked-artifact/staging/upstream-lkg-pending.json
          python scripts/finalize_upstream_lkg.py --pending checked-artifact/staging/upstream-lkg-pending.json --keep-generations 2

      - name: Remove stale provider bundles
        run: python scripts/prune_unreferenced_providers.py

      - name: Verify published overrides
        run: python scripts/validate_published_overrides.py

      - name: Stage provider files and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          cp checked-artifact/health-output/repair-report.json repair-report.json
          git add health-report.json health-history.json PROVENANCE.json dns-preflight-report.json provider-hub-report.json diagnostics-report.json diagnostics-report.html route-regressions.json repair-report.json provider-overrides.json provider-domain-history.json upstream-lkg.json upstream-lkg/
          if [ -d providers ]; then git add -A providers; fi

      - name: Prepare validated manifest transaction
        shell: bash
        run: |
          test -f manifest.next.json
          PREVIOUS_MANIFEST="$(mktemp)"
          git show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/release_evidence_fence.py fingerprint --manifest manifest.json --root . --output /tmp/release-generation.json

      - name: Block wrong-content and broken media publication
        env:
          NUVIO_CATALOGUE_AUDIT_OUTPUT: /tmp/catalogue-media-audit.json
          NUVIO_CATALOGUE_AUDIT_WORKERS: "8"
          NUVIO_CATALOGUE_AUDIT_TIMEOUT: "60"
        run: python scripts/audit_catalogue_identity_media.py

      - name: Upload catalogue audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalogue-media-audit-31777284017-publish-only
          path: /tmp/catalogue-media-audit.json
          retention-days: 2
          if-no-files-found: warn

      - name: Publish atomic validated transaction
        shell: bash
        run: |
          python scripts/release_evidence_fence.py validate --manifest manifest.json --root . --evidence /tmp/release-generation.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add manifest.json vf/manifest.json package.json package-lock.json sources.json nuvio-client-id-state.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if [ -d providers ]; then git add -A providers; fi
          if git diff --cached --quiet; then
            echo "Manifest is unchanged."
            exit 0
          fi
          git commit -m "chore: publish validated provider transaction"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          python scripts/release_evidence_fence.py validate --manifest manifest.json --root . --evidence /tmp/release-generation.json
          git push origin HEAD:main

      - name: Verify exact published main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          python scripts/release_evidence_fence.py validate --manifest manifest.json --root . --evidence /tmp/release-generation.json
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi
          npm test
          python scripts/release_evidence_fence.py validate --manifest manifest.json --root . --evidence /tmp/release-generation.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(name):
              return json.loads(Path(name).read_text(encoding='utf-8'))
          package = load('package.json')
          lock = load('package-lock.json')
          manifest = load('manifest.json')
          vf = load('vf/manifest.json')
          versions = {
              'package.json': package.get('version'),
              'package-lock.json': lock.get('version'),
              "package-lock.json packages['']": (lock.get('packages') or {}).get('', {}).get('version'),
              'manifest.json': manifest.get('version'),
              'vf/manifest.json': vf.get('version'),
          }
          if len({str(value) for value in versions.values()}) != 1:
              raise SystemExit(f'final published release version mismatch: {versions}')
          print(f"final published release version synchronization passed: {manifest.get('version')}")
          PY
          git diff --exit-code
