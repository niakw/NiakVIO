name: TEMP - Kehflix Source Schema V62D

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-kehflix-schema-v62d.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compare movie TV anime source payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,html,http.cookiejar
          base='https://kehflix.wiki'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def req(url,referer=None,timeout=18):
              h={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,text/plain,*/*'}
              if referer: h['Referer']=referer
              r=urllib.request.Request(url,headers=h)
              try:
                  with opener.open(r,timeout=timeout) as x:
                      return x.status,x.read().decode('utf-8','replace'),dict(x.headers),x.geturl()
              except Exception as e:
                  status=getattr(e,'code',0) or 0
                  try: body=e.read().decode('utf-8','replace')
                  except Exception: body=repr(e)
                  return status,body,dict(getattr(e,'headers',{}) or {}),url
          def title_key(path):
              st,text,headers,_=req(base+path,base+'/')
              pats=[r'[?&]k=([^&"\'<>\\\s]+)',r'\bk\s*[:=]\s*["\']([^"\']{20,})["\']',r'([A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})']
              keys=[]
              for pat in pats:
                  for v in re.findall(pat,text):
                      v=html.unescape(urllib.parse.unquote(str(v))).strip()
                      if v not in keys: keys.append(v)
              print('V62D_TITLE',path,'status',st,'cookies',[c.name for c in jar],'keys',len(keys))
              return keys,text
          def call(label,path,params,referer):
              url=base+path+'?'+urllib.parse.urlencode(params)
              st,body,headers,_=req(url,referer)
              print('V62D_API',label,'status',st,'ct',headers.get('Content-Type'),'body',body[:12000])
              if st!=200:return None
              try:return json.loads(body)
              except:return None
          mk,_=title_key('/title/movie/157336-interstellar')
          movie=None
          for k in mk[:10]:
              d=call('movie','/api/streams/movie',{'id':'157336','k':k},base+'/title/movie/157336-interstellar')
              if isinstance(d,dict) and d.get('ok'): movie=d;break
          tk,_=title_key('/title/tv/1396-breaking-bad')
          tv=None
          for k in tk[:10]:
              d=call('tv','/api/streams/episode',{'id':'1396','season':'1','episode':'1','k':k},base+'/title/tv/1396-breaking-bad')
              if isinstance(d,dict) and d.get('ok'): tv=d;break
          ak,_=title_key('/title/tv/95479-jujutsu-kaisen')
          anime=None
          for k in ak[:10]:
              d=call('anime','/api/streams/episode',{'id':'95479','season':'1','episode':'1','k':k},base+'/title/tv/95479-jujutsu-kaisen')
              if isinstance(d,dict) and d.get('ok'): anime=d;break
          for label,d in [('movie',movie),('tv',tv),('anime',anime)]:
              if not isinstance(d,dict):
                  print('V62D_NO_PAYLOAD',label);continue
              sources=d.get('sources') if isinstance(d.get('sources'),list) else []
              print('V62D_SCHEMA',label,'topkeys',sorted(d.keys()),'sourcecount',len(sources))
              for i,s in enumerate(sources[:12]):
                  if not isinstance(s,dict):continue
                  safe={}
                  for k,v in s.items():
                      if isinstance(v,(str,int,float,bool)) or v is None:
                          safe[k]=str(v)[:500]
                      elif isinstance(v,(dict,list)):
                          safe[k]=v
                  print('V62D_SOURCE',label,i,json.dumps(safe,ensure_ascii=False,sort_keys=True)[:4000])
                  # Try every plausible signed scalar token against stream-gw.
                  for key,v in s.items():
                      if key.lower() in {'src','url','name','label','quality','language','lang','server'}: continue
                      if not isinstance(v,str) or len(v)<16: continue
                      gw=base+'/api/stream-gw?'+urllib.parse.urlencode({'t':v})
                      gs,gb,gh,gfinal=req(gw,referer)
                      print('V62D_GWTRY',label,i,key,'status',gs,'ct',gh.get('Content-Type'),'body',gb[:180].replace('\n',' '))
          PY
