name: Temporary promote runtime capability engine v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/tmp-promote-engine-v4"

permissions:
  contents: write

concurrency:
  group: tmp-promote-engine-v4
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm

      - name: Install locked validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply native-safe engine v4 and rebuild published generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 tests/native_catalogue_recovery_budget_test.py
          python3 tests/native_hls_integrity_budget_test.py
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 tests/streamzo_target_media_profile_test.py
          python3 scripts/apply_native_catalogue_recovery_budget_upgrade_v1.py
          python3 scripts/apply_native_hls_integrity_budget_upgrade_v1.py
          python3 scripts/apply_runtime_capability_upgrade_v4.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/native_catalogue_recovery_budget_test.py
          python3 tests/native_hls_integrity_budget_test.py
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 tests/streamzo_target_media_profile_test.py
          python3 scripts/validate_published_overrides.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Run complete main validation suite
        shell: bash
        run: |
          set -euxo pipefail
          npm test
          python3 tests/native_catalogue_recovery_budget_test.py
          python3 tests/native_hls_integrity_budget_test.py
          python3 tests/streamzo_native_platform_contract_test.py
          python3 tests/native_corpus_transport_capability_test.py
          python3 tests/provider_hub_registry_test.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check

      - name: Verify promotion invariants
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('provider-overrides.json').read_text(encoding='utf-8'))
          engine = cfg.get('runtime_capability_media_safety') or {}
          assert engine.get('version') == 4, engine
          assert engine.get('scope') == 'all_hls_capable_providers', engine
          patch = engine.get('final_patch')
          assert patch == 'scripts/provider_patches/runtime_capability_media_safety_v4.py', patch

          catalogue_budget = cfg.get('native_catalogue_recovery_budget') or {}
          assert catalogue_budget.get('version') == 2, catalogue_budget
          assert set(catalogue_budget.get('native_platforms') or []) == {'desktop', 'mobile_android', 'tv_android'}, catalogue_budget
          assert catalogue_budget.get('native_max_search_requests') == 4, catalogue_budget
          assert catalogue_budget.get('native_max_candidate_pages') == 3, catalogue_budget
          assert catalogue_budget.get('native_search_selection') == 'round_robin_across_title_aliases_and_search_routes', catalogue_budget
          assert catalogue_budget.get('targets'), catalogue_budget

          hls_budget = cfg.get('native_hls_integrity_budget') or {}
          assert hls_budget.get('version') == 1, hls_budget
          assert set(hls_budget.get('native_platforms') or []) == {'desktop', 'mobile_android', 'tv_android'}, hls_budget
          assert hls_budget.get('targets'), hls_budget

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id') or '').casefold(): row for row in manifest.get('scrapers', []) if isinstance(row, dict)}
          assert rows['moviebox'].get('enabled') is False
          assert rows['netmirror'].get('enabled') is False
          assert rows['streamzo'].get('enabled') is True
          payload = Path(rows['streamzo']['filename']).read_text(encoding='utf-8')
          assert payload.count('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1:') == 1
          assert 'NUVIO_STREAMZO_DATA_EMBED_V2' in payload
          assert 'NUVIO_STREAMZO_PUBLIC_CATALOGUE_V3:' in payload
          assert 'NUVIO_NATIVE_CATALOGUE_RECOVERY_BUDGET_V2' in payload
          assert 'NUVIO_NATIVE_CATALOGUE_RECOVERY_BUDGET_V1 */' not in payload
          assert 'NUVIO_NATIVE_HLS_INTEGRITY_BUDGET_V1' in payload
          assert 'NUVIO_TV_TARGET_MEDIA_V4' in payload
          assert 'NUVIO_TV_TEXT_ONLY_FETCH_COMPAT_V1' in payload
          assert 'NUVIO_TV_PROTOCOL_RELATIVE_URL_COMPAT_V1' in payload
          assert '"implementationRevision":"field-safety-v4-runtime-capability"' in payload
          print('native-safe engine-v4 promotion invariants passed')
          PY

      - name: Arm full native corpus lab for the promoted generation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .github/triggers
          printf 'promoted-engine-v4 %s\n' "$(git rev-parse HEAD)" > .github/triggers/native-corpus-device-lab

      - name: Commit atomic promotion
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Native-safe engine v4 is already fully promoted."
            exit 0
          fi
          git commit -m "engine: promote native-safe runtime capability v4"
          git push origin HEAD:main
