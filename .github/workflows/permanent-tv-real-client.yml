name: Permanent NuvioTV real-client lab

on:
  workflow_dispatch:
  push:
    branches: ["lab/tv-real"]
    paths:
      - ".github/triggers/permanent-tv-real-client"

permissions:
  contents: read

concurrency:
  group: permanent-tv-real-client
  cancel-in-progress: false

env:
  NUVIO_TV_SHA: "d95f3fb837b6ddfbf9ff445cdcba2413b576f0d4"

jobs:
  tv-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Niakvio TV lab
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: lab/tv-real
          path: niakvio

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact official NuvioTV runtime
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          cd nuvio-tv
          git checkout "$NUVIO_TV_SHA"
          touch local.properties local.dev.properties

      - name: Prepare official TV instrumentation runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('nuvio-tv/app/build.gradle.kts')
          text = path.read_text()

          runner_needle = '        versionName = "0.8.4-beta"\n'
          if text.count(runner_needle) != 1:
              raise SystemExit(f'Unexpected defaultConfig version marker count: {text.count(runner_needle)}')
          text = text.replace(
              runner_needle,
              runner_needle + '        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n',
              1,
          )

          debug_needle = '''        debug {
            signingConfig = signingConfigs.getByName("release")
            isDebuggable = false'''
          debug_replacement = '''        debug {
            signingConfig = signingConfigs.getByName("debug")
            isDebuggable = true'''
          if text.count(debug_needle) != 1:
              raise SystemExit(f'Unexpected debug signing block count: {text.count(debug_needle)}')
          text = text.replace(debug_needle, debug_replacement, 1)
          path.write_text(text)
          PY

      - name: Inject exact Mon Ninja 3 TV tests
        shell: bash
        run: |
          TEST_ROOT=nuvio-tv/app/src/androidTest
          mkdir -p "$TEST_ROOT/java/com/nuvio/tv/core/plugin" "$TEST_ROOT/assets/niakvio"
          cp niakvio/providers/moviebox--published-baseline--1c0c9c423a094e0d.js "$TEST_ROOT/assets/niakvio/"
          cp niakvio/providers/netmirror--published-baseline--ccbd35984c20fc8b.js "$TEST_ROOT/assets/niakvio/"
          cp niakvio/providers/streamzo--published-baseline--bc19a7586f9f3bb8.js "$TEST_ROOT/assets/niakvio/"
          cat > "$TEST_ROOT/java/com/nuvio/tv/core/plugin/NiakvioTvRealProviderTest.kt" <<'KOTLIN'
          package com.nuvio.tv.core.plugin

          import android.util.Log
          import androidx.test.platform.app.InstrumentationRegistry
          import com.nuvio.tv.domain.model.LocalScraperResult
          import java.net.URL
          import kotlinx.coroutines.runBlocking
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class NiakvioTvRealProviderTest {
              private val runtime = PluginRuntime()
              private val http = OkHttpClient()
              private val providers = listOf(
                  "moviebox" to "niakvio/moviebox--published-baseline--1c0c9c423a094e0d.js",
                  "netmirror" to "niakvio/netmirror--published-baseline--ccbd35984c20fc8b.js",
                  "streamzo" to "niakvio/streamzo--published-baseline--bc19a7586f9f3bb8.js",
              )

              private fun emit(message: String) {
                  println(message)
                  Log.i("NiakvioTvRealLab", message)
              }

              private fun providerCode(relative: String): String =
                  InstrumentationRegistry.getInstrumentation().context.assets.open(relative)
                      .bufferedReader().use { it.readText() }

              private fun requestText(url: String, headers: Map<String, String>?): Pair<String, String> {
                  val builder = Request.Builder().url(url)
                  headers.orEmpty().forEach { (key, value) -> builder.header(key, value) }
                  http.newCall(builder.build()).execute().use { response ->
                      assertTrue("Media transport must be HTTP-successful: $url status=${response.code}", response.isSuccessful)
                      val contentType = response.header("Content-Type").orEmpty()
                      val body = response.body?.string().orEmpty()
                      return contentType to body
                  }
              }

              private fun hlsDurationSeconds(url: String, headers: Map<String, String>?, depth: Int = 0): Double? {
                  if (depth > 1) return null
                  val (_, text) = requestText(url, headers)
                  if (!text.contains("#EXTM3U")) return null
                  val durations = Regex("#EXTINF:([0-9.]+)").findAll(text)
                      .mapNotNull { it.groupValues.getOrNull(1)?.toDoubleOrNull() }
                      .toList()
                  if (durations.isNotEmpty()) return durations.sum()
                  val variant = text.lineSequence()
                      .map { it.trim() }
                      .firstOrNull { it.isNotEmpty() && !it.startsWith("#") && it.contains(".m3u8") }
                      ?: return null
                  return hlsDurationSeconds(URL(URL(url), variant).toString(), headers, depth + 1)
              }

              @Test
              fun exactMonNinjaProvidersOnOfficialTvRuntime() = runBlocking {
                  providers.forEach { (id, relative) ->
                      val started = System.currentTimeMillis()
                      val rows = runtime.executePlugin(
                          code = providerCode(relative),
                          tmdbId = "1215638",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = id,
                      )
                      emit("FIELD_TV_RESULT provider=$id duration_ms=${System.currentTimeMillis()-started} count=${rows.size}")
                      rows.forEachIndexed { index, row ->
                          emit("FIELD_TV_ROW provider=$id index=$index title=${row.title} name=${row.name} quality=${row.quality} size=${row.size} language=${row.language} providerField=${row.provider} type=${row.type} url=${row.url} headers=${row.headers}")
                          assertFalse("HTML YouTube embed must never reach TV player", row.url.contains("youtube.com/embed", ignoreCase = true))
                      }

                      if (id == "netmirror" && rows.isNotEmpty()) {
                          rows.filter { it.url.contains(".m3u8", ignoreCase = true) }.forEach { row ->
                              val seconds = hlsDurationSeconds(row.url, row.headers)
                              if (seconds != null) {
                                  emit("FIELD_TV_NETMIRROR_DURATION seconds=$seconds")
                                  assertTrue("NetMirror duration is implausibly short for Mon Ninja 3", seconds >= 45 * 60)
                                  assertTrue("NetMirror duration is implausibly long for Mon Ninja 3", seconds <= 130 * 60)
                              }
                          }
                      }

                      if (id == "streamzo") {
                          assertTrue("StreamZo must resolve Mon Ninja 3 in official TV runtime", rows.isNotEmpty())
                          val hls = rows.firstOrNull { it.url.contains(".m3u8", ignoreCase = true) }
                          assertTrue("StreamZo must expose HLS on TV", hls != null)
                          hls!!
                          val (contentType, body) = requestText(hls.url, hls.headers)
                          emit("FIELD_TV_STREAMZO_TRANSPORT contentType=$contentType extm3u=${body.contains("#EXTM3U")}")
                          assertTrue("StreamZo TV HLS must be an HLS manifest", body.contains("#EXTM3U"))
                          assertFalse("StreamZo TV transport must not be HTML", contentType.contains("text/html", ignoreCase = true))
                      }
                  }
              }

              @Test
              fun missingAndUnknownMetadataAreAcceptedByOfficialTvRuntime() = runBlocking {
                  val missing = runtime.executePlugin(
                      code = "module.exports.getStreams=async()=>[{title:'Metadata missing',url:'https://example.test/video.mp4'}];",
                      tmdbId = "1215638",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "metadata-missing",
                  )
                  assertEquals(1, missing.size)
                  assertNull(missing.single().quality)
                  assertNull(missing.single().language)
                  assertNull(missing.single().size)
                  emit("FIELD_TV_METADATA_MISSING_ACCEPTED=true")

                  val unknown = runtime.executePlugin(
                      code = "module.exports.getStreams=async()=>[{title:'Metadata unknown',name:'Metadata provider',url:'https://example.test/video.mp4',quality:'Unknown',description:'Unknown'}];",
                      tmdbId = "1215638",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "metadata-unknown",
                  )
                  assertEquals(1, unknown.size)
                  assertEquals("Unknown", unknown.single().quality)
                  emit("FIELD_TV_METADATA_LITERAL_UNKNOWN_ACCEPTED=true")
              }
          }
          KOTLIN

      - name: Start real Android TV emulator
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME || true
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$(dirname "$SDKMANAGER"):$PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          TV_IMAGE="system-images;android-34;android-tv;x86"
          "$SDKMANAGER" "platform-tools" "emulator" "$TV_IMAGE"
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name niakvio-tv-ci \
            --package "$TV_IMAGE" \
            --device "tv_1080p" \
            --path "$ANDROID_AVD_HOME/niakvio-tv-ci.avd"

          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx niakvio-tv-ci
          sudo chmod 666 /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          adb kill-server || true
          adb start-server

          rm -f /tmp/niakvio-tv-emulator.log
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd niakvio-tv-ci \
            -port 5556 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel on \
            -cores 2 \
            -memory 2048 \
            >/tmp/niakvio-tv-emulator.log 2>&1 &
          EMU_PID=$!

          SERIAL=""
          for attempt in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "TV emulator exited before adb registration" >&2
              cat /tmp/niakvio-tv-emulator.log >&2 || true
              exit 1
            fi
            SERIAL=$(adb devices | awk '$1 ~ /^emulator-/ && ($2 == "device" || $2 == "offline") {print $1; exit}')
            if [ -n "$SERIAL" ]; then break; fi
            sleep 2
          done
          if [ -z "$SERIAL" ]; then
            echo "TV emulator did not register with adb" >&2
            cat /tmp/niakvio-tv-emulator.log >&2 || true
            exit 1
          fi

          for attempt in $(seq 1 90); do
            STATE=$(adb -s "$SERIAL" get-state 2>/dev/null || true)
            BOOT=$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "tv boot attempt=$attempt state=$STATE completed=$BOOT"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          STATE=$(adb -s "$SERIAL" get-state 2>/dev/null || true)
          BOOT=$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
          if [ "$STATE" != "device" ] || [ "$BOOT" != "1" ]; then
            echo "TV emulator failed to boot" >&2
            cat /tmp/niakvio-tv-emulator.log >&2 || true
            exit 1
          fi

          CHARACTERISTICS=$(adb -s "$SERIAL" shell getprop ro.build.characteristics | tr -d '\r')
          DEVICE_NAME=$(adb -s "$SERIAL" shell getprop ro.product.device | tr -d '\r')
          echo "TV characteristics=$CHARACTERISTICS device=$DEVICE_NAME serial=$SERIAL"
          case "$CHARACTERISTICS" in
            *tv*) ;;
            *) echo "Emulator is not reporting TV characteristics" >&2; exit 1;;
          esac
          echo "ANDROID_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          adb -s "$SERIAL" logcat -c

      - name: Execute official NuvioTV Full runtime test
        working-directory: nuvio-tv
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./gradlew :app:connectedFullDebugAndroidTest --no-daemon --console=plain
          STATUS=$?
          set -e
          echo "===== EXACT NUVIO TV PROVIDER RESULTS ====="
          "${ANDROID_HOME}/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -d -s NiakvioTvRealLab:I '*:S' || true
          if [ "$STATUS" -ne 0 ]; then
            echo "===== TV EMULATOR LOG TAIL ====="
            tail -n 200 /tmp/niakvio-tv-emulator.log || true
          fi
          exit "$STATUS"
