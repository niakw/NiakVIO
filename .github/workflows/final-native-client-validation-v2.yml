name: Final native Nuvio client validation v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-native-client-validation-v2.yml"
      - "scripts/export_nuvio_client_refs.py"
      - "scripts/isolate_native_android_tests.py"
      - "scripts/native_mobile_playback_proof.sh"
      - "scripts/native_tv_playback_proof.sh"
      - "scripts/prepare_native_client_validation.py"
      - "scripts/harden_nuvio_mobile_device_test.py"
      - "scripts/provider_patches/**"
      - "tests/**native**"
      - "providers/**"
      - "manifest.json"
      - "vf/manifest.json"
      - "PROVENANCE.json"
      - "sources.json"
  push:
    branches: [main]
    paths:
      - ".github/triggers/final-native-client-validation-v2"
      - ".github/workflows/final-native-client-validation-v2.yml"
      - "scripts/export_nuvio_client_refs.py"
      - "scripts/isolate_native_android_tests.py"
      - "scripts/native_mobile_playback_proof.sh"
      - "scripts/native_tv_playback_proof.sh"
      - "scripts/prepare_native_client_validation.py"
      - "scripts/harden_nuvio_mobile_device_test.py"
      - "scripts/provider_patches/**"
      - "providers/**"
      - "manifest.json"
      - "vf/manifest.json"
      - "PROVENANCE.json"
      - "sources.json"

permissions:
  contents: read

concurrency:
  group: final-native-client-validation-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout NiakVIO
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: niakvio
          persist-credentials: false

      - name: Resolve accepted Nuvio client revisions
        run: python3 niakvio/scripts/export_nuvio_client_refs.py --sources niakvio/sources.json >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install official Linux player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout accepted NuvioDesktop and inject current generation
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          touch nuvio-desktop/local.properties
          printf 'Accepted NuvioDesktop: %s\n' "$NUVIO_DESKTOP_SHA"
          python3 niakvio/scripts/prepare_native_client_validation.py desktop --workspace "$GITHUB_WORKSPACE"

      - name: Require real Desktop StreamZo HLS
        working-directory: nuvio-desktop
        shell: bash
        run: |
          proof_ok() {
            grep -Eq 'FIELD_DESKTOP_NATIVE provider=streamzo .* count=[1-9][0-9]*' "$GITHUB_WORKSPACE/desktop-native-results.log" &&
            grep -Eq 'FIELD_DESKTOP_NATIVE_ROW provider=streamzo .* type=hls([[:space:]]|$)' "$GITHUB_WORKSPACE/desktop-native-results.log" &&
            grep -Fq 'FIELD_DESKTOP_STREAMZO_SENTINEL status=resolved expected=resolved' "$GITHUB_WORKSPACE/desktop-native-results.log"
          }

          STATUS=1
          for ATTEMPT in 1 2; do
            rm -f "$GITHUB_WORKSPACE/desktop-native-results.log"
            echo "FIELD_DESKTOP_PROOF_ATTEMPT attempt=$ATTEMPT max=2"
            set +e
            if [[ "$ATTEMPT" -eq 1 ]]; then
              ./gradlew :composeApp:desktopTest --tests 'com.nuvio.app.features.plugins.NiakvioFinalNativeDesktopTest' --no-daemon --console=plain
            else
              ./gradlew :composeApp:desktopTest --tests 'com.nuvio.app.features.plugins.NiakvioFinalNativeDesktopTest' --rerun-tasks --no-daemon --console=plain
            fi
            STATUS=$?
            set -e
            cat "$GITHUB_WORKSPACE/desktop-native-results.log" 2>/dev/null || true
            if [[ "$STATUS" -eq 0 ]] && proof_ok; then
              STATUS=0
              break
            fi
            STATUS=1
            [[ "$ATTEMPT" -ge 2 ]] || sleep 3
          done
          exit "$STATUS"

      - name: Upload Desktop proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: final-native-desktop-${{ github.run_id }}
          path: |
            desktop-native-results.log
            nuvio-desktop/composeApp/build/reports/tests/**
            nuvio-desktop/composeApp/build/test-results/**
          retention-days: 7
          if-no-files-found: warn

  mobile-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout NiakVIO
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: niakvio
          persist-credentials: false

      - name: Resolve accepted Nuvio client revisions
        run: python3 niakvio/scripts/export_nuvio_client_refs.py --sources niakvio/sources.json >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout accepted Mobile/TV runtimes and inject current generation
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          printf 'Accepted NuvioMobile: %s\nAccepted NuvioTV: %s\n' "$NUVIO_MOBILE_SHA" "$NUVIO_TV_SHA"
          python3 niakvio/scripts/prepare_native_client_validation.py android --workspace "$GITHUB_WORKSPACE"
          python3 niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"
          python3 niakvio/scripts/isolate_native_android_tests.py mobile "$GITHUB_WORKSPACE/nuvio-mobile"

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Execute official Mobile PluginRuntime on phone AVD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/native_mobile_playback_proof.sh"

      - name: Upload Mobile proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: final-native-mobile-${{ github.run_id }}
          path: |
            mobile-final-native-results.log
            nuvio-mobile/composeApp/build/reports/androidTests/**
            nuvio-mobile/composeApp/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  tv-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout NiakVIO
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: niakvio
          persist-credentials: false

      - name: Resolve accepted Nuvio client revisions
        run: python3 niakvio/scripts/export_nuvio_client_refs.py --sources niakvio/sources.json >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout accepted Mobile/TV runtimes and inject current generation
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          printf 'Accepted NuvioMobile: %s\nAccepted NuvioTV: %s\n' "$NUVIO_MOBILE_SHA" "$NUVIO_TV_SHA"
          python3 niakvio/scripts/prepare_native_client_validation.py android --workspace "$GITHUB_WORKSPACE"
          python3 niakvio/scripts/isolate_native_android_tests.py tv "$GITHUB_WORKSPACE/nuvio-tv"

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Execute official NuvioTV PluginRuntime on Android TV AVD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/native_tv_playback_proof.sh"

      - name: Upload TV proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: final-native-tv-${{ github.run_id }}
          path: |
            tv-final-native-results.log
            nuvio-tv/app/build/reports/androidTests/**
            nuvio-tv/app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
