name: TEMP - Memory Route Repair Checkpoint

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/memory-route-repair-checkpoint.json'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench/route-recognition-v6
          fetch-depth: 0
      - name: Append authoritative checkpoint once
        run: |
          set -euo pipefail
          python scripts/append_route_repair_memory_checkpoint.py
          if git diff --quiet -- MEMORY.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MEMORY.md
          git commit -m 'docs: checkpoint route recognition v6 repair state'
          git pull --rebase origin workbench/route-recognition-v6
          git push origin HEAD:workbench/route-recognition-v6
