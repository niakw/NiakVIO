name: BRAIN - Provider Reverse Engineering Oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-provider-oracle.yml'
      - 'tests/brain_oracles/**'
      - 'scripts/provider_patches/anime_catalogue_runtime_common.py'
      - 'scripts/compile_brain_accepted_program_v3.py'
      - 'scripts/brain_positive_program_memory.py'
      - 'scripts/brain_repair_runtime.py'
      - 'engine_v2/scripts/plan-repairs.mjs'
      - 'tests/brain_html_class_source_to_strategy_replay_test.py'
      - 'tests/brain_positive_program_episode_replay_test.py'
      - 'scripts/select_provider_materialization_scope.py'
      - 'tests/brain_family_renderer_drift_scope_test.py'

permissions:
  contents: read

concurrency:
  group: brain-provider-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate reference and test syntax
        run: |
          node --check tests/brain_oracles/animevost_fr/provider_repaired_oracle.cjs
          node --check tests/brain_oracles/animevost_fr/run_oracle.cjs
          node --check tests/brain_oracles/animevost_fr/probe_live_api.mjs
          python -m py_compile tests/brain_oracles/animevost_fr/test_reverse_chain.py
          python -m py_compile tests/brain_oracles/animevost_fr/test_compiler_episode_bindings.py
      - name: Compare actual historical failure against current family Lego and preserved repaired-provider oracle
        run: python tests/brain_oracles/animevost_fr/test_reverse_chain.py
      - name: Verify accepted episodic programme survives durable positive-memory replay
        run: python tests/brain_positive_program_episode_replay_test.py
      - name: Verify shared Lego source drift invalidates only registered importing providers
        run: python tests/brain_family_renderer_drift_scope_test.py
      - name: Prove real parser source signature reaches Brain strategy selection and respects negative memory
        run: |
          python tests/brain_html_class_source_to_strategy_replay_test.py
          python tests/adaptive_html_class_token_profile_test.py
      - name: Replay Brain acceptance compiler with episode-aware plan and safety negatives
        run: |
          python tests/brain_oracles/animevost_fr/test_compiler_episode_bindings.py
          python tests/brain_accepted_program_v3_compiler_test.py

  provider-live-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inspect live provider search/detail JSON schema (never media payload)
        run: node tests/brain_oracles/animevost_fr/probe_live_api.mjs
