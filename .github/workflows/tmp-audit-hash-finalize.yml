name: AUDIT - finalize release inventories

on:
  push:
    branches: [audit/repository-final-cleanup-2026-08-25]
    paths:
      - '.github/workflows/tmp-audit-hash-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/repository-final-cleanup-2026-08-25
          fetch-depth: 0
      - name: Final repository audit and release integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_repository_tree.py --output "$RUNNER_TEMP/repository-tree-audit.json" --fail-hard
          python3 tests/repository_hygiene_contract_test.py
          python3 tests/global_stream_presentation_test.py
          python3 tests/badge_asset_contract_test.py
          python3 scripts/prune_unreferenced_providers.py --dry-run | tee "$RUNNER_TEMP/prune.txt"
          if ! grep -q 'would remove=0' "$RUNNER_TEMP/prune.txt"; then
            echo 'stale generated provider bundles remain' >&2
            exit 1
          fi
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git diff --check
      - name: Commit final inventories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'FIELD_AUDIT_INVENTORIES changed=0'
            exit 0
          fi
          git commit -m 'audit: finalize release inventories [skip ci]'
          git push origin HEAD:audit/repository-final-cleanup-2026-08-25
