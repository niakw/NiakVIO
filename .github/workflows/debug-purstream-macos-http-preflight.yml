name: Debug Purstream macOS HTTP preflight

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-purstream-macos-http-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Probe Purstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          key="$(python3 - <<'PY'
          import json,re
          data=json.load(open("manifest.json",encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=open(row["filename"],encoding="utf-8").read()
          m=re.search(r'TMDB_KEY=["\x27]([a-f0-9]{32})["\x27]',text)
          if not m: raise SystemExit("TMDB key literal not found")
          print(m.group(1))
          PY
          )"
          probe() {
            label="$1"
            url="$2"
            referer="${3:-}"
            body="$RUNNER_TEMP/$label.body"
            headers=(-H "User-Agent: $ua")
            if [[ -n "$referer" ]]; then headers+=(-H "Referer: $referer"); fi
            code="$(curl -L --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "${headers[@]}" "$url" || true)"
            size="$(wc -c < "$body" 2>/dev/null | tr -d ' ' || echo 0)"
            prefix="$(head -c 320 "$body" 2>/dev/null | tr '\r\n\t' '   ' || true)"
            echo "FIELD_PURSTREAM_HTTP_PREFLIGHT label=$label status=$code bytes=$size body64=$(printf '%s' "$prefix" | base64 | tr -d '\n')"
          }
          probe tmdb_en "https://api.themoviedb.org/3/movie/157336?api_key=$key&language=en-US"
          probe tmdb_fr "https://api.themoviedb.org/3/movie/157336?language=fr-FR&api_key=$key"
          probe purstream_root "https://api.purstream.id/api/v1" "https://purstream.id/"
          probe purstream_search "https://api.purstream.id/api/v1/search-bar/search/Interstellar" "https://purstream.id/"
          probe purstream_search_mx "https://api.purstream.mx/api/v1/search-bar/search/Interstellar" "https://purstream.mx/"
          probe purstream_sheet_mx "https://api.purstream.mx/api/v1/media/2466/sheet" "https://purstream.mx/"

          python3 - <<'PY'
          import json
          from pathlib import Path

          def summarize(label):
              path=Path("$RUNNER_TEMP")/(label+".body")
              raw=path.read_text(encoding="utf-8",errors="replace")
              try:
                  obj=json.loads(raw)
              except Exception as exc:
                  print(f"FIELD_PURSTREAM_JSON_SHAPE label={label} valid=false error={type(exc).__name__}")
                  return
              def shape(value, depth=0):
                  if depth>=4:
                      if isinstance(value,list): return {"type":"list","count":len(value)}
                      if isinstance(value,dict): return {"type":"object","keys":sorted(value)[:30]}
                      return type(value).__name__
                  if isinstance(value,dict):
                      return {k:shape(v,depth+1) for k,v in list(value.items())[:40]}
                  if isinstance(value,list):
                      return {"type":"list","count":len(value),"sample":[shape(v,depth+1) for v in value[:3]]}
                  return type(value).__name__
              print("FIELD_PURSTREAM_JSON_SHAPE label="+label+" valid=true shape="+json.dumps(shape(obj),separators=(",",":"),sort_keys=True))
              if isinstance(obj,dict):
                  data=obj.get("data")
                  if isinstance(data,dict):
                      print("FIELD_PURSTREAM_DATA_KEYS label="+label+" keys="+",".join(sorted(data.keys())))
                      items=data.get("items")
                      if isinstance(items,dict):
                          print("FIELD_PURSTREAM_DATA_ITEMS_KEYS label="+label+" keys="+",".join(sorted(items.keys())))
                          for key,val in items.items():
                              if isinstance(val,list):
                                  print(f"FIELD_PURSTREAM_LIST label={label} path=data.items.{key} count={len(val)}")
                              elif isinstance(val,dict):
                                  print("FIELD_PURSTREAM_OBJECT_KEYS label="+label+" path=data.items."+key+" keys="+",".join(sorted(val.keys())))
          summarize("purstream_search_mx")
          summarize("purstream_sheet_mx")
          PY
