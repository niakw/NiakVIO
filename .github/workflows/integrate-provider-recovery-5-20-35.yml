name: Integrate validated provider recovery 5.20.35

on:
  push:
    branches:
      - agent/provider-recovery-integration-5.20.35
    paths:
      - ".github/triggers/integrate-provider-recovery-5-20-35"

permissions:
  contents: write

concurrency:
  group: provider-recovery-integration-5-20-35
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/provider-recovery-integration-5.20.35
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Record immutable main base and fetch validated recovery source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/provider-recovery-and-refresh-v3
          git rev-parse origin/main > /tmp/integration-main-base.sha
          echo "main base: $(cat /tmp/integration-main-base.sha)"
          echo "recovery source: $(git rev-parse origin/agent/provider-recovery-and-refresh-v3)"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Import only validated permanent recovery code and tests
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY=origin/agent/provider-recovery-and-refresh-v3
          git checkout "$RECOVERY" -- \
            .github/workflows/sync.yml \
            scripts/apply_provider_overrides.py \
            scripts/audit_catalogue_identity_media.py \
            scripts/provider_patches/coflix_exact_catalogue.py \
            scripts/provider_patches/frenchstream_raw_tv_fallback.py \
            scripts/provider_patches/nuvio_tv_direct_media_v2.py \
            scripts/provider_patches/nuvio_tv_target_media_v4.py \
            scripts/provider_patches/stream_output_sanitizer_v6.py \
            tests/catalogue_audit_coverage_test.py \
            tests/override_net_noop_regression_test.py \
            tests/override_transaction_order_test.py \
            tests/stream_output_sanitizer_fail_closed_test.py \
            tests/streamzo_target_media_profile_test.py \
            tests/sync_catalogue_audit_gate_test.py \
            tests/vf_movie_policy_test.py \
            tests/vf_movie_recovery.test.cjs \
            tests/vf_recovery_profiles_test.py \
            tests/vidzy_hostname_decoder_test.py

          git show "$RECOVERY":scripts/upgrade_vf_recovery_profiles.py > scripts/.integration-upgrade-vf-recovery.py
          git show "$RECOVERY":scripts/live_recovered_provider_probe.py > scripts/.integration-live-recovered-provider-probe.py
          git show "$RECOVERY":package.json > /tmp/recovery-package.json

      - name: Apply recovery profiles onto current 5.20.34 state
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json /tmp/manifest-before-recovery.json
          python scripts/.integration-upgrade-vf-recovery.py
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("package.json")
          current = json.loads(current_path.read_text(encoding="utf-8"))
          recovery = json.loads(Path("/tmp/recovery-package.json").read_text(encoding="utf-8"))
          current.setdefault("scripts", {})["test"] = recovery["scripts"]["test"]
          current_path.write_text(json.dumps(current, indent=2) + "\n", encoding="utf-8")
          print(f"preserved package base version {current.get('version')} while importing validated test contract")
          PY
          python scripts/reapply_published_overrides.py
          python scripts/validate_published_overrides.py
          python scripts/reapply_published_overrides.py --check
          python scripts/bump_release_patch_if_manifest_changed.py \
            --previous /tmp/manifest-before-recovery.json \
            --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Require release 5.20.35 and stable materialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py --check
          python - <<'PY'
          import json
          from pathlib import Path

          values = {}
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          vf = json.loads(Path("vf/manifest.json").read_text(encoding="utf-8"))
          values["package"] = package.get("version")
          values["lock"] = lock.get("version")
          values["lock_root"] = (lock.get("packages") or {}).get("", {}).get("version")
          values["manifest"] = manifest.get("version")
          values["vf"] = vf.get("version")
          if set(values.values()) != {"5.20.35"}:
              raise SystemExit(f"expected synchronized release 5.20.35, got {values}")
          print("release synchronization confirmed: 5.20.35")
          PY

      - name: Run complete regression suite on current-main integration
        run: npm test

      - name: Validate focused recovered providers live
        shell: bash
        run: |
          set -o pipefail
          python scripts/.integration-live-recovered-provider-probe.py | tee /tmp/live-recovered-provider-probe.json

      - name: Audit all movie TV and anime providers
        env:
          NUVIO_CATALOGUE_AUDIT_OUTPUT: /tmp/catalogue-media-audit.json
          NUVIO_CATALOGUE_AUDIT_WORKERS: "8"
          NUVIO_CATALOGUE_AUDIT_TIMEOUT: "60"
        run: python scripts/audit_catalogue_identity_media.py

      - name: Assert no playable wrong identity or broken HLS graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/catalogue-media-audit.json").read_text(encoding="utf-8"))
          summary = report.get("summary") or {}
          bad_identity = summary.get("playable_identity_false_positive_providers") or []
          bad_hls = summary.get("hls_graph_failure_providers") or []
          if bad_identity or bad_hls:
              raise SystemExit(f"global audit failed: wrong_identity={bad_identity} hls_graph={bad_hls}")
          if int(report.get("providers_total") or 0) != 91:
              raise SystemExit(f"unexpected provider coverage: {report.get('providers_total')}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Remove one-shot helpers and integration harness before hashing
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.integration-upgrade-vf-recovery.py scripts/.integration-live-recovered-provider-probe.py
          git rm .github/workflows/integrate-provider-recovery-5-20-35.yml
          git rm .github/triggers/integrate-provider-recovery-5-20-35
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit exact validated 5.20.35 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 1
          fi
          git commit -m "fix: publish provider recovery 5.20.35"
          git push origin HEAD:agent/provider-recovery-integration-5.20.35

      - name: Verify committed tree before main publication
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python scripts/validate_published_overrides.py
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          git diff --exit-code

      - name: Publish only if main did not move
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="$(cat /tmp/integration-main-base.sha)"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "expected main: $EXPECTED_MAIN"
          echo "current main:  $CURRENT_MAIN"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN"
          git push origin HEAD:main

      - name: Verify exact published main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python scripts/validate_published_overrides.py
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          git diff --exit-code
          echo "published main: $(git rev-parse HEAD)"
