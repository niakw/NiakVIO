name: MAIN - TV Repair Memory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-tv-repair-memory.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - run: |
          set -euo pipefail
          python scripts/tmp_memory_tv_repair_run3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/main-tv-repair-memory.yml scripts/tmp_memory_tv_repair_run3.py
          git add MEMORY.md
          git commit -m 'docs: checkpoint TV repair run 3'
          git push origin HEAD:main
