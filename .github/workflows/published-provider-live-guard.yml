name: Published Provider Live Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/published-provider-live-guard.yml'
      - 'scripts/audit_published_provider_guard.py'
      - 'tests/published_provider_guard_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vf-regression:
    name: VF regression - Kehflix StreamZo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security preflight and sanitizer contract
        run: |
          python tests/workflow_security_policy_test.py
          python tests/published_provider_guard_test.py
          python -m py_compile scripts/audit_published_provider_guard.py
      - name: Execute exact published VF provider bytes
        id: guard
        continue-on-error: true
        run: |
          python scripts/audit_published_provider_guard.py \
            --provider kehflix \
            --provider streamzo \
            --output automation/published-vf-provider-live-guard.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-vf-provider-live-guard-${{ github.run_id }}
          path: automation/published-vf-provider-live-guard.json
          retention-days: 14
          if-no-files-found: error
      - name: Enforce VF regression result
        if: always()
        run: test '${{ steps.guard.outcome }}' = 'success'

  priority-published:
    name: Priority providers published live audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute exact published priority provider bytes
        id: guard
        continue-on-error: true
        run: |
          python scripts/audit_published_provider_guard.py \
            --provider anime-sama \
            --provider animesama-co \
            --provider purstream \
            --provider flemmix \
            --provider uhdmovies \
            --provider movieshunt \
            --provider hindmoviez \
            --provider 4khdhub \
            --provider persianstremio \
            --provider desiflix \
            --provider moviesmod \
            --provider showbox \
            --provider vidrock \
            --output automation/published-priority-provider-live-guard.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-priority-provider-live-guard-${{ github.run_id }}
          path: automation/published-priority-provider-live-guard.json
          retention-days: 14
          if-no-files-found: error
      - name: Report priority guard result
        if: always()
        run: |
          echo "priority_guard_outcome=${{ steps.guard.outcome }}"
