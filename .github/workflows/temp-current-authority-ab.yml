name: TEMP - current authority A/B

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-current-authority-ab.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baseline exact cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          catalog=p.local_catalog()
          cases=[
            ('animevostfr',{'slug':'superman-2025','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025}),
            ('animevostfr',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
            ('voiranime',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
          ]
          for pid,f in cases:
            r=p.run_worker(catalog[pid]['path'],f,35)
            print('AUTHORITY_AB_BASELINE '+json.dumps({'provider':pid,'fixture':f['slug'],'streams':r.get('stream_count'),'raw':r.get('raw_stream_count'),'error':r.get('error_class'),'hosts':r.get('provider_server_hosts'),'statuses':r.get('provider_server_http_statuses') or r.get('http_statuses')},ensure_ascii=False))
          PY
      - name: Apply proof-only authority experiment and materialize both providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('provider-overrides.json')
          d=json.loads(path.read_text())
          patches=d['provider_patches']
          def uniq(xs):
            out=[]
            for x in xs:
              if isinstance(x,str) and x.strip() and x.strip() not in out: out.append(x.strip())
            return out
          a=patches['animevostfr']
          a['official_site']='https://v2.animevostfr.org'
          routes=list(a.get('learned_routes') or [])
          routes += [
            'https://v2.animevostfr.org/?s={query}',
            'https://v2.animevostfr.org/animes/{slug}/',
            'https://v2.animevostfr.org/episode/{slug}-{season}-episode-{episode}/',
            'https://v2.animevostfr.org/?trembed={id}&trid={id}&trtype=2',
          ]
          a['learned_routes']=uniq(routes)
          a['candidate_learned_routes']=uniq(list(a.get('candidate_learned_routes') or [])+a['learned_routes'])
          a['proof_search_bases']=['https://v2.animevostfr.org']

          v=patches['voiranime']
          v['official_site']='https://voir-anime.to'
          v['proof_search_bases']=['https://voir-anime.to']
          v['learned_routes']=['https://voir-anime.to/anime/{slug}/']
          v['candidate_learned_routes']=uniq(list(v.get('candidate_learned_routes') or [])+v['learned_routes'])
          for key in ('search_request_plan','provider_value_plan','api_recipe'):
            v.pop(key,None)
          v['provider_lego_scripts']=[x for x in (v.get('provider_lego_scripts') or []) if 'voiranime_homes_runtime_v1.py' not in str(x)]
          for key in ('domain_substitutions','runtime_domain_replacements'):
            m=v.get(key)
            if isinstance(m,dict):
              for old in list(m):
                if 'voiranime' in str(old).lower() or 'voir-anime' in str(old).lower():
                  m[old]='voir-anime.to'
          caps=d.get('provider_capabilities') or {}
          if isinstance(caps.get('voiranime'),dict):
            origins=list(caps['voiranime'].get('observed_origins') or [])
            caps['voiranime']['observed_origins']=uniq(origins+['https://voir-anime.to'])
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('AUTHORITY_AB_PATCH applied=animevostfr,voiranime proof_only=true')
          PY
          python3 scripts/materialize_provider_v3_one.py animevostfr
          python3 scripts/materialize_provider_v3_one.py voiranime
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py
      - name: Re-run exact cases after A/B mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          catalog=p.local_catalog()
          cases=[
            ('animevostfr',{'slug':'superman-2025','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025}),
            ('animevostfr',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
            ('voiranime',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
          ]
          positive=0
          for pid,f in cases:
            r=p.run_worker(catalog[pid]['path'],f,35)
            n=int(r.get('stream_count') or 0)
            positive += int(n>0)
            print('AUTHORITY_AB_CANDIDATE '+json.dumps({'provider':pid,'fixture':f['slug'],'streams':n,'raw':r.get('raw_stream_count'),'error':r.get('error_class'),'hosts':r.get('provider_server_hosts'),'statuses':r.get('provider_server_http_statuses') or r.get('http_statuses'),'network':(r.get('network_observations') or [])[:15]},ensure_ascii=False))
          print(f'AUTHORITY_AB_RESULT positive={positive}/3')
          PY
      - name: Never persist experiment
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd
