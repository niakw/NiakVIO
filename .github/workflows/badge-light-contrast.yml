name: NiakVIO badge system materializer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/badge-light-contrast.yml'
      - 'scripts/regenerate_badges.py'
      - 'scripts/normalize_badge_feeds.py'
      - 'scripts/validate_badge_system.py'
      - 'assets/badge_catalog_v2_complete.json'
      - 'assets/source/**'
      - 'assets/transparent/**'
      - 'assets/dark/**'
      - 'assets/light/**'
      - 'assets/stream-badges-dark.json'
      - 'assets/stream-badges-light.json'
      - 'assets/stream-badges-fusion.json'
      - 'assets/docs/BADGE_QA.json'
      - 'assets/docs/LIGHT_BADGE_QA.json'

permissions:
  contents: write

concurrency:
  group: niakvio-badge-system-main
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Materialize complete badge artwork and native feeds
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_badges.py --apply
          python scripts/normalize_badge_feeds.py --apply
          python scripts/validate_badge_system.py

      - name: Prove deterministic fixed point
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_badges.py --check
          python scripts/normalize_badge_feeds.py --check
          python scripts/validate_badge_system.py

      - name: Publish redesigned badge tree when materialization changed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/badge_catalog_v2_complete.json \
                  assets/source assets/transparent assets/dark assets/light \
                  assets/stream-badges-dark.json assets/stream-badges-light.json assets/stream-badges-fusion.json \
                  assets/docs/BADGE_QA.json assets/docs/LIGHT_BADGE_QA.json
          if git diff --cached --quiet; then
            echo 'Badge system already materialized.'
            exit 0
          fi
          git commit -m 'chore: materialize redesigned stream badges'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify no untracked QA drift
        shell: bash
        run: git status --short
