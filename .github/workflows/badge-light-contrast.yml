name: NiakVIO light badge contrast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/badge-light-contrast.yml'
      - 'scripts/regenerate_light_badges.py'
      - 'scripts/normalize_fusion_badge_feed.py'
      - 'scripts/provider_patches/global_stream_presentation_v1.py'
      - 'tests/badge_asset_contract_test.py'
      - 'assets/README.txt'
      - 'assets/badge_catalog_v2_complete.json'
      - 'assets/mapping_core_brain_ui_v2_complete.json'
      - 'assets/stream-badges-dark.json'
      - 'assets/stream-badges-light.json'
      - 'assets/stream-badges-fusion.json'
      - 'assets/transparent/**'
      - 'assets/dark/**'
      - 'assets/light/**'
      - 'assets/docs/LIGHT_BADGE_QA.json'

permissions:
  contents: read

concurrency:
  group: niakvio-light-badge-contrast-main
  cancel-in-progress: true

jobs:
  verify-committed-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned image QA dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Verify committed badge variants and feeds without regeneration
        shell: bash
        run: |
          set -euo pipefail
          python tests/badge_asset_contract_test.py
          python scripts/regenerate_light_badges.py --check
          python scripts/normalize_fusion_badge_feed.py --check

      - name: Verify exact asset cardinality and native dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('.')
          catalog = json.loads((root/'assets/badge_catalog_v2_complete.json').read_text())
          checked = 0
          for row in catalog.get('badges') or []:
              for size in ('72x32','96x40'):
                  rel = row['assets']['light'][size]
                  path = root/rel
                  with Image.open(path) as im:
                      assert im.size == tuple(map(int,size.split('x'))), (rel, im.size)
                      assert im.format == 'WEBP', (rel, im.format)
                  checked += 1
          assert checked == 146, checked
          report = json.loads((root/'assets/docs/LIGHT_BADGE_QA.json').read_text())
          assert report['assetCount'] == 146
          assert report['whiteBackgroundMinimumSeparationRatio'] >= 4.5
          assert report['idempotent'] is True
          print(f'light badge QA passed: committed_assets={checked} revision={report["revision"]} regeneration=disabled')
          PY

      - name: Prove QA is side-effect free
        shell: bash
        run: git diff --exit-code
