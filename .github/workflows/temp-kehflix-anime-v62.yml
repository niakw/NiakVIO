name: TEMP - Kehflix Anime Gateway V62

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-kehflix-anime-v62.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Inspect current Kehflix authority and Lego
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          m=json.load(open('manifest.json'))
          row=next(x for x in m['scrapers'] if str(x.get('id','')).casefold()=='kehflix')
          o=json.load(open('provider-overrides.json'))
          p=o['provider_patches']['kehflix']
          print('V62_MANIFEST',json.dumps(row,sort_keys=True))
          print('V62_PATCH_KEYS',sorted(p.keys()))
          print('V62_LEGOS',json.dumps(p.get('provider_lego_scripts'),sort_keys=True))
          print('V62_PATCH',json.dumps({k:p.get(k) for k in ['official_site','official_hub','capability','current_stream_proof','repair_disposition','published_types','request_type_aliases']},sort_keys=True))
          f=Path(row['filename'])
          text=f.read_text(encoding='utf-8')
          print('V62_FILE',f)
          for needle in ['/api/streams/episode','/api/stream-gw','zen.blink','alpa.frederic','KEHFLIX']:
              print('V62_NEEDLE',needle,text.find(needle))
          for match in re.finditer(r'.{0,350}/api/streams/episode.{0,900}', text, re.S):
              print('V62_EPISODE_SNIP',match.group(0).replace('\n',' ')[:1400])
          for match in re.finditer(r'.{0,350}/api/stream-gw.{0,900}', text, re.S):
              print('V62_GATEWAY_SNIP',match.group(0).replace('\n',' ')[:1400])
          PY

      - name: Probe exact current anime lane with debug fetches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=55
          tasks,_=q.build_tasks()
          rows=[q.run(t) for t in tasks if str(t.get('provider_id') or '').casefold()=='kehflix' and str(t.get('semantic_type') or '').casefold()=='anime']
          if len(rows)!=1: raise SystemExit(f'expected one kehflix anime task, got {len(rows)}')
          r=rows[0]
          print('V62_ANIME_PROBE',json.dumps({k:r.get(k) for k in ['status','debug_stage','raw','playable','verified','contradictions','duration_ms','debug_model','debug_fetches']},default=str,sort_keys=True))
          PY

      - name: Exercise Kehflix episode API and gateway directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          base='https://kehflix.wiki'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':base+'/title/tv/95479-jujutsu-kaisen'}
          def get(url,timeout=15):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,r.read().decode('utf-8','replace'),dict(r.headers)
              except Exception as e:
                  if hasattr(e,'code'):
                      try:return e.code,e.read().decode('utf-8','replace'),dict(e.headers)
                      except Exception:return e.code,'',{}
                  return 0,repr(e),{}
          qs=urllib.parse.urlencode({'id':'95479','season':'1','episode':'1','k':'anime'})
          status,body,_=get(base+'/api/streams/episode?'+qs)
          print('V62_EP_API',status,body[:5000])
          tokens=[]
          try:
              data=json.loads(body)
              stack=[data]
              while stack:
                  v=stack.pop()
                  if isinstance(v,dict): stack.extend(v.values())
                  elif isinstance(v,list): stack.extend(v)
                  elif isinstance(v,str):
                      s=v.strip()
                      if s.startswith('http'): tokens.append(s)
          except Exception as e:
              print('V62_EP_JSON_ERROR',repr(e))
          seen=[]
          for u in tokens:
              if u in seen: continue
              seen.append(u)
              gw=base+'/api/stream-gw?'+urllib.parse.urlencode({'t':u})
              st,b,h=get(gw)
              print('V62_GW_URL',u[:250],'STATUS',st,'CT',h.get('Content-Type'),'LOC',h.get('Location'),'BODY',b[:500].replace('\n',' '))
          if not seen: print('V62_NO_URLS_IN_EPISODE_RESPONSE')
          PY
