name: Permanent Mobile Android real-client lab v3

on:
  workflow_dispatch:
  push:
    branches: ["lab/desktop-mobile-real"]
    paths:
      - ".github/triggers/permanent-android-real-client-v2"

permissions:
  contents: read

concurrency:
  group: permanent-mobile-android-real-client-v3
  cancel-in-progress: false

env:
  NUVIO_MOBILE_SHA: "0d6e30e4566e6f9f2051d5f80a1e3f1e0fcb1f18"

jobs:
  mobile-android-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout permanent Desktop and Mobile Android lab
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: lab/desktop-mobile-real
          path: niakvio

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Build exact engine-v3 lab candidate from published manifest
        working-directory: niakvio
        shell: bash
        run: |
          set -euxo pipefail
          python3 tests/runtime_media_safety_guard_test.py
          python3 tests/runtime_media_safety_migration_test.py
          python3 scripts/apply_runtime_capability_upgrade_v3.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/runtime_media_safety_guard_test.py
          python3 tests/runtime_media_safety_migration_test.py
          python3 scripts/validate_published_overrides.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id') or '').casefold(): row for row in manifest.get('scrapers', []) if isinstance(row, dict)}
          streamzo = rows['streamzo']
          assert streamzo.get('enabled') is True
          payload = Path(streamzo['filename']).read_text(encoding='utf-8')
          assert payload.count('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1:') == 1
          assert '"implementationRevision":"field-safety-v3-native-aware"' in payload
          assert 'NUVIO_RUNTIME_MEDIA_SAFETY_MIGRATION_V1' in payload
          assert '"implementationRevision":"field-safety-v2"' not in payload
          for provider_id in ('moviebox', 'netmirror'):
              assert rows[provider_id].get('enabled') is False
          print(f"FIELD_MOBILE_ANDROID_CANDIDATE streamzo={streamzo['filename']} version={streamzo.get('version')}")
          PY

      - name: Checkout exact official NuvioMobile runtime
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          cd nuvio-mobile
          git checkout "$NUVIO_MOBILE_SHA"
          touch local.properties

      - name: Prepare exact Mobile Android instrumentation test
        shell: bash
        run: |
          python3 niakvio/lab/real-client/android/prepare_nuvio_mobile.py nuvio-mobile niakvio

      - name: Start real Mobile Android emulator
        shell: bash
        run: |
          bash niakvio/lab/real-client/android/start_emulator.sh

      - name: Execute official NuvioMobile provider runtime
        working-directory: nuvio-mobile
        shell: bash
        run: |
          set -o pipefail
          TASKS=$(./gradlew :composeApp:tasks --all -Pnuvio.android.distribution=full --console=plain)
          TASK=$(printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /connected.*device.*test/ {print $1; exit}')
          if [ -z "$TASK" ]; then
            TASK=$(printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /device.*test/ && tolower($0) ~ /connected/ {print $1; exit}')
          fi
          if [ -z "$TASK" ]; then
            printf '%s\n' "$TASKS" | grep -i 'deviceTest' || true
            echo "Unable to resolve connected Mobile Android device-test task" >&2
            exit 1
          fi
          echo "Resolved Mobile Android device test task: $TASK"
          set +e
          ./gradlew ":composeApp:$TASK" -Pnuvio.android.distribution=full --no-daemon --console=plain
          STATUS=$?
          set -e
          echo "===== EXACT MOBILE ANDROID PROVIDER RESULTS ====="
          "${ANDROID_HOME}/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -d -s NiakvioRealLab:I '*:S' || true
          if [ "$STATUS" -ne 0 ]; then
            echo "===== MOBILE ANDROID EMULATOR LOG TAIL ====="
            tail -n 200 /tmp/niakvio-emulator.log || true
          fi
          exit "$STATUS"
