name: DIAG - Five Regression Rematerialize Dry Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-five-rematerialize-dryrun-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-five-regression-rematerialize-dryrun
  cancel-in-progress: true

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Ephemeral rematerialization
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json /tmp/manifest.before.json
          python3 scripts/reapply_published_overrides.py --primary manifest.json
          python3 - <<'PY'
          import json, pathlib, subprocess
          before=json.loads(pathlib.Path('/tmp/manifest.before.json').read_text())
          after=json.loads(pathlib.Path('manifest.json').read_text())
          wanted={'animekai','french-manga','neko-sama','voiranime','voiranime-homes'}
          bm={str(r.get('id','')).lower():r for r in before.get('scrapers',[]) if isinstance(r,dict)}
          am={str(r.get('id','')).lower():r for r in after.get('scrapers',[]) if isinstance(r,dict)}
          for pid in sorted(wanted):
            print('REMAT_TARGET '+json.dumps({'providerId':pid,'beforeFile':bm.get(pid,{}).get('filename'),'afterFile':am.get(pid,{}).get('filename'),'beforeVersion':bm.get(pid,{}).get('version'),'afterVersion':am.get(pid,{}).get('version'),'changed':bm.get(pid,{}).get('filename')!=am.get(pid,{}).get('filename')},sort_keys=True))
          changed=subprocess.check_output(['git','status','--short'],text=True).splitlines()
          print('REMAT_CHANGED_COUNT',len(changed))
          PY
      - name: Recheck exact five with deep V3
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          wanted={
            'animekai':('anime','62715'),
            'french-manga':('anime','46298'),
            'neko-sama':('anime','95479'),
            'voiranime':('anime','65648'),
            'voiranime-homes':('anime','240411'),
          }
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text(encoding='utf-8'))
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); upstreams,_=v2.upstream_catalog()
          def safe(r):
            return {k:r.get(k) for k in ('stream_count','candidate_stream_count','raw_stream_count','terminal_verified','terminal_reasons','terminal_media_duration_seconds','timeout','error_class')}
          def one(pid):
            lane,tmdb=wanted[pid];fx=fixtures[(lane,tmdb)]
            with tempfile.TemporaryDirectory() as td:
              up=pathlib.Path(td)/(pid+'-up.js');up.write_bytes(p.get_bytes(upstreams[pid]['url']))
              lf=v3.fixture_payload(fx,lane,upstream=False);uf=v3.fixture_payload(fx,lane,upstream=True)
              local_first=bool(hashlib.sha256(f'{pid}:{lane}:{fx["slug"]}'.encode()).digest()[0]&1)
              if local_first:
                lr=v3._run_verified(local[pid]['path'],lf,25);ur=v3._run_verified(up,uf,25)
              else:
                ur=v3._run_verified(up,uf,25);lr=v3._run_verified(local[pid]['path'],lf,25)
            return {'providerId':pid,'fixture':fx['slug'],'classification':v3.classify_pair(ur,lr),'upstream':safe(ur),'niakvio':safe(lr)}
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for row in ex.map(one,wanted): rows.append(row)
          for row in sorted(rows,key=lambda x:x['providerId']): print('REMAT_PARITY '+json.dumps(row,sort_keys=True))
          PY
