name: NiakVIO main-only repository policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-only-policy.yml'
      - 'scripts/enforce_main_only_repository_policy.py'

permissions:
  contents: write

concurrency:
  group: niakvio-main-only-policy
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply main-only workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enforce_main_only_repository_policy.py --apply
          python scripts/enforce_main_only_repository_policy.py --check

      - name: Commit policy normalization directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/brain-learning-lab.yml
          if git diff --cached --quiet; then
            echo 'Main-only policy already materialized.'
            exit 0
          fi
          git commit -m 'ci: keep Brain repair proposals artifact-only'
          git pull --rebase origin main
          python scripts/enforce_main_only_repository_policy.py --check
          git push origin HEAD:main
