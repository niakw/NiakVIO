name: TEMP - Render runtime contract

on:
  push:
    branches: [workbench]
    paths:
      - "automation/platform-runtime-contracts.json"
      - ".github/workflows/workbench-render-runtime-contract.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: workbench
      - name: Render canonical markdown
        run: python3 scripts/render_platform_runtime_contracts.py
      - name: Commit generated contract if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- automation/PLATFORM-RUNTIME-CONTRACTS.md; then
            echo "runtime contract markdown already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/PLATFORM-RUNTIME-CONTRACTS.md
          git commit -m "docs: render current platform runtime contract"
          git push origin HEAD:workbench
