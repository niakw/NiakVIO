name: Network Neutral Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-neutral-baseline.yml'
      - 'scripts/verify_waf_exit_route.py'
      - 'tests/waf_exit_route_attestation_test.py'

permissions:
  contents: read

jobs:
  neutral-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline route and timing contracts
        run: python3 tests/waf_exit_route_attestation_test.py
      - name: Neutral GitHub network reference
        run: |
          set -euo pipefail
          state="$(mktemp)"
          trap 'rm -f "$state"' EXIT
          python3 scripts/verify_waf_exit_route.py baseline --state "$state"
