name: SHORT - Repair dynamic provider history scope
on:
  push:
    branches: [fix/active44-durability-20260915]
    paths: ['.github/workflows/fix-history-scope-final.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Repair history builders and validate scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          R=Path('.')

          p=R/'scripts/build_provider_history_matrix.py'
          t=p.read_text(encoding='utf-8')
          if 'import sys\n' not in t:
              t=t.replace('import subprocess\n','import subprocess\nimport sys\n',1)
          anchor='ROOT = Path(__file__).resolve().parents[1]\n'
          inject='ROOT = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(ROOT / "scripts"))\nfrom current_provider_scope import visible_provider_ids\n'
          t=t.replace(anchor,inject,1)
          old='''    current_map = manifest_map(current)\n    if len(current_map) != EXPECTED:\n        raise SystemExit(f"expected {EXPECTED} current providers, got {len(current_map)}")\n'''
          new='''    current_map = manifest_map(current)\n    current_ids = visible_provider_ids()\n    if set(current_map) != current_ids:\n        raise SystemExit(\n            "current manifest/folder identity mismatch "\n            f"manifest_only={sorted(set(current_map) - current_ids)} "\n            f"folder_only={sorted(current_ids - set(current_map))}"\n        )\n'''
          if old not in t: raise SystemExit('history v1 current-map anchor drifted')
          t=t.replace(old,new,1)
          t=t.replace('''    if len(rows_out) != EXPECTED:\n        raise SystemExit(f"expected {EXPECTED} matrix rows, got {len(rows_out)}")\n''','''    if {str(row.get("provider") or "").strip().casefold() for row in rows_out} != current_ids:\n        raise SystemExit("history matrix rows do not match current provider identities")\n''',1)
          t=t.replace('''    out = {"schemaVersion":1,"providerCount":EXPECTED,''','''    out = {"schemaVersion":1,"providerCount":len(rows_out),''',1)
          t=t.replace('"# Provider history & live classification — 46 current / 50 historical archive"','f"# Provider history & live classification — {len(rows_out)} current / historical archive"')
          t=t.replace('f"- Current manifest: **{current.get(\"version\")}**, providers: **{EXPECTED}**."','f"- Current manifest: **{current.get(\"version\")}**, providers: **{len(rows_out)}**."')
          t=t.replace('"## 46-current-provider matrix"','f"## {len(rows_out)}-current-provider matrix"')
          p.write_text(t,encoding='utf-8')

          p=R/'scripts/build_provider_history_matrix_v2.py'
          t=p.read_text(encoding='utf-8')
          old='''    if int(matrix.get("providerCount") or 0) != EXPECTED:\n        raise SystemExit(f"expected {EXPECTED} providers, got {matrix.get('providerCount')}")\n'''
          new='''    provider_count = len(matrix.get("providers") or [])\n    if int(matrix.get("providerCount") or 0) != provider_count:\n        raise SystemExit(\n            f"history matrix count mismatch declared={matrix.get('providerCount')} rows={provider_count}"\n        )\n'''
          if old not in t: raise SystemExit('history v2 count anchor drifted')
          t=t.replace(old,new,1)
          t=t.replace('"# Provider history & live classification — 46 current / 50 historical archive"','f"# Provider history & live classification — {provider_count} current / historical archive"')
          t=t.replace('f"- Current manifest: **{current_key}**, providers: **{EXPECTED}**."','f"- Current manifest: **{current_key}**, providers: **{provider_count}**."')
          t=t.replace('"## 46-current-provider matrix"','f"## {provider_count}-current-provider matrix"')
          p.write_text(t,encoding='utf-8')

          # The active provider directory name is a permanent external/runtime contract.
          p=R/'scripts/current_provider_scope.py'
          t=p.read_text(encoding='utf-8')
          marker='ACTIVE_DIR = (ROOT / "providers").resolve()\n'
          if marker not in t:
              raise SystemExit('active provider directory must remain literally providers/')
          if 'assert ACTIVE_DIR.name == "providers"' not in t:
              t=t.replace(marker, marker+'assert ACTIVE_DIR.name == "providers"\n',1)
          p.write_text(t,encoding='utf-8')

          for rel in ('scripts/build_provider_history_matrix.py','scripts/build_provider_history_matrix_v2.py'):
              s=(R/rel).read_text(encoding='utf-8')
              if 'EXPECTED' in s:
                  raise SystemExit(f'{rel}: stale EXPECTED remains')
          PY
          python -m py_compile scripts/current_provider_scope.py scripts/build_provider_history_matrix.py scripts/build_provider_history_matrix_v2.py scripts/build_provider_history_matrix_v3.py
          python scripts/build_provider_history_matrix_v3.py
          python scripts/check_provider_non_regression_v1.py
          python tests/provider_non_regression_contract_test.py
          python tests/provider_cardinality_source_of_truth_test.py
          python tests/provider_version_floor_test.py
          python tests/native_five_lab_coverage_test.py
          python tests/provider_521_capability_regression_test.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/current_provider_scope.py scripts/build_provider_history_matrix.py scripts/build_provider_history_matrix_v2.py automation/provider-history-matrix.json automation/PROVIDER-HISTORY-MATRIX.md
          git commit -m 'fix: derive provider history scope from current folders'
          git push origin HEAD:fix/active44-durability-20260915
