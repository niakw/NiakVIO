name: Build corrected sync workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/fix-sync-publish-rebase"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Patch both publication rebases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/sync.yml')
          text = path.read_text(encoding='utf-8')

          old_provider = '\n'.join([
              '            git commit -m "chore: stage validated provider versions"',
              '            git fetch origin main',
              '            git rebase origin/main',
              '            git push origin HEAD:main',
              '',
          ])
          new_provider = '\n'.join([
              '            git commit -m "chore: stage validated provider versions"',
              '            test -f manifest.next.json',
              '            cp manifest.next.json "$RUNNER_TEMP/manifest.next.json"',
              '            git reset --hard HEAD',
              '            git clean -fdx',
              '            git fetch origin main',
              '            git rebase origin/main',
              '            git push origin HEAD:main',
              '            cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json',
              '',
          ])

          old_manifest = '\n'.join([
              '          git commit -m "chore: publish Nuvio provider manifest"',
              '          git fetch origin main',
              '          git rebase origin/main',
              '          git push origin HEAD:main',
              '',
          ])
          new_manifest = '\n'.join([
              '          git commit -m "chore: publish Nuvio provider manifest"',
              '          git reset --hard HEAD',
              '          git clean -fdx',
              '          git fetch origin main',
              '          git rebase origin/main',
              '          git push origin HEAD:main',
              '',
          ])

          if text.count(old_provider) != 1:
              raise SystemExit(f'provider publish block count: {text.count(old_provider)}')
          if text.count(old_manifest) != 1:
              raise SystemExit(f'manifest publish block count: {text.count(old_manifest)}')

          text = text.replace(old_provider, new_provider).replace(old_manifest, new_manifest)
          if text.count('cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json') != 1:
              raise SystemExit('manifest.next preservation was not installed exactly once')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched workflow structure
        run: |
          grep -F 'cp manifest.next.json "$RUNNER_TEMP/manifest.next.json"' .github/workflows/sync.yml
          grep -F 'cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json' .github/workflows/sync.yml
          test "$(grep -c 'git reset --hard HEAD' .github/workflows/sync.yml)" -ge 2
          test "$(grep -c 'git clean -fdx' .github/workflows/sync.yml)" -ge 2

      - name: Upload corrected workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corrected-sync-workflow
          path: .github/workflows/sync.yml
          if-no-files-found: error
          retention-days: 1
