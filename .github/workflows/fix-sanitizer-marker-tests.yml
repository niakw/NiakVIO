name: Fix sanitizer marker tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/fix-sanitizer-marker-tests"

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Update stale test markers
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'NUVIO_STREAM_OUTPUT_SANITIZER_' + 'V3'
          new = 'NUVIO_STREAM_OUTPUT_SANITIZER_V4'
          changed = []
          for path in sorted(Path('tests').rglob('*')):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(path.as_posix())
          remaining = []
          for path in sorted(Path('tests').rglob('*')):
              if path.is_file():
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      remaining.append(path.as_posix())
          if remaining:
              raise SystemExit(f'stale sanitizer markers remain: {remaining}')
          print('updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Run full regression suite
        run: npm test

      - name: Publish validated test migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No stale test marker remained."
            exit 0
          fi
          git commit -m "test: migrate sanitizer marker assertions to v4"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
