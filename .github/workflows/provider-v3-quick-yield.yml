name: Provider v3 - Quick Yield

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-v3-quick-yield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_WORKERS: '16'
      NIAKVIO_QUICK_YIELD_TIMEOUT: '45'
      NIAKVIO_QUICK_YIELD_MAX_SAMPLES: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked provider dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fast real-stream Provider v3 census
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}" || {
            echo 'TMDB credential required for quick-yield census' >&2
            exit 1
          }
          python3 scripts/audit_provider_quick_yield.py | tee provider-v3-quick-yield.log
      - name: Publish quick-yield summary
        if: always()
        shell: bash
        run: |
          if [ -s provider-v3-quick-yield.log ]; then
            grep '^FIELD_PROVIDER_QUICK_YIELD' provider-v3-quick-yield.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Upload quick-yield evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-v3-quick-yield-${{ github.run_id }}
          path: |
            provider-v3-quick-yield.json
            provider-v3-quick-yield.log
          retention-days: 14
          if-no-files-found: warn
