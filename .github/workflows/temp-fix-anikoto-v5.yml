name: TEMP - Fix AniKoto current MegaPlay V5

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-anikoto-v5.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace
  NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '0'

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[anikoto-v5]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Stage current AniKoto chain and MegaPlay V5 resolver
        run: |
          python scripts/upgrade_anikototv_megaplay_runtime_v2.py
          python scripts/upgrade_anikototv_megaplay_aes_v3.py
          python scripts/materialize_provider_v3_one.py anikototv
          python scripts/audit_provider_v3_static.py
      - name: Require exact anime positivity
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          fixtures=[
            {'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1},
            {'tmdbId':'31911','mediaType':'anime','category':'anime','title':'Fullmetal Alchemist: Brotherhood','year':2009,'season':1,'episode':1},
            {'tmdbId':'95479','mediaType':'anime','category':'anime','title':'Jujutsu Kaisen','year':2020,'season':1,'episode':1},
          ]
          out=[];cat=p.local_catalog()
          for f in fixtures:
              r=p.run_worker(cat['anikototv']['path'],f,65)
              row={'fixture':f['title'],'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('http_statuses') or [],'accessible':r.get('server_accessible'),'success':r.get('server_success'),'error':r.get('error_class'),'timeout':bool(r.get('timeout'))}
              out.append(row);print('ANIKOTO_V5_EXACT '+json.dumps(row,sort_keys=True))
          Path('automation/anikototv-v5-proof.json').write_text(json.dumps(out,indent=2)+'\n')
          if not any(x['streams']>0 for x in out): raise SystemExit('AniKoto V5 remains zero on all exact anime fixtures')
          PY
      - name: Full32 parity after V5
        run: |
          python scripts/run_provider_upstream_parity_v3.py --scope-matrix automation/evidence/hub-lab-matrix-46.json --provider anikototv --samples-per-lane 32 --workers 1 --timeout 25 --seed 20260914-anikoto-v5 --out automation/anikototv-v5-parity.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/anikototv-v5-parity.json').read_text())
          print('ANIKOTO_V5_PARITY_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('ANIKOTO_V5_PARITY_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          if d.get('certainRegressions'): raise SystemExit('AniKoto V5 still has certain regression')
          PY
      - name: Promote only proven semantic lanes and reconfirm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json');d=json.loads(p.read_text());r=d['provider_patches']['anikototv']
          proof=json.loads(Path('automation/anikototv-v5-proof.json').read_text())
          # Exact proof here is anime. Do not claim movie unless full32 independently proved it.
          parity=json.loads(Path('automation/anikototv-v5-parity.json').read_text())
          full_lanes=[]
          for pr in parity.get('providers') or []:
              for lane in pr.get('lanes') or []:
                  if lane.get('status')=='FULL': full_lanes.append(str(lane.get('lane')))
          proven=['anime'] if any(x['streams']>0 for x in proof) else []
          if 'movie' in full_lanes: proven.append('movie')
          declared=['anime','movie']
          missing=[x for x in declared if x not in proven]
          r['route_data_state']='on' if not missing else 'repair'
          disp=r.get('repair_disposition') if isinstance(r.get('repair_disposition'),dict) else {};r['repair_disposition']=disp
          disp.update({'routeDataState':r['route_data_state'],'currentVerifiedLanes':proven,'provenLanes':proven,'missingLanes':missing,'completeCapabilityProof':not missing,'recoveryStatus':'megaplay-v5-current-positive','terminalState':None,'quarantined':False,'reasonCodes':['current_megaplay_data_id','megaplay_aes_v5','exact_anime_positive','full32_no_certain_regression']})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/materialize_provider_v3_one.py anikototv
          python scripts/audit_provider_v3_static.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          f={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          r=p.run_worker(p.local_catalog()['anikototv']['path'],f,65)
          print('ANIKOTO_V5_RECONFIRM streams='+str(r.get('stream_count'))+' statuses='+str(r.get('http_statuses')))
          if int(r.get('stream_count') or 0)<=0: raise SystemExit('AniKoto positive lost after promotion')
          PY
      - name: Commit proven repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json manifest.json providers scripts/provider_patches/anikototv_runtime_v2.py automation/anikototv-v5-proof.json automation/anikototv-v5-parity.json
          git commit -m '[anikoto-v5] repair current MegaPlay source chain'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
