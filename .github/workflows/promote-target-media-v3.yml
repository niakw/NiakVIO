name: Promote strict target media resolution v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-target-media-v3.yml"
      - ".github/triggers/promote-target-media-v3"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate target resolver tooling
        run: |
          python -m py_compile scripts/provider_patches/nuvio_tv_target_media_v3.py
          python -m py_compile scripts/provider_patches/expose_strict_wrapper_original.py
          python -m py_compile scripts/provider_patches/target_media_host_filter_v4.py
          python -m py_compile scripts/provider_patches/nuvio_tv_target_media_v4.py
          python -m py_compile scripts/promote_target_media_v3.py
          python -m py_compile scripts/promote_target_media_v4.py
          node --check scripts/nuvio_tv_probe_v2.cjs

      - name: Revalidate target player chains and stage strict improvements
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/promote_target_media_v4.py
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          report = json.loads(Path('automation/nuvio-tv-target-media-v3.json').read_text(encoding='utf-8'))
          published = {row['id'] for row in report.get('published', [])}
          assert published == {'frenchstream'}, (published, report.get('preserved'))
          assert set(report.get('preserved', [])) == {'wookafr', 'coflix'}, report.get('preserved')
          assert report.get('resolver_version') == 'v4', report

          provider = report['providers']['frenchstream']
          assert provider['strictly_better'], provider
          assert provider['no_regression'], provider
          assert provider['strict_outputs'], provider

          blocked = {'snap.com', 'snapchat.com', 'ctfassets.net', 'sc-cdn.net'}
          playable_urls = []
          for result in provider.get('candidate', []):
              for item in (result.get('result') or {}).get('streams') or []:
                  media = item.get('media') or {}
                  row = item.get('row') or {}
                  if media.get('playable'):
                      playable_urls.append(str(row.get('url') or media.get('url') or ''))
          assert playable_urls, provider
          assert any(urlparse(url).hostname == 's1.fsvid.lol' and '/troll/master.m3u8' in url for url in playable_urls), playable_urls
          for url in playable_urls:
              host = (urlparse(url).hostname or '').lower()
              assert not any(host == rule or host.endswith('.' + rule) for rule in blocked), (host, url)

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row = next(row for row in manifest['scrapers'] if str(row.get('id', '')).casefold() == 'frenchstream')
          assert '--target-media-v4--' in row['filename'], row
          print('target media provider published: frenchstream')
          print('real content-proven HLS retained:', next(url for url in playable_urls if 's1.fsvid.lol' in url))
          print('preserved unresolved: coflix, wookafr')
          PY

      - name: Bump and synchronize release
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regressions
        run: npm test

      - name: Regenerate and validate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py
          python scripts/validate_activation_preservation.py

      - name: Publish strict target media bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/frenchstream--target-media-v4--*.js \
            scripts/provider_patches/nuvio_tv_target_media_v3.py \
            scripts/provider_patches/expose_strict_wrapper_original.py \
            scripts/provider_patches/target_media_host_filter_v4.py \
            scripts/provider_patches/nuvio_tv_target_media_v4.py \
            scripts/promote_target_media_v3.py \
            scripts/promote_target_media_v4.py \
            automation/nuvio-tv-target-media-v3.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish provenance-filtered Frenchstream HLS"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
