name: Promote strict target media resolution v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-target-media-v3.yml"
      - ".github/triggers/promote-target-media-v3"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate target resolver tooling
        run: |
          python -m py_compile scripts/provider_patches/nuvio_tv_target_media_v3.py
          python -m py_compile scripts/promote_target_media_v3.py
          node --check scripts/nuvio_tv_probe_v2.cjs

      - name: Revalidate target player chains and stage strict improvements
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/promote_target_media_v3.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('automation/nuvio-tv-target-media-v3.json').read_text(encoding='utf-8'))
          published = {row['id'] for row in report.get('published', [])}
          assert published, report
          for provider_id in published:
              provider = report['providers'][provider_id]
              assert provider['strictly_better'], (provider_id, provider)
              assert provider['no_regression'], (provider_id, provider)
              assert provider['strict_outputs'], (provider_id, provider)
          print('target media providers published:', ', '.join(sorted(published)))
          print('preserved unresolved:', ', '.join(report.get('preserved', [])) or 'none')
          PY

      - name: Bump and synchronize release
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regressions
        run: npm test

      - name: Regenerate and validate release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py
          python scripts/validate_activation_preservation.py

      - name: Publish strict target media bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/wookafr--target-media-v3--*.js \
            providers/coflix--target-media-v3--*.js \
            providers/frenchstream--target-media-v3--*.js \
            scripts/provider_patches/nuvio_tv_target_media_v3.py \
            scripts/promote_target_media_v3.py \
            automation/nuvio-tv-target-media-v3.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: publish strict LecteurVideo MegaUp and Vidzy media"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
