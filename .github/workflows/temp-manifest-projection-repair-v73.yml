name: TEMP - Manifest Projection Repair V73
on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - '.github/workflows/temp-manifest-projection-repair-v73.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install permanent projection synchronizer
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/sync_manifest_projection_rows.py <<'PY'
          #!/usr/bin/env python3
          """Keep derived manifests byte-equivalent to current root provider rows.

          VF membership is intentionally preserved here: language classification belongs to
          generate_language_manifests.py. Targeted provider publication may update row state,
          version or filename, but must not perform network language reclassification.
          No-anime membership is deterministic from semantic provider capabilities and is
          therefore rebuilt on every sync.
          """
          from __future__ import annotations
          import argparse, json
          from pathlib import Path
          from typing import Any
          from generate_language_manifests import build_no_anime_manifest, nested_entry

          ROOT = Path(__file__).resolve().parents[1]

          def load(path: Path) -> dict[str, Any]:
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: object required')
              return value

          def canonical(value: object) -> str:
              return str(value or '').strip().casefold()

          def synced_vf(root_manifest: dict[str, Any], current_vf: dict[str, Any]) -> dict[str, Any]:
              root_rows = {
                  canonical(row.get('id')): row
                  for row in root_manifest.get('scrapers') or []
                  if isinstance(row, dict) and canonical(row.get('id'))
              }
              rows = []
              for old in current_vf.get('scrapers') or []:
                  if not isinstance(old, dict):
                      continue
                  pid = canonical(old.get('id'))
                  source = root_rows.get(pid)
                  if source is None:
                      raise SystemExit(f'VF projection contains provider absent from root: {old.get("id")}')
                  rows.append(nested_entry(source))
              return {
                  'name': f"{root_manifest.get('name','NiakVIO')} — VF uniquement",
                  'version': root_manifest.get('version'),
                  'scrapers': rows,
              }

          def expected_all() -> dict[Path, dict[str, Any]]:
              root_manifest = load(ROOT / 'manifest.json')
              current_vf = load(ROOT / 'vf/manifest.json')
              vf = synced_vf(root_manifest, current_vf)
              no_anime = build_no_anime_manifest(root_manifest)
              vf_no_anime = build_no_anime_manifest(vf)
              return {
                  Path('vf/manifest.json'): vf,
                  Path('no-anime/manifest.json'): no_anime,
                  Path('vf-no-anime/manifest.json'): vf_no_anime,
              }

          def sync(*, check: bool = False) -> int:
              drift = []
              for relative, expected in expected_all().items():
                  path = ROOT / relative
                  current = load(path)
                  if current != expected:
                      drift.append(str(relative))
                      if not check:
                          path.write_text(json.dumps(expected, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              if check and drift:
                  raise SystemExit('manifest projection parity drift: ' + ','.join(drift))
              print(f"MANIFEST_PROJECTION_PARITY {'CHECK' if check else 'SYNC'} drift={len(drift)} files={','.join(drift) if drift else '-'}")
              return 0

          def main() -> int:
              p = argparse.ArgumentParser()
              p.add_argument('--check', action='store_true')
              a = p.parse_args()
              return sync(check=a.check)

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize_provider_v3_one.py')
          s=p.read_text(encoding='utf-8')
          marker='    allmat.write_json(allmat.DEFAULT_REPORT, ledger)\n'
          inject=marker+"    from sync_manifest_projection_rows import sync as sync_manifest_projections\n    sync_manifest_projections(check=False)\n"
          if 'sync_manifest_projections(check=False)' not in s:
              if marker not in s: raise SystemExit('materializer insertion marker missing')
              s=s.replace(marker,inject,1)
              p.write_text(s,encoding='utf-8')
          p=Path('scripts/domain_refresh_transaction_v2.py')
          s=p.read_text(encoding='utf-8')
          marker='        bundle_updates = rebuild_provider_configs(changed_provider_ids)\n'
          inject=marker+"        from sync_manifest_projection_rows import sync as sync_manifest_projections\n        sync_manifest_projections(check=False)\n"
          if 'sync_manifest_projections(check=False)' not in s:
              if marker not in s: raise SystemExit('domain refresh insertion marker missing')
              s=s.replace(marker,inject,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Repair all projections and prove exact parity
        shell: bash
        run: |
          set -euo pipefail
          echo 'BEFORE:'
          python scripts/sync_manifest_projection_rows.py --check || true
          python scripts/sync_manifest_projection_rows.py
          python scripts/sync_manifest_projection_rows.py --check
          python scripts/validate_language_projection.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=json.load(open('manifest.json'))
          root_by={str(r.get('id','')).casefold():r for r in root.get('scrapers',[]) if isinstance(r,dict)}
          for rel in ['vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json']:
              doc=json.load(open(rel)); mism=[]; missing_files=[]
              for row in doc.get('scrapers',[]):
                  src=root_by[str(row.get('id','')).casefold()]
                  exp=dict(src); f=str(exp.get('filename') or '')
                  if f and not f.startswith(('http://','https://','/','../')): exp['filename']='../'+f
                  if row != exp: mism.append(row.get('id'))
                  target=(Path(rel).parent / str(row.get('filename') or '')).resolve()
                  if str(row.get('filename') or '') and not target.is_file(): missing_files.append((row.get('id'),str(target)))
              print('PARITY',rel,'rows',len(doc.get('scrapers',[])),'mismatch',mism[:10],'missing_files',missing_files[:10])
              assert not mism
              assert not missing_files
          vf=json.load(open('vf/manifest.json'))
          pur=next(r for r in vf['scrapers'] if str(r.get('id')).casefold()=='purstream')
          rootpur=root_by['purstream']
          assert pur['version']==rootpur['version'],(pur['version'],rootpur['version'])
          assert pur['filename']=='../'+rootpur['filename'],(pur['filename'],rootpur['filename'])
          print('PURSTREAM_PARITY_OK',pur['version'],pur['filename'])
          PY
      - name: Permanent tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_manifest_projection_rows.py scripts/materialize_provider_v3_one.py scripts/domain_refresh_transaction_v2.py
          python tests/language_projection_test.py
          python tests/provider_v3_one_security_finalization_test.py
          python scripts/sync_manifest_projection_rows.py --check
      - name: Persist V73
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/sync_manifest_projection_rows.py scripts/materialize_provider_v3_one.py scripts/domain_refresh_transaction_v2.py vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json
          git diff --cached --exit-code && { echo 'nothing to persist'; exit 1; } || true
          git commit -m 'fix(manifests): keep projections in provider parity'
          git push origin HEAD:fix/non-display-recovery-20260916
