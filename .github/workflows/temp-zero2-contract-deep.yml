name: TEMP - ZERO2 contract deep probe

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-zero2-contract-deep.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact current contracts
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def req(url, headers=None, timeout=15):
              h={'User-Agent':UA,'Accept':'application/json,text/html,*/*'}; h.update(headers or {})
              r=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(r,timeout=timeout) as z:
                  return z.status,z.headers,z.read(2*1024*1024).decode('utf-8','replace'),z.url
          def shape(v,d=0):
              if d>4:return type(v).__name__
              if isinstance(v,dict):return {k:shape(x,d+1) for k,x in list(v.items())[:50]}
              if isinstance(v,list):return {'len':len(v),'sample':shape(v[0],d+1) if v else None}
              if isinstance(v,str):
                  if v.startswith(('http://','https://')): return '<url>'
                  return v[:140]
              return v
          def probe(label,url,headers=None):
              try:
                  st,hd,body,final=req(url,headers)
                  try: out={'status':st,'final':final,'json':shape(json.loads(body))}
                  except Exception: out={'status':st,'final':final,'prefix':body[:300].replace('\n',' ')}
              except urllib.error.HTTPError as e:
                  b=e.read(65536).decode('utf-8','replace'); out={'status':e.code,'prefix':b[:250].replace('\n',' '),'cf':e.headers.get('cf-mitigated')}
              except Exception as e: out={'error':type(e).__name__+': '+str(e)[:180]}
              print(label+' '+json.dumps(out,ensure_ascii=False,separators=(',',':')))

          base='https://data.vidsrcme.ru/api.php?type=tv&tmdb=94997&season=1&episode=1'
          probe('MOVIEBOX_API_BASE',base)
          probe('MOVIEBOX_API_STREAM_FLAG',base+'&stream_urls')
          probe('MOVIEBOX_API_STREAM_1',base+'&stream_urls=1')
          probe('MOVIEBOX_VS_SRC','https://vidsrcme.ru/vs_src.php?type=tv&id=94997&season=1&episode=1')

          ah={'X-Requested-With':'XMLHttpRequest','Referer':'https://anikototv.to/'}
          st,hd,sbody,_=req('https://anikototv.to/ajax/anime/search?keyword=death+note',ah)
          data=json.loads(sbody); html=(data.get('result') or {}).get('html') or ''
          hrefs=re.findall(r'href=["\']([^"\']+)',html,re.I)
          print('ANIKOTO_SEARCH_HREFS '+json.dumps(hrefs[:20],ensure_ascii=False))
          exact='https://anikototv.to/watch/death-note-fc8mq/ep-1'
          st,hd,body,final=req(exact,{'Referer':'https://anikototv.to/'})
          pats={
            'data_link_id':re.findall(r'data-link-id=["\']([^"\']+)',body,re.I),
            'data_id':re.findall(r'data-id=["\']([^"\']+)',body,re.I),
            'data_ids':re.findall(r'data-ids=["\']([^"\']+)',body,re.I),
            'server_get_literals':re.findall(r'/ajax/server\?get=([^"\'&< ]+)',body,re.I),
            'iframe_src':re.findall(r'<iframe[^>]+src=["\']([^"\']+)',body,re.I),
          }
          for k,v in pats.items(): print('ANIKOTO_'+k.upper()+' '+json.dumps(v[:20],ensure_ascii=False))
          tokens=[]
          for k in ('data_link_id','server_get_literals'):
              for t in pats[k]:
                  if t and t not in tokens: tokens.append(t)
          for i,t in enumerate(tokens[:4]):
              probe(f'ANIKOTO_SERVER_{i}','https://anikototv.to/ajax/server?get='+urllib.request.quote(t) if False else 'https://anikototv.to/ajax/server?get='+t,ah)
          PY
