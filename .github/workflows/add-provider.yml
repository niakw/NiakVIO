name: Add Provider full-auto

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: Canonical provider id
        required: true
        type: string
      name:
        description: Display name
        required: true
        type: string
      types:
        description: Comma-separated movie,tv,anime (series/show normalize to tv)
        required: false
        default: "movie,tv"
        type: string
      languages:
        description: Comma-separated content languages, for example fr,en
        required: false
        default: ""
        type: string
      formats:
        description: Comma-separated output formats when known
        required: false
        default: ""
        type: string
      hub:
        description: Known hub/wiki URL
        required: false
        default: ""
        type: string
      direct:
        description: Known direct/terminal provider URL
        required: false
        default: ""
        type: string
      telegram:
        description: Known public Telegram channel/feed URL
        required: false
        default: ""
        type: string
      api:
        description: Known API/resolver URL
        required: false
        default: ""
        type: string
      search_queries:
        description: Optional newline/comma-separated fallback search queries
        required: false
        default: ""
        type: string
      aliases:
        description: Optional comma-separated provider aliases
        required: false
        default: ""
        type: string
      routes:
        description: Optional known search/API route templates
        required: false
        default: ""
        type: string
      strategy:
        description: Initial NiakVIO provider strategy
        required: false
        default: html_scraper
        type: choice
        options:
          - html_scraper
          - mixed_embed_resolver
          - api_stream_resolver
          - direct_media
          - iframe
      category:
        description: Optional registry category
        required: false
        default: ""
        type: string
      description:
        description: Optional manifest description
        required: false
        default: ""
        type: string
      vf:
        description: Force inclusion in VF projection
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/provider-onboarding/request.json"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish-main
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - name: Checkout current production main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --no-input "Pillow>=10,<13"

      - name: Materialize structured onboarding request
        shell: bash
        env:
          INPUT_ID: ${{ inputs.provider_id || '' }}
          INPUT_NAME: ${{ inputs.name || '' }}
          INPUT_TYPES: ${{ inputs.types || '' }}
          INPUT_LANGUAGES: ${{ inputs.languages || '' }}
          INPUT_FORMATS: ${{ inputs.formats || '' }}
          INPUT_HUB: ${{ inputs.hub || '' }}
          INPUT_DIRECT: ${{ inputs.direct || '' }}
          INPUT_TELEGRAM: ${{ inputs.telegram || '' }}
          INPUT_API: ${{ inputs.api || '' }}
          INPUT_SEARCH: ${{ inputs.search_queries || '' }}
          INPUT_ALIASES: ${{ inputs.aliases || '' }}
          INPUT_ROUTES: ${{ inputs.routes || '' }}
          INPUT_STRATEGY: ${{ inputs.strategy || 'html_scraper' }}
          INPUT_CATEGORY: ${{ inputs.category || '' }}
          INPUT_DESCRIPTION: ${{ inputs.description || '' }}
          INPUT_VF: "${{ inputs.vf || false }}"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mkdir -p .provider-onboarding
            python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "id": os.environ["INPUT_ID"],
              "name": os.environ["INPUT_NAME"],
              "types": os.environ["INPUT_TYPES"],
              "languages": os.environ["INPUT_LANGUAGES"],
              "formats": os.environ["INPUT_FORMATS"],
              "hub": os.environ["INPUT_HUB"],
              "direct": os.environ["INPUT_DIRECT"],
              "telegram": os.environ["INPUT_TELEGRAM"],
              "api": os.environ["INPUT_API"],
              "search_queries": os.environ["INPUT_SEARCH"],
              "aliases": os.environ["INPUT_ALIASES"],
              "routes": os.environ["INPUT_ROUTES"],
              "strategy": os.environ["INPUT_STRATEGY"],
              "category": os.environ["INPUT_CATEGORY"],
              "description": os.environ["INPUT_DESCRIPTION"],
              "vf": os.environ["INPUT_VF"],
          }
          Path(".provider-onboarding/manual-request.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            echo "REQUEST=.provider-onboarding/manual-request.json" >> "$GITHUB_ENV"
          else
            test -s .github/provider-onboarding/request.json
            echo "REQUEST=.github/provider-onboarding/request.json" >> "$GITHUB_ENV"
          fi

      - name: Stage clean NiakVIO ProviderBase and structured route knowledge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/add_provider.py stage --request "$REQUEST"

      - id: provider
        name: Export normalized provider identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          row=json.load(open(".provider-onboarding/current.json", encoding="utf-8"))
          for key in ("id","name","site"):
              value=str(row.get(key) or "").replace("\n"," ")
              print(f"{key}={value}")
          PY

      - name: Resolve hub, direct, Telegram and search fallbacks
        shell: bash
        env:
          PROVIDER_ID: ${{ steps.provider.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p .provider-onboarding/routes
          python scripts/resolve_provider_hubs.py             --apply --mode deep --include-disabled --search-disabled             --provider "$PROVIDER_ID" --workers 1 --timeout 8             --output .provider-onboarding/routes/provider-hub-report.json || true
          python scripts/resolve_provider_hub_search_fallback.py             --report .provider-onboarding/routes/provider-hub-report.json             --output .provider-onboarding/routes/provider-hub-search-fallback.json             --apply --max-providers 1 --timeout 8 || true
          python scripts/add_provider.py refresh --provider "$PROVIDER_ID"

      - name: Delegate automatic defaults to Provider branding assets engine
        shell: bash
        env:
          PROVIDER_ID: ${{ steps.provider.outputs.id }}
          DISPLAY_NAME: ${{ steps.provider.outputs.name }}
        run: |
          set -euo pipefail
          # Explicit logo/emoji overrides belong to the dedicated
          # "Provider branding assets" workflow. Onboarding only requests
          # automatic defaults from the shared branding engine so publication
          # remains atomic.
          SITE="$(python -c 'import json; print(json.load(open(".provider-onboarding/current.json")).get("site") or "")')"
          python scripts/provider_branding_assets.py             --mode only             --provider "$PROVIDER_ID"             --name "$DISPLAY_NAME"             --site "$SITE"

      - name: Derive public provider bundle and manifest projections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs

      - name: Run bounded onboarding Lab on first declared type
        shell: bash
        env:
          PROVIDER_ID: ${{ steps.provider.outputs.id }}
        run: |
          set -euo pipefail
          set +e
          node scripts/nuvio_client_lab.cjs             --config .provider-onboarding/lab-config.json             --out .provider-onboarding/lab-report.json             --markdown .provider-onboarding/lab-report.md
          LAB_STATUS=$?
          set -e
          if [ ! -s .provider-onboarding/lab-report.json ]; then
            printf '{"schema_version":2,"clients":["tv","desktop","mobile"],"providers":[],"policy":{"safety_blocking_pass":false}}\n'               > .provider-onboarding/lab-report.json
          fi
          echo "FIELD_PROVIDER_ONBOARDING_LAB command_status=$LAB_STATUS provider=$PROVIDER_ID"
          python scripts/add_provider.py finalize             --provider "$PROVIDER_ID"             --report .provider-onboarding/lab-report.json

      - name: Rebuild exact publication after activation decision
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          python scripts/provider_base_store.py repair-legacy

      - name: Validate onboarding contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             scripts/add_provider.py             scripts/provider_branding_assets.py             scripts/run_brain_learning_queue.py             scripts/prepare_native_ios_reader_acceptance.py
          node --check scripts/nuvio_client_lab.cjs
          node --check scripts/nuvio_client_lab_session.cjs
          python tests/add_provider_workflow_test.py
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_logo_asset_contract_test.py
          python tests/provider_branding_contract_test.py
          python tests/brain_cron_full_coverage_test.py
          python tests/native_corpus_device_lab_test.py
          node engine_v2/tests/provider-catalog.test.mjs
          npm test

      - name: Publish validated provider transaction
        shell: bash
        env:
          PROVIDER_ID: ${{ steps.provider.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name "niakvio-provider-onboarding"
          git config user.email "actions@users.noreply.github.com"
          git add             manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json             provider_catalog.json PROVENANCE.json provider-overrides.json provider-hubs.json provider-type-policy.json             provider-bases providers assets/providers
          if git diff --cached --quiet; then
            echo "No onboarding changes to publish."
            exit 0
          fi
          git commit -m "provider: add $PROVIDER_ID"
          git push origin HEAD:main

      - name: Upload sanitized onboarding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-onboarding-${{ github.run_id }}
          path: |
            .provider-onboarding/current.json
            .provider-onboarding/lab-report.json
            .provider-onboarding/lab-report.md
            .provider-onboarding/routes/*.json
          retention-days: 7
          if-no-files-found: warn
