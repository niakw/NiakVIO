name: FINALIZE - Secured Non-Display Publication Candidate

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths:
      - '.github/workflows/pr-final-minimizer-short.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-secured-nondisplay-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: publication
      NIAKVIO_PARITY_SAMPLES_PER_LANE: '3'
      NIAKVIO_PARITY_WORKERS: '6'
      NIAKVIO_PARITY_TIMEOUT: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Patch owner source and validate recovery registration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/upgrade_non_display_recovery_html_security_v1.py \
            scripts/provider_patches/non_display_recovery_runtime_v1.py \
            scripts/register_non_display_recovery_v1.py
          python3 scripts/upgrade_non_display_recovery_html_security_v1.py
          python3 scripts/register_non_display_recovery_v1.py
          python3 tests/provider_upstream_semantic_guard_test.py
          python3 tests/provider_html_filter_security_test.py
          git diff --check

      - name: Reapply, prove HTML security, minimize and rebuild projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          python3 tests/provider_html_filter_security_test.py --published
          python3 scripts/finalize_provider_v3_minimizer.py
          python3 scripts/finalize_provider_v3_minimizer.py --check
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/provider_v3_minimizer_contract_test.py
          python3 tests/provider_v3_minimizer_preview_test.py
          python3 tests/provider_v3_minimizer_publication_pipeline_test.py
          python3 tests/provider_v3_minimizer_published_test.py
          python3 scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python3 scripts/prune_unreferenced_providers.py
          python3 tests/provider_html_filter_security_test.py --published
          python3 scripts/audit_provider_v3_static.py

      - name: Re-prove critical Core and projection gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/stream_output_sanitizer_fail_closed_test.py
          node --test engine_v2/tests/stream-presentation.test.mjs

      - name: Re-prove seven exact routes on secured bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import json,pathlib,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as v2
          import run_provider_upstream_parity_v3 as v3
          cases=[
            ('animesama-co','anime','45950'),
            ('animevostfr','anime','95479'),
            ('coflix','movie','10195'),
            ('coflix','tv','94997'),
            ('neko-sama','anime','65930'),
            ('sekai','anime','65930'),
            ('voiranime-rip','anime','120089'),
          ]
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text(encoding='utf-8'))
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); upstreams,_=v2.upstream_catalog(); rows=[]
          with tempfile.TemporaryDirectory() as td:
            td=pathlib.Path(td); up_paths={}
            for pid,_,_ in cases:
              if pid in up_paths: continue
              row=upstreams.get(pid)
              if not row or not row.get('url'): raise SystemExit('missing upstream: '+pid)
              path=td/(pid+'-up.js');path.write_bytes(p.get_bytes(row['url']));up_paths[pid]=path
            for pid,lane,tmdb in cases:
              fx=fixtures[(lane,tmdb)]
              lo=v3._run_verified(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
              up=v3._run_verified(up_paths[pid],v3.fixture_payload(fx,lane,upstream=True),25)
              status,semantic=v3.classify_pair_with_semantic_guard(pid,fx,up_paths[pid],up,lo,25)
              item={'providerId':pid,'lane':lane,'fixture':fx['slug'],'classification':status,
                    'localStreams':int(lo.get('stream_count') or 0),'localTerminal':bool(lo.get('terminal_verified')),
                    'upstreamStreams':int(up.get('stream_count') or 0),'upstreamTerminal':bool(up.get('terminal_verified')),
                    'localReasons':lo.get('terminal_reasons') or [],'upstreamReasons':up.get('terminal_reasons') or [],
                    'localError':lo.get('error_class'),'upstreamError':up.get('error_class')}
              if semantic is not None:item['semanticValidation']=semantic
              print('NON_DISPLAY_EXACT_PARITY '+json.dumps(item,sort_keys=True));rows.append(item)
          pathlib.Path('automation/non-display-recovery-exact-proof.json').write_text(json.dumps({'rows':rows},indent=2)+'\n',encoding='utf-8')
          bad=[r for r in rows if r['classification']=='upstream_ok_niakvio_ko']
          if bad: raise SystemExit('exact proven regressions remain: '+','.join(r['providerId']+':'+r['lane'] for r in bad))
          PY

      - name: Re-prove 18-provider deep parity on secured bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'4khdhub','allanime','allwish','animesalt','flemmix','moviebox','moviesmod','showbox','vidfast','vidlove','wookafr','coflix','neko-sama','sekai','voiranime','voiranime-rip','animesama-co','animevostfr'}
          src=json.loads(Path('automation/evidence/hub-lab-matrix-46.json').read_text(encoding='utf-8'))
          rows=[r for r in src.get('rows',[]) if str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') in wanted]
          got={str(r.get('manifestId') or r.get('provider') or '').strip().casefold().replace('_','-') for r in rows}
          if got!=wanted: raise SystemExit('scope mismatch missing='+','.join(sorted(wanted-got)))
          Path('/tmp/non-display-suspect-scope.json').write_text(json.dumps({'schemaVersion':src.get('schemaVersion',1),'hubCount':len(rows),'providerCount':len(rows),'rows':rows},indent=2)+'\n')
          PY
          python3 tests/provider_upstream_semantic_guard_test.py
          python3 tests/provider_upstream_parity_v3_test.py
          python3 scripts/run_provider_upstream_parity_v3.py --scope-matrix /tmp/non-display-suspect-scope.json --out automation/non-display-recovery-parity.json
          python3 - <<'PY'
          import json
          d=json.load(open('automation/non-display-recovery-parity.json',encoding='utf-8'))
          counts=d.get('statusCounts') or {}
          regress=[r.get('providerId') for r in d.get('providers') or [] if r.get('status')=='REGRESSION']
          print('NON_DISPLAY_SECURED_COUNTS '+json.dumps(counts,sort_keys=True))
          if regress or int(counts.get('REGRESSION') or 0): raise SystemExit('proven regressions remain: '+','.join(x for x in regress if x))
          PY

      - name: Persist authoritative secured publication state
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr-final-minimizer-short.yml \
            scripts/upgrade_non_display_recovery_html_security_v1.py \
            scripts/provider_patches/non_display_recovery_html_security_v3.py \
            scripts/provider_patches/animesamaco_nondisplay_security_v3.py \
            scripts/provider_patches/animevostfr_nondisplay_security_v3.py \
            scripts/provider_patches/coflix_nondisplay_security_v3.py \
            scripts/provider_patches/neko_sama_nondisplay_security_v3.py \
            scripts/provider_patches/sekai_nondisplay_security_v3.py \
            scripts/provider_patches/voiranime_rip_nondisplay_security_v3.py
          git diff --name-only | tee /tmp/final-files.txt
          if grep -Ev '^(PROVENANCE\.json|provider-overrides\.json|provider-v3-materialization\.json|providers/.*|manifest\.json|manifest-hub46\.json|vf/manifest\.json|no-anime/manifest\.json|vf-no-anime/manifest\.json|package\.json|package-lock\.json|sources\.json|provider_catalog\.json|nuvio-client-id-state\.json|automation/PLATFORM-RUNTIME-CONTRACTS\.md|automation/non-display-recovery-exact-proof\.json|automation/non-display-recovery-parity\.json|scripts/provider_patches/non_display_recovery_runtime_v1\.py|scripts/upgrade_non_display_recovery_html_security_v1\.py|scripts/provider_patches/non_display_recovery_html_security_v3\.py|scripts/provider_patches/.*_nondisplay_security_v3\.py|\.github/workflows/pr-final-minimizer-short\.yml)$' /tmp/final-files.txt; then
            echo 'Unexpected path changed by secured provider finalization' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize secured non-display provider publication'
          git fetch origin fix/non-display-recovery-20260916
          test "$(git rev-parse origin/fix/non-display-recovery-20260916)" = "${GITHUB_SHA}" || {
            echo 'Repair branch moved during finalization' >&2
            exit 1
          }
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "FIELD_SECURED_PROVIDER_FINALIZATION_OK sha=$(git rev-parse HEAD) version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')"
