name: CodeQL wrapper source hardening gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/triggers/codeql-wrapper-source-hardening"

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dedicated fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codeql-wrapper-sources
          fetch-depth: 0

      - name: Install pinned dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove redundant P.A.C.K.E.R key escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('scripts/provider_patches/nuvio_tv_direct_media.py'),
              Path('scripts/provider_patches/nuvio_tv_direct_media_v2.py'),
          ]
          needle = 'key(i).replace('
          for path in paths:
              text = path.read_text(encoding='utf-8')
              start = text.find(needle)
              if start < 0:
                  raise SystemExit(f'{path}: packer key replacement not found')
              if text.find(needle, start + len(needle)) >= 0:
                  raise SystemExit(f'{path}: multiple packer key replacements')
              end = text.find(')+"', start)
              if end < 0:
                  raise SystemExit(f'{path}: packer replacement terminator not found')
              before = text[start:end + 1]
              if '/g,' not in before or '$&' not in before:
                  raise SystemExit(f'{path}: unexpected replacement shape: {before}')
              text = text[:start] + 'key(i)' + text[end + 1:]
              if needle in text:
                  raise SystemExit(f'{path}: redundant replacement remains')
              path.write_text(text, encoding='utf-8')
              print(f'FIELD_CODEQL_WRAPPER_SOURCE_FIXED path={path}')
          PY

      - name: Run focused generator regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/override_net_noop_regression_test.py
          python3 tests/streamzo_target_media_profile_test.py
          python3 tests/french_manga_target_media_profile_test.py
          python3 tests/vf_recovery_profiles_test.py
          git diff --check

      - name: Run deterministic repository suite
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Commit verified source hardening to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "niakvio-security"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/provider_patches/nuvio_tv_direct_media.py scripts/provider_patches/nuvio_tv_direct_media_v2.py
          git commit -m "security: remove redundant packer regex sanitization"
          git push origin HEAD:fix/codeql-wrapper-sources
