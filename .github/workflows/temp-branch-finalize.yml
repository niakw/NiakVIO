name: TEMP Branch Finalize One-Line Providers

on:
  push:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/one-line-minimizer-final-20260917
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Adapt legacy-to-managed patch ownership for editable one-line bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/apply_provider_overrides.py')
          text = p.read_text(encoding='utf-8')
          old_sig = '''def _assert_v3_patch_ownership(\n    before: str,\n    after: str,\n    patch_script: str,\n    managed_fix_id: str | None,\n) -> None:\n'''
          new_sig = '''def _assert_v3_patch_ownership(\n    before: str,\n    after: str,\n    patch_script: str,\n    managed_fix_id: str | None,\n    insertion_baseline: str | None = None,\n) -> None:\n'''
          if text.count(old_sig) != 1:
              raise SystemExit('ownership signature anchor drifted')
          text = text.replace(old_sig, new_sig, 1)

          old_insert = '''    # New Lego insertion: deleting the new rectangle must recover the previous\n    # provider byte-for-byte, except for separator newlines at the insertion seam.\n    without_new = after[:new_span[0]] + after[new_span[1]:]\n    if not _only_whitespace_gap_diff(before, without_new):\n        raise ValueError(\n            f"v3 patch mutated bytes outside new owned fix {fix_id}: {patch_script}"\n        )\n'''
          new_insert = '''    # New Lego insertion: deleting the new rectangle must recover the exact\n    # expected insertion baseline, except for separator whitespace at the seam.\n    # A patch may opt into a *specific* legacy -> managed migration baseline;\n    # this does not weaken ownership because arbitrary outside mutations still\n    # fail against the explicitly computed baseline.\n    expected_before = before if insertion_baseline is None else insertion_baseline\n    without_new = after[:new_span[0]] + after[new_span[1]:]\n    if not _only_whitespace_gap_diff(expected_before, without_new):\n        raise ValueError(\n            f"v3 patch mutated bytes outside new owned fix {fix_id}: {patch_script}"\n        )\n'''
          if text.count(old_insert) != 1:
              raise SystemExit('ownership insertion anchor drifted')
          text = text.replace(old_insert, new_insert, 1)

          old_call = '''    managed_fix_id = getattr(module, "MANAGED_FIX_ID", None)\n    managed_fix_optional = bool(getattr(module, "MANAGED_FIX_OPTIONAL", False))\n    _assert_v3_patch_ownership(text, result, patch_script, managed_fix_id)\n'''
          new_call = '''    managed_fix_id = getattr(module, "MANAGED_FIX_ID", None)\n    managed_fix_optional = bool(getattr(module, "MANAGED_FIX_OPTIONAL", False))\n    insertion_baseline = None\n    if managed_fix_id and owned_span(text, str(managed_fix_id)) is None:\n        baseline_fn = getattr(module, "managed_fix_insertion_baseline", None)\n        if baseline_fn is not None:\n            if not callable(baseline_fn):\n                raise TypeError(\n                    f"provider patch {patch_script} managed_fix_insertion_baseline must be callable"\n                )\n            insertion_baseline = baseline_fn(text)\n            if not isinstance(insertion_baseline, str):\n                raise TypeError(\n                    f"provider patch {patch_script} managed_fix_insertion_baseline must return str"\n                )\n    _assert_v3_patch_ownership(\n        text, result, patch_script, managed_fix_id, insertion_baseline\n    )\n'''
          if text.count(old_call) != 1:
              raise SystemExit('ownership call anchor drifted')
          text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('scripts/provider_patches/runtime_capability_media_safety_v4.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''    return "".join(parts)\n\n\nWRAPPER = r\'\'\'\n'''
          replacement = '''    return "".join(parts)\n\n\ndef managed_fix_insertion_baseline(text: str) -> str:\n    """Exact pre-insertion bytes for legacy safety-wrapper migration."""\n    return _strip_previous(text)\n\n\nWRAPPER = r\'\'\'\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime safety migration anchor drifted')
          p.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_provider_overrides.py scripts/provider_patches/runtime_capability_media_safety_v4.py

      - name: Finalize branch publication
        env:
          NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cp manifest.json "$RUNNER_TEMP/published-manifest-baseline.json"
          python3 scripts/reapply_published_overrides.py
          python3 scripts/finalize_provider_v3_minimizer.py
          python3 scripts/finalize_provider_v3_minimizer.py --check
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/provider_v3_minimizer_contract_test.py
          python3 tests/provider_v3_minimizer_preview_test.py
          python3 tests/provider_v3_minimizer_publication_pipeline_test.py
          python3 tests/provider_v3_minimizer_published_test.py
          python3 scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python3 scripts/prune_unreferenced_providers.py
          python3 tests/provider_html_filter_security_test.py --published
          python3 scripts/audit_provider_v3_static.py
          python3 scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/published-manifest-baseline.json"
          python3 tests/release_auto_bump_test.py
          python3 tests/provider_versioning_test.py
          python3 tests/reapply_provider_versioning_test.py
          python3 scripts/generate_hub46_manifest.py --source manifest.json --matrix automation/evidence/hub-lab-matrix-46.json --output manifest-hub46.json

          rm .github/workflows/temp-branch-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: materialize one-line Provider v3 generation'
          PROVIDER_SHA="$(git rev-parse HEAD)"

          python3 scripts/build_hub46_native_manifest.py --provider-sha "$PROVIDER_SHA" --source manifest-hub46.json --output native-hub46/manifest.json
          python3 tests/native_hub46_manifest_test.py
          python3 tests/native_hub46_transport_manifest_test.py
          python3 tests/release_projection_scope_test.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          git add native-hub46/manifest.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: pin one-line Provider v3 release integrity'
          fi
          git push origin HEAD:hotfix/one-line-minimizer-final-20260917
