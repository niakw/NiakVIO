name: TEMP - Bind CDN runtimes

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - scripts/fix_cdn_runtime_lego_bindings_v1.py
      - .github/workflows/temp-bind-cdn-runtimes.yml

permissions:
  contents: write

jobs:
  bind:
    if: ${{ !contains(github.event.head_commit.message, '[cdn-bind]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind durable runtimes
        run: python scripts/fix_cdn_runtime_lego_bindings_v1.py

      - name: Materialize only affected providers
        env:
          NUVIO_PROVIDER_V3_CONTEXT: workspace
          NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '0'
        run: |
          python scripts/materialize_provider_v3_one.py animepahe
          python scripts/materialize_provider_v3_one.py animevostfr
          python scripts/audit_provider_v3_static.py

      - name: Assert runtime Lego installation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          rows={str(r.get('id','')).lower():r for r in manifest.get('scrapers',[])}
          checks={
            'animepahe':['NIAKVIO_ANIMEPAHE_RUNTIME_V1','credentials:"include"','Chrome/145.0.0.0'],
            'animevostfr':['NIAKVIO_ANIMEVOSTFR_RUNTIME_V1','playbackHeaders','credentials="include"'],
          }
          for pid,needles in checks.items():
              path=Path(rows[pid]['filename'])
              text=path.read_text(errors='replace')
              for needle in needles:
                  assert needle in text,(pid,needle,path)
              print('RUNTIME_LEGO_INSTALLED',pid,path)
          assert rows['animevostfr'].get('canonicalSupportedTypes') == ['anime'], rows['animevostfr'].get('canonicalSupportedTypes')
          print('ANIMEVOSTFR_ANIME_ONLY_OK')
          PY

      - name: Exact post-binding probes
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import run_provider_upstream_parity as p
          local=p.local_catalog()
          fixtures={
            'animepahe': {'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1},
            'animevostfr': {'tmdbId':'31911','mediaType':'anime','category':'anime','title':'Fullmetal Alchemist: Brotherhood','year':2009,'season':1,'episode':1},
          }
          out={}
          for pid,fixture in fixtures.items():
              row=local[pid]
              out[pid]=p.run_worker(row['path'], fixture, 55)
          print('CDN_POST_BIND_RESULTS='+json.dumps(out, sort_keys=True))
          Path('/tmp/cdn-post-bind.json').write_text(json.dumps(out, indent=2))
          PY

      - name: Preserve fail-closed stream truth
        run: python tests/stream_output_sanitizer_fail_closed_test.py

      - name: Checkpoint and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cdn-post-bind.json').read_text())
          p=Path('MEMORY.md'); text=p.read_text(); marker='## 2026-09-13 — missing CDN runtime Lego bindings repaired'
          block='\n\n'+marker+'\n\n'
          block+='- `animepahe_runtime_v1.py` and `animevostfr_runtime_v1.py` existed but were not bound in `provider-overrides.json`; their rebuilt bundles therefore never contained the authored runtime fixes.\n'
          block+='- Both runtimes are now durable provider Legos. AnimeVOSTFR remains authoritative anime-only; movie is not reintroduced.\n'
          block+='- Exact post-binding probe summary: `'+json.dumps(r, sort_keys=True).replace('`','')+'`.\n'
          if marker not in text: p.write_text(text.rstrip()+block+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json manifest.json providers provider-v3-materialization.json MEMORY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[cdn-bind] install AnimePahe and AnimeVOSTFR runtimes'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
