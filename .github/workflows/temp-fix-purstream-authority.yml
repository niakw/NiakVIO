name: TEMP - Fix Canonical Recipe Authority
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-fix-purstream-authority.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Reconcile recipe base/referer from canonical address authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize_provider_v3_one.py')
          s=p.read_text(encoding='utf-8')
          old='''    # MATERIALIZER_EXECUTION_AUTHORITY_MONOTONIC_V25\n    # Static knowledge may reconcile address metadata, but it must never promote\n    # or replace executable route/API authority. Runtime authority is written by\n    # proof/repair and remains monotonic until fresh positive proof supersedes it.\n\n'''
          new='''    # MATERIALIZER_EXECUTION_AUTHORITY_MONOTONIC_V25\n    # Static knowledge may reconcile canonical address authority (site/API base\n    # and referer), but it must never promote or replace executable route fields.\n    # Runtime route authority is written by proof/repair and remains monotonic\n    # until fresh positive proof supersedes it.\n    canonical_recipe = model.get("apiRecipe")\n    patch_recipe = patch.get("api_recipe")\n    if isinstance(canonical_recipe, dict) and isinstance(patch_recipe, dict):\n        reconciled_recipe = copy.deepcopy(patch_recipe)\n        canonical_base = str(\n            canonical_recipe.get("base")\n            or model.get("fixedApi")\n            or model.get("officialApi")\n            or ""\n        ).strip()\n        canonical_referer = str(\n            canonical_recipe.get("referer")\n            or canonical_recipe.get("referrer")\n            or model.get("officialSite")\n            or model.get("knownSite")\n            or ""\n        ).strip()\n        if canonical_base and reconciled_recipe.get("base") != canonical_base:\n            reconciled_recipe["base"] = canonical_base\n        if canonical_referer and reconciled_recipe.get("referer") != canonical_referer:\n            reconciled_recipe["referer"] = canonical_referer\n        if reconciled_recipe != patch_recipe:\n            patch["api_recipe"] = reconciled_recipe\n            changed = True\n\n'''
          if old not in s:
              if 'canonical_recipe = model.get("apiRecipe")' not in s:
                  raise SystemExit('canonical recipe authority anchor missing')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/materialize_provider_v3_one.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize_provider_v3_one.py
          if git diff --cached --quiet; then
            echo 'CANONICAL_RECIPE_AUTHORITY_NOOP=true'
            exit 0
          fi
          git commit -m 'fix(materializer): reconcile canonical recipe address authority'
          git push origin HEAD:release/stable-46-20260912
