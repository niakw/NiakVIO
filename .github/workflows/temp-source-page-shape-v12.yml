name: TEMP - Source Page Shape V12

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/source-page-shape-v12.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Diagnose live page structures
        run: node scripts/diagnose_source_page_shapes_v12.cjs
