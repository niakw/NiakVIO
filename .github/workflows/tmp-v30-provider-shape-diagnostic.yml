name: TMP - V30 Provider Shape Diagnostic
# PR trigger V30

on:
  pull_request:
    branches:
      - tmp/v30-shape-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight diagnostic harness
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 -m py_compile scripts/certify_provider_playable_lanes.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Probe selected exact 5.21.57 bundles
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py             --manifest manifest.json             --include-disabled             --provider 4khdhub             --provider showbox             --provider castle             --candidate-limit 4             --timeout 30             --workers 2             --seed "v30-shape-${GITHUB_RUN_ID}"             --output health-output/v30-certification.json

      - name: Summarize safe provider shapes
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('health-output/v30-certification.json')
          if not p.exists():
              print('FIELD_V30 missing')
              raise SystemExit(0)
          j=json.loads(p.read_text())
          for row in j.get('providers') or []:
              print('FIELD_V30_PROVIDER',row.get('providerId'),
                    'failure='+str(row.get('failure') or ''),
                    'failureMessage='+str(row.get('failureMessage') or '')[:200])
              for lane,v in (row.get('lanes') or {}).items():
                  for a in (v or {}).get('attempts') or []:
                      trace=a.get('networkTrace') or []
                      print('FIELD_V30_ATTEMPT',row.get('providerId'),lane,a.get('fixtureSlug'),
                            'stage='+str(a.get('debugStage') or ''),
                            'trace='+json.dumps(trace,separators=(',',':'))[:12000],
                            'providerTrace='+json.dumps(a.get('providerValueTrace') or [],separators=(',',':'))[:6000])
          PY

      - name: Upload V30 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v30-provider-shapes-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
