name: Check all manifests and publish Nuvio providers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - deep
  push:
    branches:
      - main
    paths:
      - ".github/triggers/deep-provider-repair"
  schedule:
    # Report-only compatibility audit on five days each week.
    - cron: "17 5 * * 0,1,3,4,6"
    # Strict publication audit every Tuesday and Friday.
    - cron: "47 4 * * 2,5"

permissions:
  contents: read

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  stage-and-test:
    name: Discover and validate all upstream providers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      validation_mode: ${{ steps.resolve-mode.outputs.validation_mode }}

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve validation mode
        id: resolve-mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE="deep"
          elif [ "${{ github.event.schedule }}" = "47 4 * * 2,5" ]; then
            MODE="deep"
          else
            MODE="quick"
          fi
          echo "validation_mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved validation mode: ${MODE}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned direct runtime dependencies without lifecycle scripts
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo '::warning::package-lock.json is absent; using pinned direct dependencies without lifecycle scripts.'
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Validate adaptive runtime modules
        run: |
          python -m py_compile scripts/adaptive_runtime/runtime_repair.py
          python -m py_compile scripts/provider_patches/adaptive_runtime_recovery.py
          python -m py_compile scripts/provider_patches/stream_output_sanitizer.py
          python -m py_compile scripts/run_adaptive_deep_repair.py
          python tests/adaptive_runtime_repair_test.py

      - name: Run repository regression tests
        run: npm test

      - name: Verify repository policy and provider semantics
        run: |
          python scripts/validate_policy.py
          python scripts/validate_settings_pipeline.py
          node scripts/validate_provider_semantics.cjs

      - name: Resolve official provider hubs and retain last-known-good routes
        shell: bash
        run: |
          MODE="${{ steps.resolve-mode.outputs.validation_mode }}"
          APPLY=()
          if [ "$MODE" = "deep" ]; then
            APPLY+=(--apply)
          fi
          python scripts/resolve_provider_hubs.py \
            "${APPLY[@]}" \
            --mode "$MODE" \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --output health-output/provider-hub-report.json

      - name: Discover every non-P2P provider with upstream and published fallbacks
        run: python scripts/discover_candidates.py --require-all-upstreams

      - name: Test DNS and locate validated alternative domains
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs \
            --stage staging \
            --output health-output/dns-preflight-report.json
          python scripts/apply_dns_migration_overrides.py \
            --stage staging \
            --report health-output/dns-preflight-report.json

      - name: Apply provider runtime profiles and exact overrides
        run: |
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/build_provider_runtime_profiles.py --stage staging --apply-stage
          python scripts/validate_override_pipeline.py --stage staging

      - name: Test provider access and repair failed routes
        shell: bash
        env:
          NUVIO_DNS_PREFLIGHT_RESULTS: health-output/dns-preflight-report.json
          NUVIO_WORKER_MEMORY_MB: "1024"
        run: |
          if [ "${{ steps.resolve-mode.outputs.validation_mode }}" = "deep" ]; then
            python scripts/run_adaptive_deep_repair.py --stage staging --output health-output --mode deep
            python scripts/validate_override_pipeline.py --stage staging
          else
            NUVIO_HEALTH_OUTPUT=health-output node scripts/health_check.mjs
            printf '%s\n' '{"schema_version":1,"mode":"quick","provider_specific_rules":false,"rounds":[],"accepted_repairs":0}' > health-output/repair-report.json
          fi

      - name: Validate deep harness evidence before publication
        if: steps.resolve-mode.outputs.validation_mode == 'deep'
        run: |
          python scripts/validate_deep_health_integrity.py \
            --health health-output/health-results.json \
            --repairs health-output/repair-report.json

      - name: Generate final diagnostics and route regressions
        run: |
          python scripts/generate_diagnostics.py --results health-output/health-results.json --output health-output
          python scripts/validate_route_overrides.py --results health-output/health-results.json --report health-output/route-regressions.json

      - name: Lock the final tested staging tree against modification
        run: |
          sudo chown -R root:root staging
          sudo chmod -R a-w staging

      - name: Lock generated validation result
        run: |
          sudo chown -R root:root health-output
          sudo chmod -R a-w health-output

      - name: Upload checked staging area
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvio-validation-stage-${{ github.run_id }}
          path: |
            staging/
            health-output/health-results.json
            health-output/dns-preflight-report.json
            health-output/diagnostics-report.json
            health-output/diagnostics-report.html
            health-output/route-regressions.json
            health-output/repair-report.json
            provider-overrides.json
            provider-domain-history.json
            health-output/provider-hub-report.json
            staging/upstream-lkg-pending.json
            staging/upstream-lkg-pending/
          retention-days: 2
          if-no-files-found: error

      - name: Explain report-only quick mode
        if: steps.resolve-mode.outputs.validation_mode == 'quick'
        run: |
          echo "Quick validation completed as report-only."
          echo "Only a deep validation may update provider files or manifest.json."

  publish:
    name: Apply strict validation and Nuvio runtime evidence
    needs: stage-and-test
    if: needs.stage-and-test.outputs.validation_mode == 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout current published repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for final provider validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned provider validation dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Download checked staging area
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-validation-stage-${{ github.run_id }}
          path: checked-artifact

      - name: Restore validated domain state and reapply published overrides
        run: |
          test -f checked-artifact/provider-overrides.json
          test -f checked-artifact/provider-domain-history.json
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/reapply_published_overrides.py

      - name: Apply strict gates, finite grace and exact runtime evidence
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_candidates.py

      - name: Finalize last-known-good snapshots of the three upstream repositories
        run: |
          test -f checked-artifact/staging/upstream-lkg-pending.json
          python scripts/finalize_upstream_lkg.py \
            --pending checked-artifact/staging/upstream-lkg-pending.json \
            --keep-generations 2

      - name: Remove stale content-hashed provider bundles
        run: python scripts/prune_unreferenced_providers.py

      - name: Verify overrides reached final published provider files
        run: python scripts/validate_published_overrides.py

      - name: Publish provider files and reports before the manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          if [ -f checked-artifact/health-output/repair-report.json ]; then
            cp checked-artifact/health-output/repair-report.json repair-report.json
          fi
          git add health-report.json health-history.json PROVENANCE.json dns-preflight-report.json provider-hub-report.json diagnostics-report.json diagnostics-report.html route-regressions.json provider-overrides.json provider-domain-history.json upstream-lkg.json upstream-lkg/
          if [ -f repair-report.json ]; then
            git add repair-report.json
          fi
          if [ -d providers ]; then
            git add -A providers
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: stage validated provider versions"
            test -f manifest.next.json
            cp manifest.next.json "$RUNNER_TEMP/manifest.next.json"
            git reset --hard HEAD
            git clean -fdx
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json
          else
            echo "No provider file or validation report change."
          fi

      - name: Publish the validated manifest in a second phase
        shell: bash
        run: |
          test -f manifest.next.json
          PREVIOUS_MANIFEST="$(mktemp)"
          git show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add manifest.json vf/manifest.json package.json package-lock.json sources.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json

          if git diff --cached --quiet; then
            echo "Manifest is unchanged."
            exit 0
          fi

          git commit -m "chore: publish Nuvio provider manifest"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  post-deep-hygiene:
    name: Consolidate repository automation after requested deep run
    needs:
      - stage-and-test
      - publish
    if: github.event_name == 'push' && needs.stage-and-test.outputs.validation_mode == 'deep' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      issues: write

    steps:
      - name: Mark hygiene pass started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body "Final repository hygiene pass started after successful deep validation."

      - name: Checkout latest published main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove superseded workflow campaigns, triggers and scratch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch -- \
            .github/workflows/audit-all-nuvio-tv-providers-v2.yml \
            .github/workflows/audit-all-nuvio-tv-providers.yml \
            .github/workflows/capture-target-player-pages.yml \
            .github/workflows/diagnose-provider-activation.yml \
            .github/workflows/export-nuvio-debug-context.yml \
            .github/workflows/extract-target-provider-routes-v3.yml \
            .github/workflows/interstellar-nuvio-matrix.yml \
            .github/workflows/latest-runs-compact.yml \
            .github/workflows/nuvio-tv-target-diagnostics-v2.yml \
            .github/workflows/promote-global-nuvio-tv-candidates.yml \
            .github/workflows/promote-target-media-v3.yml \
            .github/workflows/promote-vf-repairs.yml \
            .github/workflows/publish-desktop-runtime-compat.yml \
            .github/workflows/publish-immutable-desktop-runtime.yml \
            .github/workflows/publish-nuvio-tv-compat-v2.yml \
            .github/workflows/publish-nuvio-tv-compat.yml \
            .github/workflows/publish-stable-url-activation-refresh.yml \
            .github/workflows/publish-targeted-vf-adapters.yml \
            .github/workflows/quality-audit.yml \
            .github/workflows/reactivate-strict-main-providers.yml \
            .github/workflows/recover-nuvio-regressions-v2.yml \
            .github/workflows/recover-nuvio-regressions.yml \
            .github/workflows/repository-cleanup.yml \
            .github/workflows/restore-provider-activation.yml \
            .github/workflows/resume-publish.yml \
            .github/workflows/retry-unavailable.yml \
            .github/workflows/targeted-provider-route-diagnostics.yml \
            .github/workflows/validate-global-hls-repair.yml \
            .github/workflows/validate-nuvio-install-url.yml \
            .github/workflows/vf-provider-repair.yml \
            .github/triggers/action-run-index \
            .github/triggers/audit-all-nuvio-tv-providers \
            .github/triggers/audit-all-nuvio-tv-providers-v2 \
            .github/triggers/capture-target-player-pages \
            .github/triggers/export-nuvio-debug-context \
            .github/triggers/extract-target-provider-routes-v3 \
            .github/triggers/immutable-desktop-runtime \
            .github/triggers/interstellar-nuvio-matrix \
            .github/triggers/nuvio-tv-target-diagnostics-v2 \
            .github/triggers/promote-global-nuvio-tv-candidates \
            .github/triggers/promote-target-media-v3 \
            .github/triggers/promote-vf-repairs \
            .github/triggers/publish-desktop-runtime-compat \
            .github/triggers/publish-nuvio-tv-compat \
            .github/triggers/publish-nuvio-tv-compat-v2 \
            .github/triggers/publish-stable-url-activation-refresh \
            .github/triggers/publish-targeted-vf-adapters \
            .github/triggers/reactivate-strict-main-providers \
            .github/triggers/recover-nuvio-regressions \
            .github/triggers/repository-cleanup-v1 \
            .github/triggers/restore-provider-activation \
            .github/triggers/targeted-provider-route-diagnostics \
            .github/triggers/validate-nuvio-install-url \
            .github/triggers/vf-provider-repair \
            .github/cleanup-plan.md \
            automation/latest-runs.json \
            automation/interstellar-nuvio-matrix.json \
            automation/nuvio-tv-compat-v2-report.json \
            APPLY-NOTE.txt \
            DEEP-LOG-AUDIT-2026-08-03.md \
            DEEP-LOG-LINES-2026-08-03.csv \
            DEEP-REPAIR-LINES-2026-08-03.csv \
            DELETE_DEEP_FALSE_REPAIRS.txt \
            DELETE_THESE_FILES.txt \
            FILES-TO-UPDATE.txt \
            PR-NOTES-targeted-vf-repair.md \
            README-MISE-A-JOUR.txt \
            README-V5-SECTION.md \
            UPDATE-SUMMARY.json

      - name: Prune providers and synchronize release metadata
        run: |
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json

      - name: Assert final permanent surface and canonical Desktop sources
        run: |
          python - <<'PY'
          from pathlib import Path
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          assert workflows == sorted(['availability.yml','domain-refresh.yml','sync.yml','validate-desktop-runtime-compat.yml']), workflows
          triggers = sorted(path.name for path in Path('.github/triggers').iterdir() if path.is_file())
          assert triggers == sorted(['deep-provider-repair','domain-refresh']), triggers
          canonical = [
              'providers/coflix--nuvio--48239f7b107a98b2.js',
              'providers/frenchstream--nuvio--38cf074196379a8d.js',
              'providers/movix--nuvio--b31ef87b05d3a4f3.js',
              'providers/streamzo--nuvio--5ee8d74abe45cd42.js',
              'providers/flemmix--nuvio--e0c40c452aca0d66.js',
              'providers/wookafr--nuvio--4ce4c33e2fe1d23b.js',
              'providers/hindmoviez--aio--86b8c3a4dff3c98c.js',
              'providers/purstream--published-baseline--8e14e434a2868d4f.js',
          ]
          missing = [path for path in canonical if not Path(path).is_file()]
          assert not missing, missing
          print('permanent surface validated: 4 workflows, 2 triggers, 8 canonical Desktop sources')
          PY

      - name: Revalidate Desktop compatibility on cleaned tree
        run: python tests/desktop_runtime_compat_test.py

      - name: Re-run full regression suite on cleaned tree
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/post-deep-hygiene-regression.log"

      - name: Regenerate and validate final release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_activation_preservation.py
          python scripts/validate_vf_projection.py

      - name: Commit validated repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository hygiene already clean."
            exit 0
          fi
          git commit -m "chore: consolidate repository automation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            python scripts/sync_release_versions.py --manifest manifest.json
            python scripts/generate_release_hashes.py
            python scripts/validate_release_integrity.py
            python scripts/validate_activation_preservation.py
            python scripts/validate_vf_projection.py
            python - <<'PY'
          from pathlib import Path
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          assert workflows == sorted(['availability.yml','domain-refresh.yml','sync.yml','validate-desktop-runtime-compat.yml']), workflows
          triggers = sorted(path.name for path in Path('.github/triggers').iterdir() if path.is_file())
          assert triggers == sorted(['deep-provider-repair','domain-refresh']), triggers
          PY
            git add -A
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Mark final hygiene completed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body "Final deep validation and repository hygiene completed successfully: 4 permanent workflows, 2 triggers, synchronized lockfile, Desktop regression and full repository suite passed."

      - name: Mark final hygiene failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/post-deep-hygiene-failure.txt"
          printf '%s\n\n' 'Post-deep repository hygiene failed. No hygiene commit was published.' > "$report"
          if [ -f "$RUNNER_TEMP/post-deep-hygiene-regression.log" ]; then
            printf '%s\n' 'Regression tail:' >> "$report"
            printf '%s\n' '```text' >> "$report"
            tail -n 60 "$RUNNER_TEMP/post-deep-hygiene-regression.log" >> "$report"
            printf '%s\n' '```' >> "$report"
          fi
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file "$report"
