name: CORE - Provider Verify & Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options: [quick, deep]
  pull_request:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'vf/manifest.json'
      - 'no-anime/manifest.json'
      - 'vf-no-anime/manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'provider_catalog.json'
      - 'provider-hubs.json'
      - 'provider-type-policy.json'
      - 'scripts/provider_patches/**'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/verify_provider_v3_reverse_rebuild.py'
      - 'scripts/build_published_provider_stage.py'
      - 'scripts/build_observational_health_report.py'
      - 'scripts/resolve_provider_hubs.py'
      - 'scripts/health_check.mjs'
      - 'tests/**'
      - 'automation/provider-v3-architecture.json'
      - '.github/workflows/sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/triggers/deep-provider-verify'
      - '.github/workflows/sync.yml'
      - 'manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'provider-hubs.json'
      - 'scripts/provider_patches/**'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/verify_provider_v3_reverse_rebuild.py'
  schedule:
    - cron: '17 5 * * 0,1,3,4,6'
    - cron: '47 4 * * 2,5'

permissions:
  contents: read

concurrency:
  group: provider-v3-verify-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify published Provider v3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      validation_mode: ${{ steps.mode.outputs.validation_mode }}
      validated_sha: ${{ steps.sha.outputs.sha }}
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: mode
        shell: bash
        run: |
          MODE=quick
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "47 4 * * 2,5" ]; then MODE=deep; fi
          if [ -e .github/triggers/deep-provider-verify ]; then MODE=deep; fi
          echo "validation_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "FIELD_PROVIDER_VERIFY_MODE mode=$MODE repair=false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Provider v3 architecture
        run: |
          set -euo pipefail
          python tests/provider_v3_workflow_ownership_test.py
          python scripts/provider_base_store.py validate
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_brick_portfolio_audit_test.py
          python tests/provider_521_capability_regression_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_identity_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python scripts/verify_provider_v3_reverse_rebuild.py
      - name: Build exact published-provider observation stage
        run: python scripts/build_published_provider_stage.py --stage staging-published
      - name: Verify current domains and hubs without mutation
        run: |
          python scripts/resolve_provider_hubs.py             --mode "${{ steps.mode.outputs.validation_mode }}"             --include-disabled --workers 8 --timeout 8             --output health-output/provider-hub-report.json
          git diff --exit-code -- provider-overrides.json provider-domain-history.json providers provider-bases
      - name: Observe published providers
        shell: bash
        env:
          NUVIO_STAGE: staging-published
          NUVIO_CANDIDATES_PATH: staging-published/candidates.json
          NUVIO_HEALTH_OUTPUT: health-output
          NUVIO_HEALTH_RESULTS_FILENAME: health-results.json
          NUVIO_WORKER_MEMORY_MB: '1024'
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.validation_mode }}" = deep ]; then
            node scripts/health_check.mjs --deep
          else
            node scripts/health_check.mjs
          fi
          python scripts/build_observational_health_report.py             --results health-output/health-results.json             --manifest manifest.json             --output health-output/health-report.json
          python scripts/generate_diagnostics.py             --results health-output/health-results.json             --output health-output
          test -s health-output/health-report.json
          test -s health-output/diagnostics-report.json
      - name: Prove routine validation never mutates Provider v3
        run: |
          git diff --exit-code -- providers provider-bases provider-overrides.json provider_catalog.json provider-type-policy.json
          python scripts/verify_provider_v3_reverse_rebuild.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v3-observation-${{ github.run_id }}
          path: |
            health-output/health-results.json
            health-output/health-report.json
            health-output/provider-hub-report.json
            health-output/diagnostics-report.json
            health-output/diagnostics-report.html
          retention-days: 8
          if-no-files-found: error

  publish:
    name: Publish verified reports and manifest projections
    needs: verify
    if: ${{ github.event_name != 'pull_request' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    concurrency:
      group: provider-v3-report-publication-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Reject stale verification
        env:
          VALIDATED_SHA: ${{ needs.verify.outputs.validated_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: provider-v3-observation-${{ github.run_id }}
          path: checked-observation
      - name: Restore verified reports
        run: |
          cp checked-observation/health-report.json health-report.json
          cp checked-observation/provider-hub-report.json provider-hub-report.json
          cp checked-observation/diagnostics-report.json diagnostics-report.json
          cp checked-observation/diagnostics-report.html diagnostics-report.html
      - name: Reproject manifests on Deep only
        if: needs.verify.outputs.validation_mode == 'deep'
        run: |
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_language_projection.py
      - name: Verify no runtime/data mutation during publication
        run: |
          git diff --exit-code -- providers provider-bases provider-overrides.json provider_catalog.json provider-type-policy.json
          python scripts/verify_provider_v3_reverse_rebuild.py
      - name: Refresh integrity inventories
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Publish observation transaction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health-report.json provider-hub-report.json diagnostics-report.json diagnostics-report.html             FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if [ "${{ needs.verify.outputs.validation_mode }}" = deep ]; then
            git add vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json
          fi
          if git diff --cached --quiet; then
            echo "No report/manifest projection change."
            exit 0
          fi
          git commit -m "chore: publish Provider v3 ${{ needs.verify.outputs.validation_mode }} verification"
          git push origin HEAD:main
