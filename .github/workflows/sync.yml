name: Niakvio provider pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - deep
      phase:
        description: Pipeline phase
        required: true
        default: full
        type: choice
        options:
          - full
          - publish-only
      source_run_id:
        description: Successful P1 run id to reuse for publish-only
        required: false
        type: string
      source_sha:
        description: SHA validated by the successful P1 run
        required: false
        type: string
      source_mode:
        description: Validation mode of the reused P1 artifact
        required: false
        default: deep
        type: choice
        options:
          - quick
          - deep
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'provider_catalog.json'
      - 'tests/global_media_type_resolution_test.py'
      - 'tests/tmdb_media_type_resolution.test.mjs'
      - 'tests/native_media_type_resolution_test.py'
      - 'tests/canonical_media_types_test.py'
