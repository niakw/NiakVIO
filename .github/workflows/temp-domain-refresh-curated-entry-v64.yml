name: TEMP - Domain Refresh Curated Entry V64

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-domain-refresh-curated-entry-v64.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply curated-entry Domain Refresh source upgrade
        run: |
          set -euo pipefail
          python scripts/upgrade_domain_refresh_curated_entry_v64.py
          python tests/provider_hub_registry_test.py
          python tests/domain_refresh_curated_entry_redirect_test.py
          python tests/domain_refresh_transaction_guard_test.py
          python tests/domain_refresh_static_authority_test.py

      - name: Snapshot MoviesMod domain state
        run: |
          cp provider-overrides.json "$RUNNER_TEMP/provider-overrides.before.json"
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp provider-v3-materialization.json "$RUNNER_TEMP/materialization.before.json"
          cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static.before.json"
          cp PROVENANCE.json "$RUNNER_TEMP/provenance.before.json"

      - name: Resolve MoviesMod curated entry redirect live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health-output
          python scripts/domain_refresh_transaction_v2.py \
            --provider moviesmod --mode quick --timeout 15 --workers 1 --apply \
            --output health-output/v64-moviesmod-report.json \
            --changes-output health-output/v64-moviesmod-changes.json
          python - <<'PY'
          import json
          report=json.load(open('health-output/v64-moviesmod-report.json'))
          changes=json.load(open('health-output/v64-moviesmod-changes.json'))
          row=report['providers']['moviesmod']
          print('V64_MOVIESMOD_REPORT', json.dumps(row, sort_keys=True))
          assert row['status']=='site_authoritative', row
          assert row['authority_kind']=='curated_entry', row
          assert row['official_site'].rstrip('/')=='https://moviesmod.ai.in', row
          assert row['terminal_probe_skipped'] is False, row
          assert 'moviesmod' in changes.get('changed',[]), changes
          cfg=json.load(open('provider-overrides.json'))
          patch=cfg['provider_patches']['moviesmod']
          assert patch['official_site'].rstrip('/')=='https://moviesmod.ai.in', patch
          assert patch['runtime_domain_replacements'].get('moviesmod.zone')=='moviesmod.ai.in', patch
          print('V64_MOVIESMOD_CURATED_ENTRY_OK')
          PY

      - name: Reconcile targeted MoviesMod publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v64-moviesmod-changes.json --check
          python scripts/reconcile_provider_domain_metadata.py --rebuild --provider moviesmod
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v64-moviesmod-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/audit_provider_v3_static.py

      - name: Probe MoviesMod from promoted terminal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=40
          tasks,_=q.build_tasks()
          rows=[]
          for t in tasks:
              if str(t.get('provider_id') or '').casefold()!='moviesmod':
                  continue
              r=q.run(t); rows.append(r)
              print('V64_RUNTIME',json.dumps({k:r.get(k) for k in ['provider_id','semantic_type','status','debug_stage','raw','playable','verified','duration_ms','debug_fetches']},default=str,sort_keys=True))
          assert rows, 'moviesmod tasks missing'
          observed=[]
          for r in rows:
              for f in r.get('debug_fetches') or []:
                  u=str(f.get('url') or '')
                  if 'moviesmod.' in u: observed.append(u)
          assert any('moviesmod.ai.in' in u for u in observed), observed
          assert not any('moviesmod.zone' in u for u in observed), observed
          print('V64_RUNTIME_DOMAIN_OK')
          PY

      - name: Persist source and MoviesMod domain repair only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_exact={
            'scripts/resolve_provider_hubs.py',
            'scripts/refresh_authoritative_hub_domains.py',
            'scripts/domain_refresh_transaction_v2.py',
            'tests/provider_hub_registry_test.py',
            'tests/domain_refresh_curated_entry_redirect_test.py',
            'provider-overrides.json','provider-hubs.json','provider-domain-history.json',
            'manifest.json','provider-v3-materialization.json','automation/provider-v3-static-knowledge.json','PROVENANCE.json',
          }
          changed=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              changed.append(p)
          bad=[p for p in changed if p not in allowed_exact and not p.startswith('providers/moviesmod') and not p.startswith('health-output/')]
          if bad: raise SystemExit('V64_UNEXPECTED_DIFF '+repr(bad))
          print('V64_CHANGED', changed)
          PY
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/resolve_provider_hubs.py scripts/refresh_authoritative_hub_domains.py scripts/domain_refresh_transaction_v2.py \
            tests/provider_hub_registry_test.py tests/domain_refresh_curated_entry_redirect_test.py \
            provider-overrides.json provider-hubs.json provider-domain-history.json manifest.json provider-v3-materialization.json \
            automation/provider-v3-static-knowledge.json PROVENANCE.json 'providers/moviesmod'*.js
          if git diff --cached --quiet; then
            echo 'V64_PERSIST no material changes'
            exit 0
          fi
          git commit -m 'fix(domains): follow curated entry redirects'
          git push origin HEAD:fix/non-display-recovery-20260916
