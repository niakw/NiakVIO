name: TEMP - regression pair Lego proof

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths:
      - scripts/upgrade_regression_pair_legos_v1.py
      - .github/workflows/temp-regression-pair-lego-proof.yml

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage pair and materialize without minimizer
        run: |
          set -euo pipefail
          python3 scripts/upgrade_regression_pair_legos_v1.py
          python3 scripts/materialize_provider_v3_one.py animevostfr
          python3 scripts/materialize_provider_v3_one.py kurage
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/provider_v3_final_stage_minimizer_gate_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py

      - name: Exact same-work regression proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p

          cases=[
            ('animevostfr','movie',{'slug':'superman-2025','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025}),
            ('animevostfr','anime',{'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
            ('kurage','anime',{'slug':'high-school-of-the-dead-2010-s01e01','tmdbId':'56998','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'High School of the Dead','year':2010}),
          ]
          cat=p.local_catalog(); out=[]; failures=[]
          for pid,lane,f in cases:
            r=p.run_worker(cat[pid]['path'],f,55)
            row={'provider':pid,'lane':lane,'fixture':f['slug'],'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('http_statuses') or [],'accessible':r.get('server_accessible'),'success':r.get('server_success'),'error':r.get('error_class'),'timeout':r.get('timeout')}
            out.append(row); print('REGRESSION_PAIR_EXACT '+json.dumps(row,ensure_ascii=False,separators=(',',':')))
            if row['streams']<=0: failures.append(pid+':'+lane)
          Path('automation/regression-pair-exact-proof.json').write_text(json.dumps({'cases':out},ensure_ascii=False,indent=2)+'\n')
          if failures: raise SystemExit('exact regression proof failed: '+','.join(failures))
          PY

      - name: Full recent reserve parity for pair
        run: |
          set -euo pipefail
          python3 scripts/run_provider_upstream_parity_v3.py \
            --provider animevostfr --provider kurage \
            --samples-per-lane 32 --workers 2 --timeout 25 \
            --seed 20260913-regression-pair \
            --out automation/regression-pair-parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/regression-pair-parity.json').read_text())
          bad=[]
          for p in d.get('providers') or []:
            for lane in p.get('lanes') or []:
              if lane.get('status')=='REGRESSION': bad.append(f"{p.get('providerId')}:{lane.get('lane')}")
          print('REGRESSION_PAIR_PARITY '+json.dumps({'summary':d.get('summary'),'bad':bad},separators=(',',':')))
          if bad: raise SystemExit('certain parity regression remains: '+','.join(bad))
          PY

      - name: Promote only after exact and parity proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json'); d=json.loads(p.read_text()); rows=d['provider_patches']
          proved={'animevostfr':['movie','anime'],'kurage':['anime']}
          for pid,lanes in proved.items():
            r=rows[pid]; r['route_data_state']='on'; disp=r.get('repair_disposition')
            if not isinstance(disp,dict): disp={};r['repair_disposition']=disp
            disp.update({'routeDataState':'on','currentVerifiedLanes':lanes,'provenLanes':lanes,'missingLanes':[],'completeCapabilityProof':True,'recoveryStatus':'current-provider-lego-stream-positive','terminalState':None,'quarantined':False,'reasonCodes':['exact_regression_recovered','full32_no_certain_regression']})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 scripts/materialize_provider_v3_one.py animevostfr
          python3 scripts/materialize_provider_v3_one.py kurage
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py

      - name: Reconfirm exact cases after promotion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          cases=[
            ('animevostfr',{'tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025}),
            ('animevostfr',{'tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
            ('kurage',{'tmdbId':'56998','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'High School of the Dead','year':2010}),
          ]
          cat=p.local_catalog()
          for pid,f in cases:
            r=p.run_worker(cat[pid]['path'],f,55); n=int(r.get('stream_count') or 0)
            print(f'REGRESSION_PAIR_RECONFIRM provider={pid} lane={f["mediaType"]} streams={n}')
            if n<=0: raise SystemExit(pid+' lost exact positive after promotion')
          PY

      - name: Record durable evidence and commit one transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          exact=json.loads(Path('automation/regression-pair-exact-proof.json').read_text())
          parity=json.loads(Path('automation/regression-pair-parity.json').read_text())
          m=Path('MEMORY.md'); t=m.read_text(encoding='utf-8')
          marker='## 2026-09-13 — full32 regression wave: AnimeVOSTFR + Kurage recovered'
          if marker not in t:
            t += f'''\n{marker}\n\n- The current full32 regressions for AnimeVOSTFR (movie+anime) and Kurage (anime) were composition regressions: their NiakVIO-owned current-contract Legos existed but were absent from current provider DATA.\n- Restored `animevostfr_runtime_v1.py` and `kurage_runtime_v1.py` as provider-specific Legos only; Core ownership was unchanged and workspace materialization did not minimize.\n- Exact same-work proof after materialization: `{json.dumps(exact,ensure_ascii=False)}`.\n- Recent-reserve parity after repair has no certain `upstream_ok_niakvio_ko`: summary `{json.dumps(parity.get('summary'),ensure_ascii=False)}`.\n'''
            m.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json manifest.json providers/ vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json automation/regression-pair-exact-proof.json automation/regression-pair-parity.json scripts/upgrade_regression_pair_legos_v1.py MEMORY.md
          git commit -m 'fix(regressions): recover AnimeVOSTFR and Kurage'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
