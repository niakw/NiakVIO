name: Publish stable URL activation refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-stable-url-activation-refresh.yml"
      - ".github/triggers/publish-stable-url-activation-refresh"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bootstrap stable URL activation identities
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/nuvio_client_activation_ids.py --bootstrap-active
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('?activation-profile=niakvio-v2-vf', '')
          text = text.replace('?activation-profile=niakvio-v2', '')
          text = text.replace(
              "Cette URL utilise une nouvelle identité d’installation Nuvio afin d’appliquer correctement l’état d’activation publié par Niakvio. Le contenu et les chemins des bundles restent ceux du manifest principal.\n\n",
              "",
          )
          text = text.replace(
              "1. Supprimez l’ancienne entrée Niakvio si elle est encore installée.\n2. Copiez l’URL du manifest souhaité ci-dessus, y compris le paramètre `activation-profile`.\n3. Ouvrez **Nuvio**.\n4. Accédez à **Plugins / Providers**.\n5. Ajoutez ou importez l’URL, puis validez.\n\n> Nuvio conserve les activations choisies pour une identité de manifest existante. Le paramètre `activation-profile=niakvio-v2` force une identité neuve et applique les activations actuelles du manifest.",
              "1. Copiez l’URL stable du manifest souhaité.\n2. Ouvrez **Nuvio**.\n3. Accédez à **Plugins / Providers**.\n4. Ajoutez ou importez l’URL.\n5. Les mises à jour suivantes s’appliquent avec le bouton d’actualisation, sans changement de lien.\n\n> Lorsqu’un provider passe de désactivé à activé, Niakvio révise automatiquement son identifiant client interne afin que Nuvio applique l’activation au prochain rafraîchissement.",
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json

      - name: Validate stable URL and VF projection
        run: |
          python tests/nuvio_activation_refresh_test.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_vf_projection.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = manifest.get('scrapers', [])
          enabled = [row for row in rows if row.get('enabled') is True]
          assert len(rows) == 89, len(rows)
          assert len(enabled) == 62, len(enabled)
          assert all(str(row.get('id') or '').isupper() for row in enabled), [row.get('id') for row in enabled if not str(row.get('id') or '').isupper()]
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'manifest.json?activation-profile=' not in readme
          assert 'vf/manifest.json?activation-profile=' not in readme
          print(f'stable URL activation assertions passed: version={manifest.get("version")}, enabled={len(enabled)}')
          PY

      - name: Run complete regression suite
        run: npm test

      - name: Regenerate and validate release
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py

      - name: Publish stable URL refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manifest.json vf/manifest.json package.json sources.json \
            nuvio-client-id-state.json scripts/nuvio_client_activation_ids.py \
            scripts/sync_release_versions.py scripts/validate_vf_projection.py \
            tests/nuvio_activation_refresh_test.py \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: refresh activations through the stable manifest URL"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
