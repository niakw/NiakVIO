name: TEMP - Residual Ledger V50B

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-residual-ledger-v50b.yml']

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
      - name: Current repair ledger
        run: |
          python - <<'PY'
          import json
          d=json.load(open('provider-overrides.json',encoding='utf-8'))
          rows=[]
          for pid,p in sorted((d.get('provider_patches') or {}).items()):
              if not isinstance(p,dict): continue
              r=p.get('repair_disposition') if isinstance(p.get('repair_disposition'),dict) else {}
              miss=[str(x) for x in r.get('missingLanes') or [] if str(x)]
              if miss:
                  row={'provider':pid,'missing':miss,'required':r.get('requiredLanes') or [],'proven':r.get('provenLanes') or [],'state':r.get('routeDataState'),'status':r.get('recoveryStatus'),'terminal':r.get('terminalState'),'quarantined':r.get('quarantined'),'reasons':r.get('reasonCodes') or [],'official_site':p.get('official_site'),'official_api':p.get('official_api'),'capability':p.get('capability')}
                  rows.append(row)
          print('CURRENT_RESIDUAL_SUMMARY providers=%d lanes=%d' % (len(rows),sum(len(r['missing']) for r in rows)))
          for row in rows: print('CURRENT_RESIDUAL '+json.dumps(row,sort_keys=True))
          PY
