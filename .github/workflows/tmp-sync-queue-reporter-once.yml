name: TEMP - Sync queue reporter once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sync-queue-reporter-once.yml'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Report queue and self-delete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml --limit 8 --json databaseId,event,headSha,status,conclusion,displayTitle,createdAt)
          COMPACT=$(printf '%s' "$DATA" | jq -c '.')
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "SYNC_QUEUE_REPORT data=${COMPACT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-sync-queue-reporter-once.yml
          git commit -m 'chore: remove sync queue reporter [skip ci]'
          git push origin HEAD:main
