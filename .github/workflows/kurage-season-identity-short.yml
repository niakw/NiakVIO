name: SHORT - Kurage Season Identity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/provider_patches/kurage_runtime_v1.py'
      - 'tests/kurage_season_identity_test.py'
      - '.github/workflows/kurage-season-identity-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-short-kurage-season
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile
        run: python3 -m py_compile scripts/provider_patches/kurage_runtime_v1.py tests/kurage_season_identity_test.py
      - name: Season identity contract
        run: python3 tests/kurage_season_identity_test.py
