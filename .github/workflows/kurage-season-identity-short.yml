name: SHORT - Kurage Season Identity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/provider_patches/kurage_runtime_v1.py'
      - 'tests/kurage_season_identity_test.py'
      - '.github/workflows/kurage-season-identity-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-short-kurage-season
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile
        run: python3 -m py_compile scripts/provider_patches/kurage_runtime_v1.py tests/kurage_season_identity_test.py
      - name: Season identity contract
        run: python3 tests/kurage_season_identity_test.py
