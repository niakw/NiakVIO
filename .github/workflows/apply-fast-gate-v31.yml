name: Apply Fast Gate V31

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/apply-fast-gate-v31.yml'
      - 'scripts/migrate_fast_gate_provisional_v31.py'
      - 'scripts/provider_patches/global_media_type_resolution_v1.py'
      - 'scripts/build_provider_history_matrix_v3.py'
      - 'tests/global_media_type_pre_network_gate_test.py'
      - 'tests/provider_non_regression_contract_test.py'

permissions:
  contents: write

concurrency:
  group: apply-fast-gate-v31-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workbench/systemic-recovery-20260909
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Security policy preflight
        run: python tests/workflow_security_policy_test.py
      - name: Apply deterministic provisional fast gate
        run: |
          set -euo pipefail
          python scripts/migrate_fast_gate_provisional_v31.py
          python -m py_compile \
            scripts/provider_patches/global_media_type_resolution_v1.py \
            scripts/build_provider_history_matrix_v3.py \
            scripts/migrate_fast_gate_provisional_v31.py \
            tests/global_media_type_pre_network_gate_test.py \
            tests/provider_non_regression_contract_test.py
      - name: Validate media-type fast gate
        run: |
          set -euo pipefail
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_media_type_resolution_test.py
          python tests/episodic_year_identity_regression_test.py
      - name: Validate four-version canonical semantic floor
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/build_provider_history_matrix_v3.py
          python scripts/check_provider_non_regression_v1.py
          python tests/provider_non_regression_contract_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('automation/provider-history-matrix.json').read_text(encoding='utf-8'))
          false_legacy={'animekai','animeworld'} & set(data.get('contractRegressionProviders') or [])
          if false_legacy:
              raise SystemExit('historical transport aliases still block semantic floor: '+','.join(sorted(false_legacy)))
          print('HISTORY_V3_SEMANTIC_FLOOR historical_transport_aliases=nonblocking')
          PY
      - name: Commit migrated fast-gate source on workbench only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- scripts/provider_patches/global_media_type_resolution_v1.py; then
            echo 'FAST_GATE_SOURCE_COMMIT changed=false'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider_patches/global_media_type_resolution_v1.py
          git commit -m 'fix(core): reject semantic mismatch before provider network'
          git push origin HEAD:workbench/systemic-recovery-20260909
