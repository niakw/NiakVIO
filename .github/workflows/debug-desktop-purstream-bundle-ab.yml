name: Debug Desktop Purstream bundle A/B

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-bundle-ab.yml"

permissions:
  contents: read

jobs:
  purstream-bundle-ab:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage current and pre-Brain Purstream bundles
        shell: bash
        run: |
          set -euxo pipefail
          current_path="$(python3 - <<'PY'
          import json
          data=json.load(open("niakvio/manifest.json", encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          print(row["filename"])
          PY
          )"
          cp "niakvio/$current_path" "$GITHUB_WORKSPACE/purstream-current.js"

          pre="af650c2d93137df85557a486406baa42b73bf589"
          git -C niakvio fetch --quiet --no-tags origin "$pre"
          git -C niakvio show "$pre:manifest.json" > "$GITHUB_WORKSPACE/pre-manifest.json"
          legacy_path="$(python3 - <<'PY'
          import json
          data=json.load(open("pre-manifest.json", encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          print(row["filename"])
          PY
          )"
          git -C niakvio show "$pre:$legacy_path" > "$GITHUB_WORKSPACE/purstream-pre-brain.js"
          test -s "$GITHUB_WORKSPACE/purstream-current.js"
          test -s "$GITHUB_WORKSPACE/purstream-pre-brain.js"
          echo "FIELD_DESKTOP_PURSTREAM_BUNDLE_PATH current=$current_path pre_brain=$legacy_path"

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Trace Desktop native HTTP in disposable checkout
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("nuvio-desktop/composeApp/src/desktopMain/kotlin/com/nuvio/app/features/addons/AddonPlatform.desktop.kt")
          s=p.read_text()
          if "import java.io.File" not in s:
              s=s.replace("import java.io.ByteArrayOutputStream", "import java.io.ByteArrayOutputStream\nimport java.io.File")
          old='''    client.newCall(request).execute().use { response ->
        RawHttpResponse(
            status = response.code,
            statusText = response.message,
            url = response.request.url.toString(),
            body = readResponseBodyLimited(response.body, maxResponseBodyBytes),
            headers = response.headers.toMultimap().mapValues { (_, values) ->
                values.joinToString(",")
            }.mapKeys { (name, _) ->
                name.lowercase()
            },
        )
    }
'''
          new='''    val traceFile = System.getenv("NIAKVIO_NATIVE_FETCH_TRACE_FILE")?.takeIf { it.isNotBlank() }?.let(::File)
    runCatching { traceFile?.appendText("START\\t" + method + "\\t" + url + "\\n") }
    try {
        client.newCall(request).execute().use { response ->
            val responseBody = readResponseBodyLimited(response.body, maxResponseBodyBytes)
            runCatching {
                traceFile?.appendText(
                    "RESULT\\t" + method + "\\t" + response.code + "\\t" +
                        response.request.url.toString() + "\\t" +
                        responseBody.take(320).replace("\\n", " ").replace("\\r", " ") + "\\n"
                )
            }
            RawHttpResponse(
                status = response.code,
                statusText = response.message,
                url = response.request.url.toString(),
                body = responseBody,
                headers = response.headers.toMultimap().mapValues { (_, values) ->
                    values.joinToString(",")
                }.mapKeys { (name, _) ->
                    name.lowercase()
                },
            )
        }
    } catch (t: Throwable) {
        runCatching {
            traceFile?.appendText(
                "ERROR\\t" + method + "\\t" + url + "\\t" +
                    (t::class.simpleName ?: "Throwable") + "\\t" +
                    (t.message ?: "").replace("\\n", " ").replace("\\r", " ") + "\\n"
            )
        }
        throw t
    }
'''
          if s.count(old)!=1:
              raise SystemExit("httpRequestRaw target block not found exactly once")
          p.write_text(s.replace(old,new))
          PY
          git -C nuvio-desktop diff --check

      - name: Install focused bundle A/B test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamBundleAbTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamBundleAbTest {
              @Test
              fun comparePurstreamBundles() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  suspend fun run(label: String, file: String): Int {
                      val started = System.currentTimeMillis()
                      val rows = PluginRuntime.executePlugin(
                          code = File(workspace, file).readText(),
                          tmdbId = "157336",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = "PURSTREAM",
                      )
                      val elapsed = System.currentTimeMillis() - started
                      println("FIELD_DESKTOP_PURSTREAM_BUNDLE_AB label=" + label + " count=" + rows.size + " duration_ms=" + elapsed)
                      return rows.size
                  }

                  val current1 = run("current_1", "purstream-current.js")
                  val preBrain = run("pre_brain", "purstream-pre-brain.js")
                  val current2 = run("current_2", "purstream-current.js")
                  File(workspace, "purstream-bundle-ab.txt").writeText(
                      "current_1=" + current1 + "\npre_brain=" + preBrain + "\ncurrent_2=" + current2 + "\n"
                  )
              }
          }
          KOTLIN

      - name: Execute bundle A/B on macOS Desktop runtime
        shell: bash
        env:
          NIAKVIO_NATIVE_FETCH_TRACE_FILE: ${{ github.workspace }}/purstream-native-http-trace.txt
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamBundleAbTest'             --no-build-cache --no-configuration-cache --console=plain
          cat "$GITHUB_WORKSPACE/purstream-bundle-ab.txt"
          echo "===== FIELD_DESKTOP_NATIVE_HTTP_TRACE ====="
          cat "$GITHUB_WORKSPACE/purstream-native-http-trace.txt" || true

      - name: Classify bundle regression
        shell: bash
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/purstream-bundle-ab.txt"
          echo "FIELD_DESKTOP_PURSTREAM_BUNDLE_AB_SUMMARY current_1=$current_1 pre_brain=$pre_brain current_2=$current_2"
          if [[ "$current_1" -eq 0 && "$pre_brain" -gt 0 && "$current_2" -eq 0 ]]; then
            echo "FIELD_DESKTOP_PURSTREAM_BUNDLE_AB_CAUSE cause=post_brain_bundle_regression"
            exit 0
          fi
          echo "FIELD_DESKTOP_PURSTREAM_BUNDLE_AB_CAUSE cause=not_proven"
          exit 1
