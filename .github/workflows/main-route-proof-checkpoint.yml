name: MAIN - Route Proof Durable Checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-route-proof-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-route-proof-memory-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Persist TV runtime regression checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_memory_tv_runtime_checkpoint.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/main-route-proof-checkpoint.yml scripts/tmp_memory_tv_runtime_checkpoint.py
          git add MEMORY.md
          git commit -m 'docs: checkpoint TV cancellation and quality regression'
          git push origin HEAD:main
