name: Provider Disabled Lifecycle
# provider-authority-policy-v1

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - '.github/workflows/provider-disabled-lifecycle.yml'
      - '.github/triggers/provider-disabled-lifecycle'
      - 'automation/provider-census-status.json'
      - 'scripts/classify_provider_authority.py'
      - 'scripts/manage_provider_lifecycle.py'
      - 'scripts/current_provider_scope.py'
      - 'tests/provider_authority_arbiter_test.py'
      - 'tests/provider_authority_current_catalogue_test.py'
      - 'tests/provider_route_reconstructor_test.py'
      - 'tests/provider_disabled_lifecycle_contract_test.py'
      - 'tests/provider_language_manifest_vf_only_test.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-disabled-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Apply active-disabled-archive lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classify_provider_authority.py --apply-safe-disables
          python scripts/manage_provider_lifecycle.py --apply
          python -m py_compile scripts/manage_provider_lifecycle.py scripts/current_provider_scope.py scripts/classify_provider_authority.py
          python tests/provider_authority_arbiter_test.py
          python tests/provider_authority_current_catalogue_test.py
          python tests/provider_domain_authority_memory_test.py
          python tests/provider_v3_local_recognition_contract_test.py
          python tests/provider_disabled_lifecycle_contract_test.py
          python tests/provider_language_manifest_vf_only_test.py
          python scripts/audit_provider_v3_static.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root=Path.cwd()
          sys.path.insert(0, str((root/'scripts').resolve()))
          from current_provider_scope import (
              active_provider_count,
              active_provider_ids,
              disabled_provider_count,
              disabled_provider_ids,
              visible_provider_count,
              audit_projection_scope,
              pending_provider_ids,
          )
          from manage_provider_lifecycle import lifecycle_catalog_rows, rows_by_id

          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          vf_manifest=json.loads((root/'vf/manifest.json').read_text(encoding='utf-8'))
          root_rows=rows_by_id(manifest)
          vf_rows=rows_by_id(vf_manifest)
          catalog_rows=lifecycle_catalog_rows(root_rows, root=root)

          # current_provider_scope remains the Global runtime scope; prove that
          # contract separately from lifecycle's full Global + France-only union.
          manifest_active={pid for pid,row in root_rows.items() if row.get('enabled') is not False}
          manifest_disabled={pid for pid,row in root_rows.items() if row.get('enabled') is False}
          assert active_provider_ids() == manifest_active
          assert disabled_provider_ids() == manifest_disabled
          assert visible_provider_count() == active_provider_count() + disabled_provider_count()

          vf_only=set(vf_rows)-set(root_rows)
          catalog_vf_only=set(catalog_rows)-set(root_rows)
          assert vf_only == catalog_vf_only, (sorted(vf_only), sorted(catalog_vf_only))
          assert set(catalog_rows) == set(root_rows) | vf_only
          scope=audit_projection_scope(root)
          assert scope['union_visible'] == len(catalog_rows), (scope,len(catalog_rows))

          active_union={pid for pid,row in catalog_rows.items() if row.get('enabled') is not False}
          disabled_union={pid for pid,row in catalog_rows.items() if row.get('enabled') is False}
          visible_ids=active_union | disabled_union
          pending_union=pending_provider_ids() & visible_ids
          assert pending_union <= disabled_union, (sorted(pending_union), sorted(disabled_union))
          runtime_visible_ids=visible_ids - pending_union

          knowledge=json.loads((root/'automation/provider-v3-static-knowledge.json').read_text(encoding='utf-8'))
          materialization=json.loads((root/'provider-v3-materialization.json').read_text(encoding='utf-8'))
          knowledge_ids={str(value).strip().casefold().replace('_','-') for value in (knowledge.get('providers') or {})}
          assert knowledge_ids == runtime_visible_ids, (sorted(knowledge_ids-runtime_visible_ids), sorted(runtime_visible_ids-knowledge_ids))
          assert int(knowledge.get('providerCount') or 0) == len(runtime_visible_ids)
          for section in ('contractRecognition','routeReconstruction','routeRecovery'):
              row=knowledge.get(section)
              if isinstance(row,dict) and 'providerCount' in row:
                  assert int(row.get('providerCount') or 0) == len(runtime_visible_ids), (section,row.get('providerCount'),len(runtime_visible_ids))
          materialization_ids={str(row.get('provider') or '').strip().casefold().replace('_','-') for row in materialization.get('providers') or [] if isinstance(row,dict)}
          assert materialization_ids == runtime_visible_ids, (sorted(materialization_ids-runtime_visible_ids), sorted(runtime_visible_ids-materialization_ids))
          assert int(materialization.get('providerCount') or 0) == len(runtime_visible_ids)
          assert int(materialization.get('expectedProviderCount') or len(runtime_visible_ids)) == len(runtime_visible_ids)
          assert int(materialization.get('activeProviderIdentityCount') or 0) == len(active_union)
          assert int(materialization.get('staticKnowledgeProviderCount') or 0) == len(runtime_visible_ids)

          for pid,row in root_rows.items():
              filename=str(row.get('filename') or '')
              if row.get('enabled') is False:
                  assert filename.startswith('provider-disabled/'), (pid, filename)
                  if pid in pending_union:
                      assert not row.get('disabledAt') and not row.get('purgeAfter'), (pid,row)
                  else:
                      assert row.get('disabledAt') and row.get('purgeAfter')
              else:
                  assert filename.startswith('providers/'), (pid, filename)

          print(
              'PROVIDER_DIRECTORY_CONTRACT_OK',
              f'global_active={len(manifest_active)}',
              f'global_disabled={len(manifest_disabled)}',
              f'union_active={len(active_union)}',
              f'union_disabled={len(disabled_union)}',
              f'pending={len(pending_union)}',
              f'runtime_visible={len(runtime_visible_ids)}',
              f'vf_only={len(vf_only)}',
          )
          PY
          git diff --check

      - name: Commit lifecycle transition if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            manifest-hub46.json native-hub46/manifest.json provider_catalog.json \
            automation/provider-disabled-lifecycle.json automation/provider-authority-status.json \
            automation/provider-v3-static-knowledge.json provider-v3-materialization.json \
            provider-overrides.json provider-hubs.json providers provider-disabled provider-bases provider-old
          if git diff --cached --quiet; then
            echo PROVIDER_LIFECYCLE_NO_CHANGE
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore: apply provider disabled retention lifecycle'
          transition_sha="$(git rev-parse HEAD)"
          git push origin HEAD:${{ github.ref_name }}
          gh workflow run release-finalize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f expected_sha="$transition_sha"
          echo "FIELD_PROVIDER_LIFECYCLE_RELEASE_FINALIZE_DISPATCH sha=$transition_sha"
