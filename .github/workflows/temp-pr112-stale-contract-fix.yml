name: TEMP - PR112 Stale Contract Fix

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-pr112-stale-contract-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply contract corrections
        run: |
          set -euo pipefail
          python scripts/temp_fix_pr112_stale_contracts.py
          python -m py_compile scripts/check_provider_non_regression_v1.py tests/provider_non_regression_contract_test_impl.py tests/native_evidence_codegen_pipeline_test.py
      - name: Validate non-regression contract
        run: |
          set -euo pipefail
          python tests/provider_non_regression_contract_test.py
          python scripts/check_provider_non_regression_v1.py
      - name: Validate native evidence codegen pipeline
        run: |
          set -euo pipefail
          python tests/native_evidence_codegen_pipeline_test.py
      - name: Revalidate exact hub46 activation
        run: |
          set -euo pipefail
          python scripts/validate_activation_preservation.py
          python - <<'PY'
          import json
          m=json.load(open('manifest.json',encoding='utf-8'))
          assert sum(r.get('enabled') is True for r in m['scrapers'])==46
          assert sum(r.get('enabled') is False for r in m['scrapers'])==50
          print('HUB46_STILL_EXACT enabled=46 disabled=50')
          PY
      - name: Commit corrections and clean one-shot files
        run: |
          set -euo pipefail
          rm -f scripts/temp_fix_pr112_stale_contracts.py .github/workflows/temp-pr112-stale-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): align gates with exact hub46 activation'
          git push origin HEAD:workbench/hub-matrix-46-20260911
