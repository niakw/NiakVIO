name: TEMP - Fix Stream Identity Test Revision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-stream-identity-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Update stale identity revision assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/global_stream_identity_test.py')
          t = p.read_text(encoding='utf-8')
          old = 'cross-client-shared-tv-year-soft-v8'
          new = 'cross-client-shared-core-tmdb-v9'
          count = t.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale revision assertions, got {count}')
          p.write_text(t.replace(old, new), encoding='utf-8')
          PY
          python tests/global_stream_identity_test.py
      - name: Commit test contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/global_stream_identity_test.py
          git commit -m 'test: align stream identity revision contract with current Core'
          git push origin HEAD:main
