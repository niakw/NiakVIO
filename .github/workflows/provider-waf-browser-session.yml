name: Provider WAF Browser Session Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-waf-browser-session.yml'
      - '.github/triggers/provider-waf-browser-session.json'
      - 'scripts/probe_waf_browser_session.py'
      - 'scripts/render_provider_census_status_from_state.py'
      - 'scripts/merge_waf_census_transport.py'
      - 'scripts/merge_waf_network_profiles.py'
      - 'scripts/merge_residential_provider_replay.py'
      - 'scripts/select_residential_provider_replay.py'
      - 'scripts/audit_provider_quick_yield_targeted.py'
      - 'tests/waf_census_transport_merge_test.py'
      - 'tests/provider_waf_census_markdown_sync_test.py'
      - 'tests/provider_waf_browser_session_test.py'
      - 'tests/provider_waf_okhttp_profile_test.py'
      - 'tests/provider_waf_tailscale_exit_contract_test.py'
      - 'tests/waf_residential_profile_merge_test.py'
      - 'tests/residential_provider_replay_summary_test.py'
      - 'tests/targeted_quick_yield_canonical_cli_test.py'
      - 'tests/residential_provider_replay_selection_test.py'
      - 'tools/waf-okhttp-probe/**'

permissions:
  contents: write
  id-token: write

concurrency:
  group: provider-census-waf-main
  # Census persistence and the transport overlay share one repository-wide
  # serialization lane. Never let a later census erase fresher residential evidence.
  cancel-in-progress: false

jobs:
  browser-session:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Build NuvioTV-policy OkHttp diagnostic helper
        run: mvn -q -f tools/waf-okhttp-probe/pom.xml -DskipTests package

      - name: Validate ordinary-browser diagnostic contract
        run: python tests/provider_waf_browser_session_test.py

      - name: Validate NuvioTV-policy OkHttp diagnostic contract
        run: python tests/provider_waf_okhttp_profile_test.py

      - name: Validate transport-only census merge contract
        run: python tests/waf_census_transport_merge_test.py

      - name: Validate WAF census Markdown synchronization contract
        run: python tests/provider_waf_census_markdown_sync_test.py

      - name: Validate Tailscale residential-exit diagnostic contract
        run: |
          python tests/provider_waf_tailscale_exit_contract_test.py
          python tests/waf_residential_profile_merge_test.py
          python tests/residential_provider_replay_selection_test.py
          python tests/residential_provider_replay_summary_test.py
          python tests/targeted_quick_yield_canonical_cli_test.py

      - name: Normalize private Tailscale CI tag
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"


      - name: Inspect bounded GitHub OIDC claims
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_audience="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TS_AUDIENCE"], safe=""))')"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          export OIDC_TOKEN
          python -c 'import base64,json,os; token=os.environ.pop("OIDC_TOKEN"); parts=token.split("."); assert len(parts)>=2, "invalid GitHub OIDC token shape"; raw=parts[1]+"="*(-len(parts[1])%4); claims=json.loads(base64.urlsafe_b64decode(raw.encode()).decode()); allowed=("iss","sub","repository","repository_owner","repository_visibility","ref","ref_type","workflow","workflow_ref","job_workflow_ref","event_name"); safe={k:str(claims.get(k) or "") for k in allowed if claims.get(k) is not None}; print("FIELD_TAILSCALE_GITHUB_OIDC_CLAIMS "+json.dumps(safe,sort_keys=True))'
          unset response OIDC_TOKEN encoded_audience

      - name: Connect ephemeral Tailscale diagnostic node
        id: tailscale_connect
        continue-on-error: true
        timeout-minutes: 4
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Reprobe persisted WAF lanes on GitHub-hosted network
        shell: bash
        run: |
          set -euo pipefail
          test -s automation/provider-waf-browser-session-latest.json
          python scripts/probe_waf_browser_session.py \
            automation/provider-waf-browser-session-latest.json \
            --output /tmp/provider-waf-github.json \
            --attempts 2 \
            --client-profile-matrix \
            --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*' \
            --status automation/provider-census-status.json \
            --overrides provider-overrides.json \
            --network-report provider-v3-quick-yield.json \
            --workers 3 \
            --max-targets 24 \
            --timeout 25 \
            --virtual-time-ms 8000

      - name: Select private residential exit node
        id: select_residential_exit
        continue-on-error: true
        if: ${{ steps.tailscale_connect.outcome == 'success' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for attempt in 1 2 3 4 5; do
            if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
              selected=1
              break
            fi
            sleep "$((attempt * 2))"
          done
          if [ "$selected" -ne 1 ]; then
            echo "Private exit node could not be selected; verify exit-node advertisement/approval and tag:niakvio-ci -> autogroup:internet policy." >&2
            exit 1
          fi
          echo "NIAKVIO_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"

      - name: Reprobe WAF lanes through private residential exit
        id: residential_probe
        continue-on-error: true
        if: ${{ steps.select_residential_exit.outcome == 'success' && env.NIAKVIO_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_waf_browser_session.py \
            /tmp/provider-waf-github.json \
            --output /tmp/provider-waf-residential.json \
            --attempts 2 \
            --client-profile-matrix \
            --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*' \
            --status automation/provider-census-status.json \
            --overrides provider-overrides.json \
            --network-report provider-v3-quick-yield.json \
            --workers 3 \
            --max-targets 24 \
            --timeout 25 \
            --virtual-time-ms 8000

      - name: Merge residential exit evidence without node identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/provider-waf-residential.json ]; then
            python scripts/merge_waf_network_profiles.py \
              --baseline /tmp/provider-waf-github.json \
              --residential /tmp/provider-waf-residential.json \
              --output automation/provider-waf-browser-session-latest.json
          else
            reason="tailscale-unavailable"
            if [ "${{ steps.tailscale_connect.outcome }}" = "failure" ]; then
              reason="tailscale-connect-failed"
            elif [ "${{ steps.select_residential_exit.outcome }}" = "failure" ]; then
              reason="exit-node-unavailable"
            elif [ "${{ steps.residential_probe.outcome }}" = "failure" ]; then
              reason="residential-probe-failed"
            fi
            python scripts/merge_waf_network_profiles.py \
              --baseline /tmp/provider-waf-github.json \
              --unavailable-reason "$reason" \
              --output automation/provider-waf-browser-session-latest.json
          fi

      - name: Select full providers for residential replay
        if: ${{ env.NIAKVIO_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_residential_provider_replay.py \
            --waf automation/provider-waf-browser-session-latest.json \
            --status automation/provider-census-status.json \
            --output /tmp/residential-provider-replay-targets.json
          count="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/residential-provider-replay-targets.json').read_text())
          print(int(data.get('providerCount') or 0))
          PY
          )"
          if [ "$count" -gt 0 ]; then
            echo "NIAKVIO_RESIDENTIAL_PROVIDER_REPLAY=1" >> "$GITHUB_ENV"
          fi

      - name: Replay full providers through private residential exit
        if: ${{ env.NIAKVIO_RESIDENTIAL_PROVIDER_REPLAY == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_provider_quick_yield_targeted.py \
            --providers-json /tmp/residential-provider-replay-targets.json \
            --output /tmp/provider-residential-network-replay.json \
            --attempts 1
          python scripts/merge_residential_provider_replay.py \
            --waf automation/provider-waf-browser-session-latest.json \
            --replay /tmp/provider-residential-network-replay.json \
            --output /tmp/provider-waf-with-residential-replay.json
          mv /tmp/provider-waf-with-residential-replay.json automation/provider-waf-browser-session-latest.json

      - name: Clear private exit-node routing
        if: ${{ always() && env.NIAKVIO_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: sudo tailscale set --exit-node= || true

      - name: Upload WAF browser-session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-waf-browser-session-${{ github.run_id }}
          path: automation/provider-waf-browser-session-latest.json
          retention-days: 14
          if-no-files-found: error

      - name: Persist WAF evidence and refresh census transport state
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp automation/provider-waf-browser-session-latest.json /tmp/provider-waf-browser-session-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            mkdir -p automation
            test -s automation/provider-census-status.json

            # WAF is an overlay, never a census authority. Do not project fresh
            # transport evidence onto an older status schema that predates the
            # address/backend authority fields, because that can resurrect an
            # obsolete repairQueue after a newer renderer change.
            if ! python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text())
          rows=[row for row in state.get("providers") or [] if isinstance(row,dict)]
          assert int(state.get("schemaVersion") or 0) >= 3
          assert rows
          assert all("authorityRepairEligible" in row and "authorityAction" in row for row in rows)
          PY
            then
              echo "FIELD_WAF_CENSUS_BASE_NOT_READY authority_schema_v3_required"
              return 0
            fi

            cp /tmp/provider-waf-browser-session-latest.json automation/provider-waf-browser-session-latest.json
            python scripts/merge_waf_census_transport.py \
              --status automation/provider-census-status.json \
              --waf automation/provider-waf-browser-session-latest.json \
              --authority-status automation/provider-authority-status.json \
              --output /tmp/provider-census-status-merged.json \
              --run-id "${GITHUB_RUN_ID}-waf-transport" \
              --sha "$(git rev-parse HEAD)"
            mv /tmp/provider-census-status-merged.json automation/provider-census-status.json
            python scripts/build_provider_repair_batch_plan.py \
              --status automation/provider-census-status.json \
              --overrides provider-overrides.json \
              --output automation/provider-repair-batch-plan-latest.json
            python scripts/render_provider_census_status_from_state.py \
              --status automation/provider-census-status.json \
              --output PROVIDER_CENSUS_STATUS.md
            git add \
              automation/provider-waf-browser-session-latest.json \
              automation/provider-census-status.json \
              automation/provider-repair-batch-plan-latest.json \
              PROVIDER_CENSUS_STATUS.md
          }

          rebuild_on_latest_main
          git diff --cached --quiet && exit 0
          git commit -m "ci(waf): persist transport evidence and refresh census"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "WAF/census persistence raced main; rebuilding on latest main attempt $attempt/3" >&2
            rebuild_on_latest_main
            git diff --cached --quiet && exit 0
            git commit -m "ci(waf): persist transport evidence and refresh census"
          done
          echo "WAF/census persistence failed after 3 main-rebase retries" >&2
          exit 1
