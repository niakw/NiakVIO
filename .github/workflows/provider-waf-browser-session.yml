name: Provider WAF Browser Session Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-waf-browser-session.yml'
      - '.github/triggers/provider-waf-browser-session.json'
      - 'scripts/probe_waf_browser_session.py'
      - 'scripts/render_provider_census_status.py'
      - 'scripts/render_provider_census_status_from_state.py'
      - 'scripts/merge_waf_census_transport.py'
      - 'scripts/merge_waf_network_profiles.py'
      - 'tests/provider_census_status_markdown_test.py'
      - 'tests/waf_census_transport_merge_test.py'
      - 'tests/provider_waf_census_markdown_sync_test.py'
      - 'tests/provider_waf_browser_session_test.py'
      - 'tests/provider_waf_okhttp_profile_test.py'
      - 'tests/provider_waf_tailscale_exit_contract_test.py'
      - 'tests/waf_residential_profile_merge_test.py'
      - 'tools/waf-okhttp-probe/**'

permissions:
  contents: write
  id-token: write

concurrency:
  group: provider-waf-browser-session-main
  cancel-in-progress: true

jobs:
  browser-session:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Build NuvioTV-policy OkHttp diagnostic helper
        run: mvn -q -f tools/waf-okhttp-probe/pom.xml -DskipTests package

      - name: Validate ordinary-browser diagnostic contract
        run: python tests/provider_waf_browser_session_test.py

      - name: Validate NuvioTV-policy OkHttp diagnostic contract
        run: python tests/provider_waf_okhttp_profile_test.py

      - name: Validate transport-only census merge contract
        run: python tests/waf_census_transport_merge_test.py

      - name: Validate WAF census Markdown synchronization contract
        run: python tests/provider_waf_census_markdown_sync_test.py

      - name: Validate Tailscale residential-exit diagnostic contract
        run: |
          python tests/provider_waf_tailscale_exit_contract_test.py
          python tests/waf_residential_profile_merge_test.py


      - name: Reprobe persisted WAF lanes on GitHub-hosted network
        shell: bash
        run: |
          set -euo pipefail
          test -s automation/provider-waf-browser-session-latest.json
          python scripts/probe_waf_browser_session.py \
            automation/provider-waf-browser-session-latest.json \
            --output /tmp/provider-waf-github.json \
            --attempts 2 \
            --client-profile-matrix \
            --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*' \
            --status automation/provider-census-status.json \
            --overrides provider-overrides.json \
            --workers 3 \
            --max-targets 24 \
            --timeout 25 \
            --virtual-time-ms 8000

      - name: Connect ephemeral Tailscale diagnostic node
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_TAG_NAME || 'tag:niakvio-ci' }}
          version: '1.94.2'
          log-mode: quiet

      - name: Select private residential exit node
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=10s "$TS_EXIT_NODE" >/dev/null
          sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false
          echo "NIAKVIO_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"

      - name: Reprobe WAF lanes through private residential exit
        if: ${{ env.NIAKVIO_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_waf_browser_session.py \
            /tmp/provider-waf-github.json \
            --output /tmp/provider-waf-residential.json \
            --attempts 2 \
            --client-profile-matrix \
            --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*' \
            --status automation/provider-census-status.json \
            --overrides provider-overrides.json \
            --workers 3 \
            --max-targets 24 \
            --timeout 25 \
            --virtual-time-ms 8000

      - name: Merge residential exit evidence without node identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/provider-waf-residential.json ]; then
            python scripts/merge_waf_network_profiles.py \
              --baseline /tmp/provider-waf-github.json \
              --residential /tmp/provider-waf-residential.json \
              --output automation/provider-waf-browser-session-latest.json
          else
            cp /tmp/provider-waf-github.json automation/provider-waf-browser-session-latest.json
          fi

      - name: Clear private exit-node routing
        if: ${{ always() && env.NIAKVIO_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: sudo tailscale set --exit-node= || true

      - name: Upload WAF browser-session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-waf-browser-session-${{ github.run_id }}
          path: automation/provider-waf-browser-session-latest.json
          retention-days: 14
          if-no-files-found: error

      - name: Persist WAF evidence and refresh census transport state
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp automation/provider-waf-browser-session-latest.json /tmp/provider-waf-browser-session-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            mkdir -p automation
            cp /tmp/provider-waf-browser-session-latest.json automation/provider-waf-browser-session-latest.json
            test -s automation/provider-census-status.json
            python scripts/merge_waf_census_transport.py \
              --status automation/provider-census-status.json \
              --waf automation/provider-waf-browser-session-latest.json \
              --output /tmp/provider-census-status-merged.json \
              --run-id "${GITHUB_RUN_ID}-waf-transport" \
              --sha "$(git rev-parse HEAD)"
            mv /tmp/provider-census-status-merged.json automation/provider-census-status.json
            python scripts/build_provider_repair_batch_plan.py \
              --status automation/provider-census-status.json \
              --overrides provider-overrides.json \
              --output automation/provider-repair-batch-plan-latest.json
            python scripts/render_provider_census_status_from_state.py \
              --status automation/provider-census-status.json \
              --output PROVIDER_CENSUS_STATUS.md
            git add \
              automation/provider-waf-browser-session-latest.json \
              automation/provider-census-status.json \
              automation/provider-repair-batch-plan-latest.json \
              PROVIDER_CENSUS_STATUS.md
          }

          rebuild_on_latest_main
          git diff --cached --quiet && exit 0
          git commit -m "ci(waf): persist transport evidence and refresh census"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "WAF/census persistence raced main; rebuilding on latest main attempt $attempt/3" >&2
            rebuild_on_latest_main
            git diff --cached --quiet && exit 0
            git commit -m "ci(waf): persist transport evidence and refresh census"
          done
          echo "WAF/census persistence failed after 3 main-rebase retries" >&2
          exit 1
