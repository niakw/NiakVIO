name: Audit every declared provider media type v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-all-nuvio-tv-providers-v2.yml"
      - ".github/triggers/audit-all-nuvio-tv-providers-v2"

permissions:
  contents: write

concurrency:
  group: nuvio-tv-global-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      NUVIO_GLOBAL_AUDIT_CONCURRENCY: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate audit tooling
        run: |
          python -m py_compile scripts/audit_all_nuvio_tv_providers.py
          python -m py_compile scripts/audit_all_nuvio_tv_providers_v2.py
          python -m py_compile scripts/provider_patches/nuvio_tv_direct_media_v2.py
          node --check scripts/nuvio_tv_probe_v2.cjs

      - name: Preserve manifests before audit
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp vf/manifest.json "$RUNNER_TEMP/vf.before.json"

      - name: Audit movie, TV and anime types declared by every provider
        run: python scripts/audit_all_nuvio_tv_providers_v2.py

      - name: Prove audit is non-destructive
        run: |
          cmp -s manifest.json "$RUNNER_TEMP/manifest.before.json"
          cmp -s vf/manifest.json "$RUNNER_TEMP/vf.before.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('automation/nuvio-tv-global-audit-v2.json').read_text(encoding='utf-8'))
          candidates = json.loads(Path('automation/nuvio-tv-global-candidates-v2.json').read_text(encoding='utf-8'))
          assert report['provider_count'] > 0
          assert report['candidate_count'] == candidates['candidate_count']
          print('providers audited:', report['provider_count'])
          print('strictly improved generic candidates:', report['candidate_count'])
          print('classifications:', json.dumps(report['classification_counts'], ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload complete v2 audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvio-tv-global-audit-v2-${{ github.run_id }}
          path: |
            automation/nuvio-tv-global-audit-v2.json
            automation/nuvio-tv-global-candidates-v2.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish v2 audit reports only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/nuvio-tv-global-audit-v2.json automation/nuvio-tv-global-candidates-v2.json
          git commit -m "audit: record all declared NuvioTV media types" || exit 0
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
