name: One-shot accept reviewed Nuvio Mobile head

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-accept-mobile-upstream.yml'

permissions:
  contents: write

jobs:
  accept-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify exact reviewed upstream head
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote --heads https://github.com/NuvioMedia/NuvioMobile.git refs/heads/cmp-rewrite | awk '{print $1}')"
          test "$CURRENT" = "bbac53b2767937c9dfede44cb86906ea921605fb"

      - name: Persist reviewed accepted ref and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          row = data['nuvio_client_compatibility']['clients']['nuvio-mobile']
          row.update({
            'accepted_ref': 'bbac53b2767937c9dfede44cb86906ea921605fb',
            'accepted_at': datetime.now(timezone.utc).isoformat(),
            'acceptance': 'manual-history-divergence-reviewed-unrelated-only',
            'changed_file_count': 5,
            'observed_sensitive_changed_files': [],
            'unrelated_changed_files': [
              'composeApp/src/commonMain/composeResources/values-hu/strings.xml',
              'composeApp/src/commonMain/kotlin/com/nuvio/app/features/library/LibraryDisplaySettings.kt',
              'composeApp/src/commonMain/kotlin/com/nuvio/app/features/library/LibraryModels.kt',
              'composeApp/src/commonMain/kotlin/com/nuvio/app/features/simkl/SimklLibraryProjection.kt',
              'iosApp/Configuration/Version.xcconfig'
            ],
            'manual_review_note': 'History divergence reviewed against 75e7429e974fd6736b31ef39278bb2af5699a372. Net tree diff changes library/SIMKL categorization, Hungarian localization and iOS version only; no configured plugin, stream or player runtime contract path changed.'
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/check_nuvio_client_upstreams.py --apply-safe-advance
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit reviewed compatibility state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m 'chore: accept reviewed Nuvio Mobile upstream head [skip ci]'
          git fetch origin main
          git rebase origin/main
          python3 scripts/check_nuvio_client_upstreams.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add sources.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
