name: TEMP - Fix Native Lab Fixture Contract

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/tmp-fix-native-lab-fixture-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reconcile fixture cardinality contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/nuvio_client_lab.test.cjs')
          s=p.read_text(encoding='utf-8')
          old="assert.equal(labTrigger.fixtures.length, 11);"
          new="assert.equal(labTrigger.fixtures.length, 12);"
          assert old in s and new not in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node tests/nuvio_client_lab.test.cjs
          git diff --check
      - name: Commit contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/nuvio_client_lab.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'test(native): align lab contract with 12-fixture corpus'
          git push origin "HEAD:${GITHUB_REF_NAME}"
