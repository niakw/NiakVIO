name: Provider History Sanitize Once

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - '.github/workflows/provider-history-sanitize-once.yml'

permissions:
  contents: write

concurrency:
  group: provider-history-sanitize-once
  cancel-in-progress: true

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Sanitize registry/history and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sanitize_provider_hub_registry.py --registry provider-hubs.json --history provider-domain-history.json
          rm -f .github/workflows/temp-voiranime-coflix-payload-probe.yml
          rm -f .github/workflows/provider-history-sanitize-once.yml
          if find .github/workflows -maxdepth 1 -type f -name 'temp-*' -print -quit | grep -q .; then
            echo 'TEMP workflows remain:' >&2
            find .github/workflows -maxdepth 1 -type f -name 'temp-*' -print >&2
            exit 1
          fi
          python scripts/sanitize_provider_hub_registry.py --registry provider-hubs.json --history provider-domain-history.json --check
      - name: Commit sanitized durable state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A provider-hubs.json provider-domain-history.json .github/workflows
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ci): sanitize domain history and remove transient workflows'
          git push origin HEAD:fix/labs-5.21.44-20260912
