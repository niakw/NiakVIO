name: TEMP - AnimeVOSTFR runtime diag

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-animevostfr-runtime-diag.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize current AnimeVOSTFR candidate only
        run: |
          set -euo pipefail
          python3 scripts/upgrade_full32_regression_trio_runtime_v1.py
          python3 scripts/materialize_provider_v3_one.py animevostfr
      - name: Run exact worker cases with network observations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          c=p.local_catalog()['animevostfr']
          cases=[
            {'slug':'superman-2025','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025},
            {'slug':'tokyo-ghoul-2014-s01e01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014},
          ]
          for f in cases:
            r=p.run_worker(c['path'],f,40)
            print('ANIMEVOST_DIAG_RESULT '+json.dumps({k:r.get(k) for k in ['stream_count','raw_stream_count','error_class','http_statuses','provider_server_hosts','provider_server_http_statuses','network_observations']},ensure_ascii=False))
          PY
      - name: Inspect observable v2 page shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.parse,urllib.request
          base='https://v2.animevostfr.org'
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36','Accept-Language':'fr-FR,fr;q=0.9'}
          def get(url):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.geturl(),r.read(800000).decode('utf-8','replace')
              except Exception as e:
                  print('ANIMEVOST_HTTP_ERROR',url,repr(e)); return 0,url,''
          for title in ('Superman','Tokyo Ghoul'):
              status,url,html=get(base+'/?s='+urllib.parse.quote(title))
              hrefs=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',html,re.I)
              anime=[h for h in hrefs if '/animes/' in h]
              print('ANIMEVOST_SEARCH',title,'status='+str(status),'url='+url,'bytes='+str(len(html)),'anime_links='+str(len(anime)))
              print('ANIMEVOST_SEARCH_LINKS',anime[:12])
              for h in anime[:2]:
                  target=urllib.parse.urljoin(url,h)
                  s2,u2,h2=get(target)
                  eps=[x for x in re.findall(r'href\s*=\s*["\']([^"\']+)["\']',h2,re.I) if '/episode/' in x]
                  print('ANIMEVOST_SERIES',target,'status='+str(s2),'bytes='+str(len(h2)),'episode_links='+str(len(eps)))
                  print('ANIMEVOST_EP_LINKS',eps[:12])
                  if eps:
                      ep=urllib.parse.urljoin(u2,eps[0])
                      s3,u3,h3=get(ep)
                      trem=re.findall(r'(?:src|data-src)\s*=\s*["\']([^"\']*(?:trembed|trid=)[^"\']*)["\']',h3,re.I)
                      ifr=re.findall(r'<iframe[^>]+src\s*=\s*["\']([^"\']+)["\']',h3,re.I)
                      print('ANIMEVOST_EP',ep,'status='+str(s3),'bytes='+str(len(h3)),'trembed='+str(len(trem)),'iframes='+str(len(ifr)))
                      print('ANIMEVOST_TREMBED',trem[:8]); print('ANIMEVOST_IFRAMES',ifr[:8])
          PY
