name: LAB - Desktop Runtime Bisect

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - ".github/workflows/desktop-runtime-bisect.yml"
      - "scripts/augment_native_desktop_runtime_shape_diagnostics.py"
      - "tests/native_desktop_runtime_shape_diagnostics_test.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-bisect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persianstremio-macos:
    name: PersianStremio protected-byte QuickJS bisect
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LC_NUMERIC: C
      NIAKVIO_TARGET_PROVIDER: persianstremio
      NIAKVIO_TARGET_MANIFEST: manifest.json
      NIAKVIO_TARGET_FIXTURE: interstellar
      NIAKVIO_PRIMARY_FIXTURE: interstellar
      NIAKVIO_PRIMARY_STREAM_SCOPE: "1"
      NIAKVIO_REGRESSION_STREAM_SCOPE: "1"
    steps:
      - name: Checkout NiakVIO workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true

      - name: Validate sanitized diagnostic transform
        shell: bash
        run: |
          set -euo pipefail
          python3 niakvio/tests/native_desktop_runtime_diagnostics_order_test.py
          python3 niakvio/tests/native_desktop_runtime_shape_diagnostics_test.py

      - name: Checkout latest official NuvioDesktop and stage protected provider
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          DESKTOP_SHA="$(git -C nuvio-desktop ls-remote origin HEAD | awk '{print $1}')"
          test -n "$DESKTOP_SHA"
          git -C nuvio-desktop checkout "$DESKTOP_SHA"
          git -C nuvio-desktop lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/**" --exclude=""
          touch nuvio-desktop/local.properties
          python3 niakvio/scripts/native_desktop_upstream_test_compat.py nuvio-desktop
          python3 niakvio/scripts/prepare_native_corpus_client.py desktop \
            --fixture interstellar \
            --workspace "$GITHUB_WORKSPACE" \
            --manifest manifest.json \
            --provider persianstremio
          echo "FIELD_DESKTOP_RUNTIME_BISECT_HEAD desktop_sha=$DESKTOP_SHA niakvio_sha=${{ github.sha }}"

      - name: Select response-shape diagnostic for this Lab only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("niakvio/scripts/run_native_corpus_desktop_suite.sh")
          text = path.read_text(encoding="utf-8")
          old = 'RUNTIME_DIAGNOSTICS="${NIAKVIO}/scripts/augment_native_desktop_runtime_diagnostics.py"'
          new = 'RUNTIME_DIAGNOSTICS="${NIAKVIO}/scripts/augment_native_desktop_runtime_shape_diagnostics.py"'
          if text.count(old) != 1:
              raise SystemExit(f"runtime diagnostic selector anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Build official macOS native player bridge
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop \
            :composeApp:buildMacosPlayerBridge \
            :composeApp:prepareMacosPlayerRuntime \
            --no-configuration-cache --console=plain

      - name: Execute PersianStremio through official Desktop runtime
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -u
          bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_desktop_suite.sh"

      - name: Extract sanitized response-shape verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/desktop-native-corpus-macos-interstellar.log"
          test -s "$LOG"
          grep -E 'FIELD_NATIVE_DESKTOP_RUNTIME_BISECT|FIELD_NATIVE_RUNTIME_DIAGNOSTIC|FIELD_NATIVE_RESULT|fetch-json-shape|fetch-text-shape|fetch-shape' "$LOG" || true
          python3 - "$LOG" <<'PY'
          import base64, re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          rows = re.findall(r'FIELD_NATIVE_RUNTIME_DIAGNOSTIC[^\n]*detail64=([^\s]+)', text)
          decoded = []
          for raw in rows:
              try:
                  value = base64.b64decode(raw + '=' * (-len(raw) % 4)).decode('utf-8', 'replace')
              except Exception:
                  continue
              if 'persianstremio' in text.lower() or 'fetch-json-shape' in value:
                  decoded.append(value)
          shape = '\n'.join(decoded)
          print('FIELD_DESKTOP_RESPONSE_SHAPE_CAPTURED present=' + str('fetch-json-shape' in shape).lower())
          for line in decoded[-4:]:
              print('FIELD_DESKTOP_RESPONSE_SHAPE_DETAIL ' + line[:6000])
          PY

      - name: Upload targeted Desktop bisect evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-runtime-bisect-${{ github.run_id }}
          path: |
            desktop-native-corpus-macos-interstellar.log
            desktop-native-gradle-macos-interstellar.log
            native-evidence/desktop/**
          retention-days: 8
          if-no-files-found: warn

      - name: Report observational execution status
        if: always()
        shell: bash
        run: |
          echo "FIELD_DESKTOP_RUNTIME_BISECT_EXECUTION outcome=${{ steps.execute.outcome }} blocking=false"
