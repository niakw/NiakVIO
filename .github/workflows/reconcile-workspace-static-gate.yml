name: TEMP - Reconcile Workspace Static Gate

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/reconcile-workspace-static-gate.yml'

permissions:
  contents: write

concurrency:
  group: reconcile-workspace-static-gate
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Patch Verify & Publish context contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sync = Path('.github/workflows/sync.yml')
          text = sync.read_text(encoding='utf-8')
          if 'NUVIO_PROVIDER_V3_CONTEXT:' not in text:
              lines = text.splitlines()
              job_at = next(i for i, line in enumerate(lines) if line.strip() == 'verify-and-publish:')
              token_at = next(
                  i for i in range(job_at, len(lines))
                  if lines[i].strip().startswith('TMDB_ACCESS_TOKEN:')
              )
              expr = '$' + "{{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'workbench/') && 'workspace' || 'publication' }}"
              addition = [
                  '      # Repair/reconstruction PRs deliberately carry workspace-addressed bundles.',
                  '      # Every main/scheduled/direct verification remains strict publication mode.',
                  f'      NUVIO_PROVIDER_V3_CONTEXT: {expr}',
              ]
              lines[token_at + 1:token_at + 1] = addition
              sync.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test = Path('tests/provider_v3_workflow_ownership_test.py')
          src = test.read_text(encoding='utf-8')
          anchor = 'assert "Deep - reproject manifests and integrity inventories" in routine\n'
          addition = """assert \"Deep - reproject manifests and integrity inventories\" in routine\nassert \"NUVIO_PROVIDER_V3_CONTEXT:\" in routine\nassert \"startsWith(github.event.pull_request.head.ref, 'workbench/')\" in routine\n"""
          if "startsWith(github.event.pull_request.head.ref, 'workbench/')" not in src:
              if anchor not in src:
                  raise SystemExit('workflow ownership test anchor not found')
              src = src.replace(anchor, addition, 1)
              test.write_text(src, encoding='utf-8')
          PY

      - name: Prove workspace and publication filename policy
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_v3_filename_policy_test.py
          python tests/provider_v3_workflow_ownership_test.py
          NUVIO_PROVIDER_V3_CONTEXT=workspace python scripts/audit_provider_v3_static.py
          git diff --check

      - name: Commit bounded CI fix and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-workspace-static-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/sync.yml tests/provider_v3_workflow_ownership_test.py .github/workflows/reconcile-workspace-static-gate.yml
          git diff --cached --check
          git commit -m 'fix(ci): validate workbench bytes in workspace context'
          git push origin HEAD:workbench/systemic-recovery-20260909
