name: TEMP - Cross Device Audit Fix 20260916

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-audit-fix.yml'
      - 'scripts/temp_cross_device_audit_fix_20260916.py'
      - 'scripts/temp_cross_device_audit_fix_20260916_retry.py'
      - 'tests/cross_device_user_audit_regression_test.py'

permissions:
  contents: write

concurrency:
  group: temp-cross-device-audit-fix-20260916
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cross-device corrections
        run: |
          set -euo pipefail
          python3 scripts/temp_cross_device_audit_fix_20260916_retry.py
          python3 scripts/render_platform_runtime_contracts.py
          python3 -m py_compile \
            scripts/apply_provider_overrides.py \
            scripts/provider_patches/global_stream_presentation_v1.py \
            scripts/provider_patches/global_provider_branding_v1.py \
            scripts/native_player_diagnostics_codegen.py \
            scripts/render_platform_runtime_contracts.py

      - name: Focused cross-device regression suite
        run: |
          set -euo pipefail
          python3 tests/cross_device_user_audit_regression_test.py
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/stream_quality_recovery_tv_test.py
          python3 tests/stream_output_sanitizer_fail_closed_test.py
          python3 tests/native_mobile_player_launch_v36_test.py
          python3 tests/native_evidence_codegen_pipeline_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 scripts/render_platform_runtime_contracts.py --check

      - name: Recompose current providers in workspace and prove global guard
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          python3 tests/global_stream_output_guard_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/cross_device_user_audit_regression_test.py

      - name: Targeted live coverage arbitration - anime and 4K
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/evidence/cross-device-20260916
          provider_path() {
            python3 - "$1" <<'PY'
          import json,sys,os,urllib.parse
          pid=sys.argv[1].casefold()
          data=json.load(open('manifest.json',encoding='utf-8'))
          rows=data.get('scrapers') or data.get('providers') or []
          for row in rows:
              rid=str(row.get('id') or row.get('canonicalId') or row.get('scraper',{}).get('id') or '').casefold()
              if rid!=pid: continue
              ref=str(row.get('file') or row.get('url') or row.get('path') or row.get('source') or '')
              if '/providers/' in ref: ref='providers/'+ref.split('/providers/',1)[1]
              elif ref.startswith('providers/'): pass
              else: ref='providers/'+os.path.basename(urllib.parse.urlparse(ref).path)
              print(ref)
              raise SystemExit(0)
          raise SystemExit(2)
          PY
          }
          probe() {
            local pid="$1" fixture="$2" out="automation/evidence/cross-device-20260916/${pid}.jsonl"
            local path
            path="$(provider_path "$pid")" || { echo "FIELD_TARGET_PROBE provider=$pid state=missing_manifest" | tee "$out"; return 0; }
            if [[ ! -f "$path" ]]; then echo "FIELD_TARGET_PROBE provider=$pid state=missing_file path=$path" | tee "$out"; return 0; fi
            echo "FIELD_TARGET_PROBE_BEGIN provider=$pid path=$path fixture=$fixture" | tee "$out"
            timeout 90s node scripts/nuvio_tv_probe_tmdb_ci.cjs "$path" "$fixture" 2>&1 | tee -a "$out" || true
            echo "FIELD_TARGET_PROBE_END provider=$pid" | tee -a "$out"
          }
          MOVIE='{"tmdbId":"157336","mediaType":"movie","type":"movie","title":"Interstellar","year":2014}'
          HELL='{"tmdbId":"280049","mediaType":"anime","type":"anime","title":"Hell Mode","season":2,"episode":12}'
          probe anime-sama "$HELL"
          probe mugiwarastream "$HELL"
          probe 4khdhub "$MOVIE"
          probe uhdmovies "$MOVIE"
          probe streamzo "$MOVIE"
          probe kehflix "$MOVIE"

      - name: Commit durable corrections and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temp_cross_device_audit_fix_20260916.py scripts/temp_cross_device_audit_fix_20260916_retry.py .github/workflows/temp-cross-device-audit-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m 'fix(core): reconcile cross-device stream projection and native diagnostics'
          git push origin HEAD:fix/cross-device-audit-20260916
