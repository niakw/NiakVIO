name: TMP Sync Manifest Projections

on:
  push:
    branches:
      - hotfix/purstream-core-policy-final-20260917

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/purstream-core-policy-final-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize projections and release hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_manifest_projection_rows.py
          python3 scripts/sync_manifest_projection_rows.py --check
          python3 scripts/validate_language_projection.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for rel in ['vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json']:
              doc=json.load(open(rel))
              missing=[]
              for row in doc.get('scrapers',[]):
                  filename=str(row.get('filename') or '')
                  if not filename:
                      missing.append((row.get('id'),'empty filename'))
                      continue
                  target=(Path(rel).parent / filename).resolve()
                  if not target.is_file():
                      missing.append((row.get('id'),str(target)))
              if missing:
                  raise SystemExit(f'{rel}: missing projected bundles: {missing[:20]}')
              print(f'MANIFEST_PROJECTION_TARGETS_OK {rel} providers={len(doc.get("scrapers",[]))}')
          PY
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          python3 tests/overrides_test.py
          python3 tests/core_media_policy_test.py
          python3 scripts/normalize_core_media_policy.py --check
          git diff --check
          ! grep -q 'tmp-sync-manifest-projections.yml' FILE-HASHES.json
          ! grep -q 'tmp-sync-manifest-projections.yml' PATCH-SHA256SUMS.txt

      - name: Commit synchronized projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          git commit -m 'fix(manifest): synchronize rebuilt provider projections'
          git push origin HEAD:hotfix/purstream-core-policy-final-20260917
