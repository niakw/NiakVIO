name: ONE-SHOT - Media Transport Contract Memory

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/memory-transport-contract-one-shot.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Persist contract
        run: python scripts/temp_persist_media_transport_contract.py
      - name: Verify and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/media-type-transport-contract.md
          grep -Fq 'Media-type semantic/transport contract — authoritative 2026-09-11' MEMORY.md
          rm -f scripts/temp_persist_media_transport_contract.py
          rm -f .github/workflows/memory-transport-contract-one-shot.yml
          rm -f .github/triggers/memory-transport-contract.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(core): persist media transport contract'
          git push origin HEAD:workbench/hub-matrix-46-20260911
