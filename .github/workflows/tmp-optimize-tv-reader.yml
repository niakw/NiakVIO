name: FIX - Bounded resumable TV reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-optimize-tv-reader.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded resumable TV reader migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The TV shard runtime env anchor legitimately exists in both the
          # representative route proof and the Brain retest. The migration owns
          # only the first occurrence; keep every other migration anchor strict.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_tv_reader_optimization.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one anchor, got {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        if label == "TV shard runtime env" and count >= 1:\n            return text.replace(old, new, 1)\n        raise SystemExit(f"{label}: expected exactly one anchor, got {count}")\n    return text.replace(old, new, 1)\n'''
          if old not in text:
              raise SystemExit('replace_once helper anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 scripts/apply_tv_reader_optimization.py
          python3 -m py_compile \
            scripts/native_tv_route_checkpoint.py \
            scripts/build_native_reader_retest_manifest.py \
            scripts/apply_tv_reader_optimization.py
          python3 tests/native_tv_route_resume_test.py
          python3 tests/native_corpus_device_lab_test.py

      - name: Finalize migration and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-optimize-tv-reader.yml scripts/apply_tv_reader_optimization.py automation/tv-reader-migration-failure.txt
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add -A
          git diff --cached --check
          git commit -m 'ci: shard and resume exhaustive TV reader proof [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
