name: FIX - Bounded resumable TV reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-optimize-tv-reader.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply provider-agnostic TV orchestration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_tv_reader_optimization.py

      - name: Run targeted structural and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/native_tv_route_checkpoint.py \
            scripts/build_native_reader_retest_manifest.py \
            scripts/apply_tv_reader_optimization.py
          python3 tests/native_tv_route_resume_test.py
          python3 tests/native_corpus_device_lab_test.py
          grep -q 'retest-manifest.json' .github/workflows/native-android-route-reader.yml
          grep -q 'timeout --signal=TERM --kill-after=2m' scripts/run_native_corpus_tv_suite.sh
          grep -q 'native-tv-route-representative-' .github/workflows/native-android-route-reader.yml

      - name: Refresh release hashes and integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit optimized TV orchestration and consume one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-optimize-tv-reader.yml scripts/apply_tv_reader_optimization.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add -A
          git diff --cached --check
          git commit -m 'ci: shard and resume exhaustive TV reader proof [skip ci]'
          git push origin HEAD:main
