name: TEMP - Fix V22 French language
on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-v22-french-language.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Preserve normalized French language fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/provider_patches/global_stream_presentation_v1.py')
          s=p.read_text(encoding='utf-8')
          old='  var u=raw.toLowerCase().replace(/[_-]+/g," ").replace(/\\s+/g," ").trim();\n  if(/^(?:vf|vff|vfq|vostfr|vo|multi|multi audio|dual audio)$/i.test(u))return fallback||raw.toUpperCase();'
          new='  var u=raw.toLowerCase().replace(/[_-]+/g," ").replace(/\\s+/g," ").trim();\n  if(/^(?:(?:fr|fra|fre|french|francais|français|fr fr)(?:\\s|$)|fr ca(?:\\s|$))/i.test(u))return fallback||"VF";\n  if(/^(?:vf|vff|vfq|vostfr|vo|multi|multi audio|dual audio)$/i.test(u))return fallback||raw.toUpperCase();'
          if old not in s: raise SystemExit('V22 detailedLanguage token missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Stage current V22 contracts for validation only
        run: |
          python - <<'PY'
          from pathlib import Path
          old='all-providers-client-projection-name-mirror-v20'
          new='all-providers-client-projection-strongest-evidence-v22'
          p=Path('scripts/normalize_stream_presentation_v12.py'); s=p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('missing V20 normalizer revision')
          s=s.replace(old,new)
          title_old='\'out.title=provider+(f.quality?" - "+qualityLabel(f.quality):"")\','
          title_new='\'out.title=provider\',\n        \'qualityLabel(f.quality)\',\n        \'detailedLanguage(\','
          if title_old not in s: raise SystemExit('missing V20 title token')
          p.write_text(s.replace(title_old,title_new).replace('V20','V22'),encoding='utf-8')
          p=Path('tests/global_stream_presentation_test.py'); s=p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('missing V20 presentation test revision')
          s=s.replace(old,new).replace('V20','V22')
          s=s.replace('assert row["title"] == "Purstream - 4K", row','assert row["title"] == "Purstream - 4K - MULTI (VF/VO)", row')
          s=s.replace('assert vf["title"] == "Coflix - 1080p"','assert vf["title"] == "Coflix - 1080p - VF"')
          s=s.replace('assert desktop_native["row"]["title"] == "Cineby - 1080p", desktop_native','assert desktop_native["row"]["title"] == "Cineby - 1080p - VO", desktop_native')
          p.write_text(s,encoding='utf-8')
          p=Path('tests/global_stream_presentation_pipeline_test.py'); s=p.read_text(encoding='utf-8')
          old_assert='assert native["row"]["title"].endswith(" - 1080p"), native'
          new_assert='assert " - 1080p" in native["row"]["title"], native\n    assert native["row"]["title"].endswith(" - VO"), native'
          if old_assert not in s: raise SystemExit('missing old pipeline title assertion')
          p.write_text(s.replace(old_assert,new_assert),encoding='utf-8')
          PY
      - name: Run V22 presentation contracts
        run: |
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
      - name: Commit Core fix only
        run: |
          git config user.name niakvio-bot
          git config user.email niakvio-bot@users.noreply.github.com
          git add scripts/provider_patches/global_stream_presentation_v1.py
          git commit -m '[presentation-v22] preserve normalized French VF/VFQ tokens'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
