name: TEMP - Max Repair V10 Proof V25
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-v10-proof-v25.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Static Core ownership and non-regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 scripts/validate_published_overrides.py
      - name: Probe current materialized providers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-v25.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const result={};
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
          function entry(pid){const rows=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(rows.length!==1)throw new Error(`manifest_provider_count:${pid}:${rows.length}`);return rows[0];}
          function file(pid){const row=entry(pid),f=path.resolve(String(row.filename||''));if(!fs.existsSync(f))throw new Error('provider_file_missing:'+pid);console.log('MANIFEST',pid,row.filename,'enabled='+row.enabled,'types='+JSON.stringify(row.supportedTypes||[]),'canonical='+JSON.stringify(row.canonicalSupportedTypes||[]));return f;}
          function meta(spec){return spec.type==='movie'?{title:spec.title,original_title:spec.title,release_date:`${spec.year}-01-01`,alternative_titles:{titles:[]}}:{name:spec.title,original_name:spec.title,first_air_date:`${spec.year}-01-01`,alternative_titles:{results:[]}};}
          async function run(label,spec){
            try{
              const f=file(spec.pid),ns=spec.type==='movie'?'movie':'tv',m=meta(spec);
              globalThis.__nuvioMediaContext={tmdbId:String(spec.id),tmdbNamespace:ns,tmdbMetadata:m};
              globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${spec.id}`]:m};
              globalThis.__nuvioProviderDeadlineMs=Date.now()+28000;
              delete require.cache[f]; const mod=require(f);
              const rows=await Promise.race([Promise.resolve(mod.getStreams(String(spec.id),spec.type,spec.season,spec.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),29000))]);
              const out=Array.isArray(rows)?rows:[];
              const privateProof=out.some(r=>!!(r&&(r.__nuvioCorrelatedPlayerFallbackV1||r.__nuvioCoreMediaProofV1)));
              console.log('PROBE',label,'count='+out.length,'private='+privateProof,out.slice(0,8).map(r=>({url:r&&r.url,title:r&&r.title,type:r&&r.type,format:r&&r.format})));
              let pageOk=false,status=0,ctype='';
              if(out[0]&&/^https?:\/\//i.test(String(out[0].url||''))){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(out[0].url,{headers:out[0].headers||{},redirect:'follow',signal:c.signal});status=r.status;ctype=r.headers.get('content-type')||'';const body=await r.text();pageOk=r.ok&&body.length>=20;console.log('PAGE',label,status,ctype,'bytes='+body.length,'final='+r.url);}catch(e){console.log('PAGE_ERROR',label,String(e&&e.message||e));}finally{clearTimeout(t)}}
              result[label]={count:out.length,privateProof,pageOk,status,ctype,urls:out.slice(0,8).map(r=>String(r&&r.url||''))};
            }catch(e){console.log('PROBE_ERROR',label,String(e&&e.message||e));result[label]={count:0,privateProof:false,pageOk:false,error:String(e&&e.message||e),urls:[]};}
          }
          (async()=>{
            const specs={
              wookafr:{pid:'wookafr',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              allwish:{pid:'allwish',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
              flemmix_movie:{pid:'flemmix',id:'1356963',type:'movie',title:'Little Lorraine',year:'2026'},
              flemmix_tv:{pid:'flemmix',id:'94997',type:'tv',title:'House of the Dragon',year:'2022',season:1,episode:1},
              allanime:{pid:'allanime',id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178},
              moviebox_movie:{pid:'moviebox',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              moviebox_tv:{pid:'moviebox',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              vidlove_movie:{pid:'vidlove',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              vidlove_tv:{pid:'vidlove',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              vidfast_movie:{pid:'vidfast',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              vidfast_tv:{pid:'vidfast',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1}
            };
            for(const [k,v] of Object.entries(specs)) await run(k,v);
            fs.writeFileSync('/tmp/probe-v25.json',JSON.stringify(result,null,2));
            console.log('SUMMARY',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/probe-v25.cjs
      - name: Semantic and proof-cleanup gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))['scrapers']
          r=json.load(open('/tmp/probe-v25.json'))
          def norm(v): return ''.join(c for c in str(v or '').lower() if c.isalnum())
          def row(pid):
              x=[z for z in m if norm(z.get('id'))==norm(pid)]
              assert len(x)==1,(pid,len(x)); return x[0]
          assert 'movie' not in set(row('allwish').get('canonicalSupportedTypes') or []), row('allwish')
          assert 'anime' not in set(row('coflix').get('canonicalSupportedTypes') or row('coflix').get('supportedTypes') or []), row('coflix')
          assert set(row('allanime').get('canonicalSupportedTypes') or [])=={'anime'}, row('allanime')
          leaked={k:v for k,v in r.items() if v.get('privateProof')}
          assert not leaked, leaked
          # V10 specifically repairs MovieBox proof handoff. Direct VidLove lanes
          # are regression sentinels and must remain stream-positive.
          required=['moviebox_movie','moviebox_tv','vidlove_movie','vidlove_tv']
          bad={k:r.get(k) for k in required if int((r.get(k) or {}).get('count') or 0)<1}
          assert not bad,bad
          print('V25_REQUIRED_POSITIVE_OK',required)
          print('V25_RESIDUALS',{k:r.get(k) for k in ['wookafr','allwish','flemmix_movie','flemmix_tv','allanime','vidfast_movie','vidfast_tv']})
          PY
      - name: Record V25 in MEMORY
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8')
          mark='<!-- MAX_REPAIR_20260916_V25_RESULT -->'
          if mark not in t:
              try: r=json.load(open('/tmp/probe-v25.json'))
              except Exception: r={}
              def fmt(k):
                  x=r.get(k) or {}; return f"{k}: count={x.get('count','n/a')} pageOk={x.get('pageOk','n/a')} status={x.get('status','n/a')} error={x.get('error','')}"
              section=mark+'\n### V25 materialized V10 proof\n- Branch head entering proof: `'+os.environ.get('GITHUB_SHA','')+'`.\n- V10 architecture: terminal sanitizer carries exact correlated-player proof only to outer Runtime Media Safety; Runtime Safety clears private proof before client output.\n- '+fmt('moviebox_movie')+'\n- '+fmt('moviebox_tv')+'\n- '+fmt('wookafr')+'\n- '+fmt('allwish')+'\n- '+fmt('flemmix_movie')+'\n- '+fmt('flemmix_tv')+'\n- '+fmt('allanime')+'\n- '+fmt('vidlove_movie')+'\n- '+fmt('vidlove_tv')+'\n- '+fmt('vidfast_movie')+'\n- '+fmt('vidfast_tv')+'\n\n'
              anchor='## 2026-09-16 — authoritative current checkpoint'
              t=t.replace(anchor,section+anchor,1) if anchor in t else t.rstrip()+'\n\n'+section
              p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add MEMORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record materialized v10 provider proof'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
