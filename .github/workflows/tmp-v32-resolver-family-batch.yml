name: TMP - V32 Resolver Family Batch
# trigger V32

on:
  pull_request:
    branches:
      - tmp/v32-resolver-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  resolver-family:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight resolver consumer
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 -m py_compile scripts/provider_base_store.py scripts/materialize_provider_v3_one.py scripts/certify_provider_playable_lanes.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          grep -q 'NIAKVIO_PROVIDER_RUNTIME_RESOLVER_CONSUMER_V36' scripts/provider_base_store.py
          grep -q '__niakvioProviderRuntimeResolverV1' scripts/provider_base_store.py
          python3 tests/provider_patch_quickjs_compat_test.py

      - name: Discover resolver family
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee health-output/resolver-family.json
          import json
          from pathlib import Path
          root=Path('.')
          overrides=json.loads(Path('provider-overrides.json').read_text())
          exact=json.loads(Path('automation/exact-52157-census-status.json').read_text())
          red={str(r.get('id') or '').lower() for r in exact.get('providers',[]) if r.get('enabled') is not False and not r.get('greenLanes')}
          rows=[]
          for pid,patch in (overrides.get('provider_patches') or {}).items():
              pid=str(pid).lower()
              if pid not in red or not isinstance(patch,dict):
                  continue
              scripts=[]
              for raw in patch.get('provider_lego_scripts') or []:
                  p=root/str(raw)
                  if p.is_file() and '__niakvioProviderRuntimeResolverV1' in p.read_text(errors='ignore'):
                      scripts.append(str(raw))
              if scripts:
                  rows.append({'providerId':pid,'scripts':scripts})
          print(json.dumps({'providers':rows,'count':len(rows)},separators=(',',':')))
          PY
          python3 - <<'PY' > health-output/resolver-ids.txt
          import json
          j=json.loads(open('health-output/resolver-family.json').read())
          for row in j['providers']:
              print(row['providerId'])
          PY
          echo "FIELD_V32_RESOLVER_IDS count=$(wc -l < health-output/resolver-ids.txt) ids=$(paste -sd, health-output/resolver-ids.txt)"

      - name: Materialize resolver family one-by-one
        run: |
          set -euo pipefail
          while IFS= read -r provider; do
            [ -n "$provider" ] || continue
            echo "FIELD_V32_MATERIALIZE_BEGIN provider=$provider"
            python3 scripts/materialize_provider_v3_one.py "$provider"
            echo "FIELD_V32_MATERIALIZE_END provider=$provider"
          done < health-output/resolver-ids.txt

      - name: Certify resolver family
        run: |
          set -euo pipefail
          : > health-output/v32-summary.tsv
          while IFS= read -r provider; do
            [ -n "$provider" ] || continue
            out="health-output/v32-$provider.json"
            echo "FIELD_V32_PROBE_BEGIN provider=$provider"
            set +e
            python3 scripts/certify_provider_playable_lanes.py \
              --manifest manifest.json \
              --include-disabled \
              --provider "$provider" \
              --candidate-limit 12 \
              --timeout 30 \
              --workers 2 \
              --seed "v32-resolver-${GITHUB_RUN_ID}-$provider" \
              --output "$out"
            rc=$?
            set -e
            python3 - "$provider" "$out" "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          pid,path,rc=sys.argv[1],Path(sys.argv[2]),int(sys.argv[3])
          if not path.is_file():
              print(f"FIELD_V32_RESULT provider={pid} rc={rc} green=- full=false missing=artifact")
              raise SystemExit(0)
          j=json.loads(path.read_text())
          row=(j.get('providers') or [{}])[0]
          lanes=row.get('lanes') or {}
          green=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
          stages=sorted({str(a.get('debugStage') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
          hosts=sorted({str(n.get('host') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
          print(f"FIELD_V32_RESULT provider={pid} rc={rc} green={','.join(green) or '-'} full={str(bool(row.get('certified'))).lower()} stages={'|'.join(stages) or '-'} hosts={'|'.join(hosts) or '-'}")
          with open('health-output/v32-summary.tsv','a') as fp:
              fp.write(f"{pid}\t{','.join(green) or '-'}\t{str(bool(row.get('certified'))).lower()}\t{'|'.join(stages)}\t{'|'.join(hosts)}\n")
          PY
            echo "FIELD_V32_PROBE_END provider=$provider"
          done < health-output/resolver-ids.txt

      - name: Summarize V32 gain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for line in Path('health-output/v32-summary.tsv').read_text().splitlines():
              if not line.strip(): continue
              p,g,f,*_=line.split('\t')
              rows.append((p,g,f))
          green=[p for p,g,_ in rows if g!='-']
          print("FIELD_V32_GREEN count=%d/%d providers=%s"%(len(green),len(rows),','.join(green) or 'none'))
          PY

      - name: Upload V32 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v32-resolver-family-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
