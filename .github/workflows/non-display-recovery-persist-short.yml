name: FINALIZE - Non-Display Recovery Candidate

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths:
      - '.github/workflows/non-display-recovery-persist-short.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exactly the proven candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_provider_upstream_parity_semantic_v4.py
          python3 tests/provider_upstream_semantic_guard_test.py
          python3 scripts/register_non_display_recovery_v1.py
          for provider in animesama-co animevostfr coflix neko-sama sekai voiranime-rip; do
            python3 scripts/materialize_provider_v3_one.py "$provider"
          done
          test -f providers/animesama-co-521c53c0776e0f0c.js
          test -f providers/animevostfr-8e1faa0de65334d1.js
          test -f providers/coflix-208af07331899b1c.js
          test -f providers/neko-sama-eed88ca549ce33c0.js
          test -f providers/sekai-a75d3df717181480.js
          test -f providers/voiranime-rip-bc79120ab5baa4d6.js
          echo NON_DISPLAY_PROVEN_HASHES_REBUILT
      - name: Recover and re-enforce proven evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/non-display-proof && mkdir -p /tmp/non-display-proof
          gh run download 35134913735 -n non-display-recovery-candidate-35134913735 -D /tmp/non-display-proof
          find /tmp/non-display-proof -maxdepth 2 -type f -print
          EXACT="$(find /tmp/non-display-proof -type f -name 'non-display-recovery-exact-proof.json' -print -quit)"
          PARITY="$(find /tmp/non-display-proof -type f -name 'non-display-recovery-parity.json' -print -quit)"
          test -n "$EXACT" && test -n "$PARITY"
          cp "$EXACT" automation/non-display-recovery-exact-proof.json
          cp "$PARITY" automation/non-display-recovery-parity.json
          python3 - <<'PY'
          import json
          exact=json.load(open('automation/non-display-recovery-exact-proof.json',encoding='utf-8'))
          bad=[r for r in exact.get('rows') or [] if r.get('classification')=='upstream_ok_niakvio_ko']
          if bad: raise SystemExit('exact regressions remain')
          parity=json.load(open('automation/non-display-recovery-parity.json',encoding='utf-8'))
          counts=parity.get('statusCounts') or {}
          regs=[r.get('providerId') for r in parity.get('providers') or [] if r.get('status')=='REGRESSION']
          print('NON_DISPLAY_PERSIST_COUNTS '+json.dumps(counts,sort_keys=True))
          if regs or int(counts.get('REGRESSION') or 0): raise SystemExit('sweep regressions remain')
          PY
      - name: Persist proven candidate on current branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json manifest.json providers/ provider-v3-materialization.json \
            scripts/run_provider_upstream_parity_v3.py \
            automation/non-display-recovery-exact-proof.json automation/non-display-recovery-parity.json
          git diff --cached --quiet && { echo NON_DISPLAY_CANDIDATE_ALREADY_CURRENT; exit 0; }
          git commit -m 'fix: recover six non-display provider routes'
          git fetch origin fix/non-display-recovery-20260916
          git rebase origin/fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "NON_DISPLAY_CANDIDATE_PERSISTED $(git rev-parse HEAD)"
