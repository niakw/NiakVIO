name: Device Lab visual sub-lab

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Native corpus device lab
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: native-corpus-device-visual-sublab
  cancel-in-progress: true

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout NiakVIO tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download parent Device Lab sanitized artifacts
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          mkdir -p corpus-logs
          gh run download "$RUN_ID" -D corpus-logs || true

      - name: Build visual Nuvio process timeline
        shell: bash
        run: |
          mkdir -p visual-sublab
          node scripts/render_native_corpus_timeline.cjs \
            --dir corpus-logs \
            --json visual-sublab/device-lab-timeline.json \
            --html visual-sublab/device-lab-timeline.html

      - name: Upload visual sub-lab
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-corpus-device-visual-${{ github.run_id }}
          path: visual-sublab/
          retention-days: 14
          if-no-files-found: warn
