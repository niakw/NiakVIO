name: Wire transient audit quarantine into publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-audit-quarantine-engine.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and compile quarantine boundaries
        run: |
          python scripts/apply_transient_audit_quarantine_engine_patch.py
          python -m py_compile \
            scripts/quarantine_catalogue_audit_failures.py \
            scripts/reapply_published_overrides.py \
            scripts/validate_published_overrides.py \
            scripts/audit_catalogue_identity_media.py

      - name: Commit exact engine changes
        run: |
          git status --short
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            scripts/reapply_published_overrides.py \
            scripts/validate_published_overrides.py \
            scripts/audit_catalogue_identity_media.py
          if git diff --cached --quiet; then
            echo 'quarantine boundaries already patched'
            exit 0
          fi
          git commit -m 'safety: make catalogue audit quarantine transient and recoverable'
          git push origin HEAD:main
