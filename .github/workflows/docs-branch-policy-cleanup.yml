name: NiakVIO one-shot branch policy docs cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-branch-policy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Align documentation with main-only code policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          pattern = re.compile(r"## Politique de branches\n.*?(?=\n## |\Z)", re.S)
          replacement = '''## Politique de branches

- `main` : unique branche de code, état stable et publiable ;
- `brain-learning/proposals` : mémoire sanitizée persistante du Brain, sans code de production ni publication autonome ;
- les Labs TV/Mobile/Desktop utilisent directement le SHA de `main` et les dépôts clients Nuvio officiels épinglés/résolus par les workflows natifs ;
- aucune branche `lab/*`, `fix/*`, `ci/*`, `proof/*`, `tmp/*`, `chore/*`, `refactor/*` ou `brain-repair/*` n'est conservée comme branche de travail.

Les réparations, tests et nettoyages sont matérialisés sur `main`. La mémoire Brain séparée reste non publiable et ne peut pas contourner les gates de production.
'''
          new, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'README branch policy section not found exactly once: {count}')
          readme.write_text(new, encoding='utf-8')

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          pattern = re.compile(r"## 22\. Labs permanents\n.*?(?=\n## 23\. Structure logique)", re.S)
          replacement = '''## 22. Labs natifs sur `main`

Les Labs ne reposent plus sur des branches de code permanentes. Les preuves NuvioTV, Mobile et Desktop sont produites depuis le SHA exact de `main`, avec les dépôts clients officiels utilisés comme baselines en lecture seule.

Une anomalie réelle devient une non-régression durable par la chaîne :

```text
bug réel
  → reproduction sur client officiel
  → observation
  → famille de cause
  → règle/recipe générique Core/Brain
  → validation
  → preuve runtime concernée
  → publication sur main
  → test permanent
```

`brain-learning/proposals` reste uniquement une mémoire sanitizée du Brain et ne constitue ni un Lab de code ni une voie de publication.
'''
          new, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ARCHITECTURE labs section not found exactly once: {count}')
          architecture.write_text(new, encoding='utf-8')

          for path in (readme, architecture):
              value = path.read_text(encoding='utf-8')
              for retired in ('lab/tv-real', 'lab/desktop-mobile-real'):
                  if retired in value:
                      raise SystemExit(f'{path}: retired branch reference remains: {retired}')
          PY

      - name: Remove one-shot workflow and commit exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/docs-branch-policy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'docs: align Labs with main-only code workflow'
          git pull --rebase origin main
          if grep -R -n -E 'lab/(tv-real|desktop-mobile-real)' README.md ARCHITECTURE.md; then
            echo 'Retired permanent lab branch reference remains in canonical docs' >&2
            exit 1
          fi
          git push origin HEAD:main
