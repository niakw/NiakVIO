name: temp-max-repair-correlated-handoff-v24

on:
  push:
    branches:
      - fix/non-display-recovery-20260916
    paths:
      - .github/workflows/temp-max-repair-correlated-handoff-v24.yml

permissions:
  contents: write

jobs:
  prove-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply outer-safety correlated handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_correlated_player_outer_safety_v2.py
          python3 scripts/update_memory_max_repair_20260916_v3.py
          python3 -m py_compile scripts/provider_patches/stream_output_sanitizer_v10.py scripts/upgrade_correlated_player_outer_safety_v2.py scripts/provider_patches/runtime_capability_media_safety_v4.py

      - name: Core ownership and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/global_core_presentation_pipeline_test.py
          python3 tests/scoped_playback_context_regression_test.py

      - name: Rematerialize current provider artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py

      - name: Probe MovieBox and residual current providers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-v24.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const result={};
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
          function file(pid){const rows=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(rows.length!==1)throw new Error(`manifest_provider_count:${pid}:${rows.length}`);const f=path.resolve(String(rows[0].filename||''));if(!fs.existsSync(f))throw new Error('missing:'+f);console.log('MANIFEST',pid,rows[0].filename,'canonical='+JSON.stringify(rows[0].canonicalSupportedTypes||[]));return f}
          function meta(s){return s.type==='movie'?{title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function run(label,s){
            try{
              const f=file(s.pid),ns=s.type==='movie'?'movie':'tv',m=meta(s);
              global.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m};
              global.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};
              global.__nuvioProviderDeadlineMs=Date.now()+30000;
              delete require.cache[f];const mod=require(f);
              const rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),31000))]);
              const out=Array.isArray(rows)?rows:[];
              console.log('PROBE',label,'count='+out.length,out.slice(0,5).map(r=>({url:r&&r.url,title:r&&r.title,privateProof:!!(r&&r.__nuvioCorrelatedPlayerFallbackV1),coreProof:!!(r&&r.__nuvioCoreMediaProofV1)})));
              let pageOk=false,status=0,ctype='';
              if(out[0]&&/^https?:\/\//i.test(String(out[0].url||''))){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(out[0].url,{headers:out[0].headers||{},redirect:'follow',signal:c.signal});status=r.status;ctype=r.headers.get('content-type')||'';const body=await r.text();pageOk=r.ok&&body.length>=100;console.log('PAGE',label,status,ctype,'bytes='+body.length,'final='+r.url)}catch(e){console.log('PAGE_ERROR',label,String(e&&e.message||e))}finally{clearTimeout(t)}}
              result[label]={count:out.length,pageOk,status,ctype,privateProof:out.some(r=>!!(r&&r.__nuvioCorrelatedPlayerFallbackV1)),coreProof:out.some(r=>!!(r&&r.__nuvioCoreMediaProofV1)),urls:out.slice(0,5).map(r=>String(r&&r.url||''))};
            }catch(e){console.log('PROBE_ERROR',label,String(e&&e.message||e));result[label]={count:0,pageOk:false,error:String(e&&e.message||e)}}
          }
          (async()=>{
            const specs={
              moviebox_movie:{pid:'moviebox',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              moviebox_tv:{pid:'moviebox',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              allanime:{pid:'allanime',id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178},
              wookafr:{pid:'wookafr',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              allwish:{pid:'allwish',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
              flemmix_movie:{pid:'flemmix',id:'1356963',type:'movie',title:'Little Lorraine',year:'2026'}
            };
            for(const [k,v] of Object.entries(specs))await run(k,v);
            fs.writeFileSync('/tmp/probe-v24.json',JSON.stringify(result,null,2));console.log('SUMMARY',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/probe-v24.cjs

      - name: MovieBox exact positive and private-proof cleanup gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/probe-v24.json'))
          bad=[]
          for key in ('moviebox_movie','moviebox_tv'):
              row=r.get(key) or {}
              if int(row.get('count') or 0)<1 or not row.get('pageOk'):
                  bad.append((key,row))
              if row.get('privateProof') or row.get('coreProof'):
                  bad.append((key,'private proof leaked to final output'))
          if bad: raise SystemExit('MOVIEBOX_V24_FAIL '+repr(bad))
          print('MOVIEBOX_V24_OK')
          print('RESIDUAL_ALLANIME',r.get('allanime'))
          print('RESIDUAL_WOOKA',r.get('wookafr'))
          print('EXTERNAL_ALLWISH',r.get('allwish'))
          print('EXTERNAL_FLEMMIX_MOVIE',r.get('flemmix_movie'))
          PY

      - name: Persist V24 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- scripts tests MEMORY.md provider-overrides.json providers provider-bases sources.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve correlated player proof until outer safety'
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
