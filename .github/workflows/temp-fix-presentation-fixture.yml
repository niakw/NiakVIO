name: TEMP - Fix presentation fixture
on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-presentation-fixture.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Replace archived Movix fixture with active Coflix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/global_stream_presentation_test.py')
          s=p.read_text(encoding='utf-8')
          old="vf = run(\"module.exports={getStreams:async()=>[{name:'Movix',url:'https://x.example/a.mp4',language:'fr',quality:'1080p'}]};\\n\", \"movix\", \"p.getStreams({mediaType:'movie',title:'Film',year:2026}).then(v=>console.log(JSON.stringify(v[0])))\")"
          new="vf = run(\"module.exports={getStreams:async()=>[{name:'Coflix',url:'https://x.example/a.mp4',language:'fr',quality:'1080p'}]};\\n\", \"coflix\", \"p.getStreams({mediaType:'movie',title:'Film',year:2026}).then(v=>console.log(JSON.stringify(v[0])))\")"
          if old not in s: raise SystemExit('Movix fixture token missing')
          s=s.replace(old,new)
          s=s.replace('assert vf[\"title\"] == \"Movix - 1080p\"','assert vf[\"title\"] == \"Coflix - 1080p - VF\"')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tests/global_stream_presentation_test.py
          git diff --check
      - name: Commit fixture migration
        run: |
          git config user.name niakvio-bot
          git config user.email niakvio-bot@users.noreply.github.com
          git add tests/global_stream_presentation_test.py
          git commit -m '[tests] use active Coflix for French presentation contract'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
