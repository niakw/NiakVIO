name: TEMP - Manifest Projection Hotfix V73
on:
  push:
    branches: [hotfix/manifest-projection-parity-20260917]
    paths:
      - '.github/workflows/temp-manifest-projection-hotfix-v73.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/manifest-projection-parity-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic projection synchronizer
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/sync_manifest_projection_rows.py <<'PY'
          #!/usr/bin/env python3
          """Synchronize derived manifest rows after targeted provider publication."""
          from __future__ import annotations
          import argparse, json
          from pathlib import Path
          from typing import Any
          from generate_language_manifests import build_no_anime_manifest, nested_entry

          ROOT = Path(__file__).resolve().parents[1]

          def load(path: Path) -> dict[str, Any]:
              value=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value,dict): raise SystemExit(f'{path}: object required')
              return value

          def canonical(value: object) -> str:
              return str(value or '').strip().casefold()

          def synced_vf(root_manifest: dict[str, Any], current_vf: dict[str, Any]) -> dict[str, Any]:
              root_rows={canonical(row.get('id')):row for row in root_manifest.get('scrapers') or [] if isinstance(row,dict) and canonical(row.get('id'))}
              rows=[]
              for old in current_vf.get('scrapers') or []:
                  if not isinstance(old,dict): continue
                  source=root_rows.get(canonical(old.get('id')))
                  if source is None: raise SystemExit(f'VF projection contains provider absent from root: {old.get("id")}')
                  rows.append(nested_entry(source))
              return {'name':f"{root_manifest.get('name','NiakVIO')} — VF uniquement",'version':root_manifest.get('version'),'scrapers':rows}

          def expected_all() -> dict[Path,dict[str,Any]]:
              root=load(ROOT/'manifest.json')
              vf=synced_vf(root,load(ROOT/'vf/manifest.json'))
              return {
                  Path('vf/manifest.json'):vf,
                  Path('no-anime/manifest.json'):build_no_anime_manifest(root),
                  Path('vf-no-anime/manifest.json'):build_no_anime_manifest(vf),
              }

          def sync(*,check:bool=False) -> int:
              drift=[]
              for relative,expected in expected_all().items():
                  path=ROOT/relative
                  if load(path)!=expected:
                      drift.append(str(relative))
                      if not check:path.write_text(json.dumps(expected,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              if check and drift: raise SystemExit('manifest projection parity drift: '+','.join(drift))
              print(f"MANIFEST_PROJECTION_PARITY {'CHECK' if check else 'SYNC'} drift={len(drift)} files={','.join(drift) if drift else '-'}")
              return 0

          def main() -> int:
              p=argparse.ArgumentParser();p.add_argument('--check',action='store_true');a=p.parse_args();return sync(check=a.check)
          if __name__=='__main__':raise SystemExit(main())
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize_provider_v3_one.py');s=p.read_text(encoding='utf-8')
          marker='    allmat.write_json(allmat.DEFAULT_SOURCE_MANIFEST, manifest)\n'
          call="    from sync_manifest_projection_rows import sync as sync_manifest_projections\n    sync_manifest_projections(check=False)\n"
          if 'sync_manifest_projections(check=False)' not in s:
              if marker not in s: raise SystemExit('materializer marker missing')
              s=s.replace(marker,marker+call,1);p.write_text(s,encoding='utf-8')
          p=Path('scripts/domain_refresh_transaction_v2.py');s=p.read_text(encoding='utf-8')
          marker='        bundle_updates = rebuild_provider_configs(changed_provider_ids)\n'
          call="        from sync_manifest_projection_rows import sync as sync_manifest_projections\n        sync_manifest_projections(check=False)\n"
          if 'sync_manifest_projections(check=False)' not in s:
              if marker not in s: raise SystemExit('domain refresh marker missing')
              s=s.replace(marker,marker+call,1);p.write_text(s,encoding='utf-8')
          PY
      - name: Prove parity and self-healing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_manifest_projection_rows.py scripts/materialize_provider_v3_one.py scripts/domain_refresh_transaction_v2.py
          python scripts/sync_manifest_projection_rows.py --check
          python scripts/validate_language_projection.py
          python tests/language_projection_test.py
          python - <<'PY'
          import json
          p='vf/manifest.json';d=json.load(open(p));row=next(x for x in d['scrapers'] if str(x.get('id')).casefold()=='purstream');row['version']='0.0.0-test-drift';open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          if python scripts/sync_manifest_projection_rows.py --check; then echo 'expected drift was not detected' >&2; exit 1; fi
          python scripts/sync_manifest_projection_rows.py
          python scripts/sync_manifest_projection_rows.py --check
          python scripts/validate_language_projection.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=json.load(open('manifest.json'));rb={str(r.get('id','')).casefold():r for r in root['scrapers']}
          for rel in ['vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json']:
              doc=json.load(open(rel));missing=[];mismatch=[]
              for row in doc['scrapers']:
                  src=dict(rb[str(row.get('id')).casefold()]);f=str(src.get('filename') or '')
                  if f and not f.startswith(('http://','https://','/','../')):src['filename']='../'+f
                  if row!=src:mismatch.append(row.get('id'))
                  fn=str(row.get('filename') or '');target=(Path(rel).parent/fn).resolve()
                  if not fn or not target.is_file():missing.append((row.get('id'),fn))
              print('HOTFIX_HARDENED_PARITY',rel,'rows',len(doc['scrapers']),'mismatch',mismatch,'missing',missing)
              assert not mismatch and not missing
          pur=next(r for r in json.load(open('vf/manifest.json'))['scrapers'] if str(r.get('id')).casefold()=='purstream')
          assert pur['version']==rb['purstream']['version']=='3.0.87'
          print('HOTFIX_PURSTREAM_STABLE',pur['version'],pur['filename'])
          PY
          grep -q 'sync_manifest_projections(check=False)' scripts/materialize_provider_v3_one.py
          grep -q 'sync_manifest_projections(check=False)' scripts/domain_refresh_transaction_v2.py
      - name: Persist recurrence prevention
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Bot';git config user.email 'actions@users.noreply.github.com'
          git add scripts/sync_manifest_projection_rows.py scripts/materialize_provider_v3_one.py scripts/domain_refresh_transaction_v2.py vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json
          git diff --cached --exit-code && { echo 'nothing to persist'; exit 1; } || true
          git commit -m 'fix(manifests): sync projections after targeted publication'
          git push origin HEAD:hotfix/manifest-projection-parity-20260917
