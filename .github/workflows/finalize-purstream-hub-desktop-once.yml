name: Finalize Purstream hub resolution once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-purstream-hub-desktop-once.yml'

permissions:
  contents: write

concurrency:
  group: finalize-purstream-hub-desktop-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Materialize Purstream terminal contract from official hub observation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          hub_path = Path('provider-hubs.json')
          hubs = json.loads(hub_path.read_text(encoding='utf-8'))
          row = hubs['providers']['purstream']
          row['hub'] = 'https://purstream.wiki/'
          row['direct'] = 'https://purstream.id/'
          row['direct_candidates'] = ['https://purstream.id/']
          row['allowed_terminal_hosts'] = ['purstream.id']
          row['allowed_terminal_host_patterns'] = [r'^purstream\.[a-z0-9-]{2,20}$']
          row['resolver'] = 'official_outbound'
          row['resolution_method'] = 'hub_current_address'
          row['resolution_note'] = 'Read the current Purstream address exposed by the official hub; accept URL or host text, then validate the terminal before persistence.'
          row['last_verified'] = '2026-08-26'
          sources = [s for s in (row.get('sources') or []) if isinstance(s, dict) and s.get('type') != 'direct']
          if not any(s.get('type') == 'hub' and s.get('url') == 'https://purstream.wiki/' for s in sources):
              sources.insert(0, {'type':'hub','url':'https://purstream.wiki/','priority':110,'purpose':'Official current-address hub'})
          sources.append({'type':'direct','url':'https://purstream.id/','priority':95,'purpose':'Current terminal observed from official hub and subject to runtime validation'})
          row['sources'] = sources
          hub_path.write_text(json.dumps(hubs, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          override_path = Path('provider-overrides.json')
          overrides = json.loads(override_path.read_text(encoding='utf-8'))
          p = overrides['provider_patches']['purstream']
          p['official_hub'] = 'https://purstream.wiki'
          p['official_site'] = 'https://purstream.id'
          p['official_api'] = 'https://api.purstream.id/api/v1'
          p['fixed_endpoint'] = {
              'resolver_function': 'detectPurstreamDomain',
              'api': 'https://api.purstream.id/api/v1',
              'referer': 'https://purstream.id/'
          }
          p['replacements'] = dict(p.get('replacements') or {})
          p['replacements']['https://raw.githubusercontent.com/wooodyhood/nuvio-repo/main/domains.json'] = 'https://purstream.wiki/'
          p['required_values'] = sorted(set((p.get('required_values') or []) + ['api.purstream.id', 'purstream.id']))
          notes = list(p.get('notes') or [])
          note = 'Official hub purstream.wiki currently resolves to purstream.id; materialize the validated terminal and never keep an upstream repository lookup in published runtime bytes.'
          if note not in notes: notes.append(note)
          p['notes'] = notes
          override_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Make final artifact validation unconditional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/reapply_published_overrides.py')
          text=path.read_text(encoding='utf-8')
          old='''        changed = patched != original\n        if changed:\n            validate_artifact(patched, provider_id)\n            applied_count += 1\n'''
          new='''        changed = patched != original\n        # Validate every final published artifact, not only bundles whose bytes changed.\n        # This makes new publication/security policies retroactive across the full catalogue.\n        validate_artifact(patched, provider_id)\n        if changed:\n            applied_count += 1\n'''
          if old not in text:
              raise SystemExit('expected conditional validation block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Prove Purstream override removes repository runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          hubs=json.loads(Path('provider-hubs.json').read_text())
          p=hubs['providers']['purstream']
          assert p['hub']=='https://purstream.wiki/'
          assert p['direct']=='https://purstream.id/'
          overrides=json.loads(Path('provider-overrides.json').read_text())['provider_patches']['purstream']
          assert overrides['fixed_endpoint']['api']=='https://api.purstream.id/api/v1'
          assert overrides['fixed_endpoint']['referer']=='https://purstream.id/'
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from apply_provider_overrides import apply_overrides
          src=Path('providers/purstream--nuvio--a28c9c80256074a4.js').read_bytes()
          out,records=apply_overrides('purstream',src,phase='discovery')
          text=out.decode('utf-8')
          assert 'raw.githubusercontent.com/wooodyhood/nuvio-repo' not in text
          assert 'NUVIO_FIXED_ENDPOINT:https://api.purstream.id/api/v1' in text
          Path('/tmp/purstream-patched.js').write_bytes(out)
          print('FIELD_PURSTREAM_HUB_MATERIALIZATION state=passed records=%d' % len(records))
          PY
          node scripts/validate_provider_artifact.cjs /tmp/purstream-patched.js
          python tests/provider_hub_curated_baseline_test.py
          python tests/provider_hub_registry_test.py

      - name: Clean diagnostics and publish final hub fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/purstream-hub-api-once.yml
          rm -f .github/workflows/purstream-hub-assets-once.yml
          rm -f .github/workflows/purstream-terminal-resolution-once.yml
          rm -f .github/workflows/finalize-purstream-hub-desktop-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-hubs.json provider-overrides.json scripts/reapply_published_overrides.py .github/workflows/
          git commit -m 'fix: materialize Purstream official terminal route'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
