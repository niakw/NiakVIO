name: One-shot Provider v3 runtime settlement migration

on:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - .github/workflows/zz-provider-v3-runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/provider-v3-performance-playback
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize compact analyzer anchor
        run: python scripts/one_shot_native_runtime_prepatch.py

      - name: Apply exact migration
        run: python scripts/one_shot_native_runtime_migration.py

      - name: Materialize common ProviderBase and Lego bundles
        run: |
          python scripts/materialize_provider_base_v3_store.py
          NUVIO_PROVIDER_V3_CONTEXT=workspace python scripts/materialize_provider_v3_all.py

      - name: Verify runtime and 96-provider fixed point
        run: |
          python -m py_compile scripts/native_media_type_contract.py scripts/prepare_native_corpus_validation.py scripts/native_player_diagnostics_codegen.py scripts/provider_base_store.py tests/native_runtime_settlement_contract_test.py
          node --check scripts/analyze_native_corpus_results.cjs
          node --check scripts/analyze_native_corpus_collection.cjs
          python tests/native_runtime_settlement_contract_test.py
          python tests/native_corpus_device_lab_test.py
          python tests/native_player_diagnostics_codegen_test.py
          python tests/native_media_type_resolution_test.py
          python tests/native_android_lab_transport_test.py
          python tests/native_corpus_transport_capability_test.py
          python tests/global_catalogue_alias_recovery_test.py
          python tests/provider_base_store_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/provider_clean_reconstruction_contract_test.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python scripts/verify_provider_publication_fixed_point.py

      - name: Commit verified result and remove temporary runner
        run: |
          rm .github/workflows/zz-provider-v3-runtime-migration.yml scripts/one_shot_native_runtime_migration.py scripts/one_shot_native_runtime_prepatch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix(runtime): settle native playback deterministically"
          git push origin HEAD:workbench/provider-v3-performance-playback
