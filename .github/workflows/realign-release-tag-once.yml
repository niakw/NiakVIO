name: Realign 5.21.16 release tag (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realign-release-tag-once.yml'

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Move 5.21.16 to final validated clean commit
        shell: bash
        run: |
          set -euo pipefail
          target="783c7d504bb3ef05fba50d63d8d0d548491afe53"
          git tag -f 5.21.16 "$target"
          git push --force origin refs/tags/5.21.16
