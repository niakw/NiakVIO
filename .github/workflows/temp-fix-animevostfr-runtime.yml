name: TEMP - Fix AnimeVOSTFR runtime binding

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-animevostfr-runtime.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace
  NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '0'

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[animevostfr-runtime]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Bind dedicated runtime and narrow semantic lane to anime
        run: |
          python scripts/fix_cdn_runtime_lego_bindings_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          def rewrite(path):
              if not path.exists(): return
              d=json.loads(path.read_text())
              changed=False
              for r in d.get('scrapers') or []:
                  if str(r.get('id','')).lower()=='animevostfr':
                      r['canonicalSupportedTypes']=['anime']
                      r['supportedTypes']=['anime','tv','series']
                      changed=True
              if changed:path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          for rel in ('manifest.json','manifest-hub46.json','native-hub46/manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              rewrite(Path(rel))
          p=Path('provider_catalog.json');d=json.loads(p.read_text())
          for row in d.get('providers') or []:
              if str(row.get('canonicalId','')).lower()=='animevostfr':
                  s=row.get('scraper') or {};s['canonicalSupportedTypes']=['anime'];s['supportedTypes']=['anime','tv','series'];row['scraper']=s
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/materialize_provider_v3_one.py animevostfr
          python scripts/audit_provider_v3_static.py
      - name: Exact multi-fixture proof
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity as p
          fixtures=[
            {'tmdbId':'95479','mediaType':'anime','category':'anime','title':'Jujutsu Kaisen','year':2020,'season':1,'episode':1},
            {'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1},
            {'tmdbId':'31911','mediaType':'anime','category':'anime','title':'Fullmetal Alchemist: Brotherhood','year':2009,'season':1,'episode':1},
          ]
          cat=p.local_catalog();out=[]
          for f in fixtures:
              r=p.run_worker(cat['animevostfr']['path'],f,55)
              row={'fixture':f['title'],'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('http_statuses') or [],'error':r.get('error_class'),'timeout':bool(r.get('timeout'))}
              out.append(row);print('ANIMEVOSTFR_RUNTIME_PROOF '+json.dumps(row,sort_keys=True))
          Path('automation/animevostfr-runtime-proof.json').write_text(json.dumps(out,indent=2)+'\n')
          if not any(x['streams']>0 for x in out): raise SystemExit('AnimeVOSTFR dedicated runtime still returns zero on all exact fixtures')
          PY
      - name: Promote repair state and reconfirm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json');d=json.loads(p.read_text());r=d['provider_patches']['animevostfr'];r['route_data_state']='on';r['published_types']=['anime'];disp=r.get('repair_disposition') if isinstance(r.get('repair_disposition'),dict) else {};r['repair_disposition']=disp
          disp.update({'routeDataState':'on','requiredLanes':['anime'],'currentVerifiedLanes':['anime'],'provenLanes':['anime'],'missingLanes':[],'completeCapabilityProof':True,'recoveryStatus':'dedicated-runtime-live-positive','terminalState':None,'quarantined':False,'reasonCodes':['dedicated_runtime_bound','current_anime_stream_positive']})
          disp['laneStatuses']={'anime':['playable_verified']}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/materialize_provider_v3_one.py animevostfr
          python scripts/audit_provider_v3_static.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          f={'tmdbId':'31911','mediaType':'anime','category':'anime','title':'Fullmetal Alchemist: Brotherhood','year':2009,'season':1,'episode':1}
          r=p.run_worker(p.local_catalog()['animevostfr']['path'],f,55);print('ANIMEVOSTFR_RECONFIRM streams='+str(r.get('stream_count'))+' statuses='+str(r.get('http_statuses')))
          if int(r.get('stream_count') or 0)<=0: raise SystemExit('AnimeVOSTFR positive lost after promotion')
          PY
      - name: Commit proven repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json provider_catalog.json manifest.json manifest-hub46.json native-hub46/manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json providers automation/animevostfr-runtime-proof.json
          git commit -m '[animevostfr-runtime] bind dedicated anime runtime after live proof'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
