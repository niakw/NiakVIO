name: FIX - Publish Terminal Session V29

on:
  push:
    branches: [main]
    paths:
      - "scripts/trigger-terminal-session-v29.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-terminal-session-v29
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply canonical V29 source patch
        run: python3 scripts/oneoff_terminal_session_v29.py

      - name: Targeted source regressions
        run: |
          set -euo pipefail
          node engine_v2/tests/stream-presentation.test.mjs
          python3 tests/provider_latest_request_cancellation_test.py
          python3 tests/provider_native_abort_ignorant_cancellation_test.py
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/global_media_type_resolution_test.py
          python3 tests/native_media_type_capability_test.py
          python3 tests/native_runtime_settlement_contract_test.py

      - name: Rematerialize 96 public providers
        run: |
          set -euo pipefail
          cp manifest.json /tmp/manifest.previous.json
          python3 scripts/reapply_published_overrides.py
          python3 scripts/generate_language_manifests.py
          python3 scripts/prune_unreferenced_providers.py
          python3 scripts/sync_release_versions.py --previous /tmp/manifest.previous.json
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check

      - name: Verify V29 is physically present in every public bundle
        run: |
          set -euo pipefail
          python3 tests/provider_base_store_test.py
          python3 tests/provider_coverage_preservation_test.py
          python3 tests/global_stream_output_guard_test.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          rows=manifest.get('scrapers') or []
          assert len(rows)==96, len(rows)
          bad=[]
          for row in rows:
              text=(root/str(row['filename'])).read_text(encoding='utf-8')
              missing=[]
              for marker in (
                  'tmdb-data-contract-launch-gate-v29-native-abort-race',
                  'function requestAbortPromise(controller,requestToken)',
                  'all-providers-client-projection-name-mirror-v20',
              ):
                  if marker not in text: missing.append(marker)
              if missing: bad.append((row['id'],missing))
          assert not bad, bad[:10]
          print('V29/public presentation contract present 96/96')
          PY

      - name: Live Interstellar matrix
        run: python3 scripts/interstellar_nuvio_matrix.py --workers 12 --timeout 35 --output automation/interstellar-nuvio-matrix.json

      - name: Live Hell Mode S01E12 desktop matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          fixture={
            'tmdbId':'tt38646634','mediaType':'series','season':1,'episode':12,
            'title':'HELL MODE: The Hardcore Gamer Dominates in Another World with Garbage Balancing',
            'label':'Hell Mode S01E12','category':'anime'
          }
          context={
            'locale':'fr-FR','language':'fr','languages':['fr-FR','fr','en'],
            'platform':'desktop','settings':{},'storage':{},'injectAcceptLanguage':True,
            'networkLimits':{'maxFetches':30,'maxResponseBytes':5242880,'maxTotalResponseBytes':20971520,'maxDistinctHosts':20,'maxRedirects':5},
            'maxSettingsProfiles':1,
          }
          candidates=[]
          for row in manifest.get('scrapers') or []:
            if row.get('enabled') is not True: continue
            semantic={str(x).casefold() for x in (row.get('canonicalSupportedTypes') or row.get('supportedTypes') or [])}
            transport={str(x).casefold() for x in (row.get('supportedTypes') or [])}
            if 'anime' in semantic or {'tv','series'} & transport: candidates.append(row)
          def probe(row):
            cmd=['node','--max-old-space-size=1024','scripts/provider_worker.cjs',str(row['filename']),json.dumps(fixture,ensure_ascii=False),json.dumps(context,ensure_ascii=False)]
            try:
              cp=subprocess.run(cmd,cwd=root,text=True,capture_output=True,timeout=35,check=False,env=os.environ.copy())
            except subprocess.TimeoutExpired:
              return {'id':str(row['id']).casefold(),'count':0,'ok':False,'error':'timeout'}
            payload=None
            for line in cp.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                try: payload=json.loads(line.split('=',1)[1])
                except Exception: pass
            if not payload:
              return {'id':str(row['id']).casefold(),'count':0,'ok':False,'error':'missing_worker_payload','stderr':cp.stderr[-500:]}
            return {
              'id':str(row['id']).casefold(),'count':int(payload.get('stream_count') or 0),'ok':bool(payload.get('ok')),
              'error':payload.get('error') or (payload.get('error_details') or {}).get('message'),
              'hosts':payload.get('provider_server_hosts') or [],'statuses':payload.get('provider_server_http_statuses') or []
            }
          results=[]
          with ThreadPoolExecutor(max_workers=min(10,max(1,len(candidates)))) as ex:
            futs={ex.submit(probe,row):row for row in candidates}
            for i,f in enumerate(as_completed(futs),1):
              r=f.result();results.append(r);print(f"[{i}/{len(candidates)}] {r['id']} streams={r['count']} error={r.get('error')}",flush=True)
          results.sort(key=lambda x:x['id'])
          positive=[r['id'] for r in results if r['count']>0]
          report={'generated_at':datetime.now(timezone.utc).isoformat(),'manifest_version':manifest.get('version'),'fixture':fixture,'providers_tested':len(results),'positive_count':len(positive),'positive_ids':positive,'providers':results}
          Path('automation/hellmode-desktop-matrix.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'tested':len(results),'positive_count':len(positive),'positive_ids':positive},ensure_ascii=False))
          PY

      - name: Refresh hashes after live reports
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit verified V29 release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to publish'
            exit 0
          fi
          git commit -m 'fix(core): publish terminal labels and stale-session isolation V29'
          git pull --rebase origin main
          git push origin HEAD:main
