name: SHORT - Apply Manual Evidence Active44 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manual-evidence-active44-20260915-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-manual-evidence-active44
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and prove active scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          from __future__ import annotations
          import json, pathlib, re, subprocess
          from collections import Counter

          R=pathlib.Path('.')
          OFF={
            'desiflix':'manual_off_compromised_or_inappropriate_redirect',
            'fullanime':'manual_off_no_current_hub_authority',
          }
          MANUAL={'allwish','allanime','moviesmod','4khdhub'}
          ACTIVE=44
          CATALOGUE=46
          DATE='2026-09-15'

          def cid(v): return str(v or '').strip().casefold().replace('_','-')
          def load(p): return json.loads((R/p).read_text(encoding='utf-8'))
          def dump(p,v):
            q=R/p; q.parent.mkdir(parents=True,exist_ok=True)
            q.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def uniq(xs):
            out=[]
            for x in xs:
              if x not in out: out.append(x)
            return out

          evidence={
            'schemaVersion':1,'date':DATE,'authority':'user-manual-browser-evidence',
            'policy':{
              'doNotRequestDuplicateManualTests':True,
              'manualBrowserPositiveIsNotNativePlayerProof':True,
              'historicalAutomatedZeroMayBeSupersededByNewerManualEvidence':True,
            },
            'providers':{
              'desiflix':{'classification':'OFF','activeScope':False,'reason':'current redirect authority is compromised/inappropriate; user explicitly disabled provider'},
              'fullanime':{'classification':'OFF','activeScope':False,'reason':'no current hub/address authority found; user explicitly disabled provider'},
              'moviesmod':{
                'classification':'MANUAL_TERMINAL_POSITIVE_INTEGRATION_PENDING',
                'observedChainHosts':['links.modpro.blog','cloud.unblockedgames.world','urlflix.xyz','driveseed.org','video-seed.dev','video-downloads.googleusercontent.com'],
                'observed':'Interstellar route reaches direct media/download after interactive human/redirection gate',
                'remaining':'provider-side bypass/bridge; older automated ZERO is not no-route authority',
              },
              '4khdhub':{
                'classification':'MANUAL_MOVIE_TV_ROUTE_POSITIVE_INTEGRATION_PENDING',
                'hub':'https://hdhub4u.bi/','terminal':'https://new5.hdhub4u.cl/',
                'observedChainHosts':['hubcdn.lol','greenmountmotors.com','hblinks.co','hubdrive.sbs','hubcloud.ist','pixel.hubcloud.ist'],
                'observed':'Interstellar movie route and House of the Dragon episodic route present in browser',
                'remaining':'redirect/button/timing bypass and native terminal proof',
              },
              'allwish':{
                'classification':'MANUAL_HLS_POSITIVE_INTEGRATION_PENDING','hub':'https://t.me/s/allwishme','terminal':'http://all-wish.me/',
                'observedChainHosts':['fetch.nexabloom.top'],'observed':'Death Note episode 37 master/index HLS requests returned HTTP 200 in browser',
                'remaining':'Niak/native extraction reproduction; no duplicate manual retest',
              },
              'allanime':{
                'classification':'MANUAL_HLS_POSITIVE_INTEGRATION_PENDING','hub':'https://allanime.sa.com/','terminal':'https://ww2.aniwatch.fit/',
                'observedChainHosts':['fetch.nexabloom.top'],'observed':'One Piece episode master/index HLS requests returned HTTP 200 in browser; catalogue reduced',
                'remaining':'Niak/native extraction reproduction; no duplicate manual retest',
              },
            },
          }
          dump('automation/manual-provider-evidence-20260915.json',evidence)

          # Address authority. FullAnime may have no registry row at all; absence is valid and must not be fabricated.
          hubs=load('provider-hubs.json'); hp=hubs.get('providers') or {}
          matched={p:[] for p in OFF}
          for key,row in hp.items():
            if not isinstance(row,dict): continue
            identities={cid(key),cid(row.get('id')),cid(row.get('provider')),cid(row.get('manifestId'))}
            identities.update(cid(x) for x in row.get('aliases') or [])
            for pid,reason in OFF.items():
              if pid in identities:
                row['hub']=None
                row['manifest_status']='Inactif'
                row['activation_eligible']=False
                row['manual_off_reason']=reason
                row['manual_off_date']=DATE
                matched[pid].append(key)
          assert matched['desiflix'], 'desiflix hub authority row not found'
          four=hp.get('4khdhub')
          assert isinstance(four,dict), '4khdhub hub registry row missing'
          four['hub']='https://hdhub4u.bi/'
          four['direct']='https://new5.hdhub4u.cl/'
          four['activation_eligible']=True
          four['manual_authority_date']=DATE
          four['direct_candidates']=uniq(['https://new5.hdhub4u.cl/']+list(four.get('direct_candidates') or []))
          four['allowed_terminal_hosts']=uniq(['new5.hdhub4u.cl']+list(four.get('allowed_terminal_hosts') or []))
          dump('provider-hubs.json',hubs)

          # Canonical census remains 46, explicit executable scope becomes 44.
          for rel in ['manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json']:
            if not (R/rel).is_file(): continue
            d=load(rel)
            for row in d.get('scrapers') or []:
              if isinstance(row,dict) and cid(row.get('id')) in OFF:
                row['enabled']=False
                row['disabledReason']=OFF[cid(row.get('id'))]
            dump(rel,d)
          root=load('manifest.json'); root_rows=[r for r in root.get('scrapers') or [] if isinstance(r,dict)]
          assert len(root_rows)==CATALOGUE, f'canonical census={len(root_rows)} expected={CATALOGUE}'
          assert sum(r.get('enabled') is True for r in root_rows)==ACTIVE, 'root active count is not 44'
          assert all(next(r for r in root_rows if cid(r.get('id'))==p).get('enabled') is False for p in OFF)

          # Nuvio client ID projection.
          if (R/'nuvio-client-id-state.json').is_file():
            st=load('nuvio-client-id-state.json')
            def walk(v):
              if isinstance(v,dict):
                for k,x in v.items():
                  if cid(k) in OFF and isinstance(x,dict) and 'enabled' in x: x['enabled']=False
                  walk(x)
              elif isinstance(v,list):
                for x in v: walk(x)
            walk(st); dump('nuvio-client-id-state.json',st)

          # Matrix is the active authority; keep the historical filename for compatibility only.
          matrix=load('automation/evidence/hub-lab-matrix-46.json')
          rows=[]
          for row in matrix.get('rows') or []:
            if not isinstance(row,dict): continue
            ids={cid(row.get('registryId')),cid(row.get('manifestId')),cid(row.get('provider'))}
            if ids & set(OFF): continue
            rows.append(row)
          assert len(rows)==ACTIVE, f'active matrix rows={len(rows)} expected={ACTIVE}'
          matrix['rows']=rows
          matrix['hubCount']=ACTIVE
          matrix['activeProviderCount']=ACTIVE
          matrix['catalogueProviderCount']=CATALOGUE
          matrix['scopePolicy']='dynamic-active-hub-authority'
          matrix['excludedProviders']=[{'provider':p,'state':'off','reason':OFF[p]} for p in sorted(OFF)]
          dump('automation/evidence/hub-lab-matrix-46.json',matrix)

          # Repair disposition: manual positives stay repair until native integration, OFF providers leave the incomplete queue.
          disp=load('automation/provider-repair-disposition.json')
          prows=[r for r in disp.get('providers') or [] if isinstance(r,dict)]
          assert len(prows)==CATALOGUE, f'disposition census={len(prows)}'
          seen=set()
          for row in prows:
            pid=cid(row.get('provider')); seen.add(pid)
            if pid in OFF:
              row.update({'activationState':'disabled','activationAuthority':'manual-user-off-20260915','forcedEnabled':False,'routeDataState':'off','terminalState':'manual-off','completeCapabilityProof':False,'recoveryStatus':'manual-off','manualEvidenceRef':'automation/manual-provider-evidence-20260915.json'})
              row['quarantined']=(pid=='desiflix')
              row['reasonCodes']=uniq(list(row.get('reasonCodes') or [])+[OFF[pid]])
            elif pid in MANUAL:
              row['manualEvidenceRef']='automation/manual-provider-evidence-20260915.json'
              row['recoveryStatus']='manual-positive-integration-pending'
              row['reasonCodes']=uniq([x for x in list(row.get('reasonCodes') or []) if x!='recovery_no-proven-route']+['manual_browser_positive_integration_pending'])
              if row.get('routeDataState')=='off': row['routeDataState']='repair'; row['terminalState']=None
          assert set(OFF)<=seen
          disp['catalogueProviderCount']=CATALOGUE
          disp['enabledProviderCount']=ACTIVE
          disp['disabledProviderCount']=2
          disp['disabledProviders']=sorted(OFF)
          incomplete=[cid(x) for x in disp.get('incompleteProviders') or [] if cid(x) not in OFF]
          disp['incompleteProviders']=incomplete; disp['incompleteProviderCount']=len(incomplete)
          pol=disp.setdefault('policy',{}); pol['targetHubProviderCount']=ACTIVE; pol['activationAuthority']='active rows in automation/evidence/hub-lab-matrix-46.json plus explicit manual OFF authority'; pol['terminalOrQuarantinedState']='off'
          c=Counter(str(r.get('routeDataState') or 'repair') for r in prows); disp['stateCounts']={k:c.get(k,0) for k in ('off','on','repair')}
          dump('automation/provider-repair-disposition.json',disp)

          audit='automation/final-seven-technical-audit-20260915.json'
          if (R/audit).is_file():
            a=load(audit)
            a['manualEvidenceSupersession']={'date':DATE,'evidenceRef':'automation/manual-provider-evidence-20260915.json','providers':{'allwish':'MANUAL_HLS_POSITIVE_INTEGRATION_PENDING','moviesmod':'MANUAL_TERMINAL_POSITIVE_INTEGRATION_PENDING','fullanime':'OFF_NO_CURRENT_HUB_AUTHORITY'},'note':'Original automated ZERO observations remain historical measurements, not current no-route authority.'}
            dump(audit,a)

          # Dynamic count in physical manifest generator.
          p=R/'scripts/generate_hub46_manifest.py'; t=p.read_text(encoding='utf-8')
          t=t.replace('EXPECTED_COUNT = 46\n','')
          t=t.replace('    if declared != EXPECTED_COUNT or len(ids) != EXPECTED_COUNT:\n        raise SystemExit(\n            f"Hub-46 authority mismatch: hubCount={declared} rows={len(ids)} expected={EXPECTED_COUNT}"\n        )', '    if declared <= 0 or len(ids) != declared:\n        raise SystemExit(f"active hub authority mismatch: hubCount={declared} rows={len(ids)}")')
          t=t.replace('    if len(selected) != EXPECTED_COUNT:\n        raise SystemExit(f"derived manifest count={len(selected)} expected={EXPECTED_COUNT}")','    expected_count = len(wanted)\n    if len(selected) != expected_count:\n        raise SystemExit(f"derived manifest count={len(selected)} expected={expected_count}")')
          t=t.replace('"kind": "hub46-repair-campaign",\n        "providerCount": EXPECTED_COUNT','"kind": "active-hub-repair-campaign",\n        "providerCount": len(wanted)')
          t=t.replace('providers={EXPECTED_COUNT}', "providers={len(output.get('scrapers') or [])}")
          assert 'EXPECTED_COUNT' not in t
          p.write_text(t,encoding='utf-8')

          # Dynamic native transport count.
          p=R/'scripts/build_hub46_native_manifest.py'; t=p.read_text(encoding='utf-8')
          t=t.replace('if expected != 46 or len(ids) != 46:', 'if expected <= 0 or len(ids) != expected:')
          t=t.replace('if missing or extra or len(selected) != 46:', 'if missing or extra or len(selected) != len(scoped):')
          t=t.replace('providers=46 provider_sha=', "providers={len(payload.get('scrapers') or [])} provider_sha=")
          p.write_text(t,encoding='utf-8')

          # Future matrix rebuilds ignore disabled manifest rows and do not require the historical count.
          p=R/'scripts/build_hub_lab_matrix.py'; t=p.read_text(encoding='utf-8')
          old='''    for row in data.get("scrapers", []):\n        if not isinstance(row, dict):\n            continue\n        pid = str(row.get("id") or "").strip()'''
          new='''    for row in data.get("scrapers", []):\n        if not isinstance(row, dict):\n            continue\n        if row.get("enabled") is False:\n            continue\n        pid = str(row.get("id") or "").strip()'''
          assert old in t; t=t.replace(old,new,1)
          t=t.replace('    if len(out) != 46:\n        raise SystemExit(f"provider-hubs invariant failed: expected 46 non-null hubs, got {len(out)}")','    if not out:\n        raise SystemExit("provider-hubs invariant failed: no active non-null hubs")')
          t=t.replace('    assert len(rows) == 46\n','    assert rows\n')
          p.write_text(t,encoding='utf-8')

          # Activation validator: census stays 46; executable target count follows the matrix.
          p=R/'scripts/validate_activation_preservation.py'; t=p.read_text(encoding='utf-8')
          t=t.replace('* every canonical provider remains present and ``enabled=true`` in the catalogue;','* every canonical provider remains present; active rows follow the matrix while explicit manual OFF rows remain disabled;')
          t=t.replace('    if int(matrix.get("hubCount") or 0) != 46 or len(target) != 46:\n        errors.append(f"hub activation authority must contain exactly 46 providers, got {len(target)}")\n    if len(main_rows) != 96:\n        errors.append(f"canonical catalogue must contain 96 providers, got {len(main_rows)}")', '    expected = int(matrix.get("hubCount") or 0)\n    if expected <= 0 or len(target) != expected:\n        errors.append(f"hub activation authority mismatch: declared={expected} rows={len(target)}")\n    if len(main_rows) != 46:\n        errors.append(f"canonical catalogue must contain 46 providers, got {len(main_rows)}")')
          t=t.replace('errors.append("46-hub target missing from canonical catalogue: " + ",".join(missing))','errors.append("active-hub target missing from canonical catalogue: " + ",".join(missing))')
          t=t.replace('errors.append("46-hub target unexpectedly disabled: " + ",".join(disabled_target))','errors.append("active-hub target unexpectedly disabled: " + ",".join(disabled_target))')
          t=t.replace('    if len(active) != 46:\n        errors.append(f"enabled provider count must be exactly 46, got {len(active)}")','    if len(active) != expected:\n        errors.append(f"enabled provider count must equal active authority {expected}, got {len(active)}")')
          t=t.replace('exact hub-matrix-46 authority','dynamic active hub-matrix authority')
          p.write_text(t,encoding='utf-8')

          # Other current Hub46 gates must consume the matrix count rather than reject 44.
          for rel in ['scripts/build_hub46_blocker_inventory.py','scripts/finalize_provider_repair_disposition_v1_impl.py','scripts/fix_cdn_runtime_lego_bindings_v1.py']:
            p=R/rel
            if not p.is_file(): continue
            t=p.read_text(encoding='utf-8')
            t=re.sub(r'if int\(matrix\.get\("hubCount"\) or 0\) != 46 or len\(([^)]+)\) != 46:',r'if int(matrix.get("hubCount") or 0) <= 0 or len(\1) != int(matrix.get("hubCount") or 0):',t)
            t=re.sub(r'if int\(hub_matrix\.get\("hubCount"\) or 0\) != 46 or len\(([^)]+)\) != 46:',r'if int(hub_matrix.get("hubCount") or 0) <= 0 or len(\1) != int(hub_matrix.get("hubCount") or 0):',t)
            p.write_text(t,encoding='utf-8')

          # Rebuild derived root transport; native transport retains frozen URLs and is filtered now, then repinned by normal release-finalize.
          subprocess.run(['python3','scripts/generate_hub46_manifest.py','--source','manifest.json','--matrix','automation/evidence/hub-lab-matrix-46.json','--output','manifest-hub46.json'],check=True)
          mh=load('manifest-hub46.json'); assert len(mh.get('scrapers') or [])==ACTIVE
          assert not ({cid(r.get('id')) for r in mh.get('scrapers') or []}&set(OFF))
          native=load('native-hub46/manifest.json'); wanted={cid(r.get('manifestId')) for r in rows}
          native['scrapers']=[r for r in native.get('scrapers') or [] if isinstance(r,dict) and cid(r.get('id')) in wanted]
          native['labScope']={'kind':'active-hub-repair-campaign','providerCount':ACTIVE,'authority':'automation/evidence/hub-lab-matrix-46.json'}
          assert len(native['scrapers'])==ACTIVE; dump('native-hub46/manifest.json',native)

          mem=R/'MEMORY.md'; text=mem.read_text(encoding='utf-8').rstrip(); marker='## 2026-09-15 — Manual evidence + active scope 44'
          block='''\n\n## 2026-09-15 — Manual evidence + active scope 44\n\n- **DesiFlix = OFF**: current redirect authority is compromised/inappropriate. **FullAnime = OFF**: no current hub/address authority. Neither may be kept enabled merely to preserve the historical 46 count.\n- Canonical recoverable census remains **46 rows**, executable hub/native scope is **44 active providers**. The legacy `hub-lab-matrix-46.json` filename is compatibility-only; its declared active count is now 44 and current generators derive the count from that authority.\n- `automation/manual-provider-evidence-20260915.json` captures reusable browser evidence: AllWish + AllAnime HLS 200; MoviesMod terminal direct-media route behind interaction; 4KHDHub current movie+TV route via `hdhub4u.bi -> new5.hdhub4u.cl`. Manual positive evidence is not native-player proof, but supersedes interpreting older ZERO results as “no route exists”.\n- **Never ask the user to repeat those already supplied tests.** Continue integration from the captured evidence; a new manual test is justified only for a genuinely new fact not recoverable from repository/runtime evidence.\n'''
          if marker not in text: text+=block
          mem.write_text(text.rstrip()+'\n',encoding='utf-8')

          # Coherence proof.
          matrix=load('automation/evidence/hub-lab-matrix-46.json'); assert matrix['hubCount']==ACTIVE and len(matrix['rows'])==ACTIVE
          disp=load('automation/provider-repair-disposition.json'); assert (disp['catalogueProviderCount'],disp['enabledProviderCount'],disp['disabledProviderCount'])==(CATALOGUE,ACTIVE,2)
          assert set(disp['disabledProviders'])==set(OFF) and not (set(disp.get('incompleteProviders') or [])&set(OFF))
          hubs=load('provider-hubs.json')['providers']; assert hubs['4khdhub']['hub']=='https://hdhub4u.bi/'
          for key,row in hubs.items():
            if not isinstance(row,dict): continue
            ids={cid(key),cid(row.get('id'))}; ids.update(cid(x) for x in row.get('aliases') or [])
            if ids&set(OFF): assert row.get('hub') is None
          print('ACTIVE44_MANUAL_EVIDENCE_OK catalogue=46 active=44 off=desiflix,fullanime')
          PY

          python3 -m py_compile scripts/generate_hub46_manifest.py scripts/build_hub46_native_manifest.py scripts/build_hub_lab_matrix.py scripts/validate_activation_preservation.py
          python3 scripts/generate_hub46_manifest.py --check --source manifest.json --matrix automation/evidence/hub-lab-matrix-46.json --output manifest-hub46.json
          python3 scripts/validate_activation_preservation.py
          python3 tests/ci_preservation_policy_test.py
          python3 tests/provider_hub_registry_test.py
          python3 - <<'PY'
          import json
          for p in ['manifest.json','manifest-hub46.json','native-hub46/manifest.json','provider-hubs.json','automation/evidence/hub-lab-matrix-46.json','automation/provider-repair-disposition.json','automation/manual-provider-evidence-20260915.json']:
            json.load(open(p,encoding='utf-8'))
          print('ACTIVE44_JSON_OK')
          PY
          git diff --check

      - name: Commit atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-manual-evidence-active44-20260915.yml
          rm -f .github/workflows/apply-manual-evidence-active44-20260915-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: honor manual provider off states and active scope 44'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || { echo 'main moved during active44 transaction' >&2; exit 1; }
          git push origin HEAD:main
          echo "ACTIVE44_PUBLISHED $(git rev-parse HEAD)"
