name: TEMP - Closure Audit 46

on:
  workflow_dispatch:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths:
      - ".github/workflows/temp-closure-audit-46.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: MovieBox authoritative migration in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_moviebox_hub46_runtime_v1.py
          python3 - <<'PY'
          import json
          p=json.load(open('provider-overrides.json'))['provider_patches']['moviebox']
          assert p['manifest_overrides']['enabled'] is True
          assert p['capability']=='direct_media'
          assert p['repair_disposition']['quarantined'] is False
          assert p['repair_disposition']['provenLanes']==[]
          assert p['live_route_gate']['validated_types']==[]
          assert p['provider_lego_scripts']==['scripts/provider_patches/moviebox_peach_runtime_v1.py']
          print('FIELD_MOVIEBOX_MIGRATION staged=1 proof_faked=0')
          PY
      - name: MovieBox crypto contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/peachify_runtime_crypto_test.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          sys.path.insert(0,'scripts/provider_patches')
          import moviebox_peach_runtime_v1 as m
          out=m.apply('globalThis.getStreams=async()=>[];')
          assert 'NIAKVIO_MOVIEBOX_PEACH_RUNTIME_V1' in out
          assert 'provider:"moviebox"' in out
          assert 'uwu.eat-peach.sbs' in out and '"path":"moviebox"' in out
          open('/tmp/moviebox-live.js','w').write(out)
          print('FIELD_MOVIEBOX_ADAPTER contract=ok')
          PY
      - name: Live MovieBox movie and TV proof
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe.cjs <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('/tmp/moviebox-live.js','utf8');
          vm.runInThisContext(code,{filename:'moviebox-live.js'});
          async function check(label,args){
            globalThis.__nuvioMediaContext={tmdbId:String(args[0]),canonicalMediaType:args[1],season:args[2],episode:args[3]};
            const started=Date.now();
            const rows=await Promise.race([
              globalThis.getStreams(...args),
              new Promise((_,rej)=>setTimeout(()=>rej(new Error('probe-hard-timeout-25000')),25000))
            ]);
            console.log('FIELD_MOVIEBOX_LIVE',label,'duration_ms='+ (Date.now()-started),'count='+rows.length);
            for(const r of rows.slice(0,5)) console.log('FIELD_MOVIEBOX_ROW',label,JSON.stringify({url:r.url,quality:r.quality,language:r.language,name:r.name,provider:r.provider}));
            if(!rows.length) throw new Error(label+': no streams');
            if(!rows.some(r=>/^https?:\/\//i.test(String(r.url||'')))) throw new Error(label+': no direct media URL');
            return rows;
          }
          (async()=>{
            await check('movie',['157336','movie']);
            await check('tv',['1396','tv',1,1]);
            console.log('FIELD_MOVIEBOX_LIVE_PROOF lanes=movie,tv status=positive hard_timeout_ms=25000');
          })().catch(e=>{console.error('FIELD_MOVIEBOX_LIVE_PROOF status=failed',e);process.exit(1)});
          NODE
          node /tmp/probe.cjs
      - name: Core contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/native_runtime_settlement_contract_test.py
          python3 tests/provider_no_timer_runtime_test.py
          python3 tests/provider_execution_failfast_v33_test.py
          python3 tests/stream_quality_recovery_tv_test.py
