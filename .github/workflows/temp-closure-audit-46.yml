name: TEMP - Closure Audit 46

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-closure-audit-46.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Resolve current HindMoviez signed-player chain
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const UA='Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36';
          async function fetchT(url,opt={}){const r=await fetch(url,{...opt,redirect:'follow',headers:{'User-Agent':UA,'Accept':opt.accept||'text/html,application/xhtml+xml,application/json,*/*','Referer':opt.referer||'https://hindmovie.fit/',...(opt.headers||{})},signal:AbortSignal.timeout(7000)});return{r,t:await r.text()}}
          function links(s){return [...String(s).replace(/\\\//g,'/').matchAll(/https?:\/\/[^\s"'<>\\]+/gi)].map(x=>x[0])}
          async function one(imdb,type,se,ep){
            const a=await fetchT('https://hindmovie.icu/wp-json/wp/v2/posts?search='+imdb+'&per_page=100');const rows=JSON.parse(a.t);let mv=[...new Set(links(JSON.stringify(rows)).filter(x=>/mvlink\.blog\/(?:web\/)?\d+/i.test(x)))].filter(x=>type==='tv'?/\/web\//.test(x):!/\/web\//.test(x));if(!mv.length)throw Error('no mv');
            const p=await fetchT(mv[0]);const tag=new RegExp('S0*'+se+'E0*'+ep+'(?:[^0-9]|$)','i');let names=[...p.t.matchAll(/[A-Za-z0-9._+()\[\] -]{12,260}\.(?:mkv|mp4|avi)/gi)].map(x=>x[0].replace(/\s+/g,' '));if(type==='tv')names=names.filter(x=>tag.test(x));names=[...new Set(names)];if(!names.length)throw Error('no name');
            const d=Buffer.from(names[0]).toString('base64url');const sig=await fetch('https://mvlink.blog/wp-admin/admin-ajax.php',{method:'POST',headers:{'User-Agent':UA,'Referer':mv[0],'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Accept':'application/json,text/plain,*/*'},body:'action=hindshare_sign&d='+encodeURIComponent(d),signal:AbortSignal.timeout(7000)});const st=await sig.text();let sj={};try{sj=JSON.parse(st)}catch{};const signed=String(sj?.data?.url||'');console.log('FIELD_HIND_SIGN type='+type+' status='+sig.status+' signed64='+Buffer.from(signed).toString('base64'));if(!/^https?:\/\//.test(signed))throw Error('no signed');
            const s1=await fetchT(signed,{referer:mv[0]});const l1=links(s1.t);console.log('FIELD_HIND_SIGNED_PAGE type='+type+' status='+s1.r.status+' final='+s1.r.url+' links64='+Buffer.from(JSON.stringify(l1.slice(0,40))).toString('base64'));
            let candidates=[...new Set(l1.filter(x=>/hcloud|workers\.dev|direct|redirect/i.test(x)))];if(!candidates.length)candidates=[s1.r.url];
            for(const c of candidates.slice(0,8)){try{const z=await fetchT(c,{referer:signed});const zs=links(z.t);const direct=[...new Set(zs.filter(x=>/workers\.dev/i.test(x)||/[?&]file=/i.test(x)))];console.log('FIELD_HIND_CANDIDATE type='+type+' url64='+Buffer.from(c).toString('base64')+' status='+z.r.status+' final64='+Buffer.from(z.r.url).toString('base64')+' direct64='+Buffer.from(JSON.stringify(direct.slice(0,12))).toString('base64'));if(direct.length)return direct}catch(e){console.log('FIELD_HIND_CANDIDATE_ERROR type='+type+' url64='+Buffer.from(c).toString('base64')+' error='+String(e))}}
            return [];
          }
          (async()=>{const m=await one('tt0816692','movie',1,1),t=await one('tt0903747','tv',1,1);console.log('FIELD_HIND_DRIFT_PROOF movie='+m.length+' tv='+t.length);if(!m.length||!t.length)process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lock identity bridge and core contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/native_runtime_settlement_contract_test.py
          python3 tests/native_declared_matrix_enabled_only_test.py
          python3 tests/provider_no_timer_runtime_test.py
