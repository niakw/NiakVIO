name: TEMP - Closure Audit 46

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-closure-audit-46.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Probe exact Stremio stream routes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base='https://stremio-moviebox-1.onrender.com';
          const cases=[
            ['movie-tmdb',base+'/stream/movie/tmdb:157336.json'],
            ['movie-imdb',base+'/stream/movie/tt0816692.json'],
            ['tv-tmdb-series',base+'/stream/series/tmdb:1396:1:1.json'],
            ['tv-imdb-series',base+'/stream/series/tt0903747:1:1.json'],
            ['tv-tmdb-tv',base+'/stream/tv/tmdb:1396:1:1.json'],
            ['tv-imdb-tv',base+'/stream/tv/tt0903747:1:1.json'],
          ];
          (async()=>{
            for(const [label,url] of cases){
              const started=Date.now();
              try{
                const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json'},signal:AbortSignal.timeout(20000)});
                const body=await r.text(); let j={}; try{j=JSON.parse(body)}catch{}
                const rows=Array.isArray(j?.streams)?j.streams:[];
                const direct=rows.filter(x=>/^https?:\/\//i.test(String(x?.url||'')));
                console.log('FIELD_MB_STREMIO label='+label+' status='+r.status+' duration_ms='+(Date.now()-started)+' rows='+rows.length+' direct='+direct.length+' body64='+Buffer.from(body.slice(0,1800)).toString('base64'));
              }catch(e){console.log('FIELD_MB_STREMIO label='+label+' error='+String(e)+' duration_ms='+(Date.now()-started))}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Probe H5 direct TMDB lookup semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const API='https://h5-api.aoneroom.com/wefeed-h5api-bff';
          const H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/148 Safari/537.36','Referer':'https://moviebox.ph/','Origin':'https://moviebox.ph','X-Client-Info':'{"timezone":"Asia/Dhaka"}','X-Request-Lang':'en','Accept':'application/json','Content-Type':'application/json'};let token='';
          async function req(url,opt={}){const headers={...H,...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(url,{...opt,headers,signal:AbortSignal.timeout(10000)});const xu=r.headers.get('x-user');if(xu)try{token=JSON.parse(xu).token||token}catch{};const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};return{r,j,t}}
          function rows(j){const d=j?.data||{};return Array.isArray(d.items)?d.items:Array.isArray(d.list)?d.list:[]}
          (async()=>{
            const boot=await req(API+'/home?host=moviebox.ph');console.log('FIELD_MB_H5_BOOT status='+boot.r.status+' token='+Boolean(token));
            const bodies=[
              ['keyword-number',{keyword:'157336',page:1,perPage:20}],
              ['keyword-tmdb',{keyword:'tmdb:157336',page:1,perPage:20}],
              ['tmdbId-field',{tmdbId:'157336',page:1,perPage:20}],
              ['subject-tmdb-field',{keyword:'',tmdbId:'157336',page:1,perPage:20}],
            ];
            for(const [label,body] of bodies){
              const x=await req(API+'/subject/search',{method:'POST',body:JSON.stringify(body)});const a=rows(x.j);
              console.log('FIELD_MB_H5_LOOKUP label='+label+' status='+x.r.status+' rows='+a.length+' sample64='+Buffer.from(JSON.stringify(a.slice(0,3))).toString('base64'));
            }
            const qs=[
              API+'/subject/detail?tmdbId=157336',
              API+'/detail?tmdbId=157336',
              API+'/subject?tmdbId=157336',
              API+'/subject/search?tmdbId=157336',
            ];
            for(const url of qs){const x=await req(url);console.log('FIELD_MB_H5_GET url='+url+' status='+x.r.status+' body64='+Buffer.from(x.t.slice(0,1200)).toString('base64'))}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lock already-fixed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/native_runtime_settlement_contract_test.py
          python3 tests/native_declared_matrix_enabled_only_test.py
          python3 tests/provider_no_timer_runtime_test.py
