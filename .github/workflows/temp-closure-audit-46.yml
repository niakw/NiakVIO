name: TEMP - Closure Audit 46

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-closure-audit-46.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Probe current MovieBox source API
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base='https://api.videasy.net/moviebox/sources-with-title';
          const cases=[
            {label:'interstellar',title:'Interstellar',mediaType:'movie',year:'2014',episodeId:'1',seasonId:'1',tmdbId:'157336',imdbId:'tt0816692'},
            {label:'inception',title:'Inception',mediaType:'movie',year:'2010',episodeId:'1',seasonId:'1',tmdbId:'27205',imdbId:'tt1375666'},
            {label:'breakingbad',title:'Breaking Bad',mediaType:'tv',year:'2008',episodeId:'1',seasonId:'1',tmdbId:'1396',imdbId:'tt0903747'},
            {label:'arcane',title:'Arcane',mediaType:'tv',year:'2021',episodeId:'1',seasonId:'1',tmdbId:'94605',imdbId:'tt11126994'}
          ];
          (async()=>{
            let positive=0;
            for(const c of cases){
              const q=new URLSearchParams(c);q.delete('label');q.set('_t',String(Date.now()));
              const url=base+'?'+q;
              try{
                const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Referer':'https://www.fmovies.cat/','Origin':'https://www.fmovies.cat','Cache-Control':'no-cache','Pragma':'no-cache','Accept':'*/*'}});
                const body=await r.text();
                console.log('FIELD_MOVIEBOX_VIDEASY',c.label,'status='+r.status,'ct='+(r.headers.get('content-type')||''),'bytes='+body.length,'body64='+Buffer.from(body.slice(0,1800)).toString('base64'));
                if(r.ok && body.length>20) positive++;
              }catch(e){console.log('FIELD_MOVIEBOX_VIDEASY',c.label,'error='+String(e),'cause='+(e.cause?String(e.cause):''))}
            }
            console.log('FIELD_MOVIEBOX_VIDEASY_SUMMARY positive_http='+positive+' total='+cases.length);
            if(!positive) process.exit(2);
          })();
          NODE
      - name: Preserve Core 25 second settlement contract
        if: always()
        run: python3 tests/native_runtime_settlement_contract_test.py
