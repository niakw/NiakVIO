name: TEMP - Closure Audit 46

on:
  workflow_dispatch:
  push:
    branches:
      - fix/labs-5.21.44-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Focused provider closure snapshot
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee closure-audit-46.txt) 2>&1
          echo '=== HEAD ==='
          git rev-parse HEAD

          echo '=== TARGET AUTHORITY ==='
          python3 - <<'PY'
          import json, pathlib, re
          targets=('moviebox','ctgmovies','hindmoviez','anime-sama','mugiwarastream','papadustream')
          def wanted(x):
              s=str(x or '').lower()
              return any(t in s for t in targets)
          for fn in ('manifest.json','provider-overrides.json','provider-hubs.json','engine_v2/config/provider-upstreams.json'):
              p=pathlib.Path(fn)
              if not p.exists():
                  print('MISSING',fn); continue
              try: data=json.loads(p.read_text())
              except Exception as e: print('JSONERR',fn,e); continue
              print('\nFILE',fn)
              if fn=='manifest.json':
                  for row in data.get('scrapers',[]):
                      if wanted(row.get('id')) or wanted(row.get('name')):
                          print('MANIFEST',json.dumps(row,ensure_ascii=False,sort_keys=True))
                          f=pathlib.Path(row.get('filename',''))
                          if f.is_file():
                              txt=f.read_text(errors='replace')
                              print('BUNDLE',row.get('id'),'file=',f,'bytes=',len(txt),'setTimeout=',txt.count('setTimeout'))
                              for needle in ('moviiebox','moviebox.yachts','uwu.eat-peach','net27.cc','hindmovie','papadustream'):
                                  i=txt.lower().find(needle.lower())
                                  if i>=0: print('BUNDLE_SNIP',row.get('id'),needle,repr(txt[max(0,i-500):i+1200]))
              elif fn=='provider-overrides.json':
                  for k,v in (data.get('provider_patches') or {}).items():
                      if wanted(k): print('OVERRIDE',k,json.dumps(v,ensure_ascii=False,sort_keys=True))
              elif isinstance(data,dict):
                  for k,v in data.items():
                      if wanted(k) or wanted(v): print('ENTRY',k,json.dumps(v,ensure_ascii=False,sort_keys=True)[:12000])
              elif isinstance(data,list):
                  for v in data:
                      if wanted(v): print('ENTRY',json.dumps(v,ensure_ascii=False,sort_keys=True)[:12000])
          PY

          echo '=== TARGET SOURCE REFERENCES ==='
          grep -R -n -E 'moviebox|moviiebox|CTGMOVIES|ctgmovies|hindmoviez|HindMoviez|uwu\.eat-peach|moviebox\.yachts|net27\.cc' \
            scripts tests engine_v2 engine-v2 automation .github 2>/dev/null | head -1000 || true

          echo '=== TARGET TEST/SCRIPT CANDIDATES ==='
          find scripts tests -type f | grep -Ei '(provider|native|live|route|stream|moviebox|hindmovie|ctg|timeout|settlement)' | sort | head -800 || true

          echo '=== CONTRACT TESTS ==='
          for t in \
            tests/native_runtime_settlement_contract_test.py \
            tests/provider_no_timer_runtime_test.py \
            tests/provider_execution_failfast_v33_test.py \
            tests/core_runtime_nonregression_contract_test.py \
            tests/stream_quality_recovery_tv_test.py \
            tests/stream_output_sanitizer_fail_closed_test.py \
            tests/manual_tv_live_regressions_v34_test.py; do
            if test -f "$t"; then echo RUN "$t"; python3 "$t"; fi
          done

          echo '=== TEMP COUNT ==='
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | grep -E '^temp-' | sort || true
          echo "temp_count=$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | grep -Ec '^temp-' || true)"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-audit-46-${{ github.run_id }}
          path: closure-audit-46.txt
          if-no-files-found: error
