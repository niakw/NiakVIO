name: TEMP - Closure Audit 46

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-closure-audit-46.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: HindMoviez current authority and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          d=json.load(open('provider-overrides.json'))['provider_patches']['hindmoviez']
          print('FIELD_HIND_OVERRIDE='+json.dumps(d,ensure_ascii=False,sort_keys=True))
          m=json.load(open('manifest.json'))['scrapers']
          row=next(x for x in m if str(x.get('id','')).casefold()=='hindmoviez')
          print('FIELD_HIND_MANIFEST='+json.dumps(row,ensure_ascii=False,sort_keys=True))
          for fn in ('automation/evidence/hub-lab-matrix-46.json','automation/provider-v3-static-knowledge.json'):
              p=pathlib.Path(fn)
              if not p.exists(): continue
              data=json.load(open(p))
              text=json.dumps(data,ensure_ascii=False)
              key='hindmoviez'
              i=text.casefold().find(key)
              print('FIELD_HIND_SOURCE',fn, text[max(0,i-2500):i+9000] if i>=0 else 'not-found')
          PY

      - name: Prove public TMDB page external IMDb identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const cases=[['movie','157336'],['tv','1396'],['movie','27205'],['movie','603']];
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/148 Safari/537.36';
          (async()=>{
            for(const [type,id] of cases){
              const r=await fetch(`https://www.themoviedb.org/${type}/${id}?language=en-US`,{headers:{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*'},signal:AbortSignal.timeout(7000)});
              const h=await r.text();
              const ids=[...h.matchAll(/(?:imdb\.com\/title\/|"imdb_id"\s*:\s*")(tt\d+)/gi)].map(x=>x[1]);
              console.log('FIELD_TMDB_IMDB type='+type+' tmdb='+id+' status='+r.status+' imdb='+[...new Set(ids)].slice(0,4).join(',')+' bytes='+h.length);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: HindMoviez endpoint smoke from representative IMDb identities
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const urls=['https://hindmovie.icu/wp-json/wp/v2/posts','https://hindmovie.fit/wp-json/wp/v2/posts'];
          const ids=['tt0816692','tt0903747','tt1375666','tt0133093'];
          (async()=>{
            for(const base of urls)for(const imdb of ids){
              const u=base+'?search='+encodeURIComponent(imdb)+'&per_page=10';
              try{const r=await fetch(u,{headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36','Accept':'application/json'},signal:AbortSignal.timeout(7000)});const t=await r.text();let a=[];try{a=JSON.parse(t)}catch{};const s=JSON.stringify(a);const mv=[...s.matchAll(/https?:\/\/mvlink\.blog\/(?:web\/)?\d+/gi)].map(x=>x[0]);console.log('FIELD_HIND_API base='+base+' imdb='+imdb+' status='+r.status+' rows='+(Array.isArray(a)?a.length:0)+' mvlinks='+[...new Set(mv)].length+' body64='+Buffer.from(t.slice(0,1200)).toString('base64'))}catch(e){console.log('FIELD_HIND_API base='+base+' imdb='+imdb+' error='+String(e))}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lock repaired core contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/native_runtime_settlement_contract_test.py
          python3 tests/native_declared_matrix_enabled_only_test.py
          python3 tests/provider_no_timer_runtime_test.py
