name: Temporary remove stale live TV references

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/remove-stale-live-tv

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python .github/triggers/remove-stale-live-tv.py
      - run: npm test
      - run: python scripts/generate_release_hashes.py
      - run: python scripts/validate_release_integrity.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name niakw
          git config user.email foissy.tommy@gmail.com
          git add README.md automation/nuvio-tv-runtime-contract.json scripts/validate_nuvio_tv_runtime_policy.py FILE-HASHES.json PATCH-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove stale live TV addon references"
          git push origin HEAD:main
