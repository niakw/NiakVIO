name: Diagnose provider activation regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-provider-activation.yml"
      - ".github/triggers/diagnose-provider-activation"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compare activation history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          current = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          current_rows = {str(r.get('id') or '').casefold(): r for r in current.get('scrapers', [])}
          current_active = {pid for pid, row in current_rows.items() if row.get('enabled') is True}

          commits = run('git', 'log', '--first-parent', '--format=%H', '-n', '160', '--', 'manifest.json').splitlines()
          snapshots = []
          for sha in commits:
              try:
                  raw = subprocess.check_output(['git', 'show', f'{sha}:manifest.json'], text=True, stderr=subprocess.DEVNULL)
                  data = json.loads(raw)
              except Exception:
                  continue
              rows = {str(r.get('id') or '').casefold(): r for r in data.get('scrapers', [])}
              active = {pid for pid, row in rows.items() if row.get('enabled') is True}
              meta = run('git', 'show', '-s', '--format=%cI|%s', sha)
              snapshots.append({
                  'sha': sha,
                  'version': data.get('version'),
                  'active_count': len(active),
                  'total_count': len(rows),
                  'active_ids': sorted(active),
                  'meta': meta,
              })

          previous = next((s for s in snapshots[1:] if s['active_count'] > len(current_active)), None)
          stable = next((s for s in snapshots[1:] if 55 <= s['active_count'] <= 65), previous)
          if not stable:
              raise SystemExit('No prior larger activation snapshot found')
          stable_active = set(stable['active_ids'])
          report = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'current': {
                  'version': current.get('version'),
                  'active_count': len(current_active),
                  'total_count': len(current_rows),
                  'active_ids': sorted(current_active),
              },
              'selected_stable': stable,
              'disabled_since_selected': sorted(stable_active - current_active),
              'newly_active_since_selected': sorted(current_active - stable_active),
              'history': [{k: v for k, v in s.items() if k != 'active_ids'} for s in snapshots[:40]],
          }
          output = Path('automation/provider-activation-diagnostic.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publish diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/provider-activation-diagnostic.json
          git commit -m "ci: record provider activation regression" || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
