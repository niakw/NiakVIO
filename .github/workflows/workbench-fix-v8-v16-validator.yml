name: WORKBENCH - Fix V8 V16 Validator

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - ".github/workflows/workbench-fix-v8-v16-validator.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workbench/systemic-recovery-20260909
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Make V8 validator aware of canonical V16 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/upgrade_provider_base_runtime_v5.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for needle in (\n        'const recipePrimary = await getStreams(tmdbId, type, season, episode);',\n        'NIAKVIO_PROVIDER_MODEL.apiRecipe.allowGenericFallback !== true',\n    ):\n        if needle not in text[recipe_first:family_first]:\n            raise AssertionError(f'runtime v8 API-recipe precedence missing: {needle}')\n'''
          new = '''    authority_prefix = text[recipe_first:family_first]\n    v16_marker = '/* NIAKVIO_PROVIDER_EXECUTION_AUTHORITY_V16 */'\n    if v16_marker in authority_prefix:\n        for needle in (\n            'const recipePrimary = await _resolveApiRecipe(proofMeta, type, season, episode);',\n            'NIAKVIO_PROVIDER_MODEL.apiRecipe.allowGenericFallback !== true',\n        ):\n            if needle not in authority_prefix:\n                raise AssertionError(f'runtime V16 API-recipe authority missing: {needle}')\n        if 'recipePrimary = await getStreams(' in authority_prefix:\n            raise AssertionError('runtime V16 retained obsolete recursive getStreams recipe authority')\n    else:\n        for needle in (\n            'const recipePrimary = await getStreams(tmdbId, type, season, episode);',\n            'NIAKVIO_PROVIDER_MODEL.apiRecipe.allowGenericFallback !== true',\n        ):\n            if needle not in authority_prefix:\n                raise AssertionError(f'runtime v8 API-recipe precedence missing: {needle}')\n'''
          if text.count(old) != 1:
              raise SystemExit(f'stale V8 validator anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          trigger = Path('.github/triggers/provider-recognition-repair-v6.json')
          data = json.loads(trigger.read_text(encoding='utf-8'))
          data['retry'] = int(data.get('retry') or 0) + 1
          data['requestedAt'] = '2026-09-09T18:58:00+02:00'
          data['goal'] = 'Retry the full 96-provider systemic repair after aligning the legacy V8 validator with canonical V16 direct API-recipe authority; preserve rolling live lanes and classify unrecoverable providers as explicit disabled repair/off debt.'
          trigger.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate both cumulative runtime states
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade_provider_base_runtime_v5.py
          python3 scripts/upgrade_provider_base_runtime_v5.py
          python3 tests/provider_execution_authority_v16_contract_test.py
          python3 tests/provider_repair_pipeline_v6_contract_test.py

      - name: Commit fix, retrigger systemic Repair, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/workbench-fix-v8-v16-validator.yml
          git config user.name "niakvio-workbench"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/upgrade_provider_base_runtime_v5.py .github/triggers/provider-recognition-repair-v6.json .github/workflows/workbench-fix-v8-v16-validator.yml
          git diff --cached --check
          git commit -m "fix(repair): validate V16 recipe authority after V8 migration"
          git push origin HEAD:workbench/systemic-recovery-20260909
