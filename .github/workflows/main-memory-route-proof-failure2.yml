name: MAIN - Route Proof Failure Memory 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-memory-route-proof-failure2.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Persist second reconstruction failure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8'); m='## 2026-09-07 — Route-proof reconstruction run 34069559315 failure'; b='''\n\n## 2026-09-07 — Route-proof reconstruction run 34069559315 failure\n\n- Workflow `MAIN - Route Proof Reconstruction 96`, run **34069559315**, job **101584262866**, again failed safely before census/DATA application/reconstruction/publication. Public release remained 5.21.35.\n- The previous ProviderBase request-spec cardinality bug was fixed: `PROVIDER_BASE_ROUTE_REQUEST_SPEC_V1_OK changed=true data_owned=1` passed.\n- New blocker was another migration-anchor bug in `upgrade_provider_route_authority_v5.py`: it searched exactly for `from typing import Any` but `validate_provider_v3_routes_sequential.py` currently imports `from typing import Any, Iterable`; failure was `AssertionError: sequential import anchor missing`.\n- Commit `e79b18d36af90f377dd87ce3897fdbf7fd51d0be` fixes this by injecting `filter_recipe_by_live_routes` before the stable `from validate_provider_v3_routes_live import (` anchor and requiring that stable anchor exactly once.\n- No provider route census result exists yet from runs 34069211303 or 34069559315; both failed before the live census step.\n- Final candidate pipeline now includes a mandatory real Purstream / House of the Dragon S3E1 proof after reverse/static/integrity: both `series` and canonical `tv` transports must return streams, have successful provider HTTP, and expose an observed episode request.\n'''; p.write_text(t.rstrip()+(b if m not in t else '\n'),encoding='utf-8')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MEMORY.md
          git commit -m 'docs: checkpoint second route-proof reconstruction failure' || true
          rm -f .github/workflows/main-memory-route-proof-failure2.yml
          git add -A
          git commit -m 'ci: remove second route-proof failure memory workflow' || true
          git push origin HEAD:main
