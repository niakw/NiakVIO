name: DIAG - StreamZo V9 Sanitizer Reason

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamzo-v9-sanitizer-reason-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-streamzo-v9-sanitizer-reason
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Bisect HLS structural validation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 scripts/upgrade_stream_sanitizer_v9_selection.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          from apply_provider_overrides import apply_overrides
          from provider_patch_blocks import strip_managed_fix
          import run_provider_upstream_parity as parity
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          row=next(r for r in manifest.get('scrapers',[]) if str(r.get('id','')).casefold()=='streamzo')
          patched,_=apply_overrides('streamzo',(root/row['filename']).read_bytes(),include_global_core=True)
          strict=patched.decode('utf-8')
          no_san=strip_managed_fix(strict,'CORE.STREAM_SANITIZER.V6')

          rules={
            'NORMALIZE_TEXT_GUARD': ('if(/^\\s*(?:<!doctype|<html|<body|\\{|\\[)/i.test(value))return null;', 'if(/^\\s*(?:<!doctype|<html|<body|\\{|\\[)/i.test(value))return {text:value,repaired:false};'),
            'NORMALIZE_MISSING_TAGS': ('if(!/(?:^|\\n)#EXT-(?:X-[A-Z0-9-]+|INF)\\s*[:]/i.test(value))return null;', 'if(!/(?:^|\\n)#EXT-(?:X-[A-Z0-9-]+|INF)\\s*[:]/i.test(value))return {text:value,repaired:false};'),
            'VALID_HEADER': ('if(value.indexOf("#EXTM3U")!==0)return false;', 'if(value.indexOf("#EXTM3U")!==0)return true;'),
            'VALID_VARIANT_URI': ('if(hasVariantTag&&!hasVariantUri)return false;', 'if(hasVariantTag&&!hasVariantUri)return true;'),
            'VALID_MEDIA_OR_VARIANT': ('if(!hasMedia&&!hasVariantUri)return false;', 'if(!hasMedia&&!hasVariantUri)return true;'),
            'VALID_VOD_DURATION': ('if(total<config.minVodDurationSeconds)return false;', 'if(total<config.minVodDurationSeconds)return true;'),
            'NORMALIZE_VALID_HLS': ('if(!validHls(value))return null;', 'if(!validHls(value))return {text:value,repaired:false};'),
          }
          variants={'STRICT':strict}
          for label,(old,new) in rules.items():
            if old not in strict: raise SystemExit('missing HLS rule '+label)
            variants[label]=strict.replace(old,new,1)
          variants['NO_SAN']=no_san

          fixture={'tmdbId':'60059','mediaType':'tv','title':'Better Call Saul','year':2015,'season':1,'episode':1}
          ctx=parity.context_for(fixture)
          def run(label,source):
            with tempfile.TemporaryDirectory() as td:
              path=pathlib.Path(td)/(label+'.js');path.write_text(source,encoding='utf-8')
              p=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=35,check=False)
            result=None
            for channel in (p.stdout,p.stderr):
              for line in channel.splitlines():
                if line.startswith('NUVIO_HEALTH_RESULT='):
                  try: result=json.loads(line.split('=',1)[1])
                  except Exception: pass
            if not isinstance(result,dict): print('HLS_BISECT',label,'NO_RESULT','rc',p.returncode);return -1
            count=int(result.get('stream_count') or 0)
            print('HLS_BISECT',label,'streams',count,'raw',result.get('raw_stream_count'))
            return count
          counts={label:run(label,source) for label,source in variants.items()}
          print('HLS_BISECT_COUNTS',json.dumps(counts,sort_keys=True))
          if counts['NO_SAN'] < 1: raise SystemExit('control without sanitizer did not reproduce')
          PY
