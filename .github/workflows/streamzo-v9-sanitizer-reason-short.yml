name: DIAG - StreamZo V9 Sanitizer Reason

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamzo-v9-sanitizer-reason-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-streamzo-v9-sanitizer-reason
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Bisect sanitizer rules by returned stream count
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 scripts/upgrade_stream_sanitizer_v9_selection.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          from apply_provider_overrides import apply_overrides
          from provider_patch_blocks import strip_managed_fix
          import run_provider_upstream_parity as parity
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          row=next(r for r in manifest.get('scrapers',[]) if str(r.get('id','')).casefold()=='streamzo')
          patched,_=apply_overrides('streamzo',(root/row['filename']).read_bytes(),include_global_core=True)
          strict=patched.decode('utf-8')
          assert 'NUVIO_STREAM_OUTPUT_FULL_MANIFEST_V9' in strict
          no_san=strip_managed_fix(strict,'CORE.STREAM_SANITIZER.V6')

          strict_verdict='return verdict===true?clearPrivateProofs(item.stream):null;'
          old_verdict='return verdict===false?null:clearPrivateProofs(item.stream);'
          block_check='if(!url||blocked(url)||seen[url])continue;'
          budget='candidates[c].probe=(config.probeAllUrls||(config.probeDirectMedia&&isDirect(candidates[c].stream,candidates[c].url)))&&probeCount++<config.maxProbes;'
          probe_pair='var verdict=await probe(item.stream,item.url);\n        '+strict_verdict
          for anchor in (strict_verdict,block_check,budget,probe_pair):
            if anchor not in strict: raise SystemExit('missing bisect anchor: '+anchor[:80])

          variants={
            'STRICT': strict,
            'FAIL_OPEN_UNKNOWN': strict.replace(strict_verdict,old_verdict,1),
            'NO_BLOCK_FILTER': strict.replace(block_check,'if(!url||seen[url])continue;',1),
            'FORCE_PROBE': strict.replace(budget,'candidates[c].probe=true;probeCount++;',1),
            'SKIP_PROBE_VALIDATION': strict.replace(probe_pair,'return clearPrivateProofs(item.stream);',1),
            'NO_SAN': no_san,
          }
          fixture={'tmdbId':'60059','mediaType':'tv','title':'Better Call Saul','year':2015,'season':1,'episode':1}
          ctx=parity.context_for(fixture)
          def run(label,source):
            with tempfile.TemporaryDirectory() as td:
              path=pathlib.Path(td)/(label+'.js');path.write_text(source,encoding='utf-8')
              p=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=35,check=False)
            result=None
            for channel in (p.stdout,p.stderr):
              for line in channel.splitlines():
                if line.startswith('NUVIO_HEALTH_RESULT='):
                  try: result=json.loads(line.split('=',1)[1])
                  except Exception: pass
            if not isinstance(result,dict):
              print('BISECT',label,'NO_RESULT','rc',p.returncode)
              return -1
            count=int(result.get('stream_count') or 0)
            print('BISECT',label,'streams',count,'raw',result.get('raw_stream_count'))
            return count
          counts={label:run(label,source) for label,source in variants.items()}
          print('BISECT_COUNTS',json.dumps(counts,sort_keys=True))
          if counts['NO_SAN'] < 1: raise SystemExit('control without sanitizer did not reproduce')
          PY
