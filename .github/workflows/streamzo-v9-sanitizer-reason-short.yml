name: DIAG - StreamZo V9 Sanitizer Reason

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamzo-v9-sanitizer-reason-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-streamzo-v9-sanitizer-reason
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Build temporary V9 and inspect sanitizer verdict
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 scripts/upgrade_stream_sanitizer_v9_selection.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          from apply_provider_overrides import apply_overrides
          from provider_patch_blocks import strip_managed_fix
          import run_provider_upstream_parity as parity
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          row=next(r for r in manifest.get('scrapers',[]) if str(r.get('id','')).casefold()=='streamzo')
          patched,_=apply_overrides('streamzo',(root/row['filename']).read_bytes(),include_global_core=True)
          text=patched.decode('utf-8')
          assert 'NUVIO_STREAM_OUTPUT_FULL_MANIFEST_V9' in text
          no_san=strip_managed_fix(text,'CORE.STREAM_SANITIZER.V6')

          invalid='if(!validHls(text))return false;'
          diag='''if(!validHls(text)){try{var __lines=String(text||"").split(/\\r?\\n/),__child=false;for(var __i=0;__i<__lines.length;__i++){var __line=String(__lines[__i]||"").trim();if(__line&&__line.charAt(0)!=="#"){__child=true;break}}console.log("NIAKVIO_SAN_HLS_INVALID","len="+String(text||"").length,"ctype="+contentType,"m3u="+(String(text||"").trimStart().indexOf("#EXTM3U")===0),"streaminf="+(/#EXT-X-STREAM-INF\\s*:/i.test(String(text||""))),"extinf="+(/#EXTINF\\s*:/i.test(String(text||""))),"map="+(/#EXT-X-MAP\\s*:/i.test(String(text||""))),"part="+(/#EXT-X-PART\\s*:/i.test(String(text||""))),"end="+(/#EXT-X-ENDLIST/i.test(String(text||""))),"child="+__child)}catch(_diag){}return false;}'''
          if invalid not in text: raise SystemExit('invalidHls anchor missing')
          inst=text.replace(invalid,diag,1)
          verdict='return verdict===true?clearPrivateProofs(item.stream):null;'
          inst=inst.replace(verdict,'try{console.log("NIAKVIO_SAN_VERDICT",String(verdict))}catch(_diag){}'+verdict,1)
          inst=inst.replace('catch(_error){return null}','catch(_error){try{console.log("NIAKVIO_SAN_PROBE_ERROR",String(_error&&_error.name||"Error"))}catch(_diag){}return null}',1)

          fixture={'tmdbId':'60059','mediaType':'tv','title':'Better Call Saul','year':2015,'season':1,'episode':1}
          ctx=parity.context_for(fixture)
          def run(label,source):
            with tempfile.TemporaryDirectory() as td:
              path=pathlib.Path(td)/(label+'.js');path.write_text(source,encoding='utf-8')
              p=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=35,check=False)
            result=None
            for channel in (p.stdout,p.stderr):
              for line in channel.splitlines():
                if line.startswith('NUVIO_HEALTH_RESULT='):
                  try: result=json.loads(line.split('=',1)[1])
                  except Exception: pass
                if line.startswith('NIAKVIO_SAN_'):
                  print(label,line)
            if not isinstance(result,dict): print(label,'NO_RESULT');return -1
            print(label,'STREAMS',result.get('stream_count'),'RAW',result.get('raw_stream_count'))
            for obs in result.get('network_observations') or []:
              if isinstance(obs,dict) and not obs.get('infrastructure') and obs.get('stage') in {'content_lookup','player'}:
                print(label,'ROUTE',obs.get('host'),obs.get('path_pattern'),obs.get('status'),obs.get('ok'),obs.get('error_code') or '')
            return int(result.get('stream_count') or 0)
          a=run('V9',inst)
          b=run('NO_SAN_1',no_san)
          c=run('NO_SAN_2',no_san)
          d=run('V9_REPEAT',inst)
          print('CAUSAL_COUNTS',a,b,c,d)
          PY
