name: DIAG - StreamZo V9 Sanitizer Reason

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamzo-v9-sanitizer-reason-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-streamzo-v9-sanitizer-reason
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Measure no-sanitizer media proof
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 scripts/upgrade_stream_sanitizer_v9_selection.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys,tempfile
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          from apply_provider_overrides import apply_overrides
          from provider_patch_blocks import strip_managed_fix
          import run_provider_upstream_parity as parity
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          row=next(r for r in manifest.get('scrapers',[]) if str(r.get('id','')).casefold()=='streamzo')
          patched,_=apply_overrides('streamzo',(root/row['filename']).read_bytes(),include_global_core=True)
          no_san=strip_managed_fix(patched.decode('utf-8'),'CORE.STREAM_SANITIZER.V6')
          fixture={'tmdbId':'60059','mediaType':'tv','title':'Better Call Saul','year':2015,'season':1,'episode':1}
          ctx=parity.context_for(fixture)
          with tempfile.TemporaryDirectory() as td:
            td=pathlib.Path(td)
            provider=td/'streamzo-no-san.js';provider.write_text(no_san,encoding='utf-8')
            p=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(provider),json.dumps(fixture,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=35,check=False)
            result=None
            for channel in (p.stdout,p.stderr):
              for line in channel.splitlines():
                if line.startswith('NUVIO_HEALTH_RESULT='):
                  try: result=json.loads(line.split('=',1)[1])
                  except Exception: pass
            if not isinstance(result,dict): raise SystemExit('NO_SAN_RESULT_MISSING')
            streams=result.get('streams') or []
            if not streams: raise SystemExit('NO_SAN_STREAM_MISSING')
            stream=streams[0]
            stream_file=td/'stream.json';stream_file.write_text(json.dumps(stream,separators=(',',':')),encoding='utf-8')
            probe=td/'probe.cjs'
            probe.write_text(r'''const fs=require('node:fs');
const {guardedFetch}=require(process.cwd()+'/scripts/network_guard.cjs');
const {probeDirectMedia}=require(process.cwd()+'/scripts/direct_media_probe.cjs');
(async()=>{const stream=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const r=await probeDirectMedia(stream,{guardedFetch,fetchImpl:globalThis.fetch,timeoutMs:18000,maxRedirects:5});const safe={playable:!!r.playable,inconclusive:!!r.inconclusive,kind:r.kind||null,status:r.status??null,hls_master:r.hls_master??null,hls_variant_playable:r.hls_variant_playable??null,hls_segment_playable:r.hls_segment_playable??null,hls_external_audio_count:r.hls_external_audio_count??null,hls_audio_playable:r.hls_audio_playable??null,media_duration_seconds:r.media_duration_seconds??null,media_duration_complete:r.media_duration_complete??null};console.log('STREAMZO_MEDIA_PROOF '+JSON.stringify(safe));})().catch(e=>{console.error('STREAMZO_MEDIA_PROOF_ERROR '+String(e&&e.name||'Error'));process.exit(2)});''',encoding='utf-8')
            q=subprocess.run(['node',str(probe),str(stream_file)],cwd=root,text=True,capture_output=True,timeout=40,check=False)
            print(q.stdout.strip())
            if q.stderr.strip(): print(q.stderr.strip())
            if q.returncode: raise SystemExit(q.returncode)
          PY
