name: Debug Desktop Purstream native fetch trace

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-native-fetch-trace.yml"

permissions:
  contents: read

jobs:
  native-fetch-trace:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage current Purstream
        shell: bash
        run: |
          set -euxo pipefail
          provider_path="$(python3 - <<'PY'
          import json
          data=json.load(open("niakvio/manifest.json", encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          print(row["filename"])
          PY
          )"
          cp "niakvio/$provider_path" "$GITHUB_WORKSPACE/purstream-current.js"
          echo "FIELD_DESKTOP_NATIVE_FETCH_TRACE_PROVIDER path=$provider_path"

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Instrument native FetchBridge in disposable checkout
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("nuvio-desktop/composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/network/FetchBridge.kt")
          s=p.read_text()
          old = "\\n".join([
              '            try {',
              '                performNativeFetch(url, method, headersJson, body, followRedirects)',
              '            } catch (ce: CancellationException) {',
              '                throw ce',
              '            } catch (t: Throwable) {',
              '                log.e(t) { "Fetch bridge error for $method $url" }',
          ]) + "\\n"
          new = "\\n".join([
              '            try {',
              '                println("FIELD_DESKTOP_NATIVE_FETCH_START method=" + method + " url=" + url)',
              '                val nativeResult = performNativeFetch(url, method, headersJson, body, followRedirects)',
              '                val parsedResult = runCatching { json.parseToJsonElement(nativeResult) as? JsonObject }.getOrNull()',
              '                val traceStatus = parsedResult?.get("status")?.jsonPrimitive?.contentOrNull ?: "?"',
              '                val traceOk = parsedResult?.get("ok")?.jsonPrimitive?.contentOrNull ?: "?"',
              '                val traceUrl = parsedResult?.get("url")?.jsonPrimitive?.contentOrNull ?: url',
              '                println("FIELD_DESKTOP_NATIVE_FETCH_RESULT method=" + method + " status=" + traceStatus + " ok=" + traceOk + " url=" + url + " finalUrl=" + traceUrl)',
              '                nativeResult',
              '            } catch (ce: CancellationException) {',
              '                println("FIELD_DESKTOP_NATIVE_FETCH_CANCEL method=" + method + " url=" + url + " message=" + (ce.message ?: ""))',
              '                throw ce',
              '            } catch (t: Throwable) {',
              '                println("FIELD_DESKTOP_NATIVE_FETCH_ERROR method=" + method + " url=" + url + " type=" + (t::class.simpleName ?: "Throwable") + " message=" + (t.message ?: ""))',
              '                log.e(t) { "Fetch bridge error for $method $url" }',
          ]) + "\\n"
          if s.count(old)!=1:
              raise SystemExit("FetchBridge target block not found exactly once")
          p.write_text(s.replace(old,new))
          PY
          git -C nuvio-desktop diff --check
          git -C nuvio-desktop diff -- composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/network/FetchBridge.kt

      - name: Install focused Purstream trace test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamNativeFetchTraceTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamNativeFetchTraceTest {
              @Test
              fun interstellar() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  val started = System.currentTimeMillis()
                  val rows = PluginRuntime.executePlugin(
                      code = File(workspace, "purstream-current.js").readText(),
                      tmdbId = "157336",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "PURSTREAM",
                  )
                  println("FIELD_DESKTOP_NATIVE_FETCH_TRACE_RESULT count=" + rows.size + " duration_ms=" + (System.currentTimeMillis()-started))
              }
          }
          KOTLIN

      - name: Execute Purstream native fetch trace
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamNativeFetchTraceTest'             --no-build-cache --no-configuration-cache --console=plain
