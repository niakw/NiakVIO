name: Temporary harden client drift transport handling

on:
  push:
    branches:
      - agent/tv-regression-5.20.38

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply transport resilience migration
        run: python scripts/tmp_migrate_client_upstream_infra.py
      - name: Focused drift guard regression
        run: |
          python tests/nuvio_client_upstream_drift_guard_test.py
          python -m py_compile scripts/check_nuvio_client_upstreams.py
      - name: Full repository regression suite
        run: npm test
      - name: Commit proven transport resilience
        run: |
          rm -f scripts/tmp_migrate_client_upstream_infra.py
          rm -f .github/workflows/tmp-migrate-client-drift-infra.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: treat client upstream transport failures as inconclusive'
          git push origin HEAD:agent/tv-regression-5.20.38
