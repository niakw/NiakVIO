name: LEARN - Brain Branch Maintenance

on:
  push:
    branches: [main]
  schedule:
    # Catch up even when a main commit intentionally uses [skip ci].
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: niakvio-brain-branch-maintenance
  cancel-in-progress: true

jobs:
  sync:
    name: Validate Brain memory and clean proposal branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate isolated sanitized learning memory
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="brain-learning/proposals"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          if ! git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            echo "FIELD_BRAIN_MEMORY_BRANCH action=missing publisher_owns_creation=true"
            exit 0
          fi

          for file in engine_v2/learning/latest.json engine_v2/learning/latest.md; do
            if ! git cat-file -e "refs/remotes/origin/$BRANCH:$file" 2>/dev/null; then
              echo "persistent Brain memory ref is missing $file" >&2
              exit 1
            fi
          done

          git show "refs/remotes/origin/$BRANCH:engine_v2/learning/latest.json" > "$TMP/latest.json"
          node - <<'NODE' "$TMP/latest.json"
          const fs=require('fs');
          const file=process.argv[2];
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          if (x.productionWritesAllowed !== false || x.publicationAllowed !== false) {
            throw new Error('persistent Brain memory lost read-only policy');
          }
          if (!x.experimentMemory || !Array.isArray(x.experimentMemory.entries)) {
            throw new Error('persistent Brain memory is missing experimentMemory');
          }
          console.log(
            'FIELD_BRAIN_MEMORY_BRANCH_VALIDATE '+
            'entries='+x.experimentMemory.entries.length+
            ' generated_at='+(x.generatedAt||'unknown')
          );
          NODE
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]' "$TMP/latest.json"; then
            echo "persistent Brain memory contains forbidden raw endpoint/credential material" >&2
            exit 1
          fi

          # Maintenance is deliberately read-only for the Learning ref.
          # The Learning publisher alone advances this branch from its own tree;
          # main pushes must never rebase/mirror production code into memory.
          echo "FIELD_BRAIN_MEMORY_BRANCH action=validated mode=memory-ref-read-only sha=$(git rev-parse --short refs/remotes/origin/$BRANCH)"

      - name: Remove closed repair proposal branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPAIR_BRANCH="brain-repair/proposal"
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$REPAIR_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            echo "FIELD_BRAIN_REPAIR_BRANCH action=keep_open_pr pr=$OPEN_PR"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$REPAIR_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$REPAIR_BRANCH"
            echo "FIELD_BRAIN_REPAIR_BRANCH action=deleted_closed_branch"
          else
            echo "FIELD_BRAIN_REPAIR_BRANCH action=already_absent"
          fi
