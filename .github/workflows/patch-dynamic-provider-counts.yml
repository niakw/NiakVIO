name: SHORT - Dynamic provider scope migration

on:
  push:
    branches:
      - fix/active44-durability-20260915
    paths:
      - '.github/workflows/patch-dynamic-provider-counts.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Remove fixed current-provider cardinalities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manage_provider_lifecycle.py --apply
          python - <<'PY'
          from pathlib import Path

          R=Path('.')

          def edit(path, fn):
              p=R/path
              text=p.read_text(encoding='utf-8')
              new=fn(text)
              if new != text:
                  p.write_text(new,encoding='utf-8')
                  print('PATCHED',path)

          # Non-regression: history may contain any census; executable scope is current active IDs.
          def patch_nonreg(t):
              t=t.replace('from typing import Any\n','from typing import Any\n\nfrom current_provider_scope import active_provider_ids\n',1)
              t=t.replace('EXPECTED = 46\n','')
              old='''def provider_ids(matrix: dict[str, Any]) -> list[str]:\n    return sorted({canon(row.get("provider")) for row in matrix.get("providers") or [] if canon(row.get("provider"))})'''
              new='''def provider_ids(matrix: dict[str, Any]) -> list[str]:\n    historical = {canon(row.get("provider")) for row in matrix.get("providers") or [] if canon(row.get("provider"))}\n    return sorted(historical & active_provider_ids())'''
              t=t.replace(old,new)
              old='''    if int(matrix.get("providerCount") or 0) != EXPECTED:\n        failures.append(f"matrix providerCount must be {EXPECTED}")'''
              new='''    declared = int(matrix.get("providerCount") or 0)\n    physical_rows = matrix_rows(matrix)\n    if declared and declared != len(physical_rows):\n        failures.append(f"matrix providerCount={declared} differs from ledger rows={len(physical_rows)}")'''
              t=t.replace(old,new)
              old='''    rows = matrix_rows(matrix)\n    if len(rows) != EXPECTED:\n        failures.append(f"matrix must contain {EXPECTED} unique provider rows, got {len(rows)}")'''
              new='''    rows = matrix_rows(matrix)\n    if not rows:\n        failures.append("matrix must contain provider history rows")'''
              t=t.replace(old,new)
              return t
          edit('scripts/check_provider_non_regression_v1.py',patch_nonreg)

          # History builders: providerCount describes their output; it is never a fixed release gate.
          def patch_history_v3(t):
              t=t.replace('EXPECTED = 46\n','')
              old='''    if int(matrix.get("providerCount") or 0) != EXPECTED:\n        raise SystemExit(f"expected {EXPECTED} providers, got {matrix.get('providerCount')}")'''
              new='''    history_rows = [row for row in matrix.get("providers") or [] if isinstance(row, dict)]\n    declared = int(matrix.get("providerCount") or len(history_rows))\n    if declared != len(history_rows):\n        raise SystemExit(f"history matrix identity mismatch declared={declared} rows={len(history_rows)}")'''
              return t.replace(old,new)
          edit('scripts/build_provider_history_matrix_v3.py',patch_history_v3)

          def patch_history_v1(t):
              t=t.replace('EXPECTED = 46\n','')
              # Common fixed-census checks from the older builder become self-consistency checks.
              t=t.replace('if len(rows) != EXPECTED:', 'if not rows:')
              t=t.replace('f"expected {EXPECTED} providers, got {len(rows)}"', '"provider history matrix is empty"')
              t=t.replace('"providerCount": EXPECTED', '"providerCount": len(rows)')
              return t
          edit('scripts/build_provider_history_matrix.py',patch_history_v1)

          # Provider v3 minimizer runs only current enabled artifacts physically under providers/.
          def patch_minimizer(t):
              t=t.replace('EXPECTED_PROVIDER_COUNT = 46\n','')
              old='''    filenames = [\n        str(row.get("filename") or "").strip()\n        for row in (manifest.get("scrapers") or [])\n        if str(row.get("filename") or "").strip()\n    ]\n    if len(filenames) != EXPECTED_PROVIDER_COUNT or len(set(filenames)) != EXPECTED_PROVIDER_COUNT:\n        raise SystemExit(\n            f"expected {EXPECTED_PROVIDER_COUNT} unique manifest provider filenames, "\n            f"got {len(filenames)} / {len(set(filenames))}"\n        )'''
              new='''    filenames = [\n        str(row.get("filename") or "").strip()\n        for row in (manifest.get("scrapers") or [])\n        if isinstance(row, dict)\n        and row.get("enabled") is not False\n        and str(row.get("filename") or "").startswith("providers/")\n    ]\n    if not filenames or len(filenames) != len(set(filenames)):\n        raise SystemExit(f"active manifest provider filenames must be unique/non-empty: {len(filenames)} / {len(set(filenames))}")'''
              t=t.replace(old,new)
              t=t.replace('f"require idempotence and Node syntax on all {EXPECTED_PROVIDER_COUNT} current providers",','f"require idempotence and Node syntax on all {len(files)} current active providers",')
              old='''    if report["provider_count"] != EXPECTED_PROVIDER_COUNT:\n        raise SystemExit(\n            f"expected {EXPECTED_PROVIDER_COUNT} generated providers, got {report['provider_count']}"\n        )\n'''
              t=t.replace(old,'')
              return t
          edit('scripts/provider_v3_minimizer.py',patch_minimizer)

          # Active blocker inventory compares identity/count to current providers/, never a literal.
          def patch_inventory(t):
              if 'from current_provider_scope import active_provider_ids' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import active_provider_ids\n',1)
              old='''    enabled = [row["provider"] for row in out_rows if row["enabled"]]\n    if len(enabled) != 46:\n        raise AssertionError(f"hub46 inventory must contain exactly 46 enabled targets, got {len(enabled)}")'''
              new='''    enabled = [row["provider"] for row in out_rows if row["enabled"]]\n    expected = active_provider_ids()\n    if set(enabled) != expected:\n        raise AssertionError(f"active blocker inventory identity mismatch missing={sorted(expected-set(enabled))} extra={sorted(set(enabled)-expected)}")'''
              return t.replace(old,new)
          edit('scripts/build_hub46_blocker_inventory.py',patch_inventory)

          # Sweep plan current target count is derived from active identities.
          def patch_sweep(t):
              if 'from current_provider_scope import active_provider_count' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import active_provider_count\n',1)
              return t.replace('EXPECTED = 46','EXPECTED = active_provider_count()')
          edit('scripts/provider_parallel_sweep_plan_v1.py',patch_sweep)

          # Semantic/current-catalogue helpers may include disabled-visible rows, so derive visible count.
          def visible_count_import(t, constant, replacement):
              if 'from current_provider_scope import visible_provider_count' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import visible_provider_count\n',1)
              return t.replace(constant,replacement)
          edit('scripts/reconcile_provider_catalog_media_types.py',lambda t: visible_count_import(t,'EXPECTED_CURRENT = 46','EXPECTED_CURRENT = visible_provider_count()'))
          edit('scripts/verify_provider_v3_reverse_rebuild.py',lambda t: visible_count_import(t,'EXPECTED_PROVIDER_COUNT = 46','EXPECTED_PROVIDER_COUNT = visible_provider_count()'))

          # Native/current tests derive scope from data instead of literals.
          def repl(path, old, new):
              edit(path,lambda t:t.replace(old,new))
          repl('tests/native_hub46_transport_manifest_test.py','assert len(rows) == 46','assert len(rows) == len(scope)')
          repl('tests/provider_v3_strategy_plan_contract_test.py','assert len(rows) == 46, f"expected hub-only 46-provider catalogue, got {len(rows)}"','assert len({cid(row.get("id")) for row in rows}) == len(rows), "provider ids must be unique"')
          repl('tests/global_stream_output_guard_test.py','assert len(rows) == 46, f"expected complete 46-provider Hub publication, got {len(rows)}"','assert rows, "current provider publication must not be empty"')

          # Current capability regression count derives from current manifest, historical count remains historical evidence.
          def patch_cap(t):
              old='CURRENT_PROVIDER_COUNT = 46'
              new='CURRENT_PROVIDER_COUNT = len([row for row in json.loads((ROOT / "manifest.json").read_text(encoding="utf-8")).get("scrapers") or [] if isinstance(row, dict) and row.get("enabled") is not False and str(row.get("filename") or "").startswith("providers/")])'
              return t.replace(old,new)
          edit('tests/provider_521_capability_regression_test.py',patch_cap)

          # Security test current census is visible manifest data, not a constant.
          def patch_html(t):
              return t.replace('EXPECTED = 46','EXPECTED = len([row for row in json.loads((ROOT / "manifest.json").read_text(encoding="utf-8")).get("scrapers") or [] if isinstance(row, dict)])')
          edit('tests/provider_html_filter_security_test.py',patch_html)

          # Permanent anti-regression: forbid magic current-cardinality constants in critical operational files.
          guard=R/'tests/provider_cardinality_source_of_truth_test.py'
          guard.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport re\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nCHECK=[\n "scripts/check_provider_non_regression_v1.py",\n "scripts/hub_activation_publication.py",\n "scripts/provider_v3_minimizer.py",\n "scripts/merge_provider_repair_report_v6.py",\n "scripts/build_hub46_blocker_inventory.py",\n "scripts/provider_parallel_sweep_plan_v1.py",\n "scripts/reconcile_provider_catalog_media_types.py",\n "scripts/verify_provider_v3_reverse_rebuild.py",\n "scripts/archive_nonhub_providerbases.py",\n]\npatterns=[\n re.compile(r"\\b(?:EXPECTED(?:_[A-Z_]+)?|CURRENT_PROVIDER_COUNT|EXPECTED_CURRENT|EXPECTED_ACTIVE)\\s*=\\s*(?:44|46|96)\\b"),\n re.compile(r"len\\([^\\n]+?\\)\\s*(?:==|!=)\\s*(?:44|46|96)\\b"),\n]\nbad=[]\nfor rel in CHECK:\n text=(ROOT/rel).read_text(encoding="utf-8")\n for pat in patterns:\n  if pat.search(text): bad.append(f"{rel}: {pat.pattern}")\nassert not bad, "hard-coded current provider cardinality remains:\\n"+"\\n".join(bad)\nprint("provider cardinality source-of-truth contract passed")\n''',encoding='utf-8')
          print('IDENTITY_SCOPE_MIGRATION_DONE')
          PY

          python -m py_compile \
            scripts/current_provider_scope.py \
            scripts/manage_provider_lifecycle.py \
            scripts/check_provider_non_regression_v1.py \
            scripts/hub_activation_publication.py \
            scripts/provider_v3_minimizer.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/build_provider_history_matrix_v3.py \
            scripts/build_hub46_blocker_inventory.py \
            tests/provider_cardinality_source_of_truth_test.py
          python tests/provider_cardinality_source_of_truth_test.py
          python scripts/hub_activation_publication.py --verify-catalog
          python tests/native_declared_provider_matrix_test.py
          python tests/provider_non_regression_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/global_stream_output_guard_test.py
          git diff --check

      - name: Commit operational migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts tests manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            manifest-hub46.json native-hub46/manifest.json provider_catalog.json \
            automation/provider-disabled-lifecycle.json providers provider-disabled provider-bases provider-old
          if git diff --cached --quiet; then
            echo DYNAMIC_SCOPE_NO_CHANGE
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix: derive provider gates from current identities'
          git push origin HEAD:fix/active44-durability-20260915
