name: TEMP - Actionable Repair V57

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-actionable-repair-v57.yml

permissions:
  contents: write

jobs:
  actionable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Clean stale repair outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/provider-repair-fast-targeted.json \
                automation/provider-repair-fast-merged.json \
                automation/provider-repair-fast-yield.json \
                automation/provider-repair-fast-summary.json \
                automation/desiflix-route-v57.json \
                automation/evidence/desiflix-current-yield-v57.json \
                automation/evidence/actionable-repair-v57.json
          printf '{"providers":{}}\n' > automation/.v57-empty-skip.json

      - name: Run repaired targeted engine on nine active residual providers
        shell: bash
        run: |
          set +e
          python3 scripts/run_provider_repair_fast_targeted_v1.py \
            --provider allwish \
            --provider animesalt \
            --provider animesama-co \
            --provider flemmix \
            --provider moviesmod \
            --provider mugiwarastream \
            --provider uhdmovies \
            --provider voiranime-rip \
            --provider kehflix \
            --skip-file automation/.v57-empty-skip.json \
            --workers 6 --timeout 45 --attempts 3 --defer-global-guard
          rc=$?
          echo "V57_ACTIVE_REPAIR_RC=$rc"
          echo "$rc" > /tmp/v57-active-rc
          exit 0

      - name: Probe disabled DESIFLIX separately
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recover_provider_routes_from_upstreams.py \
            --workers 2 --timeout 45 --attempts 3 \
            --out automation/desiflix-route-v57.json \
            --provider desiflix
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          tasks,_=q.build_tasks()
          selected=[t for t in tasks if str(t.get('provider_id') or '').casefold()=='desiflix']
          rows=[q.run(t) for t in selected]
          out={'schemaVersion':1,'provider':'desiflix','taskCount':len(rows),'rows':rows}
          p=Path('automation/evidence/desiflix-current-yield-v57.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V57_DESIFLIX_CURRENT',json.dumps({
            'tasks':len(rows),
            'rows':[{
              'type':r.get('semantic_type'),'status':r.get('status'),'stage':r.get('debug_stage'),
              'raw':r.get('raw'),'playable':r.get('playable'),'verified':r.get('verified')
            } for r in rows]
          },sort_keys=True))
          PY

      - name: Validate fresh outputs and persist compact evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected=['allwish','animesalt','animesama-co','flemmix','moviesmod','mugiwarastream','uhdmovies','voiranime-rip','kehflix']
          required=[
            Path('automation/provider-repair-fast-targeted.json'),
            Path('automation/provider-repair-fast-yield.json'),
            Path('automation/provider-repair-fast-summary.json'),
            Path('automation/desiflix-route-v57.json'),
            Path('automation/evidence/desiflix-current-yield-v57.json'),
          ]
          missing=[str(p) for p in required if not p.is_file()]
          if missing:
            raise SystemExit('V57 missing fresh outputs: '+','.join(missing))
          target=json.load(open(required[0]))
          y=json.load(open(required[1]))
          summary=json.load(open(required[2]))
          des_route=json.load(open(required[3]))
          des_yield=json.load(open(required[4]))
          actual=summary.get('targetedProviders') or []
          if actual != expected:
            raise SystemExit(f'V57 target scope mismatch expected={expected} actual={actual}')
          target_rows={str(r.get('providerId') or '').casefold():r for r in target.get('providers') or [] if isinstance(r,dict)}
          if set(target_rows) != set(expected):
            raise SystemExit(f'V57 target report mismatch: {sorted(target_rows)}')
          lane_rows=[]
          for r in y.get('rows') or []:
            if not isinstance(r,dict): continue
            lane_rows.append({
              'provider':str(r.get('provider_id') or '').casefold(),
              'type':str(r.get('semantic_type') or '').casefold(),
              'status':r.get('status'),'debugStage':r.get('debug_stage'),
              'raw':int(r.get('raw') or 0),'playable':int(r.get('playable') or 0),
              'verified':int(r.get('verified') or 0),'contradictions':int(r.get('contradictions') or 0),
            })
          route_rows=[]
          for pid in expected:
            r=target_rows[pid]
            route_rows.append({
              'provider':pid,'status':r.get('status'),
              'routeCount':int(r.get('routeCount') or len(r.get('routes') or [])),
              'recipe':bool(r.get('apiRecipe') or r.get('api_recipe')),
            })
          des_rows=[r for r in des_route.get('providers') or [] if isinstance(r,dict) and str(r.get('providerId') or '').casefold()=='desiflix']
          if len(des_rows)!=1:
            raise SystemExit(f'V57 DESIFLIX route scope mismatch count={len(des_rows)}')
          dr=des_rows[0]
          rc=int(Path('/tmp/v57-active-rc').read_text().strip())
          out={
            'schemaVersion':2,
            'activeRepairRc':rc,
            'activeTargetedProviders':actual,
            'providersWithProvenRoutes':summary.get('providersWithProvenRoutes'),
            'provenRouteCount':summary.get('provenRouteCount'),
            'playableProviders':y.get('playableProviders') or [],
            'verifiedProviders':y.get('verifiedProviders') or [],
            'lostUpstreamPositivePairs':y.get('lostUpstreamPositivePairs') or [],
            'routeRows':route_rows,
            'laneRows':lane_rows,
            'desiflix':{
              'routeStatus':dr.get('status'),
              'routeCount':int(dr.get('routeCount') or len(dr.get('routes') or [])),
              'currentYield':des_yield.get('rows') or [],
            },
          }
          p=Path('automation/evidence/actionable-repair-v57.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V57_COMPACT',json.dumps(out,sort_keys=True))
          PY
          git diff --check

      - name: Persist V57 diagnostic evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/evidence/actionable-repair-v57.json automation/evidence/desiflix-current-yield-v57.json
          git commit -m 'test(repair): record fresh actionable residual evidence'
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
