name: NiakVIO runtime-domain fixed-point repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-runtime-domain-idempotence-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-runtime-domain-fixed-point-once
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Make both fixed-point repairs durable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('scripts/apply_provider_overrides.py')
          text = path.read_text(encoding='utf-8')

          # 1) Generated security marker is a Core boundary, not provider source.
          tuple_old = '''GENERATED_CORE_TAIL_MARKERS = (\n    "NUVIO_GLOBAL_STREAM_FACTS_V1",'''
          tuple_new = '''GENERATED_CORE_TAIL_MARKERS = (\n    "NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1",\n    "NUVIO_GLOBAL_STREAM_FACTS_V1",'''
          if '"NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1",\n    "NUVIO_GLOBAL_STREAM_FACTS_V1"' not in text:
              if tuple_old not in text:
                  raise SystemExit('unable to locate generated Core tail marker tuple')
              text = text.replace(tuple_old, tuple_new, 1)

          scan_old = '''    starts = [\n        index\n        for marker in GENERATED_CORE_TAIL_MARKERS\n        if (index := text.find(f"/* {marker}:")) >= 0\n    ]'''
          scan_new = '''    starts = []\n    for marker in GENERATED_CORE_TAIL_MARKERS:\n        needle = (\n            f"/* {marker} */"\n            if marker == "NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1"\n            else f"/* {marker}:"\n        )\n        index = text.find(needle)\n        if index >= 0:\n            starts.append(index)'''
          if scan_new not in text:
              if scan_old not in text:
                  raise SystemExit('unable to locate generated Core tail scanner')
              text = text.replace(scan_old, scan_new, 1)
          text = text.replace(
              '    Facts, identity and presentation are generated artifacts owned by the Core\n    scheduler.',
              '    Security, facts, identity and presentation are generated artifacts owned by the Core\n    scheduler.',
              1,
          )

          # 2) Runtime-domain wrapper must retain its existing byte position.
          start = text.index('def _inject_runtime_domain_overrides(')
          end = text.index('\ndef _strip_legacy_global_stream_guards', start)
          replacement = dedent(r'''
          def _inject_runtime_domain_overrides(text: str, replacements: dict[str, Any]) -> tuple[str, int]:
              """Embed host rewriting into the provider JavaScript artifact itself.

              Existing runtime-domain wrappers are replaced in place. Moving an
              existing wrapper back to byte zero on every reconstruction changes
              its order relative to already-idempotent prefix wrappers and rotates
              content-addressed hashes without a semantic provider change.
              """
              from urllib.parse import urlparse

              original_text = text
              rules: dict[str, str] = {}
              for old, new in replacements.items():
                  old_value = str(old).lower().strip().rstrip("/")
                  new_value = str(new).lower().strip().rstrip("/")
                  old_host = urlparse(old_value).hostname if "://" in old_value else old_value
                  new_host = urlparse(new_value).hostname if "://" in new_value else new_value
                  if old_host and new_host and old_host != new_host:
                      rules[old_host] = new_host

              marker = "NUVIO_RUNTIME_DOMAIN_OVERRIDES_V1"
              marker_comment = f"/* {marker} */"
              existing_span: tuple[int, int] | None = None
              if marker_comment in text:
                  existing_start = text.find(marker_comment)
                  call = text.find('})(typeof globalThis!=="undefined"?globalThis:this,', existing_start)
                  existing_end = text.find(");\n", call) if call >= 0 else -1
                  if existing_start < 0 or existing_end < 0:
                      raise ValueError("unterminated runtime domain override bootstrap")
                  existing_span = (existing_start, existing_end + 3)

              if not rules:
                  if existing_span is None:
                      return text, 0
                  output = text[:existing_span[0]] + text[existing_span[1]:]
                  return output, 0 if output == original_text else 1

              import base64
              encoded_rules = [
                  [base64.b64encode(old.encode("utf-8")).decode("ascii"), new]
                  for old, new in sorted(rules.items())
              ]
              payload = json.dumps(encoded_rules, separators=(",", ":"))
              bootstrap = """/* %s */
          ;(function(g,rules){
            if(!g||typeof g.fetch!=="function")return;
            var key="__nuvioDomainOverrideV1";
            var state=g[key];
            if(!state){
              state={native:g.fetch.bind(g),rules:Object.create(null)};
              g[key]=state;
              g.fetch=function(input,init){
                var next=input;
                try{
                  var raw=(typeof Request!=="undefined"&&input instanceof Request)?input.url:String(input);
                  var url=new URL(raw);
                  var replacement=state.rules[String(url.hostname).toLowerCase()];
                  if(replacement){
                    url.hostname=replacement;
                    next=(typeof Request!=="undefined"&&input instanceof Request)?new Request(url.toString(),input):url.toString();
                  }
                }catch(_error){}
                return state.native(next,init);
              };
            }
            for(var i=0;i<rules.length;i++){
              try{state.rules[atob(rules[i][0])]=rules[i][1];}catch(_error){}
            }
          })(typeof globalThis!=="undefined"?globalThis:this,%s);
          """ % (marker, payload)

              if existing_span is None:
                  output = bootstrap + text
              else:
                  output = text[:existing_span[0]] + bootstrap + text[existing_span[1]:]
              return output, 0 if output == original_text else len(rules)
          ''').lstrip('\n')
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          test = Path('tests/global_playback_integrity_policy_test.py')
          t = test.read_text(encoding='utf-8')
          security_marker = '# Security is itself a generated Core boundary and must be rebuilt, not retained as provider source.'
          if security_marker not in t:
              anchor = '# The complete discovery transform must be byte-idempotent. Stable output bytes\n'
              block = dedent('''
              # Security is itself a generated Core boundary and must be rebuilt, not retained as provider source.
              boundary_input = "provider-source\\n/* NUVIO_GLOBAL_PROVIDER_SECURITY_HOOK_V1 */\\n/* NUVIO_GLOBAL_STREAM_FACTS_V1:old */\\nstale-tail"
              boundary_prefix, boundary_removed = module._strip_generated_core_tail(boundary_input)
              assert boundary_removed is True
              assert boundary_prefix == "provider-source"

              ''').lstrip('\n')
              if anchor not in t:
                  raise SystemExit('security fixed-point test anchor missing')
              t = t.replace(anchor, block + anchor, 1)

          runtime_marker = '# Runtime-domain wrappers preserve their existing position across reconstruction.'
          if runtime_marker not in t:
              anchor = '# Runtime repair phase must not inject discovery wrappers.\n'
              block = dedent('''
              # Runtime-domain wrappers preserve their existing position across reconstruction.
              domain_seed = 'provider-source\\n'
              domain_once, _ = module._inject_runtime_domain_overrides(domain_seed, {'old.example': 'new.example'})
              domain_prefixed = 'HLS-PREFIX\\n' + domain_once
              domain_twice, _ = module._inject_runtime_domain_overrides(domain_prefixed, {'old.example': 'new.example'})
              assert domain_twice == domain_prefixed
              assert domain_twice.index('HLS-PREFIX') < domain_twice.index('NUVIO_RUNTIME_DOMAIN_OVERRIDES_V1')

              ''').lstrip('\n')
              if anchor not in t:
                  raise SystemExit('runtime-domain fixed-point test anchor missing')
              t = t.replace(anchor, block + anchor, 1)
          test.write_text(t, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_provider_overrides.py
          python tests/global_playback_integrity_policy_test.py

      - name: Prove complete published fixed point
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:manifest.json > "$RUNNER_TEMP/manifest-before.json"
          python scripts/normalize_core_media_policy.py --apply
          python scripts/apply_runtime_capability_upgrade_v4.py
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          python scripts/prune_unreferenced_providers.py
          python scripts/reapply_published_overrides.py --check

      - name: Keep durable fixes only and self-delete
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apply_provider_overrides.py "$RUNNER_TEMP/apply_provider_overrides.py"
          cp tests/global_playback_integrity_policy_test.py "$RUNNER_TEMP/global_playback_integrity_policy_test.py"
          git reset --hard HEAD
          git clean -fdx
          cp "$RUNNER_TEMP/apply_provider_overrides.py" scripts/apply_provider_overrides.py
          cp "$RUNNER_TEMP/global_playback_integrity_policy_test.py" tests/global_playback_integrity_policy_test.py
          git rm .github/workflows/fix-runtime-domain-idempotence-once.yml
          python -m py_compile scripts/apply_provider_overrides.py
          python tests/global_playback_integrity_policy_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_provider_overrides.py tests/global_playback_integrity_policy_test.py
          git commit -m 'core: stabilize generated security and runtime domain boundaries'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
