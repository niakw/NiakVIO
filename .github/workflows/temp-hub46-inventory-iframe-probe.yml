name: TEMP - Hub46 Inventory + Iframe Probe
# retry: inline-structured-plan-patch

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-hub46-inventory-iframe-probe.yml'

permissions:
  contents: write

jobs:
  refresh-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Repair inventory semantics and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_hub46_blocker_inventory.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
          'def mechanism_for(*, strategy: str, recipe: dict[str, Any], legos: list[str], route_kinds: set[str], authorities: list[str]) -> str:\n',
          'def mechanism_for(*, strategy: str, recipe: dict[str, Any], legos: list[str], route_kinds: set[str], authorities: list[str], search_plan_count: int = 0, value_plan_count: int = 0, external_identity_count: int = 0) -> str:\n',1)
          needle='''    if legos:\n        return "provider-lego"\n    if "search" in route_kinds'''
          repl='''    if legos:\n        return "provider-lego"\n    if search_plan_count and value_plan_count:\n        return "structured-search-value-plan"\n    if value_plan_count:\n        return "provider-value-plan"\n    if search_plan_count:\n        return "structured-search-plan"\n    if external_identity_count:\n        return "external-identity-plan"\n    if "search" in route_kinds'''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle='''        legos = uniq(list(patch.get("provider_lego_scripts") or []))\n\n        routes = uniq('''
          repl='''        legos = uniq(list(patch.get("provider_lego_scripts") or []))\n        search_plan = [row for row in (patch.get("search_request_plan") or model.get("searchRequestPlan") or []) if isinstance(row, dict)]\n        value_plan = [row for row in (patch.get("provider_value_plan") or model.get("providerValuePlan") or []) if isinstance(row, dict)]\n        external_identity_plan = [row for row in (patch.get("external_identity_plan") or model.get("externalIdentityPlan") or []) if isinstance(row, dict)]\n\n        routes = uniq('''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle='''            route_kinds=route_kinds,\n            authorities=authorities,\n        )'''
          repl='''            route_kinds=route_kinds,\n            authorities=authorities,\n            search_plan_count=len(search_plan),\n            value_plan_count=len(value_plan),\n            external_identity_count=len(external_identity_plan),\n        )'''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle='''            if not (route_kinds & EXEC_ROUTE_KINDS):\n                opaque_reasons.append("no_executable_route_shape")'''
          repl='''            if not (route_kinds & EXEC_ROUTE_KINDS) and not search_plan and not value_plan and not external_identity_plan:\n                opaque_reasons.append("no_executable_route_shape_or_structured_plan")'''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle='''            "providerLegos": legos,\n            "routeDataState": disposition.get("routeDataState"),'''
          repl='''            "providerLegos": legos,\n            "searchRequestPlanCount": len(search_plan),\n            "providerValuePlanCount": len(value_plan),\n            "externalIdentityPlanCount": len(external_identity_plan),\n            "routeDataState": disposition.get("routeDataState"),'''
          assert needle in s
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          print('HUB46_INVENTORY_STRUCTURED_PLAN_PATCHED')
          PY
          python -m py_compile scripts/build_hub46_blocker_inventory.py
          python scripts/build_hub46_blocker_inventory.py
      - name: Probe VoirAnime structured search and Coflix iframe surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,urllib.parse,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
          def req(url, method='GET', data=None, referer=None):
              headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              if isinstance(data,dict):
                  data=urllib.parse.urlencode(data).encode(); headers['Content-Type']='application/x-www-form-urlencoded; charset=UTF-8'
              r=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=15) as x:
                      return x.status,x.geturl(),x.read().decode('utf-8','replace'),dict(x.headers)
              except urllib.error.HTTPError as e:
                  return e.code,url,e.read().decode('utf-8','replace'),dict(e.headers)
              except Exception as e:
                  return 0,url,'',{'error':type(e).__name__+':'+str(e)}
          vs='https://voiranime.homes/engine/ajax/search.php'
          st,final,body,h=req(vs,'POST',{'query':'Jujutsu Kaisen','page':'1'},'https://voiranime.homes/')
          print(f'VOIRANIME_LIVE_SEARCH status={st} final={final} bytes={len(body)} type={h.get("Content-Type","")}')
          if st==200:
              ids=re.findall(r'(?:newsid=|data-id=["\']?|"id"\s*:\s*["\']?)(\d+)',body,re.I)
              ids=list(dict.fromkeys(ids))
              print('VOIRANIME_LIVE_IDS count='+str(len(ids))+' sample='+','.join(ids[:5]))
              if ids:
                  eu=f'https://voiranime.homes/engine/ajax/manga_episodes_api.php?id={ids[0]}'
                  es,ef,eb,eh=req(eu,referer='https://voiranime.homes/')
                  hosts=sorted(set(re.findall(r'https?://([^/"\']+)',eb,re.I)))
                  print(f'VOIRANIME_LIVE_EPISODES status={es} bytes={len(eb)} hosts={";".join(hosts[:12])}')
          else:
              print('VOIRANIME_LIVE_STATUS blocker=search_http_'+str(st))

          cu='https://coflix.group/film/gandhari/'
          st,final,body,h=req(cu,referer='https://coflix.group/')
          print(f'COFLIX_LIVE_DETAIL status={st} final={final} bytes={len(body)} type={h.get("Content-Type","")}')
          if st==200:
              iframes=re.findall(r'<iframe[^>]+src=["\']([^"\']+)',body,re.I)
              data_urls=re.findall(r'(?:data-(?:src|url|link|embed)|href)=["\']([^"\']+)',body,re.I)
              ajax=sorted(set(re.findall(r'["\']([^"\']*(?:ajax|player|embed|stream|server)[^"\']*)["\']',body,re.I)))
              def norm(u):
                  try:return urllib.parse.urljoin(final,u.replace('\\/','/'))
                  except:return u
              iframes=list(dict.fromkeys(norm(x) for x in iframes))
              interesting=list(dict.fromkeys(norm(x) for x in data_urls if any(k in x.lower() for k in ('player','embed','dood','voe','uqload','vidzy','lecteur','coflix'))))
              print('COFLIX_LIVE_IFRAMES count='+str(len(iframes))+' values='+';'.join(iframes[:12]))
              print('COFLIX_LIVE_DATA_URLS count='+str(len(interesting))+' values='+';'.join(interesting[:12]))
              print('COFLIX_LIVE_AJAX_HINTS count='+str(len(ajax))+' values='+';'.join(ajax[:12]))
              for u in iframes[:4]:
                  ps,pf,pb,ph=req(u,referer=final)
                  m=re.search(r'https?://[^"\'<> ]+\.m3u8[^"\'<> ]*',pb,re.I)
                  print(f'COFLIX_LIVE_IFRAME_FETCH host={urllib.parse.urlparse(u).hostname or ""} status={ps} bytes={len(pb)} m3u8={1 if m else 0}')
          else:
              print('COFLIX_LIVE_STATUS blocker=detail_http_'+str(st))
          PY
      - name: Validate exact 46 activation remains unchanged
        run: |
          python scripts/validate_activation_preservation.py
          python - <<'PY'
          import json
          x=json.load(open('automation/evidence/hub46-blocker-inventory-20260911.json'))
          print('HUB46_REFRESHED opaque='+str(x['repoOpaqueCount'])+' providers='+','.join(x['repoOpaqueProviders']))
          assert x['providerCount']==46 and x['enabledTargetCount']==46
          PY
      - name: Commit evidence and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-hub46-inventory-iframe-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(evidence): refresh hub46 structured blocker inventory'
          git push origin HEAD:workbench/hub-matrix-46-20260911
