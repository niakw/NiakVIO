name: TEMP - MovieBox Region Active

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-mb-region-active.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Apply source patches
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/p1.py
          echo '' | base64 -d > /tmp/p2.py
          echo '' | base64 -d > /tmp/p3.py
          python3 /tmp/p1.py
          python3 /tmp/p2.py
          python3 /tmp/p3.py
          echo 'FIELD_PATCH_GENERAL_METADATA active_only=ready'
      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node engine_v2/tests/stream-presentation.test.mjs
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/native_runtime_settlement_contract_test.py
          python3 tests/provider_no_timer_runtime_test.py
          python3 -m py_compile scripts/materialize_provider_v3_all.py
          python3 - <<'PY'
          import json
          rows=json.load(open('manifest.json')).get('scrapers') or []
          on=[r for r in rows if r.get('enabled') is not False]
          off=[r for r in rows if r.get('enabled') is False]
          assert (len(rows),len(on),len(off)) == (96,46,50)
          print('FIELD_ACTIVE_REBUILD_SCOPE global=96 enabled=46 disabled=50')
          PY
      - name: Commit source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine_v2/src/stream-presentation.mjs engine_v2/src/contracts.mjs engine_v2/tests/stream-presentation.test.mjs scripts/materialize_provider_v3_all.py
          git diff --cached --check
          git commit -m 'fix(core): derive reader metadata and scope active rebuild'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
          echo "FIELD_GENERAL_METADATA_COMMIT sha=$(git rev-parse HEAD)"
