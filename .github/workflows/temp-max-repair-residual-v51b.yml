name: TEMP - Max Repair Residual V51B

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-residual-v51b.yml']

permissions:
  contents: write

jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}

      - name: Probe every current missing lane
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v51b.cjs <<'NODE'
          const fs=require('fs'),path=require('path'),{spawn}=require('child_process');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const overrides=JSON.parse(fs.readFileSync('provider-overrides.json','utf8'));
          const FIX={
            movie:[
              {id:'157336',type:'movie',title:'Interstellar',year:'2014',season:1,episode:1},
              {id:'118340',type:'movie',title:'Guardians of the Galaxy Vol. 2',year:'2017',season:1,episode:1}
            ],
            tv:[
              {id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              {id:'94997',type:'tv',title:'House of the Dragon',year:'2022',season:1,episode:1},
              {id:'94605',type:'tv',title:'Arcane',year:'2021',season:1,episode:1}
            ],
            anime:[
              {id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
              {id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:3},
              {id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178}
            ]
          };
          function providerFile(pid){const a=(manifest.scrapers||[]).filter(x=>String(x&&x.id||'').toLowerCase()===String(pid).toLowerCase());if(a.length!==1)throw new Error(`manifest_exact:${pid}:${a.length}`);const f=path.resolve(String(a[0].filename||''));if(!fs.existsSync(f))throw new Error(`provider_file:${pid}:${f}`);return f}
          function metadata(s){return s.type==='movie'?{id:Number(s.id),title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{id:Number(s.id),name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function verify(row){const u=String(row&&row.url||'');if(!/^https?:\/\//i.test(u))return{ok:false,kind:'bad-url'};const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const h=Object.assign({},row&&row.headers||{});if(row&&row.isDirect===false){const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),ct=r.headers.get('content-type')||'',body=await r.text();return{ok:r.ok&&/html|xhtml/i.test(ct)&&body.length>150,kind:'embed',status:r.status,ctype:ct,bytes:body.length,final:r.url}}if(/\.m3u8(?:[?#]|$)/i.test(u)){const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),ct=r.headers.get('content-type')||'',body=await r.text();return{ok:r.ok&&body.includes('#EXTM3U'),kind:'hls',status:r.status,ctype:ct,bytes:body.length,final:r.url}}h.Range='bytes=0-2047';const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),ct=r.headers.get('content-type')||'',b=Buffer.from(await r.arrayBuffer());return{ok:(r.status===200||r.status===206)&&b.length>0&&(/video|audio|octet-stream|matroska|dash/i.test(ct)||/\.(mp4|mkv|webm|mpd)(?:[?#]|$)/i.test(u)),kind:'binary',status:r.status,ctype:ct,bytes:b.length,final:r.url}}catch(e){return{ok:false,kind:'error',error:String(e&&e.message||e)}}finally{clearTimeout(t)}}
          async function child(pid,lane,idx){const s=FIX[lane][Number(idx)],f=providerFile(pid),m=metadata(s),ns=s.type==='movie'?'movie':'tv';globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m,canonicalMediaType:s.type,season:s.season,episode:s.episode};globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};globalThis.__nuvioProviderDeadlineMs=Date.now()+26000;let rows=[],error='';try{const mod=require(f);rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider_timeout')),27000))])}catch(e){error=String(e&&e.message||e)}rows=Array.isArray(rows)?rows:[];const proofs=[];for(const r of rows.slice(0,8))proofs.push(await verify(r));const out={pid,lane,idx:Number(idx),fixture:`${s.title} S${s.season}E${s.episode}`,count:rows.length,rows:rows.slice(0,8).map(r=>({url:String(r&&r.url||''),title:String(r&&r.title||r&&r.name||''),isDirect:r&&r.isDirect,quality:r&&r.quality,language:r&&r.language})),terminalOk:proofs.some(p=>p.ok&&(p.kind==='hls'||p.kind==='binary')),embedOk:proofs.some(p=>p.ok&&p.kind==='embed'),proofs,error};console.log('CHILD\t'+JSON.stringify(out))}
          function run(pid,lane,idx){return new Promise(resolve=>{const cp=spawn(process.execPath,[__filename,'--child',pid,lane,String(idx)],{stdio:['ignore','pipe','pipe']});let o='',e='';cp.stdout.on('data',d=>o+=d);cp.stderr.on('data',d=>e+=d);const timer=setTimeout(()=>cp.kill('SIGKILL'),38000);cp.on('close',(code,signal)=>{clearTimeout(timer);const l=o.split(/\r?\n/).find(x=>x.startsWith('CHILD\t'));let r=null;try{r=l?JSON.parse(l.slice(6)):null}catch{}if(!r)r={pid,lane,idx,count:0,terminalOk:false,embedOk:false,proofs:[],error:`child_failed code=${code} signal=${signal} ${e.slice(-1200)}`};console.log('V51B_ATTEMPT',JSON.stringify(r));resolve(r)})})}
          function rank(r){return r&&r.terminalOk?4:r&&r.embedOk?3:r&&r.count>0?1:0}
          async function lane(pid,lane){const attempts=[];for(let i=0;i<(FIX[lane]||[]).length;i++){const r=await run(pid,lane,i);attempts.push(r);if(rank(r)>=4)break}attempts.sort((a,b)=>rank(b)-rank(a)||(b.count||0)-(a.count||0));return{pid,lane,best:attempts[0]||null,attempts}}
          async function parent(){const queue=[];for(const [pid,row] of Object.entries(overrides.provider_patches||{})){const d=row&&row.repair_disposition;if(!d||typeof d!=='object')continue;const missing=Array.isArray(d.missingLanes)?d.missingLanes.map(String):[];for(const l of missing)if(FIX[l])queue.push([pid,l])}console.log('V51B_QUEUE',queue.length,JSON.stringify(queue));let cursor=0;const results={};async function worker(){while(true){const i=cursor++;if(i>=queue.length)return;const [pid,l]=queue[i];try{results[pid+':'+l]=await lane(pid,l)}catch(e){results[pid+':'+l]={pid,lane:l,best:{pid,lane:l,count:0,terminalOk:false,embedOk:false,error:String(e&&e.message||e)},attempts:[]}}}}await Promise.all(Array.from({length:6},()=>worker()));fs.writeFileSync('/tmp/v51b.json',JSON.stringify({queue,results},null,2));const summary={};for(const [k,v] of Object.entries(results)){const b=v.best||{};summary[k]={fixture:b.fixture||'',count:b.count||0,terminalOk:!!b.terminalOk,embedOk:!!b.embedOk,error:b.error||'',proofs:b.proofs||[],urls:(b.rows||[]).map(x=>x.url)}}console.log('V51B_SUMMARY',JSON.stringify(summary,null,2))}
          if(process.argv[2]==='--child')child(process.argv[3],process.argv[4],process.argv[5]).then(()=>process.exit(0));else parent().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/v51b.cjs
          node /tmp/v51b.cjs

      - name: Reconcile terminal proof and strict ledger semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.load(open('/tmp/v51b.json')); results=raw.get('results') or {}
          p=Path('provider-overrides.json'); data=json.loads(p.read_text(encoding='utf-8')); rows=data.get('provider_patches') or {}
          terminal=[]; players=[]; output=[]; zero=[]; corrected=[]
          for key,val in sorted(results.items()):
              b=(val or {}).get('best') or {}; pid=str(b.get('pid') or key.split(':',1)[0]); lane=str(b.get('lane') or key.split(':',1)[1]); count=int(b.get('count') or 0); term=b.get('terminalOk') is True; embed=b.get('embedOk') is True
              row=rows.get(pid); d=row.get('repair_disposition') if isinstance(row,dict) and isinstance(row.get('repair_disposition'),dict) else None
              if not isinstance(d,dict): continue
              req=[str(x) for x in d.get('requiredLanes') or []]; proven=set(str(x) for x in d.get('provenLanes') or [])
              ls=d.get('laneStatuses') if isinstance(d.get('laneStatuses'),dict) else {}; vals=[str(x) for x in ls.get(lane) or []]
              codes=[str(x) for x in d.get('reasonCodes') or [] if str(x)]
              if term:
                  proven.add(lane); terminal.append(key)
                  if 'playable_verified' not in vals: vals.append('playable_verified')
                  if 'v51_live_terminal_proven' not in codes: codes.append('v51_live_terminal_proven')
              elif embed:
                  players.append(key)
                  if 'correlated_player_verified' not in vals: vals.append('correlated_player_verified')
                  if 'v51_correlated_player_verified' not in codes: codes.append('v51_correlated_player_verified')
              elif count>0:
                  output.append(key)
                  if 'output_unverified' not in vals: vals.append('output_unverified')
              else:
                  zero.append(key)
                  if 'no_streams' not in vals: vals.append('no_streams')
              ordered=[x for x in req if x in proven]
              for x in sorted(proven):
                  if x not in ordered: ordered.append(x)
              d['provenLanes']=ordered; d['currentVerifiedLanes']=list(ordered); d['missingLanes']=[x for x in req if x not in proven]; d['completeCapabilityProof']=not d['missingLanes']
              wanted='proven' if not d['missingLanes'] else 'repair'
              if d.get('recoveryStatus')!=wanted: corrected.append(pid); d['recoveryStatus']=wanted
              ls[lane]=vals; d['laneStatuses']=ls; d['reasonCodes']=codes; row['repair_disposition']=d
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V51B_TERMINAL',terminal)
          print('V51B_PLAYERS',players)
          print('V51B_OUTPUT_ONLY',output)
          print('V51B_ZERO',zero)
          print('V51B_LEDGER_CORRECTED',sorted(set(corrected)))
          print('V51B_REMAINING',sum(len(((r.get('repair_disposition') or {}).get('missingLanes') or [])) for r in rows.values() if isinstance(r,dict)))
          PY
          python scripts/validate_published_overrides.py
          python tests/global_core_runtime_ownership_test.py
          python tests/core_runtime_nonregression_contract_test.py
          git diff --check

      - name: Persist evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(repair): reconcile current residual lane evidence V51'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
