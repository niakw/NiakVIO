name: TEMP - Max Repair Proof Handoff V24
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-proof-handoff-v24.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-prove-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Apply full current repair stack and V10 handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_max_repair_current_contracts_v1.py
          python3 scripts/upgrade_max_repair_current_contracts_v2.py
          python3 scripts/upgrade_max_repair_authority_semantics_v3.py
          python3 scripts/upgrade_max_repair_residual_runtimes_v4.py
          python3 scripts/upgrade_wookafr_lecteurvideo_priority_v1.py
          python3 scripts/upgrade_correlated_player_outer_safety_v2.py
          python3 scripts/update_memory_max_repair_20260916_v3.py
          python3 -m py_compile \
            scripts/provider_patches/stream_output_sanitizer_v10.py \
            scripts/provider_patches/runtime_capability_media_safety_v4.py \
            scripts/upgrade_correlated_player_outer_safety_v2.py \
            scripts/update_memory_max_repair_20260916_v3.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
      - name: Probe repaired and regression providers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-v24.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const result={};
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
          function entry(pid){const rows=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(rows.length!==1)throw new Error(`manifest_provider_count:${pid}:${rows.length}`);return rows[0];}
          function providerFile(pid){const r=entry(pid),f=path.resolve(String(r.filename||''));if(!fs.existsSync(f))throw new Error('provider_file_missing:'+pid);console.log('MANIFEST',pid,r.filename,'enabled='+r.enabled,'types='+JSON.stringify(r.supportedTypes||[]),'canonical='+JSON.stringify(r.canonicalSupportedTypes||[]));return f;}
          function meta(s){return s.type==='movie'?{title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}};}
          async function run(label,s){
            try{
              const file=providerFile(s.pid),ns=s.type==='movie'?'movie':'tv',m=meta(s);
              globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m};
              globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};
              globalThis.__nuvioProviderDeadlineMs=Date.now()+30000;
              delete require.cache[file]; const mod=require(file); if(!mod||typeof mod.getStreams!=='function')throw new Error('getStreams_missing');
              const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),31000));
              const rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),timer]);
              const out=Array.isArray(rows)?rows:[];
              const priv=out.filter(r=>r&&('__nuvioCorrelatedPlayerFallbackV1' in r||'__nuvioCoreMediaProofV1' in r));
              console.log('PROBE',label,'count='+out.length,'private='+priv.length,out.slice(0,6).map(r=>({url:r&&r.url,title:r&&r.title,type:r&&r.type,headers:r&&r.headers})));
              result[label]={count:out.length,privateProofs:priv.length,urls:out.slice(0,6).map(r=>String(r&&r.url||'')),error:''};
              return out;
            }catch(e){console.log('PROBE_ERROR',label,String(e&&e.message||e));result[label]={count:0,privateProofs:0,urls:[],error:String(e&&e.message||e)};return [];}
          }
          async function page(label,row){
            if(!row||!/^https?:\/\//i.test(String(row.url||'')))return false;
            const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
            try{const r=await fetch(row.url,{headers:row.headers||{},redirect:'follow',signal:c.signal});const body=await r.text();console.log('PAGE',label,r.status,r.headers.get('content-type')||'','bytes='+body.length,'final='+r.url);return r.ok&&body.length>=80;}catch(e){console.log('PAGE_ERROR',label,String(e&&e.message||e));return false;}finally{clearTimeout(t)}
          }
          (async()=>{
            const specs={
              moviebox_movie:{pid:'moviebox',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              moviebox_tv:{pid:'moviebox',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              allanime:{pid:'allanime',id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178},
              wookafr:{pid:'wookafr',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              allwish:{pid:'allwish',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},
              flemmix_movie:{pid:'flemmix',id:'1356963',type:'movie',title:'Little Lorraine',year:'2026'},
              flemmix_tv:{pid:'flemmix',id:'94997',type:'tv',title:'House of the Dragon',year:'2022',season:1,episode:1},
              vidlove_movie:{pid:'vidlove',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              vidlove_tv:{pid:'vidlove',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1},
              vidfast_movie:{pid:'vidfast',id:'157336',type:'movie',title:'Interstellar',year:'2014'},
              vidfast_tv:{pid:'vidfast',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1}
            };
            for(const [label,s] of Object.entries(specs)){const rows=await run(label,s);result[label].pageOk=rows.length?await page(label,rows[0]):false;}
            fs.writeFileSync('/tmp/max-repair-v24.json',JSON.stringify(result,null,2));
            console.log('PROBE_SUMMARY',JSON.stringify(Object.fromEntries(Object.entries(result).map(([k,v])=>[k,{count:v.count,pageOk:v.pageOk,privateProofs:v.privateProofs,error:v.error}])),null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/probe-v24.cjs
          cat /tmp/max-repair-v24.json
      - name: Semantic and private-proof gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))['scrapers']
          r=json.load(open('/tmp/max-repair-v24.json'))
          def norm(v): return ''.join(c for c in str(v or '').lower() if c.isalnum())
          def row(pid):
              x=[a for a in m if norm(a.get('id'))==norm(pid)]
              assert len(x)==1,(pid,len(x)); return x[0]
          aw,cf,aa=row('allwish'),row('coflix'),row('allanime')
          assert 'movie' not in set(aw.get('canonicalSupportedTypes') or []),aw
          assert 'anime' not in set(cf.get('canonicalSupportedTypes') or cf.get('supportedTypes') or []),cf
          assert set(aa.get('canonicalSupportedTypes') or [])=={'anime'},aa
          assert all(int((v or {}).get('privateProofs') or 0)==0 for v in r.values()),r
          for key in ('moviebox_movie','moviebox_tv'):
              v=r[key]
              assert int(v.get('count') or 0)>=1 and v.get('pageOk'),(key,v)
          print('V24_CORE_HANDOFF_GATE_OK')
          PY
      - name: Persist V24 repair and MEMORY
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- MEMORY.md provider-overrides.json providers provider-bases sources.json manifest.json scripts tests
          if git diff --cached --quiet; then
            echo 'No V24 changes to commit'
          else
            git commit -m 'fix: preserve correlated player proof until outer safety'
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
