name: TEMP - Release Parallel Recovery

on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-release-parallel-recovery.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-parallel-recovery-20260912
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.scope.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Verify recovery basis and emit active 46
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_SHA='1e5825496e5ebf5985f5ed49c00144ba98841b84'
          PROVEN_RUN='34709164157'
          git merge-base --is-ancestor "$PROVEN_SHA" HEAD
          changed="$(git diff --name-only "$PROVEN_SHA"..HEAD | sort)"
          allowed="$(printf '%s\n' '.github/workflows/temp-release-parallel-recovery.yml' 'scripts/verify_provider_v3_reverse_rebuild.py' | sort)"
          test "$changed" = "$allowed" || {
            echo 'Unexpected drift since run 120 live-proven SHA:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROVEN_RUN}/jobs?per_page=100")"
          printf '%s' "$jobs" | jq -e '.jobs[] | select(.name == "reconstruct") | .steps[] | select(.name == "Reconstruct and validate providers sequentially live") | .conclusion == "success"' >/dev/null
          printf '%s' "$jobs" | jq -e '.jobs[] | select(.name == "reconstruct") | .steps[] | select(.name == "Reconstruct all 96 providers from final live DATA + Lego") | .conclusion == "failure"' >/dev/null
          providers="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          enabled=[]
          for row in manifest.get('scrapers') or []:
              if not isinstance(row,dict):
                  continue
              pid=str(row.get('id') or '').strip().casefold()
              if pid and row.get('enabled') is not False:
                  enabled.append(pid)
          expected=['anime-sama','purstream','flemmix','uhdmovies','movieshunt','hindmoviez','4khdhub','persianstremio','desiflix','kehflix','anikototv','animekai','animesalt','animesama-co','animesultra','animetsu','animevostfr','castle','coflix','french-manga','kurage','moviesmod','mugiwarastream','neko-sama','papadustream','playimdb','sekai','streamzo','videasy','vidfast','vidrock','voiranime','voiranime-homes','voiranime-rip','vostfree','wookafr','yflix','allanime','allwish','anime-ultime','animevost-fr','fullanime','mallumv','moviebox','showbox','vidlove']
          assert len(enabled)==46, (len(enabled),enabled)
          assert set(enabled)==set(expected), {'missing':sorted(set(expected)-set(enabled)),'extra':sorted(set(enabled)-set(expected))}
          print(json.dumps(expected,separators=(',',':')))
          PY
          )"
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo 'FIELD_RECOVERY_BASIS run=34709164157 live_step=success packaging_step=failure active=46'

  prove:
    needs: scope
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        provider: ${{ fromJSON(needs.scope.outputs.providers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      TARGET_PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply exact reconstruction preparation
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
      - name: Re-prove and export one finalized provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          ROOT=Path.cwd(); sys.path.insert(0,str(ROOT/'scripts'))
          from reconstruct_provider_v3_sequential_live import (
              build_provider_queue, materialize_one, run_until_qualified,
              is_qualified, finalize_provider, prove_final_bundle,
              terminal_state, KNOWLEDGE, OVERRIDES,
          )
          pid=os.environ['TARGET_PROVIDER']
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path,value): Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          queue,count=build_provider_queue(); assert count==96
          provider=next(row for row in queue if row['provider_id']==pid)
          assert provider.get('enabled') is not False, provider
          knowledge=load(KNOWLEDGE); overrides=load(OVERRIDES)
          static_row=knowledge['providers'][pid]; model=static_row['model']
          model['canonicalSupportedTypes']=list(provider.get('supported_types') or [])
          patch=(overrides.get('provider_patches') or {}).get(pid) or {}
          candidate=materialize_one(pid); candidate_file=str(candidate.get('file') or ''); assert candidate_file
          for task in provider['tasks']: task['filename']=candidate_file
          rows,evaluation,used_tasks=run_until_qualified(provider,model,0.75,50)
          if not is_qualified(evaluation):
              state,_=terminal_state(evaluation,model,patch,8)
              raise SystemExit(f'RECOVERY_CANDIDATE_RED provider={pid} state={state} missing={evaluation.get("missingTypes")}')
          finalize_provider(pid,provider,knowledge,overrides,evaluation,'declared-types-qualified',[])
          write(KNOWLEDGE,knowledge); write(OVERRIDES,overrides)
          final=materialize_one(pid); final_file=str(final.get('file') or ''); assert final_file
          proof=prove_final_bundle(provider,model,used_tasks,final_file,0.75,50)
          summary={
              'provider':pid,
              'candidateValidated':evaluation.get('validatedTypes'),
              'finalVerified':proof.get('verified'),
              'finalValidated':proof.get('validatedTypes'),
              'finalMissing':proof.get('missingTypes'),
              'candidateFile':candidate_file,
              'finalFile':final_file,
          }
          print('FIELD_RECOVERY_PROVIDER_PROOF '+json.dumps(summary,sort_keys=True))
          assert proof.get('verified') is True, summary
          report_row={
              'providerId':pid,
              'completionState':'declared-types-qualified',
              'requiredTypes':proof.get('requiredTypes') or evaluation.get('requiredTypes') or [],
              'validatedTypes':proof.get('validatedTypes') or evaluation.get('validatedTypes') or [],
              'missingTypes':proof.get('missingTypes') or [],
              'declaredTypeCoverageRatio':float(proof.get('declaredTypeCoverageRatio') or evaluation.get('declaredTypeCoverageRatio') or 1.0),
              'effectiveCoverageRatio':float(proof.get('declaredTypeCoverageRatio') or evaluation.get('declaredTypeCoverageRatio') or 1.0),
              'typeComplete':proof.get('typeComplete') is True,
              'liveValidatedRouteCount':int(proof.get('liveValidatedRouteCount') or evaluation.get('liveValidatedRouteCount') or 0),
              'providerRequestCount':int(proof.get('providerRequestCount') or evaluation.get('providerRequestCount') or 0),
              'playableVerified':bool(proof.get('playableVerifiedTypes')),
              'advancedToNextProvider':True,
              'finalBundleVerified':True,
              'recoverySourceRunId':34709164157,
          }
          payload={
              'provider':pid,
              'knowledge':knowledge['providers'][pid],
              'patch':(overrides.get('provider_patches') or {}).get(pid),
              'report':report_row,
              'candidateSha256':candidate.get('sha256'),
              'finalSha256':final.get('sha256'),
          }
          Path(f'recovery/{pid}.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-recovery-${{ matrix.provider }}-${{ github.run_id }}
          path: recovery/${{ matrix.provider }}.json
          retention-days: 2
          if-no-files-found: error

  aggregate:
    needs: [scope, prove]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-recovery-*-${{ github.run_id }}
          path: recovery
          merge-multiple: true
      - name: Prepare base and merge 46 finalized DATA rows
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def write(p,v): Path(p).write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          knowledge=load('automation/provider-v3-static-knowledge.json')
          overrides=load('provider-overrides.json')
          manifest=load('manifest.json')
          files=sorted(Path('recovery').glob('*.json'))
          assert len(files)==46, len(files)
          active={str(r.get('id') or '').strip().casefold() for r in manifest.get('scrapers') or [] if isinstance(r,dict) and r.get('enabled') is not False}
          assert len(active)==46, active
          report_by={}
          for path in files:
              payload=load(path); pid=str(payload['provider']).casefold()
              assert pid in active, pid
              knowledge['providers'][pid]=payload['knowledge']
              patch=payload.get('patch')
              if patch is not None:
                  overrides.setdefault('provider_patches',{})[pid]=patch
              report_by[pid]=payload['report']
          assert set(report_by)==active, {'missing':sorted(active-set(report_by)),'extra':sorted(set(report_by)-active)}
          rows=[]
          for row in manifest.get('scrapers') or []:
              pid=str(row.get('id') or '').strip().casefold()
              if pid in report_by:
                  rows.append(report_by[pid]); continue
              required=[str(x).strip().casefold() for x in (row.get('canonicalSupportedTypes') or row.get('supportedTypes') or []) if str(x).strip().casefold() in {'movie','tv','anime'}]
              rows.append({
                  'providerId':pid,'completionState':'disabled-unqualified','requiredTypes':required,
                  'validatedTypes':[],'missingTypes':required,'declaredTypeCoverageRatio':0.0,
                  'effectiveCoverageRatio':0.0,'typeComplete':False,'liveValidatedRouteCount':0,
                  'providerRequestCount':0,'playableVerified':False,'advancedToNextProvider':True,
                  'finalBundleVerified':False,'recoverySourceRunId':34709164157,
              })
          report={
              'schemaVersion':4,
              'method':'parallel-recovery-after-successful-sequential-live-gate',
              'recoverySourceRunId':34709164157,
              'providerCount':96,'completedProviderCount':96,'failedProvider':None,
              'liveValidatedRouteCount':sum(int(r.get('liveValidatedRouteCount') or 0) for r in rows),
              'providerRequestCount':sum(int(r.get('providerRequestCount') or 0) for r in rows),
              'finalBundleVerifiedCount':sum(1 for r in rows if r.get('finalBundleVerified') is True),
              'providers':rows,
              'sequentialNoInterProviderConcurrency':True,
              'globalCandidateMaterialization':False,
              'allProvidersAdvancedSequentially':True,
              'declaredTypesAreGateDenominator':True,
              'internalRequestsAreGateDenominator':False,
              'requiredDeclaredTypeCoverageRatio':1.0,
          }
          write('automation/provider-v3-static-knowledge.json',knowledge)
          write('provider-overrides.json',overrides)
          write('provider-v3-live-route-validation.json',report)
          print(f'FIELD_RECOVERY_MERGED providers={len(files)} final_verified={report["finalBundleVerifiedCount"]} live={report["liveValidatedRouteCount"]}')
          PY
      - name: Deterministic packaging and reverse rebuild
        run: |
          set -euo pipefail
          python scripts/materialize_provider_base_v3_store.py
          python scripts/provider_base_store.py validate
          python scripts/provider_base_store.py validate --artifacts
          python scripts/materialize_provider_v3_all.py
          python scripts/prune_unreferenced_providers.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/assert_active_provider_live_coverage.py
          python scripts/verify_provider_v3_reverse_rebuild.py
      - name: Final runtime and release integrity
        run: |
          set -euo pipefail
          python tests/provider_brick_portfolio_audit_test.py --published --require-all
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python tests/provider_anime_semantic_transport_contract_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/peachify_runtime_crypto_test.py
          python scripts/audit_provider_v3_static.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_identity_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
          python scripts/assert_active_provider_live_coverage.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python scripts/audit_provider_quick_yield.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --check
      - name: Commit recovered verified reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'FIELD_RECOVERY_COMMIT no_changes=true'
            exit 0
          fi
          git commit -m 'chore: recover strict-46 finalized DATA after run 120'
          git push origin HEAD:release/stable-46-20260912
          echo "FIELD_RECOVERY_COMMIT sha=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strict46-recovered-reconstruction-${{ github.run_id }}
          path: |
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            provider-v3-materialization.json
            provider-v3-live-route-validation.json
            automation/provider-v3-static-knowledge.json
            provider-overrides.json
            FILE-HASHES.json
            PATCH-SHA256SUMS.txt
            SHA256SUMS.json
          retention-days: 14
          if-no-files-found: error
