name: TEMP - UHD AnimeSalt Terminal V71

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths: [.github/workflows/temp-uhd-animesalt-terminal-v71.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}

      - name: Follow UHDMovies verified go link
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,http.cookiejar
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def rq(url,ref='',data=None):
              h={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'}
              if ref:h['Referer']=ref
              if data is not None:h['Content-Type']='application/x-www-form-urlencoded'
              try:
                  with op.open(urllib.request.Request(url,data=data,headers=h),timeout=20) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(1000000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(500000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          page='https://uhdmovies.my/download-interstellar-2014-dual-audio-hindi-english-2160p-4k-1080p-x264-10bit-remux-hdr-dovi-hevc-bluray-esubs/'
          st,pf,ct,pb=rq(page);m=re.search(r'href=["\']([^"\']*cloud\.unblockedgames\.world/\?sid=[^"\']+)',html.unescape(pb),re.I);assert m
          handoff=html.unescape(m.group(1));st,hf,ct,hb=rq(handoff,page);fm=re.search(r'<form\b[\s\S]*?</form>',html.unescape(hb),re.I);assert fm
          def submit(form,base,ref):
              am=re.search(r'action=["\']([^"\']*)',form,re.I);action=urllib.parse.urljoin(base,am.group(1) if am else base);fields=[]
              for im in re.finditer(r'<input\b([^>]*)>',form,re.I):
                  a=im.group(1);nm=re.search(r'name=["\']([^"\']+)',a,re.I);val=re.search(r'value=["\']([^"\']*)',a,re.I)
                  if nm:fields.append((nm.group(1),html.unescape(val.group(1) if val else '')))
              return rq(action,ref,urllib.parse.urlencode(fields).encode())
          st1,f1,c1,b1=submit(fm.group(0),hf,hf);forms=re.findall(r'<form\b[\s\S]*?</form>',html.unescape(b1.replace('\\/','/')),re.I);assert forms
          st2,f2,c2,b2=submit(forms[0],f1,f1);n2=html.unescape(b2.replace('\\/','/'))
          gos=[]
          for mm in re.finditer(r'href=["\']([^"\']*\?go=[^"\']+)',n2,re.I):
              u=urllib.parse.urljoin(f2,html.unescape(mm.group(1)))
              if u not in gos:gos.append(u)
          if not gos:
              for mm in re.finditer(r'https?://[^\s"\'<>]+\?go=[^\s"\'<>]+',n2,re.I):
                  if mm.group(0) not in gos:gos.append(mm.group(0))
          print('V71_UHD_GO_LINKS',gos[:20]);assert gos,'missing go link after verification'
          for u in gos[:6]:
              st3,f3,c3,b3=rq(u,f2);print('V71_UHD_GO_FETCH',st3,f3,c3,'bytes',len(b3));nn=html.unescape(b3.replace('\\/','/'))
              for pat in [r'(?:href|src|action|data-(?:src|url|link|href|file|stream|player))\s*=\s*["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
                  seen=[]
                  for x in re.finditer(pat,nn,re.I):
                      raw=x.group(1) if x.lastindex else x.group(0);child=urllib.parse.urljoin(f3,raw)
                      if child.startswith('http') and child not in seen:seen.append(child)
                  for child in seen[:120]:
                      if any(t in child.lower() for t in ['hubcloud','vcloud','drive','stream','download','file','pixeldrain','gofile','cloud','workers','video','m3u8','mp4','link']):print('V71_UHD_CHILD',child[:900])
              print('V71_UHD_GO_HEAD',re.sub(r'\s+',' ',nn)[:7000])
          PY

      - name: Prove AnimeSalt player header contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,http.cookiejar
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));ep='https://animesalt.cx/episode/jujutsu-kaisen-1x1/'
          def raw(url,headers):
              try:
                  with op.open(urllib.request.Request(url,headers=headers),timeout=20) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(1000000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(500000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          st,ef,ct,body=raw(ep,{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'});print('V71_SALT_EP',st,ef,ct,'bytes',len(body));assert st==200
          n=html.unescape(body.replace('\\/','/'));m=re.search(r'<iframe\b[^>]*src=["\']([^"\']+)',n,re.I);assert m,'player iframe missing';player=urllib.parse.urljoin(ef,m.group(1));print('V71_SALT_PLAYER_URL',player)
          variants=[
            ('referer',{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Referer':ef}),
            ('referer-origin',{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Referer':ef,'Origin':'https://animesalt.cx'}),
            ('bare',{'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'}),
          ]
          results=[]
          for name,h in variants:
              st2,f2,ct2,b2=raw(player,h);results.append((name,st2,f2,ct2,b2));print('V71_SALT_PLAYER',name,st2,f2,ct2,'bytes',len(b2))
              nn=html.unescape(b2.replace('\\/','/'))
              for pat in [r'https?://[^\s"\'<>]+\.(?:m3u8|mp4)(?:\?[^\s"\'<>]*)?',r'(?:file|src|source)\s*[:=]\s*["\']([^"\']+)']:
                  for mm in re.finditer(pat,nn,re.I):
                      u=urllib.parse.urljoin(f2,mm.group(1) if mm.lastindex else mm.group(0));print('V71_SALT_MEDIA',name,u[:900])
          ok=[x for x in results if x[1]==200]
          print('V71_SALT_200_VARIANTS',[x[0] for x in ok]);assert ok,'all player header variants failed'
          PY
