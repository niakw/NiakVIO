name: BRAIN - Disabled Provider Recovery Lab

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Exact lifecycle-disabled provider id
        required: false
        default: wookafr
        type: string
      budget_minutes:
        description: Bounded Brain recovery budget
        required: false
        default: "15"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/brain-disabled-recovery-lab.json'
      - 'scripts/build_disabled_provider_recovery_stage.py'
      - '.github/workflows/brain-disabled-recovery-lab.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: niakvio-brain-disabled-recovery-lab
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - id: target
        name: Resolve exact disabled recovery target
        shell: bash
        env:
          INPUT_PROVIDER: ${{ inputs.provider || '' }}
          INPUT_BUDGET: ${{ inputs.budget_minutes || '' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          trigger=Path(".github/triggers/brain-disabled-recovery-lab.json")
          cfg=json.loads(trigger.read_text(encoding="utf-8")) if trigger.is_file() else {}
          raw=os.environ.get("INPUT_PROVIDER") or cfg.get("provider") or "wookafr"
          provider=re.sub(r"[^a-z0-9._-]+","-",str(raw).strip().casefold()).strip("-")
          budget=str(os.environ.get("INPUT_BUDGET") or cfg.get("budgetMinutes") or 15)
          if not provider:
              raise SystemExit("disabled recovery target provider is required")
          print("provider="+provider)
          print("budget_minutes="+budget)
          PY

      - name: Build exact disabled-byte observation stage
        shell: bash
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
        run: |
          set -euo pipefail
          python scripts/build_disabled_provider_recovery_stage.py             --stage staging-disabled-recovery             --provider "$PROVIDER"
          python tests/provider_disabled_recovery_stage_test.py

      - name: Normalize optional residential Tailscale tag
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"

      - name: Connect optional residential transport
        id: tailscale_connect
        continue-on-error: true
        timeout-minutes: 4
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Select optional residential exit
        id: residential_exit
        continue-on-error: true
        if: ${{ env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
              echo "NIAKVIO_DISABLED_RECOVERY_RESIDENTIAL=1" >> "$GITHUB_ENV"
              echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL active=true"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL active=false" >&2
          exit 1

      - name: Observe disabled bytes without production authority
        shell: bash
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
          NUVIO_STAGE: staging-disabled-recovery
          NUVIO_CANDIDATES_PATH: staging-disabled-recovery/candidates.json
          NUVIO_HEALTH_OUTPUT: brain-disabled-recovery/health
          NUVIO_HEALTH_RESULTS_FILENAME: health-results.json
          NUVIO_HEALTH_PROVIDER_FILTER: ${{ steps.target.outputs.provider }}
          NUVIO_WORKER_MEMORY_MB: "768"
        run: |
          set -euo pipefail
          mkdir -p brain-disabled-recovery/health
          node scripts/health_check.mjs --deep
          test -s brain-disabled-recovery/health/health-results.json

      - name: Clear residential exit before Brain model bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ "${NIAKVIO_DISABLED_RECOVERY_RESIDENTIAL:-0}" = "1" ]; then
            sudo tailscale set --exit-node=
            echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL_BOOTSTRAP isolated=true"
          else
            echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL_BOOTSTRAP isolated=false"
          fi

      - name: Build clean Brain reconstruction stage
        shell: bash
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
        run: |
          set -euo pipefail
          python scripts/discover_candidates.py             --stage staging-disabled-recovery-reconstruction             --clean-reconstruction             --provider "$PROVIDER"
          python scripts/build_provider_runtime_profiles.py             --stage staging-disabled-recovery-reconstruction             --apply-stage             --provider "$PROVIDER"             --ephemeral-overrides             --ephemeral-overrides-output staging-disabled-recovery-reconstruction/provider-overrides.ephemeral.json
          python scripts/normalize_terminal_quarantine_stage.py             --stage staging-disabled-recovery-reconstruction             --overrides staging-disabled-recovery-reconstruction/provider-overrides.ephemeral.json
          python scripts/validate_override_pipeline.py             --stage staging-disabled-recovery-reconstruction             --config staging-disabled-recovery-reconstruction/provider-overrides.ephemeral.json             --provider "$PROVIDER"
          python - <<'PY'
          import json, os
          from pathlib import Path
          provider=os.environ["PROVIDER"].strip().lower().replace("_","-")
          path=Path("staging-disabled-recovery-reconstruction/candidates.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          ids={str(row.get("canonical_id") or "").strip().lower().replace("_","-") for row in data.get("candidates") or []}
          if provider not in ids:
              raise SystemExit(f"clean disabled recovery reconstruction missing {provider}")
          PY

      - name: Resolve exact current Brain LLM revision
        id: brain_llm_pin
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin https://github.com/niakw/NiakVIO-Brain-LLM.git
          git -C "$tmp" fetch --quiet --depth=1 origin refs/heads/main:refs/remotes/origin/main
          sha="$(git -C "$tmp" rev-parse refs/remotes/origin/main)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FIELD_DISABLED_RECOVERY_BRAIN_PIN sha=$sha source=main"

      - name: Checkout pinned Brain LLM synthesis authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO-Brain-LLM
          ref: ${{ steps.brain_llm_pin.outputs.sha }}
          path: brain-llm
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Brain LLM package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e brain-llm

      - name: Build bounded Brain LLM public memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brain-disabled-recovery/brain-llm
          python brain-llm/scripts/import_public_niakvio.py \
            --niakvio-root . \
            --output brain-disabled-recovery/brain-llm/public-experience.jsonl
          python brain-llm/scripts/import_public_docs.py \
            --niakvio-root . \
            --config brain-llm/config/document_sources.json \
            --output brain-disabled-recovery/brain-llm/public-documents.jsonl \
            > brain-disabled-recovery/brain-llm/public-document-report.json
          test -s brain-disabled-recovery/brain-llm/public-experience.jsonl
          test -s brain-disabled-recovery/brain-llm/public-documents.jsonl

      - name: Download and verify official llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .brain-disabled-llm-runtime
          mkdir -p .brain-disabled-llm-runtime
          archive="$RUNNER_TEMP/llama-b11140.tar.gz"
          expected_sha='460c45fa8a9ebc36c9b08e3a15c06dbdbeb312c6308599521c84d9e7f92a268b'
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11140/llama-b11140-bin-ubuntu-x64.tar.gz' \
            -o "$archive"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C .brain-disabled-llm-runtime
          binary="$(find .brain-disabled-llm-runtime -type f -name llama-server -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "FIELD_DISABLED_RECOVERY_LLAMA verified_sha256=true release=b11140"

      - name: Start bounded Brain LLM advisor
        id: brain_llm_server
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find .brain-disabled-llm-runtime -type f -name llama-server -print -quit)"
          test -x "$binary"
          "$binary" \
            -hf 'Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M' \
            --host 127.0.0.1 --port 8080 -c 8192 -np 1 \
            > brain-disabled-recovery/brain-llm/llama-server.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "FIELD_DISABLED_RECOVERY_LLM_SERVER available=true model=qwen2.5-coder-3b"
              exit 0
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              tail -120 brain-disabled-recovery/brain-llm/llama-server.log || true
              echo "FIELD_DISABLED_RECOVERY_LLM_SERVER available=false reason=process_exited" >&2
              exit 1
            fi
            sleep 2
          done
          tail -80 brain-disabled-recovery/brain-llm/llama-server.log || true
          echo "FIELD_DISABLED_RECOVERY_LLM_SERVER available=false" >&2
          exit 1

      - name: Restore residential exit for provider recovery replay
        shell: bash
        run: |
          set -euo pipefail
          if [ "${NIAKVIO_DISABLED_RECOVERY_RESIDENTIAL:-0}" = "1" ]; then
            for attempt in 1 2 3 4 5; do
              if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
                echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL_RESTORED active=true"
                exit 0
              fi
              sleep "$((attempt * 2))"
            done
            echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL_RESTORED active=false" >&2
            exit 1
          fi
          echo "FIELD_DISABLED_RECOVERY_RESIDENTIAL_RESTORED active=false skipped=true"

      - id: brain_guidance
        name: Synthesize disabled-provider guidance through Brain LLM
        shell: bash
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
          BRAIN_LLM_SHA: ${{ steps.brain_llm_pin.outputs.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          python brain-llm/scripts/route_batch_from_checkout.py \
            --niakvio-root . \
            --experience brain-disabled-recovery/brain-llm/public-experience.jsonl \
            --mode brain \
            --provider "$PROVIDER" \
            --allow-disabled-explicit \
            --advisor-only \
            --output brain-disabled-recovery/brain-llm/routing.jsonl \
            --summary brain-disabled-recovery/brain-llm/routing-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("brain-disabled-recovery/brain-llm/routing-summary.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          if int(d.get("targets") or 0) != 1:
              raise SystemExit(f"disabled recovery Brain routing did not select exactly one target: {d}")
          PY
          python brain-llm/scripts/plan_batch_from_checkout.py \
            --niakvio-root . \
            --experience brain-disabled-recovery/brain-llm/public-experience.jsonl \
            --documents brain-disabled-recovery/brain-llm/public-documents.jsonl \
            --mode brain \
            --provider "$PROVIDER" \
            --allow-disabled-explicit \
            --advisor-only \
            --max-hypotheses 1 \
            --endpoint http://127.0.0.1:8080 \
            --model qwen2.5-coder-3b \
            --workers 1 \
            --max-tokens 256 \
            --timeout-seconds 180 \
            --output brain-disabled-recovery/brain-llm/batch.jsonl
          python scripts/brain_llm_guidance.py \
            --input brain-disabled-recovery/brain-llm/batch.jsonl \
            --output brain-disabled-recovery/brain-llm/guidance.json \
            --source-sha "$source_sha" \
            --brain-llm-sha "$BRAIN_LLM_SHA"
          test -s brain-disabled-recovery/brain-llm/guidance.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          provider=os.environ["PROVIDER"].strip().casefold()
          d=json.loads(Path("brain-disabled-recovery/brain-llm/guidance.json").read_text(encoding="utf-8"))
          rows=[r for r in d.get("rows") or [] if isinstance(r,dict) and str(r.get("providerId") or "").casefold()==provider]
          if d.get("publicationAuthority") is not False or d.get("directMutationAuthority") is not False:
              raise SystemExit("Brain guidance unexpectedly grants publication/direct mutation authority")
          health=json.loads(Path("brain-disabled-recovery/health/health-results.json").read_text(encoding="utf-8"))
          health_rows=health.get("providers") or health.get("results") or []
          matching=[
              r for r in health_rows
              if isinstance(r,dict)
              and str(r.get("provider") or r.get("canonical_id") or r.get("upstream_id") or r.get("id") or "").casefold()==provider
          ]
          healthy=any(str(r.get("status") or "").casefold()=="healthy" for r in matching)
          statuses={str(r.get("status") or "").casefold() for r in matching}
          runtime_error="runtime_error" in statuses
          if not rows and runtime_error:
              raise SystemExit(f"Brain LLM abstained despite deterministic runtime error for {provider}")
          if rows:
              next_action="bounded_learning_repair"
          elif healthy:
              next_action="exact_playback_identity_replay"
          else:
              # GitHub no-stream/unreachable/blocked observations are transport
              # evidence only. With no causal Brain hypothesis, preserve bytes
              # and request stronger residential/native replay instead of
              # manufacturing a provider mutation.
              next_action="transport_inconclusive_replay"
          disposition={
              "schemaVersion":1,
              "provider":provider,
              "brainGuidanceRows":len(rows),
              "brainAbstained":not bool(rows),
              "currentDisabledHealthHealthy":healthy,
              "observedStatuses":sorted(statuses),
              "residentialTransportActive":bool(os.environ.get("NIAKVIO_DISABLED_RECOVERY_RESIDENTIAL")),
              "repairRequired":bool(rows),
              "publicationAuthority":False,
              "directMutationAuthority":False,
              "nextAction":next_action,
          }
          Path("brain-disabled-recovery/brain-llm/recovery-disposition.json").write_text(
              json.dumps(disposition,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(f"FIELD_DISABLED_RECOVERY_BRAIN_GUIDANCE provider={provider} rows={len(rows)} healthy={str(healthy).lower()} action={disposition['nextAction']}")
          PY
          rows="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("brain-disabled-recovery/brain-llm/recovery-disposition.json").read_text(encoding="utf-8"))
          print(int(d.get("brainGuidanceRows") or 0))
          PY
          )"
          if [ "$rows" -gt 0 ]; then
            echo "NIAKVIO_BRAIN_LLM_GUIDANCE=$GITHUB_WORKSPACE/brain-disabled-recovery/brain-llm/guidance.json" >> "$GITHUB_ENV"
            echo "has_guidance=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_guidance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bounded Brain Learning recovery
        if: steps.brain_guidance.outputs.has_guidance == 'true'
        shell: bash
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
          BUDGET: ${{ steps.target.outputs.budget_minutes }}
        run: |
          set -euo pipefail
          mkdir -p brain-disabled-recovery/output brain-disabled-recovery/input
          printf '{}\n' > brain-disabled-recovery/input/previous.json
          python scripts/run_brain_learning_queue.py             --stage staging-disabled-recovery-reconstruction             --health brain-disabled-recovery/health/health-results.json             --previous-state brain-disabled-recovery/input/previous.json             --output-dir brain-disabled-recovery/output             --budget-minutes "$BUDGET"             --reserve-minutes 2             --stream-safety-cap 1             --provider "$PROVIDER"             --provider-filter "$PROVIDER"
          test -s brain-disabled-recovery/output/repair-report.json
          test -s brain-disabled-recovery/output/learning-queue-summary.json
          test -n "${NIAKVIO_BRAIN_LLM_GUIDANCE:-}"
          test -s "$NIAKVIO_BRAIN_LLM_GUIDANCE"

      - name: Prove recovery stayed non-publishing
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --             manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json             provider_catalog.json providers provider-disabled
          python - <<'PY'
          import json
          from pathlib import Path
          stage=json.loads(Path("staging-disabled-recovery/candidates.json").read_text(encoding="utf-8"))
          if stage.get("productionExecutionAllowed") is not False or stage.get("publicationAllowed") is not False:
              raise SystemExit("disabled recovery stage escaped non-publishing policy")
          print("FIELD_DISABLED_RECOVERY_NON_PUBLISHING production=false publication=false")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: brain-disabled-recovery-${{ steps.target.outputs.provider }}-${{ github.run_id }}
          path: |
            staging-disabled-recovery/candidates.json
            staging-disabled-recovery-reconstruction/candidates.json
            brain-disabled-recovery/health/health-results.json
            brain-disabled-recovery/output/
            brain-disabled-recovery/brain-llm/
          if-no-files-found: warn
          retention-days: 14
