name: DIAG - Coflix Livavid Unsanitized

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths:
      - '.github/workflows/coflix-livavid-unsanitized-short.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize Coflix and call provider resolver directly
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_non_display_recovery_v1.py
          python3 scripts/materialize_provider_v3_one.py coflix
          PROVIDER="$(python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,str(pathlib.Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          print(p.local_catalog()['coflix']['path'])
          PY
          )"
          export PROVIDER
          node <<'JS'
          const path=require('node:path');
          require(path.resolve(process.env.PROVIDER));
          const resolver=globalThis.__niakvioProviderRuntimeResolverV1;
          if(!resolver||resolver.provider!=='coflix'||typeof resolver.resolve!=='function')throw new Error('coflix resolver missing');
          const rows=await resolver.resolve([{tmdbId:'10195',mediaType:'movie',canonicalMediaType:'movie',title:'Thor',name:'Thor'}],{});
          const safeHeaders=(h)=>Object.fromEntries(Object.entries(h||{}).map(([k,v])=>[k,/authorization|cookie/i.test(k)?'<redacted>':String(v)]));
          const safeUrl=(raw)=>{try{const u=new URL(String(raw));return {host:u.hostname,path:u.pathname,queryKeys:[...u.searchParams.keys()].sort()}}catch{return {host:'',path:''}}};
          console.log('COFLIX_UNSANITIZED_ROWS '+JSON.stringify({count:Array.isArray(rows)?rows.length:0,rows:(Array.isArray(rows)?rows:[]).map(r=>({url:safeUrl(r&&r.url),headers:safeHeaders(r&&r.headers),quality:r&&r.quality,language:r&&r.language}))}));
          for(const row of Array.isArray(rows)?rows.slice(0,2):[]){
            if(!row||!/^https?:/.test(String(row.url||'')))continue;
            const base=Object.assign({},row.headers||{});
            const variants=[
              ['stream-headers',base],
              ['without-ua',Object.fromEntries(Object.entries(base).filter(([k])=>k.toLowerCase()!=='user-agent'))],
              ['generic-ua',Object.assign({},base,{'User-Agent':'Mozilla/5.0'})],
              ['provider-ua',Object.assign({},base,{'User-Agent':'Mozilla/5.0 NiakVIO/2'})],
              ['provider-ua-no-range',Object.fromEntries(Object.entries(Object.assign({},base,{'User-Agent':'Mozilla/5.0 NiakVIO/2'})).filter(([k])=>k.toLowerCase()!=='range'))],
            ];
            for(const [name,headers] of variants){
              try{
                const r=await fetch(row.url,{redirect:'follow',headers});
                const text=await r.text();
                console.log('COFLIX_SIGNED_CONTEXT '+JSON.stringify({variant:name,status:r.status,ok:r.ok,contentType:r.headers.get('content-type')||'',extm3u:/^\uFEFF?#EXTM3U/m.test(text),final:safeUrl(r.url)}));
              }catch(e){console.log('COFLIX_SIGNED_CONTEXT '+JSON.stringify({variant:name,error:e&&e.name||'Error'}));}
            }
          }
          JS
