name: "SEC - Retire Legacy CodeQL Categories"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql-retire-legacy-categories.yml'
      - 'scripts/codeql_category_retirement_stub.js'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: niakvio-codeql-retire-legacy
  cancel-in-progress: true

jobs:
  retire:
    name: "Retire ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: source
            category: '/language:javascript-typescript/scope:source'
          - label: providers-0-f
            category: '/language:javascript-typescript/scope:providers-0-f'
          - label: providers-g-l
            category: '/language:javascript-typescript/scope:providers-g-l'
          - label: providers-m-r
            category: '/language:javascript-typescript/scope:providers-m-r'
          - label: providers-s-z
            category: '/language:javascript-typescript/scope:providers-s-z'
          - label: provider-bases-0-f
            category: '/language:javascript-typescript/scope:provider-bases-0-f'
          - label: provider-bases-g-l
            category: '/language:javascript-typescript/scope:provider-bases-g-l'
          - label: provider-bases-m-r
            category: '/language:javascript-typescript/scope:provider-bases-m-r'
          - label: provider-bases-s-z
            category: '/language:javascript-typescript/scope:provider-bases-s-z'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize clean retirement database
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - scripts/codeql_category_retirement_stub.js
      - name: Upload empty replacement for legacy category
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: ${{ matrix.category }}

  result:
    name: "Legacy CodeQL categories retired"
    if: always()
    needs: [retire]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every legacy category retirement
        env:
          MATRIX_RESULT: ${{ needs.retire.result }}
        run: test "$MATRIX_RESULT" = "success"
