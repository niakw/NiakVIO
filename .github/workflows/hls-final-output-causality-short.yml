name: DIAG - HLS Final Output Causality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hls-final-output-causality-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-hls-final-output-causality
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Compare current, HLS-disabled and HLS-instrumented bundles
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          root=pathlib.Path('.').resolve(); sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as parity
          from provider_patch_blocks import strip_managed_fix, has_managed_fix

          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          rows={str(r.get('id','')).strip().casefold().replace('_','-'):r for r in manifest.get('scrapers',[]) if isinstance(r,dict)}
          fixtures={
            'playimdb': {'tmdbId':'71446','mediaType':'tv','title':'Money Heist','year':2017,'season':1,'episode':1},
            'streamzo': {'tmdbId':'60059','mediaType':'tv','title':'Better Call Saul','year':2015,'season':1,'episode':1},
          }

          def run(label,path,fixture):
            ctx=parity.context_for(fixture)
            p=subprocess.run(['node',str(root/'scripts/provider_worker.cjs'),str(path),json.dumps(fixture,separators=(',',':')),json.dumps(ctx,separators=(',',':'))],cwd=root,text=True,capture_output=True,timeout=35,check=False)
            result=None
            for line in p.stdout.splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                try: result=json.loads(line.split('=',1)[1])
                except Exception: pass
              if 'NIAKVIO_HLS_PROOF' in line or '[Nuvio HLS integrity]' in line:
                print('HLS_LOG',label,line[:700])
            for line in p.stderr.splitlines():
              if 'NIAKVIO_HLS_PROOF' in line or '[Nuvio HLS integrity]' in line:
                print('HLS_LOG',label,line[:700])
            if not isinstance(result,dict):
              print('RESULT',label,'NO_RESULT','exit='+str(p.returncode)); return
            err=result.get('error_details') if isinstance(result.get('error_details'),dict) else {}
            print('RESULT',label,'streams='+str(result.get('stream_count',0)),'raw='+str(result.get('raw_stream_count',0)),'error='+str(err.get('code') or err.get('name') or 'none'))
            for obs in result.get('network_observations') or []:
              if not isinstance(obs,dict) or obs.get('infrastructure'): continue
              if obs.get('stage')=='content_lookup':
                print('MEDIA_ROUTE',label,str(obs.get('host')),str(obs.get('path_pattern')),str(obs.get('status')),str(obs.get('ok')),str(obs.get('error_code') or ''))

          with tempfile.TemporaryDirectory(prefix='niakvio-hls-causality-') as td:
            td=pathlib.Path(td)
            for pid,fixture in fixtures.items():
              row=rows[pid]; src=root/row['filename']; text=src.read_text(encoding='utf-8')
              print('===',pid,'managed_hls='+str(has_managed_fix(text,'CORE.HLS_RUNTIME_INTEGRITY.V1')),'===')
              no_hls=strip_managed_fix(text,'CORE.HLS_RUNTIME_INTEGRITY.V1')
              p_no=td/(pid+'-no-hls.js'); p_no.write_text(no_hls,encoding='utf-8')

              # Instrument only the temporary copy. Keep semantics byte-identical apart from diagnostic output.
              instrumented=text
              needle='if(proof.state==="invalid"||(proof.state==="unknown"&&config.failClosedUnknown)){'
              replacement='if(proof.state==="invalid"||(proof.state==="unknown"&&config.failClosedUnknown)){try{console.log("NIAKVIO_HLS_PROOF",proof.state,proof.reason||"",proof.kind||"",proof.durationSeconds||"")}catch(_diag){}'
              if needle not in instrumented:
                raise SystemExit(pid+': native HLS rejection anchor missing')
              instrumented=instrumented.replace(needle,replacement,1)
              p_inst=td/(pid+'-instrumented.js'); p_inst.write_text(instrumented,encoding='utf-8')

              run(pid+':current',src,fixture)
              run(pid+':no-hls',p_no,fixture)
              run(pid+':instrumented',p_inst,fixture)
          PY
