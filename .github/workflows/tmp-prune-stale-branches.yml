name: Prune stale ARCHI2 branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-prune-stale-branches.yml'

permissions:
  contents: write

concurrency:
  group: prune-stale-archi2-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with push credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Delete explicitly classified stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'chore/archi2-clean-final'
            'chore/final-repository-cleanup'
            'chore/post-5.20.56-cleanup'
            'ci/native-playback-proof'
            'dependabot/github_actions/actions/checkout-7.0.1'
            'dependabot/github_actions/actions/setup-node-7.0.0'
            'dependabot/github_actions/actions/setup-python-7.0.0'
            'dependabot/npm_and_yarn/axios-1.19.0'
            'dependabot/npm_and_yarn/cheerio-1.2.0'
            'docs/final-architecture-reference'
            'docs/readme-upstream-links'
            'fix/audit-desktop-runtime-20260816'
            'fix/audit-desktop-runtime-main-20260816'
            'fix/client-reactivation-proof-20260816'
            'fix/global-final-media-order'
            'fix/healthy-sibling-first-coverage'
            'fix/main-native-proof-and-isolation'
            'fix/quarantine-aware-client-lab'
            'fix/quick-refresh-lkg-preservation'
            'fix/quick-refresh-manifest-idempotency'
            'fix/quick-refresh-preserve-deep-activation'
            'fix/refresh-finalization-idempotence'
            'fix/repair-before-deep-refresh'
            'fix/restore-override-core'
            'fix/scoped-playback-context-regression'
            'fix/split-native-final'
            'fix/split-native-mobile-tv-proof'
            'fix/strict-content-promotion-gate'
            'fix/tv-playback-context-clean'
            'fix/tv-playback-context-runtime'
            'integrate/engine-v4-native-budgets'
            'proof/engine-v4-split-native'
            'refactor/archi2-main-cutover'
            'refactor/provider-engine-v2'
            'release/5.20.53'
            'tmp/test-pr-base'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Verify only protected working branches remain
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t heads < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          printf 'Remaining branches:\n%s\n' "${heads[*]}"
          allowed=(
            'main'
            'agent/engine-rebuild-v7'
            'brain-learning/proposals'
            'lab/desktop-mobile-real'
            'lab/tv-real'
          )
          for branch in "${heads[@]}"; do
            keep=false
            for candidate in "${allowed[@]}"; do
              if [[ "$branch" == "$candidate" ]]; then keep=true; break; fi
            done
            if [[ "$keep" != true ]]; then
              echo "Unexpected branch remains: $branch" >&2
              exit 1
            fi
          done

      - name: Remove this completed one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-prune-stale-branches.yml
          git commit -m 'chore: remove completed branch cleanup workflow [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
