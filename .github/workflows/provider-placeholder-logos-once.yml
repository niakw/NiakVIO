name: Provider placeholder logos once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-placeholder-logos-once.yml'
      - 'scripts/generate_missing_provider_placeholder_logos_once.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-placeholder-logos-once
  cancel-in-progress: false

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install one-shot image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Generate only still-missing provider logos
        run: python scripts/generate_missing_provider_placeholder_logos_once.py
      - name: Verify exact WebP dimensions and index completeness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('.')
          index=json.loads((root/'assets/providers/index.json').read_text())
          if index.get('missingCount') != 0 or index.get('missing'):
              raise SystemExit('placeholder generation left missing providers')
          for provider,row in (index.get('providers') or {}).items():
              assets=row.get('assets') or {}
              for label, expected in {'72x32':(72,32),'96x40':(96,40)}.items():
                  path=root/assets[label]
                  with Image.open(path) as im:
                      if im.format != 'WEBP' or im.size != expected:
                          raise SystemExit(f'bad provider logo {provider} {label}: {im.format} {im.size}')
          print(f"provider logo QA complete: {len(index.get('providers') or {})}")
          PY
      - name: Refresh README active-provider inventory
        run: python scripts/update_provider_device_results.py
      - name: Remove one-shot generator from final repository
        run: |
          rm scripts/generate_missing_provider_placeholder_logos_once.py
          rm .github/workflows/provider-placeholder-logos-once.yml
      - name: Commit generated assets and refreshed provider inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No placeholder assets required.'
            exit 0
          fi
          git commit -m 'assets: finalize provider logo coverage'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
