name: Final pinned action refresh once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/triggers/pinned-actions-refresh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-pinned-action-refresh-once
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated action refresh branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/pinned-actions-refresh
          fetch-depth: 0

      - name: Normalize pinned action version annotations
        shell: bash
        run: |
          set -euo pipefail
          git grep -l -z '# v6\.0\.2' -- .github/workflows | xargs -0 -r perl -pi -e 's/# v6\.0\.2/# v7.0.1/g'
          git grep -l -z '# v6\.4\.0' -- .github/workflows | xargs -0 -r perl -pi -e 's/# v6\.4\.0/# v7.0.0/g'
          git grep -l -z '# v6\.2\.0' -- .github/workflows | xargs -0 -r perl -pi -e 's/# v6\.2\.0/# v7.0.0/g'

      - name: Verify annotations
        shell: bash
        run: |
          set -euo pipefail
          if git grep -E '# v6\.0\.2|# v6\.4\.0|# v6\.2\.0' -- .github/workflows; then
            echo 'stale action version annotation remains' >&2
            exit 1
          fi

      - name: Build and attempt annotation cleanup push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "niakvio-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize pinned action version annotations"
          echo "FIELD_PINNED_ACTION_REFRESH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:chore/pinned-actions-refresh
