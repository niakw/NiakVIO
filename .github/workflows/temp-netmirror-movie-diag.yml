name: TEMP NetMirror movie diagnostic

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-netmirror-movie-diag.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - name: Checkout .44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 1

      - name: Compare NetMirror movie endpoints without exposing signed media URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          endpoints = {
              'legacy': 'https://net27.cc/api/embed-tmdb/19995',
              'typed': 'https://net27.cc/api/embed-tmdb/19995?type=movie',
          }
          headers = {
              'accept': 'application/json, text/plain, */*',
              'accept-language': 'fr-FR,fr,en-US,en',
              'referer': 'https://net27.cc/',
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/147 Safari/537.36',
          }
          for label, url in endpoints.items():
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=12) as res:
                      body = res.read(1024 * 1024)
                      status = res.status
                      ctype = res.headers.get('content-type','')
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  ctype = exc.headers.get('content-type','') if exc.headers else ''
                  body = exc.read(1024 * 1024)
              except Exception as exc:
                  print('FIELD_NETMIRROR_ENDPOINT ' + json.dumps({'variant':label,'state':'network_error','errorType':type(exc).__name__}, separators=(',',':')))
                  continue
              summary = {'variant':label,'status':status,'contentType':ctype.split(';')[0],'bytes':len(body),'json':False,'streamLikeFields':0}
              try:
                  data = json.loads(body.decode('utf-8','replace'))
                  summary['json'] = True
                  def walk(value):
                      count=0
                      if isinstance(value,dict):
                          for k,v in value.items():
                              if str(k).lower() in {'url','file','src','stream','link','sources'}: count += 1
                              count += walk(v)
                      elif isinstance(value,list):
                          for v in value: count += walk(v)
                      return count
                  summary['streamLikeFields'] = walk(data)
                  if isinstance(data,dict): summary['topKeys'] = sorted(map(str,data.keys()))[:20]
              except Exception:
                  pass
              print('FIELD_NETMIRROR_ENDPOINT ' + json.dumps(summary, separators=(',',':'), sort_keys=True))
          PY

      - name: Probe current Niak NetMirror bundle on Avatar movie
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manual_tv_live_case_probe.py \
            --case netmirror-avatar-movie \
            --provider netmirror \
            --tmdb 19995 \
            --media-type movie \
            --title Avatar \
            --year 2009 \
            --duration 162 \
            --aliases '["Avatar"]' \
            --output /tmp/netmirror-avatar.json || true
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/netmirror-avatar.json')
          if not p.is_file():
              print('FIELD_NETMIRROR_NIAK {"state":"no-result-file"}')
          else:
              d=json.loads(p.read_text())
              keep={k:d.get(k) for k in ('probeState','raw','playable','verified','contradictions','debugStage','returned403Rows','qualities','languages','transportTypesObserved')}
              print('FIELD_NETMIRROR_NIAK '+json.dumps(keep,separators=(',',':'),sort_keys=True))
          PY
