name: TEMP - Final MoviesHunt Anikoto Repair

on:
  push:
    branches:
      - fix/active44-durability-20260915

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'repair: sync MoviesHunt live contract and provider data'
    runs-on: ubuntu-24.04
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_WORKERS: '16'
      NIAKVIO_QUICK_YIELD_TIMEOUT: '25'
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Project observed MoviesHunt contract into structured DATA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          overrides = load('provider-overrides.json')
          static = load('automation/provider-v3-static-knowledge.json')
          patch = overrides['provider_patches']['movieshunt']
          model = static['providers']['movieshunt']['model']

          base = 'https://movieshunt.monster'
          hub = 'https://movieshunt.run'
          route = '/lookup.php?q={query}&page=1&per_page=30'
          plan = {
              'base': base,
              'route': route,
              'requestSpec': {
                  'method': 'GET',
                  'headers': {
                      'Accept': 'application/json,text/plain,*/*',
                      'Referer': 'https://movieshunt.monster/search.html'
                  }
              },
              'proofModelVersion': 5,
              'sourceRole': 'catalog-search',
              'semanticTypes': ['movie']
          }

          patch['official_site'] = base
          patch['official_hub'] = hub
          patch['identity_input'] = {
              'mode': 'catalog_search',
              'requires_tmdb_before_run': True,
              'required_fields': ['title', 'year', 'mediaType']
          }
          patch['route_proof_version'] = max(5, int(patch.get('route_proof_version') or 0))
          patch['proof_protected_hosts'] = sorted(set([
              *[str(x).strip().casefold() for x in patch.get('proof_protected_hosts') or [] if str(x).strip()],
              'movieshunt.monster'
          ]))
          patch['search_request_plan'] = [plan]
          routes = [str(x).strip() for x in patch.get('learned_routes') or [] if str(x).strip()]
          routes = [x for x in routes if x != route]
          patch['learned_routes'] = [route, *routes]
          patch['route_data_state'] = 'on'
          notes = [str(x) for x in patch.get('notes') or []]
          note = ('2026-09-15 live drift repair: movieshunt.run redirects to movieshunt.monster; '
                  'catalog search is JSON GET /lookup.php?q={query}&page=1&per_page=30, whose permalink '
                  'resolves the detail page before downstream player crawling.')
          if note not in notes:
              notes.append(note)
          patch['notes'] = notes

          model['knownSite'] = base
          model['officialSite'] = base
          model['officialHub'] = hub
          model['routeProofVersion'] = max(5, int(model.get('routeProofVersion') or 0))
          model['proofProtectedHosts'] = sorted(set([
              *[str(x).strip().casefold() for x in model.get('proofProtectedHosts') or [] if str(x).strip()],
              'movieshunt.monster'
          ]))
          model['searchRequestPlan'] = [plan]
          origins = [str(x).strip() for x in model.get('origins') or [] if str(x).strip()]
          origins = [x for x in origins if 'movieshunt.' not in x.casefold()]
          model['origins'] = [base, *origins]
          routes_model = [str(x).strip() for x in model.get('routes') or [] if str(x).strip()]
          routes_model = [x for x in routes_model if x != route]
          model['routes'] = [route, *routes_model]

          write('provider-overrides.json', overrides)
          write('automation/provider-v3-static-knowledge.json', static)
          print('MOVIESHUNT_STRUCTURED_DATA_UPDATED base=' + base + ' route=' + route)
          PY

      - name: Rematerialize MoviesHunt and sync Anikoto current DATA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import materialize_provider_v3_one as one

          reports = {}
          for pid in ('movieshunt', 'anikototv'):
              reports[pid] = one.materialize_one(pid)

          report_path = Path('provider-v3-materialization.json')
          material = json.loads(report_path.read_text(encoding='utf-8'))
          rows = material.get('providers') or []
          by_id = {str(row.get('provider') or '').casefold(): row for row in rows if isinstance(row, dict)}
          for pid, fresh in reports.items():
              if pid not in by_id:
                  raise SystemExit(f'materialization report missing provider {pid}')
              by_id[pid].update(fresh)
          report_path.write_text(json.dumps(material, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          root_rows = {str(row.get('id') or '').casefold(): row for row in manifest.get('scrapers') or [] if isinstance(row, dict)}
          wanted = {pid: str(root_rows[pid]['filename']) for pid in reports}
          projections = [
              Path('manifest-hub46.json'),
              Path('vf/manifest.json'),
              Path('no-anime/manifest.json'),
              Path('vf-no-anime/manifest.json'),
              Path('native-hub46/manifest.json'),
          ]
          for path in projections:
              if not path.is_file():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              changed = False
              for row in data.get('scrapers') or []:
                  if not isinstance(row, dict):
                      continue
                  pid = str(row.get('id') or '').casefold()
                  if pid not in wanted:
                      continue
                  old = str(row.get('filename') or '')
                  prefix = old.rsplit('/', 1)[0] + '/' if '/' in old else ''
                  new = prefix + Path(wanted[pid]).name
                  if old != new:
                      row['filename'] = new
                      changed = True
              if changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  print(f'PROJECTION_SYNC {path}')
          PY

      - name: Validate exact structured DATA and live non-regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_provider_v3_static.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/native_declared_provider_matrix_test.py
          python tests/provider_521_capability_regression_test.py
          python scripts/audit_provider_quick_yield.py | tee /tmp/provider-quick-yield.log
          grep '^FIELD_PROVIDER_QUICK_YIELD' /tmp/provider-quick-yield.log
          python scripts/check_provider_non_regression_v1.py --candidate-gate --base-ref f814d325c68a9a4eebd895498aafb245ce27ac2b
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('provider-v3-quick-yield.json').read_text(encoding='utf-8'))
          rows = q.get('providers') or q.get('results') or []
          mh = [r for r in rows if isinstance(r, dict) and str(r.get('provider') or r.get('providerId') or '').casefold() == 'movieshunt']
          print('MOVIESHUNT_QUICK_YIELD_ROWS', json.dumps(mh, ensure_ascii=False)[:12000])
          gate = json.loads(Path('automation/provider-non-regression-gate.json').read_text(encoding='utf-8'))
          failures = [str(x.get('provider') or '').casefold() for x in gate.get('failures') or [] if isinstance(x, dict)]
          if 'movieshunt' in failures:
              raise SystemExit('movieshunt still fails candidate non-regression gate')
          PY

      - name: Commit repaired DATA and generated provider bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json automation/provider-v3-static-knowledge.json provider-v3-materialization.json manifest.json providers/
          for p in manifest-hub46.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json native-hub46/manifest.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo 'No durable changes to commit'
            exit 0
          fi
          git commit -m 'repair: sync MoviesHunt live contract and provider data'
          git push origin HEAD:fix/active44-durability-20260915
