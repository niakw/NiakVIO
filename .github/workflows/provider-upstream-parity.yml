name: Provider upstream parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/provider-upstream-parity.yml'
      - 'scripts/run_provider_upstream_parity.py'
      - 'scripts/provider_worker.cjs'
      - 'scripts/network_guard.cjs'

permissions:
  contents: read

concurrency:
  group: provider-upstream-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Security policy preflight
        run: python3 tests/workflow_security_policy_test.py
      - name: Validate hardened parity harness
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_provider_upstream_parity.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback
      - name: Compare current NiakVIO with all three upstreams
        env:
          NIAKVIO_PARITY_WORKERS: '8'
          NIAKVIO_PARITY_TIMEOUT: '25'
        run: |
          set -euo pipefail
          python scripts/run_provider_upstream_parity.py
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-upstream-parity-${{ github.run_id }}
          path: automation/provider-upstream-parity.json
          if-no-files-found: warn
          retention-days: 14
