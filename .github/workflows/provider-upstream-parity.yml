name: Provider upstream parity

on:
  workflow_dispatch:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - '.github/workflows/provider-upstream-parity.yml'
      - 'scripts/run_provider_upstream_parity.py'
      - 'scripts/provider_worker.cjs'
      - 'scripts/network_guard.cjs'

permissions:
  contents: write

concurrency:
  group: provider-upstream-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Validate hardened parity harness
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_provider_upstream_parity.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback
      - name: Compare current NiakVIO with all three upstreams
        env:
          NIAKVIO_PARITY_WORKERS: '8'
          NIAKVIO_PARITY_TIMEOUT: '25'
        run: |
          set -euo pipefail
          python scripts/run_provider_upstream_parity.py
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-upstream-parity-${{ github.run_id }}
          path: automation/provider-upstream-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit sanitized parity report
        if: success() && github.ref_name != 'main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add automation/provider-upstream-parity.json
          if git diff --cached --quiet; then
            echo 'parity report unchanged'
            exit 0
          fi
          git commit -m 'test(provider-v3): record upstream parity evidence'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
