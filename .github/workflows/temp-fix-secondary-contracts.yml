name: TEMP - Fix secondary contracts

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-secondary-contracts.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Repair semantic source, tests and renderer
        run: |
          python - <<'PY'
          import json, copy
          from pathlib import Path

          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing token in {path}: {old!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          # Derive canonical semantic types from the existing catalogue, except
          # the two rows whose repair disposition explicitly removed movie.
          old_catalog=json.loads(Path('provider_catalog.json').read_text())
          semantics={}
          for row in old_catalog.get('providers') or []:
              pid=str(row.get('canonicalId') or '').casefold()
              semantics[pid]=[str(x).strip().casefold() for x in ((row.get('scraper') or {}).get('supportedTypes') or []) if str(x).strip()]
          for pid in ('anime-sama','mugiwarastream'):
              semantics[pid]=['anime']

          def transport(canonical):
              out=list(canonical)
              if 'anime' in canonical and 'tv' not in out: out.append('tv')
              if 'tv' in out and 'series' not in out: out.append('series')
              return out

          root_path=Path('manifest.json'); root=json.loads(root_path.read_text())
          assert len(root.get('scrapers') or [])==46
          for row in root.get('scrapers') or []:
              pid=str(row.get('id') or '').casefold(); canonical=semantics.get(pid)
              if not canonical: raise SystemExit(f'missing canonical semantics for {pid}')
              wanted=transport(canonical); row['supportedTypes']=wanted
              if wanted!=canonical: row['canonicalSupportedTypes']=canonical
              else: row.pop('canonicalSupportedTypes',None)
          root_path.write_text(json.dumps(root,ensure_ascii=False,indent=2)+'\n')

          # VF membership stays authoritative, but every provider row mirrors the
          # current repaired root metadata/bundle filename before catalogue bootstrap.
          vf_path=Path('vf/manifest.json'); vf=json.loads(vf_path.read_text())
          root_by={str(r.get('id') or '').casefold():r for r in root.get('scrapers') or []}
          vf_rows=[]
          for old in vf.get('scrapers') or []:
              pid=str(old.get('id') or '').casefold()
              if pid not in root_by: continue
              row=copy.deepcopy(root_by[pid]); fn=str(row.get('filename') or '')
              if fn and not fn.startswith('../'): row['filename']='../'+fn
              vf_rows.append(row)
          vf['scrapers']=vf_rows
          vf_path.write_text(json.dumps(vf,ensure_ascii=False,indent=2)+'\n')

          patch('tests/global_stream_metadata_preservation_contract_test.py', [
            ('rows = [row for row in materialization.get("providers") or [] if isinstance(row, dict)]\nassert materialization.get("providerCount") == 96, materialization.get("providerCount")\nassert len(rows) == 96, len(rows)',
             'rows = [row for row in materialization.get("providers") or [] if isinstance(row, dict)]\nhub = json.loads((ROOT / "automation/evidence/hub-lab-matrix-46.json").read_text(encoding="utf-8"))\nexpected_provider_count = int(hub.get("hubCount") or 0)\nassert expected_provider_count == 46, expected_provider_count\nassert materialization.get("providerCount") == expected_provider_count, materialization.get("providerCount")\nassert len(rows) == expected_provider_count, len(rows)'),
            ('shared 96-provider Core','shared Hub46 Core'),
          ])
          patch('tests/provider_anime_semantic_transport_contract_test.py', [
            ('assert len(semantics) == 96, len(semantics)',
             'hub = json.loads((ROOT / "automation/evidence/hub-lab-matrix-46.json").read_text(encoding="utf-8"))\nexpected_provider_count = int(hub.get("hubCount") or 0)\nassert expected_provider_count == 46, expected_provider_count\nassert len(semantics) == expected_provider_count, len(semantics)'),
            ('assert projected >= 96','assert projected >= expected_provider_count'),
          ])
          patch('tests/published_provider_lego_contract_test.py', [
            ('tmdb-data-contract-launch-gate-v31-pre-network-semantic-gate','tmdb-data-contract-launch-gate-v33-25s-isolated-failfast'),
            ('media-type runtime is not v31','media-type runtime is not v33'),
            ('media_type=v31','media_type=v33'),
          ])
          patch('tests/runtime_media_safety_guard_test.py', [
            ('hls_master_audio_preserver_v1.py','hls_runtime_integrity_v1.py'),
            ('hls_master_audio_preserver','hls_runtime_integrity'),
            ('field-safety-v7-stream-scoped-p2p-vod-duration','field-safety-v9-correlated-player-fallback'),
          ])

          p=Path('scripts/normalize_stream_presentation_v12.py'); s=p.read_text(encoding='utf-8')
          old='all-providers-client-projection-name-mirror-v20'; new='all-providers-client-projection-strongest-evidence-v22'
          if old not in s: raise SystemExit('missing V20 revision in normalizer')
          s=s.replace(old,new)
          title_old='\'out.title=provider+(f.quality?" - "+qualityLabel(f.quality):"")\','
          title_new='\'out.title=provider\',\n        \'qualityLabel(f.quality)\',\n        \'detailedLanguage(\','
          if title_old not in s: raise SystemExit('missing old V20 title token')
          p.write_text(s.replace(title_old,title_new).replace('V20','V22'),encoding='utf-8')

          p=Path('tests/global_stream_presentation_test.py'); s=p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('missing V20 revision in presentation test')
          s=s.replace(old,new).replace('V20','V22')
          s=s.replace('assert row["title"] == "Purstream - 4K", row','assert row["title"] == "Purstream - 4K - MULTI (VF/VO)", row')
          s=s.replace('assert vf["title"] == "Movix - 1080p"','assert vf["title"] == "Movix - 1080p - VF"')
          s=s.replace('assert desktop_native["row"]["title"] == "Cineby - 1080p", desktop_native','assert desktop_native["row"]["title"] == "Cineby - 1080p - VO", desktop_native')
          p.write_text(s,encoding='utf-8')
          patch('tests/global_stream_presentation_pipeline_test.py', [
            ('assert native["row"]["title"].endswith(" - 1080p"), native',
             'assert " - 1080p" in native["row"]["title"], native\n    assert native["row"]["title"].endswith(" - VO"), native'),
          ])

          # Renderer transport aliases: anime and TV semantic lanes must expose
          # both Nuvio episodic aliases TV + series, never an artificial movie.
          patch('engine_v2/src/provider-catalog.mjs', [(
'''  if (semantic.includes("anime")) {
    const aliases = [];
    // Nuvio may transport episodic anime as TV/series. Movie is never a
    // generic anime alias: only canonical movie capability may select it.
    if (!semantic.includes("tv")) aliases.push("tv");
    if (aliases.length) {
      copy.canonicalSupportedTypes = [...semantic];
      copy.supportedTypes = [...semantic, ...aliases];
    } else {
      delete copy.canonicalSupportedTypes;
    }
  } else {
    delete copy.canonicalSupportedTypes;
  }''',
'''  const aliases = [];
  // Nuvio transports episodic semantic lanes as TV/series. Movie is never a
  // generic anime alias: only canonical movie capability may select it.
  if (semantic.includes("anime") && !semantic.includes("tv")) aliases.push("tv");
  const projectedTransport = [...semantic, ...aliases];
  if (projectedTransport.includes("tv") && !projectedTransport.includes("series")) aliases.push("series");
  if (aliases.length) {
    copy.canonicalSupportedTypes = [...semantic];
    copy.supportedTypes = [...semantic, ...aliases];
  } else {
    delete copy.canonicalSupportedTypes;
  }''')])
          PY

          # Rebuild source-of-truth catalogue from the CURRENT repaired manifest
          # so bundle hashes/versions cannot regress, then render all projections.
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          cp manifest.json /tmp/general.once.json
          cp vf/manifest.json /tmp/vf.once.json
          cp no-anime/manifest.json /tmp/noanime.once.json
          cp vf-no-anime/manifest.json /tmp/vfnoanime.once.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          cmp -s manifest.json /tmp/general.once.json
          cmp -s vf/manifest.json /tmp/vf.once.json
          cmp -s no-anime/manifest.json /tmp/noanime.once.json
          cmp -s vf-no-anime/manifest.json /tmp/vfnoanime.once.json
          echo MANIFEST_RENDER_IDEMPOTENT=yes
          git diff --check

      - name: Run six repaired contracts and expose every failure
        run: |
          python - <<'PY'
          import subprocess,sys
          tests=['tests/global_stream_metadata_preservation_contract_test.py','tests/provider_anime_semantic_transport_contract_test.py','tests/published_provider_lego_contract_test.py','tests/runtime_media_safety_guard_test.py','tests/global_stream_presentation_pipeline_test.py','tests/global_stream_presentation_test.py']
          failed=[]
          for t in tests:
              cp=subprocess.run([sys.executable,t],text=True,capture_output=True,timeout=180)
              print(f'REPAIRED_CONTRACT {t} rc={cp.returncode}')
              print('\n'.join((cp.stdout+'\n'+cp.stderr).splitlines()[-35:]))
              if cp.returncode: failed.append(t)
          print('REPAIRED_CONTRACT_SUMMARY',len(tests),'failed',len(failed),failed)
          if failed: raise SystemExit(1)
          PY

      - name: Run full critical secondary selection fail closed
        run: |
          python - <<'PY'
          import subprocess, pathlib, re, sys
          patterns=[r'published_provider_lego_contract',r'anime_semantic_transport',r'runtime_media_safety',r'stream.*sanitizer',r'stream.*presentation',r'metadata.*preservation',r'identity.*(?:ownership|regression|contract)',r'playback.*policy',r'native.*(?:compat|loading|hls)',r'abort|cancel|generation|stale',r'timeout|fail.*fast|provider.*isolation']
          tests=[p for p in sorted(pathlib.Path('tests').glob('*.py')) if any(re.search(x,p.name.lower()) for x in patterns)]
          failed=[]
          for p in tests:
              cp=subprocess.run([sys.executable,str(p)],text=True,capture_output=True,timeout=180)
              print(f'CONTRACT_RESULT {p.name} rc={cp.returncode}')
              if cp.returncode:
                  print('\n'.join((cp.stdout+'\n'+cp.stderr).splitlines()[-30:]))
                  failed.append(p.name)
          print('CRITICAL_TEST_SUMMARY',len(tests),'failed',len(failed),failed)
          if failed: raise SystemExit(1)
          PY

      - name: Static Hub46 and projection checks
        run: |
          python scripts/audit_provider_v3_static.py
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path('provider_catalog.json').read_text()); active={str(x.get('canonicalId') or '').casefold() for x in cat.get('providers') or []}
          assert len(active)==46
          for rel in ('manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              m=json.loads(Path(rel).read_text()); ids=[str(x.get('id') or '').casefold() for x in m.get('scrapers') or []]
              assert set(ids)<=active,(rel,sorted(set(ids)-active))
          assert not ({'dulourd','movix','nakios','toflix','frenchstream'} & {str(x.get('id') or '').casefold() for x in json.loads(Path('vf-no-anime/manifest.json').read_text()).get('scrapers') or []})
          print('HUB46_PROJECTIONS_OK',len(active))
          PY

      - name: Commit only after zero-red validation
        run: |
          git config user.name niakvio-bot
          git config user.email niakvio-bot@users.noreply.github.com
          git add provider_catalog.json manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            engine_v2/src/provider-catalog.mjs scripts/normalize_stream_presentation_v12.py \
            tests/global_stream_metadata_preservation_contract_test.py tests/provider_anime_semantic_transport_contract_test.py \
            tests/published_provider_lego_contract_test.py tests/runtime_media_safety_guard_test.py \
            tests/global_stream_presentation_pipeline_test.py tests/global_stream_presentation_test.py
          git commit -m '[secondary-contracts] sync Hub46 catalogue projections V33 V22'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
