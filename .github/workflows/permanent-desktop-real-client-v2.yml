name: Permanent Desktop real-client lab v4

on:
  workflow_dispatch:
  push:
    branches: ["lab/desktop-mobile-real"]
    paths:
      - ".github/triggers/permanent-desktop-real-client-v2"

permissions:
  contents: read

concurrency:
  group: permanent-desktop-real-client-v4
  cancel-in-progress: false

env:
  NUVIO_DESKTOP_SHA: "8977fda639f5791947e6d8b36025635a77aed5da"

jobs:
  desktop-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout permanent Desktop and Mobile Android lab
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: lab/desktop-mobile-real
          path: niakvio

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked provider validator dependencies
        working-directory: niakvio
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact engine-v4 lab candidate from published manifest
        working-directory: niakvio
        shell: bash
        run: |
          set -euxo pipefail
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 scripts/apply_runtime_capability_upgrade_v4.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 scripts/validate_published_overrides.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id') or '').casefold(): row for row in manifest.get('scrapers', []) if isinstance(row, dict)}
          streamzo = rows['streamzo']
          assert streamzo.get('enabled') is True
          payload = Path(streamzo['filename']).read_text(encoding='utf-8')
          assert payload.count('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1:') == 1
          assert '"implementationRevision":"field-safety-v4-runtime-capability"' in payload
          assert '"implementationRevision":"field-safety-v2"' not in payload
          for provider_id in ('moviebox', 'netmirror'):
              assert rows[provider_id].get('enabled') is False
          print(f"FIELD_DESKTOP_CANDIDATE streamzo={streamzo['filename']} version={streamzo.get('version')}")
          PY

      - name: Install official Linux player dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Checkout exact official NuvioDesktop runtime
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          cd nuvio-desktop
          git checkout "$NUVIO_DESKTOP_SHA"
          touch local.properties

      - name: Prepare manifest-selected Desktop provider test
        shell: bash
        run: |
          python3 niakvio/lab/real-client/desktop/prepare_nuvio_desktop.py nuvio-desktop niakvio

      - name: Execute official NuvioDesktop provider runtime
        working-directory: nuvio-desktop
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/desktop-real-client-results.log"
          set +e
          ./gradlew :composeApp:desktopTest \
            --tests 'com.nuvio.app.features.plugins.NiakvioRealProviderDesktopTest' \
            --no-daemon --console=plain
          STATUS=$?
          set -e
          echo "===== EXACT DESKTOP PROVIDER RESULTS ====="
          if [ -f "$GITHUB_WORKSPACE/desktop-real-client-results.log" ]; then
            cat "$GITHUB_WORKSPACE/desktop-real-client-results.log"
          else
            echo "desktop provider result log was not created"
          fi
          exit "$STATUS"
