name: SHORT - Kehflix Current Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kehflix-current-live-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-kehflix-current-live
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Require exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Probe Kehflix terminals and current provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          echo '=== DOMAIN PATH RETENTION ==='
          for base in https://kehflix.wiki https://kehflix.com https://kehflix.lol; do
            code="$(curl -A 'Mozilla/5.0' -L -sS -o /tmp/kehflix-body -w '%{http_code}' --max-time 12 "$base/title/movie/157336-interstellar" || true)"
            final="$(curl -A 'Mozilla/5.0' -L -sS -o /dev/null -w '%{url_effective}' --max-time 12 "$base/title/movie/157336-interstellar" || true)"
            bytes="$(wc -c </tmp/kehflix-body 2>/dev/null || echo 0)"
            printf 'KEHFLIX_DOMAIN base=%s code=%s final=%s bytes=%s\n' "$base" "$code" "$final" "$bytes"
          done
          echo '=== CURRENT PROVIDER TERMINAL PROOF ==='
          python3 - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v3 as v3
          local=p.local_catalog()
          row=local.get('kehflix')
          if not row:
              raise SystemExit('kehflix missing from local catalog')
          fixtures=[
              ('movie', {'slug':'interstellar-2014','tmdbId':'157336','mediaType':'movie','category':'movie','title':'Interstellar','year':2014}),
              ('tv', {'slug':'house-of-the-dragon-s03e01','tmdbId':'94997','mediaType':'tv','category':'tv','title':'House of the Dragon','year':2022,'season':3,'episode':1,'expectedDurationMinutes':65}),
          ]
          print('KEHFLIX_LOCAL_PATH', row.get('path'))
          for lane,fx in fixtures:
              payload=v3.fixture_payload(fx,lane,upstream=False)
              r=v3._run_verified(row['path'],payload,25)
              out={k:r.get(k) for k in ('stream_count','candidate_stream_count','terminal_verified','terminal_reasons','terminal_media_duration_seconds','error','status')}
              print('KEHFLIX_CURRENT '+json.dumps({'lane':lane,'fixture':fx['slug'],'result':out},sort_keys=True))
          PY
