name: Purstream hub API diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purstream-hub-api-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Inspect hub status API
        shell: bash
        run: |
          python - <<'PY'
          import json, ssl, urllib.request
          req=urllib.request.Request('https://purstream.wiki/api/status',headers={'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept':'application/json,*/*;q=0.8','Referer':'https://purstream.wiki/'})
          with urllib.request.urlopen(req,timeout=15,context=ssl.create_default_context()) as r:
              body=r.read(500000).decode(r.headers.get_content_charset() or 'utf-8','replace')
              print('FIELD_PURSTREAM_HUB_API status=%s final=%s bytes=%s' % (r.status,r.geturl(),len(body)))
              try:
                  payload=json.loads(body)
                  print('FIELD_PURSTREAM_HUB_API_JSON '+json.dumps(payload,ensure_ascii=False,sort_keys=True))
              except Exception:
                  print('FIELD_PURSTREAM_HUB_API_BODY '+json.dumps(body[:10000],ensure_ascii=True))
          PY
      - name: Remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/purstream-hub-api-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/purstream-hub-api-once.yml
          git commit -m 'chore: remove Purstream hub API diagnostic'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
