name: Recover Nuvio regressions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-nuvio-regressions.yml"
      - ".github/triggers/recover-nuvio-regressions"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply permanent validation safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('scripts/provider_worker.cjs')
          text = worker.read_text(encoding='utf-8')
          marker = 'NUVIO_NON_MEDIA_ASSET_GUARD_V1'
          if marker not in text:
              guard = r'''
          // NUVIO_NON_MEDIA_ASSET_GUARD_V1
          // Social-network and store assets can be real MP4 files while still being
          // trailers, previews or decorative media unrelated to the requested title.
          // They are never valid provider playback results.
          function isNonMediaAssetHost(host) {
            const value = String(host || '').toLowerCase();
            const exact = new Set([
              'play-games.googleusercontent.com',
              'play-lh.googleusercontent.com',
              'video.twimg.com',
              'pbs.twimg.com',
            ]);
            return exact.has(value)
              || value.endsWith('.twimg.com')
              || value.endsWith('.googleusercontent.com') && /^(play-games|play-lh)\./.test(value);
          }

          '''
              text = text.replace('function sanitizeStream(stream) {', guard + 'function sanitizeStream(stream) {', 1)
              anchor = "  const url = typeof stream.url === 'string' ? stream.url.trim() : '';\n  if (!url) return { stream: null, disallowed: null };\n"
              replacement = anchor + "  let streamHost = '';\n  try { streamHost = new URL(url).hostname.toLowerCase(); } catch { return { stream: null, disallowed: 'invalid_stream_url' }; }\n  if (isNonMediaAssetHost(streamHost)) return { stream: null, disallowed: 'non_media_asset_host' };\n"
              if anchor not in text:
                  raise SystemExit('provider worker sanitizer anchor not found')
              text = text.replace(anchor, replacement, 1)
              worker.write_text(text, encoding='utf-8')

          runtime = Path('scripts/runtime_repair.py')
          text = runtime.read_text(encoding='utf-8')
          marker = 'required_category_playable_proof'
          if marker not in text:
              anchor = '\ndef compare_results(parent: dict[str, Any], repaired: dict[str, Any]) -> tuple[bool, str]:\n'
              helper = '''\ndef _fixture_categories(result: dict[str, Any], key: str) -> set[str]:\n    evidence = result.get("evidence") or {}\n    return {str(value).casefold() for value in evidence.get(key) or [] if str(value).strip()}\n\n\n'''
              if anchor not in text:
                  raise SystemExit('runtime repair compare anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
              insert = '''    required_categories = _fixture_categories(repaired, "required_fixture_categories")\n    healthy_categories = _fixture_categories(repaired, "healthy_fixture_categories")\n    if required_categories and not required_categories.issubset(healthy_categories):\n        missing = sorted(required_categories - healthy_categories)\n        return False, "required_category_playable_proof:" + ",".join(missing)\n\n'''
              target = '    if malformed_request_count(repaired) > malformed_request_count(parent):\n        return False, "introduced_malformed_request"\n\n'
              if target not in text:
                  raise SystemExit('runtime repair validation anchor not found')
              text = text.replace(target, target + insert, 1)
              runtime.write_text(text, encoding='utf-8')

          test = Path('tests/provider_repair_promotion_guard_test.py')
          test.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / "scripts"))\nfrom runtime_repair import compare_results\n\nparent = {"status": "no_streams", "score": 10, "evidence": {"streams_playable": 0}, "tests": []}\nfalse_positive = {\n    "status": "healthy",\n    "score": 72,\n    "evidence": {\n        "streams_playable": 1,\n        "required_fixture_categories": ["movie", "anime"],\n        "healthy_fixture_categories": ["movie"],\n    },\n    "tests": [{"streams_playable": 1}],\n}\naccepted, reason = compare_results(parent, false_positive)\nassert not accepted and reason == "required_category_playable_proof:anime", (accepted, reason)\nworker = (Path(__file__).resolve().parents[1] / "scripts/provider_worker.cjs").read_text(encoding="utf-8")\nassert "NUVIO_NON_MEDIA_ASSET_GUARD_V1" in worker\nassert "non_media_asset_host" in worker\nprint("provider repair promotion guard tests passed")\n''', encoding='utf-8')
          PY

      - name: Correct manifest cache and false-positive promotions
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def bump(value):
              m = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', str(value or ''))
              if not m:
                  return '1.0.1'
              a, b, c = map(int, m.groups())
              return f'{a}.{b}.{c + 1}'

          rollbacks = {
              'french-manga': 'french-manga--nuvio--b088114476c8e08f.js',
              'voiranime-rip': 'voiranime-rip--published-baseline--cbf14d7c8fe2e76e.js',
          }

          for manifest_path, prefix in ((Path('manifest.json'), 'providers/'), (Path('vf/manifest.json'), '../providers/')):
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              seen = set()
              for provider in data.get('scrapers', []):
                  pid = str(provider.get('id') or '').casefold()
                  if pid in {'goated', 'purstream', 'wookafr'}:
                      seen.add(pid)
                      changed = not bool(provider.get('enabled'))
                      provider['enabled'] = True
                      if pid == 'goated' and str(provider.get('version')) == '1.0.0':
                          provider['version'] = '1.0.1'
                      elif changed:
                          provider['version'] = bump(provider.get('version'))
                  if pid in rollbacks:
                      seen.add(pid)
                      target = prefix + rollbacks[pid]
                      changed = bool(provider.get('enabled')) or str(provider.get('filename') or '') != target
                      provider['enabled'] = False
                      provider['filename'] = target
                      if changed:
                          provider['version'] = bump(provider.get('version'))
              missing = {'goated', 'purstream', 'wookafr'} - seen
              if missing:
                  raise SystemExit(f'{manifest_path}: protected providers missing: {sorted(missing)}')
              manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for filename in rollbacks.values():
              if not (Path('providers') / filename).is_file():
                  raise SystemExit(f'missing rollback bundle: {filename}')
          PY

      - name: Recover and validate historical Cineby
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL="providers/cineby--nuvio--a423440cec70666c.js"
          git show 00d235578083b3b87870ceabfc9639ccdbb7e839:"$HISTORICAL" > "$RUNNER_TEMP/cineby.js"
          DIGEST="$(sha256sum "$RUNNER_TEMP/cineby.js" | awk '{print $1}')"
          CANDIDATE="providers/cineby--restored--${DIGEST:0:16}.js"
          cp "$RUNNER_TEMP/cineby.js" "$CANDIDATE"
          FIXTURE='{"tmdbId":"157336","mediaType":"movie","title":"Interstellar","year":2014,"label":"Interstellar (2014)","category":"movie"}'
          CONTEXT='{"locale":"fr-FR","language":"fr","languages":["fr-FR","fr","en"],"platform":"android","settings":{},"storage":{},"maxSettingsProfiles":8}'
          timeout 150 node --max-old-space-size=1024 scripts/provider_worker.cjs "$CANDIDATE" "$FIXTURE" "$CONTEXT" > "$RUNNER_TEMP/cineby-worker.txt" || true
          CANDIDATE="$CANDIDATE" python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'cineby-worker.txt'
          payload = None
          for line in output.read_text(encoding='utf-8', errors='replace').splitlines():
              if line.startswith('NUVIO_HEALTH_RESULT='):
                  payload = json.loads(line.split('=', 1)[1])
          streams = list((payload or {}).get('streams') or [])
          verified = 0
          for stream in streams[:8]:
              url = str(stream.get('url') or '')
              if not url.startswith(('http://', 'https://')):
                  continue
              headers = {str(k): str(v) for k, v in (stream.get('headers') or {}).items() if v is not None}
              headers.setdefault('Range', 'bytes=0-262143')
              headers.setdefault('User-Agent', 'Mozilla/5.0 Nuvio-Recovery/1.0')
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=18) as response:
                      body = response.read(262144)
                      ctype = str(response.headers.get('content-type') or '').lower()
                  text = body[:32768].decode('utf-8', errors='ignore').lstrip()
                  signature = (
                      text.startswith('#EXTM3U')
                      or len(body) >= 8 and body[4:8] == b'ftyp'
                      or len(body) >= 4 and body[:4] == bytes([0x1a, 0x45, 0xdf, 0xa3])
                      or len(body) >= 376 and body[0] == 0x47 and body[188] == 0x47
                      or ctype.startswith('video/')
                      or 'mpegurl' in ctype
                  )
                  if signature:
                      verified += 1
                      break
              except Exception:
                  continue
          report = {
              'worker_ok': bool((payload or {}).get('ok')),
              'streams_returned': len(streams),
              'playback_payloads_verified': verified,
              'restored': bool(verified),
          }
          Path('automation/cineby-recovery.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if verified:
              Path(os.environ['RUNNER_TEMP'], 'cineby.ok').write_text('ok\n', encoding='utf-8')
          else:
              Path(os.environ['CANDIDATE']).unlink(missing_ok=True)
          print(f"Cineby: streams={len(streams)}, verified={verified}")
          PY

      - name: Restore Cineby only after playback proof
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ok = (Path(os.environ['RUNNER_TEMP']) / 'cineby.ok').exists()
          if not ok:
              print('Cineby was not restored: no current Interstellar playback proof')
              raise SystemExit(0)

          candidates = sorted(Path('providers').glob('cineby--restored--*.js'))
          if len(candidates) != 1:
              raise SystemExit(f'unexpected Cineby candidate count: {len(candidates)}')
          entry = {
              'id': 'Cineby',
              'name': 'Cineby',
              'description': 'Multi-server movie and TV streaming — 4K/1080p/720p from Videasy network without subtitles',
              'version': '1.9.3',
              'author': 'Nuvio Team',
              'supportedTypes': ['movie', 'tv'],
              'filename': candidates[0].as_posix(),
              'enabled': True,
              'hasSettings': True,
              'formats': ['m3u8'],
              'logo': 'https://i.postimg.cc/dV1HWbqX/cineby.png',
              'contentLanguage': ['ar', 'en'],
          }
          path = Path('manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = data.get('scrapers', [])
          existing = next((row for row in rows if str(row.get('id') or '').casefold() == 'cineby'), None)
          if existing:
              existing.update(entry)
          else:
              index = next((i + 1 for i, row in enumerate(rows) if str(row.get('id') or '').casefold() == 'goated'), len(rows))
              rows.insert(index, entry)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run regression and repository tests
        run: |
          python tests/provider_repair_promotion_guard_test.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback
          npm test

      - name: Regenerate release metadata and validate
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python - <<'PY'
          import json
          for path in ('manifest.json', 'vf/manifest.json'):
              data = json.load(open(path, encoding='utf-8'))
              rows = {str(row.get('id') or '').casefold(): row for row in data.get('scrapers', [])}
              assert rows['goated']['enabled'] is True and rows['goated']['version'] == '1.0.1'
              assert rows['purstream']['enabled'] is True
              assert rows['wookafr']['enabled'] is True
              assert rows['french-manga']['enabled'] is False
              assert rows['voiranime-rip']['enabled'] is False
          print('manifest regression assertions passed')
          PY

      - name: Publish validated recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provider_worker.cjs scripts/runtime_repair.py tests/provider_repair_promotion_guard_test.py \
            providers manifest.json vf/manifest.json package.json sources.json FILE-HASHES.json \
            PATCH-SHA256SUMS.txt SHA256SUMS.json automation/cineby-recovery.json
          if git diff --cached --quiet; then
            echo "No validated recovery changes to publish."
            exit 0
          fi
          git commit -m "fix: recover Nuvio provider loading regressions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish after five race-safe attempts" >&2
          exit 1
