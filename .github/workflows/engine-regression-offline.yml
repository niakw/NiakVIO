# Read-only validation after configured/catalogue quarantine separation.
name: Validate provider engine regressions offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_provider_overrides.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/validate_published_overrides.py"
      - "scripts/validate_activation_preservation.py"
      - "scripts/audit_catalogue_identity_media.py"
      - "scripts/quarantine_catalogue_audit_failures.py"
      - "scripts/run_adaptive_deep_repair.py"
      - "scripts/repair_identity_gate.py"
      - "scripts/provider_engine_normalizer.py"
      - "scripts/provider_compiler.py"
      - "scripts/provider_rebuild.py"
      - "tests/repair_identity_gate_test.py"
      - ".github/workflows/engine-regression-offline.yml"

permissions:
  contents: read

concurrency:
  group: provider-engine-regression-offline
  cancel-in-progress: true

jobs:
  regressions:
    name: Run repository engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main generation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile engine boundaries
        run: |
          python -m py_compile scripts/apply_provider_overrides.py
          python -m py_compile scripts/reapply_published_overrides.py
          python -m py_compile scripts/validate_published_overrides.py
          python -m py_compile scripts/validate_activation_preservation.py
          python -m py_compile scripts/audit_catalogue_identity_media.py
          python -m py_compile scripts/quarantine_catalogue_audit_failures.py
          python -m py_compile scripts/run_adaptive_deep_repair.py
          python -m py_compile scripts/repair_identity_gate.py
          python -m py_compile scripts/provider_engine_normalizer.py
          python -m py_compile scripts/provider_compiler.py
          python -m py_compile scripts/provider_rebuild.py

      - name: Validate automatic repair identity promotion gate
        run: python tests/repair_identity_gate_test.py

      - name: Reconstruct safe published generation in workspace
        run: |
          python scripts/reapply_published_overrides.py
          echo "--- reconstructed files ---"
          git status --short
          echo "--- reconstructed diff stat ---"
          git diff --stat
          echo "--- quarantine security state ---"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads(Path('manifest.json').read_text())
          provenance = json.loads(Path('PROVENANCE.json').read_text()).get('providers', {})
          overrides = json.loads(Path('provider-overrides.json').read_text()).get('provider_patches', {})
          for row in manifest.get('scrapers', []):
              pid = str(row.get('id') or '')
              filename = str(row.get('filename') or '')
              patch = overrides.get(pid.lower()) or overrides.get(pid) or {}
              configured = isinstance(patch, dict) and (patch.get('manifest_overrides') or {}).get('enabled') is False
              audit = '--nuvio-audit-quarantine--' in filename
              if not (configured or audit):
                  continue
              prov = provenance.get(pid) or provenance.get(pid.lower()) or {}
              path = root / filename
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              print(json.dumps({
                  'id': pid,
                  'configured': configured,
                  'audit': audit,
                  'enabled': row.get('enabled'),
                  'filename': filename,
                  'provenance_sha_match': bool(digest and (prov.get('patched_sha256') or prov.get('sha256')) == digest),
                  'activation_eligible': prov.get('activation_eligible'),
                  'activation_mode': prov.get('activation_mode'),
                  'activation_blockers': prov.get('activation_blockers'),
              }, sort_keys=True))
          PY

      - name: Validate reconstructed published generation
        run: |
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Run complete repository regression suite without mutating lifecycle hooks
        run: npm test --ignore-scripts

      - name: Validate final release and expose persistence delta
        run: |
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          echo "--- final workspace delta ---"
          git status --short
          git diff --stat
