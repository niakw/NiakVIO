# Read-only validation of the exact published provider generation.
name: Validate provider engine regressions offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/offline-engine-regression"
      - ".github/workflows/engine-regression-offline.yml"
      - "manifest.json"
      - "vf/manifest.json"
      - "PROVENANCE.json"
      - "FILE-HASHES.json"
      - "PATCH-SHA256SUMS.txt"
      - "SHA256SUMS.json"
      - "scripts/apply_provider_overrides.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/validate_published_overrides.py"
      - "scripts/validate_activation_preservation.py"
      - "scripts/validate_nuvio_tv_runtime_policy.py"
      - "scripts/audit_catalogue_identity_media.py"
      - "scripts/quarantine_catalogue_audit_failures.py"
      - "scripts/run_adaptive_deep_repair.py"
      - "scripts/run_adaptive_quick_repair.py"
      - "scripts/promote_refresh_candidates.py"
      - "scripts/normalize_provider_activation_overrides.py"
      - "scripts/interstellar_nuvio_matrix.py"
      - "scripts/generate_release_hashes.py"
      - "scripts/adaptive_runtime/runtime_repair.py"
      - "scripts/provider_patches/adaptive_runtime_recovery_v4.py"
      - "scripts/provider_patches/adaptive_runtime_recovery_v5.py"
      - "scripts/repair_identity_gate.py"
      - "scripts/provider_engine_normalizer.py"
      - "scripts/provider_compiler.py"
      - "scripts/provider_rebuild.py"
      - "tests/repair_identity_gate_test.py"
      - "tests/adaptive_runtime_repair_test.py"
      - "tests/adaptive_extension_media_proof_test.py"
      - "tests/quick_repair_probe_profile_test.py"
      - "tests/quick_repair_acceptance_policy_test.py"
      - "tests/healthy_sibling_resolution_test.py"
      - "tests/provider_activation_override_normalization_test.py"
      - "tests/quick_refresh_policy_test.py"
      - "tests/quick_refresh_deep_authority_test.py"

permissions:
  contents: read

concurrency:
  group: provider-engine-regression-offline
  cancel-in-progress: true

jobs:
  regressions:
    name: Run repository engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile engine boundaries
        run: |
          python -m py_compile scripts/apply_provider_overrides.py
          python -m py_compile scripts/reapply_published_overrides.py
          python -m py_compile scripts/validate_published_overrides.py
          python -m py_compile scripts/validate_activation_preservation.py
          python -m py_compile scripts/validate_nuvio_tv_runtime_policy.py
          python -m py_compile scripts/audit_catalogue_identity_media.py
          python -m py_compile scripts/quarantine_catalogue_audit_failures.py
          python -m py_compile scripts/run_adaptive_deep_repair.py
          python -m py_compile scripts/run_adaptive_quick_repair.py
          python -m py_compile scripts/promote_refresh_candidates.py
          python -m py_compile scripts/normalize_provider_activation_overrides.py
          python -m py_compile scripts/interstellar_nuvio_matrix.py
          python -m py_compile scripts/generate_release_hashes.py
          python -m py_compile scripts/adaptive_runtime/runtime_repair.py
          python -m py_compile scripts/provider_patches/adaptive_runtime_recovery_v4.py
          python -m py_compile scripts/provider_patches/adaptive_runtime_recovery_v5.py
          python -m py_compile scripts/repair_identity_gate.py
          python -m py_compile scripts/provider_engine_normalizer.py
          python -m py_compile scripts/provider_compiler.py
          python -m py_compile scripts/provider_rebuild.py

      - name: Validate adaptive repair and selection contracts
        run: |
          python tests/repair_identity_gate_test.py
          python tests/quick_repair_probe_profile_test.py
          python tests/quick_repair_acceptance_policy_test.py
          python tests/healthy_sibling_resolution_test.py
          python tests/provider_activation_override_normalization_test.py
          python tests/quick_refresh_policy_test.py
          python tests/quick_refresh_deep_authority_test.py
          python tests/adaptive_extension_media_proof_test.py
          python tests/adaptive_runtime_repair_test.py

      - name: Reconstruct safe published generation in workspace
        run: python scripts/reapply_published_overrides.py

      - name: Run complete repository regression suite
        run: npm test --ignore-scripts

      - name: Require immutable release consistency
        run: |
          python scripts/validate_release_integrity.py
          echo "--- final workspace delta ---"
          git status --short
          git diff --stat
          test -z "$(git status --porcelain)"
