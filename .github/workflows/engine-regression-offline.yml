name: Validate provider engine regressions offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_provider_overrides.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/run_adaptive_deep_repair.py"
      - "scripts/provider_engine_normalizer.py"
      - "scripts/provider_compiler.py"
      - "scripts/provider_rebuild.py"
      - ".github/workflows/engine-regression-offline.yml"

permissions:
  contents: read

concurrency:
  group: provider-engine-regression-offline
  cancel-in-progress: true

jobs:
  regressions:
    name: Run repository engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main generation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile engine boundaries
        run: |
          python -m py_compile scripts/apply_provider_overrides.py
          python -m py_compile scripts/reapply_published_overrides.py
          python -m py_compile scripts/run_adaptive_deep_repair.py
          python -m py_compile scripts/provider_engine_normalizer.py
          python -m py_compile scripts/provider_compiler.py
          python -m py_compile scripts/provider_rebuild.py

      - name: Reconstruct published generation offline
        run: |
          python scripts/reapply_published_overrides.py
          echo "--- reconstructed files ---"
          git status --short
          echo "--- reconstructed diff stat ---"
          git diff --stat
          mkdir -p reconstructed/providers reconstructed/vf
          cp PROVENANCE.json reconstructed/PROVENANCE.json
          cp manifest.json reconstructed/manifest.json
          cp provider-overrides.json reconstructed/provider-overrides.json
          cp vf/manifest.json reconstructed/vf/manifest.json
          cp providers/purstream--nuvio--40c9e6a91441db06.js reconstructed/providers/purstream--nuvio--40c9e6a91441db06.js

      - name: Run complete repository regression suite on reconstructed generation
        run: npm test --ignore-scripts

      - name: Archive validated reconstructed generation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-engine-reconstructed-generation
          path: reconstructed
          if-no-files-found: error
          retention-days: 1
