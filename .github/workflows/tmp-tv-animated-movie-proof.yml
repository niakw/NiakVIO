name: Temporary TV animated movie proof

on:
  push:
    branches:
      - agent/tv-regression-5.20.38

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify adaptive TV sampling contracts
        run: npm test
      - name: Test Mon ninja et moi 3 across TV providers
        run: python scripts/tmp_tv_animated_movie_matrix.py
      - name: Upload sanitized animated movie matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animated-movie-matrix-${{ github.run_id }}
          path: animated-movie-matrix.json
          retention-days: 2
          if-no-files-found: error
