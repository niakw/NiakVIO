name: Export Nuvio debug context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-nuvio-debug-context.yml"
      - ".github/triggers/export-nuvio-debug-context"

permissions:
  contents: read

concurrency:
  group: export-nuvio-debug-context
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Collect current targeted context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/providers export/automation export/scripts/provider_patches
          cp manifest.json export/manifest.json
          cp vf/manifest.json export/vf-manifest.json
          cp provider-overrides.json PROVENANCE.json health-config.json export/
          cp automation/nuvio-tv-target-diagnostics-v2.json export/automation/ || true
          cp automation/target-provider-route-snippets-v3.json export/automation/ || true
          cp automation/nuvio-tv-global-audit.json export/automation/ || true
          cp automation/nuvio-tv-global-candidates.json export/automation/ || true
          cp scripts/nuvio_tv_probe_v2.cjs export/scripts/
          cp scripts/provider_patches/nuvio_tv_direct_media_v2.py export/scripts/provider_patches/
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path('.')
          out = Path('export/providers')
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          targets = {'wookafr', 'coflix', 'streamzo', 'frenchstream', 'goated'}
          copied = []
          for row in manifest.get('scrapers', []):
              if str(row.get('id', '')).casefold() not in targets:
                  continue
              source = root / str(row.get('filename', ''))
              if source.is_file():
                  shutil.copy2(source, out / source.name)
                  copied.append({'id': row.get('id'), 'filename': row.get('filename'), 'version': row.get('version')})
          Path('export/target-files.json').write_text(json.dumps(copied, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(copied, ensure_ascii=False))
          PY

      - name: Upload debug context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvio-debug-context-${{ github.run_id }}
          path: export
          retention-days: 3
          if-no-files-found: error
