name: TEMP - HindMoviez Final Proof

on:
  push:
    branches: [release/stable-46-20260912]
    paths: ['.github/workflows/temp-hindmoviez-final-proof.yml']

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply source plan and focused contracts
        run: |
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python tests/provider_v3_final_transient_fixture_fallback_test.py
          python tests/provider_v3_adaptive_live_retry_test.py
          python tests/provider_v3_execution_authority_finalization_test.py
      - name: Prepare current candidate DATA exactly like official reconstruction
        run: |
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
      - name: Prove real HindMoviez candidate and final bundle
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'scripts'))
          from reconstruct_provider_v3_sequential_live import (
              build_provider_queue, materialize_one, run_until_qualified,
              is_qualified, finalize_provider, prove_final_bundle,
              KNOWLEDGE, OVERRIDES,
          )

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          queue, count = build_provider_queue()
          assert count == 96
          provider = next(row for row in queue if row['provider_id'] == 'hindmoviez')
          knowledge = load(KNOWLEDGE)
          overrides = load(OVERRIDES)
          model = knowledge['providers']['hindmoviez']['model']
          model['canonicalSupportedTypes'] = list(provider.get('supported_types') or [])

          candidate = materialize_one('hindmoviez')
          for task in provider['tasks']:
              task['filename'] = candidate['file']
          rows, evaluation, used_tasks = run_until_qualified(provider, model, 0.75, 50)
          print('FIELD_HINDMOVIEZ_CANDIDATE ' + json.dumps({
              'qualified': is_qualified(evaluation),
              'validatedTypes': evaluation.get('validatedTypes'),
              'missingTypes': evaluation.get('missingTypes'),
              'used': [t.get('fixture_slug') for t in used_tasks],
          }, sort_keys=True))
          assert is_qualified(evaluation), evaluation

          finalize_provider('hindmoviez', provider, knowledge, overrides, evaluation,
                            'declared-types-qualified', [])
          write(KNOWLEDGE, knowledge)
          write(OVERRIDES, overrides)
          final = materialize_one('hindmoviez')
          proof = prove_final_bundle(provider, model, used_tasks, final['file'], 0.75, 50)
          print('FIELD_HINDMOVIEZ_FINAL_PROOF ' + json.dumps(proof, sort_keys=True))
          assert proof.get('verified') is True, proof
          assert proof.get('wrongContentOnlyTypes') == [], proof
          print('FIELD_HINDMOVIEZ_FINAL_FIX status=green')
          PY
