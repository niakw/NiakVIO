name: TEMP - Final Address Authorities V65F

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths: [.github/workflows/temp-final-domain-seeds-v65f.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: fix/non-display-recovery-20260916, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}

      - name: Apply V65E transform and purge entry hosts from terminal allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,subprocess,sys,textwrap
          from pathlib import Path
          src=Path('.github/workflows/temp-final-domain-seeds-v65e.yml').read_text(encoding='utf-8')
          section=src.split('      - name: Apply V65D source transformation and verify contracts',1)[1].split('      - name: Install exact current address entries',1)[0]
          m=re.search(r"python - <<'PY'\n([\s\S]*?)\n\s{10}PY\n",section)
          if not m:raise SystemExit('V65F_TRANSFORM_EXTRACTION_FAILED')
          subprocess.run([sys.executable,'-c',textwrap.dedent(m.group(1))],check=True)
          p=Path('scripts/resolve_provider_hubs.py');s=p.read_text(encoding='utf-8')
          old='''        allowed.update(host(url) for url in terminal_direct_values if host(url))\n        target["allowed_terminal_hosts"] = sorted(allowed)'''
          new='''        allowed.update(host(url) for url in terminal_direct_values if host(url))\n        allowed.difference_update(curated_entry_hosts(target))\n        target["allowed_terminal_hosts"] = sorted(allowed)'''
          if old not in s:raise SystemExit('V65F_PRIMARY_ALLOWLIST_PATCH_MISSING')
          s=s.replace(old,new,1)
          old2='''        entry_hosts = curated_entry_hosts(target)\n        allowed.update(host(url) for url in target["direct_candidates"] if host(url) and host(url) not in entry_hosts)\n        target["allowed_terminal_hosts"] = sorted(allowed)'''
          new2='''        entry_hosts = curated_entry_hosts(target)\n        allowed.update(host(url) for url in target["direct_candidates"] if host(url) and host(url) not in entry_hosts)\n        allowed.difference_update(entry_hosts)\n        target["allowed_terminal_hosts"] = sorted(allowed)'''
          if old2 not in s:raise SystemExit('V65F_FINAL_ALLOWLIST_PATCH_MISSING')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          print('V65F_SOURCE_TRANSFORM_OK')
          PY

      - name: Install user address contracts and verify merged authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,subprocess,sys,textwrap
          from pathlib import Path
          src=Path('.github/workflows/temp-final-domain-seeds-v65e.yml').read_text(encoding='utf-8')
          section=src.split('      - name: Install exact current address entries',1)[1].split('      - name: Execute four-provider Domain Refresh',1)[0]
          m=re.search(r"python - <<'PY'\n([\s\S]*?)\n\s{10}PY\n",section)
          if not m:raise SystemExit('V65F_INSTALL_EXTRACTION_FAILED')
          subprocess.run([sys.executable,'-c',textwrap.dedent(m.group(1))],check=True)
          PY
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()));import resolve_provider_hubs as r
          m=r.merge_hub_registry(json.loads(Path('provider-overrides.json').read_text()));rows=json.loads(Path('provider-hubs.json').read_text())['providers']
          expected={'desiflix':('https://desiflix.onl/','desiflix.codes'),'uhdmovies':('https://mmodlist.org/?type=uhdmovies','uhdmovies.my'),'animesalt':('https://animesalt.ac/','animesalt.cx')}
          for pid,(entry,terminal) in expected.items():
              print('V65F_MERGED',pid,json.dumps({k:m[pid].get(k) for k in ['hub','resolver','curated_entry','declared_terminal','direct_fallback','direct_candidates','allowed_terminal_hosts','sources']},sort_keys=True))
              assert m[pid]['direct_candidates'][0].rstrip('/')==entry.rstrip('/'),(pid,m[pid]['direct_candidates'][:4])
              assert r.host(entry) not in r.exact_allowed_hosts(m[pid]),(pid,r.exact_allowed_hosts(m[pid]))
              assert terminal in r.exact_allowed_hosts(m[pid]),(pid,r.exact_allowed_hosts(m[pid]))
              assert not r.has_authoritative_hub_source(m[pid]),pid
              assert r.has_authoritative_curated_entry_source(m[pid]),pid
          assert rows['allwish']['hub'].rstrip('/')=='https://t.me/s/allwishme' and rows['allwish']['direct'].rstrip('/')=='https://all-wish.me'
          print('V65F_MERGED_AUTHORITY_OK')
          PY
          python tests/provider_hub_registry_test.py

      - name: Execute targeted address transaction
        shell: bash
        run: |
          set -euo pipefail
          cp provider-overrides.json "$RUNNER_TEMP/overrides.before.json";cp manifest.json "$RUNNER_TEMP/manifest.before.json";cp provider-v3-materialization.json "$RUNNER_TEMP/material.before.json";cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static.before.json";cp PROVENANCE.json "$RUNNER_TEMP/provenance.before.json"
          mkdir -p health-output automation/evidence
          python scripts/domain_refresh_transaction_v2.py --provider desiflix --provider uhdmovies --provider animesalt --provider allwish --include-disabled --mode quick --timeout 18 --workers 4 --apply --output health-output/v65f-report.json --changes-output health-output/v65f-changes.json
          python - <<'PY'
          import json
          r=json.load(open('health-output/v65f-report.json'));c=json.load(open('health-output/v65f-changes.json'))
          expected={'desiflix':'https://desiflix.codes','uhdmovies':'https://uhdmovies.my','animesalt':'https://animesalt.cx','allwish':'https://all-wish.me'}
          for pid,url in expected.items():
              row=r['providers'].get(pid);print('V65F_DOMAIN',pid,json.dumps(row,sort_keys=True));assert row and row.get('status')=='site_authoritative',(pid,row);assert str(row.get('official_site') or '').rstrip('/')==url,(pid,row)
          print('V65F_CHANGES',json.dumps(c,sort_keys=True))
          PY

      - name: Reconcile and validate fixed point
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v65f-changes.json --check
          mapfile -t CHANGED < <(python - <<'PY'
          import json
          for p in sorted(set(json.load(open('health-output/v65f-changes.json')).get('changed') or [])):print(p)
          PY
          )
          if [ "${#CHANGED[@]}" -gt 0 ];then ARGS=();for p in "${CHANGED[@]}";do ARGS+=(--provider "$p");done;python scripts/reconcile_provider_domain_metadata.py --rebuild "${ARGS[@]}";fi
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v65f-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/audit_provider_v3_static.py
          python scripts/validate_domain_refresh_non_destructive.py --before-overrides "$RUNNER_TEMP/overrides.before.json" --before-manifest "$RUNNER_TEMP/manifest.before.json" --before-materialization "$RUNNER_TEMP/material.before.json" --before-provenance "$RUNNER_TEMP/provenance.before.json" --changes health-output/v65f-changes.json
          python scripts/validate_domain_refresh_static_non_destructive.py --before-static "$RUNNER_TEMP/static.before.json" --changes health-output/v65f-changes.json

      - name: Probe all four current lanes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()));import audit_provider_quick_yield as q
          q.TIMEOUT=60;wanted={'desiflix','uhdmovies','animesalt','allwish'};tasks,_=q.build_tasks();rows=[]
          for t in tasks:
              if str(t.get('provider_id') or '').casefold() not in wanted:continue
              x=q.run(t);rows.append(x);print('V65F_RUNTIME',json.dumps({k:x.get(k) for k in ['provider_id','semantic_type','status','debug_stage','raw','playable','verified','contradictions','duration_ms','debug_fetches']},default=str,sort_keys=True))
          Path('automation/evidence/final-address-authorities-v65.json').write_text(json.dumps({'schema_version':6,'rows':rows},ensure_ascii=False,indent=2,default=str)+'\n')
          by={p:[] for p in wanted}
          for x in rows:by[str(x.get('provider_id') or '').casefold()].append(x)
          expected={'desiflix':'desiflix.codes','uhdmovies':'uhdmovies.my','animesalt':'animesalt.cx','allwish':'all-wish.me'}
          for pid in sorted(wanted):
              assert by[pid],f'missing task {pid}';print('V65F_PROVIDER_SUMMARY',pid,[(x.get('semantic_type'),x.get('status'),x.get('verified')) for x in by[pid]])
              urls=[str(f.get('url') or '') for x in by[pid] for f in (x.get('debug_fetches') or [])];assert any(expected[pid] in u for u in urls),(pid,urls[:24])
          print('V65F_RUNTIME_ROUTING_OK')
          PY

      - name: Persist V65F
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot';git config user.email 'actions@users.noreply.github.com'
          git add scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_provenance.py scripts/validate_domain_refresh_non_destructive.py scripts/resolve_provider_hubs.py scripts/refresh_authoritative_hub_domains.py provider-hubs.json provider-overrides.json provider-domain-history.json manifest.json provider-v3-materialization.json automation/provider-v3-static-knowledge.json PROVENANCE.json automation/evidence/final-address-authorities-v65.json 'providers/desiflix'*.js 'providers/uhdmovies'*.js 'providers/animesalt'*.js 'providers/allwish'*.js 'provider-disabled/desiflix'*.js 'provider-disabled/uhdmovies'*.js 'provider-disabled/animesalt'*.js 'provider-disabled/allwish'*.js
          if git diff --cached --quiet;then echo V65F_PERSIST_NOOP;exit 0;fi
          git commit -m 'fix(domains): separate curated entries from terminals'
          git push origin HEAD:fix/non-display-recovery-20260916
