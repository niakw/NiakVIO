name: Nuvio TV ToFlix language provenance proof

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-toflix-language-proof

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Record run id
        run: |
          mkdir -p .github/status
          printf '%s\n' "$GITHUB_RUN_ID" > .github/status/tv-toflix-language-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/tv-toflix-language-run
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record ToFlix language proof run'
            git push origin HEAD:agent/tv-regression-5.20.38
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect exact ToFlix stream metadata and provider language branches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess
          m=json.load(open('manifest.json'))
          row=next(r for r in m['scrapers'] if str(r.get('id') or '').casefold()=='toflix')
          path=row['filename'].removeprefix('../')
          src=open(path,encoding='utf-8').read()
          # Print only source snippets relevant to language selection; redact all
          # URL literals so diagnostics cannot leak stream endpoints.
          hits=[]
          for match in re.finditer(r'.{0,180}(?:french|français|francais|language|lang|audio).{0,260}',src,re.I|re.S):
              snippet=re.sub(r'https?://[^\s"\'`]+','[endpoint]',match.group(0))
              snippet=re.sub(r'\s+',' ',snippet).strip()
              if snippet not in hits: hits.append(snippet)
          print('SOURCE_LANGUAGE_SNIPPETS')
          for s in hits[:20]: print(s)
          fixture={'tmdbId':'1396','mediaType':'tv','season':1,'episode':1,'title':'Breaking Bad','year':2008,'label':'Breaking Bad S01E01','category':'tv','expectedDurationMinutes':58}
          proc=subprocess.run(['node','scripts/nuvio_tv_probe_v2.cjs',path,json.dumps(fixture,separators=(',',':')),'{}'],capture_output=True,text=True,timeout=90)
          lines=[line for line in proc.stdout.splitlines() if line.strip().startswith('{')]
          if not lines:
              print(proc.stderr[-2000:]); raise SystemExit('ToFlix probe produced no JSON')
          data=json.loads(lines[-1])
          safe=[]
          from urllib.parse import urlparse
          for item in data.get('streams') or []:
              stream=item.get('row') or {}
              media=item.get('media') or {}
              safe.append({
                'title':stream.get('title') or stream.get('name'),
                'language':stream.get('language'),
                'quality':stream.get('quality'),
                'host':urlparse(str(stream.get('url') or '')).hostname,
                'playable':media.get('playable'),
                'kind':media.get('kind'),
                'http_status':media.get('httpStatus') or media.get('http_status'),
              })
          print('SAFE_STREAM_ROWS',json.dumps(safe,ensure_ascii=False,indent=2))
          PY
