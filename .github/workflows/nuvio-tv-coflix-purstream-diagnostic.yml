name: NuvioTV Coflix Purstream diagnostic

on:
  push:
    paths:
      - .github/triggers/nuvio-tv-coflix-purstream-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe Coflix and Purstream
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          fixture=json.dumps({'tmdbId':'842675','mediaType':'movie','title':'The Wandering Earth II','year':2023},separators=(',',':'))
          for target in ('COFLIX','PURSTREAM'):
              row=next((x for x in manifest.get('scrapers',[]) if str(x.get('id','')).upper()==target),None)
              if not row:
                  print(target+': missing')
                  continue
              filename=str(row.get('filename','')).removeprefix('../')
              print('=== '+target+' ===')
              print('enabled=',row.get('enabled'),'disabledPlatforms=',row.get('disabledPlatforms'),'file=',filename)
              proc=subprocess.run(['node','scripts/nuvio_tv_probe_v2.cjs',filename,fixture,'{}'],capture_output=True,text=True,timeout=120)
              print('exit=',proc.returncode)
              print(proc.stdout)
              if proc.stderr:
                  print('stderr:',proc.stderr)
          PY
