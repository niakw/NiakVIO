name: TMP - V29 AniKoto Terminal
# PR trigger V29b

on:
  pull_request:
    branches:
      - tmp/v29-anikoto-base
      - tmp/v29b-anikoto-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate AniKoto V3 contracts
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          python3 scripts/materialize_provider_v3_all.py             --source-manifest manifest.json             --output-dir providers             --report health-output/v29-materialization.json

      - name: Probe AniKoto exact regenerated bundle
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py             --manifest manifest.json             --include-disabled             --provider anikototv             --candidate-limit 12             --timeout 30             --workers 1             --seed "v29-anikoto-${GITHUB_RUN_ID}"             --output health-output/v29-anikoto-certification.json

      - name: Summarize AniKoto terminal
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('health-output/v29-anikoto-certification.json')
          if not p.exists():
              print('FIELD_V29_ANIKOTO no-certification')
              raise SystemExit(0)
          j=json.loads(p.read_text())
          for row in j.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              print('FIELD_V29_ANIKOTO',
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower())
              for lane,v in lanes.items():
                  for a in (v or {}).get('attempts') or []:
                      print('FIELD_V29_ATTEMPT',lane,a.get('fixtureSlug'),
                            'stage='+str(a.get('debugStage') or ''),
                            'trace='+json.dumps(a.get('providerValueTraceHistory') or [],separators=(',',':'))[:5000])
          PY

      - name: Upload V29 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v29-anikoto-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
