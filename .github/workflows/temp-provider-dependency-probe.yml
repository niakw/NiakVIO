name: TEMP - Provider Dependency Probe

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/provider-dependency-probe.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply worker compatibility migrations
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_worker_route_proof_v1.py
          python scripts/upgrade_provider_route_retry_v1.py
          node --check scripts/provider_worker.cjs
      - name: Probe providers previously blocked by MODULE_NOT_FOUND
        run: |
          set -euo pipefail
          python scripts/recover_provider_routes_from_upstreams.py \
            --workers 8 --timeout 55 --attempts 1 \
            --out automation/provider-dependency-probe.json \
            --provider 4khdhub \
            --provider allanime \
            --provider allmovieland \
            --provider anidb \
            --provider animepahe \
            --provider anizone \
            --provider fibwatch \
            --provider hdhub4u \
            --provider hianime \
            --provider movieblast \
            --provider moviesmod \
            --provider mycima \
            --provider showbox \
            --provider streamflix \
            --provider topcartoons \
            --provider vegamovies
          python - <<'PY'
          import json
          report=json.load(open('automation/provider-dependency-probe.json'))
          blocked=[]
          proven=[]
          for row in report.get('providers',[]):
              if row.get('routes'): proven.append(row.get('providerId'))
              if any(str(task.get('error') or '').upper()=='MODULE_NOT_FOUND' for task in row.get('tasks',[])):
                  blocked.append(row.get('providerId'))
          print(f'PROVIDER_DEPENDENCY_PROBE providers={len(report.get("providers",[]))} proven={len(proven)} module_not_found={len(blocked)}')
          print('PROVIDER_DEPENDENCY_PROBE_PROVEN ' + ','.join(sorted(proven)))
          print('PROVIDER_DEPENDENCY_PROBE_STILL_BLOCKED ' + ','.join(sorted(blocked)))
          if blocked:
              raise SystemExit(3)
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-dependency-probe-${{ github.run_id }}
          path: automation/provider-dependency-probe.json
          retention-days: 7
          if-no-files-found: warn
