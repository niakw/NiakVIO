name: MAIN - MEMORY Route Proof Checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-memory-checkpoint-route-proof.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-main-memory-checkpoint-route-proof
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Append durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat >> MEMORY.md <<'EOF'

