name: TEMP - Actionable Repair V56

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - '.github/workflows/temp-actionable-repair-v56.yml'

permissions:
  contents: write

jobs:
  actionable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run repaired targeted engine over actionable providers
        shell: bash
        run: |
          set +e
          python3 scripts/run_provider_repair_fast_targeted_v1.py \
            --provider allwish \
            --provider animesalt \
            --provider animesama-co \
            --provider desiflix \
            --provider flemmix \
            --provider moviesmod \
            --provider mugiwarastream \
            --provider uhdmovies \
            --provider voiranime-rip \
            --provider kehflix \
            --workers 6 --timeout 45 --attempts 3 --defer-global-guard
          rc=$?
          echo "V56_REPAIR_RC=$rc"
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(p):
              q=Path(p)
              return json.load(q.open()) if q.exists() else {}
          target=load('automation/provider-repair-fast-targeted.json')
          merged=load('automation/provider-repair-fast-merged.json')
          y=load('automation/provider-repair-fast-yield.json')
          summary=load('automation/provider-repair-fast-summary.json')
          rows=[]
          yrows={str(r.get('provider_id') or r.get('providerId') or r.get('provider') or '').lower():r for r in (y.get('rows') or []) if isinstance(r,dict)}
          for r in target.get('providers') or []:
              if not isinstance(r,dict): continue
              pid=str(r.get('providerId') or r.get('id') or '').lower()
              yr=yrows.get(pid,{})
              rows.append({
                  'provider':pid,
                  'routeStatus':r.get('status'),
                  'routeCount':r.get('routeCount',len(r.get('routes') or [])),
                  'recipe':bool(r.get('apiRecipe') or r.get('api_recipe')),
                  'playable':yr.get('playable'),
                  'verified':yr.get('verified'),
                  'status':yr.get('status'),
                  'debugStage':yr.get('debug_stage'),
              })
          out={
              'schemaVersion':1,
              'repairRc':int(__import__('os').environ.get('V56_RC','0') or 0),
              'targetedProviders':summary.get('targetedProviders') or [],
              'providersWithProvenRoutes':summary.get('providersWithProvenRoutes'),
              'provenRouteCount':summary.get('provenRouteCount'),
              'playableProviders':summary.get('playableProviders') or y.get('playableProviders') or [],
              'verifiedProviders':summary.get('verifiedProviders') or y.get('verifiedProviders') or [],
              'lostUpstreamPositivePairs':summary.get('lostUpstreamPositivePairs') or y.get('lostUpstreamPositivePairs') or [],
              'rows':rows,
          }
          p=Path('automation/evidence/actionable-repair-v56.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('V56_COMPACT',json.dumps(out,sort_keys=True))
          PY
          git diff --check
          exit 0
      - name: Persist diagnostic evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/evidence/actionable-repair-v56.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(repair): record actionable residual repair triage'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
