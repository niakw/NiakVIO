name: TEMP Native Pin Repair

on:
  push:
    branches:
      - fix/native-pinned-provider-integrity-20260915
    paths:
      - .github/workflows/temp-native-pin-integrity-20260915.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-pinned-provider-integrity-20260915
          fetch-depth: 0
      - name: Rebuild pinned Native transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_hub46_native_manifest.py --provider-sha c7b06a732ed07c13af819c1490fbe950d29024fb --source manifest-hub46.json --output native-hub46/manifest.json
          python3 tests/native_hub46_transport_manifest_test.py
          git diff --check
      - name: Commit repaired transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native-hub46/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(native): bind transport to existing provider blobs'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:fix/native-pinned-provider-integrity-20260915
