name: Native reader targeted

on:
  workflow_dispatch:
    inputs:
      device:
        description: Official client reader to execute
        required: true
        default: tv
        type: choice
        options: [tv, mobile]
      fixture:
        description: Corpus fixture slug
        required: true
        default: sinners-2025
        type: string
      provider:
        description: Exact provider id
        required: true
        default: MOVIESDRIVE
        type: string
      player_probes:
        description: Number of returned streams to actually play (1-4)
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-reader-targeted.yml"
      - "scripts/native_player_diagnostics_codegen.py"
      - "scripts/native_player_diagnostics.cjs"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/run_native_corpus_tv_suite.sh"
      - "scripts/run_native_corpus_mobile_suite.sh"
      - "scripts/analyze_native_corpus_results.cjs"
      - "engine_v2/src/repair-brain.mjs"

permissions:
  contents: read

concurrency:
  group: native-reader-targeted-${{ github.event.pull_request.number || github.ref }}-${{ inputs.device || 'tv' }}-${{ inputs.provider || 'MOVIESDRIVE' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      device: ${{ steps.values.outputs.device }}
      fixture: ${{ steps.values.outputs.fixture }}
      provider: ${{ steps.values.outputs.provider }}
      probes: ${{ steps.values.outputs.probes }}
      mobile_sha: ${{ steps.values.outputs.mobile_sha }}
      tv_sha: ${{ steps.values.outputs.tv_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - id: values
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DEVICE: ${{ inputs.device }}
          INPUT_FIXTURE: ${{ inputs.fixture }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PROBES: ${{ inputs.player_probes }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          event=os.environ.get('EVENT','')
          device='tv' if event=='pull_request' else (os.environ.get('INPUT_DEVICE') or 'tv')
          fixture='sinners-2025' if event=='pull_request' else (os.environ.get('INPUT_FIXTURE') or 'sinners-2025')
          provider='MOVIESDRIVE' if event=='pull_request' else (os.environ.get('INPUT_PROVIDER') or 'MOVIESDRIVE')
          probes='3' if event=='pull_request' else (os.environ.get('INPUT_PROBES') or '3')
          if device not in {'tv','mobile'}: raise SystemExit(f'unsupported device {device}')
          if probes not in {'1','2','3','4'}: raise SystemExit(f'invalid player_probes {probes}')
          data=json.loads(Path('sources.json').read_text())
          clients=data.get('nuvio_client_compatibility',{}).get('clients',{})
          refs={
            'mobile_sha': str((clients.get('nuvio-mobile') or {}).get('accepted_ref') or ''),
            'tv_sha': str((clients.get('nuvio-tv') or {}).get('accepted_ref') or ''),
          }
          if any(len(v)!=40 for v in refs.values()): raise SystemExit(f'missing accepted refs: {refs}')
          print(f'device={device}')
          print(f'fixture={fixture}')
          print(f'provider={provider}')
          print(f'probes={probes}')
          for k,v in refs.items(): print(f'{k}={v}')
          PY

  tv-reader:
    needs: resolve
    if: needs.resolve.outputs.device == 'tv'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact NiakVIO generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: niakvio, persist-credentials: false}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}
      - name: Checkout accepted official NuvioTV once
        shell: bash
        env: {NUVIO_TV_SHA: "${{ needs.resolve.outputs.tv_sha }}"}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          python3 niakvio/scripts/prepare_native_corpus_client.py tv --fixture "${{ needs.resolve.outputs.fixture }}" --workspace "$GITHUB_WORKSPACE" --provider "${{ needs.resolve.outputs.provider }}" --player-probes "${{ needs.resolve.outputs.probes }}"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Enable KVM
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
      - name: Restore TV AVD snapshot
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ runner.os }}-tv-api31-android-tv-x86-tv_1080p-reader
      - name: Create TV AVD snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated reusable TV reader AVD snapshot."
      - name: Execute targeted human-style TV reader lab
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          NIAKVIO_TARGET_FIXTURE: ${{ needs.resolve.outputs.fixture }}
          NIAKVIO_TARGET_PROVIDER: ${{ needs.resolve.outputs.provider }}
          NIAKVIO_PLAYER_PROBES: ${{ needs.resolve.outputs.probes }}
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_tv_suite.sh"
      - name: Upload targeted TV reader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: targeted-reader-tv-${{ needs.resolve.outputs.fixture }}-${{ needs.resolve.outputs.provider }}-${{ github.run_id }}
          path: tv-native-corpus-*.log
          retention-days: 7
          if-no-files-found: warn

  mobile-reader:
    needs: resolve
    if: needs.resolve.outputs.device == 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact NiakVIO generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: niakvio, persist-credentials: false}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}
      - name: Checkout accepted official NuvioMobile once
        shell: bash
        env: {NUVIO_MOBILE_SHA: "${{ needs.resolve.outputs.mobile_sha }}"}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          python3 niakvio/scripts/prepare_native_corpus_client.py mobile --fixture "${{ needs.resolve.outputs.fixture }}" --workspace "$GITHUB_WORKSPACE" --provider "${{ needs.resolve.outputs.provider }}" --player-probes "${{ needs.resolve.outputs.probes }}"
          python3 niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Enable KVM
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
      - name: Restore Mobile AVD snapshot
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ runner.os }}-mobile-api35-google_apis-x86_64-pixel_2-reader
      - name: Create Mobile AVD snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated reusable Mobile reader AVD snapshot."
      - name: Execute targeted human-style Mobile reader lab
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          NIAKVIO_TARGET_FIXTURE: ${{ needs.resolve.outputs.fixture }}
          NIAKVIO_TARGET_PROVIDER: ${{ needs.resolve.outputs.provider }}
          NIAKVIO_PLAYER_PROBES: ${{ needs.resolve.outputs.probes }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_mobile_suite.sh"
      - name: Upload targeted Mobile reader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: targeted-reader-mobile-${{ needs.resolve.outputs.fixture }}-${{ needs.resolve.outputs.provider }}-${{ github.run_id }}
          path: mobile-native-corpus-*.log
          retention-days: 7
          if-no-files-found: warn
