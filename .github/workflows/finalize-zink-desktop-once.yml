name: Finalize remaining provider repository routing once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-zink-desktop-once.yml'

permissions:
  contents: write

concurrency:
  group: finalize-zink-desktop-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Inventory runtime repository lookups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          rx=re.compile(r'https?://(?:raw\.)?githubusercontent\.com/[^"\'`\\\s)]+',re.I)
          hits=[]
          for row in manifest.get('scrapers',[]):
              path=Path(str(row.get('filename') or ''))
              if not path.is_file(): continue
              urls=sorted(set(rx.findall(path.read_text(encoding='utf-8',errors='replace'))))
              if urls: hits.append((str(row.get('id')),str(path),urls))
          for provider,path,urls in hits:
              print(f'FIELD_RUNTIME_REPOSITORY_DEP provider={provider} path={path} urls={";".join(urls)}')
          print(f'FIELD_RUNTIME_REPOSITORY_DEP_COUNT count={len(hits)}')
          PY

      - name: Refresh centralized terminal routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-hubs.json')
          data=json.loads(p.read_text())
          row=data['providers']['zinkmovies']
          row['hub']='https://redirect.zinkmovies.org/'
          row['resolver']='official_outbound'
          row['allowed_terminal_host_patterns']=[r'^(?:[a-z0-9-]+\.)*zinkmovies\.[a-z0-9-]{2,20}$']
          old=list(row.get('old_site_hosts') or [])
          if 'zinkmovies.wtf' not in old: old.append('zinkmovies.wtf')
          row['old_site_hosts']=old
          row['resolution_method']='hub_outbound_terminal'
          row['resolution_note']='Resolve the current ZinkMovies terminal from the curated redirect hub; retain the provider default URL when no terminal validates.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/resolve_provider_hubs.py \
            --provider zinkmovies --provider cineby --provider 4khdhub --provider uhdmovies --provider goated \
            --mode quick --apply --timeout 10 \
            --output health-output/final-provider-routing.json

      - name: Remove provider-side repository domain registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          def http(value):
              return isinstance(value,str) and value.startswith(('http://','https://'))

          hubs=json.loads(Path('provider-hubs.json').read_text()).get('providers',{})
          history=json.loads(Path('provider-domain-history.json').read_text()).get('providers',{})
          path=Path('provider-overrides.json')
          data=json.loads(path.read_text())
          patches=data.setdefault('provider_patches',{})

          repo_urls={
              'zinkmovies':'https://raw.githubusercontent.com/PirateZoro9/asura-providers/main/urls.json',
              '4khdhub':'https://raw.githubusercontent.com/phisher98/TVVVV/refs/heads/main/domains.json',
              'cineby':'https://raw.githubusercontent.com/sapariyaneel/nuvio-plugin/refs/heads/main/domains.json',
              'uhdmovies':'https://raw.githubusercontent.com/phisher98/TVVVV/refs/heads/main/domains.json',
              'goated':'https://raw.githubusercontent.com/sapariyaneel/nuvio-plugin/refs/heads/main/domains.json',
          }
          defaults={
              'zinkmovies':'https://zinkmovies.wtf/',
              '4khdhub':'https://new4.hdhub4u.cl/',
              'cineby':'https://cineby.top/',
              'uhdmovies':'https://uhdmovies.autos/',
              'goated':'https://goated.cx/',
          }

          def route_for(pid):
              row=hubs.get(pid) or {}
              # Trust order is the global contract: configured hub/method first.
              hub=row.get('hub')
              if http(hub): return hub
              sources=sorted(
                  [s for s in row.get('sources',[]) if isinstance(s,dict) and s.get('type')!='search' and http(s.get('url'))],
                  key=lambda s:-int(s.get('priority') or 0),
              )
              if sources: return sources[0]['url']
              patch=patches.get(pid) or {}
              if http(patch.get('official_site')): return patch['official_site']
              current=(history.get(pid) or {}).get('current') or {}
              if http(current.get('url')): return current['url']
              if http(row.get('direct')): return row['direct']
              for candidate in row.get('direct_candidates') or []:
                  if http(candidate): return candidate
              # No curated/resolved route: preserve the provider's own default URL.
              return defaults[pid]

          for pid,repo_url in repo_urls.items():
              patch=patches.setdefault(pid,{})
              route=route_for(pid)
              patch.setdefault('replacements',{})[repo_url]=route
              notes=list(patch.get('notes') or [])
              note='Centralize domain discovery through provider-hubs.json/history; provider-side GitHub domain registries are maintenance-only and the embedded provider URL remains the final fallback.'
              if note not in notes: notes.append(note)
              patch['notes']=notes
              print(f'FIELD_CENTRALIZED_ROUTE provider={pid} route={route} fallback={defaults[pid]}')

          # ZinkMovies refreshDomains only mutates baseUrl from the old repository JSON.
          # Neutralize that updater entirely; baseUrl therefore stays on its embedded
          # fallback unless the centralized resolver has already rewritten the host.
          z=patches['zinkmovies']
          site=str(z.get('official_site') or defaults['zinkmovies']).rstrip('/')
          z['fixed_endpoint']={
              'resolver_function':'refreshDomains',
              'api':site,
              'referer':site+'/'
          }
          z['official_hub']='https://redirect.zinkmovies.org'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Materialize and prove repository-independent catalogue
        shell: bash
        run: |
          set -euo pipefail
          converged=0
          for pass in 1 2 3 4; do
            python scripts/reapply_published_overrides.py
            if python scripts/reapply_published_overrides.py --check; then
              converged=1
              break
            fi
          done
          test "$converged" -eq 1
          python tests/provider_hub_registry_test.py
          python tests/provider_hub_curated_baseline_test.py
          python - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          rx=re.compile(r'https?://(?:raw\.)?githubusercontent\.com/',re.I)
          bad=[]
          for row in manifest.get('scrapers',[]):
              p=Path(str(row.get('filename') or ''))
              if p.is_file() and rx.search(p.read_text(encoding='utf-8',errors='replace')):
                  bad.append(str(row.get('id')))
          if bad: raise SystemExit('runtime repository dependencies remain: '+','.join(bad))
          print('FIELD_ALL_PUBLISHED_REPOSITORY_INDEPENDENT state=passed')
          PY

      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-zink-desktop-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- provider-hubs.json provider-overrides.json provider-domain-history.json manifest.json vf PROVENANCE.json providers .github/workflows
          git commit -m 'fix: centralize remaining provider domain routing'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
