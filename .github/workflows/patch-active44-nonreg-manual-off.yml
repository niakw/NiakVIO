name: SHORT - Patch Active44 NonRegression Manual OFF

on:
  push:
    branches:
      - fix/active44-durability-20260915
    paths:
      - '.github/workflows/patch-active44-nonreg-manual-off.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          persist-credentials: true
      - name: Patch manual OFF debt authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check_provider_non_regression_v1.py')
          t=p.read_text(encoding='utf-8')
          old='''        patch = patches.get(pid) if isinstance(patches.get(pid), dict) else {}\n        disposition = patch.get("repair_disposition") if isinstance(patch.get("repair_disposition"), dict) else {}\n        state = canon(disposition.get("routeDataState"))\n'''
          new='''        patch = patches.get(pid) if isinstance(patches.get(pid), dict) else {}\n        # Explicit user/manual OFF is newer activation authority than historical\n        # rolling lane proof. It may waive missing-live-lane debt only; semantic\n        # type and HLS contract deletion remain hard failures below.\n        manual_off_reason = str(patch.get("manual_off_reason") or "").strip()\n        manifest_overrides = patch.get("manifest_overrides") if isinstance(patch.get("manifest_overrides"), dict) else {}\n        if row.get("enabled") is False and manual_off_reason and manifest_overrides.get("enabled") is False:\n            out[pid] = {\n                "authority": "manual-user-off-v1",\n                "activationAuthority": "manual-user-off-v1",\n                "activationState": "disabled",\n                "forcedEnabled": False,\n                "routeDataState": "off",\n                "completeCapabilityProof": False,\n                "missingLanes": ["manual-off"],\n                "reasonCodes": [manual_off_reason],\n                "manualOff": True,\n            }\n            continue\n        disposition = patch.get("repair_disposition") if isinstance(patch.get("repair_disposition"), dict) else {}\n        state = canon(disposition.get("routeDataState"))\n'''
          if old not in t:
              raise SystemExit('manual OFF insertion anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          q=Path('tests/provider_non_regression_contract_test.py')
          s=q.read_text(encoding='utf-8')
          marker='manual_off_reason'
          if marker not in s:
              s += '''\n\n# Active44: explicit manual OFF may waive missing rolling lane proof, but the\n# gate still evaluates semantic/HLS contract regression independently.\n_gate_source = (ROOT / "scripts/check_provider_non_regression_v1.py").read_text(encoding="utf-8")\nassert "manual_off_reason" in _gate_source\nassert "manual-user-off-v1" in _gate_source\nassert "semantic_capability_regression" in _gate_source\nassert "historical_hls_m3u8_regression" in _gate_source\n'''
              q.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/check_provider_non_regression_v1.py tests/provider_non_regression_contract_test.py
          python tests/provider_non_regression_contract_test.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check_provider_non_regression_v1.py tests/provider_non_regression_contract_test.py
          git commit -m 'fix: treat explicit manual OFF as audited non-regression debt'
          git fetch origin fix/active44-durability-20260915
          test "$(git rev-parse origin/fix/active44-durability-20260915)" = "${{ github.sha }}"
          git push origin HEAD:fix/active44-durability-20260915
