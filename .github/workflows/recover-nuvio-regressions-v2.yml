name: Recover Nuvio regressions v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-nuvio-regressions-v2.yml"
      - ".github/triggers/recover-nuvio-regressions-v2"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply deterministic recovery
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/recover_nuvio_regressions.py

      - name: Run targeted regression tests
        run: |
          python tests/provider_repair_promotion_guard_test.py
          node tests/vf_movie_recovery.test.cjs
          python tests/vf_movie_policy_test.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback

      - name: Run complete repository test suite
        run: npm test

      - name: Regenerate release metadata and validate
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python - <<'PY'
          import json
          from pathlib import Path

          for path in ('manifest.json', 'vf/manifest.json'):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              rows = {str(row.get('id') or '').casefold(): row for row in data.get('scrapers', [])}
              assert rows['goated']['enabled'] is True
              assert rows['goated']['version'] == '1.0.1'
              assert rows['purstream']['enabled'] is True
              assert rows['wookafr']['enabled'] is True
              assert rows['french-manga']['enabled'] is False
              assert rows['voiranime-rip']['enabled'] is False
          report = json.loads(Path('automation/cineby-recovery.json').read_text(encoding='utf-8'))
          assert report['restored'] is False
          assert report['streams_returned'] == 0
          print('Nuvio recovery assertions passed')
          PY

      - name: Publish validated recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provider_worker.cjs scripts/runtime_repair.py scripts/provider_patches/stream_output_sanitizer.py \
            scripts/recover_nuvio_regressions.py tests/provider_repair_promotion_guard_test.py \
            tests/vf_movie_policy_test.py providers manifest.json vf/manifest.json package.json sources.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/cineby-recovery.json
          if git diff --cached --quiet; then
            echo "No validated recovery changes to publish."
            exit 0
          fi
          git commit -m "fix: recover Nuvio provider loading regressions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish after five race-safe attempts" >&2
          exit 1
