name: Temporary field-safety regeneration

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/tmp-field-safety-finalize"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  regenerate:
    name: Rebuild published providers with field-safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reapply durable guards to published artifacts
        run: |
          python3 scripts/reapply_published_overrides.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/runtime_media_safety_guard_test.py

      - name: Run complete regression suite
        run: npm test --ignore-scripts

      - name: Regenerate deterministic release inventories
        run: |
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_published_overrides.py
          python3 scripts/validate_activation_preservation.py
          python3 scripts/validate_language_projection.py
          python3 scripts/validate_release_integrity.py

      - name: Remove temporary trigger and workflow
        run: |
          rm -f .github/triggers/tmp-field-safety-finalize
          rm -f .github/workflows/tmp-field-safety-finalize.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit exact tested regeneration
        run: |
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          echo '--- final status ---'
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish runtime media safety regeneration'
            git push origin HEAD:main
          else
            echo 'regeneration already current'
          fi
