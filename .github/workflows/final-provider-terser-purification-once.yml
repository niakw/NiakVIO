name: NiakVIO final provider Terser purification once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-provider-terser-purification-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: niakvio-final-provider-terser-purification-once
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final Terser publication materialization started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}."

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Make final published-byte purification durable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/reapply_published_overrides.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from provider_engine_normalizer import (\n'
          purification_import = 'from provider_purification import purify_bytes\n'
          if purification_import not in text:
              if import_anchor not in text:
                  raise SystemExit('provider engine import anchor missing')
              text = text.replace(import_anchor, purification_import + import_anchor, 1)

          purification_block = '''        # Final provider bytes are purified only after every Core/provider/runtime\n        # transform. The resulting validated bytes are the ones content-addressed,\n        # referenced by manifests and later proved by Deep/native Labs.\n        purified, purification = purify_bytes(patched)\n        if purification["applied"]:\n            records = list(records) + [{\n                "type": "provider_purification",\n                "phase": "final-post-transform",\n                "revision": 1,\n                "tool": "terser",\n                "tool_version": str(purification.get("toolVersion") or ""),\n                "mangle": False,\n                "conservative_compression": bool(purification.get("conservativeCompression")),\n                "risk_flags": list(purification.get("riskFlags") or []),\n                "source_sha256": purification["sourceSha256"],\n                "output_sha256": purification["candidateSha256"],\n                "bytes_before": purification["bytesBefore"],\n                "bytes_after": purification["bytesAfter"],\n            }]\n        patched = purified\n'''
          changed_anchor = '        changed = patched != original\n'
          if 'purified, purification = purify_bytes(patched)' not in text:
              if changed_anchor not in text:
                  raise SystemExit('published-byte changed anchor missing')
              text = text.replace(changed_anchor, purification_block + changed_anchor, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/provider_purification_contract_test.py')
          test = test_path.read_text(encoding='utf-8')
          reapply_decl = 'reapply = (ROOT / "scripts/reapply_published_overrides.py").read_text(encoding="utf-8")\n'
          if reapply_decl not in test:
              anchor = 'deep = (ROOT / "scripts/run_adaptive_deep_repair.py").read_text(encoding="utf-8")\n'
              if anchor not in test:
                  raise SystemExit('purification contract deep anchor missing')
              test = test.replace(anchor, anchor + reapply_decl, 1)

          contract_marker = '# Published provider bytes must end with the same pinned Terser purification.'
          if contract_marker not in test:
              anchor = '# Native-reader Brain candidates must be purified before they are copied into the\n'
              if anchor not in test:
                  raise SystemExit('native reader purification anchor missing')
              block = '''# Published provider bytes must end with the same pinned Terser purification.\n# No provider/Core/runtime byte transform may happen between purification and the\n# content-addressed digest used by manifests/provenance.\nfor required in (\n    "from provider_purification import purify_bytes",\n    "purified, purification = purify_bytes(patched)",\n    '"phase": "final-post-transform"',\n    '"tool": "terser"',\n    '"mangle": False',\n    "patched = purified",\n):\n    assert required in reapply, required\nassert reapply.index("purified, purification = purify_bytes(patched)") < reapply.index("digest = hashlib.sha256(patched).hexdigest()")\n\n'''
              test = test.replace(anchor, block + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          python -m py_compile scripts/reapply_published_overrides.py
          python tests/provider_purification_contract_test.py

      - name: Prove complete Core publication and Terser fixed point
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:manifest.json > "$RUNNER_TEMP/manifest-before.json"
          python scripts/normalize_core_media_policy.py --apply
          python scripts/apply_runtime_capability_upgrade_v4.py
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before.json"
          python scripts/prune_unreferenced_providers.py
          python scripts/reapply_published_overrides.py --check

          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.provider_purification import purify_bytes

          root = Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          checked = 0
          for row in manifest.get('scrapers', []):
              if not isinstance(row, dict):
                  continue
              relative = str(row.get('filename') or '')
              if not relative.startswith('providers/'):
                  continue
              path = root / relative
              data = path.read_bytes()
              chosen, report = purify_bytes(data)
              if chosen != data:
                  raise SystemExit(f'published provider is not Terser fixed-point: {row.get("id")} {relative} saved={report.get("bytesSaved")}')
              checked += 1
          if checked < 1:
              raise SystemExit('no published provider checked')
          print(f'FIELD_FINAL_TERSER_FIXED_POINT providers={checked} tool=terser version=5.50.0 mangle=false')
          PY
          npm test

      - name: Keep durable code and contract only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/reapply_published_overrides.py "$RUNNER_TEMP/reapply_published_overrides.py"
          cp tests/provider_purification_contract_test.py "$RUNNER_TEMP/provider_purification_contract_test.py"
          git reset --hard HEAD
          git clean -fdx
          cp "$RUNNER_TEMP/reapply_published_overrides.py" scripts/reapply_published_overrides.py
          cp "$RUNNER_TEMP/provider_purification_contract_test.py" tests/provider_purification_contract_test.py
          git rm .github/workflows/final-provider-terser-purification-once.yml
          python -m py_compile scripts/reapply_published_overrides.py
          python tests/provider_purification_contract_test.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/reapply_published_overrides.py tests/provider_purification_contract_test.py
          git commit -m 'core: purify final provider bytes with pinned Terser'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final Terser publication materialization succeeded: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Durable code published; dispatching authoritative final validation."
          gh workflow run final-validation-orchestrator.yml --ref main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final Terser publication materialization FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Inspect this run before changing provider code."
