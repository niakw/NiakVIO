name: TEMP Finalize Purstream Core Policy

on:
  push:
    branches:
      - hotfix/purstream-core-policy-final-20260917

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/purstream-core-policy-final-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize Core policy and rebuild published Core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('scripts/normalize_core_media_policy.py')
          text = policy.read_text(encoding='utf-8')
          old = 'field-safety-v7-stream-scoped-p2p-vod-duration'
          new = 'field-safety-v9-correlated-player-fallback'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale runtime revision anchor, found {text.count(old)}')
          policy.write_text(text.replace(old, new, 1), encoding='utf-8')

          hls = Path('scripts/provider_patches/hls_runtime_integrity_v1.py')
          text = hls.read_text(encoding='utf-8')
          unsafe = [
              '          try{console.warn("[Nuvio HLS integrity] rejected invalid/strict-unknown native media",proof.reason||"invalid",String(stream&&stream.url||"").slice(0,180))}catch(_e){}\n',
              '        try{console.warn("[Nuvio HLS integrity] rejected malformed playlist after bounded recovery",String(stream&&stream.url||"").slice(0,180))}catch(_e){}\n',
          ]
          for line in unsafe:
              if text.count(line) != 1:
                  raise SystemExit('HLS console-sensitive anchor drifted')
              text = text.replace(line, '', 1)
          hls.write_text(text, encoding='utf-8')

          test = Path('tests/core_media_policy_test.py')
          text = test.read_text(encoding='utf-8')
          old = 'assert unsafe.decode("utf-8") in provider_slice\n'
          new = '''provider_owned_tokens = (\n    'function badHost(u){return u.includes("example.com")};',\n    'globalThis.console.log("provider debug");',\n    'globalThis.getStreams=async function(){return []};',\n)\npositions = [provider_slice.find(token) for token in provider_owned_tokens]\nassert all(position >= 0 for position in positions), positions\nassert positions == sorted(positions), positions\n'''
          if text.count(old) != 1:
              raise SystemExit('provider ownership assertion anchor drifted')
          text = text.replace(old, new, 1)

          old = 'b\'var expected="\\xf0\\x9f\\x92\\xa5 MovieBlast \\xe2\\x80\\xa2 1080p VFF \\xe2\\x80\\xa2 raw upstream title";\'\n        b\'if(!r||r.name!==expected||r.title!==expected||r.quality!=="1080p"||r.language!=="VF"||r.format!=="HLS")\'\n'
          new = 'b\'var expected="\\xf0\\x9f\\x92\\xa5 MovieBlast - 1080p";\'\n        b\'if(!r||r.name!==expected||r.title!==expected||r.sourceName!=="1080p VFF"||r.sourceTitle!=="raw upstream title"||r.quality!=="1080p"||r.language!=="VF"||r.format!=="HLS")\'\n'
          if text.count(old) != 1:
              raise SystemExit('stale Branding V17 expectation anchor drifted')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 scripts/normalize_core_media_policy.py --apply
          python3 scripts/reapply_published_overrides.py
          python3 tests/core_media_policy_test.py
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 tests/hls_playback_integrity_test.py
          python3 tests/provider_security_hardening_test.py
          python3 scripts/normalize_published_security_finalization.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 scripts/audit_provider_v3_static.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          git diff --check

          python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = [row[3:] for row in rows if len(row) >= 4]
          if not changed:
              raise SystemExit('expected final Core normalization to change tracked files')
          forbidden = [p for p in changed if p.startswith('.github/')]
          if forbidden:
              raise SystemExit('unexpected generated workflow edits: ' + ', '.join(forbidden))
          allowed_test = {'tests/core_media_policy_test.py'}
          unexpected_tests = [p for p in changed if p.startswith('tests/') and p not in allowed_test]
          if unexpected_tests:
              raise SystemExit('unexpected generated test edits: ' + ', '.join(unexpected_tests))
          required = {
              'scripts/normalize_core_media_policy.py',
              'scripts/provider_patches/hls_runtime_integrity_v1.py',
              'provider-overrides.json',
              'tests/core_media_policy_test.py',
          }
          missing = sorted(required - set(changed))
          if missing:
              raise SystemExit('expected final Core outputs missing: ' + ', '.join(missing))
          print('final Core changed files:')
          for path in changed:
              print(path)
          PY

      - name: Commit normalized policy and rebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add -A
          git commit -m 'fix(core): finalize Purstream and HLS security policy'
          git push origin HEAD:hotfix/purstream-core-policy-final-20260917
