name: TEMP Finalize Purstream Core Policy

on:
  push:
    branches:
      - hotfix/purstream-core-policy-final-20260917

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/purstream-core-policy-final-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Align stale runtime revision contract and normalize policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/normalize_core_media_policy.py')
          text = p.read_text(encoding='utf-8')
          old = 'field-safety-v7-stream-scoped-p2p-vod-duration'
          new = 'field-safety-v9-correlated-player-fallback'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale runtime revision anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/normalize_core_media_policy.py --apply
          python3 tests/core_media_policy_test.py
          python3 tests/runtime_capability_media_safety_v4_test.py
          python3 scripts/normalize_core_media_policy.py --check
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'scripts/normalize_core_media_policy.py',
              'provider-overrides.json',
              'FILE-HASHES.json',
              'PATCH-SHA256SUMS.txt',
              'SHA256SUMS.json',
              'automation/PLATFORM-RUNTIME-CONTRACTS.md',
          }
          rows = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = {row[3:] for row in rows if len(row) >= 4}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected normalization outputs: ' + ', '.join(unexpected))
          required = {'scripts/normalize_core_media_policy.py', 'provider-overrides.json'}
          missing = sorted(required - changed)
          if missing:
              raise SystemExit('expected normalization outputs missing: ' + ', '.join(missing))
          print('normalized files:', ', '.join(sorted(changed)))
          PY

      - name: Commit normalized policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add scripts/normalize_core_media_policy.py provider-overrides.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json automation/PLATFORM-RUNTIME-CONTRACTS.md
          git commit -m 'fix(core): normalize Purstream policy state'
          git push origin HEAD:hotfix/purstream-core-policy-final-20260917
