name: Nuvio TV direct-media identity proof

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-direct-identity-proof

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Record run id
        run: |
          mkdir -p .github/status
          printf '%s\n' "$GITHUB_RUN_ID" > .github/status/tv-direct-identity-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/tv-direct-identity-run
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record direct TV identity run'
            git push origin HEAD:agent/tv-regression-5.20.38
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe exact Breaking Bad direct media without logging URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,tempfile,os
          manifest=json.load(open('manifest.json'))
          wanted=('1shows','vidsrc')
          fixture={'tmdbId':'1396','mediaType':'tv','season':1,'episode':1,'title':'Breaking Bad','year':2008,'label':'Breaking Bad S01E01','category':'tv'}
          results={}
          for provider in wanted:
              row=next((r for r in manifest['scrapers'] if str(r.get('id') or '').casefold()==provider),None)
              if not row: raise SystemExit(f'missing provider {provider}')
              proc=subprocess.run(['node','scripts/nuvio_tv_probe_v2.cjs',row['filename'],json.dumps(fixture,separators=(',',':')),'{}'],capture_output=True,text=True,timeout=90)
              lines=[line for line in proc.stdout.splitlines() if line.strip().startswith('{')]
              if not lines: raise SystemExit(f'{provider}: probe produced no JSON')
              data=json.loads(lines[-1])
              media=[]
              for item in data.get('streams') or []:
                  probe=item.get('media') or {}
                  stream=item.get('row') or {}
                  if not probe.get('playable') or not stream.get('url'): continue
                  headers=stream.get('headers') or {}
                  cmd=['ffprobe','-v','error','-show_entries','format=duration:stream=index,codec_type,codec_name,width,height:stream_tags=language','-of','json']
                  ua=str(headers.get('User-Agent') or 'Mozilla/5.0 (Linux; Android TV) NuvioTV')
                  cmd += ['-user_agent',ua]
                  ref=str(headers.get('Referer') or headers.get('referer') or '')
                  if ref: cmd += ['-referer',ref]
                  cmd += [stream['url']]
                  try:
                      ff=subprocess.run(cmd,capture_output=True,text=True,timeout=45)
                      parsed=json.loads(ff.stdout or '{}') if ff.returncode==0 else {}
                  except Exception as exc:
                      parsed={'error':type(exc).__name__}
                  duration=float((parsed.get('format') or {}).get('duration') or 0)
                  videos=[s for s in parsed.get('streams',[]) if s.get('codec_type')=='video']
                  audios=[s for s in parsed.get('streams',[]) if s.get('codec_type')=='audio']
                  media.append({
                    'duration_seconds':round(duration,1),
                    'video':[{'codec':v.get('codec_name'),'width':v.get('width'),'height':v.get('height')} for v in videos],
                    'audio':[{'codec':a.get('codec_name'),'language':(a.get('tags') or {}).get('language')} for a in audios],
                    'stream_language':stream.get('language'),
                    'stream_title':stream.get('title') or stream.get('name'),
                    'ffprobe_ok':bool(parsed.get('format') or parsed.get('streams')),
                  })
              results[provider]=media
          print(json.dumps(results,ensure_ascii=False,indent=2))
          for provider in wanted:
              rows=results.get(provider) or []
              if not rows: raise SystemExit(f'{provider}: no playable direct media')
              # Breaking Bad S01E01 is a full-length drama episode. Reject short
              # direct-media payloads so an unrelated ~20-25 minute clip cannot
              # pass merely because its MP4 container is valid.
              if not any(r.get('ffprobe_ok') and float(r.get('duration_seconds') or 0)>=1800 for r in rows):
                  raise SystemExit(f'{provider}: no full-length Breaking Bad media proven')
          print('DIRECT_BREAKING_BAD_IDENTITY=1shows,vidsrc')
          PY
