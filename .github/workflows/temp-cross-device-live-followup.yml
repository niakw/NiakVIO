name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Inspect Mugiwara frontend player loader contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.mugiwara-no-streaming.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          PAGE="$BASE/catalogue/hell-mode-the-hardcore-gamer-dominates-in-another-world-with-garbage-balancing/episodes/saison2"
          curl -L --fail --max-time 20 -A "$UA" "$PAGE" -o /tmp/page.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/page.html').read_text(encoding='utf-8',errors='replace')
          urls=[]
          for m in re.finditer(r'(?:src|href)="([^"]+\.js(?:\?[^\"]*)?)"',t):
              u=m.group(1)
              if u.startswith('/'):
                  u='https://www.mugiwara-no-streaming.com'+u
              if u not in urls:
                  urls.append(u)
          Path('/tmp/chunks.txt').write_text('\n'.join(urls)+'\n',encoding='utf-8')
          print('MUGI_CHUNKS',len(urls))
          for u in urls: print(u)
          PY
          mkdir -p /tmp/chunks
          n=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            n=$((n+1))
            curl -L --fail --max-time 15 -A "$UA" "$u" -o "/tmp/chunks/$n.js" || true
          done </tmp/chunks.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          needles=[
            'SCRIPT_URL','EPISODES_OPTIONS','saisonServer','episodeReleases',
            'static.mugiwara-no-streaming.com','/api/','fetch(','vostfr','langToShow',
            'smoothpre','vidmoly','sibnet','voembed','ansembed','iframe','player'
          ]
          for p in sorted(Path('/tmp/chunks').glob('*.js')):
              t=p.read_text(encoding='utf-8',errors='replace')
              interesting=[]
              for needle in needles:
                  hits=[m.start() for m in re.finditer(re.escape(needle),t,re.I)]
                  if hits:
                      interesting.append((needle,hits[:8]))
              if not interesting:
                  continue
              print('MUGI_CHUNK_FILE',p.name,'bytes',len(t),'hits',interesting)
              focus=[]
              for needle,hits in interesting:
                  if needle in {'SCRIPT_URL','EPISODES_OPTIONS','saisonServer','episodeReleases','static.mugiwara-no-streaming.com','/api/','smoothpre','vidmoly','sibnet','voembed','ansembed'}:
                      focus.extend((needle,x) for x in hits[:4])
              for needle,pos in focus[:24]:
                  snip=re.sub(r'\s+',' ',t[max(0,pos-1200):pos+2800])
                  print('MUGI_CHUNK_SNIP',p.name,needle,snip[:4000])
          PY
