name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Locate Mugiwara getStreams chain break
        shell: bash
        run: |
          set -euo pipefail
          MUGI="$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json',encoding='utf-8'))
          for r in d.get('scrapers') or []:
              if str(r.get('id','')).casefold()=='mugiwarastream': print(r.get('filename')); break
          PY
          )"
          python3 - "$MUGI" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8').read()
          needles=[
            'NIAKVIO_PROVIDER_BASE_OWNED_V3',
            'NIAKVIO_MUGIWARASTREAM_PACKED_RUNTIME_V1',
            'NUVIO_GLOBAL_PROVIDER_RUNTIME_DISPATCH_V1',
            'NUVIO_GLOBAL_STREAM_FACTS_V1',
            'NUVIO_GLOBAL_STREAM_IDENTITY_V1',
            'NUVIO_GLOBAL_MEDIA_TYPE_RESOLUTION_V1',
            'NUVIO_GLOBAL_STREAM_PRESENTATION_V1',
            'NUVIO_STREAM_OUTPUT_SANITIZER_ALL_URL_FAIL_CLOSED_V6',
            'NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1',
            'NUVIO_GLOBAL_PROVIDER_BRANDING_V1',
            '/* END NIAKVIO_PROVIDER */',
          ]
          for n in needles: print('CHAIN_MARKER',n,'first',t.find(n),'last',t.rfind(n),'count',t.count(n))
          pats=[r'module\.exports\s*=',r'module\.exports\.getStreams\s*=',r'\.getStreams\s*=\s*wrap',r'o\[k\]\s*=\s*wrap',r'g\.getStreams\s*=']
          for pat in pats:
              rows=[m.start() for m in re.finditer(pat,t)]
              print('CHAIN_ASSIGN',pat,'count',len(rows),'positions',rows[-30:])
          # Show small contexts around assignments after the dispatcher.
          dispatch=t.find('NUVIO_GLOBAL_PROVIDER_RUNTIME_DISPATCH_V1')
          for m in re.finditer(r'(?:module\.exports(?:\.getStreams)?|g\.getStreams|o\[k\])\s*=',t):
              if m.start()>dispatch:
                  ctx=re.sub(r'\s+',' ',t[max(0,m.start()-220):m.start()+420])
                  print('CHAIN_CONTEXT',m.start(),ctx[:700])
          PY
