name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

concurrency:
  group: temp-cross-device-live-followup
  cancel-in-progress: true

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Inspect UHDMovies labeled 4K handoff
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://uhdmovies.my/download-interstellar-2014-dual-audio-hindi-english-2160p-4k-1080p-x264-10bit-remux-hdr-dovi-hevc-bluray-esubs/'
          curl -L --fail --max-time 15 -A 'Mozilla/5.0' "$PAGE" -o /tmp/uhd.html
          LINK="$(python3 - <<'PY'
          import re,html
          text=html.unescape(open('/tmp/uhd.html',encoding='utf-8',errors='replace').read()).replace('\\/','/')
          # Prefer the explicit inline 4k/2160p content link, not ads or generic site navigation.
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',text,re.I):
              href=m.group(1)
              label=re.sub(r'<[^>]+>',' ',m.group(2))
              label=re.sub(r'\s+',' ',label).strip()
              if 'cloud.unblockedgames.world' in href and re.search(r'\b(?:4k|2160p)\b',label,re.I):
                  print(href); break
          PY
          )"
          test -n "$LINK"
          echo "UHD_HANDOFF_URL=$LINK"
          curl -L --max-time 20 -A 'Mozilla/5.0' -e "$PAGE" -D /tmp/handoff.headers -o /tmp/handoff.body -w 'UHD_HANDOFF_FINAL url=%{url_effective} code=%{http_code} type=%{content_type} redirects=%{num_redirects} bytes=%{size_download}\n' "$LINK" || true
          echo '--- HANDOFF HEADERS ---'
          tail -n 80 /tmp/handoff.headers || true
          echo '--- HANDOFF BODY FACTS ---'
          python3 - <<'PY'
          import re,os
          path='/tmp/handoff.body'
          data=open(path,'rb').read(262144) if os.path.exists(path) else b''
          text=data.decode('utf-8','replace')
          print('bytes_sample',len(data))
          print('extm3u',text.lstrip().startswith('#EXTM3U'))
          print('direct_media_tokens',sorted(set(re.findall(r'https?://[^"\'<>\s]+\.(?:m3u8|mpd|mp4|mkv|webm)(?:\?[^"\'<>\s]*)?',text,re.I)))[:10])
          print('hosts',sorted(set(re.findall(r'https?://([^/"\'<>\s]+)',text,re.I)))[:30])
          print('head',re.sub(r'\s+',' ',text[:1800])[:1800])
          PY

      - name: Keep Core quality regression green
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stream_quality_recovery_tv_test.py
          python3 tests/stream_output_sanitizer_fail_closed_test.py
