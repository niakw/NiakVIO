name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Test dispatcher reachability by semantic input type
        shell: bash
        run: |
          set -euo pipefail
          MUGI="$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json',encoding='utf-8'))
          for r in d.get('scrapers') or []:
              if str(r.get('id','')).casefold()=='mugiwarastream': print(r.get('filename')); break
          PY
          )"
          for mode in tv anime object; do
            MODE="$mode" node - "$MUGI" <<'NODE'
          const path=require('node:path');
          const file=path.resolve(process.argv[2]);
          globalThis.fetch=async()=>({ok:false,status:500,url:'https://invalid.local/',headers:{get:()=>''},text:async()=>'',json:async()=>({}),arrayBuffer:async()=>new ArrayBuffer(0)});
          const p=require(file);
          let called=0;
          globalThis.__niakvioProviderRuntimeResolverV1={provider:'sentinel',resolve:async()=>{called++; return [];}};
          const mode=process.env.MODE;
          let args;
          if(mode==='anime') args=['280049','anime',2,11];
          else if(mode==='object') args=[{tmdbId:'280049',mediaType:'anime',type:'anime',season:2,episode:11,title:'Hell Mode'}];
          else args=['280049','tv',2,11];
          Promise.resolve(p.getStreams(...args)).then(rows=>{
            console.log(`MUGI_DISPATCH mode=${mode} called=${called} rows=${Array.isArray(rows)?rows.length:'nonarray'}`);
          }).catch(e=>{console.error(e);process.exitCode=4});
          NODE
          done
