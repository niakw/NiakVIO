name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

concurrency:
  group: temp-cross-device-live-followup
  cancel-in-progress: true

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Test public same-origin Mugiwara lookup session
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.mugiwara-no-streaming.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          curl -L --fail --max-time 15 -A "$UA" -c /tmp/mugi.cookies "$BASE/" -o /tmp/home
          echo 'MUGI_COOKIE_JAR'; sed -E 's/([^\t]+)$/<redacted>/' /tmp/mugi.cookies || true
          enc='Hell%20Mode'
          for route in "/api/suggest/lookup?q=$enc" "/api/search/sources?q=$enc"; do
            curl -L --max-time 15 -A "$UA" -b /tmp/mugi.cookies -c /tmp/mugi.cookies \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: empty' \
              -H 'X-Requested-With: XMLHttpRequest' -e "$BASE/" \
              -D /tmp/headers -o /tmp/body \
              -w "MUGI_SAME_ORIGIN route=$route final=%{url_effective} code=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$BASE$route" || true
            echo 'MUGI_BODY'; head -c 10000 /tmp/body; echo
          done
