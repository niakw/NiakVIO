name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

concurrency:
  group: temp-cross-device-live-followup
  cancel-in-progress: true

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Apply current Mugiwara contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp_fix_mugiwara_discovery_v2.py
          python3 -m py_compile scripts/provider_patches/mugiwarastream_packed_runtime_v1.py
          python3 tests/mugiwarastream_same_origin_discovery_v2_test.py

      - name: Recompose all active providers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py
          python3 tests/global_stream_output_guard_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/stream_quality_recovery_tv_test.py
          python3 tests/stream_output_sanitizer_fail_closed_test.py
          python3 tests/cross_device_user_audit_regression_test.py
          python3 tests/mugiwarastream_same_origin_discovery_v2_test.py

      - name: Live prove Mugiwara E11 and StreamZo 2160p
        shell: bash
        run: |
          set -euo pipefail
          provider_file() {
            python3 - "$1" <<'PY'
          import json,sys
          pid=sys.argv[1].casefold()
          data=json.load(open('manifest.json',encoding='utf-8'))
          for row in data.get('scrapers') or data.get('providers') or []:
              rid=str(row.get('id') or row.get('canonicalId') or row.get('scraper',{}).get('id') or '').casefold()
              if rid==pid:
                  print(row.get('filename') or row.get('file') or row.get('path') or '')
                  raise SystemExit(0)
          raise SystemExit(2)
          PY
          }
          MUGI="$(provider_file mugiwarastream)"
          STREAMZO="$(provider_file streamzo)"
          HELL='{"tmdbId":"280049","mediaType":"anime","type":"anime","title":"Hell Mode","season":2,"episode":11}'
          MOVIE='{"tmdbId":"157336","mediaType":"movie","type":"movie","title":"Interstellar","year":2014}'
          timeout 110s node scripts/nuvio_tv_probe_tmdb_ci.cjs "$MUGI" "$HELL" 2>&1 | tee /tmp/mugi-final.log
          timeout 75s node scripts/nuvio_tv_probe_tmdb_ci.cjs "$STREAMZO" "$MOVIE" 2>&1 | tee /tmp/streamzo-final.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          def payload(path):
              found=None
              for line in Path(path).read_text(encoding='utf-8',errors='replace').splitlines():
                  line=line.strip()
                  if not line.startswith('{'): continue
                  try: row=json.loads(line)
                  except Exception: continue
                  if 'playable_stream_count' in row: found=row
              if found is None: raise SystemExit(f'no probe JSON: {path}')
              return found
          m=payload('/tmp/mugi-final.log'); s=payload('/tmp/streamzo-final.log')
          mf=[str(x.get('url') or '') for x in (m.get('debug') or {}).get('fetches') or []]
          if int(m.get('playable_stream_count') or 0)<1:
              raise SystemExit('Mugiwara S2E11 no playable stream')
          for needle in ['/api/suggest/lookup?','/api/episodes-script/version?','/api/episodes-script?']:
              if not any(needle in u for u in mf): raise SystemExit(f'Mugiwara missing live route {needle}: {mf}')
          if any('/api/search?' in u for u in mf): raise SystemExit(f'Mugiwara stale /api/search executed: {mf}')
          qualities=[str((x.get('row') or {}).get('quality') or '') for x in s.get('streams') or []]
          if int(s.get('playable_stream_count') or 0)<1 or '2160p' not in qualities:
              raise SystemExit(f'StreamZo 2160p recovery missing: {qualities}')
          out={
            'mugiwarastream':{
              'fixture':'Hell Mode S2E11','raw':m.get('raw_stream_count'),'playable':m.get('playable_stream_count'),
              'identityVerified':m.get('identity_verified_count'),'stage':(m.get('debug') or {}).get('stage'),
              'lookupObserved':True,'episodesScriptObserved':True,'staleSearchObserved':False,'fetches':mf,
              'streams':m.get('streams') or [],
            },
            'streamzo':{
              'fixture':'Interstellar','raw':s.get('raw_stream_count'),'playable':s.get('playable_stream_count'),
              'identityVerified':s.get('identity_verified_count'),'qualities':qualities,'stage':(s.get('debug') or {}).get('stage'),
              'streams':s.get('streams') or [],
            }
          }
          Path('/tmp/final-live-proof.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Persist durable repair and proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/evidence/cross-device-20260916
          cp /tmp/final-live-proof.json automation/evidence/cross-device-20260916/final-live-proof.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows/temp-cross-device-live-followup.yml scripts/temp_fix_mugiwara_discovery_v2.py || true
          git diff --cached --stat
          git commit -m 'fix(providers): restore Mugiwara current player path and 2160p recovery'
          git push origin HEAD:fix/cross-device-audit-20260916

      - name: Remove temporary repair drivers
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/temp-cross-device-live-followup.yml scripts/temp_fix_mugiwara_discovery_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: remove completed cross-device repair drivers'
          git push origin HEAD:fix/cross-device-audit-20260916
