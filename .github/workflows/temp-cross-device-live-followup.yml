name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

concurrency:
  group: temp-cross-device-live-followup
  cancel-in-progress: true

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Inspect UHDMovies relative links, forms and buttons
        shell: bash
        run: |
          set -euo pipefail
          URL='https://uhdmovies.my/download-interstellar-2014-dual-audio-hindi-english-2160p-4k-1080p-x264-10bit-remux-hdr-dovi-hevc-bluray-esubs/'
          curl -L --fail --max-time 15 -A 'Mozilla/5.0' "$URL" -o /tmp/uhd.html
          python3 - <<'PY'
          import re,json,html
          text=html.unescape(open('/tmp/uhd.html',encoding='utf-8',errors='replace').read()).replace('\\/','/')
          attrs=[]
          for tag in re.findall(r'<(?:a|form|button|input)[^>]*>',text,re.I):
              row={'tag':re.sub(r'\s+',' ',tag)[:700]}
              for key in ('href','action','data-href','data-url','data-link','onclick','value','id','class'):
                  m=re.search(r'\b'+re.escape(key)+r'\s*=\s*(["\'])(.*?)\1',tag,re.I|re.S)
                  if m: row[key]=m.group(2)[:500]
              if any(re.search(r'download|link|drive|cloud|hub|seed|redirect|btn|server',str(v),re.I) for v in row.values()): attrs.append(row)
          print('UHD_ACTION_TAGS',json.dumps(attrs[:120],ensure_ascii=False))
          for m in re.finditer(r'(?i)(download.{0,500}|links?.{0,500}|button.{0,500})',text):
              snippet=re.sub(r'\s+',' ',m.group(0))
              if re.search(r'href|onclick|data-|form|button',snippet,re.I): print('UHD_SNIPPET',snippet[:1000])
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
              if src not in scripts: scripts.append(src)
          print('UHD_SCRIPTS',json.dumps(scripts[:80],ensure_ascii=False))
          PY

      - name: Check current Core quality fix remains green
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stream_quality_recovery_tv_test.py
          python3 tests/stream_output_sanitizer_fail_closed_test.py
