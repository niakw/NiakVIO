name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Inspect current Mugiwara Hell Mode season payload
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.mugiwara-no-streaming.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          Q='Hell%20Mode%3A%20The%20Hardcore%20Gamer%20Dominates%20in%20Another%20World%20with%20Garbage%20Balancing'
          curl -L --fail --max-time 20 -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: empty' -e "$BASE/" "$BASE/api/suggest/lookup?q=$Q" -o /tmp/lookup.json
          cat /tmp/lookup.json
          SLUG="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/lookup.json'))
          row=(d.get('exact') or ((d.get('results') or [{}])[0]))
          print(row.get('slug') or '')
          PY
          )"
          test -n "$SLUG"
          URL="$BASE/catalogue/$SLUG/episodes/saison2"
          curl -L --fail --max-time 20 -A "$UA" -H 'Accept: text/html,application/xhtml+xml,*/*' -e "$BASE/" "$URL" -o /tmp/page.html
          echo "MUGI_PAGE url=$URL bytes=$(wc -c </tmp/page.html)"
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          t=Path('/tmp/page.html').read_text(encoding='utf-8',errors='replace')
          for needle in ['animeServer','saisons','lang','vostfr','vf','smoothpre','vidmoly','sibnet','voembed','ansembed','iframe','Hell Mode','episode']:
              pos=[m.start() for m in re.finditer(re.escape(needle),t,re.I)]
              print('MUGI_HTML_NEEDLE',needle,'count',len(pos),'first',pos[:8])
              for p in pos[:2]:
                  print('MUGI_HTML_SNIP',needle,re.sub(r'\s+',' ',html.unescape(t[max(0,p-500):p+1800]))[:2400])
          # Decode the Next flight chunks exactly enough to expose server/options shapes.
          marker='self.__next_f.push([1,"'
          chunks=[]; pos=0
          while True:
              start=t.find(marker,pos)
              if start<0: break
              i=start+len(marker); out=[]; esc=False
              while i<len(t):
                  ch=t[i]
                  if esc:
                      if ch=='n': out.append('\n')
                      elif ch=='t': out.append('\t')
                      elif ch=='r': out.append('\r')
                      elif ch=='\\': out.append('\\')
                      elif ch=='"': out.append('"')
                      elif ch=='/': out.append('/')
                      elif ch=='u' and i+4<len(t):
                          try: out.append(chr(int(t[i+1:i+5],16))); i+=4
                          except Exception: out.append(ch)
                      else: out.append(ch)
                      esc=False; i+=1; continue
                  if ch=='\\': esc=True; i+=1; continue
                  if ch=='"' and t[i+1:i+3]=='])': break
                  out.append(ch); i+=1
              chunks.append(''.join(out)); pos=i+1
          allflight=''.join(chunks)
          Path('/tmp/flight.txt').write_text(allflight,encoding='utf-8')
          print('MUGI_FLIGHT bytes',len(allflight),'chunks',len(chunks))
          for needle in ['animeServer','saisons','lang','vostfr','vf','smoothpre','vidmoly','sibnet','voembed','ansembed']:
              hits=[m.start() for m in re.finditer(re.escape(needle),allflight,re.I)]
              print('MUGI_FLIGHT_NEEDLE',needle,'count',len(hits),'first',hits[:12])
              for p in hits[:3]:
                  print('MUGI_FLIGHT_SNIP',needle,re.sub(r'\s+',' ',allflight[max(0,p-600):p+2600])[:3200])
          PY
