name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Prove provider runtime dispatcher reachability through final Core chain
        shell: bash
        run: |
          set -euo pipefail
          MUGI="$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json',encoding='utf-8'))
          for r in d.get('scrapers') or []:
              if str(r.get('id','')).casefold()=='mugiwarastream': print(r.get('filename')); break
          PY
          )"
          node - "$MUGI" <<'NODE'
          const path=require('node:path');
          const file=path.resolve(process.argv[2]);
          globalThis.fetch=async()=>({ok:false,status:500,url:'https://invalid.local/',headers:{get:()=>''},text:async()=>'',arrayBuffer:async()=>new ArrayBuffer(0)});
          const p=require(file);
          let called=0;
          globalThis.__niakvioProviderRuntimeResolverV1={provider:'sentinel',resolve:async()=>{called++; return [];}};
          Promise.resolve(p.getStreams('280049','tv',2,11)).then((rows)=>{
            console.log('MUGI_DISPATCH_SENTINEL called='+called+' rows='+(Array.isArray(rows)?rows.length:'nonarray'));
            if(called<1) process.exitCode=3;
          }).catch((e)=>{console.error(e);process.exitCode=4;});
          NODE
