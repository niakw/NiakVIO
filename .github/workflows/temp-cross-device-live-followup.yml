name: TEMP - Cross Device Live Followup

on:
  push:
    branches: [fix/cross-device-audit-20260916]
    paths:
      - '.github/workflows/temp-cross-device-live-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cross-device-audit-20260916
          fetch-depth: 0

      - name: Dump Mugiwara configured execution authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('provider-overrides.json',encoding='utf-8'))
          r=d['provider_patches']['mugiwarastream']
          keys=['capability','official_site','learned_routes','search_request_plan','searchRequestPlan','provider_value_plan','providerValuePlan','api_recipe','candidate_api_recipe','route_proof','provider_lego_scripts','provider_lego_options']
          for k in keys:
              if k in r: print('MUGI_CONFIG',k,json.dumps(r[k],ensure_ascii=False)[:30000])
          PY

      - name: Inspect generated Mugiwara hook and Core dispatcher
        shell: bash
        run: |
          set -euo pipefail
          MUGI="$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json',encoding='utf-8'))
          for r in d.get('scrapers') or []:
              if str(r.get('id','')).casefold()=='mugiwarastream': print(r.get('filename')); break
          PY
          )"
          echo "MUGI_FILE=$MUGI"
          python3 - "$MUGI" <<'PY'
          import sys
          t=open(sys.argv[1],encoding='utf-8').read()
          for needle in ['NIAKVIO_MUGIWARASTREAM_PACKED_RUNTIME_V1','__niakvioProviderRuntimeResolverV1={provider:"mugiwarastream"','NUVIO_GLOBAL_PROVIDER_RUNTIME_DISPATCH_V1','var hook=null']:
              print('MUGI_SOURCE_MARKER',needle,'count',t.count(needle),'first',t.find(needle))
          PY
          node - "$MUGI" <<'NODE'
          const path=require('node:path');
          const file=path.resolve(process.argv[2]);
          const p=require(file);
          console.log('MUGI_RUNTIME exports',Object.keys(p||{}));
          console.log('MUGI_RUNTIME hook',!!globalThis.__niakvioProviderRuntimeResolverV1,globalThis.__niakvioProviderRuntimeResolverV1?.provider,typeof globalThis.__niakvioProviderRuntimeResolverV1?.resolve);
          console.log('MUGI_RUNTIME dispatch',!!p?.getStreams?.__nuvioProviderRuntimeDispatchV1,!!p?.streams?.__nuvioProviderRuntimeDispatchV1);
          NODE
