name: Temporary clean obsolete Action runs

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/clean-obsolete-action-runs

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete completed runs for temporary and retired workflows only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from collections import Counter

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'niakvio-ci-cleanup',
          }

          retired = {
              '.github/workflows/apply-deep-stream-sampling-v2.yml',
              '.github/workflows/apply-playback-integrity-upgrade.yml',
              '.github/workflows/apply-tv-hardening-5-20-39.yml',
              '.github/workflows/audit-catalogue-media-once.yml',
              '.github/workflows/finalize-source-integrity-once.yml',
              '.github/workflows/make-sync-transactional.yml',
              '.github/workflows/publish-playback-integrity-v2.yml',
              '.github/workflows/query-current-actions-once.yml',
              '.github/workflows/tv-deep-proof-v2.yml',
              '.github/workflows/tv-direct-identity-proof.yml',
              '.github/workflows/tv-purstream-papa-proof.yml',
              '.github/workflows/tv-quality-focus.yml',
              '.github/workflows/tv-reactivation-proof.yml',
              '.github/workflows/tv-regression-focused.yml',
              '.github/workflows/tv-regression-matrix.yml',
              '.github/workflows/tv-repair-candidate.yml',
              '.github/workflows/tv-targeted-deep-quality.yml',
              '.github/workflows/tv-toflix-language-proof.yml',
              '.github/workflows/tv-vf-breaking-bad-matrix.yml',
              '.github/workflows/tv-vf-global-hardening.yml',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {url} -> HTTP {exc.code}: {body[:500]}') from exc

          all_runs = []
          page = 1
          while True:
              payload = request(f'{api}/actions/runs?per_page=100&page={page}')
              rows = payload.get('workflow_runs', []) if isinstance(payload, dict) else []
              if not rows:
                  break
              all_runs.extend(rows)
              if len(rows) < 100:
                  break
              page += 1

          doomed = []
          for run in all_runs:
              if run.get('status') != 'completed':
                  continue
              path = str(run.get('path') or '')
              if path.startswith('.github/workflows/tmp-') or path in retired:
                  doomed.append((int(run['id']), path, str(run.get('conclusion') or '')))

          counts = Counter(path for _, path, _ in doomed)
          print(f'completed obsolete runs selected: {len(doomed)}')
          for path, count in sorted(counts.items()):
              print(f'  {count:3d}  {path}')

          deleted = 0
          for run_id, path, conclusion in doomed:
              request(f'{api}/actions/runs/{run_id}', method='DELETE')
              deleted += 1
              print(f'deleted run={run_id} conclusion={conclusion} path={path}')

          print(f'obsolete Action run cleanup complete: deleted={deleted}')
          PY
