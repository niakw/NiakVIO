name: Purstream hub parsing diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purstream-terminal-resolution-once.yml'

permissions:
  contents: write

concurrency:
  group: purstream-terminal-resolution-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Inspect Purstream hub bytes and resolver candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, ssl, urllib.request
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import resolve_provider_hubs as r

          status, final, doc, headers = r.fetch('https://purstream.wiki/', 15)
          print('FIELD_PURSTREAM_HUB_FETCH', json.dumps({
              'status': status, 'final': final, 'bytes': len(doc),
              'content_type': headers.get('Content-Type') or headers.get('content-type'),
          }, sort_keys=True))
          for needle in ('hs-url-main','hs-url-host-main','https://purstream.id/','purstream.id','fetch(','XMLHttpRequest'):
              pos = doc.find(needle)
              print('FIELD_PURSTREAM_HUB_NEEDLE', json.dumps({'needle': needle, 'pos': pos}, sort_keys=True))
              if pos >= 0:
                  print('FIELD_PURSTREAM_HUB_SNIPPET', json.dumps({'needle': needle, 'snippet': doc[max(0,pos-450):pos+1300]}, ensure_ascii=True))

          cfg = r.merge_hub_registry(r.load_json(r.CONFIG_PATH, {}))['purstream']
          extracted = r.links(doc, final)
          print('FIELD_PURSTREAM_HUB_LINKS', json.dumps([
              {'url': url, 'label': label, 'score': r.candidate_score('purstream', cfg, url, label, index, len(extracted))}
              for url, label, index in extracted
          ], ensure_ascii=False, sort_keys=True))
          candidates, preferred = r.choose_official('purstream', cfg, final, doc)
          print('FIELD_PURSTREAM_HUB_CANDIDATES', json.dumps({'preferred': preferred, 'candidates': candidates}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Remove diagnostic one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/purstream-terminal-resolution-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/purstream-terminal-resolution-once.yml
          git commit -m 'chore: remove Purstream hub diagnostic one-shot'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
