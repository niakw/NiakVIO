name: NiakVIO explicit fresh native validation launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-fresh-validation-temp.yml'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: niakvio-explicit-fresh-native-validation-launcher
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact fresh Android and Desktop native readers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_and_capture() {
            local workflow="$1"
            local started run_id
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$REPO" --ref main >/dev/null
            run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo "$REPO" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done
            test -n "$run_id"
            echo "$run_id"
          }
          ANDROID_RUN="$(dispatch_and_capture native-android-route-reader.yml)"
          DESKTOP_RUN="$(dispatch_and_capture native-desktop-reader-acceptance.yml)"
          gh issue comment 69 --repo "$REPO" --body "Explicit fresh native retry launched after Android HTTPS resolver fix: ANDROID_RUN=${ANDROID_RUN} https://github.com/${REPO}/actions/runs/${ANDROID_RUN} ; DESKTOP_RUN=${DESKTOP_RUN} https://github.com/${REPO}/actions/runs/${DESKTOP_RUN}. These runs are independent proof before the final orchestrator reruns them again."
