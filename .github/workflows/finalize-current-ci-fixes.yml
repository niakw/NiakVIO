name: Finalize current CI fixes

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/fix-current-ci

permissions:
  contents: write

concurrency:
  group: finalize-current-ci-fixes
  cancel-in-progress: false

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Persist contract-safe client advances
        run: |
          python scripts/check_nuvio_client_upstreams.py \
            --apply-safe-advance \
            --output health-output/nuvio-client-upstream-status.json
      - name: Run complete repository regression suite
        run: npm test
      - name: Remove finite finalizer and regenerate exact hashes
        run: |
          rm -f .github/workflows/finalize-current-ci-fixes.yml
          rm -f .github/triggers/fix-current-ci
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit finalized state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/finalize-current-ci-fixes.yml .github/triggers/fix-current-ci
          git add sources.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if git diff --cached --quiet; then
            echo "No finalization changes required"
          else
            git commit -m "chore: finalize current CI fixes"
            git push origin HEAD:main
          fi
      - name: Verify exact published main is deterministic
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --exit-code
