name: Temporary TV playback context proof

on:
  push:
    branches:
      - fix/tv-playback-context-runtime

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validator dependencies
        run: npm ci --ignore-scripts
      - name: Target-media V4/V5 profile regression
        run: python3 tests/streamzo_target_media_profile_test.py
      - name: TV site-player-media playback context
        run: python3 tests/nuvio_tv_target_media_playback_context_test.py
      - name: Cross-platform playback context compatibility
        run: python3 tests/playback_context_compat_test.py
      - name: Runtime media safety regression
        run: python3 tests/runtime_media_safety_guard_test.py
      - name: TV provider hardening regression
        run: python3 tests/tv_provider_hardening_test.py
      - name: Materialize durable provider outputs
        run: |
          python3 scripts/reapply_published_overrides.py
          python3 scripts/prune_unreferenced_providers.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
      - name: Commit generated provider transaction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A providers manifest.json vf/manifest.json PROVENANCE.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json package.json package-lock.json sources.json nuvio-client-id-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Durable provider outputs already current."
            exit 0
          fi
          git commit -m "build: materialize TV playback-context providers"
          git push origin HEAD:fix/tv-playback-context-runtime
