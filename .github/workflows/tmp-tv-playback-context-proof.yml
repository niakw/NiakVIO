name: Temporary TV playback context proof

on:
  push:
    branches:
      - fix/tv-playback-context-runtime

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Target-media V4/V5 profile regression
        run: python3 tests/streamzo_target_media_profile_test.py
      - name: TV site-player-media playback context
        run: python3 tests/nuvio_tv_target_media_playback_context_test.py
      - name: Cross-platform playback context compatibility
        run: python3 tests/playback_context_compat_test.py
      - name: Runtime media safety regression
        run: python3 tests/runtime_media_safety_guard_test.py
      - name: TV provider hardening regression
        run: python3 tests/tv_provider_hardening_test.py
      - name: Durable provider outputs are current
        run: python3 scripts/reapply_published_overrides.py --check
      - name: Release integrity
        run: python3 scripts/validate_release_integrity.py
