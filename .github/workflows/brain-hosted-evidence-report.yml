name: Brain - Read hosted repair evidence

on:
  push:
    branches: [codex/niakvio-brain-reliability]
    paths: [.github/workflows/brain-hosted-evidence-report.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing hosted repair run to inspect, without new inference
        required: true
        default: '39853941550'

permissions:
  actions: read
  contents: write

jobs:
  evidence:
    if: github.ref == 'refs/heads/codex/niakvio-brain-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SOURCE_RUN: ${{ inputs.run_id || '39853941550' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download existing sanitized experiment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hosted-repair-check-${{ inputs.run_id || '39853941550' }}
          run-id: ${{ inputs.run_id || '39853941550' }}
          github-token: ${{ github.token }}
          path: evidence
      - name: Expose verification outcome without repeating generation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          safe = lambda value: re.sub(r'[^a-zA-Z0-9._:-]', '_', str(value))[:160]
          result = json.loads(Path('evidence/evaluation.json').read_text())
          summary = json.loads(Path('evidence/summary.json').read_text())
          lines = []
          for row in result.get('rows', []):
              baseline = row.get('baseline') or {}
              candidate = row.get('candidate') or {}
              line = (
                  f"provider={safe(row.get('provider'))} "
                  f"executed={row.get('executionObserved') is True} "
                  f"accepted={row.get('accepted') is True} "
                  f"reason={safe(row.get('reason'))} "
                  f"error={safe(row.get('error', 'none'))} "
                  f"baseline_playable={int(baseline.get('streamsPlayable') or 0)} "
                  f"candidate_playable={int(candidate.get('streamsPlayable') or 0)}"
              )
              lines.append(line)
              print('::notice title=Hosted verification evidence::' + line)
              for phase, phase_result in (('baseline', baseline), ('candidate', candidate)):
                  statuses = ','.join(str(status) for status in phase_result.get('providerHttpStatuses', []) if isinstance(status, int))
                  print('::notice title=Hosted runtime evidence::' +
                        f"phase={phase} requests={int(phase_result.get('providerRequests') or 0)} " +
                        f"returned={int(phase_result.get('streamsReturned') or 0)} " +
                        f"statuses={statuses or 'none'} failure={safe(phase_result.get('failureClass', ''))}")
          if not lines:
              print('::notice title=Hosted verification evidence::no_candidates_in_existing_run')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      - name: Persist the executed outcome on the diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/niakvio-brain-reliability
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          receipt="automation/hosted-repair-evidence/$SOURCE_RUN.json"
          if [ -f "$receipt" ]; then
            echo "HOSTED_EVIDENCE already_imported=true"
            exit 0
          fi
          python scripts/update_brain_llm_force_memory.py \
            --memory automation/brain-llm-force-memory.json --evaluation evidence/evaluation.json
          mkdir -p automation/hosted-repair-evidence
          cp evidence/summary.json "$receipt"
          git add automation/brain-llm-force-memory.json "$receipt"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "ci(brain): retain hosted experiment $SOURCE_RUN"
          git push origin HEAD:refs/heads/codex/niakvio-brain-reliability
