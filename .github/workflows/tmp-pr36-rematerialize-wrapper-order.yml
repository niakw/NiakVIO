name: Temporary PR36 canonical playback transaction

on:
  push:
    branches:
      - fix/main-native-proof-and-isolation
    paths:
      - ".github/triggers/tmp-pr36-rematerialize-wrapper-order"

permissions:
  contents: write

concurrency:
  group: tmp-pr36-rematerialize-wrapper-order
  cancel-in-progress: true

jobs:
  rematerialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR36 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/main-native-proof-and-isolation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare canonical global playback scheduler
        run: |
          python scripts/tmp_pr36_canonicalize_playback_transaction.py prepare
          sed -i 's/expected = "5.20.57"/expected = "5.20.56"/' scripts/tmp_pr36_canonicalize_playback_transaction.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/provider_patches/hls_runtime_integrity_v1.py')
          text = path.read_text(encoding='utf-8')
          needle = '            + text[insertion:].lstrip()\n        )\n    return text.rstrip() + "\\n" + wrapper\n'
          replacement = '            + text[insertion:].lstrip()\n        ).rstrip() + "\\n"\n    return text.rstrip() + "\\n" + wrapper.rstrip() + "\\n"\n'
          if needle not in text:
              raise SystemExit('canonical HLS EOF insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/apply_provider_overrides.py
          python -m py_compile scripts/provider_patches/global_media_enrichment_v1.py
          python -m py_compile scripts/provider_patches/hls_master_audio_preserver_v1.py
          python -m py_compile scripts/provider_patches/hls_runtime_integrity_v1.py
          python tests/scoped_playback_context_regression_test.py
          python tests/global_playback_integrity_policy_test.py

      - name: Rematerialize exactly once and require zero drift
        run: |
          git show origin/main:manifest.json > /tmp/main-manifest-before-pr36.json
          python scripts/reapply_published_overrides.py
          python scripts/reapply_published_overrides.py --check
          python scripts/tmp_pr36_canonicalize_playback_transaction.py verify-rematerialized
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py

      - name: Apply normal release bump and language projection
        env:
          NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: "1"
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous /tmp/main-manifest-before-pr36.json --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/tmp_pr36_canonicalize_playback_transaction.py verify-release
          python scripts/validate_language_projection.py

      - name: Prune superseded content-addressed provider bundles
        run: |
          python scripts/prune_unreferenced_providers.py --dry-run
          python scripts/prune_unreferenced_providers.py

      - name: Regenerate deterministic release hashes
        run: python scripts/generate_release_hashes.py

      - name: Run complete repository regression suite
        run: npm test --ignore-scripts

      - name: Validate exact generated release
        run: |
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python scripts/tmp_pr36_canonicalize_playback_transaction.py verify-release

      - name: Show deterministic generation delta
        run: |
          git status --short
          git diff --stat

      - name: Commit tested canonical generation
        run: |
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_provider_overrides.py scripts/provider_patches/hls_master_audio_preserver_v1.py scripts/provider_patches/hls_runtime_integrity_v1.py tests/scoped_playback_context_regression_test.py tests/global_playback_integrity_policy_test.py provider-overrides.json
          git add -A providers
          git add manifest.json vf/manifest.json PROVENANCE.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json package.json package-lock.json sources.json nuvio-client-id-state.json
          if [ -f vostfr/manifest.json ]; then git add vostfr/manifest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix: canonicalize global playback wrapper transaction'
            git push origin HEAD:fix/main-native-proof-and-isolation
          else
            echo 'canonical generation already current'
          fi

      - name: Verify pushed branch is exact and zero drift
        run: |
          git fetch origin fix/main-native-proof-and-isolation
          git reset --hard origin/fix/main-native-proof-and-isolation
          python scripts/reapply_published_overrides.py --check
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          sed -i 's/expected = "5.20.57"/expected = "5.20.56"/' scripts/tmp_pr36_canonicalize_playback_transaction.py
          python scripts/tmp_pr36_canonicalize_playback_transaction.py verify-release
