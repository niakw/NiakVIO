name: PR28 real native playback proof

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tv-playback-context-runtime
    paths:
      - ".github/workflows/pr28-native-playback-proof.yml"

permissions:
  contents: read

concurrency:
  group: pr28-real-native-playback-proof
  cancel-in-progress: true

env:
  NUVIO_DESKTOP_SHA: "8977fda639f5791947e6d8b36025635a77aed5da"
  NUVIO_MOBILE_SHA: "0d6e30e4566e6f9f2051d5f80a1e3f1e0fcb1f18"
  NUVIO_TV_SHA: "d95f3fb837b6ddfbf9ff445cdcba2413b576f0d4"

jobs:
  desktop-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: niakvio

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Desktop player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout official NuvioDesktop and inject this exact branch generation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          touch nuvio-desktop/local.properties
          python niakvio/scripts/prepare_native_client_validation.py desktop --workspace "$GITHUB_WORKSPACE"

      - name: Require real Desktop StreamZo HLS
        working-directory: nuvio-desktop
        run: |
          rm -f "$GITHUB_WORKSPACE/desktop-native-results.log"
          ./gradlew :composeApp:desktopTest --tests 'com.nuvio.app.features.plugins.NiakvioFinalNativeDesktopTest' --no-daemon --console=plain
          cat "$GITHUB_WORKSPACE/desktop-native-results.log"
          grep -Eq 'FIELD_DESKTOP_NATIVE provider=streamzo .* count=[1-9][0-9]*' "$GITHUB_WORKSPACE/desktop-native-results.log"
          grep -Eq 'FIELD_DESKTOP_NATIVE_ROW provider=streamzo .* type=hls([[:space:]]|$)' "$GITHUB_WORKSPACE/desktop-native-results.log"
          grep -Fq 'FIELD_DESKTOP_STREAMZO_SENTINEL status=resolved expected=resolved' "$GITHUB_WORKSPACE/desktop-native-results.log"

      - name: Upload Desktop proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr28-native-desktop-${{ github.run_id }}
          path: |
            desktop-native-results.log
            nuvio-desktop/composeApp/build/reports/tests/**
            nuvio-desktop/composeApp/build/test-results/**
          retention-days: 7
          if-no-files-found: warn

  mobile-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: niakvio

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout official Android clients and inject this exact branch generation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          python niakvio/scripts/prepare_native_client_validation.py android --workspace "$GITHUB_WORKSPACE"
          python niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Execute official Mobile PluginRuntime on phone AVD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/pr28_native_mobile_proof.sh"

      - name: Upload Mobile proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr28-native-mobile-${{ github.run_id }}
          path: |
            mobile-final-native-results.log
            nuvio-mobile/composeApp/build/reports/androidTests/**
            nuvio-mobile/composeApp/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  tv-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: niakvio

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout official Android clients and inject this exact branch generation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties
          python niakvio/scripts/prepare_native_client_validation.py android --workspace "$GITHUB_WORKSPACE"
          python niakvio/scripts/harden_nuvio_mobile_device_test.py "$GITHUB_WORKSPACE/nuvio-mobile"

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Execute official NuvioTV PluginRuntime on Android TV AVD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/pr28_native_tv_proof.sh"

      - name: Upload TV proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr28-native-tv-${{ github.run_id }}
          path: |
            tv-final-native-results.log
            nuvio-tv/app/build/reports/androidTests/**
            nuvio-tv/app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
