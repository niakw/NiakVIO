name: Dismiss historical provider CodeQL alerts (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dismiss-historical-provider-alerts-once.yml'

permissions:
  contents: read
  security-events: write

jobs:
  dismiss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dismiss only unreferenced historical provider alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          active = set()
          for manifest_path in (Path("manifest.json"), Path("vf/manifest.json")):
              if not manifest_path.is_file():
                  continue
              payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              for row in payload.get("scrapers") or []:
                  if not isinstance(row, dict):
                      continue
                  value = str(row.get("filename") or "")
                  if value.startswith("../providers/"):
                      value = value[3:]
                  if value.startswith("providers/"):
                      active.add(value)

          provenance = json.loads(Path("PROVENANCE.json").read_text(encoding="utf-8"))
          for row in (provenance.get("providers") or {}).values():
              if not isinstance(row, dict):
                  continue
              value = str(row.get("published_filename") or "")
              if value.startswith("providers/"):
                  active.add(value)

          raw = subprocess.check_output([
              "gh", "api", "--paginate",
              "-H", "Accept: application/vnd.github+json",
              "-H", "X-GitHub-Api-Version: 2022-11-28",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100",
          ], text=True)
          # --paginate emits one JSON array per page.
          decoder = json.JSONDecoder()
          alerts = []
          pos = 0
          while pos < len(raw):
              while pos < len(raw) and raw[pos].isspace():
                  pos += 1
              if pos >= len(raw):
                  break
              page, pos = decoder.raw_decode(raw, pos)
              if isinstance(page, list):
                  alerts.extend(page)

          dismissed = []
          kept = []
          for alert in alerts:
              if not isinstance(alert, dict):
                  continue
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              path = str(location.get("path") or "")
              number = alert.get("number")
              if not path.startswith("providers/"):
                  continue
              if path in active:
                  kept.append((number, path))
                  continue

              body = json.dumps({
                  "state": "dismissed",
                  "dismissed_reason": "won't fix",
                  "dismissed_comment": (
                      "Historical immutable content-addressed provider artifact; "
                      "not referenced by the current manifest or PROVENANCE. "
                      "Current release-reachable provider bundles remain security-gated."
                  ),
              })
              subprocess.run([
                  "gh", "api", "--method", "PATCH",
                  "-H", "Accept: application/vnd.github+json",
                  "-H", "X-GitHub-Api-Version: 2022-11-28",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/code-scanning/alerts/{number}",
                  "--input", "-",
              ], input=body, text=True, check=True, stdout=subprocess.DEVNULL)
              dismissed.append((number, path))

          print(f"FIELD_CODEQL_HISTORICAL_ALERTS dismissed={len(dismissed)} active_kept={len(kept)}")
          for number, path in dismissed:
              print(f"DISMISSED_HISTORICAL_ALERT={number}|{path}")
          for number, path in kept:
              print(f"KEPT_ACTIVE_ALERT={number}|{path}")

          # Specifically guarantee the old Kehflix generation is not left open.
          leftovers = [
              (n, p) for n, p in kept
              if p == "providers/kehflix--nuvio--1496cef7f134dded.js"
          ]
          if leftovers:
              raise SystemExit("historical Kehflix alert was unexpectedly classified active")
          PY
