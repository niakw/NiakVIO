name: WORKBENCH - Priority Hotfix Executor

on:
  push:
    branches: [workbench]
    paths:
      - '.github/workflows/workbench-priority-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Apply canonical TV-year and domain-refresh fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          identity = Path('scripts/provider_patches/global_stream_identity_v1.py')
          text = identity.read_text(encoding='utf-8')
          old_rev = 'cross-client-shared-tmdb-cache-lazy-episode-v7'
          new_rev = 'cross-client-shared-tv-year-soft-v8'
          if old_rev not in text:
              raise SystemExit('identity revision anchor missing')
          text = text.replace(old_rev, new_rev, 1)
          old_req = 'q.title=s(q.title||q.name||q.label);q.year=Number(q.year||0)||0;q.season=Number(q.season||a[2]||0)||0;q.episode=Number(q.episode||a[3]||0)||0;return q}'
          new_req = 'q.title=s(q.title||q.name||q.label);q.year=Number(q.year||0)||0;q.seriesYear=Number(q.seriesYear||q.series_year||q.year||0)||0;q.seasonYear=Number(q.seasonYear||q.season_year||0)||0;q.season=Number(q.season||a[2]||0)||0;q.episode=Number(q.episode||a[3]||0)||0;return q}'
          if old_req not in text:
              raise SystemExit('identity request anchor missing')
          text = text.replace(old_req, new_req, 1)
          old_year = 'if(m.year&&years.length&&!years.some(function(y){return Math.abs(Number(y)-Number(m.year))<=1}))return true;'
          new_year = 'if(!episodic(q)&&m.year&&years.length&&!years.some(function(y){return Math.abs(Number(y)-Number(m.year))<=1}))return true;'
          if old_year not in text:
              raise SystemExit('identity year anchor missing')
          text = text.replace(old_year, new_year, 1)
          identity.write_text(text, encoding='utf-8')

          refresh = Path('scripts/refresh_authoritative_hub_domains.py')
          text = refresh.read_text(encoding='utf-8')
          anchor = '\ndef _update_history_on_change(history_row: dict[str, Any], item: dict[str, Any]) -> None:\n'
          helper = '''\ndef _domain_host(value: str) -> str:\n    raw = str(value or "").strip()\n    if not raw:\n        return ""\n    return hubresolver.host(raw if "://" in raw else "https://" + raw)\n\ndef _reconcile_domain_derivatives(patch: dict[str, Any], before_site: str, next_site: str) -> list[dict[str, str]]:\n    """Keep domain-only derivative fields aligned with the authoritative site.\n\n    Only explicit domain maps and provider-owned manifest URLs are touched.\n    Route/API semantics remain outside Domain Refresh ownership.\n    """\n    changes: list[dict[str, str]] = []\n    before_host = _domain_host(before_site)\n    next_host = _domain_host(next_site)\n    if not next_host:\n        return changes\n\n    maps = []\n    for name in ("domain_substitutions", "replacements", "runtime_domain_replacements"):\n        row = patch.get(name)\n        if isinstance(row, dict):\n            maps.append((name, row))\n\n    # Follow already-known replacement chains as well as the direct old->new hop.\n    edges: dict[str, str] = {}\n    for _name, row in maps:\n        for source, target in row.items():\n            sh, th = _domain_host(source), _domain_host(target)\n            if sh and th:\n                edges[sh] = th\n    if before_host and before_host != next_host:\n        edges[before_host] = next_host\n\n    def canonical(hostname: str) -> str:\n        seen: set[str] = set()\n        current = hostname\n        while current and current not in seen and current in edges:\n            seen.add(current)\n            current = edges[current]\n        return current\n\n    for name, row in maps:\n        for source, target in list(row.items()):\n            th = _domain_host(target)\n            if not th:\n                continue\n            resolved = canonical(th)\n            if resolved == next_host and th != next_host:\n                row[source] = next_host\n                changes.append({"from": str(target), "to": next_host, "kind": name})\n        if before_host and before_host != next_host and name in {"domain_substitutions", "runtime_domain_replacements", "replacements"}:\n            if row.get(before_host) != next_host:\n                row[before_host] = next_host\n                changes.append({"from": before_host, "to": next_host, "kind": name})\n\n    manifest = patch.get("manifest_overrides")\n    if isinstance(manifest, dict):\n        for field in ("logo", "icon", "favicon"):\n            value = manifest.get(field)\n            vh = _domain_host(value)\n            if value and vh and canonical(vh) == next_host and vh != next_host:\n                manifest[field] = str(value).replace(vh, next_host)\n                changes.append({"from": str(value), "to": str(manifest[field]), "kind": f"manifest_overrides.{field}"})\n    return changes\n'''
          if anchor not in text:
              raise SystemExit('refresh helper insertion anchor missing')
          text = text.replace(anchor, helper + anchor, 1)
          old_block = '''                    if next_site and next_site != before_site:\n                        patch["official_site"] = next_site\n                        changes.append({"from": before_site, "to": next_site, "kind": "official_site"})\n                        report["applied"] += 1\n                        _update_history_on_change(history_row, item)\n                    item["applied_changes"] = changes\n'''
          new_block = '''                    if next_site and next_site != before_site:\n                        patch["official_site"] = next_site\n                        changes.append({"from": before_site, "to": next_site, "kind": "official_site"})\n                        report["applied"] += 1\n                        _update_history_on_change(history_row, item)\n                    if next_site:\n                        changes.extend(_reconcile_domain_derivatives(patch, before_site, next_site))\n                    item["applied_changes"] = changes\n'''
          if old_block not in text:
              raise SystemExit('refresh apply anchor missing')
          text = text.replace(old_block, new_block, 1)
          refresh.write_text(text, encoding='utf-8')

          overrides_path = Path('provider-overrides.json')
          data = json.loads(overrides_path.read_text(encoding='utf-8'))
          flemmix = data['provider_patches']['flemmix']
          flemmix['notes'] = [n.replace('flemmix.men', 'flemmix.kim') for n in flemmix.get('notes', [])]
          for key in ('domain_substitutions','replacements','runtime_domain_replacements'):
              row = flemmix.get(key) or {}
              for source, target in list(row.items()):
                  if target == 'flemmix.men':
                      row[source] = 'flemmix.kim'
              row['flemmix.men'] = 'flemmix.kim'
          overrides_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test = Path('tests/priority_tv_year_domain_refresh_test.py')
          test.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport json, sys\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT/'scripts'))\nimport refresh_authoritative_hub_domains as refresh\nidentity=(ROOT/'scripts/provider_patches/global_stream_identity_v1.py').read_text(encoding='utf-8')\nassert 'cross-client-shared-tv-year-soft-v8' in identity\nassert 'q.seriesYear=Number(q.seriesYear||q.series_year||q.year||0)||0' in identity\nassert 'q.seasonYear=Number(q.seasonYear||q.season_year||0)||0' in identity\nassert 'if(!episodic(q)&&m.year&&years.length' in identity\nassert 'if(m.year&&years.length&&!years.some' not in identity\npatch={\n 'official_site':'https://flemmix.kim',\n 'domain_substitutions':{'flemmix.casa':'flemmix.men'},\n 'replacements':{'flemmix.men':'flemmix.kim'},\n 'runtime_domain_replacements':{'flemmix.men':'flemmix.kim'},\n 'manifest_overrides':{'logo':'https://flemmix.men/favicon.ico'},\n}\nchanges=refresh._reconcile_domain_derivatives(patch,'https://flemmix.kim','https://flemmix.kim')\nassert patch['domain_substitutions']['flemmix.casa']=='flemmix.kim', patch\nassert patch['manifest_overrides']['logo']=='https://flemmix.kim/favicon.ico', patch\nassert changes\ndata=json.loads((ROOT/'provider-overrides.json').read_text(encoding='utf-8'))\nf=data['provider_patches']['flemmix']\nassert f['official_site']=='https://flemmix.kim'\nassert all(v!='flemmix.men' for v in f.get('domain_substitutions',{}).values())\nassert f['domain_substitutions'].get('flemmix.men')=='flemmix.kim'\nprint('priority TV-year/domain-refresh regression tests passed')\n''',encoding='utf-8')
          PY
      - name: Run priority regression tests
        run: |
          python tests/priority_tv_year_domain_refresh_test.py
          python tests/authoritative_hub_domain_refresh_test.py
          python tests/domain_refresh_workflow_test.py
          python tests/provider_v3_workflow_ownership_test.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_patches/global_stream_identity_v1.py scripts/refresh_authoritative_hub_domains.py provider-overrides.json tests/priority_tv_year_domain_refresh_test.py
          git commit -m 'fix: separate TV year identity and reconcile refreshed domains'
          git push origin HEAD:workbench
