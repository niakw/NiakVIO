name: TEMP - Fix before Deep once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-before-deep-once.yml'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  fix-and-dispatch-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fix exact pre-Deep blockers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-before-deep-once.yml
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          dns = 'scripts/provider_dns_preflight.mjs'
          replace_once(
              dns,
              '        return await runMeasurement(bodyFactory(String(magic)), remoteConfig);',
              '        const measurement = await runMeasurement(bodyFactory(String(magic)), remoteConfig);\n        return { measurement, locationMagic: String(magic) };',
          )
          replace_once(
              dns,
              '          const measurement = await runAtFirstAvailableLocation((magic) => ({',
              '          const selectedLocation = await runAtFirstAvailableLocation((magic) => ({',
          )
          replace_once(
              dns,
              '          return parseGlobalpingDns(measurement, resolverConfig.name, resolverConfig);',
              '          const dnsResult = parseGlobalpingDns(selectedLocation.measurement, resolverConfig.name, resolverConfig);\n          dnsResult.location_magic = selectedLocation.locationMagic;\n          return dnsResult;',
          )
          replace_once(
              dns,
              "          if (!dnsResult.measurement_id) return { status: 'unreachable', http_status: null, final_host: normalizeHost(host), redirects: [], body_excerpt: '', attempts: [], error: 'GLOBALPING_DNS_MEASUREMENT_MISSING', transport: 'globalping' };",
              "          if (!dnsResult.location_magic) return { status: 'unreachable', http_status: null, final_host: normalizeHost(host), redirects: [], body_excerpt: '', attempts: [], error: 'GLOBALPING_DNS_LOCATION_MISSING', transport: 'globalping' };",
          )
          replace_once(
              dns,
              '            locations: [{ magic: dnsResult.measurement_id }],',
              '            locations: [{ magic: dnsResult.location_magic }],',
          )

          dns_test = 'tests/dns_preflight.test.mjs'
          replace_once(
              dns_test,
              "  assert.equal(dns.measurement_id, 'dns-measurement-sfr');",
              "  assert.equal(dns.measurement_id, 'dns-measurement-sfr');\n  assert.equal(dns.location_magic, 'France+SFR+eyeball');",
          )
          replace_once(
              dns_test,
              "  assert.equal(calls[1].locations[0].magic, 'dns-measurement-sfr');",
              "  assert.equal(calls[1].locations[0].magic, 'France+SFR+eyeball');",
          )

          gate = 'tests/sync_catalogue_audit_gate_test.py'
          p = Path(gate)
          text = p.read_text(encoding='utf-8')
          for obsolete in (
              '    assert "NUVIO_CATALOGUE_AUDIT_OUTPUT: /tmp/catalogue-media-audit.json" in text\n',
              '    assert "NUVIO_CATALOGUE_AUDIT_WORKERS: \'8\'" in text\n',
              '    assert "NUVIO_CATALOGUE_AUDIT_TIMEOUT: \'60\'" in text\n',
          ):
              if obsolete not in text:
                  raise SystemExit(f'{gate}: missing obsolete assertion {obsolete!r}')
              text = text.replace(obsolete, '', 1)
          replacements = {
              '    assert "python scripts/audit_catalogue_identity_media.py" in text\n': '    assert "python scripts/audit_catalogue_media.py" in text\n',
              '    assert \'if [ "${{ needs.stage-and-test.outputs.validation_mode }}" = "deep" ]\' in audit_block\n': '    assert "if: needs.stage-and-test.outputs.validation_mode == \'deep\'" in audit_block\n',
              '    assert "validate_activation_preservation.py" in audit_block\n': '    assert "activation_preservation_core_rehash.py" in audit_block\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'{gate}: expected one occurrence of {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate focused fixes and reseal repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/dns_preflight.test.mjs
          python tests/sync_catalogue_audit_gate_test.py
          python tests/release_version_sync_test.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit fixes and dispatch Deep only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Deep preflight and audit contracts'
          git push origin HEAD:main
          HEAD_SHA=$(git rev-parse HEAD)
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=deep
          RUN_ID=''
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n1 || true)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "DEEP_ONLY_DISPATCH head=${HEAD_SHA} run=${RUN_ID:-pending} quick_rerun=false"
