name: Debug Desktop Purstream media safety reason

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-media-safety-reason.yml"

permissions:
  contents: read

jobs:
  reason:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage diagnostic media-safety Purstream bundle
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          data=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=(root/row["filename"]).read_text(encoding="utf-8")
          hls=text.find("/* NUVIO_HLS_RUNTIME_INTEGRITY_V1:")
          if hls<0:
              raise SystemExit("missing HLS integrity marker")
          text=text[:hls]
          old='var checks=await Promise.all(head.map(function(row){return check(row,expected,tv)}));var kept=head.filter(function(_row,i){return checks[i]&&checks[i].keep}).concat(tail);'
          new='var checks=await Promise.all(head.map(function(row){return check(row,expected,tv)}));var kept=head.map(function(row,i){if(checks[i]&&checks[i].keep)return row;var out=Object.assign({},row),reason=checks[i]&&checks[i].reason?String(checks[i].reason):"unknown";out.name="DEBUG_MS:"+reason;out.title="DEBUG_MS:"+reason;return out}).concat(tail);'
          if text.count(old)!=1:
              raise SystemExit("media-safety decision anchor count="+str(text.count(old)))
          text=text.replace(old,new,1)
          Path("purstream-media-safety-reason.js").write_text(text,encoding="utf-8")
          print("FIELD_DESKTOP_MS_REASON_STAGE path="+row["filename"])
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused reason test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamMediaSafetyReasonTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamMediaSafetyReasonTest {
              @Test
              fun interstellar() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  val rows = PluginRuntime.executePlugin(
                      code = File(workspace, "purstream-media-safety-reason.js").readText(),
                      tmdbId = "157336",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "PURSTREAM",
                  )
                  println("FIELD_DESKTOP_MS_REASON count=" + rows.size + " firstName=" + (rows.firstOrNull()?.name ?: "") + " firstTitle=" + (rows.firstOrNull()?.title ?: ""))
              }
          }
          KOTLIN

      - name: Execute reason probe
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamMediaSafetyReasonTest'             --no-build-cache --no-configuration-cache --console=plain
