name: Temporary reseal and independent Quick validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-quick-reseal-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
      - name: Reseal release and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-quick-reseal-once.yml
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m 'chore: reseal quick validation fix [skip ci]'
          git push origin HEAD:main
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch Quick only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync.yml --ref main -f mode=quick
          for i in $(seq 1 60); do
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sync.yml/runs?event=workflow_dispatch&branch=main&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"${CLEAN_SHA}\") | .id" | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "QUICK_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              gh issue comment 69 --body "Independent Quick rerun after stale quarantine-test fix: SHA \`${CLEAN_SHA}\`, run ${RUN_ID}."
              exit 0
            fi
            sleep 2
          done
          exit 2
      - name: Wait for Quick result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUICK_RUN_ID}" --jq .status)
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUICK_RUN_ID}" --jq '.conclusion // ""')
            if [ "$STATUS" = completed ]; then
              gh issue comment 69 --body "Independent Quick rerun completed: SHA \`${CLEAN_SHA}\`, run ${QUICK_RUN_ID}, conclusion **${CONCLUSION}**."
              test "$CONCLUSION" = success
              exit
            fi
            sleep 20
          done
          exit 3
