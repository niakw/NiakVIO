name: Provider logo fallbacks once

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-provider-logo-fallbacks-once
  cancel-in-progress: false

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0' 'CairoSVG==2.8.2'

      - name: Capture manifest baseline
        shell: bash
        run: cp manifest.json "$RUNNER_TEMP/manifest-before-provider-logo-once.json"

      - name: Rebuild all provider artwork and emoji registry once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_provider_branding_once.py

      - name: Project square native-ready logos into all manifests
        shell: bash
        run: |
          set -euo pipefail
          node engine_v2/scripts/bootstrap-provider-catalog.mjs \
            --general manifest.json \
            --vf vf/manifest.json \
            --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general manifest.json \
            --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/manifest-before-provider-logo-once.json"
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs \
            --general manifest.json \
            --vf vf/manifest.json \
            --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general manifest.json \
            --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/manifest-before-provider-logo-once.json"
          python scripts/prune_unreferenced_providers.py

      - name: Verify complete provider branding migration
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_logo_asset_contract_test.py
          python tests/provider_branding_contract_test.py
          node engine_v2/tests/provider-catalog.test.mjs
          python tests/language_manifest_metadata_consistency_test.py
          python tests/workflow_security_policy_test.py
          python scripts/normalize_core_media_policy.py --check

      - name: Commit regenerated assets and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/refresh_provider_branding_once.py .github/workflows/provider-logo-fallbacks-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'one-shot produced no repository changes' >&2
            exit 1
          fi
          git commit -m 'assets: refresh all provider branding formats'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider branding one-shot completed: every published provider was regenerated to lossless WebP 72x32 + 96x40 + native-ready 96x96, manifest logos now target 96x96, unrecoverable artwork uses a first-character fallback, and emojis are committed one-shot data. Temporary generator/workflow removed."
