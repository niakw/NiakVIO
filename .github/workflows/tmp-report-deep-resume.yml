name: REPORT - Deep resume run once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-report-deep-resume.yml'

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report exact Deep-resume run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'RESUME - Deep evidence and publish' --limit 1 --json databaseId,status,conclusion,headSha,url,createdAt --jq '.[0] | "run=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "-") head=\(.headSha) created=\(.createdAt) url=\(.url)"')"
          test -n "$row"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "DEEP_RESUME_REPORT $row"

      - name: Self-clean reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Remove reporter from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/tmp-report-deep-resume.yml
          git commit -m 'chore: remove Deep resume reporter [skip ci]'
          git push origin HEAD:main
