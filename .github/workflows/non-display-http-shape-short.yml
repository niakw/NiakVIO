name: DIAG - Five Non-Display HTTP Shapes

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/non-display-http-shape-short.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Inspect live page shapes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,re,urllib.parse,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def get(url,method='GET',body=None,referer=None):
            data=body.encode() if isinstance(body,str) else body
            h={'User-Agent':UA,'Accept':'text/html,application/json,*/*','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.7'}
            if referer:h['Referer']=referer
            if method=='POST':h['Content-Type']='application/x-www-form-urlencoded';h['X-Requested-With']='XMLHttpRequest'
            try:
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=12) as r:return r.geturl(),r.read(800000).decode('utf-8','replace')
            except Exception as e:
              print('HTTP_SHAPE_ERROR',url,type(e).__name__,str(e)[:160]);return url,''
          def uniq(xs,n=12):
            out=[]
            for x in xs:
              if x and x not in out:out.append(x)
              if len(out)>=n:break
            return out
          # AnimeSama.co
          b='https://animesama.co';u,h=get(b+'/template-php/defaut/fetch.php','POST','query='+urllib.parse.quote('High School DxD'),b+'/')
          print('SHAPE_ANIMESAMACO',json.dumps({'len':len(h),'animeLinks':uniq(re.findall(r'href=["\']([^"\']*/anime/[^"\']+\.html)',h,re.I),20)},ensure_ascii=False))
          # Coflix movie
          b='https://coflix.wiki';u,h=get(b+'/ajax/search/suggest?keyword='+urllib.parse.quote('Thor'),referer=b+'/')
          try:j=json.loads(h);html=j.get('html') or ''
          except:html=h
          print('SHAPE_COFLIX',json.dumps({'len':len(html),'filmEps':uniq(re.findall(r'href=["\'](?:https?://coflix\.wiki)?(/film/[^"\']+/ep-\d+)',html,re.I),20)},ensure_ascii=False))
          # Neko
          b='https://animes-sama.su';u,h=get(b+'/?s='+urllib.parse.quote('My Hero Academia'),referer=b+'/')
          links=uniq(re.findall(r'href=["\']([^"\']*/anime/[^"\']+)["\']',h,re.I),20)
          print('SHAPE_NEKO_SEARCH',json.dumps({'len':len(h),'links':links},ensure_ascii=False))
          for link in links[:6]:
            url=urllib.parse.urljoin(b,link);_,ph=get(url,referer=b+'/')
            eps=uniq(re.findall(r'href=["\']([^"\']*episode-\d+(?:-saison-\d+)?[^"\']*)',ph,re.I),8)
            if eps: print('SHAPE_NEKO_PAGE',json.dumps({'url':urllib.parse.urlsplit(url).path,'len':len(ph),'eps':eps},ensure_ascii=False));break
          # Sekai
          b='https://sekai.one';_,xml=get(b+'/sitemap.xml',referer=b+'/')
          slugs=[urllib.parse.urlsplit(x).path.strip('/') for x in re.findall(r'<loc>([^<]+)</loc>',xml,re.I)]
          mh=[x for x in slugs if ('hero' in x.lower() or 'academ' in x.lower()) and '.' not in x]
          print('SHAPE_SEKAI_SITEMAP',json.dumps({'len':len(xml),'matches':mh[:12]},ensure_ascii=False))
          for sl in mh[:3]:
            _,ph=get(b+'/'+sl,referer=b+'/')
            atoms=uniq(re.findall(r'(?:episode|episodeHD|episodeFHD|episodeVF|episodeVOSTFR)\s*\[[^\]]+\]\s*=\s*([^;\n]{1,240})',ph,re.I),10)
            atobs=uniq(re.findall(r'atob\(\s*["\']([^"\']+)["\']\s*\)',ph,re.I),6)
            print('SHAPE_SEKAI_PAGE',json.dumps({'slug':sl,'len':len(ph),'assignments':atoms,'atobCount':len(atobs)},ensure_ascii=False))
          # VoirAnime.rip
          b='https://voiranime.rip';_,h=get(b+'/template-php/defaut/fetch.php','POST','query='+urllib.parse.quote('Spy x Family'),b+'/')
          links=uniq(re.findall(r'href=["\']([^"\']+)["\']',h,re.I),30)
          local=[x for x in links if 'spy' in x.lower()]
          print('SHAPE_VOIRANIMERIP_SEARCH',json.dumps({'len':len(h),'spyLinks':local[:20]},ensure_ascii=False))
          for x in local[:6]:
            root=urllib.parse.urljoin(b,x).rstrip('/')
            tests=[root+'/saison-1/episode-1/',root+'-1/saison-1/episode-1/',root+'/episode-1/']
            for t in tests:
              final,ph=get(t,referer=root+'/')
              if len(ph)>1000:
                frames=uniq(re.findall(r'<iframe[^>]+src=["\']([^"\']+)',ph,re.I),8)
                print('SHAPE_VOIRANIMERIP_EP',json.dumps({'path':urllib.parse.urlsplit(final).path,'len':len(ph),'frames':frames},ensure_ascii=False));break
          PY
