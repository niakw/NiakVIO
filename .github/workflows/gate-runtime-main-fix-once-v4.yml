name: Apply runtime gate safety fix on main once v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-runtime-main-fix-once-v4.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Apply runtime sentinel defense and pre-Brain gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Reuse the already-tested v2 patch body, correcting its known duplicate
          # loop anchor exactly as v3 did.
          source_path = Path('.github/workflows/gate-runtime-main-fix-once-v2.yml')
          raw_lines = source_path.read_text(encoding='utf-8').splitlines()
          begin = raw_lines.index("          python3 - <<'PY'") + 1
          end = raw_lines.index('          PY', begin)
          body = [line[10:] if line.startswith('          ') else line for line in raw_lines[begin:end]]
          script = '\n'.join(body) + '\n'
          exec(compile(script, str(source_path) + ':embedded-python', 'exec'), {'__name__': '__main__'})

          # Correct the generated regression block indentation (the functional patch
          # already passed node syntax and the cross-runtime gate suite in v3).
          test = Path('tests/native_reader_brain_repair_test.py')
          lines = test.read_text(encoding='utf-8').splitlines()
          start = next((i for i, line in enumerate(lines) if line == '    if runtime_sentinel:'), -1)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('    path.write_text(')), -1) if start >= 0 else -1
          if start < 0 or end < 0 or lines[start + 1] != '    lines.insert(':
              raise SystemExit('unexpected runtime sentinel regression block')
          for i in range(start + 1, end):
              if lines[i]:
                  lines[i] = '    ' + lines[i]
          test.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # GITHUB_TOKEN cannot publish workflow-file mutations. Keep the permanent
          # workflow byte-identical and put the blocking gate in an existing step
          # that is already guaranteed to execute before Brain materialization.
          import subprocess
          subprocess.run(['git', 'checkout', 'HEAD', '--', '.github/workflows/native-android-route-reader.yml'], check=True)
          subprocess.run(['git', 'checkout', 'HEAD', '--', 'tests/native_corpus_device_lab_test.py'], check=True)

          scope = Path('scripts/scope_native_reader_learning_runtime.py')
          text = scope.read_text(encoding='utf-8')
          if 'FIELD_NATIVE_READER_RUNTIME_PREBRAIN_GATE' not in text:
              text = text.replace(
                  'import json\nimport subprocess\n',
                  'import json\nimport os\nimport subprocess\n',
                  1,
              )
              text = text.replace(
                  'MERGER = ROOT / "scripts" / "merge_native_reader_repair_learning.py"\n',
                  'MERGER = ROOT / "scripts" / "merge_native_reader_repair_learning.py"\nCROSS_RUNTIME_GATE = ROOT / "scripts" / "gate_native_cross_client_runtime.cjs"\n',
                  1,
              )
              anchor = '''def run_filter(args: argparse.Namespace) -> int:
              fingerprint = clean_fingerprint(args.runtime_fingerprint)
          '''
              replacement = '''def gate_representative_runtime_before_learning() -> None:
              """Fail closed on systemic TV/Mobile runtime divergence before Brain repair.

              The canonical Android acceptance downloads both clients' evidence into
              $GITHUB_WORKSPACE/baseline-reader immediately before calling filter mode.
              Other callers without that evidence keep the pure memory-scoping behavior.
              """
              workspace_raw = os.environ.get("GITHUB_WORKSPACE", "").strip()
              if not workspace_raw:
                  return
              baseline = Path(workspace_raw).resolve() / "baseline-reader"
              tv = baseline / "tv"
              mobile = baseline / "mobile"
              if not tv.is_dir() and not mobile.is_dir():
                  return
              if not tv.is_dir() or not mobile.is_dir():
                  raise RuntimeError(
                      f"incomplete pre-Brain runtime evidence: tv={tv.is_dir()} mobile={mobile.is_dir()}"
                  )
              command = [
                  "node",
                  str(CROSS_RUNTIME_GATE),
                  "--dir", str(baseline),
                  "--require-clients", "mobile,tv",
                  "--min-comparisons", "3",
              ]
              process = subprocess.run(command, cwd=ROOT, text=True, capture_output=True)
              if process.stdout:
                  print(process.stdout, end="")
              if process.stderr:
                  print(process.stderr, end="")
              if process.returncode != 0:
                  raise RuntimeError(
                      f"pre-Brain cross-runtime gate failed with exit code {process.returncode}"
                  )
              print("FIELD_NATIVE_READER_RUNTIME_PREBRAIN_GATE status=pass clients=mobile,tv")


def run_filter(args: argparse.Namespace) -> int:
              gate_representative_runtime_before_learning()
              fingerprint = clean_fingerprint(args.runtime_fingerprint)
          '''
              if text.count(anchor) != 1:
                  raise SystemExit('scope runtime filter anchor missing')
              text = text.replace(anchor, replacement, 1)
              scope.write_text(text, encoding='utf-8')

          boundary = Path('tests/native_runtime_brain_boundary_test.py')
          boundary.write_text('''#!/usr/bin/env python3
          from __future__ import annotations

          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCOPE = ROOT / "scripts/scope_native_reader_learning_runtime.py"
          WORKFLOW = ROOT / ".github/workflows/native-android-route-reader.yml"

          scope = SCOPE.read_text(encoding="utf-8")
          workflow = WORKFLOW.read_text(encoding="utf-8")

          for required in (
              "gate_native_cross_client_runtime.cjs",
              "FIELD_NATIVE_READER_RUNTIME_PREBRAIN_GATE",
              '"--require-clients", "mobile,tv"',
              '"--min-comparisons", "3"',
              "incomplete pre-Brain runtime evidence",
          ):
              assert required in scope, required

          scope_call = "scope_native_reader_learning_runtime.py filter"
          brain_step = "Materialize bounded generic Brain mutations across three representative routes"
          assert scope_call in workflow
          assert brain_step in workflow
          assert workflow.index(scope_call) < workflow.index(brain_step)

          # Outside the canonical acceptance workspace, filter mode remains a pure,
          # deterministic memory operation and does not invent missing native evidence.
          with tempfile.TemporaryDirectory(dir=ROOT) as raw:
              temp = Path(raw)
              source = temp / "state.json"
              output = temp / "scoped.json"
              source.write_text(json.dumps({"nativeReaderRepairMemory": {"entries": []}}), encoding="utf-8")
              env = dict(os.environ)
              env.pop("GITHUB_WORKSPACE", None)
              run = subprocess.run([
                  "python3", str(SCOPE), "filter",
                  "--state", str(source),
                  "--runtime-fingerprint", "tv=abc;mobile=def",
                  "--output", str(output),
              ], cwd=ROOT, env=env, text=True, capture_output=True)
              assert run.returncode == 0, run.stdout + run.stderr
              assert output.is_file()

          print("native runtime pre-Brain boundary contract passed")
          '''.replace('          ', ''), encoding='utf-8')
          PY
      - name: Verify all gate safety contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/gate_native_cross_client_runtime.cjs
          node --check engine_v2/scripts/diagnose-native-reader.mjs
          python3 -m py_compile scripts/restage_native_corpus_client.py scripts/scope_native_reader_learning_runtime.py tests/native_reader_brain_repair_test.py tests/native_runtime_brain_boundary_test.py
          python3 tests/native_cross_client_runtime_gate_test.py
          python3 tests/native_reader_brain_repair_test.py
          python3 tests/native_runtime_brain_boundary_test.py
          python3 tests/native_corpus_device_lab_test.py
          python3 tests/native_reader_runtime_bootstrap_test.py
          python3 tests/repository_hygiene_contract_test.py
      - name: Publish verified non-workflow gate fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine_v2/scripts/diagnose-native-reader.mjs \
            scripts/scope_native_reader_learning_runtime.py \
            tests/native_reader_brain_repair_test.py \
            tests/native_runtime_brain_boundary_test.py
          git diff --cached --check
          git commit -m "fix(labs): block runtime divergence before Brain repair"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
