name: One-shot premerge Provider v3 yield census

on:
  push:
    branches:
      - workbench/provider-v3-performance-playback
    paths:
      - .github/workflows/zz-premerge-provider-yield.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench/provider-v3-performance-playback
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe every declared movie TV anime route
        shell: bash
        env:
          NIAKVIO_YIELD_WORKERS: "12"
          NIAKVIO_YIELD_TIMEOUT: "32"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, os, subprocess, time
          from collections import defaultdict
          from pathlib import Path

          root=Path('.')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          corpus=json.loads((root/'.github/triggers/nuvio-client-lab.json').read_text(encoding='utf-8'))
          wanted={'movie':'interstellar','tv':'breaking-bad-s01e01','anime':'jujutsu-kaisen-s01e01'}
          fixtures={row['fixture']['mediaType'].lower(): row['fixture'] for row in corpus['fixtures'] if row.get('slug') in wanted.values()}
          rows=manifest.get('scrapers') or []
          tasks=[]
          for row in rows:
              pid=str(row.get('id') or '').strip()
              filename=str(row.get('filename') or '').strip()
              types={str(x).lower() for x in (row.get('supportedTypes') or [])}
              if not pid or not filename or not (root/filename).is_file():
                  continue
              for kind in ('movie','tv','anime'):
                  if kind in types:
                      tasks.append((pid,filename,kind,fixtures[kind]))
          assert len(rows)==96, len(rows)
          assert len(tasks)==214, len(tasks)

          timeout=int(os.environ.get('NIAKVIO_YIELD_TIMEOUT','32'))
          workers=int(os.environ.get('NIAKVIO_YIELD_WORKERS','12'))
          probe=root/'scripts/nuvio_tv_probe_v2.cjs'

          def one(task):
              pid,filename,kind,fixture=task
              start=time.monotonic()
              try:
                  p=subprocess.run(['node',str(probe),str(root/filename),json.dumps(fixture,separators=(',',':')),'{}'],capture_output=True,text=True,timeout=timeout,check=False)
              except subprocess.TimeoutExpired:
                  return {'provider':pid,'type':kind,'status':'timeout','playable':0,'verified':0,'raw':0,'ms':round((time.monotonic()-start)*1000)}
              obj=None
              for line in reversed(p.stdout.splitlines()):
                  line=line.strip()
                  if line.startswith('{'):
                      try:
                          candidate=json.loads(line)
                      except Exception:
                          continue
                      if isinstance(candidate,dict) and 'playable_stream_count' in candidate:
                          obj=candidate; break
              if obj is None:
                  return {'provider':pid,'type':kind,'status':'invalid','playable':0,'verified':0,'raw':0,'exit':p.returncode,'ms':round((time.monotonic()-start)*1000)}
              playable=int(obj.get('playable_stream_count') or 0)
              verified=int(obj.get('content_verified_count') or obj.get('identity_verified_count') or 0)
              raw=int(obj.get('raw_stream_count') or 0)
              return {'provider':pid,'type':kind,'status':'playable' if playable else ('raw_unplayable' if raw else 'zero'),'playable':playable,'verified':verified,'raw':raw,'runtime_error':bool(obj.get('runtime_error')),'ms':int(obj.get('duration_ms') or round((time.monotonic()-start)*1000))}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              for i,r in enumerate(ex.map(one,tasks),1):
                  results.append(r)
                  print(f"FIELD_PROVIDER_YIELD_PROGRESS done={i}/{len(tasks)} provider={r['provider']} type={r['type']} status={r['status']} playable={r['playable']} verified={r['verified']}")

          productive=sorted({r['provider'] for r in results if r['playable']>0})
          verified=sorted({r['provider'] for r in results if r['verified']>0})
          by_type={}
          for kind in ('movie','tv','anime'):
              subset=[r for r in results if r['type']==kind]
              pids=sorted({r['provider'] for r in subset if r['playable']>0})
              vpids=sorted({r['provider'] for r in subset if r['verified']>0})
              by_type[kind]={'declared':len(subset),'productive':len(pids),'verified':len(vpids),'providers':pids,'verified_providers':vpids}
          report={'schema_version':1,'runtime_sha':'866b9ab396eb9adc076f75aeef2d4f94150784c0','provider_count':96,'route_count':214,'productive_provider_count':len(productive),'verified_provider_count':len(verified),'productive_providers':productive,'verified_providers':verified,'by_type':by_type,'results':results}
          Path('premerge-provider-yield.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(f"FIELD_PROVIDER_YIELD_FINAL providers=96 routes=214 productive={len(productive)} verified={len(verified)} movie={by_type['movie']['productive']}/82 tv={by_type['tv']['productive']}/92 anime={by_type['anime']['productive']}/40")
          PY
      - name: Publish yield summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('premerge-provider-yield.json')
          print('## Premerge Provider v3 yield')
          if not p.is_file():
              print('- report missing'); raise SystemExit(0)
          d=json.loads(p.read_text())
          print(f"- Productive providers: **{d['productive_provider_count']}/96**")
          print(f"- Identity-verified providers: **{d['verified_provider_count']}/96**")
          for k,v in d['by_type'].items(): print(f"- {k}: **{v['productive']}/{v['declared']}** productive")
          print('- Productive: `' + ', '.join(d['productive_providers']) + '`')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: premerge-provider-yield-${{ github.run_id }}
          path: premerge-provider-yield.json
          retention-days: 2
          if-no-files-found: warn
