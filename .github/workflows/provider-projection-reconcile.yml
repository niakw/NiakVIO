name: PROVIDERS - Projection Reconcile

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to reconcile
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/provider-projection-reconcile.json'
      # Durable provider-byte composition inputs must never advance on main
      # without scheduling the transaction that rematerializes their output.
      - 'provider-overrides.json'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/normalize_core_media_policy.py'
      - 'scripts/provider_base_store.py'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/materialize_provider_v3_one.py'
      - 'scripts/provider_materialization_generation.py'
      - 'scripts/reconcile_provider_static_authority.py'
      - 'scripts/reconcile_targeted_provider_publication.py'
      - 'scripts/sanitize_provider_v3_core_metadata_routes.py'
      - 'scripts/domain_refresh_publication_drift_gate.py'
      - 'tests/domain_refresh_publication_drift_gate_test.py'
      - 'scripts/provider_patches/**'
      - '.github/workflows/provider-projection-reconcile.yml'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep latest-wins queueing inside Projection only. GitHub keeps a single
  # pending run per concurrency group, so sharing this group with Domain/Release
  # could silently cancel a different mutation lane before it started.
  group: niakvio-provider-projection-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NUVIO_PROVIDER_V3_CONTEXT: main
      NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '1'
      NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
    steps:
      - name: Checkout exact projection baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact trigger head
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$EXPECTED_SHA" || {
              echo "Manual Projection Reconcile requires expected_sha." >&2
              exit 1
            }
            test "$GITHUB_SHA" = "$EXPECTED_SHA" || {
              echo "FIELD_PROVIDER_PROJECTION_EXPECTED_SHA_MISMATCH expected=$EXPECTED_SHA actual=$GITHUB_SHA" >&2
              exit 1
            }
            echo "FIELD_PROVIDER_PROJECTION_EXPECTED_SHA_OK sha=$GITHUB_SHA"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reject superseded push before expensive reconciliation
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "FIELD_PROVIDER_PROJECTION_SUPERSEDED source=$GITHUB_SHA current=$remote_sha" >&2
            gh workflow run provider-projection-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$remote_sha" || true
            echo "FIELD_PROVIDER_PROJECTION_REQUEUED current=$remote_sha" >&2
            exit 1
          fi

      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare canonical durable static authority
        shell: bash
        run: |
          set -euo pipefail
          # Structured Provider DATA is an input to published provider bytes.
          # Finalize it before detecting byte drift so reconstruction consumes
          # the same authority that the post-publication audit will enforce.
          python scripts/reconcile_provider_static_authority.py --apply
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python scripts/materialize_provider_base_v3_store.py
          python scripts/provider_base_store.py validate
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_static_authority_france_only_test.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          git diff --check
      - name: Detect exact published projection drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/detect_provider_projection_drift.py scripts/materialize_provider_v3_one.py scripts/reconcile_targeted_provider_publication.py scripts/reindex_provider_publication_fingerprints.py
          python tests/provider_projection_drift_detector_test.py
          python tests/publication_contract_fingerprint_test.py
          python tests/provider_publication_fingerprint_union_test.py
          python tests/provider_projection_reconcile_workflow_test.py
          python scripts/detect_provider_projection_drift.py --output "$RUNNER_TEMP/projection-drift.before.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"projection-drift.before.json").read_text())
          providers=sorted({str(x or "").strip().lower() for x in d.get("providers") or [] if str(x or "").strip()})
          durable_base_changes=subprocess.check_output(
              ["git","diff","--name-only","--","PROVENANCE.json","provider-bases/"],
              text=True,
          ).strip().splitlines()
          if durable_base_changes and not providers:
              sys.path.insert(0, "scripts")
              from current_provider_scope import projection_active_provider_ids
              providers=sorted(projection_active_provider_ids())
              if not providers:
                  raise SystemExit("ProviderBase durable store changed but active projection union is empty")
              print("provider_base_forced=true")
          else:
              print("provider_base_forced=false")
          print("count="+str(len(providers)))
          print("providers="+",".join(providers))
          PY
          cat "$RUNNER_TEMP/projection-drift.before.json"

      - name: Rebuild only drifted providers from accepted DATA and Lego
        if: steps.drift.outputs.count != '0'
        shell: bash
        env:
          TARGETS: ${{ steps.drift.outputs.providers }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp provider-overrides.json "$RUNNER_TEMP/provider-overrides.before.json"
          IFS=',' read -r -a providers <<< "$TARGETS"
          reconcile=(python scripts/reconcile_targeted_provider_publication.py)
          processed=0
          require_current_projection_head() {
            git fetch --no-tags origin main >/dev/null 2>&1
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              return 0
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" "$remote_sha" || {
              echo "FIELD_PROVIDER_PROJECTION_SUPERSEDED_DURING_REBUILD source=$GITHUB_SHA current=$remote_sha processed=$processed reason=non_ancestor" >&2
              gh workflow run provider-projection-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$remote_sha" || true
              echo "FIELD_PROVIDER_PROJECTION_REQUEUED current=$remote_sha processed=$processed reason=non_ancestor" >&2
              exit 1
            }
            git diff-tree -r --no-renames --name-only "$GITHUB_SHA" "$remote_sha" > "$RUNNER_TEMP/projection-rebuild-main-drift.paths"
            if python scripts/domain_refresh_publication_drift_gate.py --drift-file "$RUNNER_TEMP/projection-rebuild-main-drift.paths"; then
              echo "FIELD_PROVIDER_PROJECTION_SAFE_DRIFT_DURING_REBUILD source=$GITHUB_SHA current=$remote_sha processed=$processed"
              return 0
            fi
            echo "FIELD_PROVIDER_PROJECTION_SUPERSEDED_DURING_REBUILD source=$GITHUB_SHA current=$remote_sha processed=$processed reason=executable_main_drift" >&2
            gh workflow run provider-projection-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$remote_sha" || true
            echo "FIELD_PROVIDER_PROJECTION_REQUEUED current=$remote_sha processed=$processed reason=executable_main_drift" >&2
            exit 1
          }
          require_current_projection_head
          for provider in "${providers[@]}"; do
            [ -n "$provider" ] || continue
            if [ $((processed % 4)) -eq 0 ]; then
              require_current_projection_head
            fi
            echo "FIELD_PROVIDER_PROJECTION_REBUILD provider=$provider"
            python scripts/materialize_provider_v3_one.py "$provider" --preserve-structured-data
            reconcile+=(--provider "$provider")
            processed=$((processed + 1))
          done
          require_current_projection_head
          "${reconcile[@]}"
          cmp -s provider-overrides.json "$RUNNER_TEMP/provider-overrides.before.json" || {
            echo "Projection reconcile mutated accepted provider-overrides.json." >&2
            git --no-pager diff -- provider-overrides.json >&2 || true
            exit 1
          }
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest.before.json"
          python scripts/generate_hub46_manifest.py \
            --source manifest.json \
            --vf-source vf/manifest.json \
            --output manifest-hub46.json
          python scripts/prune_unreferenced_providers.py

      - name: Prove projection fixed point
        if: steps.drift.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_published_provider_config.py
          # Reconcile rebuilt CONFIG back into durable authority, then apply the
          # generic Core/TMDB/runtime-family sanitizer. These operations must be
          # idempotent here because the same authority was prepared pre-detection.
          python scripts/reconcile_provider_static_authority.py --apply
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python tests/provider_static_authority_france_only_test.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py

          # Fingerprints are derived metadata over the FINAL structured DATA +
          # exact Global+France provider bytes. Reindex only after both settle.
          python scripts/reindex_provider_publication_fingerprints.py
          python tests/provider_publication_fingerprint_union_test.py
          python scripts/detect_provider_projection_drift.py --output "$RUNNER_TEMP/projection-drift.after.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"projection-drift.after.json").read_text())
          assert int(d.get("providerCount") or 0)==0,d
          print("FIELD_PROVIDER_PROJECTION_FIXED_POINT providers=0")
          PY
          python scripts/audit_provider_v3_static.py
          python scripts/reapply_published_overrides.py --check
          python tests/provider_stream_multiplicity_contract_test.py
          python tests/global_core_runtime_ownership_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/provider_js_lego_ownership_test.py
          git diff --check
      - name: Build atomic provider publication
        if: steps.drift.outputs.count != '0'
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add \
            PROVENANCE.json provider-overrides.json provider-v3-materialization.json provider-version-floors.json \
            automation/provider-v3-static-knowledge.json provider-bases/ \
            manifest.json manifest-hub46.json \
            vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            providers/ package.json package-lock.json sources.json provider_catalog.json nuvio-client-id-state.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(PROVENANCE\.json|provider-overrides\.json|provider-v3-materialization\.json|provider-version-floors\.json|automation/provider-v3-static-knowledge\.json|provider-bases/[^/]+|manifest\.json|manifest-hub46\.json|vf/manifest\.json|no-anime/manifest\.json|vf-no-anime/manifest\.json|providers/[^/]+|package\.json|package-lock\.json|sources\.json|provider_catalog\.json|nuvio-client-id-state\.json)$'; then
            echo "Projection reconcile staged a forbidden path." >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo "Projection detector found drift but rebuild produced no publication delta." >&2
            exit 1
          }
          git commit -m "fix(providers): reconcile accepted projection drift"
          PROVIDER_SHA="$(git rev-parse HEAD)"
          echo "provider_sha=$PROVIDER_SHA" >> "$GITHUB_OUTPUT"

          python scripts/build_hub46_native_manifest.py \
            --provider-sha "$PROVIDER_SHA" \
            --source manifest-hub46.json \
            --output native-hub46/manifest.json
          python tests/native_hub46_manifest_test.py
          python tests/native_hub46_transport_manifest_test.py
          python tests/release_projection_scope_test.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python tests/release_hash_scope_test.py

          git add native-hub46/manifest.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git diff --cached --quiet && {
            echo "Projection publication produced no final pin/integrity delta." >&2
            exit 1
          }
          git commit -m "chore(providers): pin reconciled projection publication"

      - name: Publish exact reconciled projection
        if: steps.drift.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not discard validated provider bundles when Brain publishes only evidence.
          # The baseline must be an ancestor; any executable/authority drift is blocked.
          published=false
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            CURRENT_SHA="$(git rev-parse origin/main)"
            if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
              git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_SHA" || {
                echo "FIELD_PROVIDER_PROJECTION_PUBLISH_BLOCKED reason=non_ancestor" >&2
                exit 1
              }
              git diff-tree -r --no-renames --name-only "$GITHUB_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/projection-main-drift.paths"
              python scripts/domain_refresh_publication_drift_gate.py --drift-file "$RUNNER_TEMP/projection-main-drift.paths" || {
                echo "FIELD_PROVIDER_PROJECTION_PUBLISH_BLOCKED reason=executable_main_drift" >&2
                gh workflow run provider-projection-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$CURRENT_SHA" || true
                echo "FIELD_PROVIDER_PROJECTION_REQUEUED current=$CURRENT_SHA reason=executable_main_drift" >&2
                exit 1
              }
              # A merge preserves the exact earlier provider SHA pinned in native-hub46.
              git merge --no-ff --no-edit -m "ci(providers): join safe Brain evidence" origin/main || {
                echo "FIELD_PROVIDER_PROJECTION_PUBLISH_BLOCKED reason=merge_conflict" >&2
                exit 1
              }
              python scripts/generate_release_hashes.py
              python scripts/validate_release_integrity.py
              python tests/release_hash_scope_test.py
              git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
              if ! git diff --cached --quiet; then
                git commit -m "chore(release): rehash merged evidence-only projection"
              fi
              git diff --check
            fi
            if git push origin HEAD:main; then
              published=true
              break
            fi
            echo "FIELD_PROVIDER_PROJECTION_PUBLISH_RETRY attempt=$attempt" >&2
          done
          if [ "$published" != "true" ]; then
            echo "FIELD_PROVIDER_PROJECTION_PUBLISH_BLOCKED reason=retry_exhausted" >&2
            exit 1
          fi
          echo "FIELD_PROVIDER_PROJECTION_PUBLISHED baseline=$GITHUB_SHA final=$(git rev-parse HEAD) providers=${{ steps.drift.outputs.providers }}"

      - name: Reconcile durable static authority at projection fixed point
        if: steps.drift.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail
          # Pre-detection DATA preparation may legitimately leave only durable
          # static/materialization metadata dirty when no active provider bytes
          # depend on the change. Never allow any other no-byte publication.
          changed_before="$(git diff --name-only)"
          if [ -n "$changed_before" ] && printf '%s\n' "$changed_before" | grep -Ev '^(automation/provider-v3-static-knowledge\.json|provider-v3-materialization\.json)$'; then
            echo "Static-authority preparation mutated a forbidden path." >&2
            exit 1
          fi
          python scripts/reconcile_provider_static_authority.py --apply
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python tests/provider_static_authority_france_only_test.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python scripts/audit_provider_v3_static.py
          git diff --check

          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "FIELD_PROVIDER_STATIC_AUTHORITY_FIXED_POINT changed=0"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(automation/provider-v3-static-knowledge\.json|provider-v3-materialization\.json)$'; then
            echo "Static-authority reconciliation mutated a forbidden path." >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/provider-v3-static-knowledge.json provider-v3-materialization.json
          git commit -m "fix(provider-v3): reconcile durable static authority"

          git fetch --no-tags origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "FIELD_PROVIDER_STATIC_AUTHORITY_PUBLISH_BLOCKED reason=main_advanced baseline=$GITHUB_SHA current=$CURRENT_SHA" >&2
            exit 1
          fi
          git push origin HEAD:main
          echo "FIELD_PROVIDER_STATIC_AUTHORITY_PUBLISHED baseline=$GITHUB_SHA final=$(git rev-parse HEAD)"
      - name: Report projection byte no-op
        if: steps.drift.outputs.count == '0'
        run: echo "FIELD_PROVIDER_PROJECTION_RECONCILE drift=0 bytes=noop static_authority=checked"
      - name: Finalize integrity and dispatch exact-head validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Actions-authored pushes do not recursively trigger ordinary push
          # workflows. Projection publication therefore owns explicit exact-head
          # handoff to census, CORE Quick and the final security gate.
          BASE_SHA="$(git rev-parse HEAD)"
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python tests/release_hash_scope_test.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): refresh post-reconcile integrity"
            git fetch origin main
            CURRENT_SHA="$(git rev-parse origin/main)"
            if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
              echo "FIELD_PROVIDER_PROJECTION_VALIDATION_SKIPPED reason=main_advanced baseline=$BASE_SHA current=$CURRENT_SHA"
              exit 1
            fi
            git push origin HEAD:main
          fi

          FINAL_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$FINAL_SHA" ]; then
            echo "FIELD_PROVIDER_PROJECTION_VALIDATION_SKIPPED reason=main_advanced expected=$FINAL_SHA current=$REMOTE_SHA" >&2
            exit 1
          fi
          echo "FIELD_PROVIDER_PROJECTION_VALIDATION_DISPATCH sha=$FINAL_SHA"
          gh workflow run temp-current-bytes-full-provider-census.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$FINAL_SHA" -f materialization_base_sha="$FINAL_SHA"
          gh workflow run github-actions-gate.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$FINAL_SHA"
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f mode=quick -f expected_sha="$FINAL_SHA"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$FINAL_SHA"
          gh workflow run security-final-gate.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$FINAL_SHA"
          # Projection Reconcile can rotate ProviderBase/provider bytes and its
          # bot-authored push does not recursively trigger push workflows. Hand
          # the exact reconciled SHA to the canonical release transaction so
          # reverse rebuild, release seal and five-client Native certification
          # cannot remain bound to the pre-reconcile generation.
          gh workflow run release-finalize.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$FINAL_SHA" -F post_census=true
          echo "FIELD_PROVIDER_PROJECTION_RELEASE_HANDOFF sha=$FINAL_SHA"
