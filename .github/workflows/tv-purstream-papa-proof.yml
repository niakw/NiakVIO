name: Nuvio TV Purstream Papa proof

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/tv-purstream-papa-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build candidates
        run: python scripts/tv_build_candidate_bundles.py
      - name: Purstream Revenant baseline/candidate and duration
        shell: bash
        run: |
          set -u
          BASE=$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(r['filename'] for r in m['scrapers'] if str(r['id']).lower()=='purstream'))
          PY
          )
          FIX='{"tmdbId":"210702","mediaType":"tv","season":1,"episode":1,"title":"Revenant","year":2023}'
          (node scripts/nuvio_tv_probe_v2.cjs "$BASE" "$FIX" '{}' || true) | tail -n 1 > /tmp/base.json
          (node scripts/nuvio_tv_probe_v2.cjs automation/tv-candidates/purstream.js "$FIX" '{}' || true) | tail -n 1 > /tmp/candidate.json
          echo 'PURSTREAM_BASELINE'; cat /tmp/base.json
          echo 'PURSTREAM_BASELINE_DURATION'; python scripts/tv_hls_duration_identity.py /tmp/base.json || true
          echo 'PURSTREAM_CANDIDATE'; cat /tmp/candidate.json
          echo 'PURSTREAM_CANDIDATE_DURATION'; python scripts/tv_hls_duration_identity.py /tmp/candidate.json || true
      - name: PapaDuStream Mushoku anime baseline/candidate
        shell: bash
        run: |
          set -u
          BASE=$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(r['filename'] for r in m['scrapers'] if str(r['id']).lower()=='papadustream'))
          PY
          )
          FIX='{"tmdbId":"94664","mediaType":"anime","season":1,"episode":1,"title":"Mushoku Tensei: Jobless Reincarnation","year":2021}'
          echo 'PAPA_BASELINE_ANIME'
          (node scripts/nuvio_tv_probe_v2.cjs "$BASE" "$FIX" '{}' || true) | tail -n 1
          echo 'PAPA_CANDIDATE_ANIME'
          (node scripts/nuvio_tv_probe_v2.cjs automation/tv-candidates/papadustream.js "$FIX" '{}' || true) | tail -n 1
