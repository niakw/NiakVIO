name: Finalize source integrity once

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/finalize-source-integrity"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synchronize and validate exact source tree
        run: |
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python tests/sync_atomic_publication_test.py
      - name: Commit generated integrity state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if git diff --cached --quiet; then
            echo "Source integrity already current."
            exit 0
          fi
          git commit -m "chore: synchronize source integrity metadata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
