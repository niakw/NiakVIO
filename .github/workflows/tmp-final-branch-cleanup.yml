name: TMP - Final Branch Cleanup

on:
  push:
    paths:
      - '.github/triggers/final-branch-cleanup.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Archive fix branch as immutable tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fix_ref="refs/heads/fix/provider-activation-certification-v1"
          fix_sha="$(git ls-remote origin "$fix_ref" | awk '{print $1}')"
          if [ -n "$fix_sha" ]; then
            tag="archive/fix-provider-activation-certification-v1-20260918"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git tag "$tag" "$fix_sha"
              git push origin "refs/tags/$tag"
            fi
            echo "FIELD_FIX_ARCHIVE sha=$fix_sha tag=$tag"
          else
            echo "FIELD_FIX_ARCHIVE branch_missing=true"
          fi

      - name: Delete fix and every temporary branch
        run: |
          set -euo pipefail
          mapfile -t refs < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')
          deleted=0
          failed=0
          for branch in "${refs[@]}"; do
            case "$branch" in
              tmp/*|fix/provider-activation-certification-v1)
                if git push origin --delete "$branch"; then
                  deleted=$((deleted+1))
                else
                  echo "FAILED $branch" >&2
                  failed=$((failed+1))
                fi
                ;;
            esac
          done
          echo "FIELD_FINAL_BRANCH_CLEANUP deleted=$deleted failed=$failed"
          test "$failed" -eq 0

      - name: Verify only durable branches remain
        run: |
          set -euo pipefail
          mapfile -t refs < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)
          printf '%s\n' "${refs[@]}"
          unexpected=0
          for branch in "${refs[@]}"; do
            case "$branch" in
              main|brain-learning/proposals) ;;
              *) echo "UNEXPECTED_BRANCH $branch" >&2; unexpected=$((unexpected+1));;
            esac
          done
          echo "FIELD_BRANCH_VERIFY count=${#refs[@]} unexpected=$unexpected"
          test "$unexpected" -eq 0
