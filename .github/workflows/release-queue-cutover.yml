name: CORE - Release Queue Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-queue-cutover.yml'

permissions:
  contents: read

concurrency:
  group: niakvio-core-release-mutation-main
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel stale serialized release writers
        run: echo "FIELD_RELEASE_QUEUE_CUTOVER stale_writers_cancelled=true generation=4"
