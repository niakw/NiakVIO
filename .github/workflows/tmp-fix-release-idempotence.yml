name: Fix post-audit release convergence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fix-release-idempotence.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Patch convergence and regression guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sync = Path('.github/workflows/sync.yml')
          text = sync.read_text(encoding='utf-8')

          old = '''          # The audit is allowed to mutate activation state. Re-run the same
          # idempotent finalizer against the original published generation so
          # late quarantine/metadata changes cannot escape provider/global cache
          # invalidation, and cannot double-bump earlier changes.
          python scripts/generate_language_manifests.py
          '''
          new = '''          # The audit may rewrite/quarantine provider artifacts after the first
          # publication finalizer. Converge runtime profiles/overrides again
          # before rebuilding projections/catalog and fingerprinting the exact
          # generation that will be pushed. A clean published checkout must be
          # idempotent under the same override finalizer.
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/prune_unreferenced_providers.py
          python scripts/generate_language_manifests.py
          '''
          if text.count(old) != 1:
              raise SystemExit(f'sync audit anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old_verify = '''          npm test
          node engine_v2/tests/provider-catalog.test.mjs
          '''
          new_verify = '''          # Exact published main must already be a fixed point. Do not let npm
          # pretest be the first command that silently repairs the generation.
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/prune_unreferenced_providers.py
          git diff --exit-code
          npm test
          node engine_v2/tests/provider-catalog.test.mjs
          '''
          if text.count(old_verify) != 1:
              raise SystemExit(f'sync verify anchor count={text.count(old_verify)}')
          sync.write_text(text.replace(old_verify, new_verify, 1), encoding='utf-8')

          test = Path('tests/sync_atomic_publication_test.py')
          body = test.read_text(encoding='utf-8')
          old_test = '''audit = workflow.index("Audit content identity and media", first_activation)
          final_version = workflow.index("python scripts/sync_release_versions.py", audit)
          final_activation = workflow.index("python scripts/validate_activation_preservation.py", final_version)
          final_catalog = workflow.index("node engine_v2/scripts/bootstrap-provider-catalog.mjs", final_activation)
          '''
          new_test = '''audit = workflow.index("Audit content identity and media", first_activation)
          post_audit_profiles = workflow.index("python scripts/build_provider_runtime_profiles.py", audit)
          post_audit_reapply = workflow.index("python scripts/reapply_published_overrides.py", post_audit_profiles)
          post_audit_prune = workflow.index("python scripts/prune_unreferenced_providers.py", post_audit_reapply)
          final_version = workflow.index("python scripts/sync_release_versions.py", post_audit_prune)
          final_activation = workflow.index("python scripts/validate_activation_preservation.py", final_version)
          final_catalog = workflow.index("node engine_v2/scripts/bootstrap-provider-catalog.mjs", final_activation)
          '''
          if body.count(old_test) != 1:
              raise SystemExit(f'atomic test anchor count={body.count(old_test)}')
          body = body.replace(old_test, new_test, 1)
          old_assert = 'assert build < first_version < first_activation < audit < final_version < final_activation < final_catalog < hashes < commit < push < verify\n'
          new_assert = 'assert build < first_version < first_activation < audit < post_audit_profiles < post_audit_reapply < post_audit_prune < final_version < final_activation < final_catalog < hashes < commit < push < verify\n'
          if body.count(old_assert) != 1:
              raise SystemExit(f'atomic ordering anchor count={body.count(old_assert)}')
          body = body.replace(old_assert, new_assert, 1)
          body += '''\nverify_section = workflow[workflow.index("Verify exact published main", push):]\nassert verify_section.index("python scripts/reapply_published_overrides.py") < verify_section.index("npm test")\nassert verify_section.index("git diff --exit-code") < verify_section.index("npm test")\n'''
          test.write_text(body, encoding='utf-8')
          PY

          python tests/sync_atomic_publication_test.py
          python tests/release_version_sync_test.py
          python tests/release_auto_bump_test.py

      - name: Commit tested fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-release-idempotence.yml
          if [ -f .github/workflows/tmp-apply-brain-historical-learning-v2.yml ]; then
            git rm .github/workflows/tmp-apply-brain-historical-learning-v2.yml
          fi
          git add .github/workflows/sync.yml tests/sync_atomic_publication_test.py
          git commit -m 'fix: converge release after catalogue audit'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
