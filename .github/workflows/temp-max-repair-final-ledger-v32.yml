name: TEMP - Max Repair Final Ledger V32
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-final-ledger-v32.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: fix/non-display-recovery-20260916}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Print authoritative residual ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('provider-overrides.json').read_text(encoding='utf-8'))
          rows=d.get('provider_patches') or {}
          residual=[]
          for pid,row in sorted(rows.items()):
              if not isinstance(row,dict): continue
              disp=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {}
              missing=[str(x) for x in disp.get('missingLanes') or []]
              complete=disp.get('completeCapabilityProof')
              quarantined=disp.get('quarantined') is True
              terminal=disp.get('terminalState')
              recovery=disp.get('recoveryStatus')
              if missing or complete is False or quarantined or terminal:
                  item={
                    'id':pid,
                    'published_types':row.get('published_types') or [],
                    'capability':row.get('capability'),
                    'official_site':row.get('official_site') or row.get('known_site'),
                    'required':disp.get('requiredLanes') or [],
                    'proven':disp.get('provenLanes') or [],
                    'verified':disp.get('currentVerifiedLanes') or [],
                    'missing':missing,
                    'complete':complete,
                    'quarantined':quarantined,
                    'terminal':terminal,
                    'recovery':recovery,
                    'reasons':disp.get('reasonCodes') or [],
                  }
                  residual.append(item)
                  print('RESIDUAL',json.dumps(item,ensure_ascii=False,sort_keys=True))
          print('RESIDUAL_COUNT',len(residual))
          print('RESIDUAL_IDS',','.join(x['id'] for x in residual))
          Path('/tmp/residual-ledger.json').write_text(json.dumps(residual,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/global_media_type_resolution_test.py
