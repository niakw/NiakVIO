name: TEMP - Residual Runtime Debug V58

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-runtime-debug-v58.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Probe exact current provider runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, sys
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl
          sys.path.insert(0, str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=50
          wanted={'allwish','animesalt','animesama-co','desiflix','flemmix','moviesmod','mugiwarastream','uhdmovies','voiranime-rip','kehflix'}
          tasks,_=q.build_tasks()
          selected=[t for t in tasks if str(t.get('provider_id') or '').casefold() in wanted]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              rows=list(pool.map(q.run, selected))
          def clean_fetch(v):
              url=str(v.get('url') or '')
              try:
                  u=urlsplit(url)
                  host=str(u.hostname or '').casefold()
                  path=u.path[:220]
                  qkeys=sorted({k for k,_ in parse_qsl(u.query,keep_blank_values=True)})[:20]
              except Exception:
                  host=''; path=url[:220]; qkeys=[]
              err=str(v.get('error') or '')[:160]
              return {'host':host,'path':path,'queryKeys':qkeys,'status':v.get('status'),'error':err or None}
          compact=[]
          for r in sorted(rows,key=lambda x:(str(x.get('provider_id')),str(x.get('semantic_type')))):
              compact.append({
                  'provider':r.get('provider_id'),'type':r.get('semantic_type'),
                  'status':r.get('status'),'stage':r.get('debug_stage'),
                  'raw':r.get('raw'),'playable':r.get('playable'),'verified':r.get('verified'),
                  'contradictions':r.get('contradictions'),'durationMs':r.get('duration_ms'),
                  'model':r.get('debug_model'),
                  'providerFetches':[clean_fetch(v) for v in (r.get('debug_fetches') or []) if isinstance(v,dict) and 'themoviedb.org' not in str(v.get('url') or '')][:20],
                  'providerValueTrace':r.get('debug_provider_value_trace_history_v21') or [],
              })
          seen={str(r.get('provider') or '') for r in compact}
          missing=sorted(wanted-seen)
          if missing:
              raise SystemExit('V58 missing provider tasks: '+','.join(missing))
          out={'schemaVersion':1,'providers':sorted(wanted),'laneCount':len(compact),'rows':compact}
          p=Path('automation/evidence/residual-runtime-debug-v58.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V58_COMPACT',json.dumps(out,sort_keys=True))
          PY
          git diff --check
      - name: Persist runtime blocker evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/evidence/residual-runtime-debug-v58.json
          git commit -m 'test(repair): record residual runtime blocker evidence'
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
