name: TEMP - ZERO6 focused diagnostic

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-zero6-focused-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run focused local/upstream parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,json,sys,tempfile,urllib.request
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p

          providers=['allanime','allwish','anime-ultime','animetsu','fullanime','showbox']
          anime={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          movie={'tmdbId':'157336','mediaType':'movie','title':'Interstellar','year':2014}
          tv={'tmdbId':'94997','mediaType':'tv','title':'House of the Dragon','year':2022,'season':1,'episode':1}
          fixtures={
            'allanime':[anime], 'anime-ultime':[anime], 'animetsu':[anime], 'fullanime':[anime],
            'allwish':[movie,tv], 'showbox':[movie,tv],
          }
          ov=json.loads(Path('provider-overrides.json').read_text()); patches=ov.get('provider_patches') or {}
          for pid in providers:
              x=patches.get(pid) or {}
              print('ZERO6_DATA '+pid+' '+json.dumps({k:x.get(k) for k in ['capability','official_hub','official_site','route_data_state','route_proof_version','learned_routes','api_recipe','candidate_api_recipe','provider_lego_scripts','repair_disposition'] if k in x},ensure_ascii=False,separators=(',',':')))
          local=p.local_catalog()
          td=tempfile.TemporaryDirectory(prefix='zero6-'); root=Path(td.name)
          upstream={}
          for pid in providers:
              url=f'https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/refs/heads/main/providers/{pid}.js'
              path=root/(pid+'.js')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NiakVIO-ZERO6/1'}),timeout=20) as r:path.write_bytes(r.read())
                  upstream[pid]=path
              except Exception as e: print('ZERO6_UPSTREAM_DOWNLOAD '+pid+' '+type(e).__name__+':'+str(e)[:100])
          def one(pid,f,kind):
              ff=dict(f)
              if kind=='upstream' and ff.get('mediaType')=='anime': ff['mediaType']='tv';ff['type']='tv';ff.pop('category',None)
              path=upstream.get(pid) if kind=='upstream' else local[pid]['path']
              if not path:return pid,kind,f.get('mediaType'),{'error':'missing_path'}
              return pid,kind,f.get('mediaType'),p.run_worker(path,ff,35)
          jobs=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for pid in providers:
                  for f in fixtures[pid]:
                      jobs += [ex.submit(one,pid,f,'local'),ex.submit(one,pid,f,'upstream')]
              for fut in concurrent.futures.as_completed(jobs):
                  pid,kind,lane,r=fut.result()
                  out={'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('http_statuses') or [],'accessible':r.get('server_accessible'),'success':r.get('server_success'),'error':r.get('error_class'),'timeout':r.get('timeout')}
                  print('ZERO6_RESULT '+pid+' '+kind+' '+str(lane)+' '+json.dumps(out,separators=(',',':')))
          td.cleanup()
          PY
