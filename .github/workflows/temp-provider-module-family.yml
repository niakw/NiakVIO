name: TEMP - Provider module family

on:
  push:
    branches: [workbench/route-recognition-v6]
    paths:
      - '.github/triggers/provider-module-family.json'

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply recognition compatibility
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_repair_v6.py
          python scripts/upgrade_provider_repair_v7.py
          python scripts/upgrade_provider_route_retry_v1.py
          node --check scripts/provider_worker.cjs
          python -m py_compile scripts/recover_provider_routes_from_upstreams.py
      - name: Recognize previous MODULE_NOT_FOUND family
        run: |
          set -euo pipefail
          python scripts/recover_provider_routes_from_upstreams.py \
            --workers 8 --timeout 55 --attempts 2 \
            --out automation/provider-module-family.json \
            --provider 4khdhub \
            --provider allanime \
            --provider allmovieland \
            --provider anidb \
            --provider animepahe \
            --provider anizone \
            --provider fibwatch \
            --provider hdhub4u \
            --provider hianime \
            --provider movieblast \
            --provider moviesmod \
            --provider mycima \
            --provider showbox \
            --provider streamflix \
            --provider topcartoons \
            --provider vegamovies
      - name: Assert module resolution and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('automation/provider-module-family.json').read_text())
          module_errors=[]
          runtime_errors=[]
          positive=[]
          for row in report.get('providers',[]):
              pid=row.get('providerId')
              if row.get('routes'):
                  positive.append((pid,len(row.get('routes') or [])))
              for task in row.get('tasks') or []:
                  err=str(task.get('error') or '')
                  if 'MODULE_NOT_FOUND' in err:
                      module_errors.append((pid,task.get('fixture')))
                  if task.get('workerStatus') == 'runtime_error':
                      runtime_errors.append((pid,task.get('fixture'),err))
          print('MODULE_FAMILY_SUMMARY providers=%d proven=%d routes=%d runtime_errors=%d module_not_found=%d' % (
              report.get('providerCount',0), report.get('providersWithProvenRoutes',0), report.get('provenRouteCount',0),
              len(runtime_errors), len(module_errors)))
          print('MODULE_FAMILY_POSITIVE', positive)
          if module_errors:
              raise SystemExit('MODULE_NOT_FOUND remains: '+repr(module_errors))
          PY
      - name: Upload module-family proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-module-family-${{ github.run_id }}
          path: automation/provider-module-family.json
          retention-days: 7
