name: Provider Census - Sharded

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Provider scope
        required: true
        default: unresolved
        type: choice
        options:
          - unresolved
          - all
      persist:
        description: Persist validated census as canonical authority
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - PROVIDER - Bulk Onboarding
      - PROVIDERS - Fast Brain Repair
      - LEARN - Brain Repair Lab
    types:
      - completed
  push:
    branches: [main]
    paths:
      - 'scripts/provider_patches/**'
      - 'provider-overrides.json'
      - 'provider-hubs.json'
      - 'scripts/provider_base_store.py'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/materialize_provider_v3_all.py'
      - 'scripts/audit_provider_quick_yield.py'
      - 'scripts/render_provider_census_status.py'
      - 'scripts/classify_provider_authority.py'
      - 'scripts/probe_waf_browser_session.py'
      - 'provider_catalog.json'
      - '.github/triggers/provider-census-sharded.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-census-waf-main
  # Keep an exact bulk-import proof running even if another repair lands.
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.pin.outputs.sha }}
      provider_count: ${{ steps.pin.outputs.provider_count }}
      should_run: ${{ steps.pin.outputs.should_run }}
      census_scope: ${{ steps.pin.outputs.census_scope }}
      shard_count: ${{ steps.pin.outputs.shard_count }}
      shards_json: ${{ steps.pin.outputs.shards_json }}
      target_providers: ${{ steps.pin.outputs.target_providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Push-triggered census must pin the exact trigger commit. Checking
          # out moving main here can silently lose an explicit trigger when
          # another persistence commit lands before prepare starts.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - name: Validate sharded census persistence contract
        run: |
          python tests/provider_census_sharded_persistence_contract_test.py
          python tests/provider_quick_yield_provider_budget_test.py

      - id: pin
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          count="$(python - <<'PY'
          import json
          d=json.load(open("manifest.json", encoding="utf-8"))
          print(len([x for x in d.get("scrapers") or [] if isinstance(x,dict)]))
          PY
          )"
          echo "provider_count=$count" >> "$GITHUB_OUTPUT"
          head_message="$(git log -1 --pretty=%s)"
          changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD | tr '\n' ' ')"
          explicit_trigger=false
          census_scope="unresolved"
          target_providers=""
          if [[ " $changed_paths " == *" .github/triggers/provider-census-sharded.json "* ]]; then
            explicit_trigger=true
            trigger_scope="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".github/triggers/provider-census-sharded.json")
          try:
              value=str(json.loads(p.read_text(encoding="utf-8")).get("scope") or "unresolved").strip().lower()
          except Exception:
              value="unresolved"
          print(value if value in {"all","unresolved"} else "unresolved")
          PY
            )"
            census_scope="$trigger_scope"
            target_providers="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".github/triggers/provider-census-sharded.json")
          try:
              d=json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              d={}
          rows=[]
          seen=set()
          for value in d.get("targetProviders") or []:
              provider=str(value or "").strip().lower().replace("_","-")
              if provider and provider not in seen:
                  seen.add(provider); rows.append(provider)
          print(",".join(rows))
          PY
            )"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            census_scope="${{ inputs.scope }}"
          fi
          echo "census_scope=$census_scope" >> "$GITHUB_OUTPUT"
          echo "target_providers=$target_providers" >> "$GITHUB_OUTPUT"
          if [ -n "$target_providers" ]; then
            target_count="$(python -c 'import sys; print(len([x for x in sys.argv[1].split(",") if x]))' "$target_providers")"
            if [ "$target_count" -le 4 ]; then shard_count=1; else shard_count=2; fi
          elif [ "$census_scope" = "all" ]; then
            shard_count=8
          else
            shard_count=4
          fi
          shards_json="$(python -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1]))),separators=(",",":")))' "$shard_count")"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          echo "shards_json=$shards_json" >> "$GITHUB_OUTPUT"
          echo "FIELD_SHARDED_CENSUS_PARTITION scope=$census_scope targets=${target_providers:-none} shard_count=$shard_count"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$count" -gt 120 ] || [[ "$head_message" == provider:\ bulk\ activate\ * ]] || [ "$explicit_trigger" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "FIELD_SHARDED_CENSUS_PREPARE should_run=true explicit_trigger=$explicit_trigger provider_count=$count"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "FIELD_SHARDED_CENSUS_PREPARE should_run=false explicit_trigger=$explicit_trigger provider_count=$count"
          fi

  shard:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    name: Census shard ${{ matrix.shard }} of ${{ needs.prepare.outputs.shard_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards_json) }}
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_WORKERS: '20'
      NIAKVIO_QUICK_YIELD_TIMEOUT: '60'
      NIAKVIO_QUICK_YIELD_PROVIDER_BUDGET: '90'
      NIAKVIO_QUICK_YIELD_MAX_SAMPLES: '8'
      CENSUS_SCOPE: ${{ needs.prepare.outputs.census_scope }}
      HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
      TARGET_PROVIDERS: ${{ needs.prepare.outputs.target_providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize exact current provider bytes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_provider_base_v3_store.py
          if [ -n "$TARGET_PROVIDERS" ]; then
            IFS=',' read -r -a target_rows <<< "$TARGET_PROVIDERS"
            for provider in "${target_rows[@]}"; do
              provider="$(printf '%s' "$provider" | xargs)"
              [ -z "$provider" ] && continue
              python scripts/reconcile_provider_domain_metadata.py --rebuild --provider "$provider"
              python scripts/materialize_provider_v3_one.py "$provider"
            done
            echo "FIELD_SHARDED_TARGET_MATERIALIZATION providers=$TARGET_PROVIDERS mode=targeted"
          else
            python scripts/reconcile_provider_domain_metadata.py --rebuild
            python scripts/materialize_provider_v3_all.py
            echo "FIELD_SHARDED_TARGET_MATERIALIZATION providers=all mode=global"
          fi
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_published_provider_config.py

      - name: Run deterministic provider shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          args=(
            --scope "$CENSUS_SCOPE"
            --status-file automation/provider-census-status.json
            --history automation/provider-census-proof-history.json
            --shard-count "${{ needs.prepare.outputs.shard_count }}"
            --shard-index "${{ matrix.shard }}"
            --output "automation/provider-census-shard-${{ matrix.shard }}.json"
          )
          if [ -n "$TARGET_PROVIDERS" ]; then
            args+=(--provider "$TARGET_PROVIDERS")
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$HEAD_MESSAGE" == provider:\ bulk\ activate\ * ]]; then
            providers="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("automation/provider-bulk-activation-latest.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print(",".join(str(x) for x in d.get("activatedProviders") or [] if str(x)))
          PY
            )"
            test -n "$providers"
            args+=(--provider "$providers")
          fi
          python scripts/audit_provider_quick_yield.py "${args[@]}"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-census-shard-${{ matrix.shard }}
          path: automation/provider-census-shard-${{ matrix.shard }}.json
          retention-days: 8
          if-no-files-found: error

  merge:
    name: Merge provider shards
    needs:
      - prepare
      - shard
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Download all shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: provider-census-shard-*
          path: shards
          merge-multiple: true

      - name: Merge, classify and build repair batches
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find shards -maxdepth 1 -type f -name 'provider-census-shard-*.json' | sort -V)
          expected="${{ needs.prepare.outputs.shard_count }}"
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "Expected $expected shard reports, found ${#files[@]}" >&2
            exit 1
          fi
          python scripts/merge_provider_census_shards.py "${files[@]}" \
            --output automation/provider-census-sharded-merged.json
          python scripts/update_provider_census_proof_history.py automation/provider-census-sharded-merged.json \
            --history automation/provider-census-proof-history.json \
            --run-id "${GITHUB_RUN_ID}" \
            --sha "$SOURCE_SHA"

          python scripts/classify_provider_authority.py

          # Provisional status supplies current lane/runtime classifications to
          # the bounded WAF diagnostic. Final status is rendered afterwards.
          python scripts/render_provider_census_status.py automation/provider-census-sharded-merged.json \
            --output automation/PROVIDER-CENSUS-SHARDED.md \
            --json-output automation/provider-census-sharded-status.json \
            --history automation/provider-census-proof-history.json \
            --baseline-status automation/provider-census-status.json \
            --authority-status automation/provider-authority-status.json \
            --run-id "${GITHUB_RUN_ID}" \
            --sha "$SOURCE_SHA"

          python scripts/probe_waf_browser_session.py automation/provider-census-sharded-merged.json \
            --output automation/provider-waf-browser-session-sharded.json \
            --status automation/provider-census-sharded-status.json \
            --overrides provider-overrides.json \
            --network-report automation/provider-census-sharded-merged.json \
            --timeout 20 --virtual-time-ms 7000 --workers 3 --max-targets 16

          # Merge persisted representative/private-exit WAF evidence BEFORE final
          # classification. A fresh GitHub-hosted challenge must not erase
          # stronger current transport proof already gathered by the harness lane.
          if [ -s automation/provider-waf-browser-session-latest.json ]; then
            python scripts/merge_waf_latest_evidence.py \
              --previous automation/provider-waf-browser-session-latest.json \
              --current automation/provider-waf-browser-session-sharded.json \
              --output automation/provider-waf-browser-session-effective.json
          else
            cp automation/provider-waf-browser-session-sharded.json automation/provider-waf-browser-session-effective.json
          fi

          python scripts/render_provider_census_status.py automation/provider-census-sharded-merged.json \
            --output automation/PROVIDER-CENSUS-SHARDED.md \
            --json-output automation/provider-census-sharded-status.json \
            --history automation/provider-census-proof-history.json \
            --baseline-status automation/provider-census-status.json \
            --waf-browser-evidence automation/provider-waf-browser-session-effective.json \
            --authority-status automation/provider-authority-status.json \
            --run-id "${GITHUB_RUN_ID}" \
            --sha "$SOURCE_SHA"

          python scripts/merge_waf_census_transport.py \
            --status automation/provider-census-sharded-status.json \
            --waf automation/provider-waf-browser-session-effective.json \
            --authority-status automation/provider-authority-status.json \
            --output /tmp/provider-census-sharded-status-waf.json \
            --run-id "${GITHUB_RUN_ID}-sharded-waf" \
            --sha "$SOURCE_SHA"
          mv /tmp/provider-census-sharded-status-waf.json automation/provider-census-sharded-status.json
          python scripts/render_provider_census_status_from_state.py \
            --status automation/provider-census-sharded-status.json \
            --output automation/PROVIDER-CENSUS-SHARDED.md

          batch_args=(python scripts/build_provider_repair_batch_plan.py
            --status automation/provider-census-sharded-status.json
            --sharded-census automation/provider-census-sharded-merged.json
            --overrides provider-overrides.json
            --output automation/provider-repair-batch-plan-sharded.json)
          if [ -s automation/provider-census-sharded-latest.json ]; then
            batch_args+=(--fallback-sharded-census automation/provider-census-sharded-latest.json)
          fi
          "${batch_args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("automation/provider-census-sharded-status.json").read_text())
          rows=[x for x in s.get("providers") or [] if isinstance(x,dict)]
          full=sorted(str(x.get("provider") or "") for x in rows if x.get("status")=="FULL OK")
          partial=sorted(str(x.get("provider") or "") for x in rows if x.get("status")=="PARTIAL OK")
          payload={
              "schemaVersion":1,
              "runId":s.get("runId"),
              "triggerSha":s.get("triggerSha"),
              "providerCount":len(rows),
              "fullOkCount":len(full),
              "partialOkCount":len(partial),
              "operationalOkCount":len(full)+len(partial),
              "fullOkProviders":full,
              "partialOkProviders":partial,
              "brainQueue":s.get("brainQueue") or [],
              "statusCounts":s.get("counts") or {},
              "executionModel":"8-shard-horizontal-census",
          }
          Path("automation/provider-census-sharded-summary.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload merged census
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-census-sharded-merged
          path: |
            automation/provider-census-sharded-merged.json
            automation/provider-census-sharded-status.json
            automation/provider-census-sharded-summary.json
            automation/provider-repair-batch-plan-sharded.json
            automation/provider-census-proof-history.json
            automation/provider-authority-status.json
            automation/provider-waf-browser-session-sharded.json
            automation/provider-waf-browser-session-effective.json
            automation/PROVIDER-CENSUS-SHARDED.md
          retention-days: 8
          if-no-files-found: error

      - name: Persist canonical evidence after bulk onboarding
        id: persist
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.persist == true }}
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CENSUS_SCOPE: ${{ needs.prepare.outputs.census_scope }}
        run: |
          set -euo pipefail
          run_id="$GITHUB_RUN_ID"
          cp automation/provider-census-sharded-merged.json /tmp/provider-census-sharded.json
          cp automation/provider-census-sharded-status.json /tmp/provider-census-status.json
          if ! python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("/tmp/provider-census-status.json").read_text())
          rows=[row for row in state.get("providers") or [] if isinstance(row,dict)]
          assert int(state.get("schemaVersion") or 0) >= 3
          assert rows
          assert all("authorityRepairEligible" in row and "authorityAction" in row for row in rows)
          PY
          then
            echo "FIELD_SHARDED_CENSUS_NOT_PERSISTED authority_schema_v3_required"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp automation/provider-census-sharded-summary.json /tmp/provider-census-sharded-summary.json
          cp automation/provider-repair-batch-plan-sharded.json /tmp/provider-repair-batch-plan.json
          cp automation/provider-census-proof-history.json /tmp/provider-census-proof-history.json
          cp automation/provider-authority-status.json /tmp/provider-authority-status.json
          cp automation/provider-waf-browser-session-sharded.json /tmp/provider-waf-browser-session-sharded.json
          cp automation/PROVIDER-CENSUS-SHARDED.md /tmp/PROVIDER_CENSUS_STATUS.md
          git fetch origin main
          git reset --hard origin/main
          mkdir -p automation
          cp /tmp/provider-census-sharded.json "automation/provider-census-sharded-${run_id}.json"
          if [ "$CENSUS_SCOPE" = "all" ]; then
            cp /tmp/provider-census-sharded.json automation/provider-census-sharded-latest.json
            cp /tmp/provider-census-sharded-summary.json automation/provider-census-sharded-latest-summary.json
            echo "FIELD_SHARDED_GLOBAL_FANOUT retained=false replaced=true scope=all run=$run_id"
          else
            echo "FIELD_SHARDED_GLOBAL_FANOUT retained=true replaced=false scope=$CENSUS_SCOPE run=$run_id"
          fi
          cp /tmp/provider-census-status.json automation/provider-census-status.json
          # Rebuild the durable batch plan after syncing to current main so the
          # latest Brain control-plane consumes the exact sharded evidence just
          # measured, including dynamic completeness debt from otherwise-green
          # providers. The pre-reset plan remains an artifact only.
          batch_args=(python scripts/build_provider_repair_batch_plan.py
            --status /tmp/provider-census-status.json
            --sharded-census /tmp/provider-census-sharded.json
            --overrides provider-overrides.json
            --output automation/provider-repair-batch-plan-latest.json)
          if [ -s automation/provider-census-sharded-latest.json ]; then
            batch_args+=(--fallback-sharded-census automation/provider-census-sharded-latest.json)
          fi
          "${batch_args[@]}"
          cp /tmp/provider-census-proof-history.json automation/provider-census-proof-history.json
          cp /tmp/provider-authority-status.json automation/provider-authority-status.json
          cp /tmp/provider-waf-browser-session-sharded.json "automation/provider-waf-browser-session-${run_id}.json"
          if [ -s automation/provider-waf-browser-session-latest.json ]; then
            python scripts/merge_waf_latest_evidence.py \
              --previous automation/provider-waf-browser-session-latest.json \
              --current /tmp/provider-waf-browser-session-sharded.json \
              --output /tmp/provider-waf-browser-session-latest-merged.json
            mv /tmp/provider-waf-browser-session-latest-merged.json automation/provider-waf-browser-session-latest.json
          else
            cp /tmp/provider-waf-browser-session-sharded.json automation/provider-waf-browser-session-latest.json
          fi
          cp /tmp/PROVIDER_CENSUS_STATUS.md PROVIDER_CENSUS_STATUS.md
          verified="$(python - <<'PY'
          import json
          d=json.load(open("/tmp/provider-census-sharded-summary.json"))
          print(f"{d.get('operationalOkCount',0)}/{d.get('providerCount',0)}")
          PY
          )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "automation/provider-census-sharded-${run_id}.json" \
            automation/provider-census-status.json \
            automation/provider-repair-batch-plan-latest.json \
            automation/provider-census-proof-history.json \
            automation/provider-authority-status.json \
            "automation/provider-waf-browser-session-${run_id}.json" \
            automation/provider-waf-browser-session-latest.json \
            PROVIDER_CENSUS_STATUS.md
          if [ "$CENSUS_SCOPE" = "all" ]; then
            git add \
              automation/provider-census-sharded-latest.json \
              automation/provider-census-sharded-latest-summary.json
          fi
          if git diff --cached --quiet; then
            echo "FIELD_SHARDED_CENSUS_NO_CHANGES"
          else
            git commit -m "ci(census-sharded): persist ${verified} from ${SOURCE_SHA:0:12}"
            git push origin HEAD:main
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Continue Brain Autopilot from fresh census
        if: ${{ steps.persist.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run provider-brain-autopilot.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "FIELD_SHARDED_CENSUS_AUTOPILOT event_driven=false source_run=${GITHUB_RUN_ID} trigger=workflow_dispatch"

