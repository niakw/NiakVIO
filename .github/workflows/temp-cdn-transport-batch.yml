name: TEMP - CDN transport batch

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - scripts/fix_cdn_transport_batch_v1.py
      - .github/workflows/temp-cdn-transport-batch.yml

permissions:
  contents: write

concurrency:
  group: temp-cdn-transport-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[cdn-batch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply durable transport source fixes
        run: python scripts/fix_cdn_transport_batch_v1.py

      - name: Assert transport contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('scripts/provider_patches/global_media_enrichment_v1.py').read_text()
          pahe=Path('scripts/provider_patches/animepahe_runtime_v1.py').read_text()
          vost=Path('scripts/provider_patches/animevostfr_runtime_v1.py').read_text()
          assert 'scoped-playback-context-v9-browser-default-ua' in core
          assert 'Chrome/145.0.0.0' in core
          assert 'credentials:"include",redirect:"follow"' in pahe
          assert 'Chrome/145.0.0.0' in pahe
          assert 'options.credentials="include";options.redirect="follow"' in vost
          assert 'playbackHeaders(referer)' in vost
          assert '"semanticLanes": ["anime"]' in vost
          print('CDN_TRANSPORT_SOURCE_CONTRACT_OK')
          PY

      - name: Rebuild all 96 from durable v3 sources
        env:
          NUVIO_PROVIDER_V3_CONTEXT: workspace
          NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '0'
        run: |
          python scripts/materialize_provider_v3_all.py
          python scripts/audit_provider_v3_static.py

      - name: Targeted current-runtime probes
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import run_provider_upstream_parity as p
          local=p.local_catalog()
          fixture=p.worker_fixture('anime', upstream=False)
          results={}
          for pid in ('anikototv','animepahe','animevostfr','animesalt'):
              row=local.get(pid)
              if not row:
                  results[pid]={'error':'missing'}
                  continue
              results[pid]=p.run_worker(row['path'], fixture, 40)
          Path('/tmp/cdn-targeted.json').write_text(json.dumps(results, indent=2))
          print('CDN_TARGETED_RESULTS='+json.dumps(results, sort_keys=True))
          PY

      - name: Preserve fail-closed HTTP safety
        run: |
          python tests/stream_output_sanitizer_fail_closed_test.py

      - name: Record durable checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=json.loads(Path('/tmp/cdn-targeted.json').read_text())
          mem=Path('MEMORY.md')
          text=mem.read_text()
          marker='## 2026-09-13 — scoped CDN/browser transport batch v1'
          block='\n\n'+marker+'\n\n'
          block+='- Applied browser-compatible transport without anti-bot circumvention: Core media enrichment now supplies a modern Chrome UA only when a row omitted User-Agent; explicit provider headers remain authoritative; scoped cookie jar + Referer/Origin + redirect-follow remain intact.\n'
          block+='- AniKoto execution authority is runtime v2; AnimePahe uses Chrome UA + credentials/include + redirect-follow; AnimeVOSTFR uses credentials/include + redirect-follow and carries Referer/Origin/User-Agent while remaining anime-only.\n'
          block+='- AnimeSalt receives the shared browser playback context on rebuilt bytes, but no cf_clearance/Turnstile/challenge token is fabricated. Any remaining site/CDN 403 stays fail-closed and must be classified external/runner-blocked rather than surfaced as playable.\n'
          block+='- Targeted post-rebuild JJK probe summary: `'+json.dumps(results, sort_keys=True).replace('`','')+'`.\n'
          if marker not in text:
              mem.write_text(text.rstrip()+block+'\n')
          PY

      - name: Commit rebuilt provider set
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_patches/global_media_enrichment_v1.py \
                  scripts/provider_patches/animepahe_runtime_v1.py \
                  scripts/provider_patches/animevostfr_runtime_v1.py \
                  provider-overrides.json manifest.json providers provider-v3-materialization.json MEMORY.md
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit'
            exit 0
          fi
          git commit -m '[cdn-batch] materialize scoped browser transport fixes'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
