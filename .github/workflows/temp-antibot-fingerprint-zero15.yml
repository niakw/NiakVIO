name: TEMP - anti-bot fingerprint ZERO15

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-antibot-fingerprint-zero15.yml

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fingerprint anti-bot responses without bypass attempts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, ssl, urllib.error, urllib.request
          from pathlib import Path
          targets={
            'animesalt':['https://animesalt.cx/','https://animesalt.ac/'],
            'fullanime':['https://www.fullanime.fr/'],
            'flemmix':['https://flemmix.kim/','https://flemmix.cloud/'],
            'allwish':['https://all-wish.me/'],
            'vostfree':['https://ipv4.vostfree.ws/'],
          }
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145 Safari/537.36'
          markers=('just a moment','challenge-platform','cf-chl-','turnstile','cloudflare','attention required')
          out=[]
          for provider,urls in targets.items():
            for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9','Cache-Control':'no-cache'})
              status=0; final=url; hdr={}; body=b''; err=None
              try:
                with urllib.request.urlopen(req,timeout=15,context=ssl.create_default_context()) as r:
                  status=int(r.status); final=r.geturl(); hdr={k.lower():v for k,v in r.headers.items()}; body=r.read(32768)
              except urllib.error.HTTPError as e:
                status=int(e.code); final=e.geturl(); hdr={k.lower():v for k,v in e.headers.items()} if e.headers else {}
                try: body=e.read(32768)
                except Exception: body=b''
                err='http'
              except Exception as e:
                err=type(e).__name__+':'+str(e)[:180]
              text=body.decode('utf-8','ignore').lower()
              found=[m for m in markers if m in text]
              cookies=hdr.get('set-cookie','')
              cloudflare=bool(hdr.get('cf-ray') or hdr.get('cf-mitigated') or 'cloudflare' in str(hdr.get('server','')).lower() or found or '__cf_bm' in cookies or 'cf_clearance' in cookies)
              challenge=bool(hdr.get('cf-mitigated')=='challenge' or any(m in found for m in ('just a moment','challenge-platform','cf-chl-','turnstile','attention required')))
              row={'provider':provider,'url':url,'status':status,'final':final,'server':hdr.get('server'),'cfRay':bool(hdr.get('cf-ray')),'cfMitigated':hdr.get('cf-mitigated'),'cloudflare':cloudflare,'challenge':challenge,'markers':found,'setCookieNames':[x.split('=',1)[0].strip() for x in cookies.split(',') if '=' in x][:8],'bytes':len(body),'error':err}
              out.append(row); print('ANTIBOT_FINGERPRINT '+json.dumps(row,ensure_ascii=False))
          Path('automation/zero15-antibot-fingerprint.json').write_text(json.dumps({'providers':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zero15-antibot-fingerprint-${{ github.run_id }}
          path: automation/zero15-antibot-fingerprint.json
          retention-days: 14
          if-no-files-found: error
