name: TEMP - trace Kurage upstream contract

# final response-shape trace for clean-room NiakVIO adapter
on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-kurage-upstream-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Trace exact upstream requests and tRPC response for HOTD
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/main/providers/kurage.js -o /tmp/kurage-upstream.js
          node <<'NODE'
          const nativeFetch=globalThis.fetch.bind(globalThis);
          globalThis.fetch=async function(input,init={}){
            const url=typeof input==='string'?input:String(input&&input.url||input);
            const row={url,method:String(init&&init.method||'GET'),headers:init&&init.headers||{},body:typeof init?.body==='string'?init.body.slice(0,6000):null};
            console.log('KURAGE_TRACE_REQUEST '+JSON.stringify(row));
            const res=await nativeFetch(input,init);
            console.log('KURAGE_TRACE_RESPONSE '+JSON.stringify({url,status:res.status,type:res.headers.get('content-type')}));
            if(url.includes('/api/trpc/')){
              try{const body=await res.clone().text();console.log('KURAGE_TRPC_BODY '+body.slice(0,16000));}catch(e){console.log('KURAGE_TRPC_BODY_ERROR '+String(e))}
            }
            return res;
          };
          const mod=require('/tmp/kurage-upstream.js');
          const fn=mod.getStreams||globalThis.getStreams;
          if(typeof fn!=='function') throw new Error('getStreams missing');
          (async()=>{
            const rows=await fn('56998','tv',1,1);
            console.log('KURAGE_TRACE_RESULT '+JSON.stringify({count:Array.isArray(rows)?rows.length:-1,rows:(rows||[]).slice(0,3)}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
