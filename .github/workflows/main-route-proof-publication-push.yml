name: MAIN - Route Proof Publication Push

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/route-proof-publication-push.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: niakvio-main-route-proof-publication-push
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact validated source and current drift
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          t=json.load(open('.github/triggers/route-proof-publication-push.json'))
          assert t.get('runId')==34096200193, t
          assert t.get('sourceSha')=='8173adc4db674189ccc3169fe9ffe90043790d21', t
          assert t.get('targetVersion')=='5.21.36', t
          source=t['sourceSha']; head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',source,head],check=True)
          allowed={
            '.github/workflows/main-route-proof-artifact-publication.yml',
            '.github/workflows/main-route-proof-publication-final.yml',
            '.github/workflows/main-route-proof-publication-push.yml',
            '.github/triggers/route-proof-publication.json',
            '.github/triggers/route-proof-publication-final.json',
            '.github/triggers/route-proof-publication-push.json',
            'MEMORY.md',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',source+'..'+head],text=True).splitlines())
          unexpected=sorted(changed-allowed)
          if unexpected: raise SystemExit('candidate source drift: '+','.join(unexpected))
          pathlib.Path('/tmp/run-id').write_text(str(t['runId']))
          print(f'PUSH_PUBLICATION_SOURCE_OK source={source} head={head} drift={sorted(changed)}')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34096200193" > "$RUNNER_TEMP/proof-run.json"
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/proof-run.json'))
          assert r.get('conclusion')=='success',r.get('conclusion')
          assert r.get('head_sha')=='8173adc4db674189ccc3169fe9ffe90043790d21',r.get('head_sha')
          print('PUSH_PUBLICATION_PROOF_RUN_OK run=34096200193')
          PY

      - name: Download exact validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 34096200193 --repo "$GITHUB_REPOSITORY" --name route-proof-reconstruction-96-34096200193 --dir "$RUNNER_TEMP/candidate"
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=Path(os.environ['RUNNER_TEMP'])/'candidate'
          m=json.load(open(c/'manifest.json')); mat=json.load(open(c/'provider-v3-materialization.json')); live=json.load(open(c/'automation/hotd-s3e1-live.json'))
          assert m.get('version')=='5.21.35' and len(m.get('scrapers') or [])==96
          assert mat.get('providerCount')==96 and mat.get('publication') is False
          assert (live.get('acceptance') or {}).get('kehflixOk') is True
          print('PUSH_PUBLICATION_ARTIFACT_OK providers=96 kehflix=ok')
          PY

      - name: Recreate already-proven publication tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepatch_identity_cleanup_shared_owner_v1.py
          python scripts/apply_core_identity_ownership_cleanup.py
          python scripts/upgrade_provider_worker_route_proof_v1.py
          python scripts/upgrade_provider_route_proof_request_spec_v1.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_base_route_requests_v1.py
          python scripts/upgrade_provider_route_authority_v5.py
          python scripts/upgrade_route_recovery_request_specs_v1.py
          python scripts/upgrade_provider_v3_source_plan_v5.py
          C="$RUNNER_TEMP/candidate"
          rsync -a --delete "$C/providers/" providers/
          cp "$C/manifest.json" manifest.json
          cp "$C/provider-overrides.json" provider-overrides.json
          cp "$C/automation/provider-v3-static-knowledge.json" automation/provider-v3-static-knowledge.json
          cp "$C/automation/provider-route-recovery-v5.json" automation/provider-route-recovery-v5.json
          cp "$C/provider-v3-materialization.json" provider-v3-materialization.json
          cp "$C/provider-v3-quick-yield.json" provider-v3-quick-yield.json
          cp "$C/automation/hotd-s3e1-live.json" automation/hotd-s3e1-live.json
          cp "$C/health-report.json" health-report.json
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          before=json.load(open(Path(os.environ['RUNNER_TEMP'])/'manifest.before.json'))
          current=json.load(open('manifest.json')); material=json.load(open('provider-v3-materialization.json'))
          old={str(r.get('id') or '').casefold():r for r in before.get('scrapers',[]) if isinstance(r,dict)}
          reports={str(r.get('provider') or '').casefold():r for r in material.get('providers',[]) if isinstance(r,dict)}
          for row in current.get('scrapers',[]):
              pid=str(row.get('id') or '').casefold(); prev=old.get(pid); rep=reports.get(pid)
              if not prev or not rep: raise SystemExit(f'{pid}: missing previous/report row')
              old_name=Path(str(prev.get('filename') or '')).name
              match=re.fullmatch(re.escape(pid)+r'--(.+)--[0-9a-f]{16}\.js',old_name)
              if not match: raise SystemExit(f'{pid}: prior public filename invalid: {old_name}')
              src=Path(str(row.get('filename') or '')); digest=hashlib.sha256(src.read_bytes()).hexdigest()
              target=Path('providers')/f'{pid}--{match.group(1)}--{digest[:16]}.js'
              if target!=src: src.replace(target)
              row['filename']=target.as_posix(); rep['file']=target.as_posix(); rep['sha256']=digest
          material['context']='main'; material['publication']=True; material['mainTouched']=True
          Path('manifest.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('provider-v3-materialization.json').write_text(json.dumps(material,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PUSH_PUBLICATION_FILENAME_PROJECTION_OK providers=96 bytes_unchanged=true')
          PY
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/sync_release_versions.py --previous "$RUNNER_TEMP/manifest.before.json"

      - name: Recheck publication invariants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_published_provider_config.py --expected 96
          python tests/final_published_provider_config_test.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python scripts/audit_provider_v3_static.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python3 - <<'PY'
          import json
          for p in ('manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              m=json.load(open(p)); assert m.get('version')=='5.21.36',(p,m.get('version'))
          assert len(json.load(open('manifest.json')).get('scrapers') or [])==96
          assert (json.load(open('automation/hotd-s3e1-live.json')).get('acceptance') or {}).get('kehflixOk') is True
          print('PUSH_PUBLICATION_INVARIANTS_OK version=5.21.36 providers=96 reverse=96/96')
          PY

      - name: Checkpoint and push without workflow-tree mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8'); marker='## 2026-09-07 — Route-proof 5.21.36 final publication'
          block='''\n## 2026-09-07 — Route-proof 5.21.36 final publication\n\n- Exact validated artifact: route-proof run `34096200193`, source `8173adc4db674189ccc3169fe9ffe90043790d21`.\n- Public filename projection preserved provider bytes; reverse rebuild remained 96/96 byte-identical and static publication audit passed.\n- Published release target `5.21.36`, 96 providers. Kehflix HOTD S3E1 proof is OK (6 series / 6 tv); Purstream remains NOT_OK diagnostic pending operator explanation.\n'''
          if marker not in t: p.write_text(t.rstrip()+"\n"+block,encoding='utf-8')
          PY
          # GitHub Actions token lacks workflows permission. Preserve all workflow files
          # byte-for-byte in this release commit; one-shot workflow cleanup is performed
          # immediately afterward through the connected GitHub API.
          git restore --source=HEAD -- .github/workflows
          git rm -f --ignore-unmatch .github/triggers/route-proof-publication.json .github/triggers/route-proof-publication-final.json .github/triggers/route-proof-publication-push.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then echo 'workflow mutation remains staged'; exit 1; fi
          BASE_SHA="$(git rev-parse HEAD)"; git fetch origin main; CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then echo "MAIN_ADVANCED base=$BASE_SHA current=$CURRENT_SHA"; exit 75; fi
          git commit -m 'release: publish proof-first Provider v3 5.21.36'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
