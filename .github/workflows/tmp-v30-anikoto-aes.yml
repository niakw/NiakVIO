name: TMP - V30 AniKoto AES

on:
  pull_request:
    branches:
      - tmp/v30-anikoto-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight AniKoto
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 -m py_compile scripts/provider_patches/anikototv_runtime_v3.py scripts/materialize_provider_v3_all.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Materialize current provider generation
        run: |
          set -euo pipefail
          python3 scripts/materialize_provider_v3_all.py             --source-manifest manifest.json             --output-dir providers             --report health-output/v30-materialization.json

      - name: Assert AniKoto AES contract survived
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          row=next(r for r in m['scrapers'] if str(r.get('id')).lower()=='anikototv')
          p=Path(str(row['filename']).replace('../',''))
          text=p.read_text()
          required=[
            'anikoto_megaplay_webcrypto',
            '__crypto_aes_decrypt_raw',
            'data-id',
            '/stream\\/s-',
            'stream/getSources?id=',
          ]
          missing=[x for x in required if x not in text]
          print('FIELD_V30_ANIKOTO_BUNDLE','file='+str(p),'missing='+(','.join(missing) or '-'))
          if missing:
              raise SystemExit('AniKoto AES contract missing from materialized bundle')
          PY

      - name: Certify AniKoto
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py             --manifest manifest.json             --include-disabled             --provider anikototv             --candidate-limit 12             --timeout 30             --workers 1             --seed "v30-anikoto-${GITHUB_RUN_ID}"             --output health-output/v30-certification.json

      - name: Summarize AniKoto
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v30-certification.json').read_text())
          row=p['providers'][0]
          lanes=row.get('lanes') or {}
          gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
          print('FIELD_V30_RESULT',row.get('providerId'),'green='+(','.join(gl) or '-'),'full='+str(bool(row.get('certified'))).lower())
          for lane,v in lanes.items():
              for a in (v or {}).get('attempts') or []:
                  hist=a.get('providerValueTraceHistory') or a.get('provider_value_trace_history') or []
                  if hist:
                      print('FIELD_V30_TRACE',lane,json.dumps(hist[-16:],separators=(',',':')))
                      break
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v30-anikoto-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
