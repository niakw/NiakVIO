name: TEMP - ZERO15 LKG authority AB v1

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-zero15-lkg-authority-ab-v1.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore only execution-route authority from last strict green SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          OLD='491375c5603467f2554a2c3f1182ba2df85af48a'
          PIDS=['allanime','allwish','animetsu','moviebox','moviesmod','vidfast','vidlove']
          def oldjson(path): return json.loads(subprocess.check_output(['git','show',f'{OLD}:{path}'],text=True))
          oo=oldjson('provider-overrides.json'); ok=oldjson('automation/provider-v3-static-knowledge.json')
          no=json.loads(Path('provider-overrides.json').read_text()); nk=json.loads(Path('automation/provider-v3-static-knowledge.json').read_text())
          for pid in PIDS:
              op=(oo.get('provider_patches') or {}).get(pid) or {}
              np=(no.get('provider_patches') or {}).setdefault(pid,{})
              om=((ok.get('providers') or {}).get(pid) or {}).get('model') or {}
              nm=(nk.setdefault('providers',{}).setdefault(pid,{}).setdefault('model',{}))
              if 'learned_routes' in op: np['learned_routes']=op['learned_routes']
              if 'routes' in om: nm['routes']=om['routes']
              # Preserve current candidate/evidence sets; only restore the execution authority that was green.
              print('LKG_ROUTE_RESTORE',pid,'learned=',len(np.get('learned_routes') or []),'model=',len(nm.get('routes') or []))
          Path('provider-overrides.json').write_text(json.dumps(no,ensure_ascii=False,indent=2)+'\n')
          Path('automation/provider-v3-static-knowledge.json').write_text(json.dumps(nk,ensure_ascii=False,indent=2)+'\n')
          PY
          for p in allanime allwish animetsu moviebox moviesmod vidfast vidlove; do
            python3 scripts/materialize_provider_v3_one.py "$p"
          done
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py

      - name: Adaptive local A/B proof from global 3-lane corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as parity
          from rotating_corpus import rotated_candidates
          providers=['allanime','allwish','animetsu','moviebox','moviesmod','vidfast','vidlove']
          catalog=parity.local_catalog(); manifest=json.loads(Path('manifest.json').read_text())
          rows={str(r.get('id','')).casefold():r for r in manifest.get('scrapers',[]) if isinstance(r,dict)}
          out=[]
          for pid in providers:
              declared=[str(x).casefold() for x in (rows.get(pid,{}).get('supportedTypes') or [])]
              lanes=[x for x in ('movie','tv','anime') if x in declared or (x=='anime' and 'tv' in declared)] or ['movie','tv','anime']
              prow={'provider':pid,'positive':False,'lanes':[]}
              for lane in lanes:
                  lr={'lane':lane,'status':'zero','tested':0,'fixture':None,'streams':0,'error':None,'hosts':[],'statuses':[]}
                  for f in rotated_candidates(lane,provider='zero15-lkg-ab'):
                      lr['tested']+=1
                      r=parity.run_worker(catalog[pid]['path'],f,45)
                      n=int(r.get('stream_count') or 0); err=str(r.get('error_class') or '')
                      if n>0:
                          lr.update(status='positive',fixture=f.get('slug'),streams=n,hosts=r.get('provider_server_hosts') or [],statuses=r.get('provider_server_http_statuses') or r.get('http_statuses') or [])
                          prow['positive']=True; break
                      if err:
                          lr.update(status='error',fixture=f.get('slug'),error=err,hosts=r.get('provider_server_hosts') or [],statuses=r.get('provider_server_http_statuses') or r.get('http_statuses') or [])
                          break
                  prow['lanes'].append(lr)
              out.append(prow); print('ZERO15_LKG_AB '+json.dumps(prow,ensure_ascii=False))
          Path('automation/zero15-lkg-authority-ab-v1.json').write_text(json.dumps({'providers':out,'positive':[x['provider'] for x in out if x['positive']]},ensure_ascii=False,indent=2)+'\n')
          print('ZERO15_LKG_AB_POSITIVE',','.join(x['provider'] for x in out if x['positive']) or 'none')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero15-lkg-authority-ab-v1-${{ github.run_id }}
          path: automation/zero15-lkg-authority-ab-v1.json
          retention-days: 14
          if-no-files-found: warn
