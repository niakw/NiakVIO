name: MAINT - Final release contract hygiene

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-final-hygiene-20260914.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-final-release-contract-hygiene
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final hygiene patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/final_hygiene_20260914.py
          python3 .github/scripts/final_hygiene_20260914.py

      - name: Verify current release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/reapply_published_overrides.py scripts/upgrade_native_lab_docs_v1.py
          python3 tests/provider_v3_documentation_contract_test.py
          python3 tests/provider_anime_semantic_transport_contract_test.py
          python3 tests/provider_v3_workflow_ownership_test.py
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          provenance=json.loads(Path('PROVENANCE.json').read_text())
          assert len(manifest.get('scrapers') or []) == 46
          assert len(provenance.get('providers') or {}) == 96
          reapply=Path('scripts/reapply_published_overrides.py').read_text()
          assert 'if len(primary_by_id) != len(rows):' not in reapply
          assert 'manifest-provenance-provider-count-drift' not in reapply
          assert not Path('.github/triggers/final-validation-20260914.json').exists()
          rc=Path('.github/workflows/release-candidate-validation.yml').read_text()
          assert '.github/triggers/release-candidate-validation.json' in rc
          for wf in ('release-finalize.yml','domain-refresh.yml'):
              text=Path('.github/workflows',wf).read_text()
              assert 'group: niakvio-core-release-mutation-main' in text
              assert 'cancel-in-progress: false' in text
          print('FINAL_HYGIENE_CONTRACT_OK current=46 historical=50 anime_transport=anime+tv shared_release_lock=true finalizer_rematerialization_required=true')
          PY

      - name: Publish hygiene atomically
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/maintenance-final-hygiene-20260914.yml
          rm .github/scripts/final_hygiene_20260914.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)" || { echo 'No hygiene changes produced' >&2; exit 1; }
          git commit -m 'fix: align final release and current provider contracts'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main moved during hygiene expected=$GITHUB_SHA actual=$(git rev-parse origin/main)" >&2
            exit 1
          }
          git push origin HEAD:main
          echo "FIELD_FINAL_HYGIENE_SHA $(git rev-parse HEAD)"
