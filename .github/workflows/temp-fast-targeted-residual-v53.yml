name: TEMP - Fast Targeted Residual V53

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-fast-targeted-residual-v53.yml']

permissions:
  contents: read

jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        provider: [uhdmovies, kehflix, animesama-co, voiranime-rip, neko-sama, animevost-fr, mallumv, animetsu]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Run proof-first targeted repair candidate
        shell: bash
        run: |
          set +e
          python scripts/run_provider_repair_fast_targeted_v1.py \
            --provider '${{ matrix.provider }}' \
            --workers 2 --timeout 35 --attempts 2 --defer-global-guard
          rc=$?
          echo "V53_PIPELINE_RC provider=${{ matrix.provider }} rc=$rc"
          if [ -f automation/provider-repair-fast-summary.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('automation/provider-repair-fast-summary.json',encoding='utf-8'))
          print('V53_SUMMARY\t'+json.dumps(d,sort_keys=True))
          PY
          fi
          echo 'V53_DIFF'
          git status --short
          exit 0
