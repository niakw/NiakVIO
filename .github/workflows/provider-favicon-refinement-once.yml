name: Provider favicon refinement once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-favicon-refinement-once.yml'
      - 'scripts/refine_provider_logos_from_favicons_once.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-provider-favicon-refinement-once
  cancel-in-progress: false

jobs:
  refine-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install one-shot image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Prefer readable provider site icons
        run: python scripts/refine_provider_logos_from_favicons_once.py
      - name: Verify committed logo inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('.')
          index=json.loads((root/'assets/providers/index.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          enabled=[r for r in manifest.get('scrapers',[]) if isinstance(r,dict) and r.get('enabled') is not False]
          providers=index.get('providers') or {}
          missing=[str(r.get('id')).casefold() for r in enabled if str(r.get('id')).casefold() not in providers]
          assert not missing, missing
          for provider_id,row in providers.items():
              for key,size in {'72x32':(72,32),'96x40':(96,40)}.items():
                  path=root/row['assets'][key]
                  assert path.is_file(), (provider_id,path)
                  with Image.open(path) as image:
                      assert image.format == 'WEBP', (provider_id,key,image.format)
                      assert image.size == size, (provider_id,key,image.size)
          print(f"FIELD_PROVIDER_LOGO_ASSET_QA indexed={len(providers)} active={len(enabled)} missing_active=0")
          PY
      - name: Commit refined assets and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/refine_provider_logos_from_favicons_once.py .github/workflows/provider-favicon-refinement-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No favicon refinement changed committed assets.'
            exit 0
          fi
          git commit -m 'assets: refine provider logos for small displays'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider favicon refinement completed once: site/app icons were preferred where they are more legible at Nuvio sizes; committed WebP assets remain the only runtime source. One-shot refinement code removed."
