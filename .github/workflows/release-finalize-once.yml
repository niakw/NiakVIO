name: TEMP - Finalize missed release versions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-finalize-once.yml'

permissions:
  contents: write

concurrency:
  group: release-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize release and provider cache versions
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=1bca5442942dc8f2ef01cb87461b7b9898ba68c3
          git show "$BASELINE:manifest.json" > /tmp/previous-manifest.json
          python3 scripts/sync_release_versions.py --manifest manifest.json --previous /tmp/previous-manifest.json | tee /tmp/version-finalization.json
          python3 tests/release_auto_bump_test.py
          python3 tests/release_version_sync_test.py
          python3 tests/provider_versioning_test.py
          python3 tests/reapply_provider_versioning_test.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 tests/release_hash_scope_test.py

      - name: Verify bounded publication diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/finalization-files.txt
          if grep -Ev '^(manifest\.json|vf/manifest\.json|no-anime/manifest\.json|vf-no-anime/manifest\.json|package\.json|package-lock\.json|sources\.json|provider_catalog\.json|nuvio-client-id-state\.json|FILE-HASHES\.json|PATCH-SHA256SUMS\.txt|SHA256SUMS\.json)$' /tmp/finalization-files.txt; then
            echo 'Unexpected path changed by release finalization' >&2
            exit 1
          fi

      - name: Commit atomic release finalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Release finalization is already a no-op.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json package.json package-lock.json sources.json provider_catalog.json nuvio-client-id-state.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m 'chore: finalize Provider v3 release versions'
          git push origin HEAD:main
