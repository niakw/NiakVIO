name: Apply Brain historical learning v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-apply-brain-historical-learning-v2.yml']

permissions:
  contents: write

concurrency:
  group: apply-brain-historical-learning-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Materialize atomic patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "engine_v2/src"
          printf '%s' '  rL2dpLCAiPHVybD4iKQogICAgLnJlcGxhY2UoLyg/OnRva2VufGF1dGhvcml6YXRpb258Y29va2llfHNlY3JldClccypbOj1dXHMqXFM rL2dpLCAiJDE9PHJlZGFjdGVkPiIpCiAgICAucmVwbGFjZSgvXHM  bikgOiAwOyB9CmZ1bmN0aW9uIGFzUmVjb3JkKHZhbHVlKSB7IHJldHVybiB2YWx1ZSAmJiB0eXBlb2YgdmFsdWUgPT09ICJvYmplY3QiICYmICFBcnJheS5pc0FycmF5KHZhbHVlKSA/IHZhbHVlIDoge307IH0K' | base64 -d > "engine_v2/src/historical-learning.mjs"
          mkdir -p "engine_v2/config"
          printf '%s' ' ' | base64 -d > "engine_v2/config/historical-audit-baselines.json"
          mkdir -p "engine_v2/scripts"
          printf '%s' ' ' | base64 -d > "engine_v2/scripts/build-historical-learning.mjs"
          mkdir -p "engine_v2/scripts"
          printf '%s' 'IyEvdXNyL2Jpbi9lbnYgbm9kZQppbXBvcnQgZnMgZnJvbSAibm9kZTpmcyI7CmltcG9ydCBwYXRoIGZyb20gIm5vZGU6cGF0aCI7CmltcG9ydCBwcm9jZXNzIGZyb20gIm5vZGU6cHJvY2VzcyI7Cgpjb25zdCByb290ID0gcGF0aC5yZXNvbHZlKHBhdGguZGlybmFtZShuZXcgVVJMKGl ' | base64 -d > "engine_v2/scripts/import-learning-state.mjs"
          mkdir -p "engine_v2/scripts"
          printf '%s' '  ke2RhdGEuc2FuZGJveC5hdHRlbXB0c30qKiDigJQgZ2VuZXJhdGVkICoqJHtkYXRhLnNhbmRib3guZ2VuZXJhdGVkfSoqIOKAlCBhY2NlcHRlZCAqKiR7ZGF0YS5zYW5kYm94LmFjY2VwdGVkfSoqIOKAlCByZWplY3RlZCAqKiR7ZGF0YS5zYW5kYm94LnJlamVjdGVkfSoqYCwKICAgIGBIaXN0b3JpY2FsIHByb3ZpZGVycyBjb21wYXJlZDogKio ke051bWJlcihzdGF0cy5wcm92aWRlcnMgPz8gMCl9Kiog4oCUIGhpZ2gvY3JpdGljYWwgdW5yZXNvbHZlZDogKio ke051bWJlcihzdGF0cy51bnJlc29sdmVkSGlnaFByaW9yaXR5ID8/IDA p fSoqYCwKICAgIGBMZWFybmVkIHNraWxscyBvYnNlcnZlZDogKio    ' | base64 -d > "engine_v2/scripts/learning-lab.mjs"
          mkdir -p "engine_v2/tests"
          printf '%s' '' | base64 -d > "engine_v2/tests/historical-learning.test.mjs"
          mkdir -p "engine_v2/tests"
          printf '%s' '' | base64 -d > "engine_v2/tests/planner-learning-memory.test.mjs"
          mkdir -p ".github/workflows"
          printf '%s' ' ' | base64 -d > ".github/workflows/brain-learning-lab.yml"
          printf '%s' ' ''''' | base64 -d > /tmp/apply_existing_patches.py
          python /tmp/apply_existing_patches.py
          chmod +x engine_v2/scripts/build-historical-learning.mjs engine_v2/scripts/import-learning-state.mjs engine_v2/scripts/learning-lab.mjs

      - name: Validate patch before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/brain_repair_runtime.py
          node --check engine_v2/src/historical-learning.mjs
          node --check engine_v2/scripts/build-historical-learning.mjs
          node --check engine_v2/scripts/import-learning-state.mjs
          node --check engine_v2/scripts/learning-lab.mjs
          node --check engine_v2/scripts/plan-repairs.mjs
          node engine_v2/tests/historical-learning.test.mjs
          node engine_v2/tests/planner-learning-memory.test.mjs
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          python - <<'PY'
          import json
          x=json.load(open('engine_v2/config/historical-audit-baselines.json'))
          b=x['baselines'][0]
          assert b['release']=='5.20.63' and b['providers']==92 and len(b['quarantines'])==14
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-apply-brain-historical-learning-v2.yml
          git add .github/workflows/brain-learning-lab.yml engine_v2 scripts/brain_repair_runtime.py
          git commit -m 'feat: train Brain from historical and sandbox repair evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
