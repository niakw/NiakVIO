name: FIX - post-Deep compatibility once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-postdeep-compat.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Add bounded legacy audit compatibility
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > scripts/audit_catalogue_media.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/quarantine_catalogue_audit_failures.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    parser.add_argument("--tested-commit-sha", default="")\n'
          legacy = (
              '    # Temporary CLI compatibility for in-flight Deep workflows created before the canonical audit migration.\n'
              '    parser.add_argument("--manifest", help=argparse.SUPPRESS)\n'
              '    parser.add_argument("--overrides", help=argparse.SUPPRESS)\n'
          )
          if 'parser.add_argument("--manifest", help=argparse.SUPPRESS)' not in text:
              if anchor not in text:
                  raise SystemExit('quarantine parser anchor not found')
              text = text.replace(anchor, anchor + legacy, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit_catalogue_media.py scripts/quarantine_catalogue_audit_failures.py
          python tests/catalogue_audit_transient_hls_test.py
          python tests/sync_catalogue_audit_gate_test.py

      - name: Refresh integrity inventories and remove consumed one-shots
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-learning-artifact-layout.yml
          rm -f .github/workflows/tmp-resume-quick-publish.yml
          rm -f .github/workflows/tmp-postdeep-compat.yml
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_catalogue_media.py scripts/quarantine_catalogue_audit_failures.py \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json \
            .github/workflows/tmp-fix-learning-artifact-layout.yml \
            .github/workflows/tmp-resume-quick-publish.yml \
            .github/workflows/tmp-postdeep-compat.yml
          git commit -m 'fix: bridge in-flight Deep audit contract [skip ci]'
          git fetch origin main
          git rebase origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
