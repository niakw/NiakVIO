name: Final native Nuvio client validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-native-client-validation.yml"

permissions:
  contents: read

concurrency:
  group: final-native-client-validation
  cancel-in-progress: true

env:
  NUVIO_DESKTOP_SHA: "8977fda639f5791947e6d8b36025635a77aed5da"
  NUVIO_MOBILE_SHA: "0d6e30e4566e6f9f2051d5f80a1e3f1e0fcb1f18"
  NUVIO_TV_SHA: "d95f3fb837b6ddfbf9ff445cdcba2413b576f0d4"

jobs:
  desktop-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Niakvio generation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: niakvio

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Install official Linux player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Checkout pinned official NuvioDesktop
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          touch nuvio-desktop/local.properties

      - name: Stage current manifest provider bundles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path('niakvio')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          rows = {str(r.get('id') or '').casefold(): r for r in manifest.get('scrapers', []) if isinstance(r, dict)}
          out = root / 'real-client-stage'
          out.mkdir(exist_ok=True)
          for provider_id in ('moviebox', 'netmirror', 'streamzo'):
              source = root / rows[provider_id]['filename']
              shutil.copy2(source, out / f'{provider_id}.js')
              print(f'FIELD_STAGE provider={provider_id} enabled={rows[provider_id].get("enabled")} source={source}')
          PY

      - name: Inject exact official Desktop runtime test
        run: |
          mkdir -p nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins
          cat > nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioFinalNativeDesktopTest.kt <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertTrue

          class NiakvioFinalNativeDesktopTest {
              private val workspace = File(System.getenv("GITHUB_WORKSPACE"))
              private val root = File(workspace, "niakvio/real-client-stage")
              private val resultFile = File(workspace, "desktop-native-results.log")

              private fun emit(message: String) {
                  println(message)
                  resultFile.appendText(message + "\n")
              }

              @Test
              fun exactMonNinjaProviders() = runBlocking {
                  for (id in listOf("moviebox", "netmirror", "streamzo")) {
                      val started = System.currentTimeMillis()
                      val rows = PluginRuntime.executePlugin(
                          code = File(root, "$id.js").readText(),
                          tmdbId = "1215638",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = id,
                      )
                      emit("FIELD_DESKTOP_NATIVE provider=$id duration_ms=${System.currentTimeMillis()-started} count=${rows.size}")
                      rows.forEachIndexed { index, row ->
                          emit("FIELD_DESKTOP_NATIVE_ROW provider=$id index=$index title=${row.title} name=${row.name} quality=${row.quality} language=${row.language} type=${row.type} url=${row.url}")
                      }
                      when (id) {
                          "moviebox", "netmirror" -> assertTrue(rows.isEmpty(), "$id must fail closed")
                          "streamzo" -> {
                              assertTrue(rows.isNotEmpty(), "StreamZo must resolve Mon ninja et moi 3")
                              assertTrue(rows.any { it.url.contains(".m3u8", ignoreCase = true) }, "StreamZo must expose HLS")
                          }
                      }
                  }
              }

              @Test
              fun missingOptionalMetadataIsAccepted() = runBlocking {
                  val rows = PluginRuntime.executePlugin(
                      code = "module.exports.getStreams=async()=>[{title:'Metadata control',url:'https://example.test/video.mp4'}];",
                      tmdbId = "1215638",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "metadata-control",
                  )
                  assertEquals(1, rows.size)
                  assertEquals(null, rows.single().quality)
                  assertEquals(null, rows.single().language)
                  emit("FIELD_DESKTOP_METADATA_NULL_ACCEPTED=true")
              }
          }
          KOTLIN

      - name: Execute pinned official Desktop PluginRuntime
        working-directory: nuvio-desktop
        run: |
          rm -f "$GITHUB_WORKSPACE/desktop-native-results.log"
          set +e
          ./gradlew :composeApp:desktopTest \
            --tests 'com.nuvio.app.features.plugins.NiakvioFinalNativeDesktopTest' \
            --no-daemon --console=plain
          STATUS=$?
          set -e
          echo "===== EXACT DESKTOP NATIVE RESULTS ====="
          test -f "$GITHUB_WORKSPACE/desktop-native-results.log" && cat "$GITHUB_WORKSPACE/desktop-native-results.log" || true
          exit "$STATUS"

  android-native-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact Niakvio generation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: niakvio

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout pinned official Android clients
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git nuvio-mobile
          git -C nuvio-mobile checkout "$NUVIO_MOBILE_SHA"
          touch nuvio-mobile/local.properties
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          touch nuvio-tv/local.properties nuvio-tv/local.dev.properties

      - name: Enable NuvioMobile native device test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('nuvio-mobile/composeApp/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          needle = '        withHostTest {}\n\n        compilerOptions {'
          replacement = '''        withHostTest {}
          withDeviceTest {
              instrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              execution = "HOST"
          }

          compilerOptions {'''
          if text.count(needle) != 1:
              raise SystemExit(f'Android device-test compilation anchor count={text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          needle = '        commonMain.dependencies {'
          replacement = '''        val androidDeviceTest by getting {
              dependencies {
                  implementation("junit:junit:4.13.2")
                  implementation("androidx.test.ext:junit:1.3.0")
                  implementation("androidx.test:runner:1.7.0")
              }
          }
          commonMain.dependencies {'''
          if text.count(needle) != 1:
              raise SystemExit(f'Android device-test dependency anchor count={text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          cat > nuvio-mobile/composeApp/src/androidMain/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          XML

      - name: Enable NuvioTV native instrumentation test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('nuvio-tv/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          signing = '        debug {\n            signingConfig = signingConfigs.getByName("release")'
          if signing not in text:
              raise SystemExit('NuvioTV debug signing anchor missing')
          text = text.replace(
              signing,
              '        debug {\n            signingConfig = signingConfigs.getByName("debug")',
              1,
          )
          runner_anchor = '        versionName = "0.8.4-beta"\n'
          if runner_anchor not in text:
              raise SystemExit('NuvioTV defaultConfig anchor missing')
          text = text.replace(
              runner_anchor,
              runner_anchor + '        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n',
              1,
          )
          text += '''

dependencies {
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    androidTestImplementation("androidx.test:runner:1.7.0")
}
'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Inject current bundles into both native Android clients
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path('niakvio')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          rows = {str(r.get('id') or '').casefold(): r for r in manifest.get('scrapers', []) if isinstance(r, dict)}
          mobile = Path('nuvio-mobile/composeApp/src/androidDeviceTest/assets/niakvio')
          tv = Path('nuvio-tv/app/src/androidTest/assets/niakvio')
          mobile.mkdir(parents=True, exist_ok=True)
          tv.mkdir(parents=True, exist_ok=True)
          for provider_id in ('moviebox', 'netmirror', 'streamzo'):
              source = root / rows[provider_id]['filename']
              shutil.copy2(source, mobile / f'{provider_id}.js')
              shutil.copy2(source, tv / f'{provider_id}.js')
              print(f'FIELD_ANDROID_STAGE provider={provider_id} enabled={rows[provider_id].get("enabled")} source={source}')
          PY

      - name: Inject NuvioMobile PluginRuntime test
        run: |
          mkdir -p nuvio-mobile/composeApp/src/androidDeviceTest/kotlin/com/nuvio/app/features/plugins
          cat > nuvio-mobile/composeApp/src/androidDeviceTest/kotlin/com/nuvio/app/features/plugins/NiakvioFinalNativeMobileTest.kt <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import android.util.Log
          import androidx.test.platform.app.InstrumentationRegistry
          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class NiakvioFinalNativeMobileTest {
              private fun emit(message: String) {
                  println(message)
                  Log.i("NiakvioRealLab", message)
              }

              private fun code(id: String): String =
                  InstrumentationRegistry.getInstrumentation().context.assets
                      .open("niakvio/$id.js").bufferedReader().use { it.readText() }

              @Test
              fun exactMonNinjaProviders() = runBlocking {
                  for (id in listOf("moviebox", "netmirror", "streamzo")) {
                      val started = System.currentTimeMillis()
                      val rows = PluginRuntime.executePlugin(
                          code = code(id),
                          tmdbId = "1215638",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = id,
                      )
                      emit("FIELD_MOBILE_NATIVE provider=$id duration_ms=${System.currentTimeMillis()-started} count=${rows.size}")
                      rows.forEachIndexed { index, row ->
                          emit("FIELD_MOBILE_NATIVE_ROW provider=$id index=$index title=${row.title} name=${row.name} quality=${row.quality} language=${row.language} type=${row.type} url=${row.url}")
                      }
                      when (id) {
                          "moviebox", "netmirror" -> assertTrue("$id must fail closed", rows.isEmpty())
                          "streamzo" -> {
                              assertTrue("StreamZo must resolve Mon ninja et moi 3", rows.isNotEmpty())
                              assertTrue("StreamZo must expose HLS", rows.any { it.url.contains(".m3u8", ignoreCase = true) })
                          }
                      }
                  }
              }

              @Test
              fun missingOptionalMetadataIsAccepted() = runBlocking {
                  val rows = PluginRuntime.executePlugin(
                      code = "module.exports.getStreams=async()=>[{title:'Metadata control',url:'https://example.test/video.mp4'}];",
                      tmdbId = "1215638",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "metadata-control",
                  )
                  assertEquals(1, rows.size)
                  assertEquals(null, rows.single().quality)
                  assertEquals(null, rows.single().language)
                  emit("FIELD_MOBILE_METADATA_NULL_ACCEPTED=true")
              }
          }
          KOTLIN

      - name: Inject NuvioTV PluginRuntime test
        run: |
          mkdir -p nuvio-tv/app/src/androidTest/java/com/nuvio/tv/core/plugin
          cat > nuvio-tv/app/src/androidTest/java/com/nuvio/tv/core/plugin/NiakvioFinalNativeTvTest.kt <<'KOTLIN'
          package com.nuvio.tv.core.plugin

          import android.util.Log
          import androidx.test.platform.app.InstrumentationRegistry
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class NiakvioFinalNativeTvTest {
              private val runtime = PluginRuntime()

              private fun emit(message: String) {
                  println(message)
                  Log.i("NiakvioRealLab", message)
              }

              private fun code(id: String): String =
                  InstrumentationRegistry.getInstrumentation().context.assets
                      .open("niakvio/$id.js").bufferedReader().use { it.readText() }

              @Test
              fun exactMonNinjaProviders() = runBlocking {
                  for (id in listOf("moviebox", "netmirror", "streamzo")) {
                      val started = System.currentTimeMillis()
                      val rows = runtime.executePlugin(
                          code = code(id),
                          tmdbId = "1215638",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = id,
                      )
                      emit("FIELD_TV_NATIVE provider=$id duration_ms=${System.currentTimeMillis()-started} count=${rows.size}")
                      rows.forEachIndexed { index, row ->
                          emit("FIELD_TV_NATIVE_ROW provider=$id index=$index title=${row.title} name=${row.name} quality=${row.quality} language=${row.language} type=${row.type} url=${row.url}")
                      }
                      when (id) {
                          "moviebox", "netmirror" -> assertTrue("$id must fail closed", rows.isEmpty())
                          "streamzo" -> {
                              assertTrue("StreamZo must resolve Mon ninja et moi 3", rows.isNotEmpty())
                              assertTrue("StreamZo must expose HLS", rows.any { it.url.contains(".m3u8", ignoreCase = true) })
                          }
                      }
                  }
              }

              @Test
              fun missingOptionalMetadataIsAccepted() = runBlocking {
                  val rows = runtime.executePlugin(
                      code = "module.exports.getStreams=async()=>[{title:'Metadata control',url:'https://example.test/video.mp4'}];",
                      tmdbId = "1215638",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "metadata-control",
                  )
                  assertEquals(1, rows.size)
                  assertEquals(null, rows.single().quality)
                  assertEquals(null, rows.single().language)
                  emit("FIELD_TV_METADATA_NULL_ACCEPTED=true")
              }
          }
          KOTLIN

      - name: Run pinned NuvioMobile and NuvioTV native QuickJS on one emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: |
            set +e
            adb logcat -c
            cd "$GITHUB_WORKSPACE/nuvio-mobile"
            TASKS=$(./gradlew :composeApp:tasks --all -Pnuvio.android.distribution=full --console=plain)
            MOBILE_TASK=$(printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /connected.*device.*test/ {print $1; exit}')
            if [ -z "$MOBILE_TASK" ]; then
              MOBILE_TASK=$(printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /device.*test/ && tolower($0) ~ /connected/ {print $1; exit}')
            fi
            if [ -z "$MOBILE_TASK" ]; then
              echo "Unable to resolve NuvioMobile connected device-test task" >&2
              MOBILE_STATUS=97
            else
              echo "Resolved NuvioMobile task: $MOBILE_TASK"
              ./gradlew ":composeApp:$MOBILE_TASK" -Pnuvio.android.distribution=full --no-daemon --console=plain
              MOBILE_STATUS=$?
            fi
            echo "===== EXACT MOBILE NATIVE RESULTS ====="
            adb logcat -d -s NiakvioRealLab:I '*:S' || true

            adb logcat -c
            cd "$GITHUB_WORKSPACE/nuvio-tv"
            ./gradlew :app:connectedFullDebugAndroidTest --no-daemon --console=plain
            TV_STATUS=$?
            echo "===== EXACT TV NATIVE RESULTS ====="
            adb logcat -d -s NiakvioRealLab:I '*:S' || true

            echo "FIELD_ANDROID_NATIVE_STATUS mobile=$MOBILE_STATUS tv=$TV_STATUS"
            if [ "$MOBILE_STATUS" -ne 0 ] || [ "$TV_STATUS" -ne 0 ]; then
              exit 1
            fi
            exit 0
