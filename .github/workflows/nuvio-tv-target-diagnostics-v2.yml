name: Diagnose unresolved NuvioTV player chains v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nuvio-tv-target-diagnostics-v2.yml"
      - ".github/triggers/nuvio-tv-target-diagnostics-v2"

permissions:
  contents: write

concurrency:
  group: nuvio-tv-target-diagnostics-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Inspect exact unresolved provider chains
        run: python scripts/nuvio_tv_target_diagnostics_v2.py

      - name: Publish diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/nuvio-tv-target-diagnostics-v2.json
          git commit -m "diag: record unresolved NuvioTV player chains v2" || exit 0
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
