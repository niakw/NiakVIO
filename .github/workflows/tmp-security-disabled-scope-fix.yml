name: TMP Security Disabled Scope Fix

on:
  push:
    branches:
      - hotfix/security-final-disabled-scope-20260917
    paths:
      - '.github/workflows/tmp-security-disabled-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/security-final-disabled-scope-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Patch release-reachable CodeQL scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/security-final-gate.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''              if path.startswith('provider-bases/') and path not in active_base_paths:\n                  continue\n              if current_path is not None and current_path.is_file():\n'''
          new = '''              if path.startswith('provider-bases/') and path not in active_base_paths:\n                  continue\n              # Disabled/archive lifecycle artifacts stay visible to CodeQL for audit,\n              # but they are not release-reachable active provider/base references.\n              if path.startswith(('provider-disabled/','provider-old/')):\n                  continue\n              if current_path is not None and current_path.is_file():\n'''
          if text.count(old) != 1:
              raise SystemExit('security scope patch point changed')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/workflow_security_policy_test.py')
          source = test.read_text(encoding='utf-8')
          anchor = '''if errors:\n    raise SystemExit('workflow security policy failed:\\n- ' + '\\n- '.join(errors))\n'''
          guard = '''if "path.startswith(('provider-disabled/','provider-old/'))" not in security_gate:\n    errors.append('security-final-gate.yml: disabled/archive provider artifacts must remain visible to CodeQL but outside release-reachable alert blocking scope')\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit('workflow security test anchor changed')
          test.write_text(source.replace(anchor, guard + anchor, 1), encoding='utf-8')
          PY

      - name: Validate security scope contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/workflow_security_policy_test.py
          python3 - <<'PY'
          from pathlib import Path
          gate=Path('.github/workflows/security-final-gate.yml').read_text(encoding='utf-8')
          assert "path.startswith(('provider-disabled/','provider-old/'))" in gate
          assert "path.startswith('providers/') and path not in active_provider_paths" in gate
          assert "path.startswith('provider-bases/') and path not in active_base_paths" in gate
          assert "if bad:" in gate
          print('SECURITY_RELEASE_SCOPE_OK active_blocking=true disabled_audit_only=true')
          PY
          git diff --check

      - name: Commit validated security fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Niak'
          git config user.email 'foissy.tommy@gmail.com'
          git add .github/workflows/security-final-gate.yml tests/workflow_security_policy_test.py
          git commit -m 'fix(security): scope final CodeQL gate to release-reachable providers'
          git push origin HEAD:hotfix/security-final-disabled-scope-20260917
