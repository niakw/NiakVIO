name: TEMP Native Diagnostic Dispatch

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-native-diagnostic-dispatch.yml"]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - name: Dispatch all native diagnostic families in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          REF: fix/labs-5.21.44-20260912
        shell: bash
        run: |
          set -euo pipefail
          echo "FIELD_NATIVE_DIAG_DISPATCH source_sha=$(git rev-parse HEAD) ref=$REF"
          gh workflow run native-desktop-reader-acceptance.yml --ref "$REF" & p1=$!
          gh workflow run native-mobile-android-reader.yml --ref "$REF" & p2=$!
          gh workflow run native-mobile-ios-reader.yml --ref "$REF" -f mode=full & p3=$!
          gh workflow run native-corpus-device-targeted.yml --ref "$REF" -f device=tv & p4=$!
          wait "$p1" "$p2" "$p3" "$p4"
          sleep 3
          for wf in native-desktop-reader-acceptance.yml native-mobile-android-reader.yml native-mobile-ios-reader.yml native-corpus-device-targeted.yml; do
            gh run list --workflow "$wf" --event workflow_dispatch --branch "$REF" --limit 2 \
              --json databaseId,headSha,status,conclusion,createdAt,displayTitle \
              --jq '.[] | "FIELD_NATIVE_DIAG_RUN workflow='"$wf"' run=\(.databaseId) sha=\(.headSha) status=\(.status) conclusion=\(.conclusion // "") created=\(.createdAt)"'
          done
      - name: Self-remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-native-diagnostic-dispatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove native diagnostic dispatcher'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin fix/labs-5.21.44-20260912
            git rebase origin/fix/labs-5.21.44-20260912
            if git push origin HEAD:fix/labs-5.21.44-20260912; then exit 0; fi
            sleep 1
          done
          exit 1
