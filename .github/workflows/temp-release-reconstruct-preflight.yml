name: TEMP - Release Reconstruction Preflight
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-release-reconstruct-preflight.yml]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Keep migration/test owners aligned with proof-first Core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Semantic transport migration must accept newer Core revisions.
          p=Path('scripts/enforce_provider_v3_semantic_transport_contract_v5.py')
          s=p.read_text(encoding='utf-8')
          old='''    old_revision = '\"revision\": \"tmdb-data-contract-launch-gate-v26-authoritative-context-reconcile\",'\n    new_revision = '\"revision\": \"tmdb-data-contract-launch-gate-v27-anime-semantic-transport\",'\n    if new_revision not in text:\n        if text.count(old_revision) != 1:\n            raise AssertionError(\"Core media revision source shape drifted\")\n        text = text.replace(old_revision, new_revision, 1)\n        changed = True\n'''
          new='''    old_revision = '\"revision\": \"tmdb-data-contract-launch-gate-v26-authoritative-context-reconcile\",'\n    new_revision = '\"revision\": \"tmdb-data-contract-launch-gate-v27-anime-semantic-transport\",'\n    revision_match = re.search(r'\"revision\"\\s*:\\s*\"tmdb-data-contract-launch-gate-v(\\d+)-[^\"]+\"', text)\n    if not revision_match:\n        raise AssertionError(\"Core media revision source shape drifted\")\n    revision_number = int(revision_match.group(1))\n    if revision_number < 27:\n        if revision_number != 26 or text.count(old_revision) != 1:\n            raise AssertionError(\"Core media revision is older than semantic transport v27 but not migratable\")\n        text = text.replace(old_revision, new_revision, 1)\n        changed = True\n    # A newer Core revision is authoritative. Do not downgrade it merely to make\n    # this historical migration marker exact; providerTransport above is the\n    # semantic/transport invariant this migration owns.\n'''
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif 'revision_number = int(revision_match.group(1))' not in s:
              raise SystemExit('semantic revision anchor missing')

          # Qualified providers get a proof-filtered recipe. A runner-blocked
          # provider must retain its stable candidate recipe intact because an
          # empty live set is environmental evidence, not route invalidation.
          model_old='''    candidate_model_recipe = model.get("candidateApiRecipe")\n    filtered_model_recipe = (\n        filter_recipe_by_live_routes(candidate_model_recipe, live_set)\n        if isinstance(candidate_model_recipe, dict)\n        else None\n    )\n    if isinstance(filtered_model_recipe, dict):\n        filtered_model_recipe["proofModelVersion"] = 5\n        model["apiRecipe"] = filtered_model_recipe\n    else:\n        model.pop("apiRecipe", None)\n'''
          model_new='''    candidate_model_recipe = model.get("candidateApiRecipe")\n    blocked_recipe_plan = completion_state in {"terminal-blocked", "terminal-unreachable"}\n    if blocked_recipe_plan and isinstance(candidate_model_recipe, dict):\n        model["apiRecipe"] = copy.deepcopy(candidate_model_recipe)\n    else:\n        filtered_model_recipe = (\n            filter_recipe_by_live_routes(candidate_model_recipe, live_set)\n            if isinstance(candidate_model_recipe, dict)\n            else None\n        )\n        if isinstance(filtered_model_recipe, dict):\n            filtered_model_recipe["proofModelVersion"] = 5\n            model["apiRecipe"] = filtered_model_recipe\n        else:\n            model.pop("apiRecipe", None)\n'''
          patch_old='''        candidate_recipe = patch.get("candidate_api_recipe") if isinstance(patch.get("candidate_api_recipe"), dict) else patch.get("api_recipe")\n        filtered_patch_recipe = (\n            filter_recipe_by_live_routes(candidate_recipe, live_set)\n            if isinstance(candidate_recipe, dict)\n            else None\n        )\n        if isinstance(filtered_patch_recipe, dict):\n            filtered_patch_recipe["proofModelVersion"] = 5\n            patch["api_recipe"] = filtered_patch_recipe\n        else:\n            patch.pop("api_recipe", None)\n'''
          patch_new='''        candidate_recipe = patch.get("candidate_api_recipe") if isinstance(patch.get("candidate_api_recipe"), dict) else patch.get("api_recipe")\n        if blocked_recipe_plan and isinstance(candidate_recipe, dict):\n            patch["api_recipe"] = copy.deepcopy(candidate_recipe)\n        else:\n            filtered_patch_recipe = (\n                filter_recipe_by_live_routes(candidate_recipe, live_set)\n                if isinstance(candidate_recipe, dict)\n                else None\n            )\n            if isinstance(filtered_patch_recipe, dict):\n                filtered_patch_recipe["proofModelVersion"] = 5\n                patch["api_recipe"] = filtered_patch_recipe\n            else:\n                patch.pop("api_recipe", None)\n'''
          for path in (
              Path('scripts/validate_provider_v3_routes_sequential.py'),
              Path('scripts/upgrade_provider_v3_finalization_v1.py'),
          ):
              text=path.read_text(encoding='utf-8')
              for old_block,new_block,label in (
                  (model_old,model_new,'model recipe'),
                  (patch_old,patch_new,'patch recipe'),
              ):
                  if old_block in text:
                      text=text.replace(old_block,new_block,1)
                  elif new_block not in text:
                      raise SystemExit(f'{path}: {label} anchor missing')
              path.write_text(text,encoding='utf-8')

          # The upgrader validator must lock the blocked-plan invariant too.
          u=Path('scripts/upgrade_provider_v3_finalization_v1.py')
          us=u.read_text(encoding='utf-8')
          required_anchor='''        'PROVIDER_V3_ROUTE_PROOF_AUTHORITY_V5',\n        'filter_recipe_by_live_routes(candidate_model_recipe, live_set)',\n'''
          required_new='''        'PROVIDER_V3_ROUTE_PROOF_AUTHORITY_V5',\n        'blocked_recipe_plan = completion_state in {"terminal-blocked", "terminal-unreachable"}',\n        'model["apiRecipe"] = copy.deepcopy(candidate_model_recipe)',\n        'patch["api_recipe"] = copy.deepcopy(candidate_recipe)',\n        'filter_recipe_by_live_routes(candidate_model_recipe, live_set)',\n'''
          if required_anchor in us:
              us=us.replace(required_anchor,required_new,1)
          elif 'model["apiRecipe"] = copy.deepcopy(candidate_model_recipe)' not in us:
              raise SystemExit('upgrader validator blocked-plan anchor missing')
          u.write_text(us,encoding='utf-8')

          # Keep the proof-first assertions for qualified providers.
          t=Path('tests/provider_v3_finalization_plan_test.py')
          q=t.read_text(encoding='utf-8')
          replacements={
              'assert final_model["apiRecipe"]["statusUrl"] == "https://plan.test/status", final_model["apiRecipe"]':
              'assert "statusUrl" not in final_model["apiRecipe"], final_model["apiRecipe"]',
              'assert patch["api_recipe"]["statusUrl"] == "https://plan.test/status", patch':
              'assert "statusUrl" not in patch["api_recipe"], patch',
              '"blocked_stable_plan=preserved api_recipe=atomic"':
              '"blocked_stable_plan=preserved api_recipe=proof-filtered"',
          }
          for old_line,new_line in replacements.items():
              if old_line in q:
                  q=q.replace(old_line,new_line,1)
              elif new_line not in q:
                  raise SystemExit('finalization proof assertion anchor missing: '+old_line)
          t.write_text(q,encoding='utf-8')
          PY
          python -m py_compile scripts/enforce_provider_v3_semantic_transport_contract_v5.py scripts/validate_provider_v3_routes_sequential.py scripts/upgrade_provider_v3_finalization_v1.py tests/provider_v3_finalization_plan_test.py
          python tests/provider_route_proof_authority_test.py
          python tests/provider_v3_finalization_plan_test.py
          git diff --check
          if ! git diff --quiet -- scripts/enforce_provider_v3_semantic_transport_contract_v5.py scripts/validate_provider_v3_routes_sequential.py scripts/upgrade_provider_v3_finalization_v1.py tests/provider_v3_finalization_plan_test.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/enforce_provider_v3_semantic_transport_contract_v5.py scripts/validate_provider_v3_routes_sequential.py scripts/upgrade_provider_v3_finalization_v1.py tests/provider_v3_finalization_plan_test.py
            git commit -m 'fix(finalizer): preserve blocked provider recipes'
            git push origin HEAD:release/stable-46-20260912
          fi
      - name: Source-plan and Core migration owners
        run: |
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
      - name: Durable DATA preparation contracts
        run: |
          test -s automation/provider-v3-static-knowledge.json
          test -s automation/provider-v3-recognition-seeds.json
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_static_knowledge_contract_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
      - name: ProviderBase store
        run: |
          python scripts/materialize_provider_base_v3_store.py
          python scripts/provider_base_store.py validate
          python scripts/provider_base_store.py validate --artifacts
      - name: Reconstruction input test suite
        run: |
          python tests/provider_v3_workflow_ownership_test.py
          python tests/provider_v3_documentation_contract_test.py
          python tests/native_five_lab_coverage_test.py
          python tests/canonical_media_types_test.py
          python tests/provider_stream_scope_architecture_test.py
          python tests/native_ios_watchdog_resume_test.py
          python tests/provider_v3_minimizer_contract_test.py
          python tests/provider_v3_minimizer_preview_test.py
          python tests/provider_html_filter_security_test.py
          python tests/provider_v3_static_knowledge_contract_test.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python tests/provider_patch_sibling_import_test.py
          python tests/provider_v3_identity_preflight_contract_test.py
          python tests/provider_v3_id_provenance_contract_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/peachify_runtime_crypto_test.py
          python scripts/provider_base_store.py validate
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_521_capability_regression_test.py
          python tests/provider_anime_semantic_transport_contract_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/native_hls_integrity_budget_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
          git diff --check
