name: Integrate AnimeZey stream host repair

on:
  push:
    branches:
      - fix/animezey-stream-host-v1
    paths:
      - .github/triggers/integrate-animezey-stream-host

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add narrow AnimeZey stream-host wrapper
        run: |
          cat > scripts/provider_patches/animezey_stream_host_v1.py <<'PY'
          """Rewrite only stale AnimeZey download-stream hosts after native extraction."""
          from __future__ import annotations
          import json

          MARKER = "NUVIO_ANIMEZEY_STREAM_HOST_V1"

          def apply(source: str, options: dict | None = None, **_kwargs) -> str:
              if MARKER in source:
                  return source
              cfg = dict(options or {})
              old_host = str(cfg.get("from_host") or "animezey16082023.animezey16082023.workers.dev").strip().lower()
              new_host = str(cfg.get("to_host") or "1.animezeydl.workers.dev").strip().lower()
              if not old_host or not new_host:
                  raise ValueError("animezey_stream_host_v1 requires from_host and to_host")
              payload = json.dumps({"fromHost": old_host, "toHost": new_host}, separators=(",", ":"))
              shim = r'''
          /* NUVIO_ANIMEZEY_STREAM_HOST_V1 */
          ;(function(g,c){"use strict";
          function slot(v){if(Array.isArray(v))return{key:null,list:v};if(v&&typeof v==="object"){for(var i=0;i<3;i++){var k=["streams","results","data"][i];if(Array.isArray(v[k]))return{key:k,list:v[k]}}}return null}
          function rebuild(v,s,list){if(s.key===null)return list;var out=Object.assign({},v);out[s.key]=list;return out}
          function rewriteUrl(raw){var value=String(raw==null?"":raw).trim();if(!/^https?:\/\//i.test(value))return value;try{var u=new URL(value);if(u.hostname.toLowerCase()!==c.fromHost)return value;u.hostname=c.toHost;return u.toString()}catch(_e){return value}}
          function rewriteRow(row){if(!row||typeof row!=="object")return row;var url=String(row.url||"");var next=rewriteUrl(url);if(next===url)return row;var copy=Object.assign({},row,{url:next});return copy}
          function install(target){if(!target||typeof target.getStreams!=="function"||target.getStreams.__nuvioAnimeZeyStreamHostV1)return false;var native=target.getStreams;var wrapped=async function(){var value=await native.apply(this,arguments);var s=slot(value);if(!s)return value;return rebuild(value,s,s.list.map(rewriteRow))};wrapped.__nuvioAnimeZeyStreamHostV1=true;wrapped.__nuvioAnimeZeyStreamHostOriginal=native;target.getStreams=wrapped;return true}
          var ok=false;try{if(typeof module!=="undefined"&&module.exports)ok=install(module.exports)}catch(_e){}try{if(g&&typeof g.getStreams==="function"){if(ok&&typeof module!=="undefined"&&module.exports)g.getStreams=module.exports.getStreams;else{var box={getStreams:g.getStreams};install(box);g.getStreams=box.getStreams}}}catch(_e){}
          })(typeof globalThis!=="undefined"?globalThis:this,CONFIG_PLACEHOLDER);
          '''.replace("CONFIG_PLACEHOLDER", payload)
              return source.rstrip() + "\n" + shim.lstrip() + "\n"
          PY

          cat > tests/animezey_stream_host_v1_test.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import importlib.util, json, subprocess, tempfile
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          path=ROOT/'scripts/provider_patches/animezey_stream_host_v1.py'
          spec=importlib.util.spec_from_file_location('animezey_patch',path); mod=importlib.util.module_from_spec(spec)
          assert spec.loader is not None; spec.loader.exec_module(mod)
          source=mod.apply('module.exports={getStreams:async()=>({streams:[{url:"https://animezey16082023.animezey16082023.workers.dev/download.aspx?id=1&token=x",quality:"1080p"},{url:"https://other.example/video.mkv"}]})};\n',options={'from_host':'animezey16082023.animezey16082023.workers.dev','to_host':'1.animezeydl.workers.dev'})
          runner='''const vm=require("vm");const src=process.argv[2];const sandbox={module:{exports:{}},exports:{},URL};sandbox.globalThis=sandbox;vm.runInNewContext(src,sandbox);sandbox.module.exports.getStreams({}).then(v=>console.log(JSON.stringify(v)));'''
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'run.cjs';p.write_text(runner,encoding='utf-8')
              cp=subprocess.run(['node',str(p),source],capture_output=True,text=True,timeout=10)
              assert cp.returncode==0,cp.stderr
              rows=json.loads(cp.stdout)['streams']
              assert rows[0]['url'].startswith('https://1.animezeydl.workers.dev/download.aspx?'),rows
              assert 'token=x' in rows[0]['url'],rows
              assert rows[1]['url']=='https://other.example/video.mkv',rows
          print('AnimeZey stream host wrapper test passed')
          PY

      - name: Register AnimeZey patch and permanent regression test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('provider-overrides.json'); data=json.loads(path.read_text(encoding='utf-8'))
          cfg=data.setdefault('provider_patches',{}).setdefault('animezey',{})
          scripts=list(cfg.get('patch_scripts') or [])
          patch='scripts/provider_patches/animezey_stream_host_v1.py'
          if patch in scripts: scripts.remove(patch)
          scripts.insert(0,patch)
          cfg['patch_scripts']=scripts
          options=cfg.setdefault('patch_script_options',{})
          options[patch]={
              'from_host':'animezey16082023.animezey16082023.workers.dev',
              'to_host':'1.animezeydl.workers.dev',
          }
          required=list(cfg.get('required_values') or [])
          if 'NUVIO_ANIMEZEY_STREAM_HOST_V1' not in required: required.append('NUVIO_ANIMEZEY_STREAM_HOST_V1')
          cfg['required_values']=required
          notes=list(cfg.get('notes') or [])
          note='Rewrite only stale AnimeZey download URLs to the currently byte-range-capable stream Worker; keep listing/search endpoints unchanged.'
          if note not in notes: notes.append(note)
          cfg['notes']=notes
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          package=Path('package.json'); pkg=json.loads(package.read_text(encoding='utf-8'))
          extra='python tests/animezey_stream_host_v1_test.py'
          if extra not in pkg['scripts']['test']: pkg['scripts']['test'] += ' && ' + extra
          package.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Reapply AnimeZey override and prepare candidate release
        run: |
          PREVIOUS_MANIFEST="$(mktemp)"
          cp manifest.json "$PREVIOUS_MANIFEST"
          python scripts/reapply_published_overrides.py
          python scripts/prune_unreferenced_providers.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Prove AnimeZey movie and episode streams are real byte-range media
        env:
          NUVIO_NETWORK_MAX_REQUESTS: "120"
          NUVIO_WORKER_MEMORY_MB: "384"
        run: |
          python - <<'PY'
          import json, subprocess, urllib.request
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in manifest['scrapers'] if x.get('id')=='animezey')
          provider=Path(row['filename'])
          context={'locale':'fr-FR','language':'fr','languages':['fr-FR','fr'],'platform':'android','settings':{},'storage':{}}
          fixtures=[
              {'tmdbId':'157336','mediaType':'movie','title':'Interstellar','year':2014,'label':'Interstellar'},
              {'tmdbId':'1396','mediaType':'tv','season':1,'episode':1,'title':'Breaking Bad','year':2008,'label':'Breaking Bad S01E01'},
          ]
          def parsed(stdout):
              for line in reversed(stdout.splitlines()):
                  line=line.strip()
                  if line.startswith('NUVIO_HEALTH_RESULT='): line=line.split('=',1)[1]
                  try:return json.loads(line)
                  except Exception:pass
              return None
          def streams(v):
              if isinstance(v,list): return v
              if isinstance(v,dict):
                  for k in ('streams','results','data'):
                      if isinstance(v.get(k),list): return v[k]
              return []
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/148 Safari/537.36'
          for fixture in fixtures:
              cp=subprocess.run(['node','scripts/provider_worker.cjs',str(provider),json.dumps(fixture),json.dumps(context),'2'],capture_output=True,text=True,timeout=100)
              assert cp.returncode==0,(fixture,cp.stderr[-4000:])
              rows=streams(parsed(cp.stdout)); assert rows,(fixture,cp.stdout[-6000:])
              assert all('animezey16082023.animezey16082023.workers.dev' not in str(r.get('url','')) for r in rows),rows
              corrected=[r for r in rows if '1.animezeydl.workers.dev' in str(r.get('url',''))]
              assert corrected,(fixture,rows)
              playable=0
              for r in corrected[:5]:
                  url=str(r.get('url') or '')
                  headers={'User-Agent':ua,'Accept':'video/*,application/octet-stream,*/*','Range':'bytes=0-16383'}
                  for k,v in (r.get('headers') or {}).items(): headers[str(k)]=str(v)
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as res:
                          prefix=res.read(16); ct=(res.headers.get('content-type') or '').lower(); status=getattr(res,'status',None)
                          if status==206 and (prefix[:4]==bytes([0x1a,0x45,0xdf,0xa3]) or 'matroska' in ct or ct.startswith('video/')):
                              playable+=1
                  except Exception:
                      pass
              assert playable>=1,(fixture,corrected)
              print(f"AnimeZey live proof passed: {fixture['label']} playable={playable} streams={len(rows)}")
          PY

      - name: Remove integration-only CI files
        run: |
          rm -f .github/workflows/integrate-animezey-stream-host.yml
          rm -f .github/triggers/integrate-animezey-stream-host

      - name: Generate hashes and create candidate commit
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: route AnimeZey streams through live worker"

      - name: Validate candidate in isolated worktree
        run: |
          git worktree add --detach /tmp/niakvio-animezey HEAD
          cd /tmp/niakvio-animezey
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/validate_release_integrity.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          npm test

      - name: Publish only after targeted validation
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
