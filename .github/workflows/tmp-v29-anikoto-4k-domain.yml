name: TMP - V29 AniKoto 4K Domain

on:
  pull_request:
    branches:
      - tmp/v29-base
      - tmp/v29b-base
      - tmp/v29c-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight contracts
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 tests/provider_base_absolute_route_domain_substitution_test.py
          python3 tests/provider_base_template_identity_test.py
          python3 tests/domain_refresh_provider_identity_test.py
          python3 -m py_compile scripts/provider_base_store.py scripts/materialize_provider_v3_all.py scripts/provider_patches/anikototv_runtime_v3.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Apply Domain Refresh authority for 4KHDHub
        run: |
          set -euo pipefail
          cp provider-overrides.json health-output/provider-overrides-before-domain.json
          python3 scripts/refresh_authoritative_hub_domains.py \
            --provider 4khdhub \
            --apply \
            --mode quick \
            --output health-output/v29-domain-refresh.json
          cp provider-overrides.json health-output/provider-overrides-after-domain.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('health-output/provider-overrides-before-domain.json').read_text())
          after=json.loads(Path('health-output/provider-overrides-after-domain.json').read_text())
          b=(before.get('provider_patches') or {}).get('4khdhub') or {}
          a=(after.get('provider_patches') or {}).get('4khdhub') or {}
          print('FIELD_V29_DOMAIN',
                'before='+str(b.get('official_site') or ''),
                'after='+str(a.get('official_site') or ''),
                'runtime='+json.dumps(a.get('runtime_domain_replacements') or {},separators=(',',':')))
          if str(a.get('official_site') or '').rstrip('/') != 'https://4khdhub.one':
              raise SystemExit('4KHDHub Domain Refresh did not restore authoritative 4khdhub.one')
          PY

      - name: Materialize current ProviderBase
        run: |
          set -euo pipefail
          python3 scripts/materialize_provider_v3_all.py \
            --source-manifest manifest.json \
            --output-dir providers \
            --report health-output/v29-materialization.json

      - name: Verify generated identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          ids={'anikototv','4khdhub'}
          m=json.loads(Path('manifest.json').read_text())
          for row in m.get('scrapers') or []:
              pid=str(row.get('id') or '').lower()
              if pid not in ids: continue
              p=Path(str(row.get('filename') or '').replace('../',''))
              text=p.read_text()
              mm=re.search(r'(?:const|let|var)\s+NIAKVIO_PROVIDER_MODEL\s*=\s*Object\.freeze\((\{.*?\})\);',text,re.S)
              model=json.loads(mm.group(1)) if mm else {}
              print('FIELD_V29_MODEL',pid,
                    'site='+str(model.get('officialSite') or ''),
                    'domains='+json.dumps(model.get('domainSubstitutions') or {},separators=(',',':')),
                    'v35='+str('NIAKVIO_PROVIDER_ABSOLUTE_ROUTE_DOMAIN_SUBSTITUTION_V35' in text).lower(),
                    'aes='+str('anikoto_megaplay_webcrypto' in text).lower(),
                    'native='+str('__crypto_aes_decrypt_raw' in text).lower(),
                    'dataId='+str('data-id' in text).lower())
          PY

      - name: Targeted certification
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider anikototv \
            --provider 4khdhub \
            --candidate-limit 12 \
            --timeout 30 \
            --workers 2 \
            --seed "v29-${GITHUB_RUN_ID}" \
            --output health-output/v29-certification.json

      - name: Summarize V29
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v29-certification.json').read_text())
          for row in p.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              print('FIELD_V29_RESULT',row.get('providerId'),
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower())
              for lane,v in lanes.items():
                  for a in (v or {}).get('attempts') or []:
                      if a.get('debugStage')=='provider_returned_streams':
                          continue
                      net=a.get('networkTrace') or []
                      if net:
                          print('FIELD_V29_NET',row.get('providerId'),lane,
                                json.dumps(net[:8],separators=(',',':')))
                          break
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v29-anikoto-4k-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
