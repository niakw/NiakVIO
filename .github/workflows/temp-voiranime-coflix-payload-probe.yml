name: TEMP - VoirAnime Coflix Payload Probe
# retry: minimal-contract-proof

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-voiranime-coflix-payload-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove minimal current contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,time,urllib.parse,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
          def req(url,method='GET',data=None,referer=None,accept='*/*'):
              h={'User-Agent':UA,'Accept':accept}
              if referer:h['Referer']=referer
              if isinstance(data,dict):data=urllib.parse.urlencode(data).encode();h['Content-Type']='application/x-www-form-urlencoded; charset=UTF-8'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=20) as x:return x.status,x.geturl(),x.read().decode('utf-8','replace'),dict(x.headers)
              except urllib.error.HTTPError as e:return e.code,url,e.read().decode('utf-8','replace'),dict(e.headers)
              except Exception as e:return 0,url,'',{'error':type(e).__name__+':'+str(e)}
          def hls(url,referer):
              st,fu,body,h=req(url,referer=referer,accept='application/vnd.apple.mpegurl,application/x-mpegURL,*/*')
              return st,bool(re.search(r'^#EXTM3U',body,re.M)),urllib.parse.urlparse(fu).hostname or ''

          base='https://coflix.group/wp-json/coflix/v1/resolve'
          fixtures=[
              ('movie',{'tmdb':'157336','type':'movie'}),
              ('tv',{'tmdb':'1396','type':'tv','season':'1','episode':'1'}),
              ('anime-tv',{'tmdb':'95479','type':'tv','season':'1','episode':'1'}),
          ]
          for label,params in fixtures:
              url=base+'?'+urllib.parse.urlencode(params)
              final=None
              for attempt in range(4):
                  st,fu,body,h=req(url,referer='https://coflix.group/')
                  try:j=json.loads(body)
                  except:j={}
                  print(f'COFLIX_MINIMAL {label} attempt={attempt} status={st} ok={1 if j.get("ok") else 0} pending={1 if j.get("pending") else 0} mode={j.get("mode")} servers={len(j.get("servers") or [])} error={j.get("error") or ""}')
                  if j.get('ok'):
                      final=j;break
                  if not j.get('pending'):break
                  time.sleep(2)
              if final and final.get('play'):
                  ms,valid,host=hls(final['play'],'https://coflix.group/')
                  print(f'COFLIX_MINIMAL_HLS {label} status={ms} valid={1 if valid else 0} host={host} lang={final.get("lang") or ""}')

          # VoirAnime exact S1/E1 path, then inspect whether current Vidzy embed yields a direct HLS in bounded HTML.
          st,fu,body,h=req('https://voiranime.homes/engine/ajax/search.php','POST',{'query':'Jujutsu Kaisen','page':'1'},'https://voiranime.homes/')
          m=re.search(r"location\.href=['\"]/(\d+)-jujutsu-kaisen-saison-1-2020\.html",body,re.I)
          if not m:
              print('VOIRANIME_MINIMAL unresolved=search_id')
          else:
              aid=m.group(1); detail=f'https://voiranime.homes/{aid}-jujutsu-kaisen-saison-1-2020.html'
              es,ef,eb,eh=req(f'https://voiranime.homes/engine/ajax/manga_episodes_api.php?id={aid}',referer=detail,accept='application/json,*/*')
              try:ej=json.loads(eb)
              except:ej={}
              row=((ej.get('vf') or {}).get('1') or {})
              print(f'VOIRANIME_MINIMAL episodes_status={es} vf_hosts={len(row)} keys={";".join(sorted(row.keys()))}')
              for name,embed in list(row.items())[:3]:
                  ps,pf,pb,ph=req(embed,referer=detail)
                  urls=re.findall(r'https?://[^"\'<>\\ ]+\.m3u8[^"\'<>\\ ]*',pb,re.I)
                  valid=0;media_status=0;media_host=''
                  for u in urls[:2]:
                      media_status,ok,media_host=hls(u,pf)
                      if ok:valid=1;break
                  print(f'VOIRANIME_EMBED hoster={name} status={ps} html_bytes={len(pb)} hls_candidates={len(urls)} hls_valid={valid} media_status={media_status} media_host={media_host}')
          PY
