name: TEMP - VoirAnime Coflix Payload Probe
# retry: second-hop-and-rest-resolver

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-voiranime-coflix-payload-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect local DATA and live second hops
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,urllib.parse,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
          def req(url,method='GET',data=None,referer=None,headers=None):
              h={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}
              if headers:h.update(headers)
              if referer:h['Referer']=referer
              if isinstance(data,dict):
                  data=urllib.parse.urlencode(data).encode();h['Content-Type']='application/x-www-form-urlencoded; charset=UTF-8'
              r=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=15) as x:return x.status,x.geturl(),x.read().decode('utf-8','replace'),dict(x.headers)
              except urllib.error.HTTPError as e:return e.code,url,e.read().decode('utf-8','replace'),dict(e.headers)
              except Exception as e:return 0,url,'',{'error':type(e).__name__+':'+str(e)}
          def compact(s,n=5000):return re.sub(r'\s+',' ',s or '').strip()[:n]

          ov=json.load(open('provider-overrides.json'))
          for pid in ('voiranime','coflix'):
              p=ov.get('provider_patches',{}).get(pid,{})
              wanted={k:p.get(k) for k in ('official_site','official_api','capability','identity_input','search_request_plan','provider_value_plan','external_identity_plan','api_recipe','provider_lego_scripts','candidate_learned_routes','learned_routes') if k in p}
              print(pid.upper()+'_LOCAL_DATA '+json.dumps(wanted,ensure_ascii=False))

          # VoirAnime: extract numeric id from live href then call episode API.
          st,final,body,h=req('https://voiranime.homes/engine/ajax/search.php','POST',{'query':'Jujutsu Kaisen','page':'1'},'https://voiranime.homes/')
          hrefs=re.findall(r"location\.href=['\"]([^'\"]+)|href=['\"]([^'\"]+)",body,re.I)
          vals=[]
          for a,b in hrefs:
              v=a or b
              if v and v not in vals:vals.append(v)
          candidates=[]
          for v in vals:
              m=re.match(r'^/(\d+)-([^?#]+)\.html$',v)
              if m:candidates.append((m.group(1),m.group(2),v))
          print('VOIRANIME_SEARCH_CANDIDATES '+json.dumps(candidates[:12],ensure_ascii=False))
          chosen=next((x for x in candidates if 'jujutsu-kaisen-saison-1-2020' in x[1]), candidates[0] if candidates else None)
          if chosen:
              aid=chosen[0]
              eu=f'https://voiranime.homes/engine/ajax/manga_episodes_api.php?id={aid}'
              es,ef,eb,eh=req(eu,referer='https://voiranime.homes'+chosen[2])
              print(f'VOIRANIME_EPISODES status={es} bytes={len(eb)} type={eh.get("Content-Type","")}')
              print('VOIRANIME_EPISODES_BODY '+json.dumps(compact(eb,7000),ensure_ascii=False))
              print('VOIRANIME_EPISODES_URLS '+json.dumps(re.findall(r'https?://[^"\'<> ]+',eb,re.I)[:40],ensure_ascii=False))
              try:
                  j=json.loads(eb)
                  print('VOIRANIME_EPISODES_JSON '+json.dumps(j,ensure_ascii=False)[:12000])
              except Exception:pass
              ds,df,db,dh=req('https://voiranime.homes'+chosen[2],referer='https://voiranime.homes/')
              print(f'VOIRANIME_DETAIL status={ds} bytes={len(db)}')
              print('VOIRANIME_DETAIL_IFRAMES '+json.dumps(re.findall(r'<iframe[^>]+src=["\']([^"\']+)',db,re.I)[:20],ensure_ascii=False))

          # Coflix current player plugin code tells us exactly how REST /resolve is invoked.
          ps,pf,pjs,ph=req('https://coflix.group/wp-content/plugins/coflix-player/assets/player.js?ver=0.8.5',referer='https://coflix.group/film/gandhari/')
          print(f'COFLIX_PLAYER_JS status={ps} bytes={len(pjs)}')
          for needle in ('resolve','cfg.rest','data-cfp','fetch(','URLSearchParams','tmdb','src1'):
              idx=pjs.find(needle)
              if idx>=0:print('COFLIX_PLAYER_WINDOW_'+re.sub('[^A-Z0-9]+','_',needle.upper())+' '+json.dumps(compact(pjs[max(0,idx-1600):idx+4000],5800),ensure_ascii=False))

          detail='https://coflix.group/film/gandhari/'
          cs,cf,cb,ch=req(detail,referer='https://coflix.group/')
          m=re.search(r'data-cfp=["\']([^"\']+)["\']',cb,re.I)
          if m:
              cfg=json.loads(html.unescape(m.group(1)))
              print('COFLIX_CFP '+json.dumps(cfg,ensure_ascii=False))
              rest=cfg.get('rest');params=cfg.get('params') or {}
              trials=[]
              trials.append(('GET_QUERY',rest+'?'+urllib.parse.urlencode(params),'GET',None,{'Accept':'application/json'}))
              trials.append(('POST_FORM',rest,'POST',params,{'Accept':'application/json'}))
              for label,url,method,data,headers in trials:
                  rs,rf,rb,rh=req(url,method,data,detail,headers)
                  print(f'COFLIX_RESOLVE_{label} status={rs} bytes={len(rb)} type={rh.get("Content-Type","")} final={rf}')
                  print('COFLIX_RESOLVE_'+label+'_BODY '+json.dumps(compact(rb,9000),ensure_ascii=False))
          PY
