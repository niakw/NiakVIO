name: TEMP - Prove Materialized VoirAnime Native Context
# retry: parse-health-envelope

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-voiranime-coflix-payload-probe.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Materialize current VoirAnime candidate
        run: |
          set -euo pipefail
          python tests/voiranime_homes_runtime_v1_test.py
          python scripts/install_voiranime_coflix_runtime_v1.py
          python scripts/materialize_provider_v3_one.py voiranime
      - name: Prove exact generated bundle with native worker metadata shape
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER="$(python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          print(next(x['filename'] for x in m['scrapers'] if str(x.get('id','')).casefold()=='voiranime'))
          PY
          )"
          FIXTURE='{"label":"Jujutsu Kaisen S01E01","tmdbId":"95479","mediaType":"anime","category":"anime","season":1,"episode":1,"title":"Jujutsu Kaisen","year":2020}'
          CONTEXT='{"platform":"android","locale":"fr-FR","fixtureMetadata":{"id":95479,"name":"Jujutsu Kaisen","original_name":"呪術廻戦","first_air_date":"2020-10-03","origin_country":["JP"],"original_language":"ja","genres":[{"id":16,"name":"Animation"}],"keywords":{"results":[{"name":"anime"}]},"canonicalMediaType":"anime"},"networkLimits":{"maxFetches":30,"maxResponseBytes":5242880},"maxSettingsProfiles":1}'
          node scripts/provider_worker.cjs "$PROVIDER" "$FIXTURE" "$CONTEXT" > /tmp/voiranime-worker.out
          python - <<'PY'
          import json
          lines=open('/tmp/voiranime-worker.out',encoding='utf-8').read().splitlines()
          line=next((x for x in reversed(lines) if x.startswith('NUVIO_HEALTH_RESULT=')),None)
          assert line, lines
          x=json.loads(line.split('=',1)[1])
          streams=x.get('streams') or []
          print('VOIRANIME_NATIVE_WORKER_RESULT '+json.dumps({'ok':x.get('ok'),'stream_count':x.get('stream_count'),'raw_stream_count':x.get('raw_stream_count'),'provider_server_hosts':x.get('provider_server_hosts'),'provider_server_http_statuses':x.get('provider_server_http_statuses')},ensure_ascii=False))
          print('VOIRANIME_NATIVE_WORKER_STREAMS '+json.dumps(streams[:4],ensure_ascii=False))
          print('VOIRANIME_NATIVE_WORKER_OBSERVATIONS '+json.dumps((x.get('network_observations') or [])[:12],ensure_ascii=False))
          assert x.get('ok') is True,x
          assert len(streams)>=1,x
          assert any(str(s.get('url','')).startswith('http') for s in streams),streams
          PY
      - name: Prove direct invocation with trusted metadata contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8')),row=m.scrapers.find(x=>String(x.id).toLowerCase()==='voiranime'),p=path.resolve(row.filename);
          globalThis.__nuvioMediaContext={tmdbId:'95479',tmdbNamespace:'tv',tmdbIdentity:'tv:95479',canonicalMediaType:'anime',nuvioInputMediaType:'anime',tmdbResolutionDegraded:false,season:1,episode:1,tmdbMetadata:{id:95479,name:'Jujutsu Kaisen',canonicalMediaType:'anime',__nuvioTmdbNamespace:'tv',__nuvioTmdbId:'95479',origin_country:['JP'],original_language:'ja',genres:[{id:16,name:'Animation'}],keywords:{results:[{name:'anime'}]}}};
          const mod=require(p),fn=mod.getStreams||globalThis.getStreams;
          (async()=>{const rows=await fn('95479','anime',1,1);console.log('VOIRANIME_TRUSTED_CONTEXT_RESULT streams='+rows.length+' urls='+rows.slice(0,4).map(x=>x.url).join(';'));if(!rows.length)process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
