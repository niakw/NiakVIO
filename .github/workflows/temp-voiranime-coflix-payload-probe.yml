name: TEMP - Diagnose Materialized VoirAnime

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-voiranime-coflix-payload-probe.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Materialize current candidate
        run: |
          set -euo pipefail
          python tests/voiranime_homes_runtime_v1_test.py
          python scripts/install_voiranime_coflix_runtime_v1.py
          python scripts/materialize_provider_v3_one.py voiranime
      - name: Trace generated VoirAnime fetches and wrapper order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const row=m.scrapers.find(x=>String(x.id).toLowerCase()==='voiranime');const p=path.resolve(row.filename);const src=fs.readFileSync(p,'utf8');
          const markers=['NIAKVIO_VOIRANIME_HOMES_RUNTIME_V1','NUVIO_STREAM_OUTPUT_SANITIZER_V4','NUVIO_TARGET_MEDIA_HOST_FILTER_V4','SOURCE_PLAN_V4','STREAM_IDENTITY'];
          for(const x of markers)console.log(`SOURCE_MARKER ${x} first=${src.indexOf(x)} last=${src.lastIndexOf(x)}`);
          console.log(`SOURCE_INFO file=${row.filename} bytes=${src.length} getStreams_mentions=${(src.match(/getStreams/g)||[]).length}`);
          const nativeFetch=globalThis.fetch.bind(globalThis);let n=0;
          globalThis.fetch=async function(input,init){
            const u=typeof input==='string'?input:String(input&&input.url||input);const method=String((init&&init.method)||'GET').toUpperCase();
            let r;try{r=await nativeFetch(input,init)}catch(e){console.log(`FETCH_TRACE #${++n} ${method} ${u} ERROR ${e.message}`);throw e}
            console.log(`FETCH_TRACE #${++n} ${method} ${u} status=${r.status} final=${r.url}`);
            try{
              if(u.includes('/engine/ajax/search.php')||u.includes('/manga_episodes_api.php')){
                const clone=r.clone(),t=await clone.text();console.log(`FETCH_BODY #${n} bytes=${t.length} prefix=${JSON.stringify(t.slice(0,700))}`);
              }
            }catch(e){console.log('FETCH_CLONE_ERROR '+e.message)}
            return r;
          };
          globalThis.__nuvioMediaContext={canonicalMediaType:'anime',tmdbId:'95479',season:1,episode:1,tmdbMetadata:{name:'Jujutsu Kaisen'}};
          delete require.cache[p];const mod=require(p);const fn=mod.getStreams||globalThis.getStreams;
          (async()=>{const rows=await fn('95479','tv',1,1);console.log('VOIRANIME_GENERATED_RESULT '+JSON.stringify(rows));console.log('VOIRANIME_TRACE_DONE fetches='+n+' streams='+(Array.isArray(rows)?rows.length:-1));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
