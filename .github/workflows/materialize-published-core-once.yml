name: Finalize published Core metadata once
# target: metadata-only-after-checkpoint-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-published-core-once.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-materialize-published-core-once
  cancel-in-progress: true

jobs:
  finalize-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce metadata-only resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Core metadata-only resume started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Provider convergence is NOT repeated; checkpoint 41e68b71 is reused."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require proven provider checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 41e68b71cf846af2deed274c4730d0527b855081 HEAD
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/activation_preservation_core_rehash_test.py

      - name: Rebuild publication metadata only
        shell: bash
        run: |
          set -euo pipefail
          git show 8cc553d1b1576ea8ad116f3ec2ea5cb356aa9326:manifest.json > "$RUNNER_TEMP/manifest-before-core-materialization.json"
          python3 scripts/generate_language_manifests.py
          python3 scripts/prune_unreferenced_providers.py
          python3 scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before-core-materialization.json"
          node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
          python3 scripts/generate_language_manifests.py
          python3 scripts/sync_release_versions.py --manifest manifest.json --previous "$RUNNER_TEMP/manifest-before-core-materialization.json"
          python3 scripts/prune_unreferenced_providers.py

      - name: Remove one-shot then seal exact release hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-published-core-once.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/activation_preservation_core_rehash_test.py
          python3 tests/provider_purification_contract_test.py
          python3 tests/provider_wrapper_isolation_test.py
          python3 tests/provider_security_hardening_test.py
          python3 tests/prune_unreferenced_providers_test.py
          node engine_v2/tests/provider-catalog.test.mjs
          git add -A
          git commit -m 'chore: finalize published Core metadata [skip ci]'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Published Core metadata finalized on main ${SHA}: provider checkpoint reused, release metadata/hashes sealed after one-shot removal, release integrity and fixed-point checks green. Full Core was not restarted."

      - name: Report metadata resume failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Core metadata-only resume FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Provider checkpoint remains on main; do not restart full Core."
