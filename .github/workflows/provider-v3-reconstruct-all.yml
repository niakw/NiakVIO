name: MANUAL - Reconstruct Provider v3 96/96

on:
  workflow_dispatch:
    inputs:
      commit_reconstruction:
        description: Commit the verified reconstruction back to the selected non-main branch
        required: false
        default: false
        type: boolean
  push:
    branches:
      - workbench/provider-v3-recognition-routes-data
    paths:
      - '.github/triggers/provider-v3-reconstruct-all.json'

permissions:
  contents: write

concurrency:
  group: provider-v3-manual-reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact reconstruction SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "Reconstruction checkout drifted from event SHA." >&2
            exit 1
          }
          echo "FIELD_RECONSTRUCTION_SHA sha=${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate NiakVIO-owned Provider source-plan reader
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
      - name: Enforce anime semantic and TV/movie transport contract
        run: |
          set -euo pipefail
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
      - name: Enrich durable Provider DATA from NiakVIO-owned knowledge
        shell: bash
        run: |
          set -euo pipefail
          test -s automation/provider-v3-static-knowledge.json || {
            echo "Durable Provider v3 static knowledge is missing." >&2
            exit 1
          }
          test -s automation/provider-v3-recognition-seeds.json || {
            echo "NiakVIO Provider v3 recognition seeds are missing." >&2
            exit 1
          }
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_static_knowledge_contract_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
      - name: Refuse direct main mutation
        if: inputs.commit_reconstruction
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" != "main" || {
            echo "Manual Provider v3 reconstruction may never commit directly to main; use a branch + PR." >&2
            exit 1
          }
      - name: Materialize canonical clean ProviderBase v3 store
        run: |
          set -euo pipefail
          python scripts/materialize_provider_base_v3_store.py
          python scripts/provider_base_store.py validate
          python scripts/provider_base_store.py validate --artifacts

      - name: Validate reconstruction inputs
        run: |
          set -euo pipefail
          python tests/provider_v3_workflow_ownership_test.py
          python tests/provider_v3_documentation_contract_test.py
          python tests/native_five_lab_coverage_test.py
          python tests/canonical_media_types_test.py
          python tests/provider_stream_scope_architecture_test.py
          python tests/native_ios_watchdog_resume_test.py
          python tests/provider_v3_minimizer_contract_test.py
          python tests/provider_v3_minimizer_preview_test.py
          python tests/provider_html_filter_security_test.py
          python tests/provider_v3_static_knowledge_contract_test.py
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python tests/provider_patch_sibling_import_test.py
          python tests/provider_v3_identity_preflight_contract_test.py
          python tests/provider_v3_id_provenance_contract_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/peachify_runtime_crypto_test.py
          python scripts/provider_base_store.py validate
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_521_capability_regression_test.py
          python tests/provider_anime_semantic_transport_contract_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/native_hls_integrity_budget_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py

      - name: Reconstruct and validate providers sequentially live
        shell: bash
        run: |
          set -euo pipefail
          # Candidate bundles exist only to let each real Provider Object execute.
          # No route from this pass is publication authority by itself.
          python scripts/materialize_provider_v3_all.py

          # Strict order: provider N candidate probe -> DATA finalization -> provider
          # N final rematerialization -> final-bundle live proof -> only then N+1.
          # There is intentionally no inter-provider concurrency here.
          python scripts/reconstruct_provider_v3_sequential_live.py --minimum-coverage 0.75

          # Dynamic global invariant. Current manifest has 63 enabled providers,
          # therefore this run must prove 63/63 live-qualified before publication.
          python scripts/assert_active_provider_live_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("provider-v3-live-route-validation.json").read_text(encoding="utf-8"))
          assert report.get("providerCount") == 96, report.get("providerCount")
          assert report.get("completedProviderCount") == 96, report.get("completedProviderCount")
          assert report.get("allProvidersAdvancedSequentially") is True, report
          assert report.get("sequentialNoInterProviderConcurrency") is True, report
          print(
              "FIELD_RECONSTRUCTION_SEQUENTIAL_LIVE_GATE "
              f"providers={report['providerCount']} completed={report['completedProviderCount']} "
              f"live={report.get('liveValidatedRouteCount', 0)} "
              f"final_verified={report.get('finalBundleVerifiedCount', 0)}"
          )
          PY

      - name: Reconstruct all 96 providers from final live DATA + Lego
        run: |
          set -euo pipefail
          # Deterministic full rematerialization after every provider has already
          # passed its own sequential candidate+final live gate.
          python scripts/materialize_provider_v3_all.py
          python scripts/prune_unreferenced_providers.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/assert_active_provider_live_coverage.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          r=json.loads(Path("provider-v3-materialization.json").read_text(encoding="utf-8"))
          live=json.loads(Path("provider-v3-live-route-validation.json").read_text(encoding="utf-8"))
          rows=m.get("scrapers") or []
          active=sum(1 for row in rows if row.get("enabled") is not False)
          assert len(rows)==96, len(rows)
          assert active==63, active
          assert r.get("providerCount")==96, r.get("providerCount")
          assert r.get("context")=="workspace", r.get("context")
          assert r.get("publication") is False
          assert r.get("mainTouched") is False
          assert all(str(x.get("filename") or "").startswith("providers/") for x in rows)
          print(
              "FIELD_MANUAL_RECONSTRUCTION providers=96 active=63 context=workspace "
              f"mainTouched=false liveRoutes={live.get('liveValidatedRouteCount', 0)}"
          )
          PY
      - name: Validate reconstructed runtime and release integrity
        run: |
          set -euo pipefail
          python tests/provider_brick_portfolio_audit_test.py --published --require-all
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/provider_v3_core_metadata_route_sanitizer_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_v3_source_plan_v4_contract_test.py
          python tests/provider_anime_semantic_transport_contract_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/peachify_runtime_crypto_test.py
          python scripts/audit_provider_v3_static.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_identity_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/active_provider_live_coverage_test.py
          python scripts/assert_active_provider_live_coverage.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python scripts/audit_provider_quick_yield.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v3-reconstruction-96-${{ github.run_id }}
          path: |
            PROVENANCE.json
            provider-bases/
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            providers/
            provider-v3-materialization.json
            provider-v3-live-route-validation.json
            provider-v3-quick-yield.json
            automation/provider-v3-static-knowledge.json
            automation/provider-v3-recognition-seeds.json
            provider-overrides.json
            FILE-HASHES.json
            PATCH-SHA256SUMS.txt
            SHA256SUMS.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified reconstruction to selected branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/workbench/provider-v3-recognition-routes-data') || inputs.commit_reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROVENANCE.json provider-bases/ manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            providers/ provider-v3-materialization.json provider-v3-live-route-validation.json provider-v3-quick-yield.json \
            automation/provider-v3-static-knowledge.json automation/provider-v3-recognition-seeds.json provider-overrides.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json \
            scripts/provider_contract_local_enricher.py scripts/provider_route_expression_analyzer.py \
            scripts/provider_route_normalization_guard.py scripts/provider_route_role_classifier.py scripts/provider_route_scope_guard.py \
            scripts/enrich_provider_v3_static_knowledge.py scripts/sanitize_provider_v3_core_metadata_routes.py \
            scripts/provider_base_store.py scripts/materialize_provider_v3_all.py scripts/materialize_provider_v3_one.py \
            scripts/validate_provider_v3_routes_live.py scripts/validate_provider_v3_routes_sequential.py \
            scripts/reconstruct_provider_v3_sequential_live.py scripts/assert_active_provider_live_coverage.py \
            scripts/nuvio_tv_probe_route_validation.cjs \
            scripts/provider_patches/global_media_type_resolution_v1.py scripts/provider_patches/global_stream_presentation_v1.py \
            tests/provider_contract_recognizer_test.py tests/provider_v3_core_metadata_route_sanitizer_test.py \
            tests/provider_v3_strategy_plan_contract_test.py tests/provider_v3_live_route_validation_test.py \
            tests/provider_v3_sequential_live_gate_test.py tests/provider_v3_sequential_reconstruction_contract_test.py \
            tests/active_provider_live_coverage_test.py tests/global_media_type_resolution_test.py MEMORY.md
          if git diff --cached --quiet; then
            echo "Reconstruction already byte-identical; nothing to commit."
            exit 0
          fi
          git commit -m "chore: reconstruct Provider v3 96/96 sequentially with live route proof"
          git push origin "HEAD:${GITHUB_REF_NAME}"