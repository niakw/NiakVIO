name: TEMP - Release Integrity Resume

on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-release-integrity-resume.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-integrity-resume-20260912
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      SNAPSHOT_RUN: '34713445212'
      SNAPSHOT_NAME: 'strict-46-pre-html-34713445212'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}

      - name: Restore the already-materialized strict-46 snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: strict-46-pre-html-34713445212
          path: snapshot
          repository: ${{ github.repository }}
          run-id: 34713445212
          github-token: ${{ github.token }}

      - name: Restore strict-46 state and regenerate omitted manifest projections
        shell: bash
        run: |
          set -euo pipefail
          test -f snapshot/manifest.json
          test -d snapshot/providers
          cp snapshot/manifest.json manifest.json
          cp snapshot/provider-overrides.json provider-overrides.json
          cp snapshot/provider-v3-live-route-validation.json provider-v3-live-route-validation.json
          cp snapshot/automation/provider-v3-static-knowledge.json automation/provider-v3-static-knowledge.json
          cp snapshot/PROVENANCE.json PROVENANCE.json
          cp snapshot/health-report.json health-report.json
          rm -rf providers
          cp -a snapshot/providers providers
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          rows=m.get('scrapers') or []
          active=[r for r in rows if isinstance(r,dict) and r.get('enabled') is not False]
          assert len(rows)==96, len(rows)
          assert len(active)==46, len(active)
          print('FIELD_STRICT46_SNAPSHOT_RESTORED catalogue=96 active=46 live_rerun=0 rematerialize=0')
          PY
          # These projections were generated in the original materialization run but
          # accidentally omitted from its snapshot artifact. Rebuild only projections;
          # do not rematerialize providers or perform the 96-provider live gate.
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          echo 'FIELD_STRICT46_PROJECTIONS_REGENERATED source=restored_manifest live_provider_reproof=0'

      - name: Retry only release hash and integrity validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --check
          echo 'FIELD_RECOVERY_RELEASE_INTEGRITY status=success live_rerun=0 rematerialize=0'

      - name: Commit recovered verified strict-46 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No recovered changes to commit' >&2; exit 1; }
          git commit -m 'chore: finalize recovered strict-46 reconstruction'
          test "$(git ls-remote origin refs/heads/release/stable-46-20260912 | cut -f1)" = "${GITHUB_SHA}"
          git push origin HEAD:release/stable-46-20260912
          echo "FIELD_RECOVERY_RESUME_COMMIT=$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strict-46-recovery-final-${{ github.run_id }}
          path: |
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            provider-overrides.json
            provider-v3-live-route-validation.json
            automation/provider-v3-static-knowledge.json
            PROVENANCE.json
            health-report.json
            providers/
          retention-days: 3
          if-no-files-found: error
