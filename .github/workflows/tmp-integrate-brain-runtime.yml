name: TMP - Integrate durable Brain runtime fixes

on:
  push:
    branches: [integrate/brain-learn-runtime-20260910]
    paths: ['.github/workflows/tmp-integrate-brain-runtime.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/brain-learn-runtime-20260910
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Import durable non-workflow code and tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin workbench/systemic-recovery-20260909
          files=(
            ARCHITECTURE.md
            scripts/finalize_provider_repair_disposition_v1_impl.py
            scripts/provider_base_store.py
            scripts/provider_patches/cineby_runtime_v1.py
            scripts/provider_patches/hls_runtime_integrity_v1.py
            scripts/provider_route_proof_lkg.py
            scripts/run_provider_repair_pipeline_v6.py
            scripts/run_provider_upstream_parity_v2.py
            scripts/upgrade_provider_catalogue_identity_correlation_v21_5.py
            scripts/upgrade_provider_correlated_value_json_text_v18_4.py
            scripts/upgrade_provider_json_catalogue_preservation_v21_9.py
            scripts/upgrade_provider_runtime_reconstruction_v21_12.py
            scripts/upgrade_provider_voiranime_homes_authority_v21_10.py
            tests/cineby_tmdb_page_fallback_v2_test.py
            tests/core_media_policy_test.py
            tests/native_hls_integrity_budget_test.py
            tests/native_hls_short_vod_regression_test.py
            tests/native_reader_brain_repair_test.py
            tests/native_reader_runtime_bootstrap_test.py
            tests/opaque_native_media_enrichment_test.py
            tests/playback_context_compat_test.py
            tests/provider_json_catalogue_preservation_v21_9_test.py
            tests/provider_repair_pipeline_v6_contract_test_impl.py
            tests/provider_route_proof_lkg_test.py
            tests/provider_tmdb_runtime_key_contract_test.py
            tests/provider_voiranime_homes_authority_v21_10_test.py
            tests/published_provider_lego_contract_test.py
          )
          git checkout origin/workbench/systemic-recovery-20260909 -- "${files[@]}"
      - name: Validate non-workflow runtime subset
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/provider_base_store.py \
            scripts/finalize_provider_repair_disposition_v1_impl.py \
            scripts/provider_route_proof_lkg.py \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/run_provider_upstream_parity_v2.py \
            scripts/upgrade_provider_catalogue_identity_correlation_v21_5.py \
            scripts/upgrade_provider_correlated_value_json_text_v18_4.py \
            scripts/upgrade_provider_json_catalogue_preservation_v21_9.py \
            scripts/upgrade_provider_runtime_reconstruction_v21_12.py \
            scripts/upgrade_provider_voiranime_homes_authority_v21_10.py
          python tests/provider_json_catalogue_preservation_v21_9_test.py
          python tests/provider_route_proof_lkg_test.py
          python tests/provider_voiranime_homes_authority_v21_10_test.py
          python tests/cineby_tmdb_page_fallback_v2_test.py
          python tests/native_hls_short_vod_regression_test.py
          python scripts/audit_provider_v3_static.py
          git diff --exit-code -- manifest.json vf/manifest.json vf-no-anime/manifest.json no-anime/manifest.json provider-overrides.json provider-v3-materialization.json providers/ || {
            echo 'Imported code mutated published artifacts during validation'; exit 1;
          }
      - name: Commit durable non-workflow handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ARCHITECTURE.md scripts tests
          if git diff --cached --quiet; then
            echo 'No non-workflow changes to publish.'
            exit 0
          fi
          git commit -m 'feat(brain): integrate durable provider reconstruction fixes'
          git push origin HEAD:integrate/brain-learn-runtime-20260910
