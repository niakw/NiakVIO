name: Provider logo import once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-logo-import-once.yml'
      - 'scripts/import_provider_logos_once.py'

permissions:
  contents: write

concurrency:
  group: niakvio-provider-logo-import-once
  cancel-in-progress: false

jobs:
  import-once:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install one-shot image dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'Pillow==11.3.0' 'CairoSVG==2.8.2'

      - name: Fetch official and already-declared provider artwork once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_provider_logos_once.py

      - name: Verify generated WebP dimensions and provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          index = json.loads((root/'assets/providers/index.json').read_text(encoding='utf-8'))
          assert index['generationMode'] == 'one-shot-network-import'
          assert index['futurePolicy'] == 'committed-assets-only-no-network-regeneration'
          providers = index.get('providers') or {}
          assert providers, 'no provider logos imported'
          checked = 0
          for provider_id, row in providers.items():
              for size in ('72x32', '96x40'):
                  rel = row['assets'][size]
                  path = root / rel
                  assert path.is_file(), (provider_id, rel)
                  with Image.open(path) as im:
                      assert im.format == 'WEBP', (provider_id, rel, im.format)
                      assert im.size == tuple(map(int, size.split('x'))), (provider_id, rel, im.size)
                  checked += 1
          assert checked == len(providers) * 2
          print(
              f"FIELD_PROVIDER_LOGO_QA imported={len(providers)} missing={index.get('missingCount')} "
              f"assets={checked} format=WEBP"
          )
          PY

      - name: Commit immutable provider logo assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/providers/index
          rm -f scripts/import_provider_logos_once.py
          rm -f .github/workflows/provider-logo-import-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/providers scripts/import_provider_logos_once.py .github/workflows/provider-logo-import-once.yml
          git commit -m 'assets: import provider logos once'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
