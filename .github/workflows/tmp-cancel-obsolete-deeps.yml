name: Temporary cancel obsolete deep proofs

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/cancel-obsolete-deeps

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - name: Cancel superseded deep proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 31540747700 31541230485; do
            curl --fail-with-body -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
          done
      - name: Remove cancellation harness
        run: |
          rm -f .github/workflows/tmp-cancel-obsolete-deeps.yml
          rm -f .github/triggers/cancel-obsolete-deeps
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove obsolete deep cancellation harness'
          git push origin HEAD:agent/tv-regression-5.20.38
