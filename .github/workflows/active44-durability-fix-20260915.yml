name: SHORT - Harden Active44 Durability

on:
  push:
    branches:
      - fix/active44-durability-20260915
    paths:
      - '.github/workflows/active44-durability-fix-20260915.yml'
      - 'scripts/apply_active44_durability_v1.py'
      - 'scripts/fix_active44_generated_sources_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-active44-durability
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply durable Active44 migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python scripts/apply_active44_durability_v1.py
          python scripts/fix_active44_generated_sources_v1.py

      - name: Validate Active44 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/run_provider_repair_fast_targeted_v1.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/build_published_provider_stage.py \
            scripts/validate_published_provider_config.py \
            scripts/finalize_provider_repair_disposition_v1_impl.py \
            scripts/provider_parallel_sweep_plan_v1.py \
            scripts/hub_activation_publication.py \
            scripts/normalize_hub46_release_gate_sources.py \
            scripts/apply_hub46_native_lab_scope.py \
            tests/provider_v3_strategy_plan_contract_test.py \
            tests/native_hub46_scope_contract_test.py
          python tests/native_hub46_scope_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/ci_preservation_policy_test.py
          python tests/provider_hub_registry_test.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_published_provider_config.py --expected 46
          python scripts/hub_activation_publication.py
          set +e
          python scripts/provider_parallel_sweep_plan_v1.py --limit 1 --batch-size 1 >/tmp/parallel.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          matrix=json.load(open('automation/evidence/hub-lab-matrix-46.json'))
          disp=json.load(open('automation/provider-repair-disposition.json'))
          rows=[r for r in m.get('scrapers') or [] if isinstance(r,dict)]
          active={str(r.get('id') or '').strip().lower().replace('_','-') for r in rows if r.get('enabled') is True}
          target={str(r.get('manifestId') or r.get('provider') or '').strip().lower().replace('_','-') for r in matrix.get('rows') or []}
          assert len(rows)==46, len(rows)
          assert matrix.get('hubCount')==44, matrix.get('hubCount')
          assert len(active)==44 and active==target, (len(active),len(target))
          assert set(disp.get('disabledProviders') or [])=={'desiflix','fullanime'}
          print('ACTIVE44_END_TO_END_STATIC_OK catalogue=46 active=44 off=2')
          PY
          git diff --check

      - name: Commit durable changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/run_provider_repair_fast_targeted_v1.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/build_published_provider_stage.py \
            scripts/validate_published_provider_config.py \
            scripts/finalize_provider_repair_disposition_v1_impl.py \
            scripts/provider_parallel_sweep_plan_v1.py \
            scripts/hub_activation_publication.py \
            scripts/normalize_hub46_release_gate_sources.py \
            scripts/apply_hub46_native_lab_scope.py \
            tests/provider_v3_strategy_plan_contract_test.py \
            tests/native_hub46_scope_contract_test.py \
            tests/provider_repair_pipeline_v6_contract_test.py \
            .github/workflows/main-route-proof-reconstruction.yml \
            MEMORY.md
          git diff --cached --check
          git commit -m 'fix: make repair and native activation honor active44 authority'
          git fetch origin fix/active44-durability-20260915
          test "$(git rev-parse origin/fix/active44-durability-20260915)" = "${{ github.sha }}"
          git push origin HEAD:fix/active44-durability-20260915
          echo "ACTIVE44_DURABILITY_PUBLISHED $(git rev-parse HEAD)"
