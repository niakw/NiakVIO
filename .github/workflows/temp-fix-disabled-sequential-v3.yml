name: TEMP - Fix Disabled Sequential Gate V3
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-fix-disabled-sequential-v3.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/stable-46-20260912
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply complete disabled-provider audit migration
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD = '{"terminal-blocked", "terminal-unreachable"}'
          NEW = '{"terminal-blocked", "terminal-unreachable", "disabled-unqualified"}'

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          seq = Path('scripts/validate_provider_v3_routes_sequential.py')
          text = seq.read_text(encoding='utf-8')
          if '"enabled": manifest_row.get("enabled") is not False' not in text:
              anchor = '            "filename": filename,\n            "supported_types": supported,\n            "tasks": tasks,\n'
              repl = '            "filename": filename,\n            "enabled": manifest_row.get("enabled") is not False,\n            "supported_types": supported,\n            "tasks": tasks,\n'
              if text.count(anchor) != 1:
                  raise SystemExit('queue-enabled-state anchor mismatch')
              text = text.replace(anchor, repl, 1)
          disabled_fallback = '            elif provider.get("enabled") is False:\n                completion_state = "disabled-unqualified"\n'
          if disabled_fallback not in text:
              anchor = '''            else:\n                failure = {\n                    **evaluation,\n                    "completionState": "missing-declared-type-route-proof",\n                    "originEvidence": origin_evidence,\n                    "advancedToNextProvider": False,\n                }\n'''
              repl = '''            elif provider.get("enabled") is False:\n                completion_state = "disabled-unqualified"\n                passed = True\n                print(\n                    "FIELD_PROVIDER_DISABLED_UNQUALIFIED_ADVANCE "\n                    f"provider={provider_id} missing={','.join(evaluation['missingTypes']) or 'none'}",\n                    flush=True,\n                )\n            else:\n                failure = {\n                    **evaluation,\n                    "completionState": "missing-declared-type-route-proof",\n                    "originEvidence": origin_evidence,\n                    "advancedToNextProvider": False,\n                }\n'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'validator disabled fallback anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, repl, 1)
          text = text.replace(OLD, NEW)
          seq.write_text(text, encoding='utf-8')

          recon = Path('scripts/reconstruct_provider_v3_sequential_live.py')
          text = recon.read_text(encoding='utf-8')
          if 'completion_state is None and provider.get("enabled") is False' not in text:
              anchor = '        if completion_state is None:\n            failure = {\n'
              repl = '''        if completion_state is None and provider.get("enabled") is False:\n            completion_state = "disabled-unqualified"\n            print(\n                "FIELD_PROVIDER_DISABLED_UNQUALIFIED_ADVANCE "\n                f"provider={provider_id} phase=candidate "\n                f"missing={','.join(evaluation.get('missingTypes') or []) or 'none'}",\n                flush=True,\n            )\n\n        if completion_state is None:\n            failure = {\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('reconstruct candidate fallback anchor mismatch')
              text = text.replace(anchor, repl, 1)
          if 'reason": "disabled-final-bundle-unverified"' not in text:
              anchor = '''            if not final_proof.get("verified"):\n                failure = {\n                    **evaluation,\n                    "completionState": completion_state,\n                    "originEvidence": origin_evidence,\n                    "advancedToNextProvider": False,\n                    "finalBundleVerified": False,\n                    "finalBundleProof": final_proof,\n                    "candidateBundleFile": candidate_filename,\n                    "candidateBundleSha256": candidate_materialized.get("sha256"),\n                    "finalBundleFile": final_filename,\n                    "finalBundleSha256": materialized.get("sha256"),\n                }\n                report_rows.append(failure)\n                checkpoint(output_path, report_rows, totals, index - 1, minimum, provider_id)\n                raise SystemExit(\n                    f"{provider_id}: candidate DATA proved all declared types but final bundle did not; "\n                    f"missing={','.join(final_proof.get('missingTypes') or []) or 'unknown'}; "\n                    f"refusing to materialize or advance to provider {index + 1}"\n                )\n'''
              repl = '''            if not final_proof.get("verified"):\n                if provider.get("enabled") is False:\n                    previous_state = completion_state\n                    completion_state = "disabled-unqualified"\n                    finalize_provider(\n                        provider_id, provider, knowledge, overrides, evaluation,\n                        completion_state, origin_evidence,\n                    )\n                    write(knowledge_path, knowledge)\n                    write(overrides_path, overrides)\n                    materialized = materialize_one(provider_id)\n                    final_filename = str(materialized.get("file") or "")\n                    if not final_filename:\n                        raise SystemExit(f"{provider_id}: disabled demotion materialization produced no file")\n                    final_proof = {\n                        **final_proof,\n                        "verified": False,\n                        "reason": "disabled-final-bundle-unverified",\n                        "demotedFrom": previous_state,\n                    }\n                    print(\n                        "FIELD_PROVIDER_DISABLED_UNQUALIFIED_ADVANCE "\n                        f"provider={provider_id} phase=final-proof "\n                        f"wrong_content={','.join(final_proof.get('wrongContentOnlyTypes') or []) or 'none'}",\n                        flush=True,\n                    )\n                else:\n                    failure = {\n                        **evaluation,\n                        "completionState": completion_state,\n                        "originEvidence": origin_evidence,\n                        "advancedToNextProvider": False,\n                        "finalBundleVerified": False,\n                        "finalBundleProof": final_proof,\n                        "candidateBundleFile": candidate_filename,\n                        "candidateBundleSha256": candidate_materialized.get("sha256"),\n                        "finalBundleFile": final_filename,\n                        "finalBundleSha256": materialized.get("sha256"),\n                    }\n                    report_rows.append(failure)\n                    checkpoint(output_path, report_rows, totals, index - 1, minimum, provider_id)\n                    raise SystemExit(\n                        f"{provider_id}: candidate DATA proved all declared types but final bundle did not; "\n                        f"missing={','.join(final_proof.get('missingTypes') or []) or 'unknown'}; "\n                        f"refusing to materialize or advance to provider {index + 1}"\n                    )\n'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'reconstruct final fallback anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, repl, 1)
          recon.write_text(text, encoding='utf-8')

          seq_test = Path('tests/provider_v3_sequential_reconstruction_contract_test.py')
          text = seq_test.read_text(encoding='utf-8')
          if 'FIELD_PROVIDER_DISABLED_UNQUALIFIED_ADVANCE' not in text:
              anchor = 'assert "active_coverage_main()" in source\nassert \'"globalCandidateMaterialization": False\' in source\n'
              repl = anchor + '''assert 'provider.get("enabled") is False' in source\nassert '"disabled-unqualified"' in source\nassert "FIELD_PROVIDER_DISABLED_UNQUALIFIED_ADVANCE" in source\nvalidator_source = (ROOT / "scripts" / "validate_provider_v3_routes_sequential.py").read_text(encoding="utf-8")\nassert '"enabled": manifest_row.get("enabled") is not False' in validator_source\nassert 'completion_state = "disabled-unqualified"' in validator_source\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('sequential contract anchor mismatch')
              text = text.replace(anchor, repl, 1)
          seq_test.write_text(text, encoding='utf-8')

          for path in [
              'scripts/upgrade_provider_v3_finalization_v1.py',
              'scripts/upgrade_provider_v3_defer_finalization_preserve_validated_data_v3.py',
              'scripts/upgrade_provider_v3_safe_runtime_route_promotion_v2.py',
              'tests/provider_v3_batch_diagnostic_contract_test.py',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace(OLD, NEW)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate full focused migration suite
        run: |
          python -m py_compile \
            scripts/reconstruct_provider_v3_sequential_live.py \
            scripts/validate_provider_v3_routes_sequential.py \
            scripts/upgrade_provider_v3_finalization_v1.py \
            scripts/upgrade_provider_v3_defer_finalization_preserve_validated_data_v3.py \
            scripts/upgrade_provider_v3_safe_runtime_route_promotion_v2.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_batch_diagnostic_contract_test.py
          python tests/active_provider_live_coverage_test.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/upgrade_provider_v3_defer_finalization_preserve_validated_data_v3.py
          python scripts/upgrade_provider_v3_safe_runtime_route_promotion_v2.py
          python tests/provider_v3_strategy_plan_contract_test.py
          git diff --check
      - name: Commit durable migration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/reconstruct_provider_v3_sequential_live.py \
            scripts/validate_provider_v3_routes_sequential.py \
            scripts/upgrade_provider_v3_finalization_v1.py \
            scripts/upgrade_provider_v3_defer_finalization_preserve_validated_data_v3.py \
            scripts/upgrade_provider_v3_safe_runtime_route_promotion_v2.py \
            tests/provider_v3_sequential_reconstruction_contract_test.py \
            tests/provider_v3_batch_diagnostic_contract_test.py
          git diff --cached --quiet && { echo 'No durable changes'; exit 1; }
          git commit -m 'fix(reconstruct): separate disabled audit from active gate'
          git push origin HEAD:release/stable-46-20260912
