name: TMP - V33 Live Zero Batch
# trigger V33

on:
  pull_request:
    branches:
      - tmp/v33-live-zero-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  live-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 -m py_compile scripts/materialize_provider_v3_one.py scripts/certify_provider_playable_lanes.py scripts/provider_base_store.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          python3 tests/provider_patch_quickjs_compat_test.py

      - name: Materialize live-zero targets
        run: |
          set -euo pipefail
          for provider in 4khdhub allanime anikototv animevost-fr animetsu castle mallumv showbox; do
            echo "FIELD_V33_MATERIALIZE_BEGIN provider=$provider"
            python3 scripts/materialize_provider_v3_one.py "$provider"
            echo "FIELD_V33_MATERIALIZE_END provider=$provider"
          done

      - name: Certify live-zero targets in parallel
        run: |
          set -euo pipefail
          set +e
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider 4khdhub \
            --provider allanime \
            --provider anikototv \
            --provider animevost-fr \
            --provider animetsu \
            --provider castle \
            --provider mallumv \
            --provider showbox \
            --candidate-limit 12 \
            --timeout 30 \
            --workers 8 \
            --seed "v33-live-zero-${GITHUB_RUN_ID}" \
            --output health-output/v33-live-zero.json
          rc=$?
          set -e
          echo "FIELD_V33_CERT_RC rc=$rc"

      - name: Summarize V33
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('health-output/v33-live-zero.json').read_text())
          green=[]
          for row in j.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              if gl: green.append(row.get('providerId'))
              stages=sorted({str(a.get('debugStage') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
              hosts=sorted({str(n.get('host') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
              traces=[]
              for v in lanes.values():
                  for a in (v or {}).get('attempts') or []:
                      for t in a.get('providerTrace') or []:
                          stage=t.get('stage')
                          detail=t.get('detail')
                          if stage:
                              traces.append((stage,detail))
              uniq=[]
              seen=set()
              for stage,detail in traces:
                  key=(stage,detail)
                  if key in seen: continue
                  seen.add(key); uniq.append(key)
              print('FIELD_V33_RESULT',
                    'provider='+str(row.get('providerId')),
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower(),
                    'stages='+('|'.join(stages) or '-'),
                    'hosts='+('|'.join(hosts) or '-'),
                    'trace='+json.dumps(uniq[:12],separators=(',',':')))
          print('FIELD_V33_GREEN count=%d/%d providers=%s'%(len(green),len(j.get('providers') or []),','.join(sorted(green)) or 'none'))
          PY

      - name: Upload V33 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v33-live-zero-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
