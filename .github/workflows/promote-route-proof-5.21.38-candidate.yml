name: TEMP - Promote Route Proof 5.21.38 Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/promote-route-proof-5.21.38.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-route-proof-5-21-38-candidate
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/provider-v3-5.21.38-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch and cryptographically pin accepted route-proof artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/route-proof.zip"
          OUT="$RUNNER_TEMP/route-proof"
          gh api /repos/niakw/NiakVIO/actions/artifacts/10020094655/zip > "$ZIP"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          EXPECTED='46627b78e445ea0d70d50f09e8bbe7b17dd272e64391232079fb3a9d564bb4d5'
          test "$ACTUAL" = "$EXPECTED" || {
            echo "artifact SHA mismatch expected=$EXPECTED actual=$ACTUAL" >&2
            exit 1
          }
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"
          test -s "$OUT/automation/provider-route-recovery-v5.json"
          test -s "$OUT/automation/provider-v3-static-knowledge.json"
          test -s "$OUT/provider-overrides.json"
          test -s "$OUT/provider-v3-quick-yield.json"
          test -s "$OUT/automation/interstellar-route-proof-matrix.json"
          test -s "$OUT/automation/unwanted-undead-route-proof-matrix.json"
          test -s "$OUT/automation/hellmode-route-proof-matrix.json"
          test -s "$OUT/automation/hotd-s3e1-live.json"
          echo "FIELD_ACCEPTED_ARTIFACT id=10020094655 sha256=$ACTUAL"

      - name: Apply exact deterministic source migrations used by accepted workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepatch_identity_cleanup_shared_owner_v1.py
          python scripts/apply_core_identity_ownership_cleanup.py
          python scripts/upgrade_provider_worker_route_proof_v1.py
          python scripts/upgrade_provider_route_proof_request_spec_v1.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_base_route_requests_v1.py
          python scripts/upgrade_provider_route_authority_v5.py
          python scripts/upgrade_route_recovery_request_specs_v1.py
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python -m py_compile \
            scripts/provider_route_proof.py \
            scripts/recover_provider_routes_from_upstreams.py \
            scripts/apply_provider_route_recovery_report.py \
            scripts/upgrade_route_recovery_request_specs_v1.py

      - name: Import only accepted DATA and proof evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/route-proof"
          cp "$OUT/automation/provider-route-recovery-v5.json" automation/provider-route-recovery-v5.json
          cp "$OUT/automation/provider-v3-static-knowledge.json" automation/provider-v3-static-knowledge.json
          cp "$OUT/provider-overrides.json" provider-overrides.json
          cp "$OUT/health-report.json" health-report.json
          cp "$OUT/provider-v3-quick-yield.json" provider-v3-quick-yield.json
          cp "$OUT/automation/interstellar-route-proof-matrix.json" automation/interstellar-route-proof-matrix.json
          cp "$OUT/automation/unwanted-undead-route-proof-matrix.json" automation/unwanted-undead-route-proof-matrix.json
          cp "$OUT/automation/hellmode-route-proof-matrix.json" automation/hellmode-route-proof-matrix.json
          cp "$OUT/automation/hotd-s3e1-live.json" automation/hotd-s3e1-live.json
          python - <<'PY'
          import json
          r=json.load(open('automation/provider-route-recovery-v5.json'))
          assert r.get('providerCount') == 96, r.get('providerCount')
          assert r.get('providersWithProvenRoutes') == 45, r.get('providersWithProvenRoutes')
          assert r.get('provenRouteCount') == 286, r.get('provenRouteCount')
          assert r.get('simpleApiRecipeCount') == 23, r.get('simpleApiRecipeCount')
          assert r.get('historicalUpstreamMappedCount') == 91
          assert r.get('niakvioNativeCount') == 5
          print('FIELD_IMPORTED_PROOF providers=96 proven=45 routes=286 recipes=23')
          PY

      - name: Canonically rematerialize public content-addressed providers
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json "$RUNNER_TEMP/manifest.public-baseline.json"
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/prune_unreferenced_providers.py
          python scripts/validate_published_provider_config.py --expected 96
          python scripts/reapply_published_overrides.py --check
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('manifest.json'))
          rows=m.get('scrapers') or []
          assert len(rows)==96, len(rows)
          assert m.get('version')=='5.21.37', m.get('version')
          assert all(str(r.get('filename') or '').startswith('providers/') for r in rows)
          assert all('--' in Path(str(r['filename'])).name for r in rows), [r['filename'] for r in rows if '--' not in Path(str(r['filename'])).name][:5]
          bad=[]
          for row in rows:
            text=Path(row['filename']).read_text(encoding='utf-8')
            for marker in (
              'tmdb-data-contract-launch-gate-v29-native-abort-race',
              'function requestAbortPromise(controller,requestToken)',
              'all-providers-client-projection-name-mirror-v20',
            ):
              if marker not in text:
                bad.append((row.get('id'), marker))
          assert not bad, bad[:10]
          movix=next(r for r in rows if str(r.get('id','')).casefold()=='movix')
          assert movix.get('enabled') is False, movix
          print('FIELD_PUBLIC_CANDIDATE providers=96 version=5.21.37 v29=96 movix_enabled=false')
          PY

      - name: Run reconstructed public runtime and integrity gates
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_js_lego_ownership_test.py
          python tests/global_identity_policy_ownership_test.py
          python tests/episodic_identity_runtime_test.py
          python tests/episodic_year_identity_regression_test.py
          python tests/global_media_type_resolution_test.py
          python tests/native_dual_id_identity_test.py
          python tests/provider_latest_request_cancellation_test.py
          python tests/provider_native_abort_ignorant_cancellation_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_output_guard_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/published_provider_lego_contract_test.py
          python scripts/audit_provider_v3_static.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Re-prove bounded public live yield
        shell: bash
        run: |
          set -euo pipefail
          python scripts/interstellar_nuvio_matrix.py --workers 12 --timeout 35 --output automation/interstellar-5.21.38-public-candidate.json
          python scripts/desktop_series_provider_matrix.py \
            --id tt30177477 \
            --title 'The Unwanted Undead Adventurer' \
            --season 1 --episode 2 --category anime --workers 10 --timeout 35 \
            --output automation/unwanted-undead-5.21.38-public-candidate.json
          python scripts/desktop_series_provider_matrix.py \
            --id tt38646634 \
            --title 'HELL MODE: The Hardcore Gamer Dominates in Another World with Garbage Balancing' \
            --season 1 --episode 12 --category anime --workers 10 --timeout 35 \
            --output automation/hellmode-5.21.38-public-candidate.json
          python scripts/hotd_s3e1_live_probe.py --output automation/hotd-s3e1-5.21.38-public-candidate.json --timeout 90
          python - <<'PY'
          import json
          from pathlib import Path
          i=json.loads(Path('automation/interstellar-5.21.38-public-candidate.json').read_text())
          u=json.loads(Path('automation/unwanted-undead-5.21.38-public-candidate.json').read_text())
          h=json.loads(Path('automation/hellmode-5.21.38-public-candidate.json').read_text())
          d=json.loads(Path('automation/hotd-s3e1-5.21.38-public-candidate.json').read_text())
          ia=int(i.get('automatic_stream_provider_count',0)); iv=int(i.get('automatic_vf_provider_count',0))
          up=int(u.get('positive_count',0)); hp=int(h.get('positive_count',0))
          keh=(d.get('providers') or {}).get('kehflix') or {}
          assert ia >= 6, ia
          assert iv >= 2, iv
          assert up >= 2, up
          assert hp >= 2, hp
          assert keh.get('verdict') == 'ok', keh
          assert int(keh.get('seriesStreams') or keh.get('series_streams') or 0) > 0, keh
          assert int(keh.get('tvStreams') or keh.get('tv_streams') or 0) > 0, keh
          print(f'FIELD_PUBLIC_LIVE_ACCEPTED interstellar={ia} vf={iv} unwanted={up} hellmode={hp} kehflix=ok')
          PY

      - name: Final fixed-point and bounded diff validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py --check
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git status --short
          python - <<'PY'
          import subprocess
          allowed_prefixes=(
            'providers/', 'automation/', 'vf/', 'no-anime/', 'vf-no-anime/', 'scripts/', 'tests/'
          )
          allowed_exact={
            'manifest.json','provider-overrides.json','health-report.json','provider-v3-quick-yield.json',
            'PROVENANCE.json','FILE-HASHES.json','PATCH-SHA256SUMS.txt','SHA256SUMS.json',
            'provider-version-floors.json'
          }
          changed=[line.strip() for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines() if line.strip()]
          bad=[]
          for line in changed:
            path=line[3:].split(' -> ')[-1]
            if path in allowed_exact or path.startswith(allowed_prefixes):
              continue
            bad.append(path)
          assert not bad, bad
          print(f'FIELD_PUBLIC_CANDIDATE_DIFF_OK changed={len(changed)}')
          PY

      - name: Commit accepted public-form candidate to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: stage accepted Provider v3 5.21.38 candidate'
          git push origin HEAD:release/provider-v3-5.21.38-candidate
          echo "FIELD_PUBLIC_CANDIDATE_COMMITTED sha=$(git rev-parse HEAD)"
