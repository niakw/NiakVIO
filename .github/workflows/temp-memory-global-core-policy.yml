name: TEMP - persist global Core ownership policy

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-memory-global-core-policy.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - name: Persist ownership and minimizer sequencing rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ledger = Path('automation/SECONDARY-TASKS-DURABLE.md')
          text = ledger.read_text(encoding='utf-8')
          priority = '3. Secondary tasks below remain mandatory and must not be silently dropped while provider repair is active.\n'
          global_rule = (
              '4. Runtime/client compatibility adaptations are **Core-global Lego**, never provider-by-provider hacks: '
              'timers (`setTimeout`/`clearTimeout`), HTTP/403 fail-closed policy, stale-generation suppression, '
              'execution budgets and client-runtime portability belong after the global Core boundary. Provider Lego may '
              'supply provider-specific transport/data/options only.\n'
          )
          if global_rule not in text:
              text = text.replace(priority, priority + global_rule)

          old = '- **JavaScript minimization/minification**\n  - Production bundles must go through the NiakVIO Provider v3 minimizer (`scripts/provider_v3_minimizer.py`), not Terser.\n'
          new = (
              '- **JavaScript minimization/minification — FINAL STAGE only**\n'
              '  - Do **not** use minification as a routine provider-repair or intermediate runtime gate. Stabilize provider yield, global Core/runtime behavior and the candidate first; run minimization near the very end, before final fixed-point/release certification.\n'
              '  - Production bundles must go through the NiakVIO Provider v3 minimizer (`scripts/provider_v3_minimizer.py`), not Terser.\n'
          )
          if old in text:
              text = text.replace(old, new)
          elif 'JavaScript minimization/minification — FINAL STAGE only' not in text:
              raise SystemExit('durable minimizer section not found')

          old_timer = '  - Audit active provider bundles for direct `setTimeout` / `clearTimeout` assumptions and guarantee Desktop-safe timer handling, not only StreamFlix.\n'
          new_timer = (
              '  - Desktop/runtime fixes are Core-global. `CORE.RUNTIME_COMPAT.V1` owns timer shims and URL/fetch portability for every composed bundle; do not add StreamFlix/Movix/provider-specific timer hacks.\n'
              '  - Audit direct provider `setTimeout` / `clearTimeout` usage only to prove the global shim covers it; provider code must not become the owner of client-runtime compatibility.\n'
              '  - 403/404/410 and terminal media validity are Core-global sanitizer policy; never patch a named provider merely to hide a forbidden/dead returned row.\n'
          )
          if old_timer in text:
              text = text.replace(old_timer, new_timer)
          ledger.write_text(text, encoding='utf-8')

          memory = Path('MEMORY.md')
          marker = '## 2026-09-13 — global Core ownership + final-stage minimizer rule'
          if marker not in memory.read_text(encoding='utf-8'):
              section = f'''\n{marker}\n\n- User rule (mandatory): Desktop/client-runtime adaptations are global Core blocks, not provider-specific fixes. This includes timer portability (`setTimeout`/`clearTimeout`), terminal HTTP/media rejection such as 403, stale-generation suppression/cancellation and execution-budget behavior. Provider Lego owns provider-specific transport/data/options only.\n- Verified source ownership: `scripts/provider_patches/global_runtime_compat_v1.py` is managed fix `CORE.RUNTIME_COMPAT.V1`; it globally supplies missing timers and Desktop URL/fetch portability. `scripts/apply_provider_overrides.py` forbids Core-global scripts in provider `patch_scripts`.\n- Verified terminal policy ownership: `scripts/provider_patches/stream_output_sanitizer_v8.py` is the Core terminal sanitizer (`CORE.STREAM_SANITIZER.V6` managed block via V7/V6 composition). Ordinary probed rows publish only on positive media proof; the base sanitizer rejects HTTP 403/404/410. This must remain provider-agnostic.\n- `desktop_runtime_compat_v1.py` is also Core-owned/provider-configurable when episode compatibility options are required; its timer fallback is runtime portability, never a provider-owned domain/transport hack. Duplicate timer responsibility should be simplified only through Core ownership, never by named-provider patches.\n- Minimizer sequencing corrected: the NiakVIO-safe Provider v3 minimizer is a **final-stage** operation/gate after provider yield and global runtime behavior are stabilized. Do not put minification in ordinary repair loops. Terser remains forbidden; final minimization must preserve STARTFIX/CLOSEFIX/FIXDATA/Core boundaries, deterministic reverse rebuild and byte fixed point.\n- The temporary full-minimizer audit started during repair was stopped/deleted from the active workflow set; its stale byte-stability test references were corrected, but the authoritative full minimizer/reverse-rebuild audit is deferred to final stabilization as requested.\n'''
              with memory.open('a', encoding='utf-8') as handle:
                  handle.write(section)
          PY
      - name: Validate global Core ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/desktop_runtime_compat_test.py
          python3 tests/vf_recovery_profiles_test.py
          python3 tests/stream_output_correlated_player_fallback_v7_test.py
          python3 tests/provider_byte_stability_contract_test.py
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MEMORY.md automation/SECONDARY-TASKS-DURABLE.md
          if git diff --cached --quiet; then
            echo 'No durable checkpoint change needed'
            exit 0
          fi
          git commit -m 'docs(memory): persist global Core ownership and final minimizer sequencing'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
