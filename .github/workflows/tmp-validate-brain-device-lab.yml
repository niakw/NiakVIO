name: Validate Brain Device Lab patch

on:
  push:
    branches:
      - fix/brain-device-lab-20260817
    paths:
      - '.github/workflows/tmp-validate-brain-device-lab.yml'
      - '.github/workflows/native-corpus-device-lab.yml'
      - '.github/workflows/brain-learning-lab.yml'
      - 'scripts/prepare_native_corpus_client.py'
      - 'scripts/restage_native_corpus_client.py'
      - 'scripts/analyze_native_corpus_collection.cjs'
      - 'scripts/run_native_corpus_mobile_suite.sh'
      - 'scripts/run_native_corpus_tv_suite.sh'
      - 'scripts/run_brain_learning_sandbox.py'
      - 'engine_v2/scripts/build-historical-learning.mjs'
      - 'engine_v2/scripts/learning-lab.mjs'
      - 'engine_v2/tests/learning-lab-memory.test.mjs'
      - 'engine_v2/config/brain-policy.json'
      - 'engine_v2/config/historical-audit-baselines.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax and structural checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_native_corpus_client.py scripts/restage_native_corpus_client.py scripts/run_brain_learning_sandbox.py
          node --check scripts/analyze_native_corpus_collection.cjs
          node --check engine_v2/scripts/build-historical-learning.mjs
          node --check engine_v2/scripts/learning-lab.mjs
          bash -n scripts/run_native_corpus_mobile_suite.sh scripts/run_native_corpus_tv_suite.sh
          ruby -e "require 'yaml'; %w[.github/workflows/native-corpus-device-lab.yml .github/workflows/brain-learning-lab.yml].each{|f| YAML.load_file(f, aliases: true)}"
          python - <<'PY'
          from pathlib import Path
          native=Path('.github/workflows/native-corpus-device-lab.yml').read_text()
          brain=Path('.github/workflows/brain-learning-lab.yml').read_text()
          assert 'android-mobile-tv-native-corpus:' not in native
          assert 'mobile-native-corpus:' in native and 'tv-native-corpus:' in native
          mobile=native.split('  mobile-native-corpus:',1)[1].split('  tv-native-corpus:',1)[0]
          tv=native.split('  tv-native-corpus:',1)[1].split('  native-corpus-engine-summary:',1)[0]
          assert 'NuvioTV' not in mobile and 'nuvio-tv' not in mobile
          assert 'NuvioMobile' not in tv and 'nuvio-mobile' not in tv
          experiment=brain.split('  experiment:',1)[1].split('  publish-learning:',1)[0]
          assert 'contents: read' in experiment and 'actions: read' in experiment
          assert 'contents: write' not in experiment
          assert 'run_brain_learning_sandbox.py' in brain
          print('workflow isolation checks passed')
          PY
      - name: Brain unit tests
        run: |
          set -euo pipefail
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          node engine_v2/tests/learning-lab-memory.test.mjs
      - name: Historical classification smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(node -e "const x=require('./engine_v2/config/historical-audit-baselines.json');process.stdout.write(x.baselines[0].commit)")"
          mkdir -p /tmp/brain-historical
          git show "$BASELINE:manifest.json" > /tmp/brain-historical/baseline-manifest.json
          git show "$BASELINE:health-report.json" > /tmp/brain-historical/baseline-health.json
          node engine_v2/scripts/build-historical-learning.mjs \
            --baseline-manifest /tmp/brain-historical/baseline-manifest.json \
            --baseline-health /tmp/brain-historical/baseline-health.json \
            --current-manifest manifest.json \
            --current-health health-report.json \
            --repair-report repair-report.json \
            --output /tmp/brain-historical/result.json
          node -e "const x=require('/tmp/brain-historical/result.json');if(!x.cases?.length||!x.stats||x.baseline?.release!=='5.20.63')process.exit(1)"
      - name: Native collection gate smoke test
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cat > "$TMP/complete.log" <<'EOF'
          FIELD_NATIVE_CORPUS_BEGIN client=mobile fixture=interstellar providers=2
          FIELD_NATIVE_RESULT client=mobile fixture=interstellar provider64=Zm9v enabled=true duration_ms=1 count=0
          FIELD_NATIVE_ERROR client=mobile fixture=interstellar provider64=YmFy duration_ms=1 error64=ZXJy
          FIELD_NATIVE_CORPUS_END client=mobile fixture=interstellar errors=1
          EOF
          node scripts/analyze_native_corpus_collection.cjs interstellar "$TMP/complete.log"
