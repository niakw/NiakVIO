name: NiakVIO provider fixed-point audit
# Temporary diagnostic workflow mirroring the authoritative Core publication loop.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-fixed-point-audit.yml'
      - 'scripts/audit_provider_fixed_point.py'
      - 'scripts/reapply_published_overrides.py'
      - 'scripts/normalize_provider_rebuild_safety.py'
      - 'scripts/normalize_core_fixed_point_contract.py'
      - 'scripts/provider_patches/hls_runtime_integrity_v1.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: niakvio-provider-fixed-point-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report audit start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider fixed-point audit started on ${GITHUB_SHA}: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit exact provider fixed point
        run: python scripts/audit_provider_fixed_point.py
      - name: Report audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_STATUS: ${{ job.status }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider fixed-point audit completed with status **${AUDIT_STATUS}** on ${GITHUB_SHA}: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Inspect FIELD_PROVIDER_FIXED_POINT_* for convergence details."
