name: WORKBENCH - History Semantic Alias Fix V2

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-history-semantic-alias-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Normalize legacy anime TV semantic alias floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_provider_history_matrix_v3.py')
          text = path.read_text(encoding='utf-8')

          helper = '''\n\ndef normalize_historical_semantic_types(\n    values: set[str],\n    *,\n    current_semantic: set[str],\n    current_transport: set[str],\n    historical_verified_lanes: set[str],\n) -> tuple[set[str], bool]:\n    """Demote the legacy anime->tv invocation alias unless TV has real proof.\n\n    Some historical manifests wrote the Nuvio ``tv`` transport alias into\n    ``canonicalSupportedTypes`` for anime providers. That field is normally a\n    semantic source, but the alias must not become a permanent TV capability\n    obligation when current canonical semantics are anime-only and no historical\n    TV lane was independently verified.\n    """\n    normalized = set(values)\n    alias_only_tv = (\n        "anime" in normalized\n        and "tv" in normalized\n        and "anime" in current_semantic\n        and "tv" not in current_semantic\n        and "tv" in current_transport\n        and "tv" not in historical_verified_lanes\n    )\n    if alias_only_tv:\n        normalized.discard("tv")\n    return normalized, alias_only_tv\n'''
          marker = '\ndef current_semantic_types('
          if 'def normalize_historical_semantic_types(' not in text:
              assert text.count(marker) == 1, 'current semantic helper anchor mismatch'
              text = text.replace(marker, helper + marker, 1)

          loop_anchor = '''        historical_type_sources: dict[str, str] = {}\n        for version in HISTORY:\n'''
          loop_replacement = '''        historical_type_sources: dict[str, str] = {}\n        current_manifest_semantics = manifests["current"].get(pid)\n        current_types, current_type_source = current_semantic_types(current_manifest_semantics)\n        current_transport = transport_types(current_manifest_semantics)\n        for version in HISTORY:\n'''
          if 'current_manifest_semantics = manifests["current"].get(pid)' not in text:
              assert text.count(loop_anchor) == 1, 'historical type loop anchor mismatch'
              text = text.replace(loop_anchor, loop_replacement, 1)

          store_anchor = '''            historical_types[version] = sorted(values)\n            historical_type_sources[version] = source\n'''
          store_replacement = '''            values, alias_reclassified = normalize_historical_semantic_types(\n                values,\n                current_semantic=current_types,\n                current_transport=current_transport,\n                historical_verified_lanes=historical_lanes,\n            )\n            if alias_reclassified:\n                source += "+anime-tv-transport-alias-normalized"\n            historical_types[version] = sorted(values)\n            historical_type_sources[version] = source\n'''
          if '+anime-tv-transport-alias-normalized' not in text:
              assert text.count(store_anchor) == 1, 'historical type store anchor mismatch'
              text = text.replace(store_anchor, store_replacement, 1)

          duplicate = '        current_types, current_type_source = current_semantic_types(manifests["current"].get(pid))\n'
          if duplicate in text:
              text = text.replace(duplicate, '', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Prove semantic floor normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_provider_history_matrix_v3.py
          python3 tests/provider_history_semantic_alias_floor_test.py
          python3 scripts/build_provider_history_matrix_v3.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix=json.loads(Path('automation/provider-history-matrix.json').read_text())
          rows={str(r['provider']).casefold():r for r in matrix['providers']}
          expected={'animevost-fr','anizone','fullanime','neko-sama','waveanime'}
          for provider in sorted(expected):
              drift=rows[provider]['contractDrift']
              assert 'tv' not in drift['lostSemanticTypes'], (provider, drift)
              assert drift['currentSemanticTypes'] == ['anime'], (provider, drift)
              assert any('anime-tv-transport-alias-normalized' in source for source in drift['historicalSemanticTypeSources'].values()), (provider, drift)
          assert matrix['nonRegressionPolicy']['semanticCapabilityLossAllowedSilently'] is False
          print('HISTORY_SEMANTIC_ALIAS_REAL_MATRIX_OK providers=5 false_tv_regressions=0')
          PY
          python3 tests/provider_non_regression_contract_test.py
          git diff --check
      - name: Commit verified ledger fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_provider_history_matrix_v3.py automation/provider-history-matrix.json automation/PROVIDER-HISTORY-MATRIX.md
          git diff --cached --check
          git commit -m 'fix(non-regression): separate anime TV transport alias from semantic floor'
          git fetch origin workbench/systemic-recovery-20260909
          git rebase origin/workbench/systemic-recovery-20260909
          git push origin HEAD:workbench/systemic-recovery-20260909
