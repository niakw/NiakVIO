name: One-shot promotion and provider safety repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-promote-provider-patches.yml"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Prepare exact fail-closed safety repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          manifest_rows = {
              str(row.get('id') or '').casefold(): row
              for row in manifest.get('scrapers', [])
              if isinstance(row, dict)
          }
          prestate = {}
          for provider_id in ('moviebox', 'netmirror'):
              row = manifest_rows.get(provider_id)
              if not isinstance(row, dict):
                  raise SystemExit(f'missing manifest provider: {provider_id}')
              filename = str(row.get('filename') or '')
              path = Path(filename)
              if row.get('enabled') is True:
                  prestate[provider_id] = {
                      'filename': filename,
                      'sha256': sha256(path),
                  }
          Path('/tmp/niakvio-safety-prestate.json').write_text(
              json.dumps(prestate, indent=2) + '\n', encoding='utf-8'
          )

          promoter_path = Path('scripts/promote_candidates.py')
          text = promoter_path.read_text(encoding='utf-8')
          old_fallback = "\n".join([
              '                    [',
              '                        "blocked",',
              '                        "provider_unreachable",',
              '                        "runtime_error",',
              '                        "unavailable",',
              '                        "no_streams",',
              '                        "reachable",',
              '                        "degraded",',
              '                    ],',
          ])
          new_fallback = "\n".join([
              '                    [',
              '                        "blocked",',
              '                        "provider_unreachable",',
              '                        "runtime_error",',
              '                        "no_streams",',
              '                        "reachable",',
              '                    ],',
          ])
          if old_fallback in text:
              text = text.replace(old_fallback, new_fallback, 1)
          elif new_fallback not in text:
              raise SystemExit('promotion preservation fallback anchor not found')

          old_guard = "\n".join([
              '            preserve_current = (',
              '                not enabled',
              '                and (old_was_enabled or restore_activation_lkg)',
          ])
          new_guard = "\n".join([
              '            preserve_current = (',
              '                not enabled',
              '                and current_ci_inconclusive',
              '                and (old_was_enabled or restore_activation_lkg)',
          ])
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif new_guard not in text:
              raise SystemExit('promotion preservation guard anchor not found')
          promoter_path.write_text(text, encoding='utf-8')

          overrides_path = Path('provider-overrides.json')
          config = json.loads(overrides_path.read_text(encoding='utf-8'))
          patches = config.setdefault('provider_patches', {})
          quarantine_script = 'scripts/provider_patches/quarantine_provider_v1.py'
          quarantines = {
              'netmirror': 'cross_title_search_identity_mismatch',
              'moviebox': 'non_playable_html_output',
          }
          for provider_id, reason in quarantines.items():
              row = patches.get(provider_id)
              if not isinstance(row, dict):
                  raise SystemExit(f'missing provider override row: {provider_id}')
              row['capability'] = 'quarantined'
              row['profiles'] = []
              manifest_overrides = row.get('manifest_overrides')
              if not isinstance(manifest_overrides, dict):
                  manifest_overrides = {}
              manifest_overrides['enabled'] = False
              row['manifest_overrides'] = manifest_overrides
              row['patch_scripts'] = [quarantine_script]
              row['patch_script_options'] = {quarantine_script: {'reason': reason}}
              row['notes'] = (
                  f'Fail-closed safety quarantine: {reason}. The published bundle is inert '
                  'because Nuvio clients may retain historical local activation state. '
                  'Re-enable only after fresh strict identity and direct-media proof.'
              )
          overrides_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          quarantine_test_path = Path('tests/provider_quarantine_test.py')
          quarantine_test = quarantine_test_path.read_text(encoding='utf-8')
          anchor = '    ("vixsrc", "interstellar_duration_mismatch"),\n):'
          replacement = (
              '    ("vixsrc", "interstellar_duration_mismatch"),\n'
              '    ("moviebox", "non_playable_html_output"),\n'
              '    ("netmirror", "cross_title_search_identity_mismatch"),\n'
              '):'
          )
          if replacement not in quarantine_test:
              if anchor not in quarantine_test:
                  raise SystemExit('provider quarantine regression anchor not found')
              quarantine_test_path.write_text(
                  quarantine_test.replace(anchor, replacement, 1), encoding='utf-8'
              )

          validator_path = Path('scripts/validate_activation_preservation.py')
          validator = validator_path.read_text(encoding='utf-8')
          evidence_marker = '    if finding.get("evidence_type") != "duration_identity_mismatch":\n'
          if 'manual_live_wrong_content' not in validator:
              if evidence_marker not in validator:
                  raise SystemExit('activation safety evidence marker not found')
              manual_block = "\n".join([
                  '    evidence_type = str(finding.get("evidence_type") or "")',
                  '    if evidence_type in {"manual_live_wrong_content", "manual_live_non_playable"}:',
                  '        if finding.get("evidence_source") != "operator_live_client_report":',
                  '            return False, "manual_safety_finding_source_invalid"',
                  '        if finding.get("operator_confirmed") is not True:',
                  '            return False, "manual_safety_finding_not_confirmed"',
                  '        if not COMMIT_RE.fullmatch(str(finding.get("tested_commit_sha") or "")):',
                  '            return False, "manual_safety_finding_commit_invalid"',
                  '        tested_sha = str(finding.get("tested_bundle_sha256") or "")',
                  '        tested_bundle = str(finding.get("tested_bundle") or "")',
                  '        if not SHA256_RE.fullmatch(tested_sha):',
                  '            return False, "manual_safety_finding_bundle_sha_invalid"',
                  '        if not tested_bundle.startswith("providers/") or not tested_bundle.endswith(f"--{tested_sha[:16]}.js"):',
                  '            return False, "manual_safety_finding_bundle_path_invalid"',
                  '        fixture = finding.get("fixture")',
                  '        if not isinstance(fixture, dict) or not str(fixture.get("tmdbId") or "") or not str(fixture.get("title") or ""):',
                  '            return False, "manual_safety_finding_fixture_invalid"',
                  '        if evidence_type == "manual_live_wrong_content":',
                  '            if finding.get("transport_playable") is not True:',
                  '                return False, "manual_wrong_content_not_transport_playable"',
                  '            if not str(finding.get("observed_content") or "").strip():',
                  '                return False, "manual_wrong_content_observation_missing"',
                  '            if not finding.get("clients_with_contradiction"):',
                  '                return False, "manual_wrong_content_client_missing"',
                  '        else:',
                  '            if finding.get("transport_playable") is not False:',
                  '                return False, "manual_non_playable_transport_flag_invalid"',
                  '            if str(finding.get("observed_failure") or "") not in {"infinite_loading", "non_media_html", "timeout"}:',
                  '                return False, "manual_non_playable_observation_invalid"',
                  '            if not finding.get("clients_with_failure"):',
                  '                return False, "manual_non_playable_client_missing"',
                  '        return True, f"configured_safety_quarantine:{reason}:{evidence_type}"',
                  '',
              ])
              validator = validator.replace(evidence_marker, manual_block + evidence_marker, 1)
              validator_path.write_text(validator, encoding='utf-8')

          ci_test_path = Path('tests/ci_preservation_policy_test.py')
          ci_test = ci_test_path.read_text(encoding='utf-8')
          source_anchor = "assert 'current_ci_inconclusive' in promoter\n"
          additions = (
              "assert 'and current_ci_inconclusive' in promoter\n"
              "assert 'manual_live_wrong_content' in validator_source\n"
              "assert 'manual_live_non_playable' in validator_source\n"
          )
          if "assert 'manual_live_wrong_content' in validator_source" not in ci_test:
              if source_anchor not in ci_test:
                  raise SystemExit('CI preservation regression anchor not found')
              ci_test_path.write_text(
                  ci_test.replace(source_anchor, source_anchor + additions, 1),
                  encoding='utf-8',
              )
          PY
          python -m py_compile scripts/promote_candidates.py scripts/validate_activation_preservation.py

      - name: Materialize inert current bundles
        run: |
          python scripts/reapply_published_overrides.py
          python scripts/reapply_published_overrides.py --check

      - name: Record exact negative client evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import os

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          prestate = json.loads(Path('/tmp/niakvio-safety-prestate.json').read_text(encoding='utf-8'))
          findings_path = Path('automation/nuvio-client-safety-findings.json')
          data = json.loads(findings_path.read_text(encoding='utf-8'))
          data['schema_version'] = max(2, int(data.get('schema_version') or 1))
          data['generated_at'] = datetime.now(timezone.utc).isoformat()
          policy = data.setdefault('policy', {})
          policy['manual_negative_evidence_requires_exact_tested_bundle_sha'] = True
          policy['manual_negative_evidence_requires_operator_confirmation'] = True

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {
              str(row.get('id') or '').casefold(): row
              for row in manifest.get('scrapers', [])
              if isinstance(row, dict)
          }
          existing = [
              row for row in data.get('findings', [])
              if isinstance(row, dict) and str(row.get('provider_id') or '').casefold() not in prestate
          ]
          commit_sha = os.environ['GITHUB_SHA']

          if 'netmirror' in prestate:
              current = rows['netmirror']
              quarantine_file = str(current.get('filename') or '')
              existing.append({
                  'provider_id': 'netmirror',
                  'evidence_type': 'manual_live_wrong_content',
                  'evidence_source': 'operator_live_client_report',
                  'operator_confirmed': True,
                  'quarantine_reason': 'cross_title_search_identity_mismatch',
                  'tested_commit_sha': commit_sha,
                  'tested_bundle': prestate['netmirror']['filename'],
                  'tested_bundle_sha256': prestate['netmirror']['sha256'],
                  'fixture': {
                      'tmdbId': '1215638',
                      'mediaType': 'movie',
                      'title': 'Mon ninja et moi 3',
                  },
                  'transport_playable': True,
                  'observed_content': 'unrelated athletics event',
                  'observed_duration_seconds': 11820,
                  'clients_with_contradiction': ['desktop_macos', 'tv'],
                  'quarantined_bundle': quarantine_file,
                  'quarantined_bundle_sha256': sha256(Path(quarantine_file)),
              })

          if 'moviebox' in prestate:
              current = rows['moviebox']
              quarantine_file = str(current.get('filename') or '')
              existing.append({
                  'provider_id': 'moviebox',
                  'evidence_type': 'manual_live_non_playable',
                  'evidence_source': 'operator_live_client_report',
                  'operator_confirmed': True,
                  'quarantine_reason': 'non_playable_html_output',
                  'tested_commit_sha': commit_sha,
                  'tested_bundle': prestate['moviebox']['filename'],
                  'tested_bundle_sha256': prestate['moviebox']['sha256'],
                  'fixture': {
                      'tmdbId': '1215638',
                      'mediaType': 'movie',
                      'title': 'Mon ninja et moi 3',
                  },
                  'transport_playable': False,
                  'observed_failure': 'infinite_loading',
                  'clients_with_failure': ['desktop_macos'],
                  'quarantined_bundle': quarantine_file,
                  'quarantined_bundle_sha256': sha256(Path(quarantine_file)),
              })

          data['findings'] = existing
          findings_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Run focused safety regressions
        run: |
          python tests/ci_preservation_policy_test.py
          python tests/provider_quarantine_test.py
          python tests/runtime_media_safety_guard_test.py
          python scripts/validate_policy.py
          python scripts/validate_published_overrides.py
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Regenerate and validate exact release hashes
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Assert exact safety result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {
              str(row.get('id') or '').casefold(): row
              for row in manifest.get('scrapers', [])
              if isinstance(row, dict)
          }
          expected = {
              'netmirror': 'cross_title_search_identity_mismatch',
              'moviebox': 'non_playable_html_output',
          }
          for provider_id, reason in expected.items():
              row = rows[provider_id]
              if row.get('enabled') is not False:
                  raise SystemExit(f'{provider_id}: manifest is not disabled')
              filename = str(row.get('filename') or '')
              payload = Path(filename).read_text(encoding='utf-8')
              if 'NUVIO_PROVIDER_QUARANTINE_V1' not in payload or reason not in payload:
                  raise SystemExit(f'{provider_id}: published bundle is not inert')
              print(f'FIELD_SAFETY_QUARANTINE provider={provider_id} enabled=false file={filename} reason={reason}')

          if rows['streamzo'].get('enabled') is not True:
              raise SystemExit('streamzo must remain globally enabled')
          print(f"FIELD_STREAMZO_UNCHANGED enabled=true file={rows['streamzo'].get('filename')}")
          PY

      - name: Enforce one-shot change scope
        run: |
          python - <<'PY'
          import subprocess
          allowed_exact = {
              'scripts/promote_candidates.py',
              'scripts/validate_activation_preservation.py',
              'provider-overrides.json',
              'tests/provider_quarantine_test.py',
              'tests/ci_preservation_policy_test.py',
              'automation/nuvio-client-safety-findings.json',
              'manifest.json',
              'vf/manifest.json',
              'vostfr/manifest.json',
              'PROVENANCE.json',
              'FILE-HASHES.json',
              'PATCH-SHA256SUMS.txt',
              'SHA256SUMS.json',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = []
          for raw in rows:
              path = raw[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(
              p for p in changed
              if p not in allowed_exact and not p.startswith('providers/')
          )
          if unexpected:
              raise SystemExit('unexpected one-shot changes: ' + ', '.join(unexpected))
          print('one-shot safety scope passed: ' + ', '.join(sorted(changed)))
          PY

      - name: Commit exact tested safety repair
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo 'safety repair already current'
            exit 0
          fi
          git config user.name 'niakvio-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: fail closed on conclusive provider safety failures'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
