name: TEMP - Memory and Route Proof Sync V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/trigger-memory-route-proof-sync.txt'

permissions:
  contents: write

concurrency:
  group: memory-route-proof-sync-v1
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Checkpoint 5.21.37 and modernize route-proof baseline
        run: python3 scripts/memory_route_proof_sync_v1.py

      - name: Commit checkpoint and route-proof retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/memory-route-proof-sync-v1.yml scripts/trigger-memory-route-proof-sync.txt scripts/memory_route_proof_sync_v1.py
          git add MEMORY.md .github/workflows/main-route-proof-reconstruction.yml .github/triggers/route-proof-reconstruction.json
          git commit -m 'chore: checkpoint 5.21.37 and resume proof-first recovery'
          git pull --rebase origin main
          git push origin HEAD:main
