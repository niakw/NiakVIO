name: SHORT - HLS Master Facts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_hls_master_facts_v1.py'
      - 'tests/hls_master_facts_short_test.py'
      - 'tests/hls_playback_integrity_test.py'
      - '.github/workflows/hls-master-facts-short.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-short-hls-master-facts-main
  cancel-in-progress: false

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Apply bounded HLS master facts migration
        run: python3 scripts/upgrade_hls_master_facts_v1.py
      - name: Compile
        run: python3 -m py_compile scripts/upgrade_hls_master_facts_v1.py scripts/provider_patches/hls_runtime_integrity_v1.py tests/hls_master_facts_short_test.py
      - name: Master quality audio and native 403 contract
        run: python3 tests/hls_master_facts_short_test.py
      - name: Existing HLS playback integrity contract
        run: python3 tests/hls_playback_integrity_test.py
      - name: Playback architecture contract
        run: python3 tests/global_playback_integrity_policy_test.py
      - name: Scoped playback regression contract
        run: python3 tests/scoped_playback_context_regression_test.py
      - name: Migration idempotence
        run: python3 scripts/upgrade_hls_master_facts_v1.py
      - name: Diff integrity
        run: git diff --check
      - name: Publish durable HLS source and scoped options
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee "$RUNNER_TEMP/changed.txt"
          if grep -Ev '^(scripts/provider_patches/hls_runtime_integrity_v1\.py|provider-overrides\.json)$' "$RUNNER_TEMP/changed.txt"; then
            echo 'Unexpected HLS master-facts migration path' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provider_patches/hls_runtime_integrity_v1.py provider-overrides.json
          git diff --cached --quiet && { echo 'HLS_MASTER_FACTS_ALREADY_APPLIED'; exit 0; }
          git commit -m 'fix(core): derive HLS quality and audio tracks from master'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || {
            echo 'main moved during HLS master-facts migration' >&2
            exit 1
          }
          git push origin HEAD:main
          echo "HLS_MASTER_FACTS_PUBLISHED $(git rev-parse HEAD)"
