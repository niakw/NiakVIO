name: TEMP - Android Hub46 prebuild ownership

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-android-hub46-prebuild.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared Android prebuild scope ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_native_android_hub46_manifest_v1.py
          bash -n scripts/prebuild_native_android_reader_suite.sh
          python3 tests/native_hub46_transport_manifest_test.py
          python3 tests/native_adaptive_catalog_contract_test.py
      - name: Commit prebuild only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prebuild_native_android_reader_suite.sh
          if git diff --cached --quiet; then
            echo 'Prebuild already current'
            exit 0
          fi
          git commit -m 'fix(labs): keep Android prebuild on physical Hub-46 manifest'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
