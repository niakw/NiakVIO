name: Promote globally proven NuvioTV candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/promote-global-nuvio-tv-candidates"

permissions:
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Synchronize queued checkout with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate promotion tooling
        run: |
          python -m py_compile scripts/normalize_hls_override_policy.py
          python -m py_compile scripts/provider_patches/stream_output_sanitizer_v5.py
          python -m py_compile scripts/promote_global_nuvio_tv_candidates.py
          python -m py_compile scripts/provider_patches/nuvio_tv_direct_media_v2.py
          node --check scripts/nuvio_tv_probe_v2.cjs

      - name: Normalize global HLS policy
        run: |
          python scripts/normalize_hls_override_policy.py
          python scripts/normalize_hls_override_policy.py --check

      - name: Revalidate and stage independent strict improvements
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          set +e
          python scripts/promote_global_nuvio_tv_candidates.py
          promotion_status=$?
          set -e
          if [ "$promotion_status" -ne 0 ] && [ "$promotion_status" -ne 2 ]; then
            exit "$promotion_status"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('automation/nuvio-tv-global-promotion.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          rows = {str(row.get('id', '')).casefold(): row for row in manifest.get('scrapers', [])}
          targets = {'desiflix', 'french-manga', 'streamzo'}
          published = {str(row.get('id', '')).casefold() for row in report.get('published', [])}
          preserved = {str(value).casefold() for value in report.get('preserved', [])}
          assert published <= targets, (published, preserved)
          assert targets <= published | preserved, (published, preserved)

          for provider_id in sorted(targets):
              provider = report['providers'][provider_id]
              assert provider['no_regression'], (provider_id, provider)
              assert provider['strict_outputs'], (provider_id, provider)
              if provider_id in published:
                  assert provider['strictly_better'], (provider_id, provider)
              else:
                  assert provider_id in preserved, (provider_id, report)
                  assert not provider['strictly_better'], (provider_id, provider)
                  assert '--nuvio-tv-global--' in rows[provider_id]['filename'], rows[provider_id]
                  assert provider['candidate_summary']['playable_fixture_count'] == provider['baseline_summary']['playable_fixture_count'], provider
                  assert provider['candidate_summary']['playable_stream_count'] == provider['baseline_summary']['playable_stream_count'], provider

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"changed={'true' if published else 'false'}\n")
          print('strict global promotions:', ', '.join(sorted(published)) or 'none; current bundles already proven')
          PY

      - name: Bump and synchronize release
        if: steps.promotion.outputs.changed == 'true'
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_vf_projection.py

      - name: Run complete regressions
        if: steps.promotion.outputs.changed == 'true'
        run: npm test

      - name: Regenerate and validate release integrity
        if: steps.promotion.outputs.changed == 'true'
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node scripts/validate_provider_semantics.cjs
          python scripts/validate_vf_projection.py
          python scripts/validate_activation_preservation.py

      - name: Publish strictly proven global candidates
        if: steps.promotion.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json vf/manifest.json provider-overrides.json PROVENANCE.json \
            package.json sources.json nuvio-client-id-state.json \
            providers/desiflix--nuvio-tv-global--*.js \
            providers/french-manga--nuvio-tv-global--*.js \
            providers/streamzo--nuvio-tv-global--*.js \
            scripts/normalize_hls_override_policy.py \
            scripts/provider_patches/stream_output_sanitizer_v5.py \
            scripts/promote_global_nuvio_tv_candidates.py \
            automation/nuvio-tv-global-promotion.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: promote globally proven NuvioTV media providers"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
