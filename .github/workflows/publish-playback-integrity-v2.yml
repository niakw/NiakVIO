name: Publish validated playback integrity v2

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/publish-playback-integrity-v2"

permissions:
  contents: write

concurrency:
  group: nuvio-playback-integrity-v2-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Normalize failed deep transaction evidence
        shell: bash
        run: |
          set -euo pipefail
          LAST_CLEAN=eb010b714fb4b16a07dd1369d7325b8a40d570dd
          # The failed deep run committed its report/provider staging phase but
          # correctly did not publish a new manifest. The activation validator
          # must therefore see the last committed deep report for this exact
          # unchanged manifest, not the rejected staged promotion report.
          git diff --exit-code "$LAST_CLEAN" -- manifest.json vf/manifest.json provider-activation-lkg.json
          git show "$LAST_CLEAN:health-report.json" > health-report.json
      - name: Import only the branch-validated durable source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=ec9db52271070479a8cba71bba041e0f74f0520b
          git fetch origin agent/playback-integrity-v2
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          for path in \
            provider-overrides.json \
            health-config.json \
            package.json \
            scripts/apply_provider_overrides.py \
            scripts/health_check.mjs \
            scripts/platform_runtime_probe.mjs \
            scripts/mobile_vf_runtime_probe.mjs \
            scripts/direct_media_probe.cjs \
            scripts/promote_candidates.py \
            scripts/validate_policy.py \
            tests/global_playback_integrity_policy_test.py \
            tests/direct_media_probe.test.cjs
          do
            mkdir -p "$(dirname "$path")"
            git show "$EXPECTED:$path" > "$path"
          done
          python -m py_compile scripts/apply_provider_overrides.py scripts/promote_candidates.py scripts/validate_policy.py tests/global_playback_integrity_policy_test.py
          node --check scripts/health_check.mjs
          node --check scripts/platform_runtime_probe.mjs
          node --check scripts/mobile_vf_runtime_probe.mjs
          node --check scripts/direct_media_probe.cjs
          python tests/global_playback_integrity_policy_test.py
          node tests/direct_media_probe.test.cjs
          python scripts/validate_policy.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize global hooks and synchronize release
        shell: bash
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/bump_release_patch_if_manifest_changed.py --previous "$RUNNER_TEMP/manifest.before.json" --manifest manifest.json
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/prune_unreferenced_providers.py
          python scripts/build_provider_runtime_profiles.py
          python scripts/generate_release_hashes.py
      - name: Validate exact publication tree
        run: |
          python scripts/validate_published_overrides.py
          python scripts/validate_language_projection.py
          python scripts/validate_policy.py
          python tests/global_playback_integrity_policy_test.py
          node tests/direct_media_probe.test.cjs
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python tests/language_manifest_metadata_consistency_test.py
      - name: Publish exact validated state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit -m "fix: publish strict HLS audio and identity integrity v2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
