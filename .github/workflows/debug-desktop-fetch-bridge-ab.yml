name: Debug Desktop fetch bridge A/B

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-fetch-bridge-ab.yml"

permissions:
  contents: read

jobs:
  fetch-bridge-ab:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage current Purstream bundle
        shell: bash
        run: |
          set -euxo pipefail
          provider_path="$(python3 - <<'PY'
          import json
          data=json.load(open("niakvio/manifest.json", encoding="utf-8"))
          for row in data.get("scrapers", []):
              if str(row.get("id","")).lower()=="purstream":
                  print(row["filename"])
                  break
          else:
              raise SystemExit("PURSTREAM missing from manifest")
          PY
          )"
          cp "niakvio/$provider_path" "$GITHUB_WORKSPACE/purstream-current.js"
          test -s "$GITHUB_WORKSPACE/purstream-current.js"
          echo "FIELD_FETCH_AB_PROVIDER path=$provider_path"

      - name: Checkout current official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused PluginRuntime A/B test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioFetchBridgeAbTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioFetchBridgeAbTest {
              @Test
              fun purstreamInterstellar() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  val code = File(workspace, "purstream-current.js").readText()
                  val label = System.getenv("NIAKVIO_AB_LABEL") ?: "unknown"
                  val started = System.currentTimeMillis()
                  val rows = PluginRuntime.executePlugin(
                      code = code,
                      tmdbId = "157336",
                      mediaType = "movie",
                      season = null,
                      episode = null,
                      scraperId = "PURSTREAM",
                  )
                  val elapsed = System.currentTimeMillis() - started
                  File(workspace, "fetch-ab-" + label + ".txt").writeText(rows.size.toString())
                  println("FIELD_DESKTOP_FETCH_BRIDGE_AB label=" + label + " count=" + rows.size + " duration_ms=" + elapsed)
              }
          }
          KOTLIN

      - name: Run with current async fetch bridge
        shell: bash
        env:
          NIAKVIO_AB_LABEL: current
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioFetchBridgeAbTest'             --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
          echo "FIELD_DESKTOP_FETCH_BRIDGE_AB_RESULT label=current count=$(cat "$GITHUB_WORKSPACE/fetch-ab-current.txt")"

      - name: Restore historical synchronous fetch bridge only
        shell: bash
        run: |
          set -euxo pipefail
          git -C nuvio-desktop fetch --no-tags origin 8977fda639f5791947e6d8b36025635a77aed5da
          for path in             composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/network/FetchBridge.kt             composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/js/JsBindings.kt
          do
            git -C nuvio-desktop show 8977fda639f5791947e6d8b36025635a77aed5da:"$path" > "nuvio-desktop/$path"
          done
          git -C nuvio-desktop diff --check
          git -C nuvio-desktop diff --             composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/network/FetchBridge.kt             composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/plugins/runtime/js/JsBindings.kt

      - name: Run with historical synchronous fetch bridge
        shell: bash
        env:
          NIAKVIO_AB_LABEL: legacy
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioFetchBridgeAbTest'             --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
          echo "FIELD_DESKTOP_FETCH_BRIDGE_AB_RESULT label=legacy count=$(cat "$GITHUB_WORKSPACE/fetch-ab-legacy.txt")"

      - name: Classify fetch bridge regression
        shell: bash
        run: |
          set -euxo pipefail
          current="$(cat "$GITHUB_WORKSPACE/fetch-ab-current.txt")"
          legacy="$(cat "$GITHUB_WORKSPACE/fetch-ab-legacy.txt")"
          echo "FIELD_DESKTOP_FETCH_BRIDGE_AB_SUMMARY current=$current legacy=$legacy"
          if [[ "$current" -eq 0 && "$legacy" -gt 0 ]]; then
            echo "FIELD_DESKTOP_FETCH_BRIDGE_AB_CAUSE cause=async_native_fetch_regression"
            exit 0
          fi
          echo "FIELD_DESKTOP_FETCH_BRIDGE_AB_CAUSE cause=not_proven_by_bridge_ab"
          exit 1
