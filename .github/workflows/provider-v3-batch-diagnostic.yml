name: LAB - Provider v3 Batch Diagnostic

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 1-based provider queue start index
        required: false
        default: '1'
      count:
        description: Number of providers to diagnose
        required: false
        default: '10'
  push:
    branches:
      - workbench/provider-v3-recognition-routes-data
    paths:
      - '.github/triggers/provider-v3-batch-diagnostic.json'

permissions:
  actions: read
  contents: write

# Workbench repair slices stay sequential inside each SHA. They never publish.
# Provider-scoped failures are repair-first, then deferred to Learn instead of
# blocking the remaining slice. Every completed slice checkpoints DATA + report
# in Git before the next slice is allowed to become authoritative.
concurrency:
  group: provider-v3-batch-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  batch-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore durable recovered route DATA checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery_run="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.github/triggers/provider-v3-batch-diagnostic.json')
          cfg = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(int(cfg.get('recovery_run_id') or 0))
          PY
          )"
          if [ "${recovery_run}" = "0" ]; then
            echo 'FIELD_PROVIDER_RECOVERY_CHECKPOINT requested=false'
            exit 0
          fi

          checkpoint="automation/provider-v3-batch-checkpoints/run-${recovery_run}-batch-019-058.json"
          if [ -f "${checkpoint}" ]; then
            echo "FIELD_PROVIDER_RECOVERY_CHECKPOINT requested=true already_restored=true run=${recovery_run}"
            exit 0
          fi

          recovery_dir="${RUNNER_TEMP}/provider-v3-recovery-${recovery_run}"
          rm -rf "${recovery_dir}"
          mkdir -p "${recovery_dir}"
          gh run download "${recovery_run}" --repo "${GITHUB_REPOSITORY}" --name provider-v3-batch-diagnostic --dir "${recovery_dir}"

          static_file="$(find "${recovery_dir}" -type f -name 'provider-v3-static-knowledge.json' -print -quit)"
          overrides_file="$(find "${recovery_dir}" -type f -name 'provider-overrides.json' -print -quit)"
          report_file="$(find "${recovery_dir}" -type f -name 'provider-v3-batch-diagnostic.json' -print -quit)"
          test -n "${static_file}" && test -n "${overrides_file}" && test -n "${report_file}"

          static_sha="$(sha256sum "${static_file}" | awk '{print $1}')"
          overrides_sha="$(sha256sum "${overrides_file}" | awk '{print $1}')"
          report_sha="$(sha256sum "${report_file}" | awk '{print $1}')"
          echo "FIELD_PROVIDER_RECOVERY_HASH static=${static_sha} overrides=${overrides_sha} report=${report_sha}"
          test "${static_sha}" = '8ee6e3f36566971247221c7984ed10e4eff14708c589bb9c334c89e3a6404b5'
          test "${overrides_sha}" = '165240e06618b13b0da2eef34ea5a890bde52b7ff958e9116acb100721faf500'
          test "${report_sha}" = 'e6d51733c7f496cfd338c5c98f179e69ed7c05c0be082edd848bd13056abf8cb'

          python - "${static_file}" "${report_file}" <<'PY'
          import json, sys
          from pathlib import Path
          static = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          report = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert static.get('providerCount') == 96
          assert len(static.get('providers', {})) == 96
          expected = {
              'providerCount': 96,
              'startIndex': 19,
              'endIndex': 58,
              'processedCount': 40,
              'finalVerifiedCount': 17,
              'terminalOnlyCount': 4,
              'deferredToLearnCount': 19,
              'hardFailureCount': 0,
          }
          for key, value in expected.items():
              assert report.get(key) == value, (key, report.get(key), value)
          print('FIELD_PROVIDER_RECOVERY_VALIDATED providers=96 batch=19-58 processed=40 final_verified=17 terminal=4 deferred=19 hard=0')
          PY

          mkdir -p automation/provider-v3-batch-checkpoints
          cp "${static_file}" automation/provider-v3-static-knowledge.json
          cp "${overrides_file}" provider-overrides.json
          cp "${report_file}" "${checkpoint}"

          python - <<'PY'
          from pathlib import Path
          memory = Path('MEMORY.md')
          text = memory.read_text(encoding='utf-8')
          marker = 'run-33979458656-route-data-recovery'
          if marker not in text:
              checkpoint_text = """

          ## 2026-09-05 route/DATA recovery lock — run 33979458656 {#run-33979458656-route-data-recovery}
          - This is the authoritative recovery checkpoint for route/DATA work after the original successful artifact was not persisted to Git.
          - Source workflow run: `33979458656`, head SHA `b1891055fc0830f690bc6afa9f7d2708844a1394`.
          - Recovered canonical snapshot contains all 96 providers and already carries the previously accumulated 1→18 state.
          - Batch report itself covers providers 19→58: 40 processed, 17 final-bundle verified, 4 terminal-blocked, 19 defer-to-learn, 0 hard failures.
          - Final-bundle verified in 19→58: `animesalt`, `animetsu`, `animevostfr`, `castle`, `cineby`, `cinemm`, `coflix`, `french-manga`, `hianime`, `kurage`, `moviesmod`, `neko-sama`, `playimdb`, `streamzo`, `toflix`, `videasy`, `vidfast`.
          - Terminal-blocked in 19→58: `animesultra`, `animezey`, `cinemacity`, `movix`.
          - `mugiwarastream` is a deliberate validated-DATA-retained/final-bundle-unverified case: keep its validated DATA while provider authority remains demoted until repaired.
          - Exact recovered SHA-256: static knowledge `8ee6e3f36566971247221c7984ed10e4eff14708c589bb9c334c89e3a6404b5`; overrides `165240e06618b13b0da2eef34ea5a890bde52b7ff958e9116acb100721faf500`; batch report `e6d51733c7f496cfd338c5c98f179e69ed7c05c0be082edd848bd13056abf8cb`.
          - Durable report path: `automation/provider-v3-batch-checkpoints/run-33979458656-batch-019-058.json`.
          - Do NOT rerun 19→58 merely because a chat/session is lost. Resume recognition at provider 59 unless explicitly auditing a regression.
          - A route is validated DATA only after actual live HTTP execution. Static recognition, source inspection, seed data or inferred route shape alone remain candidate/diagnostic evidence.
          - Every subsequent recognition batch MUST commit `automation/provider-v3-static-knowledge.json`, `provider-overrides.json`, its exact batch report checkpoint, and a MEMORY checkpoint before proceeding to another batch.
          - Full Provider reconstruction is intentionally deferred until route/DATA recognition across the full 96-provider catalogue is complete.
          """
              checkpoint_text = '\n'.join(line[10:] if line.startswith('          ') else line for line in checkpoint_text.splitlines())
              memory.write_text(text + checkpoint_text + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/provider-v3-static-knowledge.json provider-overrides.json "${checkpoint}" MEMORY.md
          git commit -m 'data: restore live route checkpoint from run 33979458656'
          git push origin HEAD:workbench/provider-v3-recognition-routes-data
          echo "FIELD_PROVIDER_RECOVERY_CHECKPOINT requested=true restored=true run=${recovery_run} checkpoint=${checkpoint}"

      - name: Reconcile current provider authority after recovered snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          overrides_path = Path('provider-overrides.json')
          seeds_path = Path('automation/provider-v3-recognition-seeds.json')
          overrides = json.loads(overrides_path.read_text(encoding='utf-8'))
          seeds = json.loads(seeds_path.read_text(encoding='utf-8'))
          patches = overrides.setdefault('provider_patches', {})
          seed_providers = seeds.get('providers', {})

          # Current reviewed authority must win over stale historical catalogue
          # substitutions restored with the diagnostic artifact.
          fourk_seed = seed_providers.get('4khdhub', {})
          fourk = patches.setdefault('4khdhub', {})
          if fourk_seed:
              fourk['official_site'] = fourk_seed.get('officialSite') or fourk_seed.get('knownSite')
              fourk['official_hub'] = fourk_seed.get('officialHub') or fourk['official_site'] + '/'
              fourk['learned_urls'] = [fourk['official_site']]
              fourk['domain_substitutions'] = {
                  '4khdhub.click': fourk['official_site'].removeprefix('https://'),
              }
              notes = [n for n in fourk.get('notes', []) if 'HDHub4u terminal' not in n]
              notes.extend(n for n in fourk_seed.get('notes', []) if n not in notes)
              fourk['notes'] = notes

          vega_seed = seed_providers.get('vegamovies', {})
          vega = patches.setdefault('vegamovies', {})
          if vega_seed:
              vega['official_site'] = vega_seed.get('officialSite') or vega_seed.get('knownSite')
              vega['official_hub'] = vega_seed.get('officialHub')
              target = vega['official_site'].removeprefix('https://')
              vega['domain_substitutions'] = {
                  'vegamovies.catering': target,
                  '1vegamovies.cc': target,
                  '1vegamovies.me': target,
              }
              notes = list(vega.get('notes', []))
              notes.extend(n for n in vega_seed.get('notes', []) if n not in notes)
              vega['notes'] = notes

          overrides_path.write_text(json.dumps(overrides, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          if git diff --quiet -- provider-overrides.json; then
            echo 'FIELD_PROVIDER_AUTHORITY_RECONCILE changed=false'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json
          git commit -m 'data: preserve current 4KHDHub and VegaMovies authority'
          git push origin HEAD:workbench/provider-v3-recognition-routes-data
          echo 'FIELD_PROVIDER_AUTHORITY_RECONCILE changed=true'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare current Provider v3 runtime and DATA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_v3_finalization_v1.py
          python scripts/upgrade_provider_v3_semantic_query_residue_v1.py
          python scripts/upgrade_provider_v3_dynamic_query_residue_v1.py
          python scripts/upgrade_provider_v3_safe_runtime_route_promotion_v2.py
          python scripts/upgrade_provider_v3_redirect_route_match_v1.py
          python scripts/upgrade_provider_v3_batch_defer_to_learn_v1.py
          python scripts/upgrade_provider_v3_defer_finalization_preserve_validated_data_v3.py
          python scripts/upgrade_provider_v3_season_query_role_v1.py
          python scripts/enforce_provider_v3_semantic_transport_contract_v5.py
          python scripts/reconcile_provider_v3_current_config_candidates.py
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python scripts/materialize_provider_base_v3_store.py
      - name: Validate repair-first contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_v3_current_config_candidate_reconciliation_test.py
          python tests/provider_v3_live_route_validation_test.py
          python tests/provider_v3_sequential_live_gate_test.py
          python tests/provider_v3_redirect_host_gate_test.py
          python tests/provider_v3_season_query_role_test.py
          python tests/provider_v3_dynamic_query_residue_test.py
          python tests/provider_v3_finalization_plan_test.py
          python tests/provider_v3_safe_runtime_route_promotion_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/provider_v3_batch_diagnostic_contract_test.py
          python tests/authoritative_hub_domain_refresh_test.py
          python tests/domain_refresh_workflow_test.py
      - name: Persist tested provider gate source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate_provider_v3_routes_sequential.py scripts/reconstruct_provider_v3_batch_diagnostic.py; then
            echo 'FIELD_PROVIDER_GATE_PERSIST changed=false'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_provider_v3_routes_sequential.py scripts/reconstruct_provider_v3_batch_diagnostic.py
          git commit -m 'fix: persist tested provider repair gate upgrades'
          git push origin HEAD:workbench/provider-v3-recognition-routes-data
          echo 'FIELD_PROVIDER_GATE_PERSIST changed=true'
      - name: Run bounded provider repair-first gate
        shell: bash
        env:
          DISPATCH_START: ${{ inputs.start_index }}
          DISPATCH_COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          trigger = Path('.github/triggers/provider-v3-batch-diagnostic.json')
          cfg = json.loads(trigger.read_text(encoding='utf-8')) if trigger.exists() else {}
          start = int(os.environ.get('DISPATCH_START') or cfg.get('start_index') or 1)
          count = int(os.environ.get('DISPATCH_COUNT') or cfg.get('count') or 10)
          print(f'FIELD_PROVIDER_BATCH_CONFIG start={start} count={count}', flush=True)
          raise SystemExit(subprocess.call([
              sys.executable,
              'scripts/reconstruct_provider_v3_batch_diagnostic.py',
              '--start-index', str(start),
              '--count', str(count),
              '--repair-attempts', '2',
              '--report', 'provider-v3-batch-diagnostic.json',
          ]))
          PY
      - name: Persist validated Provider route and DATA state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'

          checkpoint="$(python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('provider-v3-batch-diagnostic.json').read_text(encoding='utf-8'))
          start = int(report['startIndex'])
          end = int(report['endIndex'])
          path = Path('automation/provider-v3-batch-checkpoints') / f"run-{os.environ['GITHUB_RUN_ID']}-batch-{start:03d}-{end:03d}.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(path)
          PY
          )"

          python - "${checkpoint}" <<'PY'
          import json, os, sys
          from pathlib import Path
          checkpoint = Path(sys.argv[1])
          report = json.loads(checkpoint.read_text(encoding='utf-8'))
          memory = Path('MEMORY.md')
          text = memory.read_text(encoding='utf-8')
          marker = f"batch-run-{os.environ['GITHUB_RUN_ID']}-route-data-checkpoint"
          if marker not in text:
              final_verified = ', '.join(f"`{x}`" for x in report.get('finalVerified', [])) or 'none'
              terminal = ', '.join(f"`{x}`" for x in report.get('terminalOnly', [])) or 'none'
              deferred = [x.get('providerId') for x in report.get('deferredToLearn', []) if isinstance(x, dict) and x.get('providerId')]
              deferred_text = ', '.join(f"`{x}`" for x in deferred) or 'none'
              block = (
                  f"\n\n## Route/DATA batch checkpoint run {os.environ['GITHUB_RUN_ID']} {{#{marker}}}\n"
                  f"- Range: {report.get('startIndex')}→{report.get('endIndex')}; processed: {report.get('processedCount')}; hard failures: {report.get('hardFailureCount')}.\n"
                  f"- Final-bundle verified ({report.get('finalVerifiedCount', 0)}): {final_verified}.\n"
                  f"- Terminal-blocked ({report.get('terminalOnlyCount', 0)}): {terminal}.\n"
                  f"- Deferred-to-learn ({report.get('deferredToLearnCount', 0)}): {deferred_text}.\n"
                  f"- Exact durable report: `{checkpoint.as_posix()}`. Canonical static knowledge and overrides were committed in the same checkpoint commit.\n"
                  f"- Resume only after this Git checkpoint exists; never advance a recognition batch from artifact-only state.\n"
              )
              memory.write_text(text + block, encoding='utf-8')
          PY

          # Persist canonical truth plus the exact diagnostic report. Generated
          # bundles/manifests remain excluded from this route/DATA checkpoint.
          git add automation/provider-v3-static-knowledge.json provider-overrides.json "${checkpoint}" MEMORY.md
          staged="$(git diff --cached --name-only)"
          if [ -z "${staged}" ]; then
            echo 'FIELD_PROVIDER_ROUTE_DATA_PERSIST changed=false'
            exit 0
          fi
          unexpected="$(printf '%s\n' "${staged}" | grep -Ev '^(automation/provider-v3-static-knowledge\.json|provider-overrides\.json|MEMORY\.md|automation/provider-v3-batch-checkpoints/run-[0-9]+-batch-[0-9]{3}-[0-9]{3}\.json)$' || true)"
          test -z "${unexpected}" || {
            echo "Unexpected route/DATA checkpoint files:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          }

          git commit -m 'data: persist live-validated Provider routes, DATA and batch evidence'

          # The diagnostic creates generated/untracked workspace artefacts. Hide
          # them before rebase so a successful DATA checkpoint can never fail
          # merely because the worktree is dirty, then restore them for upload.
          stash_before="$(git rev-parse -q --verify refs/stash || true)"
          git stash push --include-untracked -m 'provider-v3-batch-post-data-workspace' || true
          stash_after="$(git rev-parse -q --verify refs/stash || true)"
          git fetch origin workbench/provider-v3-recognition-routes-data
          git rebase origin/workbench/provider-v3-recognition-routes-data
          git push origin HEAD:workbench/provider-v3-recognition-routes-data
          if [ -n "${stash_after}" ] && [ "${stash_after}" != "${stash_before}" ]; then
            git stash pop || true
          fi
          echo "FIELD_PROVIDER_ROUTE_DATA_PERSIST changed=true checkpoint=${checkpoint}"
      - name: Upload provider repair-first evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v3-batch-diagnostic
          path: |
            provider-v3-batch-diagnostic.json
            automation/provider-v3-static-knowledge.json
            provider-overrides.json
            automation/provider-v3-batch-checkpoints/
            MEMORY.md
          if-no-files-found: warn
