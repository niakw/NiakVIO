name: PROVIDERS - Brain Autopilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the causal execution plan without dispatching child lanes
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Provider Census - Sharded
    types:
      - completed
  push:
    branches: [main]
    paths:
      - '.github/triggers/provider-brain-autopilot.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: provider-brain-autopilot-main
  cancel-in-progress: true

jobs:
  route:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate causal routing contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_provider_repair_batch_plan.py scripts/build_provider_execution_plan.py scripts/provider_learning_dispatch_gate.py
          python tests/provider_repair_batch_causal_precedence_test.py
          python tests/provider_execution_plan_test.py
          python tests/provider_learning_dispatch_gate_test.py

      - name: Build exact current causal execution plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_provider_repair_batch_plan.py             --status automation/provider-census-status.json             --overrides provider-overrides.json             --output "$RUNNER_TEMP/provider-repair-batch-plan.json"
          python scripts/build_provider_execution_plan.py             --batch-plan "$RUNNER_TEMP/provider-repair-batch-plan.json"             --status automation/provider-census-status.json             --output "$RUNNER_TEMP/provider-execution-plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"provider-execution-plan.json").read_text())
          try:
              trigger=json.loads(Path(".github/triggers/provider-brain-autopilot.json").read_text(encoding="utf-8"))
          except Exception:
              trigger={}
          trigger_mode=str(trigger.get("mode") or "").strip().casefold()
          event_name=str(os.environ.get("GITHUB_EVENT_NAME") or "").strip().casefold()
          explicit_force=trigger_mode=="force" and event_name=="push"
          bounded_force_suppressed=trigger_mode=="force" and not explicit_force
          force_mode=explicit_force
          def cohort(lane):
              values=[]
              for row in p.get("executions") or []:
                  if row.get("lane")==lane and row.get("dispatchAllowed") is True:
                      values.extend(row.get("providers") or [])
              return ",".join(sorted(set(values)))
          print("domain="+cohort("DOMAIN_REFRESH"))
          print("remat="+cohort("REMAT_TEST"))
          print("fast="+cohort("FAST_REPAIR"))
          print("learning="+cohort("BRAIN_LEARNING"))
          print("harness="+cohort("CORE_CLIENT_LEARNING"))
          print("blocked="+str(int(p.get("blockedExecutionCount") or 0)))
          print("force="+("true" if force_mode else "false"))
          print("suppress="+("true" if bounded_force_suppressed else "false"))
          print("trigger_mode="+trigger_mode)
          print("event_name="+event_name)
          PY
          cat "$RUNNER_TEMP/provider-execution-plan.json"

      - name: Record bounded FORCE hold
        if: ${{ steps.plan.outputs.suppress == 'true' }}
        shell: bash
        run: |
          echo "FIELD_PROVIDER_AUTOPILOT_BOUNDED_FORCE suppressed=true event=${{ steps.plan.outputs.event_name }} trigger_mode=${{ steps.plan.outputs.trigger_mode }} reason=force-requires-new-explicit-trigger"

      - name: Dispatch causal owner lanes
        if: ${{ inputs.dry_run != true && steps.plan.outputs.suppress != 'true' }}
        shell: bash
        env:
          DOMAIN: ${{ steps.plan.outputs.domain }}
          REMAT: ${{ steps.plan.outputs.remat }}
          FAST: ${{ steps.plan.outputs.fast }}
          LEARNING: ${{ steps.plan.outputs.learning }}
          HARNESS: ${{ steps.plan.outputs.harness }}
          FORCE_MODE: ${{ steps.plan.outputs.force }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "FIELD_PROVIDER_AUTOPILOT_STALE source=$GITHUB_SHA remote=$remote_main"
            gh workflow run provider-brain-autopilot.yml               --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
            exit 0
          fi

          # A true transport/domain owner can invalidate every downstream
          # provider assumption. Run it alone; its publication/retest cycle
          # will rebuild a new execution plan.
          if [ -n "$DOMAIN" ]; then
            gh workflow run domain-refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=quick
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=DOMAIN_REFRESH providers=$DOMAIN"
            exit 0
          fi

          # REMAT diagnostics and provider-local repair are disjoint cohorts and
          # may execute in parallel. REMAT is observational and never publishes.
          if [ -n "$REMAT" ]; then
            gh workflow run provider-remat-test.yml               --repo "$GITHUB_REPOSITORY" --ref main               -f scope=non-full -f target_providers="$REMAT"
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=REMAT_TEST providers=$REMAT"
          fi

          if [ -n "$FAST" ]; then
            gh workflow run provider-fast-repair.yml               --repo "$GITHUB_REPOSITORY" --ref main               -f target_providers="$FAST"               -f waves=1 -f time_budget_seconds=600 -f max_rounds_per_batch=1 -f publish_validated=true
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=FAST_REPAIR providers=$FAST"
          fi

          # Learning debt must not wait for the nightly slot. Dispatch the exact
          # bounded cohort immediately; Learning remains globally serialized and
          # persists sanitized state/proposals before the next census.
          if [ -n "$LEARNING" ]; then
            publish_proposal="true"
            if [ "$FORCE_MODE" = "true" ]; then
              publish_proposal="false"
            fi
            args=(
              --repo "$GITHUB_REPOSITORY" --ref main
              -f publish_proposal="$publish_proposal"
              -f target_providers="$LEARNING"
              -f slot_remaining_minutes=60
              -f slot_phase=1
            )
            if [ "$FORCE_MODE" = "true" ]; then
              args+=(-f architecture_force=true)
            fi
            gh workflow run brain-learning-lab.yml "${args[@]}"
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=BRAIN_LEARNING providers=$LEARNING immediate=true budget_minutes=60 force=$FORCE_MODE publish_proposal=$publish_proposal"
          fi

          # Harness/Core-client debt may refresh transport evidence now.
          # Architecture Learning waits for the dedicated Learning slot.
          if [ -n "$HARNESS" ]; then
            gh workflow run provider-waf-browser-session.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f target_providers="$HARNESS"
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=CORE_CLIENT_LEARNING providers=$HARNESS waf=true architecture_learning=false reason=scheduled-learning-slot-only"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-brain-autopilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider-repair-batch-plan.json
            ${{ runner.temp }}/provider-execution-plan.json
            ${{ runner.temp }}/autopilot-learning-selection.json
            ${{ runner.temp }}/autopilot-harness-learning-selection.json
          retention-days: 14
          if-no-files-found: warn
