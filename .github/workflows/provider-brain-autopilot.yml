name: PROVIDERS - Brain Autopilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the causal execution plan without dispatching child lanes
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/triggers/provider-brain-autopilot.json'

permissions:
  # Write is restricted by contract below to the sanitized Learning-dispatch
  # ledger after a child Learning workflow has been dispatched successfully.
  contents: write
  actions: write

concurrency:
  group: provider-brain-autopilot-main
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate causal routing contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_provider_repair_batch_plan.py scripts/build_provider_execution_plan.py scripts/provider_learning_dispatch_gate.py
          python tests/provider_repair_batch_causal_precedence_test.py
          python tests/provider_execution_plan_test.py
          python tests/provider_learning_dispatch_gate_test.py

      - name: Build exact current causal execution plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_provider_repair_batch_plan.py             --status automation/provider-census-status.json             --overrides provider-overrides.json             --output "$RUNNER_TEMP/provider-repair-batch-plan.json"
          python scripts/build_provider_execution_plan.py             --batch-plan "$RUNNER_TEMP/provider-repair-batch-plan.json"             --status automation/provider-census-status.json             --output "$RUNNER_TEMP/provider-execution-plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"provider-execution-plan.json").read_text())
          def cohort(lane):
              values=[]
              for row in p.get("executions") or []:
                  if row.get("lane")==lane and row.get("dispatchAllowed") is True:
                      values.extend(row.get("providers") or [])
              return ",".join(sorted(set(values)))
          print("domain="+cohort("DOMAIN_REFRESH"))
          print("remat="+cohort("REMAT_TEST"))
          print("fast="+cohort("FAST_REPAIR"))
          print("learning="+cohort("BRAIN_LEARNING"))
          print("harness="+cohort("CORE_CLIENT_LEARNING"))
          print("blocked="+str(int(p.get("blockedExecutionCount") or 0)))
          PY
          cat "$RUNNER_TEMP/provider-execution-plan.json"

      - name: Dispatch causal owner lanes
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          DOMAIN: ${{ steps.plan.outputs.domain }}
          REMAT: ${{ steps.plan.outputs.remat }}
          FAST: ${{ steps.plan.outputs.fast }}
          LEARNING: ${{ steps.plan.outputs.learning }}
          HARNESS: ${{ steps.plan.outputs.harness }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mark_learning_dispatch() {
            selection="$1"
            python scripts/provider_learning_dispatch_gate.py mark \
              --ledger automation/provider-learning-dispatch-ledger.json \
              --selection "$selection" \
              --repair-run-id "$GITHUB_RUN_ID"
            git add automation/provider-learning-dispatch-ledger.json
            if ! git diff --cached --quiet; then
              git commit -m "data(brain): record Autopilot causal Learning dispatch from ${GITHUB_RUN_ID}"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          # A true transport/domain owner can invalidate every downstream
          # provider assumption. Run it alone; its publication/retest cycle
          # will rebuild a new execution plan.
          if [ -n "$DOMAIN" ]; then
            gh workflow run domain-refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=quick
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=DOMAIN_REFRESH providers=$DOMAIN"
            exit 0
          fi

          # REMAT diagnostics and provider-local repair are disjoint cohorts and
          # may execute in parallel. REMAT is observational and never publishes.
          if [ -n "$REMAT" ]; then
            gh workflow run provider-remat-test.yml               --repo "$GITHUB_REPOSITORY" --ref main               -f scope=non-full -f target_providers="$REMAT"
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=REMAT_TEST providers=$REMAT"
          fi

          if [ -n "$FAST" ]; then
            gh workflow run provider-fast-repair.yml               --repo "$GITHUB_REPOSITORY" --ref main               -f target_providers="$FAST"               -f waves=1 -f time_budget_seconds=600 -f max_rounds_per_batch=1 -f publish_validated=true
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=FAST_REPAIR providers=$FAST"
          fi

          # Distinct Learning debt must not be starved by an unrelated FAST cohort,
          # but an identical causal method must never be auto-dispatched twice.
          if [ -n "$LEARNING" ]; then
            learning_selection="$RUNNER_TEMP/autopilot-learning-selection.json"
            python scripts/provider_learning_dispatch_gate.py select-plan \
              --plan "$RUNNER_TEMP/provider-execution-plan.json" \
              --ledger automation/provider-learning-dispatch-ledger.json \
              --lane BRAIN_LEARNING \
              --providers "$LEARNING" \
              --output "$learning_selection"
            learning_csv="$(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(d.get("providerFilter") or "")' "$learning_selection")"
            if [ -n "$learning_csv" ]; then
              gh workflow run brain-learning-lab.yml \
                --repo "$GITHUB_REPOSITORY" --ref main \
                -f publish_proposal=false \
                -f target_providers="$learning_csv" \
                -f slot_remaining_minutes=20 -f slot_phase=1
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=BRAIN_LEARNING providers=$learning_csv targeted=true fingerprint=new"
              mark_learning_dispatch "$learning_selection"
            else
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=BRAIN_LEARNING skipped=true reason=no-new-causal-fingerprint"
            fi
          fi

          # Harness/Core-client debt is never a terminal storage state. Transport
          # evidence may refresh every run; architecture Learning is fingerprint-
          # gated so the same transport hypothesis cannot loop forever.
          if [ -n "$HARNESS" ]; then
            gh workflow run provider-waf-browser-session.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f target_providers="$HARNESS"
            harness_selection="$RUNNER_TEMP/autopilot-harness-learning-selection.json"
            python scripts/provider_learning_dispatch_gate.py select-plan \
              --plan "$RUNNER_TEMP/provider-execution-plan.json" \
              --ledger automation/provider-learning-dispatch-ledger.json \
              --lane CORE_CLIENT_LEARNING \
              --providers "$HARNESS" \
              --output "$harness_selection"
            harness_learning_csv="$(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(d.get("providerFilter") or "")' "$harness_selection")"
            if [ -n "$harness_learning_csv" ]; then
              gh workflow run brain-learning-lab.yml \
                --repo "$GITHUB_REPOSITORY" --ref main \
                -f publish_proposal=true \
                -f target_providers="$harness_learning_csv" \
                -f slot_remaining_minutes=20 -f slot_phase=1
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=CORE_CLIENT_LEARNING providers=$harness_learning_csv waf=true architecture_learning=true mutation=proposal-only fingerprint=new"
              mark_learning_dispatch "$harness_selection"
            else
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=CORE_CLIENT_LEARNING providers=$HARNESS waf=true architecture_learning=false reason=no-new-causal-fingerprint"
            fi
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-brain-autopilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider-repair-batch-plan.json
            ${{ runner.temp }}/provider-execution-plan.json
            ${{ runner.temp }}/autopilot-learning-selection.json
            ${{ runner.temp }}/autopilot-harness-learning-selection.json
          retention-days: 14
          if-no-files-found: warn
