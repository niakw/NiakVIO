name: PROVIDERS - Brain Autopilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the causal execution plan without dispatching child lanes
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Provider Census - Sharded
    types:
      - completed
  push:
    branches: [main]
    paths:
      - '.github/triggers/provider-brain-autopilot.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: provider-brain-autopilot-main
  cancel-in-progress: false

jobs:
  route:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Validate causal routing contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_provider_repair_batch_plan.py scripts/build_provider_execution_plan.py scripts/provider_learning_dispatch_gate.py
          python tests/provider_repair_batch_causal_precedence_test.py
          python tests/provider_execution_plan_test.py
          python tests/provider_learning_dispatch_gate_test.py
          python tests/provider_brain_autopilot_workflow_test.py

      - name: Build exact current causal execution plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_provider_repair_batch_plan.py             --status automation/provider-census-status.json             --overrides provider-overrides.json             --output "$RUNNER_TEMP/provider-repair-batch-plan.json"
          python scripts/build_provider_execution_plan.py             --batch-plan "$RUNNER_TEMP/provider-repair-batch-plan.json"             --status automation/provider-census-status.json             --output "$RUNNER_TEMP/provider-execution-plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"provider-execution-plan.json").read_text())
          try:
              trigger=json.loads(Path(".github/triggers/provider-brain-autopilot.json").read_text(encoding="utf-8"))
          except Exception:
              trigger={}
          trigger_mode=str(trigger.get("mode") or "").strip().casefold()
          event_name=str(os.environ.get("GITHUB_EVENT_NAME") or "").strip().casefold()
          explicit_force=trigger_mode=="force" and event_name=="push"
          stale_force_ignored=trigger_mode=="force" and event_name!="push"
          force_mode=explicit_force
          def cohort(lane):
              values=[]
              for row in p.get("executions") or []:
                  if row.get("lane")==lane and row.get("dispatchAllowed") is True:
                      values.extend(row.get("providers") or [])
              return ",".join(sorted(set(values)))
          print("domain="+cohort("DOMAIN_REFRESH"))
          print("remat="+cohort("REMAT_TEST"))
          print("fast="+cohort("FAST_REPAIR"))
          print("learning="+cohort("BRAIN_LEARNING"))
          print("harness="+cohort("CORE_CLIENT_LEARNING"))
          print("blocked="+str(int(p.get("blockedExecutionCount") or 0)))
          print("force="+("true" if force_mode else "false"))
          print("suppress=false")
          print("stale_force_ignored="+("true" if stale_force_ignored else "false"))
          print("trigger_mode="+trigger_mode)
          print("event_name="+event_name)
          PY
          cat "$RUNNER_TEMP/provider-execution-plan.json"

      - name: Record stale FORCE ignored
        if: ${{ steps.plan.outputs.stale_force_ignored == 'true' }}
        shell: bash
        run: |
          echo "FIELD_PROVIDER_AUTOPILOT_STALE_FORCE ignored=true event=${{ steps.plan.outputs.event_name }} trigger_mode=${{ steps.plan.outputs.trigger_mode }} reason=force-is-explicit-event-scoped"

      # Read-only gate: historical causal fingerprints must not trigger a new
      # automatic Learning attempt. This does not claim a cross-workflow atomic
      # reservation; durable coordination still requires a separate transaction.
      - name: Gate automatic Learning against durable causal history
        id: learning-gate
        shell: bash
        env:
          PLANNED_LEARNING: ${{ steps.plan.outputs.learning }}
          PLANNED_HARNESS: ${{ steps.plan.outputs.harness }}
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/provider-learning-dispatch-ledger.json"
          learning_memory="$RUNNER_TEMP/provider-learning-latest.json"
          plan="$RUNNER_TEMP/provider-execution-plan.json"
          rm -f "$ledger" "$learning_memory"
          if git fetch --quiet origin "+refs/heads/brain-learning/proposals:refs/remotes/origin/brain-learning/proposals" 2>/dev/null \
             && git show "refs/remotes/origin/brain-learning/proposals:engine_v2/learning/dispatch-ledger.json" > "$ledger" 2>/dev/null; then
            echo "FIELD_PROVIDER_AUTOPILOT_DISPATCH_LEDGER source=brain-learning/proposals"
            if git show "refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json" > "$learning_memory" 2>/dev/null; then
              echo "FIELD_PROVIDER_AUTOPILOT_LEARNING_MEMORY available=true source=brain-learning/proposals"
            else
              rm -f "$learning_memory"
              echo "FIELD_PROVIDER_AUTOPILOT_LEARNING_MEMORY available=false source=none"
            fi
          else
            cp automation/provider-learning-dispatch-ledger.json "$ledger"
            echo "FIELD_PROVIDER_AUTOPILOT_DISPATCH_LEDGER source=main-migration-fallback"
            echo "FIELD_PROVIDER_AUTOPILOT_LEARNING_MEMORY available=false source=none"
          fi
          # Missing/corrupt durable history must fail closed rather than replay old methods.
          test -s "$ledger"
          learning=""
          harness=""
          if [ -n "$PLANNED_LEARNING" ]; then
            learning_args=(
              python scripts/provider_learning_dispatch_gate.py select-plan
              --plan "$plan" --ledger "$ledger" --lane BRAIN_LEARNING
              --providers "$PLANNED_LEARNING"
              --output "$RUNNER_TEMP/autopilot-learning-selection.json"
            )
            if [ -s "$learning_memory" ]; then
              learning_args+=(--learning-memory "$learning_memory")
            fi
            "${learning_args[@]}"
            learning="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["providerFilter"])' "$RUNNER_TEMP/autopilot-learning-selection.json")"
          fi
          if [ -n "$PLANNED_HARNESS" ]; then
            python scripts/provider_learning_dispatch_gate.py select-plan \
              --plan "$plan" --ledger "$ledger" --lane CORE_CLIENT_LEARNING \
              --providers "$PLANNED_HARNESS" \
              --output "$RUNNER_TEMP/autopilot-harness-learning-selection.json"
            harness="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["providerFilter"])' "$RUNNER_TEMP/autopilot-harness-learning-selection.json")"
          fi
          {
            echo "learning=$learning"
            echo "harness=$harness"
          } >> "$GITHUB_OUTPUT"
          echo "FIELD_PROVIDER_AUTOPILOT_CAUSAL_GATE planned_learning=${PLANNED_LEARNING:-none} eligible_learning=${learning:-none} planned_harness=${PLANNED_HARNESS:-none} eligible_harness=${harness:-none}"

      - name: Dispatch causal owner lanes
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          DOMAIN: ${{ steps.plan.outputs.domain }}
          REMAT: ${{ steps.plan.outputs.remat }}
          FAST: ${{ steps.plan.outputs.fast }}
          LEARNING: ${{ steps.learning-gate.outputs.learning }}
          HARNESS: ${{ steps.learning-gate.outputs.harness }}
          FORCE_MODE: ${{ steps.plan.outputs.force }}
        run: |
          set -euo pipefail

          phase_file=automation/execution-phase.json
          brain_auto="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print("true" if d.get("automatic_brain_repair") is True else "false")')"
          learning_auto="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print("true" if d.get("automatic_brain_learning") is True else "false")')"
          targeted_repair="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print("true" if d.get("targeted_brain_repair") is True else "false")')"
          targeted_learning="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print("true" if d.get("targeted_brain_learning") is True else "false")')"
          checkpoint_required="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print("true" if d.get("checkpoint_required_before_brain") is True else "false")')"
          phase_name="$(python -c 'import json; d=json.load(open("automation/execution-phase.json", encoding="utf-8")); print(str(d.get("phase") or "unknown"))')"
          targeted_repair_allowed=false
          targeted_learning_allowed=false
          if [ "$checkpoint_required" != "true" ] && [ "$targeted_repair" = "true" ]; then targeted_repair_allowed=true; fi
          if [ "$checkpoint_required" != "true" ] && [ "$targeted_learning" = "true" ]; then targeted_learning_allowed=true; fi
          if [ "$brain_auto" != "true" ] && [ "$targeted_repair_allowed" != "true" ]; then
            FAST=""
            FORCE_MODE=false
            echo "FIELD_PROVIDER_AUTOPILOT_PHASE_GATE phase=$phase_name fast_repair=blocked checkpoint_required=$checkpoint_required targeted=false"
          elif [ -n "$FAST" ]; then
            echo "FIELD_PROVIDER_AUTOPILOT_PHASE_GATE phase=$phase_name fast_repair=targeted-allowed checkpoint_required=$checkpoint_required"
          fi
          if [ "$learning_auto" != "true" ] && [ "$targeted_learning_allowed" != "true" ]; then
            LEARNING=""
            echo "FIELD_PROVIDER_AUTOPILOT_PHASE_GATE phase=$phase_name brain_learning=blocked checkpoint_required=$checkpoint_required targeted=false"
          elif [ -n "$LEARNING" ]; then
            echo "FIELD_PROVIDER_AUTOPILOT_PHASE_GATE phase=$phase_name brain_learning=targeted-allowed checkpoint_required=$checkpoint_required"
          fi

          git fetch --quiet origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "FIELD_PROVIDER_AUTOPILOT_STALE source=$GITHUB_SHA remote=$remote_main"
            gh workflow run provider-brain-autopilot.yml               --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
            exit 0
          fi

          # Read-only best-effort in-flight protection. This prevents the
          # serialized Autopilot from re-dispatching a lane while its previous
          # child is queued/running. It is NOT an atomic cross-workflow lease.
          # Fail closed on API errors; never infer that no child exists.
          lane_busy() {
            local workflow="$1" state count
            for state in queued in_progress waiting pending requested; do
              if ! count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$state&per_page=1" --jq '.total_count' 2>/dev/null)"; then
                echo "FIELD_PROVIDER_AUTOPILOT_INFLIGHT_QUERY_ERROR workflow=$workflow status=$state action=defer" >&2
                return 0
              fi
              if ! [[ "$count" =~ ^[0-9]+$ ]]; then
                echo "FIELD_PROVIDER_AUTOPILOT_INFLIGHT_QUERY_ERROR workflow=$workflow status=$state reason=invalid-count action=defer" >&2
                return 0
              fi
              if (( count > 0 )); then
                echo "FIELD_PROVIDER_AUTOPILOT_INFLIGHT workflow=$workflow status=$state active=$count action=defer"
                return 0
              fi
            done
            return 1
          }

          # Exact unresolved-domain owners are provider-scoped. They may run beside
          # observational Learning/REMAT for disjoint providers; production Repair
          # waits for fresh post-domain authority.
          if [ -n "$DOMAIN" ]; then
            if lane_busy domain-refresh.yml; then
              echo "FIELD_PROVIDER_AUTOPILOT deferred=DOMAIN_REFRESH providers=$DOMAIN reason=lane-in-flight-or-query-unavailable"
            else
              gh workflow run domain-refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=quick -f target_providers="$DOMAIN"
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=DOMAIN_REFRESH providers=$DOMAIN targeted=true"
            fi
          fi

          # REMAT diagnostics and provider-local repair are disjoint cohorts and
          # may execute in parallel. REMAT is observational and never publishes.
          if [ -n "$REMAT" ]; then
            if lane_busy provider-remat-test.yml; then
              echo "FIELD_PROVIDER_AUTOPILOT deferred=REMAT_TEST providers=$REMAT reason=lane-in-flight-or-query-unavailable"
            else
              gh workflow run provider-remat-test.yml               --repo "$GITHUB_REPOSITORY" --ref main               -f scope=non-full -f target_providers="$REMAT"
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=REMAT_TEST providers=$REMAT"
            fi
          fi

          # The causal execution plan already enforces one owner lane per
          # provider. DOMAIN_REFRESH and FAST_REPAIR may therefore run together
          # when their provider cohorts are disjoint; only serialize Fast Repair
          # against another in-flight Fast Repair workflow.
          if [ -n "$FAST" ]; then
            if lane_busy provider-fast-repair.yml; then
              echo "FIELD_PROVIDER_AUTOPILOT deferred=FAST_REPAIR providers=$FAST reason=lane-in-flight-or-query-unavailable"
            else
              args=(gh workflow run provider-fast-repair.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_providers="$FAST" -f waves=1 -f time_budget_seconds=1200 -f max_rounds_per_batch=3 -f publish_validated=true)
              if [ "$FORCE_MODE" = "true" ]; then args+=(-f architecture_force=true); fi
              "${args[@]}"
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=FAST_REPAIR providers=$FAST"
            fi
          fi

          # Learning debt must not wait for the nightly slot. Split exact current
          # debt by causal family; targeted workflow concurrency isolates families
          # while the Learning publisher deterministically merges sanitized memory.
          if [ -n "$LEARNING" ]; then
            # Split current Learning debt into one oracle per causal family.
            # Distinct targeted workflow concurrency groups may execute in
            # parallel; each workflow keeps provider bytes isolated and the
            # Learning publisher performs the deterministic memory merge.
            publish_proposal="false"
            ELIGIBLE_CSV="$LEARNING" \
              LEARNING_SELECTION="$RUNNER_TEMP/autopilot-learning-selection.json" \
              FORCE_MODE="$FORCE_MODE" \
              PUBLISH_PROPOSAL="$publish_proposal" \
              MAX_COHORTS=8 \
              bash scripts/dispatch_learning_family_cohorts.sh
            echo "FIELD_PROVIDER_AUTOPILOT dispatch=BRAIN_LEARNING providers=$LEARNING immediate=true budget_minutes=90 force=$FORCE_MODE publish_proposal=$publish_proposal owner=parallel-family-learning"
          fi

          # Harness/Core-client debt may refresh transport evidence now.
          # Architecture Learning waits for the dedicated Learning slot.
          if [ -n "$HARNESS" ]; then
            if lane_busy provider-waf-browser-session.yml; then
              echo "FIELD_PROVIDER_AUTOPILOT deferred=CORE_CLIENT_LEARNING providers=$HARNESS reason=lane-in-flight-or-query-unavailable"
            else
              gh workflow run provider-waf-browser-session.yml \
                --repo "$GITHUB_REPOSITORY" --ref main \
                -f target_providers="$HARNESS"
              echo "FIELD_PROVIDER_AUTOPILOT dispatch=CORE_CLIENT_LEARNING providers=$HARNESS waf=true architecture_learning=false reason=scheduled-learning-slot-only"
            fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: provider-brain-autopilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider-repair-batch-plan.json
            ${{ runner.temp }}/provider-execution-plan.json
            ${{ runner.temp }}/autopilot-learning-selection.json
            ${{ runner.temp }}/autopilot-harness-learning-selection.json
          retention-days: 14
          if-no-files-found: warn
