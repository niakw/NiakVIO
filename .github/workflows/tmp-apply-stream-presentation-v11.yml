name: FIX - Forced Core stream presentation V11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-stream-presentation-v11.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply forced global presentation and native badge feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          core = root / 'scripts/provider_patches/global_stream_presentation_v1.py'
          text = core.read_text(encoding='utf-8')

          text = text.replace(
              'Important presentation rule: a technical fact represented by a badge is NOT repeated\n'
              'in user-facing title/description/size. Structured facts remain available to runtimes\n'
              'and badge renderers. Unknown quality/language/codec/source data is never invented.',
              'Presentation rule: provider descriptions are never authoritative UI. The Core always\n'
              'rebuilds them from provider/stream technical facts plus safe TMDB media context. The\n'
              'technical text stays visible so native StreamBadge matchers can render image badges;\n'
              'when native badges are disabled the same facts remain styled with emoji group markers.\n'
              'Unknown quality/language/codec/source data is never invented or displayed.'
          )
          old_rev = 'all-providers-facts-badge-dedupe-tmdb-fallback-v10'
          new_rev = 'all-providers-forced-description-badge-emoji-tmdb-v11'
          if old_rev not in text and new_rev not in text:
              raise SystemExit('presentation revision anchor missing')
          text = text.replace(old_rev, new_rev)

          def region(src: str, start: str, end: str, replacement: str) -> str:
              a = src.find(start)
              if a < 0:
                  raise SystemExit(f'missing start anchor: {start}')
              b = src.find(end, a)
              if b < 0:
                  raise SystemExit(f'missing end anchor: {end}')
              return src[:a] + replacement + src[b:]

          text = region(text, 'function audio(r){', 'function duration(r){', r'''function audioFacts(r){var u=(s(r&&r.audio)+" "+blob(r)).toUpperCase(),tech=[],codec="",ch="",cm=u.match(/\b(7\.1|5\.1|2\.1|2\.0)\b/);if(cm)ch=cm[1];if(/\b(?:ATMOS|DOLBY ATMOS)\b/.test(u))tech.push("Dolby Atmos");if(/\bDTS[: ._-]?X\b/.test(u))tech.push("DTS:X");if(/\bTRUE[ ._-]?HD\b/.test(u))codec="TrueHD";else if(/\b(?:E-?AC-?3|DDP|DD\+)\b/.test(u))codec="E-AC3";else if(/\bAC-?3\b/.test(u))codec="AC3";else if(/\bDTS[- ]?HD\b/.test(u))codec="DTS-HD";else if(/\bDTS\b/.test(u))codec="DTS";else if(/\bAAC\b/.test(u))codec="AAC";else if(meaningful(r&&r.audio)&&!tech.length)codec=s(r.audio);return{tech:uniq(tech),codec:codec,channels:ch}}
''')

          text = region(text, 'function source(r){', 'function formatType(r){', r'''function source(r){var raw=(s(r&&r.sourceType)+" "+s(r&&r.releaseType)+" "+blob(r)),u=raw.toUpperCase(),sourceType="",releaseType="";if(/\b(?:ULTRA[ ._-]?HD[ ._-]?BLU[ ._-]?RAY|UHD[ ._-]?BLU[ ._-]?RAY|UHD[ ._-]?BD)\b/.test(u))sourceType="ULTRA HD BLU-RAY";else if(/\b(?:BLU[- ]?RAY|BDRIP|BRRIP|BDREMUX)\b/.test(u))sourceType="BLU-RAY";else if(/\bWEB[- .]?DL\b/.test(u))sourceType="WEB-DL";else if(/\bWEB[- .]?RIP\b/.test(u))sourceType="WEBRIP";else if(/\bHDTV\b/.test(u))sourceType="HDTV";else if(/\bDVD[- .]?RIP\b/.test(u))sourceType="DVD RIP";if(/\bREMUX\b/.test(u))releaseType="REMUX";return{sourceType:sourceType||(meaningful(r&&r.sourceType)?s(r.sourceType):""),releaseType:releaseType||(meaningful(r&&r.releaseType)?s(r.releaseType):"")}}
''')

          text = region(text, 'function badgeIds(f){', 'function nativeFetchBridge(){', r'''function badgeIds(f){var ids=[];var q={"2160p":"4k-ultra-hd","1080p":"1080p-full-hd","720p":"720p-hd","480p":"480p-sd"}[f.quality];if(q)ids.push(q);var src={"ULTRA HD BLU-RAY":"uhd-blu-ray","BLU-RAY":"blu-ray-disc","WEB-DL":"webdl","WEBRIP":"webrip","HDTV":"hdtv","DVD RIP":"dvd-rip"}[f.sourceType];if(src)ids.push(src);if(f.releaseType==="REMUX")ids.push("remux");f.videoTech.forEach(function(v){var id={"Dolby Vision":"dolby-vision","HDR10+":"hdr10-plus","HDR10":"hdr10","IMAX Enhanced":"imax-enhanced","IMAX":"imax"}[v];if(id)ids.push(id)});var co={"HEVC":"hevc","AVC":"avc"}[f.codec];if(co)ids.push(co);if(f.bitDepth)ids.push(f.bitDepth);(f.audioTech||[]).forEach(function(v){var id={"Dolby Atmos":"dolby-atmos","DTS:X":"dts-x"}[v];if(id)ids.push(id)});var ac={"TrueHD":"truehd","E-AC3":"dolby-digital-plus","AC3":"dolby-digital","DTS-HD":"dts-hd-master-audio"}[f.audioCodec];if(ac)ids.push(ac);if(f.audioChannels==="7.1")ids.push("7.1");else if(f.audioChannels==="5.1")ids.push("5.1");var lg={"Multi":"multi","VFF":"vff","VFQ":"vfq","VO":"vo","VOSTFR":"vostfr"}[f.language];if(lg)ids.push(lg);f.subtitles.forEach(function(v){var id={"VOSTFR":"vostfr","SUB FR":"sub-fr","SUB EN":"sub-en","FORCED":"forced","SDH":"sdh-cc"}[v];if(id)ids.push(id)});return uniq(ids)}
function badgeLabels(f){var out=[];if(f.quality)out.push(f.quality==="2160p"?"4K":f.quality);if(f.sourceType)out.push(f.sourceType);if(f.releaseType)out.push(f.releaseType);out=out.concat(f.videoTech);if(f.codec)out.push(f.codec);if(f.bitDepth)out.push(f.bitDepth);out=out.concat(f.audioTech||[]);if(f.audioCodec)out.push(f.audioCodec);if(f.audioChannels)out.push(f.audioChannels);if(f.language)out.push(f.language);out=out.concat(f.subtitles);if(f.duration)out.push(humanDuration(f.duration));if(f.ageRating)out.push(f.ageRating);return uniq(out)}
function humanDuration(v){v=Number(v)||0;if(v<=0)return"";var h=Math.floor(v/60),m=v%60;return h?h+"h"+String(m).padStart(2,"0"):v+"min"}
function brief(v){var x=s(v).replace(/\s+/g," ");return x.length>180?x.slice(0,177).replace(/\s+\S*$/,"")+"…":x}
function technicalLine(f,fs){var groups=[],video=[],audio=[],lang=[],misc=[];if(f.quality)video.push(f.quality);var src=f.sourceType+(f.releaseType?" "+f.releaseType:"");if(src)video.push(src);if(f.codec)video.push(f.codec+(f.bitDepth?" "+f.bitDepth:""));else if(f.bitDepth)video.push(f.bitDepth);video=video.concat(f.videoTech||[]);if(f.format)video.push(f.format);if(video.length)groups.push("🎞️ "+uniq(video).join(" • "));audio=audio.concat(f.audioTech||[]);if(f.audioCodec)audio.push(f.audioCodec);if(f.audioChannels)audio.push(f.audioChannels);if(audio.length)groups.push("🔊 "+uniq(audio).join(" • "));if(f.language)lang.push(f.language);(f.subtitles||[]).forEach(function(v){if(v&&lang.indexOf(v)<0)lang.push(v)});if(lang.length)groups.push("🌐 "+lang.join(" • "));if(f.duration)misc.push("⏱ "+humanDuration(f.duration));if(fs)misc.push("💾 "+fs);if(f.ageRating)misc.push("🔞 "+f.ageRating);if(misc.length)groups.push(misc.join(" • "));return groups.join("  |  ")}
''')

          text = region(text, 'function present(r,meta,q){', 'function install(o,k){', r'''function present(r,meta,q){if(!r||typeof r!=="object")return r;var out=Object.assign({},r),au=audioFacts(r),so=source(r),vf=videoFacts(r),f={quality:quality(r),language:language(r),codec:codec(r),audioTech:au.tech,audioCodec:au.codec,audioChannels:au.channels,duration:duration(r)||(meta&&meta.runtime)||0,sourceType:so.sourceType,releaseType:so.releaseType,format:formatType(r),videoTech:vf.tech,bitDepth:vf.bitDepth,subtitles:subtitleFacts(r),ageRating:age(r)||(meta&&meta.age)||""};f.subtitles=f.subtitles.filter(function(v){return v!==f.language});if(f.quality)out.quality=f.quality;if(f.language)out.language=f.language;if(f.codec)out.codec=f.codec;var audioCombined=uniq((f.audioTech||[]).concat([f.audioCodec,f.audioChannels].filter(Boolean))).join(" ");if(audioCombined)out.audio=audioCombined;if(f.duration)out.duration=f.duration;if(f.sourceType)out.sourceType=f.sourceType;if(f.releaseType)out.releaseType=f.releaseType;if(f.format)out.format=f.format;if(f.ageRating)out.ageRating=f.ageRating;out.badgeIds=badgeIds(f);out.displayBadges=badgeLabels(f);out.presentationFacts=f;var provider=providerName(r),media=mediaLine(meta,q),small=compact(meta,q),genres=meta&&Array.isArray(meta.genres)&&meta.genres.length?meta.genres.slice(0,3).join(", "):"",fs=fileSize(r),technical=technicalLine(f,fs),lines=[];if(media)lines.push(((q.mediaType==="tv"||q.mediaType==="series"||q.mediaType==="anime")?"📺 ":"🎬 ")+media+(genres?" • "+genres:""));if(technical)lines.push(technical);else if(meta&&meta.overview)lines.push("ℹ️ "+brief(meta.overview));if(!lines.length)lines.push("🎬 "+provider);out.title=small?provider+" • "+small:provider;out.name=provider;out.description=lines.join("\n");if(fs)out.size=fs;else if("size" in out)delete out.size;return out}
''')
          core.write_text(text, encoding='utf-8')

          # Update the presentation contract tests to lock the actual mockup rule:
          # technical text stays visible and is the badge match substrate.
          test_path = root / 'tests/global_stream_presentation_test.py'
          tests = test_path.read_text(encoding='utf-8').replace(old_rev, new_rev)
          start = tests.index('# Latest UI rule:')
          end = tests.index('# Empty provider output', start)
          tests = tests[:start] + '''# The real UI contract keeps a technical line under optional native image badges.\n# Those same tokens are the badge matcher substrate and become the emoji fallback\n# when StreamBadge is disabled client-side.\nfor expected in (\n    "🎞️ ", "2160p", "BLU-RAY", "HEVC", "HLS",\n    "🔊 AAC", "🌐 Dual Audio", "⏱ 2h49", "🔞 -12",\n):\n    assert expected in row["description"], (expected, row)\nassert "Unknown" not in row["description"]\n\n''' + tests[end:]
          tests = tests.replace(
              'assert "BLU-RAY" not in plain_row["description"]\nassert "1080p" not in plain_row["description"]\nassert "Example • 2026" in plain_row["description"]',
              'assert "BLU-RAY" not in plain_row["description"]\nassert "🎞️ 1080p" in plain_row["description"]\nassert "MP4" in plain_row["description"]\nassert "Example • 2026" in plain_row["description"]'
          )
          tests = tests.replace(
              'assert "Fallback title • 2026" in unknown_row["description"]',
              'assert "Fallback title • 2026" in unknown_row["description"]\nassert "🎞️ HLS" in unknown_row["description"]'
          )
          tests = tests.replace(
              'assert "720p" not in sized_row["description"]',
              'assert "🎞️ 720p" in sized_row["description"]\nassert "💾 8.4 GB" in sized_row["description"]'
          )
          tests = tests.replace(
              'assert "Des explorateurs traversent un trou de ver" in row["description"], row\n',
              ''
          )
          extra = r'''

# Every provider-supplied description is discarded after it has served only as a
# source of technical facts. Garbage/Unknown text can never leak to the UI.
garbage = "module.exports={getStreams:async()=>[{name:'AnyProvider',url:'https://media.example/master.m3u8',description:'Unknown | UNKNOWN | provider private layout',quality:'1080p',audio:'Dolby Atmos TrueHD 7.1',sourceType:'UHD Blu-ray',releaseType:'REMUX',language:'VFF',subtitles:'VOSTFR'}]};\n"
garbage_row = run(
    presentation.apply(garbage, context={"provider_id": "anyprovider"}),
    tmdb_ok,
    "p.getStreams({tmdbId:'157336',mediaType:'movie',title:'Interstellar',year:2014}).then(v=>console.log(JSON.stringify(v[0])))",
)
assert "provider private layout" not in garbage_row["description"]
assert "Unknown" not in garbage_row["description"]
for expected in ("🎞️ 1080p", "ULTRA HD BLU-RAY REMUX", "🔊 Dolby Atmos • TrueHD • 7.1", "🌐 VFF • VOSTFR", "⏱ 2h49", "🔞 -12"):
    assert expected in garbage_row["description"], (expected, garbage_row)
for badge_id in ("uhd-blu-ray", "remux", "dolby-atmos", "truehd", "7.1", "vff", "vostfr"):
    assert badge_id in garbage_row["badgeIds"], (badge_id, garbage_row)
'''
          tests = tests.replace('\nprint("global stream presentation + badge/text dedupe contract tests passed")', extra + '\n\nprint("global stream presentation + native-badge/emoji fallback contract tests passed")')
          test_path.write_text(tests, encoding='utf-8')

          # Generate import feeds in the exact schema consumed by official Nuvio
          # StreamBadgeRules. We expose both contrast variants; provider output
          # itself stays client-setting agnostic.
          catalog = json.loads((root / 'assets/badge_catalog_v2_complete.json').read_text(encoding='utf-8'))
          groups = [
              {"id": str(g.get("id") or ""), "name": str(g.get("name") or ""), "color": "", "isExpanded": True}
              for g in catalog.get('groups') or [] if isinstance(g, dict)
          ]
          base = 'https://raw.githubusercontent.com/niakw/NiakVIO/main/'
          for theme in ('dark', 'light'):
              filters = []
              for badge in catalog.get('badges') or []:
                  if not isinstance(badge, dict):
                      continue
                  rel = str((((badge.get('assets') or {}).get(theme) or {}).get('96x40') or ''))
                  pattern = str(badge.get('pattern') or '')
                  name = str(badge.get('name') or badge.get('text') or badge.get('id') or '')
                  if not rel or not pattern or not name:
                      raise SystemExit(f'incomplete badge feed row: {badge.get("id")} {theme}')
                  filters.append({
                      "id": str(badge.get('id') or ''),
                      "groupId": str(badge.get('group') or ''),
                      "name": name,
                      "pattern": pattern,
                      "imageURL": base + rel,
                      "isEnabled": True,
                      "tagColor": "",
                      "tagStyle": "",
                      "textColor": "",
                      "borderColor": "",
                  })
              payload = {"filters": filters, "groups": groups}
              (root / f'assets/stream-badges-{theme}.json').write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )

          mapping_path = root / 'assets/mapping_core_brain_ui_v2_complete.json'
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          display = mapping.setdefault('display', {})
          display['alwaysReplaceProviderDescription'] = True
          display['nativeBadgeFeeds'] = {
              'dark_app_background': 'assets/stream-badges-dark.json',
              'light_app_background': 'assets/stream-badges-light.json',
          }
          display['fallbackWhenNativeBadgesDisabled'] = 'emojiTechnicalLine'
          display['presentationSources'] = {
              'technicalTruth': 'provider/stream facts',
              'mediaContextFallback': 'TMDB',
          }
          rules = mapping.setdefault('rules', [])
          for rule in (
              'Always replace every provider-owned stream description with the shared Core presentation.',
              'When native StreamBadge rules are active, technical text provides matcher tokens for image badges.',
              'When native StreamBadge rules are inactive, emoji-grouped technical text remains the universal visual fallback.',
              'TMDB may fill media context, runtime and age rating, but never invent stream resolution/source/codec/audio/language facts.',
          ):
              if rule not in rules:
                  rules.append(rule)
          mapping_path.write_text(json.dumps(mapping, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = root / 'assets/README.txt'
          readme = readme_path.read_text(encoding='utf-8')
          section = '''\nDUAL-MODE RUNTIME RULE\n----------------------\nNiakVIO always replaces provider-owned stream descriptions with the shared Core presentation.\nTechnical truth comes from provider/stream facts; TMDB fills only safe media context such as title/year/episode/genres/runtime/age when useful.\n\nIf native StreamBadge is active, import one of these feeds according to the Nuvio theme:\n- assets/stream-badges-dark.json\n- assets/stream-badges-light.json\nThe technical line deliberately keeps the matcher tokens so the official Nuvio StreamBadge renderer can show the real image assets.\n\nIf StreamBadge is inactive, the exact same description remains styled with emoji groups (🎞️ video, 🔊 audio, 🌐 language/subtitles, ⏱ duration, 💾 size, 🔞 age). No provider Unknown/private layout is allowed through.\n'''
          if 'DUAL-MODE RUNTIME RULE' not in readme:
              readme += section
          readme_path.write_text(readme, encoding='utf-8')

          mock_path = root / 'assets/docs/MAQUETTE_EXEMPLE_FLUX_UNIQUE.txt'
          mock = mock_path.read_text(encoding='utf-8')
          dual = '''\nRUNTIME DUAL-MODE\n-----------------\n- StreamBadge actif : les tokens de la ligne technique déclenchent les vrais badges image du feed dark/light.\n- StreamBadge inactif : la ligne technique reste visible avec groupes emoji, par exemple :\n  🎞️ 2160p • Ultra HD Blu-ray REMUX • HEVC 10-bit • Dolby Vision • IMAX Enhanced  |  🔊 Dolby Atmos • TrueHD • 7.1  |  🌐 VFF • VOSTFR\n- Dans les deux modes, la description originale du provider est entièrement remplacée par le Core.\n- TMDB enrichit uniquement le contexte média absent ; les faits techniques restent issus du flux/provider.\n'''
          if 'RUNTIME DUAL-MODE' not in mock:
              mock += dual
          mock_path.write_text(mock, encoding='utf-8')

          badge_test = root / 'tests/badge_asset_contract_test.py'
          btext = badge_test.read_text(encoding='utf-8')
          btext = btext.replace('    "4k-ultra-hd",\n', '    "uhd-blu-ray",\n    "4k-ultra-hd",\n', 1)
          feed_test = '''\n# Official Nuvio clients consume StreamBadge import payloads with filters/groups.\nfor theme in ("dark", "light"):\n    feed_path = ROOT / f"assets/stream-badges-{theme}.json"\n    feed = json.loads(feed_path.read_text(encoding="utf-8"))\n    assert len(feed.get("filters") or []) == len(badges), (theme, len(feed.get("filters") or []))\n    assert len(feed.get("groups") or []) == len(catalog.get("groups") or []), theme\n    feed_by_id = {str(row.get("id") or ""): row for row in feed.get("filters") or []}\n    assert set(feed_by_id) == set(by_id), theme\n    for badge_id, row in feed_by_id.items():\n        expected_rel = by_id[badge_id]["assets"][theme]["96x40"]\n        assert row["imageURL"].endswith(expected_rel), (theme, badge_id, row["imageURL"])\n        assert row["pattern"] == by_id[badge_id]["pattern"], (theme, badge_id)\n        assert row["isEnabled"] is True\n\n'''
          if 'Official Nuvio clients consume StreamBadge import payloads' not in btext:
              btext = btext.replace('\nprint(\n    "badge asset contract passed: "', feed_test + '\nprint(\n    "badge asset contract passed: "')
          badge_test.write_text(btext, encoding='utf-8')
          PY

      - name: Validate shared presentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/provider_patches/global_stream_presentation_v1.py
          python3 tests/global_stream_presentation_test.py
          python3 tests/global_stream_presentation_pipeline_test.py
          python3 tests/global_core_presentation_pipeline_test.py
          python3 tests/badge_asset_contract_test.py
          python3 tests/core_media_policy_test.py

      - name: Rebuild integrity and commit atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-apply-stream-presentation-v11.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add -A
          git diff --cached --check
          git commit -m 'feat: force unified stream presentation with badge emoji fallback'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
