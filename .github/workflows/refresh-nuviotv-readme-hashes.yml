name: Refresh hashes after NuvioTV README update

on:
  push:
    paths:
      - .github/triggers/refresh-nuviotv-readme-hashes

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Remove finite instrumentation and regenerate release hashes
        run: |
          rm -f .github/workflows/refresh-nuviotv-readme-hashes.yml
          rm -f .github/triggers/refresh-nuviotv-readme-hashes
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python scripts/validate_platform_runtime_policy.py
          python scripts/validate_mobile_runtime_policy.py
          git diff --check

      - name: Commit exact hashes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh 5.20.28 hashes after NuvioTV README update"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify exact published main is deterministic
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/validate_platform_runtime_policy.py
          python scripts/validate_mobile_runtime_policy.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --exit-code
