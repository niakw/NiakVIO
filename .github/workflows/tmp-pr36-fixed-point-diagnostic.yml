name: Temporary PR36 fixed-point diagnostic

on:
  push:
    branches:
      - fix/main-native-proof-and-isolation
    paths:
      - ".github/triggers/tmp-pr36-fixed-point-diagnostic"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/main-native-proof-and-isolation
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare scheduler patch
        run: python scripts/tmp_pr36_canonicalize_playback_transaction.py prepare
      - name: Diagnose convergence
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          def snapshot(label):
              manifest=json.loads(Path('manifest.json').read_text())
              row=next(r for r in manifest['scrapers'] if str(r.get('id','')).casefold()=='streamzo')
              path=Path(row['filename'])
              text=path.read_text()
              markers={
                'hls': text.find('NUVIO_HLS_RUNTIME_INTEGRITY_V1'),
                'media': text.find('NUVIO_GLOBAL_MEDIA_ENRICHMENT_V1'),
                'safety': text.find('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1'),
              }
              print(label, 'version=',row.get('version'),'file=',row['filename'],'sha=',hashlib.sha256(path.read_bytes()).hexdigest()[:16],'markers=',markers)
              shutil.copy2(path, f'/tmp/{label}.js')
          snapshot('before')
          PY
          echo '--- PASS 1 ---'
          python scripts/reapply_published_overrides.py
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          row=next(r for r in manifest['scrapers'] if str(r.get('id','')).casefold()=='streamzo')
          p=Path(row['filename']); t=p.read_text()
          print('pass1','version=',row.get('version'),'file=',row['filename'],'sha=',hashlib.sha256(p.read_bytes()).hexdigest()[:16], 'markers=', {'hls':t.find('NUVIO_HLS_RUNTIME_INTEGRITY_V1'),'media':t.find('NUVIO_GLOBAL_MEDIA_ENRICHMENT_V1'),'safety':t.find('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1')})
          shutil.copy2(p,'/tmp/pass1.js')
          PY
          echo '--- PASS 2 ---'
          python scripts/reapply_published_overrides.py
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          row=next(r for r in manifest['scrapers'] if str(r.get('id','')).casefold()=='streamzo')
          p=Path(row['filename']); t=p.read_text()
          print('pass2','version=',row.get('version'),'file=',row['filename'],'sha=',hashlib.sha256(p.read_bytes()).hexdigest()[:16], 'markers=', {'hls':t.find('NUVIO_HLS_RUNTIME_INTEGRITY_V1'),'media':t.find('NUVIO_GLOBAL_MEDIA_ENRICHMENT_V1'),'safety':t.find('NUVIO_GLOBAL_RUNTIME_MEDIA_SAFETY_V1')})
          shutil.copy2(p,'/tmp/pass2.js')
          PY
          echo '--- STREAMZO DIFF PASS1 -> PASS2 ---'
          diff -u /tmp/pass1.js /tmp/pass2.js | tail -n 240 || true
          echo '--- MANIFEST/PROVENANCE STATUS ---'
          git diff -- manifest.json vf/manifest.json PROVENANCE.json provider-overrides.json | tail -n 260 || true
          echo '--- PASS 3 CHECK ---'
          python scripts/reapply_published_overrides.py --check
