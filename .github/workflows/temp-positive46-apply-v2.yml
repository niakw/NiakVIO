name: TEMP - Apply Verified Positive46 V2
on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-positive46-apply-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: release/stable-46-20260912, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Materialize live-positive authority
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          ids='anime-sama purstream flemmix uhdmovies movieshunt hindmoviez 4khdhub persianstremio desiflix kehflix anikototv animekai animesalt animesama-co animesultra animetsu animevostfr castle coflix french-manga kurage moviesmod mugiwarastream neko-sama papadustream playimdb sekai streamzo videasy vidfast vidrock voiranime voiranime-homes voiranime-rip vostfree wookafr yflix allanime allwish anime-ultime animevost-fr fullanime mallumv moviebox showbox vidlove'.split()
          assert len(ids)==46 and len(set(ids))==46
          def cid(v): return str(v or '').strip().casefold().replace('_','-')
          m=json.load(open('manifest.json',encoding='utf-8')); matrix=json.load(open('automation/evidence/hub-lab-matrix-46.json',encoding='utf-8'))
          hubs=json.load(open('provider-hubs.json',encoding='utf-8')).get('providers',{}); ov=json.load(open('provider-overrides.json',encoding='utf-8')).get('provider_patches',{})
          by={cid(r.get('id')):r for r in m.get('scrapers',[]) if isinstance(r,dict)}; assert len(by)==96 and not(set(ids)-set(by))
          old={}
          for r in matrix.get('rows',[]):
            if isinstance(r,dict):
              for k in (cid(r.get('registryId')),cid(r.get('manifestId'))):
                if k: old.setdefault(k,r)
          rows=[]
          for p in ids:
            mr=by[p]; r=copy.deepcopy(old.get(p,{})); hr=hubs.get(p,{}) if isinstance(hubs.get(p),dict) else {}; pr=ov.get(p,{}) if isinstance(ov.get(p),dict) else {}
            caps=[]
            for x in mr.get('canonicalSupportedTypes') or mr.get('supportedTypes') or []:
              x='tv' if str(x).casefold() in {'tv','series','serie'} else str(x).casefold()
              if x in {'movie','tv','anime'} and x not in caps: caps.append(x)
            r.update({'registryId':p,'manifestId':mr.get('id'),'hub':hr.get('hub') or None,'officialHub':pr.get('official_hub') or None,'capabilities':caps,
              'currentLiveAudit':{'date':'2026-09-12','result':'declared-types-qualified','validatedTypes':caps,'missingTypes':[],'evidenceRuns':[34698141582,34696902428,34698638738]},
              'overall':'🟢 toutes les lanes déclarées qualifiées par le census live courant','cause':'preuve live courante 100% des types sémantiques déclarés','repair':'revalider aux Labs après publication'})
            rows.append(r)
          matrix.update({'hubCount':46,'selectionAuthority':'current-live-positive-audit-20260912','selectionPolicy':'enabled iff all declared semantic types are current-run qualified','selectionEvidenceRuns':[34698141582,34696902428,34698638738],'rows':rows})
          Path('automation/evidence/hub-lab-matrix-46.json').write_text(json.dumps(matrix,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          md=['# Matrice d’activation NiakVIO — 46 positifs live','','- Catalogue : **96 providers**.','- Activation : **46 ON / 50 OFF**.','- Autorité : census live 2026-09-12, toutes lanes déclarées qualifiées.','','| Provider | Manifest ID | Types |','|---|---|---|']
          md += [f"| {r['registryId']} | {r['manifestId']} | {', '.join(r['capabilities'])} |" for r in rows]
          Path('automation/HUB-LAB-MATRIX-46.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY
          python scripts/finalize_provider_repair_disposition_v1.py
      - name: Verify contracts and exact activation
        run: |
          python - <<'PY'
          import json
          def cid(v): return str(v or '').strip().casefold().replace('_','-')
          a=json.load(open('automation/evidence/hub-lab-matrix-46.json')); m=json.load(open('manifest.json')); d=json.load(open('automation/provider-repair-disposition.json'))
          targets={cid(r.get('manifestId')) for r in a['rows']}; enabled={cid(r.get('id')) for r in m['scrapers'] if r.get('enabled') is True}
          assert len(targets)==46 and enabled==targets and len(m['scrapers'])==96 and d['enabledProviderCount']==46 and d['disabledProviderCount']==50
          print('FIELD_POSITIVE46_AUTHORITY_OK enabled=46 disabled=50')
          PY
          python tests/provider_non_regression_contract_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/activation_preservation_core_rehash_test.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/evidence/hub-lab-matrix-46.json automation/HUB-LAB-MATRIX-46.md manifest.json provider-overrides.json automation/provider-v3-static-knowledge.json automation/provider-repair-disposition.json
          git diff --cached --quiet && { echo FIELD_POSITIVE46_COMMIT_CHANGED=false; exit 0; }
          git commit -m 'fix(release): activate exact current live-positive 46'
          git push origin HEAD:release/stable-46-20260912
          echo FIELD_POSITIVE46_COMMIT_CHANGED=true
