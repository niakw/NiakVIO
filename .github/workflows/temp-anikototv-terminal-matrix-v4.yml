name: TEMP - AniKotoTV terminal matrix v4

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-anikototv-terminal-matrix-v4.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/labs-5.21.44-20260912}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Enumerate Death Note episode-1 servers and terminal HTTP contracts
        run: |
          node <<'JS'
          const crypto=require('node:crypto');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36';
          const clean=u=>{try{const x=new URL(u);return {host:x.host,path:x.pathname}}catch{return {host:'',path:''}}};
          const H=(ref,xhr=false,origin='')=>({'User-Agent':UA,'Accept':'application/json,text/html,*/*',...(ref?{Referer:ref}:{}),...(origin?{Origin:origin}:{}),...(xhr?{'X-Requested-With':'XMLHttpRequest'}:{})});
          async function req(url,ref='',xhr=false,origin=''){const r=await fetch(url,{headers:H(ref,xhr,origin),redirect:'follow'});return {status:r.status,ok:r.ok,url:r.url,headers:r.headers,body:await r.text()}}
          function decrypt(enc){const b64=String(enc||'').replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-String(enc||'').length%4)%4);const cipher=Buffer.from(b64,'base64');const key=Buffer.alloc(32);Buffer.from("i?LMTAx0Q6,:}50U",'utf8').copy(key);const iv=Buffer.from("W0;27ToaUpl_P%'c",'utf8');const dec=crypto.createDecipheriv('aes-256-cbc',key,iv);const plain=Buffer.concat([dec.update(cipher),dec.final()]).toString('utf8');const j=JSON.parse(plain);return j?.file||j?.[0]?.file||''}
          async function probe(url,player){const variants=[['ua','',''],['megaplay-ref','https://megaplay.buzz/',''],['player-ref',player,''],['origin-ref',player,'https://megaplay.buzz']];const out=[];for(const [name,ref,origin] of variants){try{const r=await fetch(url,{headers:H(ref,false,origin),redirect:'follow'});const b=Buffer.from(await r.arrayBuffer());out.push({name,status:r.status,ct:r.headers.get('content-type')||'',bytes:b.length,extm3u:b.subarray(0,32).toString().includes('#EXTM3U'),finalHost:clean(r.url).host})}catch(e){out.push({name,error:e.name})}}return out}
          (async()=>{
            const search=await req('https://anikototv.to/ajax/anime/search?keyword=death%20note','https://anikototv.to/',true);
            const sh=JSON.parse(search.body)?.result?.html||'';
            const series=(sh.match(/href=["'](https:\/\/anikototv\.to\/watch\/death-note-fc8mq)["']/i)||[])[1]||'https://anikototv.to/watch/death-note-fc8mq';
            const watch=await req(series,'https://anikototv.to/');
            const aid=(watch.body.match(/id=["']watch-main["'][^>]*data-id=["']([^"']+)/i)||watch.body.match(/data-id=["']([^"']+)["'][^>]*id=["']watch-main["']/i)||[])[1];
            const eps=await req(`https://anikototv.to/ajax/episode/list/${encodeURIComponent(aid)}`,watch.url,true);
            const eh=JSON.parse(eps.body)?.result||'';const blocks=eh.match(/<a\b[^>]*>[\s\S]*?<\/a>/gi)||[];const ep=blocks.find(x=>/data-num=["']1["']/i.test(x))||blocks[0]||'';
            const ids=(ep.match(/data-ids=["']([^"']+)/i)||ep.match(/data-(?:ep-id|id)=["']([^"']+)/i)||[])[1];
            const sl=await req(`https://anikototv.to/ajax/server/list?servers=${encodeURIComponent(ids)}`,watch.url,true);
            const slh=JSON.parse(sl.body)?.result||'';const links=[...slh.matchAll(/data-link-id=["']([^"']+)/gi)].map(m=>m[1]);
            const uniq=[...new Set(links)].slice(0,16);const rows=[];
            for(const link of uniq){const row={};try{const sr=await req(`https://anikototv.to/ajax/server?get=${encodeURIComponent(link)}`,watch.url,true);let rr=JSON.parse(sr.body)?.result;if(typeof rr==='string'){try{rr=JSON.parse(rr)}catch{}}const player=rr?.url||rr?.file||rr?.src||'';row.player=clean(player);if(!player){row.error='no_player';rows.push(row);continue}const pg=await req(player,watch.url);const fid=(pg.body.match(/<title[^>]*>\s*File\s+(\d+)\s*-\s*MegaPlay/i)||[])[1];row.fileId=Boolean(fid);if(!fid){row.error='no_file_id';rows.push(row);continue}const gs=await req(`https://megaplay.buzz/stream/getSources?id=${encodeURIComponent(fid)}`,player,true);const data=JSON.parse(gs.body);row.sourceKeys=Object.keys(data||{}).sort();row.trackHosts=Array.isArray(data?.tracks)?[...new Set(data.tracks.map(x=>clean(x?.file||'').host).filter(Boolean))]:[];const media=data?.sources?.file||data?.sources?.url||data?.sources?.src||(data?.enc?decrypt(data.enc):'');row.media=clean(media);row.probes=media?await probe(media,player):[];}catch(e){row.error=e.name+':'+String(e.message||'').slice(0,100)}rows.push(row)}
            console.log('ANIKOTO_TERMINAL_MATRIX '+JSON.stringify({series:clean(series),animeId:Boolean(aid),episodeServerIds:Boolean(ids),serverCount:uniq.length,rows}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
