name: TEMP - Residual Terminal Proofs V69

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths: [.github/workflows/temp-residual-terminal-chain-v69.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: UHDMovies second POST and terminal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,http.cookiejar
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def rq(url,ref='',data=None):
              h={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'}
              if ref:h['Referer']=ref
              if data is not None:h['Content-Type']='application/x-www-form-urlencoded'
              try:
                  with op.open(urllib.request.Request(url,data=data,headers=h),timeout=20) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(1000000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(500000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          page='https://uhdmovies.my/download-interstellar-2014-dual-audio-hindi-english-2160p-4k-1080p-x264-10bit-remux-hdr-dovi-hevc-bluray-esubs/'
          st,pf,ct,pb=rq(page);m=re.search(r'href=["\']([^"\']*cloud\.unblockedgames\.world/\?sid=[^"\']+)',html.unescape(pb),re.I);assert m
          h=html.unescape(m.group(1)); st,hf,ct,hb=rq(h,page);fm=re.search(r'<form\b[\s\S]*?</form>',html.unescape(hb),re.I);assert fm
          def post_form(form,base,ref):
              am=re.search(r'action=["\']([^"\']*)',form,re.I);action=urllib.parse.urljoin(base,am.group(1) if am else base);fields=[]
              for im in re.finditer(r'<input\b([^>]*)>',form,re.I):
                  a=im.group(1);nm=re.search(r'name=["\']([^"\']+)',a,re.I);val=re.search(r'value=["\']([^"\']*)',a,re.I)
                  if nm:fields.append((nm.group(1),html.unescape(val.group(1) if val else '')))
              st,f,ct,b=rq(action,ref,urllib.parse.urlencode(fields).encode());print('V69_UHD_POST',st,f,ct,'fields',[x[0] for x in fields],'bytes',len(b));return st,f,ct,b
          st1,f1,c1,b1=post_form(fm.group(0),hf,hf);n1=html.unescape(b1.replace('\\/','/'))
          forms=list(re.finditer(r'<form\b[\s\S]*?</form>',n1,re.I));print('V69_UHD_FORMS2',len(forms))
          for i,x in enumerate(forms[:5]):print('V69_UHD_FORM2',i,re.sub(r'\s+',' ',x.group(0))[:3000])
          if forms:
              st2,f2,c2,b2=post_form(forms[0].group(0),f1,f1);n2=html.unescape(b2.replace('\\/','/'));print('V69_UHD_STAGE2_HEAD',re.sub(r'\s+',' ',n2)[:10000])
              urls=[]
              for pat in [r'(?:href|src|action|data-(?:src|url|link|href|file|stream|player))\s*=\s*["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
                  for mm in re.finditer(pat,n2,re.I):
                      raw=mm.group(1) if mm.lastindex else mm.group(0);u=urllib.parse.urljoin(f2,raw)
                      if u.startswith('http') and u not in urls:urls.append(u)
              for u in urls[:160]:
                  if any(t in u.lower() for t in ['hubcloud','vcloud','drive','stream','download','file','pixeldrain','gofile','cloud','workers','video','m3u8','mp4','link']):print('V69_UHD_URL',u[:900])
          PY

      - name: AnimeSalt player media protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          def get(url,ref='https://animesalt.cx/episode/jujutsu-kaisen-1x1/'):
              h={'User-Agent':UA,'Accept':'*/*','Referer':ref,'Origin':'https://animesalt.cx'}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(1000000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(500000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          player='https://as-cdn26.top/video/0a09c8844ba8f0936c20bd791130d6b6'
          st,f,ct,b=get(player);print('V69_SALT_PLAYER',st,f,ct,'bytes',len(b));n=html.unescape(b.replace('\\/','/'))
          assets=[]
          for m in re.finditer(r'<script\b[^>]*src=["\']([^"\']+)',n,re.I):
              u=urllib.parse.urljoin(f,m.group(1));
              if u not in assets:assets.append(u)
          for u in assets:
              if 'as-cdn' not in u:continue
              st2,f2,ct2,b2=get(u,f);print('V69_SALT_ASSET',st2,f2,ct2,'bytes',len(b2));nn=html.unescape(b2.replace('\\/','/'))
              for token in ['m3u8','sources','file:','video_url','fetch(','ajax','/api/','stream','playlist']:
                  for mm in list(re.finditer(re.escape(token),nn,re.I))[:12]:print('V69_SALT_CTX',token,re.sub(r'\s+',' ',nn[max(0,mm.start()-800):mm.start()+1800])[:2600])
          # prove embed itself as a current correlated player
          print('V69_SALT_EMBED_PROOF',player,st,ct,'player_markers',bool(re.search(r'jwplayer|video|player',n,re.I)))
          PY

      - name: AllWish exact S1 episode server chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,urllib.request,urllib.parse,json,http.cookiejar
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));base='https://all-wish.me/';ref=base+'watch/jujutsu-kaisen-tv-8ssye/ep-1'
          def get(path):
              url=urllib.parse.urljoin(base,path);h={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','X-Requested-With':'XMLHttpRequest','Referer':ref}
              try:
                  with op.open(urllib.request.Request(url,headers=h),timeout=20) as r:return r.status,r.geturl(),r.headers.get('content-type',''),r.read(1000000).decode('utf-8','replace')
              except Exception as e:
                  b=''
                  try:b=e.read(500000).decode('utf-8','replace')
                  except Exception:pass
                  return getattr(e,'code',0),getattr(e,'url',url),'',b
          st,f,ct,b=get('ajax/episode/list/1103');j=json.loads(b);r=str(j.get('result') or '')
          am=re.search(r'<a\b([^>]*)data-slug=["\']1["\']([^>]*)>',r,re.I);assert am,'ep1 absent';attrs=am.group(1)+' '+am.group(2);idm=re.search(r'data-ids=["\']([^"\']+)',attrs,re.I);assert idm,'data-ids absent';ids=html.unescape(idm.group(1));print('V69_WISH_EP1_IDS_LEN',len(ids))
          st2,f2,ct2,b2=get('ajax/server/list?servers='+urllib.parse.quote(ids,safe=''));print('V69_WISH_SERVER_LIST',st2,f2,ct2,'BODY',re.sub(r'\s+',' ',b2)[:18000]);j2=json.loads(b2);markup=str(j2.get('result') or '')
          links=[]
          for m in re.finditer(r'data-link-id=["\']([^"\']+)',markup,re.I):
              if m.group(1) not in links:links.append(m.group(1))
          print('V69_WISH_LINKS',len(links),links[:12])
          for lid in links[:8]:
              st3,f3,ct3,b3=get('ajax/server?get='+urllib.parse.quote(lid,safe=''));print('V69_WISH_SERVER',st3,f3,ct3,re.sub(r'\s+',' ',b3)[:3000])
              try:
                  jj=json.loads(b3);u=str((jj.get('result') or {}).get('url') or '')
              except Exception:u=''
              if u:
                  h={'User-Agent':UA,'Accept':'*/*','Referer':ref}
                  try:
                      with op.open(urllib.request.Request(u,headers=h),timeout=15) as rr:print('V69_WISH_PLAYER_PROOF',rr.status,rr.geturl(),rr.headers.get('content-type',''))
                  except Exception as e:print('V69_WISH_PLAYER_PROOF',getattr(e,'code',0),getattr(e,'url',u),type(e).__name__)
          PY
