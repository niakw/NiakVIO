name: Temporary optimize adaptive repair scope

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/migrate-adaptive-repair-scope

permissions:
  contents: write

concurrency:
  group: temporary-adaptive-repair-scope-optimization
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Stop opportunistic repair of proven-healthy providers
        run: |
          python scripts/tmp_optimize_adaptive_repair_scope.py
          python -m py_compile scripts/adaptive_runtime/runtime_repair.py tests/adaptive_runtime_repair_test.py
          python tests/adaptive_runtime_repair_test.py

      - name: Full repository regression suite
        run: npm test

      - name: Remove one-shot inputs and refresh integrity hashes
        run: |
          rm -f scripts/tmp_optimize_adaptive_repair_scope.py
          rm -f .github/triggers/migrate-adaptive-repair-scope
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit proven repair-scope optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repair-scope change to commit.'
            exit 0
          fi
          git commit -m 'perf: skip adaptive repair for proven-healthy providers'
          git push origin HEAD:agent/tv-regression-5.20.38
