name: Temporary finalize CI cleanup

on:
  push:
    branches:
      - agent/tv-regression-5.20.38
    paths:
      - .github/triggers/finalize-ci-cleanup

permissions:
  contents: write

concurrency:
  group: temporary-finalize-ci-cleanup
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify cleaned workflow surface
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              'availability.yml',
              'domain-refresh.yml',
              'sync.yml',
              'validate-desktop-runtime-compat.yml',
              'tmp-global-provider-deep-proof.yml',
              'tmp-migrate-sync-deep-ci-profile.yml',
          }
          actual = {p.name for p in Path('.github/workflows').glob('*.yml')}
          if actual != expected:
              raise SystemExit(f'unexpected workflow set: extra={sorted(actual-expected)} missing={sorted(expected-actual)}')
          print('workflow cleanup surface verified:', ', '.join(sorted(actual)))
          PY

      - name: Validate release hash scope
        run: python tests/release_hash_scope_test.py

      - name: Full repository regression suite
        run: npm test

      - name: Regenerate exact release integrity
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit regenerated integrity only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Release integrity already current.'
            exit 0
          fi
          git commit -m 'chore: refresh release integrity after CI cleanup'
          git push origin HEAD:agent/tv-regression-5.20.38
