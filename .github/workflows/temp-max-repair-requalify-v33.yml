name: TEMP - Max Repair Requalify V33
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-requalify-v33.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  requalify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Probe every residual lane after V31 Core fix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/requalify-v33.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const overrides=JSON.parse(fs.readFileSync('provider-overrides.json','utf8'));
          const results={};
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
          function providerFile(pid){const x=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(x.length!==1)throw new Error('manifest_count:'+pid+':'+x.length);return path.resolve(x[0].filename)}
          function fixture(lane,variant=0){
            if(lane==='movie')return {id:'157336',type:'movie',title:'Interstellar',year:'2014'};
            if(lane==='tv')return {id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1};
            if(variant===0)return {id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1};
            return {id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178};
          }
          function metadata(s){return s.type==='movie'?{id:Number(s.id),title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{id:Number(s.id),name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function terminal(url,headers){
            if(!/^https?:\/\//i.test(String(url||'')))return {status:0,ok:false,ctype:'',error:'non_http'};
            const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
            try{const r=await fetch(url,{headers:headers||{},redirect:'follow',signal:c.signal});const ctype=r.headers.get('content-type')||'';const body=await r.text();return {status:r.status,ok:r.ok&&body.length>=20,ctype,bytes:body.length,final:r.url}}
            catch(e){return {status:0,ok:false,ctype:'',error:String(e&&e.message||e)}}finally{clearTimeout(t)}
          }
          async function one(pid,lane,s){
            const key=pid+':'+lane+':'+s.id+':'+(s.episode||0),f=providerFile(pid),ns=s.type==='movie'?'movie':'tv',m=metadata(s);
            try{
              globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m,canonicalMediaType:s.type};
              globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};
              globalThis.__nuvioProviderDeadlineMs=Date.now()+21000;
              delete require.cache[f];const mod=require(f);
              const rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider_timeout')),22000))]);
              const out=Array.isArray(rows)?rows:[],privateProof=out.some(r=>r&&(r.__nuvioCorrelatedPlayerFallbackV1||r.__nuvioCoreMediaProofV1));
              const probes=[];for(const r of out.slice(0,3))probes.push(await terminal(r&&r.url,r&&r.headers));
              const terminalOk=probes.some(x=>x.ok===true);
              const row={pid,lane,fixture:s.title,count:out.length,privateProof,terminalOk,probes,urls:out.slice(0,5).map(r=>String(r&&r.url||'')),titles:out.slice(0,5).map(r=>String(r&&r.title||r&&r.name||''))};
              results[key]=row;console.log('LANE_RESULT',JSON.stringify(row));return row;
            }catch(e){const row={pid,lane,fixture:s.title,count:0,privateProof:false,terminalOk:false,probes:[],urls:[],error:String(e&&e.message||e)};results[key]=row;console.log('LANE_RESULT',JSON.stringify(row));return row}
          }
          async function lane(pid,lane){
            let a=await one(pid,lane,fixture(lane,0));
            if(lane==='anime'&&a.count===0){const b=await one(pid,lane,fixture(lane,1));return {primary:a,secondary:b,best:b.count>a.count?b:a}}
            return {primary:a,best:a};
          }
          async function main(){
            const queue=[];
            for(const [pid,row] of Object.entries(overrides.provider_patches||{})){
              const d=row&&row.repair_disposition||{},missing=Array.isArray(d.missingLanes)?d.missingLanes:[];
              const residual=missing.length||d.completeCapabilityProof===false||d.quarantined===true||d.terminalState;
              if(!residual)continue;
              const lanes=missing.length?missing:(Array.isArray(d.requiredLanes)?d.requiredLanes:[]);
              for(const l of lanes)if(['movie','tv','anime'].includes(String(l)))queue.push([pid,String(l)]);
            }
            console.log('V33_QUEUE',queue.length,JSON.stringify(queue));
            const combined={};let cursor=0;
            async function worker(){while(cursor<queue.length){const i=cursor++, [pid,l]=queue[i];combined[pid+':'+l]=await lane(pid,l)}}
            await Promise.all(Array.from({length:4},()=>worker()));
            fs.writeFileSync('/tmp/requalify-v33.json',JSON.stringify({combined,raw:results},null,2));
            const summary={};for(const [k,v] of Object.entries(combined)){const b=v.best||{};summary[k]={count:b.count||0,terminalOk:!!b.terminalOk,privateProof:!!b.privateProof,fixture:b.fixture,error:b.error||'',statuses:(b.probes||[]).map(x=>x.status)}}
            console.log('V33_SUMMARY',JSON.stringify(summary,null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/requalify-v33.cjs
      - name: Reconcile only strongly proven lanes and record checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:r=json.load(open('/tmp/requalify-v33.json'))
          except Exception:r={'combined':{}}
          combined=r.get('combined') or {}
          p=Path('provider-overrides.json');data=json.loads(p.read_text(encoding='utf-8'));rows=data.get('provider_patches') or {}
          newly=[];output_only=[];zero=[]
          for key,val in combined.items():
              pid,lane=key.split(':',1);best=(val or {}).get('best') or {};count=int(best.get('count') or 0);terminal=best.get('terminalOk') is True;private=best.get('privateProof') is True
              if count>0 and not private and terminal:
                  row=rows.get(pid) or {};d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {'schemaVersion':1,'authority':'provider-repair-disposition-v1'}
                  req=[str(x) for x in d.get('requiredLanes') or []];proven=[str(x) for x in d.get('provenLanes') or []]
                  if lane not in proven:proven.append(lane);newly.append(key)
                  d['provenLanes']=[x for x in req if x in set(proven)];d['currentVerifiedLanes']=list(d['provenLanes']);d['missingLanes']=[x for x in req if x not in set(d['provenLanes'])];d['completeCapabilityProof']=not d['missingLanes'];d['recoveryStatus']='proven' if not d['missingLanes'] else 'repair';d['quarantined']=False;d['terminalState']=None
                  codes=[str(x) for x in d.get('reasonCodes') or [] if str(x)];code='v33_post_core_live_terminal_proven';
                  if code not in codes:codes.append(code)
                  d['reasonCodes']=codes;row['repair_disposition']=d
              elif count>0 and not private:output_only.append(key)
              else:zero.append(key)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          mem=Path('MEMORY.md');t=mem.read_text(encoding='utf-8');mark='<!-- MAX_REPAIR_20260917_V33_RESULT -->'
          if mark not in t:
              section=mark+'\n### V32/V33 full residual requalification after Core V31\n- V32 run `35162658270` found 36 stale/residual provider dispositions; this included known-live MovieBox/VidLove, proving the ledger still contained historical false negatives.\n- V33 re-probed every missing lane on the materialized post-V31 Core with standard movie/TV/anime fixtures; anime zeros receive a second One Piece fixture. A lane is auto-promoted only when output is non-empty, private proof is absent, and at least one returned terminal URL responds successfully.\n- newly terminal-proven lanes: '+(', '.join(newly) if newly else 'none')+'\n- output-positive but terminal not confirmed: '+(', '.join(output_only) if output_only else 'none')+'\n- still zero/no acceptable output: '+(', '.join(zero) if zero else 'none')+'\n\n'
              anchor='## 2026-09-16 — authoritative current checkpoint';t=t.replace(anchor,section+anchor,1) if anchor in t else t.rstrip()+'\n\n'+section;mem.write_text(t,encoding='utf-8')
          print('V33_NEWLY_PROVEN',newly);print('V33_OUTPUT_ONLY',output_only);print('V33_ZERO',zero)
          PY
          python3 scripts/validate_published_overrides.py
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json MEMORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: reconcile post-core residual provider proof'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
      - name: Core non-regression after ledger reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
          python3 tests/global_media_type_resolution_test.py
