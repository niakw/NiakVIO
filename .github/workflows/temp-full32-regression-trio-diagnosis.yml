name: TEMP - full32 regression trio diagnosis

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-full32-regression-trio-diagnosis.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact upstream versus NiakVIO four-case diagnosis
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import json, tempfile, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0, str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v2 as p2

          cases = [
              ('animevostfr','movie',{'slug':'superman-2025','label':'Superman (2025)','tmdbId':'1061474','mediaType':'movie','category':'movie','title':'Superman','year':2025}),
              ('animevostfr','anime',{'slug':'tokyo-ghoul-2014-s01e01','label':'Tokyo Ghoul S01E01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
              ('kurage','anime',{'slug':'high-school-of-the-dead-2010-s01e01','label':'High School of the Dead S01E01','tmdbId':'56998','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'High School of the Dead','year':2010}),
              ('voiranime','anime',{'slug':'tokyo-ghoul-2014-s01e01','label':'Tokyo Ghoul S01E01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}),
          ]
          local = p.local_catalog()
          upstreams, errors = p2.upstream_catalog()
          assert not errors, errors
          report=[]
          def compact(x):
              streams=[]
              for s in (x.get('streams') or [])[:6]:
                  u=str(s.get('url') or '')
                  try:
                      q=urlsplit(u); safe=f'{q.scheme}://{q.netloc}{q.path[:120]}'
                  except Exception: safe=u[:180]
                  streams.append({'name':s.get('name'),'quality':s.get('quality'),'url':safe})
              return {
                  'ok':x.get('ok'),'stream_count':x.get('stream_count'),'raw_stream_count':x.get('raw_stream_count'),
                  'timeout':x.get('timeout'),'error_class':x.get('error_class'),
                  'server_hosts':x.get('provider_server_hosts'),'http_statuses':x.get('provider_server_http_statuses') or x.get('http_statuses'),
                  'network_observations':(x.get('network_observations') or [])[:20], 'streams':streams,
              }
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              cached={}
              for pid,lane,fixture in cases:
                  up=upstreams[pid]
                  if pid not in cached:
                      b=p.get_bytes(up['url']); q=td/f'{pid}.js'; q.write_bytes(b); cached[pid]=q
                  uf=dict(fixture)
                  if lane=='anime':
                      uf['mediaType']='tv'; uf['type']='tv'; uf.pop('category',None)
                  lf=dict(fixture)
                  u=p.run_worker(cached[pid],uf,35)
                  n=p.run_worker(local[pid]['path'],lf,35)
                  row={'provider':pid,'lane':lane,'fixture':fixture['slug'],'upstreamSource':up['source'],'upstream':compact(u),'niakvio':compact(n)}
                  report.append(row)
                  print('TRIO_EXACT_DIAG '+json.dumps(row,ensure_ascii=False))
          Path('automation/full32-regression-trio-exact-diag.json').write_text(json.dumps({'cases':report},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Extract current DATA authority and fresh route recovery without applying it
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recover_provider_routes_from_upstreams.py \
            --workers 3 --timeout 55 --attempts 2 \
            --out automation/full32-regression-trio-recovery.json \
            --provider animevostfr --provider kurage --provider voiranime
          python3 - <<'PY'
          import json
          from pathlib import Path
          ov=json.loads(Path('provider-overrides.json').read_text())
          k=json.loads(Path('automation/provider-v3-static-knowledge.json').read_text())
          recovery=json.loads(Path('automation/full32-regression-trio-recovery.json').read_text())
          for pid in ('animevostfr','kurage','voiranime'):
              p=(ov.get('provider_patches') or {}).get(pid) or {}
              c=(ov.get('provider_capabilities') or {}).get(pid) or {}
              m=((k.get('providers') or {}).get(pid) or {}).get('model') or {}
              safe={
                'provider':pid,
                'patch':{x:p.get(x) for x in ('official_site','official_api','capability','identity_input','recipeKind','api_recipe','learned_routes','candidate_learned_routes','provider_lego_scripts') if x in p},
                'capability':{x:c.get(x) for x in ('strategy','validation','requires_direct_media','observed_origins') if x in c},
                'model':{x:m.get(x) for x in ('knownSite','officialSite','officialApi','strategy','identityInput','routes') if x in m},
              }
              print('TRIO_CURRENT_AUTHORITY '+json.dumps(safe,ensure_ascii=False))
          print('TRIO_RECOVERY '+json.dumps(recovery,ensure_ascii=False)[:30000])
          PY

      - name: Isolated legacy VoirAnime structured-runtime experiment
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          python3 scripts/install_voiranime_coflix_runtime_v1.py
          python3 scripts/materialize_provider_v3_one.py voiranime
          python3 - <<'PY'
          import json,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          m=json.loads(Path('manifest.json').read_text())
          row=next(x for x in m['scrapers'] if str(x.get('id','')).lower()=='voiranime')
          fixture={'label':'Tokyo Ghoul S01E01','tmdbId':'61374','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Tokyo Ghoul','year':2014}
          r=p.run_worker(Path(row['filename']),fixture,35)
          print('VOIRANIME_LEGACY_AUTHORITY_EXPERIMENT '+json.dumps({k:r.get(k) for k in ('ok','stream_count','raw_stream_count','timeout','error_class','provider_server_hosts','provider_server_http_statuses','http_statuses','network_observations')},ensure_ascii=False))
          Path('automation/full32-voiranime-legacy-authority-experiment.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git reset --hard HEAD
          git clean -fd

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full32-regression-trio-diagnosis-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/full32-regression-trio-exact-diag.json
            automation/full32-regression-trio-recovery.json
            automation/full32-voiranime-legacy-authority-experiment.json
