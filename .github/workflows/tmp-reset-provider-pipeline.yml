name: One-shot reset provider pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-reset-provider-pipeline.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: nuvio-provider-publish-main
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one fixed Quick provider run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=quick
