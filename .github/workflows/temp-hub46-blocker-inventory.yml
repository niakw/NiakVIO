name: TEMP - Hub46 Blocker Inventory

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-hub46-blocker-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build and validate inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_hub46_blocker_inventory.py
          python scripts/build_hub46_blocker_inventory.py
          python - <<'PY'
          import json
          data=json.load(open('automation/evidence/hub46-blocker-inventory-20260911.json',encoding='utf-8'))
          assert data['providerCount']==46
          assert data['enabledTargetCount']==46
          assert len(data['rows'])==46
          ids=[r['provider'] for r in data['rows']]
          assert len(ids)==len(set(ids))==46
          print('HUB46_INVENTORY_SCHEMA_OK opaque='+str(data['repoOpaqueCount']))
          PY
      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-hub46-blocker-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(evidence): classify hub46 mechanisms and blockers'
          git push origin HEAD:workbench/hub-matrix-46-20260911
