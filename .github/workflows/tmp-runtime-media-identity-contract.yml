name: TMP - Runtime Media Identity Contract

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/tmp-runtime-media-identity-contract.yml'
      - 'scripts/upgrade_runtime_media_identity_contract_v1.py'
      - 'scripts/render_platform_runtime_contracts.py'
      - 'scripts/runtime_contract_gate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-media-identity-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize identity contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_runtime_media_identity_contract_v1.py
          FIRST="$(sha256sum automation/platform-runtime-contracts.json automation/nuvio-client-compatibility-matrix.json | sha256sum | awk '{print $1}')"
          python3 scripts/upgrade_runtime_media_identity_contract_v1.py
          SECOND="$(sha256sum automation/platform-runtime-contracts.json automation/nuvio-client-compatibility-matrix.json | sha256sum | awk '{print $1}')"
          test "$FIRST" = "$SECOND"
          python3 scripts/render_platform_runtime_contracts.py
          python3 scripts/render_platform_runtime_contracts.py --check
          python3 scripts/runtime_contract_gate.py
          echo "FIELD_RUNTIME_MEDIA_IDENTITY_CONTRACT idempotent=true gate=true context=tmdbMetadata.external_ids.imdb_id cache=__nuvioTmdbMetadataCacheV1"

      - name: Assert contract semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('automation/platform-runtime-contracts.json',encoding='utf-8'))
          m=json.load(open('automation/nuvio-client-compatibility-matrix.json',encoding='utf-8'))
          i=p['media_identity_contract']
          assert i['positional_tmdb_id_is_complete_identity'] is False
          assert i['canonical_context_imdb_path']=='__nuvioMediaContext.tmdbMetadata.external_ids.imdb_id'
          assert i['canonical_metadata_cache_global']=='__nuvioTmdbMetadataCacheV1'
          assert i['user_tmdb_credential_required'] is False
          assert i['secret_projection_to_provider_javascript'] is False
          assert p['clients']['android-tv']['capabilities']['media_identity_hydration']['state']=='bridge'
          for k in ('android','ios','macos','windows'):
              assert p['clients'][k]['capabilities']['media_identity_hydration']['state']=='absent'
          for k,c in m['clients'].items():
              pc=c['provider_contract']
              assert pc['positional_id_is_complete_identity'] is False
              assert pc['canonical_identity_cache']=='__nuvioTmdbMetadataCacheV1'
              assert pc['user_tmdb_credential_required'] is False
              assert pc['tmdb_secret_projection_required'] is False
          print('runtime media identity semantic assertions passed')
          PY

      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            automation/platform-runtime-contracts.json \
            automation/nuvio-client-compatibility-matrix.json \
            automation/PLATFORM-RUNTIME-CONTRACTS.md
          if git diff --cached --quiet; then
            echo 'runtime media identity contract already materialized'
            exit 0
          fi
          git commit -m 'arch(runtime): materialize TMDB IMDb identity contract'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
