name: TEMP - Fix current StreamZo

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-fix-streamzo-current.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace
  NIAKVIO_PROVIDER_V3_FINAL_MINIMIZE: '0'

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[streamzo-current]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Bind and materialize current StreamZo runtime
        run: |
          python scripts/upgrade_streamzo_runtime_v1.py
          python scripts/materialize_provider_v3_one.py streamzo
          python scripts/audit_provider_v3_static.py
      - name: Exact regression fixtures must become playable
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          fixtures=[
            {'tmdbId':'100088','mediaType':'tv','title':'The Last of Us','year':2023,'season':1,'episode':1},
            {'tmdbId':'240411','mediaType':'anime','category':'anime','title':'Dan Da Dan','year':2024,'season':1,'episode':1},
          ]
          cat=p.local_catalog();out=[]
          for f in fixtures:
              r=p.run_worker(cat['streamzo']['path'],f,65)
              row={'fixture':f['title'],'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('http_statuses') or [],'error':r.get('error_class'),'timeout':bool(r.get('timeout'))}
              out.append(row);print('STREAMZO_EXACT '+json.dumps(row,sort_keys=True))
          Path('automation/streamzo-current-exact-proof.json').write_text(json.dumps(out,indent=2)+'\n')
          if any(x['streams']<=0 for x in out): raise SystemExit('StreamZo exact regression fixture still zero')
          PY
      - name: Full32 no-regression proof
        run: |
          python scripts/run_provider_upstream_parity_v3.py --scope-matrix automation/evidence/hub-lab-matrix-46.json --provider streamzo --samples-per-lane 32 --workers 3 --timeout 25 --seed 20260914-streamzo-current --out automation/streamzo-current-full32.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/streamzo-current-full32.json').read_text())
          print('STREAMZO_FULL32',json.dumps(d.get('statusCounts') or {},sort_keys=True),json.dumps(d.get('certainRegressions') or []))
          if d.get('certainRegressions'): raise SystemExit('StreamZo still has certain regression')
          PY
      - name: Promote current proof and reconfirm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('provider-overrides.json');d=json.loads(p.read_text());r=d['provider_patches']['streamzo'];r['route_data_state']='on'
          disp=r.get('repair_disposition') if isinstance(r.get('repair_disposition'),dict) else {};r['repair_disposition']=disp
          disp.update({'routeDataState':'on','requiredLanes':['movie','tv','anime'],'currentVerifiedLanes':['movie','tv','anime'],'provenLanes':['movie','tv','anime'],'missingLanes':[],'completeCapabilityProof':True,'recoveryStatus':'current-suggest-runtime-full32','terminalState':None,'quarantined':False,'reasonCodes':['current_suggest_exact_href','exact_tv_positive','exact_anime_positive','full32_no_certain_regression']})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/materialize_provider_v3_one.py streamzo
          python scripts/audit_provider_v3_static.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts');import run_provider_upstream_parity as p
          f={'tmdbId':'100088','mediaType':'tv','title':'The Last of Us','year':2023,'season':1,'episode':1}
          r=p.run_worker(p.local_catalog()['streamzo']['path'],f,65);print('STREAMZO_RECONFIRM streams='+str(r.get('stream_count'))+' statuses='+str(r.get('http_statuses')))
          if int(r.get('stream_count') or 0)<=0: raise SystemExit('StreamZo positive lost after promotion')
          PY
      - name: Commit proven repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json manifest.json providers provider-v3-materialization.json automation/streamzo-current-exact-proof.json automation/streamzo-current-full32.json
          git commit -m '[streamzo-current] repair exact suggest route and direct HLS'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
