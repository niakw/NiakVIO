name: Workbench Authoritative Repair V1
# Trigger revision: causal-external-identity-and-accounted-repair-debt-v2.

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/workbench-authoritative-repair-v1.yml'

permissions:
  contents: write

concurrency:
  group: workbench-authoritative-repair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair-proof-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      NIAKVIO_QUICK_YIELD_WORKERS: '16'
      NIAKVIO_QUICK_YIELD_TIMEOUT: '45'
    steps:
      - name: Checkout exact authoritative candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture candidate base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Static ownership preflight
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}" || { echo 'TMDB credentials required' >&2; exit 1; }
          python tests/workflow_security_policy_test.py
          python tests/provider_v3_workflow_ownership_test.py
          python tests/provider_non_regression_contract_test.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_quick_yield_fixture_selection_test.py
          python tests/provider_mixed_yield_acceptance_test.py
          python tests/global_media_type_pre_network_gate_test.py
      - name: Run canonical Repair V6 over complete repair-eligible portfolio
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_provider_repair_pipeline_v6.py \
            --mode repair \
            --workers 12 \
            --timeout 55 \
            --attempts 3 | tee automation/workbench-authoritative-repair-v1.log
      - name: Enforce four-version and rolling candidate floor
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/build_provider_history_matrix_v3.py
          python scripts/check_provider_non_regression_v1.py
          test -s provider-v3-quick-yield.json
          test -s automation/provider-repair-disposition.json
          python scripts/check_provider_non_regression_v1.py --candidate-gate --all --base-ref "$BASE_SHA"
          python tests/provider_521_capability_regression_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_quick_yield_fixture_selection_test.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_media_type_resolution_test.py
          python tests/episodic_year_identity_regression_test.py
          python tests/global_playback_integrity_policy_test.py
          python scripts/audit_provider_v3_static.py
      - name: Refuse control-plane mutation
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          forbidden=[x for x in changed if x.startswith('.github/workflows/') or x.startswith('.github/triggers/') or x.startswith('tests/')]
          if forbidden:
              raise SystemExit('repair mutated control-plane paths: '+','.join(forbidden))
          print(f'AUTHORITATIVE_REPAIR_DIFF changed={len(changed)} forbidden=0')
          PY
      - name: Commit accepted candidate to workbench
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'AUTHORITATIVE_REPAIR_COMMIT changed=false'
            exit 0
          fi
          if git diff --cached --name-only | grep -E '^\.github/(workflows|triggers)/|^tests/' ; then
            echo 'Refusing control-plane/test mutation in candidate commit.' >&2
            exit 1
          fi
          git commit -m 'fix(provider): authoritative systemic repair candidate'
          git push origin HEAD:workbench/systemic-recovery-20260909
      - name: Upload authoritative evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-authoritative-repair-${{ github.run_id }}
          path: |
            automation/workbench-authoritative-repair-v1.log
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-route-recovery-v6.json
            automation/provider-repair-disposition.json
            automation/provider-repair-portfolio-baseline.json
            automation/provider-repair-portfolio-candidate.json
            automation/provider-repair-portfolio-retry.json
            automation/provider-repair-portfolio-losses.json
            automation/provider-history-matrix.json
            automation/provider-non-regression-gate.json
            provider-v3-quick-yield.json
            provider-overrides.json
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            providers/
            provider-bases/
          retention-days: 14
          if-no-files-found: warn
