name: TEMP - Apply Max Repair Live V42
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-apply-max-repair-live-v42.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-prove-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Rebuild V42 materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_max_repair_live_contracts_v6.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
      - name: Probe repaired lanes and identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v42.cjs <<'NODE'
          const fs=require('fs'),path=require('path'),{spawn}=require('child_process');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const specs={sekai:{pid:'sekai',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1},streamzo:{pid:'streamzo',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:3},anikoto:{pid:'anikototv',id:'95479',type:'anime',title:'Jujutsu Kaisen',year:'2020',season:1,episode:1}};
          function file(pid){const a=(manifest.scrapers||[]).filter(x=>String(x&&x.id||'').toLowerCase()===pid);if(a.length!==1)throw new Error('manifest:'+pid+':'+a.length);return path.resolve(a[0].filename)}
          function md(s){return {id:Number(s.id),name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function check(row){const u=String(row&&row.url||'');if(!/^https?:\/\//i.test(u))return{ok:false,kind:'bad-url'};const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const h=Object.assign({},row&&row.headers||{});if(/\.m3u8(?:[?#]|$)/i.test(u)){const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),body=await r.text();return{ok:r.ok&&body.includes('#EXTM3U'),kind:'hls',status:r.status,ctype:r.headers.get('content-type')||'',bytes:body.length,final:r.url}}
              if(row&&row.isDirect===false){const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),body=await r.text(),ct=r.headers.get('content-type')||'';return{ok:r.ok&&/html/i.test(ct)&&body.length>200,kind:'embed',status:r.status,ctype:ct,bytes:body.length,final:r.url}}
              h.Range='bytes=0-1023';const r=await fetch(u,{headers:h,redirect:'follow',signal:c.signal}),b=Buffer.from(await r.arrayBuffer()),ct=r.headers.get('content-type')||'';return{ok:(r.status===200||r.status===206)&&b.length>0&&(/video|octet-stream|matroska/i.test(ct)||/\.(mp4|mkv|webm)(?:[?#]|$)/i.test(u)),kind:'binary',status:r.status,ctype:ct,bytes:b.length,final:r.url}}
            catch(e){return{ok:false,kind:'error',error:String(e&&e.message||e)}}finally{clearTimeout(t)}}
          async function child(label){const s=specs[label],f=file(s.pid),m=md(s);globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:'tv',tmdbMetadata:m,canonicalMediaType:s.type,season:s.season,episode:s.episode};globalThis.__nuvioTmdbMetadataCacheV1={[`tv:${s.id}`]:m};globalThis.__nuvioProviderDeadlineMs=Date.now()+26000;let rows=[],error='';try{const mod=require(f);rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider_timeout')),27000))])}catch(e){error=String(e&&e.message||e)}rows=Array.isArray(rows)?rows:[];const proofs=[];for(const r of rows.slice(0,3))proofs.push(await check(r));console.log('CHILD\t'+JSON.stringify({label,pid:s.pid,count:rows.length,rows:rows.slice(0,3).map(r=>({url:String(r&&r.url||''),title:String(r&&r.title||r&&r.name||''),isDirect:r&&r.isDirect,quality:r&&r.quality,language:r&&r.language})),terminalOk:proofs.some(p=>p.ok&&(p.kind==='hls'||p.kind==='binary')),embedOk:proofs.some(p=>p.ok&&p.kind==='embed'),proofs,error}))}
          function run(label){return new Promise(resolve=>{const p=spawn(process.execPath,[__filename,'--child',label],{stdio:['ignore','pipe','pipe']});let o='',e='';p.stdout.on('data',d=>o+=d);p.stderr.on('data',d=>e+=d);const timer=setTimeout(()=>p.kill('SIGKILL'),35000);p.on('close',(code,signal)=>{clearTimeout(timer);const l=o.split(/\r?\n/).find(x=>x.startsWith('CHILD\t'));let r=null;try{r=l?JSON.parse(l.slice(6)):null}catch{}if(!r)r={label,pid:specs[label].pid,count:0,terminalOk:false,embedOk:false,proofs:[],error:`child code=${code} signal=${signal} ${e.slice(-800)}`};console.log('V42_PROBE',JSON.stringify(r));resolve(r)})})}
          async function id(type,id,title){try{const r=await fetch(`https://enc-dec.app/db/flix/find?tmdb_id=${id}&type=${type}`,{headers:{'User-Agent':'Mozilla/5.0 Chrome/145 Safari/537.36','Accept':'application/json'}}),j=await r.json(),x=Array.isArray(j)?j[0]:j,info=x&&x.info||{};return{ok:r.ok&&String(info.tmdb_id)===id&&String(info.type).toLowerCase()===type&&String(info.title_en||'').toLowerCase()===title.toLowerCase(),status:r.status,title:info.title_en,type:info.type}}catch(e){return{ok:false,status:0,error:String(e)}}}
          async function parent(){const r={};for(const k of Object.keys(specs))r[k]=await run(k);r.yflixMovie=await id('movie','157336','Interstellar');r.yflixTv=await id('tv','1396','Breaking Bad');fs.writeFileSync('/tmp/v42.json',JSON.stringify(r,null,2));console.log('V42_SUMMARY',JSON.stringify(r,null,2))}
          if(process.argv[2]==='--child')child(process.argv[3]).then(()=>process.exit(0));else parent().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/v42.cjs
      - name: Reconcile verified V42 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/v42.json')); p=Path('provider-overrides.json'); data=json.loads(p.read_text()); rows=data.get('provider_patches') or {}
          def reason(d,c):
              a=[str(x) for x in d.get('reasonCodes') or [] if str(x)]
              if c not in a:a.append(c)
              d['reasonCodes']=a
          def terminal(pid,key,lane='anime'):
              z=r.get(key) or {}
              if not (z.get('terminalOk') and int(z.get('count') or 0)>0): return
              row=rows[pid]; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {'schemaVersion':1,'authority':'provider-repair-disposition-v1'}; req=[str(x) for x in d.get('requiredLanes') or []]; proven=set(str(x) for x in d.get('provenLanes') or []);proven.add(lane);ordered=[x for x in req if x in proven];
              if lane not in ordered:ordered.append(lane)
              d['provenLanes']=ordered;d['currentVerifiedLanes']=list(ordered);d['missingLanes']=[x for x in req if x not in proven];d['completeCapabilityProof']=not d['missingLanes'];d['recoveryStatus']='proven' if not d['missingLanes'] else 'repair';d['quarantined']=False;d['terminalState']=None;ls=d.get('laneStatuses') if isinstance(d.get('laneStatuses'),dict) else {};vals=[str(x) for x in ls.get(lane) or []];
              if 'playable_verified' not in vals:vals.append('playable_verified')
              ls[lane]=vals;d['laneStatuses']=ls;reason(d,'v42_current_terminal_playback_proven');row['repair_disposition']=d
          terminal('sekai','sekai');terminal('streamzo','streamzo')
          z=r.get('anikoto') or {}; row=rows.get('anikototv') or {}; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else None
          if d is not None and z.get('embedOk') and int(z.get('count') or 0)>0:
              ls=d.get('laneStatuses') if isinstance(d.get('laneStatuses'),dict) else {};vals=[str(x) for x in ls.get('anime') or []];
              if 'correlated_player_verified' not in vals:vals.append('correlated_player_verified')
              ls['anime']=vals;d['laneStatuses']=ls;d['recoveryStatus']='repair';d['quarantined']=False;d['terminalState']=None;reason(d,'v42_current_correlated_player_verified');row['repair_disposition']=d
          if (r.get('yflixMovie') or {}).get('ok') and (r.get('yflixTv') or {}).get('ok'):
              row=rows.get('yflix') or {};d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else None
              if d is not None:reason(d,'v42_movie_tv_namespace_identity_proven');row['repair_disposition']=d
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('V42_RECONCILED',r)
          PY
          python3 scripts/validate_published_overrides.py
      - name: Persist all deterministic rebuild outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          echo 'STATUS_BEFORE_STAGE'
          git status --short
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: persist V42 residual provider repairs'
          fi
          echo 'STATUS_AFTER_COMMIT'
          git status --short
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
      - name: V42 proof gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/v42.json')); bad=[]
          for k in ('sekai','streamzo'):
              z=r.get(k) or {}
              if not (z.get('terminalOk') and int(z.get('count') or 0)>0):bad.append((k,z))
          z=r.get('anikoto') or {}
          if not (z.get('embedOk') and int(z.get('count') or 0)>0):bad.append(('anikoto',z))
          for k in ('yflixMovie','yflixTv'):
              if not (r.get(k) or {}).get('ok'):bad.append((k,r.get(k)))
          if bad:raise SystemExit('V42 proof failures: '+repr(bad))
          print('V42_PROOF_GATE_OK')
          PY
