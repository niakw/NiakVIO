name: Purstream hub assets diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purstream-hub-assets-once.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Trace hub scripts and terminal data source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, ssl, urllib.parse, urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          ctx=ssl.create_default_context()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.7','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15,context=ctx) as r:
                  raw=r.read(2_000_000)
                  return r.status,r.geturl(),raw.decode(r.headers.get_content_charset() or 'utf-8','replace')
          status,final,doc=get('https://purstream.wiki/')
          scripts=[]
          for src in re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',doc,re.I):
              url=urllib.parse.urljoin(final,html.unescape(src))
              if url not in scripts: scripts.append(url)
          print('FIELD_PURSTREAM_SCRIPT_LIST',json.dumps(scripts,ensure_ascii=False))
          needles=('hs-url-main','hs-url-host-main','purstream.id','current_url','currentUrl','official_url','officialUrl','fetch(','/api/','.json')
          for url in scripts[:30]:
              try:
                  st,fin,body=get(url)
              except Exception as exc:
                  print('FIELD_PURSTREAM_SCRIPT_ERROR',json.dumps({'url':url,'error':f'{type(exc).__name__}: {exc}'},ensure_ascii=False)); continue
              hits={needle:body.find(needle) for needle in needles if body.find(needle)>=0}
              if hits:
                  print('FIELD_PURSTREAM_SCRIPT_HITS',json.dumps({'url':url,'status':st,'final':fin,'bytes':len(body),'hits':hits},ensure_ascii=False,sort_keys=True))
                  for needle,pos in hits.items():
                      print('FIELD_PURSTREAM_SCRIPT_SNIPPET',json.dumps({'url':url,'needle':needle,'snippet':body[max(0,pos-500):pos+1800]},ensure_ascii=True))
          inline='\n'.join(re.findall(r'<script\b(?![^>]*src=)[^>]*>([\s\S]*?)</script>',doc,re.I))
          ihits={needle:inline.find(needle) for needle in needles if inline.find(needle)>=0}
          print('FIELD_PURSTREAM_INLINE_HITS',json.dumps(ihits,sort_keys=True))
          for needle,pos in ihits.items():
              print('FIELD_PURSTREAM_INLINE_SNIPPET',json.dumps({'needle':needle,'snippet':inline[max(0,pos-500):pos+1800]},ensure_ascii=True))
          PY
      - name: Remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/purstream-hub-assets-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/purstream-hub-assets-once.yml
          git commit -m 'chore: remove Purstream hub assets diagnostic'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
