name: CORE - Domain Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Address discovery depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - deep
  push:
    branches:
      - main
    paths:
      - ".github/triggers/domain-refresh"
      - ".github/workflows/domain-refresh.yml"
      - "scripts/resolve_provider_hubs.py"
      - "scripts/provider_dns_preflight.mjs"
      - "provider-hubs.json"
      - "domain-observation-config.json"
      - "tests/provider_hub_registry_test.py"
      - "tests/dns_preflight.test.mjs"
      - "tests/domain_refresh_workflow_test.py"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: niakvio-core-domain-refresh-main
  cancel-in-progress: true

jobs:
  observe:
    name: Refresh hubs, routes and French ISP DNS
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout current main without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve and apply authoritative provider routes
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          mkdir -p health-output
          cp provider-overrides.json "$RUNNER_TEMP/provider-overrides.before.json"
          cp provider-domain-history.json "$RUNNER_TEMP/provider-domain-history.before.json"
          python scripts/resolve_provider_hubs.py \
            --mode "$MODE" \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --apply \
            --output health-output/provider-hub-report.json

      - name: Diagnose all observed provider domains through French ISPs
        shell: bash
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs \
            --manifest manifest.json \
            --hub-report health-output/provider-hub-report.json \
            --config domain-observation-config.json \
            --all-domains \
            --output health-output/dns-preflight-report.json

      - name: Detect validated route-state changes
        id: route-change
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          before_overrides = json.loads(Path(os.environ["RUNNER_TEMP"], "provider-overrides.before.json").read_text(encoding="utf-8"))
          before_history = json.loads(Path(os.environ["RUNNER_TEMP"], "provider-domain-history.before.json").read_text(encoding="utf-8"))
          after_overrides = json.loads(Path("provider-overrides.json").read_text(encoding="utf-8"))
          after_history = json.loads(Path("provider-domain-history.json").read_text(encoding="utf-8"))

          before_patches = before_overrides.get("provider_patches") or {}
          after_patches = after_overrides.get("provider_patches") or {}
          before_histories = before_history.get("providers") or {}
          after_histories = after_history.get("providers") or {}
          provider_ids = sorted(set(before_patches) | set(after_patches) | set(before_histories) | set(after_histories))
          changed = [
              provider_id
              for provider_id in provider_ids
              if before_patches.get(provider_id) != after_patches.get(provider_id)
              or before_histories.get(provider_id) != after_histories.get(provider_id)
          ]

          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(f"changed={'true' if changed else 'false'}\n")
                  handle.write("providers=" + ",".join(changed) + "\n")

          Path("health-output/domain-route-changes.json").write_text(
              json.dumps({"changed": changed}, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"changed": changed}, ensure_ascii=False))
          PY

      - name: Validate route mutation scope and contracts
        shell: bash
        run: |
          git diff --exit-code -- \
            manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            provider_catalog.json provider-hubs.json providers/ provider-bases/
          test -s health-output/provider-hub-report.json
          test -s health-output/dns-preflight-report.json
          python tests/provider_hub_registry_test.py
          node tests/dns_preflight.test.mjs
          python tests/domain_refresh_workflow_test.py

      - name: Publish validated route state
        if: steps.route-change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Validated provider route changes: ${{ steps.route-change.outputs.providers }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-overrides.json provider-domain-history.json
          git diff --cached --quiet && exit 0
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "FIELD_DOMAIN_PUBLICATION_SKIPPED reason=main_advanced validated=$BASE_SHA current=$CURRENT_SHA"
            gh workflow run domain-refresh.yml --ref main -f mode=quick
            exit 0
          fi
          git commit -m "chore(domains): publish validated provider routes"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main

      - name: Summarize domain and DNS observation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          hubs = json.loads(Path("health-output/provider-hub-report.json").read_text(encoding="utf-8"))
          dns = json.loads(Path("health-output/dns-preflight-report.json").read_text(encoding="utf-8"))

          providers = hubs.get("providers") or {}
          moved = [
              (pid, row.get("official_site"), row.get("status"))
              for pid, row in providers.items()
              if isinstance(row, dict) and row.get("status") in {"site_validated", "pending_confirmation"}
          ]
          counts = dns.get("counts") or {}
          blocked = [
              row for row in dns.get("providers") or []
              if isinstance(row, dict) and row.get("dns_status") == "DNS BLOCK"
          ]
          limited = [
              row for row in dns.get("providers") or []
              if isinstance(row, dict) and row.get("dns_status") == "DNS API LIMIT REACH"
          ]

          summary = [
              "## CORE provider domain refresh",
              "",
              f"- Hub/domain registry providers observed: **{len(providers)}**",
              f"- Published providers included in DNS sweep: **{dns.get('candidate_count', 0)}**",
              f"- DNS OK: **{counts.get('DNS OK', 0)}**",
              f"- DNS BLOCK: **{counts.get('DNS BLOCK', 0)}**",
              f"- DNS API LIMIT REACH: **{counts.get('DNS API LIMIT REACH', 0)}**",
              f"- DNS blocks: **{', '.join(str(row.get('canonical_id')) for row in blocked) or '-'}**",
              f"- API-limited providers: **{', '.join(str(row.get('canonical_id')) for row in limited) or '-'}**",
              "",
              "DNS is diagnostic-only and never blocks route publication, Health/Repair or provider activation.",
          ]
          text = "\n".join(summary) + "\n"
          print(text)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              Path(path).write_text(text, encoding="utf-8")
          PY

      - name: Upload domain observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-domain-refresh-${{ github.run_id }}
          path: |
            health-output/provider-hub-report.json
            health-output/dns-preflight-report.json
            health-output/domain-route-changes.json
          retention-days: 7
          if-no-files-found: error
