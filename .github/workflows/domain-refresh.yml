name: LEARN - Domain Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Address discovery depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - deep
  push:
    branches:
      - main
    paths:
      - ".github/triggers/domain-refresh"
      - ".github/workflows/domain-refresh.yml"
      - "scripts/resolve_provider_hubs.py"
      - "scripts/provider_dns_preflight.mjs"
      - "provider-hubs.json"
      - "domain-observation-config.json"
      - "tests/provider_hub_registry_test.py"
      - "tests/dns_preflight.test.mjs"
      - "tests/domain_refresh_workflow_test.py"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: nuvio-provider-domain-observation
  cancel-in-progress: true

jobs:
  observe:
    name: Observe hubs, domains and French ISP DNS
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout published main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Observe official hubs and domain candidates without publishing
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          mkdir -p health-output
          python scripts/resolve_provider_hubs.py \
            --mode "$MODE" \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --output health-output/provider-hub-report.json

      - name: Diagnose all observed provider domains through French ISPs
        shell: bash
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs \
            --manifest manifest.json \
            --hub-report health-output/provider-hub-report.json \
            --config domain-observation-config.json \
            --all-domains \
            --output health-output/dns-preflight-report.json

      - name: Detect authoritative route changes
        id: route-change
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("health-output/provider-hub-report.json").read_text(encoding="utf-8"))
          overrides = json.loads(Path("provider-overrides.json").read_text(encoding="utf-8"))
          history = json.loads(Path("provider-domain-history.json").read_text(encoding="utf-8"))

          patches = overrides.get("provider_patches") or {}
          histories = history.get("providers") or {}
          changed = []

          def norm(value):
              return str(value or "").strip().rstrip("/")

          for provider_id, row in (report.get("providers") or {}).items():
              if not isinstance(row, dict) or row.get("status") not in {"validated", "site_validated"}:
                  continue
              observed = norm(row.get("official_site"))
              if not observed:
                  continue
              patch = patches.get(provider_id) if isinstance(patches.get(provider_id), dict) else {}
              hist = histories.get(provider_id) if isinstance(histories.get(provider_id), dict) else {}
              current = norm(patch.get("official_site") or ((hist.get("current") or {}).get("url")))
              if observed != current:
                  changed.append({"provider": provider_id, "from": current, "to": observed})

          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(f"changed={'true' if changed else 'false'}\n")
                  handle.write("providers=" + ",".join(item["provider"] for item in changed) + "\n")

          Path("health-output/domain-route-changes.json").write_text(
              json.dumps({"changed": changed}, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"changed": changed}, ensure_ascii=False))
          PY

      - name: Trigger canonical CORE quick refresh when route changed
        if: steps.route-change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Authoritative route changes: ${{ steps.route-change.outputs.providers }}"
          gh workflow run sync.yml \
            --ref main \
            -f mode=quick \
            -f phase=full

      - name: Summarize domain and DNS observation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          hubs = json.loads(Path("health-output/provider-hub-report.json").read_text(encoding="utf-8"))
          dns = json.loads(Path("health-output/dns-preflight-report.json").read_text(encoding="utf-8"))

          providers = hubs.get("providers") or {}
          moved = [
              (pid, row.get("official_site"), row.get("status"))
              for pid, row in providers.items()
              if isinstance(row, dict) and row.get("status") in {"site_validated", "pending_confirmation"}
          ]
          counts = dns.get("counts") or {}
          blocked = [
              row for row in dns.get("providers") or []
              if isinstance(row, dict) and row.get("dns_status") == "DNS BLOCK"
          ]
          limited = [
              row for row in dns.get("providers") or []
              if isinstance(row, dict) and row.get("dns_status") == "DNS API LIMIT REACH"
          ]

          summary = [
              "## Daily provider domain observation",
              "",
              f"- Hub/domain registry providers observed: **{len(providers)}**",
              f"- Published providers included in DNS sweep: **{dns.get('candidate_count', 0)}**",
              f"- DNS OK: **{counts.get('DNS OK', 0)}**",
              f"- DNS BLOCK: **{counts.get('DNS BLOCK', 0)}**",
              f"- DNS API LIMIT REACH: **{counts.get('DNS API LIMIT REACH', 0)}**",
              f"- DNS blocks: **{', '.join(str(row.get('canonical_id')) for row in blocked) or '-'}**",
              f"- API-limited providers: **{', '.join(str(row.get('canonical_id')) for row in limited) or '-'}**",
              "",
              "DNS is diagnostic-only and never blocks Health/Repair or publication.",
          ]
          text = "\n".join(summary) + "\n"
          print(text)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              Path(path).write_text(text, encoding="utf-8")
          PY

      - name: Validate observation did not mutate publication state
        shell: bash
        run: |
          git diff --exit-code -- \
            manifest.json vf/manifest.json provider_catalog.json providers/ \
            provider-overrides.json provider-domain-history.json
          test -s health-output/provider-hub-report.json
          test -s health-output/dns-preflight-report.json
          python tests/provider_hub_registry_test.py
          node tests/dns_preflight.test.mjs
          python tests/domain_refresh_workflow_test.py

      - name: Upload domain observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-domain-observation-${{ github.run_id }}
          path: |
            health-output/provider-hub-report.json
            health-output/dns-preflight-report.json
            health-output/domain-route-changes.json
          retention-days: 7
          if-no-files-found: error
