name: ROUTE - Provider Domain/Hub Verify

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Address discovery depth
        required: true
        default: quick
        type: choice
        options: [quick, deep]
  push:
    branches: [main]
    paths:
      - '.github/triggers/domain-refresh'
      - '.github/workflows/domain-refresh.yml'
      - 'scripts/resolve_provider_hubs.py'
      - 'scripts/provider_dns_preflight.mjs'
      - 'provider-hubs.json'
      - 'domain-observation-config.json'
      - 'tests/provider_hub_registry_test.py'
      - 'tests/dns_preflight.test.mjs'
      - 'tests/domain_refresh_workflow_test.py'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: provider-domain-hub-observation
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve authoritative routes without applying them
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          mkdir -p health-output
          python scripts/resolve_provider_hubs.py             --mode "$MODE"             --include-disabled             --workers 8             --timeout 8             --output health-output/provider-hub-report.json
      - name: Observe provider domains through DNS
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs             --manifest manifest.json             --hub-report health-output/provider-hub-report.json             --config domain-observation-config.json             --all-domains             --output health-output/dns-preflight-report.json
      - name: Validate read-only route contracts
        run: |
          set -euo pipefail
          test -s health-output/provider-hub-report.json
          test -s health-output/dns-preflight-report.json
          python tests/provider_hub_registry_test.py
          node tests/dns_preflight.test.mjs
          python tests/domain_refresh_workflow_test.py
          git diff --exit-code -- provider-overrides.json provider-domain-history.json providers provider-bases manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-domain-observation-${{ github.run_id }}
          path: |
            health-output/provider-hub-report.json
            health-output/dns-preflight-report.json
          retention-days: 8
          if-no-files-found: error
