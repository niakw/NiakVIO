name: Observe official provider domains

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Address discovery depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - deep
  push:
    branches:
      - main
    paths:
      - ".github/triggers/domain-refresh"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: nuvio-provider-domain-observation
  cancel-in-progress: true

jobs:
  observe:
    name: Observe hubs and domain candidates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout published main without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Observe official hubs and domain candidates without publishing
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          mkdir -p health-output
          python scripts/resolve_provider_hubs.py \
            --mode "$MODE" \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --output health-output/provider-hub-report.json

      - name: Validate observation did not mutate publication state
        shell: bash
        run: |
          git diff --exit-code -- \
            manifest.json vf/manifest.json provider_catalog.json providers/ \
            provider-overrides.json provider-domain-history.json
          test -s health-output/provider-hub-report.json
          python tests/provider_hub_registry_test.py
          python tests/domain_refresh_workflow_test.py

      - name: Upload domain observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-domain-observation-${{ github.run_id }}
          path: health-output/provider-hub-report.json
          retention-days: 7
          if-no-files-found: error
