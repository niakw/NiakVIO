name: CORE - Domain Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Hub address discovery depth
        required: true
        default: quick
        type: choice
        options: [quick, deep]
  push:
    branches: [main]
    paths:
      - '.github/triggers/domain-refresh'
      - '.github/workflows/domain-refresh.yml'
      - 'scripts/domain_refresh_transaction_v2.py'
      - 'scripts/validate_domain_refresh_transaction.py'
      - 'scripts/refresh_authoritative_hub_domains.py'
      - 'scripts/resolve_provider_hubs.py'
      - 'scripts/provider_base_store.py'
      - 'scripts/sync_release_versions.py'
      - 'scripts/audit_provider_v3_static.py'
      - 'tests/domain_refresh_transaction_guard_test.py'
      - 'tests/priority_tv_year_domain_refresh_test.py'
      - 'provider-hubs.json'
      - 'domain-observation-config.json'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: niakvio-core-domain-refresh-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Snapshot currently published release
        run: |
          cp manifest.json "$RUNNER_TEMP/published-manifest-baseline.json"
          cp provider-overrides.json "$RUNNER_TEMP/provider-overrides.before.json"
          cp provider-hubs.json "$RUNNER_TEMP/provider-hubs.before.json"
          cp provider-domain-history.json "$RUNNER_TEMP/provider-domain-history.before.json"

      - name: Resolve and publish authoritative hub terminal DATA
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          mkdir -p health-output
          python scripts/domain_refresh_transaction_v2.py \
            --mode "$MODE" --include-disabled --workers 8 --timeout 8 \
            --apply \
            --output health-output/provider-hub-report.json \
            --changes-output health-output/domain-site-changes.json

      - name: Fail closed on rollback, stale fallback or template terminal
        run: |
          set -euo pipefail
          python tests/domain_refresh_transaction_guard_test.py
          python scripts/validate_domain_refresh_transaction.py \
            --before-overrides "$RUNNER_TEMP/provider-overrides.before.json" \
            --before-hubs "$RUNNER_TEMP/provider-hubs.before.json" \
            --before-history "$RUNNER_TEMP/provider-domain-history.before.json" \
            --report health-output/provider-hub-report.json \
            --changes health-output/domain-site-changes.json

      - name: Observe updated domains through DNS and HTTP
        continue-on-error: true
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          node scripts/provider_dns_preflight.mjs \
            --manifest manifest.json \
            --hub-report health-output/provider-hub-report.json \
            --config domain-observation-config.json \
            --all-domains \
            --output health-output/dns-preflight-report.json

      - name: Validate domain-only Provider v3 mutation
        run: |
          set -euo pipefail
          python tests/authoritative_hub_domain_refresh_test.py
          python tests/domain_refresh_workflow_test.py
          python tests/priority_tv_year_domain_refresh_test.py
          python tests/provider_v3_workflow_ownership_test.py
          python scripts/audit_provider_v3_static.py
          git diff --exit-code -- scripts/provider_patches provider-bases provider-type-policy.json

      - name: Reproject manifests and finalize cache-safe version
        env:
          NUVIO_SKIP_CLIENT_UPSTREAM_GUARD: '1'
          NUVIO_SKIP_ACTIVATION_PRESERVATION: '1'
        run: |
          set -euo pipefail
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$RUNNER_TEMP/published-manifest-baseline.json"
          python tests/release_auto_bump_test.py
          python scripts/audit_provider_v3_static.py
          python scripts/prune_unreferenced_providers.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Publish authoritative domain transaction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            provider-overrides.json provider-hubs.json provider-domain-history.json \
            manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            provider-v3-materialization.json providers/ \
            package.json package-lock.json sources.json provider_catalog.json nuvio-client-id-state.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if git diff --cached --quiet; then
            echo 'No authoritative hub domain publication change.'
            echo 'FIELD_DOMAIN_REFRESH_IDEMPOTENT true'
            exit 0
          fi
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "FIELD_DOMAIN_PUBLICATION_SKIPPED reason=main_advanced observed=$BASE_SHA current=$CURRENT_SHA"
            gh workflow run domain-refresh.yml --ref main -f mode=quick
            exit 0
          fi
          git commit -m 'chore(domains): publish authoritative Provider v3 domain transaction'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
          gh workflow run sync.yml --ref main -f mode=quick

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-domain-refresh-${{ github.run_id }}
          path: |
            health-output/provider-hub-report.json
            health-output/dns-preflight-report.json
            health-output/domain-site-changes.json
          retention-days: 8
          if-no-files-found: warn
