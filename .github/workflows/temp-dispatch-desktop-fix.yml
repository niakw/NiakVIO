name: TEMP - Dispatch Desktop Hub-46 fix proof

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - ".github/workflows/temp-dispatch-desktop-fix.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative Desktop Reader on current fix ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run native-desktop-reader-acceptance.yml \
            --repo "${{ github.repository }}" \
            --ref "fix/labs-5.21.44-20260912"
          echo "DESKTOP_FIX_DISPATCHED ref=fix/labs-5.21.44-20260912 sha=${{ github.sha }}"
