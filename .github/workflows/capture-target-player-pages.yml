name: Capture target player responses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-target-player-pages.yml"
      - ".github/triggers/capture-target-player-pages"

permissions:
  contents: read

concurrency:
  group: capture-target-player-pages
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Capture live pages with browser-like headers
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path('player-pages')
          out.mkdir()
          ua = 'Mozilla/5.0 (Linux; Android 14; Android TV) AppleWebKit/537.36 Chrome/131 Safari/537.36 NuvioTV'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def fetch(name, url, referer=None):
              headers = {
                  'User-Agent': ua,
                  'Accept': 'text/html,application/xhtml+xml,application/json,text/plain,video/*,*/*',
                  'Accept-Language': 'fr-FR,fr;q=0.9,en;q=0.5',
                  'Cache-Control': 'no-cache',
              }
              if referer:
                  headers['Referer'] = referer
                  headers['Origin'] = urllib.parse.urlsplit(referer)._replace(path='', query='', fragment='').geturl().rstrip('/')
              request = urllib.request.Request(url, headers=headers)
              meta = {'name': name, 'requested_url': url, 'referer': referer}
              try:
                  with opener.open(request, timeout=25) as response:
                      body = response.read(4_000_000)
                      meta.update({
                          'status': response.status,
                          'final_url': response.geturl(),
                          'content_type': response.headers.get('content-type', ''),
                          'length': len(body),
                      })
                      (out / f'{name}.bin').write_bytes(body)
              except Exception as error:
                  meta['error'] = f'{type(error).__name__}: {error}'
              (out / f'{name}.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              return meta

          rows = []
          rows.append(fetch('wookafr-detail', 'https://wookafr.center/streaming/aventure/interstellar/', 'https://wookafr.center/'))
          rows.append(fetch('lecteurvideo-interstellar', 'https://lecteurvideo.com/embed.php?id=18230&tp=3&url=wookafr.tel', 'https://wookafr.center/streaming/aventure/interstellar/'))
          rows.append(fetch('megaup-interstellar', 'https://megaup.net/302eb88d2b1d1389b841de1f1355830f/Interstellar_-_2014.mp4', 'https://lecteurvideo.com/embed.php?id=18230&tp=3&url=wookafr.tel'))
          rows.append(fetch('frenchstream-interstellar', 'https://fs16.lol/15971-interstellar-film-streaming-complet-vf.html', 'https://fs16.lol/'))
          rows.append(fetch('vidzy-interstellar-1', 'https://vidzy.org/embed-68jmp1hd4l5j.html', 'https://fs16.lol/15971-interstellar-film-streaming-complet-vf.html'))
          rows.append(fetch('vidzy-interstellar-2', 'https://vidzy.org/embed-lm4iq0g7x4ju.html', 'https://fs16.lol/15971-interstellar-film-streaming-complet-vf.html'))
          rows.append(fetch('streamzo-interstellar', 'https://streamzo.fr/interstellar', 'https://streamzo.fr/'))
          rows.append(fetch('streamzo-mirrors-interstellar', 'https://streamzo.fr/api/mirrors/film/23254', 'https://streamzo.fr/interstellar'))
          rows.append(fetch('streamzo-vidnest-interstellar', 'https://streamzo.fr/embed/vidnest.fun/23254?src=https://vidnest.fun/movie/157336', 'https://streamzo.fr/interstellar'))
          rows.append(fetch('streamzo-uqload-interstellar', 'https://streamzo.fr/embed/uqload.is/23254?src=https://uqload.is/embed-v8dv65a48f6x.html', 'https://streamzo.fr/interstellar'))
          rows.append(fetch('coflix-interstellar', 'https://coflix.esq/film/interstellar/', 'https://coflix.esq/'))
          (out / 'index.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Upload captured player pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-player-pages-${{ github.run_id }}
          path: player-pages
          retention-days: 2
          if-no-files-found: error
