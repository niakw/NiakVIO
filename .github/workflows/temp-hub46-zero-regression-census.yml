name: TEMP - Hub46 ZERO and regression census

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-hub46-zero-regression-census.yml

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_PARITY_TIMEOUT: '25'

jobs:
  hard-trio:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static audit of exact 46
        run: python scripts/audit_provider_v3_static.py
      - name: Full32 parity hard trio
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 3 --timeout 25 \
            --seed 20260914-hub46-hard-trio \
            --out /tmp/hard-trio.json \
            --provider animevostfr --provider kurage --provider voiranime
          python - <<'PY'
          import json
          d=json.load(open('/tmp/hard-trio.json'))
          print('HARD_TRIO_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('HARD_TRIO_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          for r in d.get('providers') or []:
              print('HARD_TRIO_PROVIDER',json.dumps({'provider':r.get('providerId'),'status':r.get('status'),'lanes':[{'lane':x.get('lane'),'status':x.get('status'),'samples':x.get('sampleCount'),'proof':next((s.get('classification') for s in x.get('samples') or [] if s.get('classification') in {'both_ok','upstream_ok_niakvio_ko','niakvio_ok_upstream_ko'}),None)} for x in r.get('lanes') or []]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub46-hard-trio-${{ github.run_id }}
          path: /tmp/hard-trio.json
          retention-days: 14

  regression-a:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full32 parity regression set A
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 5 --timeout 25 \
            --seed 20260914-hub46-reg-a \
            --out /tmp/reg-a.json \
            --provider hindmoviez --provider moviesmod --provider mugiwarastream --provider streamzo --provider videasy
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reg-a.json'))
          print('REG_A_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('REG_A_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          for r in d.get('providers') or []: print('REG_A_PROVIDER',r.get('providerId'),r.get('status'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub46-reg-a-${{ github.run_id }}
          path: /tmp/reg-a.json
          retention-days: 14

  regression-b:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full32 parity regression set B
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 6 --timeout 25 \
            --seed 20260914-hub46-reg-b \
            --out /tmp/reg-b.json \
            --provider vidfast --provider voiranime-rip --provider anime-sama --provider animesama-co --provider kehflix --provider vidrock
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reg-b.json'))
          print('REG_B_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('REG_B_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          for r in d.get('providers') or []: print('REG_B_PROVIDER',r.get('providerId'),r.get('status'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub46-reg-b-${{ github.run_id }}
          path: /tmp/reg-b.json
          retention-days: 14

  zero-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact multi-fixture ZERO probes and config truth
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity as p
          local=p.local_catalog()
          overrides=json.loads(Path('provider-overrides.json').read_text())
          manifest=json.loads(Path('manifest.json').read_text())
          mrows={str(r.get('id','')).lower():r for r in manifest.get('scrapers') or []}
          fixtures=[
            {'tmdbId':'95479','mediaType':'anime','category':'anime','title':'Jujutsu Kaisen','year':2020,'season':1,'episode':1},
            {'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1},
            {'tmdbId':'31911','mediaType':'anime','category':'anime','title':'Fullmetal Alchemist: Brotherhood','year':2009,'season':1,'episode':1},
          ]
          out={}
          for pid in ('anikototv','animesalt','neko-sama','animevostfr','kurage','voiranime'):
              row=local[pid]
              patch=(overrides.get('provider_patches') or {}).get(pid) or {}
              print('CURRENT_CONFIG',pid,'types=',mrows[pid].get('canonicalSupportedTypes'),'lego=',patch.get('provider_lego_scripts'),'published=',patch.get('published_types'),'route_state=',patch.get('route_data_state'))
              results=[]
              for f in fixtures:
                  r=p.run_worker(row['path'],f,55)
                  results.append({'fixture':f['title'],'stream_count':r.get('stream_count'),'raw_stream_count':r.get('raw_stream_count'),'http_statuses':r.get('http_statuses'),'server_accessible':r.get('server_accessible'),'server_success':r.get('server_success'),'timeout':r.get('timeout'),'error_class':r.get('error_class'),'runtimeNetworkExecuted':r.get('runtimeNetworkExecuted')})
                  print('ZERO_DEEP_RESULT',pid,json.dumps(results[-1],sort_keys=True))
              out[pid]=results
          Path('/tmp/zero-deep.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub46-zero-deep-${{ github.run_id }}
          path: /tmp/zero-deep.json
          retention-days: 14
