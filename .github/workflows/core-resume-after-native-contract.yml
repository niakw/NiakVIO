name: NiakVIO minimal final Core seal
# target: test-body-after-sealed-metadata-v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-resume-after-native-contract.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-core-resume-after-native-contract
  cancel-in-progress: true

jobs:
  seal-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Announce minimal Core seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Minimal final Core seal started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Metadata is already sealed on 30e5504e; provider convergence and native/Brain pretests are NOT repeated."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify sealed Core and Frenchstream regression
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 30e5504e00b37b41d8b4bd756f791b38840591de HEAD
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/activation_preservation_core_rehash_test.py
          python3 tests/vf_movie_policy_test.py

      - name: Run repository test body without expensive pretest
        run: npm test --ignore-scripts

      - name: Seal fixed point and remove final Core one-shot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          node engine_v2/tests/provider-catalog.test.mjs
          python3 scripts/validate_release_integrity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/core-resume-after-native-contract.yml
          python3 tests/repository_hygiene_contract_test.py
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          git add -A
          git commit -m 'chore: seal targeted Core completion [skip ci]'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --exit-code
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Minimal final Core seal SUCCEEDED on main ${SHA}: sealed 92-provider fixed point reused, Frenchstream rehash regression + full repository test body + release integrity green, final Core one-shot removed. Full Core/native/Brain pretests were not repeated."

      - name: Report minimal Core seal failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Minimal final Core seal FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Inspect this run only; do not restart full Core or provider convergence."
