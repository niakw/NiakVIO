name: NiakVIO final Core cleanup seal
# target: all-published-security-finalization-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-resume-after-native-contract.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-core-resume-after-native-contract
  cancel-in-progress: true

jobs:
  seal-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Announce targeted security finalization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Targeted published-security finalization started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Existing 92-provider publication is reused; only mandatory provider-agnostic hardening/fixed-point materialization and Core one-shot cleanup run."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize mandatory security on all published bundles
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 30e5504e00b37b41d8b4bd756f791b38840591de HEAD
          python3 scripts/normalize_published_security_finalization.py
          converged=0
          for pass in 1 2 3; do
            echo "FIELD_PUBLISHED_SECURITY_PASS pass=${pass}"
            python3 scripts/reapply_published_overrides.py
            if python3 scripts/reapply_published_overrides.py --check; then
              converged=1
              break
            fi
          done
          test "$converged" = "1"
          python3 scripts/normalize_published_security_finalization.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/activation_preservation_core_rehash_test.py
          node engine_v2/tests/provider-catalog.test.mjs

      - name: Require all 92 published bundles hardened
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path('.')
          sys.path.insert(0, str((root / 'scripts').resolve()))
          from provider_security_hardening import known_unsafe_findings
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          rows = [row for row in (manifest.get('scrapers') or []) if isinstance(row, dict) and str(row.get('filename') or '').strip()]
          failures = []
          checked = 0
          for row in rows:
              relative = str(row.get('filename') or '')
              path = root / relative
              if not path.is_file():
                  failures.append((str(row.get('id') or ''), 'missing_bundle', relative))
                  continue
              findings = known_unsafe_findings(path.read_text(encoding='utf-8', errors='strict'))
              checked += 1
              if findings:
                  failures.append((str(row.get('id') or ''), ','.join(sorted(set(findings))), relative))
          print(f"FIELD_PUBLISHED_PROVIDER_SECURITY_SCAN checked={checked} expected={len(rows)} unsafe={len(failures)}")
          for item in failures:
              print('UNSAFE_PROVIDER=' + '|'.join(item))
          if len(rows) != 92 or checked != 92 or failures:
              raise SystemExit('full 92-provider hardening proof failed')
          PY
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check

      - name: Remove Core one-shot and seal hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/core-resume-after-native-contract.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py
          git add -A
          git commit -m 'security: seal all published provider hardening [skip ci]'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --exit-code
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Targeted published-security finalization SUCCEEDED on main ${SHA}: all 92 published bundles hardened provider-agnostically, fixed point + release integrity green, Core one-shot removed and hashes resealed. No Quick/Deep/Brain/native/upstream-drift pipeline was rerun."

      - name: Report targeted finalization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Targeted published-security finalization FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Inspect this run only; do not restart full provider convergence."
