name: NiakVIO publish hardened provider fixed point
# target: publish-all-provider-security-v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-resume-after-native-contract.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-core-resume-after-native-contract
  cancel-in-progress: true

jobs:
  seal-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Announce final targeted publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final targeted 92-provider security publication started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. No discovery, network provider audit, Quick, Deep, Brain or native workflow is included."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize and prove hardened fixed point
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 30e5504e00b37b41d8b4bd756f791b38840591de HEAD
          python3 scripts/normalize_published_security_finalization.py
          converged=0
          for pass in 1 2 3; do
            echo "FIELD_PUBLISHED_SECURITY_PASS pass=${pass}"
            python3 scripts/reapply_published_overrides.py
            if python3 scripts/reapply_published_overrides.py --check; then
              converged=1
              break
            fi
          done
          test "$converged" = "1"
          python3 scripts/normalize_published_security_finalization.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/activation_preservation_core_rehash_test.py
          node engine_v2/tests/provider-catalog.test.mjs
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('.')
          sys.path.insert(0, str((root/'scripts').resolve()))
          from provider_security_hardening import known_unsafe_findings
          rows=[row for row in json.loads((root/'manifest.json').read_text(encoding='utf-8')).get('scrapers',[]) if isinstance(row,dict) and str(row.get('filename') or '').strip()]
          failures=[]
          checked=0
          for row in rows:
              path=root/str(row['filename'])
              if not path.is_file():
                  failures.append((str(row.get('id') or ''),'missing_bundle',str(row.get('filename') or '')))
                  continue
              checked+=1
              findings=known_unsafe_findings(path.read_text(encoding='utf-8',errors='strict'))
              if findings:
                  failures.append((str(row.get('id') or ''),','.join(sorted(set(findings))),str(row.get('filename') or '')))
          print(f"FIELD_PUBLISHED_PROVIDER_SECURITY_SCAN checked={checked} expected={len(rows)} unsafe={len(failures)}")
          for item in failures: print('UNSAFE_PROVIDER='+'|'.join(item))
          if len(rows)!=92 or checked!=92 or failures: raise SystemExit('full 92-provider hardening proof failed')
          PY
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check

      - name: Publish hardened fixed point and remove one-shot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -e .github/workflows/core-resume-after-native-contract.yml ]; then
            git rm .github/workflows/core-resume-after-native-contract.yml
          fi
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_published_security_finalization.py --check
          python3 tests/repository_hygiene_contract_test.py
          git add -A
          git commit -m 'security: publish hardened 92-provider fixed point'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_published_security_finalization.py --check
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --exit-code
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final targeted 92-provider security publication SUCCEEDED on main ${SHA}: all published bundles hardened, fixed point + release integrity green, one-shot removed. The non-skipped push now hands this exact SHA to #69 security/CodeQL."

      - name: Report targeted publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Final targeted 92-provider security publication FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Inspect only this targeted publication; do not restart full provider convergence."
