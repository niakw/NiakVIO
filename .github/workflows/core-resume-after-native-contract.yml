name: NiakVIO final Core cleanup seal
# target: cleanup-only-after-proven-fixed-point-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-resume-after-native-contract.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: niakvio-core-resume-after-native-contract
  cancel-in-progress: true

jobs:
  seal-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce cleanup-only Core seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Cleanup-only Core seal started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. The converged 92-provider fixed point is reused; no provider rebuild, Quick/Deep, Brain, native or upstream-drift gate is rerun."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify only durable Core invariants
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 30e5504e00b37b41d8b4bd756f791b38840591de HEAD
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/activation_preservation_core_rehash_test.py
          node engine_v2/tests/provider-catalog.test.mjs

      - name: Remove Core one-shot and seal hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/core-resume-after-native-contract.yml
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/reapply_published_overrides.py --check
          python3 tests/repository_hygiene_contract_test.py
          git add -A
          git commit -m 'chore: seal targeted Core completion [skip ci]'
          git fetch origin main
          git rebase origin/main
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --exit-code
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Cleanup-only Core seal SUCCEEDED on main ${SHA}: 92-provider fixed point and release integrity remain green, Core one-shot removed, hashes resealed. Upstream Nuvio drift remains delegated to its dedicated scheduled guard and did not block this seal."

      - name: Report cleanup-only Core failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Cleanup-only Core seal FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Inspect this targeted run only; do not restart provider convergence."
