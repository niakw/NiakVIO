name: FIX - Generic inconclusive rebuild preservation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-inconclusive-rebuild-preservation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Patch generic Brain preservation rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/promote_candidates.py')
          text = source.read_text(encoding='utf-8')

          helper_marker = '''def choose_variant_with_baseline_protection(\n'''
          helper = '''def should_preserve_previous_state(\n    *,\n    enabled: bool,\n    current_ci_inconclusive: bool,\n    old_was_enabled: bool,\n    restore_activation_lkg: bool,\n    old_safety_quarantine: bool,\n    auto_disabled: bool,\n    old_artifact_available: bool,\n    observed_status: str,\n    preserve_statuses: set[str],\n    old_entry: dict[str, Any] | None,\n    sources: dict[str, Any],\n) -> bool:\n    \"\"\"Keep the last proven state when the current Deep cannot decide.\n\n    Upstream ``enabled:false`` is not conclusive runtime evidence. A current\n    inconclusive result therefore cannot silently shrink either an activation\n    LKG state or a previously proven safety quarantine. Hard exclusions,\n    sustained availability auto-disablement and conclusive statuses still win.\n    \"\"\"\n    return (\n        not enabled\n        and current_ci_inconclusive\n        and (old_was_enabled or restore_activation_lkg or old_safety_quarantine)\n        and not auto_disabled\n        and old_artifact_available\n        and observed_status in preserve_statuses\n        and isinstance(old_entry, dict)\n        and not metadata_is_excluded(old_entry, sources)\n    )\n\n\n'''
          if 'def should_preserve_previous_state(' not in text:
              if helper_marker not in text:
                  raise SystemExit('choose_variant helper anchor not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          old = '''            preserve_previous_state = (\n                not enabled\n                and current_ci_inconclusive\n                and (old_was_enabled or restore_activation_lkg or old_safety_quarantine)\n                and not auto_disabled\n                and upstream_enabled\n                and old_artifact_available\n                and observed_status in preserve_statuses\n                and not metadata_is_excluded(old_entry, sources)\n            )\n'''
          new = '''            preserve_previous_state = should_preserve_previous_state(\n                enabled=enabled,\n                current_ci_inconclusive=current_ci_inconclusive,\n                old_was_enabled=old_was_enabled,\n                restore_activation_lkg=restore_activation_lkg,\n                old_safety_quarantine=old_safety_quarantine,\n                auto_disabled=auto_disabled,\n                old_artifact_available=old_artifact_available,\n                observed_status=observed_status,\n                preserve_statuses=preserve_statuses,\n                old_entry=old_entry,\n                sources=sources,\n            )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('preservation decision block not found')
          source.write_text(text, encoding='utf-8')

          test = Path('tests/ci_preservation_policy_test.py')
          tests = test.read_text(encoding='utf-8')
          test_marker = '''\ndef language_gate_item(*, streams=1, payloads=1, runtime_languages=None, manifest_languages=None):\n'''
          regression = '''\n# Rebuild regression: upstream metadata cannot turn CI uncertainty into\n# disablement proof. Preservation is based on the previous proven state, not\n# on the current advisory upstream enabled flag.\npreservation_sources = {\"exclusions\": {\"provider_ids\": [], \"metadata_patterns\": [\"torrent\"]}}\npreservation_entry = {\"id\": \"generic-provider\", \"enabled\": True, \"filename\": \"providers/generic.js\"}\npreservation_base = dict(\n    enabled=False,\n    current_ci_inconclusive=True,\n    old_was_enabled=True,\n    restore_activation_lkg=False,\n    old_safety_quarantine=False,\n    auto_disabled=False,\n    old_artifact_available=True,\n    observed_status=\"no_streams\",\n    preserve_statuses=preserve_statuses,\n    old_entry=preservation_entry,\n    sources=preservation_sources,\n)\nassert promoter_module.should_preserve_previous_state(**preservation_base) is True\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"old_was_enabled\": False, \"restore_activation_lkg\": True}\n) is True\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"old_was_enabled\": False, \"old_safety_quarantine\": True}\n) is True\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"current_ci_inconclusive\": False}\n) is False\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"auto_disabled\": True}\n) is False\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"old_artifact_available\": False}\n) is False\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"observed_status\": \"unavailable\"}\n) is False\nassert promoter_module.should_preserve_previous_state(\n    **{**preservation_base, \"old_entry\": {**preservation_entry, \"description\": \"torrent provider\"}}\n) is False\n\n'''
          if 'preservation_base = dict(' not in tests:
              if test_marker not in tests:
                  raise SystemExit('regression test anchor not found')
              tests = tests.replace(test_marker, regression + test_marker, 1)
          test.write_text(tests, encoding='utf-8')
          PY

      - name: Validate targeted preservation policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/promote_candidates.py scripts/validate_activation_preservation.py
          python tests/ci_preservation_policy_test.py

      - name: Commit fix and consume one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-fix-inconclusive-rebuild-preservation.yml
          git add scripts/promote_candidates.py tests/ci_preservation_policy_test.py .github/workflows/tmp-fix-inconclusive-rebuild-preservation.yml
          git diff --cached --check
          git commit -m 'fix: preserve proven state through inconclusive rebuild [skip ci]'
          git push origin HEAD:main
