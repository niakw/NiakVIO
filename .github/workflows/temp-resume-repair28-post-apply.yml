name: TEMP - Resume Repair 28 Post Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-resume-repair28-post-apply.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: niakvio-temp-resume-repair28-post-apply
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: '45'
      NIAKVIO_QUICK_YIELD_MAX_SAMPLES: '4'
      SOURCE_REPAIR_SHA: '4cc56e288a498e016ac5823e28089b3d333406ef'
      SOURCE_RUN_ID: '35401694913'
      SOURCE_ARTIFACT_ID: '10570987798'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prove resume inputs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_REPAIR_SHA}^{commit}"
          git diff --exit-code "${SOURCE_REPAIR_SHA}..HEAD" --             manifest.json             provider-overrides.json             automation/provider-v3-static-knowledge.json             scripts/provider_base_store.py             scripts/recover_provider_routes_from_upstreams.py             scripts/apply_provider_route_recovery_report.py             scripts/enforce_route_proof_manifest_policy_v1.py
          python tests/provider_execution_route_sanitizer_scope_test.py
          echo "FIELD_REPAIR28_RESUME_INPUTS source_sha=${SOURCE_REPAIR_SHA} current_sha=${GITHUB_SHA} provider_inputs_unchanged=true"

      - name: Install declared provider parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore exact post-apply checkpoint from Repair 28
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair28
          curl --fail --location --retry 3             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"             -o /tmp/repair28.zip
          unzip -q /tmp/repair28.zip -d /tmp/repair28
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/repair28')
          targeted=json.loads((root/'automation/provider-route-recovery-v6-targeted.json').read_text())
          merged=json.loads((root/'automation/provider-route-recovery-v6.json').read_text())
          knowledge=json.loads((root/'automation/provider-v3-static-knowledge.json').read_text())
          assert targeted.get('providerCount') == 33, targeted.get('providerCount')
          assert targeted.get('providersWithProvenRoutes') == 25, targeted.get('providersWithProvenRoutes')
          assert merged.get('providerCount') == 44, merged.get('providerCount')
          assert (merged.get('applied') or {}).get('patchedProviders') == 44, merged.get('applied')
          assert len(knowledge.get('providers') or {}) == 46
          print('FIELD_REPAIR28_CHECKPOINT verified=true targeted=33 targeted_proven=25 merged=44 knowledge=46')
          PY
          cp /tmp/repair28/provider-overrides.json provider-overrides.json
          cp /tmp/repair28/automation/provider-v3-static-knowledge.json automation/provider-v3-static-knowledge.json
          cp /tmp/repair28/automation/provider-route-recovery-v6-targeted.json automation/provider-route-recovery-v6-targeted.json
          cp /tmp/repair28/automation/provider-route-recovery-v6.json automation/provider-route-recovery-v6.json
          cp /tmp/repair28/automation/provider-repair-portfolio-baseline.json automation/provider-repair-portfolio-baseline.json

      - name: Resume at post-apply policy and rematerialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enforce_route_proof_manifest_policy_v1.py             --report automation/provider-route-recovery-v6.json             --manifest manifest.json             --overrides provider-overrides.json
          python scripts/sanitize_provider_v3_execution_routes_v1.py
          python scripts/materialize_provider_base_v3_store.py
          python scripts/materialize_provider_v3_all.py
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_published_provider_config.py
          python tests/provider_js_lego_ownership_test.py
          python tests/global_stream_output_guard_test.py
          python tests/episodic_identity_runtime_test.py
          python tests/episodic_year_identity_regression_test.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_media_type_resolution_test.py
          python tests/native_dual_id_identity_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py

      - name: Run real post-repair candidate census
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_provider_quick_yield.py | tee automation/repair28-resume-quick-yield.log
          cp provider-v3-quick-yield.json automation/provider-repair-portfolio-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('automation/provider-repair-portfolio-baseline.json').read_text())
          cand=json.loads(Path('automation/provider-repair-portfolio-candidate.json').read_text())
          b=set(base.get('verified_providers') or [])
          c=set(cand.get('verified_providers') or [])
          summary={
            'schemaVersion':1,
            'sourceRunId':35401694913,
            'sourceSha':'4cc56e288a498e016ac5823e28089b3d333406ef',
            'baselineVerifiedCount':len(b),
            'candidateVerifiedCount':len(c),
            'gainedProviders':sorted(c-b),
            'lostProviders':sorted(b-c),
            'candidateVerifiedProviders':sorted(c),
            'acceptanceTarget':35,
            'acceptanceReached':len(c)>=35,
          }
          Path('automation/provider-repair28-resume-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('FIELD_REPAIR28_RESUME_CANDIDATE '+json.dumps(summary,sort_keys=True))
          PY
          python scripts/compare_quick_yield_preservation.py             --baseline automation/provider-repair-portfolio-baseline.json             --candidate automation/provider-repair-portfolio-candidate.json             --losses-output automation/provider-repair-portfolio-losses.json || true

      - name: Capture exact candidate delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > automation/provider-repair28-resume-status.txt
          git diff --name-status > automation/provider-repair28-resume-name-status.txt
          git diff --stat > automation/provider-repair28-resume-stat.txt
          git diff > automation/provider-repair28-resume.diff
          grep '^FIELD_PROVIDER_QUICK_YIELD' automation/repair28-resume-quick-yield.log || true
          cat automation/provider-repair28-resume-summary.json 2>/dev/null || true

      - name: Upload post-apply candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair28-post-apply-candidate-${{ github.run_id }}
          path: |
            automation/provider-repair28-resume-*.json
            automation/provider-repair28-resume-*.txt
            automation/provider-repair28-resume.diff
            automation/provider-repair-portfolio-baseline.json
            automation/provider-repair-portfolio-candidate.json
            automation/provider-repair-portfolio-losses.json
            provider-v3-quick-yield.json
            provider-overrides.json
            automation/provider-v3-static-knowledge.json
            provider-v3-materialization.json
            manifest.json
            PROVENANCE.json
          if-no-files-found: warn
          retention-days: 14
