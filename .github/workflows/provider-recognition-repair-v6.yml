          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text())
          print(
              "FIELD_REPAIR_WAF_FINAL "
              f"repair={len(state.get('repairQueue') or [])} "
              f"harness_mismatch={len(state.get('harnessMismatchQueue') or [])} "
              f"network_blocked={sum(1 for row in state.get('providers') or [] if isinstance(row,dict) and row.get('status')=='PROVIDER NETWORK BLOCKED')}"
          )
          PY

      - name: Enforce four-version floor on repair candidate
        id: candidate-gate
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'learn') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/build_provider_history_matrix_v3.py
          python scripts/check_provider_non_regression_v1.py
          test -s provider-v3-quick-yield.json
          python scripts/check_provider_non_regression_v1.py --candidate-gate --all --base-ref HEAD

      - name: Verify only census symptoms were network re-probed
        if: ${{ always() && steps.canonical-repair.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s automation/provider-route-recovery-v6-targeted.json ] || [ ! -s automation/provider-repair-portfolio-baseline.json ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path

          baseline=json.loads(Path('automation/provider-repair-portfolio-baseline.json').read_text())
          allowed={
              str(value or '').strip().lower()
              for value in baseline.get('selected_providers') or []
              if str(value or '').strip()
          }
          if not allowed:
              allowed={
                  str(row.get('provider_id') or '').strip().lower()
                  for row in baseline.get('rows') or []
                  if isinstance(row,dict) and str(row.get('provider_id') or '').strip()
              }
          report=json.loads(Path('automation/provider-route-recovery-v6-targeted.json').read_text())
          tested={
              str(row.get('providerId') or '').strip().lower()
              for row in report.get('providers') or []
              if isinstance(row,dict) and str(row.get('providerId') or '').strip()
          }
          outside=sorted(tested-allowed)
          assert not outside, outside
          print(
              f'PROVIDER_REPAIR_CENSUS_SCOPE_PROOF tested={len(tested)} '
              f'allowed_symptoms={len(allowed)} outside=0'
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-recognition-repair-v6-${{ github.run_id }}
          path: |
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-route-recovery-v6.json
            automation/provider-repair-yield-v6.json
            automation/provider-repair-v6-summary.json
            automation/provider-brain-repair-latest.json
            automation/brain-llm-force-candidate-evaluation.json
            automation/brain-llm-force-memory.json
            automation/brain-llm-force-mutation-application.json
            automation/brain-llm-force-current-byte-retest.json
            automation/provider-authority-status.json
            automation/provider-waf-browser-session-latest.json
            automation/brain-repair-experience.json
            automation/brain-repair-memory.json
            automation/brain-positive-program-memory.json
            automation/provider-census-status.json
            automation/provider-census-proof-history.json
            automation/provider-census-post-repair.json
            automation/provider-repair-batch-plan-latest.json
            PROVIDER_CENSUS_STATUS.md
            automation/provider-repair-portfolio-baseline.json
            automation/provider-repair-portfolio-candidate.json
            automation/provider-repair-portfolio-retry.json
            automation/provider-repair-portfolio-losses.json
            automation/provider-v3-static-knowledge.json
            automation/provider-history-matrix.json
            automation/provider-non-regression-gate.json
            automation/PROVIDER-HISTORY-MATRIX.md
            provider-v3-quick-yield.json
            provider-overrides.json
            PROVENANCE.json
            provider-bases/
            providers/
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            provider-v3-materialization.json
          retention-days: 14
          if-no-files-found: warn

      - name: Persist Repair census state
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ inputs.mode || '' }}
          CANDIDATE_GATE_OUTCOME: ${{ steps.candidate-gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s PROVIDER_CENSUS_STATUS.md ] || [ ! -s automation/provider-census-status.json ]; then
            echo "No Repair census state produced"
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text())
          rows=[row for row in state.get("providers") or [] if isinstance(row,dict)]
          assert int(state.get("schemaVersion") or 0) >= 3
          assert rows
          assert all("authorityRepairEligible" in row and "authorityAction" in row for row in rows)
          PY
          then
            echo "FIELD_REPAIR_CENSUS_NOT_PERSISTED authority_schema_v3_required"
            exit 0
          fi

          tmp="${RUNNER_TEMP}/repair-census-${GITHUB_RUN_ID}"
          mkdir -p "$tmp"
          cp PROVIDER_CENSUS_STATUS.md "$tmp/PROVIDER_CENSUS_STATUS.md"
          cp automation/provider-census-status.json "$tmp/provider-census-status.json"
          [ ! -s automation/provider-authority-status.json ] || cp automation/provider-authority-status.json "$tmp/provider-authority-status.json"
          [ ! -s automation/provider-waf-browser-session-latest.json ] || cp automation/provider-waf-browser-session-latest.json "$tmp/provider-waf-browser-session-latest.json"
          [ ! -s automation/provider-census-proof-history.json ] || cp automation/provider-census-proof-history.json "$tmp/provider-census-proof-history.json"
          if [ -s automation/brain-llm-force-memory.json ] && ! git diff --quiet "$GITHUB_SHA" -- automation/brain-llm-force-memory.json; then
            cp automation/brain-llm-force-memory.json "$tmp/brain-llm-force-memory.json"
          fi
          canonical_repair_outcome="${{ steps.canonical-repair.outcome }}"
          canonical_ledger_publishable=0
          if [ "$canonical_repair_outcome" = "success" ]; then
            canonical_ledger_publishable=1
          else
            echo "FIELD_REPAIR_CANONICAL_LEDGER_FAIL_CLOSED outcome=$canonical_repair_outcome"
          fi
          if [ "$canonical_repair_outcome" != "skipped" ]; then
            if [ -s automation/brain-repair-memory.json ] && ! git diff --quiet "$GITHUB_SHA" -- automation/brain-repair-memory.json; then
              cp automation/brain-repair-memory.json "$tmp/brain-repair-memory.json"
            fi
            if [ -s automation/brain-positive-program-memory.json ] && ! git diff --quiet "$GITHUB_SHA" -- automation/brain-positive-program-memory.json; then
              cp automation/brain-positive-program-memory.json "$tmp/brain-positive-program-memory.json"
            fi
            if [ -s automation/provider-brain-repair-latest.json ]; then
              if python - "$GITHUB_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          current=sys.argv[1].strip().lower()
          data=json.loads(Path("automation/provider-brain-repair-latest.json").read_text(encoding="utf-8"))
          experience=data.get("experienceMemory") if isinstance(data.get("experienceMemory"),dict) else {}
          source=str(experience.get("sourceSha") or "").strip().lower()
          if source != current:
              raise SystemExit(f"stale Brain report sourceSha={source or '<missing>'} current={current}")
          PY
              then
                cp automation/provider-brain-repair-latest.json "$tmp/provider-brain-repair-latest.json"
                echo "FIELD_REPAIR_CURRENT_RUN_BRAIN_REPORT captured=true outcome=$canonical_repair_outcome"
              else
                echo "FIELD_REPAIR_CURRENT_RUN_BRAIN_REPORT captured=false reason=source-sha-mismatch"
              fi
            fi
          else
            echo "FIELD_REPAIR_CURRENT_RUN_BRAIN_REPORT captured=false reason=canonical-repair-skipped"
          fi
          [ ! -s automation/provider-census-post-repair.json ] || cp automation/provider-census-post-repair.json "$tmp/provider-census-post-repair.json"
          [ ! -s automation/provider-repair-candidate-evidence.json ] || cp automation/provider-repair-candidate-evidence.json "$tmp/provider-repair-candidate-evidence.json"
          [ ! -s automation/provider-repair-batch-plan-latest.json ] || cp automation/provider-repair-batch-plan-latest.json "$tmp/provider-repair-batch-plan-latest.json"

          counts="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-census-status.json').read_text())
          print(f"symptomatic={len(d.get('symptomaticProviders') or d.get('brainQueue') or [])} repair={len(d.get('repairQueue') or [])}")
          PY
          )"

          # Explicit operator Force is the only mode allowed to publish validated
          # provider-local candidate bytes directly. Learning remains proposal-only,
          # and automatic Repair keeps its evidence/current-hypothesis semantics.
          direct_force_apply=0
          force_candidate_applied=0
          force_requested=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${DISPATCH_MODE:-}" = "force" ]; then
            force_requested=1
          elif [ "${{ github.event_name }}" = "push" ]; then
            force_requested="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".github/triggers/provider-recognition-repair-v6.json").read_text(encoding="utf-8"))
          enabled=(
              str(data.get("mode") or "").strip().casefold()=="force"
              and data.get("directApplyValidated") is True
          )
          print("1" if enabled else "0")
          PY
            )"
          fi
          if [ "$force_requested" = "1" ]              && [ "$canonical_repair_outcome" = "success" ]              && [ "${CANDIDATE_GATE_OUTCOME:-}" = "success" ]; then
            direct_force_apply=1
            mapfile -t force_paths < <(python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          allowed_exact={
              "provider-overrides.json","provider-hubs.json","provider_catalog.json","sources.json",
              "manifest.json","manifest-hub46.json","PROVENANCE.json","provider-v3-materialization.json",
              "FILE-HASHES.json","PATCH-SHA256SUMS.txt","SHA256SUMS.json",
              "automation/provider-v3-static-knowledge.json",
              "automation/provider-v3-recognition-seeds.json",
          }
          allowed_prefixes=(
              "providers/","provider-bases/","provider-disabled/","provider-old/",
              "vf/","no-anime/","vf-no-anime/","native-hub46/",
              "scripts/provider_patches/",
          )
          evidence_exact={
              "PROVIDER_CENSUS_STATUS.md","provider-v3-quick-yield.json",
              "availability-history.json","availability-report.json",
          }
          evidence_prefixes=("automation/",)
          changed=set(
              line.strip()
              for line in subprocess.check_output(
                  ["git","diff","--name-only",os.environ["GITHUB_SHA"]],
                  text=True,
              ).splitlines()
              if line.strip()
          )
          changed.update(
              line.strip()
              for line in subprocess.check_output(
                  ["git","ls-files","--others","--exclude-standard"],
                  text=True,
              ).splitlines()
              if line.strip()
          )
          candidate=[]
          unexpected=[]
          for path in sorted(changed):
              if path in allowed_exact or path.startswith(allowed_prefixes):
                  candidate.append(path)
              elif path in evidence_exact or path.startswith(evidence_prefixes):
                  continue
              else:
                  unexpected.append(path)
          if unexpected:
              raise SystemExit("Force Repair candidate crossed direct-apply boundary: "+",".join(unexpected))
          for path in candidate:
              print(path)
          PY
            )
            if [ "${#force_paths[@]}" -gt 0 ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "${force_paths[@]}"
              git commit -m "tmp(force-repair): validated provider candidate ${GITHUB_RUN_ID}"
              git rev-parse HEAD > "$tmp/force-candidate-sha.txt"
              printf '%s\n' "${force_paths[@]}" > "$tmp/force-candidate-paths.txt"
              echo "FIELD_FORCE_REPAIR_DIRECT_APPLY captured=true files=${#force_paths[@]}"
            else
              echo "FIELD_FORCE_REPAIR_DIRECT_APPLY captured=false reason=no-provider-byte-diff"
            fi
          else
            echo "FIELD_FORCE_REPAIR_DIRECT_APPLY enabled=false requested=$force_requested mode=${DISPATCH_MODE:-automatic}"
          fi

          # Reset the sandbox after preserving evidence and, for explicit Force,
          # a temporary commit containing only validated provider-local bytes.
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          canonical_ledger_current=1
          provider_input_drift=0
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            canonical_ledger_current=0
            echo "FIELD_REPAIR_CANONICAL_LEDGER_STALE source=$GITHUB_SHA remote=$remote_main"
          fi
          git rebase origin/main

          # Observation-only main drift must not invalidate provider-local proof.
          # After rebasing, a provider-neutral main advance (docs/badges/UI only)
          # keeps the tested provider bytes identical, so validated Force/census
          # evidence may be persisted on top of the newer main. Actual provider
          # input drift remains fail-closed and requires a fresh census.
          if [ "$canonical_ledger_current" != "1" ]; then
            python scripts/select_provider_materialization_scope.py \
              --base "$GITHUB_SHA" \
              --head HEAD \
              --output "$tmp/concurrent-main-provider-scope.json"
            provider_drift_mode="$(python - "$tmp/concurrent-main-provider-scope.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(str(d.get("mode") or "all"))
          PY
            )"
            if [ "$provider_drift_mode" = "none" ]; then
              canonical_ledger_current=1
              echo "FIELD_REPAIR_CONCURRENT_PROVIDER_DRIFT neutral=true source=$GITHUB_SHA remote=$remote_main"
              echo "FIELD_REPAIR_CANONICAL_LEDGER_REBASED_NEUTRAL tested_sha=$GITHUB_SHA current_sha=$remote_main"
            else
              provider_input_drift=1
              echo "FIELD_REPAIR_CONCURRENT_PROVIDER_DRIFT neutral=false mode=$provider_drift_mode source=$GITHUB_SHA remote=$remote_main"
            fi
          fi

          mkdir -p automation

          if [ "$direct_force_apply" = "1" ] && [ -f "$tmp/force-candidate-sha.txt" ]; then
            if [ "$canonical_ledger_current" = "1" ]; then
              force_candidate_sha="$(cat "$tmp/force-candidate-sha.txt")"
              git cherry-pick --no-commit "$force_candidate_sha"
              force_candidate_applied=1
              echo "FIELD_FORCE_REPAIR_DIRECT_APPLY restored=true sha=$force_candidate_sha"
            else
              echo "FIELD_FORCE_REPAIR_DIRECT_APPLY restored=false reason=newer-main"
            fi
          fi

          # Stale Repair output remains downloadable from Actions, but it may
          # not move main. Even evidence-only commits can supersede the exact
          # SHA of a newer Repair and create another avoidable cycle.
          if [ "$canonical_ledger_current" = "1" ]; then
            [ ! -f "$tmp/brain-repair-memory.json" ] || cp "$tmp/brain-repair-memory.json" automation/brain-repair-memory.json
            [ ! -f "$tmp/brain-positive-program-memory.json" ] || cp "$tmp/brain-positive-program-memory.json" automation/brain-positive-program-memory.json
            [ ! -f "$tmp/brain-llm-force-memory.json" ] || cp "$tmp/brain-llm-force-memory.json" automation/brain-llm-force-memory.json
            if [ -f "$tmp/provider-brain-repair-latest.json" ]; then
              cp "$tmp/provider-brain-repair-latest.json" "automation/provider-brain-repair-${GITHUB_RUN_ID}.json"
            fi
          else
            echo "FIELD_REPAIR_STALE_BRAIN_NOT_PERSISTED source=$GITHUB_SHA remote=$remote_main"
          fi

          if [ "$canonical_ledger_current" = "1" ] && [ "$canonical_ledger_publishable" = "1" ]; then
            cp "$tmp/PROVIDER_CENSUS_STATUS.md" PROVIDER_CENSUS_STATUS.md
            cp "$tmp/provider-census-status.json" automation/provider-census-status.json
            [ ! -f "$tmp/provider-authority-status.json" ] || cp "$tmp/provider-authority-status.json" automation/provider-authority-status.json
            [ ! -f "$tmp/provider-waf-browser-session-latest.json" ] || cp "$tmp/provider-waf-browser-session-latest.json" automation/provider-waf-browser-session-latest.json
            [ ! -f "$tmp/provider-census-proof-history.json" ] || cp "$tmp/provider-census-proof-history.json" automation/provider-census-proof-history.json
            [ ! -f "$tmp/provider-census-post-repair.json" ] || cp "$tmp/provider-census-post-repair.json" automation/provider-census-post-repair.json
            [ ! -f "$tmp/provider-repair-candidate-evidence.json" ] || cp "$tmp/provider-repair-candidate-evidence.json" automation/provider-repair-candidate-evidence.json
            [ ! -f "$tmp/provider-repair-batch-plan-latest.json" ] || cp "$tmp/provider-repair-batch-plan-latest.json" automation/provider-repair-batch-plan-latest.json
          elif [ "$canonical_ledger_current" != "1" ]; then
            echo "FIELD_REPAIR_CANONICAL_LEDGER_SKIPPED reason=newer-main-requires-fresh-census"
          else
            echo "FIELD_REPAIR_CANONICAL_LEDGER_SKIPPED reason=canonical-repair-$canonical_repair_outcome"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$canonical_ledger_current" = "1" ] && [ "$canonical_ledger_publishable" = "1" ]; then
            git add PROVIDER_CENSUS_STATUS.md automation/provider-census-status.json
            [ ! -f automation/provider-authority-status.json ] || git add automation/provider-authority-status.json
            [ ! -f automation/provider-waf-browser-session-latest.json ] || git add automation/provider-waf-browser-session-latest.json
            [ ! -f automation/provider-census-proof-history.json ] || git add automation/provider-census-proof-history.json
            [ ! -f automation/provider-census-post-repair.json ] || git add automation/provider-census-post-repair.json
            [ ! -f automation/provider-repair-candidate-evidence.json ] || git add automation/provider-repair-candidate-evidence.json
            [ ! -f automation/provider-repair-batch-plan-latest.json ] || git add automation/provider-repair-batch-plan-latest.json
          fi
          if [ "$canonical_ledger_current" = "1" ]; then
            [ ! -f automation/brain-repair-memory.json ] || git add automation/brain-repair-memory.json
            [ ! -f automation/brain-positive-program-memory.json ] || git add automation/brain-positive-program-memory.json
            [ ! -f automation/brain-llm-force-memory.json ] || git add automation/brain-llm-force-memory.json
            [ ! -f "automation/provider-brain-repair-${GITHUB_RUN_ID}.json" ] || git add "automation/provider-brain-repair-${GITHUB_RUN_ID}.json"
          fi

          if git diff --cached --quiet; then
            echo "Repair evidence already current"
          else
            if [ "$force_candidate_applied" = "1" ]; then
              git commit -m "fix(force-repair): apply validated provider corrections + evidence from ${GITHUB_SHA::12}"
            else
              git commit -m "ci(repair): persist evidence ${counts} from ${GITHUB_SHA::12}"
            fi
            git push origin HEAD:main
          fi

          if [ "$canonical_ledger_current" != "1" ] && [ "$provider_input_drift" = "1" ]; then
            echo "FIELD_REPAIR_FRESH_CENSUS_DISPATCH source_run=${GITHUB_RUN_ID} reason=provider-input-drift"
            gh workflow run temp-current-bytes-full-provider-census.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          elif [ "$canonical_ledger_current" != "1" ]; then
            echo "FIELD_REPAIR_FRESH_CENSUS_SKIPPED source_run=${GITHUB_RUN_ID} reason=provider-neutral-main-drift"
          fi

          if [ "$canonical_ledger_current" != "1" ] && [ -s "$tmp/provider-brain-repair-latest.json" ]; then
            echo "FIELD_REPAIR_STALE_ESCALATION_SKIPPED source=$GITHUB_SHA remote=$remote_main"
          fi
          if [ "$canonical_ledger_current" = "1" ] && [ -s "$tmp/provider-brain-repair-latest.json" ]; then
            read -r deferred deferred_csv < <(python - "$tmp/provider-brain-repair-latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=sorted({str(x or '').strip().lower().replace('_','-') for x in data.get('deferredLearningProviders') or [] if str(x or '').strip()})
          print(len(rows), ','.join(rows))
          PY
            )
            if [ "$deferred" -gt 0 ]; then
              test -n "$deferred_csv" || { echo "deferred Learning cohort unexpectedly empty" >&2; exit 1; }
              echo "FIELD_PROVIDER_BRAIN_LEARNING_DEBT deferred=$deferred providers=$deferred_csv learning_dispatch=false owner=scheduled-learning-slot force_requested=$force_requested"
              if [ "$force_requested" = "1" ]; then
                echo "FIELD_PROVIDER_BRAIN_FORCE_DEBT deferred=$deferred providers=$deferred_csv learning_dispatch=false owner=force"
              fi
            fi

            read -r resume remaining processed unvisited < <(python - "$tmp/provider-brain-repair-latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          resume='1' if data.get('resumeRecommended') is True else '0'
          remaining=len(data.get('remainingProviders') or [])
          processed=int(data.get('processedProviderCount') or 0)
          unvisited=len(data.get('unvisitedProviders') or [])
          print(resume,remaining,processed,unvisited)
          PY
            )
            if [ "$resume" = "1" ] && [ "$remaining" -gt 0 ] && [ "$unvisited" -gt 0 ]; then
              if [ "$force_requested" = "1" ]; then
                echo "FIELD_PROVIDER_BRAIN_FORCE_UNVISITED remaining=$remaining processed=$processed unvisited=$unvisited auto_resume=false reason=bounded-force-run"
              else
                echo "FIELD_PROVIDER_BRAIN_RESUME remaining=$remaining processed=$processed unvisited=$unvisited target=provider-recognition-repair-v6"
                gh workflow run provider-recognition-repair-v6.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f mode=repair
                echo "FIELD_PROVIDER_BRAIN_RESUME_MODE mode=repair force_requested=false"
              fi
            elif [ "$resume" = "1" ] && [ "$remaining" -gt 0 ]; then
              echo "FIELD_PROVIDER_BRAIN_RESUME_SKIPPED reason=no-unvisited-provider remaining=$remaining processed=$processed unvisited=$unvisited"
            fi
          fi
