name: LEARN/FORCE - Provider Recognition Repair V6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Same canonical pipeline; Learn is evidence-only, Force is explicit operator repair candidate
        required: true
        default: force
        type: choice
        options: [learn, force, repair]
      target_provider:
        description: Optional symptomatic census provider id; empty means census repairQueue only
        required: false
        default: ""
        type: string
      allow_upstream_positive_loss:
        description: Diagnostic only; never use for an accepted repair candidate
        required: false
        default: false
        type: boolean
  push:
    branches:
      - workbench/route-recognition-v6
      - workbench/systemic-recovery-20260909
      - main
    paths:
      - '.github/triggers/provider-recognition-repair-v6.json'
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: provider-repair-main-v2
  # Repair owns its integrated GitHub/Tailscale transport qualification. Keep
  # Repair runs serialized with each other, but do not let observational
  # census/WAF pushes replace a pending Repair in GitHub's one-pending-run slot.
  cancel-in-progress: false

jobs:
  recognition-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject superseded Repair SHA before expensive work
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "FIELD_REPAIR_SUPERSEDED_EARLY run_sha=$GITHUB_SHA main_sha=$remote_sha" >&2
            exit 1
          fi
          echo "FIELD_REPAIR_HEAD_FRESH sha=$GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mvn -q -f tools/waf-okhttp-probe/pom.xml -DskipTests package

      - name: Prove one canonical Learn Force repair implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/run_provider_brain_repair.py \
            scripts/build_brain_repair_experience.py \
            scripts/classify_provider_authority.py \
            scripts/adaptive_runtime/runtime_recovery_generator.py \
            scripts/provider_patches/adaptive_runtime_recovery_v5.py \
            scripts/upgrade_provider_repair_v6.py \
            scripts/upgrade_provider_runtime_reconstruction_v21_12.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/audit_provider_repair_yield_v6.py \
            scripts/audit_provider_quick_yield_targeted.py \
            scripts/compare_quick_yield_preservation.py \
            scripts/upgrade_provider_worker_route_proof_v1.py \
            scripts/build_provider_history_matrix_v3.py \
            scripts/check_provider_non_regression_v1.py \
            scripts/merge_provider_same_run_positive_evidence.py
          python scripts/upgrade_provider_runtime_reconstruction_v21_12.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_authority_arbiter_test.py
          python tests/provider_authority_current_catalogue_test.py
          python tests/provider_domain_authority_memory_test.py
          python tests/provider_documented_route_discovery_test.py
          python tests/provider_same_run_positive_evidence_merge_test.py
          python tests/targeted_quick_yield_canonical_cli_test.py
          python tests/provider_brain_repair_orchestrator_test.py
          python tests/provider_materialization_byte_validation_contract_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/brain_causal_intelligence_contract_test.py
          python tests/brain_exploration_chain_test.py
          python tests/brain_round_plan_attribution_test.py
          python tests/brain_accepted_program_capture_test.py
          python tests/brain_accepted_program_v3_compiler_test.py
          python tests/brain_accepted_program_v3_persistence_test.py
          python tests/brain_positive_program_memory_test.py
          python tests/brain_positive_program_runtime_priority_test.py
          python tests/brain_historical_experience_scope_test.py
          python tests/brain_historical_solution_execution_test.py
          python tests/brain_cross_phase_experiment_memory_test.py
          python tests/brain_learning_queue_experiment_ledger_test.py
          python tests/brain_learning_lab_session_recovery_test.py
          python tests/brain_fast_handoff_active_context_test.py
          python tests/brain_archetype_matching_test.py
          python tests/brain_current_observation_recipe_test.py
          python tests/brain_terminal_source_route_test.py
          python tests/brain_historical_player_extractor_transfer_test.py
          python tests/brain_episode_scoped_traversal_test.py
          python tests/provider_composite_id_route_proof_test.py
          python tests/brain_replan_transport_retry_test.py
          python tests/brain_exploration_budget_test.py
          python tests/provider_repair_learning_escalation_workflow_test.py
          python tests/provider_repair_waf_integration_workflow_test.py
          python tests/provider_waf_tailscale_exit_contract_test.py
          python tests/provider_waf_census_markdown_sync_test.py
          python tests/provider_repair_unresolved_scope_test.py
          python tests/provider_census_status_markdown_test.py
          python tests/provider_v3_override_pipeline_contract_test.py
          # Fail fast on provider-folder activation/lifecycle drift. This used to
          # run only after the expensive Brain stage and made a stale 46-active
          # assumption waste a complete Repair cycle.
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/brain_repair_experience_transfer_test.py
          python tests/provider_clean_worker_smoke_test.py
          python tests/provider_stage_profile_worker_smoke_test.py
          python tests/provider_wookafr_current_runtime_behavior_test.py
          python tests/provider_fetch_slice_budget_test.py
          python tests/brain_preflight_fail_fast_order_test.py
          cp manifest.json "$RUNNER_TEMP/provider-preflight-manifest.json"
          python scripts/materialize_provider_v3_all.py \
            --source-manifest "$RUNNER_TEMP/provider-preflight-manifest.json" \
            --output-dir "$RUNNER_TEMP/provider-preflight-artifacts" \
            --report "$RUNNER_TEMP/provider-preflight-materialization.json"
          python tests/provider_discovery_v3_composition_test.py
          python tests/brain_generation_failure_memory_test.py
          python tests/brain_negative_experiment_exhaustion_test.py
          python tests/brain_final_experiment_generation_test.py
          python tests/brain_second_order_strategy_runtime_test.py
          python tests/brain_third_order_strategy_runtime_test.py
          python tests/brain_learning_generation_runtime_test.py
          python tests/adaptive_request_recipe_behavior_test.py
          node engine_v2/tests/repair-brain.test.mjs
          python tests/core_repair_type_architecture_test.py
          python tests/provider_non_regression_contract_test.py

      - name: Prepare integrated Repair WAF/network qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classify_provider_authority.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text(encoding="utf-8"))
          authority=json.loads(Path("automation/provider-authority-status.json").read_text(encoding="utf-8"))
          allowed={
              str(row.get("provider") or "").strip().lower()
              for row in authority.get("providers") or []
              if isinstance(row,dict)
              and row.get("repairEligible") is True
              and str(row.get("provider") or "").strip()
          }
          providers=sorted({
              str(row.get("provider") or "").strip().lower()
              for row in state.get("providers") or []
              if isinstance(row,dict)
              and row.get("brainCheckRequired") is True
              and str(row.get("provider") or "").strip().lower() in allowed
          })
          Path("/tmp/repair-waf-targets.json").write_text(
              json.dumps({"providers":providers},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print(f"FIELD_REPAIR_WAF_SCOPE providers={len(providers)} ids={','.join(providers)}")
          PY
          python scripts/audit_provider_quick_yield_targeted.py             --providers-json /tmp/repair-waf-targets.json             --output /tmp/provider-repair-waf-network.json             --attempts 1
          python scripts/render_provider_census_status.py /tmp/provider-repair-waf-network.json             --output PROVIDER_CENSUS_STATUS.md             --json-output automation/provider-census-status.json             --history automation/provider-census-proof-history.json             --baseline-status automation/provider-census-status.json             --authority-status automation/provider-authority-status.json             --run-id "${GITHUB_RUN_ID}-repair-pre-waf"             --sha "$GITHUB_SHA"
          python scripts/probe_waf_browser_session.py             /tmp/provider-repair-waf-network.json             --output /tmp/provider-repair-waf-github.json             --attempts 2             --client-profile-matrix             --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*'             --status automation/provider-census-status.json             --overrides provider-overrides.json             --network-report /tmp/provider-repair-waf-network.json             --workers 3             --max-targets 32             --timeout 25             --virtual-time-ms 8000

      - name: Normalize optional Repair Tailscale tag
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"

      - name: Connect optional Repair Tailscale transport
        id: repair_tailscale_connect
        continue-on-error: true
        timeout-minutes: 4
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Select optional Repair residential exit
        id: repair_residential_exit
        continue-on-error: true
        if: ${{ steps.repair_tailscale_connect.outcome == 'success' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
              echo "NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"
              echo "FIELD_REPAIR_TAILSCALE active=true"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "FIELD_REPAIR_TAILSCALE active=false reason=exit-node-offline-or-unavailable" >&2
          exit 1

      - name: Reprobe Repair WAF through optional residential exit
        id: repair_residential_probe
        continue-on-error: true
        if: ${{ steps.repair_residential_exit.outcome == 'success' && env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_waf_browser_session.py             /tmp/provider-repair-waf-github.json             --output /tmp/provider-repair-waf-residential.json             --attempts 2             --client-profile-matrix             --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*'             --status automation/provider-census-status.json             --overrides provider-overrides.json             --network-report /tmp/provider-repair-waf-network.json             --workers 3             --max-targets 32             --timeout 25             --virtual-time-ms 8000

      - name: Merge Repair WAF profiles with offline-safe Tailscale fallback
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/provider-repair-waf-residential.json ]; then
            python scripts/merge_waf_network_profiles.py               --baseline /tmp/provider-repair-waf-github.json               --residential /tmp/provider-repair-waf-residential.json               --output automation/provider-waf-browser-session-latest.json
          else
            reason="tailscale-not-configured"
            if [ -n "${TS_OAUTH_CLIENT_ID:-}" ] && [ -n "${TS_AUDIENCE:-}" ] && [ -n "${TS_EXIT_NODE:-}" ]; then
              reason="tailscale-offline-or-unavailable"
            fi
            if [ "${{ steps.repair_tailscale_connect.outcome }}" = "failure" ]; then
              reason="tailscale-connect-failed"
            elif [ "${{ steps.repair_residential_exit.outcome }}" = "failure" ]; then
              reason="exit-node-offline-or-unavailable"
            elif [ "${{ steps.repair_residential_probe.outcome }}" = "failure" ]; then
              reason="residential-probe-failed"
            fi
            python scripts/merge_waf_network_profiles.py               --baseline /tmp/provider-repair-waf-github.json               --unavailable-reason "$reason"               --output automation/provider-waf-browser-session-latest.json
            echo "FIELD_REPAIR_TAILSCALE_FALLBACK reason=$reason"
          fi

      - name: Replay Repair providers through residential exit when available
        if: ${{ env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_residential_provider_replay.py             --waf automation/provider-waf-browser-session-latest.json             --status automation/provider-census-status.json             --output /tmp/repair-residential-provider-replay-targets.json
          count="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/repair-residential-provider-replay-targets.json').read_text())
          print(int(data.get('providerCount') or 0))
          PY
          )"
          if [ "$count" -gt 0 ]; then
            python scripts/audit_provider_quick_yield_targeted.py               --providers-json /tmp/repair-residential-provider-replay-targets.json               --output /tmp/provider-repair-residential-network-replay.json               --attempts 1
            python scripts/merge_residential_provider_replay.py               --waf automation/provider-waf-browser-session-latest.json               --replay /tmp/provider-repair-residential-network-replay.json               --output /tmp/provider-repair-waf-with-residential-replay.json
            mv /tmp/provider-repair-waf-with-residential-replay.json automation/provider-waf-browser-session-latest.json
          fi
          echo "FIELD_REPAIR_RESIDENTIAL_REPLAY providers=$count"

      - name: Clear optional Repair residential routing
        if: ${{ always() && env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: sudo tailscale set --exit-node= || true

      - name: Apply integrated WAF qualification to Repair census
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_waf_census_transport.py             --status automation/provider-census-status.json             --waf automation/provider-waf-browser-session-latest.json             --authority-status automation/provider-authority-status.json             --output /tmp/provider-repair-census-waf.json             --run-id "${GITHUB_RUN_ID}-repair-waf"             --sha "$GITHUB_SHA"
          mv /tmp/provider-repair-census-waf.json automation/provider-census-status.json
          python scripts/build_provider_repair_batch_plan.py             --status automation/provider-census-status.json             --overrides provider-overrides.json             --output automation/provider-repair-batch-plan-latest.json
          python scripts/render_provider_census_status_from_state.py             --status automation/provider-census-status.json             --output PROVIDER_CENSUS_STATUS.md
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text(encoding="utf-8"))
          print(
              "FIELD_REPAIR_WAF_QUALIFIED "
              f"repair={len(state.get('repairQueue') or [])} "
              f"environment={len(state.get('environmentQueue') or [])} "
              f"authority_blocked={len(state.get('authorityBlockedQueue') or [])}"
          )
          PY

      - name: Run canonical recognition and correction only for unresolved providers
        id: canonical-repair
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode || '' }}
          TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
          ALLOW_LOSS: ${{ inputs.allow_upstream_positive_loss || 'false' }}
        run: |
          set -euo pipefail
          # Current-run evidence only. Never let a skipped/failed Repair read
          # tracked artifacts produced by an earlier run.
          rm -f             automation/provider-route-recovery-v6-targeted.json             automation/provider-repair-v6-summary.json             automation/provider-brain-repair-latest.json             automation/brain-repair-experience.json             automation/provider-repair-portfolio-baseline.json             automation/provider-repair-portfolio-candidate.json             automation/provider-repair-portfolio-retry.json             automation/provider-repair-portfolio-losses.json
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=learn
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE=repair
          else
            MODE="${DISPATCH_MODE:-force}"
          fi
          args=(python scripts/run_provider_repair_pipeline_v6.py --mode "$MODE")
          if [ -n "$TARGET_PROVIDER" ]; then
            args+=(--provider "$TARGET_PROVIDER")
          elif [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t PUSH_TARGETS < <(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.github/triggers/provider-recognition-repair-v6.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          for value in data.get('targetProviders') or []:
              value=str(value or '').strip().lower()
              if value: print(value)
          PY
            )
            for provider in "${PUSH_TARGETS[@]}"; do args+=(--provider "$provider"); done
          fi
          if [ "$ALLOW_LOSS" = "true" ]; then args+=(--allow-upstream-positive-loss); fi
          printf 'CANONICAL_REPAIR_ARGS %q ' "${args[@]}"; echo
          "${args[@]}"

      - name: Enforce four-version floor on repair candidate
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'learn') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/build_provider_history_matrix_v3.py
          python scripts/check_provider_non_regression_v1.py
          test -s provider-v3-quick-yield.json
          python scripts/check_provider_non_regression_v1.py --candidate-gate --all --base-ref HEAD

      - name: Verify only census symptoms were network re-probed
        if: ${{ always() && steps.canonical-repair.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s automation/provider-route-recovery-v6-targeted.json ] || [ ! -s automation/provider-repair-portfolio-baseline.json ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path

          baseline=json.loads(Path('automation/provider-repair-portfolio-baseline.json').read_text())
          allowed={
              str(value or '').strip().lower()
              for value in baseline.get('selected_providers') or []
              if str(value or '').strip()
          }
          if not allowed:
              allowed={
                  str(row.get('provider_id') or '').strip().lower()
                  for row in baseline.get('rows') or []
                  if isinstance(row,dict) and str(row.get('provider_id') or '').strip()
              }
          report=json.loads(Path('automation/provider-route-recovery-v6-targeted.json').read_text())
          tested={
              str(row.get('providerId') or '').strip().lower()
              for row in report.get('providers') or []
              if isinstance(row,dict) and str(row.get('providerId') or '').strip()
          }
          outside=sorted(tested-allowed)
          assert not outside, outside
          print(
              f'PROVIDER_REPAIR_CENSUS_SCOPE_PROOF tested={len(tested)} '
              f'allowed_symptoms={len(allowed)} outside=0'
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-recognition-repair-v6-${{ github.run_id }}
          path: |
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-route-recovery-v6.json
            automation/provider-repair-yield-v6.json
            automation/provider-repair-v6-summary.json
            automation/provider-brain-repair-latest.json
            automation/provider-authority-status.json
            automation/provider-waf-browser-session-latest.json
            automation/brain-repair-experience.json
            automation/brain-repair-memory.json
            automation/brain-positive-program-memory.json
            automation/provider-census-status.json
            automation/provider-census-proof-history.json
            automation/provider-census-post-repair.json
            automation/provider-repair-batch-plan-latest.json
            PROVIDER_CENSUS_STATUS.md
            automation/provider-repair-portfolio-baseline.json
            automation/provider-repair-portfolio-candidate.json
            automation/provider-repair-portfolio-retry.json
            automation/provider-repair-portfolio-losses.json
            automation/provider-v3-static-knowledge.json
            automation/provider-history-matrix.json
            automation/provider-non-regression-gate.json
            automation/PROVIDER-HISTORY-MATRIX.md
            provider-v3-quick-yield.json
            provider-overrides.json
            PROVENANCE.json
            provider-bases/
            providers/
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            provider-v3-materialization.json
          retention-days: 14
          if-no-files-found: warn

      - name: Persist Repair census state
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s PROVIDER_CENSUS_STATUS.md ] || [ ! -s automation/provider-census-status.json ]; then
            echo "No Repair census state produced"
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text())
          rows=[row for row in state.get("providers") or [] if isinstance(row,dict)]
          assert int(state.get("schemaVersion") or 0) >= 3
          assert rows
          assert all("authorityRepairEligible" in row and "authorityAction" in row for row in rows)
          PY
          then
            echo "FIELD_REPAIR_CENSUS_NOT_PERSISTED authority_schema_v3_required"
            exit 0
          fi

          tmp="${RUNNER_TEMP}/repair-census-${GITHUB_RUN_ID}"
          mkdir -p "$tmp"
          cp PROVIDER_CENSUS_STATUS.md "$tmp/PROVIDER_CENSUS_STATUS.md"
          cp automation/provider-census-status.json "$tmp/provider-census-status.json"
          [ ! -s automation/provider-authority-status.json ] || cp automation/provider-authority-status.json "$tmp/provider-authority-status.json"
          [ ! -s automation/provider-waf-browser-session-latest.json ] || cp automation/provider-waf-browser-session-latest.json "$tmp/provider-waf-browser-session-latest.json"
          [ ! -s automation/provider-census-proof-history.json ] || cp automation/provider-census-proof-history.json "$tmp/provider-census-proof-history.json"
          [ ! -s automation/brain-repair-memory.json ] || cp automation/brain-repair-memory.json "$tmp/brain-repair-memory.json"
          [ ! -s automation/brain-positive-program-memory.json ] || cp automation/brain-positive-program-memory.json "$tmp/brain-positive-program-memory.json"
          [ ! -s automation/provider-census-post-repair.json ] || cp automation/provider-census-post-repair.json "$tmp/provider-census-post-repair.json"
          [ ! -s automation/provider-repair-candidate-evidence.json ] || cp automation/provider-repair-candidate-evidence.json "$tmp/provider-repair-candidate-evidence.json"
          [ ! -s automation/provider-repair-batch-plan-latest.json ] || cp automation/provider-repair-batch-plan-latest.json "$tmp/provider-repair-batch-plan-latest.json"
          [ ! -s automation/provider-brain-repair-latest.json ] || cp automation/provider-brain-repair-latest.json "$tmp/provider-brain-repair-latest.json"

          counts="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-census-status.json').read_text())
          print(f"symptomatic={len(d.get('symptomaticProviders') or d.get('brainQueue') or [])} repair={len(d.get('repairQueue') or [])}")
          PY
          )"

          # Candidate provider/Core bytes are never published by this evidence commit.
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          canonical_ledger_current=1
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            canonical_ledger_current=0
            echo "FIELD_REPAIR_CANONICAL_LEDGER_STALE source=$GITHUB_SHA remote=$remote_main"
          fi
          git rebase origin/main

          mkdir -p automation

          # Causal Brain memory is Repair-owned and remains useful after a
          # concurrent observational commit. Canonical census/authority/WAF,
          # however, describe exact tested bytes and must never overwrite a
          # newer HEAD merely because this longer Repair finished later.
          [ ! -f "$tmp/brain-repair-memory.json" ] || cp "$tmp/brain-repair-memory.json" automation/brain-repair-memory.json
          [ ! -f "$tmp/brain-positive-program-memory.json" ] || cp "$tmp/brain-positive-program-memory.json" automation/brain-positive-program-memory.json
          if [ -f "$tmp/provider-brain-repair-latest.json" ]; then
            cp "$tmp/provider-brain-repair-latest.json" "automation/provider-brain-repair-${GITHUB_RUN_ID}.json"
          fi

          if [ "$canonical_ledger_current" = "1" ]; then
            cp "$tmp/PROVIDER_CENSUS_STATUS.md" PROVIDER_CENSUS_STATUS.md
            cp "$tmp/provider-census-status.json" automation/provider-census-status.json
            [ ! -f "$tmp/provider-authority-status.json" ] || cp "$tmp/provider-authority-status.json" automation/provider-authority-status.json
            [ ! -f "$tmp/provider-waf-browser-session-latest.json" ] || cp "$tmp/provider-waf-browser-session-latest.json" automation/provider-waf-browser-session-latest.json
            [ ! -f "$tmp/provider-census-proof-history.json" ] || cp "$tmp/provider-census-proof-history.json" automation/provider-census-proof-history.json
            [ ! -f "$tmp/provider-census-post-repair.json" ] || cp "$tmp/provider-census-post-repair.json" automation/provider-census-post-repair.json
            [ ! -f "$tmp/provider-repair-candidate-evidence.json" ] || cp "$tmp/provider-repair-candidate-evidence.json" automation/provider-repair-candidate-evidence.json
            [ ! -f "$tmp/provider-repair-batch-plan-latest.json" ] || cp "$tmp/provider-repair-batch-plan-latest.json" automation/provider-repair-batch-plan-latest.json
          else
            echo "FIELD_REPAIR_CANONICAL_LEDGER_SKIPPED reason=newer-main-requires-fresh-census"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$canonical_ledger_current" = "1" ]; then
            git add PROVIDER_CENSUS_STATUS.md automation/provider-census-status.json
            [ ! -f automation/provider-authority-status.json ] || git add automation/provider-authority-status.json
            [ ! -f automation/provider-waf-browser-session-latest.json ] || git add automation/provider-waf-browser-session-latest.json
            [ ! -f automation/provider-census-proof-history.json ] || git add automation/provider-census-proof-history.json
            [ ! -f automation/provider-census-post-repair.json ] || git add automation/provider-census-post-repair.json
            [ ! -f automation/provider-repair-candidate-evidence.json ] || git add automation/provider-repair-candidate-evidence.json
            [ ! -f automation/provider-repair-batch-plan-latest.json ] || git add automation/provider-repair-batch-plan-latest.json
          fi
          [ ! -f automation/brain-repair-memory.json ] || git add automation/brain-repair-memory.json
          [ ! -f automation/brain-positive-program-memory.json ] || git add automation/brain-positive-program-memory.json
          [ ! -f "automation/provider-brain-repair-${GITHUB_RUN_ID}.json" ] || git add "automation/provider-brain-repair-${GITHUB_RUN_ID}.json"

          if git diff --cached --quiet; then
            echo "Repair evidence already current"
          else
            git commit -m "ci(repair): persist evidence ${counts} from ${GITHUB_SHA::12}"
            git push origin HEAD:main
          fi

          if [ "$canonical_ledger_current" != "1" ]; then
            echo "FIELD_REPAIR_FRESH_CENSUS_DISPATCH source_run=${GITHUB_RUN_ID}"
            gh workflow run temp-current-bytes-full-provider-census.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          fi

          if [ -s "$tmp/provider-brain-repair-latest.json" ]; then
            deferred="$(python - "$tmp/provider-brain-repair-latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=sorted({str(x or '').strip().lower() for x in data.get('deferredLearningProviders') or [] if str(x or '').strip()})
          print(len(rows))
          if rows:
              print(','.join(rows), file=sys.stderr)
          PY
            )"
            if [ "$deferred" -gt 0 ]; then
              echo "FIELD_PROVIDER_BRAIN_ESCALATE deferred=$deferred target=brain-learning-lab"
              gh workflow run brain-learning-lab.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f publish_proposal=true
            fi

            read -r resume remaining processed unvisited < <(python - "$tmp/provider-brain-repair-latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          resume='1' if data.get('resumeRecommended') is True else '0'
          remaining=len(data.get('remainingProviders') or [])
          processed=int(data.get('processedProviderCount') or 0)
          unvisited=len(data.get('unvisitedProviders') or [])
          print(resume,remaining,processed,unvisited)
          PY
            )
            if [ "$resume" = "1" ] && [ "$remaining" -gt 0 ]; then
              echo "FIELD_PROVIDER_BRAIN_RESUME remaining=$remaining processed=$processed unvisited=$unvisited target=provider-recognition-repair-v6"
              # This is deliberately the final action of the persistence step.
              # The successor starts from main after the just-persisted memory/census.
              gh workflow run provider-recognition-repair-v6.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f mode=repair
            fi
          fi
