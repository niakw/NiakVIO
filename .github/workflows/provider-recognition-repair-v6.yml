            python scripts/run_provider_retest.py
            --output automation/brain-llm-force-current-byte-retest.json
          )
          for provider in "${FORCE_WINNERS[@]}"; do retest_args+=(--provider "$provider"); done
          "${retest_args[@]}"
          echo "FIELD_BRAIN_LLM_FORCE_CURRENT_BYTES providers=$accepted_count ids=$accepted_csv"

      - name: Run canonical recognition and correction only for unresolved providers
        id: canonical-repair
        timeout-minutes: 30
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode || '' }}
          TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
          ALLOW_LOSS: ${{ inputs.allow_upstream_positive_loss || 'false' }}
          FORCE_ACCEPTED: ${{ steps.force-mutations.outputs.accepted_csv || '' }}
        run: |
          set -euo pipefail
          # Current-run evidence only. Never let a skipped/failed Repair read
          # tracked artifacts produced by an earlier run.
          rm -f             automation/provider-route-recovery-v6-targeted.json             automation/provider-repair-v6-summary.json             automation/provider-brain-repair-latest.json             automation/brain-repair-experience.json             automation/provider-repair-portfolio-baseline.json             automation/provider-repair-portfolio-candidate.json             automation/provider-repair-portfolio-retry.json             automation/provider-repair-portfolio-losses.json
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=learn
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".github/triggers/provider-recognition-repair-v6.json").read_text(encoding="utf-8"))
          mode=str(data.get("mode") or "repair").strip().casefold()
          if mode not in {"repair","force"}:
              raise SystemExit(f"push Repair trigger mode must be repair|force, got {mode!r}")
          print(mode)
          PY
            )"
          else
            MODE="${DISPATCH_MODE:-force}"
          fi
          args=(python scripts/run_provider_repair_pipeline_v6.py --mode "$MODE")
          declare -A FORCE_WINNER_SET=()
          if [ -n "${FORCE_ACCEPTED:-}" ]; then
            IFS=',' read -r -a _force_winners <<< "$FORCE_ACCEPTED"
            for provider in "${_force_winners[@]}"; do
              provider="$(printf '%s' "$provider" | tr '[:upper:]_' '[:lower:]-' | xargs)"
              [ -z "$provider" ] || FORCE_WINNER_SET["$provider"]=1
            done
          fi

          EXPLICIT_SCOPE=0
          REMAINING_TARGETS=()
          if [ -n "$TARGET_PROVIDER" ]; then
            EXPLICIT_SCOPE=1
            normalized="$(printf '%s' "$TARGET_PROVIDER" | tr '[:upper:]_' '[:lower:]-' | xargs)"
            if [ -z "${FORCE_WINNER_SET[$normalized]+x}" ]; then
              REMAINING_TARGETS+=("$normalized")
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            EXPLICIT_SCOPE=1
            mapfile -t PUSH_TARGETS < <(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.github/triggers/provider-recognition-repair-v6.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          for value in data.get('targetProviders') or []:
              value=str(value or '').strip().casefold().replace('_','-')
              if value: print(value)
          PY
            )
            for provider in "${PUSH_TARGETS[@]}"; do
              if [ -z "${FORCE_WINNER_SET[$provider]+x}" ]; then
                REMAINING_TARGETS+=("$provider")
              fi
            done
          elif [ -n "${FORCE_ACCEPTED:-}" ]; then
            EXPLICIT_SCOPE=1
            mapfile -t CURRENT_REPAIR_TARGETS < <(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("automation/provider-census-status.json").read_text(encoding="utf-8"))
          for value in data.get("repairQueue") or []:
              value=str(value or "").strip().casefold().replace("_","-")
              if value: print(value)
          PY
            )
            for provider in "${CURRENT_REPAIR_TARGETS[@]}"; do
              if [ -z "${FORCE_WINNER_SET[$provider]+x}" ]; then
                REMAINING_TARGETS+=("$provider")
              fi
            done
          fi

          if [ "$EXPLICIT_SCOPE" = "1" ] && [ "${#REMAINING_TARGETS[@]}" -eq 0 ]; then
            echo "FIELD_CANONICAL_REPAIR skipped=true reason=all-explicit-targets-resolved-by-isolated-force"
            exit 0
          fi
          for provider in "${REMAINING_TARGETS[@]}"; do args+=(--provider "$provider"); done
          if [ "$ALLOW_LOSS" = "true" ]; then args+=(--allow-upstream-positive-loss); fi
          printf 'CANONICAL_REPAIR_ARGS %q ' "${args[@]}"; echo
          "${args[@]}"

      - name: Reapply integrated WAF qualification after canonical Repair
