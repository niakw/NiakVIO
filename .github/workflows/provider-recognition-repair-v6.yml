name: LEARN/FORCE - Provider Recognition Repair V6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Same canonical pipeline; Learn is evidence-only, Force is explicit operator repair candidate
        required: true
        default: force
        type: choice
        options: [learn, force, repair]
      target_provider:
        description: Optional symptomatic census provider id; empty means census repairQueue only
        required: false
        default: ""
        type: string
      allow_upstream_positive_loss:
        description: Diagnostic only; never use for an accepted repair candidate
        required: false
        default: false
        type: boolean
      require_external_force_mutations:
        description: Explicit Force guard; fail before canonical Repair when no external Brain mutation is applied
        required: false
        default: false
        type: boolean
      require_external_brain_guidance:
        description: Fail before Repair unless fresh complete external Brain guidance is available for the requested cohort
        required: false
        default: false
        type: boolean
  push:
    branches:
      - workbench/route-recognition-v6
      - workbench/systemic-recovery-20260909
      - main
    paths:
      - '.github/triggers/provider-recognition-repair-v6.json'
permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: provider-repair-main-v3
  # Repair owns its integrated GitHub/Tailscale transport qualification.
  # Only an explicit trigger-file push may supersede an older push-triggered
  # Repair. Manual/scheduled long runs remain serialized and non-cancellable.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  recognition-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TS_TAG_NAME: ${{ secrets.TS_TAG_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject superseded Repair SHA before expensive work
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "FIELD_REPAIR_SUPERSEDED_EARLY run_sha=$GITHUB_SHA main_sha=$remote_sha" >&2
            exit 1
          fi
          echo "FIELD_REPAIR_HEAD_FRESH sha=$GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mvn -q -f tools/waf-okhttp-probe/pom.xml -DskipTests package

      - name: Prove one canonical Learn Force repair implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/run_provider_brain_repair.py \
            scripts/recover_brain_positive_program_memory.py \
            scripts/sanitize_brain_learning_memory.py \
            scripts/brain_llm_experiment.py \
            scripts/import_external_brain_llm_guidance.py \
            scripts/apply_brain_llm_force_mutations.py \
            scripts/build_brain_repair_experience.py \
            scripts/classify_provider_authority.py \
            scripts/adaptive_runtime/runtime_recovery_generator.py \
            scripts/provider_patches/adaptive_runtime_recovery_v5.py \
            scripts/upgrade_provider_repair_v6.py \
            scripts/upgrade_provider_runtime_reconstruction_v21_12.py \
            scripts/upgrade_stream_sanitizer_v7_selection.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/audit_provider_repair_yield_v6.py \
            scripts/audit_provider_quick_yield_targeted.py \
            scripts/compare_quick_yield_preservation.py \
            scripts/upgrade_provider_worker_route_proof_v1.py \
            scripts/build_provider_history_matrix_v3.py \
            scripts/check_provider_non_regression_v1.py \
            scripts/merge_provider_same_run_positive_evidence.py \
            scripts/select_provider_materialization_scope.py \
            scripts/reconcile_targeted_provider_publication.py
          python scripts/upgrade_provider_runtime_reconstruction_v21_12.py
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/stream_sanitizer_v7_monotonic_test.py
          python tests/provider_authority_arbiter_test.py
          python tests/provider_authority_current_catalogue_test.py
          python tests/provider_domain_authority_memory_test.py
          python tests/provider_documented_route_discovery_test.py
          python tests/provider_same_run_positive_evidence_merge_test.py
          python tests/targeted_quick_yield_canonical_cli_test.py
          python tests/provider_brain_repair_orchestrator_test.py
          python tests/provider_materialization_byte_validation_contract_test.py
          python tests/provider_census_incremental_materialization_scope_test.py
          python tests/provider_v3_sequential_reconstruction_contract_test.py
          python tests/brain_causal_intelligence_contract_test.py
          python tests/brain_llm_guidance_contract_test.py
          python tests/brain_llm_advisor_execution_test.py
          python tests/brain_llm_experiment_runtime_test.py
          python tests/provider_repair_transport_overlay_persistence_test.py
          python tests/brain_external_llm_guidance_import_test.py
          python tests/brain_llm_force_mutation_bridge_test.py
          python tests/brain_exploration_chain_test.py
          python tests/brain_round_plan_attribution_test.py
          python tests/brain_accepted_program_capture_test.py
          python tests/brain_accepted_program_winning_trace_test.py
          python tests/brain_accepted_program_v3_compiler_test.py
          python tests/brain_accepted_program_v3_persistence_test.py
          python tests/brain_positive_program_memory_test.py
          python tests/brain_positive_program_recovery_test.py
          python tests/brain_positive_program_repository_continuity_test.py
          python tests/brain_positive_program_repair_visibility_test.py
          python tests/brain_positive_program_runtime_priority_test.py
          python tests/brain_positive_program_cross_failure_replay_test.py
          python tests/brain_historical_experience_scope_test.py
          python tests/brain_historical_solution_execution_test.py
          python tests/brain_cross_phase_experiment_memory_test.py
          python tests/brain_learning_memory_import_test.py
          python tests/brain_external_llm_guidance_import_test.py
          python tests/brain_learning_queue_experiment_ledger_test.py
          python tests/brain_learning_causal_wave_merge_test.py
          python tests/brain_learning_lab_session_recovery_test.py
          python tests/brain_fast_handoff_active_context_test.py
          python tests/brain_archetype_matching_test.py
          python tests/brain_current_observation_recipe_test.py
          python tests/brain_terminal_source_route_test.py
          python tests/brain_historical_player_extractor_transfer_test.py
          python tests/brain_episode_scoped_traversal_test.py
          python tests/provider_composite_id_route_proof_test.py
          python tests/brain_replan_transport_retry_test.py
          python tests/brain_exploration_budget_test.py
          python tests/provider_repair_learning_escalation_workflow_test.py
          python tests/provider_learning_dispatch_gate_test.py
          python tests/provider_repair_waf_integration_workflow_test.py
          python tests/provider_waf_tailscale_exit_contract_test.py
          python tests/provider_waf_census_markdown_sync_test.py
          python tests/provider_repair_unresolved_scope_test.py
          python tests/provider_census_status_markdown_test.py
          python tests/provider_v3_override_pipeline_contract_test.py
          # Fail fast on provider-folder activation/lifecycle drift. This used to
          # run only after the expensive Brain stage and made a stale 46-active
          # assumption waste a complete Repair cycle.
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/brain_repair_experience_transfer_test.py
          python tests/provider_clean_worker_smoke_test.py
          python tests/provider_stage_profile_worker_smoke_test.py
          python tests/provider_wookafr_current_runtime_behavior_test.py
          python tests/provider_fetch_slice_budget_test.py
          python tests/brain_preflight_fail_fast_order_test.py
          python tests/brain_preflight_incremental_scope_test.py
          python scripts/select_provider_materialization_scope.py \
            --base HEAD^ \
            --head HEAD \
            --output "$RUNNER_TEMP/provider-preflight-scope.json"
          preflight_mode="$(python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"provider-preflight-scope.json").read_text())
          print(str(d.get("mode") or "all"))
          PY
          )"
          if [ "$preflight_mode" = "none" ]; then
            echo "FIELD_PROVIDER_PREFLIGHT_MATERIALIZATION mode=none skipped=true"
          else
            cp manifest.json "$RUNNER_TEMP/provider-preflight-manifest.json"
            python scripts/materialize_provider_v3_all.py \
              --source-manifest "$RUNNER_TEMP/provider-preflight-manifest.json" \
              --output-dir "$RUNNER_TEMP/provider-preflight-artifacts" \
              --report "$RUNNER_TEMP/provider-preflight-materialization.json"
            echo "FIELD_PROVIDER_PREFLIGHT_MATERIALIZATION mode=$preflight_mode skipped=false"
          fi
          python tests/provider_discovery_v3_composition_test.py
          python tests/brain_generation_failure_memory_test.py
          python tests/brain_negative_experiment_exhaustion_test.py
          python tests/brain_unexecuted_profile_debt_filter_test.py
          python tests/brain_llm_advisor_report_observability_test.py
          python tests/brain_final_experiment_generation_test.py
          python tests/brain_second_order_strategy_runtime_test.py
          python tests/brain_third_order_strategy_runtime_test.py
          python tests/brain_document_contract_fallback_test.py
          python tests/brain_learning_generation_runtime_test.py
          python tests/adaptive_request_recipe_behavior_test.py
          node engine_v2/tests/repair-brain.test.mjs
          python tests/core_repair_type_architecture_test.py
          python tests/provider_non_regression_contract_test.py

      - name: Decide reusable Repair WAF evidence
        id: repair_waf_reuse
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classify_provider_authority.py
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          waf="automation/provider-waf-browser-session-latest.json"
          if [ ! -s "$waf" ]; then
            echo "FIELD_REPAIR_WAF_REUSE reuse=false reason=missing-ledger"
            exit 0
          fi
          cp "$waf" "$RUNNER_TEMP/provider-repair-waf-prior.json"
          source="$(git log -1 --format=%H -- "$waf" || true)"
          if ! [[ "$source" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FIELD_REPAIR_WAF_REUSE reuse=false reason=missing-source-commit"
            exit 0
          fi
          python scripts/select_provider_materialization_scope.py \
            --base "$source" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/repair-waf-reuse-scope.json"
          mode="$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"repair-waf-reuse-scope.json").read_text())
          print(str(d.get("mode") or "all"))
          PY
          )"
          evidence_ok="$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("automation/provider-waf-browser-session-latest.json").read_text(encoding="utf-8"))
          residential=d.get("residentialExitNodeEvidence") if isinstance(d.get("residentialExitNodeEvidence"),dict) else {}
          replay=d.get("residentialProviderReplay") if isinstance(d.get("residentialProviderReplay"),dict) else {}
          rows=d.get("rows") if isinstance(d.get("rows"),list) else []
          print("true" if rows and residential.get("available") is True and replay.get("available") is True else "false")
          PY
          )"
          if [ "$mode" = "none" ] && [ "$evidence_ok" = "true" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$source" >> "$GITHUB_OUTPUT"
            echo "FIELD_REPAIR_WAF_REUSE reuse=true source=$source provider_drift=none"
          else
            echo "FIELD_REPAIR_WAF_REUSE reuse=false source=$source provider_drift=$mode evidence_ok=$evidence_ok"
          fi

      - name: Prepare integrated Repair WAF/network qualification
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' }}
        shell: bash
        env:
          DISPATCH_TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
        run: |
          set -euo pipefail
          python scripts/classify_provider_authority.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state=json.loads(Path("automation/provider-census-status.json").read_text(encoding="utf-8"))
          authority=json.loads(Path("automation/provider-authority-status.json").read_text(encoding="utf-8"))
          allowed={
              str(row.get("provider") or "").strip().lower()
              for row in authority.get("providers") or []
              if isinstance(row,dict)
              and row.get("repairEligible") is True
              and str(row.get("provider") or "").strip()
          }
          providers=sorted({
              str(row.get("provider") or "").strip().lower()
              for row in state.get("providers") or []
              if isinstance(row,dict)
              and row.get("brainCheckRequired") is True
              and str(row.get("provider") or "").strip().lower() in allowed
          })
          requested=set()
          direct=str(os.environ.get("DISPATCH_TARGET_PROVIDER") or "").strip().casefold().replace("_","-")
          if direct:
              requested.add(direct)
          elif str(os.environ.get("GITHUB_EVENT_NAME") or "")=="push":
              trigger_path=Path(".github/triggers/provider-recognition-repair-v6.json")
              if trigger_path.exists():
                  trigger=json.loads(trigger_path.read_text(encoding="utf-8"))
                  requested.update(
                      str(value or "").strip().casefold().replace("_","-")
                      for value in trigger.get("targetProviders") or []
                      if str(value or "").strip()
                  )
          if requested:
              providers=sorted(set(providers)&requested)
          Path("/tmp/repair-waf-targets.json").write_text(
              json.dumps({"providers":providers},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print(f"FIELD_REPAIR_WAF_SCOPE providers={len(providers)} ids={','.join(providers)}")
          PY
          python scripts/audit_provider_quick_yield_targeted.py             --providers-json /tmp/repair-waf-targets.json             --output /tmp/provider-repair-waf-network.json             --attempts 1
          python scripts/render_provider_census_status.py /tmp/provider-repair-waf-network.json             --output PROVIDER_CENSUS_STATUS.md             --json-output automation/provider-census-status.json             --history automation/provider-census-proof-history.json             --baseline-status automation/provider-census-status.json             --authority-status automation/provider-authority-status.json             --run-id "${GITHUB_RUN_ID}-repair-pre-waf"             --sha "$GITHUB_SHA"
          python scripts/probe_waf_browser_session.py             /tmp/provider-repair-waf-network.json             --output /tmp/provider-repair-waf-github.json             --attempts 2             --client-profile-matrix             --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*'             --status automation/provider-census-status.json             --overrides provider-overrides.json             --network-report /tmp/provider-repair-waf-network.json             --workers 3             --max-targets 32             --timeout 25             --virtual-time-ms 8000

      - name: Normalize optional Repair Tailscale tag
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' && env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${TS_TAG_NAME:-niakvio-ci}"
          case "$raw" in
            tag:*) normalized="$raw" ;;
            *) normalized="tag:$raw" ;;
          esac
          printf 'TS_ACTION_TAG=%s\n' "$normalized" >> "$GITHUB_ENV"

      - name: Connect optional Repair Tailscale transport
        id: repair_tailscale_connect
        continue-on-error: true
        timeout-minutes: 4
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' && env.TS_OAUTH_CLIENT_ID != '' && env.TS_AUDIENCE != '' && env.TS_EXIT_NODE != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: ${{ env.TS_ACTION_TAG }}
          version: '1.94.2'
          args: --accept-dns=false

      - name: Select optional Repair residential exit
        id: repair_residential_exit
        continue-on-error: true
        if: ${{ steps.repair_tailscale_connect.outcome == 'success' && env.TS_EXIT_NODE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo tailscale set --exit-node="$TS_EXIT_NODE" --exit-node-allow-lan-access=false >/dev/null 2>&1; then
              echo "NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE=1" >> "$GITHUB_ENV"
              echo "FIELD_REPAIR_TAILSCALE active=true"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "FIELD_REPAIR_TAILSCALE active=false reason=exit-node-offline-or-unavailable" >&2
          exit 1

      - name: Reprobe Repair WAF through optional residential exit
        id: repair_residential_probe
        continue-on-error: true
        if: ${{ steps.repair_residential_exit.outcome == 'success' && env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/provider-repair-waf-residential.json
          # Residential qualification is an enhancement, never the critical path.
          # Bound the whole browser/profile matrix so a slow exit node or a set of
          # hanging WAF targets cannot cancel/consume the canonical Repair slot.
          if timeout --signal=TERM --kill-after=10s 240s \
            python scripts/probe_waf_browser_session.py \
              /tmp/provider-repair-waf-github.json \
              --output /tmp/provider-repair-waf-residential.json \
              --attempts 1 \
              --client-profile-matrix \
              --okhttp-classpath 'tools/waf-okhttp-probe/target/classes:tools/waf-okhttp-probe/target/dependency/*' \
              --status automation/provider-census-status.json \
              --overrides provider-overrides.json \
              --network-report /tmp/provider-repair-waf-network.json \
              --workers 4 \
              --max-targets 16 \
              --timeout 20 \
              --virtual-time-ms 6000
          then
            echo "FIELD_REPAIR_RESIDENTIAL_PROBE bounded=true outcome=completed"
          else
            rc=$?
            rm -f /tmp/provider-repair-waf-residential.json
            echo "FIELD_REPAIR_RESIDENTIAL_PROBE bounded=true outcome=soft-fail rc=$rc"
            exit 0
          fi

      - name: Merge Repair WAF profiles with offline-safe Tailscale fallback
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/provider-repair-waf-residential.json ]; then
            python scripts/merge_waf_network_profiles.py               --baseline /tmp/provider-repair-waf-github.json               --residential /tmp/provider-repair-waf-residential.json               --output automation/provider-waf-browser-session-latest.json
          else
            reason="tailscale-not-configured"
            if [ -n "${TS_OAUTH_CLIENT_ID:-}" ] && [ -n "${TS_AUDIENCE:-}" ] && [ -n "${TS_EXIT_NODE:-}" ]; then
              reason="tailscale-offline-or-unavailable"
            fi
            if [ "${{ steps.repair_tailscale_connect.outcome }}" = "failure" ]; then
              reason="tailscale-connect-failed"
            elif [ "${{ steps.repair_residential_exit.outcome }}" = "failure" ]; then
              reason="exit-node-offline-or-unavailable"
            elif [ "${{ steps.repair_residential_probe.outcome }}" = "failure" ]; then
              reason="residential-probe-failed"
            fi
            python scripts/merge_waf_network_profiles.py               --baseline /tmp/provider-repair-waf-github.json               --unavailable-reason "$reason"               --output automation/provider-waf-browser-session-latest.json
            echo "FIELD_REPAIR_TAILSCALE_FALLBACK reason=$reason"
          fi

      - name: Replay Repair providers through residential exit when available
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' && env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_residential_provider_replay.py             --waf automation/provider-waf-browser-session-latest.json             --status automation/provider-census-status.json             --output /tmp/repair-residential-provider-replay-targets.json
          python - <<'PY'
          import json
          from pathlib import Path
          selected_path=Path("/tmp/repair-residential-provider-replay-targets.json")
          scope_path=Path("/tmp/repair-waf-targets.json")
          selected=json.loads(selected_path.read_text(encoding="utf-8"))
          scope=json.loads(scope_path.read_text(encoding="utf-8"))
          allowed={str(v or "").strip().casefold() for v in scope.get("providers") or [] if str(v or "").strip()}
          providers=sorted({
              str(v or "").strip().casefold()
              for v in selected.get("providers") or []
              if str(v or "").strip().casefold() in allowed
          })
          selected["providers"]=providers
          selected["providerCount"]=len(providers)
          selected_path.write_text(json.dumps(selected,indent=2)+"\n",encoding="utf-8")
          print(f"FIELD_REPAIR_RESIDENTIAL_REPLAY_SCOPE providers={len(providers)} ids={','.join(providers)}")
          PY
          count="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/repair-residential-provider-replay-targets.json').read_text())
          print(int(data.get('providerCount') or 0))
          PY
          )"
          if [ "$count" -gt 0 ]; then
            python scripts/audit_provider_quick_yield_targeted.py               --providers-json /tmp/repair-residential-provider-replay-targets.json               --output /tmp/provider-repair-residential-network-replay.json               --attempts 1
            python scripts/merge_residential_provider_replay.py               --waf automation/provider-waf-browser-session-latest.json               --replay /tmp/provider-repair-residential-network-replay.json               --output /tmp/provider-repair-waf-with-residential-replay.json
            mv /tmp/provider-repair-waf-with-residential-replay.json automation/provider-waf-browser-session-latest.json
          fi
          echo "FIELD_REPAIR_RESIDENTIAL_REPLAY providers=$count"

      - name: Clear optional Repair residential routing
        if: ${{ always() && steps.repair_waf_reuse.outputs.reuse != 'true' && env.NIAKVIO_REPAIR_RESIDENTIAL_EXIT_ACTIVE == '1' }}
        shell: bash
        run: sudo tailscale set --exit-node= || true

      - name: Merge Repair transport refresh into durable latest
        if: ${{ steps.repair_waf_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/provider-repair-waf-prior.json"
          current="automation/provider-waf-browser-session-latest.json"
          if [ -s "$prior" ] && [ -s "$current" ]; then
            python scripts/merge_waf_latest_evidence.py \
              --previous "$prior" \
              --current "$current" \
              --output /tmp/provider-repair-waf-latest-merged.json
            mv /tmp/provider-repair-waf-latest-merged.json "$current"
          fi

      - name: Apply integrated WAF qualification to Repair census
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_waf_census_transport.py             --status automation/provider-census-status.json             --waf automation/provider-waf-browser-session-latest.json             --authority-status automation/provider-authority-status.json             --output /tmp/provider-repair-census-waf.json             --run-id "${GITHUB_RUN_ID}-repair-waf"             --sha "$GITHUB_SHA"
