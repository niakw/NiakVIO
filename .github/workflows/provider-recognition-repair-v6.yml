name: LEARN/FORCE - Provider Recognition Repair V6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Same canonical pipeline; Learn is evidence-only, Force is explicit operator repair candidate
        required: true
        default: force
        type: choice
        options: [learn, force, repair]
      target_provider:
        description: Optional unresolved provider id; empty means all unresolved providers
        required: false
        default: ""
        type: string
      allow_upstream_positive_loss:
        description: Diagnostic only; never use for an accepted repair candidate
        required: false
        default: false
        type: boolean
  push:
    branches:
      - workbench/route-recognition-v6
      - main
    paths:
      - '.github/triggers/provider-recognition-repair-v6.json'
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: provider-recognition-repair-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recognition-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove one canonical Learn Force repair implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_provider_repair_pipeline_v6.py \
            scripts/upgrade_provider_repair_v6.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/audit_provider_repair_yield_v6.py \
            scripts/upgrade_provider_worker_route_proof_v1.py
          python tests/provider_repair_pipeline_v6_contract_test.py

      - name: Run canonical recognition and correction only for unresolved providers
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode || '' }}
          TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
          ALLOW_LOSS: ${{ inputs.allow_upstream_positive_loss || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=learn
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE=repair
          else
            MODE="${DISPATCH_MODE:-force}"
          fi
          args=(python scripts/run_provider_repair_pipeline_v6.py --mode "$MODE")
          if [ -n "$TARGET_PROVIDER" ]; then args+=(--provider "$TARGET_PROVIDER"); fi
          if [ "$ALLOW_LOSS" = "true" ]; then args+=(--allow-upstream-positive-loss); fi
          "${args[@]}"

      - name: Verify known-green providers were not network re-probed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s automation/provider-route-recovery-v6-targeted.json ]; then exit 0; fi
          python - <<'PY'
          import json
          skip=set((json.load(open('automation/provider-repair-skip.json')).get('providers') or {}).keys())
          report=json.load(open('automation/provider-route-recovery-v6-targeted.json'))
          tested={str(r.get('providerId','')).lower() for r in report.get('providers',[]) if isinstance(r,dict)}
          overlap=sorted(skip & tested)
          assert not overlap, overlap
          print(f'PROVIDER_REPAIR_SKIP_PROOF tested={len(tested)} skipped={len(skip)} overlap=0')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-recognition-repair-v6-${{ github.run_id }}
          path: |
            automation/provider-route-recovery-v6-targeted.json
            automation/provider-route-recovery-v6.json
            automation/provider-repair-yield-v6.json
            automation/provider-repair-v6-summary.json
            automation/provider-v3-static-knowledge.json
            provider-overrides.json
            PROVENANCE.json
            provider-bases/
            providers/
            manifest.json
            vf/manifest.json
            no-anime/manifest.json
            vf-no-anime/manifest.json
            provider-v3-materialization.json
          retention-days: 14
          if-no-files-found: warn
