          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"scripts"))
          from brain_llm_experiment import validate_public
          from import_external_brain_llm_guidance import canon,failed_llm_experiments
          source=Path(sys.argv[1]);destination=Path(sys.argv[2]);current_sha=sys.argv[3].strip().lower()
