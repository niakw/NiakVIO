name: TEMP - AniKotoTV AES v3 trace

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-anikototv-aes-v3-trace.yml]

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/labs-5.21.44-20260912}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Stage V3 and trace worker
        run: |
          set -euo pipefail
          python3 scripts/upgrade_anikototv_megaplay_runtime_v2.py
          python3 scripts/upgrade_anikototv_megaplay_aes_v3.py
          python3 scripts/materialize_provider_v3_one.py anikototv
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          f={'tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1}
          path=p.local_catalog()['anikototv']['path']
          cp=subprocess.run(['node','scripts/provider_worker.cjs',str(path),json.dumps(f,separators=(',',':')),json.dumps(p.context_for(f),separators=(',',':'))],capture_output=True,text=True,timeout=75)
          payload={}
          for line in cp.stdout.splitlines():
            if line.startswith('NUVIO_HEALTH_RESULT='):payload=json.loads(line.split('=',1)[1])
          obs=[]
          for x in payload.get('network_observations') or []:
            if isinstance(x,dict):obs.append({k:x.get(k) for k in ['stage','host','method','path_pattern','status','ok','error_code']})
          print('ANIKOTOTV_AES_V3_TRACE '+json.dumps({'streams':payload.get('stream_count'),'raw':payload.get('raw_stream_count'),'hosts':payload.get('provider_server_hosts'),'statuses':payload.get('provider_server_http_statuses'),'error':payload.get('error_details'),'observations':obs[:100]},separators=(',',':')))
          PY
      - name: Validate current AES envelope independently with Node crypto
        run: |
          node <<'JS'
          const crypto=require('node:crypto');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36';
          const H=(ref,xhr=false)=>({'User-Agent':UA,'Accept':'application/json,text/html,*/*',...(ref?{Referer:ref}:{}),...(xhr?{'X-Requested-With':'XMLHttpRequest'}:{})});
          async function text(url,ref,xhr=false){const r=await fetch(url,{headers:H(ref,xhr),redirect:'follow'});if(!r.ok)throw new Error(`${r.status} ${url}`);return {body:await r.text(),url:r.url,status:r.status}}
          const s=await text('https://anikototv.to/ajax/anime/search?keyword=death%20note','https://anikototv.to/',true);
          const sh=JSON.parse(s.body)?.result?.html||'';
          const series=(sh.match(/href=["'](https:\/\/anikototv\.to\/watch\/death-note-fc8mq)["']/i)||[])[1]||'https://anikototv.to/watch/death-note-fc8mq';
          const w=await text(series,'https://anikototv.to/');
          const aid=(w.body.match(/id=["']watch-main["'][^>]*data-id=["']([^"']+)/i)||w.body.match(/data-id=["']([^"']+)["'][^>]*id=["']watch-main["']/i)||[])[1];
          const e=await text(`https://anikototv.to/ajax/episode/list/${encodeURIComponent(aid)}`,w.url,true);
          const eh=JSON.parse(e.body)?.result||''; const blocks=eh.match(/<a\b[^>]*>[\s\S]*?<\/a>/gi)||[];
          const block=blocks.find(x=>/data-num=["']1["']/i.test(x))||blocks[0]||'';
          const ids=(block.match(/data-ids=["']([^"']+)/i)||block.match(/data-(?:ep-id|id)=["']([^"']+)/i)||[])[1];
          const sl=await text(`https://anikototv.to/ajax/server/list?servers=${encodeURIComponent(ids)}`,w.url,true);
          const slh=JSON.parse(sl.body)?.result||''; const link=(slh.match(/data-link-id=["']([^"']+)/i)||slh.match(/data-id=["']([^"']+)/i)||[])[1];
          const sr=await text(`https://anikototv.to/ajax/server?get=${encodeURIComponent(link)}`,w.url,true);
          let rr=JSON.parse(sr.body)?.result; if(typeof rr==='string'){try{rr=JSON.parse(rr)}catch{}}
          const player=rr?.url||rr?.file||rr?.src||'';
          const pg=await text(player,w.url,false); const fid=(pg.body.match(/<title[^>]*>\s*File\s+(\d+)\s*-\s*MegaPlay/i)||[])[1];
          const gs=await text(`https://megaplay.buzz/stream/getSources?id=${encodeURIComponent(fid)}`,player,true); const d=JSON.parse(gs.body); const enc=String(d.enc||'');
          const b64=enc.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-enc.length%4)%4); const cipher=Buffer.from(b64,'base64');
          const key=Buffer.alloc(32); Buffer.from("i?LMTAx0Q6,:}50U",'utf8').copy(key); const iv=Buffer.from("W0;27ToaUpl_P%'c",'utf8');
          let decoded='',file='';
          try{const dec=crypto.createDecipheriv('aes-256-cbc',key,iv);decoded=Buffer.concat([dec.update(cipher),dec.final()]).toString('utf8');const j=JSON.parse(decoded);file=j?.file||j?.[0]?.file||'';}catch(e){console.log('ANIKOTO_AES_DIRECT '+JSON.stringify({decrypt:false,error:e.name+': '+e.message.slice(0,120),encBytes:cipher.length}));process.exit(0)}
          const u=new URL(file); let probe={};
          try{const r=await fetch(file,{headers:H('https://megaplay.buzz/'),redirect:'follow'});const ab=Buffer.from(await r.arrayBuffer());probe={status:r.status,contentType:r.headers.get('content-type')||'',bytes:ab.length,extm3u:ab.subarray(0,16).toString().includes('#EXTM3U'),finalHost:new URL(r.url).host};}catch(e){probe={error:e.name+': '+e.message.slice(0,120)}}
          console.log('ANIKOTO_AES_DIRECT '+JSON.stringify({decrypt:true,fileHost:u.host,filePath:u.pathname,isHls:u.pathname.toLowerCase().includes('.m3u8'),probe}));
          JS
