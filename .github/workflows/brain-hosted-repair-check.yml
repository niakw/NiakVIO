name: Brain - Hosted single-provider repair check

on:
  push:
    branches: [main]
    paths: [.github/workflows/brain-hosted-repair-check.yml, scripts/select_brain_hosted_representative.py]
  workflow_dispatch:
    inputs:
      provider:
        description: One representative provider, evaluated in an isolated sandbox
        type: choice
        options: [allanime, animekai, uhdmovies, mallumv]
        default: allanime
      replay_evidence:
        description: Optional archived run ID to reverify its proposal without inference
        type: string
        default: ''
      reader_user_agent_probe:
        description: Compare one failed reader request with a previously successful HTML User-Agent
        type: boolean
        default: false
      observed_media_probe:
        description: Sample one observed but unrequested media source after a failed long-form fixture
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repair-check:
    # Only current main and local loopback Qwen inference; no paid API or provider writes.
    if: ${{ github.repository == 'niakw/NiakVIO' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANUAL_PROVIDER: ${{ inputs.provider || '' }}
      # An explicit archive replays its exact original proposal without inference.
      REPLAY_EVIDENCE: ${{ inputs.replay_evidence || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose an evidence-based representative, not a repeatedly failed default
        id: representative
        shell: bash
        run: |
          set -euo pipefail
          python tests/brain_hosted_representative_selection_test.py
          python scripts/select_brain_hosted_representative.py \
            --census automation/provider-census-status.json \
            --evidence-dir automation/hosted-repair-evidence \
            --manual "$MANUAL_PROVIDER" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Pin current Brain-LLM source for this exact repair run
        id: brain_pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/niakw/NiakVIO-Brain-LLM.git refs/heads/main | awk 'NR==1{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Brain main SHA unavailable" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "BRAIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "FIELD_BRAIN_HOSTED_PIN sha=$sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO-Brain-LLM
          ref: ${{ steps.brain_pin.outputs.sha }}
          path: brain-llm
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare public-only context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C brain-llm rev-parse HEAD)" = "$BRAIN_SHA"
          npm ci --ignore-scripts
          node tests/media_observation.test.cjs
          node tests/http_response_observation_test.cjs
          node tests/reader_user_agent_probe_test.cjs
          node tests/observed_media_probe_test.cjs
          python tests/observed_media_evidence_test.py
          python tests/http_response_evidence_test.py
          node tests/response_structure_test.cjs
          node tests/address_reference_test.cjs
          python tests/player_address_correlation_test.py
          python tests/player_markup_evidence_test.py
          python -m pip install -e brain-llm
          mkdir -p local-output/hosted-check
          python brain-llm/scripts/import_public_niakvio.py --niakvio-root . --output local-output/hosted-check/experience.jsonl
          python brain-llm/scripts/import_public_docs.py --niakvio-root . --config brain-llm/config/document_sources.json --output local-output/hosted-check/documents.jsonl
      - name: Validate existing local-Brain sandbox and identity contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/hosted_brain_repair_loop_test.py
          python tests/brain_llm_force_candidate_sandbox_test.py
          python tests/brain_hosted_local_proof_workflow_test.py
          # Pin and run the Brain retry-selection guard before expensive inference.
          python -m unittest discover -s brain-llm/tests -p test_force_rejected_unit_diversification.py
          echo "FIELD_BRAIN_GRAPHQL_CAUSAL_PREFLIGHT exact_unit_selection=true"
          python -m unittest discover -s brain-llm/tests -p test_live_function_context.py
          python brain-llm/tests/test_force_cpu_tight_prompt.py

      - name: Download pinned local llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .brain-local/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11140/llama-b11140-bin-ubuntu-x64.tar.gz \
            -o "$RUNNER_TEMP/llama-b11140.tar.gz"
          printf '%s  %s\n' \
            '460c45fa8a9ebc36c9b08e3a15c06dbdbeb312c6308599521c84d9e7f92a268b' \
            "$RUNNER_TEMP/llama-b11140.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama-b11140.tar.gz" -C .brain-local/llama
          test -n "$(find .brain-local/llama -type f -name llama-server -print -quit)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: qwen25-coder-3b-q4-km-v1

      - name: Start local 3B Qwen provider-mutation planner
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find .brain-local/llama -type f -name llama-server -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" -hf Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 --port 8080 -c 8192 -np 1 \
            > "$RUNNER_TEMP/brain-hosted-llama.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "FIELD_BRAIN_HOSTED_LOCAL_QWEN ready=true"
              exit 0
            fi
            sleep 2
          done
          echo "FIELD_BRAIN_HOSTED_LOCAL_QWEN ready=false" >&2
          tail -50 "$RUNNER_TEMP/brain-hosted-llama.log" >&2
          exit 1

      - name: Prove local model can generate before repair
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          body = {
              "model": "niakvio-local",
              "temperature": 0,
              "max_tokens": 16,
              "messages": [{"role": "user", "content": "Reply with the word OK."}],
          }
          start = time.monotonic()
          req = Request("http://127.0.0.1:8080/v1/chat/completions",
                        data=json.dumps(body).encode("utf-8"),
                        headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urlopen(req, timeout=90) as response:
                  result = json.load(response)
              choices = result.get("choices") or []
              answer = choices[0].get("message", {}).get("content") if choices else None
              if not isinstance(answer, str) or not answer.strip():
                  raise ValueError("empty completion")
              timing = result.get("timings") or {}
              prompt_tokens = timing.get("prompt_n")
              predicted = timing.get("predicted_n")
              print("FIELD_BRAIN_LOCAL_SMOKE generated=true"
                    f" seconds={time.monotonic()-start:.2f}"
                    f" prompt_tokens={prompt_tokens if type(prompt_tokens) is int else 'unknown'}"
                    f" output_tokens={predicted if type(predicted) is int else 'unknown'}")
          except Exception as error:
              print("FIELD_BRAIN_LOCAL_SMOKE generated=false"
                    f" error_type={type(error).__name__}")
              raise
          PY

      - name: Observe current provider execution before choosing editable functions
        id: live_observation
        timeout-minutes: 5
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        shell: bash
        run: |
          python scripts/capture_brain_live_context.py --provider "$TARGET_PROVIDER" --output local-output/hosted-check/live-context.json
      - name: Summarize bounded GraphQL evidence (no payloads)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data=json.loads(Path('local-output/hosted-check/live-context.json').read_text(encoding='utf-8'))
          rows=[row for row in data.get('network_evidence') or [] if isinstance(row,dict)]
          facts=[row['response_structure']['graphql'] for row in rows
                 if isinstance(row.get('response_structure'),dict)
                 and isinstance(row['response_structure'].get('graphql'),dict)]
          kinds=Counter(kind for row in facts for kind in row.get('kinds') or []
                        if kind in {'schema_mismatch','syntax','auth','rate_limit',
                                    'timeout','not_found','server_error','unknown'})
          nulls=sum(1 for row in facts if row.get('dataState')=='null'
                    or row.get('nullRoots'))
          print('FIELD_BRAIN_GRAPHQL_OBSERVATION events='+str(len(facts))
                +' with_errors='+str(sum(1 for row in facts if row.get('errorCount',0)>0))
                +' null_data='+str(nulls)
                +' classes='+','.join(k+':'+str(v) for k,v in sorted(kinds.items())))
          PY

      - name: Diagnose a script-only response with an ordinary browser
        if: steps.live_observation.outputs.script_shell_only == 'true'
        timeout-minutes: 1
        run: python scripts/observe_brain_browser_context.py --live-context local-output/hosted-check/live-context.json
      - name: Recheck transient missing content once after the browser observation
        if: steps.live_observation.outputs.script_shell_only == 'true'
        timeout-minutes: 5
        run: python scripts/capture_brain_live_context.py --provider "$TARGET_PROVIDER" --output local-output/hosted-check/live-context.json --recheck-script-shell
      - name: Run bounded hosted repair and verification loop
        timeout-minutes: 19
        env:
          NIAKVIO_OBSERVED_MEDIA_PROBE: ${{ inputs.observed_media_probe && '1' || '0' }}
          NIAKVIO_READER_UA_PROBE: ${{ inputs.reader_user_agent_probe && '1' || '0' }}
          NIAKVIO_REQUIRE_DECODE_PROOF: '1'
          NIAKVIO_FORCE_CPU_TIGHT_PROMPT: '1'
          NIAKVIO_FORCE_CPU_LONG_CALL: '1'
          NIAKVIO_FORCE_CPU_OUTPUT_BUDGET: '1'
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        shell: bash
        run: |
          args=()
          if [ -n "$REPLAY_EVIDENCE" ]; then
            [[ "$REPLAY_EVIDENCE" =~ ^[0-9]+$ ]] || exit 1
            args+=(--replay-mutations "automation/hosted-repair-evidence/${REPLAY_EVIDENCE}-mutations.json")
          fi
          python scripts/run_hosted_brain_repair_loop.py --brain-root brain-llm \
            --provider "$TARGET_PROVIDER" --output local-output/hosted-check \
            --max-attempts 2 --budget-seconds 900 --endpoint http://127.0.0.1:8080 "${args[@]}"
      - name: Report generation and verification separately
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path('local-output/hosted-check')
          def read(name):
              path = root / name
              return json.loads(path.read_text()) if path.is_file() else {}
          diagnostics = read('diagnostics.json')
          evaluation = read('evaluation.json')
          trace = [event for row in diagnostics.get('rows', []) for event in row.get('scopeTrace', [])]
          safe = lambda value: re.sub(r'[^a-zA-Z0-9._:-]', '_', str(value))[:120]
          summary = {
              'provider': os.environ['TARGET_PROVIDER'],
              'sourceNiakvioSha': os.environ['GITHUB_SHA'],
              'sourceBrainLlmSha': read('mutations.json').get('brainLlmSha') or os.environ['BRAIN_SHA'],
              'generationReported': bool(diagnostics) and not os.environ.get('REPLAY_EVIDENCE') and read('live-context.json').get('http_script_shell_only') is not True,
              'replayedEvidence': safe(os.environ.get('REPLAY_EVIDENCE', '')),
              'browserObservation': read('live-context.json').get('browser_observation') or {},
              'scriptShellRecheckPerformed': read('live-context.json').get('script_shell_recheck_performed') is True,
              'synthesisPausedForMissingEvidence': read('live-context.json').get('http_script_shell_only') is True,
              'candidateCount': int(evaluation.get('candidateCount') or 0),
              'acceptedProviderCount': int(evaluation.get('acceptedProviderCount') or 0),
              'scopeTrace': [{key: safe(row.get(key, '')) for key in ('scope', 'outcome', 'reason', 'errorType')} for row in trace],
              'verification': [{
                  'accepted': row.get('accepted') is True,
                  'executionObserved': row.get('executionObserved') is True,
                  'materializedMutationObserved': row.get('materializedMutationObserved') is True,
                  'reason': safe(row.get('reason', '')),
              } for row in evaluation.get('rows', [])],
              'publicationAuthority': False,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          line = f"provider={summary['provider']} candidates={summary['candidateCount']} accepted={summary['acceptedProviderCount']}"
          reasons = ','.join(safe(row.get('reason', '')) for row in trace)
          print(f'::notice title=Hosted repair check::{line} generation_reasons={reasons or "none"}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      - name: Require executed, materialized and decoded provider repair evidence
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('local-output/hosted-check')
          path=root/'evaluation.json'
          if not path.is_file():
              raise SystemExit('FIELD_BRAIN_HOSTED_PROOF status=missing-evaluation')
          data=json.loads(path.read_text(encoding='utf-8'))
          rows=[row for row in data.get('rows') or [] if isinstance(row,dict)]
          accepted=[row for row in rows if row.get('accepted') is True]
          provider=os.environ.get('TARGET_PROVIDER','')
          verified=(
              data.get('publicationAuthority') is False
              and data.get('acceptedProviderCount')==1
              and len(accepted)==1
              and accepted[0].get('provider')==provider
              and accepted[0].get('executionObserved') is True
              and accepted[0].get('materializedMutationObserved') is True
              and accepted[0].get('decodedProofRequired') is True
              and len(accepted[0].get('improvedFixtures') or [])>0
              and (accepted[0].get('candidate') or {}).get('streamsPlayable',0)>0
          )
          print(
              'FIELD_BRAIN_HOSTED_PROOF provider='+provider
              +' status='+('sandbox-validated' if verified else 'not-validated')
              +' candidates='+str(data.get('candidateCount',0))
              +' accepted='+str(data.get('acceptedProviderCount',0))
              +' remaining_fixture_debt='+str(len(accepted[0].get('unresolvedFixtures') or []) if accepted else 0)
              +' source='+str(data.get('currentSha',''))
          )
          if not verified:
              raise SystemExit('No strictly decoded, materialized Brain repair proved; production unchanged')
          PY
      - name: Retain bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-repair-check-${{ github.run_id }}
          retention-days: 14
          path: |
            local-output/hosted-check/summary.json
            local-output/hosted-check/diagnostics.json
            local-output/hosted-check/evaluation.json
            local-output/hosted-check/force-memory.json
            local-output/hosted-check/live-context.json
            local-output/hosted-check/mutations.json
