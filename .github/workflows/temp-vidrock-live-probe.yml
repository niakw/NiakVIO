name: TEMP - VidRock Live Probe
# retry: encrypted-api-contract

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-vidrock-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Probe encrypted movie and TV APIs
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const crypto = require('crypto');
          const passphrase = 'x7k9mPqT2rWvY8zA5bC3nF6hJ2lK4mN9';
          const key = Buffer.from(passphrase, 'utf8');
          const iv = key.subarray(0,16);
          const headers = {
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145.0.0.0 Safari/537.36',
            'referer':'https://vidrock.net/',
            'origin':'https://vidrock.net',
            'accept':'application/json,text/plain,*/*'
          };
          function enc(plain){
            const cipher=crypto.createCipheriv('aes-256-cbc',key,iv);
            const raw=Buffer.concat([cipher.update(Buffer.from(plain,'utf8')),cipher.final()]);
            return raw.toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
          }
          async function fetchText(url, opts={}){
            const started=Date.now();
            try{
              const r=await fetch(url,{redirect:'follow',...opts});
              const text=await r.text();
              return {ok:r.ok,status:r.status,url:r.url,ct:r.headers.get('content-type')||'',ms:Date.now()-started,text};
            }catch(e){return {ok:false,status:0,url,ct:'',ms:Date.now()-started,text:'',error:String(e)}}
          }
          function compactJson(text){
            try{
              const j=JSON.parse(text);
              const out={type:Array.isArray(j)?'array':'object'};
              if(Array.isArray(j)) out.length=j.length;
              else {
                out.keys=Object.keys(j).slice(0,20);
                out.servers=Object.entries(j).slice(0,12).map(([name,v])=>({name,url:v&&typeof v==='object'?String(v.url||'').slice(0,220):''}));
              }
              return out;
            }catch(e){return {type:'non-json',preview:text.slice(0,300)}}
          }
          (async()=>{
            const fixtures=[
              {name:'movie',plain:'157336',kind:'movie'},
              {name:'tv',plain:'1396_1_1',kind:'tv'}
            ];
            let useful=0;
            for(const f of fixtures){
              const token=enc(f.plain);
              const url=`https://vidrock.net/api/${f.kind}/${token}`;
              const res=await fetchText(url,{headers});
              const summary=compactJson(res.text);
              console.log('VIDROCK_API '+JSON.stringify({fixture:f.name,tokenLength:token.length,status:res.status,finalUrl:res.url,ct:res.ct,ms:res.ms,error:res.error||null,summary}));
              if(res.ok && summary.type==='object' && Array.isArray(summary.servers) && summary.servers.some(x=>x.url)){
                useful++;
                const first=summary.servers.find(x=>x.url)?.url;
                if(first){
                  const atlas=summary.servers.find(x=>/atlas/i.test(x.name)&&x.url)?.url;
                  for(const [label,target] of [['first',first],['atlas',atlas]]){
                    if(!target) continue;
                    const probe=await fetchText(target,{headers});
                    console.log('VIDROCK_SERVER '+JSON.stringify({fixture:f.name,label,target:target.slice(0,220),status:probe.status,finalUrl:probe.url,ct:probe.ct,ms:probe.ms,error:probe.error||null,bodyPreview:probe.text.slice(0,220)}));
                  }
                }
              }
            }
            if(useful===0){
              console.error('VIDROCK_ENCRYPTED_API_NO_USEFUL_JSON');
              process.exit(2);
            }
            console.log(`VIDROCK_ENCRYPTED_API_OK usefulFixtures=${useful}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
