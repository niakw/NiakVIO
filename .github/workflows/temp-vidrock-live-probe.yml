name: TEMP - Proof Invalidation Verification
# reuse registered temporary workflow

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-vidrock-live-probe.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: workbench/hub-matrix-46-20260911
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch and validate proof invalidation contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temp_patch_proof_invalidation.py
          python -m py_compile scripts/check_provider_non_regression_v1.py tests/provider_proof_invalidation_contract_test.py
          python tests/provider_proof_invalidation_contract_test.py
          python scripts/check_provider_non_regression_v1.py --candidate-gate --all --base-ref main
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-non-regression-gate.json').read_text(encoding='utf-8'))
          assert d.get('passed') is True, d.get('failures')
          a=d['obligations']['allwish']
          assert a['proofInvalidationApplied'] is True, a
          assert a['invalidatedVerifiedLanes']==['movie','tv'], a
          assert a['providerPositiveInvalidated'] is True, a
          assert a['requiredVerifiedLanes']==[], a
          print('ALLWISH_NON_REGRESSION_INVALIDATION_OK required=0 false_positive_not_restored=1')
          PY
      - name: Commit verified gate correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_provider_non_regression_v1.py automation/provider-non-regression-gate.json
          if git diff --cached --quiet; then
            echo 'PROOF_INVALIDATION_GATE_NO_DIFF'
          else
            git commit -m 'fix(gate): honor audited invalidation of false-positive proof'
            git push origin HEAD:workbench/hub-matrix-46-20260911
          fi
