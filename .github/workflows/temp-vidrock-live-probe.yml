name: TEMP - VidRock Live Probe
# retry: current-plain-id-api

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-vidrock-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Probe current movie and TV APIs
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36',
            'referer':'https://vidrock.net/',
            'origin':'https://vidrock.net',
            'accept':'application/json,text/plain,*/*'
          };
          async function fetchText(url){
            const t=Date.now();
            try{const r=await fetch(url,{headers,redirect:'follow'}); return {ok:r.ok,status:r.status,url:r.url,ct:r.headers.get('content-type')||'',ms:Date.now()-t,text:await r.text()};}
            catch(e){return {ok:false,status:0,url,ct:'',ms:Date.now()-t,text:'',error:String(e)}}
          }
          function summarize(text){
            try{
              const j=JSON.parse(text); const keys=Object.keys(j);
              return {kind:Array.isArray(j)?'array':'object',keys:keys.slice(0,20),entries:keys.slice(0,12).map(k=>({name:k,urlType:typeof(j[k]&&j[k].url),urlLength:String(j[k]&&j[k].url||'').length,urlPrefix:String(j[k]&&j[k].url||'').slice(0,28)})),error:j.error||null};
            }catch(e){return {kind:'non-json',preview:text.slice(0,240)}}
          }
          (async()=>{
            const urls=[
              ['movie','https://vidrock.net/api/movie/157336'],
              ['tv','https://vidrock.net/api/tv/1396/1/1'],
              ['movie-ru','https://vidrock.ru/api/movie/157336'],
              ['tv-ru','https://vidrock.ru/api/tv/1396/1/1']
            ];
            let jsonCount=0;
            for(const [fixture,url] of urls){
              const r=await fetchText(url); const s=summarize(r.text);
              console.log('VIDROCK_CURRENT_API '+JSON.stringify({fixture,status:r.status,finalUrl:r.url,ct:r.ct,ms:r.ms,error:r.error||null,summary:s}));
              if(r.ok&&s.kind==='object'&&s.entries&&s.entries.some(x=>x.urlLength>0)) jsonCount++;
            }
            console.log(`VIDROCK_CURRENT_API_PROBE complete usefulJson=${jsonCount}`);
            if(jsonCount===0) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
