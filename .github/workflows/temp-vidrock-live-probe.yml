name: TEMP - VidRock Live Probe
# retry: aes-gcm-live-stream

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-vidrock-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Probe current API, decrypt tokens and validate HLS
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const crypto=require('crypto');
          const key=Buffer.from('7f3e9c2a8b5d1f4e6a9c3b7d2e5f8a1c4b6d9e2f5a8c1b4d7e9f2a5c8b1d4e7f','hex');
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36',
            'referer':'https://vidrock.net/',
            'origin':'https://vidrock.net',
            'accept':'application/json,text/plain,*/*'
          };
          function decode(token){
            const raw=Buffer.from(String(token).replace(/-/g,'+').replace(/_/g,'/'),'base64');
            if(raw.length<=28) throw new Error('token-too-short');
            const iv=raw.subarray(0,12), tag=raw.subarray(raw.length-16), ct=raw.subarray(12,raw.length-16);
            const d=crypto.createDecipheriv('aes-256-gcm',key,iv); d.setAuthTag(tag);
            return Buffer.concat([d.update(ct),d.final()]).toString('utf8');
          }
          async function get(url){
            const started=Date.now();
            try{const r=await fetch(url,{headers,redirect:'follow'});const text=await r.text();return {ok:r.ok,status:r.status,url:r.url,ct:r.headers.get('content-type')||'',ms:Date.now()-started,text};}
            catch(e){return {ok:false,status:0,url,ct:'',ms:Date.now()-started,text:'',error:String(e)}}
          }
          (async()=>{
            const fixtures=[['movie','https://vidrock.ru/api/movie/157336'],['tv','https://vidrock.ru/api/tv/1396/1/1']];
            let apiOk=0, decryptOk=0, hlsOk=0;
            for(const [fixture,url] of fixtures){
              const res=await get(url); let data=null;
              try{data=JSON.parse(res.text)}catch(_e){}
              const names=data&&typeof data==='object'?Object.keys(data):[];
              console.log('VIDROCK_API '+JSON.stringify({fixture,status:res.status,ct:res.ct,ms:res.ms,servers:names}));
              if(!res.ok||!data) continue; apiOk++;
              for(const name of names){
                const token=data[name]&&typeof data[name].url==='string'?data[name].url:'';
                if(!token) continue;
                try{
                  const media=decode(token);
                  decryptOk++;
                  const probe=await get(media);
                  const hls=probe.ok && /^#EXTM3U/m.test(probe.text);
                  if(hls) hlsOk++;
                  console.log('VIDROCK_STREAM '+JSON.stringify({fixture,server:name,decrypted:true,scheme:/^https?:\/\//.test(media),mediaHost:(()=>{try{return new URL(media).host}catch(_e){return ''}})(),status:probe.status,ct:probe.ct,hls,preview:probe.text.slice(0,80)}));
                  if(hls) break;
                }catch(e){
                  console.log('VIDROCK_STREAM '+JSON.stringify({fixture,server:name,decrypted:false,error:String(e)}));
                }
              }
            }
            console.log(`VIDROCK_AES_GCM_LIVE api=${apiOk} decrypted=${decryptOk} hls=${hlsOk}`);
            if(apiOk!==2||decryptOk<2||hlsOk<2) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
