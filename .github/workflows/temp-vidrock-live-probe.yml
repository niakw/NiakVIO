name: TEMP - AniDB Runtime Integration
# retry: static-authority-migrated

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-vidrock-live-probe.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prove deterministic AniDB runtime
        run: python tests/anidb_runtime_v1_test.py
      - name: Migrate AniDB DATA and materialize one provider
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_anidb_runtime_v1.py
          python scripts/materialize_provider_v3_one.py anidb
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in m['scrapers'] if str(x.get('id','')).casefold()=='anidb')
          text=Path(row['filename']).read_text(encoding='utf-8')
          o=json.loads(Path('provider-overrides.json').read_text(encoding='utf-8'))
          k=json.loads(Path('automation/provider-v3-static-knowledge.json').read_text(encoding='utf-8'))
          p=o['provider_patches']['anidb']; model=k['providers']['anidb']['model']
          assert row.get('enabled') is True
          assert 'NIAKVIO_ANIDB_RUNTIME_V1' in text
          assert p['official_site']=='https://anidb.app'
          assert model['officialSite']=='https://anidb.app' and model['knownSite']=='https://anidb.app'
          assert p.get('runtime_domain_replacements')=={}
          assert 'scripts/provider_patches/anidb_runtime_v1.py' in p.get('provider_lego_scripts',[])
          print('ANIDB_MATERIALIZED_OK enabled=1 site=anidb.app static_authority=anidb.app lego=1 stale_runtime_redirect=0')
          PY
      - name: Run structural gates
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_v3_strategy_plan_contract_test.py
          python scripts/check_provider_non_regression_v1.py --candidate-gate --all --base-ref main
          python scripts/validate_activation_preservation.py
          python scripts/provider_base_store.py validate
      - name: Probe current AniDB frontend chain
        run: python scripts/probe_anidb_live.py
      - name: Commit verified integration and clean harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/install_anidb_runtime_v1.py scripts/probe_anidb_live.py .github/workflows/temp-vidrock-live-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(provider): integrate current AniDB frontend runtime'
          git push origin HEAD:workbench/hub-matrix-46-20260911
