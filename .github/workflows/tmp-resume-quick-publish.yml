name: RESUME - QUICK publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-resume-quick-publish.yml'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: nuvio-provider-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: RESUME - QUICK - Publish validated transaction
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: RESUME - Announce source transaction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "RESUME_QUICK_PUBLISH_START run=${GITHUB_RUN_ID} source_run=32745430988 source_artifact=nuvio-validation-stage-32745430988 head=${GITHUB_SHA}"

      - name: RESUME - Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: RESUME - Capture current published manifest baseline
        shell: bash
        run: |
          set -euo pipefail
          NUVIO_PUBLISHED_MANIFEST_BASELINE="$RUNNER_TEMP/published-manifest.json"
          echo "NUVIO_PUBLISHED_MANIFEST_BASELINE=$NUVIO_PUBLISHED_MANIFEST_BASELINE" >> "$GITHUB_ENV"
          git show HEAD:manifest.json > "$NUVIO_PUBLISHED_MANIFEST_BASELINE"

      - name: RESUME - Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: RESUME - Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: RESUME - Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: RESUME - Download validated Quick stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuvio-validation-stage-32745430988
          path: checked-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32745430988

      - name: RESUME - Validate downloaded transaction structure
        shell: bash
        run: |
          set -euo pipefail
          test -s checked-artifact/provider-overrides.json
          test -s checked-artifact/provider-domain-history.json
          test -s checked-artifact/staging/candidates.json
          test -s checked-artifact/staging/upstream-lkg-pending.json
          test -s checked-artifact/health-output/health-results.json
          test -s checked-artifact/health-output/repair-report.json
          test -s checked-artifact/health-output/dns-preflight-report.json
          test -s checked-artifact/health-output/provider-hub-report.json
          echo 'FIELD_RESUME_SOURCE run=32745430988 mode=quick artifact=nuvio-validation-stage-32745430988'

      - name: RESUME - Restore validated routing state
        shell: bash
        run: |
          set -euo pipefail
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py

      - name: RESUME - Promote only proven Quick candidates
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_refresh_candidates.py

      - name: RESUME - Finalize upstream last-known-good snapshots
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_upstream_lkg.py \
            --pending checked-artifact/staging/upstream-lkg-pending.json \
            --keep-generations 2

      - name: RESUME - Prune stale bundles and validate overrides
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prune_unreferenced_providers.py
          python scripts/validate_published_overrides.py

      - name: RESUME - Restore validated Quick reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          cp checked-artifact/health-output/repair-report.json repair-report.json

      - name: RESUME - Build canonical publication transaction
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.next.json
          mv manifest.next.json manifest.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$NUVIO_PUBLISHED_MANIFEST_BASELINE"
          python scripts/activation_preservation_core_rehash.py
          python scripts/validate_language_projection.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs \
            --general manifest.json \
            --vf vf/manifest.json \
            --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general manifest.json \
            --vf vf/manifest.json
          node engine_v2/tests/provider-catalog.test.mjs
          python scripts/release_evidence_fence.py fingerprint \
            --manifest manifest.json \
            --root . \
            --output /tmp/release-generation.json

      - name: RESUME - Audit content identity and media
        env:
          NUVIO_CATALOGUE_AUDIT_OUTPUT: /tmp/catalogue-media-audit.json
          NUVIO_CATALOGUE_AUDIT_WORKERS: '8'
          NUVIO_CATALOGUE_AUDIT_TIMEOUT: '60'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/audit_catalogue_identity_media.py
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            python scripts/quarantine_catalogue_audit_failures.py \
              --audit /tmp/catalogue-media-audit.json \
              --evidence /tmp/release-generation.json \
              --workflow-run-id "${{ github.run_id }}" \
              --tested-commit-sha "${{ github.sha }}"
          fi
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py \
            --manifest manifest.json \
            --previous "$NUVIO_PUBLISHED_MANIFEST_BASELINE"
          python scripts/activation_preservation_core_rehash.py
          python scripts/validate_language_projection.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs \
            --general manifest.json \
            --vf vf/manifest.json \
            --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs \
            --catalog provider_catalog.json \
            --general manifest.json \
            --vf vf/manifest.json
          node engine_v2/tests/provider-catalog.test.mjs
          python scripts/release_evidence_fence.py fingerprint \
            --manifest manifest.json \
            --root . \
            --output /tmp/release-generation.json

      - name: RESUME - Upload catalogue audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalogue-media-audit-resume-${{ github.run_id }}
          path: /tmp/catalogue-media-audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: RESUME - Measure Interstellar real coverage
        continue-on-error: true
        run: |
          python scripts/interstellar_nuvio_matrix.py \
            --workers 8 \
            --timeout 90 \
            --minimum-automatic 0 \
            --output /tmp/interstellar-nuvio-matrix.json

      - name: RESUME - Upload real coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: interstellar-real-coverage-resume-${{ github.run_id }}
          path: /tmp/interstellar-nuvio-matrix.json
          retention-days: 7
          if-no-files-found: warn

      - name: RESUME - Publish atomic ARCHI2 transaction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_evidence_fence.py validate \
            --manifest manifest.json \
            --root . \
            --evidence /tmp/release-generation.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          node engine_v2/tests/provider-catalog.test.mjs

          git add manifest.json vf/manifest.json provider_catalog.json \
            package.json package-lock.json sources.json nuvio-client-id-state.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json \
            PROVENANCE.json provider-overrides.json provider-domain-history.json \
            upstream-lkg.json upstream-lkg/ health-report.json health-history.json \
            dns-preflight-report.json provider-hub-report.json diagnostics-report.json \
            diagnostics-report.html route-regressions.json repair-report.json
          git add -A providers

          if git diff --cached --quiet; then
            echo 'No validated provider change.'
          else
            git commit -m 'chore: publish validated ARCHI2 provider transaction'
            git reset --hard HEAD
            git clean -fdx
            git fetch origin main
            git rebase origin/main
            python scripts/generate_release_hashes.py
            python scripts/validate_release_integrity.py
            git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            python scripts/release_evidence_fence.py validate \
              --manifest manifest.json \
              --root . \
              --evidence /tmp/release-generation.json
            git push origin HEAD:main
          fi

      - name: RESUME - Verify exact published main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi
          npm test
          node engine_v2/tests/provider-catalog.test.mjs
          python scripts/activation_preservation_core_rehash.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python scripts/release_evidence_fence.py validate \
            --manifest manifest.json \
            --root . \
            --evidence /tmp/release-generation.json
          git diff --exit-code

      - name: RESUME - Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "RESUME_QUICK_PUBLISH_SUCCESS run=${GITHUB_RUN_ID} source_run=32745430988 head=${GITHUB_SHA}"

      - name: RESUME - Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "RESUME_QUICK_PUBLISH_FAILURE run=${GITHUB_RUN_ID} source_run=32745430988 head=${GITHUB_SHA}"
