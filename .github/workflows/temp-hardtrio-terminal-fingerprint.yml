name: TEMP - Remaining regression route proof

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-hardtrio-terminal-fingerprint.yml]

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Exact upstream/local route proof and terminal fingerprints
        run: |
          python - <<'PY'
          import json,sys,tempfile,urllib.parse
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity as base
          import run_provider_upstream_parity_v3 as v3

          fixtures={
            'animevostfr':[
              {'tmdbId':'95479','mediaType':'anime','category':'anime','title':'Jujutsu Kaisen','year':2020,'season':1,'episode':1},
              {'tmdbId':'1061474','mediaType':'movie','title':'Superman','year':2025},
            ],
            'kurage':[{'tmdbId':'94664','mediaType':'anime','category':'anime','title':'Mushoku Tensei: Jobless Reincarnation','year':2021,'season':1,'episode':1}],
            'voiranime':[{'tmdbId':'475557','mediaType':'movie','title':'Joker','year':2019}],
            'voiranime-rip':[{'tmdbId':'62104','mediaType':'anime','category':'anime','title':'The Seven Deadly Sins','year':2014,'season':1,'episode':1}],
          }
          local=base.local_catalog(); ups,errs=base.upstream_catalog()
          print('UPSTREAM_ERRORS',json.dumps(errs))

          def ctx(f):
              c=base.context_for(f); c['routeProofTrace']=True
              c['networkLimits']['maxFetches']=45
              c['networkLimits']['maxDistinctHosts']=18
              return c
          def raw(path,f,upstream):
              import subprocess
              actual=dict(f)
              if upstream and actual.get('mediaType')=='anime':
                  actual['mediaType']='tv'; actual['type']='tv'; actual.pop('category',None)
              cp=subprocess.run(['node','scripts/provider_worker.cjs',str(path),json.dumps(actual,separators=(',',':')),json.dumps(ctx(f),separators=(',',':'))],capture_output=True,text=True,timeout=90)
              r={}
              for line in cp.stdout.splitlines():
                  if line.startswith('NUVIO_HEALTH_RESULT='):
                      try:r=json.loads(line.split('=',1)[1])
                      except:pass
              return r
          def stream_shape(s):
              if not isinstance(s,dict): return None
              u=str(s.get('url') or '')
              try:
                  z=urllib.parse.urlsplit(u)
                  urlshape={'host':z.hostname,'path':z.path,'queryKeys':sorted(urllib.parse.parse_qs(z.query).keys())}
              except: urlshape={'host':None,'path':None,'queryKeys':[]}
              return {'url':urlshape,'name':str(s.get('name') or '')[:140],'title':str(s.get('title') or '')[:180],'quality':str(s.get('quality') or '')[:60],'language':str(s.get('language') or '')[:60],'headers':sorted(str(k).lower() for k in (s.get('headers') or {}).keys())}
          def net(r):
              out=[]
              for x in r.get('network_observations') or []:
                  if not isinstance(x,dict): continue
                  row={k:x.get(k) for k in ('stage','host','method','path_pattern','status','ok','content_type','proof_url','proof_body_values','response_value_hints','error_code') if x.get(k) not in (None,[],{})}
                  if row not in out: out.append(row)
              return out
          def terminal(s):
              if not isinstance(s,dict):return None
              return v3._probe_terminal(s,20)

          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              for pid,fs in fixtures.items():
                  up=ups.get(pid)
                  if not up:
                      print('MISSING_UPSTREAM',pid); continue
                  upath=td/(pid+'.js'); upath.write_bytes(base.get_bytes(up['url']))
                  lpath=local[pid]['path']
                  for f in fs:
                      ur=raw(upath,f,True); lr=raw(lpath,f,False)
                      us=[stream_shape(s) for s in ur.get('streams') or [] if isinstance(s,dict)]
                      ls=[stream_shape(s) for s in lr.get('streams') or [] if isinstance(s,dict)]
                      ut=[terminal(s) for s in ur.get('streams') or [] if isinstance(s,dict)]
                      lt=[terminal(s) for s in lr.get('streams') or [] if isinstance(s,dict)]
                      print('ROUTE_PROOF '+pid+'|'+f['title']+' '+json.dumps({
                        'upstreamSource':up.get('source'),
                        'upstream':{'count':ur.get('stream_count'),'raw':ur.get('raw_stream_count'),'statuses':ur.get('provider_server_http_statuses'),'streams':us,'terminal':ut,'network':net(ur)},
                        'local':{'count':lr.get('stream_count'),'raw':lr.get('raw_stream_count'),'statuses':lr.get('provider_server_http_statuses'),'streams':ls,'terminal':lt,'network':net(lr)}
                      },sort_keys=True))
          PY
