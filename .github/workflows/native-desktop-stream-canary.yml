name: Native Desktop stream canary
# Final NiakVIO validation v8: validate the final main candidate after hub materialization on official Desktop macOS + Windows.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-desktop-stream-canary.yml"
      - ".github/triggers/nuvio-client-lab.json"
      - "manifest.json"
      - "vf/manifest.json"
      - "provider_catalog.json"
      - "provider-overrides.json"
      - "providers/**"
      - "sources.json"
      - "automation/nuvio-client-upstreams.json"
      - "automation/platform-runtime-contracts.json"
      - "automation/PLATFORM-RUNTIME-CONTRACTS.md"
      - "scripts/render_platform_runtime_contracts.py"
      - "scripts/apply_provider_overrides.py"
      - "scripts/apply_runtime_capability_upgrade_v4.py"
      - "scripts/core_rebuild_safety.py"
      - "scripts/normalize_repository_docs.py"
      - "scripts/normalize_runtime_repository_dependencies.py"
      - "scripts/normalize_provider_rebuild_safety.py"
      - "scripts/normalize_core_fixed_point_contract.py"
      - "scripts/normalize_provider_branding_pipeline.py"
      - "scripts/normalize_core_media_policy.py"
      - "scripts/normalize_stream_presentation_v12.py"
      - "scripts/provider_purification.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/provider_patches/global_stream_presentation_v1.py"
      - "engine_v2/scripts/terser-clean.mjs"
      - "engine_v2/src/runtime-adapters.mjs"
      - "engine_v2/src/stream-presentation.mjs"
      - "engine_v2/tests/runtime-adapters.test.mjs"
      - "engine_v2/tests/stream-presentation.test.mjs"
      - "tests/global_stream_presentation_test.py"
      - "tests/nuvio_client_upstream_drift_guard_test.py"
      - "scripts/check_nuvio_client_upstreams.py"
      - "scripts/resolve_nuvio_lab_heads.py"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/augment_native_corpus_request_contract.py"
      - "scripts/augment_native_provider_loading_compat.py"
      - "scripts/augment_native_desktop_runtime_diagnostics.py"
      - "scripts/augment_native_desktop_player.py"
      - "scripts/complete_native_desktop_frontend_phases.py"
      - "scripts/instrument_native_desktop_evidence.py"
      - "scripts/instrument_native_repository_http_evidence.py"
      - "scripts/resolve_native_repository.sh"
      - "scripts/prepare_native_candidate_repository.py"
      - "scripts/nuvio_desktop_test_jvm.init.gradle"
      - "scripts/run_native_corpus_desktop_suite.sh"
      - "scripts/analyze_native_corpus_collection.cjs"
      - "scripts/native_fixture_identity_guard.cjs"
      - "scripts/gate_native_reader_coverage.cjs"
      - "scripts/gate_native_reader_result.cjs"
      - "scripts/gate_native_player_reached.cjs"
      - "scripts/native_evidence_completeness.cjs"
      - "scripts/gate_native_stream_extraction.cjs"
      - "tests/native_stream_extraction_gate_test.py"
      - "tests/native_desktop_runtime_diagnostics_order_test.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-desktop-stream-canary.yml"
      - ".github/triggers/nuvio-client-lab.json"
      - "manifest.json"
      - "vf/manifest.json"
      - "provider_catalog.json"
      - "provider-overrides.json"
      - "providers/**"
      - "sources.json"
      - "automation/nuvio-client-upstreams.json"
      - "automation/platform-runtime-contracts.json"
      - "automation/PLATFORM-RUNTIME-CONTRACTS.md"
      - "scripts/render_platform_runtime_contracts.py"
      - "scripts/apply_provider_overrides.py"
      - "scripts/apply_runtime_capability_upgrade_v4.py"
      - "scripts/core_rebuild_safety.py"
      - "scripts/normalize_repository_docs.py"
      - "scripts/normalize_runtime_repository_dependencies.py"
      - "scripts/normalize_provider_rebuild_safety.py"
      - "scripts/normalize_core_fixed_point_contract.py"
      - "scripts/normalize_provider_branding_pipeline.py"
      - "scripts/normalize_core_media_policy.py"
      - "scripts/normalize_stream_presentation_v12.py"
      - "scripts/provider_purification.py"
      - "scripts/reapply_published_overrides.py"
      - "scripts/provider_patches/global_stream_presentation_v1.py"
      - "engine_v2/scripts/terser-clean.mjs"
      - "engine_v2/src/runtime-adapters.mjs"
      - "engine_v2/src/stream-presentation.mjs"
      - "engine_v2/tests/runtime-adapters.test.mjs"
      - "engine_v2/tests/stream-presentation.test.mjs"
      - "tests/global_stream_presentation_test.py"
      - "tests/nuvio_client_upstream_drift_guard_test.py"
      - "scripts/check_nuvio_client_upstreams.py"
      - "scripts/resolve_nuvio_lab_heads.py"
      - "scripts/prepare_native_corpus_client.py"
      - "scripts/restage_native_corpus_client.py"
      - "scripts/augment_native_corpus_request_contract.py"
      - "scripts/augment_native_provider_loading_compat.py"
      - "scripts/augment_native_desktop_runtime_diagnostics.py"
      - "scripts/augment_native_desktop_player.py"
      - "scripts/complete_native_desktop_frontend_phases.py"
      - "scripts/instrument_native_desktop_evidence.py"
      - "scripts/instrument_native_repository_http_evidence.py"
      - "scripts/resolve_native_repository.sh"
      - "scripts/prepare_native_candidate_repository.py"
      - "scripts/nuvio_desktop_test_jvm.init.gradle"
      - "scripts/run_native_corpus_desktop_suite.sh"
      - "scripts/analyze_native_corpus_collection.cjs"
      - "scripts/native_fixture_identity_guard.cjs"
      - "scripts/gate_native_reader_coverage.cjs"
      - "scripts/gate_native_reader_result.cjs"
      - "scripts/gate_native_player_reached.cjs"
      - "scripts/native_evidence_completeness.cjs"
      - "scripts/gate_native_stream_extraction.cjs"
      - "tests/native_stream_extraction_gate_test.py"
      - "tests/native_desktop_runtime_diagnostics_order_test.py"
  workflow_dispatch:

permissions:
  contents: read

# Push/PR revisions are latest-wins. Explicit workflow_dispatch runs stay isolated
# because the final orchestrator may watch one exact dispatch as authoritative proof.
concurrency:
  group: native-desktop-stream-canary-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || 'main-push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate living cross-device runtime contract
        run: python3 scripts/render_platform_runtime_contracts.py --check
      - name: Validate extraction gate semantics
        run: python3 tests/native_stream_extraction_gate_test.py
      - name: Validate Desktop runtime diagnostics ordering
        run: python3 tests/native_desktop_runtime_diagnostics_order_test.py
      - name: Validate client drift and Desktop fixed-point topology
        run: python3 tests/nuvio_client_upstream_drift_guard_test.py

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      desktop_sha: ${{ steps.refs.outputs.desktop_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inspect official Desktop drift
        run: python3 scripts/check_nuvio_client_upstreams.py --no-fail --output health-output/nuvio-client-upstream-status.json
      - id: refs
        name: Resolve latest official Desktop HEAD
        run: |
          python3 scripts/resolve_nuvio_lab_heads.py \
            --report health-output/nuvio-client-upstream-status.json \
            --clients nuvio-desktop \
            --github-output "$GITHUB_OUTPUT" \
            --output health-output/nuvio-desktop-canary-head.json

  desktop-canary:
    needs: [contract, resolve]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os_name: macos
          - runner: windows-2022
            os_name: windows
    runs-on: ${{ matrix.runner }}
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      NIAKVIO_TARGET_FIXTURE: interstellar
      NIAKVIO_PRIMARY_FIXTURE: interstellar
      NIAKVIO_TARGET_MANIFEST: manifest.json
      NIAKVIO_PRIMARY_STREAM_SCOPE: "1"
      NIAKVIO_REGRESSION_STREAM_SCOPE: "1"
      NIAKVIO_REQUIRE_READER_SUCCESS: "0"
    steps:
      - name: Checkout NiakVIO candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Materialize current NiakVIO Core candidate
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/niakvio"
          npm ci --ignore-scripts --no-audit --no-fund
          # Keep the Desktop canary on the exact same durable fixed-point ordering
          # as the authoritative Core finalizer. Runtime repository dependencies
          # must be removed before any provider rebuild can re-emit their bytes.
          python3 scripts/normalize_repository_docs.py --apply
          python3 scripts/normalize_runtime_repository_dependencies.py --apply
          python3 scripts/normalize_provider_rebuild_safety.py --apply
          python3 scripts/normalize_core_fixed_point_contract.py --apply
          python3 scripts/normalize_provider_branding_pipeline.py --apply
          python3 scripts/normalize_core_media_policy.py --apply
          python3 scripts/apply_runtime_capability_upgrade_v4.py
          python3 scripts/build_provider_runtime_profiles.py
          converged=0
          for pass in 1 2 3 4 5 6; do
            echo "FIELD_DESKTOP_CANARY_REBUILD_CONVERGENCE pass=${pass}"
            python3 scripts/reapply_published_overrides.py
            if python3 scripts/reapply_published_overrides.py --check; then
              converged=1
              echo "FIELD_DESKTOP_CANARY_REBUILD_CONVERGENCE converged_at=${pass}"
              break
            fi
          done
          test "$converged" -eq 1
          python3 scripts/normalize_runtime_repository_dependencies.py --check
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 tests/global_stream_presentation_test.py
          node engine_v2/tests/runtime-adapters.test.mjs
          node engine_v2/tests/stream-presentation.test.mjs
          hits="$(grep -l 'NUVIO_GLOBAL_RUNTIME_COMPAT_V1' providers/*.js | wc -l | tr -d ' ')"
          test "$hits" -ge 3
          echo "FIELD_DESKTOP_CANARY_CORE_MATERIALIZED runtime_compat_providers=$hits"

      - name: Checkout official NuvioDesktop HEAD
        shell: bash
        env:
          NUVIO_DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout "$NUVIO_DESKTOP_SHA"
          git -C nuvio-desktop lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/**,composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          touch nuvio-desktop/local.properties
          python3 niakvio/scripts/prepare_native_corpus_client.py desktop --fixture interstellar --workspace "$GITHUB_WORKSPACE" --manifest manifest.json

      - name: Install official Windows WebView2 dependency
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build official macOS bridge once
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          ./nuvio-desktop/gradlew -p nuvio-desktop \
            :composeApp:buildMacosPlayerBridge \
            :composeApp:prepareMacosPlayerRuntime \
            --no-configuration-cache --console=plain

      - name: Build official Windows bridge once
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          & .\nuvio-desktop\gradlew.bat -p nuvio-desktop `
            :composeApp:buildWindowsPlayerBridge `
            :composeApp:prepareWindowsPlayerRuntime `
            :composeApp:generateWindowsPlayerRuntimeIndex `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable pre-evaluation native fetch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          
          path = Path("niakvio/scripts/augment_native_desktop_runtime_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          
          old = '    private fun captureRuntimeConsole(code: String): String = code + """\\n'
          prelude = r'''    private fun captureRuntimeConsole(code: String): String = """
          ;/* NIAKVIO_NATIVE_FETCH_PRE_EVAL_TRACE */
          (function(g){
              try {
                  var originalNativeFetch = g && g.__native_fetch;
                  var trace = [];
                  if (g) g.__niakvioNativeFetchTrace = trace;
                  if (typeof originalNativeFetch === "function") {
                      g.__native_fetch = async function(url, method, headers, body, followRedirects) {
                          var verb = String(method || "GET");
                          var target = String(url || "");
                          try {
                              var raw = await originalNativeFetch.apply(this, arguments);
                              var parsed = null;
                              try { parsed = JSON.parse(String(raw || "{}")); } catch (_) {}
                              var status = parsed && parsed.status != null ? String(parsed.status) : "unknown";
                              var ok = parsed && parsed.ok != null ? String(parsed.ok) : "unknown";
                              var statusText = parsed && parsed.statusText != null ? String(parsed.statusText) : "";
                              trace.push("native-fetch:" + verb + ":" + target + ":status=" + status + ":ok=" + ok + ":statusText=" + statusText);
                              if (trace.length > 64) trace.shift();
                              return raw;
                          } catch (error) {
                              var message = "";
                              try { message = error && error.message ? String(error.message) : String(error); } catch (_) {}
                              trace.push("native-fetch-error:" + verb + ":" + target + ":" + message);
                              if (trace.length > 64) trace.shift();
                              throw error;
                          }
                      };
                  }
              } catch (_) {}
          })(typeof globalThis !== "undefined" ? globalThis : this);
          """.trimIndent() + "\\n" + code + """
          '''
          if text.count(old) != 1:
              raise SystemExit(f"native diagnostic prelude anchor count={text.count(old)}")
          text = text.replace(old, prelude, 1)
          
          old_detail = '        var detail = messages.length ? messages.join(" | ") : "no_console_or_fetch_output";\\n'
          new_detail = '''        try {
                      var nativeTrace = (typeof globalThis !== "undefined" && Array.isArray(globalThis.__niakvioNativeFetchTrace))
                          ? globalThis.__niakvioNativeFetchTrace : [];
                      if (nativeTrace.length) messages = messages.concat(nativeTrace);
                  } catch (_) {}
                  var detail = messages.length ? messages.join(" | ") : "no_console_or_fetch_output";
          '''
          if text.count(old_detail) != 1:
              raise SystemExit(f"native diagnostic detail anchor count={text.count(old_detail)}")
          text = text.replace(old_detail, new_detail, 1)
          path.write_text(text, encoding="utf-8")
          print("FIELD_NATIVE_FETCH_PRE_EVAL_DIAGNOSTICS status=enabled runtime_mutation=false provider_mutation=false test_copy_only=true")
          PY

      - name: Probe independent Interstellar providers
        shell: bash
        run: |
          set -u
          PROVIDERS=(cineby VIDEASY PURSTREAM)
          LOGS=()
          for provider in "${PROVIDERS[@]}"; do
            echo "===== DESKTOP CANARY: interstellar / $provider / ${{ matrix.os_name }} ====="
            NIAKVIO_TARGET_PROVIDER="$provider" \
              bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_desktop_suite.sh" || true
            source_log="$GITHUB_WORKSPACE/desktop-native-corpus-${{ matrix.os_name }}-interstellar.log"
            canary_log="$GITHUB_WORKSPACE/desktop-canary-${{ matrix.os_name }}-${provider}.log"
            if [[ -s "$source_log" ]]; then
              cp "$source_log" "$canary_log"
            else
              printf 'FIELD_NATIVE_CANARY_PLACEHOLDER client=desktop fixture=interstellar provider=%s reason=no_route_log\n' "$provider" > "$canary_log"
            fi
            LOGS+=("$canary_log")
          done
          node "$GITHUB_WORKSPACE/niakvio/scripts/gate_native_stream_extraction.cjs" \
            --client desktop \
            --fixture interstellar \
            --providers cineby,VIDEASY,PURSTREAM \
            "${LOGS[@]}"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-desktop-stream-canary-${{ matrix.os_name }}-${{ github.run_id }}
          path: desktop-canary-${{ matrix.os_name }}-*.log
          retention-days: 7
          if-no-files-found: warn
