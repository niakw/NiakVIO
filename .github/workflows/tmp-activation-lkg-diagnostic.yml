name: Temporary activation LKG diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-activation-lkg-diagnostic.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Announce diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Activation-LKG diagnostic started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Read-only; no providers are rebuilt."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Explain quarantine acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('.')
          path = root / 'scripts/validate_activation_preservation.py'
          spec = importlib.util.spec_from_file_location('vap', path)
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          main_rows = mod.rows(mod.load(root/'manifest.json'))
          patches = mod.provider_patch_rows(mod.load_optional(root/'provider-overrides.json'))
          prov = mod.provenance_rows(mod.load_optional(root/'PROVENANCE.json'))
          findings = mod.safety_finding_rows(mod.load_optional(root/'automation/nuvio-client-safety-findings.json'))
          report = mod.report_rows(mod.load(root/'health-report.json'))
          for pid in ('frenchstream','moviebox','netmirror','vixsrc'):
              accepted, reason = mod.configured_safety_quarantine(pid, main_rows.get(pid), patches.get(pid), prov.get(pid), findings.get(pid))
              print(f'FIELD_LKG_DIAG provider={pid} configured_quarantine={accepted} reason={reason}')
              prow = prov.get(pid) or {}
              mrow = main_rows.get(pid) or {}
              frow = findings.get(pid) or {}
              rrow = report.get(pid) or {}
              print('FIELD_LKG_STATE', pid,
                    'manifest_enabled='+str(mrow.get('enabled')),
                    'manifest_file='+str(mrow.get('filename')),
                    'provenance_mode='+str(prow.get('activation_mode')),
                    'provenance_eligible='+str(prow.get('activation_eligible')),
                    'provenance_file='+str(prow.get('published_filename')),
                    'provenance_sha='+str(prow.get('patched_sha256') or prow.get('sha256')),
                    'finding_file='+str(frow.get('quarantined_bundle')),
                    'finding_sha='+str(frow.get('quarantined_bundle_sha256')),
                    'report_enabled='+str(rrow.get('enabled')),
                    'report_action='+str(rrow.get('action')))
          errors = mod.validate()
          print('FIELD_LKG_ERRORS count='+str(len(errors)))
          for error in errors: print('FIELD_LKG_ERROR '+error)
          PY
