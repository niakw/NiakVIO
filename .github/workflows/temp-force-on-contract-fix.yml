name: TEMP - Repair Force-ON Contracts

on:
  push:
    branches:
      - workbench/hub-matrix-46-20260911
    paths:
      - '.github/workflows/temp-force-on-contract-fix.yml'

permissions:
  contents: write

jobs:
  repair-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply force-ON and Movix contract patches
        run: |
          python scripts/temp_force_on_contract_fix.py
          python scripts/temp_movix_test_fix.py

      - name: Prove corrected contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_activation_preservation.py scripts/finalize_provider_repair_disposition_v1_impl.py tests/ci_preservation_policy_test.py tests/activation_preservation_core_rehash_test.py tests/overrides_test.py
          python tests/ci_preservation_policy_test.py
          python tests/activation_preservation_core_rehash_test.py
          python tests/overrides_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python scripts/validate_activation_preservation.py

      - name: Prove Repair finalizer keeps all 96 enabled
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp manifest.json "$TMP/manifest.json"
          cp provider-overrides.json "$TMP/provider-overrides.json"
          cp automation/provider-v3-static-knowledge.json "$TMP/knowledge.json"
          cp automation/provider-live-baseline-locks.json "$TMP/locks.json"
          cp automation/provider-route-recovery-v6-targeted.json "$TMP/recovery.json"
          cp provider-v3-quick-yield.json "$TMP/quick.json"
          python scripts/finalize_provider_repair_disposition_v1_impl.py --manifest "$TMP/manifest.json" --overrides "$TMP/provider-overrides.json" --knowledge "$TMP/knowledge.json" --locks "$TMP/locks.json" --recovery "$TMP/recovery.json" --quick-yield "$TMP/quick.json" --output "$TMP/disposition.json"
          python - "$TMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text())
          overrides = json.loads((root / 'provider-overrides.json').read_text())
          disposition = json.loads((root / 'disposition.json').read_text())
          rows = manifest.get('scrapers') or []
          assert len(rows) == 96, len(rows)
          assert all(row.get('enabled') is True for row in rows)
          assert disposition['policy']['forceAllProvidersEnabled'] is True
          assert disposition['policy']['activationFollowsDeclaredHub'] is False
          assert disposition['enabledProviderCount'] == 96
          assert disposition['disabledProviderCount'] == 0
          assert not disposition['disabledProviders']
          patches = overrides.get('provider_patches') or {}
          assert all((patches[str(row['id']).casefold()].get('manifest_overrides') or {}).get('enabled') is True for row in rows)
          assert all((patches[str(row['id']).casefold()].get('repair_disposition') or {}).get('forcedEnabled') is True for row in rows)
          print('FORCE_ON_REPAIR_FINALIZER_OK providers=96 enabled=96 disabled=0')
          PY

      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-force-on-contract-fix.yml scripts/temp_force_on_contract_fix.py scripts/temp_movix_test_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): align activation and repair with force-ON catalogue'
          git push origin HEAD:workbench/hub-matrix-46-20260911
