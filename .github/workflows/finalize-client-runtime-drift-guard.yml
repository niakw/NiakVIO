name: Finalize Nuvio client runtime drift guard

on:
  push:
    paths:
      - .github/triggers/finalize-client-runtime-drift-guard

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove finite instrumentation
        run: |
          rm -f .github/workflows/finalize-client-runtime-drift-guard.yml
          rm -f .github/triggers/finalize-client-runtime-drift-guard

      - name: Validate official client baselines and complete repository
        run: |
          python tests/nuvio_client_upstream_drift_guard_test.py
          python scripts/check_nuvio_client_upstreams.py --output health-output/nuvio-client-upstream-status.json
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --check

      - name: Commit finalized client-runtime guard
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize Nuvio client runtime drift guard"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify exact published main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/check_nuvio_client_upstreams.py --output health-output/nuvio-client-upstream-status.json
          npm test
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git diff --exit-code
