name: TEMP - batch priority provider repair v5

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-batch-priority-provider-repair.yml

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_PARITY_WORKERS: '8'
  NIAKVIO_PARITY_TIMEOUT: '25'
  NIAKVIO_PARITY_SEED: '20260913'

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight current architecture
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 scripts/upgrade_provider_v3_source_plan_v5.py
          python3 scripts/upgrade_provider_disabled_fast_advance_v1.py
          python3 scripts/upgrade_stream_sanitizer_v7_selection.py
          python3 tests/provider_v3_sequential_reconstruction_contract_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/native_adaptive_catalog_contract_test.py
          python3 tests/provider_upstream_parity_v3_test.py

      - name: Build stable batch and exception ledgers
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            animesama-co animevost-fr french-manga playimdb sekai \
            streamzo uhdmovies voiranime-homes voiranime-rip \
            > automation/provider-priority-repair-queue.txt
          printf '%s\n' animevostfr voiranime kurage > automation/provider-priority-exception-queue.txt
          printf '%s\n' \
            4khdhub allanime allwish anikototv anime-ultime animesalt animetsu flemmix \
            fullanime moviebox moviesmod showbox vidfast vidlove vostfree \
            > automation/provider-priority-zero-queue.txt

      - name: Repair the nine stable regressions in one transaction
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t providers < automation/provider-priority-repair-queue.txt
          args=()
          for provider in "${providers[@]}"; do args+=(--provider "$provider"); done
          python3 scripts/run_provider_repair_fast_targeted_v20.py \
            --skip-file automation/provider-repair-planner-authorized-skip.json \
            --attempts 3 \
            --workers 8 \
            --timeout 55 \
            --defer-global-guard \
            "${args[@]}"
          echo 'mutated=true' >> "$GITHUB_OUTPUT"

      - name: Rebuild projections and run non-minifier guards
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_language_manifests.py
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_stream_output_guard_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/recent_global_lab_corpus_policy_test.py
          python3 tests/native_catalog_miss_rotation_test.py
          python3 tests/native_adaptive_catalog_contract_test.py

      - name: Post-repair parity on stable nine
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t providers < automation/provider-priority-repair-queue.txt
          args=()
          for provider in "${providers[@]}"; do args+=(--provider "$provider"); done
          python3 scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 4 \
            --seed "$NIAKVIO_PARITY_SEED" \
            --out automation/provider-upstream-parity-batch-post.json \
            "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-upstream-parity-batch-post.json').read_text())
          print('STABLE9_POST_COUNTS', d.get('statusCounts', {}))
          print('STABLE9_POST_REGRESSIONS', ','.join(d.get('certainRegressions') or []) or 'none')
          PY

      - name: Persist checkpoint
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          post=json.loads(Path('automation/provider-upstream-parity-batch-post.json').read_text())
          queue=Path('automation/provider-priority-repair-queue.txt').read_text().split()
          exceptions=Path('automation/provider-priority-exception-queue.txt').read_text().split()
          p=Path('MEMORY.md'); text=p.read_text(encoding='utf-8')
          marker='## 2026-09-13 — provider stable-nine salvage v5'
          if marker not in text:
              text += f'''\n{marker}\n\n- Run `{os.environ.get('GITHUB_RUN_ID','')}` isolates the stable nine-provider salvage batch `{', '.join(queue)}`. The three active-loss exceptions are `{', '.join(exceptions)}` and are handled separately as one diagnostic sub-batch.\n- Post-repair parity counts on the stable nine: `{post.get('statusCounts',{})}`; remaining certain regressions in this batch: `{', '.join(post.get('certainRegressions') or []) or 'none'}`.\n- No minimizer in this loop.\n'''
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit successful stable-nine transaction
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/temp-batch-priority-provider-repair.yml
          if git diff --cached --quiet; then
            echo 'No durable changes to commit'
            exit 0
          fi
          git commit -m 'fix(providers): salvage nine stable parity repairs'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-priority-provider-repair-v5-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/provider-upstream-parity-batch-post.json
            automation/provider-priority-zero-queue.txt
            automation/provider-priority-repair-queue.txt
            automation/provider-priority-exception-queue.txt
            automation/provider-repair-fast-targeted.json
            automation/provider-repair-fast-yield.json
            automation/provider-repair-fast-summary.json
