name: TEMP - batch priority provider repair v2

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-batch-priority-provider-repair.yml

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_PARITY_WORKERS: '8'
  NIAKVIO_PARITY_TIMEOUT: '25'
  NIAKVIO_PARITY_SEED: '20260913'

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight current repair architecture
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}${TMDB_ACCESS_TOKEN:-}"
          python3 -m py_compile \
            scripts/upgrade_provider_disabled_fast_advance_v1.py \
            scripts/upgrade_provider_v3_source_plan_v5.py \
            scripts/run_provider_repair_fast_targeted_v20.py \
            scripts/run_provider_upstream_parity_v3.py
          python3 scripts/upgrade_provider_v3_source_plan_v5.py
          python3 scripts/upgrade_provider_disabled_fast_advance_v1.py
          python3 tests/provider_v3_sequential_reconstruction_contract_test.py
          python3 tests/provider_upstream_parity_v3_test.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback

      - name: Persist exact proven regression queue from wide parity run 34763697601
        shell: bash
        run: |
          set -euo pipefail
          cat > automation/provider-priority-repair-queue.txt <<'EOF'
          animesama-co
          animevost-fr
          animevostfr
          french-manga
          kurage
          playimdb
          sekai
          streamzo
          uhdmovies
          voiranime
          voiranime-homes
          voiranime-rip
          EOF
          sed -i 's/^          //' automation/provider-priority-repair-queue.txt
          cat > automation/provider-priority-zero-queue.txt <<'EOF'
          4khdhub
          allanime
          allwish
          anikototv
          anime-ultime
          animesalt
          animetsu
          flemmix
          fullanime
          moviebox
          moviesmod
          showbox
          vidfast
          vidlove
          vostfree
          EOF
          sed -i 's/^          //' automation/provider-priority-zero-queue.txt
          echo 'REGRESSION_QUEUE:'; cat automation/provider-priority-repair-queue.txt
          echo 'ZERO_DEEP_12_UPSTREAM_ZERO:'; cat automation/provider-priority-zero-queue.txt

      - name: Repair all 12 certain regressions in one transaction
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t providers < <(grep -v '^$' automation/provider-priority-repair-queue.txt)
          args=()
          for provider in "${providers[@]}"; do args+=(--provider "$provider"); done
          python3 scripts/run_provider_repair_fast_targeted_v20.py \
            --skip-file automation/provider-repair-planner-authorized-skip.json \
            --attempts 3 \
            --workers 8 \
            --timeout 55 \
            --defer-global-guard \
            "${args[@]}"
          echo 'mutated=true' >> "$GITHUB_OUTPUT"

      - name: Regenerate projections and run structural/global Core guards
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_language_manifests.py
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_stream_output_guard_test.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/recent_global_lab_corpus_policy_test.py
          python3 tests/native_catalog_miss_rotation_test.py

      - name: Post-repair targeted parity for the repaired providers
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t providers < <(grep -v '^$' automation/provider-priority-repair-queue.txt)
          args=()
          for provider in "${providers[@]}"; do args+=(--provider "$provider"); done
          python3 scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 4 \
            --seed "$NIAKVIO_PARITY_SEED" \
            --out automation/provider-upstream-parity-batch-post.json \
            "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/provider-upstream-parity-batch-post.json').read_text())
          print('BATCH_POST_COUNTS', d.get('statusCounts', {}))
          print('BATCH_POST_REGRESSIONS', ','.join(d.get('certainRegressions') or []) or 'none')
          PY

      - name: Persist provider batch checkpoint in MEMORY
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          post=json.loads(Path('automation/provider-upstream-parity-batch-post.json').read_text())
          queue=[x.strip() for x in Path('automation/provider-priority-repair-queue.txt').read_text().splitlines() if x.strip()]
          zeros=[x.strip() for x in Path('automation/provider-priority-zero-queue.txt').read_text().splitlines() if x.strip()]
          marker='## 2026-09-13 — provider REGRESSION batch v2'
          memory=Path('MEMORY.md')
          text=memory.read_text(encoding='utf-8')
          if marker not in text:
              text += f'''\n{marker}\n\n- Run `{os.environ.get('GITHUB_RUN_ID','')}` repairs the 12 certain regression provider IDs from wide parity run `34763697601` in one transaction: `{', '.join(queue)}`.\n- The 15 ZERO providers `{', '.join(zeros)}` were already deep-rotated to 12 parity samples/lane and remained upstream-zero/local-zero; they stay priority debt but are not blindly mutated without upstream-positive evidence.\n- Post-repair targeted parity (4 samples/lane, same deterministic seed) counts: `{post.get('statusCounts',{})}`; remaining certain regressions: `{', '.join(post.get('certainRegressions') or []) or 'none'}`.\n- No JS minimizer was run in this repair loop. NiakVIO minimization remains a final-stage operation after functional/provider/Core stabilization.\n'''
              memory.write_text(text, encoding='utf-8')
          PY

      - name: Commit only successful batch repair
        if: steps.repair.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/temp-batch-priority-provider-repair.yml
          if git diff --cached --quiet; then
            echo 'No durable batch changes to commit'
            exit 0
          fi
          git commit -m 'fix(providers): batch repair current parity regressions'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912

      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-priority-provider-repair-v2-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/provider-upstream-parity-batch-post.json
            automation/provider-priority-zero-queue.txt
            automation/provider-priority-repair-queue.txt
            automation/provider-repair-fast-targeted.json
            automation/provider-repair-fast-yield.json
            automation/provider-repair-fast-summary.json
