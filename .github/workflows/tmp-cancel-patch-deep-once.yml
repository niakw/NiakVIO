name: TEMP - Cancel stale runs and launch clean Deep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cancel-patch-deep-once.yml'

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  cancel-patch-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Cancel accidental Quick and stale Deep
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 32753159467 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 32753192482 --repo "$GITHUB_REPOSITORY" || true
      - name: Fix Globalping location reuse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, got {n}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'scripts/provider_dns_preflight.mjs'
          replace_once(
              path,
              '        return await runMeasurement(bodyFactory(String(magic)), remoteConfig);',
              '        const measurement = await runMeasurement(bodyFactory(String(magic)), remoteConfig);\n        return { measurement, locationMagic: String(magic) };',
          )
          replace_once(
              path,
              '          const measurement = await runAtFirstAvailableLocation((magic) => ({',
              '          const selectedLocation = await runAtFirstAvailableLocation((magic) => ({',
          )
          replace_once(
              path,
              '          return parseGlobalpingDns(measurement, resolverConfig.name, resolverConfig);',
              '          const dnsResult = parseGlobalpingDns(selectedLocation.measurement, resolverConfig.name, resolverConfig);\n          dnsResult.location_magic = selectedLocation.locationMagic;\n          return dnsResult;',
          )
          replace_once(
              path,
              "          if (!dnsResult.measurement_id) return { status: 'unreachable', http_status: null, final_host: normalizeHost(host), redirects: [], body_excerpt: '', attempts: [], error: 'GLOBALPING_DNS_MEASUREMENT_MISSING', transport: 'globalping' };",
              "          if (!dnsResult.location_magic) return { status: 'unreachable', http_status: null, final_host: normalizeHost(host), redirects: [], body_excerpt: '', attempts: [], error: 'GLOBALPING_DNS_LOCATION_MISSING', transport: 'globalping' };",
          )
          replace_once(
              path,
              '            locations: [{ magic: dnsResult.measurement_id }],',
              '            locations: [{ magic: dnsResult.location_magic }],',
          )

          test = 'tests/dns_preflight.test.mjs'
          replace_once(
              test,
              "  assert.equal(dns.measurement_id, 'dns-measurement-sfr');",
              "  assert.equal(dns.measurement_id, 'dns-measurement-sfr');\n  assert.equal(dns.location_magic, 'France+SFR+eyeball');",
          )
          replace_once(
              test,
              "  assert.equal(calls[1].locations[0].magic, 'dns-measurement-sfr');",
              "  assert.equal(calls[1].locations[0].magic, 'France+SFR+eyeball');",
          )
          PY
      - name: Validate focused contracts and reseal
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/dns_preflight.test.mjs
          python tests/sync_catalogue_audit_gate_test.py
          python tests/release_version_sync_test.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Commit, self-clean and launch Deep only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-cancel-patch-deep-once.yml
          git add scripts/provider_dns_preflight.mjs tests/dns_preflight.test.mjs FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m 'fix: reuse Globalping probe location for HTTP validation [skip ci]'
          git push origin HEAD:main
          HEAD_SHA=$(git rev-parse HEAD)
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=deep
          RUN_ID=''
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n1 || true)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "DEEP_CLEAN_DISPATCH head=${HEAD_SHA} run=${RUN_ID:-pending} quick_rerun=false dns_location_magic_fixed=true"
