name: DIAG - TMDB Alias Shape
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/tmdb-alias-shape-short.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Fetch titles
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          key=os.getenv('TMDB_API_KEY',''); token=os.getenv('TMDB_ACCESS_TOKEN','')
          base='https://api.themoviedb.org/3/tv/45950'
          def load(path):
            url=base+path
            h={'accept':'application/json'}
            if token:h['Authorization']='Bearer '+token
            elif key:url+=('&' if '?' in url else '?')+'api_key='+urllib.parse.quote(key)
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=12) as r:return json.load(r)
          d=load('?language=en-US'); fr=load('/alternative_titles')
          vals=[d.get('name'),d.get('original_name')]+[x.get('title') for x in fr.get('results',[]) if isinstance(x,dict)]
          out=[]
          for x in vals:
            if x and x not in out:out.append(x)
          print('TMDB_45950_ALIASES '+json.dumps(out,ensure_ascii=False))
          PY
