name: Debug Desktop Purstream normalize error

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-normalize-error.yml"

permissions:
  contents: read

jobs:
  normalize-error:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage provider floor with normalize sentinel
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          row=next(r for r in manifest["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=(root/row["filename"]).read_text(encoding="utf-8")
          tv=text.find("/* NUVIO_PURSTREAM_TV_IDENTITY_V3:")
          if tv<0:
              raise SystemExit("missing Purstream TV marker")
          floor=text[:tv].rstrip()+"\n"
          probe=floor+r'''
          applyPurstreamDomain({api:"https://api.purstream.mx/api/v1",referer:"https://purstream.mx/"});
          module.exports.getStreams=function(){
            try {
              var meta={enName:"Interstellar",year:"2014",duration:"169 min"};
              var rows=[{url:"https://free.finepulfe.xyz/movies/157336-unr8i/master.m3u8",name:"pulse | 1080p | MULTI"}];
              var out=normalizeMovieSources(rows,meta);
              return Promise.resolve([{
                url:"https://example.invalid/niakvio-debug-ok.mp4",
                name:"FIELD_PURSTREAM_NORMALIZE_OK_LEN:"+String(out&&out.length||0),
                title:"FIELD_PURSTREAM_NORMALIZE_OK_LEN:"+String(out&&out.length||0)
              }]);
            } catch (e) {
              var msg=e&&e.message?String(e.message):String(e);
              var stack=e&&e.stack?String(e.stack):"";
              return Promise.resolve([{
                url:"https://example.invalid/niakvio-debug.mp4",
                name:"FIELD_PURSTREAM_NORMALIZE_ERROR:"+msg,
                title:"FIELD_PURSTREAM_NORMALIZE_ERROR:"+msg,
                description:stack
              }]);
            }
          };
          globalThis.getStreams=module.exports.getStreams;
          '''
          Path("purstream-normalize-error.js").write_text(probe,encoding="utf-8")
          print("FIELD_PURSTREAM_NORMALIZE_ERROR_STAGE path="+row["filename"])
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused normalize error test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamNormalizeErrorTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamNormalizeErrorTest {
              @Test
              fun normalizeError() = runBlocking {
                  val workspace=File(System.getenv("GITHUB_WORKSPACE"))
                  val rows=PluginRuntime.executePlugin(
                      code=File(workspace,"purstream-normalize-error.js").readText(),
                      tmdbId="157336",
                      mediaType="movie",
                      season=null,
                      episode=null,
                      scraperId="PURSTREAM",
                  )
                  val first=rows.firstOrNull()
                  val line="FIELD_PURSTREAM_NORMALIZE_ERROR_RESULT count="+rows.size+
                      " firstName="+(first?.name?:"")+
                      " firstTitle="+(first?.title?:"")+
                      " description="+(first?.description?:"").replace("\n"," | ")
                  println(line)
                  File(workspace,"purstream-normalize-error.txt").writeText(line+"\n")
              }
          }
          KOTLIN

      - name: Execute normalize error probe
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamNormalizeErrorTest'             --no-build-cache --no-configuration-cache --console=plain
          cat "$GITHUB_WORKSPACE/purstream-normalize-error.txt"
