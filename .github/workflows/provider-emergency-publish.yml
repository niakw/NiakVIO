name: Emergency publish corrected providers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-emergency-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable shared direct-media pass-through
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('provider-overrides.json')
          d = json.loads(p.read_text())
          pol = d.setdefault('media_enrichment_policy', {})
          caps = list(pol.get('capabilities') or [])
          if 'direct_media' not in caps:
              caps.append('direct_media')
          pol['capabilities'] = caps
          pol['version'] = max(2, int(pol.get('version') or 1))
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Rematerialize corrected bundles
        run: |
          cp manifest.json /tmp/manifest-before.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous /tmp/manifest-before.json
          node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json --previous /tmp/manifest-before.json
          python tests/global_media_enrichment_direct_safety_test.py
          python scripts/reapply_published_overrides.py --check
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
      - name: Publish immediately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json manifest.json vf/manifest.json provider_catalog.json package.json package-lock.json sources.json PROVENANCE.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json providers/
          if [ -f vostfr/manifest.json ]; then git add vostfr/manifest.json; fi
          git commit -m 'chore: emergency publish corrected provider bundles'
          git fetch origin main
          git rebase origin/main
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
