name: PROVIDER - Bulk Onboarding

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository JSON file containing a provider list or {providers:[...]}
        required: false
        default: .github/provider-onboarding/batch.json
        type: string
      allow_replace_existing:
        description: Permit explicit replace_existing rows
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/provider-onboarding/batch.json'
permissions:
  contents: read

concurrency:
  group: niakvio-provider-bulk-onboarding-main
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      provider_count: ${{ steps.summary.outputs.provider_count }}
      publication_mode: ${{ steps.summary.outputs.publication_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned runtime and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --no-input "Pillow==12.3.0"

      - name: Resolve bulk request
        shell: bash
        env:
          INPUT_REQUEST_PATH: ${{ inputs.request_path || '.github/provider-onboarding/batch.json' }}
        run: |
          set -euo pipefail
          REQUEST="$INPUT_REQUEST_PATH"
          test -s "$REQUEST" || {
            echo "Bulk onboarding request not found: $REQUEST" >&2
            exit 2
          }
          echo "REQUEST=$REQUEST" >> "$GITHUB_ENV"

      - name: Capture unrelated active exact-byte baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_unrelated_active_provider_bytes.py \
            --request "$REQUEST" \
            --baseline /tmp/provider-active-byte-baseline.json \
            --capture

      - name: Preflight bulk request
        shell: bash
        env:
          ALLOW_REPLACE: ${{ inputs.allow_replace_existing || false }}
        run: |
          set -euo pipefail
          args=(--request "$REQUEST" --output automation/provider-bulk-onboarding-preflight.json --dry-run)
          request_allow_replace="$(python - <<'PY'
          import json, os
          value=json.load(open(os.environ["REQUEST"], encoding="utf-8"))
          print("true" if isinstance(value,dict) and value.get("allowReplaceExisting") is True else "false")
          PY
          )"
          if [ "$ALLOW_REPLACE" = "true" ] || [ "$request_allow_replace" = "true" ]; then args+=(--allow-replace-existing); fi
          python scripts/stage_provider_batch.py "${args[@]}"

      - name: Stage all providers disabled and pending
        shell: bash
        env:
          ALLOW_REPLACE: ${{ inputs.allow_replace_existing || false }}
        run: |
          set -euo pipefail
          args=(--request "$REQUEST" --output automation/provider-bulk-onboarding-stage.json)
          request_allow_replace="$(python - <<'PY'
          import json, os
          value=json.load(open(os.environ["REQUEST"], encoding="utf-8"))
          print("true" if isinstance(value,dict) and value.get("allowReplaceExisting") is True else "false")
          PY
          )"
          if [ "$ALLOW_REPLACE" = "true" ] || [ "$request_allow_replace" = "true" ]; then args+=(--allow-replace-existing); fi
          python scripts/stage_provider_batch.py "${args[@]}"

      - name: Generate deterministic offline branding placeholders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          request=Path(os.environ["REQUEST"])
          raw=json.loads(request.read_text(encoding="utf-8"))
          rows=raw.get("providers") if isinstance(raw,dict) else raw
          for row in rows or []:
              if not isinstance(row,dict):
                  continue
              pid=str(row.get("id") or "").strip()
              name=str(row.get("name") or pid).strip()
              if not pid:
                  continue
              subprocess.run([
                  sys.executable,"scripts/provider_branding_assets.py",
                  "--mode","only","--provider",pid,"--name",name,"--offline-fallback",
              ],check=True)
          PY

      - name: Reconcile pending publication without rewriting active bytes
        shell: bash
        run: |
          set -euo pipefail
          # stage_provider_batch already emits every pending bundle at the safe
          # Provider-v3 minimizer fixed point. Do not reapply/rebuild unrelated
          # active providers here: their exact bytes are bound to retained
          # playback evidence and must remain immutable during onboarding.
          python scripts/reconcile_provider_static_authority.py --apply
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          # Provider-local onboarding metadata can legitimately make the global
          # publication fingerprint stale without changing any active JS byte.
          # Check the active bytes themselves here; publication fingerprints
          # are refreshed only by their owning release/reconstruction pipeline.
          python tests/provider_pending_minimizer_test.py
          python scripts/verify_unrelated_active_provider_bytes.py \
            --request "$REQUEST" \
            --baseline /tmp/provider-active-byte-baseline.json \
            --verify
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          python scripts/provider_base_store.py repair-legacy
          python scripts/validate_published_provider_config.py

      - name: Validate bulk onboarding contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/add_provider.py scripts/stage_provider_batch.py scripts/audit_provider_quick_yield.py scripts/merge_provider_census_shards.py scripts/reconcile_provider_static_authority.py scripts/activate_bulk_offline_proven_providers.py
          python tests/provider_bulk_onboarding_test.py
          python tests/provider_bulk_onboarding_workflow_test.py
          python tests/provider_bulk_active_byte_stability_test.py
          python tests/provider_pending_minimizer_test.py
          python tests/provider_executable_plan_contract_test.py
          python tests/provider_bulk_offline_rematerialization_contract_test.py
          python tests/provider_bulk_offline_capacity_test.py
          python tests/provider_bulk_activation_catalog_projection_test.py
          python tests/provider_identity_alias_migration_test.py
          python tests/open_archive_public_domain_runtime_test.py
          python tests/provider_logo_asset_contract_test.py
          python tests/provider_branding_contract_test.py
          # Bulk onboarding must not rematerialize the unrelated active ProviderBase fleet.
          # Validate exact current active base references/layering instead.
          python scripts/provider_base_store.py validate
          python tests/provider_js_lego_ownership_test.py
          python tests/provider_census_new_provider_scope_test.py
          node engine_v2/tests/provider-catalog.test.mjs

      - id: offline_activation
        name: Activate exact bytes under explicit WAF-limited offline contract
        shell: bash
        run: |
          set -euo pipefail
          mode="$(python - <<'PY'
          import json, os
          value=json.load(open(os.environ["REQUEST"], encoding="utf-8"))
          print(str(value.get("activationPolicy") or "") if isinstance(value,dict) else "")
          PY
          )"
          if [ "$mode" != "bulk_offline_contract_live_unverified" ]; then
            echo "activation_count=0" >> "$GITHUB_OUTPUT"
            echo "activation_mode=stage-only" >> "$GITHUB_OUTPUT"
            echo "FIELD_BULK_ACTIVATION skipped=true mode=${mode:-stage-only}"
            exit 0
          fi
          python scripts/activate_bulk_offline_proven_providers.py \
            --stage automation/provider-bulk-onboarding-stage.json \
            --request "$REQUEST" \
            --output automation/provider-bulk-offline-activation-latest.json
          node engine_v2/scripts/render-manifests-from-catalog.mjs
          python scripts/provider_base_store.py repair-legacy
          python scripts/validate_published_provider_config.py
          python scripts/verify_unrelated_active_provider_bytes.py \
            --request "$REQUEST" \
            --baseline /tmp/provider-active-byte-baseline.json \
            --verify
          python tests/production_active_provider_freshness_test.py
          python tests/provider_js_lego_ownership_test.py
          count="$(python - <<'PY'
          import json
          value=json.load(open("automation/provider-bulk-offline-activation-latest.json", encoding="utf-8"))
          print(int(value.get("activationCount") or 0))
          PY
          )"
          expected="$(python - <<'PY'
          import json
          value=json.load(open("automation/provider-bulk-onboarding-stage.json", encoding="utf-8"))
          print(int(value.get("providerCount") or 0))
          PY
          )"
          test "$count" -gt 0
          test "$count" -le "$expected"
          python - <<'PY'
          import json, os
          request=json.load(open(os.environ["REQUEST"], encoding="utf-8"))
          targets=request.get("targetActive") if isinstance(request,dict) else {}
          expected_global=int((targets or {}).get("global") or 0)
          expected_france=int((targets or {}).get("france") or 0)
          global_manifest=json.load(open("manifest.json", encoding="utf-8"))
          france_manifest=json.load(open("vf/manifest.json", encoding="utf-8"))
          actual_global=sum(1 for row in global_manifest.get("scrapers") or [] if isinstance(row,dict) and row.get("enabled") is not False)
          actual_france=sum(1 for row in france_manifest.get("scrapers") or [] if isinstance(row,dict) and row.get("enabled") is not False)
          if expected_global <= 0 or expected_france <= 0:
              raise SystemExit("targetActive.global and targetActive.france are required for offline bulk activation")
          if actual_global > expected_global or actual_france > expected_france:
              raise SystemExit(
                  f"production active target exceeded: Global {actual_global}/{expected_global}, "
                  f"France {actual_france}/{expected_france}"
              )
          print(
              f"PROVIDER_ACTIVE_TARGET_PROGRESS global={actual_global}/{expected_global} "
              f"france={actual_france}/{expected_france}"
          )
          PY
          echo "activation_count=$count" >> "$GITHUB_OUTPUT"
          echo "activation_mode=offline-live-unverified" >> "$GITHUB_OUTPUT"

      - id: summary
        name: Export batch publication size
        shell: bash
        env:
          ACTIVATION_COUNT: ${{ steps.offline_activation.outputs.activation_count }}
          ACTIVATION_MODE: ${{ steps.offline_activation.outputs.activation_mode }}
        run: |
          set -euo pipefail
          staged="$(python - <<'PY'
          import json
          value=json.load(open("automation/provider-bulk-onboarding-stage.json", encoding="utf-8"))
          print(int(value.get("providerCount") or 0))
          PY
          )"
          test "$staged" -gt 0
          activation_count="${ACTIVATION_COUNT:-0}"
          mode="${ACTIVATION_MODE:-stage-only}"
          if [ "$mode" = "offline-live-unverified" ]; then
            test "$activation_count" -gt 0
            test "$activation_count" -le "$staged"
            publish_count="$activation_count"
          else
            publish_count="$staged"
          fi
          echo "provider_count=$publish_count" >> "$GITHUB_OUTPUT"
          echo "publication_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "FIELD_BULK_PUBLICATION_SUMMARY staged=$staged activated=$activation_count mode=$mode"

      - name: Package one atomic bulk transaction
        shell: bash
        run: |
          set -euo pipefail
          git add             manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json             provider_catalog.json PROVENANCE.json provider-overrides.json provider-hubs.json provider-type-policy.json automation/provider-v3-static-knowledge.json             provider-bases providers provider-disabled assets/providers automation/provider-bulk-onboarding-stage.json
          if [ -f automation/provider-bulk-offline-activation-latest.json ]; then
            git add automation/provider-bulk-offline-activation-latest.json
          fi
          mkdir -p .provider-onboarding
          git rev-parse HEAD > .provider-onboarding/bulk-base-sha.txt
          git diff --cached --binary --full-index > .provider-onboarding/bulk-provider-transaction.patch
          cp automation/provider-bulk-onboarding-stage.json .provider-onboarding/bulk-summary.json

      - name: Upload bulk transaction
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-bulk-onboarding-transaction-${{ github.run_id }}
          path: |
            .provider-onboarding/bulk-base-sha.txt
            .provider-onboarding/bulk-provider-transaction.patch
            .provider-onboarding/bulk-summary.json
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: stage
    if: ${{ needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: provider-bulk-onboarding-transaction-${{ github.run_id }}
          path: checked-transaction

      - id: publish
        name: Publish disabled/pending provider batch
        shell: bash
        env:
          PROVIDER_COUNT: ${{ needs.stage.outputs.provider_count }}
          PUBLICATION_MODE: ${{ needs.stage.outputs.publication_mode }}
        run: |
          set -euo pipefail
          BASE_SHA="$(tr -d '\r\n' < checked-transaction/bulk-base-sha.txt)"
          PATCH="$RUNNER_TEMP/bulk-provider-transaction.patch"
          cp checked-transaction/bulk-provider-transaction.patch "$PATCH"
          test -n "$BASE_SHA"
          git config user.name "niakvio-provider-bulk-onboarding"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git merge-base --is-ancestor "$BASE_SHA" HEAD || {
              echo "Validated bulk base $BASE_SHA is not an ancestor of current main." >&2
              exit 3
            }
            if [ ! -s "$PATCH" ]; then
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git apply --3way --index "$PATCH"; then
              echo "Bulk patch no longer merges on latest main (attempt $attempt); retrying from fresh origin/main." >&2
              git reset --hard origin/main
              continue
            fi
            if git diff --cached --quiet; then
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PUBLICATION_MODE" = "offline-live-unverified" ]; then
              message="provider: bulk activate $PROVIDER_COUNT offline-unverified"
            else
              message="provider: bulk stage $PROVIDER_COUNT pending candidates"
            fi
            git commit -m "$message"
            if git push origin HEAD:main; then
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main advanced during bulk publication (attempt $attempt); replaying validated patch on newest main." >&2
          done
          echo "Bulk publication could not obtain a stable latest-main transaction after 3 attempts." >&2
          exit 4

      - name: Continue deferred discovery toward 60/60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/provider-bulk-continuation.env
          import json
          from pathlib import Path
          request=json.loads(Path(".github/provider-onboarding/batch.json").read_text(encoding="utf-8"))
          deferred=[row for row in request.get("deferredProviders") or [] if isinstance(row,dict)]
          global_manifest=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          france_manifest=json.loads(Path("vf/manifest.json").read_text(encoding="utf-8"))
          g=sum(1 for row in global_manifest.get("scrapers") or [] if isinstance(row,dict) and row.get("enabled") is not False)
          f=sum(1 for row in france_manifest.get("scrapers") or [] if isinstance(row,dict) and row.get("enabled") is not False)
          run=bool(deferred) and (g < 60 or f < 60)
          print(f"RUN={'true' if run else 'false'}")
          print(f"GLOBAL_ACTIVE={g}")
          print(f"FRANCE_ACTIVE={f}")
          print(f"DEFERRED={len(deferred)}")
          PY
          source /tmp/provider-bulk-continuation.env
          echo "FIELD_BULK_CONTINUATION global=$GLOBAL_ACTIVE france=$FRANCE_ACTIVE deferred=$DEFERRED run=$RUN"
          if [ "$RUN" = "true" ]; then
            gh workflow run provider-bulk-route-discovery.yml --ref main
          fi
