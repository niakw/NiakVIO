name: NiakVIO finalization explicit launcher temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalization-explicit-launcher-temp.yml'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: niakvio-finalization-explicit-launcher-temp
  cancel-in-progress: true

env:
  NIAKVIO_FINALIZATION_LAUNCH_REVISION: "core-v1"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Launch exact Core finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run core-media-finalize-main.yml --repo "$REPO" --ref main >/dev/null
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$REPO" --workflow core-media-finalize-main.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Unable to capture Core finalizer workflow_dispatch run" >&2
            exit 1
          fi
          gh issue comment 69 --repo "$REPO" --body "Explicit Core finalizer launched on ${GITHUB_SHA}: CORE_RUN=${run_id} https://github.com/${REPO}/actions/runs/${run_id}."
