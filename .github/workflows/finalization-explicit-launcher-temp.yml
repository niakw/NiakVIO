name: NiakVIO finalization explicit launcher temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalization-explicit-launcher-temp.yml'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: niakvio-finalization-explicit-launcher-temp
  cancel-in-progress: true

env:
  NIAKVIO_FINALIZATION_LAUNCH_REVISION: "current-v4"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Announce launcher run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment 69 --repo "$REPO" --body "Finalization launcher started: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}."
      - name: Dispatch exact current validation runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_and_capture() {
            local workflow="$1"
            local started run_id
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$REPO" --ref main >/dev/null
            run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo "$REPO" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" | head -n1)"
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done
            test -n "$run_id"
            echo "$run_id"
          }
          ANDROID_RUN="$(dispatch_and_capture native-android-route-reader.yml)"
          DESKTOP_RUN="$(dispatch_and_capture native-desktop-reader-acceptance.yml)"
          CORE_TRACE_RUN="$(dispatch_and_capture core-reapply-diagnostic-once.yml)"
          gh issue comment 69 --repo "$REPO" --body "Current finalization runs launched on ${GITHUB_SHA}: ANDROID_RUN=${ANDROID_RUN} https://github.com/${REPO}/actions/runs/${ANDROID_RUN} ; DESKTOP_RUN=${DESKTOP_RUN} https://github.com/${REPO}/actions/runs/${DESKTOP_RUN} ; CORE_TRACE_RUN=${CORE_TRACE_RUN} https://github.com/${REPO}/actions/runs/${CORE_TRACE_RUN}."
