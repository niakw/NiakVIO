name: Provider branding assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Update one provider only, or manually rebuild all provider assets
        required: true
        default: only
        type: choice
        options:
          - only
          - full
      provider:
        description: Exact provider id (required for only)
        required: false
        default: ""
        type: string
      name:
        description: Optional display name override for only
        required: false
        default: ""
        type: string
      site:
        description: Optional public site/hub used to discover the logo
        required: false
        default: ""
        type: string
      logo_url:
        description: Optional explicit public logo URL
        required: false
        default: ""
        type: string
      emoji:
        description: Optional explicit provider emoji
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: niakvio-provider-branding-main
  cancel-in-progress: true

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install image dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "Pillow==12.3.0"

      - name: Update committed provider branding assets
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          PROVIDER: ${{ inputs.provider }}
          DISPLAY_NAME: ${{ inputs.name }}
          SITE: ${{ inputs.site }}
          LOGO_URL: ${{ inputs.logo_url }}
          EMOJI: ${{ inputs.emoji }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "only" ]; then
            test -n "$PROVIDER" || { echo "provider is required in only mode" >&2; exit 2; }
            python scripts/provider_branding_assets.py               --mode only               --provider "$PROVIDER"               --name "$DISPLAY_NAME"               --site "$SITE"               --logo-url "$LOGO_URL"               --emoji "$EMOJI"
          else
            python scripts/provider_branding_assets.py --mode full
          fi

      - name: Reproject manifests and provider catalogue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_language_manifests.py
          node engine_v2/scripts/bootstrap-provider-catalog.mjs
          node engine_v2/scripts/render-manifests-from-catalog.mjs

      - name: Validate branding assets
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_logo_asset_contract_test.py
          python tests/provider_branding_contract_test.py
          node engine_v2/tests/provider-catalog.test.mjs

      - name: Publish branding transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "niakvio-provider-assets"
          git config user.email "actions@users.noreply.github.com"
          git add             manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json             provider_catalog.json assets/providers/index.json assets/providers/emojis.json             assets/providers/72x32 assets/providers/96x40 assets/providers/96x96
          if git diff --cached --quiet; then
            echo "No provider branding changes."
            exit 0
          fi
          git commit -m "assets: refresh provider branding"
          git push origin HEAD:main
