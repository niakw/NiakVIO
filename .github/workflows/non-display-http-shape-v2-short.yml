name: DIAG - Exact Remaining Parser Shapes
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/non-display-http-shape-v2-short.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Inspect exact shapes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def req(url,method='GET',body=None,ref=None):
            h={'User-Agent':UA,'Accept':'text/html,application/json,*/*','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.7'}
            if ref:h['Referer']=ref
            if method=='POST':h.update({'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'})
            try:
              with urllib.request.urlopen(urllib.request.Request(url,data=body.encode() if isinstance(body,str) else body,headers=h,method=method),timeout=12) as r:return r.read(800000).decode('utf-8','replace')
            except Exception as e:return 'ERR '+type(e).__name__+' '+str(e)
          # AnimeSama fallback query structure
          b='https://animesama.co'
          for q in ['High School DxD','School','High','DxD']:
            h=req(b+'/template-php/defaut/fetch.php','POST','query='+urllib.parse.quote(q),b+'/')
            links=re.findall(r'<a[^>]*class=["\'][^"\']*asn-search-result[^"\']*["\'][^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]{0,1200}?)</a>',h,re.I)
            generic=re.findall(r'href=["\']([^"\']*/anime/[^"\']+\.html)["\']',h,re.I)
            print('EXACT_ASCO '+json.dumps({'q':q,'len':len(h),'classLinks':[(x,re.sub('<[^>]+>',' ',y)[:160]) for x,y in links[:8]],'generic':generic[:8]},ensure_ascii=False))
          # Sekai exact LHS + decoded atob host hints
          b='https://sekai.one';h=req(b+'/my-hero-academia',ref=b+'/')
          lhs=re.findall(r'((?:episode|episodeHD|episodeFHD|episodeVF|episodeVOSTFR)\s*\[[^\]]+\]\s*=\s*[^;\n]{1,240})',h,re.I)
          atobs=[]
          import base64
          for name,val in re.findall(r'(?:var|let|const)\s+([A-Za-z_$][\w$]*)\s*=\s*atob\(\s*["\']([^"\']+)["\']\s*\)',h,re.I):
            try: dec=base64.b64decode(val).decode('utf-8','replace')
            except: dec=''
            atobs.append((name,dec[:180]))
          print('EXACT_SEKAI '+json.dumps({'lhs':lhs[:18],'atobs':atobs[:8]},ensure_ascii=False))
          # VoirAnime rip player-bearing snippets
          b='https://voiranime.rip';h=req(b+'/spy-x-family-1/saison-1/episode-1/',ref=b+'/spy-x-family-1/')
          frames=re.findall(r'<iframe[^>]{0,1200}>',h,re.I)
          sib=[x for x in re.findall(r'.{0,180}video\.sibnet\.ru.{0,240}',h,re.I|re.S)]
          print('EXACT_VRIP '+json.dumps({'frames':frames[:6],'sib':sib[:4]},ensure_ascii=False))
          # Coflix exact Thor candidates + player host lists for first exact slugs
          b='https://coflix.wiki';h=req(b+'/ajax/search/suggest?keyword=Thor',ref=b+'/')
          try: html=json.loads(h).get('html') or ''
          except: html=h
          eps=[]
          for sl,eid in re.findall(r'href=["\'](?:https?://coflix\.wiki)?/film/([^"\'/]+)/ep-(\d+)["\']',html,re.I):
            clean=re.sub(r'-(?:vf|vostfr|truefrench|french)$','',sl,flags=re.I)
            if clean=='thor':eps.append((sl,eid))
          rows=[]
          for sl,eid in eps[:6]:
            ph=req(b+'/ajax/episode/player?episode_id='+eid,'POST','episode_id='+eid,b+'/film/'+sl+'/')
            try:j=json.loads(ph);msg=j.get('message') or []
            except:msg=[]
            hosts=[]
            for x in msg:
              u=x.get('server_link') if isinstance(x,dict) else None
              if isinstance(u,dict):u=u.get('url')
              if isinstance(u,str):
                try:hosts.append(urllib.parse.urlsplit(u).hostname)
                except:pass
            rows.append({'slug':sl,'eid':eid,'hosts':hosts})
          print('EXACT_COFLIX '+json.dumps(rows,ensure_ascii=False))
          PY
