name: ONE-SHOT - TV Audited Ref Replay

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/native-tv-verified-ref.json'

permissions:
  contents: write

concurrency:
  group: one-shot-native-tv-audited-ref-replay
  cancel-in-progress: false

env:
  NIAKVIO_RELEASE_SHA: 5a74a445c21c91dc86ce11285290c5f72758381b
  NIAKVIO_REPRESENTATIVE_FIXTURES: "interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01"
  NIAKVIO_SKIP_ANDROID_PREBUILD: "1"
  NIAKVIO_ANDROID_PROVIDER_TIMEOUT_MS: "25000"

jobs:
  tv-audited-ref-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout exact replay trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Prove provider bytes unchanged from 5.21.42 release
        shell: bash
        run: |
          set -euo pipefail
          git -C niakvio fetch origin "${NIAKVIO_RELEASE_SHA}"
          git -C niakvio diff --exit-code "${NIAKVIO_RELEASE_SHA}"..HEAD -- \
            manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            providers/ provider-bases/ provider-overrides.json provider_catalog.json PROVENANCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('niakvio/manifest.json').read_text(encoding='utf-8'))
          rows=m.get('scrapers') or []
          assert m.get('version') == '5.21.42', m.get('version')
          assert len(rows) == 96, len(rows)
          assert sum(row.get('enabled') is not False for row in rows) == 96
          print('TV_REPLAY_PUBLICATION_IDENTITY_OK version=5.21.42 providers=96 enabled=96')
          PY

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24", package-manager-cache: false}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true

      - name: Restore TV AVD snapshot and matching debug signing key
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-v5-${{ runner.os }}-tv-api31-android-tv-x86-tv_1080p

      - id: upstream
        name: Resolve audited NuvioTV ref from repository policy
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('niakvio/automation/nuvio-client-upstreams.json').read_text(encoding='utf-8'))
          print(d['clients']['nuvio-tv']['verified_ref'])
          PY
          )"
          test -n "$SHA"
          echo "tv_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "TV_AUDITED_REF_REPLAY sha=$SHA"

      - name: Checkout audited NuvioTV ref, inject TMDB key and stage first route
        shell: bash
        env:
          NUVIO_TV_SHA: ${{ steps.upstream.outputs.tv_sha }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${TMDB_API_KEY:-}" || { echo 'TMDB_API_KEY required' >&2; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
          git -C nuvio-tv checkout "$NUVIO_TV_SHA"
          umask 077
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > nuvio-tv/local.properties
          touch nuvio-tv/local.dev.properties
          python3 niakvio/scripts/prepare_native_reader_acceptance.py tv --fixture interstellar --workspace "$GITHUB_WORKSPACE" --manifest manifest.json --provider declared-type --streams 2 --initial

      - name: Prebuild audited TV reader once before QEMU
        shell: bash
        env:
          NIAKVIO_TARGET_MANIFEST: manifest.json
          NIAKVIO_TARGET_PROVIDER: declared-type
          NIAKVIO_PRIMARY_FIXTURE: interstellar
          NIAKVIO_PRIMARY_STREAM_SCOPE: "2"
        run: bash niakvio/scripts/prebuild_native_android_reader_suite.sh tv

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
      - name: Prime Android adb server
        run: bash niakvio/scripts/prime_android_lab_adb.sh

      - name: Execute movie TV anime in one TV boot
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          NIAKVIO_TARGET_FIXTURES: "interstellar breaking-bad-s01e01 jujutsu-kaisen-s01e01"
          NIAKVIO_TARGET_PROVIDER: declared-type
          NIAKVIO_TARGET_MANIFEST: manifest.json
          NIAKVIO_READER_ACCEPTANCE: "1"
          NIAKVIO_TV_PRIORITY_APPEND: "0"
          NIAKVIO_TV_ROUTE_TIMEOUT_MINUTES: "45"
          NIAKVIO_TV_CHECKPOINT_DIR: ${{ github.workspace }}/native-evidence/tv-audited/checkpoints
          NIAKVIO_TV_RESUME_CHECKPOINT_DIR: ${{ github.workspace }}/native-evidence/tv-audited/checkpoints
          NIAKVIO_PRIMARY_FIXTURE: interstellar
          NIAKVIO_PRIMARY_STREAM_SCOPE: "2"
          NIAKVIO_REGRESSION_STREAM_SCOPE: "2"
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: ${{ steps.avd-cache.outputs.cache-hit == 'true' && '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim' || '-no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim' }}
          script: bash "$GITHUB_WORKSPACE/niakvio/scripts/run_native_corpus_tv_suite.sh"

      - name: Verify exhaustive TV provider matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 niakvio/scripts/gate_native_declared_provider_matrix.py \
            --client tv \
            --manifest niakvio/manifest.json \
            --corpus niakvio/.github/triggers/nuvio-client-lab.json \
            "$GITHUB_WORKSPACE"/tv-native-corpus-*.log

      - name: Diagnose complete TV evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for fixture in $NIAKVIO_REPRESENTATIVE_FIXTURES; do
            LOG="$GITHUB_WORKSPACE/tv-native-corpus-${fixture}.log"
            test -s "$LOG"
            node niakvio/engine_v2/scripts/diagnose-native-reader.mjs --output "$GITHUB_WORKSPACE/tv-audited-${fixture}-brain.json" "$LOG"
          done

      - name: Upload TV audited-ref evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tv-audited-ref-${{ github.run_id }}
          path: |
            tv-native-corpus-*.log
            tv-native-frontend-*.log
            tv-audited-*-brain.json
            native-evidence/tv-audited/**
          retention-days: 8
          if-no-files-found: warn

      - name: Remove one-shot infrastructure after successful evidence capture
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git -C niakvio fetch origin main
          test "$(git -C niakvio rev-parse origin/main)" = "${GITHUB_SHA}" || {
            echo 'TV replay completed but main advanced; leave one-shot cleanup for a later commit.' >&2
            exit 0
          }
          rm -f niakvio/.github/workflows/native-tv-verified-ref-one-shot.yml niakvio/.github/triggers/native-tv-verified-ref.json
          git -C niakvio config user.name 'github-actions[bot]'
          git -C niakvio config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C niakvio add -A
          git -C niakvio commit -m 'chore(native): remove completed TV audited-ref one-shot'
          git -C niakvio push origin HEAD:main
