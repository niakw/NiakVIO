name: TEMP - Anime-Sama CONFIG Rematerialize

on:
  push:
    branches:
      - tmp/provider-max-repair-proof-20260919
    paths:
      - '.github/workflows/temp-anime-sama-config-rematerialize.yml'

permissions:
  contents: write

concurrency:
  group: niakvio-temp-anime-sama-config-rematerialize
  cancel-in-progress: true

jobs:
  rematerialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/provider-max-repair-proof-20260919
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild Anime-Sama published CONFIG only
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          ROOT=Path.cwd()
          sys.path.insert(0,str(ROOT/"scripts"))
          from domain_refresh_transaction_v2 import rebuild_provider_configs
          from sync_manifest_projection_rows import sync
          updates=rebuild_provider_configs(["anime-sama"])
          if len(updates) != 1 or updates[0].get("provider") != "anime-sama":
              raise SystemExit(f"unexpected rebuild scope: {updates!r}")
          sync(check=False)
          print("FIELD_ANIME_SAMA_CONFIG_REMATERIALIZED", updates)
          PY
      - name: Inspect generated scope
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          git diff --name-status
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(["git","status","--short"],text=True).splitlines()
          touched=[row[3:] for row in rows if len(row)>=4]
          allowed_prefixes=(
              "providers/anime-sama--",
          )
          allowed_exact={
              "manifest.json",
              "provider-v3-materialization.json",
              "vf/manifest.json",
              "no-anime/manifest.json",
              "native-hub46/manifest.json",
              "manifest-hub46.json",
              "provider_catalog.json",
          }
          bad=[p for p in touched if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if bad:
              raise SystemExit(f"unexpected generated paths: {bad}")
          if not any(p.startswith("providers/anime-sama--") for p in touched):
              raise SystemExit("Anime-Sama provider bytes did not rotate")
          PY
      - name: Validate exact structured DATA
        run: |
          set -euo pipefail
          python scripts/audit_provider_v3_static.py
          python tests/provider_animesamaco_domain_data_contract_test.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_stream_output_guard_test.py
      - name: Commit generated publication bytes to repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix(anime-sama): rematerialize current provider DATA"
          git push origin HEAD:tmp/provider-max-repair-proof-20260919
