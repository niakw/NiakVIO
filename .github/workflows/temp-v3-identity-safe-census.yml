name: TEMP - V3 identity-safe census

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-v3-identity-safe-census.yml]

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

jobs:
  identity-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Patch V3 to require terminal plus strong route identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_provider_upstream_parity_v3.py')
          s=p.read_text(encoding='utf-8')
          imp='from rotating_corpus import default_seed, select_fixtures\n'
          if 'from upstream_identity_guard import classify_route_identity' not in s:
              s=s.replace(imp,imp+'from upstream_identity_guard import classify_route_identity\n',1)

          old='''    cmd = [\n        "node",\n        str(parity.WORKER),\n        str(path),\n        json.dumps(fixture, separators=(",", ":")),\n        json.dumps(parity.context_for(fixture), separators=(",", ":")),\n    ]'''
          new='''    context = parity.context_for(fixture)\n    # Route proof stays in-memory. Persisted V3 reports retain only the bounded\n    # identity verdict/reason, never provider URLs.\n    context["routeProofTrace"] = True\n    cmd = [\n        "node",\n        str(parity.WORKER),\n        str(path),\n        json.dumps(fixture, separators=(",", ":")),\n        json.dumps(context, separators=(",", ":")),\n    ]'''
          if old in s:s=s.replace(old,new,1)
          elif 'context["routeProofTrace"] = True' not in s:raise SystemExit('worker context patch anchor missing')

          old='''    verified = [row for row in terminal_rows if row.get("verified")]\n    error_details = raw.get("error_details") if isinstance(raw.get("error_details"), dict) else {}'''
          new='''    identity = classify_route_identity(raw, fixture)\n    verified = [row for row in terminal_rows if row.get("verified")]\n    if identity.get("status") == "CONTRADICTION":\n        # Playable media for the wrong work is not a positive authority.\n        verified = []\n    error_details = raw.get("error_details") if isinstance(raw.get("error_details"), dict) else {}'''
          if old in s:s=s.replace(old,new,1)
          elif 'identity = classify_route_identity(raw, fixture)' not in s:raise SystemExit('verified identity patch anchor missing')

          old='''        "terminal_reasons": sorted({str(row.get("reason")) for row in terminal_rows if row.get("reason")}),\n        "error_class": str(error_details.get("code") or error_details.get("name") or "")[:120] or None,'''
          new='''        "terminal_reasons": sorted({str(row.get("reason")) for row in terminal_rows if row.get("reason")}),\n        "identity_status": str(identity.get("status") or "UNKNOWN"),\n        "identity_reason": str(identity.get("reason") or "")[:160] or None,\n        "error_class": str(error_details.get("code") or error_details.get("name") or "")[:120] or None,'''
          if old in s:s=s.replace(old,new,1)
          elif '"identity_status"' not in s:raise SystemExit('identity result patch anchor missing')

          old='''def classify_pair(upstream: dict[str, Any], local: dict[str, Any]) -> str:\n    up = int(upstream.get("stream_count") or 0) > 0\n    lo = int(local.get("stream_count") or 0) > 0\n    if up and lo:\n        return "both_ok"\n    if up and not lo:\n        return "upstream_ok_niakvio_ko"\n    if not up and lo:\n        return "niakvio_ok_upstream_ko"'''
          new='''def classify_pair(upstream: dict[str, Any], local: dict[str, Any]) -> str:\n    up_wrong = upstream.get("identity_status") == "CONTRADICTION"\n    lo_wrong = local.get("identity_status") == "CONTRADICTION"\n    up = int(upstream.get("stream_count") or 0) > 0\n    lo = int(local.get("stream_count") or 0) > 0\n    if lo_wrong:\n        return "niakvio_wrong_identity"\n    if up_wrong and lo:\n        return "niakvio_ok_upstream_wrong_identity"\n    if up_wrong:\n        return "upstream_wrong_identity"\n    if up and lo:\n        return "both_ok"\n    if up and not lo:\n        return "upstream_ok_niakvio_ko"\n    if not up and lo:\n        return "niakvio_ok_upstream_ko"'''
          if old in s:s=s.replace(old,new,1)
          elif 'up_wrong = upstream.get("identity_status")' not in s:raise SystemExit('classification patch anchor missing')

          old='''            "both_ok",\n            "upstream_ok_niakvio_ko",\n            "niakvio_ok_upstream_ko",\n        }:'''
          new='''            "both_ok",\n            "upstream_ok_niakvio_ko",\n            "niakvio_ok_upstream_ko",\n            "niakvio_wrong_identity",\n            "niakvio_ok_upstream_wrong_identity",\n        }:'''
          if old in s:s=s.replace(old,new,1)

          old='''    if "upstream_ok_niakvio_ko" in classes:\n        status = "REGRESSION"\n    elif any(value in {"both_ok", "niakvio_ok_upstream_ko"} for value in classes):\n        status = "POSITIVE"\n    elif classes and all(value in {"catalog_miss_both", "upstream_candidate_unverified", "niakvio_candidate_unverified"} for value in classes):\n        status = "RESAMPLE"'''
          new='''    if any(value in {"upstream_ok_niakvio_ko", "niakvio_wrong_identity"} for value in classes):\n        status = "REGRESSION"\n    elif any(value in {"both_ok", "niakvio_ok_upstream_ko", "niakvio_ok_upstream_wrong_identity"} for value in classes):\n        status = "POSITIVE"\n    elif classes and all(value in {"catalog_miss_both", "upstream_candidate_unverified", "niakvio_candidate_unverified", "upstream_wrong_identity"} for value in classes):\n        status = "RESAMPLE"'''
          if old in s:s=s.replace(old,new,1)
          elif '"upstream_wrong_identity"' not in s:raise SystemExit('lane status patch anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/run_provider_upstream_parity_v3.py scripts/upstream_identity_guard.py tests/upstream_identity_guard_test.py
          python tests/upstream_identity_guard_test.py

      - name: Live exact identity checks
        run: |
          python - <<'PY'
          import json,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import run_provider_upstream_parity as base
          import run_provider_upstream_parity_v3 as v3
          local=base.local_catalog(); ups,errs=base.upstream_catalog(); assert not errs,errs
          cases={
            'animevostfr':{'tmdbId':'1061474','mediaType':'movie','title':'Superman','year':2025},
            'animesama-co':{'tmdbId':'1233413','mediaType':'movie','title':'Sinners','year':2025},
            'voiranime':{'tmdbId':'475557','mediaType':'movie','title':'Joker','year':2019},
          }
          with tempfile.TemporaryDirectory() as td:
            td=Path(td)
            for pid,f in cases.items():
              u=ups[pid]; upath=td/(pid+'.js');upath.write_bytes(base.get_bytes(u['url']))
              r=v3._run_verified(upath,v3.fixture_payload(f,'movie',upstream=True),35)
              print('LIVE_IDENTITY',pid,json.dumps(r,sort_keys=True))
              assert r.get('identity_status')=='CONTRADICTION',(pid,r)
              assert int(r.get('stream_count') or 0)==0,(pid,r)
          # Correct current local routes must not be auto-rejected by the guard.
          positive={
            'streamzo':({'tmdbId':'157336','mediaType':'movie','title':'Interstellar','year':2014},'movie'),
            'kurage':({'tmdbId':'94664','mediaType':'anime','category':'anime','title':'Mushoku Tensei: Jobless Reincarnation','year':2021,'season':1,'episode':1},'anime'),
          }
          for pid,(f,lane) in positive.items():
            r=v3._run_verified(local[pid]['path'],v3.fixture_payload(f,lane,upstream=False),40)
            print('LOCAL_IDENTITY',pid,json.dumps(r,sort_keys=True))
            assert r.get('identity_status')!='CONTRADICTION',(pid,r)
          PY

      - name: Fresh recent-debt census
        run: |
          python scripts/run_provider_upstream_parity_v3.py \
            --scope-matrix automation/evidence/hub-lab-matrix-46.json \
            --samples-per-lane 32 --workers 6 --timeout 25 \
            --seed 20260914-identity-safe \
            --out automation/provider-upstream-parity-v3.json \
            --provider animevostfr --provider kurage --provider voiranime --provider voiranime-rip \
            --provider mugiwarastream --provider streamzo --provider animesama-co \
            --provider moviesmod --provider vidfast --provider anikototv --provider animesalt --provider neko-sama
          python - <<'PY'
          import json
          d=json.load(open('automation/provider-upstream-parity-v3.json'))
          print('IDENTITY_SAFE_COUNTS',json.dumps(d.get('statusCounts') or {},sort_keys=True))
          print('IDENTITY_SAFE_REGRESSIONS',json.dumps(d.get('certainRegressions') or []))
          print('IDENTITY_SAFE_RESAMPLE',json.dumps(d.get('resampleProviders') or []))
          for row in d.get('providers') or []:
            print('IDENTITY_SAFE_PROVIDER',row.get('providerId'),row.get('status'),json.dumps([(x.get('lane'),x.get('status')) for x in row.get('lanes') or []]))
          PY

      - name: Commit identity-safe V3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_provider_upstream_parity_v3.py scripts/upstream_identity_guard.py tests/upstream_identity_guard_test.py automation/provider-upstream-parity-v3.json
          git diff --cached --quiet && { echo 'No V3 diff'; exit 1; }
          git commit -m 'fix: require strong route identity in upstream parity V3'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
