name: Validate provider rebuild offline

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/provider-rebuild-offline.yml"

permissions:
  contents: write

concurrency:
  group: provider-rebuild-pr-rematerialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rematerialize PR provider generation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Rematerialize published provider bundles to a fixed point
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json /tmp/manifest-before.json
          converged=false
          for round in 1 2 3; do
            echo "Provider rematerialization convergence round ${round}"
            python scripts/reapply_published_overrides.py
            python scripts/generate_language_manifests.py
            python scripts/sync_release_versions.py --manifest manifest.json --previous /tmp/manifest-before.json
            node engine_v2/scripts/bootstrap-provider-catalog.mjs --general manifest.json --vf vf/manifest.json --output provider_catalog.json
            node engine_v2/scripts/render-manifests-from-catalog.mjs --catalog provider_catalog.json --general manifest.json --vf vf/manifest.json
            python scripts/generate_language_manifests.py
            python scripts/sync_release_versions.py --manifest manifest.json --previous /tmp/manifest-before.json
            if python scripts/reapply_published_overrides.py --check; then
              converged=true
              echo "Provider rematerialization converged in ${round} round(s)."
              break
            fi
          done
          if [ "$converged" != true ]; then
            echo "Provider rematerialization did not converge after 3 rounds." >&2
            exit 1
          fi
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Verify reconstructed provider generation
        shell: bash
        run: |
          set -euo pipefail
          python tests/global_final_wrapper_order_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/provider_purification_contract_test.py
          python scripts/reapply_published_overrides.py --check

      - name: Commit regenerated artifacts to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json vf/manifest.json provider_catalog.json package.json package-lock.json sources.json \
            PROVENANCE.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json providers/ provider-overrides.json
          if [ -f vostfr/manifest.json ]; then git add vostfr/manifest.json; fi
          if git diff --cached --quiet; then
            echo 'No regenerated artifact changes.'
            exit 0
          fi
          git commit -m 'chore: rematerialize provider artifacts after Core ordering fix'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
