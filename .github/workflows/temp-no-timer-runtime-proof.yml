name: TEMP - no timer runtime proof

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-no-timer-runtime-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute Desktop-like no-timer proof and 96-bundle ownership audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/global_runtime_no_timer_execution_test.py
          python3 tests/global_core_runtime_ownership_test.py
