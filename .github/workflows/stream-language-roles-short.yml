name: SHORT - Stream Language Roles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_stream_language_roles_v1.py'
      - 'scripts/fix_stream_language_role_proof_v1.py'
      - 'scripts/normalize_stream_presentation_v12.py'
      - '.github/workflows/stream-language-roles-short.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakvio-short-stream-language-roles-main
  cancel-in-progress: false

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Apply language-role migration
        run: python3 scripts/upgrade_stream_language_roles_v1.py
      - name: Require evidence before Original/Dub inference
        run: python3 scripts/fix_stream_language_role_proof_v1.py
      - name: Compile Python Core presentation
        run: python3 -m py_compile scripts/upgrade_stream_language_roles_v1.py scripts/fix_stream_language_role_proof_v1.py scripts/normalize_stream_presentation_v12.py scripts/provider_patches/global_stream_presentation_v1.py
      - name: Engine v2 presentation contract
        run: node engine_v2/tests/stream-presentation.test.mjs
      - name: Provider global presentation contract
        run: python3 tests/global_stream_presentation_test.py
      - name: Provider presentation pipeline contract
        run: python3 tests/global_stream_presentation_pipeline_test.py
      - name: Migration idempotence
        run: |
          python3 scripts/upgrade_stream_language_roles_v1.py
          python3 scripts/fix_stream_language_role_proof_v1.py
      - name: Diff integrity
        run: git diff --check
      - name: Publish durable presentation source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee "$RUNNER_TEMP/changed.txt"
          if grep -Ev '^(engine_v2/src/stream-presentation\.mjs|engine_v2/tests/stream-presentation\.test\.mjs|scripts/provider_patches/global_stream_presentation_v1\.py|scripts/upgrade_stream_language_roles_v1\.py)$' "$RUNNER_TEMP/changed.txt"; then
            echo 'Unexpected language-role migration path' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engine_v2/src/stream-presentation.mjs \
            engine_v2/tests/stream-presentation.test.mjs \
            scripts/provider_patches/global_stream_presentation_v1.py \
            scripts/upgrade_stream_language_roles_v1.py
          git diff --cached --quiet && { echo 'STREAM_LANGUAGE_ROLES_ALREADY_APPLIED'; exit 0; }
          git commit -m 'feat(core): structure stream language and audio roles'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || {
            echo 'main moved during stream language role migration' >&2
            exit 1
          }
          git push origin HEAD:main
          echo "STREAM_LANGUAGE_ROLES_PUBLISHED $(git rev-parse HEAD)"
