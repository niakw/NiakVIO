# Revalidate language roles after HLS master-facts publication.
name: SHORT - Stream Language Roles

on:
  push:
    branches: [main]
    paths:
      - 'engine_v2/src/stream-presentation.mjs'
      - 'engine_v2/tests/stream-presentation.test.mjs'
      - 'scripts/provider_patches/global_stream_presentation_v1.py'
      - 'tests/global_stream_presentation_test.py'
      - 'tests/global_stream_presentation_pipeline_test.py'
      - 'scripts/normalize_stream_presentation_v12.py'
      - '.github/workflows/stream-language-roles-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakvio-short-stream-language-roles-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact trigger head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Compile Python Core presentation
        run: python3 -m py_compile scripts/normalize_stream_presentation_v12.py scripts/provider_patches/global_stream_presentation_v1.py
      - name: Engine v2 presentation contract
        run: node engine_v2/tests/stream-presentation.test.mjs
      - name: Provider global presentation contract
        run: python3 tests/global_stream_presentation_test.py
      - name: Provider presentation pipeline contract
        run: python3 tests/global_stream_presentation_pipeline_test.py
      - name: Diff integrity
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
