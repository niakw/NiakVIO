name: Provider Repair Parallel Batch Proof

on:
  push:
    branches:
      - workbench/route-recognition-v14-search-plan
    paths:
      - automation/provider-fast-trigger.json
  workflow_dispatch:

permissions:
  contents: read

env:
  NIAKVIO_ROUTE_PROOF_MAX_ATTEMPTS: "3"
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_QUICK_YIELD_WORKERS: "4"
  NIAKVIO_QUICK_YIELD_TIMEOUT: "55"

jobs:
  prove-batch:
    name: prove-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vf-core
            providers: "purstream flemmix papadustream coflix"
          - name: 4k-download
            providers: "uhdmovies movieshunt zinkmovies vegamovies"
          - name: api-direct
            providers: "4khdhub 4khdhubnew persianstremio desiflix"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run parallel batch acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        run: |
          args=()
          for provider in ${{ matrix.providers }}; do
            args+=(--provider "$provider")
          done
          python scripts/run_provider_repair_fast_targeted_v1.py \
            --attempts 3 \
            --workers 4 \
            --timeout 55 \
            "${args[@]}"

      - name: Validate shared V16-V18 contracts
        if: always()
        run: |
          python tests/provider_execution_authority_v16_contract_test.py
          python tests/provider_route_slug_identity_v16_test.py
          python tests/provider_correlated_value_plan_v18_contract_test.py
          python tests/provider_packed_player_v18_6_contract_test.py
          python tests/provider_player_route_variant_v18_7_contract_test.py
          python tests/provider_player_form_handoff_v18_8_contract_test.py

      - name: Show batch proof summary
        if: always()
        run: |
          test -f automation/provider-repair-fast-summary.json && cat automation/provider-repair-fast-summary.json || true

      - name: Enforce batch acceptance result
        if: always()
        run: |
          test "${{ steps.acceptance.outcome }}" = "success"

      - name: Upload batch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-repair-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            automation/provider-repair-fast-targeted.json
            automation/provider-repair-fast-merged.json
            automation/provider-repair-fast-yield.json
            automation/provider-repair-fast-summary.json
            provider-v3-quick-yield.json
