name: TEMP - Finalize Dynamic Minimizer Scope V2

on:
  push:
    branches: [fix/active44-durability-20260915]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: publication
      NIAKVIO_QUICK_YIELD_WORKERS: '16'
      NIAKVIO_QUICK_YIELD_TIMEOUT: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Make final minimizer active-scope aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/finalize_provider_v3_minimizer.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('''from provider_v3_minimizer import (\n    EXPECTED_PROVIDER_COUNT,\n    PRODUCTION_ENABLED,\n''', '''from provider_v3_minimizer import (\n    PRODUCTION_ENABLED,\n''', 1)
          old = '''def _provider_rows(manifest: dict[str, Any]) -> list[dict[str, Any]]:\n    rows = [row for row in manifest.get("scrapers") or [] if isinstance(row, dict)]\n    if len(rows) != EXPECTED_PROVIDER_COUNT:\n        raise ValueError(\n            f"expected {EXPECTED_PROVIDER_COUNT} current providers, got {len(rows)}"\n        )\n    ids = [str(row.get("id") or "").strip().casefold() for row in rows]\n    if any(not value for value in ids) or len(set(ids)) != EXPECTED_PROVIDER_COUNT:\n        raise ValueError("current manifest provider ids must be unique and non-empty")\n    return rows\n'''
          new = '''def _provider_rows(manifest: dict[str, Any]) -> list[dict[str, Any]]:\n    """Return only executable rows; visible disabled rows are publication metadata."""\n    rows = [row for row in manifest.get("scrapers") or [] if isinstance(row, dict)]\n    ids = [str(row.get("id") or "").strip().casefold() for row in rows]\n    if any(not value for value in ids) or len(set(ids)) != len(ids):\n        raise ValueError("current manifest provider ids must be unique and non-empty")\n\n    active: list[dict[str, Any]] = []\n    for row in rows:\n        relative = str(row.get("filename") or "").strip()\n        if row.get("enabled") is False:\n            if relative.startswith("providers/"):\n                raise ValueError(\n                    f"disabled provider remains in active publication folder: {row.get('id')}"\n                )\n            continue\n        if not relative.startswith("providers/"):\n            raise ValueError(\n                f"active provider is outside active publication folder: {row.get('id')}={relative}"\n            )\n        active.append(row)\n    if not active:\n        raise ValueError("current active provider scope is empty")\n    return active\n'''
          if old not in t:
              raise SystemExit('finalizer provider-scope anchor mismatch')
          t = t.replace(old, new, 1)
          old = '''    outputs: dict[Path, bytes] = {}\n\n    for entry in _provider_rows(manifest):\n'''
          new = '''    outputs: dict[Path, bytes] = {}\n    active_rows = _provider_rows(manifest)\n    provider_count = len(active_rows)\n\n    for entry in active_rows:\n'''
          if old not in t:
              raise SystemExit('finalizer active loop anchor mismatch')
          t = t.replace(old, new, 1)
          if t.count('f"providers={EXPECTED_PROVIDER_COUNT}') != 2:
              raise SystemExit('finalizer fixed-count print anchors mismatch')
          t = t.replace('f"providers={EXPECTED_PROVIDER_COUNT}', 'f"providers={provider_count}')
          if 'EXPECTED_PROVIDER_COUNT' in t:
              raise SystemExit('finalizer still contains stale EXPECTED_PROVIDER_COUNT')
          p.write_text(t, encoding='utf-8')

          p = Path('tests/provider_v3_minimizer_publication_pipeline_test.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('from current_provider_scope import active_provider_count\n', '')
          t = t.replace('assert module.EXPECTED_PROVIDER_COUNT == 46\n', '')
          anchor = 'SCRIPT = ROOT / "scripts/finalize_provider_v3_minimizer.py"\n'
          if anchor not in t:
              raise SystemExit('minimizer pipeline SCRIPT anchor mismatch')
          t = t.replace(anchor, anchor + 'SYNTHETIC_ACTIVE = 3\nDISABLED_ID = "disabled-demo"\n\n', 1)
          t = t.replace('    providers.mkdir()\n', '    providers.mkdir()\n    (tmp / "provider-disabled").mkdir()\n', 1)
          t = t.replace('    for index in range(46):\n', '    for index in range(SYNTHETIC_ACTIVE):\n', 1)
          insert_anchor = '''        provenance["providers"][provider_id] = {\n            "published_filename": filename,\n            "sha256": "stale",\n            "final_fixed_point": {\n                "schema_version": 1,\n                "verified": True,\n                "tool": "raw-bytes",\n                "tool_version": "test",\n                "mangle": False,\n                "sha256": "stale",\n            },\n        }\n\n    manifest_path = tmp / "manifest.json"\n'''
          replacement = '''        provenance["providers"][provider_id] = {\n            "published_filename": filename,\n            "sha256": "stale",\n            "final_fixed_point": {\n                "schema_version": 1,\n                "verified": True,\n                "tool": "raw-bytes",\n                "tool_version": "test",\n                "mangle": False,\n                "sha256": "stale",\n            },\n        }\n\n    disabled_filename = "provider-disabled/disabled-demo--nuvio--disabled00000000.js"\n    disabled_text = "/* disabled provider retained verbatim */\\n"\n    (tmp / disabled_filename).write_text(disabled_text, encoding="utf-8")\n    manifest["scrapers"].append({\n        "id": DISABLED_ID,\n        "version": "7.7.7",\n        "filename": disabled_filename,\n        "enabled": False,\n    })\n    provenance["providers"][DISABLED_ID] = {\n        "published_filename": disabled_filename,\n        "sha256": "disabled-stable",\n    }\n\n    manifest_path = tmp / "manifest.json"\n'''
          if insert_anchor not in t:
              raise SystemExit('minimizer pipeline disabled insertion anchor mismatch')
          t = t.replace(insert_anchor, replacement, 1)
          t = t.replace('f"p{index:02d}": "1.0.0" for index in range(46)', 'f"p{index:02d}": "1.0.0" for index in range(SYNTHETIC_ACTIVE)', 1)
          t = t.replace('assert first["changed"] == 46, first', 'assert first["changed"] == SYNTHETIC_ACTIVE, first', 1)
          t = t.replace('assert first["already_versioned"] == 46, first', 'assert first["already_versioned"] == SYNTHETIC_ACTIVE, first', 1)
          old = '''    assert len(out_manifest["scrapers"]) == active_provider_count()\n    first_proofs = {}\n    for row in out_manifest["scrapers"]:\n'''
          new = '''    assert len(out_manifest["scrapers"]) == SYNTHETIC_ACTIVE + 1\n    disabled_row = next(row for row in out_manifest["scrapers"] if row["id"] == DISABLED_ID)\n    assert disabled_row == {\n        "id": DISABLED_ID,\n        "version": "7.7.7",\n        "filename": disabled_filename,\n        "enabled": False,\n    }\n    assert (tmp / disabled_filename).read_text(encoding="utf-8") == disabled_text\n    assert out_provenance["providers"][DISABLED_ID] == {\n        "published_filename": disabled_filename,\n        "sha256": "disabled-stable",\n    }\n    first_proofs = {}\n    for row in [row for row in out_manifest["scrapers"] if row.get("enabled") is not False]:\n'''
          if old not in t:
              raise SystemExit('minimizer pipeline result scope anchor mismatch')
          t = t.replace(old, new, 1)
          t = t.replace('assert all(row["version"] == "1.0.1" for row in after_second["scrapers"])', 'assert all(row["version"] == "1.0.1" for row in after_second["scrapers"] if row.get("enabled") is not False)', 1)
          t = t.replace('print("PROVIDER_V3_MINIMIZER_PUBLICATION_PIPELINE_OK providers=46 fixed_point=1 no_double_bump=1 template_safe=1 terser=0")', 'print(f"PROVIDER_V3_MINIMIZER_PUBLICATION_PIPELINE_OK providers={SYNTHETIC_ACTIVE} disabled_preserved=1 fixed_point=1 no_double_bump=1 template_safe=1 terser=0")', 1)
          p.write_text(t, encoding='utf-8')
          print('DYNAMIC_FINAL_MINIMIZER_SCOPE_PATCHED_V2')
          PY
          python -m py_compile scripts/finalize_provider_v3_minimizer.py tests/provider_v3_minimizer_publication_pipeline_test.py
          python tests/provider_v3_minimizer_publication_pipeline_test.py

      - name: Run canonical publication finalization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py
          python scripts/finalize_provider_v3_minimizer.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def write(p,d): Path(p).write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          root=load('manifest.json')
          by={str(r.get('id') or '').strip().casefold():r for r in root.get('scrapers') or [] if isinstance(r,dict)}
          for path in map(Path,['manifest-hub46.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json','native-hub46/manifest.json']):
              if not path.is_file(): continue
              data=load(path); changed=False
              for row in data.get('scrapers') or []:
                  if not isinstance(row,dict): continue
                  pid=str(row.get('id') or '').strip().casefold(); src=by.get(pid)
                  if not isinstance(src,dict): continue
                  old=str(row.get('filename') or '')
                  root_name=Path(str(src.get('filename') or '')).name
                  prefix=old.rsplit('/',1)[0]+'/' if '/' in old else ''
                  new=prefix+root_name
                  if old!=new: row['filename']=new; changed=True
                  for key in ('version','supportedTypes','canonicalSupportedTypes','enabled'):
                      if key in src:
                          if row.get(key)!=src[key]: row[key]=src[key]; changed=True
                      elif key=='canonicalSupportedTypes' and key in row:
                          row.pop(key,None); changed=True
              if changed: write(path,data)
          PY
          python scripts/prune_unreferenced_providers.py

      - name: Prove minimizer and publication fixed points
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_provider_v3_minimizer.py --check
          python scripts/reapply_published_overrides.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/audit_provider_v3_static.py
          python tests/provider_brick_portfolio_audit_test.py --published --require-all
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/native_declared_provider_matrix_test.py
          python tests/provider_521_capability_regression_test.py
          python scripts/audit_provider_quick_yield.py | tee /tmp/qy-final-min.log
          python scripts/check_provider_non_regression_v1.py --candidate-gate --base-ref f814d325c68a9a4eebd895498aafb245ce27ac2b
          grep '^FIELD_PROVIDER_QUICK_YIELD' /tmp/qy-final-min.log
          git diff --check

      - name: Commit durable final-minimizer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/finalize-dynamic-minimizer-scope-20260915.yml .github/workflows/finalize-dynamic-minimizer-scope-v2-20260915.yml
          if git diff --cached --quiet; then echo NO_DURABLE_MINIMIZER_CHANGES; exit 0; fi
          git commit -m 'fix: finalize active provider minimizer scope'
          git push origin HEAD:fix/active44-durability-20260915
