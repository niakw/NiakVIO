name: TMP - Historical Provider AB Retry

on:
  pull_request:
    branches:
      - tmp/historical-provider-ab-retry-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'

jobs:
  historical:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: allanime
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: allwish
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: flemmix
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: moviebox
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: vidfast
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: vidlove
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: wookafr
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: yflix
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: castle
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: kehflix
          - ref: 4e9729d865f6a069bda567fbeac520d714bef4bd
            provider: papadustream
          - ref: 879812fb16ae1325d4a1bc977d5b5f3aa9292c27
            provider: allanime
          - ref: 879812fb16ae1325d4a1bc977d5b5f3aa9292c27
            provider: moviebox
          - ref: 879812fb16ae1325d4a1bc977d5b5f3aa9292c27
            provider: kehflix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Extract exact historical bundle with manifest fallback
        env:
          REF: ${{ matrix.ref }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p health-output/historical
          if git cat-file -e "$REF:manifest.json" 2>/dev/null; then
            MANIFEST=manifest.json
          else
            MANIFEST=manifest-hub46.json
          fi
          git show "$REF:$MANIFEST" > health-output/historical/source-manifest.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          ref=os.environ['REF']; provider=os.environ['PROVIDER']
          src=json.loads(Path('health-output/historical/source-manifest.json').read_text())
          rows=src.get('scrapers') or src.get('providers') or []
          row=next((r for r in rows if str(r.get('id') or '').lower()==provider.lower()),None)
          if not row: raise SystemExit(f'missing provider {provider} in {ref}')
          original=str(row.get('filename') or '')
          if original.startswith('http'):
              from urllib.parse import urlparse
              original=urlparse(original).path.split('/providers/',1)[-1]
              original='providers/'+original
          original=original.replace('../','')
          raw=subprocess.check_output(['git','show',f'{ref}:{original}'])
          target=Path('health-output/historical')/f'{provider}-{ref[:8]}.js'
          target.write_bytes(raw)
          row=dict(row); row['filename']=str(target)
          Path('health-output/historical/manifest.json').write_text(json.dumps({'version':src.get('version'),'scrapers':[row]},ensure_ascii=False,indent=2)+'\n')
          print('FIELD_HIST_RETRY_BUNDLE',provider,ref[:8],original,len(raw))
          PY
          node --check "health-output/historical/${PROVIDER}-${REF:0:8}.js"

      - name: Certify historical bundle
        continue-on-error: true
        env:
          REF: ${{ matrix.ref }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -o pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest health-output/historical/manifest.json \
            --include-disabled \
            --provider "$PROVIDER" \
            --candidate-limit 3 \
            --timeout 20 \
            --workers 1 \
            --seed "hist-retry-${REF:0:8}-${PROVIDER}-${GITHUB_RUN_ID}" \
            --output "health-output/${PROVIDER}-${REF:0:8}.json"

      - name: Summarize
        if: always()
        env:
          REF: ${{ matrix.ref }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          ref=os.environ['REF']; provider=os.environ['PROVIDER']
          p=Path('health-output')/f'{provider}-{ref[:8]}.json'
          if not p.exists():
              print('FIELD_HIST_RETRY_RESULT',provider,ref[:8],'missing=true'); raise SystemExit
          row=(json.loads(p.read_text()).get('providers') or [{}])[0]
          lanes=row.get('lanes') or {}
          green=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
          stages=sorted({str(a.get('debugStage') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
          hosts=sorted({str(n.get('host') or '') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
          print('FIELD_HIST_RETRY_RESULT',provider,ref[:8],'green='+(','.join(green) or '-'),'full='+str(bool(row.get('certified'))).lower(),'stages='+('|'.join(stages) or '-'),'hosts='+('|'.join(hosts) or '-'))
          PY
