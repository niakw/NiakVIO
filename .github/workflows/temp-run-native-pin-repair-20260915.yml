name: TEMP Finish Native Repin

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-run-native-pin-repair-20260915.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-pinned-provider-integrity-20260915
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build Hub-46 transport from exact publication commit
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_SHA=$(git rev-parse HEAD)
          test "$PUBLISH_SHA" = "04d6bb8eef577171d56b4d29ff7601d350017244"
          python3 scripts/reapply_published_overrides.py --check
          python3 scripts/generate_hub46_manifest.py --source manifest.json --output manifest-hub46.json
          python3 scripts/generate_hub46_manifest.py --source manifest.json --output manifest-hub46.json --check
          python3 scripts/build_hub46_native_manifest.py --provider-sha "$PUBLISH_SHA" --source manifest-hub46.json --output native-hub46/manifest.json
          PYTHONPATH=scripts python3 tests/native_hub46_manifest_test.py
          PYTHONPATH=scripts python3 tests/native_hub46_transport_manifest_test.py
          git diff --check
      - name: Commit and push immutable Native transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest-hub46.json native-hub46/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(native): pin Hub-46 to refreshed provider publication'
          fi
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:fix/native-pinned-provider-integrity-20260915
          python3 scripts/reapply_published_overrides.py --check
          PYTHONPATH=scripts python3 tests/native_hub46_manifest_test.py
          PYTHONPATH=scripts python3 tests/native_hub46_transport_manifest_test.py
