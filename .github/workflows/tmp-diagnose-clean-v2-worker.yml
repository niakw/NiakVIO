name: Temporary diagnose clean V2 worker source

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/diagnose-clean-v2-worker

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/global-provider-v2-integration
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact provider bundle and response-dependent source lines
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          row=next(x for x in manifest.get('scrapers',[]) if str(x.get('id','')).casefold()=='dvdplay')
          path=Path(row['filename'])
          print('DVDPLAY_FILENAME='+str(path))
          source=path.read_text(encoding='utf-8',errors='replace')
          needles=re.compile(r'HEAD|headers?\.|headers?\[|\.get\(|content-length|content-disposition|location|response\.url|\.url\b|redirect',re.I)
          lines=source.splitlines()
          hits=[i for i,line in enumerate(lines) if needles.search(line)]
          seen=set()
          for hit in hits:
              for i in range(max(0,hit-2),min(len(lines),hit+3)):
                  if i in seen: continue
                  seen.add(i)
                  text=lines[i]
                  # keep diagnostic bounded even for minified providers
                  if len(text)>1500: text=text[:1500]+' ...[truncated]'
                  print(f'SRC {i+1}: {text}')
          PY
