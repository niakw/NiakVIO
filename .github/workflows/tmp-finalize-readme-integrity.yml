name: One-shot finalize README and integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-finalize-readme-integrity.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-readme-integrity
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Refine README hero and verify publication guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''  <img src="assets/branding/nuvio-providers-logo.png" alt="NiakVIO" width="420">\n\n  <p><strong>Un seul repository Nuvio pour agréger, réparer et maintenir des providers VO, VF et VOSTFR.</strong></p>\n  <p>NiakVIO transforme plusieurs sources communautaires en manifests stables, contrôlés et testés sur les clients Nuvio réels.</p>'''
          new = '''  <img src="assets/branding/nuvio-providers-logo.png" alt="Logo NiakVIO" width="300">\n\n  <h1>NiakVIO</h1>\n  <p><strong>Le moteur communautaire qui agrège, teste, répare et maintient les providers Nuvio.</strong></p>\n  <p>VO · VF · VOSTFR &nbsp;•&nbsp; Mobile · Desktop · TV</p>'''
          if old in text:
              readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('README hero anchor not found; refusing blind rewrite')
          PY
          python3 tests/sync_atomic_publication_test.py

      - name: Commit README, rebase, and regenerate exact release hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m 'docs: refine NiakVIO README hero'
          fi

          git fetch origin main
          git rebase origin/main

          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
          git add FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh release integrity after repository cleanup'
          fi

          python3 tests/sync_atomic_publication_test.py
          python3 scripts/validate_release_integrity.py
          git push origin HEAD:main
