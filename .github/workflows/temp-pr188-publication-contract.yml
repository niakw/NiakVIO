name: TEMP - PR188 Publication Contract Reconcile

on:
  push:
    branches:
      - fix/provider-census-state-machine-20260919
    paths:
      - '.github/workflows/temp-pr188-publication-contract.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-census-state-machine-20260919
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile deterministic publication contract
        run: |
          set -euo pipefail
          python scripts/reapply_published_overrides.py | tee /tmp/reapply.log
          git status --short
          git diff --stat
          python tests/provider_v3_minimizer_published_test.py
          python scripts/reapply_published_overrides.py --check
          changed_providers="$(grep 'FIELD_PROVIDER_REF_CHANGES' /tmp/reapply.log | tail -1 | sed -nE 's/.*count=([0-9]+).*/\1/p')"
          changed_providers="${changed_providers:-0}"
          echo "FIELD_PR188_PUBLICATION_CHANGED_PROVIDERS count=$changed_providers"
          if [ "$changed_providers" -gt 5 ]; then
            echo "Refusing broad publication churn in diagnostic workflow: $changed_providers providers" >&2
            exit 2
          fi
