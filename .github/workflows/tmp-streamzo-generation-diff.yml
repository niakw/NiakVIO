name: TEMP StreamZo generation diff

on:
  push:
    branches: [fix/main-native-proof-and-isolation]
    paths:
      - ".github/workflows/tmp-streamzo-generation-diff.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare known-green and current StreamZo generations
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT=9f5c852204cfd1befe0bc38aec58961eea0b9df5
          python - <<'PY'
          import json, subprocess, pathlib, re
          old='9f5c852204cfd1befe0bc38aec58961eea0b9df5'
          now=json.loads(pathlib.Path('manifest.json').read_text())
          olddoc=json.loads(subprocess.check_output(['git','show',f'{old}:manifest.json'],text=True))
          def row(doc):
              return next(x for x in doc['scrapers'] if str(x.get('id','')).casefold()=='streamzo')
          a,b=row(olddoc),row(now)
          print('FIELD_STREAMZO_OLD',a['filename'],a.get('version'),a.get('enabled'),a.get('disabledPlatforms'))
          print('FIELD_STREAMZO_NEW',b['filename'],b.get('version'),b.get('enabled'),b.get('disabledPlatforms'))
          oldsrc=subprocess.check_output(['git','show',f"{old}:{a['filename']}"],text=True)
          newsrc=pathlib.Path(b['filename']).read_text()
          pathlib.Path('/tmp/streamzo-old.js').write_text(oldsrc)
          pathlib.Path('/tmp/streamzo-new.js').write_text(newsrc)
          marker=re.compile(r'NUVIO_[A-Z0-9_]+(?:_V\d+)?')
          oldm=sorted(set(marker.findall(oldsrc)))
          newm=sorted(set(marker.findall(newsrc)))
          print('FIELD_MARKERS_OLD_ONLY',json.dumps(sorted(set(oldm)-set(newm))))
          print('FIELD_MARKERS_NEW_ONLY',json.dumps(sorted(set(newm)-set(oldm))))
          for token in ['defaultUserAgent','failClosedUnknown','implementationRevision','scoped-playback-context','platform-playback-context','GLOBAL_MEDIA_ENRICHMENT','GLOBAL_RUNTIME_MEDIA_SAFETY','TARGET_MEDIA']:
              print('FIELD_TOKEN',token,'old=',oldsrc.count(token),'new=',newsrc.count(token))
          print('FIELD_SIZE old=',len(oldsrc),'new=',len(newsrc))
          PY
          git diff --no-index --stat /tmp/streamzo-old.js /tmp/streamzo-new.js || true
          echo '--- wrapper/config strings old ---'
          grep -oE 'NUVIO_[A-Z0-9_:.-]+|implementationRevision[^,}]*|defaultUserAgent[^,}]*|failClosedUnknown[^,}]*' /tmp/streamzo-old.js | sort -u | tail -n 100 || true
          echo '--- wrapper/config strings new ---'
          grep -oE 'NUVIO_[A-Z0-9_:.-]+|implementationRevision[^,}]*|defaultUserAgent[^,}]*|failClosedUnknown[^,}]*' /tmp/streamzo-new.js | sort -u | tail -n 100 || true
      - name: Execute both bundles in worker contexts
        shell: bash
        run: |
          set -euo pipefail
          META='{"tmdbId":"1215638","mediaType":"movie","title":"Mon ninja et moi 3","year":2025,"label":"Mon ninja et moi 3","category":"movie"}'
          for gen in old new; do
            for platform in desktop android tv; do
              echo "=== FIELD_WORKER generation=$gen platform=$platform ==="
              CTX=$(printf '{"locale":"fr-FR","language":"fr","languages":["fr-FR","fr"],"platform":"%s","settings":{},"storage":{}}' "$platform")
              timeout 90s node scripts/provider_worker.cjs "/tmp/streamzo-$gen.js" "$META" "$CTX" 2>&1 | tail -n 80 || true
            done
          done
