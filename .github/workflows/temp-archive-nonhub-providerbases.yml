name: TEMP - Archive non-hub ProviderBases

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - scripts/archive_nonhub_providerbases.py
      - .github/workflows/temp-archive-nonhub-providerbases.yml

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[provider-old]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Move historical non-hub bases to provider-old
        run: python scripts/archive_nonhub_providerbases.py

      - name: Verify current ProviderBase scope is exactly hub46
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          matrix=json.loads((root/'automation/evidence/hub-lab-matrix-46.json').read_text())
          keep={str(r['registryId']).strip().lower().replace('_','-') for r in matrix['rows']}
          def slug(p): return re.sub(r'--base--[0-9a-f]+\.js$','',p.name.lower())
          active={slug(p) for p in (root/'provider-bases').glob('*--base--*.js')}
          old={slug(p) for p in (root/'provider-old').glob('*--base--*.js')}
          assert active==keep and len(active)==46,(len(active),sorted(active-keep),sorted(keep-active))
          assert not (active & old)
          assert len(old)>=50,len(old)
          print('PROVIDER_OLD_SCOPE_OK active=46 archived_nonhub='+str(len(old)))
          PY

      - name: Commit archive separation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A provider-bases provider-old scripts/archive_nonhub_providerbases.py
          if git diff --cached --quiet; then
            echo 'No ProviderBase archive changes to commit'
            exit 0
          fi
          git commit -m '[provider-old] archive non-hub ProviderBase history'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
