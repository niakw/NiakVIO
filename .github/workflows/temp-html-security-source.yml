name: TEMP - Static Knowledge Contract

on:
  push:
    branches: [release/stable-46-20260912]
    paths: [.github/workflows/temp-html-security-source.yml]

permissions:
  contents: read

jobs:
  static-knowledge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Reproduce only static-knowledge preflight contract
        run: |
          set -euo pipefail
          python scripts/validate_provider_v3_routes_live.py --prepare-candidates
          python scripts/enrich_provider_v3_static_knowledge.py
          python scripts/sanitize_provider_v3_core_metadata_routes.py
          python tests/provider_v3_static_knowledge_contract_test.py
