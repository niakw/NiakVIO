name: TEMP - AnimeVOSTFR Sibnet identity

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths: [.github/workflows/temp-animevostfr-sibnet-identity.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/labs-5.21.44-20260912}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compare current-site and upstream-returned Sibnet video identities
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36'
          def get(url,ref='https://animevostfr.org/'):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*','Referer':ref})
            try:
              with urllib.request.urlopen(req,timeout=18) as r:return r.status,r.headers,r.read(2*1024*1024).decode('utf-8','replace'),r.url
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read(65536).decode('utf-8','replace'),url
          def clean(s):return ' '.join(re.sub(r'<[^>]+>',' ',s or '').split())[:240]
          for vid,origin in [('3608056','current_site_reader'),('3346640','upstream_output')]:
            st,hd,html,final=get('https://video.sibnet.ru/video'+vid)
            title=(re.findall(r'<title[^>]*>(.*?)</title>',html,re.I|re.S) or [''])[0]
            og=(re.findall(r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)',html,re.I) or re.findall(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:title["\']',html,re.I) or [''])[0]
            desc=(re.findall(r'<meta[^>]+(?:name|property)=["\'](?:description|og:description)["\'][^>]+content=["\']([^"\']+)',html,re.I) or [''])[0]
            h1=(re.findall(r'<h1[^>]*>([\s\S]*?)</h1>',html,re.I) or [''])[0]
            markers=[]
            low=html.lower()
            for needle in ['tokyo ghoul','1x1','episode 1','épisode 1','saison 1','neon genesis','evangelion']:
              if needle in low:markers.append(needle)
            print('ANIMEVOSTFR_SIBNET_IDENTITY '+json.dumps({'videoId':vid,'origin':origin,'status':st,'title':clean(title),'ogTitle':clean(og),'description':clean(desc),'h1':clean(h1),'markers':markers},ensure_ascii=False,separators=(',',':')))
          PY
