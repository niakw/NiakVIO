name: Apply Repair Disposition Policy V2

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/apply-repair-disposition-policy-v2.yml'
      - 'scripts/migrate_repair_disposition_policy_v2.py'

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workbench/systemic-recovery-20260909
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply repair disposition policy v2
        run: |
          set -euo pipefail
          python scripts/migrate_repair_disposition_policy_v2.py
          python -m py_compile \
            scripts/finalize_provider_repair_disposition_v1.py \
            tests/provider_v3_strategy_plan_contract_test.py \
            tests/provider_repair_pipeline_v6_contract_test.py
      - name: Validate permanent contracts
        run: |
          set -euo pipefail
          python tests/provider_repair_pipeline_v6_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python - <<'PY'
          from pathlib import Path
          finalizer=Path('scripts/finalize_provider_repair_disposition_v1.py').read_text(encoding='utf-8')
          strategy=Path('tests/provider_v3_strategy_plan_contract_test.py').read_text(encoding='utf-8')
          assert 'enabled = True' in finalizer
          assert 'def off_evidence_ok(patch: dict) -> bool:' in strategy
          assert 'off_audited.append(provider_id)' in strategy
          print('REPAIR_DISPOSITION_POLICY_V2_OK complete_proof_reenables=true off_debt_audited=true')
          PY
      - name: Commit permanent policy owners
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/finalize_provider_repair_disposition_v1.py \
            tests/provider_v3_strategy_plan_contract_test.py \
            tests/provider_repair_pipeline_v6_contract_test.py
          if git diff --cached --quiet; then
            echo 'REPAIR_DISPOSITION_POLICY_V2_COMMIT changed=false'
            exit 0
          fi
          git commit -m 'fix(repair): reactivate fully proven providers and audit off debt'
          git push origin HEAD:workbench/systemic-recovery-20260909
