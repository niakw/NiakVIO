name: Core rebuild diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-rebuild-diagnostic-once.yml'
      - 'scripts/diagnose_core_rebuild_once.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Announce diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "One-shot Core rebuild diagnostic: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize current Core scripts in workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_core_fixed_point_contract.py --apply
          python scripts/normalize_core_media_policy.py --apply
          python scripts/apply_runtime_capability_upgrade_v4.py
          python scripts/build_provider_runtime_profiles.py
      - name: Trace Anime-Sama two-pass reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/diagnose_core_rebuild_once.py 2>&1 | tee /tmp/core-rebuild-trace.log
          rc=${PIPESTATUS[0]}
          {
            echo 'One-shot Core rebuild trace:'
            echo
            echo '```text'
            grep -E '^(FIELD_REBUILD_|Traceback|ValueError|ReferenceError)' /tmp/core-rebuild-trace.log | tail -n 80
            echo '```'
          } > /tmp/core-rebuild-comment.md
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body-file /tmp/core-rebuild-comment.md
          exit "$rc"

  favicon-refine-once:
    name: One-shot provider favicon refinement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Announce exact one-shot migration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider favicon refinement one-shot started through the active diagnostic runner: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install bounded one-shot image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Prefer readable committed site icons once
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/refine_provider_logos_from_favicons_once.py
          python scripts/refine_provider_logos_from_favicons_once.py
      - name: Verify exact committed logo inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('.')
          index=json.loads((root/'assets/providers/index.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          providers=index.get('providers') or {}
          assert index.get('futurePolicy') == 'committed-assets-only-no-network-regeneration'
          assert len(providers) == 92, len(providers)
          assert int(index.get('missingCount') or 0) == 0, index.get('missingCount')
          refinement=index.get('faviconRefinement') or {}
          assert refinement.get('mode') == 'one-shot-site-icon-preference', refinement
          enabled=[r for r in manifest.get('scrapers',[]) if isinstance(r,dict) and r.get('enabled') is not False]
          missing=[str(r.get('id')).casefold() for r in enabled if str(r.get('id')).casefold() not in providers]
          assert not missing, missing
          for provider_id,row in providers.items():
              for key,size in {'72x32':(72,32),'96x40':(96,40)}.items():
                  path=root/row['assets'][key]
                  assert path.is_file(), (provider_id,path)
                  with Image.open(path) as image:
                      assert image.format == 'WEBP', (provider_id,key,image.format)
                      assert image.size == size, (provider_id,key,image.size)
          print(f"FIELD_PROVIDER_LOGO_ASSET_QA indexed={len(providers)} active={len(enabled)} missing_active=0 refined={refinement.get('refinedProviders', 0)}")
          PY
      - name: Commit assets and permanently remove favicon migration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/refine_provider_logos_from_favicons_once.py .github/workflows/provider-favicon-refinement-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assets: finalize provider logos for small displays'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Report completed one-shot migration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Provider favicon refinement completed exactly once. Refined WebP assets are committed; recurring favicon network code/workflow was removed."
