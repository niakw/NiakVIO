name: Final security hardening builder

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/triggers/final-security-hardening"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-security-hardening-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout security hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/final-security-hardening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize reviewed hardening
        run: python3 scripts/build_final_security_hardening_once.py

      - name: Validate generated proposal
        shell: bash
        run: |
          set -euo pipefail
          node tests/provider_worker_security.test.cjs
          python3 tests/workflow_security_policy_test.py
          python3 -m py_compile scripts/build_final_security_hardening_once.py tests/workflow_security_policy_test.py
          git diff --check

      - name: Build proposal commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "niakvio-security"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/provider_worker.cjs scripts/health_check.mjs tests/provider_worker_security.test.cjs \
            tests/workflow_security_policy_test.py .github/CODEOWNERS SECURITY.md \
            .github/workflows/dependency-gate.yml .github/workflows/github-actions-gate.yml \
            .github/workflows/provider-status-export.yml
          git commit -m "security: harden provider sandbox and repository gates"
          echo "FIELD_SECURITY_HARDENING_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:chore/final-security-hardening
