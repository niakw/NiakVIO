name: MAIN - Route Proof Artifact Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/route-proof-publication.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: niakvio-main-route-proof-artifact-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate publication trigger and source drift
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          t=json.load(open('.github/triggers/route-proof-publication.json'))
          for k in ('runId','sourceSha'):
              if not str(t.get(k) or '').strip(): raise SystemExit(f'missing trigger field {k}')
          if t.get('targetVersion')!='5.21.36': raise SystemExit(f"unexpected targetVersion={t.get('targetVersion')!r}")
          pathlib.Path('/tmp/route-proof-run-id').write_text(str(t['runId']))
          pathlib.Path('/tmp/route-proof-source-sha').write_text(str(t['sourceSha']))
          pathlib.Path('/tmp/allow-purstream-diagnostic').write_text('1' if t.get('allowPurstreamDiagnosticNotOk') is True else '0')
          source=str(t['sourceSha'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',source,head],check=True)
          allowed={'MEMORY.md','.github/workflows/main-route-proof-artifact-publication.yml','.github/triggers/route-proof-publication.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only',source+'..'+head],text=True).splitlines())
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit('candidate source drift requires a new route-proof run: '+','.join(unexpected))
          print(f'ARTIFACT_PUBLICATION_SOURCE_OK source={source} head={head} allowed_drift={sorted(changed)}')
          PY
          RUN_ID="$(cat /tmp/route-proof-run-id)"
          SOURCE_SHA="$(cat /tmp/route-proof-source-sha)"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          python3 - "$SOURCE_SHA" <<'PY' <<<"$RUN_JSON"
          import json,sys
          source=sys.argv[1]; run=json.load(sys.stdin)
          if run.get('conclusion')!='success': raise SystemExit(f"route-proof run not successful: {run.get('conclusion')}")
          if run.get('head_sha')!=source: raise SystemExit(f"route-proof SHA mismatch: {run.get('head_sha')} != {source}")
          if run.get('name')!='MAIN - Route Proof Reconstruction 96': raise SystemExit(run.get('name'))
          print(f"ARTIFACT_PUBLICATION_RUN_OK run={run['id']} sha={run['head_sha']}")
          PY

      - name: Download exact validated candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(cat /tmp/route-proof-run-id)"
          NAME="route-proof-reconstruction-96-${RUN_ID}"
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$RUNNER_TEMP/candidate"
          test -f "$RUNNER_TEMP/candidate/provider-v3-materialization.json"
          test -f "$RUNNER_TEMP/candidate/provider-v3-quick-yield.json"
          test -f "$RUNNER_TEMP/candidate/automation/hotd-s3e1-live.json"
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'candidate'
          m=json.load(open(root/'manifest.json'))
          mat=json.load(open(root/'provider-v3-materialization.json'))
          live=json.load(open(root/'automation/hotd-s3e1-live.json'))
          assert m.get('version')=='5.21.35', m.get('version')
          assert len(m.get('scrapers') or [])==96
          assert mat.get('providerCount')==96 and mat.get('publication') is False
          acc=live.get('acceptance') or {}
          if acc.get('kehflixOk') is not True: raise SystemExit('Kehflix HOTD proof is not green')
          allow=(Path('/tmp/allow-purstream-diagnostic').read_text().strip()=='1')
          if acc.get('purstreamOk') is not True and not allow:
              raise SystemExit('Purstream HOTD is NOT_OK; publication trigger has not explicitly accepted diagnostic blocker')
          print('ARTIFACT_CANDIDATE_ACCEPTED providers=96 kehflix=ok purstream='+('ok' if acc.get('purstreamOk') else 'not_ok'))
          PY

      - name: Apply deterministic source migrations matching candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepatch_identity_cleanup_shared_owner_v1.py
          python scripts/apply_core_identity_ownership_cleanup.py
          python scripts/upgrade_provider_worker_route_proof_v1.py
          python scripts/upgrade_provider_route_proof_request_spec_v1.py
          python scripts/upgrade_provider_base_runtime_v5.py
          python scripts/upgrade_provider_base_route_requests_v1.py
          python scripts/upgrade_provider_route_authority_v5.py
          python scripts/upgrade_route_recovery_request_specs_v1.py
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python -m py_compile scripts/provider_route_proof.py scripts/enforce_route_proof_manifest_policy_v1.py scripts/hotd_s3e1_live_probe.py
          node --check scripts/provider_worker.cjs
          python scripts/provider_base_store.py validate

      - name: Overlay exact route-proof candidate
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/candidate"
          rsync -a --delete "$C/providers/" providers/
          cp "$C/manifest.json" manifest.json
          cp "$C/provider-overrides.json" provider-overrides.json
          cp "$C/automation/provider-v3-static-knowledge.json" automation/provider-v3-static-knowledge.json
          cp "$C/automation/provider-route-recovery-v5.json" automation/provider-route-recovery-v5.json
          cp "$C/provider-v3-materialization.json" provider-v3-materialization.json
          cp "$C/provider-v3-quick-yield.json" provider-v3-quick-yield.json
          cp "$C/automation/hotd-s3e1-live.json" automation/hotd-s3e1-live.json
          cp "$C/health-report.json" health-report.json
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_published_provider_config.py --expected 96
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          movix=next(r for r in m['scrapers'] if str(r.get('id','')).casefold()=='movix')
          pur=next(r for r in m['scrapers'] if str(r.get('id','')).casefold()=='purstream')
          assert movix.get('enabled') is False, movix
          assert pur.get('canonicalSupportedTypes')==['movie','tv'], pur
          assert pur.get('supportedTypes')==['movie','tv','series'], pur
          print('ARTIFACT_OVERLAY_OK providers=96 movix_enabled=false purstream=canonical_movie_tv+series_transport')
          PY

      - name: Synchronize 5.21.36 client-visible versions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_release_versions.py --previous "$RUNNER_TEMP/manifest.before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          before=json.load(open(Path(os.environ['RUNNER_TEMP'])/'manifest.before.json'))
          after=json.load(open('manifest.json'))
          assert before.get('version')=='5.21.35'
          assert after.get('version')=='5.21.36', after.get('version')
          old={str(r.get('id','')).casefold():r for r in before.get('scrapers',[]) if isinstance(r,dict)}
          bumped=0
          for row in after.get('scrapers',[]):
              prev=old.get(str(row.get('id','')).casefold())
              if prev and {k:v for k,v in row.items() if k!='version'} != {k:v for k,v in prev.items() if k!='version'}:
                  bumped+=1
          print(f'ROUTE_PROOF_VERSION_SYNC_OK version=5.21.36 changed_rows={bumped}')
          PY

      - name: Final exact publication proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_published_provider_config.py --expected 96
          python tests/final_published_provider_config_test.py
          python tests/provider_js_lego_ownership_test.py
          python tests/global_identity_policy_ownership_test.py
          python tests/episodic_identity_runtime_test.py
          python tests/episodic_year_identity_regression_test.py
          python tests/global_stream_output_guard_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/native_hls_integrity_budget_test.py
          python tests/native_provider_loading_compat_test.py
          python tests/global_media_type_resolution_test.py
          python tests/native_dual_id_identity_test.py
          python scripts/verify_provider_v3_reverse_rebuild.py
          python scripts/audit_provider_v3_static.py
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          python3 - <<'PY'
          import json
          for path in ('manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              m=json.load(open(path)); assert m.get('version')=='5.21.36',(path,m.get('version'))
          live=json.load(open('automation/hotd-s3e1-live.json'))
          assert (live.get('acceptance') or {}).get('kehflixOk') is True
          print('FINAL_ROUTE_PROOF_PUBLICATION_PROOF_OK version=5.21.36 providers=96')
          PY

      - name: Write final MEMORY checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run_id=Path('/tmp/route-proof-run-id').read_text().strip()
          source=Path('/tmp/route-proof-source-sha').read_text().strip()
          live=json.load(open('automation/hotd-s3e1-live.json'))
          acc=live.get('acceptance') or {}
          p=Path('MEMORY.md'); text=p.read_text(encoding='utf-8')
          marker='## 2026-09-07 — Route-proof 5.21.36 artifact publication'
          block=f'''\n{marker}\n\n- Published from exact validated artifact of route-proof run `{run_id}`, source SHA `{source}`; no second route census was substituted during promotion.\n- 96-provider candidate, MOVIX neutralization, current shared cancellation/quality/TMDB Core, identity v11, reverse/static/integrity and client-visible version sync were revalidated before push.\n- HOTD S3E1 live proof: Kehflix={'OK' if acc.get('kehflixOk') else 'NOT_OK'}, Purstream={'OK' if acc.get('purstreamOk') else 'NOT_OK'}.\n- Root/VF/no-anime/VF-no-anime publication target is `5.21.36`. Post-push manifest verification remains mandatory before declaring publication accepted.\n'''
          if marker not in text: p.write_text(text.rstrip()+"\n"+block,encoding='utf-8')
          PY

      - name: Publish atomically to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/main-route-proof-artifact-publication.yml .github/triggers/route-proof-publication.json
          git add -A
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "MAIN_ADVANCED base=$BASE_SHA current=$CURRENT_SHA"
            exit 75
          fi
          git commit -m 'release: publish proof-first Provider v3 5.21.36'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
