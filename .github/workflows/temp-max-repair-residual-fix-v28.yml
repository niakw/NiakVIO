name: TEMP - Max Repair Residual Fix V28
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/temp-max-repair-residual-fix-v28.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Apply residual runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_max_repair_residual_runtimes_v5.py
          python3 scripts/reapply_published_overrides.py
          python3 scripts/validate_published_overrides.py
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/core_runtime_nonregression_contract_test.py
      - name: Persist materialized residual fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json manifest.json PROVENANCE.json providers provider-bases scripts/provider_patches/allanime_current_runtime_v1.py scripts/provider_patches/wookafr_current_runtime_v2.py scripts/upgrade_max_repair_residual_runtimes_v5.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: materialize Wooka AllAnime residual runtimes'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
      - name: Probe Wooka and AllAnime current runtimes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-v28.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const result={};
          function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
          function file(pid){const rows=(manifest.scrapers||[]).filter(r=>norm(r&&r.id)===norm(pid));if(rows.length!==1)throw new Error('manifest_count:'+pid+':'+rows.length);return path.resolve(rows[0].filename)}
          function metadata(s){return s.type==='movie'?{title:s.title,original_title:s.title,release_date:`${s.year}-01-01`,alternative_titles:{titles:[]}}:{name:s.title,original_name:s.title,first_air_date:`${s.year}-01-01`,alternative_titles:{results:[]}}}
          async function run(label,s){
            try{
              const ns=s.type==='movie'?'movie':'tv',m=metadata(s),f=file(s.pid);
              globalThis.__nuvioMediaContext={tmdbId:String(s.id),tmdbNamespace:ns,tmdbMetadata:m,canonicalMediaType:s.type};
              globalThis.__nuvioTmdbMetadataCacheV1={[`${ns}:${s.id}`]:m};
              globalThis.__nuvioProviderDeadlineMs=Date.now()+32000;
              delete require.cache[f]; const mod=require(f);
              const rows=await Promise.race([Promise.resolve(mod.getStreams(String(s.id),s.type,s.season,s.episode)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),33000))]);
              const out=Array.isArray(rows)?rows:[];
              const leaked=out.some(r=>r&&(r.__nuvioCorrelatedPlayerFallbackV1||r.__nuvioCoreMediaProofV1));
              console.log('PROBE',label,'count='+out.length,'private='+leaked,out.slice(0,8).map(r=>({url:r&&r.url,title:r&&r.title})));
              let status=0,pageOk=false,ctype='';
              if(out[0]&&/^https?:\/\//i.test(String(out[0].url||''))){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(out[0].url,{headers:out[0].headers||{},redirect:'follow',signal:c.signal});status=r.status;ctype=r.headers.get('content-type')||'';const body=await r.text();pageOk=r.ok&&body.length>=20;console.log('PAGE',label,status,ctype,'bytes='+body.length,'final='+r.url)}catch(e){console.log('PAGE_ERROR',label,String(e&&e.message||e))}finally{clearTimeout(t)}}
              result[label]={count:out.length,privateProof:leaked,status,pageOk,ctype,urls:out.slice(0,8).map(r=>String(r&&r.url||''))};
            }catch(e){console.log('PROBE_ERROR',label,String(e&&e.stack||e));result[label]={count:0,privateProof:false,status:0,pageOk:false,error:String(e&&e.message||e),urls:[]}}
          }
          (async()=>{
            await run('wookafr_movie',{pid:'wookafr',id:'157336',type:'movie',title:'Interstellar',year:'2014'});
            await run('wookafr_tv',{pid:'wookafr',id:'1396',type:'tv',title:'Breaking Bad',year:'2008',season:1,episode:1});
            await run('allanime',{pid:'allanime',id:'37854',type:'anime',title:'One Piece',year:'1999',season:1,episode:1178});
            fs.writeFileSync('/tmp/probe-v28.json',JSON.stringify(result,null,2));
            console.log('SUMMARY',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/probe-v28.cjs
      - name: Update repair ledger and MEMORY
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          try: r=json.load(open('/tmp/probe-v28.json'))
          except Exception: r={}
          p=Path('provider-overrides.json'); data=json.loads(p.read_text(encoding='utf-8')); rows=data['provider_patches']
          def positive(k):
              x=r.get(k) or {}; return int(x.get('count') or 0)>0 and not x.get('privateProof')
          def disposition(pid, required, proven):
              row=rows[pid]; d=row.get('repair_disposition') if isinstance(row.get('repair_disposition'),dict) else {'schemaVersion':1,'authority':'provider-repair-disposition-v1'}
              old=set(str(x) for x in d.get('provenLanes') or []); old.update(proven); proven2=[x for x in required if x in old]
              d['requiredLanes']=required; d['provenLanes']=proven2; d['currentVerifiedLanes']=proven2; d['missingLanes']=[x for x in required if x not in proven2]
              d['quarantined']=False; d['terminalState']=None; d['activationState']='enabled'; d['recoveryStatus']='proven' if not d['missingLanes'] else 'repair'; d['completeCapabilityProof']=not d['missingLanes']
              codes=[str(x) for x in d.get('reasonCodes') or [] if str(x)]; code='v28_current_runtime_live_proven' if not d['missingLanes'] else 'v28_partial_lane_live_proven'
              if code not in codes: codes.append(code)
              d['reasonCodes']=codes; row['repair_disposition']=d
          wp=[]
          if positive('wookafr_movie'): wp.append('movie')
          if positive('wookafr_tv'): wp.append('tv')
          disposition('wookafr',['movie','tv'],wp)
          disposition('allanime',['anime'],['anime'] if positive('allanime') else [])
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          mem=Path('MEMORY.md'); t=mem.read_text(encoding='utf-8'); mark='<!-- MAX_REPAIR_20260916_V28_RESULT -->'
          if mark not in t:
              def fmt(k):
                  x=r.get(k) or {}; return f"{k}: count={x.get('count','n/a')} pageOk={x.get('pageOk','n/a')} status={x.get('status','n/a')} error={x.get('error','')}"
              section=mark+'\n### V26/V27/V28 residual provider repair\n- V26 run `35158780319`: Wooka live search `/?s=Interstellar` -> detail -> lecteurvideo 200 with 9 showVideo(base64); AllAnime One Piece -> episode 1178 -> MegaPlay iframe 200; Coflix movie/TV search routes returned no matching catalogue rows.\n- V27 run `35160440178`: old ProviderBase was still executing for Wooka/AllAnime; Wooka never called `/?s=Interstellar`, AllAnime never called `/?s=One Piece`. Wooka V2 runtime existed but was not wired; AllAnime current runtime fell back before title search.\n- V28 wires Wooka V2 and makes AllAnime metadata context/cache-first.\n- '+fmt('wookafr_movie')+'\n- '+fmt('wookafr_tv')+'\n- '+fmt('allanime')+'\n\n'
              anchor='## 2026-09-16 — authoritative current checkpoint'; t=t.replace(anchor,section+anchor,1) if anchor in t else t.rstrip()+'\n\n'+section; mem.write_text(t,encoding='utf-8')
          PY
          python3 scripts/validate_published_overrides.py
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-overrides.json MEMORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record V28 residual provider repair proof'
            git pull --rebase origin fix/non-display-recovery-20260916
            git push origin HEAD:fix/non-display-recovery-20260916
          fi
      - name: Positive gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/probe-v28.json'))
          required=['wookafr_movie','allanime']
          bad={k:r.get(k) for k in required if int((r.get(k) or {}).get('count') or 0)<1 or (r.get(k) or {}).get('privateProof')}
          assert not bad,bad
          print('V28_REQUIRED_POSITIVE_OK',required)
          print('V28_WOOKA_TV',r.get('wookafr_tv'))
          PY
