name: TMP - V29 Adaptive Recovery
# PR trigger V29

on:
  pull_request:
    branches:
      - tmp/v29-adaptive-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight adaptive contracts
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/materializer_authority_monotonic_v25_test.py
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_base_absolute_route_domain_substitution_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 tests/provider_base_template_identity_test.py
          python3 tests/provider_playable_certification_test.py
          python3 -m py_compile \
            scripts/materialize_provider_v3_all.py \
            scripts/provider_base_store.py \
            scripts/reapply_published_overrides.py \
            scripts/certify_provider_playable_lanes.py \
            scripts/domain_refresh_transaction_v2.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs
          python3 scripts/check_provider_repair_survival.py

      - name: Rebase stale ProviderBase and prove publication fixed point
        run: |
          set -euo pipefail
          cp manifest.json health-output/manifest-before-v29.json
          python3 scripts/reapply_published_overrides.py | tee health-output/v29-reapply.log
          python3 scripts/reapply_published_overrides.py --check | tee health-output/v29-reapply-check.log
          python3 scripts/provider_base_store.py validate
          cp manifest.json health-output/manifest-after-reapply-v29.json
          cp PROVENANCE.json health-output/provenance-after-reapply-v29.json

      - name: Apply authoritative Domain Refresh for 4KHDHub only
        run: |
          set -euo pipefail
          python3 scripts/domain_refresh_transaction_v2.py \
            --provider 4khdhub \
            --mode quick \
            --timeout 12 \
            --workers 1 \
            --apply \
            --output health-output/v29-4khdhub-domain-report.json \
            --changes-output health-output/v29-4khdhub-domain-changes.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ov=json.loads(Path('provider-overrides.json').read_text())
          p=(ov.get('provider_patches') or {}).get('4khdhub') or {}
          hubs=json.loads(Path('provider-hubs.json').read_text())
          h=(hubs.get('providers') or {}).get('4khdhub') or {}
          print('FIELD_V29_4K_DOMAIN',
                'site='+str(p.get('official_site') or ''),
                'hub='+str(p.get('official_hub') or ''),
                'runtimeReplacements='+json.dumps(p.get('runtime_domain_replacements') or {},separators=(',',':')),
                'registryDirect='+str(h.get('direct') or ''),
                'registryHub='+str(h.get('hub') or ''))
          assert str(p.get('official_site') or '').rstrip('/') == 'https://4khdhub.one'
          assert 'hdhub4u' not in ' '.join(str(x).lower() for x in h.get('aliases') or [])
          PY
          cp provider-overrides.json health-output/provider-overrides-after-domain-v29.json

      - name: Inspect adaptive runtime models
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          ids={'4khdhub','anikototv','castle','animevost-fr','showbox','anime-sama'}
          m=json.loads(Path('manifest.json').read_text())
          for row in m.get('scrapers') or []:
              pid=str(row.get('id') or '').lower()
              if pid not in ids: continue
              p=Path(str(row.get('filename') or '').replace('../',''))
              text=p.read_text()
              mm=re.search(r'(?:const|let|var)\s+NIAKVIO_PROVIDER_MODEL\s*=\s*Object\.freeze\((\{.*?\})\);',text,re.S)
              model=json.loads(mm.group(1)) if mm else {}
              print('FIELD_V29_MODEL',pid,
                    'authoringV4='+str('NIAKVIO_PROVIDER_BASE_AUTHORING:niakvio-owned-v4' in text).lower(),
                    'v35='+str('NIAKVIO_PROVIDER_ABSOLUTE_ROUTE_DOMAIN_SUBSTITUTION_V35' in text).lower(),
                    'routes='+json.dumps(model.get('routes') or [],separators=(',',':')),
                    'searchPlans='+str(len(model.get('searchRequestPlan') or [])),
                    'searchBases='+json.dumps(model.get('proofSearchBases') or [],separators=(',',':')),
                    'site='+str(model.get('officialSite') or ''),
                    'file='+str(p))
              if pid=='animevost-fr':
                  assert len(model.get('searchRequestPlan') or []) >= 1
              if pid=='4khdhub':
                  assert str(model.get('officialSite') or '').rstrip('/') == 'https://4khdhub.one'
          PY

      - name: Targeted adaptive certification
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider 4khdhub \
            --provider anikototv \
            --provider castle \
            --provider animevost-fr \
            --provider showbox \
            --provider anime-sama \
            --candidate-limit 12 \
            --timeout 30 \
            --workers 2 \
            --seed "v29-adaptive-${GITHUB_RUN_ID}" \
            --output health-output/v29-targeted-certification.json

      - name: Summarize adaptive proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v29-targeted-certification.json').read_text())
          green=[]
          for row in p.get('providers') or []:
              lanes=row.get('lanes') or {}
              gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
              if gl: green.append(row.get('providerId'))
              stages=sorted({
                  str(a.get('debugStage') or '')
                  for v in lanes.values()
                  for a in (v or {}).get('attempts') or []
                  if a.get('debugStage')
              })
              traces=[]
              for v in lanes.values():
                  for a in (v or {}).get('attempts') or []:
                      for n in a.get('networkTrace') or []:
                          traces.append({
                              'requestHost':n.get('requestHost'),
                              'requestPath':n.get('requestPath'),
                              'responseHost':n.get('responseHost'),
                              'responsePath':n.get('responsePath'),
                              'redirected':n.get('redirected'),
                              'status':n.get('status'),
                              'shape':n.get('jsonShape'),
                          })
              print('FIELD_V29_RESULT',row.get('providerId'),
                    'green='+(','.join(gl) or '-'),
                    'full='+str(bool(row.get('certified'))).lower(),
                    'stages='+('|'.join(stages) or '-'))
              if traces:
                  print('FIELD_V29_TRACE',row.get('providerId'),json.dumps(traces[:14],separators=(',',':')))
          print('FIELD_V29_GREEN',str(len(green))+'/6',','.join(sorted(green)))
          PY

      - name: Upload V29 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v29-adaptive-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
