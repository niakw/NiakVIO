name: Retry unavailable Nuvio providers

on:
  workflow_dispatch:
  schedule:
    # Hourly targeted diagnostic retry. Runs only when history contains failures.
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: nuvio-provider-retry
  cancel-in-progress: true

jobs:
  check:
    name: Retry only failed or degraded providers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.targets.outputs.has_targets }}
      target_count: ${{ steps.targets.outputs.target_count }}

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build narrow retry queue
        id: targets
        run: python scripts/prepare_retry_targets.py

      - name: Set up Node.js
        if: steps.targets.outputs.has_targets == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned direct runtime dependencies
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Stage only retry targets
        if: steps.targets.outputs.has_targets == 'true'
        run: python scripts/stage_published.py --include-file retry-targets.json

      - name: Lock staged provider code against modification
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          sudo chown -R root:root staging
          sudo chmod -R a-w staging

      - name: Run low-cost targeted retries
        if: steps.targets.outputs.has_targets == 'true'
        env:
          NUVIO_HEALTH_OUTPUT: health-output
        run: node scripts/health_check.mjs --retry

      - name: Upload targeted diagnostic result
        if: steps.targets.outputs.has_targets == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvio-retry-${{ github.run_id }}
          path: health-output/health-results.json
          retention-days: 2
          if-no-files-found: error

      - name: No retry needed
        if: steps.targets.outputs.has_targets != 'true'
        run: echo "No unavailable or degraded provider currently needs an hourly retry."

  report:
    name: Update targeted diagnostic state only
    needs: check
    if: needs.check.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout current published repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download targeted result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-retry-${{ github.run_id }}
          path: checked-artifact

      - name: Update reports without applying manifest toggles
        env:
          NUVIO_HEALTH_RESULTS: checked-artifact/health-results.json
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.before.json"
          cp vf/manifest.json "$RUNNER_TEMP/vf.before.json"
          python scripts/update_availability.py
          rm -f manifest.next.json
          cmp -s manifest.json "$RUNNER_TEMP/manifest.before.json"
          cmp -s vf/manifest.json "$RUNNER_TEMP/vf.before.json"

      - name: Publish targeted diagnostic reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability-report.json availability-history.json
          if git diff --cached --quiet; then
            echo "Targeted availability reports are unchanged."
            exit 0
          fi
          git commit -m "chore: retry unavailable provider diagnostics"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
