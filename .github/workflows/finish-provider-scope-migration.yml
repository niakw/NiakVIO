name: SHORT - Finish dynamic provider scope migration

on:
  push:
    branches:
      - fix/active44-durability-20260915
    paths:
      - '.github/workflows/finish-provider-scope-migration.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active44-durability-20260915
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Migrate operational scope to current identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manage_provider_lifecycle.py --apply
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          R=Path('.')

          def edit(path: str, fn):
              p=R/path
              text=p.read_text(encoding='utf-8')
              new=fn(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  print('PATCHED', path)

          # Non-regression: historical ledger may have any census; executable gate = current active identities.
          def patch_nonreg(t: str) -> str:
              if 'from current_provider_scope import active_provider_ids' not in t:
                  t=t.replace('from typing import Any\n','from typing import Any\n\nfrom current_provider_scope import active_provider_ids\n',1)
              t=t.replace('EXPECTED = 46\n','')
              t=t.replace(
                  'def provider_ids(matrix: dict[str, Any]) -> list[str]:\n    return sorted({canon(row.get("provider")) for row in matrix.get("providers") or [] if canon(row.get("provider"))})',
                  'def provider_ids(matrix: dict[str, Any]) -> list[str]:\n    historical = {canon(row.get("provider")) for row in matrix.get("providers") or [] if canon(row.get("provider"))}\n    return sorted(historical & active_provider_ids())'
              )
              t=t.replace(
                  '    if int(matrix.get("providerCount") or 0) != EXPECTED:\n        failures.append(f"matrix providerCount must be {EXPECTED}")',
                  '    declared = int(matrix.get("providerCount") or 0)\n    physical_rows = matrix_rows(matrix)\n    if declared and declared != len(physical_rows):\n        failures.append(f"matrix providerCount={declared} differs from ledger rows={len(physical_rows)}")'
              )
              t=t.replace(
                  '    rows = matrix_rows(matrix)\n    if len(rows) != EXPECTED:\n        failures.append(f"matrix must contain {EXPECTED} unique provider rows, got {len(rows)}")',
                  '    rows = matrix_rows(matrix)\n    if not rows:\n        failures.append("matrix must contain provider history rows")'
              )
              return t
          edit('scripts/check_provider_non_regression_v1.py',patch_nonreg)

          # Provider minimizer: only enabled provider artifacts in providers/ are executable scope.
          def patch_minimizer(t: str) -> str:
              t=t.replace('EXPECTED_PROVIDER_COUNT = 46\n','')
              old='''    filenames = [\n        str(row.get("filename") or "").strip()\n        for row in (manifest.get("scrapers") or [])\n        if str(row.get("filename") or "").strip()\n    ]\n    if len(filenames) != EXPECTED_PROVIDER_COUNT or len(set(filenames)) != EXPECTED_PROVIDER_COUNT:\n        raise SystemExit(\n            f"expected {EXPECTED_PROVIDER_COUNT} unique manifest provider filenames, "\n            f"got {len(filenames)} / {len(set(filenames))}"\n        )'''
              new='''    filenames = [\n        str(row.get("filename") or "").strip()\n        for row in (manifest.get("scrapers") or [])\n        if isinstance(row, dict)\n        and row.get("enabled") is not False\n        and str(row.get("filename") or "").startswith("providers/")\n    ]\n    if not filenames or len(filenames) != len(set(filenames)):\n        raise SystemExit(\n            f"active manifest provider filenames must be unique/non-empty: {len(filenames)} / {len(set(filenames))}"\n        )'''
              if old not in t:
                  raise SystemExit('provider_v3_minimizer provider_files block drifted')
              t=t.replace(old,new,1)
              t=t.replace(
                  'f"require idempotence and Node syntax on all {EXPECTED_PROVIDER_COUNT} current providers",',
                  'f"require idempotence and Node syntax on all {len(files)} current active providers",'
              )
              old='''    if report["provider_count"] != EXPECTED_PROVIDER_COUNT:\n        raise SystemExit(\n            f"expected {EXPECTED_PROVIDER_COUNT} generated providers, got {report['provider_count']}"\n        )\n'''
              if old in t:
                  t=t.replace(old,'',1)
              return t
          edit('scripts/provider_v3_minimizer.py',patch_minimizer)

          # History matrices: count is descriptive output metadata, not a release gate.
          def patch_history_v3(t: str) -> str:
              t=t.replace('EXPECTED = 46\n','')
              t=t.replace(
                  '    if int(matrix.get("providerCount") or 0) != EXPECTED:\n        raise SystemExit(f"expected {EXPECTED} providers, got {matrix.get(\'providerCount\')}")',
                  '    history_rows = [row for row in matrix.get("providers") or [] if isinstance(row, dict)]\n    declared = int(matrix.get("providerCount") or len(history_rows))\n    if declared != len(history_rows):\n        raise SystemExit(f"history matrix identity mismatch declared={declared} rows={len(history_rows)}")'
              )
              return t
          edit('scripts/build_provider_history_matrix_v3.py',patch_history_v3)

          def patch_history_v1(t: str) -> str:
              t=t.replace('EXPECTED = 46\n','')
              t=t.replace('if len(rows) != EXPECTED:', 'if not rows:')
              t=t.replace('f"expected {EXPECTED} providers, got {len(rows)}"', '"provider history matrix is empty"')
              t=t.replace('"providerCount": EXPECTED', '"providerCount": len(rows)')
              return t
          edit('scripts/build_provider_history_matrix.py',patch_history_v1)

          # Blocker inventory must equal current active identity set.
          def patch_inventory(t: str) -> str:
              if 'from current_provider_scope import active_provider_ids' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import active_provider_ids\n',1)
              t=t.replace(
                  '    enabled = [row["provider"] for row in out_rows if row["enabled"]]\n    if len(enabled) != 46:\n        raise AssertionError(f"hub46 inventory must contain exactly 46 enabled targets, got {len(enabled)}")',
                  '    enabled = [row["provider"] for row in out_rows if row["enabled"]]\n    expected = active_provider_ids()\n    if set(enabled) != expected:\n        raise AssertionError(f"active blocker inventory identity mismatch missing={sorted(expected-set(enabled))} extra={sorted(set(enabled)-expected)}")'
              )
              return t
          edit('scripts/build_hub46_blocker_inventory.py',patch_inventory)

          # Sweep plan and semantic helpers derive current scope from repository data.
          def patch_sweep(t: str) -> str:
              if 'from current_provider_scope import active_provider_count' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import active_provider_count\n',1)
              return t.replace('EXPECTED = 46','EXPECTED = active_provider_count()')
          edit('scripts/provider_parallel_sweep_plan_v1.py',patch_sweep)

          def visible_count(t: str, old: str, new: str) -> str:
              if 'from current_provider_scope import visible_provider_count' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\n\nfrom current_provider_scope import visible_provider_count\n',1)
              return t.replace(old,new)
          edit('scripts/reconcile_provider_catalog_media_types.py',lambda t: visible_count(t,'EXPECTED_CURRENT = 46','EXPECTED_CURRENT = visible_provider_count()'))
          edit('scripts/verify_provider_v3_reverse_rebuild.py',lambda t: visible_count(t,'EXPECTED_PROVIDER_COUNT = 46','EXPECTED_PROVIDER_COUNT = visible_provider_count()'))

          # StreamZo migration guard: membership + live active count.
          def patch_streamzo(t: str) -> str:
              if 'from current_provider_scope import active_provider_count' not in t:
                  t=t.replace('from pathlib import Path\n','from pathlib import Path\nfrom current_provider_scope import active_provider_count\n',1)
              return t.replace("if 'streamzo' not in active or len(active)!=46: raise SystemExit('invalid Hub46 authority')",
                               "if 'streamzo' not in active or len(active) != active_provider_count(): raise SystemExit('invalid active-provider authority')")
          edit('scripts/upgrade_streamzo_runtime_v1.py',patch_streamzo)

          # Tests: current cardinality derives from IDs/data. Historical constants can remain historical.
          edit('tests/native_hub46_transport_manifest_test.py',lambda t:t.replace('assert len(rows) == 46','assert len(rows) == len(scope)'))
          edit('tests/provider_v3_strategy_plan_contract_test.py',lambda t:t.replace(
              'assert len(rows) == 46, f"expected hub-only 46-provider catalogue, got {len(rows)}"',
              'assert len({cid(row.get("id")) for row in rows}) == len(rows), "provider ids must be unique"'))
          edit('tests/provider_521_capability_regression_test.py',lambda t:t.replace(
              'CURRENT_PROVIDER_COUNT = 46',
              'CURRENT_PROVIDER_COUNT = len([row for row in json.loads((ROOT / "manifest.json").read_text(encoding="utf-8")).get("scrapers") or [] if isinstance(row, dict) and row.get("enabled") is not False and str(row.get("filename") or "").startswith("providers/")])'))
          edit('tests/provider_html_filter_security_test.py',lambda t:t.replace(
              'EXPECTED = 46',
              'EXPECTED = len([row for row in json.loads((ROOT / "manifest.json").read_text(encoding="utf-8")).get("scrapers") or [] if isinstance(row, dict)])'))
          def patch_canonical_test(t: str) -> str:
              t=t.replace('CURRENT_PROVIDER_COUNT = 46\n','')
              t=t.replace('    assert len(by_canonical) == CURRENT_PROVIDER_COUNT, len(by_canonical)\n','')
              t=t.replace('assert canonical_count == CURRENT_PROVIDER_COUNT, canonical_count','assert canonical_count == len(catalog), (canonical_count, len(catalog))')
              return t
          edit('tests/canonical_media_types_test.py',patch_canonical_test)

          # Align every projection's semantic/transport media fields to provider_catalog source-of-truth.
          catalog=json.loads((R/'provider_catalog.json').read_text(encoding='utf-8'))
          authority={}
          for entry in catalog.get('providers') or []:
              if not isinstance(entry,dict) or not isinstance(entry.get('scraper'),dict):
                  continue
              scraper=entry['scraper']
              pid=str(scraper.get('id') or '').strip().casefold()
              if not pid:
                  continue
              canonical=[str(x).strip().casefold() for x in (scraper.get('canonicalSupportedTypes') or scraper.get('supportedTypes') or []) if str(x).strip()]
              canonical=list(dict.fromkeys(canonical))
              transport=list(canonical)
              if 'anime' in canonical and 'tv' not in transport:
                  transport.append('tv')
              authority[pid]=(canonical,transport)
          if not authority:
              raise SystemExit('empty provider_catalog media authority')
          for rel in ('manifest.json','vf/manifest.json','no-anime/manifest.json','vf-no-anime/manifest.json'):
              p=R/rel
              if not p.exists():
                  continue
              doc=json.loads(p.read_text(encoding='utf-8'))
              changed=[]
              for row in doc.get('scrapers') or []:
                  if not isinstance(row,dict):
                      continue
                  pid=str(row.get('id') or '').strip().casefold()
                  if pid not in authority:
                      raise SystemExit(f'{rel}: provider absent from catalog: {pid}')
                  canonical,transport=authority[pid]
                  if row.get('canonicalSupportedTypes') != canonical or row.get('supportedTypes') != transport:
                      row['canonicalSupportedTypes']=canonical
                      row['supportedTypes']=transport
                      changed.append(pid)
              if changed:
                  p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  print('MEDIA_PROJECTION_PATCHED',rel,','.join(changed))

          # Permanent lifecycle contract, including exact 28-day retention.
          lifecycle_test=R/'tests/provider_disabled_lifecycle_contract_test.py'
          lifecycle_test.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport json\nfrom datetime import date, timedelta\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nmanifest=json.loads((ROOT/"manifest.json").read_text(encoding="utf-8"))\nstate=json.loads((ROOT/"automation/provider-disabled-lifecycle.json").read_text(encoding="utf-8"))\nrows=[row for row in manifest.get("scrapers") or [] if isinstance(row,dict)]\ndisabled={str(row.get("id") or "").strip().casefold().replace("_","-"):row for row in rows if row.get("enabled") is False}\nactive={str(row.get("id") or "").strip().casefold().replace("_","-"):row for row in rows if row.get("enabled") is not False}\nledger=state.get("disabled") or {}\nassert set(disabled)==set(ledger), (set(disabled),set(ledger))\nassert not (set(active)&set(disabled))\nfor pid,row in active.items():\n assert str(row.get("filename") or "").startswith("providers/"), (pid,row.get("filename"))\n assert (ROOT/str(row["filename"])).is_file(), pid\nfor pid,row in disabled.items():\n assert str(row.get("filename") or "").startswith("provider-disabled/"), (pid,row.get("filename"))\n assert (ROOT/str(row["filename"])).is_file(), pid\n disabled_at=date.fromisoformat(str(row.get("disabledAt")))\n purge_after=date.fromisoformat(str(row.get("purgeAfter")))\n assert purge_after-disabled_at == timedelta(days=28), (pid,disabled_at,purge_after)\n assert ledger[pid].get("state")=="disabled-retained"\n assert ledger[pid].get("manifestVisible") is True\nprint(f"provider disabled lifecycle contract passed active={len(active)} disabled={len(disabled)} retention=28")\n''',encoding='utf-8')

          # Permanent anti-regression: no magic current-provider cardinality in critical operational files.
          guard=R/'tests/provider_cardinality_source_of_truth_test.py'
          guard.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport re\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nCHECK=[\n "scripts/check_provider_non_regression_v1.py",\n "scripts/hub_activation_publication.py",\n "scripts/provider_v3_minimizer.py",\n "scripts/merge_provider_repair_report_v6.py",\n "scripts/build_hub46_blocker_inventory.py",\n "scripts/provider_parallel_sweep_plan_v1.py",\n "scripts/reconcile_provider_catalog_media_types.py",\n "scripts/verify_provider_v3_reverse_rebuild.py",\n "scripts/archive_nonhub_providerbases.py",\n "scripts/upgrade_streamzo_runtime_v1.py",\n]\npatterns=[\n re.compile(r"\\b(?:EXPECTED(?:_[A-Z_]+)?|CURRENT_PROVIDER_COUNT|EXPECTED_CURRENT|EXPECTED_ACTIVE)\\s*=\\s*(?:44|46|96)\\b"),\n re.compile(r"len\\([^\\n]+?\\)\\s*(?:==|!=)\\s*(?:44|46|96)\\b"),\n]\nbad=[]\nfor rel in CHECK:\n text=(ROOT/rel).read_text(encoding="utf-8")\n for pat in patterns:\n  if pat.search(text): bad.append(f"{rel}: {pat.pattern}")\nassert not bad, "hard-coded current provider cardinality remains:\\n"+"\\n".join(bad)\nprint("provider cardinality source-of-truth contract passed")\n''',encoding='utf-8')
          print('CURRENT_PROVIDER_IDENTITY_MIGRATION_DONE')
          PY

      - name: Validate migrated contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/current_provider_scope.py \
            scripts/manage_provider_lifecycle.py \
            scripts/check_provider_non_regression_v1.py \
            scripts/hub_activation_publication.py \
            scripts/provider_v3_minimizer.py \
            scripts/merge_provider_repair_report_v6.py \
            scripts/build_hub46_blocker_inventory.py \
            tests/provider_cardinality_source_of_truth_test.py \
            tests/provider_disabled_lifecycle_contract_test.py
          python tests/provider_cardinality_source_of_truth_test.py
          python tests/provider_disabled_lifecycle_contract_test.py
          python scripts/hub_activation_publication.py --verify-catalog
          python tests/canonical_media_types_test.py
          python tests/native_declared_provider_matrix_test.py
          python tests/provider_non_regression_contract_test.py
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_v3_minimizer_contract_test.py
          python tests/provider_v3_minimizer_published_test.py
          python tests/global_stream_output_guard_test.py
          git diff --check

      - name: Commit durable migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts tests manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json \
            manifest-hub46.json native-hub46/manifest.json provider_catalog.json \
            automation/provider-disabled-lifecycle.json providers provider-disabled provider-bases provider-old
          if git diff --cached --quiet; then
            echo CURRENT_PROVIDER_IDENTITY_NO_CHANGE
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix: derive provider gates from current identities'
          git push origin HEAD:fix/active44-durability-20260915
