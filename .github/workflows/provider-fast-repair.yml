name: PROVIDERS - Fast Brain Repair

on:
  workflow_dispatch:
    inputs:
      target_provider:
        description: Optional exact provider in current repairQueue; empty = whole repairQueue
        required: false
        default: ""
        type: string
      target_providers:
        description: Optional comma-separated current repairQueue cohort; takes precedence over target_provider
        required: false
        default: ""
        type: string
      waves:
        description: Brain waves
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      time_budget_seconds:
        description: Provider-local Brain budget
        required: true
        default: "1200"
        type: choice
        options: ["600", "900", "1200", "1800", "2400"]
      publish_validated:
        description: Persist provider-local DATA/bytes only when every accepted candidate passes current-byte Retest
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/triggers/provider-fast-repair.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-fast-repair-main
  cancel-in-progress: false

jobs:
  fast-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate fast lane contracts
        run: |
          set -euo pipefail
          python -m py_compile             scripts/run_provider_fast_repair.py             scripts/run_provider_retest.py             scripts/run_provider_brain_repair.py             scripts/brain_repair_runtime.py             scripts/sanitize_brain_learning_memory.py             scripts/compile_brain_accepted_program_v3.py
          python tests/provider_fast_repair_separation_test.py
          python tests/provider_retest_scope_test.py
          python tests/provider_remat_test_separation_test.py
          python tests/provider_repair_learn_handoff_v1_test.py
          python tests/brain_historical_solution_execution_test.py
          python tests/brain_fast_handoff_active_context_test.py
          python tests/brain_learning_deferred_repair_priority_test.py
          python tests/brain_learning_memory_import_test.py
          python tests/brain_negative_experiment_exhaustion_test.py
          python tests/brain_final_experiment_generation_test.py
          python tests/brain_causal_strategy_profile_test.py
          python tests/brain_causal_profile_matching_bridge_test.py
          python tests/provider_brain_repair_orchestrator_test.py
          python tests/brain_accepted_program_capture_test.py
          python tests/brain_accepted_program_v3_compiler_test.py
          python tests/brain_accepted_program_v3_persistence_test.py
          python tests/provider_census_status_markdown_test.py
          python tests/waf_census_transport_merge_test.py
      - name: Import sanitized persistent Learning priors
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin brain-learning/proposals:refs/remotes/origin/brain-learning/proposals || true
          if git cat-file -e refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json 2>/dev/null; then
            git show refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json > "$RUNNER_TEMP/brain-learning-latest.json"
            python scripts/sanitize_brain_learning_memory.py \
              --input "$RUNNER_TEMP/brain-learning-latest.json" \
              --output "$RUNNER_TEMP/brain-learning-fast-repair.json"
            echo "NIAKVIO_BRAIN_LEARNING_MEMORY=$RUNNER_TEMP/brain-learning-fast-repair.json" >> "$GITHUB_ENV"
            echo "FIELD_PROVIDER_FAST_REPAIR_LEARNING_MEMORY imported=true"
          else
            echo "FIELD_PROVIDER_FAST_REPAIR_LEARNING_MEMORY imported=false reason=no-persistent-learning-memory"
          fi

      - name: Run provider-local Brain Repair
        id: repair
        shell: bash
        env:
          DISPATCH_PROVIDER: ${{ inputs.target_provider || '' }}
          DISPATCH_PROVIDERS: ${{ inputs.target_providers || '' }}
          DISPATCH_WAVES: ${{ inputs.waves || '3' }}
          DISPATCH_BUDGET: ${{ inputs.time_budget_seconds || '1200' }}
          DISPATCH_PUBLISH: ${{ inputs.publish_validated || 'true' }}
        run: |
          set -euo pipefail
          provider="${DISPATCH_PROVIDER:-}"
          providers_csv="${DISPATCH_PROVIDERS:-}"
          waves="${DISPATCH_WAVES:-3}"
          budget="${DISPATCH_BUDGET:-1200}"
          publish="${DISPATCH_PUBLISH:-true}"
          providers=()
          if [ "${{ github.event_name }}" = "push" ]; then
            readarray -t vals < <(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.github/triggers/provider-fast-repair.json').read_text())
          print(str(int(d.get('waves') or 3)))
          print(str(int(d.get('timeBudgetSeconds') or 1200)))
          print('true' if d.get('publishValidated', True) is True else 'false')
          for p in d.get('targetProviders') or []:
              p=str(p or '').strip().lower()
              if p:
                  print(p)
          PY
            )
            waves="${vals[0]:-3}"
            budget="${vals[1]:-1200}"
            publish="${vals[2]:-true}"
            providers=("${vals[@]:3}")
          else
            if [ -n "$providers_csv" ]; then
              IFS=',' read -r -a raw_providers <<< "$providers_csv"
              for p in "${raw_providers[@]}"; do
                p="$(printf '%s' "$p" | tr '[:upper:]_' '[:lower:]-' | xargs)"
                [ -z "$p" ] || providers+=("$p")
              done
            else
              [ -z "$provider" ] || providers+=("$provider")
            fi
          fi
          args=(python scripts/run_provider_fast_repair.py --waves "$waves" --time-budget-seconds "$budget")
          for p in "${providers[@]}"; do args+=(--provider "$p"); done
          printf 'PROVIDER_FAST_REPAIR_ARGS %q ' "${args[@]}"; echo
          "${args[@]}"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Persist current unresolved Fast Brain debt into LEARN handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/provider_repair_learn_handoff_v1.py \
            --registry automation/provider-repair-learn-handoff-v1.json \
            --summary automation/provider-fast-repair-summary.json \
            --run-id "${GITHUB_RUN_ID}"
          python tests/provider_repair_learn_handoff_v1_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('automation/provider-fast-repair-summary.json').read_text())
          handoff=json.loads(Path('automation/provider-repair-learn-handoff-v1.json').read_text())
          current=[str(x) for x in summary.get('learnHandoffProviders') or [] if str(x)]
          print(
              'FIELD_PROVIDER_FAST_REPAIR_LEARN_HANDOFF '
              f'current={len(current)} registry={int(handoff.get("providerCount") or 0)} '
              f'providers={",".join(current) or "none"}'
          )
          PY

      - name: Verify provider-local mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          forbidden=[
              p for p in changed
              if p.startswith((
                  'scripts/',
                  'tests/',
                  '.github/',
                  'engine_v2/',
              ))
          ]
          if forbidden:
              raise SystemExit('fast Brain crossed provider-local boundary: '+','.join(forbidden))
          print('FIELD_PROVIDER_FAST_REPAIR_DIFF files='+str(len(changed)))
          for p in changed:
              print('FIELD_PROVIDER_FAST_REPAIR_CHANGED '+p)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: provider-fast-repair-${{ github.run_id }}
          path: |
            automation/provider-fast-repair-summary.json
            automation/provider-repair-learn-handoff-v1.json
            automation/provider-brain-repair-latest.json
            automation/brain-repair-experience.json
            automation/brain-repair-memory.json
            automation/brain-positive-program-memory.json
            automation/provider-retest-latest.json
            automation/provider-retest-targets-latest.json
            automation/provider-census-status.json
            automation/provider-census-proof-history.json
            automation/provider-repair-batch-plan-latest.json
            PROVIDER_CENSUS_STATUS.md
            provider-v3-quick-yield.json
            provider-overrides.json
            providers/
            provider-bases/
            provider-v3-materialization.json
          retention-days: 14
          if-no-files-found: warn
      - name: Persist validated provider-local repair or evidence
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          publication_allowed="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/provider-fast-repair-summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print('true' if d.get('publicationAllowed') is True else 'false')
          PY
          )"
          publish="${{ steps.repair.outputs.publish }}"
          learn_handoff_count="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/provider-fast-repair-summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print(len([x for x in d.get('learnHandoffProviders') or [] if str(x or '').strip()]))
          PY
          )"
          arm_learning_trigger() {
            if [ "${learn_handoff_count:-0}" -le 0 ]; then
              echo "FIELD_PROVIDER_FAST_REPAIR_LEARN_ARM skipped=true current=0"
              return 0
            fi
            mkdir -p .github/triggers
            cat > .github/triggers/brain-learning-reconstruction <<EOF
          Explicit trigger for isolated Brain strategy learning after Fast Repair.
          last_repair_run: ${GITHUB_RUN_ID}
          source_sha: ${GITHUB_SHA}
          budget_minutes: 20
          reason: fast-brain-strategy-exhaustion
          expected_scope: current-fast-repair-handoff-only
          publication_policy: proposal-only-until-current-byte-playback-identity-and-non-regression-proof
          EOF
            echo "FIELD_PROVIDER_FAST_REPAIR_LEARN_ARM current=${learn_handoff_count} budget_minutes=20"
          }
          dispatch_learning() {
            if [ "${learn_handoff_count:-0}" -le 0 ]; then
              echo "FIELD_PROVIDER_FAST_REPAIR_LEARN_DISPATCH skipped=true current=0"
              return 0
            fi
            gh workflow run brain-learning-lab.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f publish_proposal=false \
              -f slot_remaining_minutes=20 \
              -f slot_phase=1
            echo "FIELD_PROVIDER_FAST_REPAIR_LEARN_DISPATCH current=${learn_handoff_count} budget_minutes=20"
          }
          git fetch --quiet origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "FIELD_PROVIDER_FAST_REPAIR_STALE source=$GITHUB_SHA remote=$remote_main"
            echo "FIELD_PROVIDER_FAST_REPAIR_REQUEUE current_main=$remote_main"
            gh workflow run provider-fast-repair.yml --repo "$GITHUB_REPOSITORY" --ref main
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$publish" = "true" ] && [ "$publication_allowed" = "true" ]; then
            arm_learning_trigger
            git add               provider-overrides.json               providers               provider-bases               provider-v3-materialization.json               PROVIDER_CENSUS_STATUS.md               automation/provider-fast-repair-summary.json               automation/provider-repair-learn-handoff-v1.json               automation/provider-brain-repair-latest.json               .github/triggers/brain-learning-reconstruction               automation/brain-repair-experience.json               automation/brain-repair-memory.json               automation/brain-positive-program-memory.json               automation/provider-retest-latest.json               automation/provider-retest-targets-latest.json               automation/provider-census-status.json               automation/provider-census-proof-history.json               automation/provider-repair-batch-plan-latest.json               automation/provider-v3-static-knowledge.json               provider-v3-quick-yield.json
            if git diff --cached --quiet; then
              echo "Validated repair already current"
            else
              git commit -m "repair(brain): persist validated provider-local repair"
              git push origin HEAD:main
            fi
            dispatch_learning
            echo "FIELD_PROVIDER_FAST_REPAIR_PUBLISHED validated=true"
          else
            tmp="$RUNNER_TEMP/provider-fast-repair-evidence"
            mkdir -p "$tmp/automation"
            for f in               automation/provider-fast-repair-summary.json               automation/provider-repair-learn-handoff-v1.json               automation/provider-brain-repair-latest.json               automation/brain-repair-experience.json               automation/brain-repair-memory.json               automation/brain-positive-program-memory.json               automation/provider-census-status.json               automation/provider-census-proof-history.json               automation/provider-repair-batch-plan-latest.json               PROVIDER_CENSUS_STATUS.md
            do
              [ ! -f "$f" ] || { mkdir -p "$tmp/$(dirname "$f")"; cp "$f" "$tmp/$f"; }
            done
            git reset --hard "$GITHUB_SHA"
            git clean -fd
            for f in               automation/provider-fast-repair-summary.json               automation/provider-repair-learn-handoff-v1.json               automation/provider-brain-repair-latest.json               automation/brain-repair-experience.json               automation/brain-repair-memory.json               automation/brain-positive-program-memory.json               automation/provider-census-status.json               automation/provider-census-proof-history.json               automation/provider-repair-batch-plan-latest.json               PROVIDER_CENSUS_STATUS.md
            do
              [ ! -f "$tmp/$f" ] || { mkdir -p "$(dirname "$f")"; cp "$tmp/$f" "$f"; }
            done
            arm_learning_trigger
            git add PROVIDER_CENSUS_STATUS.md automation .github/triggers/brain-learning-reconstruction
            if git diff --cached --quiet; then
              echo "Brain evidence already current"
            else
              git commit -m "ci(brain): persist fast repair evidence"
              git push origin HEAD:main
            fi
            dispatch_learning
            echo "FIELD_PROVIDER_FAST_REPAIR_PUBLISHED validated=false"
          fi
