name: TMP - V36 Vostfree Targeted
# trigger V36

on:
  pull_request:
    branches:
      - tmp/v36-vostfree-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  vostfree:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Materialize and certify Vostfree
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 tests/provider_runtime_resolver_consumer_v36_test.py
          python3 tests/vostfree_anime_transport_alias_test.py
          python3 scripts/materialize_provider_v3_one.py vostfree
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json --include-disabled --provider vostfree \
            --candidate-limit 12 --timeout 30 --workers 2 \
            --seed "v36-vostfree-${GITHUB_RUN_ID}" \
            --output health-output/v36-vostfree.json
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json
          j=json.load(open('health-output/v36-vostfree.json'))
          row=j['providers'][0]
          lanes=row.get('lanes') or {}
          gl=[k for k,v in lanes.items() if (v or {}).get('state')=='certified']
          stages=sorted({a.get('debugStage') for v in lanes.values() for a in (v or {}).get('attempts') or [] if a.get('debugStage')})
          hosts=sorted({n.get('host') for v in lanes.values() for a in (v or {}).get('attempts') or [] for n in a.get('networkTrace') or [] if n.get('host')})
          print('FIELD_V36_VOSTFREE green='+(','.join(gl) or '-')+' full='+str(bool(row.get('certified'))).lower()+' stages='+('|'.join(stages) or '-')+' hosts='+('|'.join(hosts) or '-'))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v36-vostfree-${{ github.run_id }}
          path: health-output/
          retention-days: 8
