name: Final CodeQL provider hygiene (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-codeql-provider-hygiene-once.yml'
permissions:
  contents: write
concurrency:
  group: final-codeql-provider-hygiene-once
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Patch active ProviderBases and durable generators
        run: python scripts/_final_codeql_provider_hygiene_once.py
      - name: Rebuild derived provider publications
        run: python scripts/reapply_published_overrides.py
      - name: Validate targeted release state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/provider_base_store.py validate
          python scripts/reapply_published_overrides.py --check
          python tests/provider_base_layering_contract_test.py
          python tests/publication_contract_fingerprint_test.py
          python tests/provider_tmdb_runtime_key_contract_test.py
          python tests/workflow_security_policy_test.py
          python tests/targeted_vf_catalogue_adapters_test.py
      - name: Publish validated transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_final_codeql_provider_hygiene_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "security: clear active provider CodeQL escaping alerts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
