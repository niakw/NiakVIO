name: TEMP - Anime capability overdeclaration v1

on:
  push:
    branches: [fix/labs-5.21.44-20260912]
    paths:
      - scripts/fix_anime_capability_overdeclarations_v1.py
      - .github/workflows/temp-anime-capability-overdeclaration-v1.yml

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Remove disproven movie capabilities and rebuild
        run: |
          set -euo pipefail
          python3 scripts/fix_anime_capability_overdeclarations_v1.py
          python3 scripts/materialize_provider_v3_one.py anime-sama
          python3 scripts/materialize_provider_v3_one.py mugiwarastream
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py
          python3 tests/provider_v3_strategy_plan_contract_test.py
      - name: Prove semantic movie fail-closed and measure anime lane
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p
          catalog=p.local_catalog()
          movie={'tmdbId':'157336','mediaType':'movie','category':'movie','title':'Interstellar','year':2014}
          anime={'tmdbId':'95479','mediaType':'anime','category':'anime','season':1,'episode':1,'title':'Jujutsu Kaisen','year':2020}
          report={}
          for pid in ('anime-sama','mugiwarastream'):
            rows={}
            for lane,f in (('movie',movie),('anime',anime)):
              r=p.run_worker(catalog[pid]['path'],dict(f),45)
              rows[lane]={'streams':int(r.get('stream_count') or 0),'raw':int(r.get('raw_stream_count') or 0),'statuses':r.get('provider_server_http_statuses') or r.get('http_statuses') or [],'error':r.get('error_class')}
            report[pid]=rows
            if rows['movie']['streams']!=0 or rows['movie']['raw']!=0:
              raise SystemExit(f'{pid}: semantic movie lane did not fail closed')
          Path('automation/anime-capability-overdeclaration-v1-proof.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('ANIME_CAPABILITY_OVERDECLARATION_V1_PROOF '+json.dumps(report,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Persist repair state from live anime measurement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('automation/anime-capability-overdeclaration-v1-proof.json').read_text())
          path=Path('provider-overrides.json');d=json.loads(path.read_text())
          for pid,rows in proof.items():
            r=d['provider_patches'][pid];disp=r['repair_disposition'];positive=rows['anime']['streams']>0
            disp['currentVerifiedLanes']=['anime'] if positive else []
            disp['provenLanes']=['anime'] if positive else []
            disp['missingLanes']=[] if positive else ['anime']
            disp['completeCapabilityProof']=positive
            disp['routeDataState']='on' if positive else 'repair'
            disp['recoveryStatus']='anime-positive-movie-overdeclaration-removed' if positive else 'anime-repair-movie-overdeclaration-removed'
            r['route_data_state']=disp['routeDataState']
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 scripts/materialize_provider_v3_one.py anime-sama
          python3 scripts/materialize_provider_v3_one.py mugiwarastream
          python3 scripts/validate_published_provider_config.py --expected 96
          python3 tests/global_core_runtime_ownership_test.py
      - name: Record and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('automation/anime-capability-overdeclaration-v1-proof.json').read_text())
          m=Path('MEMORY.md');t=m.read_text(encoding='utf-8');marker='## 2026-09-13 — Anime-Sama / Mugiwara movie overdeclaration removed'
          if marker not in t:
            t+=f'''\n{marker}\n\n- Anime-Sama and Mugiwara now publish semantic `anime` only. `tv`/`series` remain transport aliases; `movie` is not advertised after wrong-content/unproven repair evidence.\n- Live post-rebuild evidence: `{json.dumps(proof,ensure_ascii=False)}`. Movie calls fail closed; anime positivity independently controls `on` vs `repair`.\n''';m.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fix_anime_capability_overdeclarations_v1.py provider-overrides.json manifest.json providers/ vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json automation/anime-capability-overdeclaration-v1-proof.json MEMORY.md
          git commit -m 'fix(capabilities): remove fake anime-provider movie lanes'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
