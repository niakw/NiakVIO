name: BOOTSTRAP - International Provider Discovery v2

on:
  push:
    branches:
      - automation/international-provider-discovery-v2
    paths:
      - '.github/workflows/international-provider-discovery.yml'
      - 'automation/international-provider-discovery-sources.json'

permissions:
  contents: write

concurrency:
  group: bootstrap-international-provider-discovery-v2
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/international-provider-discovery-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Import validated discovery implementation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/niakw/NiakVIO/automation/international-provider-discovery'
          mkdir -p automation research scripts .github/workflows
          curl -fsSL "$BASE/scripts/discover_international_provider_candidates.py" -o scripts/discover_international_provider_candidates.py
          curl -fsSL "$BASE/automation/international-provider-discovery-sources.json" -o automation/international-provider-discovery-sources.json
          curl -fsSL "$BASE/automation/international-provider-manual-candidates.json" -o automation/international-provider-manual-candidates.json
          curl -fsSL "$BASE/automation/international-provider-manual-supplement.json" -o automation/international-provider-manual-supplement.json
          curl -fsSL "$BASE/research/international-provider-candidates.json" -o research/international-provider-candidates.json
          curl -fsSL "$BASE/research/international-provider-candidates.csv" -o research/international-provider-candidates.csv
          curl -fsSL "$BASE/research/international-provider-candidates.xlsx" -o research/international-provider-candidates.xlsx
          # Import the final workflow last: it is workflow_dispatch-only, so this bootstrap commit will not loop.
          curl -fsSL "$BASE/.github/workflows/international-provider-discovery.yml" -o .github/workflows/international-provider-discovery.yml

      - name: Validate imported catalogue and job
        run: |
          set -euo pipefail
          python -m py_compile scripts/discover_international_provider_candidates.py
          python - <<'PY'
          import json, urllib.parse, zipfile
          from collections import Counter
          from pathlib import Path
          bad_hosts = ('github.com','githubusercontent.com','gitlab.com','bitbucket.org','codeberg.org','sourceforge.net')
          data=json.loads(Path('research/international-provider-candidates.json').read_text(encoding='utf-8'))
          rows=data.get('candidates') or []
          assert len(rows)==100, len(rows)
          counts=Counter(str(r.get('market') or '') for r in rows)
          assert len(counts)>=34, len(counts)
          assert min(counts.values())>=2, counts
          for r in rows:
              route=str(r.get('route') or '')
              assert route, r.get('name')
              for field in ('route','hub'):
                  value=str(r.get(field) or '')
                  if not value: continue
                  p=urllib.parse.urlparse(value)
                  assert p.scheme in {'http','https'} and p.hostname, (field,value)
                  h=p.hostname.casefold()
                  assert not any(h==x or h.endswith('.'+x) for x in bad_hosts), (field,value)
          assert int(data.get('hub_gap_count') or 0) >= 40
          with zipfile.ZipFile('research/international-provider-candidates.xlsx') as z:
              assert z.testzip() is None
              assert 'xl/worksheets/sheet3.xml' in z.namelist()
          print(f"validated: {len(rows)} candidates / {len(counts)} markets / min={min(counts.values())} / hub gaps={data.get('hub_gap_count')}")
          PY

      - name: Commit validated discovery catalogue
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/international-provider-discovery.yml \
                  automation/international-provider-discovery-sources.json \
                  automation/international-provider-manual-candidates.json \
                  automation/international-provider-manual-supplement.json \
                  scripts/discover_international_provider_candidates.py \
                  research/international-provider-candidates.json \
                  research/international-provider-candidates.csv \
                  research/international-provider-candidates.xlsx
          if git diff --cached --quiet; then
            echo 'Nothing to import.'
            exit 0
          fi
          git commit -m 'feat(research): import validated country-balanced discovery catalogue'
          git push origin HEAD:automation/international-provider-discovery-v2
