name: TEMP - Final Address Authorities V65

on:
  push:
    branches: [fix/non-display-recovery-20260916]
    paths:
      - .github/workflows/temp-final-domain-seeds-v65.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install current curated address authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          path=Path('provider-hubs.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          rows=doc.setdefault('providers',{})

          def uniq(values):
              out=[]
              for value in values:
                  value=str(value or '').strip()
                  if value and value not in out: out.append(value)
              return out

          def host(url):
              return (urlparse(str(url)).hostname or '').lower()

          def keep_search(row):
              return [dict(s) for s in (row.get('sources') or []) if isinstance(s,dict) and str(s.get('type') or '').lower()=='search']

          def install_redirect(pid, entry, terminal):
              row=rows[pid]
              old_direct=row.get('direct')
              old_candidates=list(row.get('direct_candidates') or [])
              row['hub']=None
              row['resolver']='redirect'
              row['direct']=terminal
              row['direct_candidates']=uniq([terminal,old_direct,*old_candidates])
              row['allowed_terminal_hosts']=uniq([host(terminal),*(row.get('allowed_terminal_hosts') or []),*[host(x) for x in row['direct_candidates']]])
              row['sources']=[{
                  'type':'redirect','url':entry,'priority':120,
                  'purpose':'Curated address entry; follow HTTP redirect to current terminal'
              },*keep_search(row)]
              row['source']='curated_user_registry'
              row['schema_notes']='Curated address entry is authoritative; follow its live HTTP redirect and publish the validated same-provider terminal.'

          install_redirect('desiflix','https://desiflix.onl/','https://desiflix.codes/')
          install_redirect('uhdmovies','https://mmodlist.org/?type=uhdmovies','https://uhdmovies.my/')
          install_redirect('animesalt','https://animesalt.ac/','https://animesalt.cx/')

          row=rows['allwish']
          old_direct=row.get('direct')
          old_candidates=list(row.get('direct_candidates') or [])
          row['hub']='https://t.me/s/allwishme'
          row['resolver']='telegram_description'
          row['direct']='https://all-wish.me/'
          row['direct_candidates']=uniq(['https://all-wish.me/',old_direct,*old_candidates])
          row['allowed_terminal_hosts']=uniq(['all-wish.me',*(row.get('allowed_terminal_hosts') or []),*[host(x) for x in row['direct_candidates']]])
          row['sources']=[{
              'type':'telegram_public','url':'https://t.me/s/allwishme','priority':120,
              'purpose':'Official public Telegram description containing current domain'
          },*keep_search(row)]
          row['source']='curated_user_registry'
          row['schema_notes']='Official public Telegram description is the address authority; publish the current same-provider terminal announced there.'

          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V65_REGISTRY_UPDATED desiflix uhdmovies animesalt allwish')
          PY

          cat > tests/provider_address_authority_v65_test.py <<'PY'
          import json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          rows=json.loads((ROOT/'provider-hubs.json').read_text(encoding='utf-8'))['providers']
          expected={
              'desiflix':('redirect','https://desiflix.onl/','https://desiflix.codes/'),
              'uhdmovies':('redirect','https://mmodlist.org/?type=uhdmovies','https://uhdmovies.my/'),
              'animesalt':('redirect','https://animesalt.ac/','https://animesalt.cx/'),
          }
          for pid,(kind,entry,terminal) in expected.items():
              row=rows[pid]
              assert row.get('resolver')=='redirect', (pid,row.get('resolver'))
              assert str(row.get('direct') or '').rstrip('/')==terminal.rstrip('/'), (pid,row.get('direct'))
              assert any(s.get('type')==kind and s.get('url')==entry for s in row.get('sources') or []), pid
          allwish=rows['allwish']
          assert allwish.get('resolver')=='telegram_description'
          assert str(allwish.get('hub') or '').rstrip('/')=='https://t.me/s/allwishme'
          assert str(allwish.get('direct') or '').rstrip('/')=='https://all-wish.me'
          assert any(s.get('type')=='telegram_public' and str(s.get('url') or '').rstrip('/')=='https://t.me/s/allwishme' for s in allwish.get('sources') or [])
          print('PROVIDER_ADDRESS_AUTHORITY_V65_OK')
          PY

          python tests/provider_address_authority_v65_test.py
          python tests/provider_hub_registry_test.py

      - name: Resolve and publish the four current terminals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health-output automation/evidence
          python scripts/domain_refresh_transaction_v2.py \
            --provider desiflix --provider uhdmovies --provider animesalt --provider allwish \
            --mode quick --timeout 18 --workers 4 --apply \
            --output health-output/v65-address-report.json \
            --changes-output health-output/v65-address-changes.json
          python - <<'PY'
          import json
          r=json.load(open('health-output/v65-address-report.json',encoding='utf-8'))
          expected={
            'desiflix':'https://desiflix.codes',
            'uhdmovies':'https://uhdmovies.my',
            'animesalt':'https://animesalt.cx',
            'allwish':'https://all-wish.me',
          }
          for pid,url in expected.items():
              row=r['providers'].get(pid)
              print('V65_DOMAIN',pid,json.dumps(row,sort_keys=True))
              assert row and row.get('status')=='site_authoritative', (pid,row)
              assert str(row.get('official_site') or '').rstrip('/')==url, (pid,row.get('official_site'))
          print('V65_ALL_DOMAIN_AUTHORITIES_OK')
          PY

      - name: Reconcile targeted publication and fixed point
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v65-address-changes.json --check
          mapfile -t CHANGED < <(python - <<'PY'
          import json
          d=json.load(open('health-output/v65-address-changes.json',encoding='utf-8'))
          for p in sorted(set(d.get('changed') or [])): print(p)
          PY
          )
          if [ "${#CHANGED[@]}" -gt 0 ]; then
            ARGS=(); for p in "${CHANGED[@]}"; do ARGS+=(--provider "$p"); done
            python scripts/reconcile_provider_domain_metadata.py --rebuild "${ARGS[@]}"
          fi
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v65-address-changes.json
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/provider_v3_minimizer_published_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/audit_provider_v3_static.py

      - name: Probe all four providers from the promoted domains
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import audit_provider_quick_yield as q
          q.TIMEOUT=55
          wanted={'desiflix','uhdmovies','animesalt','allwish'}
          tasks,_=q.build_tasks()
          rows=[]
          for t in tasks:
              pid=str(t.get('provider_id') or '').casefold()
              if pid not in wanted: continue
              r=q.run(t); rows.append(r)
              print('V65_RUNTIME',json.dumps({k:r.get(k) for k in ['provider_id','semantic_type','status','debug_stage','raw','playable','verified','contradictions','duration_ms','debug_fetches']},default=str,sort_keys=True))
          Path('automation/evidence/final-address-authorities-v65.json').write_text(json.dumps({'schema_version':1,'providers':sorted(wanted),'rows':rows},ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          by={p:[] for p in wanted}
          for r in rows: by[str(r.get('provider_id') or '').casefold()].append(r)
          for pid in sorted(wanted):
              assert by[pid], f'missing runtime tasks: {pid}'
              print('V65_PROVIDER_SUMMARY',pid,[(r.get('semantic_type'),r.get('status'),r.get('verified')) for r in by[pid]])
          expected_hosts={'desiflix':'desiflix.codes','uhdmovies':'uhdmovies.my','animesalt':'animesalt.cx','allwish':'all-wish.me'}
          for pid,host in expected_hosts.items():
              urls=[str(f.get('url') or '') for r in by[pid] for f in (r.get('debug_fetches') or [])]
              assert any(host in u for u in urls), (pid,host,urls[:12])
          print('V65_RUNTIME_DOMAIN_ROUTING_OK')
          PY

      - name: Persist validated address authorities and evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'provider-hubs.json','provider-overrides.json','provider-domain-history.json',
            'manifest.json','provider-v3-materialization.json','automation/provider-v3-static-knowledge.json','PROVENANCE.json',
            'tests/provider_address_authority_v65_test.py','automation/evidence/final-address-authorities-v65.json',
          }
          changed=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              changed.append(p)
          goodprefix=('providers/desiflix','providers/uhdmovies','providers/animesalt','providers/allwish','health-output/')
          bad=[p for p in changed if p not in allowed and not p.startswith(goodprefix)]
          if bad: raise SystemExit('V65_UNEXPECTED_DIFF '+repr(bad))
          print('V65_CHANGED',changed)
          PY
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-hubs.json provider-overrides.json provider-domain-history.json manifest.json provider-v3-materialization.json \
            automation/provider-v3-static-knowledge.json PROVENANCE.json tests/provider_address_authority_v65_test.py \
            automation/evidence/final-address-authorities-v65.json \
            'providers/desiflix'*.js 'providers/uhdmovies'*.js 'providers/animesalt'*.js 'providers/allwish'*.js
          if git diff --cached --quiet; then
            echo 'V65_PERSIST no material changes'
            exit 0
          fi
          git commit -m 'fix(domains): refresh final curated address authorities'
          git push origin HEAD:fix/non-display-recovery-20260916
