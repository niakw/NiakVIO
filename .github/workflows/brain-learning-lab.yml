name: LEARN - Brain Repair Lab

on:
  workflow_dispatch:
    inputs:
      publish_proposal:
        description: Allow this explicit Learning run to open/refresh a validated Brain proposal PR
        required: false
        default: false
        type: boolean
      target_provider:
        description: Optional exact provider id to run through the canonical Learning queue
        required: false
        default: ""
        type: string
      slot_remaining_minutes:
        description: Optional total Learning slot minutes including this phase; 0 keeps the normal one-hour run
        required: false
        default: "0"
        type: string
      slot_phase:
        description: Internal phase index for a chained long Learning slot
        required: false
        default: "1"
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/triggers/brain-learning-reconstruction'
  schedule:
    - cron: "17 2 * * *"

# Scheduled/full Learning remains serialized. An explicit Fast-Repair handoff
# may supersede an older unpublished Learning run: its source census/handoff is
# newer, and cancelling before publish avoids hours of obsolete global discovery.
concurrency:
  # v2 intentionally escapes the pre-split orphan lane where an obsolete global
  # discovery subprocess can ignore cancellation. New targeted runs serialize
  # and supersede each other here; old-lane runs have no publication authority.
  group: niakvio-brain-learning-lab-v2
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.slot_remaining_minutes != '0') }}

jobs:
  experiment:
    name: LEARNING - Sandbox repair and evidence
    outputs:
      slot_continue: ${{ steps.learning-slot.outputs.continue }}
      slot_next_remaining_minutes: ${{ steps.learning-slot.outputs.next_remaining_minutes }}
      slot_next_phase: ${{ steps.learning-slot.outputs.next_phase }}
      slot_budget_minutes: ${{ steps.learning-slot.outputs.budget_minutes }}
      slot_phase: ${{ steps.learning-slot.outputs.phase }}
      target_provider: ${{ steps.learning-slot.outputs.target_provider }}
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    # GitHub-hosted jobs are capped at 6h. A long Learning slot is therefore
    # resumed through persisted Brain memory in <=5h queue phases.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted production baseline with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact Learning SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "Learning checkout drifted from event SHA." >&2
            exit 1
          }
          echo "FIELD_BRAIN_LEARNING_SHA sha=${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure bounded Learning slot phase
        id: learning-slot
        shell: bash
        env:
          REQUESTED_REMAINING: ${{ inputs.slot_remaining_minutes || '0' }}
          REQUESTED_PHASE: ${{ inputs.slot_phase || '1' }}
          REQUESTED_TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
        run: |
          set -euo pipefail
          remaining="${REQUESTED_REMAINING:-0}"
          phase="${REQUESTED_PHASE:-1}"
          [[ "$remaining" =~ ^[0-9]+$ ]] || remaining=0
          [[ "$phase" =~ ^[0-9]+$ ]] || phase=1
          if [ "$phase" -lt 1 ]; then phase=1; fi
          target_provider="${REQUESTED_TARGET_PROVIDER:-}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -f .github/triggers/brain-learning-reconstruction ]; then
            trigger_target="$(awk -F: '/^target_provider:[[:space:]]*/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; exit}' .github/triggers/brain-learning-reconstruction)"
            if [ -n "${trigger_target:-}" ]; then target_provider="$trigger_target"; fi
          fi
          target_provider="$(printf '%s' "$target_provider" | tr '[:upper:]_' '[:lower:]-' | xargs)"

          # Fast Brain handoff may bound a push-triggered Learning phase.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$remaining" -eq 0 ] && [ -f .github/triggers/brain-learning-reconstruction ]; then
            trigger_budget="$(awk -F: '/^budget_minutes:[[:space:]]*[0-9]+[[:space:]]*$/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' .github/triggers/brain-learning-reconstruction)"
            if [[ "${trigger_budget:-0}" =~ ^[0-9]+$ ]] && [ "${trigger_budget:-0}" -gt 0 ]; then
              remaining="$trigger_budget"
            fi
          fi

          python scripts/select_fast_learning_handoff.py \
            --output /tmp/fast-learning-handoff.json
          fast_handoff="$(python -c "import json; d=json.load(open('/tmp/fast-learning-handoff.json')); print('true' if d.get('fastHandoff') else 'false')")"
          provider_filter="$(python -c "import json; d=json.load(open('/tmp/fast-learning-handoff.json')); print(d.get('providerFilter') or '')")"
          if [ -n "$target_provider" ]; then
            python - "$target_provider" /tmp/fast-learning-handoff.json <<'PY'
          import json,sys
          target=str(sys.argv[1] or '').strip().lower().replace('_','-')
          data=json.load(open(sys.argv[2],encoding='utf-8'))
          allowed={
              str(value or '').strip().lower().replace('_','-')
              for value in str(data.get('providerFilter') or '').split(',')
              if str(value or '').strip()
          }
          if target not in allowed:
              raise SystemExit(f"target provider is not in current Repair Learning handoff: {target}")
          PY
            fast_handoff=true
            provider_filter="$target_provider"
          fi

          if [ "$remaining" -gt 0 ]; then
            budget="$remaining"
            if [ "$budget" -gt 300 ]; then budget=300; fi
            next_remaining=$((remaining - budget))
          else
            budget=60
            next_remaining=0
          fi
          next_phase=$((phase + 1))
          if [ "$next_remaining" -gt 0 ]; then
            continue_slot=true
          else
            continue_slot=false
          fi

          {
            echo "budget_minutes=$budget"
            echo "next_remaining_minutes=$next_remaining"
            echo "phase=$phase"
            echo "next_phase=$next_phase"
            echo "continue=$continue_slot"
            echo "fast_handoff=$fast_handoff"
            echo "provider_filter=$provider_filter"
            echo "target_provider=$target_provider"
          } >> "$GITHUB_OUTPUT"
          echo "FIELD_BRAIN_LONG_SLOT phase=$phase budget_minutes=$budget next_remaining_minutes=$next_remaining continue=$continue_slot fast_handoff=$fast_handoff provider_filter=${provider_filter:-none} target_provider=${target_provider:-none}"

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Brain cron skills and full provider coverage
        shell: bash
        run: |
          set -euo pipefail
          # main may retain an older provider-base artifact while current source
          # invariants already require the common clean ProviderBase v3. Learning
          # is read-only for production, so rematerialize that canonical base only
          # inside this sandbox before enforcing the reconstruction contract.
          mkdir -p brain-learning-input
          cp PROVENANCE.json brain-learning-input/source-provenance.json
          python scripts/materialize_provider_base_v3_store.py
          python scripts/provider_base_store.py validate
          python tests/provider_v3_override_pipeline_contract_test.py
          python tests/brain_cron_full_coverage_test.py
          python tests/brain_architecture_deferred_cohort_test.py
          python tests/daily_learning_coverage_test.py
          python tests/brain_learning_deferred_repair_priority_test.py
          python tests/brain_learning_causal_batch_round_robin_test.py
          python tests/brain_learning_fair_share_route_deadline_test.py
          python tests/fast_learning_handoff_scope_test.py
          python tests/fast_learning_targeted_health_test.py
          python tests/health_provider_filter_contract_test.py
          python tests/published_provider_stage_filter_test.py
          python tests/learning_targeted_domain_refresh_contract_test.py
          python tests/brain_learning_same_run_hypothesis_rotation_test.py
          python tests/brain_final_experiment_generation_test.py
          python tests/brain_second_order_strategy_runtime_test.py
          python tests/brain_third_order_strategy_runtime_test.py
          python tests/brain_document_contract_fallback_test.py
          python tests/brain_learning_generation_runtime_test.py
          python tests/brain_causal_strategy_profile_test.py
          python tests/brain_negative_experiment_exhaustion_test.py
          python tests/brain_positive_program_memory_test.py
          python tests/brain_positive_program_runtime_priority_test.py
          python tests/brain_positive_program_cross_failure_replay_test.py
          python tests/brain_historical_experience_scope_test.py
          python tests/brain_historical_solution_execution_test.py
          python tests/brain_cross_phase_experiment_memory_test.py
          python tests/brain_learning_unexecuted_evolved_suppression_test.py
          python tests/brain_learning_repair_return_workflow_test.py
          python tests/brain_learning_queue_experiment_ledger_test.py
          python tests/brain_learning_causal_wave_merge_test.py
          python tests/brain_learning_push_target_workflow_test.py
          python tests/brain_learning_lab_session_recovery_test.py
          python tests/brain_fast_handoff_active_context_test.py
          python tests/brain_archetype_matching_test.py
          python tests/brain_reconstruction_proposal_self_contained_test.py
          python tests/learning_targeted_runtime_profile_behavior_test.py
          python tests/learning_new_provider_provenance_test.py
          python tests/brain_self_architecture_test.py
          python tests/native_reader_provider_retention_policy_test.py
          python tests/native_reader_ownership_policy_test.py
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_clean_worker_smoke_test.py
          python tests/provider_stage_profile_worker_smoke_test.py
          python tests/provider_discovery_v3_composition_test.py
          python tests/learning_health_baseline_test.py
          python -m py_compile \
            scripts/run_brain_learning_sandbox.py \
            scripts/run_brain_learning_queue.py \
            scripts/select_fast_learning_handoff.py \
            scripts/validate_fast_learning_health_scope.py \
            scripts/brain_positive_program_memory.py \
            scripts/compile_brain_accepted_program_v3.py \
            scripts/brain_repair_runtime.py \
            scripts/adaptive_runtime/runtime_repair.py \
            scripts/build_brain_repair_proposal.py \
            scripts/materialize_clean_provider_reconstruction.py \
            scripts/build_brain_architecture_proposal.py \
            scripts/build_native_reader_brain_repair.py \
            scripts/build_native_reader_learning_summary.py \
            scripts/merge_native_reader_learning_failures.py \
            scripts/classify_native_reader_ownership.py \
            scripts/report_new_upstream_providers.py \
            scripts/validate_daily_learning_coverage.py

      - name: Restore prior sanitized Brain memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brain-learning-input
          git fetch origin brain-learning/proposals:refs/remotes/origin/brain-learning/proposals || true
          if git cat-file -e refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json 2>/dev/null; then
            git show refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json > brain-learning-input/previous.json
          else
            printf '{}\n' > brain-learning-input/previous.json
          fi
          node -e "const x=require('./brain-learning-input/previous.json'); if(x.productionWritesAllowed===true||x.publicationAllowed===true) process.exit(1)"

      - name: Import latest weekly FULL native Lab diagnostics into Learning memory
        if: ${{ steps.learning-slot.outputs.fast_handoff != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p brain-learning-input/native-full-labs

          import_weekly_full() {
            workflow="$1"
            label="$2"
            shift 2
            row="$(gh run list --workflow "$workflow" --event schedule --status completed --limit 1 --json databaseId,conclusion --jq '.[0] | [.databaseId, (.conclusion // "unknown")] | @tsv' || true)"
            run_id="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"
            if [ -z "$run_id" ]; then
              echo "FIELD_LEARNING_FULL_LAB_IMPORT client=$label status=no_completed_weekly_run"
              return 0
            fi
            dest="brain-learning-input/native-full-labs/$label-$run_id"
            rm -rf "$dest"
            mkdir -p "$dest"
            for pattern in "$@"; do
              gh run download "$run_id" --pattern "$pattern" --dir "$dest" || true
            done
            if ! find "$dest" -type f -name '*brain.json' -print -quit | grep -q .; then
              echo "FIELD_LEARNING_FULL_LAB_IMPORT client=$label run=$run_id conclusion=$conclusion status=no_diagnostics"
              return 0
            fi
            python scripts/merge_native_reader_backlog.py \
              --state brain-learning-input/previous.json \
              --previous-state brain-learning-input/previous.json \
              --diagnostics-root "$dest" \
              --run-id "$run_id" \
              --output brain-learning-input/previous.json
            python scripts/merge_native_reader_learning_failures.py \
              --state brain-learning-input/previous.json \
              --diagnostics-root "$dest" \
              --run-id "$run_id" \
              --output brain-learning-input/previous.json
            echo "FIELD_LEARNING_FULL_LAB_IMPORT client=$label run=$run_id conclusion=$conclusion status=processed"
          }

          import_weekly_full native-mobile-android-reader.yml android \
            "native-tv-full-*" \
            "native-mobile-android-full-*"
          import_weekly_full native-mobile-ios-reader.yml ios \
            "native-mobile-ios-full-*"
          import_weekly_full native-desktop-reader-acceptance.yml desktop \
            "native-desktop-full-*-*"

          node -e "const x=require('./brain-learning-input/previous.json'); if(x.productionWritesAllowed===true||x.publicationAllowed===true) process.exit(1)"

      - name: Materialize native reader failure learning summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native_reader_learning_summary.py \
            --state brain-learning-input/previous.json \
            --output brain-learning-input/native-reader-summary.json
          node -e "const x=require('./brain-learning-input/native-reader-summary.json');if(x.policy?.providerMutationFromIncompleteEvidence!==false||x.policy?.failedReaderLearningIsNonBlocking!==true||x.policy?.nuvioClientRuntimeFailuresAreVendorWait!==true)process.exit(1)"

      - name: Materialize historical 5.20.63 audit anchor from Git history
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(node -e "const x=require('./engine_v2/config/historical-audit-baselines.json');process.stdout.write(x.baselines[0].commit)")"
          git cat-file -e "$BASELINE^{commit}"
          git show "$BASELINE:manifest.json" > brain-learning-input/baseline-manifest.json
          git show "$BASELINE:health-report.json" > brain-learning-input/baseline-health.json

      - name: Build isolated current provider stage
        shell: bash
        env:
          FAST_HANDOFF: ${{ steps.learning-slot.outputs.fast_handoff }}
          FAST_HANDOFF_PROVIDER_FILTER: ${{ steps.learning-slot.outputs.provider_filter }}
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p brain-sandbox/health-output
          if [ "$FAST_HANDOFF" = "true" ] && [ -n "${FAST_HANDOFF_PROVIDER_FILTER:-}" ]; then
            args=(python scripts/build_published_provider_stage.py --stage staging)
            IFS=',' read -r -a providers <<< "$FAST_HANDOFF_PROVIDER_FILTER"
            for provider in "${providers[@]}"; do
              [ -z "$provider" ] || args+=(--provider "$provider")
            done
            timeout --signal=TERM --kill-after=5s 30s "${args[@]}"
            echo "FIELD_FAST_LEARNING_STAGE source=published-exact providers=${#providers[@]}"
          else
            python scripts/normalize_provider_activation_overrides.py
            python scripts/discover_candidates.py --require-all-upstreams
            node engine_v2/scripts/validate-stage-against-catalog.mjs --catalog provider_catalog.json --stage staging/candidates.json
            python scripts/build_provider_runtime_profiles.py
            python scripts/reapply_published_overrides.py
            python scripts/build_provider_runtime_profiles.py --stage staging --apply-stage
            python scripts/normalize_terminal_quarantine_stage.py --stage staging
            python scripts/validate_override_pipeline.py --stage staging
            echo "FIELD_FAST_LEARNING_STAGE source=full-discovery"
          fi

      - name: Observe the complete catalogue once for Learning
        shell: bash
        env:
          NUVIO_STAGE: staging
          NUVIO_CANDIDATES_PATH: staging/candidates.json
          NUVIO_HEALTH_OUTPUT: brain-sandbox/full-health
          NUVIO_HEALTH_RESULTS_FILENAME: health-results.json
          NUVIO_WORKER_MEMORY_MB: "1024"
          NUVIO_HEALTH_PROVIDER_FILTER: ${{ steps.learning-slot.outputs.provider_filter }}
        run: |
          set -euo pipefail
          mkdir -p brain-sandbox/full-health brain-sandbox/health-output
          node scripts/health_check.mjs --deep
          test -s brain-sandbox/full-health/health-results.json
          cp brain-sandbox/full-health/health-results.json brain-sandbox/health-output/health-results.json

      - name: Reject common runtime collapse before provider Learning
        if: ${{ steps.learning-slot.outputs.fast_handoff != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_learning_health_baseline.py \
            --catalog provider_catalog.json \
            --stage staging/candidates.json \
            --health brain-sandbox/full-health/health-results.json \
            --output brain-sandbox/learning-runtime-baseline.json

      - name: Prove daily published-provider observation coverage
        if: ${{ steps.learning-slot.outputs.fast_handoff != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_daily_learning_coverage.py \
            --manifest manifest.json \
            --stage staging/candidates.json \
            --health brain-sandbox/full-health/health-results.json \
            --output brain-sandbox/daily-learning-coverage.json

      - name: Prove targeted Fast-Handoff observation coverage
        if: ${{ steps.learning-slot.outputs.fast_handoff == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_fast_learning_health_scope.py \
            --handoff /tmp/fast-learning-handoff.json \
            --health brain-sandbox/full-health/health-results.json \
            --output brain-sandbox/fast-learning-health-scope.json

      - name: Build clean ProviderBase reconstruction stage
        shell: bash
        env:
          FAST_HANDOFF: ${{ steps.learning-slot.outputs.fast_handoff }}
          FAST_HANDOFF_PROVIDER_FILTER: ${{ steps.learning-slot.outputs.provider_filter }}
        run: |
          set -euo pipefail
          rm -rf staging-reconstruction
          args=(python scripts/discover_candidates.py
            --stage staging-reconstruction
            --require-all-upstreams
            --clean-reconstruction)
          if [ "$FAST_HANDOFF" = "true" ] && [ -n "${FAST_HANDOFF_PROVIDER_FILTER:-}" ]; then
            IFS=',' read -r -a providers <<< "$FAST_HANDOFF_PROVIDER_FILTER"
            for provider in "${providers[@]}"; do
              [ -z "$provider" ] || args+=(--provider "$provider")
            done
          fi
          "${args[@]}"
          if [ "$FAST_HANDOFF" != "true" ]; then
            node engine_v2/scripts/validate-stage-against-catalog.mjs \
              --catalog provider_catalog.json \
              --stage staging-reconstruction/candidates.json
          fi
          python scripts/build_provider_runtime_profiles.py \
            --stage staging-reconstruction \
            --apply-stage
          python scripts/normalize_terminal_quarantine_stage.py --stage staging-reconstruction
          python scripts/validate_override_pipeline.py --stage staging-reconstruction
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('staging-reconstruction/candidates.json','utf8'));
          const candidates=(x.candidates||[]).filter(Boolean);
          const byId=new Map(candidates.map(r=>[String(r.canonical_id||'').toLowerCase().replaceAll('_','-'),r]).filter(([id])=>id));
          const fast=String(process.env.FAST_HANDOFF||'')==='true';
          const filtered=new Set(
            String(process.env.FAST_HANDOFF_PROVIDER_FILTER||'')
              .split(',').map(v=>v.trim().toLowerCase().replaceAll('_','-')).filter(Boolean)
          );
          const catalog=JSON.parse(fs.readFileSync('provider_catalog.json','utf8'));
          const expected=fast
            ? filtered
            : new Set((catalog.providers||[]).map(r=>String(r.canonicalId||'').toLowerCase().replaceAll('_','-')).filter(Boolean));
          const missingCurrent=[...expected].filter(id=>!byId.has(id));
          if(missingCurrent.length) {
            throw new Error('clean reconstruction stage is missing expected providers: '+missingCurrent.join(','));
          }
          const extraIds=[...byId.keys()].filter(id=>!expected.has(id));
          if(fast && extraIds.length) {
            throw new Error('Fast-Handoff reconstruction escaped target scope: '+extraIds.join(','));
          }
          const rows=candidates.filter(r=>r.provider_base_reconstruction_required===true);
          if(rows.some(r=>r.candidate_code_origin!=='new-niakvio-clean-seed')) {
            throw new Error('clean reconstruction stage contains a legacy executable seed');
          }
          if(rows.some(r=>r.upstream_code_executed!==false || r.legacy_provider_js_executed_for_reconstruction!==false)) {
            throw new Error('legacy/upstream JS execution escaped into clean reconstruction stage');
          }
          console.log(
            'FIELD_CLEAN_RECONSTRUCTION_STAGE total='+byId.size+
            ' expected='+expected.size+
            ' extra='+extraIds.length+
            ' required='+rows.length+
            ' fast_handoff='+fast
          );
          NODE

      - name: Run adaptive Learning provider queue
        shell: bash
        env:
          TARGET_PROVIDER: ${{ steps.learning-slot.outputs.target_provider || inputs.target_provider || '' }}
        run: |
          set -euo pipefail
          args=(python scripts/run_brain_learning_queue.py
            --stage staging-reconstruction
            --health brain-sandbox/full-health/health-results.json
            --previous-state brain-learning-input/previous.json
            --output-dir brain-sandbox/health-output
            --budget-minutes "${{ steps.learning-slot.outputs.budget_minutes }}"
            --reserve-minutes 5
            --stream-safety-cap 2)
          if [ -n "$TARGET_PROVIDER" ]; then args+=(--provider "$TARGET_PROVIDER"); fi
          "${args[@]}"
          test -s brain-sandbox/health-output/repair-report.json
          test -s brain-sandbox/health-output/learning-queue-state.json
          test -s brain-sandbox/health-output/learning-queue-summary.json
          test -s brain-sandbox/health-output/targeted-lab-summary.json
          python scripts/generate_diagnostics.py \
            --results brain-sandbox/full-health/health-results.json \
            --output brain-sandbox/health-output

      - name: Compare sandbox evidence against historical audit
        shell: bash
        env:
          FAST_HANDOFF_PROVIDER_FILTER: ${{ steps.learning-slot.outputs.provider_filter }}
        run: |
          set -euo pipefail
          args=(node engine_v2/scripts/build-historical-learning.mjs
            --baseline-config engine_v2/config/historical-audit-baselines.json
            --baseline-id excel-provider-audit-5.20.63
            --baseline-manifest brain-learning-input/baseline-manifest.json
            --baseline-health brain-learning-input/baseline-health.json
            --current-manifest manifest.json
            --current-health brain-sandbox/health-output/health-results.json
            --repair-report brain-sandbox/health-output/repair-report.json
            --output brain-sandbox/historical-training.json)
          if [ -n "${FAST_HANDOFF_PROVIDER_FILTER:-}" ]; then
            args+=(--provider-filter "$FAST_HANDOFF_PROVIDER_FILTER")
          fi
          "${args[@]}"

      - name: Build sanitized cross-day Brain state
        shell: bash
        env:
          FAST_HANDOFF_PROVIDER_FILTER: ${{ steps.learning-slot.outputs.provider_filter }}
        run: |
          set -euo pipefail
          rm -rf brain-learning-output
          mkdir -p brain-learning-output
          args=(node engine_v2/scripts/learning-lab.mjs
            --output-dir brain-learning-output
            --repair-report brain-sandbox/health-output/repair-report.json
            --historical-training brain-sandbox/historical-training.json
            --native-summary brain-learning-input/native-reader-summary.json
            --targeted-lab-summary brain-sandbox/health-output/targeted-lab-summary.json
            --learning-queue-state brain-sandbox/health-output/learning-queue-state.json
            --previous-state brain-learning-input/previous.json
            --runtime-experiment-memory brain-sandbox/health-output/runtime-experiment-memory.json
            --overrides provider-overrides.json)
          if [ -n "${FAST_HANDOFF_PROVIDER_FILTER:-}" ]; then
            args+=(--provider-filter "$FAST_HANDOFF_PROVIDER_FILTER")
          fi
          "${args[@]}"
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          node engine_v2/tests/learning-lab-memory.test.mjs
          python -m py_compile scripts/run_brain_learning_sandbox.py scripts/run_brain_learning_queue.py scripts/build_brain_repair_proposal.py scripts/build_brain_architecture_proposal.py scripts/build_native_reader_learning_summary.py scripts/merge_native_reader_learning_failures.py scripts/classify_native_reader_ownership.py
          node -e "const x=require('./brain-learning-output/latest.json'); if(x.productionWritesAllowed!==false||x.publicationAllowed!==false||x.sandboxExecutedProviders!==true) process.exit(1)"
          node - <<'NODE'
          const fs=require('fs');
          const previous=JSON.parse(fs.readFileSync('brain-learning-input/previous.json','utf8'));
          const next=JSON.parse(fs.readFileSync('brain-learning-output/latest.json','utf8'));
          if (previous.nativeReaderRepairMemory && JSON.stringify(next.nativeReaderRepairMemory)!==JSON.stringify(previous.nativeReaderRepairMemory)) {
            throw new Error('native reader repair memory was not preserved across Brain sandbox learning');
          }
          const nativeSummary=JSON.parse(fs.readFileSync('brain-learning-input/native-reader-summary.json','utf8'));
          if ((nativeSummary.providerLearningFailures||0)>0 && !(next.proposals||[]).some(p => String(p.type||'').startsWith('native_reader_'))) {
            throw new Error('provider-owned reader failure memory did not produce a Brain learning/skill proposal');
          }
          if ((nativeSummary.nuvioVendorWaitFailures||0)>0 && (nativeSummary.nuvioVendorWait||[]).some(r => r.providerMutationAllowed!==false || r.deepRetryRequested!==false)) {
            throw new Error('Nuvio vendor-wait evidence escaped into provider mutation/deep retry');
          }
          NODE
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]' brain-learning-output/latest.json; then
            echo 'persistent Brain state contains forbidden raw endpoint/credential material' >&2
            exit 1
          fi

      - name: Materialize validated repair proposal as artifact only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_brain_repair_proposal.py \
            --stage staging-reconstruction/candidates.json \
            --repair-report brain-sandbox/health-output/repair-report.json \
            --overrides provider-overrides.json \
            --output brain-learning-output/provider-overrides.proposed.json \
            --summary brain-learning-output/repair-proposal.json
          node -e "const x=require('./brain-learning-output/repair-proposal.json'); if(x.policy?.publicationAllowed!==false||x.policy?.productionWritesAllowed!==false||x.policy?.pullRequestOnly!==true||x.policy?.requiresHumanMerge!==true) process.exit(1)"
          mkdir -p brain-learning-output/provider-bases
          python scripts/materialize_clean_provider_reconstruction.py \
            --stage staging-reconstruction/candidates.json \
            --queue-summary brain-sandbox/health-output/learning-queue-summary.json \
            --overrides brain-learning-output/provider-overrides.proposed.json \
            --provenance brain-learning-input/source-provenance.json \
            --output-dir brain-learning-output/provider-bases \
            --proposed-provenance brain-learning-output/PROVENANCE.proposed.json \
            --summary brain-learning-output/provider-reconstruction-proposal.json
          node -e "const x=require('./brain-learning-output/provider-reconstruction-proposal.json'); if(x.policy?.publicationAllowed!==false||x.policy?.productionWritesAllowed!==false||x.policy?.pullRequestOnly!==true||x.policy?.requiresHumanMerge!==true||x.policy?.canonicalPipelineProofRequired!==true) process.exit(1)"

      - name: Materialize Brain self-architecture proposal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_brain_architecture_proposal.py \
            --learning-state brain-learning-output/latest.json \
            --policy engine_v2/config/brain-policy.json \
            --self-config engine_v2/config/brain-self-evolution.json \
            --workflow .github/workflows/brain-learning-lab.yml \
            --targeted-lab brain-sandbox/health-output/targeted-lab-summary.json \
            --queue-summary brain-sandbox/health-output/learning-queue-summary.json \
            --queue-state brain-sandbox/health-output/learning-queue-state.json \
            --batch-plan automation/provider-repair-batch-plan-latest.json \
            --output-policy brain-learning-output/brain-policy.proposed.json \
            --summary brain-learning-output/brain-architecture-proposal.json \
            --markdown brain-learning-output/brain-architecture-proposal.md
          node -e "const x=require('./brain-learning-output/brain-architecture-proposal.json'); if(x.policy?.publicationAllowed!==false||x.policy?.productionWritesAllowed!==false||x.policy?.pullRequestOnly!==true||x.policy?.requiresHumanMerge!==true) process.exit(1)"

      - name: Upload sanitized learning and proposal state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: niakvio-brain-learning-state
          path: |
            brain-learning-output/latest.json
            brain-learning-output/latest.md
            brain-learning-output/provider-overrides.proposed.json
            brain-learning-output/repair-proposal.json
            brain-learning-output/PROVENANCE.proposed.json
            brain-learning-output/provider-reconstruction-proposal.json
            brain-learning-output/provider-bases/
            brain-learning-output/brain-policy.proposed.json
            brain-learning-output/brain-architecture-proposal.json
            brain-learning-output/brain-architecture-proposal.md
            brain-learning-input/native-reader-summary.json
            brain-sandbox/daily-learning-coverage.json
            brain-sandbox/health-output/learning-queue-state.json
            brain-sandbox/health-output/learning-queue-summary.json
            brain-sandbox/health-output/runtime-experiment-memory.json
            brain-sandbox/health-output/targeted-lab-summary.json
          retention-days: 14
          if-no-files-found: error

  publish-learning:
    name: LEARNING - Publish sanitized memory
    needs: experiment
    concurrency:
      group: niakvio-brain-learning-memory-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted production tree only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Download sanitized state produced by read-only sandbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: niakvio-brain-learning-state
          # The artifact contains both brain-learning-output/* and brain-learning-input/*.
          # Extract at repository root so the original relative paths are preserved.
          path: .

      - name: Validate artifact cannot publish production
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-learning-output/latest.json
          test -s brain-learning-output/latest.md
          node -e "const x=require('./brain-learning-output/latest.json'); if(x.productionWritesAllowed!==false||x.publicationAllowed!==false) process.exit(1)"
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]' brain-learning-output/latest.json; then
            echo 'refusing unsafe learning artifact' >&2
            exit 1
          fi

      - name: Update the single sanitized learning-memory ref
        id: publish-memory
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="brain-learning/proposals"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true

          candidate_ms="$(node -e "const x=require('./brain-learning-output/latest.json');const t=Date.parse(x.generatedAt||'');if(!Number.isFinite(t))process.exit(2);process.stdout.write(String(t))")"
          existing_ms=""
          if git cat-file -e "refs/remotes/origin/$BRANCH:engine_v2/learning/latest.json" 2>/dev/null; then
            git show "refs/remotes/origin/$BRANCH:engine_v2/learning/latest.json" > "$RUNNER_TEMP/brain-learning-existing.json"
            existing_ms="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/brain-learning-existing.json','utf8'));const t=Date.parse(x.generatedAt||'');if(Number.isFinite(t))process.stdout.write(String(t))")"
          fi
          if [ -n "$existing_ms" ] && [ "$candidate_ms" -le "$existing_ms" ]; then
            echo "FIELD_BRAIN_MEMORY_PUBLISH skipped=stale candidate_ms=$candidate_ms existing_ms=$existing_ms"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Always publish from a fresh orphan tree. The previous ref is
          # consulted only for stale-write comparison and lease protection;
          # its production-sized tree must never become the next memory tree.
          expected_sha=""
          if git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            expected_sha="$(git rev-parse "refs/remotes/origin/$BRANCH")"
          fi
          TMP_BRANCH="brain-learning-memory-$GITHUB_RUN_ID"
          git switch --orphan "$TMP_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p engine_v2/learning
          cp brain-learning-output/latest.json engine_v2/learning/latest.json
          cp brain-learning-output/latest.md engine_v2/learning/latest.md
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git add engine_v2/learning/latest.json engine_v2/learning/latest.md
          git commit -m "brain: refresh sandbox repair learning"

          tracked="$(git ls-files | sort)"
          expected="$(printf '%s\n' engine_v2/learning/latest.json engine_v2/learning/latest.md | sort)"
          test "$tracked" = "$expected" || {
            echo "refusing non-minimal Brain memory tree" >&2
            printf 'tracked:\n%s\n' "$tracked" >&2
            exit 1
          }

          if [ -n "$expected_sha" ]; then
            git push --force-with-lease="$BRANCH:$expected_sha" origin HEAD:"$BRANCH"
          else
            git push origin HEAD:"$BRANCH"
          fi
          echo "FIELD_BRAIN_MEMORY_PUBLISH mode=orphan-memory-only files=2"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Resume canonical Repair after push-triggered Learning
        if: github.event_name == 'push' && steps.publish-memory.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "FIELD_BRAIN_REPAIR_RETURN source_run=${GITHUB_RUN_ID} target=provider-recognition-repair-v6"
          gh workflow run provider-recognition-repair-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=repair

  publish-repair-proposal:
    name: LEARNING - Open validated repair proposal PR
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_proposal == 'true')
    needs: experiment
    concurrency:
      group: niakvio-brain-repair-proposal-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact Learning source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert proposal source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FIELD_BRAIN_PROPOSAL_SHA sha=${GITHUB_SHA}"

      - name: Download validated Brain proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: niakvio-brain-learning-state
          path: .

      - name: Validate proposal is concrete and review-only
        id: proposal
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-learning-output/provider-overrides.proposed.json
          test -s brain-learning-output/repair-proposal.json
          test -s brain-learning-output/PROVENANCE.proposed.json
          test -s brain-learning-output/provider-reconstruction-proposal.json
          python -m json.tool brain-learning-output/provider-overrides.proposed.json >/dev/null
          python -m json.tool brain-learning-output/PROVENANCE.proposed.json >/dev/null
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('brain-learning-output/repair-proposal.json','utf8'));
          const reconstruction=JSON.parse(fs.readFileSync('brain-learning-output/provider-reconstruction-proposal.json','utf8'));
          if (x.policy?.publicationAllowed !== false ||
              x.policy?.productionWritesAllowed !== false ||
              x.policy?.pullRequestOnly !== true ||
              x.policy?.requiresHumanMerge !== true ||
              reconstruction.policy?.publicationAllowed !== false ||
              reconstruction.policy?.canonicalPipelineProofRequired !== true) {
            throw new Error('unsafe Brain proposal policy');
          }
          const count=Number(x.proposalCount||0);
          const providerCount=Number(x.providerProposalCount||0);
          const skillCount=Number(x.learnedSkillProposalCount||0);
          const reconstructionCount=Number(reconstruction.candidateCount||0);
          const reviewableProviderChanges=providerCount+reconstructionCount;
          console.log('FIELD_BRAIN_PR_CANDIDATE proposals='+count+' reconstructions='+reconstructionCount+' provider='+providerCount+' skills='+skillCount+' reviewable_provider_changes='+reviewableProviderChanges);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proposal_count='+count+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'provider_change_count='+reviewableProviderChanges+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'reconstruction_count='+reconstructionCount+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes='+(reviewableProviderChanges>0?'true':'false')+'\n');
          NODE

      - name: Materialize only the validated configuration diff
        if: steps.proposal.outputs.has_changes == 'true'
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          cp brain-learning-output/provider-overrides.proposed.json provider-overrides.json
          python -m json.tool provider-overrides.json >/dev/null
          if [ "${{ steps.proposal.outputs.reconstruction_count }}" != "0" ]; then
            cp brain-learning-output/PROVENANCE.proposed.json PROVENANCE.json
            mkdir -p provider-bases
            cp brain-learning-output/provider-bases/*.js provider-bases/
          fi
          python tests/brain_repair_proposal_test.py
          python tests/overrides_test.py
          python tests/provider_base_layering_contract_test.py
          python tests/provider_clean_reconstruction_contract_test.py
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          if git diff --quiet -- provider-overrides.json PROVENANCE.json provider-bases; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "Brain produced proposal metadata but no reviewable configuration/base diff."
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the single Brain repair PR
        if: steps.proposal.outputs.has_changes == 'true' && steps.materialize.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: brain-repair/proposal
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=brain-learning-output/repair-proposal.json
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1 \
             && git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$BRANCH"; then
            echo "FIELD_BRAIN_PR skipped=stale-source source=$GITHUB_SHA branch=$BRANCH"
            exit 0
          fi
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add provider-overrides.json PROVENANCE.json provider-bases
          git commit -m "brain: propose validated learning repairs"
          git push --force-with-lease origin HEAD:"$BRANCH"

          PROVIDER_COUNT="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String(x.providerProposalCount||0))")"
          RECONSTRUCTION_COUNT="$(node -e "const x=require('./brain-learning-output/provider-reconstruction-proposal.json');process.stdout.write(String(x.candidateCount||0))")"
          SKILL_COUNT="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String(x.learnedSkillProposalCount||0))")"
          PROVIDERS="$(node -e "const x=require('./$SUMMARY');process.stdout.write((x.providers||[]).join(', ')||'none')")"
          BODY="$(cat <<EOF
          Automated NiakVIO Brain learning proposal from the daily full-catalogue observation plus one targeted experimental provider.

          - Concrete provider repairs: ${PROVIDER_COUNT}
          - Clean ProviderBase v2 candidates: ${RECONSTRUCTION_COUNT}
          - Validated learned-skill promotions: ${SKILL_COUNT}
          - Providers with concrete override changes: ${PROVIDERS}
          - Production writes from the Brain: disabled
          - Human merge: required
          - Fresh PR CI / provider gate: required

          The daily Learning run may explore broader hypotheses than routine Quick/Deep repair, including disabled providers. Only changes that were materialized from accepted sandbox evidence are included in this PR. Core/Brain ideas without a concrete validated code diff remain learning proposals and are not auto-written.
          EOF
          )"

          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "brain: validated daily learning proposal" --body "$BODY"
            echo "FIELD_BRAIN_PR action=refreshed pr=$EXISTING branch=$BRANCH"
          else
            URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "brain: validated daily learning proposal" --body "$BODY")"
            echo "FIELD_BRAIN_PR action=created url=$URL branch=$BRANCH"
          fi

  publish-architecture-proposal:
    name: LEARNING - Open Brain architecture evolution PR
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_proposal == 'true')
    needs: experiment
    concurrency:
      group: niakvio-brain-architecture-proposal-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact Learning source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert architecture proposal source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "FIELD_BRAIN_ARCH_PROPOSAL_SHA sha=${GITHUB_SHA}"

      - name: Download Brain architecture proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: niakvio-brain-learning-state
          path: .

      - name: Validate self-evolution proposal
        id: architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-learning-output/brain-architecture-proposal.json
          test -s brain-learning-output/brain-architecture-proposal.md
          test -s brain-learning-output/brain-policy.proposed.json
          python -m json.tool brain-learning-output/brain-architecture-proposal.json >/dev/null
          python -m json.tool brain-learning-output/brain-policy.proposed.json >/dev/null
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('brain-learning-output/brain-architecture-proposal.json','utf8'));
          const count=Number(x.proposalCount||0);
          if (x.policy?.publicationAllowed !== false ||
              x.policy?.productionWritesAllowed !== false ||
              x.policy?.pullRequestOnly !== true ||
              x.policy?.requiresHumanMerge !== true) {
            throw new Error('unsafe Brain architecture proposal policy');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proposal_count='+count+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes='+(count>0?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'policy_changed='+(x.policyChanged===true?'true':'false')+'\n');
          console.log('FIELD_BRAIN_ARCH_PR_CANDIDATE proposals='+count+' policy_changed='+(x.policyChanged===true));
          NODE

      - name: Materialize architecture proposal
        if: steps.architecture.outputs.has_changes == 'true'
        id: materialize-architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine_v2/learning
          cp brain-learning-output/brain-architecture-proposal.json engine_v2/learning/architecture-proposal.json
          cp brain-learning-output/brain-architecture-proposal.md engine_v2/learning/architecture-proposal.md
          if [ "${{ steps.architecture.outputs.policy_changed }}" = "true" ]; then
            cp brain-learning-output/brain-policy.proposed.json engine_v2/config/brain-policy.json
          fi
          python -m json.tool engine_v2/learning/architecture-proposal.json >/dev/null
          python -m json.tool engine_v2/config/brain-policy.json >/dev/null
          python tests/brain_cron_full_coverage_test.py
          if git diff --quiet -- engine_v2/learning/architecture-proposal.json engine_v2/learning/architecture-proposal.md engine_v2/config/brain-policy.json; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh Brain architecture PR
        if: steps.architecture.outputs.has_changes == 'true' && steps.materialize-architecture.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: brain-architecture/proposal
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=brain-learning-output/brain-architecture-proposal.json
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1 \
             && git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$BRANCH"; then
            echo "FIELD_BRAIN_ARCH_PR skipped=stale-source source=$GITHUB_SHA branch=$BRANCH"
            exit 0
          fi
          git switch -C "$BRANCH" "$GITHUB_SHA"
          mkdir -p engine_v2/learning
          cp brain-learning-output/brain-architecture-proposal.json engine_v2/learning/architecture-proposal.json
          if [ "$(node -e "const x=require('./$SUMMARY');process.stdout.write(x.policyChanged===true?'true':'false')")" = "true" ]; then
            cp brain-learning-output/brain-policy.proposed.json engine_v2/config/brain-policy.json
          fi
          git add engine_v2/learning/architecture-proposal.json engine_v2/learning/architecture-proposal.md engine_v2/config/brain-policy.json
          git commit -m "brain: propose Learning architecture evolution"
          git push --force-with-lease origin HEAD:"$BRANCH"

          COUNT="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String(x.proposalCount||0))")"
          POLICY_CHANGES="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String((x.policyChanges||[]).length))")"
          KINDS="$(node -e "const x=require('./$SUMMARY');process.stdout.write((x.proposals||[]).map(p=>p.evolutionKind).filter(Boolean).join(', ')||'none')")"
          BODY="$(cat <<EOF
          NiakVIO Brain detected limitations in its own Learning/diagnostic architecture and produced a review-only evolution proposal.

          - Architecture proposals: ${COUNT}
          - Allowlisted policy changes proposed: ${POLICY_CHANGES}
          - Evolution kinds: ${KINDS}
          - Production writes from Learning: disabled
          - Human merge: required
          - Fresh CI: required
          - Scope: Brain / Labs / diagnostics / route-learning only

          This PR is intentionally separate from provider repair proposals. It may evolve the Brain's own tooling or policy only after evidence shows the current method is insufficient.
          EOF
          )"
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "brain: Learning architecture evolution proposal" --body "$BODY"
            echo "FIELD_BRAIN_ARCH_PR action=refreshed pr=$EXISTING branch=$BRANCH"
          else
            URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "brain: Learning architecture evolution proposal" --body "$BODY")"
            echo "FIELD_BRAIN_ARCH_PR action=created url=$URL branch=$BRANCH"
          fi

  continue-learning-slot:
    name: LEARNING - Continue chained long slot
    if: ${{ always() && needs.experiment.result == 'success' && needs.publish-learning.result == 'success' && needs.experiment.outputs.slot_continue == 'true' }}
    needs:
      - experiment
      - publish-learning
      - publish-repair-proposal
      - publish-architecture-proposal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next persisted Learning phase
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_REMAINING: ${{ needs.experiment.outputs.slot_next_remaining_minutes }}
          NEXT_PHASE: ${{ needs.experiment.outputs.slot_next_phase }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_REMAINING"
          test -n "$NEXT_PHASE"
          gh workflow run brain-learning-lab.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_proposal=true \
            -f slot_remaining_minutes="$NEXT_REMAINING" \
            -f slot_phase="$NEXT_PHASE"
          echo "FIELD_BRAIN_LONG_SLOT_DISPATCH next_phase=$NEXT_PHASE remaining_minutes=$NEXT_REMAINING"

