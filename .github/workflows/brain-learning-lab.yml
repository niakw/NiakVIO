name: LEARNING - Brain repair sandbox

on:
  workflow_dispatch:
    inputs:
      publish_proposal:
        description: Allow this explicit Learning run to open/refresh a validated Brain proposal PR
        required: false
        default: false
        type: boolean
      target_provider:
        description: Optional exact provider id for one quick targeted Brain lab probe
        required: false
        default: ""
        type: string
      target_client:
        description: Client profile for the quick targeted command lab
        required: false
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
          - tv
  push:
    branches: [main]
    paths:
      - ".github/workflows/brain-learning-lab.yml"
      - "provider_catalog.json"
      - "manifest.json"
      - "provider-overrides.json"
      - "scripts/run_brain_learning_sandbox.py"
      - "scripts/select_brain_targeted_probe.py"
      - "scripts/build_brain_repair_proposal.py"
      - "scripts/build_native_reader_brain_repair.py"
      - "scripts/build_native_reader_learning_summary.py"
      - "scripts/merge_native_reader_learning_failures.py"
      - "scripts/classify_native_reader_ownership.py"
      - "scripts/discover_candidates.py"
      - "scripts/apply_provider_overrides.py"
      - "scripts/provider_patches/**"
      - "tests/brain_cron_full_coverage_test.py"
      - "tests/brain_targeted_probe_test.py"
      - "tests/native_reader_ownership_policy_test.py"
      - "engine_v2/scripts/learning-lab.mjs"
      - "engine_v2/scripts/build-historical-learning.mjs"
      - "engine_v2/config/brain-policy.json"
      - "engine_v2/config/historical-audit-baselines.json"
      - "engine_v2/tests/learning-lab-memory.test.mjs"
  schedule:
    - cron: "17 2 * * *"

# Brain runs are learning evidence. A later main push must not erase a failed-repair
# observation before it can be converted into sanitized memory/skill proposals.
concurrency:
  group: niakvio-brain-learning-lab-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  experiment:
    name: LEARNING - Sandbox repair and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout trusted production baseline with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Brain cron skills and full provider coverage
        shell: bash
        run: |
          set -euo pipefail
          python tests/brain_cron_full_coverage_test.py
          python tests/brain_targeted_probe_test.py
          python tests/native_reader_provider_retention_policy_test.py
          python tests/native_reader_ownership_policy_test.py
          python -m py_compile \
            scripts/run_brain_learning_sandbox.py \
            scripts/build_brain_repair_proposal.py \
            scripts/build_native_reader_brain_repair.py \
            scripts/build_native_reader_learning_summary.py \
            scripts/merge_native_reader_learning_failures.py \
            scripts/classify_native_reader_ownership.py \
            scripts/report_new_upstream_providers.py

      - name: Restore prior sanitized Brain memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brain-learning-input
          git fetch origin brain-learning/proposals:refs/remotes/origin/brain-learning/proposals || true
          if git cat-file -e refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json 2>/dev/null; then
            git show refs/remotes/origin/brain-learning/proposals:engine_v2/learning/latest.json > brain-learning-input/previous.json
          else
            printf '{}\n' > brain-learning-input/previous.json
          fi
          node -e "const x=require('./brain-learning-input/previous.json'); if(x.productionWritesAllowed===true||x.publicationAllowed===true) process.exit(1)"

      - name: Materialize native reader failure learning summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native_reader_learning_summary.py \
            --state brain-learning-input/previous.json \
            --output brain-learning-input/native-reader-summary.json
          node -e "const x=require('./brain-learning-input/native-reader-summary.json');if(x.policy?.providerMutationFromIncompleteEvidence!==false||x.policy?.failedReaderLearningIsNonBlocking!==true||x.policy?.nuvioClientRuntimeFailuresAreVendorWait!==true)process.exit(1)"

      - name: Materialize historical 5.20.63 audit anchor from Git history
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(node -e "const x=require('./engine_v2/config/historical-audit-baselines.json');process.stdout.write(x.baselines[0].commit)")"
          git cat-file -e "$BASELINE^{commit}"
          git show "$BASELINE:manifest.json" > brain-learning-input/baseline-manifest.json
          git show "$BASELINE:health-report.json" > brain-learning-input/baseline-health.json

      - name: Build isolated current provider stage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf brain-sandbox staging
          mkdir -p brain-sandbox/health-output
          python scripts/normalize_provider_activation_overrides.py
          python scripts/resolve_provider_hubs.py --apply --mode deep --include-disabled --search-disabled --workers 8 --timeout 8 --output brain-sandbox/health-output/provider-hub-report.json
          python scripts/discover_candidates.py --require-all-upstreams
          node engine_v2/scripts/validate-stage-against-catalog.mjs --catalog provider_catalog.json --stage staging/candidates.json
          node scripts/provider_dns_preflight.mjs --stage staging --output brain-sandbox/health-output/dns-preflight-report.json
          python scripts/apply_dns_migration_overrides.py --stage staging --report brain-sandbox/health-output/dns-preflight-report.json
          python scripts/build_provider_runtime_profiles.py
          python scripts/reapply_published_overrides.py
          python scripts/build_provider_runtime_profiles.py --stage staging --apply-stage
          python scripts/normalize_terminal_quarantine_stage.py --stage staging
          python scripts/validate_override_pipeline.py --stage staging

      - name: Diagnose mutate retest and learn inside sandbox
        env:
          NUVIO_DNS_PREFLIGHT_RESULTS: brain-sandbox/health-output/dns-preflight-report.json
          NUVIO_WORKER_MEMORY_MB: "1024"
          NUVIO_BRAIN_LEARNING_STATE: brain-learning-input/previous.json
        shell: bash
        run: |
          set -euo pipefail
          # Unresolved providers/failed repairs are valid learning outcomes. The
          # repair engine returns nonzero only for broken infrastructure/contracts;
          # accepted mutations are still validated strictly below.
          python scripts/run_brain_learning_sandbox.py --stage staging --output brain-sandbox/health-output --max-rounds 1
          python scripts/validate_automatic_repair_results.py --stage staging --health brain-sandbox/health-output/health-results.json --repairs brain-sandbox/health-output/repair-report.json
          python scripts/generate_diagnostics.py --results brain-sandbox/health-output/health-results.json --output brain-sandbox/health-output
          test -s brain-sandbox/health-output/health-results.json
          test -s brain-sandbox/health-output/repair-report.json

      - name: Select one targeted provider probe
        id: targeted
        shell: bash
        env:
          TARGET_PROVIDER: ${{ inputs.target_provider || '' }}
          TARGET_CLIENT: ${{ inputs.target_client || 'desktop' }}
        run: |
          set -euo pipefail
          python scripts/select_brain_targeted_probe.py \
            --manifest manifest.json \
            --repair-report brain-sandbox/health-output/repair-report.json \
            --provider "$TARGET_PROVIDER" \
            --client "$TARGET_CLIENT" \
            --github-output "$GITHUB_OUTPUT" \
            --json-out brain-sandbox/targeted-probe-selection.json

      - name: Run one quick targeted Nuvio command lab
        if: steps.targeted.outputs.provider != ''
        shell: bash
        env:
          PROVIDER: ${{ steps.targeted.outputs.provider }}
          CLIENT: ${{ steps.targeted.outputs.client }}
          TMDB_ID: ${{ steps.targeted.outputs.tmdb_id }}
          MEDIA_TYPE: ${{ steps.targeted.outputs.media_type }}
          TITLE: ${{ steps.targeted.outputs.title }}
          YEAR: ${{ steps.targeted.outputs.year }}
          SEASON: ${{ steps.targeted.outputs.season }}
          EPISODE: ${{ steps.targeted.outputs.episode }}
          FIXTURE: ${{ steps.targeted.outputs.slug }}
        run: |
          set -u
          args=(node scripts/nuvio_client_lab.cjs
            --providers "$PROVIDER"
            --clients "$CLIENT"
            --tmdb-id "$TMDB_ID"
            --media-type "$MEDIA_TYPE"
            --title "$TITLE"
            --year "$YEAR"
            --max-streams 1
            --out brain-sandbox/targeted-lab.json
            --markdown brain-sandbox/targeted-lab.md)
          if [ -n "$SEASON" ]; then args+=(--season "$SEASON"); fi
          if [ -n "$EPISODE" ]; then args+=(--episode "$EPISODE"); fi
          STATUS=0
          "${args[@]}" || STATUS=$?
          TARGET_STATUS="$STATUS" node - <<'NODE'
          const fs=require('fs');
          const selection=JSON.parse(fs.readFileSync('brain-sandbox/targeted-probe-selection.json','utf8'));
          let report={providers:[]};
          try { report=JSON.parse(fs.readFileSync('brain-sandbox/targeted-lab.json','utf8')); } catch {}
          const row=(report.providers||[])[0]||{};
          const client=selection.client;
          const clientRow=(row.clients||{})[client]||{};
          const summary={
            provider:selection.provider, fixture:selection.slug, declared_type:selection.declared_type, client,
            command_status:Number(process.env.TARGET_STATUS||0),
            verdict:String(clientRow.verdict||'no_report'),
            runtime_stream_count:Number(clientRow.runtime_stream_count||0),
            playable_probe_count:Number(clientRow.playable_probe_count||0),
            identity_status:String(clientRow.identity_status||'unknown'),
            learning_only:true, productionWritesAllowed:false, publicationAllowed:false
          };
          fs.writeFileSync('brain-sandbox/targeted-lab-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log('FIELD_BRAIN_TARGETED_LAB '+Object.entries(summary).map(([k,v])=>`${k}=${String(v).replace(/\s+/g,'_')}`).join(' '));
          NODE
          rm -f brain-sandbox/targeted-lab.json brain-sandbox/targeted-lab.md
          exit 0

      - name: Compare sandbox evidence against historical audit
        shell: bash
        run: |
          set -euo pipefail
          node engine_v2/scripts/build-historical-learning.mjs \
            --baseline-config engine_v2/config/historical-audit-baselines.json \
            --baseline-id excel-provider-audit-5.20.63 \
            --baseline-manifest brain-learning-input/baseline-manifest.json \
            --baseline-health brain-learning-input/baseline-health.json \
            --current-manifest manifest.json \
            --current-health brain-sandbox/health-output/health-results.json \
            --repair-report brain-sandbox/health-output/repair-report.json \
            --output brain-sandbox/historical-training.json

      - name: Build sanitized cross-day Brain state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf brain-learning-output
          mkdir -p brain-learning-output
          node engine_v2/scripts/learning-lab.mjs \
            --output-dir brain-learning-output \
            --repair-report brain-sandbox/health-output/repair-report.json \
            --historical-training brain-sandbox/historical-training.json \
            --native-summary brain-learning-input/native-reader-summary.json \
            --previous-state brain-learning-input/previous.json \
            --overrides provider-overrides.json
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          node engine_v2/tests/learning-lab-memory.test.mjs
          python -m py_compile scripts/run_brain_learning_sandbox.py scripts/build_brain_repair_proposal.py scripts/build_native_reader_learning_summary.py scripts/merge_native_reader_learning_failures.py scripts/classify_native_reader_ownership.py
          node -e "const x=require('./brain-learning-output/latest.json'); if(x.productionWritesAllowed!==false||x.publicationAllowed!==false||x.sandboxExecutedProviders!==true) process.exit(1)"
          node - <<'NODE'
          const fs=require('fs');
          const previous=JSON.parse(fs.readFileSync('brain-learning-input/previous.json','utf8'));
          const next=JSON.parse(fs.readFileSync('brain-learning-output/latest.json','utf8'));
          if (previous.nativeReaderRepairMemory && JSON.stringify(next.nativeReaderRepairMemory)!==JSON.stringify(previous.nativeReaderRepairMemory)) {
            throw new Error('native reader repair memory was not preserved across Brain sandbox learning');
          }
          const nativeSummary=JSON.parse(fs.readFileSync('brain-learning-input/native-reader-summary.json','utf8'));
          if ((nativeSummary.providerLearningFailures||0)>0 && !(next.proposals||[]).some(p => String(p.type||'').startsWith('native_reader_'))) {
            throw new Error('provider-owned reader failure memory did not produce a Brain learning/skill proposal');
          }
          if ((nativeSummary.nuvioVendorWaitFailures||0)>0 && (nativeSummary.nuvioVendorWait||[]).some(r => r.providerMutationAllowed!==false || r.deepRetryRequested!==false)) {
            throw new Error('Nuvio vendor-wait evidence escaped into provider mutation/deep retry');
          }
          NODE
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]' brain-learning-output/latest.json; then
            echo 'persistent Brain state contains forbidden raw endpoint/credential material' >&2
            exit 1
          fi

      - name: Materialize validated repair proposal as artifact only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_brain_repair_proposal.py \
            --stage staging/candidates.json \
            --repair-report brain-sandbox/health-output/repair-report.json \
            --overrides provider-overrides.json \
            --output brain-learning-output/provider-overrides.proposed.json \
            --summary brain-learning-output/repair-proposal.json
          node -e "const x=require('./brain-learning-output/repair-proposal.json'); if(x.policy?.publicationAllowed!==false||x.policy?.productionWritesAllowed!==false||x.policy?.pullRequestOnly!==true||x.policy?.requiresHumanMerge!==true) process.exit(1)"

      - name: Upload sanitized learning and proposal state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: niakvio-brain-learning-state
          path: |
            brain-learning-output/latest.json
            brain-learning-output/latest.md
            brain-learning-output/provider-overrides.proposed.json
            brain-learning-output/repair-proposal.json
            brain-learning-input/native-reader-summary.json
            brain-sandbox/targeted-probe-selection.json
            brain-sandbox/targeted-lab-summary.json
          retention-days: 14
          if-no-files-found: error

  publish-learning:
    name: LEARNING - Publish sanitized memory
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted production tree only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Download sanitized state produced by read-only sandbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: niakvio-brain-learning-state
          # The artifact contains both brain-learning-output/* and brain-learning-input/*.
          # Extract at repository root so the original relative paths are preserved.
          path: .

      - name: Validate artifact cannot publish production
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-learning-output/latest.json
          test -s brain-learning-output/latest.md
          node -e "const x=require('./brain-learning-output/latest.json'); if(x.productionWritesAllowed!==false||x.publicationAllowed!==false) process.exit(1)"
          if grep -Eiq 'https?://|authorization[=:]|cookie[=:]|token[=:]' brain-learning-output/latest.json; then
            echo 'refusing unsafe learning artifact' >&2
            exit 1
          fi

      - name: Update the single sanitized learning-memory ref
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="brain-learning/proposals"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH" main
          mkdir -p engine_v2/learning
          cp brain-learning-output/latest.json engine_v2/learning/latest.json
          cp brain-learning-output/latest.md engine_v2/learning/latest.md
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git add engine_v2/learning/latest.json engine_v2/learning/latest.md
          if git diff --cached --quiet; then
            echo "No sanitized Brain learning change this run."
          else
            git commit -m "brain: refresh sandbox repair learning"
            git push --force-with-lease origin HEAD:"$BRANCH"
          fi

  publish-repair-proposal:
    name: LEARNING - Open validated repair proposal PR
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_proposal == 'true')
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted production tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated Brain proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: niakvio-brain-learning-state
          path: .

      - name: Validate proposal is concrete and review-only
        id: proposal
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-learning-output/provider-overrides.proposed.json
          test -s brain-learning-output/repair-proposal.json
          python -m json.tool brain-learning-output/provider-overrides.proposed.json >/dev/null
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('brain-learning-output/repair-proposal.json','utf8'));
          if (x.policy?.publicationAllowed !== false ||
              x.policy?.productionWritesAllowed !== false ||
              x.policy?.pullRequestOnly !== true ||
              x.policy?.requiresHumanMerge !== true) {
            throw new Error('unsafe Brain proposal policy');
          }
          const count=Number(x.proposalCount||0);
          console.log('FIELD_BRAIN_PR_CANDIDATE proposals='+count+' provider='+Number(x.providerProposalCount||0)+' skills='+Number(x.learnedSkillProposalCount||0));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proposal_count='+count+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes='+(count>0?'true':'false')+'\n');
          NODE

      - name: Materialize only the validated configuration diff
        if: steps.proposal.outputs.has_changes == 'true'
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          cp brain-learning-output/provider-overrides.proposed.json provider-overrides.json
          python -m json.tool provider-overrides.json >/dev/null
          python tests/brain_repair_proposal_test.py
          python tests/overrides_test.py
          node engine_v2/tests/repair-brain.test.mjs
          node engine_v2/tests/recipe-memory.test.mjs
          if git diff --quiet -- provider-overrides.json; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "Brain produced proposal metadata but no production configuration diff."
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the single Brain repair PR
        if: steps.proposal.outputs.has_changes == 'true' && steps.materialize.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: brain-repair/proposal
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=brain-learning-output/repair-proposal.json
          git config user.name "niakvio-brain"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH" main
          git add provider-overrides.json
          git commit -m "brain: propose validated learning repairs"
          git push --force-with-lease origin HEAD:"$BRANCH"

          PROVIDER_COUNT="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String(x.providerProposalCount||0))")"
          SKILL_COUNT="$(node -e "const x=require('./$SUMMARY');process.stdout.write(String(x.learnedSkillProposalCount||0))")"
          PROVIDERS="$(node -e "const x=require('./$SUMMARY');process.stdout.write((x.providers||[]).join(', ')||'none')")"
          BODY="$(cat <<EOF
          Automated NiakVIO Brain learning proposal from the daily 92-provider sandbox.

          - Concrete provider repairs: ${PROVIDER_COUNT}
          - Validated learned-skill promotions: ${SKILL_COUNT}
          - Providers with concrete override changes: ${PROVIDERS}
          - Production writes from the Brain: disabled
          - Human merge: required
          - Fresh PR CI / provider gate: required

          The daily Learning run may explore broader hypotheses than routine Quick/Deep repair, including disabled providers. Only changes that were materialized from accepted sandbox evidence are included in this PR. Core/Brain ideas without a concrete validated code diff remain learning proposals and are not auto-written.
          EOF
          )"

          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "brain: validated daily learning proposal" --body "$BODY"
            echo "FIELD_BRAIN_PR action=refreshed pr=$EXISTING branch=$BRANCH"
          else
            URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "brain: validated daily learning proposal" --body "$BODY")"
            echo "FIELD_BRAIN_PR action=created url=$URL branch=$BRANCH"
          fi
