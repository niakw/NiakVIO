name: Temporary CodeQL triage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-codeql-triage.yml

permissions:
  contents: read
  security-events: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triage branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Export open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/code-scanning/alerts?state=open&per_page=100"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            | jq -r '.[] | [
                (.number|tostring),
                (.rule.security_severity_level // .rule.severity // "unknown"),
                .rule.id,
                .most_recent_instance.location.path,
                (.most_recent_instance.location.start_line|tostring),
                (.most_recent_instance.message.text // .rule.description // "")
              ] | @tsv'

      - name: Find narrative comment candidates
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE \
            --include='*.py' --include='*.js' --include='*.cjs' --include='*.mjs' --include='*.yml' --include='*.yaml' \
            '(^|[[:space:]])(#|//|/\*|\*)[^\n]*(Regression:|previously|previous |legacy [0-9]|temporary|formerly|ChatGPT|Copilot|TODO|FIXME|HACK)' \
            scripts tests engine_v2 .github/workflows || true
