# One-shot migration: prove the durable runtime-domain fixed point, commit it, then delete itself.
name: Core runtime domain invocation repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-runtime-domain-invocation-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize durable full-IIFE ownership and orphan cleanup
        shell: bash
        run: |
          set -euo pipefail
          # Disable the obsolete bootstraps for this migration process. The source
          # below is patched explicitly and becomes the only durable authority.
          rm -f sitecustomize.py scripts/sitecustomize.py
          python -S - <<'PY'
          from pathlib import Path

          core_path = Path('scripts/core_rebuild_safety.py')
          text = core_path.read_text(encoding='utf-8')

          scanner = r'''def _scan_runtime_domain_iife_end(text: str, start: int) -> int | None:
              """Own the complete ``(function(){...})(args)`` statement, not half of it."""
              if start < 0 or start >= len(text) or text[start] != "(":
                  return None

              def balanced(open_index: int) -> int | None:
                  if open_index < 0 or open_index >= len(text) or text[open_index] != "(":
                      return None
                  depth = 0
                  quote: str | None = None
                  escaped = False
                  line_comment = False
                  block_comment = False
                  index = open_index
                  while index < len(text):
                      char = text[index]
                      nxt = text[index + 1] if index + 1 < len(text) else ""
                      if line_comment:
                          if char in "\r\n": line_comment = False
                      elif block_comment:
                          if char == "*" and nxt == "/":
                              block_comment = False
                              index += 1
                      elif quote:
                          if escaped: escaped = False
                          elif char == "\\": escaped = True
                          elif char == quote: quote = None
                      else:
                          if char in ("'", '"', "`"): quote = char
                          elif char == "/" and nxt == "/":
                              line_comment = True
                              index += 1
                          elif char == "/" and nxt == "*":
                              block_comment = True
                              index += 1
                          elif char == "(": depth += 1
                          elif char == ")":
                              depth -= 1
                              if depth < 0: return None
                              if depth == 0: return index + 1
                      index += 1
                  return None

              expression_end = balanced(start)
              if expression_end is None:
                  return None
              call_start = expression_end
              while call_start < len(text) and text[call_start] in " \t\r\n":
                  call_start += 1
              if call_start >= len(text) or text[call_start] != "(":
                  return None
              end = balanced(call_start)
              if end is None:
                  return None
              while end < len(text) and text[end] in " \t": end += 1
              if end < len(text) and text[end] == ";": end += 1
              if text[end:end + 2] == "\r\n": end += 2
              elif text[end:end + 1] in ("\r", "\n"): end += 1
              return end'''

          start = text.index('def _scan_runtime_domain_iife_end(')
          end = text.index('\n\ndef _runtime_domain_wrapper_span_from_key(', start)
          text = text[:start] + scanner + text[end:]

          helper = r'''def _strip_runtime_domain_orphan_calls(text: str, rules: dict[str, str]) -> tuple[str, int]:
              """Delete only standalone historical invocation tails authorized by current rules."""
              if not rules:
                  return text, 0
              import base64
              decoder = json.JSONDecoder()
              needle = 'typeof globalThis!=="undefined"?globalThis:this,'
              cursor = search_at = removed = 0
              parts: list[str] = []

              def boundary(index: int) -> bool:
                  if index <= 0: return True
                  index -= 1
                  while index >= 0 and text[index] in " \t": index -= 1
                  return index < 0 or text[index] in ";}\r\n"

              def authorized(payload: object) -> bool:
                  if not isinstance(payload, list) or not payload: return False
                  for row in payload:
                      if not isinstance(row, list) or len(row) != 2: return False
                      old, new = row
                      if not isinstance(old, str) or not isinstance(new, str): return False
                      try:
                          decoded = base64.b64decode(old, validate=True).decode('utf-8').lower().strip().rstrip('/')
                      except Exception:
                          return False
                      if rules.get(decoded) != new.lower().strip().rstrip('/'):
                          return False
                  return True

              while True:
                  position = text.find(needle, search_at)
                  if position < 0: break
                  candidates: list[tuple[int, str]] = []
                  if position > 0 and text[position - 1] == "(" and boundary(position - 1):
                      candidates.append((position - 1, ");"))
                  if boundary(position):
                      candidates.append((position, ";"))
                  tail = text[position + len(needle):]
                  try:
                      payload, payload_end = decoder.raw_decode(tail)
                  except (TypeError, ValueError, json.JSONDecodeError):
                      payload, payload_end = None, 0
                  match = None
                  if authorized(payload):
                      remainder = tail[payload_end:]
                      for candidate_start, suffix in candidates:
                          if remainder.startswith(suffix):
                              match = (candidate_start, position + len(needle) + payload_end + len(suffix))
                              break
                  if match is None:
                      search_at = position + len(needle)
                      continue
                  orphan_start, orphan_end = match
                  parts.append(text[cursor:orphan_start])
                  cursor = search_at = orphan_end
                  removed += 1
              if not removed:
                  return text, 0
              parts.append(text[cursor:])
              return ''.join(parts), removed'''

          inject_anchor = '\n\ndef _inject_runtime_domain_overrides('
          helper_start = text.find('def _strip_runtime_domain_orphan_calls(')
          if helper_start >= 0:
              helper_end = text.index(inject_anchor, helper_start)
              text = text[:helper_start] + helper + text[helper_end:]
          else:
              text = text.replace(inject_anchor, '\n\n' + helper + inject_anchor, 1)

          old_order = '''    marker = "NUVIO_RUNTIME_DOMAIN_OVERRIDES_V1"\n    marker_comment = f"/* {marker} */"\n    spans = _runtime_domain_wrapper_spans(text)\n'''
          new_order = '''    marker = "NUVIO_RUNTIME_DOMAIN_OVERRIDES_V1"\n    marker_comment = f"/* {marker} */"\n    # Clean historical invocation-only debris before span discovery. Otherwise\n    # removing a prefix orphan after computing spans shifts insertion coordinates.\n    text, orphan_count = _strip_runtime_domain_orphan_calls(text, rules)\n    spans = _runtime_domain_wrapper_spans(text)\n'''
          if old_order in text:
              text = text.replace(old_order, new_order, 1)
          elif new_order not in text:
              raise SystemExit('runtime-domain span-order anchor missing')

          # Remove obsolete post-span cleanup variants from earlier attempts.
          for stale in (
              '    base, orphan_count = _strip_runtime_domain_orphan_calls(base, rules)\n',
              '    base, orphan_count = _strip_runtime_domain_orphan_calls(base, insertion, rules)\n',
              '    base, orphan_count = _strip_runtime_domain_orphan_calls(base, insertion, payload)\n',
          ):
              text = text.replace(stale, '')
          text = text.replace(
              '    if existing_span is not None and orphan_count == 0 and marker_comment in text[existing_span[0]:existing_span[1]]:\n',
              '    if existing_span is not None and marker_comment in text[existing_span[0]:existing_span[1]]:\n',
          )

          if text.count('def _strip_runtime_domain_orphan_calls(') != 1:
              raise SystemExit('orphan cleaner must exist exactly once')
          if text.count('_strip_runtime_domain_orphan_calls(text, rules)') != 1:
              raise SystemExit('orphan cleanup must run exactly once before span discovery')
          if '_strip_runtime_domain_orphan_calls(base' in text:
              raise SystemExit('post-span orphan cleanup remains')

          core_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/core_terminal_export_floor_test.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = 'def test_runtime_domain_duplicate_bootstraps_collapse_fail_closed() -> None:\n'
          name = 'test_runtime_domain_orphan_order_is_byte_stable'
          if f'def {name}()' not in test:
              regression = '''def test_runtime_domain_orphan_order_is_byte_stable() -> None:\n    import base64, json\n    rules = {"old.example": "new.example", "older.example": "new.example"}\n    provider = "const providerByte=1;function getStreams(){};module.exports=__provider;\\n"\n    canonical, _ = inject_domain_overrides(provider, rules)\n    for _ in range(5):\n        canonical2, _ = inject_domain_overrides(canonical, rules)\n        assert canonical2 == canonical\n\n    payload = json.dumps([[base64.b64encode(b"old.example").decode("ascii"), "new.example"]], separators=(",", ":"))\n    plain = f'typeof globalThis!=="undefined"?globalThis:this,{payload};'\n    wrapped = f'(typeof globalThis!=="undefined"?globalThis:this,{payload});'\n    for damaged in (plain + canonical, wrapped + canonical, plain + wrapped + canonical):\n        repaired, _ = inject_domain_overrides(damaged, rules)\n        assert repaired == canonical\n\n    markerless = canonical.replace("/* NUVIO_RUNTIME_DOMAIN_OVERRIDES_V1 */\\n", "", 1)\n    repaired, _ = inject_domain_overrides(markerless, rules)\n    assert repaired == canonical\n\n    foreign = plain.replace("new.example", "foreign.example")\n    foreign_out, _ = inject_domain_overrides(foreign + canonical, rules)\n    assert foreign in foreign_out\n    assert foreign_out.count("__nuvioDomainOverrideV1") == 1\n\n\n'''
              if anchor not in test: raise SystemExit('runtime-domain regression anchor missing')
              test = test.replace(anchor, regression + anchor, 1)
          call_anchor = '    test_runtime_domain_duplicate_bootstraps_collapse_fail_closed()\n'
          call = f'    {name}()\n'
          if call not in test:
              if call_anchor not in test: raise SystemExit('runtime-domain test runner anchor missing')
              test = test.replace(call_anchor, call + call_anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python -S -m py_compile scripts/core_rebuild_safety.py tests/core_terminal_export_floor_test.py
          python -S tests/core_terminal_export_floor_test.py
          python -S scripts/materialize_core_fixed_point_hardening.py
          python -S scripts/normalize_core_fixed_point_contract.py --apply
          python -S scripts/normalize_core_fixed_point_contract.py --check
          python -S tests/core_terminal_export_floor_test.py

      - name: Prove real portfolio converges before full Core
        shell: bash
        run: |
          set -euo pipefail
          python -S scripts/normalize_core_media_policy.py --apply
          python -S scripts/apply_runtime_capability_upgrade_v4.py
          python -S scripts/build_provider_runtime_profiles.py
          converged=0
          for pass in 1 2 3 4; do
            echo "FIELD_PREFLIGHT_FIXED_POINT pass=${pass}"
            python -S scripts/reapply_published_overrides.py
            if python -S scripts/reapply_published_overrides.py --check; then
              converged=1
              echo "FIELD_PREFLIGHT_FIXED_POINT converged_at=${pass}"
              break
            fi
          done
          test "$converged" = 1 || { echo 'preflight portfolio did not converge' >&2; exit 1; }

      - name: Publish durable repair and retire bootstraps
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- manifest.json vf/manifest.json provider_catalog.json provider-overrides.json sources.json automation 2>/dev/null || true
          git checkout -- providers 2>/dev/null || true
          rm -f sitecustomize.py scripts/sitecustomize.py
          git rm -f .github/workflows/core-runtime-domain-invocation-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/core_rebuild_safety.py tests/core_terminal_export_floor_test.py scripts/normalize_core_fixed_point_contract.py scripts/apply_provider_overrides.py
          git add -u sitecustomize.py scripts/sitecustomize.py || true
          git commit -m 'core: make runtime-domain publication byte-stable'
          git pull --rebase origin main
          git push origin HEAD:main
