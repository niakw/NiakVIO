name: Integrate adaptive domain revision v2

on:
  push:
    branches:
      - fix/adaptive-domain-revision-v2
    paths:
      - .github/triggers/integrate-adaptive-domain-revision-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply deterministic core/test migrations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Reapply owned adaptive-domain wrappers from their embedded config,
          # so implementation revisions migrate every referenced provider
          # without any provider-specific registry.
          p = Path('scripts/reapply_published_overrides.py')
          text = p.read_text()
          if 'ADAPTIVE_DOMAIN_SCRIPT' not in text:
              text = text.replace('import argparse\n', 'import argparse\nimport base64\n', 1)
              anchor = 'ADAPTIVE_SCRIPT = ROOT / "scripts" / "provider_patches" / "adaptive_runtime_recovery_v4.py"\n'
              extra = anchor + '''ADAPTIVE_DOMAIN_BEGIN = "/* NUVIO_ADAPTIVE_DOMAIN_RECOVERY_V1:BEGIN */"\nADAPTIVE_DOMAIN_END = "/* NUVIO_ADAPTIVE_DOMAIN_RECOVERY_V1:END */"\nADAPTIVE_DOMAIN_SCRIPT = ROOT / "scripts" / "provider_patches" / "adaptive_domain_recovery.py"\n'''
              if anchor not in text:
                  raise SystemExit('adaptive script anchor missing')
              text = text.replace(anchor, extra, 1)

              fn_anchor = '\ndef load_manifest(path: Path) -> dict[str, Any] | None:\n'
              fn = r'''

def reapply_adaptive_domain_revision(data: bytes) -> tuple[bytes, list[dict[str, Any]]]:
    """Refresh an owned adaptive-domain wrapper from its embedded peer groups."""
    text = data.decode("utf-8", errors="strict")
    start = text.find(ADAPTIVE_DOMAIN_BEGIN)
    if start < 0:
        return data, []
    end = text.find(ADAPTIVE_DOMAIN_END, start)
    if end < 0:
        raise ValueError("unterminated adaptive domain recovery wrapper")
    segment = text[start : end + len(ADAPTIVE_DOMAIN_END)]
    groups = None
    for encoded in re.findall(r'"([A-Za-z0-9+/=]{16,})"', segment):
        try:
            decoded = json.loads(base64.b64decode(encoded).decode("utf-8"))
        except Exception:
            continue
        candidate = decoded if isinstance(decoded, list) else decoded.get("groups") if isinstance(decoded, dict) else None
        if isinstance(candidate, list) and all(isinstance(row, dict) for row in candidate):
            groups = candidate
    if not groups:
        return data, []
    spec = importlib.util.spec_from_file_location("nuvio_reapply_adaptive_domain", ADAPTIVE_DOMAIN_SCRIPT)
    if spec is None or spec.loader is None:
        raise RuntimeError(f"cannot load adaptive domain patcher: {ADAPTIVE_DOMAIN_SCRIPT}")
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    patched = module.apply(text, options={"groups": groups}).encode("utf-8")
    if patched == data:
        return data, []
    return patched, [{
        "type": "migration",
        "name": "adaptive_domain_implementation_revision",
        "phase": "runtime",
        "profile": "adaptive_domain_recovery",
        "runtime_revision": str(getattr(module, "IMPLEMENTATION_REVISION", "current")),
    }]
'''
              if fn_anchor not in text:
                  raise SystemExit('load_manifest anchor missing')
              text = text.replace(fn_anchor, fn + fn_anchor, 1)

              call_anchor = '''        patched, records = apply_overrides(provider_id, migrated, phase="discovery")\n        provider_provenance = provenance_rows.get(provider_id) if provenance_rows else None\n'''
              call = '''        patched, records = apply_overrides(provider_id, migrated, phase="discovery")\n        patched, domain_revision_records = reapply_adaptive_domain_revision(patched)\n        if domain_revision_records:\n            records = list(records) + domain_revision_records\n        provider_provenance = provenance_rows.get(provider_id) if provenance_rows else None\n'''
              if call_anchor not in text:
                  raise SystemExit('reapply call anchor missing')
              text = text.replace(call_anchor, call, 1)
              text = text.replace('"runtime_revision": "bounded-binary-v1",', '"runtime_revision": "generic-core-v2",', 1)
              p.write_text(text)

          # Route-migration tests must derive the target from the current
          # repository config instead of pinning an obsolete Flemmix hostname.
          p = Path('tests/overrides_test.py')
          text = p.read_text()
          old = '''    source = b'const BASE="https://flemmix.me/";'\n    first, records = apply_overrides("flemmix", source)\n    assert b"https://flemmix.men/" in first\n    assert b"flemmix.menn" not in first\n'''
          new = '''    source = b'const BASE="https://flemmix.me/";'\n    config = json.loads((ROOT / "provider-overrides.json").read_text())\n    patch = config["provider_patches"]["flemmix"]\n    target_host = (patch.get("runtime_domain_replacements") or patch.get("replacements") or {}).get("flemmix.me")\n    assert target_host, patch\n    first, records = apply_overrides("flemmix", source)\n    assert ("https://" + target_host + "/").encode() in first\n    assert b"flemmix.menn" not in first\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'assert b"https://flemmix.men/" in first' in text:
              raise SystemExit('unexpected Flemmix prefix test shape')
          p.write_text(text)

          # Keep the published-wrapper migration under normal npm test.
          p = Path('package.json')
          data = json.loads(p.read_text())
          script = data['scripts']['test']
          anchor = 'python3 tests/adaptive_domain_recovery_test.py'
          addition = anchor + ' && python3 tests/reapply_adaptive_domain_revision_test.py'
          if 'reapply_adaptive_domain_revision_test.py' not in script:
              if anchor not in script:
                  raise SystemExit('adaptive domain test anchor missing')
              data['scripts']['test'] = script.replace(anchor, addition, 1)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Remove one-shot CI files from candidate
        run: |
          rm -f .github/workflows/integrate-adaptive-domain-revision-v2.yml
          rm -f .github/triggers/integrate-adaptive-domain-revision-v2
      - name: Prove both domain migrations first
        run: |
          python3 tests/adaptive_domain_recovery_test.py
          python3 tests/reapply_adaptive_domain_revision_test.py
      - name: Reapply published wrappers and run full repository regression
        run: npm test
      - name: Commit exact candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: refresh adaptive domain runtime wrappers"
      - name: Re-test clean committed candidate
        run: |
          candidate=$(git rev-parse HEAD)
          git worktree add --detach ../candidate "$candidate"
          cd ../candidate
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git diff --exit-code
      - name: Push validated branch only
        run: git push origin HEAD:fix/adaptive-domain-revision-v2
