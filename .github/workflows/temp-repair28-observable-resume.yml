name: TEMP - Repair 28 Observable Resume

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-repair28-observable-resume.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: niakvio-temp-repair28-observable-resume
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      NIAKVIO_QUICK_YIELD_TIMEOUT: '45'
      NIAKVIO_QUICK_YIELD_MAX_SAMPLES: '4'
      SOURCE_REPAIR_SHA: '4cc56e288a498e016ac5823e28089b3d333406ef'
      SOURCE_RUN_ID: '35401694913'
      SOURCE_ARTIFACT_ID: '10570987798'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prove Repair 28 checkpoint compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          echo "checkpoint-compatibility" > automation/provider-repair28-observable-current-stage.txt
          git cat-file -e "${SOURCE_REPAIR_SHA}^{commit}"
          git diff --exit-code "${SOURCE_REPAIR_SHA}..HEAD" --             manifest.json             provider-overrides.json             automation/provider-v3-static-knowledge.json             scripts/provider_base_store.py             scripts/recover_provider_routes_from_upstreams.py             scripts/apply_provider_route_recovery_report.py             scripts/enforce_route_proof_manifest_policy_v1.py
          python tests/provider_execution_route_sanitizer_scope_test.py
          echo "FIELD_REPAIR28_OBSERVABLE_INPUTS source_sha=${SOURCE_REPAIR_SHA} current_sha=${GITHUB_SHA} provider_inputs_unchanged=true"

      - name: Install declared provider parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore exact Repair 28 post-apply checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "restore-checkpoint" > automation/provider-repair28-observable-current-stage.txt
          rm -rf /tmp/repair28 /tmp/repair28.zip
          mkdir -p /tmp/repair28
          curl --fail --location --retry 3             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"             -o /tmp/repair28.zip
          unzip -q /tmp/repair28.zip -d /tmp/repair28
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/repair28')
          targeted=json.loads((root/'automation/provider-route-recovery-v6-targeted.json').read_text())
          merged=json.loads((root/'automation/provider-route-recovery-v6.json').read_text())
          knowledge=json.loads((root/'automation/provider-v3-static-knowledge.json').read_text())
          baseline=json.loads((root/'automation/provider-repair-portfolio-baseline.json').read_text())
          assert targeted.get('providerCount') == 33, targeted.get('providerCount')
          assert targeted.get('providersWithProvenRoutes') == 25, targeted.get('providersWithProvenRoutes')
          assert merged.get('providerCount') == 44, merged.get('providerCount')
          assert (merged.get('applied') or {}).get('patchedProviders') == 44, merged.get('applied')
          assert len(knowledge.get('providers') or {}) == 46
          assert baseline.get('provider_count') == 46
          print(
              'FIELD_REPAIR28_OBSERVABLE_CHECKPOINT '
              f"baseline={baseline.get('verified_provider_count')} targeted=33 "
              "targeted_proven=25 merged=44 knowledge=46"
          )
          PY
          cp /tmp/repair28/provider-overrides.json provider-overrides.json
          cp /tmp/repair28/automation/provider-v3-static-knowledge.json automation/provider-v3-static-knowledge.json
          cp /tmp/repair28/automation/provider-route-recovery-v6-targeted.json automation/provider-route-recovery-v6-targeted.json
          cp /tmp/repair28/automation/provider-route-recovery-v6.json automation/provider-route-recovery-v6.json
          cp /tmp/repair28/automation/provider-repair-portfolio-baseline.json automation/provider-repair-portfolio-baseline.json

      - name: Resume policy, migrations and rematerialization
        shell: bash
        run: |
          set -euo pipefail
          run_stage() {
            local name="$1"; shift
            echo "$name" > automation/provider-repair28-observable-current-stage.txt
            echo "=== STAGE: $name ===" | tee -a automation/provider-repair28-observable.log
            "$@" 2>&1 | tee -a automation/provider-repair28-observable.log
          }
          run_stage route-proof-policy python scripts/enforce_route_proof_manifest_policy_v1.py             --report automation/provider-route-recovery-v6.json             --manifest manifest.json             --overrides provider-overrides.json
          run_stage execution-route-sanitizer python scripts/sanitize_provider_v3_execution_routes_v1.py
          run_stage provider-base-v3-store python scripts/materialize_provider_base_v3_store.py
          run_stage materialize-all python scripts/materialize_provider_v3_all.py
          run_stage language-projections python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          run_stage published-config python scripts/validate_published_provider_config.py
          run_stage lego-ownership python tests/provider_js_lego_ownership_test.py
          run_stage presentation-v34 python tests/manual_tv_live_regressions_v34_test.py
          run_stage global-stream-output python tests/global_stream_output_guard_test.py
          run_stage episodic-identity python tests/episodic_identity_runtime_test.py
          run_stage episodic-year python tests/episodic_year_identity_regression_test.py
          run_stage media-type-pre-network python tests/global_media_type_pre_network_gate_test.py
          run_stage media-type-resolution python tests/global_media_type_resolution_test.py
          run_stage native-dual-id python tests/native_dual_id_identity_test.py
          run_stage global-presentation python tests/global_stream_presentation_test.py
          run_stage global-presentation-pipeline python tests/global_stream_presentation_pipeline_test.py
          echo "pre-census-complete" > automation/provider-repair28-observable-current-stage.txt

      - name: Run authoritative post-repair candidate census
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate-census" > automation/provider-repair28-observable-current-stage.txt
          python scripts/audit_provider_quick_yield.py | tee automation/provider-repair28-observable-quick-yield.log
          cp provider-v3-quick-yield.json automation/provider-repair-portfolio-candidate.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base=json.loads(Path('automation/provider-repair-portfolio-baseline.json').read_text())
          cand=json.loads(Path('automation/provider-repair-portfolio-candidate.json').read_text())
          b=set(base.get('verified_providers') or [])
          c=set(cand.get('verified_providers') or [])
          summary={
            'schemaVersion': 2,
            'runId': int(os.environ['GITHUB_RUN_ID']),
            'triggerSha': os.environ['GITHUB_SHA'],
            'sourceRunId': 35401694913,
            'sourceSha': '4cc56e288a498e016ac5823e28089b3d333406ef',
            'providerCount': int(cand.get('provider_count') or 0),
            'baselineVerifiedCount': len(b),
            'candidateVerifiedCount': len(c),
            'gainedProviders': sorted(c-b),
            'lostProviders': sorted(b-c),
            'candidateVerifiedProviders': sorted(c),
            'acceptanceTarget': 35,
            'acceptanceReached': len(c) >= 35,
          }
          out=Path(f"automation/provider-repair28-observable-{os.environ['GITHUB_RUN_ID']}.json")
          out.write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          Path('automation/provider-repair28-observable-latest.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True)+'\n'
          )
          print('FIELD_REPAIR28_OBSERVABLE_CANDIDATE '+json.dumps(summary,sort_keys=True))
          PY
          python scripts/compare_quick_yield_preservation.py             --baseline automation/provider-repair-portfolio-baseline.json             --candidate automation/provider-repair-portfolio-candidate.json             --losses-output automation/provider-repair-portfolio-losses.json || true
          echo "candidate-census-complete" > automation/provider-repair28-observable-current-stage.txt

      - name: Persist observable result on main
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          stage="$(cat automation/provider-repair28-observable-current-stage.txt 2>/dev/null || echo unknown)"
          if [ ! -f "automation/provider-repair28-observable-${GITHUB_RUN_ID}.json" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          stage=Path('automation/provider-repair28-observable-current-stage.txt').read_text().strip() if Path('automation/provider-repair28-observable-current-stage.txt').exists() else 'unknown'
          payload={
            'schemaVersion': 2,
            'runId': int(os.environ['GITHUB_RUN_ID']),
            'triggerSha': os.environ['GITHUB_SHA'],
            'sourceRunId': 35401694913,
            'sourceSha': '4cc56e288a498e016ac5823e28089b3d333406ef',
            'jobStatus': os.environ.get('JOB_STATUS','unknown'),
            'failedOrLastStage': stage,
            'candidateVerifiedCount': None,
            'acceptanceTarget': 35,
            'acceptanceReached': False,
          }
          Path(f"automation/provider-repair28-observable-{os.environ['GITHUB_RUN_ID']}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True)+'\n'
          )
          Path('automation/provider-repair28-observable-latest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True)+'\n'
          )
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "automation/provider-repair28-observable-${GITHUB_RUN_ID}.json"                   automation/provider-repair28-observable-latest.json
          if [ -f automation/provider-repair28-observable.log ]; then
            git add automation/provider-repair28-observable.log
          fi
          if [ -f automation/provider-repair28-observable-quick-yield.log ]; then
            git add automation/provider-repair28-observable-quick-yield.log
          fi
          if git diff --cached --quiet; then
            echo "No observable evidence to persist"
            exit 0
          fi
          candidate="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(f"automation/provider-repair28-observable-{os.environ['GITHUB_RUN_ID']}.json")
          d=json.loads(p.read_text())
          print('na' if d.get('candidateVerifiedCount') is None else d.get('candidateVerifiedCount'))
          PY
          )"
          git commit -m "ci(repair): persist Repair28 observable ${candidate}/46"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
