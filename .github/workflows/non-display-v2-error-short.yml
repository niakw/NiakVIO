name: DIAG - Non-Display V2 Worker Errors
on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/non-display-v2-error-short.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize V2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_non_display_recovery_v1.py
          for provider in animesama-co neko-sama sekai voiranime-rip; do python3 scripts/materialize_provider_v3_one.py "$provider"; done
      - name: Capture worker details
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v3 as v3
          cases=[('animesama-co','anime','45950'),('neko-sama','anime','65930'),('sekai','anime','65930'),('voiranime-rip','anime','120089')]
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text())
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog()
          for pid,lane,tmdb in cases:
            fx=fixtures[(lane,tmdb)]
            r=v3._worker_raw(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
            safe={k:r.get(k) for k in ('ok','stream_count','raw_stream_count','timeout','error_class','error_details','provider_server_accessible','provider_server_successful_response','provider_server_http_statuses')}
            safe['routes']=[{k:o.get(k) for k in ('stage','method','host','path_pattern','status','ok','error_code') if o.get(k) is not None} for o in r.get('network_observations') or [] if isinstance(o,dict) and not o.get('infrastructure')]
            print('V2_WORKER_ERROR '+pid+' '+json.dumps(safe,sort_keys=True))
          PY
