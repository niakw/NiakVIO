name: Temporary apply TV alias and ToFlix fix

on:
  push:
    branches:
      - agent/tv-regression-5.20.38

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/tv-regression-5.20.38
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply durable migration
        run: |
          python scripts/tmp_migrate_tv_alias_toflix.py
          python scripts/reapply_published_overrides.py
          python scripts/validate_published_overrides.py
      - name: Full repository regression suite
        run: npm test
      - name: Commit proven durable output
        run: |
          rm -f scripts/tmp_migrate_tv_alias_toflix.py
          rm -f scripts/tmp_tv_animated_movie_matrix.py
          rm -f .github/workflows/tmp-tv-animated-movie-proof.yml
          rm -f .github/workflows/tmp-apply-tv-alias-toflix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve localized TV catalogue aliases and ToFlix VF'
          git push origin HEAD:agent/tv-regression-5.20.38
