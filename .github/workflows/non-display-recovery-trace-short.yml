name: DIAG - Five Remaining Non-Display Routes

on:
  push:
    branches: ['fix/non-display-recovery-20260916']
    paths: ['.github/workflows/non-display-recovery-trace-short.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize candidate six
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_non_display_recovery_v1.py
          for provider in animesama-co animevostfr coflix neko-sama sekai voiranime-rip; do python3 scripts/materialize_provider_v3_one.py "$provider"; done
      - name: Trace five remaining routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('.').resolve();sys.path.insert(0,str(root/'scripts'))
          import run_provider_upstream_parity as p
          import run_provider_upstream_parity_v3 as v3
          cases=[('animesama-co','anime','45950'),('coflix','movie','10195'),('neko-sama','anime','65930'),('sekai','anime','65930'),('voiranime-rip','anime','120089')]
          corpus=json.loads((root/'.github/triggers/rotating-popular-corpus.json').read_text())
          fixtures={(str(l),str(r.get('tmdbId') or '')):r for l,rows in (corpus.get('lists') or {}).items() for r in rows or [] if isinstance(r,dict)}
          local=p.local_catalog(); out=[]
          for pid,lane,tmdb in cases:
            fx=fixtures[(lane,tmdb)]
            raw=v3._worker_raw(local[pid]['path'],v3.fixture_payload(fx,lane,upstream=False),25)
            row={'providerId':pid,'fixture':fx['slug'],'stream_count':raw.get('stream_count'),'raw_stream_count':raw.get('raw_stream_count'),'error':raw.get('error_details'),'timeout':raw.get('timeout'),'routes':[]}
            for o in raw.get('network_observations') or []:
              if isinstance(o,dict) and not o.get('infrastructure'):
                row['routes'].append({k:o.get(k) for k in ('stage','method','host','path_pattern','status','ok','error_code') if o.get(k) is not None})
            out.append(row);print('FIVE_ROUTE_TRACE '+json.dumps(row,sort_keys=True))
          pathlib.Path('automation/five-remaining-route-trace.json').write_text(json.dumps({'rows':out},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: five-remaining-route-trace-${{ github.run_id }}
          path: automation/five-remaining-route-trace.json
          retention-days: 14
