name: Temporary priority sequence reporter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-priority-reporter-once.yml"

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Remove reporter from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-priority-reporter-once.yml
          git commit -m 'chore: remove priority reporter one-shot [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish exact recent priority run state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SYNC="$(gh run list --workflow sync.yml --branch main --event workflow_dispatch --limit 6 --json databaseId,status,conclusion,createdAt,headSha)"
          BRAIN="$(gh run list --workflow brain-learning-lab.yml --branch main --event workflow_dispatch --limit 4 --json databaseId,status,conclusion,createdAt,headSha)"
          BODY="PRIORITY_SEQUENCE_STATUS sync=${SYNC} brain=${BRAIN}"
          gh issue comment 69 --body "$BODY"
