name: Debug Desktop Purstream orchestration bisect

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-orchestration-bisect.yml"

permissions:
  contents: read

jobs:
  orchestration-bisect:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage orchestration variants
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("niakvio")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          row=next(r for r in manifest["scrapers"] if str(r.get("id","")).lower()=="purstream")
          text=(root/row["filename"]).read_text(encoding="utf-8")
          tv=text.find("/* NUVIO_PURSTREAM_TV_IDENTITY_V3:")
          if tv<0:
              raise SystemExit("Purstream TV identity marker missing")
          floor=text[:tv].rstrip()+"\n"
          literal='https://free.finepulfe.xyz/movies/157336-unr8i/master.m3u8'

          def emit(name, body):
              Path(name).write_text(floor+"\n"+body+"\n",encoding="utf-8")

          sentinel=lambda expr,label: f'''
          module.exports.getStreams=function(){{
            return ({expr}).then(function(value){{
              return [{{url:"{literal}",name:"{label}:"+String(value&&value.enName||value&&value.fr||value&&value.id||value||"ok"),title:"{label}"}}];
            }});
          }};
          globalThis.getStreams=module.exports.getStreams;
          '''

          emit("purstream-orch-10-tmdb-details.js",
               sentinel('getTmdbDetails("157336","movie")',"tmdb_details"))
          emit("purstream-orch-20-tmdb-search-meta.js",
               sentinel('getTmdbSearchMeta("157336","movie")',"tmdb_search_meta"))
          emit("purstream-orch-30-parallel-tmdb.js", f'''
          module.exports.getStreams=function(){{
            return Promise.all([getTmdbDetails("157336","movie"),getTmdbSearchMeta("157336","movie")]).then(function(v){{
              return [{{url:"{literal}",name:"parallel:"+String(v[0]&&v[0].enName||"")+"|"+String(v[1]&&v[1].fr||""),title:"parallel"}}];
            }});
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')
          emit("purstream-orch-40-sequential-mx.js", f'''
          module.exports.getStreams=function(){{
            applyPurstreamDomain({{api:"https://api.purstream.mx/api/v1",referer:"https://purstream.mx/"}});
            var meta;
            return getTmdbDetails("157336","movie")
              .then(function(v){{meta=v;return getTmdbSearchMeta("157336","movie")}})
              .then(function(search){{return findPurstreamIdByTitle(search.fr,"movie",search.year)}})
              .then(function(id){{return fetchMovieSources(id)}})
              .then(function(rows){{return normalizeMovieSources(rows||[],meta)}});
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')
          emit("purstream-orch-50-sequential-failover.js", f'''
          module.exports.getStreams=function(){{
            applyPurstreamDomain({{api:"https://api.purstream.id/api/v1",referer:"https://purstream.id/"}});
            var meta;
            return getTmdbDetails("157336","movie")
              .then(function(v){{meta=v;return getTmdbSearchMeta("157336","movie")}})
              .then(function(search){{return findPurstreamIdByTitle(search.fr,"movie",search.year)}})
              .then(function(id){{return fetchMovieSources(id)}})
              .then(function(rows){{return normalizeMovieSources(rows||[],meta)}});
          }};
          globalThis.getStreams=module.exports.getStreams;
          ''')
          Path("purstream-orch-90-original-floor.js").write_text(floor,encoding="utf-8")
          Path("purstream-orch-99-full.js").write_text(text,encoding="utf-8")
          print("FIELD_PURSTREAM_ORCH_STAGE path="+row["filename"]+" floor_chars="+str(len(floor)))
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install orchestration bisect test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamOrchestrationBisectTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withTimeoutOrNull
          import kotlin.test.Test

          class NiakvioPurstreamOrchestrationBisectTest {
              @Test
              fun interstellarStages() = runBlocking {
                  val workspace=File(System.getenv("GITHUB_WORKSPACE"))
                  val variants=listOf(
                      "tmdb_details" to "purstream-orch-10-tmdb-details.js",
                      "tmdb_search_meta" to "purstream-orch-20-tmdb-search-meta.js",
                      "parallel_tmdb" to "purstream-orch-30-parallel-tmdb.js",
                      "sequential_mx" to "purstream-orch-40-sequential-mx.js",
                      "sequential_failover" to "purstream-orch-50-sequential-failover.js",
                      "original_floor" to "purstream-orch-90-original-floor.js",
                      "full" to "purstream-orch-99-full.js",
                  )
                  val report=File(workspace,"purstream-orchestration-bisect.txt")
                  report.writeText("")
                  for((label,file) in variants){
                      val started=System.currentTimeMillis()
                      val rows=withTimeoutOrNull(40_000L) {
                          PluginRuntime.executePlugin(
                              code=File(workspace,file).readText(),
                              tmdbId="157336",
                              mediaType="movie",
                              season=null,
                              episode=null,
                              scraperId="PURSTREAM",
                          )
                      }
                      val first=rows?.firstOrNull()
                      val line="FIELD_PURSTREAM_ORCH_BISECT label="+label+
                          " status="+(if(rows==null)"timeout" else "completed")+
                          " count="+(rows?.size ?: -1)+
                          " duration_ms="+(System.currentTimeMillis()-started)+
                          " firstUrl="+(first?.url?:"")+
                          " firstName="+(first?.name?:"")
                      println(line)
                      report.appendText(line+"\n")
                  }
              }
          }
          KOTLIN

      - name: Execute orchestration bisect
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamOrchestrationBisectTest'             --no-build-cache --no-configuration-cache --console=plain
          cat "$GITHUB_WORKSPACE/purstream-orchestration-bisect.txt"
