name: TEMP - Hub Authority Repair V61

on:
  push:
    branches:
      - fix/non-display-recovery-20260916
    paths:
      - .github/workflows/temp-hub-authority-v61.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply permanent V61 patches
        run: |
          python scripts/apply_hub_authority_v61_patch.py
          python scripts/apply_targeted_materializer_security_v61.py

      - name: Validate permanent contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/resolve_provider_hubs.py scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_static_authority.py scripts/validate_domain_refresh_static_non_destructive.py scripts/provider_patches/flemmix_current_runtime_v1.py scripts/materialize_provider_v3_one.py
          python tests/provider_hub_registry_test.py
          python tests/domain_refresh_static_authority_test.py
          python tests/domain_refresh_static_non_destructive_test.py
          python tests/flemmix_runtime_domain_authority_test.py
          python tests/provider_v3_one_security_finalization_test.py
          python tests/domain_refresh_non_destructive_workflow_test.py
          python tests/domain_refresh_workflow_test.py

      - name: Snapshot static authority
        run: cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static-before.json"

      - name: Resolve live Flemmix hub
        run: |
          set -euo pipefail
          mkdir -p health-output automation/evidence
          python scripts/domain_refresh_priority_wrapper.py --mode deep --include-disabled --workers 1 --timeout 12 --provider flemmix --apply --output health-output/v61-flemmix-hub-report.json --changes-output health-output/v61-flemmix-changes.json
          python scripts/validate_flemmix_hub_v61_state.py
          python scripts/reconcile_domain_refresh_static_authority.py --changes health-output/v61-flemmix-changes.json --check
          python scripts/validate_domain_refresh_static_non_destructive.py --before-static "$RUNNER_TEMP/static-before.json" --changes health-output/v61-flemmix-changes.json
          python scripts/validate_provider_domain_graph.py provider-overrides.json

      - name: Rematerialize Flemmix only
        run: |
          set -euo pipefail
          python scripts/materialize_provider_v3_one.py flemmix
          python scripts/reconcile_domain_refresh_provenance.py --changes health-output/v61-flemmix-changes.json
          python scripts/validate_published_provider_config.py --expected 46
          python scripts/finalize_provider_v3_minimizer.py --check
          python tests/flemmix_runtime_domain_authority_test.py
          python tests/provider_domain_graph_cycle_test.py

      - name: Probe live Flemmix runtime
        run: python scripts/probe_flemmix_runtime_v61.py

      - name: Persist V61 repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'NiakVIO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/resolve_provider_hubs.py scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_static_authority.py scripts/validate_domain_refresh_static_non_destructive.py scripts/provider_patches/flemmix_current_runtime_v1.py scripts/materialize_provider_v3_one.py scripts/apply_hub_authority_v61_patch.py scripts/apply_targeted_materializer_security_v61.py scripts/validate_flemmix_hub_v61_state.py scripts/probe_flemmix_runtime_v61.py tests/provider_hub_registry_test.py tests/domain_refresh_static_authority_test.py tests/domain_refresh_static_non_destructive_test.py tests/flemmix_runtime_domain_authority_test.py tests/provider_v3_one_security_finalization_test.py tests/domain_refresh_non_destructive_workflow_test.py .github/workflows/domain-refresh.yml provider-overrides.json provider-hubs.json provider-domain-history.json automation/provider-v3-static-knowledge.json manifest.json provider-v3-materialization.json PROVENANCE.json providers/ automation/evidence/flemmix-hub-authority-v61.json automation/evidence/flemmix-runtime-v61.json
          git diff --cached --quiet && { echo 'V61 no changes to persist'; exit 1; }
          git commit -m 'fix(domains): make authoritative hubs monotonic'
          git pull --rebase origin fix/non-display-recovery-20260916
          git push origin HEAD:fix/non-display-recovery-20260916
          echo "V61_PERSISTED $(git rev-parse HEAD)"
