name: TEMP - Hub Authority Repair V61

on:
  push:
    branches:
      - fix/non-display-recovery-20260916
    paths:
      - .github/workflows/temp-hub-authority-v61.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/non-display-recovery-20260916
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate persisted V61 contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/resolve_provider_hubs.py scripts/domain_refresh_transaction_v2.py scripts/reconcile_domain_refresh_static_authority.py scripts/validate_domain_refresh_static_non_destructive.py scripts/reconcile_domain_refresh_provenance.py scripts/provider_patches/flemmix_current_runtime_v1.py scripts/materialize_provider_v3_one.py
          python tests/provider_hub_registry_test.py
          python tests/domain_refresh_static_authority_test.py
          python tests/domain_refresh_static_non_destructive_test.py
          python tests/domain_refresh_provenance_minimizer_test.py
          python tests/flemmix_runtime_domain_authority_test.py
          python tests/provider_v3_one_security_finalization_test.py
          python tests/provider_v3_final_stage_minimizer_gate_test.py
          python tests/domain_refresh_non_destructive_workflow_test.py
          python tests/domain_refresh_workflow_test.py
          python tests/provider_domain_graph_cycle_test.py
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          python scripts/validate_published_provider_config.py --expected 46
          python scripts/finalize_provider_v3_minimizer.py --check
          python scripts/audit_provider_v3_static.py

      - name: Verify persisted Flemmix authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          overrides=json.load(open('provider-overrides.json'))['provider_patches']['flemmix']
          hubs=json.load(open('provider-hubs.json'))['providers']['flemmix']
          static=json.load(open('automation/provider-v3-static-knowledge.json'))['providers']['flemmix']['model']
          manifest=json.load(open('manifest.json'))
          row=next(x for x in manifest['scrapers'] if str(x.get('id','')).casefold()=='flemmix')
          expected='https://flemmix.party'
          assert str(overrides.get('official_site','')).rstrip('/')==expected, overrides.get('official_site')
          assert str(hubs.get('direct','')).rstrip('/')==expected, hubs.get('direct')
          assert str(static.get('officialSite','')).rstrip('/')==expected, static.get('officialSite')
          assert str(static.get('knownSite','')).rstrip('/')==expected, static.get('knownSite')
          assert str(row.get('filename','')).startswith('providers/flemmix--nuvio--'), row.get('filename')
          assert Path(row['filename']).is_file(), row['filename']
          print('V61_PERSISTED_AUTHORITY_OK',expected,row['filename'])
          PY
          python scripts/probe_flemmix_runtime_v61.py

      - name: Verify live Domain Refresh idempotence
        run: |
          set -euo pipefail
          mkdir -p health-output/v61-fixed-point
          cp provider-overrides.json "$RUNNER_TEMP/overrides.before.json"
          cp provider-hubs.json "$RUNNER_TEMP/hubs.before.json"
          cp automation/provider-v3-static-knowledge.json "$RUNNER_TEMP/static.before.json"
          python scripts/domain_refresh_priority_wrapper.py --mode deep --include-disabled --workers 1 --timeout 12 --provider flemmix --apply --output health-output/v61-fixed-point/report.json --changes-output health-output/v61-fixed-point/changes.json
          python - <<'PY'
          import json
          changes=json.load(open('health-output/v61-fixed-point/changes.json'))
          changed=changes.get('changed') or []
          registry=changes.get('registry_changed') or []
          assert not changed, changes
          assert not registry, changes
          print('V61_DOMAIN_REFRESH_FIXED_POINT changed=0 registry=0')
          PY
          python scripts/finalize_provider_v3_minimizer.py --check
          python scripts/validate_provider_domain_graph.py provider-overrides.json
          git diff --exit-code -- provider-overrides.json provider-hubs.json automation/provider-v3-static-knowledge.json manifest.json provider-v3-materialization.json PROVENANCE.json providers/
