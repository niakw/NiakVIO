name: Temporary regenerate release hashes

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/tmp-regenerate-release-hashes"

permissions:
  contents: write

concurrency:
  group: tmp-regenerate-release-hashes
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate and validate release hashes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py

      - name: Commit regenerated inventories
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.json FILE-HASHES.json PATCH-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Release hash inventories are already current."
            exit 0
          fi
          git commit -m "chore: regenerate release hash inventories"
          git push origin HEAD:main
