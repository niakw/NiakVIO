name: Materialize Core contracts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-core-contracts-once.yml'

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize durable Core contracts only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_provider_rebuild_safety.py --apply
          python3 scripts/normalize_core_fixed_point_contract.py --apply
          python3 scripts/normalize_provider_branding_pipeline.py --apply
          python3 scripts/normalize_core_media_policy.py --apply

      - name: Verify materialized contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_provider_rebuild_safety.py --check
          python3 scripts/normalize_core_fixed_point_contract.py --check
          python3 scripts/normalize_provider_branding_pipeline.py --check
          python3 scripts/normalize_core_media_policy.py --check
          python3 tests/provider_purification_contract_test.py
          python3 tests/core_terminal_export_floor_test.py
          python3 tests/provider_wrapper_isolation_test.py
          python3 tests/global_playback_integrity_policy_test.py
          python3 tests/provider_branding_contract_test.py

      - name: Publish Core contract materialization without starting full CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-core-contracts-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No Core contract changes required.'
            exit 0
          fi
          git commit -m 'chore: materialize durable Core contracts [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "Durable Core contracts materialized on main ${SHA} without rebuilding providers and with push CI skipped. Fixed-point normalizers + purification/export/branding contracts passed. One-shot removed itself."
