name: SEC - Final Gate
# Final main validation marker: exact-SHA hardening + CodeQL.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact SHA required for dispatched final security gate
        required: false
        default: ""
        type: string
  # Run after the CodeQL result for the exact main SHA is known.
  workflow_run:
    workflows: ["SEC - CodeQL"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-final-gate.yml'
      - '.github/workflows/codeql.yml'
      - 'FILE-HASHES.json'
      - 'PATCH-SHA256SUMS.txt'
      - 'SHA256SUMS.json'
      - 'manifest.json'
      - 'vf/manifest.json'
      - 'provider_catalog.json'
      - 'scripts/current_provider_scope.py'
      - 'provider-overrides.json'
      - 'provider-security-revocations.json'
      - 'provider-bases/**'
      - 'providers/**'
      - 'scripts/provider_security_hardening.py'
      - 'scripts/provider_base_store.py'
      - 'scripts/add_provider.py'
      - 'scripts/probe_provider_runtime_parity.py'
      - 'scripts/provider_patches/global_provider_security_hardening_v1.py'
      - 'scripts/normalize_core_media_policy.py'
      - 'scripts/normalize_published_security_finalization.py'
      - 'scripts/reapply_published_overrides.py'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/harden_staged_provider_security.py'
      - 'scripts/provider_byte_stability.py'
      - 'scripts/provider_patches/runtime_capability_media_safety_v4.py'
      - 'tests/provider_security_hardening_test.py'
      - 'tests/provider_byte_stability_contract_test.py'
      - 'tests/core_media_policy_test.py'
      - 'tests/runtime_capability_media_safety_v4_test.py'
      - 'tests/native_corpus_device_lab_test.py'
      - 'tests/workflow_security_policy_test.py'
      - 'tests/provider_tmdb_runtime_key_contract_test.py'
      - 'tests/provider_html_filter_security_test.py'
      - 'tests/provider_bulk_spa_route_discovery_test.py'

permissions:
  contents: read
  actions: read
  security-events: read
  issues: write

concurrency:
  # Exact release-certification dispatches must never be cancelled by a later
  # push-triggered Final Gate on main. Automated runs remain latest-wins.
  group: niakvio-final-provider-security-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  security:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require expected dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA" || {
            echo "FIELD_SECURITY_FINAL_EXPECTED_SHA_MISMATCH expected=$EXPECTED_SHA actual=$GITHUB_SHA" >&2
            exit 1
          }
          echo "FIELD_SECURITY_FINAL_EXPECTED_SHA_OK sha=$GITHUB_SHA"

      - name: Announce issue 69 security gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Global hardening + exhaustive published-provider scan + exact-SHA CodeQL + all High/Critical alerts."

      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate global hardening implementation
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_security_hardening_test.py
          python tests/provider_byte_stability_contract_test.py
          python tests/core_media_policy_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/native_corpus_device_lab_test.py
          python tests/workflow_security_policy_test.py
          python tests/provider_tmdb_runtime_key_contract_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/provider_bulk_spa_route_discovery_test.py
          python scripts/normalize_published_security_finalization.py --check

      - name: Scan all published providers for known unsafe shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('.')
          sys.path.insert(0, str((root/'scripts').resolve()))
          from provider_security_hardening import known_unsafe_findings
          from current_provider_scope import projection_visible_provider_rows
          failures=[]
          visible_rows=projection_visible_provider_rows()
          rows=[row for row in visible_rows if str(row.get('filename') or '').strip()]
          if not rows:
              failures.append(('catalogue', 'empty_provider_catalogue', 'global+france'))
          if len(rows) != len(visible_rows):
              failures.append(('catalogue', f'missing_filename:{len(visible_rows)-len(rows)}', 'global+france'))
          ids=[str(row.get('id') or '').strip().casefold().replace('_','-') for row in rows]
          if any(not provider_id for provider_id in ids):
              failures.append(('catalogue', 'missing_provider_id', 'global+france'))
          if len(set(ids)) != len(ids):
              failures.append(('catalogue', 'duplicate_provider_id', 'global+france'))
          expected=len(rows)
          checked=0
          for row in rows:
              rel=str(row.get('filename') or '')
              path=root/rel
              if not path.is_file():
                  failures.append((str(row.get('id')), 'missing_bundle', rel))
                  continue
              findings=known_unsafe_findings(path.read_text(encoding='utf-8', errors='strict'))
              checked+=1
              if findings:
                  failures.append((str(row.get('id')), ','.join(sorted(set(findings))), rel))
          if checked != expected:
              failures.append(('catalogue', f'incomplete_scan:{checked}/{expected}', 'global+france'))
          if failures:
              for item in failures:
                  print('UNSAFE_PROVIDER=' + '|'.join(item))
              raise SystemExit(f'known unsafe provider shapes or incomplete catalogue scan remain: {len(failures)}')
          print(f'FIELD_PUBLISHED_PROVIDER_SECURITY_SCAN checked={checked} expected={expected} unsafe=0 authority=global+france')
          PY

      # An early CodeQL analysis (e.g. Actions) is NOT the complete five-job
      # matrix. A push-triggered gate must not inspect stale open alerts while
      # the matching legacy/category reconciliation is still uploading.
      - name: Wait for complete CodeQL workflow on exact tested main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=missing
          for attempt in $(seq 1 90); do
            state="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq ".workflow_runs | map(select(.name == \"SEC - CodeQL\" and .head_sha == \"${GITHUB_SHA}\")) | sort_by(.created_at) | last | if . == null then \"missing\" else .status + \":\" + (.conclusion // \"none\") end")"
            if [ "$state" = "completed:success" ]; then
              echo "FIELD_CODEQL_FULL_WORKFLOW state=completed:success sha=${GITHUB_SHA}"
              break
            fi
            if [[ "$state" == completed:* ]]; then
              echo "FIELD_CODEQL_FULL_WORKFLOW state=$state sha=${GITHUB_SHA}" >&2
              exit 1
            fi
            sleep 20
          done
          if [ "$state" != "completed:success" ]; then
            echo "CodeQL full workflow not completed successfully on exact tested SHA: $state" >&2
            exit 1
          fi

      - name: Wait for CodeQL analysis of exact tested main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 90); do
            found="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs/heads/main&per_page=100" \
              --jq ".[] | select(.commit_sha == \"${GITHUB_SHA}\") | .id" | head -n1 || true)"
            if [ -n "$found" ]; then
              echo "FIELD_CODEQL_EXACT_SHA analysis=$found sha=${GITHUB_SHA}"
              break
            fi
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "No CodeQL analysis found for exact tested main SHA ${GITHUB_SHA}" >&2
            exit 1
          fi

      # Release scope: active Global+France projection/provenance references only; historical immutable artifacts remain visible to CodeQL.
      - name: Gate release-reachable high and critical CodeQL alerts on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" \
            --slurp > "$RUNNER_TEMP/codeql-open.json"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from current_provider_scope import projection_active_provider_rows
          pages=json.loads(Path(os.environ['RUNNER_TEMP']+'/codeql-open.json').read_text())
          alerts=[row for page in pages for row in (page if isinstance(page,list) else []) if isinstance(row,dict)]

          active_rows=projection_active_provider_rows()
          active_ids={
              str(row.get('id') or '').strip().casefold().replace('_','-')
              for row in active_rows
              if isinstance(row,dict) and str(row.get('id') or '').strip()
          }
          active_provider_paths={
              str(row.get('filename') or '').strip()
              for row in active_rows
              if isinstance(row,dict) and str(row.get('filename') or '').startswith('providers/')
          }

          active_base_paths=set()
          provenance_path=Path('PROVENANCE.json')
          if provenance_path.is_file():
              provenance=json.loads(provenance_path.read_text(encoding='utf-8'))
              for provider_id, provider_row in (provenance.get('providers') or {}).items():
                  if not isinstance(provider_row,dict):
                      continue
                  canonical_id=str(provider_id or '').strip().casefold().replace('_','-')
                  if canonical_id not in active_ids:
                      continue
                  base=str(provider_row.get('base_filename') or '')
                  published=str(provider_row.get('published_filename') or '')
                  if base.startswith('provider-bases/'):
                      active_base_paths.add(base)
                  if published.startswith('providers/'):
                      active_provider_paths.add(published)

          revocation_path=Path('provider-security-revocations.json')
          revocations=json.loads(revocation_path.read_text()) if revocation_path.is_file() else {'entries':[]}
          revoked={
              str(item.get('path') or '')
              for item in (revocations.get('entries') or [])
              if isinstance(item,dict) and str(item.get('path') or '')
          }
          bad=[]
          provider_bad=[]
          stale_revoked=[]
          for row in alerts:
              rule=row.get('rule') or {}
              severity=str(rule.get('security_severity_level') or rule.get('severity') or '').lower()
              instance=row.get('most_recent_instance') or {}
              # Open-alert inventory is historical. The release gate is for the
              # exact CodeQL analysis that just succeeded on this SHA, so stale
              # instances from older commits/categories must not block current
              # publication merely because their path still exists.
              if str(instance.get('commit_sha') or '') != os.environ.get('GITHUB_SHA',''):
                  continue
              location=instance.get('location') or {}
              path=str(location.get('path') or '')
              if severity not in {'high','critical'}:
                  continue
              item={
                  'number': row.get('number'),
                  'rule': rule.get('id') or rule.get('name'),
                  'severity': severity,
                  'path': path,
              }
              current_path=Path(path) if path else None
              if path.startswith('providers/') and path not in active_provider_paths:
                  continue
              if path.startswith('provider-bases/') and path not in active_base_paths:
                  continue
              # Defensive stale-alert compatibility: maintained CodeQL excludes
              # disabled/archive lifecycle snapshots, and any historical alert still
              # reported by GitHub is not a release-reachable provider/base reference.
              if path.startswith(('provider-disabled/','provider-old/')):
                  continue
              if current_path is not None and current_path.is_file():
                  bad.append(item)
                  if path.startswith(('providers/','provider-bases/')):
                      provider_bad.append(item)
                  continue
              if path in revoked:
                  stale_revoked.append(item)
                  continue
              bad.append({**item,'reason':'missing_from_current_tree_without_explicit_security_revocation'})
          print(
              f'FIELD_CODEQL_ALERTS open={len(alerts)} current_high_or_critical={len(bad)} '
              f'current_provider_high_or_critical={len(provider_bad)} stale_revoked={len(stale_revoked)}'
          )
          for row in stale_revoked:
              print('STALE_REVOKED_HIGH_ALERT=' + json.dumps(row, sort_keys=True))
          for row in bad:
              print('OPEN_CURRENT_HIGH_ALERT=' + json.dumps(row, sort_keys=True))
          if bad:
              raise SystemExit('release-reachable or unrevoked high/critical CodeQL alerts remain on tested main tree')
          PY

      - name: Report issue 69 security success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate SUCCEEDED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Global hardening contract, exhaustive published-provider scan, exact-SHA CodeQL and release-reachable High/Critical gate is green."

      - name: Report issue 69 security failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Inspect this run before any unrelated validation."