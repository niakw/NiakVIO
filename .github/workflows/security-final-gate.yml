name: NiakVIO final provider security gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-final-gate.yml'
      - 'FILE-HASHES.json'
      - 'PATCH-SHA256SUMS.txt'
      - 'SHA256SUMS.json'
      - 'manifest.json'
      - 'provider-overrides.json'
      - 'providers/**'
      - 'scripts/provider_security_hardening.py'
      - 'scripts/provider_patches/global_provider_security_hardening_v1.py'
      - 'scripts/normalize_core_media_policy.py'
      - 'scripts/normalize_published_security_finalization.py'
      - 'scripts/reapply_published_overrides.py'
      - 'scripts/apply_provider_overrides.py'
      - 'scripts/harden_staged_provider_security.py'
      - 'scripts/provider_purification.py'
      - 'scripts/provider_patches/runtime_capability_media_safety_v4.py'
      - 'tests/provider_security_hardening_test.py'
      - 'tests/provider_purification_contract_test.py'
      - 'tests/core_media_policy_test.py'
      - 'tests/runtime_capability_media_safety_v4_test.py'
      - 'tests/native_corpus_device_lab_test.py'

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: niakvio-final-provider-security-main
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Announce issue 69 security gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Global hardening + exact 92-provider scan + exact-SHA CodeQL + all High/Critical alerts."

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate global hardening implementation
        shell: bash
        run: |
          set -euo pipefail
          python tests/provider_security_hardening_test.py
          python tests/provider_purification_contract_test.py
          python tests/core_media_policy_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/native_corpus_device_lab_test.py
          python scripts/normalize_published_security_finalization.py --check

      - name: Scan exactly 92 published providers for known unsafe shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('.')
          sys.path.insert(0, str((root/'scripts').resolve()))
          from provider_security_hardening import known_unsafe_findings
          manifest=json.loads((root/'manifest.json').read_text())
          failures=[]
          rows=[row for row in (manifest.get('scrapers') or []) if isinstance(row,dict) and str(row.get('filename') or '').strip()]
          if len(rows) != 92:
              failures.append(('catalogue', f'unexpected_count:{len(rows)}', 'manifest.json'))
          checked=0
          for row in rows:
              rel=str(row.get('filename') or '')
              path=root/rel
              if not path.is_file():
                  failures.append((str(row.get('id')), 'missing_bundle', rel))
                  continue
              findings=known_unsafe_findings(path.read_text(encoding='utf-8', errors='strict'))
              checked+=1
              if findings:
                  failures.append((str(row.get('id')), ','.join(sorted(set(findings))), rel))
          if checked != len(rows):
              failures.append(('catalogue', f'incomplete_scan:{checked}/{len(rows)}', 'manifest.json'))
          if failures:
              for item in failures:
                  print('UNSAFE_PROVIDER=' + '|'.join(item))
              raise SystemExit(f'known unsafe provider shapes or incomplete catalogue scan remain: {len(failures)}')
          print(f'FIELD_PUBLISHED_PROVIDER_SECURITY_SCAN checked={checked} expected=92 unsafe=0')
          PY

      - name: Wait for CodeQL analysis of exact tested main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 90); do
            found="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs/heads/main&per_page=100" \
              --jq ".[] | select(.commit_sha == \"${GITHUB_SHA}\") | .id" | head -n1 || true)"
            if [ -n "$found" ]; then
              echo "FIELD_CODEQL_EXACT_SHA analysis=$found sha=${GITHUB_SHA}"
              break
            fi
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "No CodeQL analysis found for exact tested main SHA ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Gate open high and critical CodeQL alerts on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" \
            --slurp > "$RUNNER_TEMP/codeql-open.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.loads(Path(os.environ['RUNNER_TEMP']+'/codeql-open.json').read_text())
          alerts=[row for page in pages for row in (page if isinstance(page,list) else []) if isinstance(row,dict)]
          bad=[]
          provider_bad=[]
          for row in alerts:
              rule=row.get('rule') or {}
              severity=str(rule.get('security_severity_level') or rule.get('severity') or '').lower()
              instance=row.get('most_recent_instance') or {}
              location=instance.get('location') or {}
              path=str(location.get('path') or '')
              if severity in {'high','critical'}:
                  item={
                      'number': row.get('number'),
                      'rule': rule.get('id') or rule.get('name'),
                      'severity': severity,
                      'path': path,
                  }
                  bad.append(item)
                  if path.startswith('providers/'):
                      provider_bad.append(item)
          print(f'FIELD_CODEQL_ALERTS open={len(alerts)} high_or_critical={len(bad)} high_or_critical_provider={len(provider_bad)}')
          for row in bad:
              print('OPEN_HIGH_ALERT=' + json.dumps(row, sort_keys=True))
          if bad:
              raise SystemExit('open high/critical CodeQL alerts remain on main')
          PY

      - name: Report issue 69 security success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate SUCCEEDED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Global hardening contract, exact 92-provider scan, exact-SHA CodeQL and repository-wide High/Critical gate are green."

      - name: Report issue 69 security failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 69 --repo "$GITHUB_REPOSITORY" --body "#69 security gate FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on ${GITHUB_SHA}. Inspect this run before any unrelated validation."
