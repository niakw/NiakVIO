name: TMP - V29 Fast Targeted Diag

on:
  pull_request:
    branches:
      - tmp/v29-fast-base
      - tmp/v29b-fast-base
  workflow_dispatch:

permissions:
  contents: read

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  NIAKVIO_TRACE_RESPONSE_SHAPE: '1'
  NUVIO_PROVIDER_V3_CONTEXT: workspace

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.base_ref || 'fix/provider-activation-certification-v1' }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preflight
        run: |
          set -euo pipefail
          python3 tests/anikototv_runtime_v3_server_selector_test.py
          python3 tests/provider_patch_quickjs_compat_test.py
          python3 tests/provider_base_absolute_route_domain_substitution_test.py
          python3 tests/materializer_authority_monotonic_v25_test.py
          node --check scripts/nuvio_tv_probe_tmdb_ci.cjs

      - name: Materialize only AniKoto and 4KHDHub
        run: |
          set -euo pipefail
          mkdir -p health-output
          python3 scripts/materialize_provider_v3_one.py anikototv
          python3 scripts/materialize_provider_v3_one.py 4khdhub
          cp manifest.json health-output/manifest-v29.json

      - name: Certify two providers
        run: |
          set -euo pipefail
          python3 scripts/certify_provider_playable_lanes.py \
            --manifest manifest.json \
            --include-disabled \
            --provider anikototv \
            --provider 4khdhub \
            --candidate-limit 2 \
            --timeout 30 \
            --workers 2 \
            --seed "v29-fast-${GITHUB_RUN_ID}" \
            --output health-output/v29-certification.json

      - name: Print diagnosis
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('health-output/v29-certification.json').read_text())
          for row in p.get('providers') or []:
              print('FIELD_V29_PROVIDER',row.get('providerId'),'certified='+str(bool(row.get('certified'))).lower())
              for lane,lane_row in (row.get('lanes') or {}).items():
                  for a in (lane_row or {}).get('attempts') or []:
                      print('FIELD_V29_ATTEMPT',row.get('providerId'),lane,
                            'fixture='+str(a.get('fixtureSlug')),
                            'status='+str(a.get('status')),
                            'stage='+str(a.get('debugStage')),
                            'trace='+json.dumps(a.get('providerTrace') or [],separators=(',',':')),
                            'network='+json.dumps(a.get('networkTrace') or [],separators=(',',':')))
          PY

      - name: Upload V29 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v29-fast-${{ github.run_id }}
          path: health-output/
          retention-days: 8
          if-no-files-found: warn
