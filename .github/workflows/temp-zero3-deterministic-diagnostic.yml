name: TEMP - ZERO3 deterministic diagnostic

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-zero3-deterministic-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect DATA, local/upstream execution and manual endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, tempfile, urllib.request, urllib.error
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import run_provider_upstream_parity as p

          ids=['moviebox','vidlove','anikototv']
          ov=json.loads(Path('provider-overrides.json').read_text())
          sk=json.loads(Path('automation/provider-v3-static-knowledge.json').read_text())
          patches=ov.get('provider_patches') or {}
          sprows=sk.get('providers') or {}
          keep=['capability','official_hub','official_site','official_api','manifest_overrides','notes','route_data_state','route_proof_version','learned_routes','candidate_learned_routes','api_recipe','candidate_api_recipe','provider_lego_scripts','provider_lego_options','repair_disposition']
          for pid in ids:
              patch=patches.get(pid) or {}
              model=((sprows.get(pid) or {}).get('model') or {})
              summary={k:patch.get(k) for k in keep if k in patch}
              summary['staticModel']={k:model.get(k) for k in ['strategy','knownSite','officialSite','officialHub','officialApi','routes','apiRecipe','routeProofVersion','sourceRuntimeFamily'] if k in model}
              print('ZERO3_DATA '+pid+' '+json.dumps(summary,ensure_ascii=False,separators=(',',':')))

          fixtures={
              'moviebox':{'slug':'house-of-the-dragon-2022-s01e01','tmdbId':'94997','mediaType':'tv','title':'House of the Dragon','year':2022,'season':1,'episode':1},
              'vidlove':{'slug':'interstellar-2014','tmdbId':'157336','mediaType':'movie','title':'Interstellar','year':2014},
              'anikototv':{'slug':'death-note-2006-s01e01','tmdbId':'13916','mediaType':'anime','category':'anime','title':'Death Note','year':2006,'season':1,'episode':1},
          }
          local=p.local_catalog()
          for pid,f in fixtures.items():
              r=p.run_worker(local[pid]['path'],f,45)
              print('ZERO3_LOCAL '+pid+' '+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          upstream_urls={pid:f'https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/refs/heads/main/providers/{pid}.js' for pid in ids}
          with tempfile.TemporaryDirectory(prefix='zero3-upstream-') as td:
              td=Path(td)
              for pid,url in upstream_urls.items():
                  path=td/(pid+'.js')
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'NiakVIO-ZERO3/1'})
                      with urllib.request.urlopen(req,timeout=20) as resp: path.write_bytes(resp.read())
                      f=dict(fixtures[pid])
                      if f.get('mediaType')=='anime':
                          f['mediaType']='tv'; f['type']='tv'; f.pop('category',None)
                      r=p.run_worker(path,f,45)
                      print('ZERO3_UPSTREAM '+pid+' '+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  except Exception as exc:
                      print('ZERO3_UPSTREAM '+pid+' '+json.dumps({'error':type(exc).__name__+': '+str(exc)[:180]},separators=(',',':')))

          def shape(value,depth=0):
              if depth>3: return type(value).__name__
              if isinstance(value,dict): return {str(k):shape(v,depth+1) for k,v in list(value.items())[:30]}
              if isinstance(value,list): return {'type':'list','len':len(value),'sample':shape(value[0],depth+1) if value else None}
              if isinstance(value,str):
                  low=value.lower()
                  if low.startswith('http://') or low.startswith('https://'): return '<url>'
                  return value[:100]
              return value

          def probe(label,url,method='GET',body=None,headers=None):
              h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36','Accept':'application/json,text/html,*/*'}
              h.update(headers or {})
              data=body.encode() if isinstance(body,str) else body
              req=urllib.request.Request(url,data=data,method=method,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      raw=resp.read(2*1024*1024)
                      ct=resp.headers.get('content-type','')
                      text=raw.decode('utf-8','replace')
                      try: parsed=json.loads(text); out={'status':resp.status,'contentType':ct,'bytes':len(raw),'jsonShape':shape(parsed)}
                      except Exception: out={'status':resp.status,'contentType':ct,'bytes':len(raw),'prefix':text[:220].replace('\n',' ')}
              except urllib.error.HTTPError as exc:
                  raw=exc.read(65536); out={'status':exc.code,'contentType':exc.headers.get('content-type',''),'bytes':len(raw),'prefix':raw.decode('utf-8','replace')[:220].replace('\n',' '),'cfMitigated':exc.headers.get('cf-mitigated')}
              except Exception as exc:
                  out={'error':type(exc).__name__+': '+str(exc)[:180]}
              print('ZERO3_PROBE '+label+' '+json.dumps(out,ensure_ascii=False,separators=(',',':')))

          probe('moviebox_site_search','https://moviebox.yachts/?s=house+of+the+dragon')
          probe('moviebox_vidsrc_api','https://data.vidsrcme.ru/api.php?type=tv&tmdb=94997&season=1&episode=1')
          probe('vidlove_moviebox','https://ballerinacappuccinalovestungtungtungsahur.com/movie?id=157336&mode=json&sources=moviebox&hevc=1',headers={'Origin':'https://player.vidlove.cc','Referer':'https://player.vidlove.cc/'})
          probe('vidlove_ipcloud','https://ballerinacappuccinalovestungtungtungsahur.com/movie?id=157336&mode=json&sources=ipcloud&hevc=1',headers={'Origin':'https://player.vidlove.cc','Referer':'https://player.vidlove.cc/'})
          probe('anikoto_search','https://anikototv.to/ajax/anime/search?keyword=death+note',headers={'X-Requested-With':'XMLHttpRequest','Referer':'https://anikototv.to/'})
          probe('anikoto_episode','https://anikototv.to/watch/death-note-fc8mq/ep-1',headers={'Referer':'https://anikototv.to/'})
          PY
