name: TEMP - Reconcile Current State 20260916

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-reconcile-current-state-20260916.yml'

permissions:
  contents: write

concurrency:
  group: temp-reconcile-current-state-20260916
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Scrub current tracked privacy wording and close completed ledger items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          memory = Path('MEMORY.md')
          lines = memory.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if line.startswith('- Repository privacy audit found '):
                  out.append('- Repository privacy audit found no tracked-content occurrence of user-specific personal identifiers in the scanned categories. Git **commit author metadata** does contain a personal author identity/email on some commits; do not rewrite history while immutable SHAs/current Labs depend on it. Any history scrub must be a later dedicated repin/republication migration.')
              else:
                  out.append(line)
          memory.write_text('\n'.join(out) + '\n', encoding='utf-8')

          tasks = Path('automation/OPEN-TASKS-20260911.md')
          lines = tasks.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if line.startswith('- [ ] `MEMORY.md` top/current checkpoint must describe'):
                  out.append('- [x] `MEMORY.md` now carries an authoritative 2026-09-16 checkpoint covering 5.21.48, PR #120, immutable Hub-46 transport, CodeQL #889, prebuild caches and the current Native runs while retaining older material as history.')
              elif line.startswith('- [ ] `CHANGELOG.md` needs a 5.21.48 entry'):
                  out.append('- [x] `CHANGELOG.md` now starts with the 5.21.48 Hub-46/publication/native-Lab checkpoint.')
              elif line.startswith('- [ ] `provider_catalog.json` metadata names must be synchronized'):
                  out.append('- [x] `provider_catalog.json` visible names are synchronized to 5.21.48, and `sync_release_versions.py` plus its regression test now keep catalogue names/version aligned.')
              elif line.startswith('- [ ] Provider Non-Regression push policy must target `main`'):
                  out.append('- [x] Provider Non-Regression push policy targets `main`; its compatibility contract was aligned and passed.')
              elif line.startswith('- [ ] Remove unreferenced one-shot scripts `scripts/temp_apply_hub46_native_scope.py`'):
                  out.append('- [x] Obsolete one-shot Hub-46/rotating-corpus migration scripts were confirmed unreferenced and removed.')
              elif line.startswith('- [x] Tracked-content searches found no occurrence of '):
                  out.append('- [x] Tracked-content searches found no user-specific personal identifiers in the scanned categories; current documentation uses only generic privacy wording.')
              else:
                  out.append(line)
          tasks.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Verify current tree contains only generic privacy wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          memory = Path('MEMORY.md').read_text(encoding='utf-8')
          tasks = Path('automation/OPEN-TASKS-20260911.md').read_text(encoding='utf-8')
          assert 'Repository privacy audit found no tracked-content occurrence of user-specific personal identifiers' in memory
          assert 'Tracked-content searches found no user-specific personal identifiers' in tasks
          assert 'CHANGELOG.md` now starts with the 5.21.48' in tasks
          assert 'Provider Non-Regression push policy targets `main`' in tasks
          print('CURRENT_TREE_PRIVACY_WORDING_OK generic_only=true')
          PY

      - name: Commit sanitized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MEMORY.md automation/OPEN-TASKS-20260911.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No sanitization changes to commit.'
            exit 0
          fi
          git commit -m 'docs(privacy): keep repository audit wording generic'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
