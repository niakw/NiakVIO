name: CORE - Provider Catalog Media Types

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/labs-*'
    paths:
      - 'scripts/reconcile_provider_catalog_media_types.py'
      - '.github/workflows/provider-catalog-media-types.yml'

permissions:
  contents: write

concurrency:
  group: provider-catalog-media-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reconcile Hub46 semantics and transport across release projections
        run: python scripts/reconcile_provider_catalog_media_types.py --apply
      - name: Validate canonical projection after reconciliation
        run: python tests/canonical_media_types_test.py
      - name: Commit bounded media-type reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo 'PROVIDER_CATALOG_MEDIA_TYPES_NOOP true'
            exit 0
          fi
          for path in "${CHANGED[@]}"; do
            case "$path" in
              provider_catalog.json|manifest.json|vf/manifest.json|no-anime/manifest.json|vf-no-anime/manifest.json) ;;
              *)
                echo "Unexpected reconciliation path: $path" >&2
                exit 1
                ;;
            esac
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider_catalog.json manifest.json vf/manifest.json no-anime/manifest.json vf-no-anime/manifest.json
          git commit -m 'fix(catalog): align Hub46 canonical media types'
          git push origin HEAD:${{ github.ref_name }}
