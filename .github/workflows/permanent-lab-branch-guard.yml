name: Guard permanent real-client lab branches

on:
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: permanent-lab-branch-guard
  cancel-in-progress: false

jobs:
  restore-permanent-labs:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore permanent lab branch if missing
        env:
          EVENT_NAME: ${{ github.event_name }}
          DELETED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open('automation/permanent-lab-branches.json', 'r', encoding='utf-8') as fh:
              config = json.load(fh)

          branches = config.get('branches', {})
          event_name = os.environ.get('EVENT_NAME', '')
          deleted_ref = os.environ.get('DELETED_REF', '')

          if event_name == 'delete' and deleted_ref not in branches:
              print(f'Ignoring deletion of non-reserved branch: {deleted_ref}')
              raise SystemExit(0)

          targets = [deleted_ref] if event_name == 'delete' else list(branches)

          for branch in targets:
              if not branch:
                  continue
              exists = subprocess.run(
                  ['git', 'ls-remote', '--exit-code', '--heads', 'origin', f'refs/heads/{branch}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if exists:
                  print(f'{branch}: present; nothing to do')
                  continue

              wanted = branches[branch].get('final_verified_sha')
              if not wanted:
                  wanted = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
                  print(f'{branch}: no final verified SHA recorded yet; restoring from main {wanted}')
              else:
                  subprocess.run(['git', 'cat-file', '-e', f'{wanted}^{{commit}}'], check=True)
                  print(f'{branch}: restoring verified snapshot {wanted}')

              subprocess.run(
                  ['git', 'push', 'origin', f'{wanted}:refs/heads/{branch}'],
                  check=True,
              )
          PY
