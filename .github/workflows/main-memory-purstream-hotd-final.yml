name: MAIN - Purstream HOTD Final Memory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-memory-purstream-hotd-final.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Persist Purstream HOTD final-proof requirement
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; from pathlib import Path; p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8'); marker='## 2026-09-07 — Purstream HOTD S3E1 final proof requirement'; b=base64.b64decode('').decode('utf-8'); p.write_text(t.rstrip()+('\\n\\n'+b.strip()+'\\n' if marker not in t else '\\n'),encoding='utf-8')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MEMORY.md
          git commit -m 'docs: checkpoint Purstream HOTD S3E1 final proof' || true
          rm -f .github/workflows/main-memory-purstream-hotd-final.yml
          git add -A
          git commit -m 'ci: remove Purstream HOTD memory workflow' || true
          git push origin HEAD:main
