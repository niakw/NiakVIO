name: Debug Desktop Purstream unmask error

on:
  push:
    branches:
      - debug/desktop-zero-stream-bisect
    paths:
      - ".github/workflows/debug-desktop-purstream-unmask-error.yml"

permissions:
  contents: read

jobs:
  unmask:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout NiakVIO debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Stage Purstream and unmask swallowed error
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.load(open("manifest.json",encoding="utf-8"))
          row=next(r for r in data["scrapers"] if str(r.get("id","")).lower()=="purstream")
          src=Path(row["filename"]).read_text(encoding="utf-8")
          # Replace ONLY the terminal getStreams catch that swallows the whole provider pipeline.
          pats=[
            r'\["catch"\]\(function\(\)\{return\[\]\}\)',
            r"\['catch'\]\(function\(\)\{return\[\];?\}\)"
          ]
          changed=0
          for pat in pats:
            src,n=re.subn(pat,'["catch"](function(error){var msg=error&&error.message?String(error.message):String(error);return[{url:"https://example.invalid/niakvio-debug.mp4",name:"FIELD_PURSTREAM_JS_ERROR:"+msg,title:"FIELD_PURSTREAM_JS_ERROR:"+msg,description:error&&error.stack?String(error.stack):""}]})',src,count=1)
            if n:
              changed+=n
              break
          if changed!=1:
            raise SystemExit(f"terminal catch replacement count={changed}")
          Path("purstream-unmasked.js").write_text(src,encoding="utf-8")
          print("FIELD_PURSTREAM_UNMASK_STAGED path="+row["filename"])
          PY

      - name: Checkout official NuvioDesktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioDesktop.git nuvio-desktop
          git -C nuvio-desktop checkout 182c0587c991c3fd0138155ef66fa23cc09d5f0b
          touch nuvio-desktop/local.properties

      - name: Install focused failure test
        shell: bash
        run: |
          set -euxo pipefail
          target="nuvio-desktop/composeApp/src/desktopTest/kotlin/com/nuvio/app/features/plugins/NiakvioPurstreamUnmaskErrorTest.kt"
          cat > "$target" <<'KOTLIN'
          package com.nuvio.app.features.plugins

          import com.nuvio.app.features.plugins.runtime.PluginRuntime
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlin.test.Test

          class NiakvioPurstreamUnmaskErrorTest {
              @Test
              fun interstellarUnmasked() = runBlocking {
                  val workspace = File(System.getenv("GITHUB_WORKSPACE"))
                  try {
                      val rows = PluginRuntime.executePlugin(
                          code = File(workspace, "purstream-unmasked.js").readText(),
                          tmdbId = "157336",
                          mediaType = "movie",
                          season = null,
                          episode = null,
                          scraperId = "PURSTREAM",
                      )
                      println("FIELD_PURSTREAM_UNMASK_RESULT count=" + rows.size + " firstName=" + (rows.firstOrNull()?.name ?: "") + " firstTitle=" + (rows.firstOrNull()?.title ?: ""))
                  } catch (t: Throwable) {
                      println("FIELD_PURSTREAM_UNMASK_ERROR type=" + (t::class.qualifiedName ?: t::class.simpleName ?: "Throwable") + " message=" + (t.message ?: "").replace("\n"," "))
                      t.printStackTrace()
                      throw t
                  }
              }
          }
          KOTLIN

      - name: Execute unmasked Purstream
        shell: bash
        run: |
          set -euxo pipefail
          ./nuvio-desktop/gradlew -p nuvio-desktop             :composeApp:desktopTest             --tests 'com.nuvio.app.features.plugins.NiakvioPurstreamUnmaskErrorTest'             --no-build-cache --no-configuration-cache --console=plain
