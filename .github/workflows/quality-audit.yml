name: Audit provider quality and compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - deep

permissions:
  contents: read

concurrency:
  group: nuvio-provider-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install runtime dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi

      - name: Audit provider address sources without changing published routes
        shell: bash
        run: |
          python scripts/resolve_provider_hubs.py \
            --mode "${{ github.event.inputs.mode || 'quick' }}" \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --output health-output/provider-hub-report.json

      - name: Discover all non-P2P candidates with upstream fallbacks
        run: python scripts/discover_candidates.py --require-all-upstreams

      - name: Run advisory audit with bounded runtime repair
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          if [ "$MODE" = "deep" ]; then
            python scripts/deep_repair_loop.py --stage staging --output health-output --mode deep
            python scripts/validate_override_pipeline.py --stage staging
          else
            NUVIO_HEALTH_OUTPUT=health-output node scripts/health_check.mjs "--${MODE}"
            printf '%s\n' '{"schema_version":1,"mode":"quick","provider_specific_rules":false,"rounds":[],"accepted_repairs":0}' > health-output/repair-report.json
          fi

      - name: Lock final advisory artifacts
        run: |
          sudo chown -R root:root staging health-output
          sudo chmod -R a-w staging health-output

      - name: Upload advisory audit result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvio-quality-audit-${{ github.run_id }}
          path: |
            health-output/health-results.json
            health-output/repair-report.json
            health-output/provider-hub-report.json
          retention-days: 14
          if-no-files-found: error
