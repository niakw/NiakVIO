name: DIAG - HOTD Kehflix targeted repair

on:
  push:
    paths:
      - '.github/workflows/kehflix-hotd-targeted.yml'

permissions:
  contents: read

jobs:
  hotd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUVIO_PROVIDER_V3_CONTEXT: workspace
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare current Core and signed-player runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepatch_identity_cleanup_shared_owner_v1.py
          python scripts/apply_core_identity_ownership_cleanup.py
          python scripts/upgrade_provider_v3_source_plan_v5.py
          python scripts/upgrade_kehflix_terminal_domain_v1.py
          python scripts/upgrade_signed_player_api_v1.py
          python -m py_compile scripts/upgrade_kehflix_terminal_domain_v1.py scripts/upgrade_signed_player_api_v1.py
          python scripts/provider_base_store.py validate
      - name: Materialize only Kehflix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_provider_v3_one.py kehflix
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('manifest.json'))
          row=next(r for r in m['scrapers'] if str(r.get('id','')).casefold()=='kehflix')
          path=Path(row['filename'])
          assert path.is_file(), path
          text=path.read_text(encoding='utf-8')
          assert 'NIAKVIO_SIGNED_PLAYER_API_RUNTIME_V1' in text
          assert '"officialSite":"https://kehflix.wiki"' in text
          assert '/title/tv/{id}-{slug}' in text
          assert '/api/streams/episode?id&season&episode&k' in text
          print('KEHFLIX_TARGETED_MATERIALIZED file='+row['filename'])
          PY
      - name: Real HOTD S3E1 - Kehflix plus Purstream
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hotd_s3e1_live_probe.py --output automation/hotd-s3e1-targeted.json --timeout 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hotd-kehflix-targeted-${{ github.run_id }}
          path: |
            automation/hotd-s3e1-targeted.json
            manifest.json
            provider-overrides.json
          retention-days: 7
          if-no-files-found: warn
