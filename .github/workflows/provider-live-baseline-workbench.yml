name: WORKBENCH - Provider Live Baseline

on:
  push:
    branches:
      - workbench/systemic-recovery-20260909
    paths:
      - '.github/workflows/provider-live-baseline-workbench.yml'
      - 'automation/provider-live-baseline-locks.json'
      - 'automation/provider-repair-skip.json'
      - 'scripts/provider_live_baseline.py'
      - 'scripts/validate_provider_live_baseline.py'
      - 'tests/provider_live_baseline_policy_test.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Security policy preflight
        run: python3 tests/workflow_security_policy_test.py
      - name: Validate live baseline implementation
        run: |
          python3 -m py_compile scripts/provider_live_baseline.py scripts/validate_provider_live_baseline.py
          python3 tests/provider_live_baseline_policy_test.py
          python3 scripts/validate_provider_live_baseline.py
      - name: Validate repair skip is current full-capability only
        run: |
          python3 - <<'PY'
          import json, subprocess
          skip=json.load(open('automation/provider-repair-skip.json', encoding='utf-8'))
          ids={str(v).casefold() for v in (skip.get('providers') or {})}
          assert ids == {'castle','persianstremio'}, ids
          out=subprocess.check_output(['python3','scripts/provider_parallel_sweep_plan_v1.py','--limit','96','--batch-size','12'], text=True)
          plan=json.loads(out)
          assert plan['catalogueCount'] == 96
          assert plan['greenSkippedCount'] == 2, plan['greenSkippedCount']
          print('FIELD_LIVE_BASELINE_WORKBENCH green_skipped=2 stale_provider_wide_skip=false')
          PY
