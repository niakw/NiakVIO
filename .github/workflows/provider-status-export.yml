name: Export provider status snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Niakvio provider pipeline']
    types: [completed]

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1

      - name: Build canonical provider status snapshot
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          out = root / 'provider-status-export'
          out.mkdir(exist_ok=True)

          def load(path, default):
              p = root / path
              if not p.exists():
                  return default
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  return default

          catalog = load('provider_catalog.json', {'providers': []})
          provenance = load('PROVENANCE.json', {}).get('providers', {})
          diagnostics = load('diagnostics-report.json', {})
          repair = load('repair-report.json', {})
          lkg = load('provider-lkg.json', {}).get('providers', {})

          diag_by_id = defaultdict(list)
          for row in diagnostics.get('providers', []) if isinstance(diagnostics, dict) else []:
              if not isinstance(row, dict):
                  continue
              pid = str(row.get('id') or row.get('canonical_id') or '').strip().casefold()
              if pid:
                  diag_by_id[pid].append(row)

          sibling_resolved = {str(x).casefold() for x in repair.get('sibling_resolved_provider_ids', [])}
          rows = []
          for item in catalog.get('providers', []):
              if not isinstance(item, dict):
                  continue
              pid = str(item.get('canonicalId') or '').strip().casefold()
              scraper = item.get('scraper') if isinstance(item.get('scraper'), dict) else {}
              variants = diag_by_id.get(pid, [])
              statuses = sorted({str(x.get('status') or '') for x in variants if x.get('status')})
              streams_playable = max((int(x.get('streams_playable') or 0) for x in variants), default=0)
              streams_returned = max((int(x.get('streams_returned') or 0) for x in variants), default=0)
              failures = sorted({str(v) for x in variants for v in (x.get('failure_classes') or []) if v})
              prov = provenance.get(pid, {}) if isinstance(provenance, dict) else {}
              lkg_row = lkg.get(pid, {}) if isinstance(lkg, dict) else {}
              rows.append({
                  'provider_id': pid,
                  'name': scraper.get('name') or '',
                  'enabled': bool(scraper.get('enabled')),
                  'general': bool((item.get('projections') or {}).get('general')),
                  'vf': bool((item.get('projections') or {}).get('vf')),
                  'version': scraper.get('version') or '',
                  'supported_types': ','.join(scraper.get('supportedTypes') or []),
                  'languages': ','.join(scraper.get('contentLanguage') or []),
                  'filename': scraper.get('filename') or '',
                  'diagnostic_statuses': ','.join(statuses),
                  'streams_returned': streams_returned,
                  'streams_playable': streams_playable,
                  'failure_classes': ','.join(failures),
                  'healthy_sibling_resolved': pid in sibling_resolved,
                  'provenance_source': prov.get('source') or prov.get('selected_source') or '',
                  'provenance_sha256': prov.get('sha256') or '',
                  'lkg_sha256': lkg_row.get('sha256') or '',
              })

          payload = {
              'schemaVersion': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'catalogSchemaVersion': catalog.get('schemaVersion'),
              'providerCount': len(rows),
              'vfProviderCount': sum(1 for row in rows if row['vf']),
              'enabledCount': sum(1 for row in rows if row['enabled']),
              'providers': rows,
          }
          (out / 'providers.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with (out / 'providers.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]) if rows else ['provider_id'])
              writer.writeheader()
              writer.writerows(rows)
          print(json.dumps({k: payload[k] for k in ('providerCount', 'vfProviderCount', 'enabledCount')}, indent=2))
          PY

      - name: Upload provider status snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-status-${{ github.run_id }}
          path: provider-status-export/
          retention-days: 14
          if-no-files-found: error
