name: Temporary refresh release hashes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/tmp-refresh-release-hashes"

permissions:
  contents: write

concurrency:
  group: tmp-refresh-release-hashes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Regenerate and validate release hashes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/generate_release_hashes.py
          python3 scripts/validate_release_integrity.py
      - name: Commit refreshed inventories
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.json FILE-HASHES.json PATCH-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "release hashes already current"
            exit 0
          fi
          git commit -m "chore: refresh release integrity hashes"
          git push origin HEAD:main
