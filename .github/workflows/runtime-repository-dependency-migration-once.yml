name: Restore curated provider hub baseline once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-repository-dependency-migration-once.yml'

permissions:
  contents: write

concurrency:
  group: restore-curated-provider-hub-baseline-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore actionable curated rows and freeze inventory baseline
        shell: bash
        env:
          CURATED_BASELINE_COMMIT: 892e41f3c017f77b0dae60aa16c285cfb56595fb
        run: |
          set -euo pipefail
          git show "${CURATED_BASELINE_COMMIT}:provider-hubs.json" > "$RUNNER_TEMP/provider-hubs-curated-source.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          root = Path('.')
          source_path = Path(os.environ['RUNNER_TEMP']) / 'provider-hubs-curated-source.json'
          source_bytes = source_path.read_bytes()
          legacy = json.loads(source_bytes)
          path = root / 'provider-hubs.json'
          current = json.loads(path.read_text(encoding='utf-8'))
          providers = current.setdefault('providers', {})
          if not isinstance(providers, dict):
              raise SystemExit('provider-hubs.json providers must be an object')

          baseline_commit = os.environ['CURATED_BASELINE_COMMIT']
          retired = {
              'dahmermovies': 'intentionally removed from the curated hub registry',
              'dahmermovies-tv': 'intentionally removed from the curated hub registry',
          }
          legacy_rows = legacy.get('providers') or {}
          if not isinstance(legacy_rows, dict):
              raise SystemExit('curated baseline providers must be an object')

          def first_url(value):
              if not isinstance(value, str):
                  return None
              match = re.search(r'https?://[^\s,;]+', value.strip(), re.I)
              if not match:
                  return None
              return match.group(0).rstrip(').,;')

          def hostname(url):
              try:
                  return (urllib.parse.urlparse(url).hostname or '').lower().strip('.')
              except Exception:
                  return ''

          def search_query(value):
              if not isinstance(value, str):
                  return None
              text = value.strip()
              if not text or first_url(text):
                  return None
              match = re.search(r'(?:terme suivant[^:]*:|recherche[^:]*:)\s*(.+)$', text, re.I)
              return (match.group(1) if match else text).strip().strip('"') or None

          def actionable(row):
              if not isinstance(row, dict):
                  return False
              return bool(first_url(row.get('hub')) or first_url(row.get('direct')) or search_query(row.get('hub')))

          def normalize(provider_id, row):
              target = {
                  'id': provider_id,
                  'name': row.get('name') or provider_id,
                  'manifest_status': row.get('manifest_status') or 'Actif',
                  'category': row.get('category'),
                  'source': 'curated_user_registry',
                  'schema_notes': 'Address sources are evaluated in trust order and every terminal route is runtime-validated before persistence.',
                  'aliases': list(dict.fromkeys([*(row.get('aliases') or []), provider_id])),
                  'search_confirmation_runs': 2,
              }
              hub_raw = row.get('hub')
              hub_url = first_url(hub_raw)
              direct_url = first_url(row.get('direct'))
              query = search_query(hub_raw)
              sources = []
              if hub_url:
                  target['hub'] = hub_url
                  hub_host = hostname(hub_url)
                  source_type = 'telegram_public' if hub_host in {'t.me', 'telegram.me'} else 'hub'
                  sources.append({
                      'type': source_type,
                      'url': hub_url,
                      'priority': 110 if source_type == 'telegram_public' else 100,
                      'purpose': 'Curated authoritative address source',
                  })
              else:
                  target['hub'] = None
              if direct_url:
                  target['direct'] = direct_url
                  target['direct_candidates'] = [direct_url]
                  direct_host = hostname(direct_url)
                  if direct_host:
                      target['allowed_terminal_hosts'] = [direct_host]
              if query:
                  target['search_queries'] = [query]
                  sources.append({
                      'type': 'search',
                      'query': query,
                      'priority': 35,
                      'purpose': 'Fallback discovery when curated sources fail',
                  })
              if sources:
                  target['sources'] = sources
              if row.get('resolver'):
                  target['resolver'] = row['resolver']
              return target

          required = sorted(
              provider_id for provider_id, row in legacy_rows.items()
              if provider_id not in retired and actionable(row)
          )
          metadata_only = sorted(
              provider_id for provider_id, row in legacy_rows.items()
              if provider_id not in retired and not actionable(row)
          )
          supplemental = sorted(
              provider_id for provider_id, row in legacy_rows.items()
              if provider_id not in retired and isinstance(row, dict) and row.get('source') == 'user_chat'
          )
          missing_before = sorted(set(required) - set(providers))
          restored = []
          for provider_id in missing_before:
              row = legacy_rows[provider_id]
              providers[provider_id] = normalize(provider_id, row)
              restored.append(provider_id)

          for provider_id in retired:
              providers.pop(provider_id, None)

          current['schema_version'] = max(int(current.get('schema_version') or 0), 3)
          current['curated_baseline_commit'] = baseline_commit
          current['curated_baseline_policy'] = 'Actionable user-curated provider IDs are append-only unless explicitly retired with a reason.'
          path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          baseline = {
              'schema_version': 1,
              'description': 'Non-regression inventory derived from the original workbook plus chat-supplied hub registry. A schema migration may enrich rows but may not silently drop actionable curated providers.',
              'source_commit': baseline_commit,
              'source_sha256': hashlib.sha256(source_bytes).hexdigest(),
              'required_registry_ids': required,
              'metadata_only_ids': metadata_only,
              'supplemental_user_chat_ids': supplemental,
              'explicitly_retired': retired,
          }
          baseline_path = root / 'automation' / 'provider-hub-curated-baseline.json'
          baseline_path.parent.mkdir(parents=True, exist_ok=True)
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tests' / 'provider_hub_curated_baseline_test.py'
          test_path.write_text('''import json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nbaseline = json.loads((ROOT / "automation" / "provider-hub-curated-baseline.json").read_text(encoding="utf-8"))\nregistry = json.loads((ROOT / "provider-hubs.json").read_text(encoding="utf-8"))\nproviders = registry.get("providers") or {}\nrequired = set(baseline.get("required_registry_ids") or [])\nretired = set((baseline.get("explicitly_retired") or {}).keys())\nsupplemental = set(baseline.get("supplemental_user_chat_ids") or [])\nmissing = sorted(required - set(providers))\nassert not missing, f"curated provider hub inventory regression: missing={missing}"\nassert not (retired & set(providers)), f"explicitly retired provider hubs restored unexpectedly: {sorted(retired & set(providers))}"\nassert supplemental <= set(providers), f"chat-supplied hub rows lost: {sorted(supplemental - set(providers))}"\nassert registry.get("curated_baseline_commit") == baseline.get("source_commit")\nfor provider_id in sorted(required):\n    row = providers[provider_id]\n    assert isinstance(row, dict), provider_id\n    assert row.get("sources") or row.get("direct_candidates") or row.get("search_queries"), provider_id\nprint(f"provider hub curated baseline passed required={len(required)} supplemental={len(supplemental)} retired={len(retired)}")\n''', encoding='utf-8')

          missing_after = sorted(set(required) - set(providers))
          if missing_after:
              raise SystemExit(f'curated registry restoration incomplete: {missing_after}')
          print('FIELD_PROVIDER_HUB_BASELINE', json.dumps({
              'required': len(required),
              'metadata_only': len(metadata_only),
              'supplemental': supplemental,
              'missing_before': missing_before,
              'restored': restored,
              'retired': sorted(retired),
          }, sort_keys=True))
          PY

      - name: Prove restored registry and non-regression contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool provider-hubs.json >/dev/null
          python -m json.tool automation/provider-hub-curated-baseline.json >/dev/null
          python tests/provider_hub_curated_baseline_test.py
          python tests/provider_hub_registry_test.py
          python - <<'PY'
          import json
          registry = json.load(open('provider-hubs.json', encoding='utf-8'))['providers']
          for provider in ('nakios', 'purstream', 'toflix', 'coflix', 'flemmix'):
              if provider not in registry:
                  raise SystemExit(f'missing restored user-curated provider: {provider}')
          assert registry['purstream']['hub'].rstrip('/') == 'https://purstream.wiki'
          assert registry['purstream'].get('resolver') == 'same_brand'
          print('FIELD_PROVIDER_HUB_USER_CHAT_RESTORE state=passed providers=nakios,purstream,toflix,coflix,flemmix')
          PY

      - name: Remove one-shot and publish restoration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-repository-dependency-migration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-hubs.json automation/provider-hub-curated-baseline.json tests/provider_hub_curated_baseline_test.py .github/workflows/runtime-repository-dependency-migration-once.yml
          git commit -m 'fix: preserve curated provider hub inventory'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
