name: Runtime repository dependency migration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-repository-dependency-migration-once.yml'

permissions:
  contents: write

concurrency:
  group: runtime-repository-dependency-migration-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Preflight active provider repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          known = {
              'purstream': {'https://raw.githubusercontent.com/wooodyhood/nuvio-repo/main/domains.json'},
              'cineby': {'https://raw.githubusercontent.com/sapariyaneel/nuvio-plugin/refs/heads/main/domains.json'},
          }
          url_re = re.compile(r'https?://(?:raw\.githubusercontent\.com|github\.com|api\.github\.com|gist\.github\.com|gist\.githubusercontent\.com)[^"\'`\s)]+', re.I)
          observed = {}
          unknown = []
          for row in manifest.get('scrapers') or []:
              if not isinstance(row, dict):
                  continue
              provider = str(row.get('id') or '').strip().casefold()
              relative = str(row.get('filename') or '')
              if not relative.startswith('providers/'):
                  continue
              text = (root / relative).read_text(encoding='utf-8', errors='strict')
              urls = sorted(set(url_re.findall(text)))
              if not urls:
                  continue
              observed[provider] = urls
              allowed = known.get(provider, set())
              for url in urls:
                  if url not in allowed:
                      unknown.append((provider, relative, url))
          print('FIELD_RUNTIME_REPOSITORY_DEPENDENCY_PREFLIGHT', json.dumps(observed, sort_keys=True))
          if unknown:
              raise SystemExit('unknown runtime repository dependencies: ' + repr(unknown))
          PY

      - name: Materialize repository-free override policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('provider-overrides.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          patches = data.setdefault('provider_patches', {})
          migrations = {
              'purstream': 'https://raw.githubusercontent.com/wooodyhood/nuvio-repo/main/domains.json',
              'cineby': 'https://raw.githubusercontent.com/sapariyaneel/nuvio-plugin/refs/heads/main/domains.json',
          }
          for provider, url in migrations.items():
              row = patches.setdefault(provider, {})
              replacements = row.setdefault('replacements', {})
              replacements[url] = ''
              notes = row.setdefault('notes', [])
              note = 'Runtime repository discovery is forbidden: use provider/Core terminal fallback and keep source repositories maintenance-only.'
              if note not in notes:
                  notes.append(note)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Strengthen repository hygiene contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/repository_hygiene_contract_test.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'assert "getStreamsContracts" not in validator\n'
          block = '''assert "repository_scan=true" in validator\nassert "repository runtime repository dependency forbidden" not in validator\nassert "provider runtime repository dependency forbidden" in validator\nassert "raw\\.githubusercontent\\.com" in validator\nassert "api\\.github\\.com" in validator\n'''
          if 'assert "repository_scan=true" in validator' not in text:
              if anchor not in text:
                  raise SystemExit('repository hygiene validator anchor missing')
              text = text.replace(anchor, anchor + block, 1)
          text = text.replace(
              'syntax-only provider validation, no retired one-shots',
              'syntax-only + repository-free provider validation, no retired one-shots',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove validator policy
        shell: bash
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/provider-clean.js"
          bad="$RUNNER_TEMP/provider-bad.js"
          printf '%s\n' 'module.exports={getStreams:async()=>[]};' > "$clean"
          printf '%s\n' 'const u="https://raw.githubusercontent.com/example/repo/main/domains.json";module.exports={getStreams:async()=>[]};' > "$bad"
          node scripts/validate_provider_artifact.cjs "$clean"
          if node scripts/validate_provider_artifact.cjs "$bad" >"$RUNNER_TEMP/bad.out" 2>&1; then
            echo 'repository dependency validator accepted forbidden URL' >&2
            exit 1
          fi
          grep -F 'provider runtime repository dependency forbidden' "$RUNNER_TEMP/bad.out"
          python tests/repository_hygiene_contract_test.py

      - name: Remove migration workflow and publish policy
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-repository-dependency-migration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-overrides.json tests/repository_hygiene_contract_test.py .github/workflows/runtime-repository-dependency-migration-once.yml
          git commit -m 'fix: remove runtime repository discovery from providers'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
