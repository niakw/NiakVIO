name: TEMP parallel native Labs dispatch
on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch missing TV Lab
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: fix/labs-5.21.44-20260912
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run native-corpus-device-targeted.yml --repo "$REPO" --ref "$REF" -f device=tv
          echo "FIELD_PARALLEL_NATIVE_LABS_DISPATCHED ref=$REF tv=1 reason=repair_invalid_legacy_input"
