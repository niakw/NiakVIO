name: TEMP - Fix Rotating Native Consumers and Retry Desktop

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]

permissions:
  actions: write
  contents: write

jobs:
  patch-test-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REF: fix/labs-5.21.44-20260912
      NIAKVIO_PROVIDER_SCOPE_MATRIX: automation/evidence/hub-lab-matrix-46.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply rotating native fixture consumer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/temp_fix_rotating_fixture_consumers.py
          python3 scripts/temp_fix_rotating_fixture_consumers.py
      - name: Validate rotating native consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rotating_corpus.py scripts/prepare_native_reader_acceptance.py scripts/augment_native_corpus_request_contract.py
          python3 tests/native_rotating_fixture_consumers_test.py
          python3 tests/native_hub46_scope_contract_test.py
          python3 tests/rotating_corpus_test.py
          python3 tests/native_provider_resample_status_test.py
          python3 tests/workflow_security_policy_test.py
          node tests/streamflix_timerless_runtime_test.cjs
      - name: Commit consumer fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_native_reader_acceptance.py scripts/augment_native_corpus_request_contract.py
          git diff --cached --check
          git commit -m "fix(labs): resolve rotating fixtures in all native consumers"
          git push origin HEAD:"$REF"
      - name: Dispatch fresh Desktop Hub-46 Lab
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run native-desktop-reader-acceptance.yml --repo "$REPO" --ref "$REF"
          echo "FIELD_DESKTOP_HUB46_RETRY_DISPATCHED providers=46 rotating=true ref=$REF"