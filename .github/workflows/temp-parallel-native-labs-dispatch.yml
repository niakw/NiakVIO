name: TEMP - Checkpoint Hub46 Repair Memory

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 2
      - name: Write authoritative Hub-46 checkpoint
        run: python3 scripts/append_hub46_memory_checkpoint.py
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEMORY.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "FIELD_MEMORY_CHECKPOINT status=already-present"
            exit 0
          fi
          git commit -m "docs(memory): checkpoint Hub-46 repair campaign"
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
          echo "FIELD_MEMORY_CHECKPOINT status=committed sha=$(git rev-parse HEAD)"
