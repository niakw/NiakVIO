name: TEMP - Dispatch Unified Fixed Hub46 Native Labs

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]

permissions:
  actions: write
  contents: read

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REF: fix/labs-5.21.44-20260912
      NIAKVIO_PROVIDER_SCOPE_MATRIX: automation/evidence/hub-lab-matrix-46.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate unified rotating Hub-46 head
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/workflow_security_policy_test.py
          python3 tests/native_rotating_fixture_consumers_test.py
          python3 tests/native_hub46_scope_contract_test.py
          python3 tests/rotating_corpus_test.py
          python3 tests/native_provider_resample_status_test.py
          python3 tests/provider_upstream_parity_v3_test.py
          node tests/streamflix_timerless_runtime_test.cjs
          bash -n scripts/run_native_corpus_desktop_suite.sh
          bash -n scripts/run_native_corpus_mobile_suite.sh
          bash -n scripts/run_native_corpus_tv_suite.sh
      - name: Dispatch all exact Hub-46 native acceptance workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          echo "FIELD_UNIFIED_HUB46_HEAD sha=$HEAD providers=46"
          for wf in native-desktop-reader-acceptance.yml native-mobile-android-reader.yml native-mobile-ios-reader.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$HEAD"
          done
          echo "FIELD_UNIFIED_HUB46_NATIVE_LABS_DISPATCHED workflows=3 platforms=5 providers=46 sha=$HEAD"