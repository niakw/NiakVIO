name: TEMP - Hub46 native scope integration

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REF: fix/labs-5.21.44-20260912
      NIAKVIO_PROVIDER_SCOPE_MATRIX: automation/evidence/hub-lab-matrix-46.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply exact Hub-46 execution scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/temp_apply_hub46_native_scope.py
          python3 scripts/temp_apply_hub46_native_scope.py
      - name: Run focused scope and rotation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_native_corpus_client.py scripts/gate_native_declared_provider_matrix.py scripts/prepare_native_ios_reader_acceptance.py
          python3 tests/native_hub46_scope_contract_test.py
          python3 tests/rotating_corpus_test.py
          python3 tests/native_provider_resample_status_test.py
          python3 tests/provider_rotating_repair_contract_test.py
          python3 tests/provider_v3_final_transient_fixture_fallback_test.py
          node tests/streamflix_timerless_runtime_test.cjs
      - name: Commit exact Hub-46 execution scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_native_corpus_client.py scripts/gate_native_declared_provider_matrix.py scripts/prepare_native_ios_reader_acceptance.py
          git diff --cached --check
          git commit -m "fix(labs): enforce exact Hub-46 execution scope"
          git push origin HEAD:"$REF"