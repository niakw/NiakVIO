name: TEMP - Manual Native Labs Dispatch

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch five native platforms on repair ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: fix/labs-5.21.44-20260912
        shell: bash
        run: |
          set -euo pipefail
          for wf in \
            native-desktop-reader-acceptance.yml \
            native-mobile-android-reader.yml \
            native-mobile-ios-reader.yml
          do
            echo "Dispatching $wf on $REF"
            gh workflow run "$wf" --repo "$REPO" --ref "$REF"
          done
          echo "FIELD_PARALLEL_NATIVE_LABS_DISPATCHED workflows=3 platforms=5 providers=46"
