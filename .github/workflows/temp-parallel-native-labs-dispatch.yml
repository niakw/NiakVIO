name: TEMP - Retry Hub46 Parity After Cleanup

on:
  push:
    branches: ["fix/labs-5.21.44-20260912"]
    paths: [".github/workflows/temp-parallel-native-labs-dispatch.yml"]

permissions:
  actions: write
  contents: read

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REF: fix/labs-5.21.44-20260912
      NIAKVIO_PROVIDER_SCOPE_MATRIX: automation/evidence/hub-lab-matrix-46.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate security and rotating Hub-46 parity contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/workflow_security_policy_test.py
          python3 -m py_compile scripts/run_provider_upstream_parity_v2.py scripts/run_provider_upstream_parity_v3.py scripts/rotating_corpus.py
          python3 tests/provider_upstream_parity_v3_test.py
          python3 tests/rotating_corpus_test.py
          python3 tests/native_provider_resample_status_test.py
          node scripts/provider_worker.cjs --self-test-response-wrapper
          node scripts/provider_worker.cjs --self-test-fixture-fallback
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML_OK #{ARGV[0]}"' .github/workflows/provider-upstream-parity.yml
      - name: Dispatch exact Hub-46 rotating upstream parity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run provider-upstream-parity.yml --repo "$REPO" --ref "$REF"
          echo "FIELD_HUB46_ROTATING_PARITY_DISPATCHED providers=46 samples_per_lane=3 ref=$REF"