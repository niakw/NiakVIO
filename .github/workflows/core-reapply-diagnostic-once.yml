name: Core reapply fixed-point diagnostic once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-reapply-diagnostic-once.yml"
      - "scripts/diagnose_reapply_fixed_point_once.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-reapply-diagnostic-once
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Trace exact second-pass fixed-point checker
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnose_reapply_fixed_point_once.py
