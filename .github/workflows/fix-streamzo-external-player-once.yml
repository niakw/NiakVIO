name: Fix StreamZo external-player metadata once

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/fix-streamzo-external-player"

permissions:
  contents: write

concurrency:
  group: fix-streamzo-external-player-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repair StreamZo metadata source of truth
        shell: bash
        run: |
          cp manifest.json /tmp/manifest-before-streamzo-fix.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          overrides_path = root / 'provider-overrides.json'
          overrides = json.loads(overrides_path.read_text(encoding='utf-8'))
          streamzo = overrides['provider_patches']['streamzo']
          manifest_overrides = streamzo.setdefault('manifest_overrides', {})
          manifest_overrides.pop('supportsExternalPlayer', None)
          overrides_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          promoter_path = root / 'scripts' / 'promote_candidates.py'
          promoter = promoter_path.read_text(encoding='utf-8')
          anchor = '    entry["filename"] = destination.relative_to(ROOT).as_posix()\n    entry["enabled"] = bool(enabled)\n'
          replacement = '''    entry["filename"] = destination.relative_to(ROOT).as_posix()\n    # StreamZo needs an external player for ordinary embed/recovery bundles.\n    # Only the globally audited direct-media bundle can safely advertise native playback.\n    if canonical == "streamzo":\n        entry["supportsExternalPlayer"] = "--nuvio-tv-global--" not in entry["filename"]\n    entry["enabled"] = bool(enabled)\n'''
          if replacement not in promoter:
              if anchor not in promoter:
                  raise SystemExit('promote_candidates.py anchor not found')
              promoter = promoter.replace(anchor, replacement, 1)
              promoter_path.write_text(promoter, encoding='utf-8')

          for manifest_path in (root / 'manifest.json', root / 'vf' / 'manifest.json'):
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              found = False
              for row in data.get('scrapers', []):
                  if str(row.get('id') or '').casefold() == 'streamzo':
                      filename = str(row.get('filename') or '')
                      row['supportsExternalPlayer'] = '--nuvio-tv-global--' not in filename
                      found = True
              if not found:
                  raise SystemExit(f'StreamZo missing from {manifest_path}')
              manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate targeted StreamZo contract
        run: |
          python tests/vf_movie_policy_test.py
          python tests/streamzo_target_media_profile_test.py

      - name: Remove one-shot workflow before release inventory
        shell: bash
        run: |
          git rm .github/workflows/fix-streamzo-external-player-once.yml \
            .github/triggers/fix-streamzo-external-player

      - name: Bump release and synchronize projections
        shell: bash
        run: |
          python scripts/bump_release_patch_if_manifest_changed.py --previous /tmp/manifest-before-streamzo-fix.json --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py

      - name: Run complete regression suite
        run: npm test

      - name: Regenerate release integrity inventories
        run: |
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider-overrides.json scripts/promote_candidates.py manifest.json vf/manifest.json \
            package.json package-lock.json FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json
          git commit -m "fix: preserve StreamZo external player contract"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify exact published main after push
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python scripts/validate_activation_preservation.py
          python scripts/validate_language_projection.py
          python scripts/validate_release_integrity.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          package = load('package.json')
          lock = load('package-lock.json')
          manifest = load('manifest.json')
          vf = load('vf/manifest.json')
          versions = {
              package.get('version'), lock.get('version'),
              (lock.get('packages') or {}).get('', {}).get('version'),
              manifest.get('version'), vf.get('version'),
          }
          if len(versions) != 1:
              raise SystemExit(f'version mismatch: {versions}')
          rows = {str(r.get('id') or '').casefold(): r for r in manifest.get('scrapers', [])}
          row = rows['streamzo']
          expected = '--nuvio-tv-global--' not in str(row.get('filename') or '')
          if row.get('supportsExternalPlayer') is not expected:
              raise SystemExit(f'StreamZo external-player mismatch: {row}')
          print(f'published StreamZo external-player contract passed; release={versions.pop()}')
          PY
          git diff --exit-code
