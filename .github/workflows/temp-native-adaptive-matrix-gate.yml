name: TEMP - adaptive native matrix gate

# Retry after matrix test was migrated from old 96/static fixtures to scoped 46/adaptive recent fixtures.
on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-native-adaptive-matrix-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labs-5.21.44-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate adaptive matrix gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_native_matrix_adaptive_fixture_v1.py
          python3 -m py_compile scripts/gate_native_declared_provider_matrix.py
          python3 tests/native_adaptive_catalog_contract_test.py
          python3 tests/recent_global_lab_corpus_policy_test.py
          python3 tests/native_declared_provider_matrix_test.py
      - name: Record MEMORY checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MEMORY.md'); t=p.read_text(encoding='utf-8')
          marker='## 2026-09-13 — adaptive matrix gate follows global corpus lanes'
          if marker not in t:
              t += '''\n## 2026-09-13 — adaptive matrix gate follows global corpus lanes\n\n- The native declared-provider matrix no longer requires three static representative fixture slugs. Any adaptive fallback fixture is resolved through `rotating_corpus.fixture_by_slug()` + `canonical_lane()` to `movie|tv|anime`; the old `fixture_by_type` map is compatibility-only for historical targeted evidence.\n- This prevents fallback titles from being misclassified/unobserved and prevents old fixed samples such as Breaking Bad 2008 from becoming an ordinary Lab prerequisite.\n- The synthetic matrix contract itself now uses the exact Hub-46 scope and recent global fixture pools, matching final acceptance instead of asserting stale 96/static-fixture output.\n'''
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/gate_native_declared_provider_matrix.py MEMORY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(labs): resolve adaptive fixtures by global lane in matrix gate'
          git fetch origin fix/labs-5.21.44-20260912
          git rebase origin/fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
