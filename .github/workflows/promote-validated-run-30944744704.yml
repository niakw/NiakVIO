name: Promote validated run 30944744704

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/promote-validated-run-30944744704"

permissions:
  actions: read
  contents: write

concurrency:
  group: nuvio-provider-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current published repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download immutable validated staging artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuvio-validation-stage-30944744704
          path: checked-artifact
          repository: niakw/Niakvio
          run-id: 30944744704
          github-token: ${{ github.token }}

      - name: Verify validated artifact identity
        run: |
          test -f checked-artifact/staging/candidates.json
          test -f checked-artifact/health-output/health-results.json
          test -f checked-artifact/health-output/repair-report.json
          python scripts/validate_deep_health_integrity.py \
            --health checked-artifact/health-output/health-results.json \
            --repairs checked-artifact/health-output/repair-report.json

      - name: Restore validated domain state
        run: |
          test -f checked-artifact/provider-overrides.json
          test -f checked-artifact/provider-domain-history.json
          cp checked-artifact/provider-overrides.json provider-overrides.json
          cp checked-artifact/provider-domain-history.json provider-domain-history.json
          python scripts/reapply_published_overrides.py

      - name: Apply strict promotion gates
        env:
          NUVIO_STAGE: checked-artifact/staging
          NUVIO_HEALTH_RESULTS: checked-artifact/health-output/health-results.json
        run: python scripts/promote_candidates.py

      - name: Finalize validated snapshots and bundles
        run: |
          python scripts/finalize_upstream_lkg.py \
            --pending checked-artifact/staging/upstream-lkg-pending.json \
            --keep-generations 2
          python scripts/prune_unreferenced_providers.py
          python scripts/validate_published_overrides.py

      - name: Commit and publish validated provider files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp checked-artifact/health-output/dns-preflight-report.json dns-preflight-report.json
          cp checked-artifact/health-output/provider-hub-report.json provider-hub-report.json
          cp checked-artifact/health-output/diagnostics-report.json diagnostics-report.json
          cp checked-artifact/health-output/diagnostics-report.html diagnostics-report.html
          cp checked-artifact/health-output/route-regressions.json route-regressions.json
          cp checked-artifact/health-output/repair-report.json repair-report.json

          test -f manifest.next.json
          cp manifest.next.json "$RUNNER_TEMP/manifest.next.json"

          git add health-report.json health-history.json PROVENANCE.json \
            dns-preflight-report.json provider-hub-report.json \
            diagnostics-report.json diagnostics-report.html route-regressions.json \
            repair-report.json provider-overrides.json provider-domain-history.json \
            upstream-lkg.json upstream-lkg/
          git add -A providers

          if ! git diff --cached --quiet; then
            git commit -m "chore: stage validated provider versions"
            git reset --hard HEAD
            git clean -fdx
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          cp "$RUNNER_TEMP/manifest.next.json" manifest.next.json

      - name: Commit and publish validated manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.next.json
          PREVIOUS_MANIFEST="$(mktemp)"
          git show HEAD:manifest.json > "$PREVIOUS_MANIFEST"
          mv manifest.next.json manifest.json
          python scripts/bump_release_patch_if_manifest_changed.py \
            --previous "$PREVIOUS_MANIFEST" --manifest manifest.json
          python scripts/generate_language_manifests.py
          python scripts/prune_unreferenced_providers.py
          python scripts/sync_release_versions.py --manifest manifest.json
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py
          git add manifest.json vf/manifest.json package.json sources.json \
            FILE-HASHES.json PATCH-SHA256SUMS.txt SHA256SUMS.json

          if git diff --cached --quiet; then
            echo "Validated manifest is unchanged."
            exit 0
          fi

          git commit -m "chore: publish Nuvio provider manifest"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
