name: TEMP - Hub46 transport v2

on:
  push:
    branches:
      - fix/labs-5.21.44-20260912
    paths:
      - .github/workflows/temp-hub46-transport-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/labs-5.21.44-20260912
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply terminal manifest transport migration
        run: |
          set -euo pipefail
          python scripts/upgrade_native_hub46_transport_v2.py
          python scripts/build_hub46_native_manifest.py \
            --provider-sha b18342a12b88af1825de8765ecb8011ceb5b78aa \
            --repository niakw/NiakVIO
      - name: Validate native transport and documentation contracts
        run: |
          set -euo pipefail
          python tests/native_hub46_transport_manifest_test.py
          python tests/native_provider_loading_compat_test.py
          python tests/native_reader_runtime_bootstrap_test.py
          python tests/provider_v3_documentation_contract_test.py
          python tests/domain_refresh_workflow_test.py
          python tests/domain_refresh_transaction_guard_test.py
          python tests/provider_v3_workflow_ownership_test.py
      - name: Commit non-workflow Hub-46 transport bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # GitHub Actions tokens cannot update workflow files without the workflows
          # permission. Those three reviewed edits are applied through the repository
          # API after this run. Restore them here so this commit contains only normal
          # repository files and can be pushed with contents:write.
          git restore \
            .github/workflows/native-desktop-reader-acceptance.yml \
            .github/workflows/native-mobile-android-reader.yml \
            .github/workflows/native-mobile-ios-reader.yml
          git add \
            scripts/resolve_native_repository.sh \
            scripts/run_native_corpus_desktop_suite.sh \
            scripts/run_native_corpus_mobile_suite.sh \
            scripts/run_native_corpus_tv_suite.sh \
            native-hub46/manifest.json
          git commit -m 'fix(labs): use immutable terminal Hub-46 manifest transport'
          git pull --rebase origin fix/labs-5.21.44-20260912
          git push origin HEAD:fix/labs-5.21.44-20260912
          echo 'FIELD_NATIVE_HUB46_TRANSPORT_COMMIT committed=true workflow_edits_pending_api=true provider_sha=b18342a12b88af1825de8765ecb8011ceb5b78aa'
