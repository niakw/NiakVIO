<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NiakVIO mark</title>
  <desc id="desc">Neon N and V monogram with an integrated play symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162d"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e7ff"/>
      <stop offset=".48" stop-color="#087cff"/>
      <stop offset="1" stop-color="#6328ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168dff"/>
      <stop offset=".55" stop-color="#7340ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31f6ff"/>
      <stop offset="1" stop-color="#e934ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bg)" stroke="#162b55" stroke-width="3"/>
  <ellipse cx="258" cy="259" rx="190" ry="112" fill="none" stroke="url(#violet)" stroke-width="13" opacity=".9" transform="rotate(-13 258 259)" filter="url(#glow)"/>
  <path d="M112 356V152c0-18 13-31 31-31h39l145 190V121h66v233c0 22-14 37-34 37h-35L178 201v155z" fill="url(#cyan)" filter="url(#glow)"/>
  <path d="M288 128h74l-93 231-43-57z" fill="url(#violet)" opacity=".96"/>
  <path d="M225 205c0-18 20-29 35-19l82 54c14 10 14 31 0 41l-82 54c-15 10-35-1-35-19z" fill="#040916" stroke="#92f8ff" stroke-width="5"/>
  <path d="M251 225l62 36-62 36z" fill="url(#play)" filter="url(#glow)"/>
</svg>
