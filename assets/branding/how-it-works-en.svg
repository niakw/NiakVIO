<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="760" viewBox="0 0 1640 760" role="img" aria-labelledby="title desc">
  <title id="title">How NiakVIO works</title>
  <desc id="desc">Five-step NiakVIO pipeline from 96 Provider Objects through Provider v3, deterministic gates and five native Labs to a cache-safe release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#56d6c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1640" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="190" fill="#7c8cff" opacity="0.08"/>
  <circle cx="120" cy="710" r="220" fill="#56d6c9" opacity="0.06"/>

  <text x="820" y="92" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="750" fill="#f8fafc">How NiakVIO works</text>
  <text x="820" y="136" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#aeb9d4">One deterministic path from provider knowledge to published bytes</text>
  <rect x="590" y="159" width="460" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(70 250)">
      <rect width="280" height="250" rx="28" fill="#17213d" stroke="#304161" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#24345b"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#dce5ff">1</text>
      <text x="28" y="112" font-size="25" font-weight="700" fill="#f8fafc">96 Provider Objects</text>
      <text x="28" y="151" font-size="18" fill="#aeb9d4">Identity, capability, DATA,</text>
      <text x="28" y="178" font-size="18" fill="#aeb9d4">routes and provenance stay</text>
      <text x="28" y="205" font-size="18" fill="#aeb9d4">structured and reviewable.</text>
    </g>

    <g transform="translate(375 250)">
      <rect width="280" height="250" rx="28" fill="#17213d" stroke="#304161" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#24345b"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#dce5ff">2</text>
      <text x="28" y="112" font-size="25" font-weight="700" fill="#f8fafc">Provider v3 source</text>
      <text x="28" y="151" font-size="18" fill="#aeb9d4">ProviderBase + structured</text>
      <text x="28" y="178" font-size="18" fill="#aeb9d4">DATA + Provider/Core Lego.</text>
      <text x="28" y="205" font-size="18" fill="#aeb9d4">Published JS is never a seed.</text>
    </g>

    <g transform="translate(680 250)">
      <rect width="280" height="250" rx="28" fill="#17213d" stroke="#486084" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#334a70"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#e8eeff">3</text>
      <text x="28" y="112" font-size="25" font-weight="700" fill="#f8fafc">Deterministic gates</text>
      <text x="28" y="151" font-size="18" fill="#aeb9d4">Structure, identity, security,</text>
      <text x="28" y="178" font-size="18" fill="#aeb9d4">minimizer, reverse proof and</text>
      <text x="28" y="205" font-size="18" fill="#aeb9d4">runtime contracts fail closed.</text>
    </g>

    <g transform="translate(985 250)">
      <rect width="280" height="250" rx="28" fill="#17213d" stroke="#486084" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#334a70"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#e8eeff">4</text>
      <text x="28" y="112" font-size="25" font-weight="700" fill="#f8fafc">Five native Labs</text>
      <text x="28" y="151" font-size="18" fill="#aeb9d4">TV Android · Mobile Android</text>
      <text x="28" y="178" font-size="18" fill="#aeb9d4">Mobile iOS · macOS · Windows</text>
      <text x="28" y="205" font-size="18" fill="#aeb9d4">Each boundary stays independent.</text>
    </g>

    <g transform="translate(1290 250)">
      <rect width="280" height="250" rx="28" fill="#17213d" stroke="#3b756f" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#24544f"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#d9fff9">5</text>
      <text x="28" y="112" font-size="25" font-weight="700" fill="#f8fafc">Cache-safe release</text>
      <text x="28" y="151" font-size="18" fill="#aeb9d4">Exact accepted SHA, synchronized</text>
      <text x="28" y="178" font-size="18" fill="#aeb9d4">versions, projections, hashes</text>
      <text x="28" y="205" font-size="18" fill="#aeb9d4">and integrity metadata.</text>
    </g>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M350 375 H372"/><path d="M655 375 H677"/><path d="M960 375 H982"/><path d="M1265 375 H1287"/>
  </g>
  <g fill="#68cfc8">
    <path d="M372 375 l-12 -8 v16 z"/><path d="M677 375 l-12 -8 v16 z"/><path d="M982 375 l-12 -8 v16 z"/><path d="M1287 375 l-12 -8 v16 z"/>
  </g>

  <rect x="190" y="576" width="1260" height="98" rx="24" fill="#101a31" stroke="#2b3c5d"/>
  <text x="820" y="617" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650" fill="#dfe7fb">Broad catalogue, strict ownership, observable failures.</text>
  <text x="820" y="650" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#98a6c4">Zero streams, wrong media and upstream client failures remain distinct evidence — never fabricated success.</text>
</svg>
